# Copyright and licence of the files that carry no SPDX header of their own.
#
# Code carries its two SPDX lines at the top (guide, « En-têtes et licences »). What is listed
# here cannot carry a comment, or would gain nothing from one: documentation, the
# specification and its figures, the contract, forms and templates, images, and what a tool
# generates. The specification and the contract have their own licence, declared below.
# `make reuse` fails on a file covered neither by a header nor by this list.
version = 1

[[annotations]]
path = [
    "**/*.md",
    "docs/assets/**",
    ".github/**",
    ".gitignore",
    "**/.python-version",
    "**/uv.lock",
    "frontend/package.json",
    "frontend/tsconfig.json",
    "frontend/pnpm-lock.yaml",
    "frontend/.dockerignore",
    "frontend/.prettierrc.json",
    "frontend/messages/*.json",
    "frontend/components.json",
    "frontend/public/*.svg",
    "frontend/src/app/icon.svg",
    "frontend/src/navigation/functions.json",
    "frontend/src/api/generated/**",
    "backend/src/waterfall/api/contract/models.py",
    "fixtures/**",
    "tools/src/wftools/py.typed",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 waterfall-project"
SPDX-License-Identifier = "AGPL-3.0-only"

# The specification is published under CC BY-SA 4.0, with its sources (the Word document, the
# draw.io file and the Mermaid figures) and the Markdown projection generated from them, which
# is an adaptation of the document. The tools that build it stay under the AGPL. The name and
# the logo « Waterfall » are not covered by this licence.
[[annotations]]
path = [
    "docs/spec/stb-waterfall.docx",
    "docs/spec/waterfall.visuels.drawio",
    "docs/spec/figures/**",
    "docs/spec/waterfall-spec.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Projet Waterfall"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The interface contract is published under Apache-2.0, so that a client generated from it owes
# nothing to the AGPL. The tools that check it, and the client the front generates, stay under
# the AGPL.
[[annotations]]
path = "docs/api/**/*.yaml"
precedence = "override"
SPDX-FileCopyrightText = "2026 waterfall-project"
SPDX-License-Identifier = "Apache-2.0"

# The Contributor Covenant, adopted as it is written: its text keeps its own licence.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Contributor Covenant contributors <https://www.contributor-covenant.org>"
SPDX-License-Identifier = "CC-BY-4.0"
