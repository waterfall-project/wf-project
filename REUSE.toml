# Copyright and licence of the files that carry no SPDX header of their own.
#
# Code carries its two SPDX lines at the top (guide, « En-têtes et licences »). What is listed
# here cannot carry a comment, or would gain nothing from one: documentation, the
# specification and its figures, the contract, forms and templates, images, and what a tool
# generates. The specification and the contract have their own licence, declared below.
# `make reuse` fails on a file covered neither by a header nor by this list.
version = 1

[[annotations]]
path = [
    "**/*.md",
    "docs/assets/**",
    ".github/**",
    ".gitignore",
    ".claude/settings.json",
    "**/.python-version",
    "**/uv.lock",
    "frontend/package.json",
    "frontend/tsconfig.json",
    "frontend/pnpm-lock.yaml",
    "frontend/.dockerignore",
    "frontend/.prettierrc.json",
    "frontend/messages/*.json",
    "frontend/components.json",
    "frontend/public/*.svg",
    "deploy/keycloak/themes/waterfall/login/resources/img/*",
    "frontend/src/app/icon.svg",
    "frontend/src/navigation/functions.json",
    "frontend/src/api/generated/**",
    "backend/src/waterfall/api/contract/models.py",
    "fixtures/**",
    "docs/spec/exemples/*.xlsx",
    "tools/src/wftools/py.typed",
    "tools/tests/queue/*.log",
    "tools/e2e-durations.json",
    "tools/e2e-service-durations.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 waterfall-project"
SPDX-License-Identifier = "AGPL-3.0-only"

# The specification is published under CC BY-SA 4.0, with its sources (the Word document, the
# draw.io file and the Mermaid figures), the PDF rendered from the Word document, and the
# Markdown projection generated from them, which is an adaptation of the document. The tools
# that build it stay under the AGPL. The name and the logo « Waterfall » are not covered by
# this licence.
[[annotations]]
path = [
    "docs/spec/stb-waterfall.docx",
    "docs/spec/stb-waterfall.pdf",
    "docs/spec/waterfall.visuels.drawio",
    "docs/spec/figures/**",
    "docs/spec/waterfall-spec.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Projet Waterfall"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The interface contract is published under Apache-2.0, so that a client generated from it owes
# nothing to the AGPL. The tools that check it, and the client the front generates, stay under
# the AGPL.
[[annotations]]
path = "docs/api/**/*.yaml"
precedence = "override"
SPDX-FileCopyrightText = "2026 waterfall-project"
SPDX-License-Identifier = "Apache-2.0"

# The Contributor Covenant, adopted as it is written: its text keeps its own licence.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Contributor Covenant contributors <https://www.contributor-covenant.org>"
SPDX-License-Identifier = "CC-BY-4.0"

# The font the image of the task tree is drawn with (EP-06, US-1440/L1): DejaVu Sans, embedded so
# that the image does not depend on the fonts of the worker's image. Bitstream Vera licence; the
# changes of DejaVu are in the public domain.
[[annotations]]
path = "backend/src/waterfall/core/exchanges/fonts/DejaVuSans.ttf"
precedence = "override"
SPDX-FileCopyrightText = "2003 Bitstream, Inc."
SPDX-License-Identifier = "Bitstream-Vera"

# The font of the login pages of Keycloak (deploy/keycloak/themes/waterfall/login): Geist, the
# font of the front, copied from its package, as Keycloak serves no file of the front.
[[annotations]]
path = "deploy/keycloak/themes/waterfall/login/resources/fonts/Geist-Variable.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2023 Vercel, in collaboration with basement.studio"
SPDX-License-Identifier = "OFL-1.1"

# The signing key of the repository of PostgreSQL (PGDG), kept here to be checked against its digest
# (backend/Dockerfile), not downloaded at each build (US-1900/L4). It is the key of the PostgreSQL
# project, published for anyone to verify its packages with.
[[annotations]]
path = "backend/pgdg.asc"
precedence = "override"
SPDX-FileCopyrightText = "PostgreSQL Global Development Group"
SPDX-License-Identifier = "PostgreSQL"
