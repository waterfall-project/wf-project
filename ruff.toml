# The rule set of the Python code — back and repository tools — in one place (WF-QUA-0030).
#
# Every rule of Ruff is on, and what is off is listed below with its reason: the history of
# this file shows every withdrawal. A rule is never silenced in the code: no `noqa`
# comment is accepted (`make sources`). An exception for a whole kind of file is written
# here, under `per-file-ignores`, with its reason.
line-length = 100
# The models of the service are engendered from the contract (`make generate-server-models`):
# the tool formats them, and a rule is not applied to what no one writes.
extend-exclude = ["backend/src/waterfall/api/contract/models.py"]
target-version = "py314"
# Where the first-party packages live, so that imports sort the same way from anywhere.
src = ["backend/src", "tools/src"]

[lint]
select = ["ALL"]
ignore = [
    # Pairs Ruff itself declares incompatible: one of each is kept.
    "D203",   # blank line before a class docstring — D211 (none) is kept
    "D213",   # summary on the second line — D212 (first line) is kept
    # Rules the formatter already enforces, or would fight.
    "COM812", # trailing commas — the formatter places them
    "ISC001", # implicit string concatenation on one line — conflicts with the formatter
    # Rules that ask for more than this repository wants.
    "D105",   # docstring on magic methods — their meaning is the language's
    "D107",   # docstring on __init__ — the class docstring says it
    "TD002",  # author of a TODO — the issue it cites says who (TD003 is kept)
    "FIX002", # any TODO is an error — a TODO citing its issue is accepted (TD003)
    "ANN401", # typing.Any — Pyright strict already refuses what matters
]
# French typography is what the repository tools read from the specification on purpose:
# typographic apostrophes, the spaces Word puts around « », the en dash of its captions.
allowed-confusables = ["’", "‘", "ʼ", " ", " ", " ", "–"]

[lint.flake8-copyright]
# CPY001 checks the SPDX header every source file opens with (US-0050).
notice-rgx = "SPDX-FileCopyrightText: \\d{4} waterfall-project"

[lint.flake8-type-checking]
# Python 3.14 evaluates annotations lazily, so Ruff asks for the imports only an annotation uses to
# move under `TYPE_CHECKING`. What reads its annotations at run time keeps them: the models of
# Pydantic, the settings, and the tables of SQLAlchemy (the type of a `Mapped[...]`).
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
    "waterfall.platform.database.Base",
]

[lint.mccabe]
# Cyclomatic complexity under 15 (US-0050): Ruff reports a value above the maximum.
max-complexity = 14

[lint.pylint]
# Aligned on the complexity limit: Pylint's own default of 12 branches would refuse a
# function US-0050 accepts.
max-branches = 14

[lint.pydocstyle]
convention = "pep257"

[lint.per-file-ignores]
"**/tests/**" = [
    "D1",      # tests are named for what they check; a docstring would repeat the name
    "S101",    # assert is how pytest checks
    "PLR2004", # a test compares with the literal value the document gives
    "FBT001",  # parametrized expectations arrive as positional booleans
    "INP001",  # pytest collects test files as modules of their own, not as a package
    "S603",    # tests run the repository's own commands
    "S607",
]
# FastAPI reads at run time the annotations of a route handler (the parameters, the body,
# the response) and of a dependency (`authentication`, `evaluation`): their imports stay
# real imports. Ruff cannot tell the handlers of a local `router = APIRouter()`, so each
# module of routes has its own line below, sorted by name. A new module that declares an
# `APIRouter(` takes its line here, not `TYPE_CHECKING` imports: the test of
# `tools/tests/test_rules.py` names the modules that lack one, and the lines that
# point to no file. The others (middleware, problems) are not exempt; `queries` holds the
# dependency `audit_column_filters` and is safe only while its annotations use local types
# or real imports: a parameter typed by an import brings it back here.
# `authentication`, `evaluation` and `reference_settings_write` declare no router:
# the first two hold dependencies; the third holds write models read by FastAPI that
# subclass `ContractModel`, which Ruff does not know for a model of Pydantic.
"backend/src/waterfall/api/access_roles.py" = ["TC001", "TC002", "TC003"]
"backend/src/waterfall/api/actual_cost_mapping.py" = ["TC001", "TC002", "TC003"]
"backend/src/waterfall/api/actual_costs.py" = ["TC001", "TC002", "TC003"]
