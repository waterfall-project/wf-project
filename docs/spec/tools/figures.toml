# Association entre une figure du document Word et sa source Mermaid.
#
# Chaque figure a une entrée ici : sans elle, l'image est conservée telle quelle
# et le build l'avertit. `legende` est un fragment de la légende telle qu'elle
# apparaît sous la figure dans Word. La source est soit une page du fichier
# draw.io (`page`, avec `direction`, la direction du flowchart Mermaid : LR, TD,
# RL, BT), soit un fichier Mermaid du dépôt (`source`). Le texte alternatif de
# l'image dans Word n'est jamais lu.

[[figure]]
legende = "Diagramme de contexte"
page = "Contexte"
direction = "LR"

# Modèle conceptuel : des diagrammes de classes, tenus en Mermaid dans le dépôt.
# L'image dans Word a été dessinée dans draw.io à partir de ces sources.

[[figure]]
legende = "Modèle conceptuel du référentiel"
source = "figures/modele-referentiel.mmd"

[[figure]]
