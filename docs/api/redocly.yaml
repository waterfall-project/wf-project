# Contrôles appliqués au contrat. La chaîne CI/CD les exécute et ils sont
# bloquants (WF-QUA-0030, WF-ARC-0060).
#
# Aucune règle n'est un avertissement : `recommended-strict` les rend toutes bloquantes,
# et une opération à laquelle une règle ne s'applique pas est déclarée, avec sa raison,
# dans `.redocly.lint-ignore.yaml`.
extends:
  - recommended-strict
apis:
  waterfall:
    root: openapi.yaml
rules:
  operation-operationId: error
  operation-summary: error
  operation-description: error
  no-unresolved-refs: error
  security-defined: error
  # Une liste de la requête s'écrit en un seul paramètre, ses valeurs séparées par des
  # virgules (`explode: false`, README, « Conventions ») : un paramètre de tableau qui ne le
  # déclare pas, ou qui déclare `explode: true`, est refusé.
  rule/array-parameter-explode-declared:
    subject:
      type: Schema
      property: type
    where:
      - subject:
          type: Parameter
          property: explode
        assertions:
          defined: false
    assertions:
      notPattern: '^array$'
    message: 'Un paramètre de tableau déclare `explode: false`.'
  rule/array-parameter-not-exploded:
    subject:
      type: Parameter
      property: explode
    assertions:
      const: false
    message: 'Un paramètre déclare `explode: false`, jamais `explode: true`.'

  # Toute opération gardée par le jeton `bearer` peut répondre 401 — jeton absent, expiré ou
  # invalide, compte désactivé (WF-SEC-0020) —, et le contrat déclare toute erreur qu'un client
  # peut rencontrer (WF-ARC-0060) : une opération qui ne déclare pas `security: []` déclare sa
  # 401. La règle ne voit qu'un `security` absent — le jeton hérité de la racine — : une
  # opération publique le dit par `security: []`, et aucune n'écrit `security: [{ bearer: [] }]`,
  # que la règle ne verrait pas.
  rule/session-operation-declares-401:
    subject:
      type: Responses
    where:
      - subject:
          type: Operation
          property: security
        assertions:
          defined: false
    assertions:
      required: ['401']
    message: 'Une opération gardée par le jeton `bearer` déclare `401`.'
  # Une opération gardée peut attendre le fournisseur d'identité — les clés du royaume, l'admission
  # d'un compte — et rendre 503 `COMPONENT_UNAVAILABLE` : elle le déclare (#666).
  rule/protected-operation-declares-503:
    subject:
      type: Responses
    where:
      - subject:
          type: Operation
          property: security
        assertions:
          defined: false
    assertions:
      required: ['503']
    message: 'Une opération gardée par le jeton `bearer` déclare `503`.'
