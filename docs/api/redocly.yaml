# Contrôles appliqués au contrat. La chaîne CI/CD les exécute et ils sont
# bloquants (WF-QUA-0030, WF-ARC-0060).
#
# Aucune règle n'est un avertissement : `recommended-strict` les rend toutes bloquantes,
# et une opération à laquelle une règle ne s'applique pas est déclarée, avec sa raison,
# dans `.redocly.lint-ignore.yaml`.
extends:
  - recommended-strict
apis:
  waterfall:
    root: openapi.yaml
rules:
  operation-operationId: error
  operation-summary: error
  operation-description: error
  no-unresolved-refs: error
  security-defined: error
