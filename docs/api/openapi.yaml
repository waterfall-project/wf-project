openapi: 3.1.0
info:
  title: Waterfall API
  version: 1.0.0-draft
  summary: Contrat de l'interface entre le front et les services de Waterfall
  description: >-
    Contrat écrit à la main, qui fait foi : tout endpoint, tout schéma et toute erreur
    qu'un client peut rencontrer y figurent, le client du front en est engendré, et la
    chaîne rejette une version des services dont une réponse s'en écarte (WF-ARC-0060).
    Aucun composant ne s'interpose entre le front et l'API (WF-ARC-0020).

    Conventions, toutes dictées par une exigence : identifiants UUID engendrés par le
    serveur, jamais séquentiels dans une URL (WF-DAT-0060) ; `snake_case` partout ;
    décimaux exacts transportés en chaîne, dates de planning sans heure, horodatages en
    temps universel (WF-DAT-0100) ; noms de la table de correspondance du §4.4.1, où
    `estimate_line` est une ligne de devis et `cost_line` une ligne de coût réel ; une
    seule enveloppe d'erreur portant un code machine et ses paramètres, jamais une
    phrase (WF-ARC-0110) ; 404 lorsque la permission de consultation manque, 403
    lorsque c'est l'écriture ou la qualité de contributeur (WF-ADM-0110) ;
    `lock_version` sur les écritures concurrentes (WF-IHM-0110) ; un seul préfixe de
    version. L'API ne localise rien : seuls les documents qu'elle engendre suivent la
    langue du destinataire (WF-ARC-0110, WF-INTF-0180).

    Les exigences citées sont celles de la spécification, dans docs/spec.
  license:
    name: GNU Affero General Public License v3.0 only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
    description: Préfixe unique de version, pour toutes les familles.
tags:
  - name: system
    description: Sondes, métriques et écran d'état (FBS-1.3).
  - name: tasks
    description: Traitements de fond confiés au worker (WF-ARC-0090).
  - name: session
    description: Ouverture, révocation et fournisseurs d'authentification (FBS-1.1).
  - name: me
    description: Compte courant, préférences et avatar (FBS-1.1).
  - name: users
    description: Comptes utilisateurs et annuaire (FBS-1.1).
  - name: access
    description: Rôles d'habilitation et catalogue des permissions (FBS-1.2).
  - name: platform
    description: Sauvegarde et restauration (FBS-1.4).
  - name: reference
    description: Référentiel commun de l'entreprise (FBS-3).
  - name: projects
    description: Projets, cycle de vie, lotissement, sous-projets, contributeurs (FBS-4.2, FBS-4.9).
  - name: revisions
    description: Révisions, structures de coûts et arbre commun (FBS-4.1).
  - name: planning
    description: Planification, liaisons, chronologies, arborescence (FBS-4.3).
  - name: estimate
    description: Chiffrage, devis et plan de charge (FBS-4.4).
  - name: remaining
    description: Estimation du reste à engager et démarrage des tâches (FBS-4.5).
  - name: risks
    description: Risques et provisions (FBS-4.6).
  - name: actual-costs
    description: Coûts réels importés de l'ERP (FBS-4.7).
  - name: indicators
    description: Indicateurs projets, courbes et décaissements (FBS-4.8).
  - name: portfolio
    description: Vues multi-projets, en consultation seule (FBS-2).
  - name: exchanges
    description: Échanges par fichier, FLX-01 à FLX-07 (FBS-4.3.4, FBS-4.4, FBS-4.5, FBS-4.7).
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: wf_session
      description: >-
        Session conservée en base et révocable immédiatement (WF-SEC-0020). Le témoin est
        httpOnly et transmis sur une connexion chiffrée (WF-SEC-0010).
security:
  - session: []
