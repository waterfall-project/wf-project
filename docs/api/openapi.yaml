openapi: 3.1.0
info:
  title: Waterfall API
  version: 1.0.0
  summary: Contract of the interface between the front and the services of Waterfall
  description: >-
    Hand-written, authoritative contract: every endpoint, every schema and every error
    a client can meet is in it, the client of the front is generated from it, and the
    chain rejects a version of the services one of whose responses departs from it
    (WF-ARC-0060). No component stands between the front and the API (WF-ARC-0020).

    Conventions, each dictated by a requirement: UUID identifiers generated by the
    server, never sequential in a URL (WF-DAT-0060); `snake_case` everywhere; exact
    decimals carried as strings, planning dates without a time, start and end of a
    task as a date and elapsed working hours, timestamps in universal time
    (WF-DAT-0100); the names of the correspondence table of §4.4.1, where
    `estimate_line` is an estimate line and `cost_line` an actual cost line; a single
    error envelope carrying a machine code and its parameters, never a sentence
    (WF-ARC-0110); 404 when the read permission is missing, 403 when it is the write
    permission or the status of contributor (WF-ADM-0110); `lock_version` on concurrent
    writes (WF-IHM-0110); a single version prefix. The API localises nothing: only the
    documents it generates follow the language of the recipient (WF-ARC-0110,
    WF-INTF-0180).

    The requirements cited are those of the specification, in docs/spec.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
    description: Single version prefix, for all families.
tags:
  - name: system
    description: Probes, metrics and status screen (FBS-1.3).
  - name: tasks
    description: Background tasks handed to the worker (WF-ARC-0090).
  - name: me
    description: Current account, sign-out, preferences and avatar (FBS-1.1).
  - name: users
    description: User accounts and read of the identity provider's accounts (FBS-1.1).
  - name: access
    description: Access roles and catalogue of permissions (FBS-1.2).
  - name: platform
    description: Backup and restore (FBS-1.4).
  - name: audit
    description: Audit log of the irreversible or structuring actions, read-only (WF-SEC-0030).
  - name: reference
    description: Common reference data of the company (FBS-3).
  - name: projects
    description: Projects, life cycle, work breakdown, subprojects, contributors (FBS-4.2, FBS-4.9).
  - name: revisions
    description: Revisions, cost structures and common tree (FBS-4.1).
  - name: planning
    description: Planning, links, timelines, tree structure (FBS-4.3).
  - name: estimate
    description: Pricing, estimate and workload (FBS-4.4).
  - name: remaining
    description: Estimation of the remaining to commit and start of the tasks (FBS-4.5).
  - name: risks
    description: Risks and provisions (FBS-4.6).
  - name: actual-costs
    description: Actual costs imported from the ERP (FBS-4.7).
  - name: indicators
    description: Project indicators, curves, cash-out and evolution of the indices (FBS-4.8).
  - name: portfolio
    description: Multi-project views, view-only (FBS-2).
  - name: exchanges
    description: File exchanges, FLX-01 to FLX-07 (FBS-4.3.4, FBS-4.4, FBS-4.5, FBS-4.7).
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The access token that the identity provider issues (WF-ARC-0030, WF-SEC-0020). The
        front keeps it on the server side and carries it to the API over an encrypted
        connection (WF-SEC-0010); the browser holds none. The API validates it — signature,
        issuer, audience, expiry — and takes from it only the identity of the account: the
        roles and the state of the account are read from the database on each request.
security:
  - bearer: []
