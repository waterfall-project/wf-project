# Exceptions déclarées aux règles du contrat, chacune avec sa raison (WF-QUA-0030) : une
# règle qui ne s'applique pas à une opération s'écarte ici, jamais en restant un
# avertissement toléré. Une exception qu'on ajoute dit pourquoi l'opération est juste.
paths/system.yaml:
  # Les sondes répondent avant toute authentification et ne refusent rien : leur seule
  # réponse est leur état (WF-EXP-0040).
  operation-4xx-response:
    - '#/~1health/get/responses'
    - '#/~1health~1ready/get/responses'
paths/session.yaml:
  # La liste des fournisseurs d'identité est publique, lue avant toute session : aucune
  # requête bien formée n'y est refusée (WF-ADM-0180).
  operation-4xx-response:
    - '#/~1session~1providers/get/responses'
  # Le départ et le retour OIDC sont des redirections : leur réponse normale est 303, et
  # aucune 2xx n'a de sens (WF-ARC-0030).
  operation-2xx-response:
    - '#/~1session~1oidc~1start/get/responses'
    - '#/~1session~1oidc~1callback/get/responses'
