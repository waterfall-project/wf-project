# Shared error responses. All carry the Problem envelope (WF-ARC-0110).

BadRequest:
  description: Malformed request.
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

Unauthorized:
  description: >-
    Token absent or invalid (`SESSION_REQUIRED`), or expired (`SESSION_EXPIRED`), WF-SEC-0020;
    token from a login that precedes the last closing of the account's sessions, or falls within
    its second — logout, deactivation, removal of all its roles —, refreshed or not
    (`SESSION_REVOKED`, WF-SEC-0020): the next login asks for the credentials again, since the
    identity provider's session may still be alive if its closing failed, whereas a mere expiry
    does not ask for them again (#855); a token that is both expired and earlier than the
    closing first receives `SESSION_EXPIRED`, expiry taking precedence, and the refreshed token,
    if the identity provider missed the closing, receives `SESSION_REVOKED`; if it closed the
    session, the refresh itself is refused; deactivated account (`ACCOUNT_DEACTIVATED`,
    WF-ADM-0060); or account that Waterfall does not admit (`ACCOUNT_NOT_ADMITTED`) — a local
    account of the provider that Waterfall did not create, without last name, without first name
    or without email address, or whose address is already taken. The front tells the last two
    apart so as not to send back to a login that would loop.
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }
      examples:
        session_required: { $ref: ../../../fixtures/api/session_required.json }
        session_expired: { $ref: ../../../fixtures/api/session_expired.json }
        session_revoked: { $ref: ../../../fixtures/api/session_revoked.json }

Forbidden:
  description: >-
    The write is not permitted to the caller, who can consult the object: a missing permission,
    `PERMISSION_MISSING`, `params.missing_permission` naming it; or their standing on the
    project, `params.missing_condition` naming it — `NOT_CONTRIBUTOR`, `is_contributor`, for
    someone who is not a contributor; `NOT_PROJECT_MANAGER`, `is_project_manager`, for someone
    who is only a contributor, for a structuring action or the project's settings (WF-ADM-0110,
    WF-PRJ-0060). The state of an object is never refused with 403: a terminal project, a marked
    revision are 409 `STATE_FORBIDS_OPERATION` (`Conflict`).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

NotFound:
  description: >-
    Nonexistent object, or invisible for lack of the permission to consult it: the
    refusal does not reveal its existence (Vérif of WF-ADM-0110).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

Conflict:
  description: >-
    The current state forbids the operation, or a uniqueness constraint is violated; `code` says
    which, for example `STATE_FORBIDS_OPERATION`, `params.missing_condition` naming the missing
    condition, or `ALREADY_EXISTS`, `fields` designating the field whose value is already taken.
    Every command that a state makes unavailable is refused this way, as the object states it in
    advance: on a marked revision, `revision_draft` (WF-DAT-0020). So is every write to a
    terminal project, which no longer lists any command: `project_not_terminal` (WF-CYC-0100;
    US-0702/L3).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }
      examples:
        marked: { $ref: ../../../fixtures/api/grid_write_marked_refused.json }

PreconditionFailed:
  description: >-
    Stale `lock_version`: the object has been modified since it was read, and nothing is written.
    `STALE_LOCK_VERSION`, `params.expected_lock_version` the current version of the object that the
    path names (WF-IHM-0110).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }
      examples:
        stale: { $ref: ../../../fixtures/api/stale_lock_version.json }

LockVersionInvalid:
  description: >-
    A deletion without a body whose counter, passed as a parameter, is missing or is not a
    non-negative integer: `VALIDATION_FAILED`, `fields` on `/query/lock_version`, and nothing is
    deleted (WF-IHM-0110; US-0702/L2).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

PayloadTooLarge:
  description: Uploaded file beyond the allowed size (WF-CMP-0020, §4.6.2).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

UnprocessableEntity:
  description: Entity admissible but refused by a business rule; `fields` locates each refusal.
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

PortfolioPeriodRefused:
  description: >-
    A refused portfolio period, according to the rule of every period of the contract
    (WF-IHM-0130): an end that precedes the start, `VALIDATION_FAILED`, `fields[]` designating
    `/query/to` with `VALUE_OUT_OF_RANGE`, `params.minimum` the start given; a malformed start or
    end, `/query/from` or `/query/to` with `DATE_INVALID`. A single bound is completed
    with that of the default period — the end, the calculation date; the start, the calculation date
    minus twelve months (28 February for a 29 February), then the next day — and the completed
    period follows the same rule: the refusal designates the bound sent, `params` naming the
    completed bound — a start later than the calculation date, `/query/from` with
    `VALUE_OUT_OF_RANGE`, `params.maximum` the completed end; an end earlier than the default
    start, `/query/to`, `params.minimum` the completed start. No empty view stands in for a
    refusal.
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }
      examples:
        period_inverted: { $ref: ../../../fixtures/api/portfolio_period_inverted.json }
        open_period_inverted: { $ref: ../../../fixtures/api/portfolio_open_period_inverted.json }

InternalError:
  description: >-
    Unexpected error of the service: `INTERNAL_ERROR`, without parameter, the cause written only
    to the log with the stack trace and the correlation identifier, which the response carries
    (`correlation_id`) and which the front displays as the reference of the error (WF-OBS-0020,
    WF-ARC-0060). Every operation declares it, none says more about it: nothing of what failed
    is returned; `make lint-openapi` checks it (`rule/operation-declares-500`).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }
      examples:
        internal_error: { $ref: ../../../fixtures/api/internal_error.json }

ServiceUnavailable:
  description: >-
    An unavailable component prevents the operation; `params.component` names it and
    the operation is never presented as successful (WF-EXP-0040). During the maintenance of a
    restore (`startRestore`), every operation responds this way, `component` at `database`, except
    `getLiveness`, which reports the maintenance (WF-ADM-0160, #604). Every guarded operation
    declares it: reading the realm keys and admitting an account wait on the identity
    provider (`identity_provider`).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }
