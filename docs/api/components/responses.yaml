# Réponses d'erreur partagées. Toutes portent l'enveloppe Problem (WF-ARC-0110).

BadRequest:
  description: Requête mal formée.
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

Unauthorized:
  description: >-
    Jeton absent ou invalide (`SESSION_REQUIRED`), ou expiré (`SESSION_EXPIRED`), WF-SEC-0020 ;
    jeton d'une connexion qui précède la dernière fermeture des sessions du compte, ou tombe dans
    sa seconde — déconnexion, désactivation, retrait de tous ses rôles —, rafraîchi ou non
    (`SESSION_REVOKED`, WF-SEC-0020) : la connexion qui suit redemande les identifiants, la
    session du fournisseur d'identité pouvant vivre encore si sa fermeture a échoué, alors
    qu'une simple expiration ne les redemande pas (#855) ; un jeton à la fois expiré et
    antérieur à la fermeture reçoit d'abord `SESSION_EXPIRED`, l'expiration primant, et le
    jeton rafraîchi, si le fournisseur d'identité a manqué la fermeture, reçoit
    `SESSION_REVOKED` ; s'il a fermé la session, le rafraîchissement lui-même est refusé ;
    compte désactivé (`ACCOUNT_DEACTIVATED`, WF-ADM-0060) ; ou compte que Waterfall n'admet pas
    (`ACCOUNT_NOT_ADMITTED`) — un compte local du fournisseur que Waterfall n'a pas créé, sans
    nom, sans prénom ou sans adresse, ou dont l'adresse est déjà portée. Le front distingue les
    deux derniers pour ne pas renvoyer à une connexion qui bouclerait.
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }
      examples:
        session_required: { $ref: ../../../fixtures/api/session_required.json }
        session_expired: { $ref: ../../../fixtures/api/session_expired.json }
        session_revoked: { $ref: ../../../fixtures/api/session_revoked.json }

Forbidden:
  description: >-
    L'écriture n'est pas permise à l'appelant, qui peut consulter l'objet : une permission
    manquante, `PERMISSION_MISSING`, `params.missing_permission` la nommant ; ou sa qualité sur
    le projet, `params.missing_condition` la nommant — `NOT_CONTRIBUTOR`, `is_contributor`, à qui
    n'en est pas contributeur ; `NOT_PROJECT_MANAGER`, `is_project_manager`, à qui n'en est que
    contributeur, pour une action structurante ou le paramétrage du projet (WF-ADM-0110,
    WF-PRJ-0060). L'état d'un objet ne se refuse jamais par 403 : un projet terminal, une révision
    marquée sont des 409 `STATE_FORBIDS_OPERATION` (`Conflict`).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

NotFound:
  description: >-
    Objet inexistant, ou invisible faute de la permission de consultation : le
    refus ne révèle pas son existence (Vérif de WF-ADM-0110).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

Conflict:
  description: >-
    L'état courant interdit l'opération, ou une unicité est violée ; `code` dit lequel, par
    exemple `STATE_FORBIDS_OPERATION`, `params.missing_condition` nommant la condition manquante,
    ou `ALREADY_EXISTS`, `fields` désignant le champ dont la valeur est déjà portée. Toute
    commande qu'un état rend indisponible se refuse ainsi, comme l'objet la dit d'avance : sur un
    projet terminal, `project_not_terminal` (WF-CYC-0100) ; sur une révision marquée — toute
    révision d'un projet terminal l'est —, `revision_draft` (WF-DAT-0020).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

PreconditionFailed:
  description: >-
    `lock_version` périmé : l'objet a été modifié depuis sa lecture, et rien n'est écrit.
    `STALE_LOCK_VERSION`, `params.expected_lock_version` la version courante de l'objet que le
    chemin nomme (WF-IHM-0110).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

LockVersionInvalid:
  description: >-
    Une suppression sans corps dont le compteur, passé en paramètre, manque ou n'est pas un entier
    positif ou nul : `VALIDATION_FAILED`, `fields` sur `/query/lock_version`, et rien n'est
    supprimé (WF-IHM-0110 ; US-0702/L2).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

PayloadTooLarge:
  description: Fichier déposé au-delà de la taille admise (WF-CMP-0020, §4.6.2).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

UnprocessableEntity:
  description: Entité recevable mais refusée par une règle métier ; `fields` localise chaque refus.
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

PortfolioPeriodRefused:
  description: >-
    Une période du portefeuille refusée, selon la règle de toute période du contrat
    (WF-IHM-0130) : une fin qui précède le début, `VALIDATION_FAILED`, `fields[]` désignant
    `/query/to` par `VALUE_OUT_OF_RANGE`, `params.minimum` le début donné ; un début ou une fin
    mal formés, `/query/from` ou `/query/to` par `DATE_INVALID`. Une borne seule se complète
    par celle de la période par défaut — la fin, la date de calcul ; le début, la date de calcul
    moins douze mois (le 28 février pour un 29 février), puis le lendemain — et la période
    complétée suit la même règle : le refus désigne la borne envoyée, `params` nommant la borne
    complétée — un début postérieur à la date de calcul, `/query/from` par
    `VALUE_OUT_OF_RANGE`, `params.maximum` la fin complétée ; une fin antérieure au début par
    défaut, `/query/to`, `params.minimum` le début complété. Aucune vue vide ne tient lieu de
    refus.
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }
      examples:
        period_inverted: { $ref: ../../../fixtures/api/portfolio_period_inverted.json }
        open_period_inverted: { $ref: ../../../fixtures/api/portfolio_open_period_inverted.json }

InternalError:
  description: >-
    Erreur inattendue du service : `INTERNAL_ERROR`, sans paramètre, la cause écrite au seul
    journal avec la trace et l'identifiant de corrélation, que la réponse porte
    (`correlation_id`) et que le front affiche comme la référence de l'erreur (WF-OBS-0020,
    WF-ARC-0060). Toute opération la déclare, aucune n'en dit davantage : rien de ce qui a échoué
    n'est rendu ; `make lint-openapi` le vérifie (`rule/operation-declares-500`).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }
      examples:
        internal_error: { $ref: ../../../fixtures/api/internal_error.json }

ServiceUnavailable:
  description: >-
    Un composant indisponible empêche l'opération ; `params.component` le nomme et
    l'opération n'est jamais présentée comme réussie (WF-EXP-0040). Pendant la maintenance d'une
    restauration (`startRestore`), toute opération répond ainsi, `component` à `database`, sauf
    `getLiveness`, qui dit la maintenance (WF-ADM-0160, #604). Toute opération gardée le
    déclare : la lecture des clés du royaume et l'admission d'un compte attendent le fournisseur
    d'identité (`identity_provider`).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }
