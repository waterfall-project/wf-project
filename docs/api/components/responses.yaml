# Réponses d'erreur partagées. Toutes portent l'enveloppe Problem (WF-ARC-0110).

BadRequest:
  description: Requête mal formée.
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

Unauthorized:
  description: >-
    Jeton absent, expiré ou invalide, ou session fermée (`SESSION_REQUIRED`, `SESSION_EXPIRED`,
    WF-SEC-0020) ; ou compte désactivé (`ACCOUNT_DEACTIVATED`, WF-ADM-0060), que le front
    distingue pour ne pas renvoyer à une connexion qui bouclerait.
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

Forbidden:
  description: >-
    Permission présente mais condition manquante : qualité de contributeur,
    état du projet, révision marquée. `params` nomme la condition (WF-ADM-0110,
    WF-CYC-0100, WF-DAT-0020).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

NotFound:
  description: >-
    Objet inexistant, ou invisible faute de la permission de consultation : le
    refus ne révèle pas son existence (Vérif de WF-ADM-0110).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

Conflict:
  description: >-
    L'état courant interdit l'opération, ou une unicité est violée ; `code` dit lequel, par
    exemple `STATE_FORBIDS_OPERATION`, `params.missing_condition` nommant la condition manquante,
    ou `ALREADY_EXISTS`, `fields` désignant le champ dont la valeur est déjà portée.
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

PreconditionFailed:
  description: >-
    `lock_version` périmé : l'objet a été modifié depuis sa lecture, et rien n'est écrit.
    `STALE_LOCK_VERSION`, `params.expected_lock_version` la version courante de l'objet que le
    chemin nomme (WF-IHM-0110).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

PayloadTooLarge:
  description: Fichier déposé au-delà de la taille admise (WF-CMP-0020, §4.6.2).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

UnprocessableEntity:
  description: Entité recevable mais refusée par une règle métier ; `fields` localise chaque refus.
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }

PortfolioPeriodRefused:
  description: >-
    Une période du portefeuille refusée, selon la règle de toute période du contrat
    (WF-IHM-0130) : une fin qui précède le début, `VALIDATION_FAILED`, `fields[]` désignant
    `/query/to` par `VALUE_OUT_OF_RANGE`, `params.minimum` le début donné ; un début ou une fin
    mal formés, `/query/from` ou `/query/to` par `DATE_INVALID`. Une borne seule se complète
    par celle de la période par défaut — la fin, la date de calcul ; le début, la date de calcul
    moins douze mois (le 28 février pour un 29 février), puis le lendemain — et la période
    complétée suit la même règle : le refus désigne la borne envoyée, `params` nommant la borne
    complétée — un début postérieur à la date de calcul, `/query/from` par
    `VALUE_OUT_OF_RANGE`, `params.maximum` la fin complétée ; une fin antérieure au début par
    défaut, `/query/to`, `params.minimum` le début complété. Aucune vue vide ne tient lieu de
    refus.
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }
      examples:
        period_inverted: { $ref: ../../../fixtures/api/portfolio_period_inverted.json }
        open_period_inverted: { $ref: ../../../fixtures/api/portfolio_open_period_inverted.json }

ServiceUnavailable:
  description: >-
    Un composant indisponible empêche l'opération ; `params.component` le nomme et
    l'opération n'est jamais présentée comme réussie (WF-EXP-0040).
  content:
    application/problem+json:
      schema: { $ref: common.yaml#/Problem }
