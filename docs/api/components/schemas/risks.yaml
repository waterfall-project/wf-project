# Risques et provisions (FBS-4.6).

RiskState:
  type: string
  enum: [identified, occurred, dismissed]
  description: >-
    Identifié, survenu, écarté. Un risque écarté peut redevenir identifié ; la
    survenance est définitive (WF-RIS-0020).

Risk:
  type: object
  required:
    - risk_id
    - label
    - probability
    - severity
    - provision_amount
    - state
    - structure_id
    - provision_cost_category_id
    - provision_cost_category_label
    - provision_cost_category_is_active
    - provision_subproject_id
    - provision_subproject_label
    - computed_fields
    - available_commands
    - audit
    - lock_version
  description: >-
    La gravité est le total de la structure propre du risque et la provision cette
    gravité pondérée par la probabilité : ni l'une ni l'autre ne sont saisies
    (WF-RIS-0010), et le risque nomme ce dont elles dépendent (`computed_fields`). Il
    porte ses commandes, disponibles ou non (`available_commands`, WF-IHM-0090).
  properties:
    risk_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    mitigation_notes:
      anyOf: [{ type: string }, { type: 'null' }]
    probability: { $ref: ../common.yaml#/Percent }
    severity:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: Calculée, jamais saisie (WF-RIS-0010).
    provision_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Calculée, gravité pondérée par la probabilité ; celle que portait la révision de
        référence compte à la réserve pour risques, jamais au budget de référence
        (WF-RIS-0050).
    state: { $ref: '#/RiskState' }
    structure_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        Structure de coûts propre du risque, dans la révision lue (`revision_id`), qui en
        fige une version (WF-RIS-0030).
    provision_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Ligne de provision portée par la structure principale (WF-RIS-0010).
    provision_cost_category_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        La catégorie de type provision pour risques que le risque a désignée pour sa provision —
        à sa déclaration, ou depuis, tant qu'il était identifié —, que porte sa ligne de provision
        tant qu'il est identifié (WF-RIS-0010, WF-REF-0030). Un risque écarté la garde : redevenu
        identifié, sa ligne la reprend si elle est encore active, et sinon la catégorie est
        demandée comme à la déclaration (`RiskReviewWrite.provision_cost_category_id`), ce que
        `provision_cost_category_is_active` dit d'avance.
    provision_cost_category_label:
      type: string
      description: >-
        Le libellé de cette catégorie, résolu à la lecture, active ou désactivée, que le registre
        et le formulaire présentent sans lire le référentiel (WF-ARC-0020, WF-REF-0150).
    provision_cost_category_is_active:
      type: boolean
      description: >-
        Calculé à la lecture : vrai quand cette catégorie est active et que sa nature l'est aussi
        — la définition d'une catégorie active de type provision pour risques jusqu'à C-291
        (#728). Faux, le retour du risque écarté à l'état identifié demande une autre catégorie
        (`RiskReviewWrite.provision_cost_category_id`, WF-RIS-0010) : le front le lit, sans
        comparer la catégorie aux listes du référentiel.
    provision_subproject_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        Le sous-projet que le risque a désigné, facultativement, pour sa provision, et auquel
        appartient sa ligne de provision ; nul, elle compte dans l'ensemble « hors sous-projet »
        (WF-RIS-0010, WF-RAE-0020, WF-IND-0020). La suppression du sous-projet passe à nul la
        désignation de tout risque qui n'est pas identifié : redevenu identifié, sa provision
        compte hors sous-projet — l'auteur l'a tranché le 2026-10-10 (décision de l'auteur, #732).
        Le risque touché voit alors son `lock_version` avancer et son audit nommer l'auteur de la
        suppression (WF-DAT-0070, WF-IHM-0110).
    provision_subproject_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Le libellé de ce sous-projet, résolu à la lecture ; nul pour une provision hors
        sous-projet.
    matrix_cell: { $ref: '#/RiskMatrixCell' }
    last_review_on:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
    computed_fields:
      type: array
      description: >-
        Les champs du risque que le serveur calcule, chacun avec ce dont il dépend, que le
        refus d'une saisie nomme (WF-IHM-0030) : la gravité et la provision, dans cet ordre,
        pour tout risque. Constants — les règles du calcul, pas les lignes du devis propre —,
        ils se lisent avec le risque, sans appel au refus.
      minItems: 2
      maxItems: 2
      items: { $ref: '#/RiskComputedField' }
    available_commands:
      type: array
      description: >-
        Commandes du risque que l'appelant a la permission d'exercer, chacune disponible ou
        non, avec les conditions qui lui manquent (WF-IHM-0090), dans l'ordre de
        `RiskCommand`. Une commande absente de la liste n'est pas présentée. Le risque ne
        nomme que ce qui tient à lui — son état, sa citation par une révision marquée — et,
        pour la survenance, la révision qu'elle créerait ; les conditions du projet et de la
        révision sont sur leurs commandes (`ProjectCommand.declare_risk_occurrence`,
        `RevisionCommand.edit_risks`). Un appel envoyé malgré la liste est refusé par son code
        d'erreur.
      items: { $ref: '#/RiskCommandAvailability' }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

RiskCommand:
  type: string
  enum:
    - update
    - update_provision
    - review
    - declare_occurrence
    - delete
  description: >-
    Commandes portées par un risque (WF-IHM-0090) : le modifier (`updateRisk`), et parmi ses
    attributs changer la catégorie ou le sous-projet de sa provision (`updateRisk`,
    `provision_cost_category_id`, `provision_subproject_id`), le réexaminer — l'écarter ou le
    réidentifier (`reviewRisk`, `RiskReviewWrite.state`) —, le déclarer survenu
    (`declareRiskOccurrence`), le supprimer (`deleteRisk`). `update_provision`, toujours listée
    avec `update`, dit d'avance que la catégorie et le sous-projet de la provision ne changent que
    tant que le risque est identifié, `risk_identified` manquante sinon (WF-RIS-0010 ;
    EP-14/L42p), comme `update_win_probability` le dit de la probabilité de gain d'un projet ;
    elle ne nomme que `risk_identified`, pour un risque survenu comme pour un risque écarté.
    Les saisies relèvent de `edit_risks` et de `risks.write` ; un risque survenu les a indisponibles,
    `risk_not_occurred` manquante, aucune transition n'en partant (WF-RIS-0020), et la
    suppression d'un risque qu'une révision marquée cite nomme `risk_not_cited`. La
    déclaration de survenance est gardée par la seule permission `risk_occurrence` — elle
    emporte la fusion qu'elle déclenche et n'exige pas `structure_merge` (WF-ADM-0100) — ;
    indisponible pour un risque qui n'est pas identifié, `risk_identified` manquante, et, quand
    le projet n'a pas de révision en cours, pour qui n'a pas `revisions.write`,
    `may_create_revision` manquante : elle la créerait (WF-RIS-0060).

RiskCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/RiskCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Vide lorsque la commande est disponible.
      items: { $ref: projects.yaml#/CommandCondition }

RiskComputedField:
  type: object
  required: [field, dependencies]
  description: Un champ calculé d'un risque, et ce dont il dépend (WF-IHM-0030).
  properties:
    field:
      type: string
      enum: [severity, provision_amount]
    dependencies:
      type: array
      minItems: 1
      uniqueItems: true
      description: Chaque règle une fois, dans l'ordre où la dire.
      items: { $ref: revisions.yaml#/ComputedDependency }

RiskWrite:
  type: object
  required: [label, probability]
  description: >-
    Déclaration d'un risque (WF-RIS-0010). La catégorie de sa provision se désigne parmi les
    catégories actives de type provision pour risques — jusqu'à C-291 (#728), une catégorie
    active sous une nature active de ce type ; quand il n'en existe qu'une, elle est retenue sans
    être demandée, et le champ peut être omis. Sans aucune, la déclaration est refusée par 409,
    `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `active_provision_category`. Le
    sous-projet de la provision est facultatif.
  properties:
    label: { type: string, minLength: 1, maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    mitigation_notes:
      anyOf: [{ type: string }, { type: 'null' }]
    probability: { $ref: ../common.yaml#/Percent }
    provision_cost_category_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        La catégorie que porte la ligne de provision (WF-RIS-0010, WF-REF-0030). Omise à la
        déclaration, elle est la seule catégorie active de type provision pour risques ; omise
        quand il en existe plusieurs, elle est refusée par 422, `VALUE_REQUIRED` ; inconnue,
        `UNKNOWN_COST_CATEGORY` ; désactivée, ou sous une nature désactivée,
        `INACTIVE_REFERENCE_OBJECT` (WF-REF-0010) ; d'une nature d'un autre type,
        `PROVISION_CATEGORY_REQUIRED`. À la modification, omise, elle reste celle du risque ;
        `INACTIVE_REFERENCE_OBJECT` ne vaut que si la valeur change la catégorie du risque : sa
        catégorie inchangée, désactivée depuis, est acceptée, comme le parent d'un nœud ou la
        catégorie d'un rôle (`updateOrgNode`, `updateResourceRole`) ; une autre, envoyée pour un
        risque qui n'est pas identifié, est refusée par 409, `STATE_FORBIDS_OPERATION`,
        `params.missing_condition` à `risk_identified`, ce que la commande `update_provision` dit
        d'avance.
    provision_subproject_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        Le sous-projet auquel appartient la ligne de provision, facultatif ; nul ou omis à la
        déclaration, elle compte hors sous-projet (WF-RIS-0010, WF-RAE-0020). Un sous-projet que
        le projet n'a pas est refusé par 422, `UNKNOWN_SUBPROJECT`. À la modification, omis, il
        reste celui du risque ; `null` retire la provision de son sous-projet ; un autre, envoyé
        pour un risque qui n'est pas identifié, est refusé comme la catégorie, par
        `risk_identified`.

RiskUpdate:
  description: >-
    Modification d'un risque : porte le compteur lu,
    qu'une création n'a pas. La catégorie et le sous-projet de la provision, omis, restent ceux
    du risque ; changés, ils ne le sont que tant que le risque est identifié (WF-RIS-0010,
    `update_provision`).
  allOf:
    - $ref: '#/RiskWrite'
    - type: object
      required: [lock_version]
      properties:
        lock_version: { $ref: ../common.yaml#/LockVersion }

RiskReview:
  type: object
  required: [reviewed_on, probability, severity, state]
  description: >-
    Réexamen : l'acte par lequel un utilisateur confirme ou modifie la probabilité
    et l'état d'un risque, daté du jour où il est fait (WF-RIS-0010, WF-RIS-0020).
  properties:
    reviewed_on: { $ref: ../common.yaml#/PlanningDate }
    probability: { $ref: ../common.yaml#/Percent }
    severity: { $ref: ../common.yaml#/Money }
    state: { $ref: '#/RiskState' }
    actor: { $ref: ../common.yaml#/ActorRef }

RiskReviewWrite:
  type: object
  required: [probability, state, lock_version]
  description: >-
    La confirmation sans modification produit un réexamen daté (WF-RIS-0010). Un risque écarté
    qui redevient identifié recrée sa ligne de provision avec la catégorie qu'il désignait si elle
    est encore active ; sinon la catégorie est demandée, comme à la déclaration
    (`provision_cost_category_id`), ce que `Risk.provision_cost_category_is_active` dit d'avance.
    Sans aucune catégorie active de type provision pour risques, ce retour est refusé par 409,
    `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `active_provision_category`
    (WF-RIS-0010). Il se fait hors sous-projet quand le sous-projet que le risque désignait a été
    supprimé depuis, la désignation passée à nul (décision de l'auteur, #732). Son annulation rend
    au risque son état précédent et la catégorie qu'il désignait avant ce retour, la catégorie
    choisie au retour comprise (WF-IHM-0110, WF-RIS-0020).
  properties:
    probability: { $ref: ../common.yaml#/Percent }
    state:
      type: string
      enum: [identified, dismissed]
    provision_cost_category_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        La catégorie de la provision d'un risque écarté qui redevient identifié, quand celle
        qu'il désignait n'est plus active (`Risk.provision_cost_category_is_active` faux) :
        omise, elle est la seule catégorie active de type
        provision pour risques, et refusée par 422, `VALUE_REQUIRED`, quand il en existe
        plusieurs ; les autres refus sont ceux de la déclaration (`RiskWrite`). Ignorée quand la
        catégorie désignée est encore active, ou quand le risque ne redevient pas identifié.
    lock_version: { $ref: ../common.yaml#/LockVersion }

RiskOccurrence:
  type: object
  required: [confirmed]
  description: >-
    Déclare le risque survenu : fusionne son devis propre dans la structure
    principale de la révision en cours, les lignes fusionnées portant un montant
    budgété nul et leur montant du devis propre en réestimé ; la ligne de provision
    est retirée. Ne marque aucune révision et ne déplace pas la référence
    (WF-RIS-0060). Définitif.
  properties:
    confirmed:
      type: boolean
      const: true

RiskMatrixCell:
  type: object
  required: [probability_level, severity_level, zone]
  properties:
    probability_level: { type: integer, minimum: 1, maximum: 4 }
    severity_level: { type: integer, minimum: 1, maximum: 4 }
    zone: { $ref: reference.yaml#/AlertZone }

RiskMatrixLevel:
  type: object
  required: [level, lower, upper]
  description: >-
    Un niveau d'un axe de la matrice et ses bornes, que le référentiel fixe (WF-REF-0160) :
    la borne basse comprise, la borne haute exclue, nulle au dernier niveau, qui n'en a
    pas. Un pourcentage : de probabilité sur l'axe des probabilités, du budget de
    référence sur l'axe des gravités — celui de chaque projet, ce qui vaut aussi pour la
    matrice du portefeuille.
  properties:
    level: { type: integer, minimum: 1, maximum: 4 }
    lower: { $ref: ../common.yaml#/Percent }
    upper:
      anyOf: [{ $ref: ../common.yaml#/Percent }, { type: 'null' }]

RiskMatrix:
  type: object
  required: [probability_levels, severity_levels, cells, totals]
  description: >-
    Matrice remplie par les risques lus, avec les bornes de ses niveaux, pour que ses axes
    se nomment sans lire le référentiel (WF-RIS-0040, WF-REF-0160) : ceux du projet dans
    la révision lue (`revision_id`, WF-RIS-0030) pour la matrice d'un projet, ceux des
    projets retenus pour celle du portefeuille.
  properties:
    probability_levels:
      type: array
      minItems: 4
      maxItems: 4
      description: Les quatre niveaux de probabilité, du plus bas au plus haut, en pourcentage.
      items: { $ref: '#/RiskMatrixLevel' }
    severity_levels:
      type: array
      minItems: 4
      maxItems: 4
      description: >-
        Les quatre niveaux de gravité, du plus bas au plus haut, en pourcentage du budget
        de référence.
      items: { $ref: '#/RiskMatrixLevel' }
    cells:
      type: array
      items:
        type: object
        required: [probability_level, severity_level, count, zone]
        properties:
          probability_level: { type: integer, minimum: 1, maximum: 4 }
          severity_level: { type: integer, minimum: 1, maximum: 4 }
          count: { type: integer, minimum: 0 }
          zone: { $ref: reference.yaml#/AlertZone }
    totals: { $ref: '#/ProvisionTotals' }

ProvisionTotals:
  type: object
  required: [identified, occurred, dismissed, total, reserve]
  description: >-
    Les trois totaux de provisions, distincts — les identifiés pour leur provision
    courante, les survenus et les écartés pour celle qu'ils portaient dans la révision
    de référence —, leur total général, et la réserve pour risques de la révision de
    référence en regard (WF-RIS-0040, WF-RIS-0050), calculés par le serveur sur les
    risques retenus.
  properties:
    total: { $ref: ../common.yaml#/Money }
    identified: { $ref: ../common.yaml#/Money }
    occurred: { $ref: ../common.yaml#/Money }
    dismissed: { $ref: ../common.yaml#/Money }
    reserve: { $ref: ../common.yaml#/Money }

RiskCoverageTotals:
  type: object
  required: [reserve, remaining_provisions, occurred_cost, coverage_variance]
  description: >-
    Les quatre montants de la couverture des risques : la réserve pour risques de la
    révision de référence, la somme des provisions des risques identifiés dans la révision
    courante, le montant réestimé des lignes issues des risques survenus, et l'écart de
    couverture, signé, reserve − (remaining_provisions + occurred_cost) (WF-RIS-0050).
  properties:
    reserve: { $ref: ../common.yaml#/Money }
    remaining_provisions: { $ref: ../common.yaml#/Money }
    occurred_cost: { $ref: ../common.yaml#/Money }
    coverage_variance:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        L'écart de couverture (WF-RIS-0050) : la réserve moins la somme des provisions restantes
        et du coût des risques survenus, positif quand la réserve couvre encore, négatif quand
        elle est dépassée — le sens de la marge du reste à engager
        (`RemainingIndicators.delta_to_reference`).

RiskCoverage:
  allOf:
    - $ref: '#/RiskCoverageTotals'
    - type: object
      required: [context]
      properties:
        context: { $ref: indicators.yaml#/CalculationContext }
  description: >-
    La couverture des risques d'un projet, à une date et dans une révision (WF-RIS-0050,
    WF-RAE-0020).
