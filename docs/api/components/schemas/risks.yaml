# Risques et provisions (FBS-4.6).

RiskState:
  type: string
  enum: [identified, occurred, dismissed]
  description: >-
    Identifié, survenu, écarté. Un risque écarté peut redevenir identifié ; la
    survenance est définitive : aucune transition ne part de l'état survenu et aucune commande
    ne l'annule ; seul l'abandon de la révision en cours la défait, le risque y redevenant
    identifié avec sa provision (`abandonRevision`, WF-RIS-0020, WF-RIS-0060).

Risk:
  type: object
  required:
    - risk_id
    - label
    - description
    - mitigation_notes
    - probability
    - severity
    - provision_amount
    - occurrence_cost
    - state
    - structure_id
    - provision_node_id
    - provision_cost_category_id
    - provision_cost_category_label
    - provision_cost_category_is_active
    - provision_subproject_id
    - provision_subproject_label
    - provision_task
    - matrix_cell
    - last_review_on
    - computed_fields
    - available_commands
    - audit
    - lock_version
  description: >-
    La gravité est le total de la structure propre du risque et la provision cette
    gravité pondérée par la probabilité : ni l'une ni l'autre ne sont saisies
    (WF-RIS-0010), et le risque nomme ce dont elles dépendent (`computed_fields`). Il
    porte ses commandes, disponibles ou non (`available_commands`, WF-IHM-0090). Sa
    probabilité ne s'écrit que par le réexamen (`reviewRisk`, WF-RIS-0010).
  properties:
    risk_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    mitigation_notes:
      anyOf: [{ type: string }, { type: 'null' }]
    probability: { $ref: ../common.yaml#/Percent }
    severity:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: Calculée, jamais saisie (WF-RIS-0010).
    provision_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Pour un risque identifié, sa provision courante, la gravité pondérée par la probabilité,
        que porte sa ligne de provision. Pour un risque survenu ou écarté, qui ne porte plus de
        ligne, la provision qu'il portait dans la révision de référence, `0.00` s'il n'y était
        pas identifié (WF-RIS-0040, WF-RIS-0050) : la ligne du registre se somme ainsi aux
        totaux (`ProvisionTotals`). Jamais au budget de référence (WF-RIS-0050).
    occurrence_cost:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: >-
        Le coût à la survenance d'un risque survenu : le total de son devis propre au moment où
        il a été déclaré survenu, que ni les réestimations ni la terminaison des tâches
        fusionnées ne changent, et que la couverture compare à la réserve (WF-RIS-0010,
        WF-RIS-0050, WF-RIS-0060 ; `RiskCoverageTotals.occurred_cost`). Une donnée de la
        révision, que l'abandon de la révision où le risque est survenu efface (WF-RIS-0020).
        Nul pour un risque identifié ou écarté.
    state: { $ref: '#/RiskState' }
    structure_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        Structure de coûts propre du risque, dans la révision lue (`revision_id`), qui en
        fige une version (WF-RIS-0030).
    provision_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Ligne de provision portée par la structure principale (WF-RIS-0010).
    provision_cost_category_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        La catégorie de type provision pour risques que le risque a désignée pour sa provision —
        à sa déclaration, ou depuis, tant qu'il était identifié —, que porte sa ligne de provision
        tant qu'il est identifié (WF-RIS-0010, WF-REF-0030). Un risque écarté la garde : redevenu
        identifié, sa ligne la reprend si elle est encore active et de type provision pour
        risques, et sinon la catégorie est demandée comme à la déclaration
        (`RiskReviewWrite.provision_cost_category_id`), ce que
        `provision_cost_category_is_active` dit d'avance.
    provision_cost_category_label:
      type: string
      description: >-
        Le libellé de cette catégorie, résolu à la lecture, active ou désactivée, que le registre
        et le formulaire présentent sans lire le référentiel (WF-ARC-0020, WF-REF-0150).
    provision_cost_category_is_active:
      type: boolean
      description: >-
        Calculé à la lecture : vrai quand cette catégorie est active et que sa nature est de type
        provision pour risques — sa nature est alors active aussi, la désactivation d'une nature
        désactivant ses catégories (WF-REF-0010 ; EP-14/L42s, C-291). Faux pour une catégorie
        désactivée, ou rattachée depuis à une nature d'un autre type : une catégorie que plus
        aucune ligne n'emploie, celle d'un risque écarté, peut changer de nature (WF-REF-0030), et
        elle n'est plus alors « parmi les catégories actives de type provision pour risques »
        (WF-RIS-0010 ; #747). Faux, le retour du risque écarté à l'état identifié demande une autre
        catégorie (`RiskReviewWrite.provision_cost_category_id`, WF-RIS-0010) : le front le lit,
        sans comparer la catégorie aux listes du référentiel.
    provision_subproject_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        Le sous-projet que le risque a désigné, facultativement, pour sa provision, et auquel
        appartient sa ligne de provision ; nul, elle compte dans l'ensemble « hors sous-projet »
        (WF-RIS-0010, WF-RAE-0020, WF-IND-0020). La suppression du sous-projet passe à nul la
        désignation de tout risque qui n'est pas identifié : redevenu identifié, sa provision
        compte hors sous-projet — l'auteur l'a tranché le 2026-10-10 (décision de l'auteur, #732).
        Le risque touché voit alors son `lock_version` avancer et son audit nommer l'auteur de la
        suppression (WF-DAT-0070, WF-IHM-0110).
    provision_subproject_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Le libellé de ce sous-projet, résolu à la lecture ; nul pour une provision hors
        sous-projet.
    provision_task:
      anyOf: [{ $ref: '#/ProvisionTask' }, { type: 'null' }]
      description: >-
        La tâche de la structure principale de la révision lue qui porte la ligne de provision
        (`provision_node_id`), par son nœud et son libellé, résolu à la lecture : celle que le
        risque a désignée à sa déclaration ou depuis, tant qu'il était identifié, et à défaut la
        première tâche de premier niveau (WF-RIS-0010, #786). Un risque écarté qui redevient
        identifié retrouve la tâche qu'il désignait si elle est encore une tâche de la structure
        principale, et sinon la première tâche de premier niveau (`reviewRisk`, #1227). Le
        formulaire la présente et la propose de nouveau sans relire la structure (WF-ARC-0020).
        Nulle quand le risque n'est pas identifié : il ne porte alors aucune ligne de provision.
    matrix_cell: { $ref: '#/RiskMatrixCell' }
    last_review_on:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: >-
        Le jour de son dernier réexamen, que la grille présente (WF-RIS-0040) : sa déclaration,
        un réexamen (`reviewRisk`) ou sa survenance.
    computed_fields:
      type: array
      description: >-
        Les champs du risque que le serveur calcule, chacun avec ce dont il dépend, que le
        refus d'une saisie nomme (WF-IHM-0030) : la gravité et la provision, dans cet ordre,
        pour tout risque. Constants — les règles du calcul, pas les lignes du devis propre —,
        ils se lisent avec le risque, sans appel au refus.
      minItems: 2
      maxItems: 2
      items: { $ref: '#/RiskComputedField' }
    available_commands:
      type: array
      description: >-
        Commandes du risque que l'appelant a la permission d'exercer, chacune disponible ou
        non, avec les conditions qui lui manquent (WF-IHM-0090), dans l'ordre de
        `RiskCommand`. Une commande absente de la liste n'est pas présentée. Le risque ne
        nomme que ce qui tient à lui — son état, sa citation par une révision marquée — et,
        pour la survenance, la révision qu'elle créerait ; les conditions du projet et de la
        révision sont sur leurs commandes (`ProjectCommand.declare_risk_occurrence`,
        `RevisionCommand.edit_risks`). Un appel envoyé malgré la liste est refusé par son code
        d'erreur.
      items: { $ref: '#/RiskCommandAvailability' }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        Compteur du risque. Il avance à chaque écriture du risque, et aussi à toute saisie dans
        son devis propre (`structure_id`) — une cellule, un collage, un déplacement, une
        création, une suppression —, dont il tient sa gravité (WF-RIS-0010) : le compte rendu de
        sa survenance, qui décrit ce devis, est ainsi périmé par elle (`RiskOccurrence`). Il
        avance de même à la suppression du sous-projet qu'il désignait
        (`provision_subproject_id`, #732).

ProvisionTask:
  type: object
  required: [node_id, label]
  description: >-
    La tâche de la structure principale qui porte la ligne de provision d'un risque
    (WF-RIS-0010), par son nœud et son libellé, comme un refus nomme une tâche.
  properties:
    node_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 300 }

RiskCommand:
  type: string
  enum:
    - update
    - update_provision
    - review
    - declare_occurrence
    - delete
  description: >-
    Commandes portées par un risque (WF-IHM-0090) : le modifier (`updateRisk`), et parmi ses
    attributs changer la catégorie, le sous-projet ou la tâche de sa provision (`updateRisk`,
    `provision_cost_category_id`, `provision_subproject_id`, `provision_task_id`), le réexaminer —
    l'écarter ou le réidentifier (`reviewRisk`, `RiskReviewWrite.state`) —, le déclarer survenu
    (`declareRiskOccurrence`), le supprimer (`deleteRisk`). `update_provision`, toujours listée
    avec `update`, dit d'avance que la catégorie, le sous-projet et la tâche de la provision ne
    changent que tant que le risque est identifié, `risk_identified` manquante sinon (WF-RIS-0010 ;
    EP-14/L42p, #786), comme `update_win_probability` le dit de la probabilité de gain d'un projet ;
    elle ne nomme que `risk_identified`, pour un risque survenu comme pour un risque écarté.
    Les saisies relèvent de `edit_risks` et de `risks.write` ; un risque survenu les a indisponibles,
    `risk_not_occurred` manquante, aucune transition n'en partant (WF-RIS-0020), et la
    suppression d'un risque qu'une révision marquée cite nomme `risk_not_cited`. La
    déclaration de survenance est gardée par la seule permission `risk_occurrence` — elle
    emporte la fusion qu'elle déclenche et n'exige pas `structure_merge` (WF-ADM-0100) — ;
    indisponible pour un risque qui n'est pas identifié, `risk_identified` manquante, et, quand
    le projet n'a pas de révision en cours, pour qui n'a pas `revisions.write`,
    `may_create_revision` manquante : elle la créerait (WF-RIS-0060).

RiskCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/RiskCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Vide lorsque la commande est disponible.
      items: { $ref: projects.yaml#/CommandCondition }

RiskComputedField:
  type: object
  required: [field, dependencies]
  description: Un champ calculé d'un risque, et ce dont il dépend (WF-IHM-0030).
  properties:
    field:
      type: string
      enum: [severity, provision_amount]
    dependencies:
      type: array
      minItems: 1
      uniqueItems: true
      description: Chaque règle une fois, dans l'ordre où la dire.
      items: { $ref: revisions.yaml#/ComputedDependency }

RiskWrite:
  type: object
  required: [label, probability]
  description: >-
    Déclaration d'un risque (WF-RIS-0010). Sur une structure principale sans tâche, elle est
    refusée par 409, `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `at_least_one_task`
    (EP-14/L42s). La catégorie de sa provision se désigne parmi les catégories actives de type
    provision pour risques ; quand il n'en existe qu'une, elle est retenue sans être demandée, et
    le champ peut être omis. Sans aucune, la déclaration est refusée par 409, de même,
    `params.missing_condition` à `active_provision_category`. La commande `declare_risk` dit
    d'avance l'une et l'autre condition (EP-14/L42s). Le sous-projet de la provision est
    facultatif, comme la tâche qui la porte : sans désignation, la première tâche de premier
    niveau de la structure principale (WF-RIS-0010, #786).
  properties:
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    mitigation_notes:
      anyOf: [{ type: string }, { type: 'null' }]
    probability:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      description: De `0` à `1` inclus, un rapport (WF-RIS-0010).
    provision_cost_category_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        La catégorie que porte la ligne de provision (WF-RIS-0010, WF-REF-0030). Omise à la
        déclaration, elle est la seule catégorie active de type provision pour risques ; omise
        quand il en existe plusieurs, elle est refusée par 422, `VALUE_REQUIRED` ; inconnue,
        `UNKNOWN_COST_CATEGORY` ; désactivée, ce qu'est toute catégorie d'une nature
        désactivée, `INACTIVE_REFERENCE_OBJECT` (WF-REF-0010, C-291) ; d'une nature d'un autre type,
        `PROVISION_CATEGORY_REQUIRED`. À la modification, omise, elle reste celle du risque ;
        `INACTIVE_REFERENCE_OBJECT` ne vaut que si la valeur change la catégorie du risque : sa
        catégorie inchangée, désactivée depuis, est acceptée, comme le parent d'un nœud ou la
        catégorie d'un rôle (`updateOrgNode`, `updateResourceRole`) ; une autre, envoyée pour un
        risque qui n'est pas identifié, est refusée par 409, `STATE_FORBIDS_OPERATION`,
        `params.missing_condition` à `risk_identified`, ce que la commande `update_provision` dit
        d'avance.
    provision_subproject_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        Le sous-projet auquel appartient la ligne de provision, facultatif ; nul ou omis à la
        déclaration, elle compte hors sous-projet (WF-RIS-0010, WF-RAE-0020). Un sous-projet que
        le projet n'a pas est refusé par 422, `UNKNOWN_SUBPROJECT`. À la modification, omis, il
        reste celui du risque ; `null` retire la provision de son sous-projet ; un autre, envoyé
        pour un risque qui n'est pas identifié, est refusé comme la catégorie, par
        `risk_identified`.
    provision_task_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        La tâche de la structure principale de la révision en cours qui porte la ligne de
        provision, facultative : « à défaut de désignation, elle est portée par la première tâche
        de premier niveau de la structure » (WF-RIS-0010, #786). Une récapitulative la porte comme
        une feuille ; la ligne n'entre pas dans l'état de sa tâche (WF-PLA-0040). Un nœud qui
        n'est pas une tâche de cette structure — une ligne, une tâche d'une autre structure, un
        identifiant inconnu — est refusé par 422, `UNKNOWN_TASK`. À la modification, omise, elle
        reste celle du risque ; `null` la rend à la première tâche de premier niveau ; une autre
        déplace la ligne sur elle, le total du devis inchangé. Changée pour un risque qui n'est pas
        identifié, elle est refusée comme la catégorie, par `risk_identified` (`update_provision`).

RiskUpdate:
  type: object
  required: [label, lock_version]
  description: >-
    Modification d'un risque : son libellé, sa description, ses actions de mitigation, et la
    catégorie, le sous-projet et la tâche de sa provision, avec le compteur lu, qu'une création
    n'a pas. Elle ne reçoit pas la probabilité : modifier la probabilité est un réexamen daté,
    que seul `reviewRisk` écrit et que l'historique montre (WF-RIS-0010, WF-RIS-0040 ; décision
    de l'auteur du 2026-10-28, H-04). La catégorie, le sous-projet et la tâche de la provision,
    omis, restent ceux du risque ; changés, ils ne le sont que tant que le risque est identifié
    (WF-RIS-0010, `update_provision`).
  properties:
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    mitigation_notes:
      anyOf: [{ type: string }, { type: 'null' }]
    provision_cost_category_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        La catégorie que porte la ligne de provision, refusée par les motifs de la déclaration
        (`RiskWrite.provision_cost_category_id`). Omise, elle reste celle du risque ;
        `INACTIVE_REFERENCE_OBJECT` ne vaut que si la valeur change la catégorie du risque ; une
        autre, envoyée pour un risque qui n'est pas identifié, est refusée par 409,
        `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `risk_identified`, ce que la
        commande `update_provision` dit d'avance.
    provision_subproject_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        Le sous-projet de la ligne de provision (`RiskWrite.provision_subproject_id`). Omis, il
        reste celui du risque ; `null` retire la provision de son sous-projet ; un autre, envoyé
        pour un risque qui n'est pas identifié, est refusé comme la catégorie, par
        `risk_identified`.
    provision_task_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        La tâche qui porte la ligne de provision (`RiskWrite.provision_task_id`). Omise, elle
        reste celle du risque ; `null` la rend à la première tâche de premier niveau ; une autre
        déplace la ligne sur elle, le total du devis inchangé. Changée pour un risque qui n'est
        pas identifié, elle est refusée comme la catégorie, par `risk_identified`
        (`update_provision`).
    lock_version: { $ref: ../common.yaml#/LockVersion }

RiskReview:
  type: object
  required: [reviewed_on, probability, severity, state]
  description: >-
    Réexamen : l'acte par lequel un utilisateur confirme ou modifie la probabilité
    et l'état d'un risque, daté du jour où il est fait (WF-RIS-0010, WF-RIS-0020).
  properties:
    reviewed_on: { $ref: ../common.yaml#/PlanningDate }
    probability: { $ref: ../common.yaml#/Percent }
    severity: { $ref: ../common.yaml#/Money }
    state: { $ref: '#/RiskState' }
    actor: { $ref: ../common.yaml#/ActorRef }

RiskReviewWrite:
  type: object
  required: [probability, state, lock_version]
  description: >-
    La confirmation sans modification produit un réexamen daté (WF-RIS-0010). Un risque écarté
    qui redevient identifié recrée sa ligne de provision avec la catégorie qu'il désignait si elle
    est encore active et de type provision pour risques — une catégorie rattachée depuis à une
    nature d'un autre type ne l'est plus (#747) ; sinon la catégorie est demandée, comme à la
    déclaration
    (`provision_cost_category_id`), ce que `Risk.provision_cost_category_is_active` dit d'avance.
    Sur une structure principale sans tâche, ce retour est refusé par 409,
    `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `at_least_one_task` (WF-RIS-0010,
    #787) ; sans aucune catégorie active de type provision pour risques, par
    `active_provision_category` (WF-RIS-0010). Il se fait hors sous-projet quand le sous-projet que le risque désignait a été
    supprimé depuis, la désignation passée à nul (décision de l'auteur, #732). Son annulation rend
    au risque son état précédent et la catégorie qu'il désignait avant ce retour, la catégorie
    choisie au retour comprise (WF-IHM-0110, WF-RIS-0020). La tâche qui porte la ligne recréée
    est dite par `reviewRisk` (#1227).
  properties:
    probability:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      description: De `0` à `1` inclus, un rapport (WF-RIS-0010).
    state:
      type: string
      enum: [identified, dismissed]
    provision_cost_category_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        La catégorie de la provision d'un risque écarté qui redevient identifié, quand celle
        qu'il désignait n'est plus active, ou n'est plus de type provision pour risques
        (`Risk.provision_cost_category_is_active` faux) :
        omise, elle est la seule catégorie active de type
        provision pour risques, et refusée par 422, `VALUE_REQUIRED`, quand il en existe
        plusieurs ; les autres refus sont ceux de la déclaration (`RiskWrite`). Ignorée quand la
        catégorie désignée est encore active et de type provision pour risques, ou quand le risque
        ne redevient pas identifié.
    lock_version: { $ref: ../common.yaml#/LockVersion }

RiskOccurrence:
  type: object
  required: [confirmed, main_structure_lock_version, risk_lock_version, creates_current_revision]
  description: >-
    Déclare le risque survenu : fusionne son devis propre dans la structure principale de la
    révision en cours, à la place que dit `declareRiskOccurrence`, chaque ligne fusionnée
    gardant ses grandeurs, avec un montant budgété nul et pour réestimé le montant que ses
    grandeurs et ses dates donnent ; la ligne de provision est retirée, et le risque garde son
    coût à la survenance (`Risk.occurrence_cost`). Ne marque aucune révision et ne déplace pas
    la référence (WF-RIS-0060). Définitif : aucune commande ne l'annule, seul l'abandon de la
    révision en cours la défait (WF-RIS-0060). La confirmation suit le compte rendu préalable
    (`getRiskOccurrenceReport`) et porte les deux compteurs qu'il a lus, et s'il créait la
    révision en cours : la structure principale ou le risque changés depuis — et le risque change
    aussi à toute saisie dans son devis propre (`Risk.lock_version`) —, ou une révision en cours
    née depuis la lecture, ou disparue, elle est refusée par 412 et rien n'est fusionné — c'est ce
    compte rendu que l'utilisateur a confirmé, comme pour la fusion d'un différentiel
    (`StructureMerge`, WF-IHM-0110 ; US-0680).
  properties:
    confirmed:
      type: boolean
      const: true
    main_structure_lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        Le compteur de la structure principale que le compte rendu a lu
        (`RiskOccurrenceReport.main_structure_lock_version`) — celle de la révision en cours, ou,
        sans révision en cours, celle de la dernière révision marquée.
    risk_lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        Le compteur du risque que le compte rendu a lu (`RiskOccurrenceReport.risk_lock_version`),
        qui avance aussi à toute saisie dans son devis propre (`Risk.lock_version`).
    creates_current_revision:
      type: boolean
      description: >-
        Ce que le compte rendu a lu (`RiskOccurrenceReport.creates_current_revision`), renvoyé
        tel que lu : vrai alors qu'une révision en cours est née depuis la lecture, ou faux alors
        qu'il n'y en a plus, la confirmation est refusée par 412.

RiskOccurrenceReport:
  type: object
  required:
    - main_structure_lock_version
    - risk_lock_version
    - creates_current_revision
    - differences
    - provision_amount
    - refusals
  description: >-
    Compte rendu de la survenance d'un risque, présenté avant sa confirmation (WF-RIS-0060 ;
    US-0680, #1383) : ce qu'elle ferait de la structure principale de la révision en cours, et du
    reste à engager. Il reprend les éléments du compte rendu de la fusion d'un différentiel
    (`StructureMergeReport`), et se lit de même. Les deux tableaux sont toujours rendus, vides quand
    il n'y a rien à dire ; la survenance ne s'applique que si `refusals` est vide. Il rend les
    compteurs lus, et s'il crée la révision en cours, que la confirmation renvoie
    (`RiskOccurrence`).
  properties:
    main_structure_lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        Le compteur de la structure principale lue (`CostStructure.lock_version`) — celle de la
        révision en cours, ou, sans révision en cours, celle de la dernière révision marquée : une
        saisie qui l'écrit depuis rend le compte rendu périmé, et la confirmation est refusée par
        412.
    risk_lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        Le compteur du risque lu (`Risk.lock_version`), de même. Il avance aussi à toute saisie
        dans le devis propre du risque, dont le compte rendu liste les tâches et les lignes : une
        saisie qui l'écrit depuis rend le compte rendu périmé.
    creates_current_revision:
      type: boolean
      description: >-
        Vrai quand le projet n'a pas de révision en cours : la survenance crée d'abord la révision
        en cours par copie de la dernière révision marquée, chiffrée aux taux conservés, projetés,
        puis y fusionne le devis propre, dans la même tâche de fond — « Lorsque le projet ne
        comporte pas de révision en cours, elle en crée une au préalable » (WF-RIS-0060,
        WF-REV-0010, WF-REV-0060). Ses écarts et ses motifs de refus sont alors jugés sur la
        structure principale de la révision marquée, que la copie reprend telle quelle, et
        `main_structure_lock_version` est le compteur de celle-ci, que le marquage a figé, comme
        pour la fusion d'un différentiel (`StructureMergeReport.creates_current_revision`, #790)
        et comme le risque se lit (`getRisk`, `revision_id` absent). Faux quand le projet a une
        révision en cours. Une révision en cours née depuis la lecture fait refuser la
        confirmation par 412.
    differences:
      type: array
      description: >-
        Les écarts que la survenance ferait dans la structure principale, comme ceux d'une fusion
        (`ImportDifference`), dans cet ordre : les tâches et les lignes du devis propre, ajoutées
        (`added`) dans l'ordre de son plan — ses tâches de premier niveau en dernière position sous
        la tâche qui porte la ligne de provision, ou, quand c'est un jalon, immédiatement après
        lui, sous sa tâche parente ou au premier niveau ; un ajout n'a pas encore de lignée, et les
        liaisons internes du devis propre viennent avec ses tâches — ; la tâche porteuse modifiée
        (`updated`), devenue la récapitulative de ces tâches, `fields` nommant ce qui change
        d'elle, ses dates et sa durée couvrant désormais celles de ses subordonnées (WF-PLA-0040)
        — un jalon, qui reste un jalon sans sous-tâche, n'est pas modifié — ; la ligne de provision
        retirée (`removed`). Les tâches ajoutées gardent leurs subordonnées, leurs liaisons
        internes, leurs durées et leurs modes, une tâche sans prédécesseur dans le devis propre
        passant en mode manuel aux dates qu'elle y avait ; les lignes ajoutées portent un montant
        budgété nul (WF-RIS-0060).
      items: { $ref: exchanges.yaml#/ImportDifference }
    provision_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Le montant de la ligne de provision retirée, qui quitte le reste à engager — la provision
        du risque (`Risk.provision_amount`) ; le reste à engager augmente du total du devis propre,
        moins ce montant (WF-RIS-0060).
    refusals:
      type: array
      description: >-
        Les motifs qui refusent la survenance entière, chacun avec les paramètres qu'il porte
        quand la tâche de fond échoue (`ReportRefusal`) — ainsi `TASK_WITHOUT_WORKING_HOURS`, une
        tâche fusionnée dont une ligne de main-d'œuvre a un rôle sans aucune heure travaillée dans
        la semaine (WF-PLA-0010). Vide quand la survenance s'applique.
      items: { $ref: exchanges.yaml#/ReportRefusal }

RiskMatrixCell:
  type: object
  required: [probability_level, severity_level, zone]
  description: >-
    La case d'un risque : ses niveaux sur les bornes de la matrice, et la zone que
    l'installation donne à la case (WF-RIS-0040, WF-REF-0160). Sur une assiette nulle — un
    projet sans budget de référence dont le devis ne porte encore que des provisions —, la
    gravité ne se rapporte à rien : le risque est au niveau de gravité le plus bas, `1`, sa
    part de gravité non calculable (`RiskMatrixPoint.severity_ratio`, #1240).
  properties:
    probability_level: { type: integer, minimum: 1, maximum: 4 }
    severity_level: { type: integer, minimum: 1, maximum: 4 }
    zone: { $ref: reference.yaml#/AlertZone }

RiskMatrixLevel:
  type: object
  required: [level, lower, upper]
  description: >-
    Un niveau d'un axe de la matrice et ses bornes, que le référentiel fixe (WF-REF-0160) :
    la borne basse comprise, la borne haute exclue, nulle au dernier niveau, qui n'en a
    pas. Un pourcentage : de probabilité sur l'axe des probabilités, de l'assiette du projet
    sur l'axe des gravités — son budget de référence ou, avant lui, le total hors provisions
    du devis de sa révision courante (WF-REF-0160) —, celle de chaque projet, ce qui vaut
    aussi pour la matrice du portefeuille.
  properties:
    level: { type: integer, minimum: 1, maximum: 4 }
    lower: { $ref: ../common.yaml#/Percent }
    upper:
      anyOf: [{ $ref: ../common.yaml#/Percent }, { type: 'null' }]

RiskMatrixPoint:
  type: object
  required:
    - risk_id
    - label
    - probability
    - severity_amount
    - severity_ratio
    - provision_amount
    - state
    - zone
  description: >-
    Un risque que la matrice retient, à ses valeurs exactes, pour que le graphique le place
    sans rien calculer (WF-RIS-0040, WF-ARC-0020, #1053) : sa probabilité en abscisse, sa
    gravité en part de l'assiette en ordonnée, sa gravité en montant pour la taille de sa
    bulle. Ses valeurs sont celles du risque lu (`Risk`), et sa zone celle de sa case
    (`Risk.matrix_cell`). Dans la matrice du portefeuille, il nomme aussi son projet :
    `project_id`, `project_label` et `can_open` vont ensemble, présents tous les trois dans
    la matrice du portefeuille, absents tous les trois dans celle d'un projet.
  properties:
    risk_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string }
    probability: { $ref: ../common.yaml#/Percent }
    severity_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: La gravité du risque (`Risk.severity`), ce qu'il coûterait s'il survenait.
    severity_ratio:
      allOf: [{ $ref: indicators.yaml#/Computable }]
      description: >-
        La gravité en part de l'assiette du projet du risque — son budget de référence, ou
        avant lui le total hors provisions du devis de sa révision courante (WF-REF-0160) —,
        arrondie à quatre décimales (README, « Une part… »). La case du risque et sa zone
        sont celles de la part exacte, que les bornes de gravité classent avant l'arrondi :
        une bulle à moins d'un demi-centième de pour cent d'une borne peut être tracée sur la
        ligne de cette borne, dans la case que dit `zone`. Non calculable sur une assiette
        nulle, motif `no_reference_budget` — un projet sans budget de référence dont le devis
        ne porte encore que des provisions — : le risque est alors au niveau de gravité le
        plus bas (`RiskMatrixCell`), compté dans sa case, et le graphique, qui n'a pas
        d'ordonnée pour lui, ne trace pas sa bulle (#1240).
    provision_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: La provision du risque (`Risk.provision_amount`, WF-RIS-0010).
    state: { $ref: '#/RiskState' }
    zone:
      allOf: [{ $ref: reference.yaml#/AlertZone }]
      description: La zone de la case du risque, que le serveur classe (WF-IHM-0070).
    project_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: Le projet du risque, dans la matrice du portefeuille seulement.
    project_label:
      type: string
      description: Le libellé de ce projet, dans la matrice du portefeuille seulement.
    can_open:
      type: boolean
      description: >-
        Si l'appelant peut ouvrir le projet du risque (WF-ADM-0110), comme
        `PortfolioRisks.heaviest[].can_open`, dans la matrice du portefeuille seulement ;
        faux, la bulle nomme le risque et son projet, sans mener au détail (WF-PTF-0030).

RiskMatrix:
  type: object
  required: [probability_levels, severity_levels, cells, points, totals]
  description: >-
    Matrice remplie par les risques lus, avec les bornes de ses niveaux, pour que ses axes
    se nomment sans lire le référentiel (WF-RIS-0040, WF-REF-0160) : ceux du projet dans
    la révision lue (`revision_id`, WF-RIS-0030) pour la matrice d'un projet, ceux des
    projets retenus pour celle du portefeuille. Elle les compte par case (`cells`) et les
    rend un par un (`points`), les mêmes.
  properties:
    probability_levels:
      type: array
      minItems: 4
      maxItems: 4
      description: Les quatre niveaux de probabilité, du plus bas au plus haut, en pourcentage.
      items: { $ref: '#/RiskMatrixLevel' }
    severity_levels:
      type: array
      minItems: 4
      maxItems: 4
      description: >-
        Les quatre niveaux de gravité, du plus bas au plus haut, en pourcentage de l'assiette
        du projet — son budget de référence ou, avant lui, le total hors provisions du devis de
        sa révision courante (WF-REF-0160).
      items: { $ref: '#/RiskMatrixLevel' }
    cells:
      type: array
      items:
        type: object
        required: [probability_level, severity_level, count, zone]
        properties:
          probability_level: { type: integer, minimum: 1, maximum: 4 }
          severity_level: { type: integer, minimum: 1, maximum: 4 }
          count: { type: integer, minimum: 0 }
          zone: { $ref: reference.yaml#/AlertZone }
    points:
      type: array
      description: >-
        Un point par risque que la matrice retient — ceux que comptent ses cases —, avec son
        état, que l'écran filtre comme il filtre la grille (#1053) ; vide quand aucun risque
        n'est retenu.
      items: { $ref: '#/RiskMatrixPoint' }
    totals: { $ref: '#/ProvisionTotals' }

ProvisionTotals:
  type: object
  required: [identified, occurred, dismissed, total, reserve]
  description: >-
    Les trois totaux de provisions, distincts — les identifiés pour leur provision
    courante, les survenus et les écartés pour celle qu'ils portaient dans la révision
    de référence, chacun la somme des `Risk.provision_amount` de son état —, leur total
    général, et la réserve pour risques en regard (`RiskCoverageTotals.reserve`, WF-RIS-0040,
    WF-RIS-0050), calculés par le serveur sur les
    risques retenus — tous ceux que les filtres retiennent, quelle que soit la page lue
    (`listRisks`, #1367).
  properties:
    total: { $ref: ../common.yaml#/Money }
    identified: { $ref: ../common.yaml#/Money }
    occurred: { $ref: ../common.yaml#/Money }
    dismissed: { $ref: ../common.yaml#/Money }
    reserve:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: La réserve pour risques, celle de la couverture (`RiskCoverageTotals.reserve`).

RiskCoverageTotals:
  type: object
  required: [reserve, remaining_provisions, occurred_cost, coverage_variance]
  description: >-
    Les quatre montants de la couverture des risques : la réserve pour risques, la somme des
    provisions des risques identifiés dans la révision courante, la somme des coûts à la
    survenance des risques survenus, et l'écart de couverture, signé,
    reserve − (remaining_provisions + occurred_cost) (WF-RIS-0050). La terminaison ou la
    réestimation des tâches issues d'un risque survenu ne change ni le coût des survenus ni
    l'écart de couverture (WF-RIS-0050).
  properties:
    reserve:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        La réserve pour risques de la révision de référence (WF-RIS-0050) : la somme des
        provisions des risques identifiés qu'elle porte, ses lignes de provision, augmentée de
        la provision que portaient, dans la référence précédente, les risques survenus ou
        écartés avant elle — à chaque nouvelle référence, la réserve garde ce qu'elle devait
        aux risques sortis de l'état identifié. Un avenant ne la diminue jamais, même quand il
        intègre au budget de référence les lignes d'un risque survenu : la provision de ce
        risque a été consommée à sa survenance, et son coût reste compté à la couverture.
    remaining_provisions:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        La somme des provisions des risques identifiés dans la révision lue, celles que portent
        leurs lignes de provision (`Risk.provision_amount`).
    occurred_cost:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        La somme des coûts à la survenance des risques survenus (`Risk.occurrence_cost`,
        WF-RIS-0010) : le total de leur devis propre au moment de la survenance, que ni les
        réestimations ni la terminaison des tâches fusionnées ne changent (WF-RIS-0050).
    coverage_variance:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        L'écart de couverture (WF-RIS-0050) : la réserve moins la somme des provisions restantes
        et du coût des risques survenus, positif quand la réserve couvre encore, négatif quand
        elle est dépassée — le sens de la marge du reste à engager
        (`RemainingIndicators.delta_to_reference`).

RiskCoverage:
  allOf:
    - $ref: '#/RiskCoverageTotals'
    - type: object
      required: [context]
      properties:
        context: { $ref: indicators.yaml#/CalculationContext }
  description: >-
    La couverture des risques d'un projet, à une date et dans une révision (WF-RIS-0050,
    WF-RAE-0020).
