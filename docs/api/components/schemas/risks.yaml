# Risks and provisions (FBS-4.6).

RiskState:
  type: string
  enum: [identified, occurred, dismissed]
  description: >-
    Identified, occurred, dismissed. A dismissed risk can become identified again; the
    occurrence is final: no transition leaves the occurred state and no command undoes it;
    only abandoning the current revision reverts it, the risk becoming identified again there
    with its provision (`abandonRevision`, WF-RIS-0020, WF-RIS-0060).

Risk:
  type: object
  required:
    - risk_id
    - label
    - description
    - mitigation_notes
    - probability
    - severity
    - provision_amount
    - occurrence_cost
    - occurred_reestimated_amount
    - state
    - structure_id
    - provision_node_id
    - provision_cost_category_id
    - provision_cost_category_label
    - provision_cost_category_is_active
    - provision_subproject_id
    - provision_subproject_label
    - provision_task
    - matrix_cell
    - last_review_on
    - computed_fields
    - available_commands
    - audit
    - lock_version
  description: >-
    The severity is the total of the risk's own structure and the provision is that severity
    weighted by the probability: neither is entered (WF-RIS-0010), and the risk names what
    they depend on (`computed_fields`). It carries its commands, available or not
    (`available_commands`, WF-IHM-0090). Its probability is written only through the review
    (`reviewRisk`, WF-RIS-0010).
  properties:
    risk_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Null when none is entered.
    mitigation_notes:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Null when none is entered.
    probability: { $ref: ../common.yaml#/Percent }
    severity:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: Computed, never entered (WF-RIS-0010).
    provision_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        For an identified risk, its current provision, the severity weighted by the probability,
        which its provision line carries. For an occurred or dismissed risk, which no longer
        carries a line, the provision it held in the reference revision, `0.00` if it was not
        identified there (WF-RIS-0040, WF-RIS-0050): the register row thus sums into the totals
        (`ProvisionTotals`). Never in the reference budget (WF-RIS-0050).
    occurrence_cost:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: >-
        The cost at occurrence of an occurred risk: the total of its own estimate at the moment
        it was declared occurred, which neither the re-estimations nor the completion of the
        merged tasks change, and which the coverage compares with the reserve (WF-RIS-0010,
        WF-RIS-0050, WF-RIS-0060; `RiskCoverageTotals.occurred_cost`). A revision data item,
        which abandoning the revision in which the risk occurred erases (WF-RIS-0020).
        Null for an identified or dismissed risk.
    occurred_reestimated_amount:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: >-
        For an occurred risk, the sum of the current reestimated amounts, inflation included, of
        the lines of the revision read that came from it (`Node.origin_risk_id`, WF-RIS-0060):
        what the lines that its occurrence merged cost today, which the register presents
        alongside the cost at occurrence (`occurrence_cost`) to show its drift. Information
        outside the coverage, whose variance remains computed on the cost at occurrence
        (`RiskCoverageTotals.occurred_reestimated`, WF-RIS-0050; #1761). Null for an identified
        or dismissed risk.
    state: { $ref: '#/RiskState' }
    structure_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        The risk's own cost structure, in the revision read (`revision_id`), which freezes a
        version of it (WF-RIS-0030).
    provision_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        Provision line carried by the main structure (WF-RIS-0010). Null when the risk is not
        identified — occurred or dismissed —: it then carries no provision line.
    provision_cost_category_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        The category of the provision-for-risks type that the risk designated for its provision
        — at its declaration, or since, while it was identified —, which its provision line
        carries while it is identified (WF-RIS-0010, WF-REF-0030). A dismissed risk keeps it:
        once identified again, its line takes it back if it is still active and of the
        provision-for-risks type, and otherwise the category is asked for as at the declaration
        (`RiskReviewWrite.provision_cost_category_id`), which
        `provision_cost_category_is_active` states in advance.
    provision_cost_category_label:
      type: string
      description: >-
        The label of this category, resolved at read time, active or deactivated, which the
        register and the form present without reading the reference data (WF-ARC-0020,
        WF-REF-0150).
    provision_cost_category_is_active:
      type: boolean
      description: >-
        Computed at read time: true when this category is active and its cost type is of the
        provision-for-risks type — its cost type is then active too, deactivating a cost type
        deactivating its categories (WF-REF-0010; EP-14/L42s, C-291). False for a deactivated
        category, or one attached since to a cost type of another type: a category that no line
        uses any more, that of a dismissed risk, can change cost type (WF-REF-0030), and it is
        then no longer "among the active categories of the provision-for-risks type"
        (WF-RIS-0010; #747). When false, the return of the dismissed risk to the identified
        state asks for another category (`RiskReviewWrite.provision_cost_category_id`,
        WF-RIS-0010): the front reads it, without comparing the category with the lists of the
        reference data.
    provision_subproject_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        The subproject that the risk designated, optionally, for its provision, and to which its
        provision line belongs; when null, the line counts in the "hors sous-projet" set
        (WF-RIS-0010, WF-RAE-0020, WF-IND-0020). Deleting the subproject sets to null the
        designation of every risk that is not identified: once identified again, its provision
        counts outside any subproject — the author settled this on 2026-10-10 (author's
        decision, #732). The affected risk then has its `lock_version` advance and its audit name
        the author of the deletion (WF-DAT-0070, WF-IHM-0110).
    provision_subproject_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The label of this subproject, resolved at read time; null for a provision outside any
        subproject.
    provision_task:
      anyOf: [{ $ref: '#/ProvisionTask' }, { type: 'null' }]
      description: >-
        The task of the main structure of the revision read that carries the provision line
        (`provision_node_id`), by its node and its label, resolved at read time: the one the risk
        designated at its declaration or since, while it was identified, and failing that the
        first top-level task (WF-RIS-0010, #786). A dismissed risk that becomes identified again
        gets back the task it designated if that is still a task of the main structure, and
        otherwise the first top-level task (`reviewRisk`, #1227). The form presents it and
        offers it again without reading the structure again (WF-ARC-0020).
        Null when the risk is not identified: it then carries no provision line.
    matrix_cell: { $ref: '#/RiskMatrixCell' }
    last_review_on:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: >-
        The day of its last review, which the grid presents (WF-RIS-0040): its declaration, a
        review (`reviewRisk`) or its occurrence.
    computed_fields:
      type: array
      description: >-
        The fields of the risk that the server computes, each with what it depends on, which the
        refusal of an entry names (WF-IHM-0030): the severity and the provision, in that order,
        for every risk, then the cost at occurrence of an occurred risk. The severity depends on
        the own estimate (`own_estimate`); the provision of an identified risk, on its severity
        and its probability (`severity_and_probability`), that of an occurred or dismissed risk,
        on the reference revision (`reference_provision`); the cost at occurrence, on the own
        estimate at the moment of the occurrence (`occurrence_estimate`). The rules of the
        computation, not the lines of the own estimate: they are read with the risk, without
        calling on the refusal.
      minItems: 2
      maxItems: 3
      items: { $ref: '#/RiskComputedField' }
    available_commands:
      type: array
      description: >-
        Commands of the risk that the caller has permission to exercise, each available or
        not, with the conditions it lacks (WF-IHM-0090), in the order of `RiskCommand`. A
        command absent from the list is not presented. The risk names only what depends on it
        — its state, its citation by a marked revision — and, for the occurrence, the revision
        that the occurrence would create; the conditions of the project and of the revision are
        on their commands (`ProjectCommand.declare_risk_occurrence`,
        `RevisionCommand.edit_risks`). The risk of a terminal project lists none
        (US-0702/L3). A call sent despite the list is refused with its error code.
      items: { $ref: '#/RiskCommandAvailability' }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        Lock version of the risk, a single one for its identity and its assessment: it advances
        on each write of the risk — the change of its identity (`updateRisk`) as well as the
        change of its provision (`updateRiskProvision`) —, and never goes back: abandoning a
        revision advances it, the assessment read changing (H-02, #1782). It also advances on
        any entry in
        its own estimate (`structure_id`) — a cell, a paste, a move, a creation, a deletion
        —, from which it takes its severity (WF-RIS-0010): the report of its occurrence, which
        describes that estimate, is thus made stale by such an entry (`RiskOccurrence`). It
        likewise advances when the subproject it designated is deleted
        (`provision_subproject_id`, #732).

ProvisionTask:
  type: object
  required: [node_id, label]
  description: >-
    The task of the main structure that carries the provision line of a risk
    (WF-RIS-0010), by its node and its label, as a refusal names a task.
  properties:
    node_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 300 }

RiskCommand:
  type: string
  enum:
    - update
    - update_provision
    - review
    - declare_occurrence
    - delete
  description: >-
    Commands carried by a risk (WF-IHM-0090): edit its identity, project data
    (`updateRisk`), change the category, the subproject or the task of its provision, an entry
    in the current revision (`updateRiskProvision`; H-02, #1782), review it —
    dismiss it or re-identify it (`reviewRisk`, `RiskReviewWrite.state`) —, declare it occurred
    (`declareRiskOccurrence`), delete it (`deleteRisk`). `update_provision`, always listed
    with `update`, states in advance that the category, the subproject and the task of the
    provision change only while the risk is identified, `risk_identified` missing otherwise
    (WF-RIS-0010; EP-14/L42p, #786), as `update_win_probability` states it for the win
    probability of a project; it names only `risk_identified`, for an occurred risk as for a
    dismissed one. The entries are under `risks.write`; the change of the provision, the
    review and the deletion also fall under risk entry in the revision (`edit_risks`), the
    change of the identity does not. An occurred risk has the change, the review and the
    deletion unavailable, `risk_not_occurred` missing, no transition leaving it (WF-RIS-0020),
    and the deletion of a risk that a marked revision cites names `risk_not_cited`. The
    declaration of occurrence is guarded by the `risk_occurrence` permission alone — it
    includes the merge that it triggers and does not require `structure_merge` (WF-ADM-0100) —;
    unavailable for a risk that is not identified, `risk_identified` missing, and, when the
    project has no current revision, for whoever lacks `revisions.write`,
    `may_create_revision` missing: it would create it (WF-RIS-0060).

RiskCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/RiskCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Empty when the command is available.
      items: { $ref: projects.yaml#/CommandCondition }

RiskComputedField:
  type: object
  required: [field, dependencies]
  description: A computed field of a risk, and what it depends on (WF-IHM-0030).
  properties:
    field:
      type: string
      enum: [severity, provision_amount, occurrence_cost]
    dependencies:
      type: array
      minItems: 1
      uniqueItems: true
      description: Each rule once, in the order in which to state it.
      items: { $ref: revisions.yaml#/ComputedDependency }

RiskWrite:
  type: object
  required: [label, probability]
  description: >-
    Declaration of a risk (WF-RIS-0010). On a main structure without a task, it is refused
    with 409, `STATE_FORBIDS_OPERATION`, `params.missing_condition` set to `at_least_one_task`
    (EP-14/L42s). The category of its provision is designated among the active categories of
    the provision-for-risks type; when only one exists, it is retained without being asked
    for, and the field can be omitted. Without any, the declaration is likewise refused with
    409, `params.missing_condition` set to `active_provision_category`. The `declare_risk`
    command states both conditions in advance (EP-14/L42s). The subproject of the provision
    is optional, as is the task that carries it: without a designation, the first top-level
    task of the main structure (WF-RIS-0010, #786).
  properties:
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Null or absent, the risk has none.
    mitigation_notes:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Null or absent, the risk has none.
    probability:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      description: From `0` to `1` inclusive, a ratio (WF-RIS-0010).
    provision_cost_category_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        The category that the provision line carries (WF-RIS-0010, WF-REF-0030). Omitted at the
        declaration, it is the only active category of the provision-for-risks type; omitted
        when several exist, it is refused with 422, `VALUE_REQUIRED`; unknown,
        `UNKNOWN_COST_CATEGORY`; deactivated, which every category of a deactivated cost type
        is, `INACTIVE_REFERENCE_OBJECT` (WF-REF-0010, C-291); of a cost type of another type,
        `PROVISION_CATEGORY_REQUIRED`. It is then changed through `updateRiskProvision`
        (`RiskProvisionUpdate`), while the risk is identified.
    provision_subproject_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        The subproject to which the provision line belongs, optional; null or omitted at the
        declaration, the line counts outside any subproject (WF-RIS-0010, WF-RAE-0020). A
        subproject that the project does not have is refused with 422, `UNKNOWN_SUBPROJECT`. It
        is then changed through `updateRiskProvision`, like the category.
    provision_task_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        The task of the main structure of the current revision that carries the provision line,
        optional: "failing a designation, it is carried by the first top-level task of the
        structure" (WF-RIS-0010, #786). A summary task carries it like a leaf; the line does not
        enter into the state of its task (WF-PLA-0040). A node that is not a task of this
        structure — a line, a task of another structure, an unknown identifier — is refused with
        422, `UNKNOWN_TASK`. It is then changed through `updateRiskProvision`, like the category.
        Null or absent, the first top-level task carries the line.

RiskUpdate:
  type: object
  required: [label, lock_version]
  description: >-
    Change of the identity of a risk — its label, its description, its mitigation note,
    project data (WF-RIS-0020, §4.4.1) —, with the lock version read, which a creation does not
    have. It accepts neither the probability — changing it is a dated review, which only
    `reviewRisk` writes and which the history shows (WF-RIS-0010, WF-RIS-0040; author's
    decision of 2026-10-28, H-04) —, nor the category, the subproject and the task of the
    provision, held by the revision, which `updateRiskProvision` writes
    (`RiskProvisionUpdate`; H-02, #1782).
  properties:
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Null, the risk has none.
    mitigation_notes:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Null, the risk has none.
    lock_version: { $ref: ../common.yaml#/LockVersion }

RiskProvisionUpdate:
  type: object
  required: [lock_version]
  description: >-
    Change of the provision of an identified risk: the category, the subproject and the task of
    its provision line, an entry in the current revision (WF-RIS-0010, WF-RIS-0020; H-02,
    #1782), with the risk's lock version as read. Each omitted field stays that of the risk;
    changed for a risk that is not identified, they are refused with 409
    `STATE_FORBIDS_OPERATION`, `params.missing_condition` set to `risk_identified`, which the
    `update_provision` command states in advance.
  properties:
    provision_cost_category_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        The category that the provision line carries, refused on the grounds of the declaration
        (`RiskWrite.provision_cost_category_id`). Omitted, it stays that of the risk;
        `INACTIVE_REFERENCE_OBJECT` applies only if the value changes the risk's category: its
        unchanged category, deactivated since, is accepted, like the parent of a node or the
        category of a role (`updateOrgNode`, `updateResourceRole`).
    provision_subproject_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        The subproject of the provision line (`RiskWrite.provision_subproject_id`). Omitted, it
        stays that of the risk; `null` removes the provision from its subproject.
    provision_task_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        The task that carries the provision line (`RiskWrite.provision_task_id`). Omitted, it
        stays that of the risk; `null` gives it back to the first top-level task; another task
        moves the line onto it, the estimate total unchanged (WF-RIS-0010, #786).
    lock_version: { $ref: ../common.yaml#/LockVersion }

RiskReview:
  type: object
  required: [reviewed_on, probability, severity, state]
  description: >-
    Review: the act by which a user confirms or changes the probability
    and the state of a risk, dated on the day it is made (WF-RIS-0010, WF-RIS-0020).
  properties:
    reviewed_on: { $ref: ../common.yaml#/PlanningDate }
    probability: { $ref: ../common.yaml#/Percent }
    severity: { $ref: ../common.yaml#/Money }
    state: { $ref: '#/RiskState' }
    actor: { $ref: ../common.yaml#/ActorRef }

RiskReviewWrite:
  type: object
  required: [probability, state, lock_version]
  description: >-
    Confirmation without change produces a dated review (WF-RIS-0010). A dismissed risk that
    becomes identified again recreates its provision line with the category it designated if
    that category is still active and of the provision-for-risks type — a category attached
    since to a cost type of another type no longer is (#747); otherwise the category is asked
    for, as at the declaration
    (`provision_cost_category_id`), which `Risk.provision_cost_category_is_active` states in
    advance. On a main structure without a task, this return is refused with 409,
    `STATE_FORBIDS_OPERATION`, `params.missing_condition` set to `at_least_one_task`
    (WF-RIS-0010, #787); without any active category of the provision-for-risks type, with
    `active_provision_category` (WF-RIS-0010). It takes place outside any subproject when the
    subproject that the risk designated has been deleted since, the designation set to null
    (author's decision, #732). Undoing it gives the risk back its previous state and the
    category it designated before this return, including the category chosen at the return
    (WF-IHM-0110, WF-RIS-0020). The task that carries the recreated line is stated by
    `reviewRisk` (#1227).
  properties:
    probability:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      description: From `0` to `1` inclusive, a ratio (WF-RIS-0010).
    state:
      type: string
      enum: [identified, dismissed]
    provision_cost_category_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        The category of the provision of a dismissed risk that becomes identified again, when
        the one it designated is no longer active, or no longer of the provision-for-risks type
        (`Risk.provision_cost_category_is_active` false):
        omitted, it is the only active category of the
        provision-for-risks type, and refused with 422, `VALUE_REQUIRED`, when several
        exist; the other refusals are those of the declaration (`RiskWrite`). Ignored when the
        designated category is still active and of the provision-for-risks type, or when the
        risk does not become identified again.
    lock_version: { $ref: ../common.yaml#/LockVersion }

RiskOccurrence:
  type: object
  required: [confirmed, main_structure_lock_version, risk_lock_version, creates_current_revision]
  description: >-
    Declares the risk occurred: merges its own estimate into the main structure of the current
    revision, at the place that `declareRiskOccurrence` states, each merged line keeping its
    quantities, with a zero budgeted amount and as reestimated amount the amount that its
    quantities and its dates give; the provision line is removed, and the risk keeps its cost
    at occurrence (`Risk.occurrence_cost`). Marks no revision and does not move the reference
    (WF-RIS-0060). Final: no command undoes it, only abandoning the current revision reverts it
    (WF-RIS-0060). The confirmation follows the preliminary report
    (`getRiskOccurrenceReport`) and carries the two lock versions it read, and whether it was
    creating the current revision: with the main structure or the risk changed since — and the
    risk also changes on any entry in its own estimate (`Risk.lock_version`) —, or a current
    revision born since the read, or gone, it is refused with 412 and nothing is merged — it is
    this report that the user confirmed, as for the merge of a differential
    (`StructureMerge`, WF-IHM-0110; US-0680).
  properties:
    confirmed:
      type: boolean
      const: true
    main_structure_lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        The lock version of the main structure that the report read
        (`RiskOccurrenceReport.main_structure_lock_version`) — that of the current revision, or,
        without a current revision, that of the last marked revision.
    risk_lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        The lock version of the risk that the report read
        (`RiskOccurrenceReport.risk_lock_version`), which also advances on any entry in its own
        estimate (`Risk.lock_version`).
    creates_current_revision:
      type: boolean
      description: >-
        What the report read (`RiskOccurrenceReport.creates_current_revision`), sent back as
        read: true while a current revision has been born since the read, or false while there
        is none any more, the confirmation is refused with 412.

RiskOccurrenceReport:
  type: object
  required:
    - main_structure_lock_version
    - risk_lock_version
    - creates_current_revision
    - differences
    - provision_amount
    - refusals
  description: >-
    Report of the occurrence of a risk, presented before its confirmation (WF-RIS-0060;
    US-0680, #1383): what it would do to the main structure of the current revision, and to the
    remaining to commit. It takes up the elements of the report of the merge of a differential
    (`StructureMergeReport`), and reads the same way. Both arrays are always returned, empty when
    there is nothing to say; the occurrence applies only if `refusals` is empty. It returns the
    lock versions read, and whether it creates the current revision, which the confirmation
    sends back (`RiskOccurrence`).
  properties:
    main_structure_lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        The lock version of the main structure read (`CostStructure.lock_version`) — that of the
        current revision, or, without a current revision, that of the last marked revision: an
        entry that writes to it since makes the report stale, and the confirmation is refused
        with 412.
    risk_lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        The lock version of the risk read (`Risk.lock_version`), likewise. It also advances on
        any entry in the risk's own estimate, whose tasks and lines the report lists: an entry
        that writes to it since makes the report stale.
    creates_current_revision:
      type: boolean
      description: >-
        True when the project has no current revision: the occurrence first creates the current
        revision by copying the last marked revision, priced at the kept rates, projected, then
        merges the own estimate into it, in the same background task — "When the project has no
        current revision, it creates one beforehand" (WF-RIS-0060, WF-REV-0010, WF-REV-0060).
        Its differences and its grounds for refusal are then judged on the main structure of the
        marked revision, which the copy takes over as is, and `main_structure_lock_version` is
        the lock version of that structure, which the marking froze, as for the merge of a
        differential (`StructureMergeReport.creates_current_revision`, #790) and as the risk is
        read (`getRisk`, `revision_id` absent). False when the project has a current revision. A
        current revision born since the read has the confirmation refused with 412.
    differences:
      type: array
      description: >-
        The differences that the occurrence would make in the main structure, like those of a
        merge (`ImportDifference`), in this order: the tasks and the lines of the own estimate,
        added (`added`) in the order of its plan — its top-level tasks in last position under the
        task that carries the provision line, or, when that is a milestone, immediately after
        it, under its parent task or at the top level; an addition has no lineage yet, and the
        internal links of the own estimate come with its tasks —; the carrying task changed
        (`updated`), now the summary task of these tasks, `fields` naming what changes about
        it, its dates and its duration now covering those of its subordinates (WF-PLA-0040)
        — a milestone, which remains a milestone without subtasks, is not changed —; the
        provision line removed (`removed`). The added tasks keep their subordinates, their
        internal links, their durations and their modes, a task without a predecessor in the own
        estimate switching to manual mode at the dates it had there; the added lines take a zero
        budgeted amount (WF-RIS-0060).
      items: { $ref: exchanges.yaml#/ImportDifference }
    provision_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        The amount of the removed provision line, which leaves the remaining to commit — the
        provision of the risk (`Risk.provision_amount`); the remaining to commit increases by the
        total of the own estimate, minus this amount (WF-RIS-0060).
    refusals:
      type: array
      description: >-
        The grounds that refuse the whole occurrence, each with the parameters it carries when
        the background task fails (`ReportRefusal`) — such as `TASK_WITHOUT_WORKING_HOURS`, a
        merged task one of whose labour lines has a role without any working hour in the week
        (WF-PLA-0010). Empty when the occurrence applies.
      items: { $ref: exchanges.yaml#/ReportRefusal }

RiskMatrixCell:
  type: object
  required: [probability_level, severity_level, zone]
  description: >-
    The cell of a risk: its levels on the bounds of the matrix, and the zone that the
    installation gives to the cell (WF-RIS-0040, WF-REF-0160). On a zero base — a project
    without a reference budget whose estimate carries only provisions so far —, the severity
    relates to nothing: the risk is at the lowest severity level, `1`, its severity share not
    computable (`RiskMatrixPoint.severity_ratio`, #1240).
  properties:
    probability_level: { type: integer, minimum: 1, maximum: 4 }
    severity_level: { type: integer, minimum: 1, maximum: 4 }
    zone: { $ref: reference.yaml#/AlertZone }

RiskMatrixLevel:
  type: object
  required: [level, lower, upper]
  description: >-
    A level of an axis of the matrix and its bounds, which the reference data sets
    (WF-REF-0160): the lower bound included, the upper bound excluded, null at the last level,
    which has none. A percentage: of probability on the probability axis, of the base of the
    project on the severity axis — its reference budget or, before it, the total excluding
    provisions of the estimate of its current revision (WF-REF-0160) —, that of each project,
    which also holds for the portfolio matrix.
  properties:
    level: { type: integer, minimum: 1, maximum: 4 }
    lower: { $ref: ../common.yaml#/Percent }
    upper:
      anyOf: [{ $ref: ../common.yaml#/Percent }, { type: 'null' }]
      description: Null at the last level, which has no upper bound.

RiskMatrixPoint:
  type: object
  required:
    - risk_id
    - label
    - probability
    - severity_amount
    - severity_ratio
    - provision_amount
    - state
    - zone
  description: >-
    A risk that the matrix retains, at its exact values, so that the chart places it without
    computing anything (WF-RIS-0040, WF-ARC-0020, #1053): its probability on the x-axis, its
    severity as a share of the base on the y-axis, its severity as an amount for the size of
    its bubble. Its values are those of the risk read (`Risk`), and its zone that of its cell
    (`Risk.matrix_cell`). In the portfolio matrix, it also names its project:
    `project_id`, `project_label` and `can_open` go together, all three present in the
    portfolio matrix, all three absent in that of a project.
  properties:
    risk_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string }
    probability: { $ref: ../common.yaml#/Percent }
    severity_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: The severity of the risk (`Risk.severity`), what it would cost if it occurred.
    severity_ratio:
      allOf: [{ $ref: indicators.yaml#/Computable }]
      description: >-
        The severity as a share of the base of the risk's project — its reference budget, or
        before it the total excluding provisions of the estimate of its current revision
        (WF-REF-0160) —, rounded to four decimal places (README, "A share…"). The cell of the
        risk and its zone are those of the exact share, which the severity bounds classify
        before rounding: a bubble less than half a hundredth of a percent from a bound may be
        drawn on the line of that bound, in the cell that `zone` states. Not computable on a
        zero base, reason `no_reference_budget` — a project without a reference budget whose
        estimate carries only provisions so far —: the risk is then at the lowest severity
        level (`RiskMatrixCell`), counted in its cell, and the chart, which has no y-value for
        it, does not draw its bubble (#1240).
    provision_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: The provision of the risk (`Risk.provision_amount`, WF-RIS-0010).
    state: { $ref: '#/RiskState' }
    zone:
      allOf: [{ $ref: reference.yaml#/AlertZone }]
      description: The zone of the risk's cell, which the server classifies (WF-IHM-0070).
    project_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: The project of the risk, in the portfolio matrix only.
    project_label:
      type: string
      description: The label of this project, in the portfolio matrix only.
    can_open:
      type: boolean
      description: >-
        Whether the caller can open the risk's project (WF-ADM-0110), like
        `PortfolioRisks.heaviest[].can_open`, in the portfolio matrix only;
        when false, the bubble names the risk and its project, without leading to the detail
        (WF-PTF-0030).

RiskMatrix:
  type: object
  required: [probability_levels, severity_levels, cells, points, totals]
  description: >-
    Matrix filled with the risks read, with the bounds of its levels, so that its axes can
    be named without reading the reference data (WF-RIS-0040, WF-REF-0160): those of the
    project in the revision read (`revision_id`, WF-RIS-0030) for the matrix of a project,
    those of the retained projects for that of the portfolio. It counts the identified risks
    per cell (`cells`), and returns one by one the risks it retains (`points`), with their
    state; its provision totals cover the three states (`totals`, WF-RIS-0040).
  properties:
    probability_levels:
      type: array
      minItems: 4
      maxItems: 4
      description: The four probability levels, from lowest to highest, as a percentage.
      items: { $ref: '#/RiskMatrixLevel' }
    severity_levels:
      type: array
      minItems: 4
      maxItems: 4
      description: >-
        The four severity levels, from lowest to highest, as a percentage of the base of the
        project — its reference budget or, before it, the total excluding provisions of the
        estimate of its current revision (WF-REF-0160).
      items: { $ref: '#/RiskMatrixLevel' }
    cells:
      type: array
      description: >-
        The sixteen cells and their zone, each with the number of identified risks only that it
        holds, the same ones that the chart draws as bubbles: an occurred or dismissed risk
        remains a point (`points`), but is counted in no cell. The server counts, the front
        never does (WF-RIS-0040, WF-ARC-0020, #1395). In the portfolio matrix, whose points are
        only identified risks, each point is counted in its cell.
      items:
        type: object
        required: [probability_level, severity_level, count, zone]
        properties:
          probability_level: { type: integer, minimum: 1, maximum: 4 }
          severity_level: { type: integer, minimum: 1, maximum: 4 }
          count: { type: integer, minimum: 0 }
          zone: { $ref: reference.yaml#/AlertZone }
    points:
      type: array
      description: >-
        One point per risk that the matrix retains, with its state, which the screen filters as
        it filters the grid (#1053) — its cells count only the identified ones (`cells`, #1395)
        —; empty when no risk is retained.
      items: { $ref: '#/RiskMatrixPoint' }
    totals: { $ref: '#/ProvisionTotals' }

ProvisionTotals:
  type: object
  required: [identified, occurred, dismissed, total, reserve]
  description: >-
    The three provision totals, distinct — the identified risks for their current provision,
    the occurred and the dismissed ones for the one they held in the reference revision, each
    the sum of the `Risk.provision_amount` of its state —, their grand total, and the risk
    reserve alongside (`RiskCoverageTotals.reserve`, WF-RIS-0040,
    WF-RIS-0050), computed by the server on the
    retained risks — all those that the filters retain, whatever the page read
    (`listRisks`, #1367).
  properties:
    total: { $ref: ../common.yaml#/Money }
    identified: { $ref: ../common.yaml#/Money }
    occurred: { $ref: ../common.yaml#/Money }
    dismissed: { $ref: ../common.yaml#/Money }
    reserve:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: The risk reserve, that of the coverage (`RiskCoverageTotals.reserve`).

RiskCoverageTotals:
  type: object
  required: [reserve, remaining_provisions, occurred_cost, occurred_reestimated, coverage_variance]
  description: >-
    The four amounts of the risk coverage: the risk reserve, the sum of the provisions of the
    risks identified in the current revision, the sum of the costs at occurrence of the
    occurred risks, and the coverage variance, signed,
    reserve − (remaining_provisions + occurred_cost) (WF-RIS-0050). The completion or the
    re-estimation of the tasks that came from an occurred risk changes neither the cost of the
    occurred risks nor the coverage variance (WF-RIS-0050). Alongside the cost of the occurred
    risks, the current reestimated amount of the lines that came from them
    (`occurred_reestimated`), which shows their drift without entering into the
    variance (#1761).
  properties:
    reserve:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        The risk reserve of the reference revision (WF-RIS-0050): the sum of the provisions of
        the identified risks that it holds, its provision lines, increased by the provision that
        the risks that occurred or were dismissed before it held in the previous reference — at
        each new reference, the reserve keeps what it owed to the risks that left the identified
        state. An amendment never decreases it, even when it brings into the reference budget
        the lines of an occurred risk: the provision of that risk was consumed at its
        occurrence, and its cost remains counted in the coverage.
    remaining_provisions:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        The sum of the provisions of the identified risks in the revision read, those that their
        provision lines carry (`Risk.provision_amount`).
    occurred_cost:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        The sum of the costs at occurrence of the occurred risks (`Risk.occurrence_cost`,
        WF-RIS-0010): the total of their own estimate at the moment of the occurrence, which
        neither the re-estimations nor the completion of the merged tasks change (WF-RIS-0050).
    occurred_reestimated:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        The sum of the current reestimated amounts of the lines that came from the occurred
        risks (`Risk.occurred_reestimated_amount`), presented alongside the cost at occurrence
        (`occurred_cost`): information on the drift of the occurred risks, which the coverage
        variance does not count, and which follows the re-estimations and completions that the
        cost at occurrence ignores (WF-RIS-0050, WF-RIS-0060; #1761). `0.00` without an occurred
        risk.
    coverage_variance:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        The coverage variance (WF-RIS-0050): the reserve minus the sum of the remaining
        provisions and of the cost of the occurred risks, positive when the reserve still covers,
        negative when it is exceeded — the direction of the margin of the remaining to commit
        (`RemainingIndicators.delta_to_reference`).

RiskCoverage:
  allOf:
    - $ref: '#/RiskCoverageTotals'
    - type: object
      required: [context]
      properties:
        context: { $ref: indicators.yaml#/CalculationContext }
  description: >-
    The risk coverage of a project, at a date and in a revision (WF-RIS-0050,
    WF-RAE-0020).
