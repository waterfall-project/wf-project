# Portefeuille (FBS-2). Aucune donnée en propre : ces vues somment ce que les
# projets portent déjà, lisent les indicateurs conservés (WF-DAT-0040) et ne
# permettent aucune saisie (WF-PTF-0030). Un indice de portefeuille est un rapport
# de sommes, jamais une moyenne d'indices (WF-PTF-0020).

PortfolioScope:
  type: object
  required: [states, as_of, org_node_label, project_count]
  description: Périmètre effectivement retenu, renvoyé avec chaque vue (WF-PTF-0010).
  properties:
    states:
      type: array
      items: { $ref: projects.yaml#/ProjectState }
    as_of: { $ref: ../common.yaml#/PlanningDate }
    from:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
    to:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
    org_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    org_node_label:
      anyOf:
        - { type: string, minLength: 1, maxLength: 200 }
        - type: 'null'
      description: >-
        Le libellé du nœud d'organisation retenu, résolu à la lecture, qu'il soit actif ou
        désactivé (WF-REF-0150), que l'en-tête de la vue nomme ; nul sans nœud.
    project_count: { type: integer, minimum: 0 }

PortfolioProjectRow:
  type: object
  required: [project_id, label, state, can_open, last_marked_at]
  description: >-
    Ligne de la liste des projets (WF-PTF-0040). Un projet que l'appelant ne peut pas ouvrir y
    figure sous son libellé et son code, compte dans les totaux, et `can_open` est faux
    (WF-PTF-0030).
  properties:
    project_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string }
    code:
      anyOf: [{ type: string }, { type: 'null' }]
    state: { $ref: projects.yaml#/ProjectState }
    can_open:
      type: boolean
      description: >-
        Si l'appelant peut ouvrir le projet, évalué par le serveur selon WF-ADM-0110 : la
        permission de consulter et la qualité de contributeur, ou la permission « consulter
        tous les projets ». Faux, la ligne se présente sans lien (WF-PTF-0030) ; le front n'en
        déduit rien des permissions de `getMe`.
    reference_budget:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
    current_estimate:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: Devis courant, présenté à la place du budget pour un projet en chiffrage.
    win_probability:
      anyOf: [{ $ref: ../common.yaml#/Percent }, { type: 'null' }]
    project_manager_projection:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: >-
        Projection à terminaison du chef de projet, coût réel et reste à engager
        (WF-IND-0050) ; nulle hors d'un projet en cours.
    delta_to_reference:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: >-
        Écart de cette projection au budget de référence, positif quand elle le dépasse :
        budget 1 000, coût réel 500, reste à engager 550, projection 1 050, écart 50
        (WF-PTF-0040). Nul hors d'un projet en cours.
    cost_index:
      anyOf: [{ $ref: indicators.yaml#/IndexValue }, { type: 'null' }]
    schedule_index:
      anyOf: [{ $ref: indicators.yaml#/IndexValue }, { type: 'null' }]
    last_marked_at:
      anyOf: [{ $ref: ../common.yaml#/Timestamp }, { type: 'null' }]

PortfolioValue:
  type: object
  required: [scope, order_book, pipeline_gross, pipeline_weighted, delivered, conversion_rate]
  description: >-
    Carnet, pipeline brut et pondéré, réalisé, et taux de transformation
    (WF-PTF-0050).
  properties:
    scope: { $ref: '#/PortfolioScope' }
    order_book: { $ref: ../common.yaml#/Money }
    pipeline_gross: { $ref: ../common.yaml#/Money }
    pipeline_weighted: { $ref: ../common.yaml#/Money }
    delivered: { $ref: ../common.yaml#/Money }
    conversion_rate: { $ref: indicators.yaml#/Computable }

PortfolioWorkload:
  type: object
  required: [scope, under_load_threshold, months, roles]
  description: >-
    Charges sommées par rôle et par mois : sur le reste à engager pour les projets
    en cours, sur le devis pondéré pour les projets en chiffrage inclus
    (WF-PTF-0060).
  properties:
    scope: { $ref: '#/PortfolioScope' }
    under_load_threshold:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      description: >-
        Le seuil de sous-charge retenu, toujours rendu : celui que la requête a demandé, ou,
        sans demande, celui que le serveur a choisi, que l'écran montre (WF-PTF-0060).
    months:
      type: array
      description: >-
        Les mois de l'horizon, croissants et sans trou ; les colonnes. Chaque rôle porte
        un mois par mois de cette liste, dans le même ordre.
      items: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
    roles:
      type: array
      items:
        type: object
        required: [resource_role_id, label, months]
        properties:
          resource_role_id: { $ref: ../common.yaml#/Uuid }
          label: { type: string }
          capacity_monthly_hours: { $ref: ../common.yaml#/Hours }
          months:
            type: array
            description: >-
              Un mois par mois de `months`, dans le même ordre, un mois sans charge compris.
            items:
              type: object
              required: [month, hours, load_ratio]
              properties:
                month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
                hours: { $ref: ../common.yaml#/Hours }
                load_ratio: { $ref: indicators.yaml#/Computable }
                zone: { $ref: reference.yaml#/AlertZone }

PortfolioPerformance:
  type: object
  required: [scope, cost_index, schedule_index, projections, zone_distribution, quarterly]
  description: Indices agrégés, répartition par zone et évolution trimestrielle (WF-PTF-0070).
  properties:
    scope: { $ref: '#/PortfolioScope' }
    reference_budget: { $ref: ../common.yaml#/Money }
    cost_index: { $ref: indicators.yaml#/IndexValue }
    schedule_index: { $ref: indicators.yaml#/IndexValue }
    cost_variance:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        L'écart de coût : la valeur acquise moins le coût réel, positif quand le travail fait a
        coûté moins que son budget, négatif au-delà — une valeur acquise de 400 pour un coût réel
        de 500 donne -100 (WF-IND-0070, glossaire), sommé sur le périmètre.
    schedule_variance:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        L'écart de délai : la valeur acquise moins la valeur planifiée, positif en avance,
        négatif en retard — une valeur acquise de 400 pour une valeur planifiée de 500 donne -100
        (WF-IND-0080, glossaire), sommé sur le
        périmètre.
    projections: { $ref: indicators.yaml#/Projections }
    zone_distribution:
      type: array
      items:
        type: object
        required: [index, zone, project_count]
        properties:
          index:
            type: string
            enum: [cost, schedule]
          zone: { $ref: reference.yaml#/AlertZone }
          project_count: { type: integer, minimum: 0 }
    quarterly:
      type: array
      items:
        type: object
        required: [quarter, cost_index, schedule_index]
        properties:
          quarter: { type: string, pattern: '^\d{4}-Q[1-4]$' }
          cost_index: { $ref: indicators.yaml#/Computable }
          schedule_index: { $ref: indicators.yaml#/Computable }

PortfolioCostStructure:
  type: object
  required: [scope, budget_by_cost_type, remaining_by_cost_type, labor_by_org_node]
  description: >-
    Ventilation par nature du budget de référence et du reste à engager, et
    main-d'œuvre par nœud d'organisation. Aucune ventilation du coût réel par
    nature (WF-PTF-0080).
  properties:
    scope: { $ref: '#/PortfolioScope' }
    budget_by_cost_type:
      type: array
      items: { $ref: indicators.yaml#/AmountByKey }
    remaining_by_cost_type:
      type: array
      items: { $ref: indicators.yaml#/AmountByKey }
    labor_by_org_node:
      type: array
      items: { $ref: indicators.yaml#/AmountByKey }

PortfolioRisks:
  type: object
  required: [scope, identified_total, heaviest, matrix, coverage, period_outcome]
  description: >-
    Risques tous projets confondus, avec la couverture des risques agrégée : chaque
    montant est la somme de celui des projets en cours du périmètre (WF-PTF-0090,
    WF-RIS-0050).
  properties:
    scope: { $ref: '#/PortfolioScope' }
    identified_total: { $ref: ../common.yaml#/Money }
    heaviest:
      type: array
      items:
        type: object
        required: [risk_id, label, project_id, project_label, can_open, provision_amount]
        properties:
          risk_id: { $ref: ../common.yaml#/Uuid }
          label: { type: string }
          project_id: { $ref: ../common.yaml#/Uuid }
          project_label: { type: string }
          can_open:
            type: boolean
            description: >-
              Si l'appelant peut ouvrir le projet du risque (WF-ADM-0110), comme
              `PortfolioProjectRow.can_open` ; faux, le risque est nommé avec son projet, sans
              lien (WF-PTF-0030).
          provision_amount: { $ref: ../common.yaml#/Money }
    matrix: { $ref: risks.yaml#/RiskMatrix }
    coverage:
      allOf: [{ $ref: risks.yaml#/RiskCoverageTotals }]
      description: >-
        Couverture des risques agrégée : la somme des réserves de référence des projets en
        cours, face aux sommes de leurs provisions restantes et du coût de leurs risques
        survenus, et l'écart de couverture agrégé, différence des sommes (WF-PTF-0090,
        WF-RIS-0050).
    period_outcome:
      type: object
      required: [occurred_provisions, dismissed_provisions]
      properties:
        occurred_provisions: { $ref: ../common.yaml#/Money }
        dismissed_provisions: { $ref: ../common.yaml#/Money }

PortfolioCostCurve:
  type: object
  required: [scope, payment_delays, series, cash_out_by_month]
  description: >-
    Courbe en S du portefeuille : somme, mois par mois, des trois courbes de coûts cumulés
    des projets du périmètre (WF-IND-0100) — le budget de référence, le coût réel jusqu'à
    la date de calcul, la projection du chef de projet au-delà. Demandée avec les délais de
    paiement, elle somme les décaissements des projets et `cash_out_by_month` les détaille
    par mois (WF-PTF-0100).
  properties:
    scope: { $ref: '#/PortfolioScope' }
    payment_delays:
      type: boolean
      description: >-
        Vrai quand les séries sont celles des décaissements, chaque projet rendant les
        siennes avec ses délais de paiement et les provisions de ses risques identifiés
        (WF-IND-0100). Faux sinon.
    series:
      type: array
      items:
        type: object
        required: [name, points]
        properties:
          name:
            type: string
            enum: [reference_budget, actual_cost, project_manager_projection]
          points:
            type: array
            items:
              type: object
              required: [date, amount]
              properties:
                date: { $ref: ../common.yaml#/PlanningDate }
                amount: { $ref: ../common.yaml#/Money }
    cash_out_by_month:
      anyOf:
        - type: array
          items: { $ref: indicators.yaml#/CashOutMonth }
        - type: 'null'
      description: >-
        Les décaissements par mois, sommes de ceux des projets, rendus quand
        `payment_delays` est vrai ; nul sinon (WF-PTF-0100).

PilotHealth:
  type: object
  required: [scope, signals]
  description: >-
    Quatre signaux qui se constatent sans jugement, et dont l'absence rend les
    autres vues trompeuses (WF-PTF-0110). Chacun porte sa zone dans l'échelle commune
    des signalements, que le serveur classe et dont le front ne déduit rien (WF-IHM-0070).
  properties:
    scope: { $ref: '#/PortfolioScope' }
    signals:
      type: array
      items:
        type: object
        required: [project_id, project_label, can_open, code, zone]
        properties:
          project_id: { $ref: ../common.yaml#/Uuid }
          project_label: { type: string }
          can_open:
            type: boolean
            description: >-
              Si l'appelant peut ouvrir le projet du signal (WF-ADM-0110), comme
              `PortfolioProjectRow.can_open` ; faux, le signal nomme son projet sans lien
              (WF-PTF-0030).
          zone: { $ref: reference.yaml#/AlertZone }
          code:
            type: string
            enum:
              - review_overdue
              - risks_not_reviewed
              - no_actual_cost_since_last_review
              - contractual_milestone_overdue
          params:
            type: object
            description: >-
              Ce que le signal nomme, selon son code : `review_overdue`,
              `weeks_since_last_mark`, les semaines écoulées depuis la dernière révision
              marquée, que le délai maximal du référentiel ne tient plus (WF-REF-0180) ;
              `contractual_milestone_overdue`, le jalon dépassé — `lineage_id`,
              `milestone_label` — et sa date de référence, `reference_date`. Les deux autres
              ne nomment que leur projet, et n'en portent pas.
            properties:
              weeks_since_last_mark: { type: integer, minimum: 1 }
              lineage_id: { $ref: ../common.yaml#/Uuid }
              milestone_label: { type: string, minLength: 1 }
              reference_date: { $ref: ../common.yaml#/PlanningDate }
