# Portfolio (FBS-2). No data of its own: these views sum what the projects already
# carry and allow no data entry (WF-PTF-0030). On the current day, each project
# contributes through its current revision — the revision in progress, or the last
# marked one when it has none, with the actual cost of the day (WF-IND-0010,
# WF-PTF-0010); at a past date, through the stored indicators (WF-DAT-0040). A
# portfolio index is a ratio of sums, never an average of indices
# (WF-PTF-0020).

PortfolioScope:
  type: object
  required: [states, as_of, from, to, org_node_id, org_node_label, project_count]
  description: >-
    Scope actually retained, returned with each view (WF-PTF-0010). On the current day, each
    project contributes to it through its current revision: the revision in progress, or the
    last marked revision when it has none — a project whose review has just been marked
    contributes through it (WF-PTF-0010, WF-IND-0010).
  properties:
    states:
      type: array
      description: >-
        The states requested (`states`), or the projects in progress when none is requested,
        whether or not the view counts each of them: the same rule for all views
        (WF-PTF-0010).
      items: { $ref: projects.yaml#/ProjectState }
    as_of: { $ref: ../common.yaml#/PlanningDate }
    from:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: >-
        Start of the period retained; null, like `to`, for a view that retains no period: the
        project list read with neither `from` nor `to`, and the workload (`PortfolioFrom`).
    to:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: End of the period retained; null, like `from`, when no period is retained.
    org_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: The organisation node retained (`org_node_id`); null without a node.
    org_node_label:
      anyOf:
        - { type: string, minLength: 1, maxLength: 200 }
        - type: 'null'
      description: >-
        The label of the organisation node retained, resolved on reading, whether it is active
        or deactivated (WF-REF-0150), which the header of the view names; null without a node.
    project_count: { type: integer, minimum: 0 }

PortfolioProjectRow:
  type: object
  required:
    - project_id
    - code
    - label
    - state
    - can_open
    - reference_budget
    - current_estimate
    - win_probability
    - project_manager_projection
    - delta_to_reference
    - cost_index
    - schedule_index
    - last_marked_at
  description: >-
    Row of the project list (WF-PTF-0040). A project that the caller cannot open appears in it
    under its label and its code, counts in the totals, and `can_open` is false
    (WF-PTF-0030).
  properties:
    project_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string }
    code:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Null as long as the project code is not entered (WF-PRJ-0010).
    state: { $ref: projects.yaml#/ProjectState }
    can_open:
      type: boolean
      description: >-
        Whether the caller can open the project, evaluated by the server according to
        WF-ADM-0110: the read permission and the status of contributor, or the permission "view
        all projects". When false, the row is presented without a link (WF-PTF-0030); the front
        infers nothing about it from the permissions of `getMe`.
    reference_budget:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: >-
        Null for a project without a reference revision, before In progress: its current estimate is
        presented instead (`current_estimate`).
    current_estimate:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: >-
        Current estimate, presented in place of the budget for a project in pricing. Null for a
        project that is not in pricing, which presents its reference budget, and for a project in
        pricing that has no revision yet.
    win_probability:
      anyOf: [{ $ref: ../common.yaml#/Percent }, { type: 'null' }]
    project_manager_projection:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: >-
        Project manager's projection at completion, actual cost and remaining to commit
        (WF-IND-0050); null outside a project in progress.
    delta_to_reference:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: >-
        Variance of this projection to the reference budget, positive when it exceeds it:
        budget 1,000, actual cost 500, remaining to commit 550, projection 1,050, variance 50
        (WF-PTF-0040). Null outside a project in progress. The same name carries the opposite
        sign in the remaining to commit, a margin, -50 in the same case
        (`RemainingIndicators.delta_to_reference`), and the sign of this variance in the
        estimate, the estimate minus the reference (`EstimateIndicators.delta_to_reference`):
        the description of each field gives its sign.
    cost_index:
      anyOf: [{ $ref: indicators.yaml#/IndexValue }, { type: 'null' }]
      description: >-
        Null for a project that has not reached the In progress state, which has no project
        indicators (WF-IND-0010).
    schedule_index:
      anyOf: [{ $ref: indicators.yaml#/IndexValue }, { type: 'null' }]
      description: >-
        Null for a project that has not reached the In progress state, which has no project
        indicators (WF-IND-0010).
    last_marked_at:
      anyOf: [{ $ref: ../common.yaml#/Timestamp }, { type: 'null' }]
      description: >-
        Instant of the marking of the last marked revision; null for a project that has none.

PortfolioValue:
  type: object
  required: [scope, order_book, pipeline_gross, pipeline_weighted, delivered, conversion_rate]
  description: >-
    Order book, gross and weighted pipeline, delivered, and conversion rate
    (WF-PTF-0050).
  properties:
    scope: { $ref: '#/PortfolioScope' }
    order_book: { $ref: ../common.yaml#/Money }
    pipeline_gross: { $ref: ../common.yaml#/Money }
    pipeline_weighted: { $ref: ../common.yaml#/Money }
    delivered: { $ref: ../common.yaml#/Money }
    conversion_rate:
      allOf: [{ $ref: indicators.yaml#/Computable }]
      description: >-
        The offers moved from Pricing to In progress over those moved from Pricing to In
        progress or to Lost in the period, whether or not they are in the scope; an abandoned
        offer does not count (WF-PTF-0050). To four decimal places (README, "A share…"); not
        computable without any, `no_offer_out_of_pricing`.

PortfolioWorkload:
  type: object
  required: [scope, under_load_threshold, capacity_monthly_hours, months, monthly_totals, roles]
  description: >-
    Loads summed by role and by month: on the remaining to commit for the projects
    in progress, on the weighted estimate for the projects in pricing included
    (WF-PTF-0060).
  properties:
    scope: { $ref: '#/PortfolioScope' }
    under_load_threshold:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      description: >-
        The under-load threshold retained, always returned: the one the request asked for, or,
        without a request, the one the server chose, `0.5`, which the screen shows
        (WF-PTF-0060). A ratio of the load to the capacity, from `0` to `1` (`Percent`).
    capacity_monthly_hours:
      allOf: [{ $ref: ../common.yaml#/Hours }]
      description: >-
        The capacity of the scope, in hours per month: the sum of the capacities of the roles
        retained (`roles[].capacity_monthly_hours`) — all active roles without a filter, those
        of the organisation node with one (`org_node_id`) —, a role without load counting too
        (#375). The chart of the aggregated workload draws it alongside the bars, without the
        front summing the roles (WF-PTF-0060, WF-ARC-0020, #1051).
    months:
      type: array
      description: >-
        The months of the horizon, ascending and without gaps; the columns. Each role carries
        one month per month of this list, in the same order, and so does `monthly_totals`.
      items: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
    monthly_totals:
      type: array
      description: >-
        The total of the hours of each month of `months`, in the same order, a month without
        load included: the sum of the hours of the roles retained that month, which the top of
        the month's bar carries (WF-PTF-0060, #1051).
      items:
        type: object
        required: [month, hours]
        properties:
          month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
          hours: { $ref: ../common.yaml#/Hours }
    roles:
      type: array
      items:
        type: object
        required: [resource_role_id, label, capacity_monthly_hours, months]
        properties:
          resource_role_id: { $ref: ../common.yaml#/Uuid }
          label: { type: string }
          capacity_monthly_hours: { $ref: ../common.yaml#/Hours }
          months:
            type: array
            description: >-
              One month per month of `months`, in the same order, a month without load
              included.
            items:
              type: object
              required: [month, hours, load_ratio, zone]
              properties:
                month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
                hours: { $ref: ../common.yaml#/Hours }
                load_ratio:
                  allOf: [{ $ref: indicators.yaml#/Computable }]
                  description: >-
                    The load over the capacity, to four decimal places (README, "A share…").
                zone:
                  allOf: [{ $ref: reference.yaml#/AlertZone }]
                  description: >-
                    The zone of the month, classified by the server: `alert` when the load
                    exceeds the capacity, `watch` when the load ratio is below
                    `under_load_threshold`, a role without load included, `nominal` otherwise
                    (WF-PTF-0060, WF-IHM-0070). A role without capacity that month, whose load
                    ratio is not computable (`no_capacity`), is in `alert` when it has load,
                    in `watch` otherwise.

PortfolioPerformance:
  type: object
  required:
    - scope
    - reference_budget
    - cost_index
    - schedule_index
    - cost_variance
    - schedule_variance
    - projections
    - zone_distribution
    - quarterly
  description: >-
    Aggregated indices, distribution by zone and quarterly evolution, on the projects in
    progress of the scope only (WF-PTF-0070).
  properties:
    scope: { $ref: '#/PortfolioScope' }
    reference_budget: { $ref: ../common.yaml#/Money }
    cost_index: { $ref: indicators.yaml#/IndexValue }
    schedule_index: { $ref: indicators.yaml#/IndexValue }
    cost_variance:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        The cost variance: the earned value minus the actual cost, positive when the work done
        cost less than its budget, negative beyond it — an earned value of 400 for an actual cost
        of 500 gives -100 (WF-IND-0070, glossary), summed over the scope.
    schedule_variance:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        The schedule variance: the earned value minus the planned value, positive when ahead,
        negative when behind — an earned value of 400 for a planned value of 500 gives -100
        (WF-IND-0080, glossary), summed over the
        scope.
    projections:
      allOf: [{ $ref: indicators.yaml#/Projections }]
      description: >-
        `at_budget` and `project_manager` are the sums of the projections of the projects in
        progress; `at_observed_rate` is the aggregated reference budget divided by the
        aggregated cost index, not computable as long as the latter is not (WF-PTF-0070,
        WF-PTF-0020): two projects with a budget of 1,000, an earned value of 400 and 500 and
        an actual cost of 500 and 500 give 2,222, not 2,250.
    zone_distribution:
      type: array
      items:
        type: object
        required: [index, zone, project_count]
        properties:
          index:
            type: string
            enum: [cost, schedule]
          zone: { $ref: reference.yaml#/AlertZone }
          project_count: { type: integer, minimum: 0 }
    quarterly:
      type: array
      description: >-
        One point per calendar quarter that the period touches (`from`, `to`; by default the
        twelve months ending on the calculation date, `scope.from` and `scope.to`), from the
        oldest to the most recent: each index is the ratio of the sums of the projects in
        progress at that date (WF-PTF-0020), read on the last day of the quarter according to
        WF-PTF-0010, and at the calculation date for the quarter that contains it
        (WF-PTF-0070).
      items:
        type: object
        required: [quarter, cost_index, schedule_index]
        properties:
          quarter: { type: string, pattern: '^\d{4}-Q[1-4]$' }
          cost_index: { $ref: indicators.yaml#/Computable }
          schedule_index: { $ref: indicators.yaml#/Computable }

PortfolioCostStructure:
  type: object
  required: [scope, budget_by_cost_type, remaining_by_cost_type, labor_by_org_node]
  description: >-
    Breakdown by cost type of the reference budget and of the remaining to commit, and
    labour by organisation node. No breakdown of the actual cost by cost type
    (WF-PTF-0080). The projects in progress and completed of the scope contribute in full,
    a project in pricing included through its current estimate weighted by its win
    probability (WF-PTF-0020, WF-PTF-0080).
  properties:
    scope: { $ref: '#/PortfolioScope' }
    budget_by_cost_type:
      type: array
      description: >-
        The reference budget aggregated by cost type, excluding provision lines
        (WF-IND-0020); the weighted estimate of a project in pricing included stands in for
        it, excluding provision lines like it: an offer at 40 % whose estimate carries a risk
        provision line of 50 adds nothing to its cost type here (WF-PTF-0080, WF-RIS-0050).
      items: { $ref: indicators.yaml#/AmountByKey }
    remaining_by_cost_type:
      type: array
      description: >-
        The remaining to commit aggregated by cost type, provisions included; the weighted
        estimate of a project in pricing included stands in for it, provisions included: the
        same provision line of 50 adds 20 to its cost type here (WF-PTF-0080).
      items: { $ref: indicators.yaml#/AmountByKey }
    labor_by_org_node:
      type: array
      items: { $ref: indicators.yaml#/AmountByKey }

PortfolioRisks:
  type: object
  required: [scope, identified_total, heaviest, matrix, coverage, period_outcome]
  description: >-
    Risks across all projects, with the aggregated risk coverage (WF-PTF-0090,
    WF-RIS-0050). The total, the heaviest and the matrix count the identified risks of the
    projects of the scope, those of a project in pricing included and their provisions
    without weighting (WF-PTF-0020, WF-PTF-0090). The reserve and the coverage are the sums
    of those of the projects in progress and completed of the scope; a project in pricing
    does not enter them, having no reference (WF-PTF-0090).
  properties:
    scope: { $ref: '#/PortfolioScope' }
    identified_total:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        The total of the provisions of the identified risks of the projects of the scope,
        those of a project in pricing included without weighting (WF-PTF-0090, WF-PTF-0020).
    heaviest:
      type: array
      items:
        type: object
        required: [risk_id, label, project_id, project_label, can_open, provision_amount]
        properties:
          risk_id: { $ref: ../common.yaml#/Uuid }
          label: { type: string }
          project_id: { $ref: ../common.yaml#/Uuid }
          project_label: { type: string }
          can_open:
            type: boolean
            description: >-
              Whether the caller can open the project of the risk (WF-ADM-0110), like
              `PortfolioProjectRow.can_open`; when false, the risk is named with its project,
              without a link (WF-PTF-0030).
          provision_amount: { $ref: ../common.yaml#/Money }
    matrix: { $ref: risks.yaml#/RiskMatrix }
    coverage:
      allOf: [{ $ref: risks.yaml#/RiskCoverageTotals }]
      description: >-
        Aggregated risk coverage: the sum of the risk reserves of the projects in progress and
        completed of the scope, against the sums of their remaining provisions and of the
        costs at occurrence of their occurred risks, with alongside the sum of the reestimates
        of the lines that stem from them, and the aggregated coverage variance, difference of
        the sums; a project in pricing does not enter it, having no reference (WF-PTF-0090,
        WF-RIS-0050).
    period_outcome:
      type: object
      required: [occurred_provisions, dismissed_provisions]
      properties:
        occurred_provisions: { $ref: ../common.yaml#/Money }
        dismissed_provisions: { $ref: ../common.yaml#/Money }

PortfolioCostCurve:
  type: object
  required: [scope, payment_delays, series, cash_out_by_month]
  description: >-
    Portfolio S-curve: sum, month by month, of the three cumulative cost curves of the
    projects of the scope (WF-IND-0100) — the reference budget, the actual cost up to the
    calculation date, the project manager's projection beyond it. Requested with the payment
    delays, it sums the projects' cash-out and `cash_out_by_month` details it by month
    (WF-PTF-0100). It runs over the twelve months preceding that of the calculation date,
    then over the `horizon_months` months from it, in monthly steps like `CurveSeries`
    (WF-IND-0100). A project in pricing included brings to it the curves of its current
    estimate, weighted by its win probability: excluding provision lines for the reference
    budget, provisions included for the projection — an offer at 40 % whose estimate carries
    100 excluding provisions and a provision of 50 brings 40 to the final cumulative budget
    and 60 to the projection (WF-PTF-0100).
  properties:
    scope: { $ref: '#/PortfolioScope' }
    payment_delays:
      type: boolean
      description: >-
        True when the series are those of the cash-out, each project returning its own with
        its payment delays and the provisions of its identified risks (WF-IND-0100). False
        otherwise.
    series:
      type: array
      items:
        type: object
        required: [name, points]
        properties:
          name:
            type: string
            enum: [reference_budget, actual_cost, project_manager_projection]
          points:
            type: array
            items:
              type: object
              required: [date, amount]
              properties:
                date: { $ref: ../common.yaml#/PlanningDate }
                amount: { $ref: ../common.yaml#/Money }
    cash_out_by_month:
      anyOf:
        - type: array
          items: { $ref: indicators.yaml#/CashOutMonth }
        - type: 'null'
      description: >-
        The cash-out by month, sums of that of the projects, returned when
        `payment_delays` is true; null otherwise (WF-PTF-0100).

PilotHealth:
  type: object
  required: [scope, signals]
  description: >-
    Four signals that are observed without judgement, and whose absence makes the
    other views misleading (WF-PTF-0110). Each carries its zone in the common scale of
    flags, which the server classifies and from which the front infers nothing (WF-IHM-0070).
  properties:
    scope: { $ref: '#/PortfolioScope' }
    signals:
      type: array
      items:
        type: object
        required: [project_id, project_label, can_open, code, zone]
        properties:
          project_id: { $ref: ../common.yaml#/Uuid }
          project_label: { type: string }
          can_open:
            type: boolean
            description: >-
              Whether the caller can open the project of the signal (WF-ADM-0110), like
              `PortfolioProjectRow.can_open`; when false, the signal names its project without
              a link (WF-PTF-0030).
          zone:
            allOf: [{ $ref: reference.yaml#/AlertZone }]
            description: >-
              `alert` for an overdue contractual milestone (`contractual_milestone_overdue`),
              `watch` for the three other signals (WF-PTF-0110, WF-IHM-0070).
          code:
            type: string
            enum:
              - review_overdue
              - risks_not_reviewed
              - no_actual_cost_since_last_review
              - contractual_milestone_overdue
          params:
            type: object
            description: >-
              What the signal names, according to its code: `review_overdue`,
              `weeks_since_last_mark`, the weeks elapsed since the last marked revision, beyond
              the maximum interval set in the reference data (WF-REF-0180);
              `contractual_milestone_overdue`, the overdue milestone — `lineage_id`,
              `milestone_label` — and its reference date, `reference_date`. The other two
              name only their project, and carry none.
            properties:
              weeks_since_last_mark: { type: integer, minimum: 1 }
              lineage_id: { $ref: ../common.yaml#/Uuid }
              milestone_label: { type: string, minLength: 1 }
              reference_date: { $ref: ../common.yaml#/PlanningDate }
