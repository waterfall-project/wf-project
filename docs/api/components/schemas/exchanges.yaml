# Échanges par fichier (FLX-01 à FLX-07) et traitements de fond.
# Waterfall n'échange que par ces sept flux (WF-INTF-0150). Un import se déroule
# en deux temps séparés par la décision de l'utilisateur (WF-ARC-0100), et son
# analyse comme son application sont exécutées par le worker (WF-ARC-0090).

FileUpload:
  type: object
  required: [upload_id, purpose, filename, size_bytes, uploaded_at, expires_at, backup_taken_at]
  description: >-
    Fichier déposé, en transit. Il est supprimé dès que l'import est appliqué,
    abandonné ou expiré (WF-DAT-0120, WF-ARC-0100). Une sauvegarde déposée qu'une restauration
    acceptée désigne est gardée jusqu'à la fin de sa tâche, même au-delà de `expires_at`
    (`startRestore`).
  properties:
    upload_id: { $ref: ../common.yaml#/Uuid }
    purpose: { $ref: '#/FileUploadPurpose' }
    filename: { type: string }
    size_bytes: { type: integer, minimum: 1 }
    uploaded_at: { $ref: ../common.yaml#/Timestamp }
    expires_at: { $ref: ../common.yaml#/Timestamp }
    backup_taken_at:
      anyOf: [{ $ref: ../common.yaml#/Timestamp }, { type: 'null' }]
      description: >-
        D'une sauvegarde déposée pour une restauration (`external_backup`), la date que son
        manifeste dit en tête de l'archive, lue à l'achèvement du dépôt par morceaux
        (`completeChunkedUpload`), qui refuse une archive qui n'en dit pas (#1006) : celle de la
        sauvegarde dont elle est la copie (`Backup.taken_at`), la date que la confirmation de la
        restauration énonce et que `RestoreRequest.acknowledged_backup_taken_at` doit répéter
        (WF-ADM-0160). Jamais nulle pour une sauvegarde. Nulle pour le fichier d'un import
        (`uploadFile`), qui n'a pas de date de sauvegarde.

FileUploadPurpose:
  type: string
  enum: [import, external_backup]
  description: >-
    L'usage d'un dépôt, qui le borne : le fichier d'un import, au plus 10 Mio (§4.6.2), déposé
    en une fois par `uploadFile` ; une sauvegarde copiée hors de la plateforme, à restaurer
    (`RestoreRequest.external_backup_upload_id`, WF-ADM-0160), au plus
    `Installation.external_backup_max_bytes`, déposée par morceaux (`openChunkedUpload`,
    `uploadChunk`, `completeChunkedUpload`), `uploadFile` la refusant. Les deux valeurs restent
    dans l'énumération : le `FileUpload` que rend `completeChunkedUpload` emploie
    `external_backup`, et un dépôt se désigne par son usage (`startRestore`, `openImport`).

ChunkedUploadOpen:
  type: object
  required: [filename, size_bytes]
  description: >-
    Ouvre le dépôt par morceaux d'une sauvegarde copiée hors de la plateforme, à restaurer
    (`FileUploadPurpose`, `external_backup`, WF-ADM-0160). Il n'existe pas pour un autre usage :
    le fichier d'un import se dépose en une fois.
  properties:
    filename:
      type: string
      minLength: 1
      maxLength: 255
      description: Le nom du fichier, tel que l'utilisateur l'a choisi ; il reste au dépôt qui s'achève.
    size_bytes:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      description: >-
        La taille entière du fichier, en octets, que le dépôt s'engage à recevoir ; au-delà de
        `Installation.external_backup_max_bytes`, ou qui ne tient pas en 10 000 morceaux de
        `part_size_bytes` au plus (10 000 × 10 Mio), l'ouverture est refusée par 413,
        `FILE_TOO_LARGE`.

ChunkedUpload:
  type: object
  required: [chunked_upload_id, filename, size_bytes, part_size_bytes, part_count, received_parts, expires_at]
  description: >-
    Un dépôt par morceaux, ouvert et pas encore terminé : le fichier est découpé en `part_count`
    morceaux de `part_size_bytes` octets, sauf le dernier, qui reçoit le reste, numérotés à
    partir de 1, que le serveur assemble sur le stockage objet à mesure qu'ils arrivent
    (WF-ARC-0050). Un morceau se redépose tant que le dépôt n'est pas terminé, ce qui permet de
    reprendre un envoi interrompu à partir de `received_parts`, tant que le client a la dernière
    réponse ; aucune opération ne relit un dépôt, et un envoi dont le client a perdu la réponse
    — un rechargement de page — recommence par une ouverture, le dépôt précédent expirant.
  properties:
    chunked_upload_id: { $ref: ../common.yaml#/Uuid }
    filename: { type: string }
    size_bytes: { type: integer, minimum: 1 }
    part_size_bytes:
      type: integer
      minimum: 5242880
      maximum: 10485760
      description: >-
        La taille de chaque morceau sauf le dernier, fixée par le serveur à l'ouverture, entre
        5 Mio et 10 Mio : le stockage objet n'assemble pas de morceau plus petit que 5 Mio, et
        10 Mio est la borne du corps d'une requête que le front porte, celle des imports. Un
        morceau fait exactement cette taille, le dernier recevant le reste (`uploadChunk`).
    part_count:
      type: integer
      minimum: 1
      maximum: 10000
      description: >-
        Le nombre de morceaux, au plus 10 000, la limite des dépôts en plusieurs parties du
        stockage objet : le serveur choisit `part_size_bytes` dans ses bornes pour y tenir.
    received_parts:
      type: array
      description: Les numéros des morceaux reçus, en ordre croissant, sans doublon.
      items: { type: integer, minimum: 1 }
    expires_at:
      allOf: [{ $ref: ../common.yaml#/Timestamp }]
      description: >-
        Vingt-quatre heures après l'ouverture : au-delà, le dépôt et ses morceaux sont
        supprimés, comme un fichier d'import expiré (WF-DAT-0120).

ExchangeKind:
  type: string
  enum:
    - ms_project_schedule
    - estimate
    - remaining
    - actual_costs
  description: >-
    FLX-01 et FLX-02 pour le planning MS Project, FLX-03 et FLX-04 pour le devis,
    FLX-05 et FLX-06 pour le reste à engager, FLX-07 pour les coûts réels.

ImportRequest:
  type: object
  required: [kind, upload_id]
  description: >-
    Ouvre un import : l'analyse lit le fichier, contrôle son format et sa version,
    compare aux données existantes et produit un compte rendu, sans rien modifier
    (WF-ARC-0100, WF-INTF-0070, WF-INTF-0080). L'import s'applique à la révision en
    cours, créée au besoin (WF-INTF-0090).
  properties:
    kind: { $ref: '#/ExchangeKind' }
    upload_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: Un dépôt fait pour un import (`FileUploadPurpose`, `import`).
    structure_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Structure visée ; la structure principale par défaut.
    period_from:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
    period_to:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]

Import:
  type: object
  required: [import_id, kind, filename, status, created_at, expires_at]
  properties:
    import_id: { $ref: ../common.yaml#/Uuid }
    kind: { $ref: '#/ExchangeKind' }
    filename:
      type: string
      description: >-
        Nom du fichier déposé, tel que l'utilisateur l'a envoyé ; il reste au compte rendu
        et à la liste des imports quand le fichier lui-même est supprimé (WF-DAT-0120).
    status:
      type: string
      enum: [analysing, analysed, applying, applied, abandoned, expired, failed]
    created_at: { $ref: ../common.yaml#/Timestamp }
    expires_at:
      allOf: [{ $ref: ../common.yaml#/Timestamp }]
      description: Vingt-quatre heures après l'analyse ; au-delà le compte rendu ne s'applique plus (WF-ARC-0100).
    report:
      anyOf: [{ $ref: '#/ImportReport' }, { type: 'null' }]
    task: { $ref: ../common.yaml#/BackgroundTaskRef }

ImportReport:
  type: object
  required:
    [read_count, rejected, refusals, differences, ignored, completed_tasks, date_mismatches, signals]
  description: >-
    Compte rendu présenté avant application, et relu après elle : lignes lues, lignes
    rejetées avec leur motif, écarts avec les données existantes (WF-INTF-0080), ce que
    l'import a ignoré, les tâches qu'il termine et les écarts de dates ou de durées qu'il
    constate (WF-INTF-0040, WF-PLA-0130). Un import est un aller-retour fondé sur
    l'identifiant que l'export a écrit : un objet du fichier qui le porte met à jour l'objet
    existant, un objet sans identifiant est créé, un objet existant absent du fichier est
    retiré — ou conservé et signalé (`kept`) quand sa tâche est démarrée ou terminée
    (WF-INTF-0040, WF-INTF-0100) ; un reste à engager laisse inchangées, sans les signaler,
    les lignes absentes du fichier (WF-INTF-0120). Un planning exporté puis réimporté sans
    modification ne présente aucun écart : `differences` et `date_mismatches` sont vides
    (WF-INTF-0060). Les tableaux sont toujours rendus, vides quand il n'y a rien à
    dire, pour que l'écran n'ait pas à distinguer un compte rendu qui n'en parle pas d'un
    compte rendu où il n'y a rien. Un fichier rejeté entier se lit à ce que `refusals` n'est pas
    vide : rien ne s'applique, pas même les lignes acceptées, et seul l'abandon reste offert
    (`applyImport`, `import_file_accepted` ; EP-14/L42s).
  properties:
    format_version:
      anyOf: [{ type: string }, { type: 'null' }]
    read_count: { type: integer, minimum: 0 }
    rejected:
      type: array
      description: >-
        Les lignes rejetées, chacune par son rang, et son onglet quand le fichier en a plusieurs,
        avec son motif ; les autres s'appliquent (WF-INTF-0080).
        Parmi elles, d'un devis ou d'un reste à engager, une ligne qui quitterait un sous-projet
        qui a reçu des coûts réels, le compte rendu nommant ce sous-projet (`ImportRejection`,
        WF-INTF-0100, WF-INTF-0120).
      items: { $ref: '#/ImportRejection' }
    refusals:
      type: array
      description: >-
        Les motifs qui rejettent le fichier entier, au lieu d'une ligne (`ReportRefusal`) : un
        planning MS Project qui déplacerait la tâche d'un poste hors du sous-arbre de la tâche de
        son lot — sur la structure principale, seule à porter des rattachements —, « rejeté au
        compte rendu, qui nomme les deux tâches, comme un planning qui dépasse l'horizon »
        (WF-INTF-0040, WF-PLA-0170), et un planning qui porterait la durée du projet au-delà de
        quinze ans (WF-PLA-0150). Vide quand le fichier s'applique (EP-14/L42s).
      items: { $ref: '#/ReportRefusal' }
    differences:
      type: array
      items: { $ref: '#/ImportDifference' }
    ignored:
      type: array
      description: >-
        Ce que l'import a lu sans l'importer, par nature, nommé quand il se nomme
        (WF-INTF-0040) : les ressources et les calendriers du fichier, gérés par Waterfall
        seul, l'avancement, les coûts, les champs personnalisés, et les contraintes de date
        des tâches importées en mode manuel aux dates du fichier. D'une extraction de coûts
        réels, les colonnes du fichier ni lues ni déclarées conservées par la correspondance,
        chacune par son intitulé (`columns`, WF-REF-0190). Vide pour un devis ou un reste à
        engager, qui ne lisent que leurs colonnes.
      items: { $ref: '#/ImportIgnored' }
    completed_tasks:
      type: array
      description: >-
        Les tâches que l'application de l'import termine, parce qu'il met à zéro le reste à
        engager de toutes leurs lignes (WF-INTF-0120, WF-RAE-0040), chacune nommée ; leur date
        de terminaison est le jour de l'application (WF-PLA-0130). Une tâche non démarrée qui
        n'est pas un jalon passe par l'état démarré : démarrée et terminée le jour de
        l'application (`started_on` égal à `completed_on`), seul un jalon allant directement de
        non démarré à terminé (WF-RAE-0030). Vide pour les autres natures d'import.
      items: { $ref: '#/ImportCompletedTask' }
    date_mismatches:
      type: array
      description: >-
        Les tâches dont les dates ou la durée du fichier diffèrent de celles que Waterfall
        recalcule à partir des durées, des liaisons et des calendriers (WF-INTF-0040) : une
        information du compte rendu, pas un motif de confirmation — ce que Waterfall recalcule
        fait foi, et l'écart dit que les deux moteurs ne datent pas de même. Vide sur un
        aller-retour sans modification (WF-INTF-0060), et pour les imports Excel.
      items: { $ref: '#/ImportDateMismatch' }
    signals:
      type: array
      description: >-
        Ce que l'import garde tel que le fichier le porte, et que le compte rendu signale
        (`ImportSignal`) : d'un planning MS Project, la date d'une tâche manuelle sur un jour sans
        aucune heure travaillée au calendrier applicable de la tâche — « la même date importée
        d'un fichier MS Project est gardée et signalée au compte rendu » (WF-PLA-0020 ; #1271,
        #1289). Une information, pas un motif de confirmation ni de rejet. Vide quand il n'y a
        rien à signaler, et pour les imports Excel.
      items: { $ref: '#/ImportSignal' }
    requires_confirmation_reasons:
      type: array
      description: >-
        Motifs d'une confirmation explicite, propres aux coûts réels : des lignes d'un autre
        projet, rejetées, ou un sous-projet inconnu, conservé par son code (WF-CRE-0020). Un
        écart de dates ou de durées n'en est plus un : il est dit par `date_mismatches`.
      items:
        type: string
        enum: [lines_outside_project, unknown_subproject]

ImportIgnoredKind:
  type: string
  enum: [resources, calendars, progress, costs, custom_fields, date_constraints, columns]
  description: >-
    Ce qu'un import MS Project ne lit jamais (WF-INTF-0040) : les ressources et les
    calendriers, gérés par Waterfall seul ; l'avancement, les coûts et les champs
    personnalisés ; et les contraintes de date des tâches, importées en mode manuel aux dates
    du fichier, chaque tâche signalée. D'une extraction de coûts réels, les colonnes du fichier
    ni lues ni déclarées conservées par la correspondance (`columns`), que l'import ignore et
    que le compte rendu nomme par leur intitulé tel que le fichier le porte (WF-REF-0190).

ImportIgnored:
  type: object
  required: [kind, count, labels]
  description: Une nature d'éléments ignorés par l'import, leur nombre, et leurs noms quand ils en ont.
  properties:
    kind: { $ref: '#/ImportIgnoredKind' }
    count:
      type: integer
      minimum: 1
      description: Combien d'éléments de cette nature le fichier portait.
    labels:
      type: array
      description: >-
        Leurs noms, dans l'ordre du fichier, quand ils en ont — le nom d'une ressource ou d'un
        calendrier, le libellé d'une tâche à contrainte de date, l'intitulé d'une colonne d'une
        extraction de coûts réels tel que le fichier le porte ; vide pour ce qui ne se nomme
        pas, l'avancement ou les coûts. Jamais plus de `count`.
      items: { type: string }

ImportCompletedTask:
  type: object
  required: [lineage_id, label, completed_on]
  description: >-
    Une tâche qu'un import termine (WF-PLA-0130, WF-INTF-0120), ou qu'une fusion termine, le
    différentiel la retirant alors qu'elle est démarrée (WF-REV-0050, `StructureMergeReport`).
  properties:
    lineage_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string }
    completed_on:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: >-
        Le jour de l'application de l'import ou de la fusion, la date de terminaison que la
        tâche prend (WF-PLA-0130) — et aussi sa date de démarrage pour une tâche non démarrée
        qui n'est pas un jalon, qui passe par l'état démarré (WF-RAE-0030) ; nul tant que
        l'import ou la fusion n'est pas appliqué.

ImportDateMismatch:
  type: object
  required: [lineage_id, label, fields]
  description: >-
    Une tâche dont le fichier date ou dure autrement que Waterfall ne la recalcule
    (WF-INTF-0040) : la tâche, et les colonnes qui diffèrent.
  properties:
    lineage_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: La lignée de la tâche ; nulle pour une tâche que l'import crée.
    label: { type: string }
    fields:
      type: array
      minItems: 1
      uniqueItems: true
      description: >-
        Les colonnes qui diffèrent, parmi la durée, le début et la fin (`duration`, `start`,
        `finish`), nommées comme les colonnes de la grille de planning.
      items: { $ref: revisions.yaml#/NodeColumn }

ImportSignal:
  type: object
  required: [lineage_id, label, column, code, params]
  description: >-
    Une valeur du fichier gardée et signalée (`ImportReport.signals`) : la tâche, la colonne qui
    porte la valeur, et le motif, avec les paramètres qu'il porte dans un refus
    (`Problem.params`), pour que la saisie et l'import se disent d'une même phrase
    (WF-ARC-0110). Ainsi `NON_WORKING_DAY`, une date de début ou de fin d'une tâche manuelle sur
    un jour sans aucune heure travaillée à son calendrier applicable, gardée telle quelle, le
    début et la fin à `0` heure : `params.date` la date du fichier, `next_working_day` le jour
    travaillé suivant (WF-PLA-0020, WF-PLA-0010 ; #1271). Une tâche dont le début et la fin
    tombent l'un et l'autre un jour chômé est signalée deux fois, une par colonne ; un jalon dont
    le début et la fin sont le même jour chômé l'est aussi deux fois : le signalement suit la
    cellule, non le jour, comme le refus de la saisie suit le champ.
  properties:
    lineage_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: La lignée de la tâche ; nulle pour une tâche que l'import crée.
    label: { type: string }
    column:
      allOf: [{ $ref: revisions.yaml#/NodeColumn }]
      description: La colonne de la grille de planning qui porte la valeur, `start` ou `finish`.
    code:
      allOf: [{ $ref: ../common.yaml#/ErrorCode }, { const: NON_WORKING_DAY }]
      description: >-
        Le motif du signalement, un code d'erreur pour que la saisie et l'import se disent d'une
        même phrase : `NON_WORKING_DAY` seul, tant qu'aucun autre signalement n'existe ; un
        signalement nouveau élargit cette liste, par une modification du contrat.
    params:
      type: object
      additionalProperties: true

ImportRejection:
  type: object
  required: [row, code]
  description: >-
    Une ligne du fichier rejetée, par son onglet, son rang et son motif (WF-INTF-0080) :
    l'utilisateur la retrouve dans son fichier, deux onglets pouvant porter une ligne au même
    rang (#1162). Parmi les motifs :
    une ligne de main-d'œuvre qui laisserait sa tâche sans heure travaillée
    (`TASK_WITHOUT_WORKING_HOURS`, WF-PLA-0010), ses `params` nommant les rôles et la tâche en
    cause comme ceux d'une saisie d'une révision (`resource_role_ids`, `tasks`, chaque tâche par
    `project_id`, `node_id` et `label`), une ligne de devis d'une catégorie de type provision
    pour risques, que seule la déclaration d'un risque crée (`PROVISION_CATEGORY_RESERVED`,
    WF-DEV-0020), chacun avec les paramètres qu'il porte dans un refus ; une ligne existante dont
    la tâche est démarrée ou terminée, et dont le sous-projet a reçu des coûts réels, que le
    fichier ferait changer de sous-projet — placée dans l'onglet d'un autre sous-projet, ou dans
    l'onglet « Hors sous-projet », d'un reste à engager (WF-INTF-0120), ou portant un autre
    sous-projet, ou une cellule vide, dans la colonne d'un devis (WF-INTF-0100) — :
    `SUBPROJECT_HAS_ACTUAL_COSTS`, `params.subproject` nommant le sous-projet qu'elle ne peut pas
    quitter (`subproject_id`, `label`), comme le refus de `updateEstimateLine` (WF-PRJ-0050 ;
    C-359, #1152, #1153). Une ligne d'une tâche non démarrée change de sous-projet, et le compte
    rendu le présente comme un écart (`ImportDifference`, `fields` à `subproject`).
    Une tâche que le fichier placerait hors du sous-arbre de la tâche du lot de son poste ne
    rejette pas sa ligne mais le fichier entier (`ImportReport.refusals` ; EP-14/L42s).
    D'une extraction de coûts réels, une ligne dont une autre ligne du fichier porte la même pièce
    et le même poste, nul compris : `DUPLICATE_COST_LINE`, chacune de ces lignes rejetée,
    `params.rows` nommant les rangs des autres dans l'ordre du fichier — la ligne ne s'identifie
    pas, et aucune n'est préférée à l'autre (WF-INTF-0140, D-4 ; EP-16/US-0630).
  properties:
    sheet:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        L'onglet qui porte la ligne, par son nom tel que le fichier le porte : le lot d'un devis,
        le sous-projet d'un reste à engager, ou un onglet que Waterfall nomme, « Hors lot » ou
        « Hors sous-projet », dont le nom ne dépend pas de la langue (ANNEXE B, WF-INTF-0180).
        Nul pour un fichier à un seul onglet — un planning MS Project, une extraction de coûts
        réels (WF-INTF-0040, WF-INTF-0140) — (#1162).
    row: { type: integer, minimum: 1 }
    code: { $ref: ../common.yaml#/ErrorCode }
    params:
      type: object
      additionalProperties: true

ReportRefusal:
  type: object
  required: [code]
  description: >-
    Un motif qui refuse un import ou une fusion entière, présenté au compte rendu avant
    l'application (WF-INTF-0040, WF-REV-0050 ; EP-14/L42s) : son code et les paramètres qu'il
    porte dans un refus (`Problem.params`), les tâches nommées par leur nœud de la structure
    principale et leur libellé. Ainsi `ORDER_ITEM_OUTSIDE_WORK_PACKAGE`, la tâche d'un poste sortie
    du sous-arbre de la tâche de son lot, `params.work_package_task` et `order_item_tasks`
    (WF-PLA-0170) ; `PROJECT_HORIZON_EXCEEDED`, la durée du projet portée au-delà de quinze ans,
    `params.task` (WF-PLA-0150) ; pour une fusion, aussi `TASK_WITHOUT_WORKING_HOURS`, sur
    lequel sa tâche de fond échoue déjà (WF-PLA-0010). Un cycle de liaisons (WF-PLA-0030) et
    l'horizon, que WF-REV-0050 cite parmi les motifs de refus d'une fusion, n'ont pas encore
    l'échec de la fusion décrit : #788.
  properties:
    code: { $ref: ../common.yaml#/ErrorCode }
    params:
      type: object
      additionalProperties: true

ImportDifference:
  type: object
  required: [change, target]
  description: >-
    Un écart d'un import avec les données existantes, ou d'un différentiel avec la structure
    principale qu'il fusionnerait (`StructureMergeReport`, WF-REV-0050 ; EP-14/L42s).
  properties:
    change:
      type: string
      enum: [added, removed, updated, kept]
      description: >-
        Ajouté, retiré, modifié — ou conservé et signalé (`kept`) : une tâche démarrée ou
        terminée que le fichier ne porte plus, ou une ligne de devis d'une telle tâche, que
        l'import garde au lieu de la retirer (WF-INTF-0040, WF-INTF-0100) ; pour une fusion, une
        tâche démarrée ou terminée que le différentiel retire, et que la fusion garde — la
        démarrée terminée, son reste à engager porté à zéro (WF-REV-0050, `StructureMergeReport` ;
        EP-14/L42s). Un `kept` n'a pas de `fields`.
    target:
      type: string
      enum: [task, estimate_line, link, actual_cost_line]
    lineage_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        La lignée de l'objet existant ; nulle pour un ajout, qui n'en a pas encore, et pour une
        ligne de coût réel, qui n'en porte pas. Pour une liaison (`link`), celle de la tâche
        successeur, dont la colonne `predecessors` porte la liaison ; `label` est le sien.
    label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Le libellé de l'objet — pour une liaison, celui du successeur ; pour une ligne de coût,
        son numéro de pièce, qui l'identifie avec son poste (`document_item` ; WF-INTF-0140,
        D-4) : ni `document_number` ni `document_item` ne figurent donc jamais parmi les
        `fields` d'un `updated`, une pièce d'un autre numéro, ou un autre poste de la même
        pièce, étant une autre ligne.
    document_item:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Pour une ligne de coût (`actual_cost_line`), le numéro de son poste dans la pièce que
        nomme `label`, qui la désigne avec elle (`ActualCostLine.document_item`, WF-INTF-0140,
        D-4 ; EP-16/US-0630) ; nul pour une ligne sans poste, et nul ou absent pour tout autre
        objet.
    predecessor_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Pour une liaison (`link`), le libellé du prédécesseur, pour que la ligne du compte
        rendu se lise « successeur ← prédécesseur » sans relire la structure (WF-PLA-0080,
        WF-ARC-0020) ; nul pour tout autre objet.
    work_breakdown_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Pour le retrait d'une tâche rattachée (`removed`, `task`), le libellé du lot ou du poste
        qui perd sa tâche : « La suppression d'une tâche rattachée est appliquée, et le compte
        rendu nomme le lot ou le poste qui perd sa tâche » (WF-INTF-0040, WF-PLA-0170). Nul ou
        absent pour tout autre écart, et pour une tâche sans rattachement (EP-14/L42k).
    fields:
      type: array
      description: >-
        Les champs qu'un écart `updated` change, vide pour un ajout, un retrait ou un objet
        conservé, nommés comme les colonnes de leur grille, que le front rend par son catalogue
        (WF-ARC-0110) : une tâche, une ligne de devis ou une liaison par `NodeColumn` — une
        liaison changée de type ou de décalage par `predecessors`, la colonne qui la
        présente ; une ligne de coût réel par `ActualCostColumn`, une colonne conservée du
        fichier par `passthrough.<colonne>`. Une tâche ou une ligne déplacée sous un autre parent
        — une autre récapitulative, une autre tâche porteuse — nomme `parent`, qu'aucune colonne
        ne présente, comme `NodeChange.parent` : « Une tâche déplacée sous une autre
        récapitulative est présentée modifiée » (WF-REV-0080, WF-REV-0050 ; #1194).
      items:
        anyOf:
          - $ref: revisions.yaml#/NodeColumn
          - $ref: '#/ActualCostColumn'
          - $ref: '#/ImportDifferenceField'

ImportDifferenceField:
  type: string
  enum: [parent]
  description: >-
    Champ d'un écart `updated` qu'aucune colonne ne présente (`ImportDifference.fields`) : le
    parent d'une tâche ou d'une ligne déplacée sous une autre récapitulative ou une autre tâche
    porteuse, comme `NodeChange.parent` (WF-REV-0080, WF-REV-0050 ; #1194).

ActualCostColumn:
  type: string
  description: >-
    Colonne d'une ligne de coût réel que porte le fichier importé, nommée comme le tri de
    `listActualCosts` la nomme (WF-CRE-0010) : la date et le numéro de la pièce, le numéro du poste
    dans la pièce, son montant, son sous-projet — le code lu dans l'élément d'OTP
    (`subproject_code`) ; un réimport qui le change recalcule l'imputation de la ligne, et le compte
    rendu le dit par un écart `updated` sur cette colonne (WF-CRE-0020, WF-INTF-0140). Une colonne
    conservée du fichier (`ActualCostLine.passthrough`, WF-CRE-0010) se nomme
    `passthrough.<colonne>`, comme le tri la nomme : un réimport qui en change la valeur — le
    fournisseur d'une pièce — est un écart `updated` sur elle, et non une ligne inchangée. Le numéro
    de pièce identifie la ligne avec le poste de la pièce (`document_item`) : l'un et l'autre
    servent au tri et ne sont jamais un champ d'écart (`ImportDifference.label`,
    `ImportDifference.document_item` ; D-4). Le périmètre suivi et le motif d'exclusion, que le
    serveur déduit, ne sont pas des colonnes du fichier.
  anyOf:
    - type: string
      enum: [document_date, document_number, document_item, amount, subproject]
    - type: string
      pattern: '^passthrough\..+$'

ImportApply:
  type: object
  required: [confirmed]
  description: >-
    Applique l'import en une seule transaction. Les droits et l'état du projet sont
    revérifiés au moment de l'exécution : un import confirmé n'est pas appliqué si
    l'une des conditions a cessé d'être vraie depuis l'analyse (WF-ARC-0100).
  properties:
    confirmed:
      type: boolean
      const: true

ExportRequest:
  type: object
  required: [kind, revision_id]
  description: >-
    Demande un export. Le fichier est engendré à la demande et transmis sans être
    stocké (WF-DAT-0120). Les en-têtes des formats Excel ne dépendent pas de la
    langue (WF-INTF-0180).
  properties:
    kind:
      type: string
      enum:
        - ms_project_schedule
        - estimate
        - remaining
        - task_tree_image
    revision_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        La révision exportée, en cours ou marquée, exigée : c'est sa commande `export_*` qui
        juge l'export (`RevisionCommand`, WF-INTF-0110, WF-INTF-0130). Aucune révision n'est
        prise par défaut.
    structure_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    depth:
      anyOf: [{ type: integer, minimum: 1 }, { type: 'null' }]
      description: Niveau retenu pour l'image d'arborescence (WF-PLA-0120).
