# File exchanges (FLX-01 to FLX-07) and background tasks.
# Waterfall exchanges only through these seven flows (WF-INTF-0150). An import runs
# in two steps separated by the user's decision (WF-ARC-0100), and both its
# analysis and its application are executed by the worker (WF-ARC-0090).

FileUpload:
  type: object
  required: [upload_id, purpose, filename, size_bytes, uploaded_at, expires_at, backup_taken_at]
  description: >-
    File uploaded, in transit. It is deleted as soon as the import is applied, refused,
    abandoned or expired (WF-DAT-0120, WF-ARC-0100). An uploaded backup that an accepted
    restore designates is kept until the end of its task, even beyond `expires_at`
    (`startRestore`).
  properties:
    upload_id: { $ref: ../common.yaml#/Uuid }
    purpose: { $ref: '#/FileUploadPurpose' }
    filename: { type: string }
    size_bytes: { type: integer, minimum: 1 }
    uploaded_at: { $ref: ../common.yaml#/Timestamp }
    expires_at:
      allOf: [{ $ref: ../common.yaml#/Timestamp }]
      description: >-
        Twenty-four hours after the upload (`uploaded_at`). Beyond that, an upload that no
        import has opened is deleted, and `openImport` refuses it with 404 (WF-DAT-0120). An
        upload that an import has opened follows its import: it lives until the import is
        applied, refused, abandoned or expired (WF-ARC-0100). A backup upload that an accepted
        restore designates is kept until the end of its task (`startRestore`).
    backup_taken_at:
      anyOf: [{ $ref: ../common.yaml#/Timestamp }, { type: 'null' }]
      description: >-
        For a backup uploaded for a restore (`external_backup`), the date its manifest
        states at the head of the archive, read when the chunked upload is completed
        (`completeChunkedUpload`), which refuses an archive that states none (#1006): that of the
        backup of which it is the copy (`Backup.taken_at`), the date that the confirmation of the
        restore states and that `RestoreRequest.acknowledged_backup_taken_at` must repeat
        (WF-ADM-0160). Never null for a backup. Null for an import file
        (`uploadFile`), which has no backup date.

FileUploadPurpose:
  type: string
  enum: [import, external_backup]
  description: >-
    The use of an upload, which bounds it: an import file, at most 10 MiB (§4.6.2), uploaded
    at once by `uploadFile`; a backup copied outside the platform, to restore
    (`RestoreRequest.external_backup_upload_id`, WF-ADM-0160), at most
    `Installation.external_backup_max_bytes`, uploaded in chunks (`openChunkedUpload`,
    `uploadChunk`, `completeChunkedUpload`), `uploadFile` refusing it. Both values remain
    in the enumeration: the `FileUpload` that `completeChunkedUpload` returns uses
    `external_backup`, and an upload is designated by its use (`startRestore`, `openImport`).

ChunkedUploadOpen:
  type: object
  required: [filename, size_bytes]
  description: >-
    Opens the chunked upload of a backup copied outside the platform, to restore
    (`FileUploadPurpose`, `external_backup`, WF-ADM-0160). It does not exist for another use:
    an import file is uploaded at once.
  properties:
    filename:
      type: string
      minLength: 1
      maxLength: 255
      description: The name of the file, as the user chose it; it stays with the upload that completes.
    size_bytes:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      description: >-
        The whole size of the file, in bytes, that the upload commits to receive; beyond
        `Installation.external_backup_max_bytes`, or if it does not fit in 10,000 chunks of
        at most `part_size_bytes` (10,000 × 10 MiB), the opening is refused with 413,
        `FILE_TOO_LARGE`.

ChunkedUpload:
  type: object
  required: [chunked_upload_id, filename, size_bytes, part_size_bytes, part_count, received_parts, expires_at]
  description: >-
    A chunked upload, opened and not yet completed: the file is split into `part_count` chunks
    of `part_size_bytes` bytes, except the last, which receives the rest, numbered from 1, which
    the server assembles in object storage as they arrive (WF-ARC-0050). A chunk can be uploaded
    again as long as the upload is not completed, which allows resuming an interrupted transfer
    from `received_parts`, as long as the client has the last response; no operation reads an
    upload back, and a transfer whose response the client has lost — a page reload — starts over
    with an opening, the previous upload expiring.
  properties:
    chunked_upload_id: { $ref: ../common.yaml#/Uuid }
    filename: { type: string }
    size_bytes: { type: integer, minimum: 1 }
    part_size_bytes:
      type: integer
      minimum: 5242880
      maximum: 10485760
      description: >-
        The size of each chunk except the last, set by the server at the opening, between
        5 MiB and 10 MiB: object storage does not assemble a chunk smaller than 5 MiB, and
        10 MiB is the bound on the request body that the front carries, that of imports. A
        chunk has exactly this size, the last receiving the rest (`uploadChunk`).
    part_count:
      type: integer
      minimum: 1
      maximum: 10000
      description: >-
        The number of chunks, at most 10,000, the limit of multipart uploads of
        object storage: the server chooses `part_size_bytes` within its bounds to fit in it.
    received_parts:
      type: array
      description: The numbers of the chunks received, in ascending order, without duplicates.
      items: { type: integer, minimum: 1 }
    expires_at:
      allOf: [{ $ref: ../common.yaml#/Timestamp }]
      description: >-
        Twenty-four hours after the opening: beyond that, the upload and its chunks are
        deleted, like an expired import file (WF-DAT-0120).

ExchangeKind:
  type: string
  enum:
    - ms_project_schedule
    - estimate
    - remaining
    - actual_costs
  description: >-
    FLX-01 and FLX-02 for the MS Project schedule, FLX-03 and FLX-04 for the estimate,
    FLX-05 and FLX-06 for the remaining to commit, FLX-07 for the actual costs.

ImportRequest:
  type: object
  required: [kind, upload_id]
  description: >-
    Opens an import. The opening reads the header of the file — its format, its version, the
    labels of its columns — and refuses what it does not recognise before queuing anything
    (WF-INTF-0070); the analysis, entrusted to the worker, then compares the content with the
    existing data and produces a report, without changing anything (WF-ARC-0100, WF-INTF-0080).
    The import applies to the current revision, created if needed (WF-INTF-0090).
  properties:
    kind: { $ref: '#/ExchangeKind' }
    upload_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        An upload made for an import (`FileUploadPurpose`, `import`); an unknown upload, expired
        or already used by an import, hence deleted (WF-DAT-0120), is refused with 404 (I-03,
        #1789).
    structure_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        The targeted structure, a single one (WF-INTF-0090): a structure of the current
        revision, or of the last marked revision when the import will create the current
        revision; the main structure by default; not applicable to an actual cost extraction. An
        unknown structure, or one of another revision, is refused with 404.
    period_from:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: >-
        For an actual cost extraction only (`actual_costs`), the start of the period extracted from
        the ERP, which the log keeps (WF-CRE-0050); optional, like the end, each bound possibly
        missing; not applicable to another kind.
    period_to:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: >-
        The end of the extracted period, inclusive, optional (WF-CRE-0050). An end that precedes the
        start is refused with 422, `VALIDATION_FAILED`, `/period_to` with `VALUE_OUT_OF_RANGE`,
        `params.minimum` the start, like any period of the contract.

Import:
  type: object
  required:
    - import_id
    - kind
    - filename
    - structure_id
    - revision_id
    - period_from
    - period_to
    - status
    - created_at
    - expires_at
  description: >-
    An import of the project, as the list returns it (`listImports`): its opening and the state it
    is in, without its report, its task or its commands, which only reading an import
    returns (`ImportDetail`, `getImport`, `openImport`; I-06, #1780).
  properties:
    import_id: { $ref: ../common.yaml#/Uuid }
    kind: { $ref: '#/ExchangeKind' }
    filename:
      type: string
      description: >-
        Name of the uploaded file, as the user sent it; it stays in the report
        and in the list of imports when the file itself is deleted (WF-DAT-0120).
    structure_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        The structure the import writes to, the one the opening designated, or the
        main structure it resolved when the request named none (WF-INTF-0090):
        the report names it without reading the request again. Null for an actual cost extraction,
        which writes to no structure, its lines belonging to the project (WF-CRE-0020).
    revision_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        The current revision the import writes to; null as long as it does not exist, when the
        application of the import will create it (WF-INTF-0090), and for an actual cost
        extraction, which writes to no revision (WF-CRE-0010).
    period_from:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: >-
        The start of the extracted period that the opening received (`ImportRequest.period_from`,
        WF-CRE-0050); null when it had none, and outside actual costs.
    period_to:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: >-
        The end of the extracted period that the opening received (`ImportRequest.period_to`,
        WF-CRE-0050); null when it had none, and outside actual costs.
    status:
      type: string
      enum: [analysing, analysed, applying, applied, abandoned, expired, failed, refused]
      description: >-
        Where the import stands (WF-ARC-0100): `analysing`, its analysis is running, without a
        report; `analysed`, its report awaits the user's decision until `expires_at`;
        `applying`, the confirmed application is running; `applied`, it has written;
        `abandoned`, the user abandoned it; `expired`, twenty-four hours passed without
        application; `failed`, the task of its analysis or of its application failed
        (`task.problem`), without writing anything (WF-INTF-0080); `refused`, the application
        was refused — when checking again the permission, the contributor status or the state of
        the project, or because the report rejected the file —, the file is deleted
        (WF-ARC-0100), and the import no longer applies (I-01, #1789). Only an `analysed` import
        applies (`import_awaiting_decision`); an `applying` or `applied` import cannot be
        abandoned (`import_not_applied`), and abandoning an import that ended without writing —
        `abandoned`, `expired`, `failed`, `refused` — returns 204 without effect.
    created_at: { $ref: ../common.yaml#/Timestamp }
    expires_at:
      anyOf: [{ $ref: ../common.yaml#/Timestamp }, { type: 'null' }]
      description: >-
        Twenty-four hours after the analysis; beyond that the report no longer applies
        (WF-ARC-0100). Null as long as the analysis is running, if it failed, or if the
        application was refused (`refused`).
    report:
      anyOf: [{ $ref: '#/ImportReport' }, { type: 'null' }]
      description: >-
        The report of the analysis, null as long as it is running or when it failed; returned by
        reading an import (`ImportDetail`), omitted by the list.
    task:
      allOf: [{ $ref: ../common.yaml#/BackgroundTaskRef }]
      description: >-
        The last background task of the import, that of its analysis or of its application, which
        the screen follows (WF-IHM-0080); returned by reading an import (`ImportDetail`), omitted by
        the list.
    available_commands:
      type: array
      description: >-
        The commands of the import that the caller has permission to exercise, each available or
        not, with the conditions it lacks, in the order of `ImportCommand` (WF-IHM-0090;
        I-01, I-02, #1789); returned by reading an import (`ImportDetail`), omitted by the
        list.
      items: { $ref: '#/ImportCommandAvailability' }

ImportDetail:
  description: >-
    An import as reading it (`getImport`) and opening it (`openImport`) return it: an
    `Import`, whose properties it takes over, and always its report — null as long as the analysis
    is running or when it failed —, its task and its commands, which the list omits (I-06, #1780).
  allOf:
    - $ref: '#/Import'
    - type: object
      required: [report, task, available_commands]
      properties:
        report:
          anyOf: [{ $ref: '#/ImportReport' }, { type: 'null' }]
          description: The report of the analysis, that of `Import`, always returned here.
        task:
          allOf: [{ $ref: ../common.yaml#/BackgroundTaskRef }]
          description: The last background task of the import, that of `Import`, always returned here.
        available_commands:
          type: array
          description: The commands of the import, those of `Import`, always returned here.
          items: { $ref: '#/ImportCommandAvailability' }

ImportCommand:
  type: string
  enum: [apply, abandon]
  description: >-
    The commands of an import (WF-IHM-0090; I-01, I-02, #1789): applying it (`applyImport`),
    available for an `analysed` import whose report accepts the file — otherwise
    `import_awaiting_decision`, then `import_file_accepted` —, the rights and
    state conditions checked again at execution being stated only by the 409; abandoning it
    (`abandonImport`), unavailable for an import applied or being applied,
    `import_not_applied`.

ImportCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/ImportCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Empty when the command is available.
      items: { $ref: projects.yaml#/CommandCondition }

ImportReport:
  type: object
  required:
    - format_version
    - read_count
    - unchanged_count
    - rejected
    - refusals
    - differences
    - ignored
    - completed_tasks
    - date_mismatches
    - signals
    - requires_confirmation_reasons
  description: >-
    Report presented before application, and read again after it: lines read, lines
    rejected with their reason, differences with the existing data (WF-INTF-0080), what
    the import ignored, the tasks it completes and the differences in dates or durations it
    finds (WF-INTF-0040, WF-INTF-0120). An import is a round trip based on
    the identifier that the export wrote: an object of the file that carries it updates the existing
    object, an object without an identifier is created, an existing object absent from the file is
    removed — or kept and signalled (`kept`) when its task is started or completed, or when
    it is a provision line of a risk (WF-INTF-0040, WF-INTF-0100); a remaining to commit
    leaves unchanged, without signalling them, the lines absent from the file (WF-INTF-0120). An
    MS Project schedule carries the project start date, which becomes the planning
    start date of the structure (`CostStructure.planning_start_on`): the report presents it
    when it differs from the one in place, through an `updated` difference of the structure
    (`ImportDifference`, `cost_structure`, WF-INTF-0040, WF-PLA-0020). A schedule exported then
    re-imported without
    modification presents no difference: `differences` and `date_mismatches` are empty
    (WF-INTF-0060). The arrays are always returned, empty when there is nothing to
    say, so that the screen does not have to tell apart a report that does not mention it from a
    report where there is nothing. A file rejected whole is recognised by `refusals` not being
    empty: nothing applies, not even the accepted lines, and only abandoning remains offered
    (`applyImport`, `import_file_accepted`; EP-14/L42s).
  properties:
    format_version:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The format version carried by the header of an estimate or a remaining to commit (annex B);
        null for an MS Project schedule and an actual cost extraction, which carry none
        (WF-INTF-0070).
    read_count:
      type: integer
      minimum: 0
      description: >-
        The objects read from the file: the lines of an estimate, a remaining to commit or an
        actual cost extraction, the tasks of the file of an MS Project schedule — not the links,
        nor the structure, nor the tasks it no longer carries.
    unchanged_count:
      type: integer
      minimum: 0
      description: >-
        Among the objects read, those the import leaves as they are: neither rejected, nor
        ignored, nor presented as added or modified by `differences` — for an actual cost
        extraction, the lines already imported identically (WF-INTF-0140, WF-CRE-0050). Added
        and updated lines are counted in `differences`, rejected ones in `rejected`. For a
        schedule, `differences` also carries the structure, the links and the tasks removed or
        kept, which the file does not count among its read tasks: only the differences with
        target `task` added or updated are subtracted — `unchanged_count` equals `read_count`
        minus the rejected ones and these differences.
    rejected:
      type: array
      description: >-
        The rejected lines, each by its row, and its sheet when the file has several, with its
        reason; the others apply (WF-INTF-0080). Among them, for an estimate or a remaining to
        commit, a line that would leave a subproject that has received actual costs, the report
        naming that subproject (`ImportRejection`, WF-INTF-0100, WF-INTF-0120); for an actual
        cost extraction, a line whose WBS element does not have the expected form or designates
        another project (WF-CRE-0020), each counted in the log among the rejected lines
        (`CostImport.rejected_count`, WF-CRE-0050).
      items: { $ref: '#/ImportRejection' }
    refusals:
      type: array
      description: >-
        The reasons that reject the whole file, instead of a line (`ReportRefusal`): an MS
        Project schedule that would move the task of an order item outside the subtree of the
        task of its work package — on the main structure, the only one to carry attachments —,
        "rejected in the report, which names both tasks, like a schedule that exceeds the
        horizon" (WF-INTF-0040, WF-PLA-0170), and a schedule that would extend the duration of
        the project beyond fifteen years (WF-PLA-0150). Empty when the file applies
        (EP-14/L42s).
      items: { $ref: '#/ReportRefusal' }
    differences:
      type: array
      description: >-
        The differences of the file with the existing data (`ImportDifference`). The provision
        line of a risk whose carrying task a schedule removes moves to another task,
        and the report signals it with an `updated` difference of the line on `parent`
        (WF-RIS-0010, WF-INTF-0040; #789).
      items: { $ref: '#/ImportDifference' }
    ignored:
      type: array
      description: >-
        What the import read without importing it, by kind, named when it has a name
        (WF-INTF-0040): the resources and the calendars of the file, managed by Waterfall
        alone, the progress, the costs, the custom fields, and the date constraints
        of the tasks imported in manual mode at the dates of the file. For an actual cost
        extraction, the columns of the file neither read nor declared kept by the mapping,
        each by its label (`columns`, WF-REF-0190). For an estimate or a remaining to commit,
        which read only their columns, the only lines of the file that carry the lineage
        of a provision line of a risk, left as they are (`provision_lines`,
        WF-INTF-0100, WF-INTF-0120).
      items: { $ref: '#/ImportIgnored' }
    completed_tasks:
      type: array
      description: >-
        The tasks that the application of the import completes, because it sets to zero the
        remaining to commit of all their lines (WF-INTF-0120, WF-RAE-0040), each named; their
        completion date is the review date the file carries, in "Synthèse", read from the
        analysis onwards (WF-INTF-0120, WF-INTF-0130). A not started task that is not a
        milestone goes through the started state: started and completed on that date
        (`started_on` equal to `completed_on`); a milestone, which does not go through the
        started state, goes directly from not started to completed and also carries `started_on`
        equal to `completed_on` (WF-RAE-0030, WF-PLA-0130). Empty for the other kinds of import.
      items: { $ref: '#/ImportCompletedTask' }
    date_mismatches:
      type: array
      description: >-
        The tasks whose dates or duration in the file differ from those that Waterfall
        recalculates from the durations, the links and the calendars (WF-INTF-0040): a piece of
        information in the report, not a reason for confirmation — what Waterfall recalculates
        prevails, and the difference says that the two engines do not date the same way. Empty on a
        round trip without modification (WF-INTF-0060), and for Excel imports.
      items: { $ref: '#/ImportDateMismatch' }
    signals:
      type: array
      description: >-
        What the import keeps as the file carries it, and that the report signals
        (`ImportSignal`): for an MS Project schedule, the date of a manual task on a day without
        any working hour in the applicable calendar of the task — "the same date imported from
        an MS Project file is kept and signalled in the report" (WF-PLA-0020; #1271, #1289) —,
        and what it corrects: a summary task in manual mode in the file, imported in automatic
        mode, "signalled with the date difference" (WF-INTF-0040). A piece of information, not a
        reason for confirmation or rejection. Empty when there is nothing to signal, and for
        Excel imports.
      items: { $ref: '#/ImportSignal' }
    requires_confirmation_reasons:
      type: array
      description: >-
        Reasons for an explicit confirmation, specific to actual costs: lines of another
        project, rejected, or an unknown subproject, kept by its code (WF-CRE-0020). A
        difference in dates or durations is no longer one: it is stated by `date_mismatches`.
      items:
        type: string
        enum: [lines_outside_project, unknown_subproject]

ImportIgnoredKind:
  type: string
  enum:
    - resources
    - calendars
    - progress
    - costs
    - custom_fields
    - date_constraints
    - columns
    - provision_lines
  description: >-
    What an MS Project import never reads (WF-INTF-0040): the resources and the
    calendars, managed by Waterfall alone; the progress, the costs and the custom
    fields; and the date constraints of the tasks, imported in manual mode at the dates
    of the file, each task signalled. For an actual cost extraction, the columns of the file
    neither read nor declared kept by the mapping (`columns`), which the import ignores and
    which the report names by their label as the file carries it (WF-REF-0190). For an
    estimate or a remaining to commit, the lines of the file that carry the lineage of a
    provision line of a risk, which the import never modifies (`provision_lines`), named by their
    designation (WF-INTF-0100, WF-INTF-0120, WF-RIS-0010); a line without an identifier of a
    category of provision type is rejected, not ignored (`PROVISION_CATEGORY_RESERVED`).

ImportIgnored:
  type: object
  required: [kind, count, labels]
  description: A kind of elements ignored by the import, their number, and their names when they have any.
  properties:
    kind: { $ref: '#/ImportIgnoredKind' }
    count:
      type: integer
      minimum: 1
      description: How many elements of this kind the file carried.
    labels:
      type: array
      description: >-
        Their names, in the order of the file, when they have any — the name of a resource or of a
        calendar, the label of a task with a date constraint, the label of a column of an
        actual cost extraction as the file carries it, the designation of a provision
        line; empty for what has no
        name, the progress or the costs. Never more than `count`.
      items: { type: string }

ImportCompletedTask:
  type: object
  required: [lineage_id, label, completed_on]
  description: >-
    A task that a remaining to commit import completes (WF-INTF-0120), or that a merge
    completes, the differential removing it while it is started (WF-REV-0050,
    `StructureMergeReport`).
  properties:
    lineage_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string }
    completed_on:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: >-
        The completion date that the task takes — and also its start date for a not started
        task, milestone included: a task that is not a milestone goes through the started state
        (WF-RAE-0030), a milestone does not (WF-PLA-0130). For an
        import, the review date the file carries, read from the analysis onwards and never null
        (WF-INTF-0120, WF-INTF-0130); for a merge, the day of its application, null as long as
        it is not applied (WF-PLA-0130, WF-REV-0050).

ImportDateMismatch:
  type: object
  required: [lineage_id, label, fields]
  description: >-
    A task whose dates or duration in the file differ from those Waterfall recalculates
    (WF-INTF-0040): the task, and the columns that differ.
  properties:
    lineage_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: The lineage of the task; null for a task that the import creates.
    label: { type: string }
    fields:
      type: array
      minItems: 1
      uniqueItems: true
      description: >-
        The columns that differ, among the duration, the start and the finish (`duration`, `start`,
        `finish`), named like the columns of the planning grid.
      items: { $ref: revisions.yaml#/NodeColumn }

ImportSignal:
  type: object
  required: [lineage_id, label, column, code, params]
  description: >-
    A value of the file kept and signalled (`ImportReport.signals`): the task, the column that
    carries the value, and the reason, with the parameters it carries in a refusal
    (`Problem.params`), so that entry and import are expressed in the same sentence
    (WF-ARC-0110). Thus `NON_WORKING_DAY`, a start or finish date of a manual task on a day
    without any working hour in its applicable calendar, kept as it is, the start and the finish
    at hour `0`: `params.date` the date of the file, `next_working_day` the next working day
    (WF-PLA-0020, WF-PLA-0010; #1271). A task whose start and finish both fall on a non-working
    day is signalled twice, once per column; a milestone whose start and finish are the same
    non-working day is also signalled twice: the signal follows the cell, not the day, as the
    refusal of an entry follows the field. And `SUMMARY_TASK_DERIVED`, the code that refuses at
    entry dates on a summary task: a summary task that the file carries in manual mode, imported
    in automatic mode, its dates deriving from its subordinates, the column `scheduling_mode`,
    `params.start` and `params.finish` the dates of the file; the difference with the dates that
    Waterfall recalculates is in `date_mismatches` (WF-INTF-0040, WF-PLA-0040).
  properties:
    lineage_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: The lineage of the task; null for a task that the import creates.
    label: { type: string }
    column:
      allOf: [{ $ref: revisions.yaml#/NodeColumn }]
      description: >-
        The column of the planning grid that carries the value: `start` or `finish` for
        `NON_WORKING_DAY`, `scheduling_mode` for `SUMMARY_TASK_DERIVED`.
    code:
      allOf:
        - $ref: ../common.yaml#/ErrorCode
        - enum: [NON_WORKING_DAY, SUMMARY_TASK_DERIVED]
      description: >-
        The reason for the signal, an error code so that entry and import are expressed in the same
        sentence: `NON_WORKING_DAY` and `SUMMARY_TASK_DERIVED` only; a new signal
        extends this list, through a change to the contract.
    params: { $ref: ../common.yaml#/ProblemParams }

ImportRejection:
  type: object
  required: [row, code]
  description: >-
    A rejected line of the file, by its sheet, its row and its reason (WF-INTF-0080): the user
    finds it in their file, two sheets possibly carrying a line at the same row (#1162). Among
    the reasons: a labour line that would leave its task without working hours
    (`TASK_WITHOUT_WORKING_HOURS`, WF-PLA-0010), its `params` naming the roles involved by their
    identifier, their code and their label (`resource_roles`: `resource_role_id`, `code`,
    `label`), active or deactivated, like the refusals of costs — the report is read without
    reading the roles again —, and the task by its lineage and its label (`tasks`: `lineage_id`,
    `label`), as `ImportDifference` names the objects of an import, the imported revision
    possibly having no node yet (WF-INTF-0090; #768, points 1 and 2), an estimate line of a
    category of type provision for risks, which only the declaration of a risk creates
    (`PROVISION_CATEGORY_RESERVED`, WF-DEV-0020), each with the parameters it carries in a
    refusal; an existing line whose task is started or completed, and whose subproject has
    received actual costs, that the file would move to another subproject — placed in the sheet
    of another subproject, or in the "Hors sous-projet" sheet, of a remaining to commit
    (WF-INTF-0120), or carrying another subproject, or an empty cell, in the column of an
    estimate (WF-INTF-0100) —: `SUBPROJECT_HAS_ACTUAL_COSTS`, `params.subproject` naming the
    subproject it cannot leave (`subproject_id`, `label`), like the refusal of
    `updateEstimateLine` (WF-PRJ-0050; C-359, #1152, #1153). A line of a not started task
    changes subproject, and the report presents it as a difference (`ImportDifference`, `fields`
    set to `subproject`). A task that the file would place outside the subtree of the task of
    the work package of its order item does not reject its line but the whole file
    (`ImportReport.refusals`; EP-14/L42s). A line that would place a task under a milestone,
    which carries no subtasks, is rejected with `MILESTONE_HAS_NO_SUBTASK`, `params` naming the
    milestone by its lineage and its label (`lineage_id`, `label`); an estimate line under a
    milestone is allowed (WF-PLA-0050; F-04, #1771). A new line — without an identifier, or
    whose lineage does not exist in the revision — under a completed task of the main structure
    is rejected with `STATE_FORBIDS_OPERATION`, `params.missing_condition` set to
    `task_not_completed` and `params.tasks` naming the task by its lineage and its label, like
    its entry (`createNode`; WF-INTF-0100, WF-INTF-0120; I-05, #1793); on a differential, it is
    accepted like its entry, the amendment rebudgeting it (F-01, #1766). For an actual cost
    extraction, a line for which another line of the file carries the same document and the same
    item, null included: `DUPLICATE_COST_LINE`, each of these lines rejected, `params.rows`
    naming the rows of the others in the order of the file — the line cannot be identified, and
    none is preferred to the other (WF-INTF-0140, D-4; EP-16/US-0630). And a line rejected for
    its WBS element (WF-CRE-0020), `params.wbs_element` the element as the file carries it:
    `WBS_ELEMENT_INVALID`, an element that does not have the form of a project code optionally
    followed by a slash and a subproject code — empty, or with nothing before the slash —;
    `WBS_ELEMENT_OUTSIDE_PROJECT`, an element of another project, `params.project_code` the
    project code read, which is not that of the imported project. A line whose subproject code
    is that of no subproject is not rejected: imported and charged to the project alone, it
    requires confirmation (`unknown_subproject`). For an estimate or a remaining to commit, a
    line that cites a task, a role or a subproject that the revision does not have
    (`UNKNOWN_TASK`, `UNKNOWN_RESOURCE_ROLE`, `UNKNOWN_SUBPROJECT`), `params.value` the value of
    the cell as the file carries it, so that the user finds it without reading their file again
    (WF-INTF-0100); and a line that designates its task by a label that several tasks carry,
    when the "Tâches" sheet does not know it: `AMBIGUOUS_TASK_LABEL`, `params.label` this label
    and `params.tasks` the tasks that carry it, by their lineage and their label (annex B,
    WF-INTF-0080).
  properties:
    sheet:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The sheet that carries the line, by its name as the file carries it: the work package of
        an estimate, the subproject of a remaining to commit, or a sheet that Waterfall names,
        "Hors lot" or "Hors sous-projet", whose name does not depend on the language (annex B,
        WF-INTF-0180). Null for a single-sheet file — an MS Project schedule, an actual cost
        extraction (WF-INTF-0040, WF-INTF-0140) — (#1162).
    row: { type: integer, minimum: 1 }
    code: { $ref: ../common.yaml#/ErrorCode }
    params: { $ref: ../common.yaml#/ProblemParams }

ReportRefusal:
  type: object
  required: [code]
  description: >-
    A reason that refuses a whole import, merge or risk occurrence, presented in the report
    before the application (WF-INTF-0040, WF-REV-0050, WF-RIS-0060; EP-14/L42s,
    `RiskOccurrenceReport`): its code and the parameters it carries in a refusal
    (`Problem.params`), the tasks named by their node of the main structure and their label.
    Thus `ORDER_ITEM_OUTSIDE_WORK_PACKAGE`, the task of an order item moved out of the subtree
    of the task of its work package, `params.work_package_task` and `order_item_tasks`
    (WF-PLA-0170); `PROJECT_HORIZON_EXCEEDED`, the duration of the project extended beyond
    fifteen years, `params.task` (WF-PLA-0150); for a merge, also `TASK_WITHOUT_WORKING_HOURS`
    (WF-PLA-0010), `LINK_CYCLE`, a loop of links that the merge would close, `params.cycle`, and
    `LINK_FORBIDDEN`, a link that it would create between a summary task and its subordinate,
    `params.link` (WF-PLA-0030). Each is the reason on which the background task of the merge
    fails, with the same parameters (`mergeCostStructure`, WF-REV-0050; #788).
  properties:
    code: { $ref: ../common.yaml#/ErrorCode }
    params: { $ref: ../common.yaml#/ProblemParams }

ImportDifference:
  type: object
  required: [change, target, label]
  description: >-
    A difference of an import with the existing data, or of a differential with the main
    structure it would merge into (`StructureMergeReport`, WF-REV-0050; EP-14/L42s), or what the
    occurrence of a risk would do to the main structure (`RiskOccurrenceReport`, WF-RIS-0060;
    US-0680).
  properties:
    change:
      type: string
      enum: [added, removed, updated, kept]
      description: >-
        Added, removed, modified — or kept and signalled (`kept`): a started or
        completed task that the file no longer carries, or an estimate line of such a task, that
        the import keeps instead of removing it (WF-INTF-0040, WF-INTF-0100); a provision line
        of a risk that the file of an estimate no longer carries, kept, the import never modifying
        a provision (WF-INTF-0100, WF-RIS-0010) — a remaining to commit leaves unchanged,
        without signalling them, all the lines absent from its file (WF-INTF-0120); for a
        merge, a started or completed task that the differential removes, and that the merge keeps
        — the started one completed, its remaining to commit brought to zero (WF-REV-0050,
        `StructureMergeReport`; EP-14/L42s). A `kept` has no `fields`.
    target:
      type: string
      enum: [task, estimate_line, link, actual_cost_line, cost_structure]
      description: >-
        The object of the difference: a task, an estimate line, a link, an actual cost line,
        or the targeted structure itself (`cost_structure`), whose planning start date an MS Project
        schedule changes — an `updated` difference, `fields` set to `planning_start_on`
        (WF-INTF-0040, WF-PLA-0020).
    lineage_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        The lineage of the existing object; null for an addition, which has none yet, for an
        actual cost line, which carries none, and for the structure, which has none — the import
        targets only one, `Import.structure_id`. For a link (`link`), that of the successor
        task, whose `predecessors` column carries the link; `label` is the successor's.
    label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The label of the object, always returned — null for an object that has none —, for a
        structure its own; for a link, that of the successor; for a cost line, its document
        number, which identifies it together with its item (`document_item`; WF-INTF-0140, D-4):
        neither `document_number` nor `document_item` therefore ever appears among the `fields`
        of an `updated`, a document with another number, or another item of the same document,
        being another line.
    document_item:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        For a cost line (`actual_cost_line`), the number of its item in the document that
        `label` names, which designates it together with it (`ActualCostLine.document_item`,
        WF-INTF-0140, D-4; EP-16/US-0630); null for a line without an item, and null or absent
        for any other object.
    predecessor_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        For a link (`link`), the label of the predecessor, so that the line of the report
        reads "successor ← predecessor" without reading the structure again (WF-PLA-0080,
        WF-ARC-0020); null for any other object.
    work_breakdown_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        For the removal of an attached task (`removed`, `task`), the label of the work package
        or order item that loses its task: "The deletion of an attached task is applied, and the
        report names the work package or order item that loses its task" (WF-INTF-0040,
        WF-PLA-0170). Null or absent for any other difference, and for a task without attachment
        (EP-14/L42k).
    fields:
      type: array
      description: >-
        The fields that an `updated` difference changes, empty for an addition, a removal or a kept
        object, named like the columns of their grid, which the front renders through its catalogue
        (WF-ARC-0110): a task, an estimate line or a link by `NodeColumn` — a
        link whose type or lag changed by `predecessors`, the column that
        presents it; an actual cost line by `ActualCostColumn`, a kept column of the
        file by `passthrough.<column>`. A task or a line moved under another parent
        — another summary task, another carrying task — names `parent`, which no column
        presents, like `NodeChange.parent`: "A task moved under another
        summary task is presented as modified" (WF-REV-0080, WF-REV-0050; #1194). Thus the provision
        line of a risk whose carrying task the import of a schedule or the merge removes:
        it moves to the parent task of that task, or, for a top-level
        task, to the first remaining top-level task, and "the confirmation or the
        report signals it" through this difference, next to the removal of the task (WF-RIS-0010;
        #789).
      items:
        anyOf:
          - $ref: revisions.yaml#/NodeColumn
          - $ref: '#/ActualCostColumn'
          - $ref: '#/ImportDifferenceField'

ImportDifferenceField:
  type: string
  enum: [parent, planning_start_on]
  description: >-
    Field of an `updated` difference that no column presents (`ImportDifference.fields`): the
    parent of a task or of a line moved under another summary task or another carrying
    task, like `NodeChange.parent` (WF-REV-0080, WF-REV-0050; #1194); the planning
    start date of the structure (`CostStructure.planning_start_on`), which an MS Project schedule
    replaces with the project start date of the file (WF-INTF-0040, WF-PLA-0020).

ActualCostColumn:
  type: string
  description: >-
    Column of an actual cost line carried by the imported file, named as the sort of
    `listActualCosts` names it (WF-CRE-0010): the date and the number of the document, the
    number of the item in the document, its amount, its subproject — the code read in the WBS
    element (`subproject_code`); a re-import that changes it recalculates the charging of the
    line, and the report states it with an `updated` difference on this column (WF-CRE-0020,
    WF-INTF-0140). A kept column of the file (`ActualCostLine.passthrough`, WF-CRE-0010) is
    named `passthrough.<column>`, as the sort names it: a re-import that changes its value —
    the supplier of a document — is an `updated` difference on it, and not an unchanged line.
    The document number identifies the line together with the item of the document
    (`document_item`): both serve for sorting and are never a difference field
    (`ImportDifference.label`, `ImportDifference.document_item`; D-4). The tracked scope and the
    exclusion reason, which the server deduces, are not columns of the file.
  anyOf:
    - type: string
      enum: [document_date, document_number, document_item, amount, subproject]
    - type: string
      pattern: '^passthrough\..+$'

ImportApply:
  type: object
  required: [confirmed]
  description: >-
    Applies the import in a single transaction. The rights and the state of the project are
    checked again at execution time: a confirmed import is not applied if
    one of the conditions has ceased to be true since the analysis (WF-ARC-0100).
  properties:
    confirmed:
      type: boolean
      const: true

ExportKind:
  type: string
  enum:
    - ms_project_schedule
    - estimate
    - remaining
    - task_tree_image
  description: >-
    The kind of an export: the MS Project schedule, with its calendars (FLX-02, WF-INTF-0050),
    the estimate (FLX-04, WF-INTF-0110), the remaining to commit (FLX-06, WF-INTF-0130), and the
    image of the task tree, a document outside the exchange flows (WF-PLA-0120, WF-INTF-0150).
    The `export_*` commands of a revision each judge one of them (`RevisionCommand`).

ExportRequest:
  type: object
  required: [kind, revision_id]
  description: >-
    Requests an export. The file is generated by the worker, stored in object storage, and
    deleted after its first complete download, or after twenty-four hours
    if it has not been downloaded; an interrupted download leaves it in place (WF-DAT-0120,
    WF-ARC-0040). The headers of the Excel formats do not depend on the language (WF-INTF-0180).
  properties:
    kind: { $ref: '#/ExportKind' }
    revision_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        The exported revision, current or marked, required: it is its `export_*` command that
        judges the export (`RevisionCommand`, WF-INTF-0110, WF-INTF-0130). No revision is
        taken by default.
    structure_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        The exported structure, of the named revision; the main structure by default
        (WF-INTF-0050, WF-INTF-0110, WF-INTF-0130, WF-PLA-0120).
    depth:
      anyOf: [{ type: integer, minimum: 1 }, { type: 'null' }]
      description: >-
        The depth level kept for the task tree image (`task_tree_image`), from 1, the first
        level. Null or absent, the whole depth of the structure; a level beyond the depth of the
        structure gives the whole structure. Not applicable to another kind, which ignores it
        (WF-PLA-0120).
    review_date:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: >-
        For a remaining to commit (`remaining`), the review date that the file carries in
        "Synthèse", and that its import will use to complete a task all of whose lines
        carry a zero remainder (WF-INTF-0130, WF-INTF-0120, `ImportCompletedTask.completed_on`);
        the day of the request by default. Not applicable to another kind, which ignores it.
