# Référentiel commun de l'entreprise (FBS-3). Un objet du référentiel ne se
# supprime pas : il se désactive (WF-REF-0010), reste lisible partout où il est
# employé (WF-REF-0150), et sa modification n'affecte aucune révision marquée
# (WF-REF-0130).

ActiveFlag:
  type: object
  required: [is_active]
  properties:
    is_active:
      type: boolean
      description: Faux pour un objet désactivé, qui n'est plus proposé à la saisie (WF-REF-0010).

ReferenceCommand:
  type: string
  enum: [deactivate, reactivate]
  description: >-
    Commandes portées par un objet du référentiel — nœud d'organisation, rôle de ressource,
    calendrier, nature et catégorie de coût (WF-IHM-0090) : le désactiver et le réactiver, par
    l'opération de son activation (`setOrgNodeActivation`, `setResourceRoleActivation`,
    `setCalendarActivation`, `setCostTypeActivation`, `setCostCategoryActivation`) ; aucune ne le
    supprime (WF-REF-0010). Un objet ne porte que celle qui change son état : `deactivate` s'il
    est actif, `reactivate` s'il est désactivé. L'une et l'autre relèvent de la permission de
    modification de sa fonction — `resource_settings.write` pour les nœuds, les rôles et les
    calendriers, `cost_settings.write` pour les natures et les catégories (WF-ADM-0100). La
    réactivation d'un nœud dont le parent est désactivé est indisponible,
    `org_node_parent_active` manquante, et celle d'un rôle dont le nœud est désactivé,
    `org_node_active` manquante (WF-REF-0080) ; la désactivation du calendrier par défaut,
    `calendar_not_default` manquante, tant qu'un autre n'a pas été désigné (WF-REF-0120). Toute
    autre est disponible dès qu'elle est listée : aucune exigence ne conditionne la réactivation
    d'une catégorie à sa nature, ni celle d'un rôle à sa catégorie ou à son calendrier.

ReferenceCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/ReferenceCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Vide lorsque la commande est disponible.
      items: { $ref: projects.yaml#/CommandCondition }

ReferenceCommands:
  type: array
  maxItems: 1
  description: >-
    Commandes de l'objet que l'appelant a la permission d'exercer, chacune disponible ou non,
    avec les conditions qui lui manquent (WF-IHM-0090, `ReferenceCommand`) : au plus une, celle
    qui change son état. Une commande absente de la liste n'est pas présentée ; la liste est vide
    pour qui lit l'objet sans la permission de modifier sa fonction — un rôle ou une catégorie
    lus pour choisir ceux d'une ligne de devis (WF-DEV-0020). Un appel envoyé malgré la liste est
    refusé par son code d'erreur.
  items: { $ref: '#/ReferenceCommandAvailability' }

ReferenceObjectCommands:
  type: object
  required: [available_commands]
  description: >-
    Ce qu'un objet du référentiel lu aujourd'hui ajoute à son image : ses commandes. Une image
    figée par une révision marquée n'en porte pas (`EmployedReference`).
  properties:
    available_commands: { $ref: '#/ReferenceCommands' }

OrgNode:
  type: object
  required:
    - org_node_id
    - code
    - label
    - parent_id
    - parent_label
    - level
    - is_active
    - available_commands
    - audit
    - lock_version
  description: >-
    Nœud de l'arbre d'organisation, qui porte un code unique et un libellé. Il ne porte
    aucune habilitation (WF-REF-0070).
  properties:
    org_node_id: { $ref: ../common.yaml#/Uuid }
    code:
      type: string
      minLength: 1
      maxLength: 20
      description: >-
        Code du nœud, unique dans l'arbre, désactivés compris : un code déjà porté est
        refusé par 409, `ALREADY_EXISTS` (WF-REF-0070).
    label: { type: string, minLength: 1, maxLength: 200 }
    parent_id:
      anyOf:
        - $ref: ../common.yaml#/Uuid
        - type: 'null'
    parent_label:
      anyOf:
        - { type: string, minLength: 1, maxLength: 200 }
        - type: 'null'
      description: >-
        Le libellé du nœud parent, résolu à la lecture, qu'il soit actif ou désactivé
        (WF-REF-0150) ; nul pour une racine.
    level:
      type: integer
      minimum: 1
      description: >-
        Profondeur du nœud dans l'arbre, résolue à la lecture : 1 pour une racine, celle de
        son parent plus un pour les autres — un arbre de six niveaux va de 1 à 6
        (WF-REF-0070).
    is_active: { type: boolean }
    available_commands: { $ref: '#/ReferenceCommands' }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

OrgNodeWrite:
  type: object
  required: [code, label]
  properties:
    code: { type: string, minLength: 1, maxLength: 20 }
    label: { type: string, minLength: 1, maxLength: 200 }
    parent_id:
      anyOf:
        - $ref: ../common.yaml#/Uuid
        - type: 'null'

OrgNodeUpdate:
  description: >-
    Modification d'un nœud d'organisation : porte le compteur lu,
    qu'une création n'a pas.
  allOf:
    - $ref: '#/OrgNodeWrite'
    - type: object
      required: [lock_version]
      properties:
        lock_version: { $ref: ../common.yaml#/LockVersion }

ResourceRole:
  description: >-
    Rôle de ressource tel que le référentiel le lit aujourd'hui : son image, et ses commandes
    (`available_commands`, WF-IHM-0090).
  allOf:
    - $ref: '#/ResourceRoleImage'
    - $ref: '#/ReferenceObjectCommands'

ResourceRoleImage:
  type: object
  required:
    - resource_role_id
    - label
    - org_node_id
    - org_node_label
    - cost_category_id
    - cost_category_label
    - calendar_id
    - calendar_label
    - capacity
    - is_active
    - audit
    - lock_version
  description: >-
    Rôle de ressource. Il relève d'un nœud d'organisation, d'une catégorie de coût
    et d'un calendrier (WF-REF-0090), et porte une capacité unique (WF-REF-0100). L'image
    seule, sans commandes : celle qu'une révision marquée fige (`EmployedReference`).
  properties:
    resource_role_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 200 }
    org_node_id: { $ref: ../common.yaml#/Uuid }
    org_node_label:
      type: string
      minLength: 1
      maxLength: 200
      description: Le libellé du nœud, résolu à la lecture, actif ou désactivé (WF-REF-0150).
    cost_category_id: { $ref: ../common.yaml#/Uuid }
    cost_category_label:
      type: string
      minLength: 1
      maxLength: 200
      description: Le libellé de la catégorie, résolu à la lecture, active ou désactivée (WF-REF-0150).
    calendar_id: { $ref: ../common.yaml#/Uuid }
    calendar_label:
      type: string
      minLength: 1
      maxLength: 200
      description: Le libellé du calendrier, résolu à la lecture, actif ou désactivé (WF-REF-0150).
    capacity: { $ref: '#/RoleCapacity' }
    is_active: { type: boolean }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

RoleCapacity:
  type: object
  required: [monthly_hours, headcount]
  description: Capacité unique, sans date de validité (WF-REF-0100).
  properties:
    monthly_hours: { $ref: ../common.yaml#/Hours }
    headcount: { $ref: ../common.yaml#/Decimal }

ResourceRoleWrite:
  type: object
  required: [label, org_node_id, cost_category_id, calendar_id, capacity]
  properties:
    label: { type: string, minLength: 1, maxLength: 200 }
    org_node_id: { $ref: ../common.yaml#/Uuid }
    cost_category_id: { $ref: ../common.yaml#/Uuid }
    calendar_id: { $ref: ../common.yaml#/Uuid }
    capacity: { $ref: '#/RoleCapacity' }

ResourceRoleUpdate:
  description: >-
    Modification d'un rôle de ressource : porte le compteur lu,
    qu'une création n'a pas.
  allOf:
    - $ref: '#/ResourceRoleWrite'
    - type: object
      required: [lock_version]
      properties:
        lock_version: { $ref: ../common.yaml#/LockVersion }

Calendar:
  description: >-
    Calendrier tel que le référentiel le lit aujourd'hui : son image, et ses commandes
    (`available_commands`, WF-IHM-0090).
  allOf:
    - $ref: '#/CalendarImage'
    - $ref: '#/ReferenceObjectCommands'

CalendarImage:
  type: object
  required: [calendar_id, label, weekly_hours, is_default, is_active, audit, lock_version]
  description: >-
    Calendrier : sept valeurs d'heures, du lundi au dimanche. Ni jours fériés ni
    temps partiels (WF-REF-0110). Un et un seul calendrier actif est par défaut
    (WF-REF-0120). L'image seule, sans commandes : celle qu'une révision marquée fige
    (`EmployedReference`).
  properties:
    calendar_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 200 }
    weekly_hours: { $ref: '#/WeeklyHours' }
    is_default: { type: boolean }
    is_active: { type: boolean }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

WeeklyHours:
  type: object
  required: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
  properties:
    monday: { $ref: ../common.yaml#/Hours }
    tuesday: { $ref: ../common.yaml#/Hours }
    wednesday: { $ref: ../common.yaml#/Hours }
    thursday: { $ref: ../common.yaml#/Hours }
    friday: { $ref: ../common.yaml#/Hours }
    saturday: { $ref: ../common.yaml#/Hours }
    sunday: { $ref: ../common.yaml#/Hours }

CalendarWrite:
  type: object
  required: [label, weekly_hours]
  properties:
    label: { type: string, minLength: 1, maxLength: 200 }
    weekly_hours: { $ref: '#/WeeklyHours' }

CalendarUpdate:
  description: >-
    Modification d'un calendrier : porte le compteur lu,
    qu'une création n'a pas.
  allOf:
    - $ref: '#/CalendarWrite'
    - type: object
      required: [lock_version]
      properties:
        lock_version: { $ref: ../common.yaml#/LockVersion }

CostTypeKind:
  type: string
  enum: [labor, non_labor, provision]
  description: >-
    Type d'une nature de coût (WF-REF-0030). Il ne change plus dès qu'une
    catégorie rattachée est employée.

CostType:
  type: object
  required: [cost_type_id, code, label, kind, is_active, available_commands, audit, lock_version]
  description: Nature de coût (WF-REF-0030).
  properties:
    cost_type_id: { $ref: ../common.yaml#/Uuid }
    code: { type: string, minLength: 1, maxLength: 20 }
    label: { type: string, minLength: 1, maxLength: 200 }
    kind: { $ref: '#/CostTypeKind' }
    is_active: { type: boolean }
    available_commands: { $ref: '#/ReferenceCommands' }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

CostTypeWrite:
  type: object
  required: [code, label, kind]
  properties:
    code: { type: string, minLength: 1, maxLength: 20 }
    label: { type: string, minLength: 1, maxLength: 200 }
    kind: { $ref: '#/CostTypeKind' }

CostTypeUpdate:
  description: >-
    Modification d'un type de coût : porte le compteur lu,
    qu'une création n'a pas.
  allOf:
    - $ref: '#/CostTypeWrite'
    - type: object
      required: [lock_version]
      properties:
        lock_version: { $ref: ../common.yaml#/LockVersion }

CostCategory:
  description: >-
    Catégorie de coût telle que le référentiel la lit aujourd'hui : son image, et ses commandes
    (`available_commands`, WF-IHM-0090).
  allOf:
    - $ref: '#/CostCategoryImage'
    - $ref: '#/ReferenceObjectCommands'

CostCategoryImage:
  type: object
  required: [cost_category_id, code, label, cost_type_id, cost_type_label, is_active, audit, lock_version]
  description: >-
    Catégorie de coût, rattachée à une nature (WF-REF-0040). L'image seule, sans commandes :
    celle qu'une révision marquée fige (`EmployedReference`).
  properties:
    cost_category_id: { $ref: ../common.yaml#/Uuid }
    code: { type: string, minLength: 1, maxLength: 20 }
    label: { type: string, minLength: 1, maxLength: 200 }
    cost_type_id: { $ref: ../common.yaml#/Uuid }
    cost_type_label:
      type: string
      minLength: 1
      maxLength: 200
      description: Le libellé de la nature, résolu à la lecture, active ou désactivée (WF-REF-0150).
    accounting_code:
      anyOf:
        - type: string
        - type: 'null'
      description: Code comptable, documentaire (WF-REF-0040).
    is_active: { type: boolean }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

CostCategoryWrite:
  type: object
  required: [code, label, cost_type_id]
  properties:
    code: { type: string, minLength: 1, maxLength: 20 }
    label: { type: string, minLength: 1, maxLength: 200 }
    cost_type_id: { $ref: ../common.yaml#/Uuid }
    accounting_code:
      anyOf:
        - type: string
        - type: 'null'

CostCategoryUpdate:
  description: >-
    Modification d'une catégorie de coût : porte le compteur lu,
    qu'une création n'a pas.
  allOf:
    - $ref: '#/CostCategoryWrite'
    - type: object
      required: [lock_version]
      properties:
        lock_version: { $ref: ../common.yaml#/LockVersion }

HourlyRate:
  type: object
  required: [cost_category_id, year, amount, audit, lock_version]
  description: >-
    Taux horaire d'une catégorie de main-d'œuvre, au plus un par année
    (WF-REF-0050). Sa correction n'affecte aucune révision marquée (WF-REF-0130).
  properties:
    cost_category_id: { $ref: ../common.yaml#/Uuid }
    year: { $ref: ../common.yaml#/Year }
    amount: { $ref: ../common.yaml#/Money }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

HourlyRateGrid:
  type: object
  required: [years, rows, meta]
  description: >-
    Une page de la grille des taux horaires : une ligne par catégorie de main-d'œuvre, une
    colonne par année qui porte au moins un taux (WF-REF-0050). Une année sans taux pour
    une catégorie est une cellule vide, et aucune colonne n'est créée d'elle-même : une année
    s'ajoute par le premier taux qu'on y saisit (WF-REF-0060). Les colonnes sont celles de toute
    la grille, quelles que soient la page, la recherche et le tri : une colonne ne disparaît pas
    d'une page à l'autre.
  properties:
    years:
      type: array
      description: >-
        Les années de toute la grille, croissantes ; les colonnes. Elles ne dépendent que de la
        portée de la lecture : les années où une catégorie active porte un taux, et où une
        catégorie active ou désactivée en porte un quand `include_inactive` est vrai ou
        `is_active` faux. Elles ne dépendent jamais d'`is_active` vrai, de la recherche, des
        bornes, du tri ni de la page : une colonne ne disparaît pas d'une page ou d'un filtre à
        l'autre.
      items: { $ref: ../common.yaml#/Year }
    rows:
      type: array
      description: >-
        Les catégories de main-d'œuvre de la page, dans l'ordre demandé (`sort_by`) — absent,
        celui du code.
      items: { $ref: '#/HourlyRateRow' }
    meta: { $ref: ../common.yaml#/PaginationMeta }

HourlyRateRow:
  type: object
  required: [cost_category_id, code, label, is_active, cells]
  description: >-
    Une ligne de la grille : la catégorie, nommée pour que la grille n'ait rien à joindre,
    et une cellule par année de `years`, dans le même ordre.
  properties:
    cost_category_id: { $ref: ../common.yaml#/Uuid }
    code: { type: string, minLength: 1, maxLength: 20 }
    label: { type: string, minLength: 1, maxLength: 200 }
    is_active: { type: boolean }
    cells:
      type: array
      description: >-
        Le taux de chaque année de `years`, à la même place ; nul pour une année sans taux
        (WF-REF-0060).
      items:
        anyOf: [{ $ref: '#/HourlyRate' }, { type: 'null' }]

HourlyRateWrite:
  description: >-
    Le compteur est absent à la première saisie de l'année, où le taux n'existe
    pas encore, et obligatoire pour corriger un taux déjà saisi.
  type: object
  required: [amount]
  properties:
    amount: { $ref: ../common.yaml#/Money }
    lock_version: { $ref: ../common.yaml#/LockVersion }

Installation:
  type: object
  required: [default_language, avatar_max_bytes, external_backup_max_bytes]
  description: >-
    Paramètres de l'installation lisibles sans session : ce que le front doit savoir avant
    d'ouvrir une session, ou pour régler ce qu'il laisse passer.
  properties:
    default_language: { $ref: ../common.yaml#/Language }
    avatar_max_bytes:
      type: integer
      minimum: 1
      maximum: 8388608
      description: >-
        La taille la plus grande qu'un avatar peut avoir, en octets (§4.4.1, WF-ADM-0080) :
        un réglage de l'installation, que `putMyAvatar` applique (413, `FILE_TOO_LARGE`), et
        que le front lit pour dire la borne avant l'envoi. Le réglage ne dépasse pas 8 Mio
        (8 388 608 octets) : le front règle d'avance la taille de corps qu'il laisse passer
        au-dessus de ce maximum, l'enveloppe du formulaire comprise, pour que le refus d'une
        image trop lourde vienne de l'API et se dise par son code.
    external_backup_max_bytes:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      description: >-
        La taille la plus grande d'une sauvegarde copiée hors de la plateforme et déposée
        pour une restauration (`uploadFile`, `external_backup`, WF-ADM-0160), en octets : un
        réglage de l'installation, la spécification ne fixant pas la taille d'une
        sauvegarde ; au-delà, 413, `FILE_TOO_LARGE`. Le réglage ne dépasse pas 2^53 − 1
        (9 007 199 254 740 991 octets, environ 8 Pio), le plus grand entier qu'un nombre JSON
        garde exact quand le front le lit.

ReferenceSettings:
  type: object
  required:
    - currency_code
    - default_language
    - risk_matrix
    - index_thresholds
    - max_weeks_between_reviews
    - lock_version
  description: >-
    Paramètres d'installation et d'indicateurs : devise unique (WF-REF-0140),
    langue par défaut (WF-INTF-0160), matrice de risques (WF-REF-0160), seuils
    d'alerte (WF-REF-0170) et délai maximal entre deux revues (WF-REF-0180).
  properties:
    currency_code:
      type: string
      pattern: '^[A-Z]{3}$'
      description: Devise unique, choisie à l'installation et non modifiable (WF-REF-0140).
    default_language: { $ref: ../common.yaml#/Language }
    risk_matrix: { $ref: '#/RiskMatrixSettings' }
    index_thresholds: { $ref: '#/IndexThresholds' }
    max_weeks_between_reviews: { type: integer, minimum: 1, maximum: 104 }
    lock_version: { $ref: ../common.yaml#/LockVersion }

ReferenceSettingsWrite:
  type: object
  required: [lock_version]
  properties:
    default_language: { $ref: ../common.yaml#/Language }
    risk_matrix: { $ref: '#/RiskMatrixSettings' }
    index_thresholds: { $ref: '#/IndexThresholds' }
    max_weeks_between_reviews: { type: integer, minimum: 1, maximum: 104 }
    lock_version: { $ref: ../common.yaml#/LockVersion }

RiskMatrixSettings:
  type: object
  required: [probability_bounds, severity_bounds, zones]
  description: >-
    Matrice à quatre niveaux de probabilité et quatre de gravité (WF-REF-0160,
    WF-RIS-0040). Les bornes de gravité sont exprimées en pourcentage du budget de
    référence.
  properties:
    probability_bounds:
      type: array
      minItems: 3
      maxItems: 3
      items: { $ref: ../common.yaml#/Percent }
    severity_bounds:
      type: array
      minItems: 3
      maxItems: 3
      items: { $ref: ../common.yaml#/Percent }
    zones:
      type: array
      minItems: 16
      maxItems: 16
      description: >-
        La zone de chaque case, rangée par niveau de probabilité puis par niveau de
        gravité, l'un et l'autre du plus bas au plus haut : la case de probabilité p et
        de gravité g, de 1 à 4, est la zone de rang 4 × (p − 1) + (g − 1), en comptant
        depuis zéro.
      items: { $ref: '#/AlertZone' }

IndexThresholds:
  type: object
  required: [cost_watch, cost_alert, schedule_watch, schedule_alert]
  description: Seuils de vigilance et d'alerte des deux indices, inférieurs à 1 (WF-REF-0170).
  properties:
    cost_watch: { $ref: ../common.yaml#/Decimal }
    cost_alert: { $ref: ../common.yaml#/Decimal }
    schedule_watch: { $ref: ../common.yaml#/Decimal }
    schedule_alert: { $ref: ../common.yaml#/Decimal }

DurationUnits:
  type: object
  required: [hours_per_day, hours_per_week, days_per_month, lock_version]
  description: >-
    Les trois constantes de l'installation par lesquelles les jours, les semaines et les
    mois de travail se convertissent en heures (WF-PLA-0160) : avec les valeurs par
    défaut, « 2 j » vaut seize heures, « 1 sem » quarante et « 1 m » cent soixante.
    Communes à tous les projets, comme la devise l'est aux montants.
  properties:
    hours_per_day:
      allOf: [{ $ref: ../common.yaml#/Decimal }]
      description: 8 par défaut.
    hours_per_week:
      allOf: [{ $ref: ../common.yaml#/Decimal }]
      description: 40 par défaut.
    days_per_month:
      allOf: [{ $ref: ../common.yaml#/Decimal }]
      description: 20 par défaut.
    lock_version: { $ref: ../common.yaml#/LockVersion }

DurationUnitsWrite:
  type: object
  required: [hours_per_day, hours_per_week, days_per_month, lock_version]
  description: >-
    Les trois constantes, strictement positives, et le compteur lu (WF-PLA-0160) : le
    motif refuse un signe, et une constante nulle est refusée par 422, `fields` la nommant.
  properties:
    hours_per_day:
      allOf: [{ $ref: ../common.yaml#/Decimal }]
      pattern: '^\d+(\.\d+)?$'
    hours_per_week:
      allOf: [{ $ref: ../common.yaml#/Decimal }]
      pattern: '^\d+(\.\d+)?$'
    days_per_month:
      allOf: [{ $ref: ../common.yaml#/Decimal }]
      pattern: '^\d+(\.\d+)?$'
    lock_version: { $ref: ../common.yaml#/LockVersion }

AlertZone:
  type: string
  enum: [nominal, watch, alert]
  description: >-
    Zone d'un signalement, employée par tous les indicateurs et doublée d'un
    indice non coloré à l'affichage (WF-REF-0170, WF-IHM-0070).

ReferenceReadiness:
  type: object
  required: [is_complete, missing]
  description: >-
    Référentiel minimal exigé pour créer un projet (WF-CYC-0120). Le refus nomme
    chaque prérequis manquant.
  properties:
    is_complete: { type: boolean }
    missing:
      type: array
      items:
        type: string
        enum: [default_calendar_with_hours, active_cost_category, active_resource_role]
