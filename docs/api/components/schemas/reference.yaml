# The company's common reference data (FBS-3). A reference data object is not
# deleted: it is deactivated (WF-REF-0010), stays readable wherever it is
# used (WF-REF-0150), and changing it affects no marked revision
# (WF-REF-0130).

ActiveFlag:
  type: object
  required: [is_active]
  properties:
    is_active:
      type: boolean
      description: False for a deactivated object, which is no longer offered for entry (WF-REF-0010).

ReferenceCommand:
  type: string
  enum: [deactivate, reactivate]
  description: >-
    Commands carried by a reference data object — organisation node, resource role; a calendar
    carries them under `CalendarCommand`, which adds its designation as default to them, a cost
    type and a cost category under `CostTypeCommand` and `CostCategoryCommand`, which add the
    change of their kind to them (WF-IHM-0090): deactivating and reactivating it, through the
    operation that sets its activation (`setOrgNodeActivation`, `setResourceRoleActivation`,
    `setCalendarActivation`, `setCostTypeActivation`, `setCostCategoryActivation`); none of them
    deletes it (WF-REF-0010). An object carries only the one that changes its state: `deactivate`
    if it is active, `reactivate` if it is deactivated. Both fall under the write permission of
    its function — `resource_settings.write` for nodes, roles and calendars,
    `cost_settings.write` for cost types and categories (WF-ADM-0100). Reactivating a node whose
    parent is deactivated is unavailable, `org_node_parent_active` missing, and reactivating a
    role whose node is deactivated, `org_node_active` missing (WF-REF-0080); deactivating the
    default calendar, `calendar_not_default` missing, as long as another one has not been
    designated (WF-REF-0120); reactivating a category whose cost type is deactivated,
    `cost_type_active` missing (WF-REF-0010; EP-14/L42s, C-291). Any other one is available as
    soon as it is listed: no requirement makes reactivating a role depend on its category or on
    its calendar.

ReferenceCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/ReferenceCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Empty when the command is available.
      items: { $ref: projects.yaml#/CommandCondition }

ReferenceCommands:
  type: array
  maxItems: 1
  description: >-
    The object's commands that the caller has the permission to exercise, each available or not,
    with the conditions it is missing (WF-IHM-0090, `ReferenceCommand`): at most one, the one
    that changes its state. A command absent from the list is not presented; the list is empty
    for whoever reads the object without the permission to modify its function — a role read to
    choose the role of an estimate line (WF-DEV-0020). A call sent despite the list is refused
    with its error code.
  items: { $ref: '#/ReferenceCommandAvailability' }

ReferenceObjectCommands:
  type: object
  required: [available_commands]
  description: >-
    What a resource role read today adds to its image: its commands. An image frozen by a
    marked revision carries none (`EmployedReference`).
  properties:
    available_commands: { $ref: '#/ReferenceCommands' }

OrgNode:
  type: object
  required:
    - org_node_id
    - code
    - label
    - parent_id
    - parent_label
    - level
    - is_active
    - available_commands
    - audit
    - lock_version
  description: >-
    Node of the organisation tree, which carries a unique code and a label. It carries no
    access rights (WF-REF-0070). Its commands are those of `ReferenceCommand`.
  properties:
    org_node_id: { $ref: ../common.yaml#/Uuid }
    code:
      type: string
      minLength: 1
      pattern: '\S'
      maxLength: 20
      description: >-
        Code of the node, unique in the tree, deactivated nodes included: a code already in use
        is refused with 409, `ALREADY_EXISTS` (WF-REF-0070).
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 200 }
    parent_id:
      anyOf:
        - $ref: ../common.yaml#/Uuid
        - type: 'null'
    parent_label:
      anyOf:
        - { type: string, minLength: 1, maxLength: 200 }
        - type: 'null'
      description: >-
        The label of the parent node, resolved on read, whether it is active or deactivated
        (WF-REF-0150); null for a root.
    level:
      type: integer
      minimum: 1
      description: >-
        Depth of the node in the tree, resolved on read: 1 for a root, its parent's depth plus
        one for the others — a six-level tree goes from 1 to 6
        (WF-REF-0070).
    is_active: { type: boolean }
    available_commands: { $ref: '#/ReferenceCommands' }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

OrgNodeWrite:
  type: object
  required: [code, label]
  properties:
    code: { type: string, minLength: 1, pattern: '\S', maxLength: 20 }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 200 }
    parent_id:
      anyOf:
        - $ref: ../common.yaml#/Uuid
        - type: 'null'
      description: >-
        The node's parent, absent or null on creation for a root; required on modification
        (`OrgNodeUpdate`), where the root is written `null` and an absent parent is refused with
        `VALUE_REQUIRED`. A node is only created or moved under an
        active node or at the root (WF-REF-0070): no active object remains in a closed department
        (WF-REF-0080). Refused with 422 on `/parent_id`: a node the reference data does not
        have, `UNKNOWN_ORG_NODE`; the node itself or one of its descendants, `ORG_NODE_CYCLE`;
        a deactivated node, `INACTIVE_REFERENCE_OBJECT` — on modification, only when it
        changes the parent, judged on the value sent: a deactivated node that keeps its
        deactivated parent can be modified. A single reason, the first in this order: unknown,
        then cycle, then deactivated.

OrgNodeUpdate:
  description: >-
    Modification of an organisation node: carries the lock version read, which a creation does
    not have, and its parent, required — null for a root —, the whole body being sent: an absent
    parent is read neither as the root nor as the parent read: it is refused, 422
    `VALUE_REQUIRED` on `/parent_id`.
  allOf:
    - $ref: '#/OrgNodeWrite'
    - type: object
      required: [lock_version, parent_id]
      properties:
        lock_version: { $ref: ../common.yaml#/LockVersion }
        parent_id:
          anyOf:
            - $ref: ../common.yaml#/Uuid
            - type: 'null'
          description: The parent sent, that of `OrgNodeWrite`, required here; `null` for a root.

ResourceRole:
  description: >-
    Resource role as the reference data reads it today: its image, and its commands
    (`available_commands`, WF-IHM-0090).
  allOf:
    - $ref: '#/ResourceRoleImage'
    - $ref: '#/ReferenceObjectCommands'

ResourceRoleImage:
  type: object
  required:
    - resource_role_id
    - code
    - label
    - org_node_id
    - org_node_label
    - cost_category_id
    - cost_category_label
    - calendar_id
    - calendar_label
    - capacity
    - is_active
    - audit
    - lock_version
  description: >-
    Resource role, which carries a unique code and a label. It belongs to an organisation
    node, a cost category and a calendar (WF-REF-0090), and carries a single capacity
    (WF-REF-0100). The image alone, without commands: the one a marked revision freezes
    (`EmployedReference`).
  properties:
    resource_role_id: { $ref: ../common.yaml#/Uuid }
    code:
      type: string
      minLength: 1
      pattern: '\S'
      maxLength: 20
      description: >-
        Code of the role, unique among roles, deactivated ones included, like a node's: a code
        already in use is refused with 409, `ALREADY_EXISTS` on `/code` (WF-REF-0090).
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 200 }
    org_node_id: { $ref: ../common.yaml#/Uuid }
    org_node_label:
      type: string
      minLength: 1
      maxLength: 200
      description: The label of the node, resolved on read, active or deactivated (WF-REF-0150).
    cost_category_id: { $ref: ../common.yaml#/Uuid }
    cost_category_label:
      type: string
      minLength: 1
      maxLength: 200
      description: The label of the category, resolved on read, active or deactivated (WF-REF-0150).
    calendar_id: { $ref: ../common.yaml#/Uuid }
    calendar_label:
      type: string
      minLength: 1
      maxLength: 200
      description: The label of the calendar, resolved on read, active or deactivated (WF-REF-0150).
    capacity: { $ref: '#/RoleCapacity' }
    is_active: { type: boolean }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

RoleCapacity:
  type: object
  required: [monthly_hours, headcount]
  description: >-
    Single capacity, with no validity date (WF-REF-0100): hours per month and a headcount,
    never negative. On write, a negative value is refused with 422, `VALUE_OUT_OF_RANGE` on
    `/capacity/monthly_hours` or `/capacity/headcount`, `fields[].params.minimum` at `0`.
  properties:
    monthly_hours: { $ref: ../common.yaml#/Hours }
    headcount: { $ref: ../common.yaml#/Decimal }

ResourceRoleWrite:
  type: object
  required: [code, label, org_node_id, cost_category_id, calendar_id, capacity]
  properties:
    code: { type: string, minLength: 1, pattern: '\S', maxLength: 20 }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 200 }
    org_node_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        The node the role belongs to, set at its creation: a role does not move from one node
        to another, it is recreated under the new one (§3.4.4.2.1, WF-REF-0080). A role, created
        active, is not born under a deactivated node: refused with 422,
        `INACTIVE_REFERENCE_OBJECT` on `/org_node_id` (WF-REF-0080); a node the reference data
        does not have, `UNKNOWN_ORG_NODE`.
    cost_category_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        An active category whose cost type is labour (WF-REF-0090): refused with 422 on
        `/cost_category_id`, unknown, `UNKNOWN_COST_CATEGORY`, not labour,
        `LABOUR_CATEGORY_REQUIRED`, deactivated, `INACTIVE_REFERENCE_OBJECT`.
    calendar_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        An active calendar (WF-REF-0090): refused with 422 on `/calendar_id`, unknown,
        `UNKNOWN_CALENDAR`, deactivated, `INACTIVE_REFERENCE_OBJECT`.
    capacity: { $ref: '#/RoleCapacity' }

ResourceRoleUpdate:
  type: object
  required: [code, label, cost_category_id, calendar_id, capacity, lock_version]
  description: >-
    Modification of a resource role: what its creation writes, except its node — its code
    included, which stays unique —, and the lock version read, which a creation does not have.
    A role does not move from one node to another: a reorganisation recreates it under the new
    node (§3.4.4.2.1, WF-REF-0080). Its category and its calendar can be changed to active
    objects, and to a labour category (WF-REF-0090), refused as on creation; a role that
    keeps its own, deactivated since, can be modified.
  properties:
    code: { type: string, minLength: 1, pattern: '\S', maxLength: 20 }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 200 }
    org_node_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        Optional: the role's node, which a form that sends back the whole role it read may carry.
        Sent back unchanged, it changes nothing; different from the role's, the modification is
        refused with 422 `VALIDATION_FAILED`, `fields` designating `/org_node_id` with
        `FIELD_READ_ONLY`: a role's node cannot be modified (WF-REF-0090).
    cost_category_id: { $ref: ../common.yaml#/Uuid }
    calendar_id: { $ref: ../common.yaml#/Uuid }
    capacity: { $ref: '#/RoleCapacity' }
    lock_version: { $ref: ../common.yaml#/LockVersion }

Calendar:
  description: >-
    Calendar as the reference data reads it today: its image, and its commands
    (`available_commands`, WF-IHM-0090).
  allOf:
    - $ref: '#/CalendarImage'
    - type: object
      required: [available_commands]
      properties:
        available_commands: { $ref: '#/CalendarCommands' }

CalendarCommand:
  type: string
  enum: [deactivate, reactivate, set_default]
  description: >-
    Commands carried by a calendar (WF-IHM-0090): deactivating and reactivating it, through
    `setCalendarActivation`, like any reference data object (`ReferenceCommand`) — a calendar
    carries only the one that changes its state —, and designating it as default, through
    `setDefaultCalendar`, listed for every calendar that is not: designating the one that already
    is changes nothing. Deactivating the default calendar is unavailable, `calendar_not_default`
    missing, as long as another one has not been designated; designating a deactivated calendar,
    `calendar_active` missing, the default calendar being active (WF-REF-0120). Reactivation is
    always available. All of them fall under the permission to modify the resource settings
    (`resource_settings.write`, WF-ADM-0100).

CalendarCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/CalendarCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Empty when the command is available.
      items: { $ref: projects.yaml#/CommandCondition }

CalendarCommands:
  type: array
  maxItems: 2
  description: >-
    The calendar's commands that the caller has the permission to exercise, each available or
    not, with the conditions it is missing (WF-IHM-0090), in the order of `CalendarCommand`: at
    most two, the one that changes its state and, if it is not the default calendar, its
    designation as default. A command absent from the list is not presented; the list is empty
    for whoever reads the calendars without the permission to modify the resource settings. A
    call sent despite the list is refused with its error code, except designating the calendar
    that already is the default, not listed, which returns 200 without changing anything — the
    version checked first, 412 if it is stale, like any versioned write.
  items: { $ref: '#/CalendarCommandAvailability' }

CalendarImage:
  type: object
  required: [calendar_id, label, weekly_hours, is_default, is_active, audit, lock_version]
  description: >-
    Calendar: a label and seven hour values, from Monday to Sunday. Neither public holidays nor
    part-time work (WF-REF-0110). One and only one active calendar is the default
    (WF-REF-0120). The image alone, without commands: the one a marked revision freezes
    (`EmployedReference`).
  properties:
    calendar_id: { $ref: ../common.yaml#/Uuid }
    label:
      type: string
      minLength: 1
      pattern: '\S'
      maxLength: 200
      description: >-
        Label of the calendar, unique among calendars, deactivated ones included: a label
        already in use is refused with 409, `ALREADY_EXISTS` on `/label` (WF-REF-0110).
    weekly_hours: { $ref: '#/WeeklyHours' }
    is_default: { type: boolean }
    is_active: { type: boolean }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

WeeklyHours:
  type: object
  required: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
  description: >-
    The hours worked on each day of the week, from `0` to `24` (WF-REF-0110). On write, a value
    outside these bounds is refused with 422, `VALUE_OUT_OF_RANGE` on
    `/weekly_hours/<day>`, `fields[].params.minimum` at `0` or `maximum` at `24`, the only bound
    crossed.
  properties:
    monday: { $ref: ../common.yaml#/Hours }
    tuesday: { $ref: ../common.yaml#/Hours }
    wednesday: { $ref: ../common.yaml#/Hours }
    thursday: { $ref: ../common.yaml#/Hours }
    friday: { $ref: ../common.yaml#/Hours }
    saturday: { $ref: ../common.yaml#/Hours }
    sunday: { $ref: ../common.yaml#/Hours }

CalendarWrite:
  type: object
  required: [label, weekly_hours]
  properties:
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 200 }
    weekly_hours: { $ref: '#/WeeklyHours' }

CalendarUpdate:
  description: >-
    Modification of a calendar: carries the lock version read,
    which a creation does not have.
  allOf:
    - $ref: '#/CalendarWrite'
    - type: object
      required: [lock_version]
      properties:
        lock_version: { $ref: ../common.yaml#/LockVersion }

CostTypeKind:
  type: string
  enum: [labor, non_labor, provision]
  description: >-
    Kind of a cost type (WF-REF-0030): labour, non-labour, risk provision — `provision`, which
    carries only the lines Waterfall computes from a risk, never entered (WF-DEV-0020,
    WF-RIS-0010); an entered, unweighted provision, for contingencies for example, belongs to a
    non-labour cost type (§3.4.4.1.1). It no longer changes once an attached category is used,
    carries an hourly rate or is attached to a resource role (WF-REF-0030): the cost type's
    `change_kind` command says so in advance (`CostTypeCommand`).

CostTypeCommand:
  type: string
  enum: [deactivate, reactivate, change_kind]
  description: >-
    Commands carried by a cost type (WF-IHM-0090): deactivating and reactivating it, through
    `setCostTypeActivation`, like any reference data object (`ReferenceCommand`) — a cost type
    carries only the one that changes its state —, and changing its kind, through
    `updateCostType` with another `kind`, always listed. Changing the kind is unavailable as soon
    as a category attached to the cost type is used — carried by a line of a revision, marked or
    not —, `cost_type_unused` missing, carries an hourly rate, `cost_type_unrated`, or is
    attached to a resource role, active or deactivated, `cost_type_without_role` (WF-REF-0030);
    the rest of the cost type, its code and its label, can always be modified. Deactivation and
    reactivation are always available: the last cost type of the risk provision kind is
    deactivated like any other, and its categories with it (WF-REF-0010; EP-14/L42s, C-291) — the
    creation of a project and the declaration of a risk then name what they are missing
    (WF-REF-0030, WF-CYC-0120, WF-RIS-0010; EP-14/L42p, which withdraws the rule of #578). All of
    them fall under the permission to modify the cost settings (`cost_settings.write`,
    WF-ADM-0100).

CostTypeCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/CostTypeCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Empty when the command is available.
      items: { $ref: projects.yaml#/CommandCondition }

CostTypeCommands:
  type: array
  maxItems: 2
  description: >-
    The cost type's commands that the caller has the permission to exercise, each available or
    not, with the conditions it is missing (WF-IHM-0090), in the order of `CostTypeCommand`: at
    most two, the one that changes its state and the change of its kind. A command absent from
    the list is not presented; the list is empty for whoever reads the cost types without the
    permission to modify the cost settings. The front does not work out whether a category of
    the cost type is used, carries a rate or serves a role (WF-ARC-0020): the cost type says so.
    A call sent despite the list is refused with its error code.
  items: { $ref: '#/CostTypeCommandAvailability' }

CostType:
  type: object
  required: [cost_type_id, code, label, kind, is_active, available_commands, audit, lock_version]
  description: Cost type (WF-REF-0030).
  properties:
    cost_type_id: { $ref: ../common.yaml#/Uuid }
    code:
      type: string
      minLength: 1
      pattern: '\S'
      maxLength: 20
      description: >-
        Code of the cost type, unique among cost types, deactivated ones included: a code already
        in use is refused with 409, `ALREADY_EXISTS` on `/code` (WF-REF-0030).
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 200 }
    kind: { $ref: '#/CostTypeKind' }
    is_active: { type: boolean }
    available_commands: { $ref: '#/CostTypeCommands' }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

CostTypeWrite:
  type: object
  required: [code, label, kind]
  properties:
    code: { type: string, minLength: 1, pattern: '\S', maxLength: 20 }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 200 }
    kind: { $ref: '#/CostTypeKind' }

CostTypeUpdate:
  description: >-
    Modification of a cost type: carries the lock version read, which a creation does not have.
    A `kind` other than the cost type's is refused as soon as an attached category is used,
    carries an hourly rate or is attached to a resource role, which its `change_kind` command
    says in advance (WF-REF-0030); the same `kind` changes nothing.
  allOf:
    - $ref: '#/CostTypeWrite'
    - type: object
      required: [lock_version]
      properties:
        lock_version: { $ref: ../common.yaml#/LockVersion }

CostCategory:
  description: >-
    Cost category as the reference data reads it today: its image, and its commands
    (`available_commands`, WF-IHM-0090).
  allOf:
    - $ref: '#/CostCategoryImage'
    - type: object
      required: [available_commands]
      properties:
        available_commands: { $ref: '#/CostCategoryCommands' }

CostCategoryCommand:
  type: string
  enum: [deactivate, reactivate, change_cost_type]
  description: >-
    Commands carried by a cost category (WF-IHM-0090): deactivating and reactivating it,
    through `setCostCategoryActivation`, like any reference data object (`ReferenceCommand`) — a
    category carries only the one that changes its state —, and
    attaching it to a cost type of another kind, through `updateCostCategory` with a
    `cost_type_id` whose `kind` differs, always listed. This attachment changes the kind of its
    lines and takes it out of, or brings it into, labour: it is unavailable, `cost_category_unused`
    missing, as soon as the category is used — carried by a line of a revision, marked or not —,
    and, `cost_category_unrated` missing, as long as it carries hourly rates, which a non-labour
    category does not carry (WF-REF-0030, WF-REF-0050; author's decision of 2026-10-09,
    #577), and, `cost_category_without_role` missing, as long as a resource role, active or
    deactivated, is attached to it: a category that carries hourly rates, or to which a role is
    attached, does not leave labour (WF-REF-0040, WF-REF-0090). Deactivation is
    always available: the last active category of the risk provision kind is deactivated like
    any other, the creation of a project and the declaration of a risk then naming what they
    are missing (WF-REF-0030, WF-CYC-0120, WF-RIS-0010; EP-14/L42p, which withdraws the
    rule of #578). Reactivation is unavailable under a deactivated cost type,
    `cost_type_active` missing: "a category can only be reactivated if its cost type is
    active" (WF-REF-0010; EP-14/L42s, C-291). Attaching it to another cost type of the same kind
    is not a
    command: nothing makes it unavailable, used or not, and it is done through
    `updateCostCategory` like the rest of the category. All of them fall under the permission to
    modify the cost settings (`cost_settings.write`, WF-ADM-0100).

CostCategoryCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/CostCategoryCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Empty when the command is available.
      items: { $ref: projects.yaml#/CommandCondition }

CostCategoryCommands:
  type: array
  maxItems: 2
  description: >-
    The category's commands that the caller has the permission to exercise, each available or
    not, with the conditions it is missing (WF-IHM-0090), in the order of `CostCategoryCommand`:
    at most two, the one that changes its state and the attachment to a cost type of another
    kind. A command absent from the list is not presented; the list is empty for whoever reads
    the categories without the permission to modify the cost settings — an estimator who chooses
    the category of an estimate line (WF-DEV-0020). The front does not work out whether the
    category is used, carries rates or has a role attached to it (WF-ARC-0020): the
    category says so. A call sent despite
    the list is refused with its error code.
  items: { $ref: '#/CostCategoryCommandAvailability' }

CostCategoryImage:
  type: object
  required:
    - cost_category_id
    - code
    - label
    - cost_type_id
    - cost_type_label
    - cost_type_kind
    - cost_type_is_active
    - accounting_code
    - is_active
    - audit
    - lock_version
  description: >-
    Cost category, attached to a cost type (WF-REF-0040). The image alone, without commands:
    the one a marked revision freezes (`EmployedReference`).
  properties:
    cost_category_id: { $ref: ../common.yaml#/Uuid }
    code:
      type: string
      minLength: 1
      pattern: '\S'
      maxLength: 20
      description: >-
        Code of the category, unique among categories, deactivated ones included, like a cost
        type's: a code already in use is refused with 409, `ALREADY_EXISTS` on `/code`.
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 200 }
    cost_type_id: { $ref: ../common.yaml#/Uuid }
    cost_type_label:
      type: string
      minLength: 1
      maxLength: 200
      description: The label of the cost type, resolved on read, active or deactivated (WF-REF-0150).
    cost_type_kind:
      allOf: [{ $ref: '#/CostTypeKind' }]
      description: >-
        The kind of the cost type, resolved on read like its label: only a labour category
        carries rates (WF-REF-0050) and is attached to a role (WF-REF-0090), and a form offers
        only those without reading the cost types again (WF-ARC-0020).
    cost_type_is_active:
      type: boolean
      description: >-
        Whether the cost type is active, resolved on read like its kind. An active category is
        always under an active cost type, deactivating a cost type deactivating its categories
        (WF-REF-0010; EP-14/L42s, C-291): when false, the category is deactivated and its
        reactivation unavailable as long as the cost type is (`cost_type_active`).
    accounting_code:
      type: string
      minLength: 1
      pattern: '\S'
      maxLength: 20
      description: >-
        Accounting code, required and unique among categories, deactivated ones included: an
        accounting code already in use is refused with 409, `ALREADY_EXISTS` on `/accounting_code`.
        It is informational: it plays no part in any calculation nor in the import of actual
        costs, which does not break down by cost type (WF-INTF-0140); the estimate and remaining
        to commit files use it to designate the category of a non-labour line (WF-REF-0040,
        appendix B).
    is_active: { type: boolean }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

CostCategoryWrite:
  type: object
  required: [code, label, cost_type_id, accounting_code]
  properties:
    code: { type: string, minLength: 1, pattern: '\S', maxLength: 20 }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 200 }
    cost_type_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        The category's cost type, which it requires (WF-REF-0040): absent or null, it is
        refused with 422, `VALUE_REQUIRED` on `/cost_type_id`. A cost type the reference data
        does not have is refused with 422, `UNKNOWN_COST_TYPE` on `/cost_type_id`; a deactivated
        cost type is no longer offered for entry (WF-REF-0010): refused likewise,
        `INACTIVE_REFERENCE_OBJECT`, on creation as on a modification that changes the cost type
        — a category that keeps its own, deactivated, can be modified. A modification to a
        cost type of another kind is refused with 409 when the category is used, carries rates
        or has a role attached to it, which its `change_cost_type` command says in advance;
        to a cost type of the same kind, it is always allowed.
    accounting_code:
      type: string
      minLength: 1
      pattern: '\S'
      maxLength: 20
      description: >-
        The accounting code, of one to twenty characters of which at least one is not a blank:
        empty, refused with 422 `VALUE_REQUIRED` on `/accounting_code`, too long with
        `VALUE_TOO_LONG`, made only of blanks with the pattern's `VALIDATION_FAILED` (WF-REF-0040,
        WF-ARC-0110).

CostCategoryUpdate:
  description: >-
    Modification of a cost category: carries the lock version read,
    which a creation does not have.
  allOf:
    - $ref: '#/CostCategoryWrite'
    - type: object
      required: [lock_version]
      properties:
        lock_version: { $ref: ../common.yaml#/LockVersion }

HourlyRate:
  type: object
  required: [cost_category_id, year, amount, audit, lock_version]
  description: >-
    Hourly rate of a labour category, at most one per year
    (WF-REF-0050). Correcting it affects no marked revision (WF-REF-0130).
  properties:
    cost_category_id: { $ref: ../common.yaml#/Uuid }
    year: { $ref: ../common.yaml#/Year }
    amount: { $ref: ../common.yaml#/Money }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

HourlyRateImage:
  type: object
  required: [cost_category_id, year, amount]
  description: >-
    Hourly rate of a labour category for a year, as a revision keeps it (WF-REV-0030, §4.4.1
    "revision_rate"): its value alone, without the audit or the lock version of the reference
    data rate, which move after marking without changing anything in the revision (WF-REF-0130).
  properties:
    cost_category_id: { $ref: ../common.yaml#/Uuid }
    year: { $ref: ../common.yaml#/Year }
    amount: { $ref: ../common.yaml#/Money }

HourlyRateGrid:
  type: object
  required: [years, rows, meta]
  description: >-
    A page of the hourly rate grid: one row per labour category, one column per year that
    carries at least one rate (WF-REF-0050). A year without a rate for a category is an empty
    cell, and no column is created by itself: a year is added by the first rate entered in it
    (WF-REF-0060). The columns are those of the whole grid, whatever the page, the search and
    the sort: a column does not disappear from one page to the next.
  properties:
    years:
      type: array
      description: >-
        The years of the whole grid, ascending; the columns. They depend only on the scope of
        the read: the years in which an active category carries a rate, and in which an active
        or deactivated category carries one when `include_inactive` is true or `is_active`
        false. They never depend on `is_active` true, on the search, the bounds, the sort or the
        page: a column does not disappear from one page or filter to the next.
      items: { $ref: ../common.yaml#/Year }
    rows:
      type: array
      description: >-
        The labour categories of the page, in the order requested (`sort_by`) — when absent,
        the order of the code.
      items: { $ref: '#/HourlyRateRow' }
    meta: { $ref: ../common.yaml#/PaginationMeta }

HourlyRateRow:
  type: object
  required: [cost_category_id, code, label, is_active, cells]
  description: >-
    A row of the grid: the category, named so that the grid has nothing to join,
    and one cell per year of `years`, in the same order.
  properties:
    cost_category_id: { $ref: ../common.yaml#/Uuid }
    code: { type: string, minLength: 1, pattern: '\S', maxLength: 20 }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 200 }
    is_active: { type: boolean }
    cells:
      type: array
      description: >-
        The rate of each year of `years`, at the same position; null for a year without a rate
        (WF-REF-0060).
      items:
        anyOf: [{ $ref: '#/HourlyRate' }, { type: 'null' }]

HourlyRateWrite:
  description: >-
    The lock version is absent on the first entry for the year, when the rate does not exist
    yet, and mandatory to correct a rate already entered. A first entry, without a lock
    version, for a year that already carries a rate would be a second one: refused with 409,
    `ALREADY_EXISTS` (WF-REF-0050).
  type: object
  required: [amount]
  properties:
    amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        The hourly rate, positive and bounded: a zero or negative amount is refused with 422,
        `VALUE_OUT_OF_RANGE` on `/amount`, `fields[].params.minimum` at `0.01`, the smallest
        positive amount a `Money` writes; an amount beyond `9999999999.99`, what the rate
        column holds, is refused likewise, `fields[].params.maximum` at `9999999999.99`
        (a `Money` has no upper bound: the schema, a string, states it here and not with `maximum`).
    lock_version: { $ref: ../common.yaml#/LockVersion }

Installation:
  type: object
  required: [default_language, avatar_max_bytes, external_backup_max_bytes]
  description: >-
    Installation settings readable without a session: what the front must know before
    opening a session, or to set what it lets through.
  properties:
    default_language: { $ref: ../common.yaml#/Language }
    avatar_max_bytes:
      type: integer
      minimum: 1
      maximum: 8388608
      description: >-
        The largest size an avatar can have, in bytes (§4.4.1, WF-ADM-0080): an
        installation setting, which `putMyAvatar` applies (413, `FILE_TOO_LARGE`), and
        which the front reads to state the limit before sending. The setting does not exceed
        8 MiB (8,388,608 bytes): the front sets in advance the body size it lets through
        above this maximum, the form envelope included, so that the refusal of an
        overweight image comes from the API and is stated by its code.
    external_backup_max_bytes:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      description: >-
        The largest size of a backup copied off the platform and uploaded
        for a restore (`openChunkedUpload`, WF-ADM-0160), in bytes: an
        installation setting, the specification not fixing the size of a
        backup; beyond it, 413, `FILE_TOO_LARGE`. The setting does not exceed 2^53 − 1
        (9,007,199,254,740,991 bytes, about 8 PiB), the largest integer a JSON number
        keeps exact when the front reads it.

ReferenceSettings:
  type: object
  required:
    - currency_code
    - company_name
    - default_language
    - risk_matrix
    - index_thresholds
    - max_weeks_between_reviews
    - audit
    - lock_version
  description: >-
    Installation and indicator settings: single currency (WF-REF-0140), name of the user
    company (WF-EXP-0020), default language (WF-INTF-0160), risk matrix
    (WF-REF-0160), alert thresholds (WF-REF-0170) and maximum interval between two reviews
    (WF-REF-0180).
  properties:
    currency_code:
      type: string
      pattern: '^[A-Z]{3}$'
      description: Single currency, chosen at installation and not modifiable (WF-REF-0140).
    company_name:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '\S'
      description: >-
        The name of the user company, entered at installation and modifiable afterwards, which
        the exported files carry (WF-EXP-0020): from 1 to 200 characters, never blank.
    default_language: { $ref: ../common.yaml#/Language }
    risk_matrix: { $ref: '#/RiskMatrixSettings' }
    index_thresholds: { $ref: '#/IndexThresholds' }
    max_weeks_between_reviews: { type: integer, minimum: 1, maximum: 104 }
    audit:
      allOf: [{ $ref: ../common.yaml#/Audit }]
      description: >-
        Who set the settings, and when: the platform at bootstrap (WF-EXP-0020), then
        the author of each write, whatever field it carries (WF-DAT-0070).
    lock_version: { $ref: ../common.yaml#/LockVersion }

ReferenceSettingsWrite:
  type: object
  required: [lock_version]
  description: >-
    What a write of the common settings carries: the lock version read, and what it writes —
    the company name (`cost_settings.write`), the risk matrix
    (`risk_settings.write`), the index thresholds and the interval between two reviews
    (`indicator_settings.write`), each field under the permission of its function
    (WF-ADM-0100); an absent field stays as it is (WF-IHM-0110). A screen sends only
    what it writes: the name alone, the matrix alone, or the thresholds and the interval alone.
    Neither the installation's default language (`default_language`, WF-INTF-0160), which
    belongs to none of the reference data functions and will be written wherever EP-03 decides,
    nor the currency (WF-REF-0140) is written here: both are read-only
    (`ReferenceSettings`).
  properties:
    company_name:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '\S'
      description: >-
        The name of the user company (WF-EXP-0020), under `cost_settings.write`, next to
        the currency. It can be neither empty nor blank; when absent, it stays as it is. An empty
        name is refused with 422 `VALIDATION_FAILED`, `fields` designating `/company_name` with
        `VALUE_REQUIRED`, and a name of more than 200 characters with `VALUE_TOO_LONG`; a name
        made only of blanks, like any label, with the field code `VALIDATION_FAILED` at the same
        pointer.
    risk_matrix: { $ref: '#/RiskMatrixSettings' }
    index_thresholds: { $ref: '#/IndexThresholds' }
    max_weeks_between_reviews:
      type: integer
      minimum: 1
      maximum: 104
      description: >-
        From 1 to 104 weeks (WF-REF-0180): an interval outside these bounds is refused with 422
        `VALIDATION_FAILED`, `fields` designating `/max_weeks_between_reviews` with
        `VALUE_OUT_OF_RANGE`, `fields[].params.minimum` at `1` or `maximum` at `104`, the only
        bound crossed.
    lock_version: { $ref: ../common.yaml#/LockVersion }

RiskMatrixSettings:
  type: object
  required: [probability_bounds, severity_bounds, zones]
  description: >-
    Matrix with four probability levels and four severity levels (WF-REF-0160,
    WF-RIS-0040). The severity bounds are expressed as a percentage of the project's
    base — its reference budget or, as long as it has none, the total excluding provisions of
    the estimate of its current revision.
  properties:
    probability_bounds:
      type: array
      minItems: 3
      maxItems: 3
      description: >-
        From lowest to highest, strictly ascending (WF-REF-0160): a bound that is not
        greater than the previous one is refused with 422 `VALIDATION_FAILED`, `fields`
        designating its rank (`/risk_matrix/probability_bounds/<rank>`) with `BOUNDS_NOT_ORDERED`.
      items: { $ref: ../common.yaml#/Percent }
    severity_bounds:
      type: array
      minItems: 3
      maxItems: 3
      description: >-
        From lowest to highest, strictly ascending (WF-REF-0160), refused likewise with
        `BOUNDS_NOT_ORDERED` on `/risk_matrix/severity_bounds/<rank>`.
      items: { $ref: ../common.yaml#/Percent }
    zones:
      type: array
      minItems: 16
      maxItems: 16
      description: >-
        The zone of each cell, ordered by probability level then by severity
        level, both from lowest to highest: the cell of probability p and
        severity s, from 1 to 4, is the zone of rank 4 × (p − 1) + (s − 1), counting
        from zero.
      items: { $ref: '#/AlertZone' }

IndexThresholds:
  type: object
  required: [cost_watch, cost_alert, schedule_watch, schedule_alert]
  description: >-
    Watch and alert thresholds of the two indices, below 1 (WF-REF-0170). An index greater than
    or equal to the watch threshold is nominal; below it and greater than or equal to the
    alert threshold, on watch; below the alert threshold, on alert: at 0.9 and 0.8, an
    index of 0.9 is nominal, an index of 0.8 on watch (WF-REF-0170). The alert
    threshold of each index is strictly below its watch threshold: an alert
    threshold that is not is refused with 422 `VALIDATION_FAILED`, `fields` designating it
    (`/index_thresholds/cost_alert`, `/index_thresholds/schedule_alert`) with
    `THRESHOLD_NOT_BELOW_WATCH`.
  properties:
    cost_watch: { $ref: '#/IndexThreshold' }
    cost_alert: { $ref: '#/IndexThreshold' }
    schedule_watch: { $ref: '#/IndexThreshold' }
    schedule_alert: { $ref: '#/IndexThreshold' }

IndexThreshold:
  allOf:
    - $ref: ../common.yaml#/Decimal
  pattern: '^0+\.\d*[1-9]\d*$'
  description: >-
    A threshold of an index: a value of the index strictly between 0 and 1 (WF-REF-0170), as an
    exact decimal — `0.9`, `0.85`, `0.875`; neither `0` nor `1`. The form is judged first, the
    range next, each by its constraint: a threshold that is not a decimal (the pattern of
    `Decimal`: `0,9`, `.5`, `abc`) is refused with 422 `VALIDATION_FAILED`, `fields`
    designating it (`/index_thresholds/<threshold>`) with `NUMBER_INVALID`; a decimal outside
    ]0, 1[, which the threshold's pattern refuses (`0`, `1`, `1.5`, `-0.5`), with
    `THRESHOLD_NOT_BETWEEN_ZERO_AND_ONE`, without a parameter: the interval is open, and has
    neither a smallest nor a largest admitted value to name. The order of the thresholds
    (`THRESHOLD_NOT_BELOW_WATCH`) is only judged between thresholds in ]0, 1[.

DurationUnits:
  type: object
  required: [hours_per_day, hours_per_week, days_per_month, audit, lock_version]
  description: >-
    The three installation constants by which working days, weeks and
    months are converted into hours (WF-PLA-0160): with the default
    values, "2 d" is worth sixteen hours, "1 wk" forty and "1 mo" one hundred and sixty.
    Common to all projects, as the currency is to amounts.
  properties:
    hours_per_day:
      allOf: [{ $ref: ../common.yaml#/Decimal }]
      description: 8 by default.
    hours_per_week:
      allOf: [{ $ref: ../common.yaml#/Decimal }]
      description: 40 by default.
    days_per_month:
      allOf: [{ $ref: ../common.yaml#/Decimal }]
      description: 20 by default.
    audit:
      allOf: [{ $ref: ../common.yaml#/Audit }]
      description: >-
        Who set the constants, and when: the platform at bootstrap, then the author of
        each write (WF-DAT-0070).
    lock_version: { $ref: ../common.yaml#/LockVersion }

DurationUnitsWrite:
  type: object
  required: [hours_per_day, hours_per_week, days_per_month, lock_version]
  description: >-
    The three constants, strictly positive, and the lock version read (WF-PLA-0160): the
    pattern refuses a sign, and a zero constant is refused with 422, `fields` naming it with
    `DURATION_UNIT_NOT_POSITIVE`.
  properties:
    hours_per_day:
      allOf: [{ $ref: ../common.yaml#/Decimal }]
      pattern: '^\d+(\.\d+)?$'
    hours_per_week:
      allOf: [{ $ref: ../common.yaml#/Decimal }]
      pattern: '^\d+(\.\d+)?$'
    days_per_month:
      allOf: [{ $ref: ../common.yaml#/Decimal }]
      pattern: '^\d+(\.\d+)?$'
    lock_version: { $ref: ../common.yaml#/LockVersion }

ActualCostSourceColumn:
  type: string
  enum: [wbs_element, document_number, document_item, document_date, amount]
  description: >-
    A column that the actual cost import reads in the ERP extraction (WF-REF-0190,
    appendix B), in the fixed order of the mapping: the WBS element, which carries the project
    code optionally followed by a slash and the subproject code (WF-CRE-0020), the document
    number, the number of its item in the document, the document date and the amount. The item
    is optional, the other four are required (WF-REF-0190).

ActualCostColumnLabel:
  type: string
  minLength: 1
  maxLength: 200
  pattern: '\S'
  description: >-
    A column label of the ERP extraction, as the user declares it: from 1 to
    200 characters, never blank. It is compared with the file's header, and with the other
    labels of the mapping, ignoring case, accents and leading or trailing spaces
    (WF-REF-0190): "Elément d'OTP" designates the column "Élément d'OTP".

ActualCostMappingColumn:
  type: object
  required: [column, required, labels]
  description: >-
    A column read from the mapping, and the labels that designate it in the extraction
    (WF-REF-0190).
  properties:
    column: { $ref: '#/ActualCostSourceColumn' }
    required:
      type: boolean
      description: >-
        Returned by the server: true for the four required columns, false for the item
        (`document_item`), optional (WF-REF-0190). It is not written.
    labels:
      type: array
      maxItems: 20
      description: >-
        The labels that designate the column in the extraction, at most 20, in the order in which
        they were declared; the import reads the file's column whose header equals one of them.
        Empty for a column without a label.
      items: { $ref: '#/ActualCostColumnLabel' }

ActualCostMapping:
  type: object
  required: [columns, kept_columns, is_complete, missing_columns, lock_version, audit]
  description: >-
    The mapping of the actual cost extraction (WF-REF-0190), a single object of the
    installation, read and replaced whole with its lock version: for each column read, its
    labels, and the columns of the extraction kept for information (WF-CRE-0010).
    Empty at installation. A column of the extraction neither read nor declared kept is ignored,
    and the import report names it (`ImportIgnoredKind`, `columns`). Changing it applies
    to subsequent imports and changes no line already imported (WF-REF-0190).
  properties:
    columns:
      type: array
      minItems: 5
      maxItems: 5
      description: >-
        The five columns read, each once, in the fixed order of `ActualCostSourceColumn`.
      items: { $ref: '#/ActualCostMappingColumn' }
    kept_columns:
      type: array
      maxItems: 50
      description: >-
        The labels of the extraction columns kept for information, at most 50,
        declared one by one, in the order in which they were (WF-REF-0190, WF-CRE-0010): an
        imported line gives them back on consultation under the label the file carries
        (`ActualCostLine.passthrough`). A column that is read is not also kept: its label
        would duplicate its own.
      items: { $ref: '#/ActualCostColumnLabel' }
    is_complete:
      type: boolean
      description: >-
        Computed: true when each of the four required columns has at least one label. When
        false, a project's `import_actual_costs` command is unavailable and names
        `actual_cost_mapping_complete` (WF-REF-0190).
    missing_columns:
      type: array
      description: >-
        Computed: the required columns that have no label, in the order of the
        mapping; empty when `is_complete` is true. The four required ones for an empty
        mapping, never the item, which is optional.
      items: { $ref: '#/ActualCostSourceColumn' }
    lock_version: { $ref: ../common.yaml#/LockVersion }
    audit: { $ref: ../common.yaml#/Audit }

ActualCostMappingColumnWrite:
  type: object
  required: [column, labels]
  description: A column read and its labels, as a write declares them.
  properties:
    column: { $ref: '#/ActualCostSourceColumn' }
    labels:
      type: array
      maxItems: 20
      items: { $ref: '#/ActualCostColumnLabel' }

ActualCostMappingWrite:
  type: object
  required: [columns, kept_columns, lock_version]
  description: >-
    The whole mapping and the lock version read (WF-REF-0190, WF-IHM-0110): the five columns
    read, each once, in the order of `ActualCostSourceColumn`, with their labels, and the
    kept columns. What it no longer carries is removed. Neither whether a column is required
    nor what the server computes is written. A label that duplicates another is refused with
    422, `DUPLICATE_COLUMN_LABEL` (`setActualCostMapping`).
  properties:
    columns:
      type: array
      minItems: 5
      maxItems: 5
      items: { $ref: '#/ActualCostMappingColumnWrite' }
    kept_columns:
      type: array
      maxItems: 50
      items: { $ref: '#/ActualCostColumnLabel' }
    lock_version: { $ref: ../common.yaml#/LockVersion }

AlertZone:
  type: string
  enum: [nominal, watch, alert]
  description: >-
    Zone of a signal, used by all the indicators and doubled by a
    non-colour cue on display (WF-REF-0170, WF-IHM-0070).

ReferenceReadiness:
  type: object
  required: [is_complete, missing]
  description: >-
    Minimal reference data required to create a project (WF-CYC-0120). The refusal names
    each missing prerequisite.
  properties:
    is_complete: { type: boolean }
    missing:
      type: array
      description: >-
        The missing prerequisites, in the order of the enumeration, that of WF-CYC-0120: an active
        default calendar in which at least one day of the week has hours worked
        (`default_calendar_with_hours`); an active labour category — an active cost
        category whose cost type is labour (`active_cost_category`); an active cost
        category whose cost type is of the
        risk provision kind (`active_provision_category`), without which no risk can
        be declared (EP-14/L42p, #579); an active resource role
        (`active_resource_role`). Empty when `is_complete` is true. A new installation,
        whose only category is the risk provision one, lacks the labour
        category and the role (Vérif of WF-CYC-0120).
      items:
        type: string
        enum:
          - default_calendar_with_hours
          - active_cost_category
          - active_provision_category
          - active_resource_role
