# Audit log of the irreversible or structuring actions (WF-SEC-0030), read-only.

AuditAction:
  type: string
  description: >-
    What an entry of the audit log records: each of the irreversible or structuring actions
    that WF-SEC-0030 lists, in its order — the creation of a project, the marking of a
    revision, the abandonment of a revision in progress (#1577), the designation of the
    reference revision, the merge of a differential (`structure_merge`, WF-REV-0050), the
    declaration of an occurred risk, the exit of a project from the life cycle, the exclusion
    and the reinstatement of a cost line, the application of an import, the creation and the
    modification of accounts — including their deactivation and their reactivation, their
    anonymisation (`user_anonymize`, WF-ADM-0060), and the link that sets a password, obtained
    or resent by email, without its token (`password_link_create`, `createPasswordSetupLink`
    and `resendInvitation`, WF-ADM-0140) —, the creation, the modification and the deletion of
    roles, the attribution of roles to accounts, the backup and the restore. A new action is a
    change to the contract.
  enum:
    - project_create
    - revision_mark
    - revision_abandon
    - reference_designate
    - structure_merge
    - risk_occurrence
    - project_exit
    - cost_line_exclude
    - cost_line_reinstate
    - import_apply
    - user_create
    - user_update
    - user_deactivate
    - user_reactivate
    - user_anonymize
    - password_link_create
    - access_role_create
    - access_role_update
    - access_role_delete
    - user_access_roles_set
    - backup
    - restore

AuditActorKind:
  type: string
  enum: [user, platform]
  description: >-
    The author of an entry, an account or the platform, as `ActorRef.kind` says: named to
    filter the log.

AuditObjectKind:
  type: string
  description: >-
    The kind of the object an entry concerns: the project created or exited from the life
    cycle, the revision marked, abandoned or designated, the differential structure merged, the
    occurred risk, the cost line excluded or reinstated, the import applied, the account, the
    role, the backup taken or restored, and the upload of a backup copied outside the platform
    that a restore puts back in place (`external_backup_upload`, the identifier of the upload,
    `RestoreRequest.external_backup_upload_id`; WF-SEC-0030, WF-ADM-0160).
  enum:
    - project
    - revision
    - cost_structure
    - risk
    - cost_line
    - import
    - user
    - access_role
    - backup
    - external_backup_upload

AuditObject:
  type: object
  required: [kind, object_id, label, revision]
  description: >-
    The object concerned, as it was at the time of the action: its label is the one of that
    moment, kept in the entry, and not read again from the object, which may have changed its
    name since — or may no longer be readable: the log stays viewable as long as the projects
    (WF-SEC-0030). An object that lives in a revision names it (`revision`), so that the screen
    leads to it.
  properties:
    kind: { $ref: '#/AuditObjectKind' }
    object_id: { $ref: ../common.yaml#/Uuid }
    label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The label of the object at the time of the action — the version name of a revision,
        the document number of a cost line, the file name of an import, the display name of
        an account, the file name of an upload —; null for a backup, which has none: for the
        action `backup`, its date is that of the entry; for `restore`, it is in
        `params.backup_taken_at`, the entry dating the end of the restore; null for an
        abandoned revision in progress, which does not yet have a version name (WF-REV-0010);
        null for an anonymised account, whose anonymisation erases its name from all the
        entries that designate it, the only modification an entry admits (WF-SEC-0030,
        WF-ADM-0060): the front presents it under the neutral label of its catalogue.
    revision:
      anyOf: [{ $ref: '#/AuditRevision' }, { type: 'null' }]
      description: >-
        The revision the object lives in, at the time of the action: the one whose register
        carries the risk (WF-RIS-0030) — for an occurrence, the revision in progress into which
        it merges its own estimate (WF-RIS-0060) —, that of the differential structure
        (`CostStructure.revision_id`, WF-REV-0050), the one to which the import of a planning,
        an estimate or a remaining to commit applies (WF-INTF-0090). Null for an object that
        does not live in a revision: the project, a revision itself, an actual cost line,
        charged to the project (WF-CRE-0010), and the import of actual costs, since only the
        imports of a planning, an estimate or a remaining to commit apply to a revision
        (WF-INTF-0090), an account, a role, a backup, an upload.

AuditRevision:
  type: object
  required: [revision_id, label]
  description: >-
    The revision of an object of the log, by its identifier and its label at the time of the
    action (WF-SEC-0030).
  properties:
    revision_id: { $ref: ../common.yaml#/Uuid }
    label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The version name of the revision at the time of the action; null for a revision being
        drawn up, which does not have one yet (WF-REV-0010).

AuditProject:
  type: object
  required: [project_id, code, label, can_open]
  description: >-
    A project of the log, by its identifier, its code and its label: those at the time of the
    action in an entry (`AuditEvent.project`), today's in the facets
    (`AuditFacets.projects`) — for a project that no longer exists, created after the backup
    that a restore put back in place, those of its last entry —, and whether the entry leads
    to it (`can_open`, WF-ADM-0190).
  properties:
    project_id: { $ref: ../common.yaml#/Uuid }
    code:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The code of the project, at the time of the action or today like the label; null for a
        project that did not have one yet, a code being required only on the move to In
        progress (WF-PRJ-0010, WF-CYC-0030).
    label: { type: string }
    can_open:
      type: boolean
      description: >-
        True if the caller can view the project today (WF-ADM-0110): the permission to view it
        and the status of contributor, or the permission to view all projects; false
        otherwise, and for a project that no longer exists (WF-ADM-0190). The entry then leads
        to the project, or names it by its label and its code without leading to it; the front
        infers nothing about it from the permissions of the session, which does not know the
        contributors. Evaluated the same way in the facets. An object that lives in a project —
        revision, structure, risk, cost line, import — leads to it only if the project can be
        opened.

AuditEvent:
  type: object
  required:
    [audit_event_id, occurred_at, actor, action, object, project, params, correlation_id]
  description: >-
    An entry of the audit log: the date, the author, the action, the object concerned and the
    project if there is one (WF-SEC-0030), and the correlation identifier of the request or of
    the background task that produced it, that of the platform's logs (WF-OBS-0020). An entry
    can be neither modified nor deleted: no operation allows it, and a restore does not lose
    it — the entries absent from the restored log are read back before the databases are
    replaced and rewritten after, and its `restore` entry is written once the restore is done
    (WF-ADM-0160, #539).
    An action that produces others records them all, at the same instant and under the same
    correlation: the merge of a differential records `structure_merge` on its structure, then
    `revision_mark` and `reference_designate` on the resulting revision (WF-REV-0050).
  properties:
    audit_event_id: { $ref: ../common.yaml#/Uuid }
    occurred_at:
      allOf: [{ $ref: ../common.yaml#/Timestamp }]
      description: >-
        The instant the action took effect: for an action handed to the worker — marking,
        merge, occurrence, application of an import, restore —, the one at which the task
        succeeded; for a backup, its date (`Backup.taken_at`), the instant of the state it
        copies.
    actor:
      allOf: [{ $ref: ../common.yaml#/ActorRef }]
      description: >-
        The author: an account, by its identifier and its display name, kept after its
        deactivation (WF-ADM-0060) — null after its anonymisation, which erases it from all
        the entries it authored, their number, their dates and their actions unchanged
        (WF-SEC-0030) —; `platform` for what the platform does of its own accord —
        a scheduled backup, an account created on its first sign-in by the identity provider
        or by the read of the identity provider —, and what the installation creates.
    action: { $ref: '#/AuditAction' }
    object: { $ref: '#/AuditObject' }
    project:
      anyOf: [{ $ref: '#/AuditProject' }, { type: 'null' }]
      description: >-
        The project of the object; null for an object of the platform — account, role,
        backup, upload of a backup.
    params: { $ref: '#/AuditParams' }
    correlation_id:
      type: string
      pattern: '^[A-Za-z0-9._-]{1,64}$'
      description: >-
        The correlation identifier of the request that asked for the action, which the
        background task it triggers takes up (WF-OBS-0020): it leads to the platform's logs.

AuditParams:
  type: object
  additionalProperties: false
  description: >-
    What the action did to its object, specific to each action, in codes, identifiers and
    labels kept at the time of the action, never as a sentence: the front renders it in the
    reader's language (WF-ARC-0110), and the log thus says who granted which right
    (WF-SEC-0030, #706). An empty object for an action that has nothing more to say than its
    object — the deactivation, the reactivation and the anonymisation of an account, the link
    that sets a password, the deletion of a role —; for the creation of a project
    (`project_create`), which the entry already designates by its code and its label of the
    moment (`AuditEvent.project`, and its label in `AuditObject.label`); for the abandonment
    of a revision in progress (`revision_abandon`), which the entry designates by its
    identifier and by its project, a revision in progress not yet having a version name
    (`AuditObject.label` null, WF-REV-0010), its lines deleted with it (#1577); for the
    marking, the designation, the merge, the occurrence, the exclusion and the reinstatement
    of a cost line, which their object says in full; for a backup, whose origin is read from
    the author — the platform for a scheduled one. The exit from the life cycle gives the
    state reached and its reason, the restore the date of the backup put back in place, the
    application of an import its kind. A new parameter is a change to the contract.
  properties:
    to_state:
      type: string
      enum: [completed, lost, abandoned]
      description: >-
        `project_exit`: the terminal state reached, Completed, Lost or Abandoned
        (`ProjectExit`, WF-CYC-0060); an auditor thus tells a completed project from a lost
        project without opening it (WF-ADM-0190).
    reason:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        `project_exit`: the reason given at the confirmation, which the transition keeps
        (`ProjectExit.reason`, WF-CYC-0130); null if none was given.
    backup_taken_at:
      allOf: [{ $ref: ../common.yaml#/Timestamp }]
      description: >-
        `restore`: the date of the backup put back in place, the one the confirmation stated
        (`RestoreRequest.acknowledged_backup_taken_at`, WF-ADM-0160); the entry itself is
        dated at the end of the restore.
    import_kind:
      allOf: [{ $ref: exchanges.yaml#/ExchangeKind }]
      description: >-
        `import_apply`: the kind of the import applied (WF-INTF-0090) — a planning, an
        estimate or a remaining to commit, which are written into a revision, or actual costs,
        charged to the project.
    origin:
      allOf: [{ $ref: access.yaml#/UserOrigin }]
      description: >-
        `user_create`: the origin of the account created — by an administrator (`local`), by
        the read of the identity provider (`directory`), on the first sign-in of a person
        relayed by an external provider (`identity_provider`).
    fields:
      type: array
      description: >-
        `user_update`: the fields of the account that the modification changed, in the order of
        the account — its identity and its attachment to an organisation node (#1739); their
        values are not in it, neither the before nor the after.
      items: { $ref: '#/AuditUserField' }
    attached:
      type: boolean
      description: >-
        `user_update`: true when the modification attaches the account to a person of the
        directory who carries its address (#707) — the account takes its identifier at the
        provider and henceforth comes from the directory; absent otherwise.
    permissions:
      type: array
      description: >-
        `access_role_create`: the permissions of the role created, in the order of the
        catalogue.
      items: { $ref: access.yaml#/PermissionCode }
    permissions_granted:
      type: array
      description: >-
        `access_role_update`: the permissions that the modification granted to the role, in
        the order of the catalogue; empty if it granted none.
      items: { $ref: access.yaml#/PermissionCode }
    permissions_withdrawn:
      type: array
      description: >-
        `access_role_update`: the permissions that the modification withdrew from the role, in
        the order of the catalogue; empty if it withdrew none.
      items: { $ref: access.yaml#/PermissionCode }
    previous_label:
      type: string
      description: >-
        `access_role_update`: the label of the role before the modification, when it changed
        it; absent otherwise. The label after is that of the object (`AuditObject.label`).
    access_roles_granted:
      type: array
      description: >-
        `user_access_roles_set`: the roles that the attribution granted to the account, in the
        order in which it holds them; empty if it granted none. On the creation of an account,
        its first roles.
      items: { $ref: '#/AuditAccessRole' }
    access_roles_withdrawn:
      type: array
      description: >-
        `user_access_roles_set`: the roles that the attribution withdrew from the account;
        empty if it withdrew none.
      items: { $ref: '#/AuditAccessRole' }

AuditUserField:
  type: string
  enum: [last_name, first_name, email, org_node_id]
  description: >-
    A field of the account that a modification changes (`user_update`), named like the column of
    the accounts table, which the front renders through its catalogue (WF-ARC-0110): the last
    name, the first name, the address, and the attachment to the organisation node
    (`org_node_id`), given, changed or removed (WF-ADM-0030, WF-ADM-0050); the value is not in
    it, as for the other fields.

AuditAccessRole:
  type: object
  required: [access_role_id, label]
  description: >-
    An access role granted to or withdrawn from an account, by its identifier and its label at
    the time of the action: a role deleted since is still named (WF-ADM-0090).
  properties:
    access_role_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string }

AuditActorFacet:
  type: object
  required: [user_id, display_name]
  description: An account that authored at least one entry of the log.
  properties:
    user_id: { $ref: ../common.yaml#/Uuid }
    display_name:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The display name of the account today, deactivated included: an account is never
        deleted (WF-ADM-0060); null for an anonymised account, which the front presents under
        the neutral label of its catalogue.

AuditFacets:
  type: object
  required: [actors, projects]
  description: >-
    The authors and projects that the whole log names, to choose one of them in the filters
    of `listAuditEvents` (WF-IHM-0130): the permission to view the log suffices to read them,
    without the one to read the accounts or the projects (WF-ADM-0100).
  properties:
    actors:
      type: array
      description: >-
        The accounts that authored at least one entry, each once, by display name then by
        identifier — an anonymised account, which no longer has a name, after the names —; the
        platform is not in it: `actor_kind` retains it.
      items: { $ref: '#/AuditActorFacet' }
    projects:
      type: array
      description: >-
        The projects of at least one entry, each once, by their code and their label of
        today — a project that no longer exists, by the code and the label of its last
        entry —, in the order of the codes then of the identifiers: whether or not the caller
        can view them, as the log names them. A project without a code — recorded before its
        code was entered, and that still has none — appears in it, `code` null, after the
        codes, as the sort of the log by project places it (#2166).
      items: { $ref: '#/AuditProject' }
