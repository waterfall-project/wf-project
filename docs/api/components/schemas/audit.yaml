# Journal d'audit des actions irréversibles ou structurantes (WF-SEC-0030), en lecture seule.

AuditAction:
  type: string
  description: >-
    Ce qu'une inscription du journal d'audit consigne : chacune des actions irréversibles ou
    structurantes que WF-SEC-0030 énumère, dans son ordre — le marquage d'une révision, la
    désignation de la révision de référence, la contractualisation d'un avenant, qui fusionne
    son différentiel (`amendment_merge`, WF-REV-0050), la déclaration d'un risque survenu, la
    sortie du cycle de vie d'un projet, l'exclusion et la réintégration d'une ligne de coût,
    l'application d'un import, la création et la modification des comptes — dont leur
    désactivation et leur réactivation, et le lien qui fixe un mot de passe, sans son jeton
    (WF-ADM-0140) —, la création, la modification et la suppression des rôles, l'attribution
    des rôles aux comptes, la sauvegarde et la restauration. Une action nouvelle est une
    modification du contrat.
  enum:
    - revision_mark
    - reference_designate
    - amendment_merge
    - risk_occurrence
    - project_exit
    - cost_line_exclude
    - cost_line_reinstate
    - import_apply
    - user_create
    - user_update
    - user_deactivate
    - user_reactivate
    - password_link_create
    - access_role_create
    - access_role_update
    - access_role_delete
    - user_access_roles_set
    - backup
    - restore

AuditActorKind:
  type: string
  enum: [user, platform]
  description: >-
    L'auteur d'une inscription, un compte ou la plateforme, comme `ActorRef.kind` le dit :
    nommé pour filtrer le journal.

AuditObjectKind:
  type: string
  description: >-
    La nature de l'objet qu'une inscription concerne : le projet d'une sortie du cycle de vie,
    la révision marquée ou désignée, le différentiel d'un avenant, le risque survenu, la ligne
    de coût exclue ou réintégrée, l'import appliqué, le compte, le rôle, la sauvegarde prise
    ou restaurée, et le dépôt d'une sauvegarde copiée hors de la plateforme qu'une
    restauration remet en place (`external_backup_upload`, l'identifiant du dépôt,
    `RestoreRequest.external_backup_upload_id` ; WF-SEC-0030, WF-ADM-0160).
  enum:
    - project
    - revision
    - cost_structure
    - risk
    - cost_line
    - import
    - user
    - access_role
    - backup
    - external_backup_upload

AuditObject:
  type: object
  required: [kind, object_id, label]
  description: >-
    L'objet concerné, tel qu'il était au moment de l'action : son libellé est celui de ce
    moment, gardé dans l'inscription, et non relu de l'objet, qui a pu changer de nom depuis —
    ou ne plus être lisible : le journal reste consultable aussi longtemps que les projets
    (WF-SEC-0030).
  properties:
    kind: { $ref: '#/AuditObjectKind' }
    object_id: { $ref: ../common.yaml#/Uuid }
    label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Le libellé de l'objet au moment de l'action — le nom de version d'une révision, le
        numéro de pièce d'une ligne de coût, le nom du fichier d'un import, le nom affiché
        d'un compte, le nom du fichier d'un dépôt — ; nul pour une sauvegarde, qui n'en a
        pas : sa date est celle de l'inscription.

AuditProject:
  type: object
  required: [project_id, code, label]
  description: >-
    Le projet de l'objet, par son identifiant, son code et son libellé au moment de l'action.
  properties:
    project_id: { $ref: ../common.yaml#/Uuid }
    code: { type: string }
    label: { type: string }

AuditEvent:
  type: object
  required: [audit_event_id, occurred_at, actor, action, object, project, correlation_id]
  description: >-
    Une inscription du journal d'audit : la date, l'auteur, l'action, l'objet concerné et le
    projet s'il y en a un (WF-SEC-0030), et l'identifiant de corrélation de la requête ou de la
    tâche de fond qui l'a produite, celui des journaux de la plateforme (WF-OBS-0020). Une
    inscription n'est ni modifiable ni supprimable : aucune opération ne le permet, et une
    restauration ne la touche pas — le journal est hors du périmètre qu'elle remplace, et son
    inscription `restore` s'écrit une fois la restauration faite (WF-ADM-0160, #539).
    Une action qui en produit d'autres les inscrit toutes, au même instant et sous la même
    corrélation : la fusion d'un avenant inscrit `amendment_merge` sur sa structure, puis
    `revision_mark` et `reference_designate` sur la révision qui en résulte (WF-REV-0050).
  properties:
    audit_event_id: { $ref: ../common.yaml#/Uuid }
    occurred_at:
      allOf: [{ $ref: ../common.yaml#/Timestamp }]
      description: >-
        L'instant où l'action a pris effet : pour une action confiée au worker — marquage,
        fusion, survenance, application d'un import, restauration —, celui où la tâche a
        abouti ; pour une sauvegarde, sa date (`Backup.taken_at`), l'instant de l'état qu'elle
        copie.
    actor:
      allOf: [{ $ref: ../common.yaml#/ActorRef }]
      description: >-
        L'auteur : un compte, par son identifiant et son nom affiché, conservé après sa
        désactivation (WF-ADM-0060) ; `platform` pour ce que la plateforme fait d'elle-même —
        une sauvegarde planifiée, un compte créé à sa première connexion par le fournisseur
        d'identité ou par la lecture de l'annuaire —, et ce que l'installation crée.
    action: { $ref: '#/AuditAction' }
    object: { $ref: '#/AuditObject' }
    project:
      anyOf: [{ $ref: '#/AuditProject' }, { type: 'null' }]
      description: Le projet de l'objet ; nul pour un objet de la plateforme — compte, rôle, sauvegarde.
    correlation_id:
      type: string
      pattern: '^[A-Za-z0-9._-]{1,64}$'
      description: >-
        L'identifiant de corrélation de la requête qui a demandé l'action, que la tâche de
        fond qu'elle déclenche reprend (WF-OBS-0020) : il mène aux journaux de la plateforme.
