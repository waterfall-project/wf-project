# Journal d'audit des actions irréversibles ou structurantes (WF-SEC-0030), en lecture seule.

AuditAction:
  type: string
  description: >-
    Ce qu'une inscription du journal d'audit consigne : chacune des actions irréversibles ou
    structurantes que WF-SEC-0030 énumère, dans son ordre — le marquage d'une révision, la
    désignation de la révision de référence, la contractualisation d'un avenant, qui fusionne
    son différentiel (`amendment_merge`, WF-REV-0050), la déclaration d'un risque survenu, la
    sortie du cycle de vie d'un projet, l'exclusion et la réintégration d'une ligne de coût,
    l'application d'un import, la création et la modification des comptes — dont leur
    désactivation et leur réactivation, leur anonymisation (`user_anonymize`, WF-ADM-0060), et le
    lien qui fixe un mot de passe, sans son jeton (WF-ADM-0140) —, la création, la modification et la suppression des rôles, l'attribution
    des rôles aux comptes, la sauvegarde et la restauration. Une action nouvelle est une
    modification du contrat.
  enum:
    - revision_mark
    - reference_designate
    - amendment_merge
    - risk_occurrence
    - project_exit
    - cost_line_exclude
    - cost_line_reinstate
    - import_apply
    - user_create
    - user_update
    - user_deactivate
    - user_reactivate
    - user_anonymize
    - password_link_create
    - access_role_create
    - access_role_update
    - access_role_delete
    - user_access_roles_set
    - backup
    - restore

AuditActorKind:
  type: string
  enum: [user, platform]
  description: >-
    L'auteur d'une inscription, un compte ou la plateforme, comme `ActorRef.kind` le dit :
    nommé pour filtrer le journal.

AuditObjectKind:
  type: string
  description: >-
    La nature de l'objet qu'une inscription concerne : le projet d'une sortie du cycle de vie,
    la révision marquée ou désignée, le différentiel d'un avenant, le risque survenu, la ligne
    de coût exclue ou réintégrée, l'import appliqué, le compte, le rôle, la sauvegarde prise
    ou restaurée, et le dépôt d'une sauvegarde copiée hors de la plateforme qu'une
    restauration remet en place (`external_backup_upload`, l'identifiant du dépôt,
    `RestoreRequest.external_backup_upload_id` ; WF-SEC-0030, WF-ADM-0160).
  enum:
    - project
    - revision
    - cost_structure
    - risk
    - cost_line
    - import
    - user
    - access_role
    - backup
    - external_backup_upload

AuditObject:
  type: object
  required: [kind, object_id, label, revision]
  description: >-
    L'objet concerné, tel qu'il était au moment de l'action : son libellé est celui de ce
    moment, gardé dans l'inscription, et non relu de l'objet, qui a pu changer de nom depuis —
    ou ne plus être lisible : le journal reste consultable aussi longtemps que les projets
    (WF-SEC-0030). Un objet qui vit dans une révision la nomme (`revision`), pour que l'écran
    y mène.
  properties:
    kind: { $ref: '#/AuditObjectKind' }
    object_id: { $ref: ../common.yaml#/Uuid }
    label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Le libellé de l'objet au moment de l'action — le nom de version d'une révision, le
        numéro de pièce d'une ligne de coût, le nom du fichier d'un import, le nom affiché
        d'un compte, le nom du fichier d'un dépôt — ; nul pour une sauvegarde, qui n'en a
        pas : sa date est celle de l'inscription ; nul pour un compte anonymisé, dont
        l'anonymisation efface le nom de toutes les inscriptions qui le désignent, seule
        modification qu'une inscription admet (WF-SEC-0030, WF-ADM-0060) : le front le présente
        sous le libellé neutre de son catalogue.
    revision:
      anyOf: [{ $ref: '#/AuditRevision' }, { type: 'null' }]
      description: >-
        La révision où l'objet vit, au moment de l'action : celle dont le registre porte le
        risque (WF-RIS-0030) — pour une survenance, la révision en cours où elle fusionne son
        devis propre (WF-RIS-0060) —, celle du différentiel d'un avenant
        (`CostStructure.revision_id`, WF-REV-0050), celle où s'applique l'import d'un planning,
        d'un devis ou d'un reste à engager (WF-INTF-0090). Nulle pour un objet qui ne vit pas
        dans une révision : le projet, une révision elle-même, une ligne de coût réel, imputée
        au projet (WF-CRE-0010), et l'import des coûts réels, quand seuls les imports d'un
        planning, d'un devis ou d'un reste à engager s'appliquent à une révision (WF-INTF-0090),
        un compte, un rôle, une sauvegarde, un dépôt.

AuditRevision:
  type: object
  required: [revision_id, label]
  description: >-
    La révision d'un objet du journal, par son identifiant et son libellé au moment de l'action
    (WF-SEC-0030).
  properties:
    revision_id: { $ref: ../common.yaml#/Uuid }
    label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Le nom de version de la révision au moment de l'action ; nul pour une révision en
        cours d'élaboration, qui n'en a pas encore (WF-REV-0010).

AuditProject:
  type: object
  required: [project_id, code, label]
  description: >-
    Un projet du journal, par son identifiant, son code et son libellé : ceux du moment de
    l'action dans une inscription (`AuditEvent.project`), ceux d'aujourd'hui dans les facettes
    (`AuditFacets.projects`) — pour un projet qui n'existe plus, créé après la sauvegarde
    qu'une restauration a remise en place, ceux de sa dernière inscription.
  properties:
    project_id: { $ref: ../common.yaml#/Uuid }
    code: { type: string }
    label: { type: string }

AuditEvent:
  type: object
  required:
    [audit_event_id, occurred_at, actor, action, object, project, params, correlation_id]
  description: >-
    Une inscription du journal d'audit : la date, l'auteur, l'action, l'objet concerné et le
    projet s'il y en a un (WF-SEC-0030), et l'identifiant de corrélation de la requête ou de la
    tâche de fond qui l'a produite, celui des journaux de la plateforme (WF-OBS-0020). Une
    inscription n'est ni modifiable ni supprimable : aucune opération ne le permet, et une
    restauration ne la touche pas — le journal est hors du périmètre qu'elle remplace, et son
    inscription `restore` s'écrit une fois la restauration faite (WF-ADM-0160, #539).
    Une action qui en produit d'autres les inscrit toutes, au même instant et sous la même
    corrélation : la fusion d'un avenant inscrit `amendment_merge` sur sa structure, puis
    `revision_mark` et `reference_designate` sur la révision qui en résulte (WF-REV-0050).
  properties:
    audit_event_id: { $ref: ../common.yaml#/Uuid }
    occurred_at:
      allOf: [{ $ref: ../common.yaml#/Timestamp }]
      description: >-
        L'instant où l'action a pris effet : pour une action confiée au worker — marquage,
        fusion, survenance, application d'un import, restauration —, celui où la tâche a
        abouti ; pour une sauvegarde, sa date (`Backup.taken_at`), l'instant de l'état qu'elle
        copie.
    actor:
      allOf: [{ $ref: ../common.yaml#/ActorRef }]
      description: >-
        L'auteur : un compte, par son identifiant et son nom affiché, conservé après sa
        désactivation (WF-ADM-0060) — nul après son anonymisation, qui l'efface de toutes les
        inscriptions dont il est l'auteur, leur nombre, leurs dates et leurs actions inchangés
        (WF-SEC-0030) — ; `platform` pour ce que la plateforme fait d'elle-même —
        une sauvegarde planifiée, un compte créé à sa première connexion par le fournisseur
        d'identité ou par la lecture du fournisseur d'identité —, et ce que l'installation crée.
    action: { $ref: '#/AuditAction' }
    object: { $ref: '#/AuditObject' }
    project:
      anyOf: [{ $ref: '#/AuditProject' }, { type: 'null' }]
      description: Le projet de l'objet ; nul pour un objet de la plateforme — compte, rôle, sauvegarde.
    params: { $ref: '#/AuditParams' }
    correlation_id:
      type: string
      pattern: '^[A-Za-z0-9._-]{1,64}$'
      description: >-
        L'identifiant de corrélation de la requête qui a demandé l'action, que la tâche de
        fond qu'elle déclenche reprend (WF-OBS-0020) : il mène aux journaux de la plateforme.

AuditParams:
  type: object
  additionalProperties: false
  description: >-
    Ce que l'action a fait à son objet, propre à chaque action, en codes, en identifiants et en
    libellés gardés au moment de l'action, jamais en phrase : le front le rend dans la langue du
    lecteur (WF-ARC-0110), et le journal dit ainsi qui a donné quel droit (WF-SEC-0030, #706). Un
    objet vide pour une action qui n'a rien à dire de plus que son objet — la désactivation, la
    réactivation et l'anonymisation d'un compte, le lien qui fixe un mot de passe, la suppression
    d'un rôle — et, jusqu'à l'EPIC qui les réalise, pour les actions d'un projet, de la sauvegarde
    et de la restauration. Un paramètre nouveau est une modification du contrat.
  properties:
    origin:
      allOf: [{ $ref: access.yaml#/UserOrigin }]
      description: >-
        `user_create` : l'origine du compte créé — par un administrateur (`local`), par la
        lecture du fournisseur d'identité (`directory`), à la première connexion d'une personne
        relayée par un fournisseur externe (`identity_provider`).
    fields:
      type: array
      description: >-
        `user_update` : les champs de l'identité que la modification a changés, dans l'ordre du
        compte ; leurs valeurs n'y sont pas, celles d'avant comme celles d'après.
      items: { $ref: '#/AuditUserField' }
    permissions:
      type: array
      description: >-
        `access_role_create` : les permissions du rôle créé, dans l'ordre du catalogue.
      items: { $ref: access.yaml#/PermissionCode }
    permissions_granted:
      type: array
      description: >-
        `access_role_update` : les permissions que la modification a données au rôle, dans
        l'ordre du catalogue ; vide si elle n'en a donné aucune.
      items: { $ref: access.yaml#/PermissionCode }
    permissions_withdrawn:
      type: array
      description: >-
        `access_role_update` : les permissions que la modification a retirées au rôle, dans
        l'ordre du catalogue ; vide si elle n'en a retiré aucune.
      items: { $ref: access.yaml#/PermissionCode }
    previous_label:
      type: string
      description: >-
        `access_role_update` : le libellé du rôle avant la modification, quand elle l'a changé ;
        absent sinon. Le libellé d'après est celui de l'objet (`AuditObject.label`).
    access_roles_granted:
      type: array
      description: >-
        `user_access_roles_set` : les rôles que l'attribution a donnés au compte, dans l'ordre où
        il les tient ; vide si elle n'en a donné aucun. À la création d'un compte, ses premiers
        rôles.
      items: { $ref: '#/AuditAccessRole' }
    access_roles_withdrawn:
      type: array
      description: >-
        `user_access_roles_set` : les rôles que l'attribution a retirés au compte ; vide si elle
        n'en a retiré aucun.
      items: { $ref: '#/AuditAccessRole' }

AuditUserField:
  type: string
  enum: [last_name, first_name, email]
  description: >-
    Un champ de l'identité d'un compte qu'une modification change (`user_update`), nommé comme
    la colonne de la table des comptes, que le front rend par son catalogue (WF-ARC-0110).

AuditAccessRole:
  type: object
  required: [access_role_id, label]
  description: >-
    Un rôle d'habilitation donné ou retiré à un compte, par son identifiant et son libellé au
    moment de l'action : un rôle supprimé depuis se nomme toujours (WF-ADM-0090).
  properties:
    access_role_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string }

AuditActorFacet:
  type: object
  required: [user_id, display_name]
  description: Un compte auteur d'au moins une inscription du journal.
  properties:
    user_id: { $ref: ../common.yaml#/Uuid }
    display_name:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Le nom affiché du compte aujourd'hui, désactivé compris : un compte ne se supprime
        jamais (WF-ADM-0060) ; nul pour un compte anonymisé, que le front présente sous le
        libellé neutre de son catalogue.

AuditFacets:
  type: object
  required: [actors, projects]
  description: >-
    Les auteurs et les projets que nomme le journal entier, pour en choisir un dans les filtres
    de `listAuditEvents` (WF-IHM-0130) : la permission de consulter le journal suffit à les
    lire, sans celle de lire les comptes ni les projets (WF-ADM-0100).
  properties:
    actors:
      type: array
      description: >-
        Les comptes auteurs d'au moins une inscription, chacun une fois, par nom affiché puis
        par identifiant — un compte anonymisé, qui n'a plus de nom, après les noms — ; la
        plateforme n'y est pas : `actor_kind` la retient.
      items: { $ref: '#/AuditActorFacet' }
    projects:
      type: array
      description: >-
        Les projets d'au moins une inscription, chacun une fois, par leur code et leur libellé
        d'aujourd'hui — un projet qui n'existe plus, par le code et le libellé de sa dernière
        inscription —, dans l'ordre des codes puis des identifiants : consultables ou non par
        l'appelant, comme le journal les nomme.
      items: { $ref: '#/AuditProject' }
