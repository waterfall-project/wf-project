# Project indicators (FBS-4.8), estimate indicators (FBS-4.4.1) and remaining to commit
# indicators (FBS-4.5.1). An indicator is computed at a date and for a scope
# (WF-IND-0010, WF-IND-0020); a zero quantity in the denominator makes it not
# computable, never zero nor infinite.

Computable:
  type: object
  required: [is_computable, value, reason]
  description: >-
    Envelope of a value that may be not computable (WF-IND-0010): an indicator, an
    amount that a missing hourly rate prevents from being computed (WF-DEV-0010).
  properties:
    is_computable: { type: boolean }
    value:
      anyOf: [{ $ref: ../common.yaml#/Decimal }, { type: 'null' }]
    reason:
      anyOf: [{ $ref: '#/NotComputableReason' }, { type: 'null' }]
      description: >-
        Why the value is not computable, as a code that the front renders in the language
        of the reader (WF-ARC-0110); null for a computable value.
    params:
      type: object
      description: >-
        What the reason names, when it names something: `missing_rates`, the categories
        and the years without an hourly rate (`hourly_rate_missing`, WF-DEV-0010). Absent otherwise.
      properties:
        missing_rates:
          type: array
          minItems: 1
          items: { $ref: '#/MissingRate' }

ComputableMoney:
  type: object
  required: [is_computable, value, reason]
  description: >-
    An amount that may be not computable: the same envelope as `Computable`, its value
    constrained like a `Money` — at most two decimal places, in the currency of the installation
    (WF-REF-0140, WF-DAT-0100). Ratios, indices and shares remain `Computable`.
  properties:
    is_computable: { type: boolean }
    value:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
    reason:
      anyOf: [{ $ref: '#/NotComputableReason' }, { type: 'null' }]
      description: Why the amount is not computable, as a code; null for a computable amount.
    params:
      type: object
      description: >-
        What the reason names, as for `Computable` — `missing_rates` for
        `hourly_rate_missing`.
      properties:
        missing_rates:
          type: array
          minItems: 1
          items: { $ref: '#/MissingRate' }

MissingRate:
  type: object
  required: [cost_category_id, year]
  description: >-
    A labour category used by a pricing, without an hourly rate for a
    year (WF-DEV-0010): what `getMissingRates` lists, and what a non-computable amount
    names (`Computable.params.missing_rates`).
  properties:
    cost_category_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string }
    year: { $ref: ../common.yaml#/Year }

NotComputableReason:
  type: string
  description: >-
    Why a value is not computable: the zero quantity in its denominator (WF-IND-0010).
    `no_actual_cost`, the cost index, and the projection at the observed rate as long as it is
    not computed (WF-IND-0070, WF-IND-0050); `no_earned_value`, the projection at the observed
    rate when the cost index is zero, for lack of earned value (WF-IND-0050);
    `no_planned_value`, the schedule index (WF-IND-0080); `no_reference_budget`, the budget
    consumption and the physical progress of the project (WF-IND-0040, WF-IND-0060), and the
    severity share of a risk on a zero base, a project without a reference budget whose estimate
    still carries only provisions (`RiskMatrixPoint.severity_ratio`, WF-REF-0160, #1240);
    `no_budgeted_amount`, the physical progress of a summary task whose subtree carries no
    budgeted amount (WF-IND-0060); `no_actual_or_remaining`, the financial progress
    (WF-IND-0040); `no_capacity`, the load ratio of a role (WF-DEV-0070, WF-PTF-0060);
    `no_offer_out_of_pricing`, the conversion rate of a period in which no offer moved from
    Pricing to In progress or to Lost, an abandoned offer not counting (WF-PTF-0050);
    `no_total`, the share of an amount in a distribution whose total is zero
    (`AmountByKey.share`, `ComputableAmountByKey.share`, WF-IND-0010; #1633). A reason is not a
    zero quantity: `hourly_rate_missing`, an amount of the estimate that a labour category
    without an hourly rate for the reference year prevents from being computed — the computation
    is refused rather than done with zero, and `params.missing_rates` names the categories and
    the years (WF-DEV-0010); nor `work_package_without_task`, the total of a work package of the
    work breakdown that no task carries: "a work package without an attached task is presented
    without a total" (WF-DEV-0060; EP-14/L42s).
  enum:
    - no_actual_cost
    - no_earned_value
    - no_planned_value
    - no_reference_budget
    - no_budgeted_amount
    - no_actual_or_remaining
    - no_capacity
    - no_offer_out_of_pricing
    - no_total
    - hourly_rate_missing
    - work_package_without_task

CalculationContext:
  type: object
  required: [revision_id, revision_status, computed_at, scope, is_stored]
  description: >-
    Context of the computation, which every screen must be able to display (WF-IHM-0020).
  properties:
    revision_id: { $ref: ../common.yaml#/Uuid }
    revision_status: { $ref: revisions.yaml#/RevisionStatus }
    computed_at: { $ref: ../common.yaml#/Timestamp }
    scope:
      type: string
      description: '`project`, `unassigned`, or the identifier of a subproject (WF-IND-0020).'
    is_stored:
      type: boolean
      description: >-
        True for what the marking of a revision stored — its indicators and its curves,
        unchanging since its marking, on the actual cost known then (WF-DAT-0040, WF-IND-0010);
        false for the current revision, and for the computation on the current day of a project
        without a current revision, on its last marked revision with the actual cost of the day.
        The zone of a stored index is classified when read (`IndexValue.zone`).

EstimateIndicators:
  type: object
  required:
    - context
    - total
    - by_cost_type
    - by_subproject
    - by_work_package
    - provisions_identified
    - delta_to_reference
    - delta_to_previous_revision
  description: >-
    Estimate indicators, available from the pricing onwards (WF-DEV-0060, WF-IND-0010). Each
    amount is a `ComputableMoney`: as long as a labour category in use has no hourly rate for
    the reference year, the amounts that depend on it — the total, the cost type, the subproject
    and the work package that carry its lines, the differences, and the shares that relate to
    the total — are not computed, reason `hourly_rate_missing`, the categories and the years
    named by `params.missing_rates` (WF-DEV-0010); never a budget wrongly at zero. The amounts
    that these lines do not affect are computed. All are re-estimated amounts, inflation
    included, at the consumption year of the lines (WF-DEV-0020) — `total`, its breakdowns by
    cost type, by subproject and by work package, and the two differences —, `total` being equal
    to the `reestimated_amount` of the totals of the structure; none is at the amount before
    inflation, a reading value of the grid (`NodeTotals.base_amount`, WF-DEV-0050), and the sum
    of the shares is one hundred on this basis alone (WF-DEV-0060).
  properties:
    context: { $ref: '#/CalculationContext' }
    total: { $ref: '#/ComputableMoney' }
    by_cost_type:
      type: array
      items: { $ref: '#/ComputableAmountByKey' }
    by_subproject:
      type: array
      items: { $ref: '#/ComputableAmountByKey' }
    by_work_package:
      type: array
      minItems: 1
      items: { $ref: '#/ComputableAmountByKey' }
      description: >-
        Each work package of the work breakdown, its level 1 (WF-PRJ-0020), in the order
        entered, and its total, read through the task, summary or leaf, that carries it — the
        total of its subtree (WF-PLA-0170). "For each work package of the work breakdown carried
        by an attached task […], it presents the total of the subtree of that task; a work
        package without an attached task is presented without a total" (WF-DEV-0060): its amount
        and its share are not computed, reason `work_package_without_task` — absent rather than
        zero, as the Vérif requires. Never empty: a project without an entered work breakdown
        has one by default, of one work package (EP-14/L42s). The stored indicators of a marked
        revision return the work packages of its marking, as it froze them (WF-DAT-0040),
        including a marked work package deleted since (WF-DAT-0080).
    provisions_identified: { $ref: ../common.yaml#/Money }
    delta_to_reference:
      anyOf: [{ $ref: '#/ComputableMoney' }, { type: 'null' }]
      description: >-
        The difference between the estimate total of the revision read (`context.revision_id`)
        and that of the reference revision, provision lines included on both sides
        (WF-DEV-0060): the estimate read minus that of the reference, positive when it exceeds
        it; null when the project has no reference revision.
    delta_to_previous_revision:
      anyOf: [{ $ref: '#/ComputableMoney' }, { type: 'null' }]
      description: >-
        The difference with the previous marked revision: the current estimate minus its own,
        positive when it exceeds it; null without it.

ComputableAmountByKey:
  type: object
  required: [key, label, amount, share]
  description: >-
    An amount per key — cost type, subproject, work package —, which may not be computed
    (`hourly_rate_missing`; for a work package that no task carries, `work_package_without_task`),
    and its share of the total, always returned: it is not computed without the amount, nor on a
    zero total (`no_total`).
  properties:
    key: { type: string }
    label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The label of the key, resolved when read; null for the `unassigned` key alone, which the
        front names (`AmountByKey.label`; G-03, #1780).
    amount: { $ref: '#/ComputableMoney' }
    share:
      allOf: [{ $ref: '#/Computable' }]
      description: >-
        The amount over the total, to four decimal places, never zero when the amount is not,
        not computable on a zero total (`no_total`, WF-IND-0010); the shares of a distribution —
        by cost type, by subproject — sum to 1, the largest carrying the remainder of the
        roundings, those of the work packages do not (README, "A share…").

RemainingIndicators:
  type: object
  required:
    - context
    - total
    - by_cost_type
    - by_subproject
    - coverage
    - delta_to_reference
    - delta_to_previous_revision
  description: >-
    Remaining to commit indicators (WF-RAE-0020, WF-RAE-0010): the total, provision lines of the
    identified risks included, its breakdowns, its differences and the risk coverage. Each
    amount of the remaining to commit and of the budget is inflation included, at the current
    consumption year of the lines, like the re-estimated amount of which it is the sum, and the
    reference budget to which the margin compares it (WF-DEV-0020); a provision line is not
    projected (WF-DEV-0030). A line of a task not completed counts for its re-estimated amount,
    whether its task is started or not and whether it has been re-estimated or not: without
    re-estimation, it is computed from the quantities of the reference, at the rates stored by
    the current revision and on its current consumption year (WF-RAE-0010,
    `EstimateLineFacet.reestimated_amount`); a line of a completed task does not count. The
    remaining to commit speaks of margin, against the reference budget (`delta_to_reference`) as
    against that of a subproject (`SubprojectBalance.variance`): the budget minus the sum of the
    actual cost and the remaining to commit, positive when some is left, negative beyond the
    budget — the direction of the risk coverage variance
    (`RiskCoverageTotals.coverage_variance`), which keeps its name from the specification. The
    portfolio and the projections speak of variance, positive beyond the budget
    (`PortfolioProjectRow.delta_to_reference`, `Projections`).
  properties:
    context: { $ref: '#/CalculationContext' }
    total: { $ref: ../common.yaml#/Money }
    coverage:
      allOf: [{ $ref: risks.yaml#/RiskCoverageTotals }]
      description: The risk coverage at the computation date (WF-RAE-0020, WF-RIS-0050).
    by_cost_type:
      type: array
      items: { $ref: '#/AmountByKey' }
    by_subproject:
      type: array
      items: { $ref: '#/SubprojectBalance' }
    delta_to_reference:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: >-
        The margin on the reference budget (WF-RAE-0020): the reference budget minus the sum of
        the actual cost and the remaining to commit, positive when some is left, negative when
        the project exceeds its budget — budget 1,000, actual cost 500, remaining to commit 550,
        margin -50; null when the project has no reference revision.
    delta_to_previous_revision:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: >-
        The difference with the remaining to commit of the previous marked revision that was
        marked in the In progress state, at its marking (WF-RAE-0020): what that review changed,
        the current remaining to commit minus its own, negative when it has decreased; null
        (`null`), and not zero, when no revision was marked in the In progress state before the
        one read — an offer marked during pricing is not a review —: the screen then omits it
        (WF-RAE-0020).

SubprojectBalance:
  type: object
  required: [key, budget, actual_cost, remaining, variance, is_over_budget, zone]
  description: >-
    Margin between the budget of a subproject and the sum of its actual cost and its
    remaining to commit (WF-RAE-0020). `unassigned` designates the "out of any
    subproject" set (WF-IND-0020). The server classifies the overrun on the common scale
    of signals (`zone`, WF-IHM-0070): the front deduces no zone from it.
  properties:
    key: { type: string }
    label: { type: string }
    budget:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        The reference budget of the subproject: the sum of the budgeted amounts of the lines that
        belong to it in the reference revision, excluding provision lines (WF-IND-0020).
    actual_cost: { $ref: ../common.yaml#/Money }
    remaining:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        The remaining to commit of the lines that belong to it in the current revision
        (WF-IND-0020): a line moved from one subproject to another after the reference counts
        its budget in the first, its remaining to commit in the second.
    variance:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        The margin of the subproject: its budget minus the sum of its actual cost and its
        remaining to commit, positive when some is left, negative when the subproject exceeds
        its budget (WF-RAE-0020) — the direction of `RemainingIndicators.delta_to_reference`.
    is_over_budget: { type: boolean }
    zone: { $ref: reference.yaml#/AlertZone }

AmountByKey:
  type: object
  required: [key, label, amount, share]
  properties:
    key: { type: string }
    label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The label of the key, resolved when read; null for the `unassigned` key alone, which the
        front names in the language of the reader, like `IndexHistoryScope.label` (G-03, #1780).
    amount: { $ref: ../common.yaml#/Money }
    share:
      allOf: [{ $ref: '#/Computable' }]
      description: >-
        The amount over the total, to four decimal places, never zero when the amount is not,
        the shares of a distribution summing to 1, the largest carrying the remainder of the
        roundings (README, "A share…"): a computed quotient, not a stored percentage
        (`Percent`); always returned, not computable on a zero total (`no_total`, WF-IND-0010).

ProjectIndicators:
  type: object
  required:
    - context
    - reference_budget
    - planned_value
    - earned_value
    - actual_cost
    - remaining
    - financial_progress
    - budget_consumption
    - physical_progress
    - cost_index
    - schedule_index
    - cost_variance
    - schedule_variance
    - projections
  description: >-
    The earned value indicators. Computed from the In progress state
    only; before it, only the estimate indicators exist (WF-IND-0010).
  properties:
    context: { $ref: '#/CalculationContext' }
    reference_budget: { $ref: ../common.yaml#/Money }
    planned_value:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Lines counted in the reference budget, each spread over the duration of its task as
        the reference revision dates it, in proportion to the working hours — of the calendar
        of its role for a labour line, of the applicable calendar of the task otherwise
        (WF-DEV-0080).
    earned_value:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Budgeted amounts of the lines of the tasks completed at the computation date, excluding
        provision lines, the completion date being authoritative; the own lines of a summary task
        are earned when it is completed, and those coming from an occurred risk are not
        earned (WF-IND-0030).
    actual_cost:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Lines of the tracked scope whose document date is earlier than or equal to the computation
        date (WF-IND-0010).
    remaining: { $ref: ../common.yaml#/Money }
    financial_progress:
      allOf: [{ $ref: '#/Computable' }]
      description: >-
        Ratio of the actual cost to the sum of the actual cost and the remaining to commit; not
        computable when both are zero (WF-IND-0040). To four decimal places, like the
        budget consumption and the physical progress (README, "A share…").
    budget_consumption: { $ref: '#/Computable' }
    physical_progress: { $ref: '#/Computable' }
    cost_index: { $ref: '#/IndexValue' }
    schedule_index: { $ref: '#/IndexValue' }
    cost_variance:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        The cost variance: the earned value minus the actual cost, positive when the work done has
        cost less than its budget, negative beyond — an earned value of 400 for an actual cost
        of 500 gives -100 (WF-IND-0070, glossary).
    schedule_variance:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        The schedule variance: the earned value minus the planned value, positive when ahead,
        negative when behind — an earned value of 400 for a planned value of 500 gives -100
        (WF-IND-0080, glossary).
    projections: { $ref: '#/Projections' }

IndexValue:
  type: object
  required: [value, zone]
  description: Index and its zone according to the thresholds of the reference data (WF-IND-0070, WF-IND-0080, WF-REF-0170).
  properties:
    value:
      allOf: [{ $ref: '#/Computable' }]
      description: >-
        The index, ratio of two quantities, to four decimal places (README, "A share…").
    zone:
      anyOf: [{ $ref: reference.yaml#/AlertZone }, { type: 'null' }]
      description: >-
        The zone of the index, classified by the server when read according to the current
        thresholds of the reference data: greater than or equal to the watch threshold, nominal;
        below it and greater than or equal to the alert threshold, watch; below the alert
        threshold, alert — at thresholds 0.9 and 0.8, an index of 0.9 is nominal, one of 0.8 is
        in watch (WF-REF-0170). A stored index is classified too: its value does not change, its
        zone may change with the thresholds (WF-REF-0130). Null when the index is not computed.

Projections:
  type: object
  required:
    - at_budget
    - project_manager
    - at_observed_rate
    - variance_at_budget
    - variance_project_manager
    - variance_at_observed_rate
  description: >-
    The three projections at completion, named by their assumption about the remaining
    work, presented together with their variance from the budget (WF-IND-0050).
  properties:
    at_budget: { $ref: ../common.yaml#/Money }
    project_manager: { $ref: ../common.yaml#/Money }
    at_observed_rate: { $ref: '#/ComputableMoney' }
    variance_at_budget:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        The projection minus the reference budget, positive when it exceeds it
        (WF-IND-0050), in the sense of `PortfolioProjectRow.delta_to_reference`.
    variance_project_manager:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        The projection minus the reference budget, positive when it exceeds it
        (WF-IND-0050), in the sense of `PortfolioProjectRow.delta_to_reference`.
    variance_at_observed_rate:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: >-
        The projection minus the reference budget, positive when it exceeds it
        (WF-IND-0050), in the sense of `PortfolioProjectRow.delta_to_reference`; null as long as the
        projection at the observed rate is not computed.

WorkloadPlan:
  type: object
  required: [context, basis, org_node_id, org_node_label, monthly_totals, roles]
  description: >-
    Workload by role and by month, in hours: the load of a line is spread over the
    duration of its task in proportion to the working hours of the calendar of its role. On a basis
    of remaining to commit — a marked revision for its re-estimated load (`marked_remaining`) or the
    current revision (`current_remaining`) —, the remaining load of each line of a task not
    completed is spread over only the part of the duration of its task after the computation date
    (`context.computed_at`, the marking date for a marked revision), and carried to the month of
    the computation date when the end of the task is past: a not started task whose start
    date is earlier than the computation date presents no load on the elapsed months;
    a completed task presents none (WF-DEV-0070, WF-IND-0010).
  properties:
    context: { $ref: '#/CalculationContext' }
    basis:
      type: string
      enum: [reference_budget, marked_remaining, current_remaining]
      description: >-
        The basis used: the load of the reference revision, the re-estimated load of a
        marked revision, or that of the current revision (WF-DEV-0070). `context.revision_id`
        names the revision read.
    org_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        The organisation node selected by the filter (`org_node_id` of `getProjectWorkload`),
        null without a filter (WF-DEV-0070).
    org_node_label:
      anyOf:
        - { type: string, minLength: 1, maxLength: 200 }
        - type: 'null'
      description: >-
        The label of the selected node, resolved when read, whether it is active or deactivated
        (WF-REF-0150), which the header of the workload names without reading the organisation tree
        (WF-ARC-0020); null without a node.
    monthly_totals:
      type: array
      description: >-
        The total hours of each month of the plan, the sum of the hours of the roles selected that
        month, which the top of the month's bar carries, without the front summing the roles
        (WF-DEV-0070, WF-ARC-0020, #1247): from the first to the last month that a role loads,
        ascending and without gaps, a month without load included at zero, each naming its month
        like the months of a role (`roles[].months`) and like `PortfolioWorkload.monthly_totals`;
        empty when no role has any load.
      items:
        type: object
        required: [month, hours]
        properties:
          month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
          hours: { $ref: ../common.yaml#/Hours }
    roles:
      type: array
      items:
        type: object
        required: [resource_role_id, label, org_node_id, capacity_monthly_hours, months]
        properties:
          resource_role_id: { $ref: ../common.yaml#/Uuid }
          label: { type: string }
          org_node_id: { $ref: ../common.yaml#/Uuid }
          capacity_monthly_hours: { $ref: ../common.yaml#/Hours }
          months:
            type: array
            items:
              type: object
              required: [month, hours, zone]
              properties:
                month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
                hours: { $ref: ../common.yaml#/Hours }
                zone: { $ref: '#/WorkloadZone' }

WorkloadZone:
  type: string
  enum: [nominal, alert]
  description: >-
    Zone of a month of the workload of a project: alert, when its hours exceed the capacity of
    the role; nominal otherwise. Never watch: the watch of the workload is under-load, a load
    ratio below the threshold that the user chooses (WF-PTF-0060), and the plan of a project
    does not present a load ratio, the capacity being that of the whole installation
    (WF-DEV-0070); the aggregated workload of the portfolio carries it (`PortfolioWorkload`).
    Its values are those of `AlertZone`, and the front expresses them the same way
    (WF-IHM-0070).

MilestoneTracking:
  type: object
  required: [context, milestones]
  description: >-
    Time/time diagram: for each tracked milestone, the date that each revision marked in
    the In progress state forecast, as a function of its marking date; the revisions marked before
    the In progress state give no point (WF-IND-0090).
  properties:
    context: { $ref: '#/CalculationContext' }
    milestones:
      type: array
      items:
        type: object
        required: [lineage_id, label, completed_on, points]
        properties:
          lineage_id: { $ref: ../common.yaml#/Uuid }
          label: { type: string }
          completed_on:
            anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
            description: The completion date of the milestone; null as long as it is not completed.
          points:
            type: array
            description: >-
              One point per revision marked in the In progress state, at its marking date, up to
              the completion of the milestone — the last point of a completed milestone is at
              its completion date, on the x-axis as on the y-axis, and no revision marked
              afterwards adds one —; then, for a milestone not completed, the point of the
              current day, provided by the current revision or, failing that, the last marked
              revision (WF-IND-0090, WF-IND-0010).
            items:
              type: object
              required: [marked_at, forecast_date]
              properties:
                marked_at:
                  allOf: [{ $ref: ../common.yaml#/Timestamp }]
                  description: >-
                    The x-coordinate of the point: the marking date of its revision, the
                    completion of the milestone — at midnight, the completion date having no
                    time —, or the instant of the computation for the point of the current day.
                forecast_date:
                  allOf: [{ $ref: ../common.yaml#/PlanningDate }]
                  description: >-
                    The y-coordinate: the date that the revision forecast for the milestone, or its
                    completion date for the last point of a completed milestone.

CurveSeries:
  type: object
  required: [context, payment_delays, series, steps, cash_out_by_month]
  description: >-
    Cumulative series at a monthly step, each point carrying the cumulative total at the end of
    the month (WF-IND-0100, WF-IND-0110): the first, at the end of the month preceding the first
    amount — or that of the amendment step, if it is earlier —, zero; the computation date is
    one more point on the series that stop or start there (`actual_cost`, `earned_value`,
    `project_manager_projection`), and an amendment step two points at its date, before and
    after (`steps`). The changes of the reference budget appear in them as dated steps. The
    curves of a marked revision are stored with its indicators and presented at the same step
    (WF-DAT-0040). Requested with the payment delays, the cumulative cost curve carries the
    disbursements: its series are shifted, and `cash_out_by_month` details them by month. A
    series without points has nothing to plot for the scope (WF-IND-0020): the reference budget,
    when no reference budgets a line in it; all the series, when the scope has neither a line
    nor an actual cost, as `getCostCurve` states. The actual cost of a scope that has lines
    without a document remains plotted, at zero, from the origin of the curve to the computation
    date. The screen states a series without points rather than plotting a zero.
  properties:
    context: { $ref: '#/CalculationContext' }
    payment_delays:
      type: boolean
      description: >-
        True when the series are those of the disbursements: the reference budget and the
        projection shifted, each amount by the payment delay of its line, the provisions of the
        identified risks, which carry none, at the date of the task that carries them; the actual
        cost is not shifted (WF-IND-0100). False otherwise.
    series:
      type: array
      items:
        type: object
        required: [name, points]
        properties:
          name:
            type: string
            enum:
              - reference_budget
              - planned_value
              - earned_value
              - actual_cost
              - project_manager_projection
          points:
            type: array
            items:
              type: object
              required: [date, amount]
              properties:
                date: { $ref: ../common.yaml#/PlanningDate }
                amount: { $ref: ../common.yaml#/Money }
    steps:
      type: array
      description: >-
        Steps of the reference budget, dated and with their cause: only amendments
        move it (WF-IND-0100, WF-RIS-0050). Always returned, empty when no step falls
        within the curve read (`cost_curve_subproject_empty`; G-03, #1780).
      items:
        type: object
        required: [date, amount, cause]
        properties:
          date: { $ref: ../common.yaml#/PlanningDate }
          amount:
            allOf: [{ $ref: ../common.yaml#/Money }]
            description: >-
              The amount of the step, signed: by how much the reference budget changes at its
              date — the contracted amendment, the only event that moves it (WF-REV-0040,
              WF-RIS-0050) —, not the budget after it, which the series
              `reference_budget` carries.
          cause:
            type: string
            enum: [amendment]
    cash_out_by_month:
      anyOf:
        - type: array
          items: { $ref: '#/CashOutMonth' }
        - type: 'null'
      description: >-
        The disbursements by month, returned when `payment_delays` is true: the past by month of
        document date — the actual cost is not shifted —; the future by spreading the remaining
        to commit of each line, in proportion to the working hours, over the part of the
        duration of its task after the computation date, carried whole to the computation date
        when the end of the task is past, each part shifted by the payment delay of its line,
        and the provisions of the identified risks at the date of their task (WF-IND-0100,
        WF-RAE-0040). Null otherwise.

CashOutMonth:
  type: object
  required: [month, past, forecast]
  description: >-
    A month of disbursements: what has been disbursed, and what will be. A month that
    precedes that of the computation date carries only the past, a month that follows it only
    the future, the other amount zero; the month of the computation date carries both — the
    amount disbursed up to it, the remainder to disburse after (WF-IND-0100, WF-PTF-0100).
  properties:
    month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
    past: { $ref: ../common.yaml#/Money }
    forecast: { $ref: ../common.yaml#/Money }

IndexHistory:
  type: object
  required: [context, thresholds, scopes]
  description: >-
    Evolution of the cost index and the schedule index, for the project and for each subproject:
    one point per revision marked from the In progress state onwards, at its marking date, and
    the last on the current day (WF-IND-0010) — on the current revision, or, on a project that
    has none, on its last marked revision with the actual cost of the day —, with the thresholds
    of the reference data to plot (WF-IND-0130, WF-REF-0170). On a project with three revisions
    marked from the In progress state onwards, each curve carries four points.
  properties:
    context: { $ref: '#/CalculationContext' }
    thresholds:
      allOf: [{ $ref: reference.yaml#/IndexThresholds }]
      description: >-
        The current thresholds of the reference data, those that classify each point, stored or
        of the day (WF-REF-0130, WF-REF-0170).
    scopes:
      type: array
      description: >-
        The project first, then each subproject, then "out of any subproject"; only the scope
        requested by `scope`.
      items: { $ref: '#/IndexHistoryScope' }

IndexHistoryScope:
  type: object
  required: [scope, label, points]
  description: The curves of a computation scope (WF-IND-0020, WF-IND-0130).
  properties:
    scope:
      type: string
      description: '`project`, `unassigned`, or the identifier of a subproject (WF-IND-0020).'
    label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: The label of the subproject; null for the project and for "out of any subproject".
    points:
      type: array
      description: From the oldest marking to the current day.
      items: { $ref: '#/IndexHistoryPoint' }

IndexHistoryPoint:
  type: object
  required: [at, revision_id, version_name, cost_index, schedule_index]
  description: >-
    The two indices of a revision: at its marking date, as the marking stored them
    (WF-DAT-0040), their zone classified on the current thresholds (WF-REF-0130); on the current
    day, the last point, `version_name` null and `revision_id` that of the current revision, or
    of the last marked revision on a project that has none, computed with the actual cost of the
    day (WF-IND-0010, WF-IND-0130).
  properties:
    at: { $ref: ../common.yaml#/Timestamp }
    revision_id: { $ref: ../common.yaml#/Uuid }
    version_name:
      anyOf: [{ type: string }, { type: 'null' }]
    cost_index: { $ref: '#/IndexValue' }
    schedule_index: { $ref: '#/IndexValue' }
