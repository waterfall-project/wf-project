# Session, comptes, rôles d'habilitation et permissions (FBS-1.1, FBS-1.2).
# Il n'existe aucune inscription libre : un compte est créé par un utilisateur
# habilité, importé de l'annuaire, ou créé à sa première connexion par le
# fournisseur d'identité (WF-ADM-0050, WF-ADM-0070, WF-ADM-0180).

AuthProviderKind:
  type: string
  enum: [local, ldap, oidc]

AuthProvider:
  type: object
  required: [kind, is_enabled]
  description: >-
    Fournisseur d'authentification. Les comptes locaux sont toujours actifs ;
    l'annuaire et le fournisseur d'identité s'activent dans l'administration
    (WF-ADM-0180, WF-ARC-0030).
  properties:
    kind: { $ref: '#/AuthProviderKind' }
    is_enabled: { type: boolean }
    label:
      anyOf: [{ type: string }, { type: 'null' }]
    start_url:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Point de départ des redirections, pour un fournisseur OIDC (TFX-07).

LocalCredentials:
  type: object
  required: [email, password]
  properties:
    email: { type: string, format: email }
    password: { type: string, minLength: 12, maxLength: 200 }

Session:
  type: object
  required: [user, permissions, expires_at]
  description: >-
    Session conservée en base, révocable immédiatement (WF-SEC-0020). Les
    permissions effectives sont évaluées à chaque requête et renvoyées ici pour que
    le front sache quoi présenter (WF-ADM-0110, WF-IHM-0090).
  properties:
    user: { $ref: '#/UserSelf' }
    permissions:
      type: array
      items: { $ref: '#/PermissionCode' }
    expires_at: { $ref: ../common.yaml#/Timestamp }
    idle_expires_at: { $ref: ../common.yaml#/Timestamp }

PasswordResetRequest:
  type: object
  required: [email]
  description: >-
    Demande un lien de réinitialisation, valable une heure et à usage unique
    (WF-ADM-0140). Le courriel part dans la langue que le compte a choisie, `fr` ou
    `en` ; si elle vaut `default`, dans la première langue offerte que demande la
    requête, et à défaut dans la langue par défaut de l'installation (WF-ARC-0110).
  properties:
    email: { type: string, format: email }

PasswordSetupLink:
  type: object
  required: [url, expires_at]
  description: >-
    Le lien par lequel le porteur d'un compte local fixe ou réinitialise son mot de passe,
    rendu à l'utilisateur habilité qui l'a demandé pour le remettre par un autre canal
    (WF-ADM-0140) : le même lien que le courriel porte, à usage unique et valable une heure,
    vers l'adresse du front qui fixe le mot de passe — `<adresse publique du front>/login/reset?token=<jeton>`,
    l'adresse publique du front étant un paramètre de l'installation, fixé à son déploiement
    (WF-EXP-0020), comme pour `requestPasswordReset`. Il n'est rendu qu'une fois, jamais relu, et sa demande est
    inscrite au journal d'audit (WF-SEC-0030) ; le jeton n'y figure pas.
  properties:
    url:
      type: string
      format: uri
      description: Le lien entier, tel qu'il se remet.
    expires_at:
      allOf: [{ $ref: ../common.yaml#/Timestamp }]
      description: Quand le lien cesse d'être valable, une heure après sa création (WF-ADM-0140).

PasswordResetConfirm:
  type: object
  required: [token, password]
  properties:
    token: { type: string, minLength: 20 }
    password: { type: string, minLength: 12, maxLength: 200 }

PasswordChange:
  type: object
  required: [current_password, new_password]
  properties:
    current_password: { type: string }
    new_password: { type: string, minLength: 12, maxLength: 200 }

UserOrigin:
  type: string
  enum: [local, directory, identity_provider]
  description: >-
    Origine du compte : créé dans Waterfall, importé de l'annuaire, ou créé à sa
    première connexion par le fournisseur d'identité (WF-ADM-0050).

User:
  description: >-
    Un compte tel que la table des comptes le lit : le compte, et ses commandes
    (`available_commands`, WF-IHM-0090).
  allOf:
    - $ref: '#/UserAccount'
    - type: object
      required: [available_commands]
      properties:
        available_commands:
          type: array
          maxItems: 2
          description: >-
            Commandes du compte que l'appelant a la permission d'exercer, chacune disponible ou
            non, avec les conditions qui lui manquent (WF-IHM-0090), dans l'ordre de
            `UserCommand` : au plus deux, celle qui change son état et l'attribution de ses
            rôles. Une commande absente de la liste n'est pas présentée ; la liste est vide pour
            qui lit les comptes sans la permission de les modifier (`users.write`, WF-ADM-0100).
            Le front ne rapproche pas les rôles des comptes pour savoir qui est le dernier
            administrateur (WF-ARC-0020) : le compte le dit. Un appel envoyé malgré la liste
            est refusé par son code d'erreur.
          items: { $ref: '#/UserCommandAvailability' }

UserCommand:
  type: string
  enum: [deactivate, reactivate, set_access_roles]
  description: >-
    Commandes portées par un compte (WF-IHM-0090) : le désactiver et le réactiver, par
    `setUserActivation` — aucune ne le supprime (WF-ADM-0060) —, et lui attribuer ses rôles
    d'habilitation, par `setUserAccessRoles` (WF-ADM-0090). Un compte ne porte que celle qui
    change son état : `deactivate` s'il est actif, `reactivate` s'il est désactivé ; il porte
    toujours `set_access_roles`. Toutes relèvent de la permission de modifier les comptes
    (`users.write`, WF-ADM-0100). Le dernier compte actif qui porte à la fois les permissions de
    modifier les comptes et les rôles d'habilitation (`users.write`, `access_roles.write`) a sa
    désactivation indisponible, `last_administrator` manquante (WF-ADM-0120) : elle est
    disponible dès qu'un second compte actif les porte. L'attribution de ses rôles reste
    disponible : WF-ADM-0120 n'interdit que de lui retirer ces permissions, et lui en donner
    davantage reste possible (WF-IHM-0090 : n'est indisponible que ce qui l'est) ; seule une
    attribution qui lui retirerait l'une d'elles est refusée, par le 409 `LAST_ADMINISTRATOR` de
    `setUserAccessRoles`, qui dépend des rôles envoyés. Toute autre commande listée est
    disponible.

UserCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/UserCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Vide lorsque la commande est disponible.
      items: { $ref: projects.yaml#/CommandCondition }

UserAccount:
  type: object
  description: >-
    Un compte, sans ses commandes : celui que la session porte (`UserSelf`), et que la table
    des comptes complète des siennes (`User`).
  required:
    - user_id
    - last_name
    - first_name
    - email
    - is_active
    - origin
    - org_node_label
    - access_role_ids
    - access_role_labels
    - audit
    - lock_version
  properties:
    user_id: { $ref: ../common.yaml#/Uuid }
    last_name: { type: string, minLength: 1, maxLength: 100 }
    first_name: { type: string, minLength: 1, maxLength: 100 }
    email:
      type: string
      format: email
      description: Unique dans l'installation ; c'est elle qui identifie la personne (WF-ADM-0050).
    is_active:
      type: boolean
      description: >-
        L'état du compte (WF-ADM-0050) : vrai pour « actif » (`active`), faux pour
        « désactivé » (`deactivated`). Un compte désactivé ne peut plus ouvrir de session.
    origin: { $ref: '#/UserOrigin' }
    org_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Rattachement facultatif, qui n'accorde aucune permission (WF-ADM-0030).
    org_node_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Libellé du nœud de rattachement, résolu à la lecture, actif ou désactivé
        (WF-REF-0150) ; nul sans rattachement. Le front ne rapproche pas l'organisation
        des comptes (WF-ARC-0020).
    access_role_ids:
      type: array
      description: Un ou plusieurs rôles ; l'utilisateur dispose de l'union de leurs permissions (WF-ADM-0090).
      items: { $ref: ../common.yaml#/Uuid }
    access_role_labels:
      type: array
      description: >-
        Libellés des rôles de `access_role_ids`, résolus à la lecture, dans le même
        ordre. Le front ne rapproche pas les rôles des comptes (WF-ARC-0020).
      items: { type: string }
    has_avatar: { type: boolean }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

UserSelf:
  description: >-
    Le compte de la session, et ses préférences d'affichage (WF-ADM-0040). Il ne porte pas les
    commandes de la table des comptes : la session ne s'administre pas par elle.
  allOf:
    - $ref: '#/UserAccount'
    - type: object
      properties:
        display_preferences: { $ref: '#/DisplayPreferences' }

UserCreate:
  type: object
  required: [last_name, first_name, email]
  properties:
    last_name: { type: string, minLength: 1, maxLength: 100 }
    first_name: { type: string, minLength: 1, maxLength: 100 }
    email: { type: string, format: email }
    org_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    access_role_ids:
      type: array
      items: { $ref: ../common.yaml#/Uuid }

UserUpdate:
  type: object
  required: [lock_version]
  description: >-
    Le nom, le prénom et l'adresse d'un compte venu d'un fournisseur externe ne
    sont pas modifiables ici (WF-ADM-0050).
  properties:
    last_name: { type: string, minLength: 1, maxLength: 100 }
    first_name: { type: string, minLength: 1, maxLength: 100 }
    email: { type: string, format: email }
    org_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    lock_version: { $ref: ../common.yaml#/LockVersion }

UserRolesWrite:
  type: object
  required: [access_role_ids, lock_version]
  properties:
    access_role_ids:
      type: array
      items: { $ref: ../common.yaml#/Uuid }
    lock_version: { $ref: ../common.yaml#/LockVersion }

DisplayPreferences:
  type: object
  description: >-
    Préférences personnelles, cantonnées à la présentation (WF-ADM-0040). Les
    réglages de grille y sont conservés par grille (WF-IHM-0060). Une modification ne
    change que les champs qu'elle porte ; dans `grids`, que les grilles qu'elle nomme,
    chacune remplacée entière, et une grille à `null` retrouve ses réglages par défaut.
  properties:
    language:
      type: string
      enum: [default, fr, en]
      description: >-
        Langue de l'interface. `default` — ou, à la lecture, l'absence du champ — suit
        le navigateur, puis la langue par défaut de l'installation ; `fr` ou `en` prime
        dès qu'elle est choisie (WF-INTF-0160). C'est le seul champ de langue du
        compte : le front résout la langue à chaque requête, l'API n'en localise aucune
        réponse (WF-ARC-0110).
    theme:
      type: string
      enum: [default, light, dark]
      description: >-
        Mode d'affichage. `default` — ou, à la lecture, l'absence du champ — suit le
        réglage du poste ; `light` ou `dark` prime dès qu'il est choisi. Une préférence de présentation
        (WF-ADM-0040).
    highlight_tasks_added_after_reference: { type: boolean }
    grids:
      type: object
      additionalProperties:
        anyOf: [{ $ref: '#/GridPreferences' }, { type: 'null' }]

GridPreferences:
  type: object
  properties:
    hidden_columns:
      type: array
      items: { type: string }
    column_widths:
      type: object
      additionalProperties: { type: integer, minimum: 20 }
    sort:
      anyOf:
        - type: object
          required: [column, order]
          description: >-
            Le tri tel que la grille le demande au serveur : `column` est une valeur
            du `sort_by` de l'opération qui la sert.
          properties:
            column: { type: string }
            order: { $ref: ../common.yaml#/SortOrder }
        - type: 'null'
    filters:
      type: object
      additionalProperties: true

PermissionCode:
  type: string
  description: >-
    Code du catalogue, livré et non modifiable : deux permissions par fonction de
    second niveau, consulter et modifier, la permission d'une fonction couvrant ses
    sous-fonctions ; plus une permission propre par action irréversible ou
    structurante — créer un projet, marquer une révision, abandonner une révision en cours,
    désigner la révision de référence, fusionner un différentiel, déclarer une sortie du
    cycle de vie, déclarer un risque survenu, exclure une ligne de coût, restaurer la
    plateforme —, et « consulter tous les projets », qui ouvre à la consultation les
    projets dont l'utilisateur n'est pas contributeur (WF-ADM-0100, WF-PRJ-0060). La
    déclaration de survenance d'un risque emporte la fusion qu'elle déclenche et n'exige
    pas `structure_merge` (WF-ADM-0100). La consultation du journal d'audit
    (`audit_log.read`, WF-SEC-0030) est celle de la fonction que la spécification lui donne
    sous l'administration, FBS-1.5 « Journal d'audit » ; le journal ne se modifiant pas, elle
    n'a pas de permission de modifier : WF-ADM-0100 admet qu'une fonction en lecture seule n'ait
    que sa permission de consulter. L'énumération est le catalogue : une permission
    nouvelle est une modification du contrat.
  enum:
    # FBS-1 — Administration.
    - users.read
    - users.write
    - access_roles.read
    - access_roles.write
    - system_status.read
    - system_status.write
    - backups.read
    - backups.write
    - audit_log.read
    # FBS-2 — Portefeuille.
    - portfolio_projects.read
    - portfolio_projects.write
    - portfolio_workload.read
    - portfolio_workload.write
    - portfolio_performance.read
    - portfolio_performance.write
    - portfolio_cost_structure.read
    - portfolio_cost_structure.write
    - portfolio_risks.read
    - portfolio_risks.write
    - portfolio_cost_curve.read
    - portfolio_cost_curve.write
    - portfolio_pilot_health.read
    - portfolio_pilot_health.write
    # FBS-3 — Paramètres applicatifs.
    - cost_settings.read
    - cost_settings.write
    - resource_settings.read
    - resource_settings.write
    - risk_settings.read
    - risk_settings.write
    - indicator_settings.read
    - indicator_settings.write
    # FBS-4 — Projets.
    - revisions.read
    - revisions.write
    - project_settings.read
    - project_settings.write
    - planning.read
    - planning.write
    - estimate.read
    - estimate.write
    - remaining.read
    - remaining.write
    - risks.read
    - risks.write
    - actual_costs.read
    - actual_costs.write
    - project_indicators.read
    - project_indicators.write
    - lifecycle.read
    - lifecycle.write
    # Actions irréversibles, dans l'ordre où WF-ADM-0100 les nomme, puis les permissions
    # structurantes : créer un projet, consulter tous les projets.
    - revision_mark
    - revision_abandon
    - reference_designate
    - structure_merge
    - project_exit
    - risk_occurrence
    - cost_line_exclude
    - platform_restore
    - project_create
    - all_projects_read

Permission:
  type: object
  required: [code, kind]
  properties:
    code: { $ref: '#/PermissionCode' }
    kind:
      type: string
      enum: [function_read, function_write, irreversible, structuring]
      description: >-
        Consultation ou modification d'une fonction, action irréversible, ou permission
        structurante — créer un projet, consulter tous les projets (WF-ADM-0100).
    fbs_code:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Fonction de second niveau couverte, pour les deux premières natures.

AccessRole:
  type: object
  required: [access_role_id, label, permissions, is_predefined, holder_count, audit, lock_version]
  description: >-
    Ensemble nommé de permissions (WF-ADM-0090). Les trois rôles prédéfinis sont
    modifiables et supprimables (WF-ADM-0010) ; au moins un compte actif garde
    toujours les permissions d'administration (WF-ADM-0120).
  properties:
    access_role_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 100 }
    permissions:
      type: array
      items: { $ref: '#/PermissionCode' }
    is_predefined: { type: boolean }
    holder_count: { type: integer, minimum: 0 }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

AccessRoleWrite:
  type: object
  required: [label, permissions]
  properties:
    label: { type: string, minLength: 1, maxLength: 100 }
    permissions:
      type: array
      items: { $ref: '#/PermissionCode' }

AccessRoleUpdate:
  description: >-
    Modification d'un rôle d'accès : porte le compteur lu,
    qu'une création n'a pas.
  allOf:
    - $ref: '#/AccessRoleWrite'
    - type: object
      required: [lock_version]
      properties:
        lock_version: { $ref: ../common.yaml#/LockVersion }

