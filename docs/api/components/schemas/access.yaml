# Accounts, access roles and permissions (FBS-1.1, FBS-1.2).
# There is no open sign-up: an account is created by an authorised
# user, read from the identity provider that federates the directory, or created at its first
# sign-in coming from an external provider (WF-ADM-0050, WF-ADM-0070, WF-ADM-0180).
# Waterfall never sees a password: authentication is that of the identity
# provider (WF-ARC-0030, WF-ADM-0140).

PasswordSetupLink:
  type: object
  required: [url, expires_at]
  description: >-
    The link by which the holder of a local account sets or resets their password, returned
    to the authorised user who requested it so that they hand it over by another channel
    (WF-ADM-0140): the same link an email from the identity provider would carry, single-use
    and valid for one hour. It leads to the identity provider's page that sets the password,
    not to a Waterfall screen, which presents none (WF-ADM-0140, WF-ARC-0030). It
    is returned only once, never read again, and its request is recorded in the audit log
    (WF-SEC-0030); the token does not appear there.
  properties:
    url:
      type: string
      format: uri
      description: The whole link, as it is handed over.
    expires_at:
      allOf: [{ $ref: ../common.yaml#/Timestamp }]
      description: When the link ceases to be valid, one hour after its creation (WF-ADM-0140).

UserOrigin:
  type: string
  enum: [local, directory, identity_provider]
  description: >-
    Origin of the account: created in Waterfall (`local`), read from the identity provider that
    federates the directory (`directory`), or created at the first sign-in of a person coming
    from an external provider (`identity_provider`) (WF-ADM-0050, WF-ADM-0070, WF-ADM-0180).

User:
  description: >-
    An account as the accounts table reads it: the account, and its commands
    (`available_commands`, WF-IHM-0090).
  allOf:
    - $ref: '#/UserAccount'
    - type: object
      required: [available_commands]
      properties:
        available_commands:
          type: array
          maxItems: 5
          description: >-
            The account's commands that the caller has the permission to exercise, each
            available or not, with the conditions it is missing (WF-IHM-0090), in the order of
            `UserCommand`: at most five, the one that changes its state, its anonymisation if it
            is deactivated, the assignment of its roles, and for a non-anonymised local account,
            the setup link of its password and the resending of its invitation. A command absent
            from the list is not presented; the list is empty for
            whoever reads the accounts without the permission to modify them (`users.write`,
            WF-ADM-0100), and `set_access_roles` is there only for whoever also holds the
            permission to modify access roles (`access_roles.write`, WF-ADM-0090).
            The front does not match roles against accounts to know who is the last
            administrator (WF-ARC-0020): the account says so. A call sent despite the list
            is refused with its error code.
          items: { $ref: '#/UserCommandAvailability' }

UserCreated:
  description: >-
    The local account created (`createUser`), and whether the invitation that carries its setup
    link went out (WF-ADM-0140).
  allOf:
    - $ref: '#/User'
    - type: object
      required: [invitation_sent]
      properties:
        invitation_sent:
          type: boolean
          description: >-
            True when the identity provider has sent the holder the email that carries their
            setup link; false when it has not sent it — installation without email
            (WF-CMP-0030), failing mail server, unreachable provider: the account nevertheless
            exists, and the screen immediately offers the link to be handed over by another
            channel (`createPasswordSetupLink`). The email can be resent later (`resendInvitation`).

UserCommand:
  type: string
  enum:
    - deactivate
    - reactivate
    - anonymize
    - set_access_roles
    - create_password_link
    - resend_invitation
  description: >-
    Commands carried by an account (WF-IHM-0090): deactivating and reactivating it, through
    `setUserActivation` — none of them deletes it (WF-ADM-0060) —, anonymising it, through
    `anonymizeUser` (WF-ADM-0060), assigning its access roles, through
    `setUserAccessRoles` (WF-ADM-0090), getting the setup link of its password, through
    `createPasswordSetupLink`, and resending it the email that carries the link, through
    `resendInvitation` (WF-ADM-0140). These last two are listed only for a non-anonymised local
    account: an account from the directory or from an external provider never carries them, nor
    does an anonymised account, removed from the identity provider (WF-ADM-0060) — a final state
    removes the command, as on a closed project; they are available for an active account, and
    unavailable for a deactivated account, `is_active_account` missing (author's decision
    of 2026-11-01, #1737). An account carries only the one that changes its state:
    `deactivate` if it is active, `reactivate` if it is deactivated — unavailable for an
    anonymised account, `is_not_anonymized` missing, anonymisation being irreversible; it carries
    `anonymize` if it is deactivated, like `reactivate` which it follows — available as long as
    it is not anonymised, unavailable afterwards, `is_not_anonymized` missing —, and always
    `set_access_roles`. All of them fall under the permission to modify accounts
    (`users.write`, WF-ADM-0100); `set_access_roles` additionally requires the permission to
    modify access roles (`access_roles.write`): assigning a role falls under their management
    (FBS-1.2, WF-ADM-0090). The last active account that holds both the permissions to
    modify accounts and access roles (`users.write`, `access_roles.write`) has its
    deactivation unavailable, `last_administrator` missing (WF-ADM-0120): it becomes
    available as soon as a second active account holds them. The assignment of its roles stays
    available: WF-ADM-0120 only forbids removing these permissions from it, and giving it
    more remains possible (WF-IHM-0090: only what is unavailable is unavailable); only an
    assignment that would remove one of them from it is refused, with the 409 `LAST_ADMINISTRATOR`
    of `setUserAccessRoles`, which depends on the roles sent. Every other listed command is
    available, except `reactivate` and `anonymize` of an anonymised account, and
    `create_password_link` and `resend_invitation` of a deactivated account.

UserCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/UserCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Empty when the command is available.
      items: { $ref: projects.yaml#/CommandCondition }

UserAccount:
  type: object
  description: >-
    An account, without its commands: the one `getMe` returns (`UserSelf`), and which the
    accounts table completes with its own (`User`).
  required:
    - user_id
    - last_name
    - first_name
    - email
    - anonymized_at
    - is_active
    - origin
    - org_node_id
    - org_node_label
    - access_role_ids
    - access_role_labels
    - has_avatar
    - audit
    - lock_version
  properties:
    user_id: { $ref: ../common.yaml#/Uuid }
    last_name:
      anyOf:
        - { type: string, minLength: 1, pattern: '\S', maxLength: 100 }
        - { type: 'null' }
      description: Null for an anonymised account only (`anonymized_at`, WF-ADM-0060).
    first_name:
      anyOf:
        - { type: string, minLength: 1, pattern: '\S', maxLength: 100 }
        - { type: 'null' }
      description: Null for an anonymised account only (`anonymized_at`, WF-ADM-0060).
    email:
      anyOf: [{ type: string, format: email }, { type: 'null' }]
      description: >-
        Unique in the installation; it is what identifies the person (WF-ADM-0050). Null
        for an anonymised account only (`anonymized_at`, WF-ADM-0060).
    anonymized_at:
      anyOf: [{ $ref: ../common.yaml#/Timestamp }, { type: 'null' }]
      description: >-
        The instant the account was anonymised, null as long as it is not (WF-ADM-0060). An
        anonymised account no longer has a last name, first name, address or avatar: these three
        fields are null, and the front presents it everywhere under the neutral label of its
        catalogue, the API returning no sentence (WF-ARC-0110); its actions remain attributed to
        it, by its identifier. Anonymisation is irreversible: an anonymised account is not
        reactivated.
    is_active:
      type: boolean
      description: >-
        The state of the account (WF-ADM-0050): true for "active" (`active`), false for
        "deactivated" (`deactivated`). A deactivated account is refused on every request, with
        401 `ACCOUNT_DEACTIVATED`, and its sessions are closed (WF-SEC-0020).
    origin: { $ref: '#/UserOrigin' }
    org_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Optional attachment, which grants no permission (WF-ADM-0030).
    org_node_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Label of the attachment node, resolved on read, active or deactivated
        (WF-REF-0150); null without an attachment. The front does not match the organisation
        against the accounts (WF-ARC-0020).
    access_role_ids:
      type: array
      description: One or more roles; the user has the union of their permissions (WF-ADM-0090).
      items: { $ref: ../common.yaml#/Uuid }
    access_role_labels:
      type: array
      description: >-
        Labels of the roles of `access_role_ids`, resolved on read, in the same
        order. The front does not match roles against accounts (WF-ARC-0020).
      items: { type: string }
    has_avatar:
      type: boolean
      description: True when the account carries an avatar (WF-ADM-0080); false, the default image.
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

UserSelf:
  description: >-
    The signed-in account, its display preferences (WF-ADM-0040) and its effective
    permissions. It does not carry the commands of the accounts table: an account is not
    administered through `getMe`.
  allOf:
    - $ref: '#/UserAccount'
    - type: object
      required: [permissions]
      properties:
        display_preferences: { $ref: '#/DisplayPreferences' }
        permissions:
          type: array
          description: >-
            The account's effective permissions, the union of those of its roles, evaluated on
            each request (WF-ADM-0090, WF-ADM-0110) and returned so that the front knows what to
            present (WF-IHM-0090): a function the account cannot view is not
            presented. Empty for an account without a role (WF-ADM-0180).
          items: { $ref: '#/PermissionCode' }

UserCreate:
  type: object
  required: [last_name, first_name, email]
  description: >-
    A local account is born without a role, like an account read from the directory
    (WF-ADM-0070): its roles are then assigned to it by `setUserAccessRoles`, under the
    permission to modify access roles (WF-ADM-0090, WF-ADM-0100).
  properties:
    last_name: { type: string, minLength: 1, pattern: '\S', maxLength: 100 }
    first_name: { type: string, minLength: 1, pattern: '\S', maxLength: 100 }
    email: { type: string, format: email, maxLength: 254 }
    org_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]

UserUpdate:
  type: object
  required: [lock_version]
  description: >-
    The last name, first name and address of an account that does not come from Waterfall
    (`origin` other than `local`) cannot be modified here: a value different from the account's
    is refused, `FIELD_READ_ONLY`, the field sent back unchanged is not (WF-ADM-0050).
  properties:
    last_name: { type: string, minLength: 1, pattern: '\S', maxLength: 100 }
    first_name: { type: string, minLength: 1, pattern: '\S', maxLength: 100 }
    email: { type: string, format: email, maxLength: 254 }
    org_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    lock_version: { $ref: ../common.yaml#/LockVersion }

UserActivationWrite:
  type: object
  required: [is_active, lock_version]
  properties:
    is_active: { type: boolean }
    lock_version: { $ref: ../common.yaml#/LockVersion }

UserAnonymizationWrite:
  type: object
  required: [lock_version]
  description: The anonymisation of a deactivated account, at the version read (`anonymizeUser`).
  properties:
    lock_version: { $ref: ../common.yaml#/LockVersion }

UserRolesWrite:
  type: object
  required: [access_role_ids, lock_version]
  properties:
    access_role_ids:
      type: array
      items: { $ref: ../common.yaml#/Uuid }
    lock_version: { $ref: ../common.yaml#/LockVersion }

DisplayPreferences:
  type: object
  description: >-
    Personal preferences, confined to presentation (WF-ADM-0040). The
    grid settings are kept there per grid (WF-IHM-0060). A modification
    changes only the fields it carries; in `grids`, only the grids it names,
    each replaced whole, and a grid set to `null` returns to its default settings.
    The layout of each timeline is kept likewise in `timelines`, per timeline
    (WF-PLA-0140, EP-15/US-0530): a modification replaces only the timelines it
    names, each whole, and a timeline set to `null` returns to its automatic layout.
    The state of each chart is kept likewise in `charts`, per chart (EP-15/US-0550): a
    modification replaces only the charts it names, and a chart set to `null` returns to
    the state its screen gives it initially.
    The preferences are read again with the account on each request: their size is bounded
    (#874) — a hundred grids, a hundred timelines and a hundred charts at most, grid,
    column, filter, timeline, task and chart names of 64 characters at most; per grid, 64
    hidden, 64 known, 64 widened columns and 20 filters at most, a filter value of 500
    characters at most; per timeline, 64 placed tasks at most. A preference that exceeds a
    bound is refused with 422 `VALUE_TOO_LONG`, at the pointer of the faulty object, list or
    text; a name that is too long, at the pointer of the object that carries it.
  properties:
    language:
      type: string
      enum: [default, fr, en]
      description: >-
        Interface language. `default` — or, on read, the absence of the field — follows
        the browser, then the installation's default language; `fr` or `en` prevails
        as soon as it is chosen (WF-INTF-0160). It is the account's only language
        field: the front resolves the language on each request, the API localises none of its
        responses (WF-ARC-0110).
    theme:
      type: string
      enum: [default, light, dark]
      description: >-
        Display mode. `default` — or, on read, the absence of the field — follows the
        device's setting; `light` or `dark` prevails as soon as it is chosen. A presentation
        preference (WF-ADM-0040).
    highlight_tasks_added_after_reference:
      type: boolean
      description: >-
        The preference that visually distinguishes the tasks added after the reference
        revision and, in the remaining to commit, the lines whose budgeted amount is zero: a
        single preference for both (WF-ADM-0040, WF-RAE-0040). When absent, false.
    grids:
      type: object
      maxProperties: 100
      propertyNames: { maxLength: 64 }
      additionalProperties:
        anyOf: [{ $ref: '#/GridPreferences' }, { type: 'null' }]
    timelines:
      type: object
      description: >-
        The layout of each timeline the user has arranged, by its
        `timeline_id`: a display preference, specific to each user (WF-ADM-0040, WF-PLA-0140).
      maxProperties: 100
      propertyNames: { maxLength: 64 }
      additionalProperties:
        anyOf: [{ $ref: '#/TimelinePreferences' }, { type: 'null' }]
    charts:
      type: object
      description: >-
        The state of each chart the user has folded or unfolded, by the chart's name
        on its screen — `risk_matrix`, the risk matrix of a project's screen, the same
        for all their projects: a display preference, specific to each user (WF-ADM-0040,
        EP-15/US-0550).
      maxProperties: 100
      propertyNames: { maxLength: 64 }
      additionalProperties:
        anyOf: [{ $ref: '#/ChartPreferences' }, { type: 'null' }]

ChartPreferences:
  type: object
  required: [folded]
  description: >-
    The state of a foldable chart (EP-15/US-0550): when folded, the screen shows only its
    title and the button that unfolds it; a chart absent from the preferences takes the state its
    screen gives it initially — folded for a project's risk matrix (#1252).
  properties:
    folded:
      type: boolean
      description: >-
        Folded (`true`) or unfolded (`false`). Required: a chart that returns to its screen's
        state is sent as `null`, whole.

TimelinePreferences:
  type: object
  required: [lanes]
  description: >-
    The layout of a timeline shown as a frieze (EP-15/US-0530): the lane of each task the
    user has placed. A task that does not appear there — registered since, or never moved —
    takes the lane the automatic layout gives it; a task that is no longer registered
    is ignored.
  properties:
    lanes:
      type: object
      maxProperties: 64
      propertyNames: { maxLength: 64 }
      description: >-
        The lane of each placed task, by its `node_id`: a rank from 0, the top
        lane. A negative rank is refused with 422, `VALUE_OUT_OF_RANGE` on
        `/timelines/<timeline>/lanes/<task>`, `fields[].params.minimum` at `0`.
      additionalProperties: { type: integer, minimum: 0 }

GridPreferences:
  type: object
  properties:
    page_size:
      type: integer
      enum: [10, 25, 50, 100]
      description: >-
        The number of rows per page of a flat table, chosen among 10, 25, 50 and 100;
        when absent, 50, the default of `limit` (WF-IHM-0060, C-351). A tree grid does not
        offer it. Another value is refused with 422, `VALUE_OUT_OF_RANGE` on
        `/grids/<grid>/page_size`, without a parameter: the admitted values are these.
    hidden_columns:
      type: array
      maxItems: 64
      items: { type: string, maxLength: 64 }
      description: >-
        The keys of the columns the user has hidden. A column it names is hidden;
        a column it does not name is shown if the grid knew it
        (`known_columns`), and otherwise takes what the grid gives it by default.
    known_columns:
      type: array
      maxItems: 64
      items: { type: string, maxLength: 64 }
      description: >-
        The keys of the columns the grid offered when its preferences were last
        written — the front rewrites it on each write of the grid, whole like the rest.
        A column absent from this list is a column the grid has received since: hidden
        if the grid hides it by default, shown otherwise, unless `hidden_columns` names it. A
        new column hidden by default thus stays hidden for an account that has already set up the
        grid, and a column the account has chosen to display stays displayed (EP-16/US-0650,
        #1260). Optional: when absent — an account that has never written it —, it counts as an
        empty list, and every column hidden by default that `hidden_columns` does not name is
        hidden. The server keeps it as written, without knowing the columns of any grid.
    column_widths:
      type: object
      maxProperties: 64
      propertyNames: { maxLength: 64 }
      description: >-
        The width of each widened column, in points, by its key: at least twenty, a narrower
        width being refused with 422, `VALUE_OUT_OF_RANGE` on
        `/grids/<grid>/column_widths/<column>`, `fields[].params.minimum` at `20`.
      additionalProperties: { type: integer, minimum: 20 }
    sort:
      anyOf:
        - type: object
          required: [column, order]
          description: >-
            The sort as the grid requests it from the server: `column` is a value
            of the `sort_by` of the operation that serves it.
          properties:
            column: { type: string, maxLength: 64 }
            order: { $ref: ../common.yaml#/SortOrder }
        - type: 'null'
    filters:
      type: object
      description: >-
        The search and the filters of the grid, as its address writes them: each
        parameter under its name, with its value as text. The server keeps them as they are
        written, without knowing the parameters of any grid. Thus the projects list of the
        home page, the `projects` grid, keeps under `states` the chosen states, separated by
        commas as the address writes them (`states=pricing,in_progress,completed`); an account
        that has written nothing there takes the screen's default, Created, Pricing and In
        progress, which the contract does not carry (WF-PTF-0030, WF-IHM-0060; #1401, #1747).
      maxProperties: 20
      propertyNames: { maxLength: 64 }
      additionalProperties: { type: string, maxLength: 500 }

PermissionCode:
  type: string
  description: >-
    Catalogue code, delivered and not modifiable: two permissions per second-level
    function, view and modify, except for read-only functions — the system
    status (FBS-1.3), the audit log (FBS-1.5) and the portfolio views (FBS-2.1 to
    FBS-2.7) —, which only have the view permission (WF-ADM-0100, #739); the permission
    of a function covering its sub-functions; plus a dedicated permission per irreversible or
    structuring action — create a project, mark a revision, abandon an in-progress revision,
    designate the reference revision, merge a differential, declare an exit from the
    life cycle, declare an occurred risk, exclude a cost line, restore the
    platform —, and "view all projects", which opens for viewing the
    projects of which the user is not a contributor (WF-ADM-0100, WF-PRJ-0060). Declaring
    that a risk has occurred carries the merge it triggers and does not require
    `structure_merge` (WF-ADM-0100). Viewing the audit log
    (`audit_log.read`, WF-SEC-0030) is that of the function the specification gives it
    under administration, FBS-1.5 "Audit log". The view permissions of the
    application settings (FBS-3) open what every session does not already read: the active
    reference data objects — nodes, resource roles, calendars, cost types and categories — are
    read by any open session, as project vocabulary (FBS-4), and their deactivated objects as
    well as their writes fall under the permission to modify the function. `cost_settings.read`
    opens the hourly rate grid (`getHourlyRateGrid`), the rates of a category
    (`listHourlyRates`) and the mapping of the actual cost extraction
    (`getActualCostMapping`), 404 without it; `resource_settings.read`,
    `risk_settings.read` and `indicator_settings.read` open the presentation of the screens of
    their function (`UserSelf.permissions`, WF-IHM-0090), their active data being read
    otherwise. The catalogue keeps them all (WF-ADM-0100; author's decision of 2026-11-01, #1745).
    The enumeration is the catalogue: a new permission is a modification of the contract.
  enum:
    # FBS-1 — Administration.
    - users.read
    - users.write
    - access_roles.read
    - access_roles.write
    - system_status.read
    - backups.read
    - backups.write
    - audit_log.read
    # FBS-2 — Portfolio.
    - portfolio_projects.read
    - portfolio_workload.read
    - portfolio_performance.read
    - portfolio_cost_structure.read
    - portfolio_risks.read
    - portfolio_cost_curve.read
    - portfolio_pilot_health.read
    # FBS-3 — Application settings.
    - cost_settings.read
    - cost_settings.write
    - resource_settings.read
    - resource_settings.write
    - risk_settings.read
    - risk_settings.write
    - indicator_settings.read
    - indicator_settings.write
    # FBS-4 — Projects.
    - revisions.read
    - revisions.write
    - project_settings.read
    - project_settings.write
    - planning.read
    - planning.write
    - estimate.read
    - estimate.write
    - remaining.read
    - remaining.write
    - risks.read
    - risks.write
    - actual_costs.read
    - actual_costs.write
    - project_indicators.read
    - project_indicators.write
    - lifecycle.read
    - lifecycle.write
    # Irreversible actions, in the order in which WF-ADM-0100 names them, then the structuring
    # permissions: create a project, view all projects.
    - revision_mark
    - revision_abandon
    - reference_designate
    - structure_merge
    - project_exit
    - risk_occurrence
    - cost_line_exclude
    - platform_restore
    - project_create
    - all_projects_read

Permission:
  type: object
  required: [code, kind, fbs_code]
  properties:
    code: { $ref: '#/PermissionCode' }
    kind:
      type: string
      enum: [function_read, function_write, irreversible, structuring]
      description: >-
        Viewing or modifying a function, irreversible action, or structuring
        permission — create a project, view all projects (WF-ADM-0100).
    fbs_code:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Second-level function covered, for the first two kinds.

AccessRole:
  type: object
  required: [access_role_id, label, permissions, is_predefined, holder_count, audit, lock_version]
  description: >-
    Named set of permissions (WF-ADM-0090). The three predefined roles can be
    modified and deleted (WF-ADM-0010); at least one active account always keeps
    the administration permissions (WF-ADM-0120).
  properties:
    access_role_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 100 }
    permissions:
      type: array
      items: { $ref: '#/PermissionCode' }
    is_predefined: { type: boolean }
    holder_count: { type: integer, minimum: 0 }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

AccessRoleWrite:
  type: object
  required: [label, permissions]
  properties:
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 100 }
    permissions:
      type: array
      items: { $ref: '#/PermissionCode' }

AccessRoleUpdate:
  description: >-
    Modification of an access role: carries the lock version read,
    which a creation does not have.
  allOf:
    - $ref: '#/AccessRoleWrite'
    - type: object
      required: [lock_version]
      properties:
        lock_version: { $ref: ../common.yaml#/LockVersion }

