# Session, comptes, rôles d'habilitation et permissions (FBS-1.1, FBS-1.2).
# Il n'existe aucune inscription libre : un compte est créé par un utilisateur
# habilité, importé de l'annuaire, ou créé à sa première connexion par le
# fournisseur d'identité (WF-ADM-0050, WF-ADM-0070, WF-ADM-0180).

AuthProviderKind:
  type: string
  enum: [local, ldap, oidc]

AuthProvider:
  type: object
  required: [kind, is_enabled]
  description: >-
    Fournisseur d'authentification. Les comptes locaux sont toujours actifs ;
    l'annuaire et le fournisseur d'identité s'activent dans l'administration
    (WF-ADM-0180, WF-ARC-0030).
  properties:
    kind: { $ref: '#/AuthProviderKind' }
    is_enabled: { type: boolean }
    label:
      anyOf: [{ type: string }, { type: 'null' }]
    start_url:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Point de départ des redirections, pour un fournisseur OIDC (TFX-07).

LocalCredentials:
  type: object
  required: [email, password]
  properties:
    email: { type: string, format: email }
    password: { type: string, minLength: 12, maxLength: 200 }

Session:
  type: object
  required: [user, permissions, expires_at]
  description: >-
    Session conservée en base, révocable immédiatement (WF-SEC-0020). Les
    permissions effectives sont évaluées à chaque requête et renvoyées ici pour que
    le front sache quoi présenter (WF-ADM-0110, WF-IHM-0090).
  properties:
    user: { $ref: '#/UserSelf' }
    permissions:
      type: array
      items: { $ref: '#/PermissionCode' }
    expires_at: { $ref: ../common.yaml#/Timestamp }
    idle_expires_at: { $ref: ../common.yaml#/Timestamp }

PasswordResetRequest:
  type: object
  required: [email]
  description: >-
    Demande un lien de réinitialisation, valable une heure et à usage unique
    (WF-ADM-0140). Le courriel part dans la langue que le compte a choisie, `fr` ou
    `en` ; si elle vaut `default`, dans la première langue offerte que demande la
    requête, et à défaut dans la langue par défaut de l'installation (WF-ARC-0110).
  properties:
    email: { type: string, format: email }

PasswordResetConfirm:
  type: object
  required: [token, password]
  properties:
    token: { type: string, minLength: 20 }
    password: { type: string, minLength: 12, maxLength: 200 }

PasswordChange:
  type: object
  required: [current_password, new_password]
  properties:
    current_password: { type: string }
    new_password: { type: string, minLength: 12, maxLength: 200 }

UserOrigin:
  type: string
  enum: [local, directory, identity_provider]
  description: >-
    Origine du compte : créé dans Waterfall, importé de l'annuaire, ou créé à sa
    première connexion par le fournisseur d'identité (WF-ADM-0050).

User:
  type: object
  required:
    - user_id
    - last_name
    - first_name
    - email
    - is_active
    - origin
    - org_node_label
    - access_role_ids
    - access_role_labels
    - audit
    - lock_version
  properties:
    user_id: { $ref: ../common.yaml#/Uuid }
    last_name: { type: string, minLength: 1, maxLength: 100 }
    first_name: { type: string, minLength: 1, maxLength: 100 }
    email:
      type: string
      format: email
      description: Unique dans l'installation ; c'est elle qui identifie la personne (WF-ADM-0050).
    is_active: { type: boolean }
    origin: { $ref: '#/UserOrigin' }
    org_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Rattachement facultatif, qui n'accorde aucune permission (WF-ADM-0030).
    org_node_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Libellé du nœud de rattachement, résolu à la lecture, actif ou désactivé
        (WF-REF-0150) ; nul sans rattachement. Le front ne rapproche pas l'organisation
        des comptes (WF-ARC-0020).
    access_role_ids:
      type: array
      description: Un ou plusieurs rôles ; l'utilisateur dispose de l'union de leurs permissions (WF-ADM-0090).
      items: { $ref: ../common.yaml#/Uuid }
    access_role_labels:
      type: array
      description: >-
        Libellés des rôles de `access_role_ids`, résolus à la lecture, dans le même
        ordre. Le front ne rapproche pas les rôles des comptes (WF-ARC-0020).
      items: { type: string }
    has_avatar: { type: boolean }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

UserSelf:
  allOf:
    - $ref: '#/User'
    - type: object
      properties:
        display_preferences: { $ref: '#/DisplayPreferences' }

UserCreate:
  type: object
  required: [last_name, first_name, email]
  properties:
    last_name: { type: string, minLength: 1, maxLength: 100 }
    first_name: { type: string, minLength: 1, maxLength: 100 }
    email: { type: string, format: email }
    org_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    access_role_ids:
      type: array
      items: { $ref: ../common.yaml#/Uuid }

UserUpdate:
  type: object
  required: [lock_version]
  description: >-
    Le nom, le prénom et l'adresse d'un compte venu d'un fournisseur externe ne
    sont pas modifiables ici (WF-ADM-0050).
  properties:
    last_name: { type: string, minLength: 1, maxLength: 100 }
    first_name: { type: string, minLength: 1, maxLength: 100 }
    email: { type: string, format: email }
    org_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    lock_version: { $ref: ../common.yaml#/LockVersion }

UserRolesWrite:
  type: object
  required: [access_role_ids, lock_version]
  properties:
    access_role_ids:
      type: array
      items: { $ref: ../common.yaml#/Uuid }
    lock_version: { $ref: ../common.yaml#/LockVersion }

DisplayPreferences:
  type: object
  description: >-
    Préférences personnelles, cantonnées à la présentation (WF-ADM-0040). Les
    réglages de grille y sont conservés par grille (WF-IHM-0060). Une modification ne
    change que les champs qu'elle porte ; dans `grids`, que les grilles qu'elle nomme,
    chacune remplacée entière, et une grille à `null` retrouve ses réglages par défaut.
  properties:
    language:
      type: string
      enum: [default, fr, en]
      description: >-
        Langue de l'interface. `default` — ou, à la lecture, l'absence du champ — suit
        le navigateur, puis la langue par défaut de l'installation ; `fr` ou `en` prime
        dès qu'elle est choisie (WF-INTF-0160). C'est le seul champ de langue du
        compte : le front résout la langue à chaque requête, l'API n'en localise aucune
        réponse (WF-ARC-0110).
    theme:
      type: string
      enum: [default, light, dark]
      description: >-
        Mode d'affichage. `default` — ou, à la lecture, l'absence du champ — suit le
        réglage du poste ; `light` ou `dark` prime dès qu'il est choisi. Une préférence de présentation
        (WF-ADM-0040).
    highlight_tasks_added_after_reference: { type: boolean }
    grids:
      type: object
      additionalProperties:
        anyOf: [{ $ref: '#/GridPreferences' }, { type: 'null' }]

GridPreferences:
  type: object
  properties:
    hidden_columns:
      type: array
      items: { type: string }
    column_widths:
      type: object
      additionalProperties: { type: integer, minimum: 20 }
    sort:
      anyOf:
        - type: object
          required: [column, order]
          description: >-
            Le tri tel que la grille le demande au serveur : `column` est une valeur
            du `sort_by` de l'opération qui la sert.
          properties:
            column: { type: string }
            order: { $ref: ../common.yaml#/SortOrder }
        - type: 'null'
    filters:
      type: object
      additionalProperties: true

PermissionCode:
  type: string
  description: >-
    Code du catalogue, livré et non modifiable : deux permissions par fonction de
    second niveau, consulter et modifier, la permission d'une fonction couvrant ses
    sous-fonctions ; plus une permission propre par action irréversible ou
    structurante, dont « consulter tous les projets », qui ouvre à la consultation les
    projets dont l'utilisateur n'est pas contributeur (WF-ADM-0100, WF-PRJ-0060).
    L'énumération est le catalogue : une permission nouvelle est une modification du
    contrat.
  enum:
    # FBS-1 — Administration.
    - users.read
    - users.write
    - access_roles.read
    - access_roles.write
    - system_status.read
    - system_status.write
    - backups.read
    - backups.write
    # FBS-2 — Portefeuille.
    - portfolio_projects.read
    - portfolio_projects.write
    - portfolio_workload.read
    - portfolio_workload.write
    - portfolio_performance.read
    - portfolio_performance.write
    - portfolio_cost_structure.read
    - portfolio_cost_structure.write
    - portfolio_risks.read
    - portfolio_risks.write
    - portfolio_cash_out.read
    - portfolio_cash_out.write
    - portfolio_pilot_health.read
    - portfolio_pilot_health.write
    # FBS-3 — Paramètres applicatifs.
    - cost_settings.read
    - cost_settings.write
    - resource_settings.read
    - resource_settings.write
    - risk_settings.read
    - risk_settings.write
    - indicator_settings.read
    - indicator_settings.write
    # FBS-4 — Projets.
    - revisions.read
    - revisions.write
    - project_settings.read
    - project_settings.write
    - planning.read
    - planning.write
    - estimate.read
    - estimate.write
    - remaining.read
    - remaining.write
    - risks.read
    - risks.write
    - actual_costs.read
    - actual_costs.write
    - project_indicators.read
    - project_indicators.write
    - lifecycle.read
    - lifecycle.write
    # Actions irréversibles ou structurantes.
    - revision_mark
    - reference_designate
    - project_exit
    - risk_occurrence
    - cost_line_exclude
    - platform_restore
    - all_projects_read

Permission:
  type: object
  required: [code, kind]
  properties:
    code: { $ref: '#/PermissionCode' }
    kind:
      type: string
      enum: [function_read, function_write, irreversible, structuring]
      description: >-
        Consultation ou modification d'une fonction, action irréversible, ou permission
        structurante — consulter tous les projets (WF-ADM-0100).
    fbs_code:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Fonction de second niveau couverte, pour les deux premières natures.

AccessRole:
  type: object
  required: [access_role_id, label, permissions, is_predefined, holder_count, audit, lock_version]
  description: >-
    Ensemble nommé de permissions (WF-ADM-0090). Les trois rôles prédéfinis sont
    modifiables et supprimables (WF-ADM-0010) ; au moins un compte actif garde
    toujours les permissions d'administration (WF-ADM-0120).
  properties:
    access_role_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 100 }
    permissions:
      type: array
      items: { $ref: '#/PermissionCode' }
    is_predefined: { type: boolean }
    holder_count: { type: integer, minimum: 0 }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

AccessRoleWrite:
  type: object
  required: [label, permissions]
  properties:
    label: { type: string, minLength: 1, maxLength: 100 }
    permissions:
      type: array
      items: { $ref: '#/PermissionCode' }

AccessRoleUpdate:
  description: >-
    Modification d'un rôle d'accès : porte le compteur lu,
    qu'une création n'a pas.
  allOf:
    - $ref: '#/AccessRoleWrite'
    - type: object
      required: [lock_version]
      properties:
        lock_version: { $ref: ../common.yaml#/LockVersion }

