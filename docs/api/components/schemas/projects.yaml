# Projet, cycle de vie, lotissement, sous-projets et contributeurs (FBS-4.2, FBS-4.9).

ProjectState:
  type: string
  enum: [created, pricing, in_progress, completed, lost, abandoned]
  description: >-
    Les six états du cycle de vie, et aucun autre (WF-CYC-0010). Les libellés sont
    rendus par le front dans la langue du lecteur (WF-ARC-0110).

Project:
  description: Attributs d'un projet (WF-PRJ-0080).
  type: object
  required:
    - project_id
    - label
    - state
    - inflation_rate
    - win_probability
    - available_commands
    - audit
    - lock_version
  properties:
    project_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    client:
      anyOf: [{ $ref: '#/ProjectClient' }, { type: 'null' }]
      description: >-
        Le nom du client du projet (WF-PRJ-0080) : facultatif, nul tant qu'il n'est pas saisi,
        exigé par aucune transition. `createProject` et `updateProject` l'écrivent (EP-16/US-0610).
    code:
      anyOf: [{ type: string, maxLength: 50 }, { type: 'null' }]
      description: >-
        Code sous lequel l'ERP connaît le projet, unique dans l'installation et
        exigé pour le passage à En cours (WF-PRJ-0010).
    state: { $ref: '#/ProjectState' }
    inflation_rate:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      description: >-
        Taux d'inflation annuel, 0 par défaut, modifiable à tout moment (WF-PRJ-0040) : un
        rapport, de `0` à `1` inclus — `0.03` pour 3 % —, hors duquel `updateProject` refuse la
        valeur (`VALUE_OUT_OF_RANGE`).
    win_probability:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      description: >-
        Probabilité de gain, 0 par défaut, sans effet sur aucun calcul du projet (WF-PRJ-0090) :
        un rapport, de `0` à `1` inclus, hors duquel `updateProject` refuse la valeur
        (`VALUE_OUT_OF_RANGE`). Modifiable aux états Créé et Chiffrage, figée à partir de En
        cours : la commande `update_win_probability` le dit d'avance, et la valeur envoyée malgré
        elle est refusée par 409 `STATE_FORBIDS_OPERATION`, `params.missing_condition` à
        `project_before_in_progress`.
    order_received_on:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
    reference_revision_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Révision de référence, désignée une fois à la contractualisation (WF-REV-0040).
    current_revision_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Révision en cours d'élaboration, s'il en existe une (WF-REV-0010).
    available_commands:
      type: array
      description: >-
        Commandes du projet que l'appelant a la permission d'exercer, chacune
        disponible ou non, avec les conditions qui lui manquent (WF-IHM-0090). Une
        commande absente de la liste n'est pas présentée. Seule exception, décidée par
        l'utilisateur le 2026-10-05 : sans révision en cours, l'import d'un planning, d'un
        devis ou d'un reste à engager est listé à qui a la permission de l'import mais pas
        celle de créer une révision, indisponible, `may_create_revision` manquante ; la
        génération du squelette de planning (`generate_skeleton`) l'est de même à qui a la
        permission du planning (EP-15/US-0490/L4).
      items: { $ref: '#/ProjectCommandAvailability' }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

ProjectListMeta:
  description: >-
    Où se tient la page dans les projets retenus, et les états retenus : ceux que la requête
    nomme (`states`), ou, quand elle n'en nomme aucun, ceux du défaut, les projets en cours
    (WF-PTF-0010), dans l'ordre de `ProjectState`. L'écran montre ainsi le filtre d'état que le
    serveur a appliqué, sans le deviner (WF-IHM-0130).
  allOf:
    - $ref: ../common.yaml#/PaginationMeta
    - type: object
      required: [states]
      properties:
        states:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/ProjectState' }

CommandCondition:
  type: string
  description: >-
    Condition qu'une commande exige, nommée par le serveur quand elle manque, et
    rendue par le front dans la langue du lecteur (WF-IHM-0090, WF-ARC-0110).
    `is_project_manager` manque à qui n'est que contributeur pour une action structurante
    ou le paramétrage du projet, réservés aux chefs de projet (WF-PRJ-0060, WF-ADM-0110).
    `no_background_task_running` manque tant qu'un traitement de fond court sur l'objet
    — marquage, fusion d'un différentiel, survenance d'un risque, import —, quel que
    soit l'utilisateur qui l'a lancé : les commandes qu'il rendrait caduques le nomment.
    Pendant le marquage d'une révision, ce sont toutes les commandes qui la modifient : la
    saisie du planning, du devis, du reste à engager et des risques, la déclaration d'un risque
    (`declare_risk`), l'ouverture d'un différentiel, sa fusion, le marquage, la désignation de
    la référence et l'abandon, et les imports du projet qui y écriraient — ses exports, qui la
    lisent, restent disponibles.
    Pendant l'application d'un import de planning, de devis ou de reste à engager
    (`Import.status` à `applying`), et pendant le traitement d'une déclaration de survenance,
    qui fusionne dans la révision en cours (WF-RIS-0060), ce sont les commandes qui écriraient
    dans la révision en cours — `edit_planning`, `generate_skeleton`, `edit_estimate`,
    `edit_remaining`, `edit_risks`, `declare_risk`, `create_structure`, `merge_structure`,
    `mark`, `abandon` —,
    la déclaration d'une survenance et les imports du projet ; ses exports restent disponibles.
    Pendant tout traitement de fond qui écrit dans la révision en cours ou la fige — marquage,
    fusion, survenance, application d'un import —, c'est aussi la saisie du lotissement
    (`ProjectCommand.update_work_breakdown`), qui retire le rattachement des tâches de la
    révision en cours (WF-PLA-0170) ; `setWorkBreakdown` la nomme dans son 409 (EP-14/L42s).
    Un projet sans révision en cours en a une qui naît : l'application d'un import, en une seule
    transaction (WF-INTF-0080), et le traitement d'une survenance créent la révision en cours
    qu'ils écrivent (WF-INTF-0090, WF-RIS-0060), invisible jusqu'à leur fin. Pendant ce temps, le
    projet nomme la condition aux commandes qu'il porte et qui créeraient ou ouvriraient cette
    révision — les imports, `edit_risks`, `declare_risk`, `generate_skeleton` (EP-15/US-0490/L4).
    L'analyse d'un import (`analysing`) ne suspend rien : elle ne modifie rien (WF-ARC-0100), et
    l'import de coûts réels n'écrit pas dans la révision (WF-INTF-0090, WF-CRE-0010,
    WF-IHM-0080, WF-IHM-0090, WF-ARC-0090). `may_create_revision` manque, quand le projet n'a pas
    de révision en cours, à qui n'a pas la permission de créer une révision (`revisions.write`)
    pour une commande qui la créerait : les imports d'un planning, d'un devis ou d'un reste à
    engager (WF-INTF-0090), la saisie des risques (`ProjectCommand.edit_risks`, WF-RIS-0020), la
    déclaration d'un risque (`ProjectCommand.declare_risk`, EP-14/L42s) et la déclaration d'un
    risque survenu (`RiskCommand.declare_occurrence`, WF-RIS-0060) ; et pour une commande qui
    demande d'ouvrir la révision d'abord : la génération du squelette de planning
    (`ProjectCommand.generate_skeleton`, WF-PRJ-0030, WF-REV-0010 ; EP-15/US-0490/L4). Trois
    conditions tiennent à l'état d'un risque, et le risque les nomme (`Risk.available_commands`) :
    `risk_not_occurred` manque à la modification, au réexamen et à la suppression d'un risque
    survenu, dont aucune transition ne part ; `risk_identified` à la déclaration de survenance et
    au changement de la catégorie ou du sous-projet de la provision d'un risque qui n'est pas
    identifié (WF-RIS-0010, `update_provision`) ; `risk_not_cited` à la suppression d'un risque
    qu'une révision marquée cite : il ne se supprime plus, il s'écarte (WF-RIS-0020) ;
    `deleteRisk` la nomme dans son 409. Quatre tiennent à l'état d'un objet du référentiel, et
    l'objet les nomme (`ReferenceCommand`, `CalendarCommand`) : `org_node_parent_active` manque
    à la réactivation d'un nœud dont le parent est désactivé, `org_node_active` à celle d'un
    rôle dont le nœud est désactivé (WF-REF-0080) ; `calendar_not_default` à la désactivation
    du calendrier par défaut, tant qu'un autre n'a pas été désigné (WF-REF-0120) ;
    `calendar_active` à la désignation par défaut d'un calendrier désactivé, le calendrier par
    défaut étant actif (WF-REF-0120). Les opérations d'activation et `setDefaultCalendar` les
    nomment dans leur 409. `cost_type_active` manque à la réactivation d'une catégorie de coût
    dont la nature est désactivée : « une catégorie ne peut être réactivée que si sa nature est
    active » (WF-REF-0010 ; EP-14/L42s, C-291) ; la catégorie la nomme
    (`CostCategory.available_commands`), et `setCostCategoryActivation` dans son 409. Trois
    tiennent aux catégories d'une nature de coût, et la nature les nomme
    (`CostType.available_commands`) :
    `cost_type_unused` manque à la modification du type d'une nature dont une catégorie rattachée
    est employée, `cost_type_unrated` quand l'une porte un taux horaire, `cost_type_without_role`
    quand un rôle de ressource, actif ou désactivé, est rattaché à l'une (WF-REF-0030) ;
    `updateCostType` nomme dans son 409 la première qui manque, dans cet ordre, avec les
    catégories en cause pour les deux premières (`params.cost_categories`, EP-14/L42s) et les
    rôles en cause pour la dernière (`params.resource_roles`). Trois tiennent à
    une catégorie de coût, et la catégorie les nomme (`CostCategory.available_commands`) :
    `cost_category_unused` manque à son rattachement à une nature d'un autre type quand elle est
    employée, `cost_category_unrated` quand elle porte des taux horaires (WF-REF-0030,
    WF-REF-0050, #577), `cost_category_without_role` quand un rôle de ressource, actif ou
    désactivé, lui est rattaché (WF-REF-0040) ; `updateCostCategory` nomme dans son 409 la
    première qui manque, dans cet ordre, et pour la dernière les rôles en cause
    (`params.resource_roles`).
    `active_provision_category` manque à la déclaration d'un risque, et au retour d'un risque
    écarté à l'état identifié, quand aucune catégorie de coût active n'est de type provision pour
    risques (WF-RIS-0010 ; EP-14/L42p, #579) — une catégorie active l'est toujours sous une nature
    active (WF-REF-0010, C-291) : la saisie des risques (`edit_risks`) modifie, réexamine et
    supprime sans elle, la déclaration la dit d'avance (`declare_risk`, EP-14/L42s), et
    `createRisk` et `reviewRisk` la nomment dans leur 409 ; le retour d'un risque écarté, par la
    catégorie du risque (`Risk.provision_cost_category_is_active`) ; et la création d'un projet
    l'exige (`ReferenceReadiness.missing`, WF-CYC-0120). `at_least_one_task` manque à la déclaration d'un
    risque sur une révision dont la structure principale ne comporte aucune tâche : « La
    déclaration d'un risque sur une structure principale sans tâche est refusée, en nommant la
    condition manquante » (WF-RIS-0010) — la ligne de provision n'aurait pas de tâche où se
    ranger ; `createRisk` la nomme dans son 409, après les conditions d'état de la saisie des
    risques, `project_not_terminal` puis `no_background_task_running`, et avant
    `active_provision_category`. La commande `declare_risk` de la révision, ou du projet sans
    révision en cours, les dit d'avance, dans cet ordre, puis les autres conditions d'`edit_risks`
    (EP-14/L42s).
    `import_file_accepted` manque à l'application d'un import dont le compte rendu rejette le
    fichier entier (`ImportReport.refusals`, WF-INTF-0040, WF-PLA-0150) : seul l'abandon reste
    offert, et `applyImport` la nomme dans son 409 (EP-14/L42s).
    Une tient aux comptes, et le compte la nomme (`User.available_commands`) :
    `last_administrator` manque à la désactivation du dernier compte actif qui porte les
    permissions de modifier les comptes et les rôles d'habilitation (WF-ADM-0120) ;
    `setUserActivation` la nomme dans son 409. Deux tiennent à la nature du compte, et
    `createPasswordSetupLink` les nomme dans son 409 : `is_local_account` manque à un compte qui
    n'est pas local — un compte de l'annuaire ou d'un fournisseur externe s'authentifie auprès
    du fournisseur d'identité et n'a pas de mot de passe à fixer dans Waterfall —, et
    `is_active_account` à un compte désactivé (WF-ADM-0140, WF-ADM-0060). Deux tiennent à
    l'anonymisation d'un compte, irréversible (WF-ADM-0060) : `is_deactivated_account`, miroir de
    `is_active_account`, manque à l'anonymisation d'un compte actif, que `anonymizeUser` nomme
    dans son 409 — la commande `anonymize` ne se liste que pour un compte désactivé — ;
    `is_not_anonymized` manque à la réactivation et à l'anonymisation d'un compte anonymisé, que
    le compte nomme (`User.available_commands`) et `setUserActivation` et `anonymizeUser` dans
    leur 409, et à la modification de son nom, de son prénom ou de son adresse, que `updateUser`
    nomme dans son 409. Le retrait de l'une de
    ces permissions par `setUserAccessRoles` ou `updateAccessRole` dépend des rôles envoyés, qu'aucune commande ne
    dit d'avance : il est refusé par `LAST_ADMINISTRATOR`, sans condition.
    Trois tiennent aux sauvegardes, et la sauvegarde les nomme (`Backup.available_commands`,
    `BackupCommand`) : `backup_verified` manque au téléchargement et à la restauration d'une
    sauvegarde dont la vérification n'a pas réussi, en attente ou échouée (WF-ADM-0150) ;
    `no_backup_running` manque, pendant qu'une sauvegarde s'exécute — de sa mise en file à la
    production de la sauvegarde, la vérification qui suit n'empêchant rien (`backup_pending`) —,
    à la restauration et au déclenchement d'une seconde sauvegarde ; `no_restore_running`
    manque, pendant qu'une restauration s'exécute — de sa mise en file à la déconnexion des
    utilisateurs —, à la restauration, au déclenchement d'une sauvegarde et au marquage
    (WF-ADM-0160). `startBackup`, `retainBackup`, `downloadBackup` et `startRestore` les nomment
    dans leur 409.
    `restored_subproject_exists` manque à toute annulation et à tout rétablissement
    (`undoLastChange`, `redoLastUndo`) qui rendrait un sous-projet supprimé depuis : à la provision
    d'un risque — sa création, sa modification ou sa suppression défaites ou rétablies — ou à une
    ligne de devis — toute écriture de la grille, la suppression d'une ligne ou d'une tâche et de
    ses lignes comprise — ; refusés, ils ne défont ni ne rétablissent rien (WF-IHM-0110 ; décision
    de l'auteur, #732).
    `project_before_in_progress` manque à la modification de la probabilité de gain
    (`ProjectCommand.update_win_probability`) d'un projet qui a atteint En cours, ou un état
    terminal : elle n'est modifiable qu'aux états Créé et Chiffrage (WF-PRJ-0090) ; envoyée malgré
    la commande, `updateProject` la nomme dans son 409. Elle manque aussi à la saisie du devis de
    la structure principale (`StructureCommand.edit_estimate`) dès En cours, la grille de devis
    restant lisible, et `project_in_progress` à celle de son reste à engager
    (`StructureCommand.edit_remaining`) hors de l'état En cours, avant lui comme dans un état
    terminal : en chiffrage le devis, en réalisation le reste à engager (WF-DEV-0050, WF-RAE-0040 ;
    C-358). `project_before_in_progress` manque de même à l'import d'un devis sur la structure
    principale, que `openImport` et `applyImport` nomment dans leur 409 (WF-INTF-0100 ; C-358).
    Trois tiennent à un sous-projet, et le sous-projet les nomme
    (`Subproject.available_commands`) : `subproject_not_cited` manque à la suppression
    d'un sous-projet qu'une révision marquée cite — il ne se supprime pas, les
    sous-projets déterminant la courbe de la valeur acquise (§4.4.1, WF-DAT-0080, WF-PRJ-0050) — ;
    `subproject_without_actual_costs` à la suppression d'un sous-projet auquel des coûts réels sont
    imputés (WF-PRJ-0050) ; `subproject_without_estimate_lines` à la suppression d'un sous-projet
    que portent des lignes de devis de la révision en cours (WF-DAT-0080, WF-PRJ-0050 ;
    EP-14/L42q, C-273). `deleteSubproject` nomme dans son 409 la première qui manque, dans l'ordre
    où la commande les liste (`SubprojectCommand`).
    `main_structure_without_tasks` manque à la génération du squelette de planning
    (`RevisionCommand.generate_skeleton`) dès que la structure principale de la révision comporte
    une tâche : « Elle n'est plus proposée dès que la structure principale comporte une tâche »
    (Vérif de WF-PRJ-0030) ; `generatePlanningSkeleton` nomme dans son 409 la première qui
    manque, dans l'ordre où la commande les liste (EP-14/L42k). Sur un projet sans révision en
    cours (`ProjectCommand.generate_skeleton`), elle se juge sur la révision que son ouverture
    créerait : elle manque quand la structure principale de la dernière révision marquée, que
    cette ouverture copierait, comporte une tâche (WF-REV-0010 ; EP-15/US-0490/L4).
    `task_not_completed` manque à la réestimation au reste à engager d'une ligne d'une tâche
    terminée, dont les lignes ne se modifient pas (`EstimateLine.remaining_entry`, WF-RAE-0040),
    et à la création d'une ligne sous une tâche terminée, ou à son déplacement vers elle ou depuis
    elle, qui se rouvre d'abord depuis le Kanban : `createNode` et `moveNodes` la nomment dans
    leur 409 (WF-DEV-0050, WF-RAE-0030 ; #1184, #1214).
    Quatre tiennent à la nature et aux lignes d'une tâche, et la carte du Kanban les nomme
    (`KanbanTask.available_commands`, WF-RAE-0030, WF-PLA-0050) : `task_is_milestone` manque à
    la terminaison d'une tâche non démarrée qui n'est pas un jalon ; `task_without_lines` à la
    terminaison depuis le Kanban d'une tâche qui porte une ligne hors provision, que la saisie
    d'un reste à engager nul sur toutes ses lignes termine (WF-RAE-0040) ; `task_not_milestone`
    au démarrage d'un jalon, qui ne démarre jamais, et à la réouverture d'un jalon terminé vers
    l'état démarré ; `completed_milestone` au retour à l'état non démarré d'une tâche qui n'est
    pas un jalon terminé — « Aucune commande ne fait passer une tâche démarrée à l'état non
    démarré » (WF-RAE-0030). `setTaskProgress` nomme dans son 409 la première qui manque.
    `unmerged_amendment_exists` manque à la fusion (`merge_structure`) tant qu'aucun
    différentiel de la révision n'est à fusionner, et la révision la nomme
    (`Revision.available_commands`) ; l'ouverture d'un différentiel (`create_structure`) n'en
    dépend pas, plusieurs coexistant (WF-REV-0100 ; décision de l'auteur, #1211). Deux tiennent
    à la désignation de la référence (`designate_reference`), après `revision_marked`, qui
    manque à une révision en cours :
    `revision_has_tasks_and_lines` manque à une révision dont la structure principale ne porte
    aucune tâche ou aucune ligne de devis — « La désignation comme référence d'une révision qui
    ne porte aucune tâche ou aucune ligne de devis est refusée, en nommant la condition
    manquante » (WF-CYC-0030) — ; `reference_correctable` quand la désignation ne se corrige
    plus, le projet ayant reçu un coût réel ou une révision ayant été marquée depuis la
    dernière désignation (WF-REV-0040). `designateReferenceRevision` refuse dans son 409 par la
    première qui manque, dans cet ordre — `reference_correctable` par son code propre,
    `REFERENCE_NOT_CORRECTABLE` (EP-15/US-0490).
    `actual_cost_mapping_complete` manque à l'import des coûts réels
    (`ProjectCommand.import_actual_costs`) tant que l'une des quatre colonnes exigées de la
    correspondance de l'extraction n'a aucun intitulé — ainsi sur une installation neuve, dont
    la correspondance est vide (WF-REF-0190) ; la commande la nomme après les conditions de
    l'état du projet et des traitements de fond, et `openImport` dans son 409, avec
    `params.columns`, les colonnes exigées sans intitulé (EP-16/US-0620).
  enum:
    - is_contributor
    - is_project_manager
    - project_not_terminal
    - project_in_progress
    - project_in_pricing
    - project_code_set
    - reference_revision_designated
    - at_least_one_task
    - at_least_one_estimate_line
    - no_current_revision
    - revision_draft
    - revision_marked
    - reference_correctable
    - revision_has_tasks_and_lines
    - unmerged_amendment_exists
    - task_not_completed
    - task_is_milestone
    - task_not_milestone
    - task_without_lines
    - completed_milestone
    - hourly_rates_set
    - no_background_task_running
    - may_create_revision
    - restored_subproject_exists
    - risk_not_cited
    - risk_not_occurred
    - risk_identified
    - active_provision_category
    - org_node_parent_active
    - org_node_active
    - calendar_not_default
    - calendar_active
    - cost_type_active
    - cost_type_unused
    - cost_type_unrated
    - cost_type_without_role
    - cost_category_unused
    - cost_category_unrated
    - cost_category_without_role
    - last_administrator
    - backup_verified
    - no_backup_running
    - no_restore_running
    - project_before_in_progress
    - subproject_not_cited
    - subproject_without_actual_costs
    - subproject_without_estimate_lines
    - main_structure_without_tasks
    - import_file_accepted
    - is_local_account
    - is_active_account
    - is_deactivated_account
    - is_not_anonymized
    - actual_cost_mapping_complete

ProjectCommand:
  type: string
  enum:
    - update
    - update_win_probability
    - update_work_breakdown
    - manage_contributors
    - manage_timelines
    - create_revision
    - complete
    - lose
    - abandon
    - edit_risks
    - declare_risk
    - declare_risk_occurrence
    - import_actual_costs
    - exclude_cost_lines
    - generate_skeleton
    - import_planning
    - import_estimate
    - import_remaining
  description: >-
    Commandes portées par le projet : modifier ses paramètres — `update` couvre le paramétrage
    du projet, réservé à ses chefs de projet (WF-PRJ-0060) : ses attributs (WF-PRJ-0080), son
    lotissement (WF-PRJ-0020) et ses sous-projets (WF-PRJ-0050), que chaque sous-projet détaille
    (`Subproject.available_commands`) —, et parmi eux la probabilité de gain, dont
    `update_win_probability`, toujours listée avec `update`, dit d'avance qu'elle est figée à
    partir de En cours, `project_before_in_progress` manquante (WF-PRJ-0090), et le lotissement,
    dont `update_work_breakdown`, toujours listée avec `update`, dit les conditions : celles
    d'`update` d'abord — `project_not_terminal` sur un projet terminal —, puis
    `no_background_task_running` pendant un traitement de fond qui écrit dans la révision en
    cours ou la fige — sa saisie retire le rattachement des tâches de la révision en cours
    (`setWorkBreakdown`, WF-PLA-0170 ; EP-14/L42s) ; ses contributeurs ;
    ses chronologies — en créer une, en supprimer une (`createTimeline`, `deleteTimeline`) :
    `manage_timelines`, gardée par `planning.write`, la permission du planning dont elles sont
    une vue (FBS-4.3.1, WF-PLA-0140), sans être réservée aux chefs de projet, et indisponible sur
    un projet terminal, `project_not_terminal` manquante (WF-CYC-0100) — ;
    ouvrir une révision, les trois sorties du cycle de vie (WF-CYC-0060) ; déclarer un risque
    survenu (WF-RIS-0060) — gardé par `risk_occurrence` seule : la survenance emporte la
    fusion qu'elle déclenche et n'exige pas la permission de fusionner, `structure_merge`
    (WF-ADM-0100) ; les conditions du projet s'y nomment (`project_not_terminal`,
    `reference_revision_designated`, `no_background_task_running`), celles du risque sur le
    risque (`RiskCommand.declare_occurrence`) ; importer les
    coûts réels — `import_actual_costs` nomme `actual_cost_mapping_complete` tant que la
    correspondance de l'extraction de l'installation est incomplète, après les conditions de
    l'état du projet (WF-REF-0190) —, exclure une ligne du périmètre suivi (WF-CRE-0030) ;
    importer un
    planning MS Project, un devis, un reste à engager — une commande par nature, chacune
    gardée par sa permission —, que l'import applique à la révision en cours et crée au
    besoin (WF-INTF-0090) : portés par le projet, ils se disent aussi quand il n'a pas de
    révision en cours, et nomment alors `may_create_revision` à qui ne peut pas la créer.
    `import_estimate` reste disponible sur un projet En cours, l'import du devis restant ouvert
    sur une structure différentielle et sur le devis propre d'un risque ; sur la structure
    principale, il est refusé (`openImport`), ce que sa commande `edit_estimate` dit d'avance
    (`StructureCommand`, WF-INTF-0100 ; C-358).
    La saisie des risques est une commande de la révision (`RevisionCommand.edit_risks`,
    WF-RIS-0020), et chaque risque porte les siennes (`Risk.available_commands`) ; le projet
    porte `edit_risks` tant qu'il n'a pas de révision en cours, qu'il ait ou non des révisions
    marquées, comme les imports : la saisie d'un risque crée la révision en cours (WF-RIS-0020),
    et nomme `may_create_revision` à qui n'a pas la permission de la créer. Dès qu'une révision
    est en cours, la commande n'est plus listée sur le projet, mais sur elle. `declare_risk` la
    suit, comme sur la révision (`RevisionCommand.declare_risk`), et nomme ses conditions dans le
    même ordre : celles de l'état d'abord, `project_not_terminal` puis
    `no_background_task_running`, puis `at_least_one_task` et `active_provision_category`, puis
    `may_create_revision`. La révision que la déclaration créerait copie la dernière révision
    marquée, et n'a aucune tâche si le projet n'a aucune révision marquée, `at_least_one_task`
    manquant alors (WF-REV-0010, WF-RIS-0010 ; EP-14/L42s).
    `generate_skeleton` dit d'avance, tant que le projet n'a pas de révision en cours, si le
    squelette de planning s'engendrerait sur la révision que l'on ouvrirait (WF-PRJ-0030,
    WF-REV-0010) : c'est ce que lit l'offre de démarrer le planning d'un projet tout juste créé
    (EP-15/US-0490/L4). Elle est gardée par la permission du planning, `planning.write`, comme
    `RevisionCommand.generate_skeleton`, et listée juste avant les imports ; dès qu'une révision
    est en cours, elle n'est plus listée sur le projet, mais sur elle. La génération n'ouvre pas
    la révision : l'écran l'ouvre d'abord (`createRevision`), puis engendre le squelette sur la
    révision que la création rend (`generatePlanningSkeleton`), qui liste à son tour
    `generate_skeleton`. Ses conditions, dans l'ordre de `declare_risk` : celles de l'état
    d'abord, `project_not_terminal`, sur lequel aucune révision ne s'ouvre (WF-CYC-0100), puis
    `no_background_task_running` pendant l'application d'un import ou le traitement d'une
    survenance, qui créent la révision en cours ; puis `main_structure_without_tasks`, jugée sur
    la révision que l'ouverture créerait — une copie de la dernière révision marquée, sans tâche
    si le projet n'en a aucune — ; puis `may_create_revision` à qui n'a pas la permission de
    l'ouvrir (`revisions.write`). Sur la révision, la condition propre vient d'abord
    (`RevisionCommand.generate_skeleton`) : la structure jugée y existe, alors qu'ici elle
    n'existe pas encore, et que le traitement de fond qui court crée une autre révision.

ProjectCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/ProjectCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Vide lorsque la commande est disponible.
      items: { $ref: '#/CommandCondition' }

ProjectSummary:
  type: object
  required: [project_id, label, state]
  properties:
    project_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string }
    code:
      anyOf: [{ type: string }, { type: 'null' }]
    state: { $ref: '#/ProjectState' }

ProjectClient:
  type: string
  minLength: 1
  pattern: '\S'
  maxLength: 300
  description: >-
    Le nom du client d'un projet, que porte la présentation d'un devis exporté (WF-PRJ-0080) : de
    1 à 300 caractères comme le libellé, jamais blanc. Une écriture qui ne le respecte pas est
    refusée par 422 `VALIDATION_FAILED`, `fields` désignant `/client` : vide, par
    `VALUE_REQUIRED` ; trop long, par `VALUE_TOO_LONG` ; fait seulement de blancs, comme tout
    libellé, par `VALIDATION_FAILED` (EP-16/US-0610).

ProjectCreate:
  type: object
  required: [label]
  properties:
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    client:
      anyOf: [{ $ref: '#/ProjectClient' }, { type: 'null' }]
      description: >-
        Le nom du client (WF-PRJ-0080), facultatif : nul, ou absent, le projet n'en a pas.
    code:
      anyOf: [{ type: string, maxLength: 50 }, { type: 'null' }]

ProjectUpdate:
  type: object
  required: [lock_version]
  properties:
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    client:
      anyOf: [{ $ref: '#/ProjectClient' }, { type: 'null' }]
      description: >-
        Le nom du client (WF-PRJ-0080), saisissable à tout moment tant que le projet n'est pas
        terminal : nul, il s'efface ; absent, il ne change pas.
    code:
      anyOf: [{ type: string, maxLength: 50 }, { type: 'null' }]
    inflation_rate:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      description: De `0` à `1` inclus, un rapport (WF-PRJ-0040).
    win_probability:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      description: >-
        De `0` à `1` inclus, un rapport ; refusée dès En cours, 409 `STATE_FORBIDS_OPERATION`,
        `params.missing_condition` à `project_before_in_progress` (WF-PRJ-0090). Absente, la valeur
        ne change pas.
    order_received_on:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
    lock_version: { $ref: ../common.yaml#/LockVersion }

StateTransition:
  type: object
  required: [from_state, to_state, occurred_at, actor, reason]
  description: >-
    Transition datée du jour où elle s'est produite, avec son auteur et, pour une sortie
    manuelle, le motif donné à sa confirmation ; non modifiable (WF-CYC-0130).
  properties:
    from_state:
      anyOf: [{ $ref: '#/ProjectState' }, { type: 'null' }]
    to_state: { $ref: '#/ProjectState' }
    occurred_at: { $ref: ../common.yaml#/Timestamp }
    actor: { $ref: ../common.yaml#/ActorRef }
    reason:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Motif donné à la sortie manuelle qui a produit la transition (WF-CYC-0090) ; nul
        pour une transition automatique ou une sortie confirmée sans motif.

LifecycleTrigger:
  type: string
  enum: [first_revision_created, reference_designated_and_code_set]
  description: >-
    Les deux faits déclencheurs des transitions automatiques du cycle de vie, et aucun autre
    (WF-CYC-0020) : la création de la première révision mène de Créé à Chiffrage ; la
    désignation de la révision de référence et la saisie du code projet, dans n'importe quel
    ordre, mènent de Chiffrage à En cours (WF-CYC-0030). Rendus par le front dans la langue du
    lecteur (WF-ARC-0110).

NextState:
  type: object
  required: [current_state, next_state, trigger, missing_conditions]
  description: >-
    Prochain état, son fait déclencheur et les conditions restantes, consultables
    à tout moment avant En cours (WF-CYC-0050). D'un projet en cours ou dans un état terminal,
    qu'aucun fait ne mène plus loin : le prochain état et le déclencheur nuls, aucune condition
    — les sorties du cycle de vie sont des commandes du projet (WF-CYC-0060), pas un prochain
    état.
  properties:
    current_state: { $ref: '#/ProjectState' }
    next_state:
      anyOf: [{ $ref: '#/ProjectState' }, { type: 'null' }]
    trigger:
      anyOf: [{ $ref: '#/LifecycleTrigger' }, { type: 'null' }]
      description: >-
        Le fait qui mènera au prochain état, nul avec lui (WF-CYC-0050).
    missing_conditions:
      type: array
      description: Codes des conditions restantes, une par une (WF-CYC-0030, WF-CYC-0050).
      items: { $ref: '#/CommandCondition' }

ProjectExit:
  type: object
  required: [to_state, confirmed]
  description: >-
    Sortie manuelle : Terminé depuis En cours, Perdu depuis Chiffrage, Abandonné
    depuis tout état non terminal (WF-CYC-0060). Irréversible (WF-CYC-0080), et
    appliquée après confirmation explicite (WF-CYC-0090).
  properties:
    to_state:
      type: string
      enum: [completed, lost, abandoned]
    confirmed:
      type: boolean
      const: true
      description: 'Faux ou absent, la sortie est refusée : la confirmation est la garde de WF-CYC-0090.'
    reason:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Motif facultatif, que la transition conserve (WF-CYC-0090, WF-CYC-0130).

WorkBreakdown:
  type: object
  required: [work_packages, lock_version]
  description: >-
    Lotissement : lots, postes, livrables. Sa saisie est facultative ; « en son absence, le
    lotissement vaut un lot et un poste qui portent le libellé du projet, sans livrable »
    (WF-PRJ-0020). Le lotissement entier, que `setWorkBreakdown` écrit, et qu'il rend lu
    (`WorkBreakdownReading`). Un élément envoyé sans identifiant est nouveau : le serveur
    engendre son identifiant, que la réponse porte (WF-DAT-0060) ; un élément envoyé avec le sien
    est celui que le lotissement lu porte, renommé ou rangé ailleurs, et un identifiant que le
    lotissement lu n'a pas — inconnu, d'un élément d'une autre nature, ou d'un élément marqué
    supprimé (WF-DAT-0080) — est refusé (`UNKNOWN_WORK_BREAKDOWN_ITEM`) : le client ne forge
    aucun identifiant (EP-14/L42k). Un élément ne s'écrit qu'une fois : un identifiant envoyé
    deux fois est refusé à chaque occurrence après la première (`DUPLICATE_WORK_BREAKDOWN_ITEM`,
    sur `/…/<nature>_id`).
  properties:
    work_packages:
      type: array
      items: { $ref: '#/WorkPackage' }
    lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        Le compteur du lotissement lu entier (`WorkBreakdownReading.lock_version`) ; nul — celui
        d'une lecture filtrée —, la saisie est refusée par 422, périmé par 412 (WF-IHM-0110).

WorkBreakdownReading:
  type: object
  required: [work_packages, lock_version]
  description: >-
    Le lotissement tel que `getWorkBreakdown` le lit : entier, ou ce que ses filtres en
    retiennent (WF-PRJ-0020, WF-IHM-0130), et ce que `setWorkBreakdown` rend, entier, chaque
    élément retenu. Chaque élément rendu porte son identifiant et dit s'il est retenu
    (`is_match`) ou rendu pour le seul contexte, ce que l'écriture ne porte pas ; chaque lot et
    chaque poste disent la tâche qui les porte (`attached_task`).
  properties:
    work_packages:
      type: array
      items: { $ref: '#/WorkPackageReading' }
    lock_version:
      anyOf: [{ $ref: ../common.yaml#/LockVersion }, { type: 'null' }]
      description: >-
        Le compteur du lotissement, que `setWorkBreakdown` exige, rendu par la seule lecture
        entière ; nul pour une lecture filtrée (`search` ou `kinds`), qui omet des éléments : la
        renvoyer telle quelle à `setWorkBreakdown` supprimerait ce qu'elle omet, et le compteur
        nul l'en empêche (422).

WorkPackage:
  type: object
  required: [label, order_items]
  description: >-
    Un lot que `setWorkBreakdown` écrit, au niveau 1 du lotissement : avec son identifiant s'il
    existe, sans s'il est nouveau (`WorkBreakdown`).
  properties:
    work_package_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    order_items:
      type: array
      items: { $ref: '#/OrderItem' }

OrderItem:
  type: object
  required: [label, deliverables]
  description: Un poste que `setWorkBreakdown` écrit dans son lot, son identifiant comme celui d'un lot.
  properties:
    order_item_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    deliverables:
      type: array
      items: { $ref: '#/Deliverable' }

Deliverable:
  type: object
  required: [label]
  description: Un livrable que `setWorkBreakdown` écrit dans son poste, son identifiant comme celui d'un lot.
  properties:
    deliverable_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }

WorkPackageReading:
  type: object
  required: [work_package_id, label, is_match, attached_task, order_items]
  description: >-
    Un lot tel que `getWorkBreakdown` le rend (`WorkPackage`), s'il est retenu, et la tâche qui
    le porte.
  properties:
    work_package_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 300 }
    is_match:
      type: boolean
      description: >-
        Vrai quand les filtres de la lecture retiennent l'élément — il les satisfait tous, et
        toujours sans filtre —, faux quand il n'est rendu que parce qu'il contient un élément
        retenu : « dans une grille arborescente, le filtre laisse visibles les parents des lignes
        retenues » (WF-IHM-0060). « Le filtre s'applique aux totaux qu'elle présente »
        (WF-IHM-0130) : la grille ne compte que les éléments retenus — lue par
        `kinds=order_item`, celle du témoin compte un poste, et aucun lot (#574).
    attached_task:
      anyOf: [{ $ref: '#/AttachedTask' }, { type: 'null' }]
      description: >-
        La tâche de la révision en cours qui porte le lot (WF-PLA-0170), par son nœud et son
        libellé ; nulle quand aucune ne le porte, ou quand le projet n'a pas de révision en
        cours. Un lot ou un poste « n'y est porté que par une tâche à la fois » : c'est elle que
        la suppression de l'élément laisse sans rattachement, et que l'écran nomme avant de la
        confirmer (#802).
    order_items:
      type: array
      items: { $ref: '#/OrderItemReading' }

OrderItemReading:
  type: object
  required: [order_item_id, label, is_match, attached_task, deliverables]
  description: >-
    Un poste tel que `getWorkBreakdown` le rend (`OrderItem`), s'il est retenu, et la tâche qui
    le porte, comme un lot (`WorkPackageReading.is_match`, `attached_task`).
  properties:
    order_item_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 300 }
    is_match: { type: boolean }
    attached_task:
      anyOf: [{ $ref: '#/AttachedTask' }, { type: 'null' }]
    deliverables:
      type: array
      items: { $ref: '#/DeliverableReading' }

DeliverableReading:
  type: object
  required: [deliverable_id, label, is_match]
  description: >-
    Un livrable tel que `getWorkBreakdown` le rend (`Deliverable`). Il ne contient rien : rendu,
    il est toujours retenu, et sa marque, toujours vraie, ne sert qu'à lire chaque ligne de la
    grille de même. Aucune tâche ne porte un livrable (WF-PLA-0170).
  properties:
    deliverable_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 300 }
    is_match: { type: boolean }

AttachedTask:
  type: object
  required: [node_id, label]
  description: >-
    La tâche de la structure principale de la révision en cours qui porte un lot ou un poste du
    lotissement (WF-PLA-0170), par son nœud et son libellé, comme les refus du rattachement
    nomment une tâche (`work_package_task`).
  properties:
    node_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 300 }

WorkBreakdownKind:
  type: string
  enum: [work_package, order_item, deliverable]
  description: >-
    Nature d'un élément du lotissement, de la plus large à la plus fine : lot, poste,
    livrable (WF-PRJ-0020, §4.4.1). La colonne de la nature de la grille du lotissement, que
    `getWorkBreakdown` filtre (`kinds`, WF-IHM-0130).

Subproject:
  type: object
  required: [subproject_id, code, label, has_actual_costs, available_commands, audit, lock_version]
  description: >-
    Sous-projet, identifié par le code sous lequel l'ERP le connaît, unique dans
    le projet. Non supprimable dès qu'un coût réel lui est imputé (WF-PRJ-0050), ni dès qu'une
    révision marquée le cite (§4.4.1, décision de l'auteur du 2026-10-10, #634), ni tant que des
    lignes de devis de la révision en cours le portent (WF-DAT-0080, WF-PRJ-0050) : ses commandes
    le disent d'avance.
  properties:
    subproject_id: { $ref: ../common.yaml#/Uuid }
    code: { $ref: '#/DeclaredSubprojectCode' }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    has_actual_costs:
      type: boolean
      description: >-
        Vrai dès qu'une ligne de coût réel lui est imputée, exclue du périmètre suivi ou non
        (WF-CRE-0020) : la création d'un sous-projet dont des lignes portaient déjà le code le
        rend vrai aussitôt.
    available_commands:
      type: array
      maxItems: 2
      description: >-
        Commandes du sous-projet que l'appelant a la permission d'exercer, chacune disponible ou
        non, avec les conditions qui lui manquent (WF-IHM-0090), dans l'ordre de
        `SubprojectCommand`. Elles suivent la commande `update` du projet : la liste est vide pour
        qui ne la porte pas, et toutes deux nomment `project_not_terminal` sur un projet clos
        (WF-CYC-0100), après les conditions propres au sous-projet, comme le projet liste les
        siennes (`project_completed`). Un appel envoyé malgré la liste est refusé par son code
        d'erreur.
      items: { $ref: '#/SubprojectCommandAvailability' }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

DeclaredSubprojectCode:
  type: string
  minLength: 1
  maxLength: 31
  pattern: '^(?![Ss][Yy][Nn][Tt][Hh][Èè][Ss][Ee]$|[Hh][Oo][Rr][Ss] [Ss][Oo][Uu][Ss]-[Pp][Rr][Oo][Jj][Ee][Tt]$)[^:\\/?*\[\]]*[^:\\/?*\[\]\s][^:\\/?*\[\]]*$'
  description: >-
    Le code d'un sous-projet déclaré, sous lequel l'ERP le connaît, qui nomme son onglet dans le
    fichier de reste à engager (ANNEXE B, WF-PRJ-0050) : de 1 à 31 caractères, jamais blanc, sans
    aucun des caractères `:`, `\`, `/`, `?`, `*`, `[` ni `]`, et ni « Synthèse » ni « Hors
    sous-projet », les deux onglets que Waterfall nomme, comparés sans égard à la casse — ce que
    dit le motif (D-7, EP-16/US-0610). Une écriture qui ne le respecte pas est refusée par 422
    `VALIDATION_FAILED`, `fields` désignant `/code` : trop long, par `VALUE_TOO_LONG`,
    `fields[].params.max_length` à `31` ; portant un caractère interdit, par
    `SUBPROJECT_CODE_INVALID`, `fields[].params.forbidden_characters` les caractères interdits
    qu'il porte, chacun une fois, dans l'ordre où le code les porte ; valant un nom réservé, par
    `SUBPROJECT_CODE_INVALID`, `fields[].params.reserved_name` ce nom tel que Waterfall l'écrit.
    Le code lu dans l'élément d'OTP d'une ligne de coût réel (`ActualCostLine.subproject_code`)
    n'est pas celui-ci et garde sa borne de 50 : une ligne au code inconnu se conserve telle
    quelle (WF-CRE-0020).

SubprojectCommand:
  type: string
  enum: [update, delete]
  description: >-
    Commandes portées par un sous-projet (WF-IHM-0090) : le modifier, par `updateSubproject`, et
    le supprimer, par `deleteSubproject`. La suppression est indisponible dès qu'une révision
    marquée le cite, `subproject_not_cited` manquante (§4.4.1, décision de l'auteur du 2026-10-10,
    #634), dès que des coûts réels lui sont imputés, `subproject_without_actual_costs` manquante
    (WF-PRJ-0050), tant que des lignes de devis de la révision en cours le portent, dans quelque
    structure que ce soit — une ligne de provision comprise, dont le risque l'a désigné
    (WF-RIS-0010) —,
    `subproject_without_estimate_lines` manquante (WF-DAT-0080, WF-PRJ-0050 ; EP-14/L42q, C-273),
    et sur un projet clos, `project_not_terminal` manquante (WF-CYC-0100). Quand plusieurs
    manquent, la commande les liste dans cet ordre : `subproject_not_cited`, puis
    `subproject_without_actual_costs`, puis `subproject_without_estimate_lines` — de la condition
    qui ne se lève jamais, une révision marquée étant immuable (WF-DAT-0020), à celle que lève le
    passage de ces lignes hors sous-projet ou à un autre —, puis `project_not_terminal` — les
    conditions propres au sous-projet avant celle du projet, comme le projet liste les siennes. Un
    sous-projet se crée par la commande `update` du projet.

SubprojectCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/SubprojectCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Vide lorsque la commande est disponible.
      items: { $ref: '#/CommandCondition' }

SubprojectWrite:
  type: object
  required: [code, label]
  properties:
    code: { $ref: '#/DeclaredSubprojectCode' }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }

SubprojectUpdate:
  description: >-
    Modification d'un sous-projet : porte le compteur lu,
    qu'une création n'a pas.
  allOf:
    - $ref: '#/SubprojectWrite'
    - type: object
      required: [lock_version]
      properties:
        lock_version: { $ref: ../common.yaml#/LockVersion }

ContributorKind:
  type: string
  enum: [project_manager, contributor]
  description: >-
    Qualité d'un contributeur : chef de projet ou contributeur. Les actions structurantes
    du catalogue et le paramétrage du projet sont réservés à ses chefs de projet, la
    saisie à tous ses contributeurs (WF-PRJ-0060, WF-ADM-0110).

Contributor:
  type: object
  required: [user_id, display_name, kind, is_active]
  description: >-
    Contributeur d'un projet, avec sa qualité. La consultation et la saisie sur un projet
    sont réservées à ses contributeurs, chacune sous sa permission ; la permission
    « consulter tous les projets » ouvre à la consultation les projets dont l'utilisateur
    n'est pas contributeur (WF-PRJ-0060).
  properties:
    user_id: { $ref: ../common.yaml#/Uuid }
    display_name: { type: string }
    kind: { $ref: '#/ContributorKind' }
    is_active:
      type: boolean
      description: >-
        Faux pour un compte désactivé depuis son inscription, que la liste garde et signale
        (WF-ADM-0060). Toujours rendu : l'écran ne devine rien d'une valeur absente.

ContributorList:
  type: object
  required: [items, lock_version]
  description: >-
    La liste des contributeurs d'un projet et son compteur d'écriture, propre à la liste :
    la modifier ne touche pas au projet, et modifier le projet — son libellé, son taux
    d'inflation — ne la périme pas (WF-PRJ-0060, WF-IHM-0110).
  properties:
    items:
      type: array
      items: { $ref: '#/Contributor' }
    lock_version:
      anyOf: [{ $ref: ../common.yaml#/LockVersion }, { type: 'null' }]
      description: >-
        Le compteur de la liste, que `setContributors` exige tel qu'il a été lu, rendu par une
        lecture de la liste entière, triée ou non ; nul pour une lecture filtrée (`search`,
        `kinds`, `is_active`), qui omet des contributeurs : écrite telle quelle, la liste les
        retirerait, et le compteur nul l'empêche (422).

ContributorWrite:
  type: object
  required: [user_id, kind]
  properties:
    user_id: { $ref: ../common.yaml#/Uuid }
    kind: { $ref: '#/ContributorKind' }

ContributorsWrite:
  type: object
  required: [contributors, lock_version]
  description: >-
    La liste entière, chacun avec sa qualité ; un projet garde au moins un chef de projet
    (WF-PRJ-0060).
  properties:
    contributors:
      type: array
      minItems: 1
      items: { $ref: '#/ContributorWrite' }
    lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        Le compteur de la liste lue entière (`ContributorList.lock_version`) ; nul — celui d'une
        lecture filtrée —, la liste est refusée par 422 ; périmé, par 412 (WF-IHM-0110).

ContributorSuggestion:
  type: object
  required:
    - user_id
    - display_name
    - is_active
    - org_node_id
    - org_node_label
    - resource_role_ids
    - resource_role_labels
  description: >-
    Un compte proposé comme contributeur : rattaché à un nœud d'organisation dont un rôle de
    ressources est employé par une ligne de devis du projet, et que la liste des contributeurs ne
    compte pas encore ; jamais inscrit sans confirmation (WF-PRJ-0070). Nomme son nœud et les
    rôles de ce nœud que le devis emploie, par leur identifiant et leur libellé, pour que l'écran
    dise pourquoi il est proposé sans relire le référentiel (WF-ARC-0020).
  properties:
    user_id: { $ref: ../common.yaml#/Uuid }
    display_name: { type: string }
    is_active:
      type: boolean
      description: >-
        Toujours vrai : un compte désactivé n'est plus proposé (WF-ADM-0060), et l'inscrire
        serait refusé (`USER_INACTIVE`). Rendu, comme `Contributor.is_active`, pour que la
        proposition confirmée prenne place dans la liste telle quelle, sans que l'écran devine
        rien.
    org_node_id: { $ref: ../common.yaml#/Uuid }
    org_node_label: { type: string }
    resource_role_ids:
      type: array
      minItems: 1
      items: { $ref: ../common.yaml#/Uuid }
    resource_role_labels:
      type: array
      minItems: 1
      description: Les libellés des rôles, dans l'ordre de `resource_role_ids`.
      items: { type: string }
