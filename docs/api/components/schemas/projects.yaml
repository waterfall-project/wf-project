# Project, lifecycle, work breakdown, subprojects and contributors (FBS-4.2, FBS-4.9).

ProjectState:
  type: string
  enum: [created, pricing, in_progress, completed, lost, abandoned]
  description: >-
    The six states of the lifecycle, and no other (WF-CYC-0010). The labels are
    rendered by the front in the reader's language (WF-ARC-0110).

Project:
  description: Attributes of a project (WF-PRJ-0080).
  type: object
  required:
    - project_id
    - label
    - description
    - client
    - code
    - state
    - order_received_on
    - reference_revision_id
    - current_revision_id
    - inflation_rate
    - win_probability
    - available_commands
    - audit
    - lock_version
  properties:
    project_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Null when none is entered.
    client:
      anyOf: [{ $ref: '#/ProjectClient' }, { type: 'null' }]
      description: >-
        The name of the project's client (WF-PRJ-0080): optional, null as long as it is not entered,
        required by no transition. `createProject` and `updateProject` write it (EP-16/US-0610).
    code:
      anyOf: [{ $ref: '#/ProjectCode' }, { type: 'null' }]
      description: >-
        Code under which the ERP knows the project, unique in the installation and
        required for the passage to In progress (WF-PRJ-0010); null as long as it is not entered.
    state: { $ref: '#/ProjectState' }
    inflation_rate:
      allOf: [{ $ref: '#/ProjectRatio' }]
      description: >-
        Annual inflation rate, 0 by default, modifiable at any time (WF-PRJ-0040): a ratio, from
        `0` to `1` inclusive — `0.03` for 3% —, outside of which `updateProject` refuses the
        value (`VALUE_OUT_OF_RANGE`), at four decimals, a hundredth of a percent
        (`ProjectRatio`).
    win_probability:
      allOf: [{ $ref: '#/ProjectRatio' }]
      description: >-
        Win probability, 0 by default, with no effect on any calculation of the project
        (WF-PRJ-0090): a ratio, from `0` to `1` inclusive, outside of which `updateProject`
        refuses the value (`VALUE_OUT_OF_RANGE`), at four decimals (`ProjectRatio`). Modifiable
        in the Created and Pricing states, frozen from In progress onwards: the
        `update_win_probability` command states it in advance, and a value sent regardless is
        refused with 409 `STATE_FORBIDS_OPERATION`, `params.missing_condition` at
        `project_before_in_progress`.
    order_received_on:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: Null as long as it is not entered.
    reference_revision_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        Reference revision, designated once at contractualisation (WF-REV-0040). Null as long as no
        reference is designated.
    current_revision_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        Revision being drawn up, if one exists (WF-REV-0010). Null when the project holds none:
        before its first revision, between a marking and the next revision, and in a terminal state
        (WF-CYC-0090).
    available_commands:
      type: array
      description: >-
        Commands of the project that the caller has the permission to exercise, each available
        or not, with the conditions it lacks (WF-IHM-0090). A command absent from the list is
        not presented. Sole exception, decided by the user on 2026-10-05: without a current
        revision, the import of a planning, an estimate or a remaining to commit is listed to
        whoever has the import permission but not the permission to create a revision,
        unavailable, `may_create_revision` missing; the generation of the planning skeleton
        (`generate_skeleton`) is likewise listed to whoever has the planning permission
        (EP-15/US-0490/L4). A command that the caller's permission would give them, but that
        their capacity on the project does not allow, is listed unavailable, naming that
        capacity (WF-IHM-0090): `is_contributor` to whoever opens the project through "view
        every project" without being a contributor of it, and `is_project_manager` in addition
        for a command reserved to project managers; `is_project_manager` alone to a participant
        (`project_participant`). The capacity comes before the state conditions. A single
        command opens to a non-contributor: `manage_contributors`, when no project manager of
        the project has an active account, to whoever holds the permission for the project
        settings and "view every project" (WF-PRJ-0060; `project_rescue`). A terminal project —
        Completed, Lost or Abandoned — lists none: nothing modifies it any more, and none will
        become available again, whereas WF-IHM-0090 presents as unavailable only what a state
        makes "momentarily" impossible (WF-CYC-0080, WF-CYC-0100; `project_completed`,
        US-0702/L3). A call sent regardless of the list is refused with 409
        `STATE_FORBIDS_OPERATION`, `params.missing_condition` at `project_not_terminal`.
      items: { $ref: '#/ProjectCommandAvailability' }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

ProjectListMeta:
  description: >-
    Where the page stands among the projects retained, and the states retained: those the request
    names (`states`), or, when it names none, those of the default, the in-progress projects
    (WF-PTF-0010), in the order of `ProjectState`. The screen thus shows the state filter that the
    server applied, without guessing it (WF-IHM-0130).
  allOf:
    - $ref: ../common.yaml#/PaginationMeta
    - type: object
      required: [states]
      properties:
        states:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/ProjectState' }

CommandCondition:
  type: string
  description: >-
    Condition that a command requires, named by the server when it is missing, and rendered by
    the front in the reader's language (WF-IHM-0090, WF-ARC-0110). `is_contributor` is missing
    for whoever opens the project through "view every project" without being a contributor of
    it, for every command that their permission would give them: it is listed unavailable, the
    capacity named (WF-IHM-0090, WF-PRJ-0060) — except `manage_contributors`, which WF-PRJ-0060
    opens to them when no project manager of the project has an active account
    (`ProjectCommand`). `is_project_manager` is missing for whoever is only a contributor, for a
    structuring action or the project settings, reserved to project managers (WF-PRJ-0060,
    WF-ADM-0110), and, with `is_contributor`, for a non-contributor. A command names its missing
    capacity before its state conditions; sent regardless, the write is refused with 403,
    `NOT_CONTRIBUTOR` or `NOT_PROJECT_MANAGER`, the capacity named (`Forbidden`). Any other
    missing condition is refused with 409 `STATE_FORBIDS_OPERATION`, `params.missing_condition`
    naming it (README, "Conventions"; US-0702/L1). `project_not_terminal` is missing for every
    write of a terminal project — Completed, Lost or Abandoned —, which nothing modifies any
    more (WF-CYC-0100, WF-CYC-0080): only the 409 `STATE_FORBIDS_OPERATION` of a direct call
    names it, in the order the operation states (US-0702/L3). No `missing_conditions` ever
    contains it — neither that of a listed command, nor that of an entry (`EntryAvailability`)
    —, a terminal project and its objects listing no command that would modify them
    (`Project.available_commands`); it remains in this enumeration because
    `params.missing_condition` is one of its values (#1675); `revision_draft` for every command
    that would modify a marked revision, which no longer changes (WF-DAT-0020) — every revision
    of a terminal project is one. `project_in_progress` is missing outside the In progress state
    for what is done only during execution: the exit to Completed (`complete`, WF-CYC-0060), the
    entry of the remaining to commit (below), the import of the actual costs and the exclusion of
    a line from the tracked scope (`import_actual_costs`, `exclude_cost_lines`; WF-CRE-0020,
    WF-CRE-0030), which `setActualCostTrackedScope` names in its 409 after
    `project_not_terminal`. `project_in_pricing` is missing for the
    declaration of loss (`lose`) of a Created project: a project is declared lost only from
    Pricing (WF-CYC-0060). `no_current_revision` is missing for opening a revision
    (`create_revision`) as long as the project holds a current one, the only one to receive
    entries (WF-REV-0010); `createRevision` names it in its 409 (J-01, #1795).
    `reference_revision_designated` is missing, as long as the project has no reference
    revision, for the declaration of an occurred risk (`declare_risk_occurrence`, WF-RIS-0060);
    and `reference_revision_designated` and `project_code_set`, as long as the project has no
    project code, are the conditions of the passage to In progress, which the next state names
    one by one, in the order of the enumeration (`NextState.missing_conditions`,
    `getProjectNextState`, WF-CYC-0030, WF-CYC-0050, WF-PRJ-0010; J-11, US-0702/L1).
    `undo_history_not_empty` is missing for undo when the caller's history on the revision is
    empty, `redo_history_not_empty` for redo when no undo is left to redo: `undoLastChange` and
    `redoLastUndo` name them in their 409, no command stating them in advance —
    `UndoResult.remaining_depth` states what remains to undo (WF-IHM-0110; E-07, US-0702/L1).
    `no_background_task_running` is missing as long as a background task runs on the object —
    marking, merge of a differential, occurrence of a risk, import —, whichever user launched
    it: the commands it would make obsolete name it. During the marking of a revision, these are
    all the commands that modify it: the entry of the planning, the estimate, the remaining to
    commit and the risks, the declaration of a risk (`declare_risk`), the opening of a
    differential, its merge, the rate update, the marking, the designation of the reference and
    the abandonment, and the imports of the project that would write to it — its exports, which
    read it, remain available. During the application of a planning, estimate or remaining to
    commit import (`Import.status` at `applying`), and during the processing of an occurrence
    declaration, which merges into the current revision (WF-RIS-0060), these are the commands
    that would write to the current revision — `edit_planning`, `generate_skeleton`,
    `edit_estimate`, `edit_remaining`, `edit_risks`, `declare_risk`, `create_structure`,
    `merge_structure`, `apply_rate_update`, `mark`, `abandon` —, the declaration of an
    occurrence and the imports of the project; its exports remain available. During any
    background task that writes to the current revision or freezes it — marking, merge,
    occurrence, application of an import —, it is also the entry of the work breakdown
    (`ProjectCommand.update_work_breakdown`), which removes the attachment of the tasks of the
    current revision (WF-PLA-0170); `setWorkBreakdown` names it in its 409 (EP-14/L42s); these
    are also the three exits from the lifecycle (`complete`, `lose`, `abandon`), whose fate
    would mark or abandon the current revision (WF-CYC-0090) — the marking that an exit has
    launched included (`exitProject`, US-0701/L9). A project without a current revision has one
    being born: the application of an import, in a single transaction (WF-INTF-0080), the
    processing of an occurrence and the merge of a differential of the last marked revision
    create the current revision they write (WF-INTF-0090, WF-RIS-0060, WF-REV-0050; #790),
    invisible until they end. Meanwhile, the project names the condition for the commands it
    carries that would create or open this revision — the imports, `edit_risks`, `declare_risk`,
    `generate_skeleton` (EP-15/US-0490/L4) —, and the last marked revision for its merge
    (`RevisionCommand.merge_structure`). The analysis of an import (`analysing`) suspends
    nothing: it modifies nothing (WF-ARC-0100), and the actual costs import does not write to
    the revision (WF-INTF-0090, WF-CRE-0010, WF-IHM-0080, WF-IHM-0090, WF-ARC-0090).
    `may_create_revision` is missing, when the project has no current revision, for whoever
    lacks the permission to create a revision (`revisions.write`), for a command that would
    create it: the imports of a planning, an estimate or a remaining to commit (WF-INTF-0090),
    the entry of the risks (`ProjectCommand.edit_risks`, WF-RIS-0020), the declaration of a risk
    (`ProjectCommand.declare_risk`, EP-14/L42s), the declaration of an occurred risk
    (`RiskCommand.declare_occurrence`, WF-RIS-0060) and the merge of a differential of the last
    marked revision (`RevisionCommand.merge_structure`, WF-REV-0050; #790); and for a command
    that requires opening the revision first: the generation of the planning skeleton
    (`ProjectCommand.generate_skeleton`, WF-PRJ-0030, WF-REV-0010; EP-15/US-0490/L4).
    `restored_subproject_exists` is missing for every undo and every redo (`undoLastChange`,
    `redoLastUndo`) that would bring back a subproject deleted since: for the provision of a
    risk — its creation, its modification or its deletion undone or redone — or for an estimate
    line — any write of the grid, the deletion of a line or of a task and of its lines included
    —; refused, they undo and redo nothing (WF-IHM-0110; decision of the author, #732). Three
    conditions depend on the state of a risk, and the risk names them
    (`Risk.available_commands`): `risk_not_occurred` is missing for the modification, the review
    and the deletion of an occurred risk, from which no transition leaves; `risk_identified` for
    the occurrence declaration and for the change of the category or the subproject of the
    provision of a risk that is not identified (WF-RIS-0010, `update_provision`);
    `risk_not_cited` for the deletion of a risk that a marked revision cites: it can no longer
    be deleted, it is dismissed (WF-RIS-0020); `deleteRisk` names it in its 409. Four depend on
    the state of a reference data object, and the object names them (`ReferenceCommand`,
    `CalendarCommand`): `org_node_parent_active` is missing for the reactivation of a node whose
    parent is deactivated, `org_node_active` for that of a role whose node is deactivated
    (WF-REF-0080); `calendar_not_default` for the deactivation of the default calendar, as long
    as another has not been designated (WF-REF-0120); `calendar_active` for the designation as
    default of a deactivated calendar, the default calendar being active (WF-REF-0120). The
    activation operations and `setDefaultCalendar` name them in their 409. `cost_type_active` is
    missing for the reactivation of a cost category whose cost type is deactivated: "a category
    can be reactivated only if its cost type is active" (WF-REF-0010; EP-14/L42s, C-291); the
    category names it (`CostCategory.available_commands`), and `setCostCategoryActivation` in
    its 409. Three depend on the categories of a cost type, and the cost type names them
    (`CostType.available_commands`): `cost_type_unused` is missing for the modification of the
    type of a cost type one of whose attached categories is in use, `cost_type_unrated` when one
    carries an hourly rate, `cost_type_without_role` when a resource role, active or
    deactivated, is attached to one (WF-REF-0030); `updateCostType` names in its 409 the first
    one missing, in this order, with the categories at issue for the first two
    (`params.cost_categories`, EP-14/L42s) and the roles at issue for the last one
    (`params.resource_roles`). Three depend on a cost category, and the category names them
    (`CostCategory.available_commands`): `cost_category_unused` is missing for its attachment to
    a cost type of another type when it is in use, `cost_category_unrated` when it carries
    hourly rates (WF-REF-0030, WF-REF-0050, #577), `cost_category_without_role` when a resource
    role, active or deactivated, is attached to it (WF-REF-0040); `updateCostCategory` names in
    its 409 the first one missing, in this order, and for the last one the roles at issue
    (`params.resource_roles`). `active_provision_category` is missing for the declaration of a
    risk, and for the return of a dismissed risk to the identified state, when no active cost
    category is of the risk provision type (WF-RIS-0010; EP-14/L42p, #579) — an active category
    always is so under an active cost type (WF-REF-0010, C-291): the entry of the risks
    (`edit_risks`) changes the provision, reviews and deletes without it, the declaration states
    it in advance (`declare_risk`, EP-14/L42s), and `createRisk` and `reviewRisk` name it in
    their 409; the return of a dismissed risk, through the category of the risk
    (`Risk.provision_cost_category_is_active`); and the creation of a project requires it
    (`ReferenceReadiness.missing`, WF-CYC-0120). It is also missing for every undo and every
    redo that would recreate the provision line of a risk with a category that is no longer
    active and of the risk provision type, whatever the others: sending nothing, they cannot
    designate another one (`undoLastChange`, `redoLastUndo`; #795). `at_least_one_task` is
    missing for the declaration of a risk on a revision whose main structure contains no task:
    "The declaration of a risk on a main structure without a task is refused, naming the missing
    condition" (WF-RIS-0010) — the provision line would have no task in which to be placed;
    `createRisk` names it in its 409, after the state conditions of the entry of the risks,
    `project_not_terminal` — named by the 409 alone, a terminal project listing no command —
    then `no_background_task_running`, and before `active_provision_category`. The
    `declare_risk` command of the revision, or of the project without a current revision, states
    in advance, in this order on a non-terminal state, `no_background_task_running`,
    `at_least_one_task` and `active_provision_category`, then the other conditions of
    `edit_risks` (EP-14/L42s). `at_least_one_task` is also missing for the return of a dismissed
    risk to the identified state on such a structure, which `reviewRisk` names in its 409,
    before `active_provision_category` (WF-RIS-0010; decision of the author, #787); and likewise
    for every undo and every redo that would recreate the provision line of a risk on a main
    structure without a task (`undoLastChange`, `redoLastUndo`; WF-RIS-0010, #795); and for the
    deletion of a task that would leave without a task a main structure that carries a provision
    line, refused, naming the risks (`deleteNode`, `params.risks`, WF-RIS-0010; H-05,
    US-0702/L2). Three depend on the import, and the import names them
    (`ImportDetail.available_commands`, WF-IHM-0090; I-01, I-02, #1789).
    `import_awaiting_decision` is missing for the application of an import that is no longer
    `analysed` — applied or being applied, abandoned, expired, failed or refused: there is
    nothing left to apply (WF-ARC-0100) —, and `applyImport` names it in its 409 before any
    other. `import_file_accepted` is missing for the application of an import whose report
    rejects the entire file (`ImportReport.refusals`, WF-INTF-0040, WF-PLA-0150): only
    abandoning remains on offer, and `applyImport` names it in its 409 next (EP-14/L42s).
    `import_not_applied` is missing for the abandonment of an import applied or being applied
    (`applying`, `applied`): what it has written is not undone by abandoning (WF-INTF-0080);
    `abandonImport` names it in its 409. One depends on the accounts, and the account names it
    (`User.available_commands`): `last_administrator` is missing for the deactivation of the
    last active account that holds the permissions to modify the accounts and the access roles
    (WF-ADM-0120); `setUserActivation` names it in its 409. Two depend on the nature of the
    account, and `createPasswordSetupLink` and `resendInvitation` name them in their 409:
    `is_local_account` is missing for an account that is not local — an account from the
    directory or from an external provider authenticates with the identity provider and has no
    password to set in Waterfall, and does not list these commands —, and `is_active_account`
    for a deactivated account, which the account names (`create_password_link`,
    `resend_invitation`) (WF-ADM-0140, WF-ADM-0060). Two depend on the anonymisation of an
    account, which is irreversible (WF-ADM-0060): `is_deactivated_account`, mirror of
    `is_active_account`, is missing for the anonymisation of an active account, which
    `anonymizeUser` names in its 409 — the `anonymize` command is listed only for a deactivated
    account —; `is_not_anonymized` is missing for the reactivation and the anonymisation of an
    anonymised account, which the account names (`User.available_commands`) and
    `setUserActivation` and `anonymizeUser` in their 409, and for the modification of its last
    name, its first name or its address, which `updateUser` names in its 409; it is also missing
    for the setup link and the resending of the invitation of an anonymised local account,
    removed from the identity provider, which `createPasswordSetupLink` and `resendInvitation`
    name in their 409, judged between `is_local_account` and `is_active_account` — the
    anonymised account does not list these commands (#1737). The removal of one of these
    permissions through `setUserAccessRoles` or `updateAccessRole` depends on the roles sent,
    which no command states in advance: it is refused with `LAST_ADMINISTRATOR`,
    unconditionally. Three depend on the backups, and the backup names them
    (`Backup.available_commands`, `BackupCommand`): `backup_verified` is missing for the
    download and the restore of a backup whose verification has not succeeded, pending or failed
    (WF-ADM-0150); `no_backup_running` is missing, while a backup is running — from its queuing
    to the production of the backup, the verification that follows preventing nothing
    (`backup_pending`) —, for the restore and the triggering of a second backup;
    `no_restore_running` is missing, while a restore is running — from its queuing to the
    disconnection of the users —, for the restore, the triggering of a backup, the marking and
    the setting of the schedule (WF-ADM-0160, #1742). `startBackup`, `retainBackup`,
    `downloadBackup`, `startRestore` and `setBackupSchedule` name them in their 409.
    `project_before_in_progress` is missing for the modification of the win probability
    (`ProjectCommand.update_win_probability`) of a project that has reached In progress, or a
    terminal state: it is modifiable only in the Created and Pricing states (WF-PRJ-0090); sent
    regardless of the command, `updateProject` names it in its 409. It is also missing for the
    entry of the estimate of the main structure (`StructureCommand.edit_estimate`) from In
    progress onwards, the estimate grid remaining readable, and `project_in_progress` for that
    of its remaining to commit (`StructureCommand.edit_remaining`) outside the In progress
    state, before it as in a terminal state: in pricing the estimate, in execution the remaining
    to commit (WF-DEV-0050, WF-RAE-0040; C-358). `project_before_in_progress` is likewise
    missing for the import of an estimate on the main structure, which `openImport` and
    `applyImport` name in their 409 (WF-INTF-0100; C-358). Three depend on a subproject, and the
    subproject names them (`Subproject.available_commands`): `subproject_not_cited` is missing
    for the deletion of a subproject that a marked revision cites — it cannot be deleted, the
    subprojects determining the earned value curve (§4.4.1, WF-DAT-0080, WF-PRJ-0050) —;
    `subproject_without_actual_costs` for the deletion of a subproject to which actual costs are
    charged (WF-PRJ-0050); `subproject_without_estimate_lines` for the deletion of a subproject
    carried by estimate lines of the current revision (WF-DAT-0080, WF-PRJ-0050; EP-14/L42q,
    C-273). `deleteSubproject` names in its 409 the first one missing, in the order in which the
    command lists them (`SubprojectCommand`). `main_structure_without_tasks` is missing for the
    generation of the planning skeleton (`RevisionCommand.generate_skeleton`) as soon as the
    main structure of the revision contains a task: "It is no longer offered as soon as the main
    structure contains a task" (Vérif of WF-PRJ-0030); `generatePlanningSkeleton` names in its
    409 the first one missing, in the order in which the command lists them (EP-14/L42k). On a
    project without a current revision (`ProjectCommand.generate_skeleton`), it is judged on the
    revision that its opening would create: it is missing when the main structure of the last
    marked revision, which this opening would copy, contains a task (WF-REV-0010;
    EP-15/US-0490/L4). `task_not_completed` is missing for the re-estimation to remaining to
    commit of a line of a completed task, whose lines are not modified
    (`EstimateLine.remaining_entry`, WF-RAE-0040), and, on the main structure, for the creation
    of a line under a completed task, the modification and the deletion of a line of such a
    task, and the move of a line to it or from it, the task being reopened first from the
    Kanban: `createNode`, `updateEstimateLine`, `deleteNode` and `moveNodes` name it in their
    409, and the paste in the refusal of the cell (`PasteRejection`); the line then names no
    field (`Node.editable_fields`). A new line imported under such a task is rejected in the
    report by the same condition, the task named (`ImportRejection`, WF-INTF-0120; I-05, #1793).
    In a differential, it is never missing: the lines of a completed task are entered there like
    the others, so that the amendment rebudgets them (WF-DEV-0050, WF-RAE-0030, WF-RAE-0040,
    WF-REV-0050; #1184, #1214, #1766). `line_not_provision` is missing for the re-estimation of
    a provision line, whose amount is the one its risk computes and which the remaining to
    commit counts for that amount (`EstimateLineFacet.remaining_entry`, WF-RIS-0010,
    WF-RAE-0010); `setLineRemaining` names it in its 409. `task_not_started` is missing for the
    deletion of a started or completed task, or of a summary task one of whose subordinates is:
    "A started or completed task cannot be deleted" (WF-PLA-0070); its remaining to commit is
    set to zero instead. `deleteNode` names it in its 409; no command states it in advance, the
    state of the task showing it (`TaskFacet.progress`; F-04, US-0702/L2). `task_succeeded` is
    missing for the download of the result of a background task that has not succeeded — queued,
    running or failed (`BackgroundTaskRef.status`) —: `getBackgroundTaskResult` names it in its
    409; no command states it in advance, the state of the task showing it (WF-ARC-0090; A-05,
    US-0702/L2). Four depend on the nature and the lines of a task, and the Kanban card names
    them (`KanbanTask.available_commands`, WF-RAE-0030, WF-PLA-0050): `task_is_milestone` is
    missing for the completion of a not-started task that is not a milestone;
    `task_without_lines` for the completion from the Kanban of a task that carries a
    non-provision line, which the entry of a zero remaining to commit on all its lines completes
    (WF-RAE-0040); `task_not_milestone` for starting a milestone, which does not go through the
    started state, and for reopening a completed milestone to the started state;
    `completed_milestone` for the return to the not-started state of a task that is not a
    completed milestone — "No command takes a started task to the not-started state"
    (WF-RAE-0030). `setTaskProgress` names in its 409 the first one missing.
    `unmerged_amendment_exists` is missing for the merge (`merge_structure`) as long as no
    differential of the revision is to be merged, and the revision names it
    (`Revision.available_commands`); the opening of a differential (`create_structure`) does not
    depend on it, several coexisting (WF-REV-0100; decision of the author, #1211).
    `rate_update_available` is missing for the rate update (`apply_rate_update`) of a current
    revision whose proposal presents no category — its reference year is that of the revision of
    which it is the copy, or each category presented has already been accepted (WF-REV-0060) —;
    the revision names it, and `applyRateUpdate` in its 409 (#1351). Two depend on the
    designation of the reference (`designate_reference`), after `revision_marked`, which is
    missing for a current revision: `revision_has_tasks_and_lines` is missing for a revision
    whose main structure carries no task or no estimate line — "The designation as reference of
    a revision that carries no task or no estimate line is refused, naming the missing
    condition" (WF-CYC-0030) —; `reference_correctable` when the designation can no longer be
    corrected, the project having received an actual cost or a revision having been marked since
    the last designation (WF-REV-0040). `designateReferenceRevision` refuses in its 409 with the
    first one missing, in this order, `STATE_FORBIDS_OPERATION` naming it, like any other
    (EP-15/US-0490; J-01, #1795); on a terminal project, it names first `project_not_terminal`
    (#1674). `actual_cost_mapping_complete` is missing for the import of the actual costs
    (`ProjectCommand.import_actual_costs`) as long as one of the four required columns of the
    extraction mapping has no heading — as on a new installation, whose mapping is empty
    (WF-REF-0190); the command names it after the conditions of the project state and of the
    background tasks, and `openImport` in its 409, with `params.columns`, the required columns
    without a heading (EP-16/US-0620).
  enum:
    - is_contributor
    - is_project_manager
    - project_not_terminal
    - project_in_progress
    - project_in_pricing
    - project_code_set
    - reference_revision_designated
    - at_least_one_task
    - no_current_revision
    - revision_draft
    - revision_marked
    - reference_correctable
    - revision_has_tasks_and_lines
    - unmerged_amendment_exists
    - rate_update_available
    - task_not_completed
    - task_not_started
    - line_not_provision
    - task_is_milestone
    - task_not_milestone
    - task_without_lines
    - completed_milestone
    - no_background_task_running
    - may_create_revision
    - restored_subproject_exists
    - risk_not_cited
    - risk_not_occurred
    - risk_identified
    - active_provision_category
    - org_node_parent_active
    - org_node_active
    - calendar_not_default
    - calendar_active
    - cost_type_active
    - cost_type_unused
    - cost_type_unrated
    - cost_type_without_role
    - cost_category_unused
    - cost_category_unrated
    - cost_category_without_role
    - last_administrator
    - backup_verified
    - no_backup_running
    - no_restore_running
    - project_before_in_progress
    - subproject_not_cited
    - subproject_without_actual_costs
    - subproject_without_estimate_lines
    - main_structure_without_tasks
    - import_awaiting_decision
    - import_file_accepted
    - import_not_applied
    - is_local_account
    - is_active_account
    - is_deactivated_account
    - is_not_anonymized
    - actual_cost_mapping_complete
    - undo_history_not_empty
    - redo_history_not_empty
    - task_succeeded

ProjectCommand:
  type: string
  enum:
    - update
    - update_win_probability
    - update_work_breakdown
    - manage_contributors
    - manage_timelines
    - create_revision
    - complete
    - lose
    - abandon
    - edit_risks
    - declare_risk
    - declare_risk_occurrence
    - import_actual_costs
    - exclude_cost_lines
    - generate_skeleton
    - import_planning
    - import_estimate
    - import_remaining
  description: >-
    Commands carried by the project: modify its settings — `update` covers the settings of the
    project, reserved to its project managers (WF-PRJ-0060): its attributes (WF-PRJ-0080), its
    work breakdown (WF-PRJ-0020) and its subprojects (WF-PRJ-0050), which each subproject
    details (`Subproject.available_commands`) —, and among them the win probability, of which
    `update_win_probability`, always listed with `update`, states in advance that it is frozen
    from In progress onwards, `project_before_in_progress` missing (WF-PRJ-0090), and the work
    breakdown, of which `update_work_breakdown`, always listed with `update`, states the
    conditions: those of `update` first — the capacity of the caller —, then
    `no_background_task_running` during a background task that writes to the current revision or
    freezes it — its entry removes the attachment of the tasks of the current revision
    (`setWorkBreakdown`, WF-PLA-0170; EP-14/L42s); its contributors — `manage_contributors`,
    reserved to project managers, and listed in addition, when no project manager of the project
    has an active account, to the non-contributor who holds the permission for the project
    settings (`project_settings.write`) and "view every project" (`all_projects_read`): the only
    command open to them, to register a project manager in it (WF-PRJ-0060), which they read
    with its lock version through `listContributors`; its timelines — create one, delete one
    (`createTimeline`, `deleteTimeline`): `manage_timelines`, guarded by `planning.write`, the
    permission of the planning of which they are a view (FBS-4.3.1, WF-PLA-0140), without being
    reserved to project managers, and absent from a terminal project like every command
    (WF-CYC-0100) —; open a revision; the three exits from the lifecycle (`exitProject`,
    WF-CYC-0060), each listed as long as it can become available and absent as soon as it never
    will — "an exit that will never become available — Declare lost from In progress — does not
    appear" (Vérif of WF-CYC-0060): `complete` listed in every non-terminal state, unavailable
    before In progress, `project_in_progress` missing; `lose` listed in the Created state,
    unavailable, `project_in_pricing` missing, and in Pricing, absent from In progress onwards,
    from where no return leads to Pricing (WF-CYC-0080); `abandon` listed in every non-terminal
    state. A terminal project lists none: no transition leaves it (WF-CYC-0080). Each then names
    `no_background_task_running` during a background task that writes to the current revision or
    freezes it, like `update_work_breakdown`; declare an occurred risk (WF-RIS-0060) — guarded
    by `risk_occurrence` alone: the occurrence carries with it the merge it triggers and does
    not require the permission to merge, `structure_merge` (WF-ADM-0100); the conditions of the
    project are named there (`reference_revision_designated`, `no_background_task_running`),
    those of the risk on the risk (`RiskCommand.declare_occurrence`); import the actual costs —
    `import_actual_costs` names `actual_cost_mapping_complete` as long as the extraction mapping
    of the installation is incomplete, after the conditions of the project state
    (`project_in_progress`; WF-REF-0190)
    —, exclude a line from the tracked scope (WF-CRE-0030); import an MS Project planning, an
    estimate, a remaining to commit — one command per kind, each guarded by its permission —,
    which the import applies to the current revision and creates if needed (WF-INTF-0090):
    carried by the project, they are also stated when it has no current revision, and then name
    `may_create_revision` to whoever cannot create it. `import_estimate` remains available on an
    In progress project, the estimate import remaining open on a differential structure and on a
    risk's own estimate; on the main structure, it is refused (`openImport`), which its
    `edit_estimate` command states in advance (`StructureCommand`, WF-INTF-0100; C-358). The
    entry of the risks is a command of the revision (`RevisionCommand.edit_risks`, WF-RIS-0020),
    and each risk carries its own (`Risk.available_commands`); the project carries `edit_risks`
    as long as it has no current revision, whether or not it has marked revisions, like the
    imports: the entry of a risk creates the current revision (WF-RIS-0020), and names
    `may_create_revision` to whoever lacks the permission to create it. The modification of the
    identity of a risk does not fall under it: data of the project, it creates no revision
    (`updateRisk`, `RiskCommand.update`; H-02, #1782). As soon as a revision is in progress, the
    command is no longer listed on the project, but on it. `declare_risk` follows it, as on the
    revision (`RevisionCommand.declare_risk`), and names its conditions in the same order: those
    of the state first, `project_not_terminal` — which only the 409 names, a terminal project
    listing no command — then `no_background_task_running`, then `at_least_one_task` and
    `active_provision_category`, then `may_create_revision`. The revision that the declaration
    would create copies the last marked revision, and has no task if the project has no marked
    revision, `at_least_one_task` then missing (WF-REV-0010, WF-RIS-0010; EP-14/L42s).
    `generate_skeleton` states in advance, as long as the project has no current revision,
    whether the planning skeleton would be generated on the revision that would be opened
    (WF-PRJ-0030, WF-REV-0010): this is what the offer to start the planning of a just-created
    project reads (EP-15/US-0490/L4). It is guarded by the planning permission,
    `planning.write`, like `RevisionCommand.generate_skeleton`, and listed just before the
    imports; as soon as a revision is in progress, it is no longer listed on the project, but on
    it. The generation does not open the revision: the screen opens it first (`createRevision`),
    then generates the skeleton on the revision that the creation returns
    (`generatePlanningSkeleton`), which in turn lists `generate_skeleton`. Its conditions, in
    the order of `declare_risk`: those of the state first, `project_not_terminal`, on which no
    revision opens and which only the 409 of `createRevision` names (WF-CYC-0100), then
    `no_background_task_running` during the application of an import, the processing of an
    occurrence or the merge of a differential of the last marked revision, which create the
    current revision; then `main_structure_without_tasks`, judged on the revision that the
    opening would create — a copy of the last marked revision, without a task if the project has
    none —; then `may_create_revision` to whoever lacks the permission to open it
    (`revisions.write`). On the revision, the specific condition comes first
    (`RevisionCommand.generate_skeleton`): the structure judged exists there, whereas here it
    does not exist yet, and the running background task creates another revision.

ProjectCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/ProjectCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Empty when the command is available.
      items: { $ref: '#/CommandCondition' }

ProjectSummary:
  type: object
  required: [project_id, label, state]
  properties:
    project_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string }
    code:
      anyOf: [{ $ref: '#/ProjectCode' }, { type: 'null' }]
      description: Null as long as it is not entered (WF-PRJ-0010).
    state: { $ref: '#/ProjectState' }

ProjectCode:
  type: string
  minLength: 1
  maxLength: 50
  pattern: '^[^/]*[^/\s][^/]*$'
  description: >-
    The code under which the ERP knows the project (WF-PRJ-0010): from 1 to 50 characters, never
    blank, without a slash — the only separator of the WBS element that carries it, optionally
    followed by a slash and the subproject code, the project code being allowed to contain
    dots (WF-CRE-0020). Shared by reading and writing (`Project`, `ProjectSummary`,
    `ProjectCreate`, `ProjectUpdate`). A write that does not respect it is refused with 422
    `VALIDATION_FAILED`, `fields` designating `/code`: empty, with `VALUE_REQUIRED`; made only
    of whitespace, like every label, with `VALIDATION_FAILED`; containing a slash, with
    `PROJECT_CODE_INVALID`, `fields[].params.forbidden_characters` at `["/"]`; too long, with
    `VALUE_TOO_LONG`, `fields[].params.max_length` at `50`, the bound that every `VALUE_TOO_LONG`
    carries (J-02, #1796). A code that is both
    blank and containing a slash ("/", "/  ") receives only one refusal,
    `PROJECT_CODE_INVALID`, the slash first (D-07, US-0701/L9).

ProjectClient:
  type: string
  minLength: 1
  pattern: '\S'
  maxLength: 300
  description: >-
    The name of a project's client, which the presentation of an exported estimate carries
    (WF-PRJ-0080): from 1 to 300 characters like the label, never blank. A write that does not
    respect it is refused with 422 `VALIDATION_FAILED`, `fields` designating `/client`: empty,
    with `VALUE_REQUIRED`; too long, with `VALUE_TOO_LONG`; made only of whitespace, like every
    label, with `VALIDATION_FAILED` (EP-16/US-0610).

ProjectRatio:
  allOf:
    - $ref: ../common.yaml#/Percent
  pattern: '^-?\d+(\.\d{1,4}0*)?$'
  description: >-
    A ratio of a project — its inflation rate, its win probability (WF-PRJ-0040, WF-PRJ-0090) —,
    kept at four decimals, a hundredth of a percent, as `Money` is kept at two: a fifth
    significant decimal is refused by `updateProject`, never rounded, with 422
    `VALIDATION_FAILED`, `fields` designating the field, without a parameter (WF-DAT-0100;
    #2305); zeros beyond the fourth decimal change nothing, `0.12340` being `0.1234`. A value
    outside `0` to `1` is refused first by its bound (`VALUE_OUT_OF_RANGE`).

ProjectCreate:
  type: object
  required: [label]
  properties:
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Null or absent, the project has none.
    client:
      anyOf: [{ $ref: '#/ProjectClient' }, { type: 'null' }]
      description: >-
        The name of the client (WF-PRJ-0080), optional: null, or absent, the project has none.
    code:
      anyOf: [{ $ref: '#/ProjectCode' }, { type: 'null' }]
      description: >-
        Null or absent, the project is created without a code, which the passage to In progress
        requires (WF-PRJ-0010, WF-CYC-0030).

ProjectUpdate:
  type: object
  required: [lock_version]
  properties:
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Null clears it; absent, it does not change.
    client:
      anyOf: [{ $ref: '#/ProjectClient' }, { type: 'null' }]
      description: >-
        The name of the client (WF-PRJ-0080), which can be entered at any time as long as the
        project is not terminal: null, it is cleared; absent, it does not change.
    code:
      anyOf: [{ $ref: '#/ProjectCode' }, { type: 'null' }]
    inflation_rate:
      allOf: [{ $ref: '#/ProjectRatio' }]
      description: >-
        From `0` to `1` inclusive, a ratio, at four decimals, a hundredth of a percent
        (`ProjectRatio`, WF-PRJ-0040).
    win_probability:
      allOf: [{ $ref: '#/ProjectRatio' }]
      description: >-
        From `0` to `1` inclusive, a ratio, at four decimals (`ProjectRatio`); refused from In
        progress onwards, 409 `STATE_FORBIDS_OPERATION`, `params.missing_condition` at
        `project_before_in_progress` (WF-PRJ-0090). Absent, the value does not change.
    order_received_on:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: Null clears it; absent, it does not change.
    lock_version: { $ref: ../common.yaml#/LockVersion }

StateTransition:
  type: object
  required: [from_state, to_state, occurred_at, actor, reason]
  description: >-
    Transition dated on the day it occurred, with its author and, for a manual
    exit, the reason given at its confirmation; not modifiable (WF-CYC-0130).
  properties:
    from_state:
      anyOf: [{ $ref: '#/ProjectState' }, { type: 'null' }]
      description: Null for the first transition, the creation of the project in the Created state.
    to_state: { $ref: '#/ProjectState' }
    occurred_at: { $ref: ../common.yaml#/Timestamp }
    actor: { $ref: ../common.yaml#/ActorRef }
    reason:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Reason given for the manual exit that produced the transition (WF-CYC-0090); null
        for an automatic transition or an exit confirmed without a reason.

LifecycleTrigger:
  type: string
  enum: [first_revision_created, reference_designated_and_code_set]
  description: >-
    The two triggering events of the automatic transitions of the lifecycle, and no other
    (WF-CYC-0020): the creation of the first revision leads from Created to Pricing; the
    designation of the reference revision and the entry of the project code, in any
    order, lead from Pricing to In progress (WF-CYC-0030). Rendered by the front in the
    reader's language (WF-ARC-0110).

NextState:
  type: object
  required: [current_state, next_state, trigger, missing_conditions]
  description: >-
    Next state, its triggering event and the remaining conditions, viewable
    at any time before In progress (WF-CYC-0050). For a project in progress or in a terminal state,
    which no event takes any further: the next state and the trigger null, no condition
    — the exits from the lifecycle are commands of the project (WF-CYC-0060), not a next
    state.
  properties:
    current_state: { $ref: '#/ProjectState' }
    next_state:
      anyOf: [{ $ref: '#/ProjectState' }, { type: 'null' }]
      description: >-
        Null for a project in progress or in a terminal state, which no event takes any further.
    trigger:
      anyOf: [{ $ref: '#/LifecycleTrigger' }, { type: 'null' }]
      description: >-
        The event that will lead to the next state, null along with it (WF-CYC-0050).
    missing_conditions:
      type: array
      description: Codes of the remaining conditions, one by one (WF-CYC-0030, WF-CYC-0050).
      items: { $ref: '#/CommandCondition' }

ProjectExit:
  type: object
  required: [to_state, lock_version]
  description: >-
    Manual exit: Completed from In progress, Lost from Pricing, Abandoned
    from any non-terminal state (WF-CYC-0060). Irreversible (WF-CYC-0080), and
    applied after explicit confirmation (WF-CYC-0090). "When the project holds a
    current revision, the confirmation asks to mark it, with a version name
    (WF-REV-0020), or to abandon it (WF-REV-0010); the exit is applied only with this
    choice, in the same operation. A terminal project therefore holds no current revision"
    (WF-CYC-0090): the body carries this choice (`current_revision`).
  properties:
    to_state:
      type: string
      enum: [completed, lost, abandoned]
    confirmed:
      type: boolean
      description: >-
        False or absent, the exit is refused with 400 `CONFIRMATION_REQUIRED`, and nothing is
        written: the confirmation is the guard of WF-CYC-0090 (`project_exit_unconfirmed`). The
        schema does not require it and does not fix its value, so that it is the guard that refuses,
        and not the validation of the body with 422 (US-0702/L3).
    reason:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Optional reason, which the transition keeps (WF-CYC-0090, WF-CYC-0130). Null or absent, the
        transition carries none (`StateTransition.reason`).
    current_revision:
      anyOf: [{ $ref: '#/CurrentRevisionFate' }, { type: 'null' }]
      description: >-
        The fate of the current revision, required when the project holds one
        (`Project.current_revision_id`): absent or null, the exit is refused with 422
        `VALIDATION_FAILED`, `fields` designating `/current_revision` with `VALUE_REQUIRED`, and
        nothing is written (`project_exit_revision_required`). Absent or null when the project
        holds none (D-01, US-0701/L9); sent when the project holds none, it is ignored: the exit
        applies within the request (200), the permission its action requires
        (`revision_abandon`, `revision_mark`) still being asked (403).
    lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        The lock version of the project as read (`Project.lock_version`): stale, the exit is
        refused with 412 and nothing is written (WF-IHM-0110; decision of the author of
        2026-10-28, US-0702/L2).

CurrentRevisionFate:
  description: >-
    What the exit does with the current revision (WF-CYC-0090): one of the two variants, which
    `action` distinguishes. `mark` marks it like `markRevision` (WF-REV-0020), and `abandon`
    abandons it like `abandonRevision` (WF-REV-0010).
  oneOf:
    - { $ref: '#/CurrentRevisionMark' }
    - { $ref: '#/CurrentRevisionAbandon' }
  discriminator:
    propertyName: action
    mapping:
      mark: '#/CurrentRevisionMark'
      abandon: '#/CurrentRevisionAbandon'

CurrentRevisionMark:
  type: object
  required: [action, version_name]
  description: >-
    Mark the current revision at the exit (WF-CYC-0090, WF-REV-0020), under `version_name`,
    required and bounded like that of `markRevision` — absent, refused with 422
    `VALIDATION_FAILED`, `fields` designating `/current_revision/version_name` with
    `VALUE_REQUIRED` —, unique among the marked revisions of the project — taken, refused with
    409 `ALREADY_EXISTS`, `fields` designating `/current_revision/version_name` with
    `ALREADY_EXISTS`, `fields[].params.conflicting_object_id` the revision that holds it —, with
    its optional description: the marking computes the indicators and is handed to the worker
    (WF-ARC-0090), and the exit returns 202 and the task, the transition being applied when it
    succeeds.
  properties:
    action: { type: string, const: mark }
    version_name: { type: string, minLength: 1, pattern: '\S', maxLength: 100 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Absent, the description kept at the creation of the revision is carried over; present, it
        replaces it; null, it clears it — the rule of `updateProject` for `client` (#2171).

CurrentRevisionAbandon:
  type: object
  required: [action]
  description: >-
    Abandon the current revision at the exit (WF-CYC-0090, WF-REV-0010), like
    `abandonRevision`, within the request: the exit returns 200 and the project. No version name or
    description, which only a marking freezes.
  properties:
    action: { type: string, const: abandon }

WorkBreakdown:
  type: object
  required: [work_packages, lock_version]
  description: >-
    Work breakdown: work packages, order items, deliverables. Entering it is optional; "in its
    absence, the work breakdown amounts to one work package and one order item that bear the
    label of the project, without a deliverable" (WF-PRJ-0020). The entire work breakdown, which
    `setWorkBreakdown` writes, and which it returns as read (`WorkBreakdownReading`). An element
    sent without an identifier is new: the server generates its identifier, which the response
    carries (WF-DAT-0060); an element sent with its own is the one the work breakdown as read
    carries, renamed or placed elsewhere, and an identifier that the work breakdown as read does
    not have — unknown, of an element of another kind, or of an element marked deleted
    (WF-DAT-0080) — is refused (`UNKNOWN_WORK_BREAKDOWN_ITEM`): the client forges no identifier
    (EP-14/L42k). An element is written only once: an identifier sent twice is refused at each
    occurrence after the first (`DUPLICATE_WORK_BREAKDOWN_ITEM`, on `/…/<kind>_id`). An entry
    carries at least one work package: without a work package, it is refused with 422
    `VALIDATION_FAILED`, `fields` designating `/work_packages` with `VALUE_REQUIRED` — a work
    breakdown always amounts to at least one work package (WF-PRJ-0020). As long as no entry has
    written it, the default work package and order item bear the label of the project, and
    follow it when it changes (D-11, US-0701/L9).
  properties:
    work_packages:
      type: array
      minItems: 1
      items: { $ref: '#/WorkPackage' }
    lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        The lock version of the work breakdown as read in full
        (`WorkBreakdownReading.lock_version`); null — that of a filtered reading —, the entry is
        refused with 422, stale with 412 (WF-IHM-0110).

WorkBreakdownReading:
  type: object
  required: [work_packages, lock_version]
  description: >-
    The work breakdown as `getWorkBreakdown` reads it: entire, or what its filters retain from
    it (WF-PRJ-0020, WF-IHM-0130), and what `setWorkBreakdown` returns, entire, each
    element retained. Each element returned carries its identifier and states whether it is retained
    (`is_match`) or returned for context only, which the write does not carry; each work package and
    each order item states the task that holds it (`attached_task`).
  properties:
    work_packages:
      type: array
      items: { $ref: '#/WorkPackageReading' }
    lock_version:
      anyOf: [{ $ref: ../common.yaml#/LockVersion }, { type: 'null' }]
      description: >-
        The lock version of the work breakdown, which `setWorkBreakdown` requires, returned only
        by the entire reading; null for a filtered reading (`search` or `kinds`), which omits
        elements: sending it back as is to `setWorkBreakdown` would delete what it omits, and
        the null lock version prevents it (422).

WorkPackage:
  type: object
  required: [label, order_items]
  description: >-
    A work package that `setWorkBreakdown` writes, at level 1 of the work breakdown: with its
    identifier if it exists, without one if it is new (`WorkBreakdown`).
  properties:
    work_package_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    order_items:
      type: array
      items: { $ref: '#/OrderItem' }

OrderItem:
  type: object
  required: [label, deliverables]
  description: An order item that `setWorkBreakdown` writes in its work package, identified like a work package.
  properties:
    order_item_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    deliverables:
      type: array
      items: { $ref: '#/Deliverable' }

Deliverable:
  type: object
  required: [label]
  description: A deliverable that `setWorkBreakdown` writes in its order item, identified like a work package.
  properties:
    deliverable_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }

WorkPackageReading:
  type: object
  required: [work_package_id, label, is_match, attached_task, order_items]
  description: >-
    A work package as `getWorkBreakdown` returns it (`WorkPackage`), whether it is retained, and
    the task that holds it.
  properties:
    work_package_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 300 }
    is_match:
      type: boolean
      description: >-
        True when the filters of the reading retain the element — it satisfies them all, and
        always without a filter —, false when it is returned only because it contains a retained
        element: "in a tree grid, the filter leaves visible the parents of the retained
        lines" (WF-IHM-0060). "The filter applies to the totals it presents"
        (WF-IHM-0130): the grid counts only the retained elements — read with
        `kinds=order_item`, that of the witness counts one order item, and no work package (#574).
    attached_task:
      anyOf: [{ $ref: '#/AttachedTask' }, { type: 'null' }]
      description: >-
        The task of the current revision that holds the work package (WF-PLA-0170), by its node
        and its label; null when none holds it, or when the project has no current revision. A
        work package or an order item "is held there by only one task at a time": it is the one
        that the deletion of the element leaves without attachment, and that the screen names
        before confirming it (#802).
    order_items:
      type: array
      items: { $ref: '#/OrderItemReading' }

OrderItemReading:
  type: object
  required: [order_item_id, label, is_match, attached_task, deliverables]
  description: >-
    An order item as `getWorkBreakdown` returns it (`OrderItem`), whether it is retained, and
    the task that holds it, like a work package (`WorkPackageReading.is_match`,
    `attached_task`).
  properties:
    order_item_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 300 }
    is_match: { type: boolean }
    attached_task:
      anyOf: [{ $ref: '#/AttachedTask' }, { type: 'null' }]
      description: >-
        Null when no task holds the order item, or when the project has no current revision, as for
        a work package.
    deliverables:
      type: array
      items: { $ref: '#/DeliverableReading' }

DeliverableReading:
  type: object
  required: [deliverable_id, label, is_match]
  description: >-
    A deliverable as `getWorkBreakdown` returns it (`Deliverable`). It contains nothing: returned,
    it is always retained, and its flag, always true, serves only to read every line of the
    grid alike. No task holds a deliverable (WF-PLA-0170).
  properties:
    deliverable_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 300 }
    is_match: { type: boolean }

AttachedTask:
  type: object
  required: [node_id, label]
  description: >-
    The task of the main structure of the current revision that holds a work package or an order
    item of the work breakdown (WF-PLA-0170), by its node and its label, as the attachment
    refusals name a task (`work_package_task`).
  properties:
    node_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 300 }

WorkBreakdownKind:
  type: string
  enum: [work_package, order_item, deliverable]
  description: >-
    Kind of an element of the work breakdown, from the broadest to the finest: work package,
    order item, deliverable (WF-PRJ-0020, §4.4.1). The kind column of the work breakdown grid,
    which `getWorkBreakdown` filters (`kinds`, WF-IHM-0130).

Subproject:
  type: object
  required: [subproject_id, code, label, has_actual_costs, available_commands, audit, lock_version]
  description: >-
    Subproject, identified by the code under which the ERP knows it, unique within the project.
    Not deletable as soon as an actual cost is charged to it (WF-PRJ-0050), nor as soon as a
    marked revision cites it (§4.4.1, the author's decision of 2026-10-10, #634), nor as long
    as estimate lines of the current revision carry it (WF-DAT-0080, WF-PRJ-0050): its commands
    state it in advance.
  properties:
    subproject_id: { $ref: ../common.yaml#/Uuid }
    code: { $ref: '#/DeclaredSubprojectCode' }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    has_actual_costs:
      type: boolean
      description: >-
        True as soon as an actual cost line is charged to it, excluded from the tracked scope or not
        (WF-CRE-0020): the creation of a subproject whose code some lines already carried makes it
        true at once.
    available_commands:
      type: array
      maxItems: 2
      description: >-
        Commands of the subproject that the caller has the permission to exercise, each available or
        not, with the conditions it lacks (WF-IHM-0090), in the order of
        `SubprojectCommand`. They follow the project's `update` command: the list is empty for
        whoever does not hold it, and on a closed project, which lists none (WF-CYC-0100;
        `subprojects_completed`, US-0702/L3). A call sent regardless of the list is refused with its
        error code.
      items: { $ref: '#/SubprojectCommandAvailability' }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

DeclaredSubprojectCode:
  type: string
  minLength: 1
  maxLength: 31
  pattern: '^(?![Ss][Yy][Nn][Tt][Hh][Èè][Ss][Ee]$|[Hh][Oo][Rr][Ss] [Ss][Oo][Uu][Ss]-[Pp][Rr][Oo][Jj][Ee][Tt]$)[^:\\/?*\[\]]*[^:\\/?*\[\]\s][^:\\/?*\[\]]*$'
  description: >-
    The code of a declared subproject, under which the ERP knows it, which names its tab in the
    remaining to commit file (annex B, WF-PRJ-0050): from 1 to 31 characters, never blank,
    without any of the characters `:`, `\`, `/`, `?`, `*`, `[` or `]`, and neither "Synthèse"
    nor "Hors sous-projet", the two tabs that Waterfall names, compared regardless of case —
    which is what the pattern states (D-7, EP-16/US-0610). A write that does not respect it is
    refused with 422 `VALIDATION_FAILED`, `fields` designating `/code`: too long, with
    `VALUE_TOO_LONG`, `fields[].params.max_length` at `31`, the bound that every
    `VALUE_TOO_LONG` carries; containing a forbidden character, with `SUBPROJECT_CODE_INVALID`,
    `fields[].params.forbidden_characters` the forbidden characters it contains, each once, in
    the order in which the code contains them; equal to a reserved name, with
    `SUBPROJECT_CODE_INVALID`, `fields[].params.reserved_name` that name as Waterfall writes it.
    The code read in the WBS element of an actual cost line (`ActualCostLine.subproject_code`)
    is not this one and keeps its bound of 50: a line with an unknown code is kept as is
    (WF-CRE-0020).

SubprojectCommand:
  type: string
  enum: [update, delete]
  description: >-
    Commands carried by a subproject (WF-IHM-0090): modify it, through `updateSubproject`, and
    delete it, through `deleteSubproject`. The deletion is unavailable as soon as a marked
    revision cites it, `subproject_not_cited` missing (§4.4.1, decision of the author of
    2026-10-10, #634), as soon as actual costs are charged to it,
    `subproject_without_actual_costs` missing (WF-PRJ-0050), as long as estimate lines of the
    current revision carry it, in any structure whatsoever — a provision line included, whose
    risk designated it (WF-RIS-0010) —, `subproject_without_estimate_lines` missing
    (WF-DAT-0080, WF-PRJ-0050; EP-14/L42q, C-273). On a closed project, none is listed
    (US-0702/L3), and `deleteSubproject` also names `project_not_terminal` (WF-CYC-0100). When
    several are missing, the command lists them in this order, which the 409 follows:
    `subproject_not_cited`, then `subproject_without_actual_costs`, then
    `subproject_without_estimate_lines` — from the condition that is never lifted, a marked
    revision being immutable (WF-DAT-0020), to the one that moving these lines outside any
    subproject or to another one lifts —, then `project_not_terminal`, which only the 409 names
    — the conditions specific to the subproject before that of the project. A subproject is
    created through the project's `update` command.

SubprojectCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/SubprojectCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Empty when the command is available.
      items: { $ref: '#/CommandCondition' }

SubprojectWrite:
  type: object
  required: [code, label]
  properties:
    code: { $ref: '#/DeclaredSubprojectCode' }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }

SubprojectUpdate:
  description: >-
    Modification of a subproject: carries the lock version as read,
    which a creation does not have.
  allOf:
    - $ref: '#/SubprojectWrite'
    - type: object
      required: [lock_version]
      properties:
        lock_version: { $ref: ../common.yaml#/LockVersion }

ContributorKind:
  type: string
  enum: [project_manager, contributor]
  description: >-
    Capacity of a contributor: project manager or contributor. The structuring actions
    of the catalogue and the project settings are reserved to its project managers, the
    entry to all its contributors (WF-PRJ-0060, WF-ADM-0110).

Contributor:
  type: object
  required: [user_id, display_name, kind, is_active]
  description: >-
    Contributor of a project, with their capacity. Viewing and entering data on a project
    are reserved to its contributors, each under its permission; the permission
    "view every project" opens for viewing the projects of which the user
    is not a contributor (WF-PRJ-0060).
  properties:
    user_id: { $ref: ../common.yaml#/Uuid }
    display_name:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The displayed name of the account, kept after its deactivation (WF-ADM-0060); null for
        an anonymised account, which the front presents under the neutral label of its
        catalogue, the API returning neither its name (WF-ADM-0060) nor a sentence
        (WF-ARC-0110), like `ActorRef.display_name` (#870). The sort places it after the names
        in ascending order (`listContributors`), and the search on the name never retains it.
    kind: { $ref: '#/ContributorKind' }
    is_active:
      type: boolean
      description: >-
        False for an account deactivated since its registration, which the list keeps and flags
        (WF-ADM-0060). Always returned: the screen guesses nothing from an absent value.

ContributorList:
  type: object
  required: [items, lock_version]
  description: >-
    The list of contributors of a project and its write lock version, specific to the list:
    modifying it does not touch the project, and modifying the project — its label, its inflation
    rate — does not make it stale (WF-PRJ-0060, WF-IHM-0110).
  properties:
    items:
      type: array
      items: { $ref: '#/Contributor' }
    lock_version:
      anyOf: [{ $ref: ../common.yaml#/LockVersion }, { type: 'null' }]
      description: >-
        The lock version of the list, which `setContributors` requires as it was read, returned by a
        reading of the entire list, sorted or not; null for a filtered reading (`search`,
        `kinds`, `is_active`), which omits contributors: written as is, the list would
        remove them, and the null lock version prevents it (422).

ContributorWrite:
  type: object
  required: [user_id, kind]
  properties:
    user_id: { $ref: ../common.yaml#/Uuid }
    kind: { $ref: '#/ContributorKind' }

ContributorsWrite:
  type: object
  required: [contributors, lock_version]
  description: >-
    The entire list, each with their capacity; a project keeps at least one project manager
    (WF-PRJ-0060). Written by a non-contributor, when no project manager has an active account
    (`setContributors`), it carries a project manager with an active account.
  properties:
    contributors:
      type: array
      minItems: 1
      maxItems: 500
      description: >-
        Each account once: an account registered twice is refused at its repeated line, with
        422 `VALIDATION_FAILED`. Five hundred lines at most — ten times the fifty registrations
        of a project, as many as the people of the platform (§4.6.2) —; beyond that, the list is
        refused with 422, `fields` designating `/contributors` with `VALUE_TOO_LONG`,
        `fields[].params.max_length` at `500` (#2162, #2163).
      items: { $ref: '#/ContributorWrite' }
    lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        The lock version of the list as read in full (`ContributorList.lock_version`); null —
        that of a filtered reading —, the list is refused with 422; stale, with 412
        (WF-IHM-0110).

ContributorSuggestion:
  type: object
  required:
    - user_id
    - display_name
    - is_active
    - org_node_id
    - org_node_label
    - resource_role_ids
    - resource_role_labels
  description: >-
    An account suggested as a contributor: attached to an organisation node one of whose
    resource roles is used by an estimate line of the project, and which the list of
    contributors does not yet include; never registered without confirmation (WF-PRJ-0070).
    Names its node and the roles of this node that the estimate uses, by their identifier and
    their label, so that the screen states why it is suggested without reading the reference
    data again (WF-ARC-0020).
  properties:
    user_id: { $ref: ../common.yaml#/Uuid }
    display_name:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The displayed name of the account, nullable like `Contributor.display_name`, so that the
        confirmed suggestion takes its place in the list as is: an anonymised account is
        deactivated, and is therefore never suggested (WF-ADM-0060, #870).
    is_active:
      type: boolean
      description: >-
        Always true: a deactivated account is no longer suggested (WF-ADM-0060), and registering it
        would be refused (`USER_INACTIVE`). Returned, like `Contributor.is_active`, so that the
        confirmed suggestion takes its place in the list as is, without the screen guessing
        anything.
    org_node_id: { $ref: ../common.yaml#/Uuid }
    org_node_label: { type: string }
    resource_role_ids:
      type: array
      minItems: 1
      items: { $ref: ../common.yaml#/Uuid }
    resource_role_labels:
      type: array
      minItems: 1
      description: The labels of the roles, in the order of `resource_role_ids`.
      items: { type: string }
