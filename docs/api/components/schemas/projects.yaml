# Projet, cycle de vie, lotissement, sous-projets et contributeurs (FBS-4.2, FBS-4.9).

ProjectState:
  type: string
  enum: [created, pricing, in_progress, completed, lost, abandoned]
  description: >-
    Les six états du cycle de vie, et aucun autre (WF-CYC-0010). Les libellés sont
    rendus par le front dans la langue du lecteur (WF-ARC-0110).

Project:
  description: Attributs d'un projet (WF-PRJ-0080).
  type: object
  required:
    - project_id
    - label
    - state
    - inflation_rate
    - win_probability
    - available_commands
    - audit
    - lock_version
  properties:
    project_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    code:
      anyOf: [{ type: string, maxLength: 50 }, { type: 'null' }]
      description: >-
        Code sous lequel l'ERP connaît le projet, unique dans l'installation et
        exigé pour le passage à En cours (WF-PRJ-0010).
    state: { $ref: '#/ProjectState' }
    inflation_rate:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      description: Taux d'inflation annuel, 0 par défaut (WF-PRJ-0040).
    win_probability:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      description: >-
        Probabilité de gain, 0 par défaut, figée à partir de En cours et sans effet
        sur aucun calcul du projet (WF-PRJ-0090).
    order_received_on:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
    reference_revision_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Révision de référence, désignée une fois à la contractualisation (WF-REV-0040).
    current_revision_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Révision en cours d'élaboration, s'il en existe une (WF-REV-0010).
    available_commands:
      type: array
      description: >-
        Commandes du projet que l'appelant a la permission d'exercer, chacune
        disponible ou non, avec les conditions qui lui manquent (WF-IHM-0090). Une
        commande absente de la liste n'est pas présentée.
      items: { $ref: '#/ProjectCommandAvailability' }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

CommandCondition:
  type: string
  description: >-
    Condition qu'une commande exige, nommée par le serveur quand elle manque, et
    rendue par le front dans la langue du lecteur (WF-IHM-0090, WF-ARC-0110).
    `no_background_task_running` manque tant qu'un traitement de fond court sur l'objet
    — marquage, fusion d'un différentiel, survenance d'un risque, import —, quel que
    soit l'utilisateur qui l'a lancé : les commandes qu'il rendrait caduques le nomment,
    le marquage, la fusion, la désignation de la référence et la saisie d'une révision
    pendant son marquage, la survenance d'un risque ou l'import des coûts réels d'un
    projet pendant le leur (WF-IHM-0080, WF-ARC-0090).
  enum:
    - is_contributor
    - project_not_terminal
    - project_in_progress
    - project_in_pricing
    - project_code_set
    - reference_revision_designated
    - at_least_one_task
    - at_least_one_estimate_line
    - no_current_revision
    - revision_draft
    - revision_marked
    - reference_correctable
    - unmerged_amendment_exists
    - task_not_completed
    - hourly_rates_set
    - no_background_task_running

ProjectCommand:
  type: string
  enum:
    - update
    - manage_contributors
    - create_revision
    - complete
    - lose
    - abandon
    - edit_risks
    - declare_risk_occurrence
    - import_actual_costs
    - exclude_cost_lines
  description: >-
    Commandes portées par le projet : modifier ses paramètres, ses contributeurs,
    ouvrir une révision, les trois sorties du cycle de vie (WF-CYC-0060) ; déclarer
    et réexaminer les risques, déclarer un risque survenu (WF-RIS-0060) ; importer les
    coûts réels, exclure une ligne du périmètre suivi (WF-CRE-0030). Une commande
    que refuse l'état d'un objet particulier — un risque déjà survenu — l'est par
    son code d'erreur.

ProjectCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/ProjectCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Vide lorsque la commande est disponible.
      items: { $ref: '#/CommandCondition' }

ProjectSummary:
  type: object
  required: [project_id, label, state]
  properties:
    project_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string }
    code:
      anyOf: [{ type: string }, { type: 'null' }]
    state: { $ref: '#/ProjectState' }

ProjectCreate:
  type: object
  required: [label]
  properties:
    label: { type: string, minLength: 1, maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    code:
      anyOf: [{ type: string, maxLength: 50 }, { type: 'null' }]

ProjectUpdate:
  type: object
  required: [lock_version]
  properties:
    label: { type: string, minLength: 1, maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    code:
      anyOf: [{ type: string, maxLength: 50 }, { type: 'null' }]
    inflation_rate: { $ref: ../common.yaml#/Percent }
    win_probability: { $ref: ../common.yaml#/Percent }
    order_received_on:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
    lock_version: { $ref: ../common.yaml#/LockVersion }

StateTransition:
  type: object
  required: [from_state, to_state, occurred_at, actor]
  description: >-
    Transition datée du jour où elle s'est produite, non modifiable (WF-CYC-0130).
  properties:
    from_state:
      anyOf: [{ $ref: '#/ProjectState' }, { type: 'null' }]
    to_state: { $ref: '#/ProjectState' }
    occurred_at: { $ref: ../common.yaml#/Timestamp }
    actor: { $ref: ../common.yaml#/ActorRef }

NextState:
  type: object
  required: [current_state, next_state, trigger, missing_conditions]
  description: >-
    Prochain état, son fait déclencheur et les conditions restantes, consultables
    à tout moment avant En cours (WF-CYC-0050).
  properties:
    current_state: { $ref: '#/ProjectState' }
    next_state:
      anyOf: [{ $ref: '#/ProjectState' }, { type: 'null' }]
    trigger:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Code du fait déclencheur, rendu par le front (WF-ARC-0110).
    missing_conditions:
      type: array
      description: Codes des conditions restantes, une par une (WF-CYC-0030, WF-CYC-0050).
      items: { $ref: '#/CommandCondition' }

ProjectExit:
  type: object
  required: [to_state, confirmed]
  description: >-
    Sortie manuelle : Terminé depuis En cours, Perdu depuis Chiffrage, Abandonné
    depuis tout état non terminal (WF-CYC-0060). Irréversible (WF-CYC-0080), et
    appliquée après confirmation explicite (WF-CYC-0090).
  properties:
    to_state:
      type: string
      enum: [completed, lost, abandoned]
    confirmed:
      type: boolean
      const: true
      description: 'Faux ou absent, la sortie est refusée : la confirmation est la garde de WF-CYC-0090.'
    reason:
      anyOf: [{ type: string }, { type: 'null' }]

WorkBreakdown:
  type: object
  required: [order_items, lock_version]
  description: >-
    Lotissement : postes, lots, livrables. Sa saisie est facultative ; en son
    absence, un poste, un lot, aucun livrable (WF-PRJ-0020).
  properties:
    order_items:
      type: array
      items: { $ref: '#/OrderItem' }
    lock_version: { $ref: ../common.yaml#/LockVersion }

OrderItem:
  type: object
  required: [order_item_id, label, work_packages]
  properties:
    order_item_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 300 }
    work_packages:
      type: array
      items: { $ref: '#/WorkPackage' }

WorkPackage:
  type: object
  required: [work_package_id, label, deliverables]
  properties:
    work_package_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 300 }
    deliverables:
      type: array
      items: { $ref: '#/Deliverable' }

Deliverable:
  type: object
  required: [deliverable_id, label]
  properties:
    deliverable_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 300 }

Subproject:
  type: object
  required: [subproject_id, code, label, has_actual_costs, audit, lock_version]
  description: >-
    Sous-projet, identifié par le code sous lequel l'ERP le connaît, unique dans
    le projet. Non supprimable dès qu'un coût réel lui est imputé (WF-PRJ-0050).
  properties:
    subproject_id: { $ref: ../common.yaml#/Uuid }
    code: { type: string, minLength: 1, maxLength: 50 }
    label: { type: string, minLength: 1, maxLength: 300 }
    has_actual_costs: { type: boolean }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

SubprojectWrite:
  type: object
  required: [code, label]
  properties:
    code: { type: string, minLength: 1, maxLength: 50 }
    label: { type: string, minLength: 1, maxLength: 300 }

SubprojectUpdate:
  description: >-
    Modification d'un sous-projet : porte le compteur lu,
    qu'une création n'a pas.
  allOf:
    - $ref: '#/SubprojectWrite'
    - type: object
      required: [lock_version]
      properties:
        lock_version: { $ref: ../common.yaml#/LockVersion }

Contributor:
  type: object
  required: [user_id, display_name]
  description: >-
    Contributeur d'un projet. Toute saisie y est réservée aux contributeurs ; la
    consultation ne dépend que des habilitations (WF-PRJ-0060).
  properties:
    user_id: { $ref: ../common.yaml#/Uuid }
    display_name: { type: string }
    is_active: { type: boolean }

ContributorsWrite:
  type: object
  required: [user_ids, lock_version]
  properties:
    user_ids:
      type: array
      items: { $ref: ../common.yaml#/Uuid }
    lock_version: { $ref: ../common.yaml#/LockVersion }

ContributorSuggestion:
  type: object
  required: [user_id, display_name, org_node_id, resource_role_ids]
  description: >-
    Proposition fondée sur les nœuds d'organisation des rôles employés par le
    planning ; jamais appliquée sans confirmation (WF-PRJ-0070).
  properties:
    user_id: { $ref: ../common.yaml#/Uuid }
    display_name: { type: string }
    org_node_id: { $ref: ../common.yaml#/Uuid }
    resource_role_ids:
      type: array
      items: { $ref: ../common.yaml#/Uuid }
