# Révisions, structures de coûts et arbre commun (FBS-4.1, FBS-4.3, FBS-4.4, FBS-4.5).
#
# Une révision est un instantané complet (WF-REV-0030) ; elle possède en propre
# toutes les lignes qui la décrivent (WF-DAT-0010). L'arbre est commun au planning
# et au devis : les mêmes tâches, vues du côté du temps ou du côté de l'argent
# (§3.5.1). Une tâche porte ses lignes de devis (WF-DEV-0020).

RevisionStatus:
  type: string
  enum: [draft, marked]
  description: En cours d'élaboration, ou marquée — et alors immuable (WF-REV-0020, WF-REV-0090).

Revision:
  type: object
  required:
    - revision_id
    - project_id
    - status
    - is_reference
    - reference_year
    - inflation_rate
    - win_probability
    - source_revision_id
    - source_version_name
    - available_commands
    - audit
    - lock_version
  properties:
    revision_id: { $ref: ../common.yaml#/Uuid }
    project_id: { $ref: ../common.yaml#/Uuid }
    version_name:
      anyOf: [{ type: string, maxLength: 100 }, { type: 'null' }]
      description: >-
        Nom de version saisi au marquage, unique parmi les révisions marquées du
        projet (WF-REV-0020). Nul tant que la révision est en cours.
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    status: { $ref: '#/RevisionStatus' }
    marked_at:
      anyOf: [{ $ref: ../common.yaml#/Timestamp }, { type: 'null' }]
    is_reference:
      type: boolean
      description: Caractère de révision de référence (WF-REV-0040, WF-REV-0090).
    reference_year:
      allOf: [{ $ref: ../common.yaml#/Year }]
      readOnly: true
      description: >-
        Année de référence de la révision, un de ses attributs (WF-REV-0090) : l'année dont les
        taux horaires chiffrent ses lignes. Fixée par le serveur à la création de la révision, à
        l'année courante, conservée par la révision et son instantané (WF-REV-0060, WF-REV-0030),
        jamais saisie. C'est l'année pour laquelle le calcul exige un taux horaire de chaque
        catégorie employée (WF-DEV-0010, `getMissingRates`), celle des montants « aux taux de
        l'année de référence, avant inflation » de la grille de devis (`base_amount`,
        WF-DEV-0050), celle d'où l'inflation projette les montants budgété et réestimé, une fois
        par année écoulée (WF-DEV-0030), et celle que la mise à jour des taux vise
        (`RateUpdateProposal.target_year`). Une révision créée en 2027 porte 2027 ; la révision
        précédente, créée en 2026, garde 2026.
    inflation_rate:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      readOnly: true
      description: >-
        Le taux d'inflation du projet que la révision conserve, un de ses attributs (WF-REV-0030,
        WF-REV-0090) : celui d'où ses montants budgété et réestimé sont projetés (WF-DEV-0030).
        Sur une révision marquée, celui de son marquage, que l'historique des révisions présente
        (WF-REV-0070) ; sur la révision en cours, celui du projet, qu'elle suit jusqu'à son
        marquage (`Project.inflation_rate`). Jamais saisi ici.
    win_probability:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      readOnly: true
      description: >-
        La probabilité de gain du projet que la révision conserve, de même (WF-REV-0030,
        WF-REV-0090, WF-PRJ-0090) : celle de son marquage sur une révision marquée, celle du
        projet sur la révision en cours (`Project.win_probability`). Jamais saisie ici.
    source_revision_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        La révision marquée dont la révision est la copie (WF-REV-0010), que tout écran nomme avec
        la révision en cours (WF-IHM-0020) ; nulle pour la première révision d'un projet, qui ne
        copie rien. Conservée une fois la révision marquée : l'historique dit d'où vient chaque
        révision.
    source_version_name:
      anyOf: [{ type: string, maxLength: 100 }, { type: 'null' }]
      description: >-
        Le nom de version de la révision source (`source_revision_id`), résolu à la lecture, pour
        que l'écran le nomme sans relire l'historique (WF-IHM-0020, WF-ARC-0020) ; nul avec elle.
    snapshot:
      anyOf: [{ $ref: '#/RevisionSnapshot' }, { type: 'null' }]
      description: >-
        Les valeurs du référentiel que la révision conserve (WF-REV-0030). Rendu par
        `getRevision` pour une révision marquée, qui les a figées à son marquage ; omis pour la
        révision en cours, dont les valeurs suivent le référentiel tant qu'elle n'est pas marquée,
        hors les taux qu'elle conserve (WF-REV-0060), et dans `listRevisions` comme dans la
        réponse d'une écriture, qui ne le lisent pas.
    available_commands:
      type: array
      description: >-
        Commandes de la révision que l'appelant a la permission d'exercer, chacune
        disponible ou non, avec les conditions qui lui manquent (WF-IHM-0090). Une grille
        dont la commande de saisie est absente ou indisponible se présente en lecture
        seule.
      items: { $ref: '#/RevisionCommandAvailability' }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

RevisionCommand:
  type: string
  enum:
    - edit_planning
    - generate_skeleton
    - edit_estimate
    - edit_remaining
    - edit_risks
    - declare_risk
    - create_structure
    - merge_structure
    - apply_rate_update
    - mark
    - designate_reference
    - abandon
    - export_planning
    - export_estimate
    - export_remaining
    - export_task_tree_image
  description: >-
    Commandes portées par la révision : saisir le planning, le devis, le reste à
    engager, les risques — une commande par fonction, chacune gardée par sa permission
    (WF-ADM-0100) —, ouvrir un différentiel (WF-REV-0100) et le fusionner (WF-REV-0050),
    y appliquer la mise à jour des taux (WF-REV-0060), la marquer, la désigner comme
    référence, l'abandonner (WF-REV-0010, WF-REV-0020, WF-REV-0040) — la fusion, le marquage,
    la désignation et l'abandon chacun gardés par sa permission propre, `structure_merge`,
    `revision_mark`, `reference_designate`, `revision_abandon` : un rôle qui marque sans
    fusionner voit `mark` et non `merge_structure` (WF-ADM-0100) ; en exporter le planning MS
    Project, le devis, le reste à engager ou l'image de l'arborescence de tâches — une commande
    par nature d'export (`ExportKind`), dans l'ordre de l'énumération (WF-INTF-0050,
    WF-INTF-0110, WF-INTF-0130, WF-PLA-0120). Un export se dit de la révision qu'il lit, marquée
    comme en cours ; un import, qui écrit dans la révision en cours ou la crée, est une
    commande du projet (`ProjectCommand`). Un export relève de la consultation
    (WF-CYC-0110) : il est gardé par la permission de consulter la fonction de sa nature
    — le planning et l'image de l'arborescence celle du planning (FBS-4.3), le devis celle
    du devis (FBS-4.4), le reste à engager celle du reste à engager (FBS-4.5) — et ne
    manque d'aucune condition : sur une révision marquée, pendant un marquage, sur un
    projet terminal, il reste disponible. Un export est présent ou absent.

    `edit_risks` est la saisie des risques — déclarer, modifier, réexaminer, supprimer un
    risque (`createRisk`, `updateRisk`, `reviewRisk`, `deleteRisk`), sous `risks.write` —,
    une saisie de la révision en cours comme les trois autres, annulable par le même
    historique (WF-RIS-0020, WF-IHM-0110). Seule la révision en cours la porte : une révision
    marquée ne la liste jamais, pas même indisponible comme les trois autres saisies — elle est
    immuable (WF-DAT-0020), et l'écran ne doit pas montrer deux commandes de saisie des risques
    quand le projet la porte. Tant que le projet n'a pas
    de révision en cours, c'est le projet qui la porte (`ProjectCommand.edit_risks`), la saisie
    créant la révision en cours (WF-RIS-0020).
    La déclaration de survenance n'en relève pas : c'est une commande du projet et du risque
    (`ProjectCommand.declare_risk_occurrence`, `RiskCommand.declare_occurrence`).

    `merge_structure` se dit de la révision en cours, et aussi, tant que le projet n'a pas de
    révision en cours, de la dernière révision marquée : « Lorsque le projet ne comporte pas de
    révision en cours, elle en crée une au préalable » (WF-REV-0050) : la fusion se demande sur
    le différentiel de cette révision, et crée la révision en cours par copie de celle-ci
    (WF-REV-0010 ; #790).
    Ses conditions y sont, dans cet ordre, `project_not_terminal`, `no_background_task_running`
    pendant l'application d'un import, le traitement d'une survenance ou une autre fusion, qui
    créent la révision en cours, `unmerged_amendment_exists`, puis `may_create_revision` à qui n'a
    pas la permission de créer une révision (`revisions.write`), comme toute commande qui la crée.
    Sur toute autre révision marquée, et sur celle-ci dès qu'une révision est en cours, elle ne
    manque que de `revision_draft`.

    `declare_risk` dit d'avance si la déclaration d'un risque (`createRisk`) aboutirait,
    toujours listée juste après `edit_risks`, là où elle l'est et sous la même permission,
    `risks.write` (EP-14/L42s), ses conditions dans l'ordre où le 409 de `createRisk` les juge :
    les conditions d'état d'`edit_risks` d'abord — `project_not_terminal` sur un projet terminal,
    puis `no_background_task_running` pendant un traitement de fond qui écrit dans la révision
    en cours ou la fige —, comme `ProjectCommand.update_work_breakdown` ; puis ses conditions
    propres — `at_least_one_task`, une structure principale sans tâche, puis
    `active_provision_category`, aucune catégorie active de type provision pour risques
    (WF-RIS-0010) — ; puis les autres conditions d'`edit_risks`. La modification, le réexamen
    et la suppression, qui n'en dépendent pas, restent sous `edit_risks`.

    `generate_skeleton` engendre le squelette de planning depuis le lotissement
    (`generatePlanningSkeleton`, WF-PRJ-0030), une saisie du planning gardée par la même
    permission, `planning.write`, et listée juste après elle. « La génération n'est proposée
    que sur la structure principale (WF-PLA-0170), et seulement lorsqu'elle ne comporte aucune
    tâche » : la commande est indisponible dès que la structure principale de la révision
    comporte une tâche, `main_structure_without_tasks` manquante, la condition propre d'abord,
    puis celles de toute saisie de la révision en cours — `no_background_task_running` pendant
    un marquage, un import, le traitement d'une survenance de risque ou une fusion. Sur une
    révision marquée, elle ne manque que de `revision_draft`, comme `create_structure`. Elle ne
    se dit d'aucun différentiel ni d'aucun devis propre d'un risque : c'est une commande de la
    révision, que l'opération applique à sa structure principale. Tant que le projet n'a pas de
    révision en cours, c'est le projet qui la porte (`ProjectCommand.generate_skeleton`), la
    révision s'ouvrant d'abord (EP-15/US-0490/L4).

    `apply_rate_update` dit d'avance si la mise à jour des taux s'appliquerait
    (`applyRateUpdate`, WF-REV-0060) : « la présentation reste proposée depuis la révision en
    cours tant qu'elle n'est pas marquée, et une mise à jour refusée peut y être acceptée
    ensuite ». Une écriture de la révision, comme son marquage, et non une saisie de grille :
    elle est gardée par la permission de la gestion des révisions, `revisions.write` — celle de
    `createRevision`, qui l'applique à la création (`RevisionCreate.apply_rate_update`) —, et
    non par celle du devis, qui ne se saisit plus sur la structure principale d'un projet En
    cours quand la mise à jour s'y accepte encore. Sur la révision en cours, sa condition propre
    d'abord, `rate_update_available`, quand la proposition ne présente aucune catégorie
    (`getRateUpdateProposal`) — l'année de référence de la révision est celle de la révision
    dont elle est la copie, ou chaque catégorie présentée a déjà été acceptée —, puis
    `no_background_task_running` pendant un marquage, l'application d'un import, le traitement
    d'une survenance ou une fusion. Sur une révision marquée, elle ne manque que de
    `revision_draft`, la proposition n'y étant pas jugée : une révision marquée garde les taux
    qu'elle a calculés (WF-REF-0130, WF-DAT-0020 ; #1351).

RevisionCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/RevisionCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Vide lorsque la commande est disponible.
      items: { $ref: projects.yaml#/CommandCondition }

RevisionSnapshot:
  type: object
  required: [employed_reference]
  description: >-
    Ce que la révision conserve du référentiel : les seules valeurs qu'elle emploie
    (WF-REV-0030). Les paramètres du projet qu'elle conserve — son année de référence, son taux
    d'inflation, sa probabilité de gain — sont des attributs de la révision, que l'historique lit
    sans l'instantané (`Revision.reference_year`, `inflation_rate`, `win_probability`,
    WF-REV-0090).
  properties:
    employed_reference: { $ref: '#/EmployedReference' }

EmployedReference:
  type: object
  required: [resource_roles, calendars, cost_categories, hourly_rates]
  description: >-
    Images des objets du référentiel employés, figées au marquage (WF-REV-0030, WF-REF-0130) :
    sans les commandes qu'un objet lu aujourd'hui porte, qu'une image n'a pas.
  properties:
    resource_roles:
      type: array
      items: { $ref: reference.yaml#/ResourceRoleImage }
    calendars:
      type: array
      items: { $ref: reference.yaml#/CalendarImage }
    cost_categories:
      type: array
      items: { $ref: reference.yaml#/CostCategoryImage }
    hourly_rates:
      type: array
      items: { $ref: reference.yaml#/HourlyRateImage }

RevisionCreate:
  type: object
  description: >-
    Crée la révision en cours par copie de la dernière révision marquée
    (WF-REV-0010, WF-DAT-0010). Un projet n'en comporte qu'une à la fois.
  properties:
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    apply_rate_update:
      type: boolean
      default: false
      description: >-
        Applique la mise à jour des taux proposée par WF-REV-0060. Jamais imposée :
        la valeur par défaut conserve les taux de la révision source.

RevisionMark:
  type: object
  required: [version_name, lock_version]
  description: >-
    Marque la révision. Le marquage fige la révision et calcule ses indicateurs
    dans la même transaction (WF-REV-0020, WF-DAT-0040) ; il est confié au worker
    et renvoie une tâche de fond (WF-ARC-0090).
  properties:
    version_name: { type: string, minLength: 1, pattern: '\S', maxLength: 100 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    lock_version: { $ref: ../common.yaml#/LockVersion }

ReferenceDesignation:
  type: object
  required: [revision_id, confirmed]
  description: >-
    Désigne la révision de référence parmi les révisions marquées. Corrigible tant que le
    projet n'a reçu aucun coût réel et qu'aucune révision n'a été marquée depuis la dernière
    désignation ; au-delà, la référence ne se déplace plus qu'à la contractualisation d'un
    avenant (WF-REV-0040).
  properties:
    revision_id: { $ref: ../common.yaml#/Uuid }
    confirmed:
      type: boolean
      const: true

RateUpdateProposal:
  type: object
  required: [categories]
  description: >-
    Écart de taux proposé catégorie par catégorie à la création d'une révision, quand son
    année de référence diffère de celle de la révision précédente. Une catégorie sans taux
    pour l'année retenue conserve son taux précédent, projeté par le taux d'inflation
    (WF-REV-0060).
  properties:
    target_year:
      allOf: [{ $ref: ../common.yaml#/Year }]
      description: >-
        L'année de référence de la révision créée (`Revision.reference_year`), pour laquelle
        les taux sont proposés ; les taux précédents sont ceux de l'année de référence de la
        révision dont elle est la copie (WF-REV-0060).
    categories:
      type: array
      items:
        type: object
        required: [cost_category_id, label, previous_amount, proposed_amount, source]
        properties:
          cost_category_id: { $ref: ../common.yaml#/Uuid }
          label:
            type: string
            minLength: 1
            maxLength: 200
            description: >-
              Le libellé de la catégorie, résolu à la lecture, pour que l'écran ne joigne rien.
          previous_amount: { $ref: ../common.yaml#/Money }
          proposed_amount: { $ref: ../common.yaml#/Money }
          source:
            type: string
            enum: [reference_rate, inflated_previous]

StructureKind:
  type: string
  enum: [main, amendment, risk]
  description: >-
    Nature de la structure de coûts : principale, différentiel d'avenant, ou devis
    propre d'un risque (WF-REV-0100, WF-REV-0050, WF-RIS-0030).

CostStructure:
  type: object
  required:
    - structure_id
    - revision_id
    - kind
    - label
    - planning_start_on
    - is_merged
    - available_commands
    - lock_version
  properties:
    structure_id: { $ref: ../common.yaml#/Uuid }
    revision_id: { $ref: ../common.yaml#/Uuid }
    kind: { $ref: '#/StructureKind' }
    label: { type: string, maxLength: 300 }
    planning_start_on:
      allOf: [{ $ref: ../common.yaml#/PlanningDate }]
      description: >-
        La date de début de planning de la structure, saisie (`updateCostStructure`) : le jour de
        sa première création par défaut ; une structure reprise d'une révision marquée conserve
        la sienne (WF-PLA-0020, WF-REV-0100, WF-REV-0010), et un différentiel, copie de la
        structure principale à sa création, prend la sienne. Une tâche en mode automatique sans
        prédécesseur y commence, à la première heure travaillée de son calendrier applicable
        (WF-PLA-0020). L'import MS Project la lit dans la date de début du projet du fichier, et
        l'export l'y écrit (WF-INTF-0040, WF-INTF-0050).
    risk_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Renseigné pour une structure de nature `risk` (WF-RIS-0030).
    is_merged:
      type: boolean
      description: >-
        Vrai lorsque le différentiel a été fusionné dans la principale (WF-REV-0050), ou
        lorsque le devis propre d'un risque l'a été par sa survenance (WF-RIS-0060).
    available_commands:
      type: array
      description: >-
        Commandes de saisie de la structure que l'appelant a la permission d'exercer, chacune
        disponible ou non, avec les conditions qui lui manquent (WF-IHM-0090) : ce que la grille
        qui la lit offre — la saisie des cellules, les gestes de structure, le collage —, sans
        rien déduire de l'état du projet (`StructureCommand`). Une grille dont la commande est
        absente ou indisponible se présente en lecture seule.
      items: { $ref: '#/StructureCommandAvailability' }
    lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        Compteur de la structure, qui avance à chaque écriture dans son arbre — une cellule, un
        collage, un déplacement, une création, une suppression — comme à chaque modification de la
        structure elle-même (`updateCostStructure`). C'est lui qu'un collage porte
        (`PasteApply.lock_version`), et que toute écriture de grille rend
        (`NodesWritten.structure_lock_version`), pour que la grille le garde à jour (WF-IHM-0110).
        Dans le devis propre d'un risque (`risk_id`), chacune de ces écritures fait aussi avancer le
        compteur du risque (`Risk.lock_version`), que la confirmation de sa survenance porte
        (`RiskOccurrence`).

StructureCommand:
  type: string
  enum:
    - edit_planning
    - edit_estimate
    - edit_remaining
  description: >-
    Commandes de saisie d'une structure, une par grille qui l'écrit : le planning, le devis, le
    reste à engager (WF-PLA-0080, WF-DEV-0050, WF-RAE-0040). Chacune est gardée par la permission
    de la commande de même nom de la révision (`RevisionCommand`, `planning.write`,
    `estimate.write`, `remaining.write`), présente ou absente comme elle (WF-ADM-0100). Le serveur
    accepte les mêmes écritures depuis les trois grilles — une tâche ou une ligne créée sur la
    structure principale d'un projet En cours est la même écriture depuis le planning et depuis
    le reste à engager — : c'est la commande de la structure qui dit quelle grille la saisit,
    selon la phase du projet, que le front ne déduit pas (WF-IHM-0090).

    Sur la structure principale, en chiffrage le devis, en réalisation le reste à engager :
    `edit_estimate` est indisponible dès que le projet a atteint En cours, ou un état terminal,
    `project_before_in_progress` manquante — la grille de devis reste lisible, en lecture seule
    (WF-DEV-0050) — ; `edit_remaining` est indisponible hors de l'état En cours, avant lui comme
    dans un état terminal, `project_in_progress` manquante (WF-RAE-0040). `edit_planning` n'a pas de
    condition de phase : le planning se travaille en chiffrage avec le devis, en réalisation avec le
    reste à engager. Sur un différentiel et sur le devis propre d'un risque, `edit_planning` et
    `edit_estimate` n'ont pas de condition de phase — un avenant et un risque se chiffrent quel que
    soit l'état du projet (WF-DEV-0050, WF-REV-0100, WF-RIS-0030) — et `edit_remaining` n'est jamais
    listée : seule la structure principale a un reste à engager (WF-RAE-0040).

    La condition de phase vient d'abord, propre à la commande ; puis les conditions d'état de la
    révision, telles que la commande de même nom de la révision les nomme — `revision_draft` sur
    une révision marquée, `no_background_task_running` pendant un traitement de fond qui écrit
    dans la révision en cours ou la fige, `project_not_terminal` sur un projet clos —, dans le
    même ordre. Les commandes de la révision gardent ce qui ne lit pas une structure : le
    squelette, le marquage, les exports, les risques (C-358, #1067).

StructureCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/StructureCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Vide lorsque la commande est disponible.
      items: { $ref: projects.yaml#/CommandCondition }

StructureCreate:
  type: object
  required: [kind, label]
  description: >-
    Crée un différentiel, pour préparer un avenant (WF-REV-0100). La structure principale n'est
    jamais créée ici : elle existe dès la création de la révision ; ni le devis propre d'un
    risque, qui naît avec lui (`createRisk`, WF-RIS-0030) et disparaît avec lui.
  properties:
    kind:
      allOf: [{ $ref: '#/StructureKind' }]
      enum: [amendment]
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }

StructureUpdate:
  type: object
  required: [lock_version]
  minProperties: 2
  description: >-
    Modifie la structure elle-même : sa date de début de planning et son libellé
    (WF-PLA-0020, WF-REV-0100). Seul ce qui est envoyé change ; le compteur lu est exigé. Un
    corps réduit au compteur ne changerait rien : au moins un des deux champs est exigé avec lui,
    sinon 422 `VALIDATION_FAILED`, et le compteur n'avance pas.
  properties:
    planning_start_on:
      allOf: [{ $ref: ../common.yaml#/PlanningDate }]
      description: >-
        La date de début de planning (`CostStructure.planning_start_on`), sur un jour qui a au
        moins une heure travaillée au calendrier par défaut (WF-PLA-0010, WF-PLA-0020).
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    lock_version: { $ref: ../common.yaml#/LockVersion }

StructureMerge:
  type: object
  required: [confirmed, version_name, main_structure_lock_version, amendment_lock_version]
  description: >-
    Fusionne le différentiel dans la structure principale : la fusion donne aux lignes qu'il désigne
    les grandeurs de référence qu'il porte, d'où leur montant budgété est tiré ; une ligne désignée
    d'une tâche non démarrée, que personne n'a réestimée depuis la référence, prend aussi ces
    grandeurs pour grandeurs courantes ; les grandeurs courantes et le montant réestimé de toutes
    les autres lignes sont conservés (WF-REV-0050, WF-DEV-0020). Elle s'applique à la révision en
    cours et la marque dans la même opération, d'où le nom de version exigé et la description
    permise, comme à tout marquage (WF-REV-0020), et la révision produite devient la référence
    (WF-REV-0050) ; sur un projet sans révision en cours, elle crée d'abord cette révision par copie
    de la dernière révision marquée, dans la même opération (WF-REV-0010 ; #790), et le nom de
    version est celui de la révision créée et marquée. Confiée au worker. La confirmation suit le
    compte rendu préalable (`getStructureMergeReport`), qui dit d'avance ce qui la refuserait, et
    porte les deux compteurs qu'il a lus : la structure principale ou le différentiel changés
    depuis, elle est refusée par 412 et rien n'est fusionné — c'est ce compte rendu que
    l'utilisateur a confirmé (WF-REV-0050, WF-IHM-0110 ; EP-14/L42s).
  properties:
    confirmed:
      type: boolean
      const: true
    version_name: { type: string, minLength: 1, pattern: '\S', maxLength: 100 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        La description jointe à la révision marquée, comme au marquage
        (`RevisionMark.description`, WF-REV-0020, WF-REV-0090).
    main_structure_lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        Le compteur de la structure principale que le compte rendu a lu
        (`StructureMergeReport.main_structure_lock_version`).
    amendment_lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        Le compteur du différentiel que le compte rendu a lu
        (`StructureMergeReport.amendment_lock_version`).

StructureMergeReport:
  type: object
  required:
    - main_structure_lock_version
    - amendment_lock_version
    - creates_current_revision
    - differences
    - completed_tasks
    - refusals
  description: >-
    Compte rendu de la fusion d'un différentiel, présenté avant son application (WF-REV-0050 ;
    EP-14/L42s) : ses écarts avec la structure principale — tâches et lignes ajoutées,
    modifiées, retirées —, les tâches démarrées qu'elle terminera, et les motifs qui la refusent.
    Il reprend les éléments du compte rendu d'un import, et se lit de même : une tâche démarrée
    ou terminée que le différentiel retire n'est jamais retirée, mais conservée et signalée
    (`kept`) ; la démarrée paraît aussi parmi `completed_tasks`, son reste à engager porté à zéro
    (`completed_on` nul tant que la fusion n'est pas appliquée). Les trois tableaux sont toujours
    rendus, vides quand il n'y a rien à dire ; la fusion ne s'applique que si `refusals` est vide.
    Il rend les compteurs des deux structures lues, que la confirmation renvoie (`StructureMerge`).
  properties:
    main_structure_lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        Le compteur de la structure principale lue (`CostStructure.lock_version`) : une saisie
        qui l'écrit depuis rend le compte rendu périmé, et la confirmation est refusée par 412.
    amendment_lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: Le compteur du différentiel lu (`CostStructure.lock_version`), de même.
    creates_current_revision:
      type: boolean
      description: >-
        Vrai quand le projet n'a pas de révision en cours : le différentiel est celui de la
        dernière révision marquée, et la fusion crée d'abord la révision en cours par copie de
        celle-ci, chiffrée aux taux conservés, projetés, y fusionne la copie du différentiel et
        la marque, dans la même tâche de fond — « Lorsque le projet ne comporte pas de révision en
        cours, elle en crée une au préalable » (WF-REV-0050, WF-REV-0010, WF-REV-0060 ; #790).
        Ses écarts et ses motifs de refus sont alors jugés sur la structure principale de la
        révision marquée, que la copie reprend telle quelle, et ses compteurs sont ceux de ses
        structures, que le marquage a figés. Faux pour un différentiel de la révision en cours.
    differences:
      type: array
      description: >-
        Les écarts du différentiel avec la structure principale, tâches, lignes de devis et
        liaisons, comme ceux d'un import (`ImportDifference`) ; un ajout n'a pas encore de lignée
        dans la structure principale. La ligne de provision d'un risque dont le différentiel
        retire la tâche porteuse passe sur une autre tâche, et le compte rendu le signale par un
        écart `updated` de la ligne sur `parent` (WF-RIS-0010 ; #789). Un écart `updated` d'une
        ligne nomme les grandeurs que le différentiel lui donne (`fields`) : elles deviennent ses
        grandeurs de référence, et aussi ses grandeurs courantes quand sa tâche n'est pas démarrée
        et que personne ne l'a réestimée (WF-REV-0050) ; le compte rendu ne distingue pas les
        deux cas, l'état réestimé d'une ligne restant au serveur (US-0701/L1, M-08).
      items: { $ref: exchanges.yaml#/ImportDifference }
    completed_tasks:
      type: array
      description: >-
        Les tâches démarrées que le différentiel retire, que la fusion termine en portant leur
        reste à engager à zéro (WF-REV-0050, WF-RAE-0040).
      items: { $ref: exchanges.yaml#/ImportCompletedTask }
    refusals:
      type: array
      description: >-
        Les motifs qui refusent la fusion entière (WF-PLA-0010, WF-PLA-0030, WF-PLA-0150,
        WF-PLA-0170), chacun avec les paramètres qu'il porte quand la fusion échoue
        (`ReportRefusal`). Vide quand la fusion s'applique. Une boucle de liaisons (`LINK_CYCLE`)
        laisse les dates de la structure sans calcul : l'horizon n'est alors pas jugé, et
        `PROJECT_HORIZON_EXCEEDED` ne l'accompagne jamais (#788).
      items: { $ref: exchanges.yaml#/ReportRefusal }

NodeKind:
  type: string
  enum: [task, estimate_line]
  description: >-
    Un nœud de l'arbre est une tâche ou une ligne de devis. La ligne est portée par
    la tâche sous laquelle elle est placée (WF-DEV-0020).

Node:
  type: object
  required: [node_id, lineage_id, kind, parent_id, position, row_number, level, computed_fields, editable_fields, lock_version]
  description: >-
    `row_number` et `level` sont calculés à la lecture. `lineage_id` est stable
    d'une révision à l'autre et fonde la comparaison, le diagramme temps/temps, les
    inscriptions aux suivis (WF-DAT-0030) et le rapprochement des imports (WF-INTF-0040,
    WF-INTF-0100, WF-INTF-0120).
  properties: &node_properties
    node_id: { $ref: ../common.yaml#/Uuid }
    lineage_id: { $ref: ../common.yaml#/Uuid }
    kind: { $ref: '#/NodeKind' }
    parent_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    position:
      type: integer
      minimum: 1
      readOnly: true
      description: >-
        Rang du nœud parmi les frères de son parent — les lignes d'une tâche, puis ses
        sous-tâches, dans l'ordre du plan —, à partir de 1. Calculé, il ne s'écrit pas : une
        création ou un déplacement désigne sa place par le nœud après lequel se placer
        (`NodeCreate.after_node_id`, `NodeMove.after_node_id` ; #1183). Sur la lecture d'un
        différentiel et sur une comparaison, les nœuds retirés rendus y comptent, à la place
        qu'ils avaient (`NodeDifference`).
    row_number:
      type: integer
      minimum: 1
      description: >-
        Numéro de ligne, calculé à la lecture dans la numérotation de toute la structure
        — ses tâches et ses lignes, dans l'ordre du plan —, quels que soient ce que la
        lecture rend, ses filtres, sa recherche et son tri. Sur la lecture d'un différentiel et
        sur une comparaison, les nœuds retirés rendus y comptent, chacun occupant sa ligne
        (`NodeDifference`).
    level: { type: integer, minimum: 1 }
    task:
      anyOf: [{ $ref: '#/TaskFacet' }, { type: 'null' }]
    estimate_line:
      anyOf: [{ $ref: '#/EstimateLineFacet' }, { type: 'null' }]
    predecessors:
      type: array
      items: { $ref: '#/Predecessor' }
    computed_fields:
      type: array
      description: >-
        Champs saisissables — par le schéma d'écriture ou, pour l'avancement, par sa
        commande — que le serveur calcule pour ce nœud-ci : les dates d'une tâche en
        mode automatique, le mode — toujours automatique (WF-PLA-0040) —, les dates, la durée et
        l'avancement d'une récapitulative, la catégorie d'une ligne de main-d'œuvre, celle de son
        rôle (WF-DEV-0020), les grandeurs d'une ligne de provision et son sous-projet, celui que
        son risque désigne (WF-RIS-0010). Le front les présente
        comme calculés et n'en propose pas la saisie (WF-IHM-0030) ; il ne déduit
        rien du mode ni de la nature du nœud.
      items: { $ref: '#/ComputedField' }
    editable_fields:
      type: array
      uniqueItems: true
      description: >-
        Champs de la facette que ce nœud-ci accepte en écriture, symétrique de
        `computed_fields` : une ligne de main-d'œuvre porte le rôle et la charge, jamais sa
        catégorie, qui est celle de son rôle (Vérif de WF-DEV-0020), une ligne hors main-d'œuvre
        sa catégorie et le débours unitaire, l'une et l'autre le délai de paiement — nul par
        défaut pour la main-d'œuvre, et « saisissable sur toute ligne autre qu'une ligne de
        provision » (WF-DEV-0020, WF-IND-0100 ; #785) —, une ligne de provision ni les uns ni les
        autres, ni
        son sous-projet, que son risque désigne et ne change que tant qu'il est identifié
        (`RiskCommand.update_provision`, WF-RIS-0010) ; une ligne dont la tâche est démarrée ou
        terminée, et dont le sous-projet a reçu des coûts réels, ne le nomme pas non plus : elle
        ne peut pas quitter ce sous-projet (`SUBPROJECT_HAS_ACTUAL_COSTS`, WF-PRJ-0050) ;
        une tâche en mode manuel porte ses dates, un jalon n'a pas de durée à
        saisir, une récapitulative ni mode, ni durée, ni dates, ni avancement (WF-PLA-0040,
        WF-PLA-0130). Un champ
        calculé pour ce nœud n'y figure jamais. La grille n'offre la saisie d'une cellule que si
        son champ y figure, sans rien déduire de la nature de la catégorie ni du mode
        (WF-IHM-0040) ; ce que l'appelant a le droit d'écrire relève des commandes de la
        révision, pas de cette liste.
      items: { $ref: '#/EditableField' }
    lock_version: { $ref: ../common.yaml#/LockVersion }
    difference:
      anyOf: [{ $ref: '#/NodeDifference' }, { type: 'null' }]
      description: >-
        L'écart du nœud, que le serveur rend et que le front ne calcule pas : sur la lecture d'un
        différentiel, avec la structure principale de sa révision ; dans une comparaison de deux
        révisions (`RevisionComparison`), avec la révision de base (WF-REV-0080, WF-REV-0100,
        C-361). Toujours rendu sur ces deux lectures, que `fields` le nomme ou non ; nul — ou
        omis — sur la structure principale et sur le devis propre d'un risque, qui ne se lisent
        par rapport à rien.
    changes:
      type: array
      description: >-
        Ce qui change du nœud lui-même, dans l'ordre de `NodeChange`, rendu avec `difference` :
        vide pour un nœud ajouté, retiré ou inchangé, et pour une tâche marquée modifiée par son
        seul contenu — une ligne ou une subordonnée ajoutée, retirée, modifiée ou déplacée.
      items: { $ref: '#/NodeChange' }

NodeDifference:
  type: string
  enum: [added, removed, modified, unchanged]
  description: >-
    L'écart d'un nœud, rapproché par sa lignée (WF-DAT-0030) : `added`, absent de la structure de
    base — la principale pour un différentiel, la révision de base pour une comparaison — ;
    `removed`, absent de la structure lue, rendu à la place qu'il avait, entre les nœuds qui
    l'entouraient, en lecture seule (`editable_fields` vide) ; `modified`, présent des deux côtés,
    dont une valeur change (`changes`), ou une tâche sous laquelle un nœud est ajouté, retiré ou
    modifié, ou d'où un nœud est déplacé, de sorte que la marque d'une récapitulative dit que son
    contenu change ; `unchanged`,
    tout le reste (WF-REV-0080, C-361). Un nœud retiré occupe sa ligne : `row_number` et `position`
    comptent l'arbre rendu, nœuds retirés compris, et un nœud déplacé est rendu une fois, à sa
    place nouvelle, `parent` parmi ses `changes`. Les tâches modifiées par leurs propres valeurs
    se comptent sur un `changes` non vide ; une tâche modifiée par son seul contenu a un
    `changes` vide.

NodeChange:
  type: string
  enum:
    [dates, duration, progress, budgeted_amount, reestimated_amount, payment_delay_days, parent]
  description: >-
    Ce qui change d'un nœud présent des deux côtés (WF-REV-0080) : pour une tâche, ses dates, sa
    durée, son état d'avancement et son parent — « Une tâche déplacée sous une autre
    récapitulative est présentée modifiée » — ; pour une ligne de devis, ses montants budgété et
    réestimé, qui disent ses grandeurs, son délai de paiement, qui déplace ses décaissements sans
    changer aucun montant (WF-DEV-0020, WF-IND-0100 ; #1566), et son parent, la tâche qui la
    porte. Le montant d'une tâche est celui de ses lignes, qui le disent.

KanbanTask:
  description: >-
    Une tâche du Kanban (`listStartableTasks`, WF-RAE-0030) : le nœud, et les gestes que sa
    carte offre, que le front ne déduit ni de son état ni de ses lignes (WF-IHM-0090).
  allOf:
    - $ref: '#/Node'
    - type: object
      required: [available_commands]
      properties:
        available_commands:
          type: array
          readOnly: true
          description: >-
            Les gestes de la carte que l'appelant a la permission d'exercer — celle de la
            saisie du reste à engager, `remaining.write`, dont le Kanban relève (FBS-4.5.3) ;
            sans elle, la liste est vide —, dans l'ordre de `KanbanCommand`, chacun disponible
            ou non avec les conditions qui lui manquent.
          items: { $ref: '#/KanbanCommandAvailability' }

KanbanCommand:
  type: string
  enum: [start, complete, reopen, enter_remaining]
  description: >-
    Les gestes d'une carte du Kanban (WF-RAE-0030). Une carte ne liste que ceux que son état
    et sa nature admettent ; ceux qu'une condition retient y sont indisponibles, la condition
    nommée. Une ligne de provision ne compte pas parmi les lignes d'une tâche : elle ne la
    retient ni de se terminer depuis le Kanban, ni ne la renvoie à la saisie du reste à engager
    (WF-PLA-0050, WF-RIS-0010).

    `start` passe à démarrée une tâche non démarrée qui n'est pas un jalon : un jalon ne
    démarre jamais, et la carte d'un jalon ne la liste pas (WF-PLA-0050). Les prédécesseurs
    n'en sont pas une condition. `complete` termine une tâche non démarrée ou démarrée, à la
    date saisie (`ProgressUpdate.occurred_on`, WF-PLA-0130) : listée sur toute carte qui n'est
    pas terminée, elle manque de `task_is_milestone` pour une tâche non démarrée qui n'est pas
    un jalon — le passage direct de non démarrée à terminée n'est ouvert qu'à un jalon, qui prend
    alors pour date de démarrage celle de sa terminaison (WF-PLA-0130) —, et de
    `task_without_lines` pour une tâche qui porte une ligne hors provision, que la saisie d'un
    reste à engager nul sur toutes ses lignes termine (WF-RAE-0040), dans cet ordre.
    `reopen` rouvre une tâche terminée : un jalon redevient non démarré, ses dates de
    démarrage et de terminaison effacées, toute autre tâche redevient démarrée ; listée sur toute
    carte
    terminée, et sur elle seule. `enter_remaining` renvoie à la grille de reste à engager, sur
    la tâche, et n'écrit rien : listée sur la carte d'une tâche non terminée qui porte une
    ligne hors provision, et sur elle seule — c'est le geste qui la termine, `complete` y
    manquant de `task_without_lines`, ou qui la réestime avant même qu'elle démarre.

    Après les conditions propres au geste viennent celles de la saisie du reste à engager de
    la structure principale (`StructureCommand.edit_remaining`), dans le même ordre :
    `project_in_progress` hors de l'état En cours, `no_background_task_running` pendant un
    traitement de fond qui écrit dans la révision en cours ou la fige.

KanbanCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions, progress]
  properties:
    command: { $ref: '#/KanbanCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Vide lorsque le geste est disponible.
      items: { $ref: projects.yaml#/CommandCondition }
    progress:
      anyOf: [{ $ref: '#/TaskProgress' }, { type: 'null' }]
      description: >-
        L'état que le geste envoie à `setTaskProgress` (`ProgressUpdate.progress`) :
        `started` pour `start`, `completed` pour `complete`, `not_started` pour la
        réouverture d'un jalon et `started` pour celle de toute autre tâche ; nul pour
        `enter_remaining`, qui n'écrit rien. Le front envoie cet état, sans le déduire de la
        nature de la tâche.

NotStartedTask:
  description: >-
    Une tâche non démarrée du Kanban (`listStartableTasks`, WF-RAE-0030) : le nœud et ses
    gestes (`KanbanTask`), et si tous ses prédécesseurs sont terminés.
  allOf:
    - $ref: '#/KanbanTask'
    - type: object
      required: [predecessors_completed]
      properties:
        predecessors_completed:
          type: boolean
          readOnly: true
          description: >-
            Vrai quand tous les prédécesseurs de la tâche sont terminés, ou qu'elle n'en a
            aucun. C'est ce qui fait signaler un jalon, pour inviter à le terminer — rien ne se
            termine seul (WF-RAE-0030) ; ce n'est pas une condition du démarrage, dont
            WF-RAE-0030 ne fait pas dépendre les prédécesseurs.

ComputedField:
  type: string
  description: >-
    Champ saisissable que le serveur calcule pour un nœud (`computed_fields`) :
    `task.scheduling_mode`,
    le mode d'une récapitulative, toujours automatique (WF-PLA-0040) ;
    `estimate_line.cost_category_id`, la catégorie d'une ligne de main-d'œuvre, celle de son rôle
    (WF-DEV-0020).
  enum:
    - task.scheduling_mode
    - task.duration
    - task.start
    - task.finish
    - task.progress
    - estimate_line.cost_category_id
    - estimate_line.quantity
    - estimate_line.hours
    - estimate_line.unit_disbursement
    - estimate_line.subproject_id

EditableField:
  type: string
  description: >-
    Champ d'une facette qu'une écriture porte — `TaskFacetUpdate`, `EstimateLineUpdate`, la
    commande d'avancement pour `task.progress`, ou `setNodeTracking` pour `task.tracking` —, que
    le nœud nomme parmi ceux qu'il accepte (`editable_fields`, WF-IHM-0040). Le rattachement à
    un lot ou à un poste du lotissement (`task.work_package_id`, `task.order_item_id`) est
    accepté de toute tâche de la structure principale, récapitulative, feuille ou jalon, et
    d'aucune autre : « Le rattachement n'existe que dans la structure principale », « les
    structures différentielles et les devis propres des risques n'en portent pas »
    (WF-PLA-0170) — leurs tâches ne le nomment pas, et le portent toujours nul. L'inscription
    aux chronologies et au suivi temps/temps (`task.tracking`, WF-PLA-0060) est nommée de même
    par toute tâche de la structure principale, et d'aucune autre : c'est par elle que la
    grille de planning offre le sous-menu des chronologies, sans le déduire de la structure lue
    (#1065) ; l'appelant l'écrit sous la commande de saisie du planning de la structure
    (`StructureCommand.edit_planning`), comme les autres champs de la tâche. Les prédécesseurs
    (`task.predecessors`, écrits par `setPredecessors`, WF-PLA-0030) sont nommés par toute tâche,
    récapitulative, feuille ou jalon, de toute structure — une liaison n'est refusée qu'à sa
    saisie, par ce qu'elle relie (`LINK_FORBIDDEN`, `LINK_CYCLE`) — et d'aucun nœud retiré d'un
    différentiel, en lecture seule : c'est par lui que la grille de planning offre la cellule des
    prédécesseurs, sous `edit_planning` comme les autres champs de la tâche (#1257).
  enum:
    - task.label
    - task.description
    - task.scheduling_mode
    - task.duration
    - task.start
    - task.finish
    - task.progress
    - task.predecessors
    - task.order_item_id
    - task.work_package_id
    - task.tracking
    - estimate_line.label
    - estimate_line.cost_category_id
    - estimate_line.resource_role_id
    - estimate_line.quantity
    - estimate_line.hours
    - estimate_line.unit_disbursement
    - estimate_line.payment_delay_days
    - estimate_line.subproject_id

NodeColumn:
  type: string
  description: >-
    Colonne d'une grille de la structure, nommée comme `sort_by` de `listNodes` et
    `PastePreview.target_column` la nomment : les
    colonnes de la grille de planning (WF-PLA-0080), puis celles de la grille de devis et de
    la grille de reste à engager (WF-DEV-0050, WF-RAE-0040), chacune dans l'ordre où sa grille
    les présente : de `label` à `work_breakdown`, les colonnes de la tâche — après la
    criticité, ses dates de démarrage et de terminaison, colonnes de lecture, que WF-PLA-0080
    place avant le rattachement et les prédécesseurs ; la dernière, le lot ou le poste du
    lotissement auquel la tâche est rattachée (WF-PLA-0170). L'état d'une tâche n'est pas une
    colonne : la grille de planning le « signale par une marque visuelle et non par une
    colonne » (WF-PLA-0080), et seul le Kanban l'écrit (`setTaskProgress`) ;
    `label`, puis de `cost_category` à `previous_reestimated_amount`, celles de la ligne de
    devis — le montant aux taux de l'année de référence, avant inflation (`base_amount`), puis
    les montants budgété et réestimé, inflation comprise : la grille de devis présente le
    premier et le réestimé (WF-DEV-0050), celle de reste à engager le budgété et le réestimé,
    et, au reste à engager précédent, les grandeurs puis le montant réestimé (WF-RAE-0040).
    C'est dans cet ordre qu'un collage remplit les colonnes qui suivent la colonne visée
    (`PastePreview.target_column`, WF-IHM-0050). Seules les grilles de devis et de reste à
    engager trient, par les colonnes de la ligne : la grille de planning n'en trie aucune
    (`sort_by`, WF-IHM-0060).
  enum:
    - label
    - description
    - scheduling_mode
    - duration
    - start
    - finish
    - physical_progress
    - total_float
    - is_critical
    - started_on
    - completed_on
    - predecessors
    - work_breakdown
    - cost_category
    - resource_role
    - quantity
    - hours
    - unit_disbursement
    - subproject
    - payment_delay_days
    - consumption_year
    - base_amount
    - budgeted_amount
    - reestimated_amount
    - previous_quantity
    - previous_hours
    - previous_unit_disbursement
    - previous_reestimated_amount

ComputedValueField:
  type: string
  description: >-
    Champ d'un nœud dont le serveur calcule la valeur, pour ce nœud-ci ou pour tous : ceux
    que `computed_fields` peut nommer, et ceux qu'aucune écriture ne porte — les montants,
    la marge, l'avancement physique (WF-IHM-0030).
  enum:
    - task.scheduling_mode
    - task.duration
    - task.start
    - task.finish
    - task.progress
    - task.physical_progress
    - task.total_float
    - task.base_amount
    - task.budgeted_amount
    - task.reestimated_amount
    - estimate_line.cost_category_id
    - estimate_line.quantity
    - estimate_line.hours
    - estimate_line.unit_disbursement
    - estimate_line.subproject_id
    - estimate_line.base_amount
    - estimate_line.budgeted_amount
    - estimate_line.reestimated_amount
    - estimate_line.previous_reestimated_amount

ComputedDependency:
  type: string
  description: >-
    Ce dont dépend une valeur calculée, que le refus d'une saisie nomme (WF-IHM-0030) :
    `subordinates`, les dates, la durée et l'avancement d'une récapitulative, tirés de ses
    subordonnées, et son mode, toujours automatique (WF-PLA-0040), sa marge, la plus petite des
    leurs (WF-PLA-0100) ; `lines_and_subordinates`, le montant d'une tâche, somme de
    ses lignes et de ses subordonnées (WF-DEV-0050) ; `scheduling`, les dates d'une tâche
    en mode automatique, tirées de sa durée, de ses liaisons et de son calendrier
    (WF-PLA-0020) ; `float_dates`, la marge, écart des dates au plus tôt et au plus tard
    (WF-PLA-0100) ; `manual_mode`, la marge d'une tâche en mode manuel, qui n'en porte pas
    (WF-PLA-0100) ; `hourly_rate`, le montant d'une ligne de main-d'œuvre, de sa quantité, de
    sa charge et du taux horaire de sa catégorie pour l'année de référence ; `unit_disbursement`,
    celui d'une ligne hors main-d'œuvre, de sa quantité et de son débours unitaire (WF-DEV-0030) ;
    `resource_role`, la catégorie d'une ligne de main-d'œuvre, celle de son rôle (WF-DEV-0020) ;
    `risk`, les grandeurs, le sous-projet et le montant d'une ligne de provision (WF-RIS-0010) ;
    `reference_revision`, le montant budgété, fixé par la révision de référence (WF-DEV-0020) ;
    `remaining_reviews`, le montant réestimé, suivi par les revues du reste à engager (WF-RAE-0040)
    ; `inflation`, la projection des montants budgété et réestimé sur l'année de consommation de la
    ligne, au taux d'inflation du projet — une ligne de provision n'est pas projetée (WF-DEV-0030,
    WF-DEV-0040) ; `own_estimate`, la gravité d'un risque, total de son devis propre, et
    `severity_and_probability`, sa provision, cette gravité pondérée par sa probabilité
    (WF-RIS-0010) — que le risque nomme lui-même (`Risk.computed_fields`).
  enum:
    - subordinates
    - lines_and_subordinates
    - scheduling
    - float_dates
    - manual_mode
    - hourly_rate
    - unit_disbursement
    - resource_role
    - risk
    - reference_revision
    - remaining_reviews
    - inflation
    - own_estimate
    - severity_and_probability

DependencyRow:
  type: object
  required: [node_id, row_number, label]
  description: >-
    Une ligne dont dépend une valeur calculée, nommée comme la grille la nomme : son numéro
    dans la numérotation de toute la structure, et son libellé.
  properties:
    node_id: { $ref: ../common.yaml#/Uuid }
    row_number: { type: integer, minimum: 1 }
    label: { type: string }

RowNumberResolution:
  type: object
  required: [node_id, row_number, label, kind]
  description: >-
    Le nœud qui porte un numéro de ligne dans la numérotation de toute la structure, quels que
    soient la recherche, les filtres et le tri de la grille qui le demande (`resolveRowNumber`,
    WF-PLA-0080) : son identifiant, que l'écriture d'un prédécesseur envoie
    (`PredecessorWrite.predecessor_node_id`), son numéro, son libellé — celui de la tâche ou de la
    ligne de devis — et sa nature, qui dit au front si le numéro désigne une tâche.
  properties:
    node_id: { $ref: ../common.yaml#/Uuid }
    row_number: { type: integer, minimum: 1 }
    label: { type: string }
    kind: { $ref: '#/NodeKind' }

ComputedValueDependencies:
  type: object
  required: [node_id, field, depends_on, rows]
  description: >-
    Ce dont dépend la valeur calculée d'un champ d'un nœud (WF-IHM-0030) : les règles qui la
    calculent, dans l'ordre où les dire, et les lignes dont elle est tirée — les
    subordonnées directes d'une récapitulative, les lignes et les subordonnées directes
    d'une tâche —, toutes, que la recherche ou les filtres d'une lecture les retiennent ou
    non. Aucune ligne pour une valeur qui n'est tirée d'aucune.
  properties:
    node_id: { $ref: ../common.yaml#/Uuid }
    field: { $ref: '#/ComputedValueField' }
    depends_on:
      type: array
      minItems: 1
      uniqueItems: true
      description: Chaque règle une fois, dans l'ordre où la dire.
      items: { $ref: '#/ComputedDependency' }
    rows:
      type: array
      uniqueItems: true
      description: Chaque ligne une fois, dans l'ordre du plan.
      items: { $ref: '#/DependencyRow' }

EntryAvailability:
  type: object
  required: [is_available, missing_conditions]
  description: Si une saisie est ouverte sur cet objet, et sinon les conditions qui lui manquent (WF-IHM-0090).
  properties:
    is_available: { type: boolean }
    missing_conditions:
      type: array
      items: { $ref: projects.yaml#/CommandCondition }

NodeListMeta:
  type: object
  required: [summary_depth, scheduled_at]
  description: >-
    Ce que la lecture dit de la structure lue elle-même, et non des nœuds qu'elle rend : les
    filtres, la recherche, `kinds` et `fields` n'y changent rien.
  properties:
    scheduled_at:
      allOf: [{ $ref: ../common.yaml#/Timestamp }]
      description: >-
        L'instant du dernier calcul des dates de la structure lue : celui de la dernière
        écriture qui l'a redatée — une durée, une liaison, un calendrier, l'arbre, sa date de
        début de planning, sa création comprise (WF-PLA-0020) —, ou de son import, quels que
        soient les filtres, la recherche, `kinds` et `fields`, comme `summary_depth`. Une
        révision marquée n'est plus redatée (WF-DAT-0020) : elle garde l'instant du dernier
        calcul qui a précédé son marquage. C'est la date de calcul que nomment les images
        exportées du Gantt et d'une chronologie (WF-IHM-0130, WF-PLA-0140).
    summary_depth:
      type: integer
      minimum: 0
      description: >-
        Le niveau (`level`) de la plus profonde récapitulative de la structure, le premier
        niveau étant celui des tâches sans parent, quels que soient les filtres — `max_level`
        compris —, la recherche et `kinds` ; 0 pour une structure sans récapitulative.
        L'arborescence de tâches offre ainsi exactement les niveaux qui existent, du premier
        à celui-ci, sans en deviner un de plus ni en cacher un au-delà du niveau qu'elle lit
        (WF-PLA-0110).

NodeTotals:
  type: object
  required:
    - task_count
    - estimate_line_count
    - hours
    - base_amount
    - budgeted_amount
    - reestimated_amount
  description: >-
    Totaux de la requête, calculés par le serveur ; le front n'en somme aucun. Les
    montants et les heures sont ceux des seules lignes de devis retenues par les
    filtres — jamais les montants cumulés des tâches, qui les compteraient deux fois —,
    et les décomptes ignorent les ancêtres rendus pour la seule lisibilité de l'arbre.
    Chaque montant est la somme du montant de même nom des lignes retenues
    (`EstimateLineFacet`) : aux taux de l'année de référence, avant inflation, pour
    `base_amount`, inflation comprise pour les montants budgété et réestimé (WF-DEV-0020,
    WF-DEV-0050). `budgeted_amount` somme les montants budgétés des lignes retenues, lignes de
    provision comprises : ce n'est pas le budget de référence, diminué des provisions selon
    WF-RIS-0050.
  properties:
    task_count: { type: integer, minimum: 0 }
    estimate_line_count: { type: integer, minimum: 0 }
    hours: { $ref: ../common.yaml#/Hours }
    base_amount: { $ref: ../common.yaml#/Money }
    budgeted_amount: { $ref: ../common.yaml#/Money }
    reestimated_amount: { $ref: ../common.yaml#/Money }

NodesWritten:
  type: object
  required: [nodes, ancestors, rescheduled, reinflated, totals, structure_lock_version]
  description: >-
    Ce qu'une écriture de grille rend, quelle qu'elle soit — une cellule, un collage, un
    déplacement, une création, une suppression, une liaison, un avancement, une réestimation,
    une inscription aux suivis — : les nœuds écrits, les dates des autres tâches que
    l'écriture a redatées, les montants, inflation comprise, des autres lignes et tâches qu'elle a
    déplacées dans le temps, les récapitulatives recalculées au-dessus des uns et des autres,
    et les totaux de la structure,
    pour que la grille montre juste sans relire la structure ni rien sommer (WF-IHM-0040,
    WF-DEV-0050, WF-PLA-0020, WF-ARC-0020), et le compteur de la structure, qui a avancé.
  properties:
    nodes:
      type: array
      description: >-
        Les nœuds écrits, tels qu'ils sont désormais, dans l'ordre du plan ; vide après une
        suppression, qui ne laisse rien à rendre, et après l'écriture de la structure elle-même
        (`updateCostStructure`), qui n'écrit aucun nœud.
      items: { $ref: '#/Node' }
    ancestors:
      type: array
      description: >-
        Les ancêtres des nœuds écrits et des tâches redatées (`rescheduled`), hors des nœuds
        écrits — ceux du nœud supprimé, et, pour un déplacement, leurs anciens ancêtres —,
        recalculés : montants,
        dates, durée, avancement, marge et criticité d'une récapitulative. Chacun une fois,
        entier, dans l'ordre du plan ; vide quand aucun de ces nœuds n'a de parent. Une
        récapitulative qui a perdu sa dernière subordonnée y est rendue telle qu'elle devient —
        une feuille en mode automatique de la durée qu'elle calculait, un jalon si cette durée est
        nulle et qu'elle n'est pas démarrée, une feuille d'un jour si elle l'est (WF-PLA-0040) —,
        ses `computed_fields` et `editable_fields` changés avec elle (`deleteNode`, `moveNodes`).
      items: { $ref: '#/Node' }
    rescheduled:
      type: array
      description: >-
        Les tâches non récapitulatives dont le début, la fin, la marge totale ou la criticité ont
        changé par l'écriture sans être écrites — les successeurs d'une liaison ou d'une durée
        saisie, les tâches automatiques sans prédécesseur et leurs successeurs que déplace la date
        de début de planning, et ce que le chemin critique déplace (WF-PLA-0020, WF-PLA-0100) —,
        chacune une fois, dans l'ordre du plan ; vide quand rien d'autre n'a bougé. Une projection
        de leur calendrier, non le nœud entier : une chaîne de mille tâches reste légère. Les
        récapitulatives qu'elles déplacent sont rendues entières dans `ancestors`. Ni les unes ni
        les autres ne voient leur compteur avancer : il ne suit que les écritures (`LockVersion`).
        Les montants qui dépendent des dates — les montants, inflation comprise, l'année de
        consommation — n'y sont pas : ils sont dans `reinflated`. À la différence de `reinflated`,
        une tâche que `ancestors` rend entière — la porteuse d'une ligne écrite que l'écriture
        redate — y paraît aussi : les deux portent les mêmes dates, et la grille peut lire l'une ou
        l'autre.
      items: { $ref: '#/NodeSchedule' }
    reinflated:
      type: array
      description: >-
        Chaque nœud dont un montant, inflation comprise, ou l'année de consommation d'une
        ligne, a changé par l'écriture sans qu'il soit écrit : les lignes de devis d'une tâche
        écrite ou redatée, dont les dates ont bougé — un rôle changé change le calendrier de la
        tâche, donc ses dates (WF-PLA-0010, WF-DEV-0040) —, et les tâches non récapitulatives
        dont ces lignes changent les montants, redatées (`rescheduled`) ou non, hors
        celles que `ancestors` rend entières. Les récapitulatives restent dans `ancestors`. Chacun une fois, dans l'ordre du
        plan ; vide quand aucun n'a bougé. Une projection de leurs montants, non le nœud entier,
        comme `rescheduled` : le montant aux taux de l'année de référence ne dépend pas des dates
        et ne change pas.
      items: { $ref: '#/NodeInflation' }
    totals:
      allOf: [{ $ref: '#/NodeTotals' }]
      description: >-
        Les totaux de la structure entière, sans filtre : ceux qu'une grille lue sans filtre
        affiche. Une grille filtrée les relit par `listNodes`.
    structure_lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        Le compteur de la structure après l'écriture (`CostStructure.lock_version`), que le
        collage suivant porte (WF-IHM-0110).

NodeSchedule:
  type: object
  required: [node_id, start, finish, total_float, is_critical, link_conflicts, finish_overdue]
  description: >-
    Le calendrier d'une tâche non récapitulative qu'une écriture a redatée sans l'écrire
    (`NodesWritten.rescheduled`) : les valeurs que le planning recalcule à chaque
    modification d'une durée, d'une liaison ou de la structure (WF-PLA-0020), et que le
    chemin critique déplace (WF-PLA-0100), sous la forme des champs de même nom de la
    facette temps (`TaskFacet`) — les liaisons en conflit comprises, pour que le signalement
    suive l'écriture qui le crée ou le lève. Les montants qui dépendent des dates n'y sont pas. Sans
    `lock_version` : un recalcul ne fait pas avancer le compteur de la tâche, qui reste
    celui que la grille a lu (`LockVersion`).
  properties:
    node_id: { $ref: ../common.yaml#/Uuid }
    start: { $ref: ../common.yaml#/WorkInstant }
    finish: { $ref: ../common.yaml#/WorkInstant }
    total_float:
      anyOf: [{ $ref: '#/Duration' }, { type: 'null' }]
      description: >-
        Marge totale (WF-PLA-0100), calculée : du temps de travail en jours ouvrés
        (`unit: d`), décimale et signée, sans minimum. Une tâche en mode manuel borne la fin au
        plus tard de ses prédécesseurs comme le début au plus tôt de ses successeurs : un
        prédécesseur qui ne peut pas finir à temps pour elle porte une marge négative, il est
        critique, et la liaison en conflit est nommée (`link_conflicts`, WF-PLA-0020). Nulle
        pour une tâche en mode manuel, qui ne porte pas de marge.
    is_critical:
      type: boolean
      description: >-
        Appartenance au chemin critique, une marge totale nulle ou négative (WF-PLA-0100) ;
        fausse pour une tâche en mode manuel.
    link_conflicts:
      type: array
      description: Les liaisons en conflit de la tâche, comme `TaskFacet.link_conflicts`.
      items: { $ref: '#/LinkConflict' }
    finish_overdue:
      type: boolean
      description: >-
        Fin dépassée : vrai pour une tâche démarrée dont la fin est antérieure à la date de
        calcul (WF-RAE-0040), comme `TaskFacet.finish_overdue`.

LinkConflict:
  type: object
  required: [predecessor_node_id, successor_node_id, link_type]
  description: >-
    Une liaison qu'un prédécesseur en mode automatique ne peut pas satisfaire avec une tâche en
    mode manuel — finir ou commencer avant la date que la liaison impose, selon son type
    (WF-PLA-0030) — : la grille de planning et le diagramme de Gantt signalent l'une et l'autre
    tâche en nommant la liaison, sans recalculer aucune date (WF-PLA-0020, WF-IHM-0070,
    WF-ARC-0020). Calculée, jamais saisie ; elle disparaît dès que les dates le permettent.
  properties:
    predecessor_node_id: { $ref: ../common.yaml#/Uuid }
    successor_node_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: La tâche en mode manuel que la liaison relie à son prédécesseur.
    link_type: { $ref: '#/LinkType' }

NodeInflation:
  type: object
  required: [node_id, budgeted_amount, reestimated_amount, consumption_year]
  description: >-
    Les montants d'une ligne de devis ou d'une tâche non récapitulative qu'une écriture a
    déplacée dans le temps sans l'écrire (`NodesWritten.reinflated`) : ceux qui dépendent des
    dates, inflation comprise, sous la forme des champs de même nom de sa facette
    (`EstimateLineFacet`, `TaskFacet`), que les grilles de devis et de reste à engager présentent
    (WF-DEV-0020, WF-DEV-0040, WF-DEV-0050). Sans `lock_version`, comme `NodeSchedule` : un
    recalcul ne fait pas avancer le compteur du nœud (`LockVersion`).
  properties:
    node_id: { $ref: ../common.yaml#/Uuid }
    budgeted_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Le montant budgété, comme `EstimateLineFacet.budgeted_amount` pour une ligne et
        `TaskFacet.budgeted_amount` pour une tâche — la somme de ses lignes. Projeté sur l'année
        où la révision de référence consommait la ligne, il ne suit les dates que sur un projet
        sans révision de référence, où il est confondu avec le réestimé (WF-DEV-0050).
    reestimated_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Le montant réestimé, comme `EstimateLineFacet.reestimated_amount` pour une ligne et
        `TaskFacet.reestimated_amount` pour une tâche — la somme de ses lignes.
    consumption_year:
      anyOf: [{ $ref: ../common.yaml#/Year }, { type: 'null' }]
      description: >-
        L'année de consommation d'une ligne, comme `EstimateLineFacet.consumption_year` ; nulle
        pour une tâche, dont la facette n'en porte pas.

TaskProgress:
  type: string
  enum: [not_started, started, completed]
  description: État d'avancement d'une tâche (WF-PLA-0130, WF-RAE-0030).

SchedulingMode:
  type: string
  enum: [automatic, manual]
  description: >-
    Mode de planification de la tâche : dates calculées depuis les liaisons, ou
    saisies (WF-PLA-0020).

DurationUnit:
  type: string
  enum: [min, h, d, w, mo, emin, eh, ed, ew, emo]
  description: >-
    Unité d'une durée, conservée telle qu'elle a été saisie ou importée (WF-PLA-0160) :
    minutes, heures, jours, semaines et mois de travail, que les constantes de
    l'installation convertissent en heures (`DurationUnits`) ; minutes, heures, jours,
    semaines et mois écoulés, qui se convertissent sans calendrier — un jour écoulé vaut
    vingt-quatre heures, une semaine sept jours, un mois trente jours. Le front l'écrit
    par le suffixe de Microsoft Project dans la langue du lecteur (`j`, `sem`, `ej`…).

Duration:
  type: object
  required: [value, unit]
  description: >-
    Durée, en temps de travail ou en temps écoulé : celle d'une tâche, dans l'unité de sa
    saisie (WF-PLA-0160), nulle pour un jalon (WF-PLA-0050) ; ou une marge totale,
    calculée en jours ouvrés (WF-PLA-0100).
  properties:
    value:
      allOf: [{ $ref: ../common.yaml#/Decimal }]
      description: >-
        Jamais négative pour la durée d'une tâche ; signée pour une marge totale, négative
        quand un prédécesseur ne peut pas finir à temps pour une tâche en mode manuel
        (WF-PLA-0100).
    unit: { $ref: '#/DurationUnit' }

LagUnit:
  type: string
  enum: [min, h, d, w, mo, emin, eh, ed, ew, emo, percent]
  description: >-
    Unité du décalage d'une liaison (WF-PLA-0030) : celles d'une durée, et le
    pourcentage de la durée du prédécesseur — un décalage de 50 % sur un prédécesseur
    de dix jours vaut cinq jours de travail.

Lag:
  type: object
  required: [value, unit]
  description: >-
    Décalage d'une liaison dans l'unité de sa saisie, positif ou négatif — négatif,
    c'est une avance —, conservé sans conversion (WF-PLA-0030, WF-PLA-0160).
  properties:
    value:
      allOf: [{ $ref: ../common.yaml#/Decimal }]
      description: >-
        Le nombre d'unités ; en `percent`, le nombre de pour cent, et non une part de 0 à 1 :
        `50` pour la moitié de la durée du prédécesseur, comme MS Project l'écrit
        (WF-PLA-0030, WF-PLA-0160).
    unit: { $ref: '#/LagUnit' }

TaskFacet:
  type: object
  required:
    - label
    - scheduling_mode
    - duration
    - start
    - finish
    - progress
    - finish_overdue
    - is_summary
    - is_milestone
    - calendar_hours
    - total_float
    - is_critical
    - link_conflicts
    - base_amount
    - budgeted_amount
    - reestimated_amount
  description: >-
    Facette temps d'un nœud. Les valeurs calculées — dates en mode automatique,
    mode, dates et durée d'une récapitulative, marge, criticité, liaisons en conflit,
    avancement physique, fin dépassée — ne sont pas saisissables (WF-IHM-0030). La marge, la
    criticité et les liaisons en conflit sont exigées de toute tâche, récapitulative comprise :
    une grille et le Gantt distinguent ainsi une tâche sans marge d'une valeur qui manque
    (WF-PLA-0080, WF-PLA-0090, WF-PLA-0100). La durée est portée dans l'unité
    de sa saisie (WF-PLA-0160) ; le début et la fin sont une date et les heures de
    travail écoulées ce jour-là (WF-DAT-0100). Une tâche, récapitulative ou feuille, peut
    porter le rattachement à un lot ou à un poste du lotissement (`work_package_id`,
    `order_item_id`, WF-PLA-0130, WF-PLA-0170) ; une tâche créée par un import MS Project garde l'identifiant que le
    fichier lui donnait (`external_id`, WF-INTF-0040).
  properties: &task_facet_properties
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    scheduling_mode: { $ref: '#/SchedulingMode' }
    duration: { $ref: '#/Duration' }
    start:
      anyOf: [{ $ref: ../common.yaml#/WorkInstant }, { type: 'null' }]
    finish:
      anyOf: [{ $ref: ../common.yaml#/WorkInstant }, { type: 'null' }]
    progress: { $ref: '#/TaskProgress' }
    finish_overdue:
      type: boolean
      description: >-
        Calculé : vrai pour une tâche démarrée dont la fin est antérieure à la date de
        calcul, que la grille de reste à engager signale (WF-RAE-0040). Faux sinon.
    started_on:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: >-
        Date de démarrage, renseignée au changement d'état (WF-PLA-0130), nulle pour une tâche
        non démarrée. Une tâche terminée sans avoir été démarrée — un jalon terminé depuis le
        Kanban, une tâche que la saisie d'un reste à engager nul termine — prend pour date de
        démarrage celle de sa terminaison ; un jalon rouvert perd l'une et l'autre
        (`ProgressUpdate`). Une récapitulative porte celle de la première de ses subordonnées
        démarrées. Une colonne de lecture de la grille de planning (`NodeColumn.started_on`,
        WF-PLA-0080).
    completed_on:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: >-
        Date de terminaison, qui situe la valeur acquise dans le temps (WF-IND-0030), nulle pour
        une tâche qui n'est pas terminée ; une colonne de lecture de la grille de planning
        (`NodeColumn.completed_on`, WF-PLA-0080).
    is_summary:
      type: boolean
      description: 'Récapitulative : son état est dérivé de ses subordonnées, non saisissable (WF-PLA-0040).'
    is_milestone:
      type: boolean
      description: Jalon, tâche de durée nulle (WF-PLA-0050).
    calendar_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        Calendrier applicable, résolu à la lecture : intersection des calendriers
        des rôles des lignes de main-d'œuvre, ou calendrier par défaut (WF-PLA-0010). Nul quand
        il est l'intersection de plusieurs calendriers, qui n'a pas d'identifiant :
        `calendar_hours` en porte alors les heures.
    calendar_hours:
      allOf: [{ $ref: reference.yaml#/WeeklyHours }]
      description: >-
        Calculé, jamais saisi : les heures de chaque jour de la semaine du calendrier applicable
        à la tâche, celui sur lequel ses dates et sa durée se comptent (WF-PLA-0010) — chaque
        jour, le plus petit des nombres d'heures que les calendriers des rôles de ses lignes de
        main-d'œuvre lui accordent ; le calendrier par défaut si elle n'en porte aucune. Une
        récapitulative et un jalon suivent la même règle, sur les seules lignes qu'ils portent :
        une récapitulative n'hérite pas des calendriers de ses subordonnées, dont chacune a le
        sien, et ses dates comme sa durée se comptent sur le sien (WF-PLA-0040). Un jour à 0
        heure est un jour chômé de la tâche, que le Gantt distingue ; le contrat ne connaît pas
        de jours fériés (WF-REF-0110). Sur une révision marquée, les heures des calendriers
        qu'elle fige (`EmployedReference`).
    total_float:
      anyOf: [{ $ref: '#/Duration' }, { type: 'null' }]
      description: >-
        Marge totale (WF-PLA-0100), calculée : du temps de travail en jours ouvrés
        (`unit: d`), décimale et signée, sans minimum. Une tâche en mode manuel borne la fin au
        plus tard de ses prédécesseurs comme le début au plus tôt de ses successeurs : un
        prédécesseur qui ne peut pas finir à temps pour elle porte une marge négative, il est
        critique, et la liaison en conflit est nommée sur l'une et l'autre tâche
        (`link_conflicts`, WF-PLA-0020). Nulle pour une tâche en mode manuel, qui ne porte pas
        de marge. Une récapitulative porte la plus petite marge de celles de ses subordonnées qui
        en portent une, nulle quand aucune n'en porte (WF-PLA-0100) : celle qui porte une
        subordonnée critique affiche la marge de cette subordonnée, nulle ou négative.
    is_critical:
      type: boolean
      description: >-
        Appartenance au chemin critique, calculée : une marge totale nulle ou négative
        (WF-PLA-0100). Fausse pour une tâche en mode manuel, qui n'apparaît jamais sur le chemin
        critique ; vraie pour une récapitulative dès que l'une de ses subordonnées est critique.
    link_conflicts:
      type: array
      description: >-
        Les liaisons en conflit (WF-PLA-0020), toujours rendues, vides sans conflit : sur une
        tâche en mode manuel, celles que ses prédécesseurs en mode automatique ne peuvent pas
        satisfaire ; sur un tel prédécesseur, celles qu'il ne satisfait pas. Chacune nomme ses
        deux tâches et son type, dans l'ordre du plan de leur prédécesseur, puis de leur
        successeur ; la grille et le Gantt signalent l'une et l'autre tâche selon l'échelle
        commune (WF-IHM-0070) sans croiser les marges ni recalculer de date (WF-ARC-0020). Une
        récapitulative n'en porte pas. Calculées, jamais saisies, elles disparaissent dès que les
        dates le permettent ; une écriture qui en crée ou en lève les rend
        (`NodesWritten.rescheduled`).
      items: { $ref: '#/LinkConflict' }
    physical_progress:
      anyOf: [{ $ref: indicators.yaml#/Computable }, { type: 'null' }]
      description: >-
        Avancement physique d'une récapitulative, calculé : le rapport des montants budgétés
        acquis dans son sous-arbre — ses lignes propres comprises, acquises quand elle est
        terminée, hors lignes de provision (WF-IND-0030) — au total des montants budgétés de ce
        sous-arbre, hors lignes de provision (WF-IND-0060), à quatre décimales (README, « Une
        part… »), non calculable quand ce total est nul (`no_budgeted_amount`, WF-IND-0010). Nul pour une tâche qui
        n'est pas récapitulative.
    base_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Somme des montants aux taux de l'année de référence, avant inflation, des lignes que la
        tâche porte et de ceux de ses subordonnées, calculée par le serveur, jamais saisissable :
        une valeur de lecture, que la grille de devis présente pour une tâche, récapitulative
        comprise (WF-DEV-0050). Un attribut de la tâche : un filtre de la grille ne le change
        pas, comme les deux sommes qui suivent.
    budgeted_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Même somme, pour les montants budgétés, inflation comprise, à l'année de consommation de
        chaque ligne (WF-DEV-0020).
    reestimated_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Même somme, pour les montants réestimés, inflation comprise, à l'année de consommation
        de chaque ligne (WF-DEV-0020, WF-DEV-0050).
    tracking:
      type: array
      description: Inscriptions aux chronologies et au suivi temps/temps (WF-PLA-0060).
      items: { $ref: '#/TrackingEntry' }
    order_item_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        Le poste du lotissement que porte cette tâche (WF-PLA-0170), aux mêmes règles que
        `work_package_id`, exclusif de lui : une tâche porte un lot ou un poste, jamais les
        deux ; un poste n'est porté que par une tâche à la fois. « Lorsque le lot d'un poste est
        rattaché, la tâche de ce poste se trouve dans le sous-arbre de la tâche de ce lot »
        (WF-PLA-0170). Les grilles filtrent par poste sur ce rattachement (WF-DEV-0050,
        WF-RAE-0040).
    work_package_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        Le lot du lotissement que porte cette tâche, récapitulative ou feuille (WF-PLA-0170) :
        posé par le squelette (WF-PRJ-0030), modifiable et retirable, exclusif de
        `order_item_id`. Un lot n'est porté que par une tâche à la fois ; c'est par elle que le
        devis présente le total par lot, celui de son sous-arbre (WF-DEV-0060), et que les
        grilles filtrent par lot. Une récapitulative qui perd sa dernière subordonnée garde son
        rattachement. Nul sans rattachement.
    work_breakdown_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Le libellé du lot ou du poste porté, résolu à la lecture, que la colonne
        `work_breakdown` présente sans que la grille lise le lotissement (WF-ARC-0020) ; nul
        sans rattachement.
    external_id:
      anyOf: [{ type: string, maxLength: 200 }, { type: 'null' }]
      description: >-
        L'identifiant que MS Project donnait à la tâche dans le fichier dont l'import l'a
        créée, conservé comme identifiant externe (WF-INTF-0040) : c'est par lui qu'un fichier
        remanié avant le premier export se rapproche de la tâche. Nul pour une tâche créée
        dans Waterfall, jamais saisi.

EstimateLineFacet:
  type: object
  required:
    - label
    - cost_category_id
    - cost_category_label
    - resource_role_label
    - subproject_label
    - quantity
    - base_amount
    - budgeted_amount
    - reestimated_amount
    - is_computed
    - uses_inactive_object
    - remaining_entry
  description: >-
    Facette argent d'un nœud. Les trois montants sont calculés et non saisissables : le
    montant aux taux de l'année de référence, avant inflation, est celui de la ligne telle
    qu'elle est chiffrée, une valeur de lecture (WF-DEV-0030, WF-DEV-0050) ; le budgété, fixé
    par la révision de référence et nul pour une ligne ajoutée après elle, et le réestimé, mis
    à jour par les revues, sont exprimés inflation comprise, à l'année de consommation de la
    ligne : c'est à ce titre qu'ils entrent au budget de référence, au reste à engager, à la
    valeur planifiée et à la valeur acquise (WF-DEV-0020, WF-RAE-0040). Une ligne de provision
    n'est pas projetée : ses montants sont ceux que son risque calcule, le devis propre du
    risque portant déjà sa propre projection (WF-DEV-0030, WF-PRJ-0040). La grille de devis
    présente le premier et le réestimé, jamais le budgété (WF-DEV-0050). La catégorie, le rôle et le
    sous-projet sont nommés par leur libellé, que le serveur résout à la lecture, l'objet
    actif ou désactivé, pour que la grille ne rapproche aucune liste (WF-ARC-0020,
    WF-REF-0150). Une ligne qui emploie un objet du
    référentiel désactivé le dit (`uses_inactive_object`), pour que les grilles de devis
    et de reste à engager la signalent (WF-REF-0010).
  properties: &estimate_line_facet_properties
    label:
      type: string
      minLength: 1
      pattern: '\S'
      maxLength: 300
      description: >-
        Libellé, composé par le serveur à la création quand il n'est pas envoyé
        (`EstimateLineWrite.label`, WF-DEV-0020), modifiable ensuite.
    cost_category_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        Catégorie de coût ; celle d'une ligne de main-d'œuvre est celle de son rôle, calculée et
        non saisissable (`computed_fields`, Vérif de WF-DEV-0020).
    cost_category_label:
      type: string
      description: Libellé de la catégorie de coût, résolu à la lecture, active ou désactivée.
    quantity: { $ref: ../common.yaml#/Decimal }
    resource_role_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Exigé pour une catégorie de main-d'œuvre, absent sinon (WF-DEV-0020).
    resource_role_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Libellé du rôle de ressource, résolu à la lecture, actif ou désactivé ; nul pour une
        ligne sans rôle.
    hours:
      anyOf: [{ $ref: ../common.yaml#/Hours }, { type: 'null' }]
    unit_disbursement:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: Débours unitaire d'une ligne hors main-d'œuvre (WF-DEV-0020).
    payment_delay_days:
      anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
      description: >-
        Délai de paiement, dont la courbe de coûts cumulés décale le montant de la ligne
        quand elle présente les décaissements (WF-IND-0100). Nul pour une ligne de provision, qui
        n'en porte pas et reste à la date de la tâche qui la porte (WF-DEV-0020, WF-IND-0100 ;
        EP-14/L42s).
    subproject_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Sous-projet facultatif ; sans lui, la ligne relève de « hors sous-projet » (WF-IND-0020).
    subproject_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Libellé du sous-projet, résolu à la lecture ; nul pour une ligne hors sous-projet.
    base_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Montant aux taux de l'année de référence, avant inflation, calculé : le produit de la
        quantité, de la charge et du taux horaire de la catégorie pour l'année de référence du
        chiffrage pour une ligne de main-d'œuvre, de la quantité et du débours sinon
        (WF-DEV-0030) ; une valeur de lecture, que la grille de devis présente à côté du
        réestimé (WF-DEV-0050).
    budgeted_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Montant fixé par la révision de référence (§3.2.5, WF-DEV-0020), tiré de ses grandeurs
        de référence, inflation comprise, à l'année de consommation que la référence lui
        donnait (WF-DEV-0030, WF-RAE-0010) ; nul pour une ligne ajoutée après elle ou issue
        d'un risque survenu — sauf une ligne que le différentiel d'un avenant désigne : la
        fusion lui donne les grandeurs de référence qu'il porte, d'où son montant budgété est tiré
        (WF-REV-0050). Une ligne de provision porte la provision qu'elle avait dans la révision de
        référence : ce montant compte à la réserve pour risques (`RiskCoverageTotals.reserve`, qui
        garde aussi celle des risques sortis de l'état identifié avant la référence), jamais au
        budget de référence, qui
        est la somme des montants budgétés hors lignes de provision (WF-RIS-0050, glossaire) et se
        lit dans les indicateurs, jamais en sommant ces montants.
    reestimated_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Montant réestimé, calculé depuis les grandeurs courantes de la ligne (WF-DEV-0020) —
        celles de sa dernière réestimation depuis la grille ou par l'import (WF-RAE-0040) ; pour
        une ligne que personne n'a réestimée, celles de la référence, ou de l'avenant dont la
        fusion les a changées (WF-REV-0050), chiffrées aux taux conservés par la révision
        courante (WF-REV-0060) et sur son année de consommation courante (WF-RAE-0010) — : à
        taux horaires inchangés, le montant budgété reporté sur l'année de consommation
        courante. C'est ce montant que le reste à engager compte pour une ligne d'une tâche non
        terminée, démarrée ou non, réestimée ou non. Il est le montant aux taux de l'année de
        référence projeté sur son année de consommation
        courante au taux d'inflation du projet, composé une fois par année écoulée depuis
        l'année de référence, chaque part d'une tâche à cheval sur plusieurs années projetée
        sur la sienne (WF-DEV-0030, WF-DEV-0040). Une ligne dont la tâche se place deux ans
        après l'année de référence, à 2 % d'inflation, le porte supérieur de 4,04 % à son
        montant aux taux de l'année de référence (WF-DEV-0050). Une ligne de provision n'est
        pas projetée.
    previous_quantity:
      anyOf: [{ $ref: ../common.yaml#/Decimal }, { type: 'null' }]
      description: >-
        Quantité au reste à engager précédent, que la grille de reste à engager présente à côté
        de la courante (WF-RAE-0040), lue dans la ligne et non dans une autre révision
        (WF-ARC-0020) ; nulle avant la première revue.
    previous_hours:
      anyOf: [{ $ref: ../common.yaml#/Hours }, { type: 'null' }]
      description: >-
        Charge au reste à engager précédent (WF-RAE-0040) ; nulle avant la première revue, et
        pour une ligne sans charge, comme `hours`.
    previous_unit_disbursement:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: >-
        Débours unitaire au reste à engager précédent (WF-RAE-0040) ; nul avant la première
        revue, et pour une ligne de main-d'œuvre, comme `unit_disbursement`.
    previous_reestimated_amount:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: >-
        Montant réestimé au reste à engager précédent, inflation comprise, que la grille de
        reste à engager présente à côté du courant (WF-RAE-0040), avec les grandeurs dont il
        a été calculé (`previous_quantity`, `previous_hours`, `previous_unit_disbursement`) ;
        nul avant la première revue.
    consumption_year:
      anyOf: [{ $ref: ../common.yaml#/Year }, { type: 'null' }]
      description: Année de consommation, déduite du planning (WF-DEV-0040).
    is_computed:
      type: boolean
      description: >-
        Vrai pour une ligne de provision, dont le montant est calculé depuis le
        risque et jamais saisi (WF-RIS-0010).
    uses_inactive_object:
      type: boolean
      description: >-
        Calculé : vrai quand la catégorie de coût, le rôle de ressource ou la nature de
        la ligne est désactivé dans le référentiel ; la ligne reste lisible, la grille
        la signale (WF-REF-0010). Le refus d'une saisie qui emploierait un objet
        désactivé est inchangé (`INACTIVE_REFERENCE_OBJECT`).
    remaining_entry:
      allOf: [{ $ref: '#/EntryAvailability' }]
      description: >-
        Si la ligne accepte une réestimation au reste à engager, et sinon ce qui lui
        manque, dans l'ordre de `CommandCondition` : les lignes d'une tâche terminée ne se
        modifient pas (`task_not_completed`, WF-RAE-0040) ; une ligne de provision ne se
        réestime jamais, son montant étant celui que son risque calcule et le reste à engager le
        comptant pour ce montant (`line_not_provision`, WF-RIS-0010, WF-RAE-0010). La grille le
        lit ligne par ligne, sans déduire la règle de l'avancement ni de la nature de la ligne.
    bearing_task_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Tâche porteuse, résolue à la lecture.
    bearing_task_label:
      anyOf: [{ type: string }, { type: 'null' }]

LinkType:
  type: string
  enum: [finish_to_start, start_to_start, finish_to_finish, start_to_finish]
  description: Les quatre types de liaison (WF-PLA-0030).

PredecessorWrite:
  type: object
  required: [predecessor_node_id, link_type, lag]
  description: >-
    Liaison d'une tâche à l'un de ses prédécesseurs, avec son décalage dans son unité :
    négatif, c'est une avance (WF-PLA-0030).
  properties:
    predecessor_node_id: { $ref: ../common.yaml#/Uuid }
    link_type: { $ref: '#/LinkType' }
    lag: { $ref: '#/Lag' }

Predecessor:
  description: >-
    Liaison telle que la lecture la rend : le numéro de ligne du prédécesseur, calculé
    comme `row_number` dans la numérotation de toute la structure, qu'il soit ou non
    retenu par la recherche et les filtres (WF-PLA-0080).
  allOf:
    - $ref: '#/PredecessorWrite'
    - type: object
      required: [predecessor_row_number]
      properties:
        predecessor_row_number:
          type: integer
          minimum: 1
          readOnly: true

PredecessorsReplace:
  type: object
  required: [predecessors, lock_version]
  properties:
    predecessors:
      type: array
      items: { $ref: '#/PredecessorWrite' }
    lock_version: { $ref: ../common.yaml#/LockVersion }

TrackingEntry:
  type: object
  required: [kind]
  properties:
    kind:
      type: string
      enum: [timeline, milestone_tracking]
    timeline_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]

Timeline:
  type: object
  required: [timeline_id, label]
  description: Chronologie nommée, à laquelle des tâches sont inscrites (WF-PLA-0140, WF-PLA-0060).
  properties:
    timeline_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 200 }

TimelineCreate:
  type: object
  required: [label]
  description: >-
    Une chronologie créée, sans inscription (`createTimeline`, WF-PLA-0140) : son nom, de 1 à 200
    caractères, jamais blanc, comme celui qu'elle porte lue (`Timeline.label` ; D-12, J-13).
  properties:
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 200 }

NodeCreate:
  type: object
  required: [kind, parent_id]
  description: >-
    Le nœud créé prend place sous `parent_id`, après le frère que nomme `after_node_id`. Les
    lignes d'une tâche précèdent toujours ses sous-tâches (`Node.position`) : nul, une ligne se
    place en tête des lignes, une tâche en tête des sous-tâches ; absent, une ligne se place
    après la dernière ligne, une tâche après la dernière sous-tâche. Un `after_node_id` d'un
    autre genre que le nœud créé se replie sur la frontière entre lignes et sous-tâches : une
    ligne envoyée après une sous-tâche se place après la dernière ligne, une tâche envoyée après
    une ligne en tête des sous-tâches (#1187). Un `after_node_id` qui n'est pas un frère sous le
    parent visé — un nœud d'un autre parent, ou qui n'est pas de la structure — est refusé par
    422 `VALIDATION_FAILED`, `fields[].pointer` à `/after_node_id`, motif `NODE_NOT_SIBLING`,
    rien n'étant écrit : la grille désigne la place par le nœud qu'elle lit, jamais par un rang
    qu'une lecture filtrée ne lui permet pas de compter (#1183).
  properties:
    kind: { $ref: '#/NodeKind' }
    parent_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    after_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    task: { $ref: '#/TaskFacetWrite' }
    estimate_line: { $ref: '#/EstimateLineWrite' }

TaskFacetWrite:
  type: object
  required: [label]
  description: >-
    Champs saisissables d'une tâche, à sa création (WF-PLA-0130). Les valeurs calculées sont
    refusées. La durée se saisit dans son unité (WF-PLA-0160) ; le début et la fin,
    saisissables en mode manuel, sont une date et des heures de travail écoulées
    (WF-DAT-0100) ; une date sur un jour sans aucune heure travaillée au calendrier de la
    tâche — sans ligne de main-d'œuvre, le calendrier par défaut (WF-PLA-0010) — est refusée,
    nommant le jour travaillé suivant (`NON_WORKING_DAY`, WF-PLA-0020), comme à la modification
    (`TaskFacetUpdate` ; #1345). Le rattachement à un lot ou à un poste est accepté de toute
    tâche de la structure principale et suit les règles de `TaskFacetUpdate`, le parent de la
    tâche créée (`NodeCreate.parent_id`) disant si la tâche d'un poste reste sous celle de son
    lot.
  properties:
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    scheduling_mode: { $ref: '#/SchedulingMode' }
    duration: { $ref: '#/Duration' }
    start:
      anyOf: [{ $ref: ../common.yaml#/WorkInstant }, { type: 'null' }]
    finish:
      anyOf: [{ $ref: ../common.yaml#/WorkInstant }, { type: 'null' }]
    order_item_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    work_package_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]

TaskFacetUpdate:
  type: object
  required: [lock_version]
  minProperties: 2
  description: >-
    Modification d'une tâche, cellule par cellule (WF-IHM-0040) : seul le compteur lu est
    exigé, tout autre champ est facultatif, et seul ce qui est envoyé change — un champ absent
    reste ce qu'il était. Les mêmes champs qu'à la création (`TaskFacetWrite`), à ceci près que
    le début et la fin se saisissent sans leurs heures, que le serveur complète sur le
    calendrier de la tâche (`WorkInstantWrite`, #1244), et qu'une date sur un jour sans heure
    travaillée à ce calendrier est refusée, nommant le jour travaillé suivant (`NON_WORKING_DAY`,
    WF-PLA-0020 ; #1271) ; une valeur
    que le serveur calcule pour ce nœud est refusée (`COMPUTED_VALUE`, WF-IHM-0030) — ainsi le
    mode d'une récapitulative, toujours automatique et jamais saisissable (`scheduling_mode`
    envoyé sur elle, même `automatic`, WF-PLA-0040) —, et un champ
    que le nœud n'accepte pas, ni saisi ni calculé pour lui — la durée d'un jalon, qui n'en a pas
    à saisir (WF-PLA-0050) —, par `FIELD_NOT_ACCEPTED` (`editable_fields` ; EP-14/L42s).

    Le rattachement au lotissement (WF-PLA-0170) : `work_package_id` ou `order_item_id`
    rattache la tâche, récapitulative, feuille ou jalon, à ce lot ou à ce poste, `null` retire
    le rattachement. L'échange se fait en une écriture : `{work_package_id: null, order_item_id:
    X}` sur une tâche qui porte un lot retire le lot et rattache le poste. Le refus est un
    422 `VALIDATION_FAILED`, `fields` sur le champ envoyé, une entrée par motif qui s'applique —
    `WORK_BREAKDOWN_ITEMS_EXCLUSIVE` et `WORK_BREAKDOWN_ITEM_ALREADY_ATTACHED` rendus ensemble
    quand l'un et l'autre s'appliquent :
    `WORK_BREAKDOWN_MAIN_STRUCTURE_ONLY` quand la tâche n'est pas de la structure principale —
    d'un différentiel ou du devis propre d'un risque, qui n'en portent pas ; `null` y est
    accepté, qui ne change rien — ; `UNKNOWN_WORK_BREAKDOWN_ITEM` quand le lotissement du
    projet n'a pas ce lot ou ce poste ; `WORK_BREAKDOWN_ITEMS_EXCLUSIVE`, sans paramètre, quand
    les deux sont envoyés non nuls — chacun refusé à son champ —, ou que l'un est envoyé non nul
    quand l'autre est porté et n'est pas mis à `null` dans le même corps — « jamais aux deux »,
    le rattachement « d'une même tâche à un lot et à un poste » est refusé ;
    `WORK_BREAKDOWN_ITEM_ALREADY_ATTACHED` quand une autre tâche porte déjà ce lot ou ce poste —
    « un lot ou un poste n'y est porté que par une tâche à la fois », « le rattachement d'une
    tâche à un poste déjà porté par une autre est refusé » —, `fields[].params.conflicting_object_id`
    nommant le nœud de cette tâche et `conflicting_object_label` son libellé, la grille de
    planning, filtrée, pouvant ne pas la lire ; `ORDER_ITEM_OUTSIDE_WORK_PACKAGE` quand le
    rattachement sortirait la tâche d'un poste du sous-arbre de la tâche de son lot — un poste
    rattaché à une tâche hors du sous-arbre de la tâche de son lot, ou un lot rattaché à une
    tâche dont le sous-arbre ne contient pas la tâche de l'un de ses postes —,
    `fields[].params.work_package_task` nommant la tâche du lot et `order_item_tasks` celles des
    postes en cause, chacune par son nœud et son libellé, comme l'échec d'une fusion (Vérif de
    WF-PLA-0170 ; WF-IHM-0080 ; EP-14/L42s).
  properties:
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    scheduling_mode: { $ref: '#/SchedulingMode' }
    duration: { $ref: '#/Duration' }
    start:
      anyOf: [{ $ref: ../common.yaml#/WorkInstantWrite }, { type: 'null' }]
    finish:
      anyOf: [{ $ref: ../common.yaml#/WorkInstantWrite }, { type: 'null' }]
    work_package_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Le lot du lotissement à porter, ou `null` pour retirer le rattachement.
    order_item_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Le poste du lotissement à porter, ou `null` pour retirer le rattachement.
    lock_version: { $ref: ../common.yaml#/LockVersion }

EstimateLineWrite:
  type: object
  required: [quantity]
  description: >-
    Champs saisissables d'une ligne de devis, à sa création (WF-DEV-0020) : le rôle et la
    charge pour une ligne de main-d'œuvre, la catégorie et le débours unitaire pour une autre ;
    un champ que la ligne n'accepte pas — le débours d'une ligne de main-d'œuvre, le rôle ou la
    charge d'une autre — est refusé par 422, motif `FIELD_NOT_ACCEPTED` sur son champ
    (EP-14/L42s). Un rôle envoyé fait de la ligne une ligne de main-d'œuvre, dont la catégorie
    est celle du rôle, calculée (Vérif de WF-DEV-0020) : la catégorie n'est pas exigée ; envoyée,
    celle du rôle est acceptée, une autre refusée par 422 `VALIDATION_FAILED`, `fields` sur
    `/estimate_line/cost_category_id`, motif `COMPUTED_VALUE`, la grille nommant ce dont elle
    dépend (`resource_role`, `getComputedValueDependencies`, WF-IHM-0030). Sans rôle, la
    catégorie est exigée : absente, refusée par `VALUE_REQUIRED` sur le même champ.
  properties:
    label:
      type: string
      minLength: 1
      pattern: '\S'
      maxLength: 300
      description: >-
        Facultatif : absent, le serveur compose le libellé de celui de la tâche qui porte la
        ligne et, s'il y en a un, de celui de son rôle, séparés par un tiret cadratin entre deux
        espaces — « Mise en service — Technicien de mise en service » —, tronqué à 300
        caractères ; envoyé, il est pris tel quel, non vide (WF-DEV-0020). Le libellé reste
        modifiable (`EstimateLineUpdate`).
    cost_category_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        Exigée sans rôle ; d'une ligne de main-d'œuvre, celle du rôle, calculée — envoyée, elle
        doit être la sienne.
    quantity: { $ref: ../common.yaml#/Decimal }
    resource_role_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    hours:
      anyOf: [{ $ref: ../common.yaml#/Hours }, { type: 'null' }]
    unit_disbursement:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
    payment_delay_days:
      anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
    subproject_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]

EstimateLineUpdate:
  type: object
  required: [lock_version]
  minProperties: 2
  description: >-
    Modification d'une ligne de devis, cellule par cellule (WF-IHM-0040) : seul le compteur
    lu est exigé, tout autre champ est facultatif, et seul ce qui est envoyé change — un
    champ absent reste ce qu'il était. Les mêmes champs qu'à la création
    (`EstimateLineWrite`) ; un champ que la ligne n'accepte pas — le débours d'une ligne de
    main-d'œuvre, le rôle ou la charge d'une autre, le délai de paiement d'une ligne de
    provision, qui n'en porte pas (WF-DEV-0020, WF-IND-0100 ; EP-14/L42s) — est refusé par 422
    `VALIDATION_FAILED`, `fields` sur son champ, motif `FIELD_NOT_ACCEPTED`, et le nœud dit
    lesquels il accepte (`editable_fields`). Le délai de paiement se saisit sur une ligne de
    main-d'œuvre comme sur une ligne hors main-d'œuvre, nul par défaut pour la première
    (WF-DEV-0020 ; #785). La catégorie d'une ligne de main-d'œuvre est celle de son rôle,
    calculée : un rôle changé lui donne la catégorie du nouveau rôle, et une catégorie envoyée
    sur elle qui n'est pas celle de son rôle — le rôle envoyé dans le même corps, ou celui
    qu'elle porte — est refusée par 422 `VALIDATION_FAILED`, `fields` sur `/cost_category_id`,
    motif `COMPUTED_VALUE`, comme toute valeur calculée (`resource_role`, WF-DEV-0020,
    WF-IHM-0030) ; la sienne ne change rien, comme à la création (`EstimateLineWrite`).
  properties:
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    cost_category_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        La catégorie d'une ligne hors main-d'œuvre ; une ligne de main-d'œuvre tient la sienne
        de son rôle, et en refuse une autre (`COMPUTED_VALUE`).
    quantity: { $ref: ../common.yaml#/Decimal }
    resource_role_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    hours:
      anyOf: [{ $ref: ../common.yaml#/Hours }, { type: 'null' }]
    unit_disbursement:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
    payment_delay_days:
      anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
    subproject_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        Le sous-projet de la ligne, ou `null` pour la passer hors sous-projet. Celui d'une ligne de
        provision est celui que son risque désigne, calculé : envoyé sur elle, il est refusé par
        422 `COMPUTED_VALUE`, comme ses grandeurs (WF-IHM-0030), et se change par le risque
        (`updateRisk`, `update_provision`, WF-RIS-0010) ; un collage refuse la cellule de même.
        Une ligne dont la tâche est démarrée ou terminée ne quitte pas un sous-projet qui a reçu
        des coûts réels, une part de ces coûts lui revenant : la passer à un autre sous-projet ou
        hors sous-projet est refusé par 422 `VALIDATION_FAILED`, `fields` sur `/subproject_id`,
        motif `SUBPROJECT_HAS_ACTUAL_COSTS`, `params.subproject` nommant le sous-projet quitté
        (`subproject_id`, `label`), et la ligne ne nomme pas ce champ dans `editable_fields`. Une
        ligne d'une tâche non démarrée change de sous-projet (WF-PRJ-0050 ; C-359, #1066). Un
        collage et un import refusent de même la cellule ou la ligne qui la déplacerait
        (`PasteRejection`, `ImportRejection` ; #1152).
    lock_version: { $ref: ../common.yaml#/LockVersion }

NodeMove:
  type: object
  required: [node_ids, parent_id, lock_version]
  description: >-
    Déplacement de nœuds sous un parent. Un déplacement qui sortirait la tâche d'un poste du
    sous-arbre de la tâche de son lot rattaché — la tâche du poste, ou une tâche qui la
    contient — est refusé (WF-PLA-0170) : 422 `VALIDATION_FAILED`, `fields[].pointer` sur le
    nœud déplacé en cause (`/node_ids/0`), `fields[].code` à `ORDER_ITEM_OUTSIDE_WORK_PACKAGE`,
    `fields[].params.work_package_task` et `order_item_tasks` nommant la tâche du lot et celles
    des postes, chacune par son nœud et son libellé (`node_id`, `label`) : la grille, filtrée,
    peut ne pas les lire (WF-PLA-0170, WF-IHM-0080 ; EP-14/L42s). Une sélection se juge sur la
    structure que le déplacement laisserait, tous ses nœuds déplacés : un refus qui nomme un
    nœud nomme le premier en cause dans l'ordre du plan de la structure lue, et `LINK_CYCLE` la
    boucle que ferme le déplacement de celui-ci (#1169) : l'ordre du refus est celui du plan,
    l'ordre de `node_ids` ne règle que le placement. Les nœuds déplacés prennent place sous
    `parent_id`, dans l'ordre de `node_ids`, après le frère que nomme `after_node_id`, selon la
    règle de `NodeCreate` : les lignes d'une tâche précèdent toujours ses sous-tâches ; nul, une
    ligne se place en tête des lignes, une tâche en tête des sous-tâches ; absent, une ligne
    après la dernière ligne, une tâche après la dernière sous-tâche, hors nœuds déplacés — un
    nœud déplacé ne compte pas parmi les frères qu'il suivrait — ; un `after_node_id` d'un autre
    genre se replie sur la frontière entre lignes et sous-tâches, une ligne après une sous-tâche
    se plaçant après la dernière ligne, une tâche après une ligne en tête des sous-tâches. Une
    sélection qui mêle lignes et tâches applique cette règle à chaque nœud, dans l'ordre de
    `node_ids` : le premier nœud de chaque genre prend la place que la règle lui donne après
    `after_node_id`, et chacun des suivants se place après le précédent de son genre — les
    lignes déplacées restent ensemble parmi les lignes, les tâches parmi les sous-tâches (#1187 ;
    `nodes_move_mixed`). Un `after_node_id` qui n'est pas un frère sous le parent visé — un nœud
    d'un autre parent, l'un des nœuds déplacés, ou un nœud qui n'est pas de la structure — est
    refusé par 422 `VALIDATION_FAILED`, `fields[].pointer` à `/after_node_id`, motif
    `NODE_NOT_SIBLING`, rien ne bougeant (#1183). Une ligne de provision parmi `node_ids` est
    refusée par 422 `VALIDATION_FAILED`, `fields[].pointer` sur elle, motif
    `PROVISION_LINE_MOVED_BY_RISK`, `fields[].params.risk` nommant son risque : sa tâche se
    désigne par le formulaire du risque (WF-RIS-0010 ; #1227).
  properties:
    node_ids:
      type: array
      minItems: 1
      items: { $ref: ../common.yaml#/Uuid }
    parent_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    after_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    lock_version: { $ref: ../common.yaml#/LockVersion }

ProgressUpdate:
  type: object
  required: [progress, lock_version]
  description: >-
    Démarre, termine ou rouvre une tâche, le geste d'une carte du Kanban
    (`KanbanCommandAvailability.progress`). La date est celle du geste par défaut, et la
    terminaison situe la valeur acquise (WF-RAE-0030, WF-IND-0030, WF-PLA-0130). Une tâche
    terminée se rouvre : un jalon en le ramenant à « non démarrée », ses dates de démarrage et
    de terminaison effacées — seul cas où une tâche revient à cet état —, toute autre tâche en
    la repassant à « démarrée » (WF-RAE-0030). `not_started` envoyé pour une tâche qui n'est pas un
    jalon
    terminé est refusé par 409, `missing_condition` à `completed_milestone` : une tâche
    démarrée par erreur se corrige en annulant la saisie (WF-IHM-0110). Le passage direct de
    non démarrée à terminée n'est ouvert qu'à un jalon, qui ne passe jamais par l'état
    démarré : `completed` sur un jalon non démarré écrit `completed_on` et `started_on` à
    `occurred_on`, une tâche terminée sans avoir été démarrée prenant pour date de démarrage
    celle de sa terminaison, sans exception (WF-PLA-0130). L'opération est refusée sur une
    récapitulative, dont l'état est dérivé (WF-PLA-0040, WF-PLA-0050).
  properties:
    progress: { $ref: '#/TaskProgress' }
    occurred_on: { $ref: ../common.yaml#/PlanningDate }
    lock_version: { $ref: ../common.yaml#/LockVersion }

RemainingUpdate:
  type: object
  required: [reestimated_amount_basis, lock_version]
  description: >-
    Réestime une ligne dont la tâche n'est pas terminée ; un reste à engager nul pour
    toutes les lignes d'une tâche la termine, à la date portée par `completed_on`
    (WF-RAE-0040, WF-RAE-0010, WF-PLA-0130). Une tâche non démarrée qui n'est pas un jalon
    passe alors par l'état démarré, démarrée et terminée à cette même date : seul un jalon
    va directement de non démarré à terminé (WF-RAE-0030).
  properties:
    reestimated_amount_basis:
      type: object
      description: Les grandeurs saisies dont le montant réestimé est recalculé.
      properties:
        quantity: { $ref: ../common.yaml#/Decimal }
        hours:
          anyOf: [{ $ref: ../common.yaml#/Hours }, { type: 'null' }]
        unit_disbursement:
          anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
    reason:
      anyOf: [{ type: string }, { type: 'null' }]
    completed_on:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: >-
        Date de terminaison de la tâche, demandée à la validation quand la saisie la termine —
        la dernière de ses lignes encore ouvertes mise à zéro —, proposée par l'écran au jour
        courant et modifiable (WF-RAE-0040, WF-PLA-0130). Exigée dans ce cas : sans elle, la
        saisie est refusée par un motif `COMPLETION_DATE_REQUIRED` sur `/completed_on`,
        `fields[].params.task_node_id` nommant la tâche, et rien n'est écrit ; l'écran demande
        la date et rejoue la saisie. Pour une tâche non démarrée, jalon compris, la même date
        est aussi celle de son démarrage (`started_on`, WF-PLA-0130) ; une tâche qui n'est pas
        un jalon passe par l'état démarré (WF-RAE-0030). Ignorée quand la saisie ne termine pas
        la tâche.
    lock_version: { $ref: ../common.yaml#/LockVersion }

UndoResult:
  type: object
  required: [undone, written, remaining_depth]
  description: >-
    Annule ou rétablit la dernière modification de l'historique de l'appelant sur la révision
    (`undoLastChange`, qui dit cet historique). Une annulation est une modification comme une
    autre : elle rend ce qu'une écriture rend (`written`), et elle est refusée par 409 si une
    modification postérieure porte sur le même objet, `UNDO_CONFLICT` le nommant (WF-IHM-0110). Les saisies de risque —
    création, modification, réexamen, suppression — sont dans le même historique que celles des
    grilles (WF-RIS-0020) : leur annulation nomme le risque rendu à son état précédent. Toute
    annulation et tout rétablissement qui rendraient un sous-projet supprimé depuis — à la provision
    d'un risque créé, modifié ou supprimé, ou à une ligne de devis par une écriture de la grille, la
    suppression d'une ligne ou d'une tâche et de ses lignes comprise — sont refusés par 409
    `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `restored_subproject_exists`, et ne
    défont ni ne rétablissent rien (décision de l'auteur, #732). De même, toute annulation et tout
    rétablissement qui recréeraient la ligne de provision d'un risque sur une structure principale
    sans tâche, ou avec une catégorie qui n'est plus active et de type provision pour risques, sont
    refusés par `at_least_one_task` ou `active_provision_category` (`undoLastChange`,
    `redoLastUndo` ; WF-RIS-0010, #795).
  properties:
    undone:
      type: object
      required: [kind, node_ids, risk_ids]
      properties:
        kind: { $ref: '#/UndoneKind' }
        node_ids:
          type: array
          description: >-
            Les nœuds que l'annulation, ou le rétablissement, rend à leur état précédent ; vide
            pour une saisie de risque.
          items: { $ref: ../common.yaml#/Uuid }
        risk_ids:
          type: array
          description: >-
            Les risques que l'annulation, ou le rétablissement, rend à leur état précédent
            (WF-IHM-0110, WF-RIS-0020) ; vide pour une saisie des grilles.
          items: { $ref: ../common.yaml#/Uuid }
    written:
      anyOf: [{ $ref: '#/NodesWritten' }, { type: 'null' }]
      description: >-
        Ce que l'annulation, ou le rétablissement, a écrit dans une structure, comme toute
        écriture de grille : nœuds rendus à leur état, ancêtres recalculés, tâches redatées,
        totaux et compteur de la structure, pour que la grille montre juste sans relire la
        structure et garde le compteur que sa saisie suivante portera (WF-IHM-0040,
        WF-IHM-0110). Nul pour une saisie de risque, qui n'écrit dans une structure que par la
        ligne de provision de son risque : la grille relit alors sa structure.
    remaining_depth:
      type: integer
      minimum: 0
      description: >-
        Les modifications qui restent à annuler dans l'historique de l'appelant sur la révision,
        après celle-ci — pour le rétablissement, celles qui restent à rétablir.

UndoneKind:
  type: string
  enum:
    - cell
    - node_create
    - node_delete
    - node_move
    - paste
    - link
    - progress
    - remaining
    - tracking
    - structure_update
    - risk_create
    - risk_update
    - risk_review
    - risk_delete
  description: >-
    La nature de la modification annulée ou rétablie, que le front dit par son catalogue
    (WF-ARC-0110) : une cellule (`updateTaskFacet`, `updateEstimateLine`), une création ou une
    suppression de nœud, un déplacement, un collage, une liaison (`setPredecessors`), un
    avancement, une réestimation (`setLineRemaining`), une inscription aux suivis, la date de
    début de planning ou le libellé d'une structure (`updateCostStructure`) ; ou une saisie de
    risque — création, modification, réexamen, suppression (WF-RIS-0020).

PastePreview:
  type: object
  required: [target_node_id, target_column, rows]
  description: >-
    Bloc collé depuis un tableur, sur la cellule visée : le nœud et sa colonne. L'aperçu dit
    ce qui sera écrit et ce qui sera refusé, avec le motif de chaque refus ; rien n'est écrit
    sans confirmation, et la confirmation écrit les lignes valides, jamais les lignes refusées
    (WF-IHM-0050).

    La première colonne du bloc remplit `target_column` ; chacune des suivantes remplit la
    colonne suivante de la facette du nœud visé, dans l'ordre de `NodeColumn` — pour une
    ligne de devis collée sur son libellé : la catégorie, le rôle, la quantité, la charge,
    le débours unitaire, le sous-projet, le délai de paiement ; pour une tâche : la
    description, le mode, la durée, le début, la fin. Chaque ligne du bloc écrit la ligne de la
    grille à la même distance sous le nœud visé, dans l'ordre du plan. Sur un différentiel, les
    nœuds qu'il retire, que sa lecture rend à leur place en lecture seule (`NodeDifference`), ne
    comptent pas : le collage les saute, sans refus, et la ligne du bloc qui serait tombée sur l'un
    d'eux écrit le nœud suivant qui n'est pas retiré, les lignes suivantes du bloc les nœuds
    d'après — un bloc de deux lignes collé sur la ligne qui précède une ligne retirée écrit cette
    ligne, puis le nœud qui suit la ligne retirée (décision de l'auteur du 2026-10-22, #1278).
    `PastePlan.accepted` et `PasteRejection.row` comptent les lignes du bloc, jamais les nœuds
    sautés. Un bloc dont la cellule visée est elle-même sur un nœud retiré, qui n'accepte aucun
    champ (`editable_fields` vide), est refusé entier : `PastePlan.accepted` à `0`, et une seule
    `PasteRejection`, `row` à `0`, `column` la colonne visée, `code` à `PASTE_TARGET_REMOVED`,
    aucune autre ligne n'étant jugée ; l'ancre n'est pas reportée au nœud suivant, qui écrirait
    ailleurs que là où l'utilisateur a cliqué (décision de l'auteur, recadrage d'EP-16, #1361).
    Aucune cellule n'est décalée : une cellule qui tombe sur une colonne que sa ligne
    n'accepte pas est refusée, la ligne et la colonne nommées (`PastePlan.rejected`), sauf si
    elle est vide, qui n'écrit rien — un champ calculé pour ce nœud par `COMPUTED_VALUE`, un
    champ que sa nature refuse ou une colonne qu'aucune écriture ne porte, comme les montants,
    par `FIELD_NOT_ACCEPTED` (EP-14/L42s) ; le sous-projet d'une ligne qui ne peut pas le
    quitter, par `SUBPROJECT_HAS_ACTUAL_COSTS` (`PasteRejection`). Un bloc plus large que les
    colonnes de la facette à partir de la colonne visée est refusé par 422 (`PASTE_TOO_WIDE`,
    `params.max_columns`).
  properties:
    target_node_id: { $ref: ../common.yaml#/Uuid }
    target_column:
      allOf: [{ $ref: '#/NodeColumn' }]
      description: La colonne de la cellule visée, que la première colonne du bloc remplit.
    rows:
      type: array
      minItems: 1
      items:
        type: array
        items: { type: string }

PastePlan:
  type: object
  required: [paste_id, accepted, rejected]
  description: >-
    Ce qu'un collage écrira et ce qu'il refusera, chaque refus avec son motif et, quand il
    tient à une cellule, sa colonne (WF-IHM-0050). Une ligne du bloc dont une cellule est
    refusée est refusée entière : confirmé, le collage écrit les autres lignes et non celle-ci
    (`applyPaste`, `PasteApplied`) ; abandonné, il n'écrit rien.
  properties:
    paste_id: { $ref: ../common.yaml#/Uuid }
    accepted:
      type: integer
      minimum: 0
      description: >-
        Le nombre de lignes du bloc que la confirmation écrira. Sur un différentiel, un nœud
        retiré que le collage saute n'y est pas compté, et n'est pas refusé non plus : chaque
        ligne du bloc écrit le nœud suivant qui n'est pas retiré (`PastePreview`, #1278).
    rejected:
      type: array
      description: >-
        Les refus, dans l'ordre des lignes du bloc puis des colonnes ; une ligne refusée par
        plusieurs cellules y paraît pour chacune.
      items: { $ref: '#/PasteRejection' }

PasteRejection:
  type: object
  required: [row, code]
  description: >-
    Le refus d'une ligne d'un bloc collé, que l'aperçu annonce et que la confirmation redit :
    la ligne, et, quand il tient à une cellule, sa colonne, avec son motif (WF-IHM-0050). La
    confirmation en ajoute : le référentiel n'a pas de compteur, et elle juge de nouveau les lignes
    acceptées par l'aperçu ; une ligne devenue invalide entre-temps — une catégorie ou un rôle
    désactivés depuis l'aperçu, `INACTIVE_REFERENCE_OBJECT` — est refusée à son tour, sans être
    écrite, et redite dans `PasteApplied.rejected` comme les refus de l'aperçu (EP-14/L42q, #747).
    Une cellule qui nomme une catégorie ou un rôle désactivés n'est refusée, à l'aperçu comme à
    la confirmation, que si elle change la catégorie ou le rôle de sa ligne : celle qui nomme la
    catégorie ou le rôle que la ligne porte déjà, désactivés depuis, ne change rien et n'est pas
    refusée, comme le parent d'un nœud, la catégorie d'un rôle ou celle d'un risque
    (`updateOrgNode`, `updateResourceRole`, `updateRisk` ; EP-14/L42j, #747). Une
    cellule de la colonne `work_breakdown` collée sur une tâche d'un différentiel ou du devis
    propre d'un risque est refusée par `WORK_BREAKDOWN_MAIN_STRUCTURE_ONLY` : le rattachement
    n'existe que dans la structure principale (WF-PLA-0170 ; EP-14/L42k) ; collée sur une tâche
    de la structure principale, elle suit les règles du rattachement (`TaskFacetUpdate`), et
    `ORDER_ITEM_OUTSIDE_WORK_PACKAGE` porte dans `params` la tâche du lot et celles des postes
    (`work_package_task`, `order_item_tasks`), comme le refus d'une cellule (EP-14/L42s). Une
    cellule de la colonne `subproject` collée sur une ligne dont la tâche est démarrée ou terminée,
    et dont le sous-projet a reçu des coûts réels — une ligne qui ne nomme pas
    `estimate_line.subproject_id` dans `editable_fields` —, est refusée par
    `SUBPROJECT_HAS_ACTUAL_COSTS` si elle nomme un autre sous-projet, `params.subproject`
    nommant le sous-projet que la ligne ne peut pas quitter (`subproject_id`, `label`), comme
    `updateEstimateLine` ; une cellule qui nomme le sous-projet de la ligne ne la déplace pas, et
    n'est pas refusée, ni une cellule vide, qui n'écrit rien (`PastePreview`) (WF-PRJ-0050 ;
    C-359, #1152). Un collage dont la cellule visée est sur un nœud retiré par le différentiel est
    refusé entier par `PASTE_TARGET_REMOVED`, un seul refus, à la ligne `0`, sur la colonne
    visée : il tient à l'ancre, non à une ligne du bloc (`PastePlan` ; #1361).
  properties:
    row:
      type: integer
      minimum: 0
      description: >-
        La ligne du bloc refusée, comptée de zéro. C'est une ligne du bloc, jamais un nœud : sur
        un différentiel, les nœuds retirés que le collage saute ne la décalent pas, et aucun
        refus ne les nomme (`PastePreview`, #1278).
    column:
      allOf: [{ $ref: '#/NodeColumn' }]
      description: >-
        La colonne de la cellule refusée ; absente quand le refus porte sur la ligne
        entière.
    code: { $ref: ../common.yaml#/ErrorCode }
    params: { $ref: ../common.yaml#/ProblemParams }

PasteApplied:
  description: >-
    Ce que rend la confirmation d'un collage (WF-IHM-0050) : un succès partiel quand l'aperçu
    a refusé des lignes. Les lignes valides sont écrites en une seule opération et rendues comme
    toute écriture de grille (`NodesWritten`) ; les lignes refusées ne le sont pas, et chacune
    est redite avec son motif (`rejected`). Le plan retient le compteur de la structure lu à
    l'aperçu, et la confirmation est refusée par 412 si la structure a changé depuis, quel que
    soit le compteur envoyé (`PasteApply`) : la structure est celle que l'aperçu a jugée. Le
    référentiel, lui, a pu changer — une catégorie ou un rôle désactivés entre-temps — : les lignes
    acceptées du plan sont donc jugées de nouveau, et une ligne devenue invalide passe dans
    `rejected` avec son motif, sans être écrite (`PasteRejection`). Sans aucune
    ligne valide, rien n'est écrit : `nodes`, `ancestors`, `rescheduled` et `reinflated` sont
    vides, le compteur de la structure reste celui qui a été envoyé, et aucune entrée d'annulation
    n'est créée (WF-IHM-0110).
  allOf:
    - $ref: '#/NodesWritten'
    - type: object
      required: [rejected]
      properties:
        rejected:
          type: array
          description: >-
            Les refus de l'aperçu et ceux que la confirmation y ajoute en jugeant de nouveau les
            lignes acceptées, aucun écrit, dans l'ordre des lignes du bloc ; vide quand toutes les
            lignes du bloc sont écrites.
          items: { $ref: '#/PasteRejection' }

PasteApply:
  type: object
  required: [paste_id, confirmed, lock_version]
  description: >-
    Confirme un plan de collage : ses lignes acceptées sont écrites, ses lignes refusées ne le
    sont pas (WF-IHM-0050). Le compteur est celui de la structure dans laquelle le bloc
    s'écrit (`CostStructure.lock_version`), lu avec la page ou rendu par la dernière écriture
    (`NodesWritten.structure_lock_version`) ; périmé, le collage est refusé par 412 et rien
    n'est écrit (WF-IHM-0050, WF-IHM-0110). Le plan retient aussi le compteur de la structure lu
    à l'aperçu (`previewPaste`) : la structure changée depuis l'aperçu, la confirmation est
    refusée par 412 quel que soit le compteur envoyé, le plan ayant été jugé sur une autre
    structure (`params.expected_lock_version`, le compteur courant).
  properties:
    paste_id: { $ref: ../common.yaml#/Uuid }
    confirmed:
      type: boolean
      const: true
    lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: Le compteur de la structure lue, que le collage écrit.

RevisionComparison:
  type: object
  required: [from_revision_id, to_revision_id, items, totals, meta, amount_deltas]
  description: >-
    Comparaison de deux révisions marquées, rapprochée par l'identifiant de lignée
    (WF-REV-0080, WF-DAT-0030) : l'arbre de la structure principale de la révision comparée, avec
    les marques d'un différentiel, et les écarts de montants. Elle a la forme de la réponse de
    `listNodes` — `items`, `totals`, `meta` —, et se lit comme elle, entière ou par la fenêtre
    que ses filtres retiennent (#1193).
  properties:
    from_revision_id: { $ref: ../common.yaml#/Uuid }
    to_revision_id: { $ref: ../common.yaml#/Uuid }
    items:
      type: array
      description: >-
        Les nœuds de la révision comparée (`to_revision_id`) que la lecture retient, en parcours
        profondeur d'abord dans l'ordre du plan, sans pagination, comme `listNodes` les rend :
        chaque nœud avec son écart à la révision de base (`difference`, `changes`) et les champs
        que `fields` nomme, les nœuds retirés à la place qu'ils avaient dans la révision de
        base, en lecture seule. Une paire identique rend chaque nœud inchangé (WF-REV-0080,
        C-361).
      items: { $ref: '#/ComparedNodeRead' }
    totals:
      allOf: [{ $ref: '#/NodeTotals' }]
      description: >-
        Les totaux de la révision comparée, comme `listNodes` les rend : ceux des lignes
        retenues, sans les nœuds retirés, qui ne sont plus de sa structure.
    meta:
      allOf: [{ $ref: '#/NodeListMeta' }]
      description: Ce que la lecture dit de la structure principale de la révision comparée.
    amount_deltas:
      type: array
      description: >-
        Les écarts des montants budgétés et des montants réestimés, inflation comprise, par nature
        de coût et par sous-projet (WF-REV-0080), chacun nommé par
        son libellé, résolu à la lecture comme `AmountByKey.label` : l'écran ne joint rien
        (WF-ARC-0020). Rendus dans chaque réponse, comme `totals`, et calculés de même sur les
        lignes que la lecture retient, retirées comprises, quel que soit `kinds` : sans filtre, ceux
        de toute la structure ; d'un sous-arbre, les siens. L'écart se compte par ligne retenue,
        selon son parent dans la révision comparée (`to_revision_id`) : chaque ligne retenue y
        apporte ses écarts entiers, ses montants dans la révision comparée moins ceux de la
        révision de base, où qu'elle fût dans celle-ci. Une nature ou un sous-projet dont les deux
        écarts sont nuls est omis. Une ligne déplacée hors d'un sous-arbre n'en compte
        donc plus rien, et une ligne déplacée dedans y compte son écart entier, et non son seul
        montant dans la révision comparée ; une ligne retirée se compte à la place qu'elle avait.
        Les écarts de sous-arbres disjoints s'ajoutent ainsi à ceux de la structure entière, chaque
        ligne comptée une fois.
      items:
        type: object
        required: [dimension, key, label, budgeted_delta, reestimated_delta]
        properties:
          dimension:
            type: string
            enum: [cost_type, subproject]
          key:
            type: string
            description: L'identifiant de la nature ou du sous-projet, ou `unassigned` (WF-IND-0020).
          label:
            anyOf: [{ type: string }, { type: 'null' }]
            description: Le libellé de la nature ou du sous-projet ; nul pour la seule clé `unassigned`, que le front nomme.
          budgeted_delta:
            allOf: [{ $ref: ../common.yaml#/Money }]
            description: >-
              L'écart des montants budgétés de la nature ou du sous-projet, inflation comprise
              (WF-DEV-0020, WF-REV-0080) : la révision comparée (`to_revision_id`) moins la
              révision de base (`from_revision_id`), positif quand la comparée porte davantage —
              le sens où une tâche est dite ajoutée, et celui du devis en cours moins le devis
              comparé (`EstimateIndicators.delta_to_reference`). La comparaison d'une révision
              obtenue par fusion d'un différentiel avec la révision marquée qui la précède, sans
              autre modification entre les deux, restitue exactement les montants budgétés de ce
              différentiel.
          reestimated_delta:
            allOf: [{ $ref: ../common.yaml#/Money }]
            description: >-
              L'écart des montants réestimés de la nature ou du sous-projet, inflation comprise,
              dans le même sens (WF-REV-0080). Après une fusion, il ne vient que des lignes que le
              différentiel ajoute ou retire, de celles des tâches démarrées qu'il termine et de
              celles dont il change l'année de consommation : une ligne existante dont le
              différentiel ne modifie que le montant budgété n'y apporte rien.

ComparedNodeRead:
  type: object
  required: [node_id, row_number, level, lock_version, difference, changes]
  description: >-
    Un nœud de la comparaison (`RevisionComparison.items`), tel que `compareRevisions` le rend :
    les propriétés de `Node`, reprises de lui, dont seules sont exigées celles qu'une lecture rend
    toujours — `node_id`, `row_number`, `level` et `lock_version`, et la marque du nœud,
    `difference` et `changes` —, les autres n'étant rendues que si `fields` les nomme, ou toutes
    s'il est omis (#166, #1201, #1208). Ses facettes sont partielles de même. `Node`, que rend
    `listNodes`, ne change pas.
  properties:
    <<: *node_properties
    task:
      anyOf: [{ $ref: '#/ComparedTaskFacet' }, { type: 'null' }]
    estimate_line:
      anyOf: [{ $ref: '#/ComparedEstimateLineFacet' }, { type: 'null' }]
    difference:
      allOf: [{ $ref: '#/NodeDifference' }]
      description: >-
        L'écart du nœud à la révision de base (`from_revision_id`), que le serveur rend et que le
        front ne calcule pas (WF-REV-0080, C-361) : toujours rendu, que `fields` le nomme ou non,
        jamais nul.

ComparedTaskFacet:
  type: object
  description: >-
    La facette temps d'un nœud de la comparaison (`ComparedNodeRead.task`) : les propriétés de
    `TaskFacet`, reprises de lui, aucune exigée — une lecture avec `fields` ne rend que celles
    qu'il nomme (`task.label`), une lecture sans `fields` les rend toutes (#166, #1208).
  properties: *task_facet_properties

ComparedEstimateLineFacet:
  type: object
  description: >-
    La facette devis d'un nœud de la comparaison (`ComparedNodeRead.estimate_line`) : les
    propriétés d'`EstimateLineFacet`, reprises de lui, aucune exigée — une lecture avec `fields`
    ne rend que celles qu'il nomme (`estimate_line.label`), une lecture sans `fields` les rend
    toutes (#166, #1208).
  properties: *estimate_line_facet_properties
