# Révisions, structures de coûts et arbre commun (FBS-4.1, FBS-4.3, FBS-4.4, FBS-4.5).
#
# Une révision est un instantané complet (WF-REV-0030) ; elle possède en propre
# toutes les lignes qui la décrivent (WF-DAT-0010). L'arbre est commun au planning
# et au devis : les mêmes tâches, vues du côté du temps ou du côté de l'argent
# (§3.5.1). Une tâche porte ses lignes de devis (WF-DEV-0020).

RevisionStatus:
  type: string
  enum: [draft, marked]
  description: En cours d'élaboration, ou marquée — et alors immuable (WF-REV-0020, WF-REV-0090).

Revision:
  type: object
  required:
    - revision_id
    - project_id
    - status
    - is_reference
    - reference_year
    - available_commands
    - audit
    - lock_version
  properties:
    revision_id: { $ref: ../common.yaml#/Uuid }
    project_id: { $ref: ../common.yaml#/Uuid }
    version_name:
      anyOf: [{ type: string, maxLength: 100 }, { type: 'null' }]
      description: >-
        Nom de version saisi au marquage, unique parmi les révisions marquées du
        projet (WF-REV-0020). Nul tant que la révision est en cours.
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    status: { $ref: '#/RevisionStatus' }
    marked_at:
      anyOf: [{ $ref: ../common.yaml#/Timestamp }, { type: 'null' }]
    is_reference:
      type: boolean
      description: Caractère de révision de référence (WF-REV-0040, WF-REV-0090).
    reference_year:
      allOf: [{ $ref: ../common.yaml#/Year }]
      readOnly: true
      description: >-
        Année de référence de la révision, un de ses attributs (WF-REV-0090) : l'année dont les
        taux horaires chiffrent ses lignes. Fixée par le serveur à la création de la révision, à
        l'année courante, conservée par la révision et son instantané (WF-REV-0060, WF-REV-0030),
        jamais saisie. C'est l'année pour laquelle le calcul exige un taux horaire de chaque
        catégorie employée (WF-DEV-0010, `getMissingRates`), celle des montants « à l'année de
        référence » de la grille de devis (`base_amount`, WF-DEV-0050), et celle que la mise à
        jour des taux vise (`RateUpdateProposal.target_year`). Une révision créée en 2027 porte
        2027 ; la révision précédente, créée en 2026, garde 2026.
    snapshot:
      anyOf: [{ $ref: '#/RevisionSnapshot' }, { type: 'null' }]
    available_commands:
      type: array
      description: >-
        Commandes de la révision que l'appelant a la permission d'exercer, chacune
        disponible ou non, avec les conditions qui lui manquent (WF-IHM-0090). Une grille
        dont la commande de saisie est absente ou indisponible se présente en lecture
        seule.
      items: { $ref: '#/RevisionCommandAvailability' }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

RevisionCommand:
  type: string
  enum:
    - edit_planning
    - edit_estimate
    - edit_remaining
    - create_structure
    - merge_structure
    - mark
    - designate_reference
    - abandon
    - export_planning
    - export_estimate
    - export_remaining
    - export_task_tree_image
  description: >-
    Commandes portées par la révision : saisir le planning, le devis, le reste à
    engager — une commande par fonction, chacune gardée par sa permission
    (WF-ADM-0100) —, ouvrir un différentiel (WF-REV-0100) et le fusionner (WF-REV-0050),
    la marquer, la désigner comme référence, l'abandonner (WF-REV-0010, WF-REV-0020,
    WF-REV-0040) — la fusion, le marquage, la désignation et l'abandon chacun gardés par
    sa permission propre, `structure_merge`, `revision_mark`, `reference_designate`,
    `revision_abandon` : un rôle qui marque sans fusionner voit `mark` et non
    `merge_structure` (WF-ADM-0100) ; en exporter le planning MS Project, le devis, le reste à engager ou
    l'image de l'arborescence de tâches — une commande par nature d'export
    (`ExportRequest.kind`), dans l'ordre de l'énumération (WF-INTF-0050, WF-INTF-0110,
    WF-INTF-0130, WF-PLA-0120). Un export se dit de la révision qu'il lit, marquée
    comme en cours ; un import, qui écrit dans la révision en cours ou la crée, est une
    commande du projet (`ProjectCommand`). Un export relève de la consultation
    (WF-CYC-0110) : il est gardé par la permission de consulter la fonction de sa nature
    — le planning et l'image de l'arborescence celle du planning (FBS-4.3), le devis celle
    du devis (FBS-4.4), le reste à engager celle du reste à engager (FBS-4.5) — et ne
    manque d'aucune condition : sur une révision marquée, pendant un marquage, sur un
    projet terminal, il reste disponible. Un export est présent ou absent.

RevisionCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/RevisionCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Vide lorsque la commande est disponible.
      items: { $ref: projects.yaml#/CommandCondition }

RevisionSnapshot:
  type: object
  required: [inflation_rate, win_probability, employed_reference]
  description: >-
    Ce que la révision conserve de son contexte : les paramètres du projet qui ont
    servi à la calculer et les seules valeurs du référentiel qu'elle emploie
    (WF-REV-0030).
  properties:
    inflation_rate: { $ref: ../common.yaml#/Percent }
    win_probability: { $ref: ../common.yaml#/Percent }
    employed_reference: { $ref: '#/EmployedReference' }

EmployedReference:
  type: object
  required: [resource_roles, calendars, cost_categories, hourly_rates]
  description: Images des objets du référentiel employés, figées au marquage (WF-REV-0030, WF-REF-0130).
  properties:
    resource_roles:
      type: array
      items: { $ref: reference.yaml#/ResourceRole }
    calendars:
      type: array
      items: { $ref: reference.yaml#/Calendar }
    cost_categories:
      type: array
      items: { $ref: reference.yaml#/CostCategory }
    hourly_rates:
      type: array
      items: { $ref: reference.yaml#/HourlyRate }

RevisionCreate:
  type: object
  description: >-
    Crée la révision en cours par copie de la dernière révision marquée
    (WF-REV-0010, WF-DAT-0010). Un projet n'en comporte qu'une à la fois.
  properties:
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    apply_rate_update:
      type: boolean
      default: false
      description: >-
        Applique la mise à jour des taux proposée par WF-REV-0060. Jamais imposée :
        la valeur par défaut conserve les taux de la révision source.

RevisionMark:
  type: object
  required: [version_name, lock_version]
  description: >-
    Marque la révision. Le marquage fige la révision et calcule ses indicateurs
    dans la même transaction (WF-REV-0020, WF-DAT-0040) ; il est confié au worker
    et renvoie une tâche de fond (WF-ARC-0090).
  properties:
    version_name: { type: string, minLength: 1, maxLength: 100 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    lock_version: { $ref: ../common.yaml#/LockVersion }

ReferenceDesignation:
  type: object
  required: [revision_id, confirmed]
  description: >-
    Désigne la révision de référence parmi les révisions marquées. Corrigible tant
    que le projet n'a ni coût réel ni révision marquée postérieure ; au-delà, la
    référence ne se déplace plus qu'à la contractualisation d'un avenant (WF-REV-0040).
  properties:
    revision_id: { $ref: ../common.yaml#/Uuid }
    confirmed:
      type: boolean
      const: true

RateUpdateProposal:
  type: object
  required: [categories]
  description: >-
    Écart de taux proposé catégorie par catégorie à la création d'une révision, quand son
    année de référence diffère de celle de la révision précédente. Une catégorie sans taux
    pour l'année retenue conserve son taux précédent, projeté par le taux d'inflation
    (WF-REV-0060).
  properties:
    target_year:
      allOf: [{ $ref: ../common.yaml#/Year }]
      description: >-
        L'année de référence de la révision créée (`Revision.reference_year`), pour laquelle
        les taux sont proposés ; les taux précédents sont ceux de l'année de référence de la
        révision dont elle est la copie (WF-REV-0060).
    categories:
      type: array
      items:
        type: object
        required: [cost_category_id, label, previous_amount, proposed_amount, source]
        properties:
          cost_category_id: { $ref: ../common.yaml#/Uuid }
          label:
            type: string
            minLength: 1
            maxLength: 200
            description: >-
              Le libellé de la catégorie, résolu à la lecture, pour que l'écran ne joigne rien.
          previous_amount: { $ref: ../common.yaml#/Money }
          proposed_amount: { $ref: ../common.yaml#/Money }
          source:
            type: string
            enum: [reference_rate, inflated_previous]

StructureKind:
  type: string
  enum: [main, amendment, risk]
  description: >-
    Nature de la structure de coûts : principale, différentiel d'avenant, ou devis
    propre d'un risque (WF-REV-0100, WF-REV-0050, WF-RIS-0030).

CostStructure:
  type: object
  required: [structure_id, revision_id, kind, label, is_merged, lock_version]
  properties:
    structure_id: { $ref: ../common.yaml#/Uuid }
    revision_id: { $ref: ../common.yaml#/Uuid }
    kind: { $ref: '#/StructureKind' }
    label: { type: string, maxLength: 300 }
    risk_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Renseigné pour une structure de nature `risk` (WF-RIS-0030).
    is_merged:
      type: boolean
      description: Vrai lorsque le différentiel a été fusionné dans la principale (WF-REV-0050).
    lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        Compteur de la structure, qui avance à chaque écriture dans son arbre — une cellule,
        un collage, un déplacement, une création, une suppression — comme à chaque
        modification de la structure elle-même. C'est lui qu'un collage porte
        (`PasteApply.lock_version`), et que toute écriture de grille rend
        (`NodesWritten.structure_lock_version`), pour que la grille le garde à jour
        (WF-IHM-0110).

StructureCreate:
  type: object
  required: [kind, label]
  description: >-
    Crée un différentiel ou le devis propre d'un risque. La structure principale n'est
    jamais créée ici : elle existe dès la création de la révision (WF-REV-0100).
  properties:
    kind:
      allOf: [{ $ref: '#/StructureKind' }]
      enum: [amendment, risk]
    label: { type: string, minLength: 1, maxLength: 300 }
    risk_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]

StructureMerge:
  type: object
  required: [confirmed, version_name]
  description: >-
    Fusionne le différentiel dans la structure principale : la fusion ne touche que
    les montants budgétés des lignes qu'il désigne. Elle s'applique à la révision en
    cours et la marque dans la même opération, d'où le nom de version exigé, et la
    révision produite devient la référence (WF-REV-0050). Confiée au worker.
  properties:
    confirmed:
      type: boolean
      const: true
    version_name: { type: string, minLength: 1, maxLength: 100 }

NodeKind:
  type: string
  enum: [task, estimate_line]
  description: >-
    Un nœud de l'arbre est une tâche ou une ligne de devis. La ligne est portée par
    la tâche sous laquelle elle est placée (WF-DEV-0020).

Node:
  type: object
  required: [node_id, lineage_id, kind, parent_id, position, row_number, level, computed_fields, editable_fields, lock_version]
  description: >-
    `row_number` et `level` sont calculés à la lecture. `lineage_id` est stable
    d'une révision à l'autre et fonde la comparaison, le diagramme temps/temps et
    les inscriptions aux suivis (WF-DAT-0030).
  properties:
    node_id: { $ref: ../common.yaml#/Uuid }
    lineage_id: { $ref: ../common.yaml#/Uuid }
    kind: { $ref: '#/NodeKind' }
    parent_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    position: { type: integer, minimum: 0 }
    row_number:
      type: integer
      minimum: 1
      description: >-
        Numéro de ligne, calculé à la lecture dans la numérotation de toute la structure
        — ses tâches et ses lignes, dans l'ordre du plan —, quels que soient ce que la
        lecture rend, ses filtres, sa recherche et son tri.
    level: { type: integer, minimum: 1 }
    task:
      anyOf: [{ $ref: '#/TaskFacet' }, { type: 'null' }]
    estimate_line:
      anyOf: [{ $ref: '#/EstimateLineFacet' }, { type: 'null' }]
    predecessors:
      type: array
      items: { $ref: '#/Predecessor' }
    computed_fields:
      type: array
      description: >-
        Champs saisissables — par le schéma d'écriture ou, pour l'avancement, par sa
        commande — que le serveur calcule pour ce nœud-ci : les dates d'une tâche en
        mode automatique, les dates, la durée et l'avancement d'une récapitulative, les
        grandeurs d'une ligne de provision. Le front les présente
        comme calculés et n'en propose pas la saisie (WF-IHM-0030) ; il ne déduit
        rien du mode ni de la nature du nœud.
      items: { $ref: '#/ComputedField' }
    editable_fields:
      type: array
      uniqueItems: true
      description: >-
        Champs de la facette que ce nœud-ci accepte en écriture, symétrique de
        `computed_fields` : une ligne de main-d'œuvre porte le rôle et la charge, une ligne
        hors main-d'œuvre le débours unitaire et le délai de paiement — nul pour la
        main-d'œuvre (§3.2.5, WF-DEV-0020) —, une ligne de provision ni les uns ni les autres ;
        une tâche en mode manuel porte ses dates, un jalon n'a pas de durée à
        saisir, une récapitulative ni durée, ni dates, ni avancement (WF-PLA-0130). Un champ
        calculé pour ce nœud n'y figure jamais. La grille n'offre la saisie d'une cellule que si
        son champ y figure, sans rien déduire de la nature de la catégorie ni du mode
        (WF-IHM-0040) ; ce que l'appelant a le droit d'écrire relève des commandes de la
        révision, pas de cette liste.
      items: { $ref: '#/EditableField' }
    lock_version: { $ref: ../common.yaml#/LockVersion }

ComputedField:
  type: string
  enum:
    - task.duration
    - task.start
    - task.finish
    - task.progress
    - estimate_line.quantity
    - estimate_line.hours
    - estimate_line.unit_disbursement

EditableField:
  type: string
  description: >-
    Champ d'une facette qu'une écriture porte — `TaskFacetUpdate`, `EstimateLineUpdate`, ou
    la commande d'avancement pour `task.progress` —, que le nœud nomme parmi ceux qu'il
    accepte (`editable_fields`, WF-IHM-0040). Le rattachement à un poste ou à un lot du
    lotissement (`task.order_item_id`, `task.work_package_id`) n'est accepté que par une
    récapitulative (WF-PLA-0130).
  enum:
    - task.label
    - task.description
    - task.scheduling_mode
    - task.duration
    - task.start
    - task.finish
    - task.progress
    - task.order_item_id
    - task.work_package_id
    - estimate_line.label
    - estimate_line.cost_category_id
    - estimate_line.resource_role_id
    - estimate_line.quantity
    - estimate_line.hours
    - estimate_line.unit_disbursement
    - estimate_line.payment_delay_days
    - estimate_line.subproject_id

NodeColumn:
  type: string
  description: >-
    Colonne d'une grille de la structure, nommée comme le tri de `listNodes` la nomme : les
    colonnes de la grille de planning (WF-PLA-0080), puis celles de la grille de devis et de
    la grille de reste à engager (WF-DEV-0050, WF-RAE-0040), chacune dans l'ordre où sa grille
    les présente : de `label` à `work_breakdown`, les colonnes de la tâche — la dernière, le
    poste ou le lot du lotissement auquel une récapitulative est rattachée (WF-PLA-0130) ;
    `label`, puis de
    `cost_category` à `previous_reestimated_amount`, celles de la ligne de devis — le montant à
    l'année de référence (`base_amount`) et le montant corrigé de l'inflation, que présente la
    grille de devis (WF-DEV-0050), les montants budgété et réestimé, que présente celle de reste à
    engager. C'est dans cet ordre qu'un collage remplit les colonnes qui suivent la colonne visée
    (`PastePreview.target_column`, WF-IHM-0050).
  enum:
    - label
    - description
    - scheduling_mode
    - duration
    - start
    - finish
    - progress
    - physical_progress
    - total_float
    - is_critical
    - predecessors
    - work_breakdown
    - cost_category
    - resource_role
    - quantity
    - hours
    - unit_disbursement
    - subproject
    - payment_delay_days
    - consumption_year
    - base_amount
    - budgeted_amount
    - reestimated_amount
    - inflated_amount
    - previous_reestimated_amount

ComputedValueField:
  type: string
  description: >-
    Champ d'un nœud dont le serveur calcule la valeur, pour ce nœud-ci ou pour tous : ceux
    que `computed_fields` peut nommer, et ceux qu'aucune écriture ne porte — les montants,
    la marge, l'avancement physique (WF-IHM-0030).
  enum:
    - task.duration
    - task.start
    - task.finish
    - task.progress
    - task.physical_progress
    - task.total_float
    - task.base_amount
    - task.budgeted_amount
    - task.reestimated_amount
    - task.inflated_amount
    - estimate_line.quantity
    - estimate_line.hours
    - estimate_line.unit_disbursement
    - estimate_line.base_amount
    - estimate_line.budgeted_amount
    - estimate_line.reestimated_amount
    - estimate_line.previous_reestimated_amount
    - estimate_line.inflated_amount

ComputedDependency:
  type: string
  description: >-
    Ce dont dépend une valeur calculée, que le refus d'une saisie nomme (WF-IHM-0030) :
    `subordinates`, les dates, la durée et l'avancement d'une récapitulative, tirés de ses
    subordonnées (WF-PLA-0040) ; `lines_and_subordinates`, le montant d'une tâche, somme de
    ses lignes et de ses subordonnées (WF-DEV-0050) ; `scheduling`, les dates d'une tâche
    en mode automatique, tirées de sa durée, de ses liaisons et de son calendrier
    (WF-PLA-0020) ; `float_dates`, la marge, écart des dates au plus tôt et au plus tard
    (WF-PLA-0100) ; `manual_mode`, la marge d'une tâche en mode manuel, qui n'en porte pas
    (WF-PLA-0100) ; `hourly_rate`, le montant d'une ligne de main-d'œuvre, de sa quantité, de
    sa charge et du taux horaire de sa catégorie pour l'année de référence ; `unit_disbursement`, celui d'une ligne
    hors main-d'œuvre, de sa quantité et de son débours unitaire (WF-DEV-0030) ; `risk`, les
    grandeurs et le montant d'une ligne de provision (WF-RIS-0010) ;
    `reference_revision`, le montant budgété, fixé par la révision de référence
    (WF-DEV-0020) ; `remaining_reviews`, le montant réestimé, suivi par les revues du
    reste à engager (WF-RAE-0040) ; `inflation`, le montant corrigé de l'inflation, du
    montant de la ligne, du taux d'inflation du projet et de son année de consommation
    (WF-DEV-0040, WF-DEV-0050) ; `own_estimate`, la gravité d'un risque, total de son devis
    propre, et `severity_and_probability`, sa provision, cette gravité pondérée par sa
    probabilité (WF-RIS-0010) — que le risque nomme lui-même (`Risk.computed_fields`).
  enum:
    - subordinates
    - lines_and_subordinates
    - scheduling
    - float_dates
    - manual_mode
    - hourly_rate
    - unit_disbursement
    - risk
    - reference_revision
    - remaining_reviews
    - inflation
    - own_estimate
    - severity_and_probability

DependencyRow:
  type: object
  required: [node_id, row_number, label]
  description: >-
    Une ligne dont dépend une valeur calculée, nommée comme la grille la nomme : son numéro
    dans la numérotation de toute la structure, et son libellé.
  properties:
    node_id: { $ref: ../common.yaml#/Uuid }
    row_number: { type: integer, minimum: 1 }
    label: { type: string }

ComputedValueDependencies:
  type: object
  required: [node_id, field, depends_on, rows]
  description: >-
    Ce dont dépend la valeur calculée d'un champ d'un nœud (WF-IHM-0030) : les règles qui la
    calculent, dans l'ordre où les dire, et les lignes dont elle est tirée — les
    subordonnées directes d'une récapitulative, les lignes et les subordonnées directes
    d'une tâche —, toutes, que la recherche ou les filtres d'une lecture les retiennent ou
    non. Aucune ligne pour une valeur qui n'est tirée d'aucune.
  properties:
    node_id: { $ref: ../common.yaml#/Uuid }
    field: { $ref: '#/ComputedValueField' }
    depends_on:
      type: array
      minItems: 1
      uniqueItems: true
      description: Chaque règle une fois, dans l'ordre où la dire.
      items: { $ref: '#/ComputedDependency' }
    rows:
      type: array
      uniqueItems: true
      description: Chaque ligne une fois, dans l'ordre du plan.
      items: { $ref: '#/DependencyRow' }

EntryAvailability:
  type: object
  required: [is_available, missing_conditions]
  description: Si une saisie est ouverte sur cet objet, et sinon les conditions qui lui manquent (WF-IHM-0090).
  properties:
    is_available: { type: boolean }
    missing_conditions:
      type: array
      items: { $ref: projects.yaml#/CommandCondition }

NodeTotals:
  type: object
  required:
    - task_count
    - estimate_line_count
    - hours
    - base_amount
    - budgeted_amount
    - reestimated_amount
    - inflated_amount
  description: >-
    Totaux de la requête, calculés par le serveur ; le front n'en somme aucun. Les
    montants et les heures sont ceux des seules lignes de devis retenues par les
    filtres — jamais les montants cumulés des tâches, qui les compteraient deux fois —,
    et les décomptes ignorent les ancêtres rendus pour la seule lisibilité de l'arbre.
    Chaque montant est la somme du montant de même nom des lignes retenues
    (`EstimateLineFacet`) : à l'année de référence, sauf le montant corrigé de l'inflation
    (WF-DEV-0050). `budgeted_amount` somme les montants budgétés des lignes retenues, lignes de
    provision comprises : ce n'est pas le budget de référence, diminué des provisions selon
    WF-RIS-0050.
  properties:
    task_count: { type: integer, minimum: 0 }
    estimate_line_count: { type: integer, minimum: 0 }
    hours: { $ref: ../common.yaml#/Hours }
    base_amount: { $ref: ../common.yaml#/Money }
    budgeted_amount: { $ref: ../common.yaml#/Money }
    reestimated_amount: { $ref: ../common.yaml#/Money }
    inflated_amount: { $ref: ../common.yaml#/Money }

NodesWritten:
  type: object
  required: [nodes, ancestors, rescheduled, reinflated, totals, structure_lock_version]
  description: >-
    Ce qu'une écriture de grille rend, quelle qu'elle soit — une cellule, un collage, un
    déplacement, une création, une suppression, une liaison, un avancement, une réestimation,
    une inscription aux suivis — : les nœuds écrits, les dates des autres tâches que
    l'écriture a redatées, le montant corrigé des autres lignes et tâches qu'elle a déplacées
    dans le temps, les récapitulatives recalculées au-dessus des uns et des autres,
    et les totaux de la structure,
    pour que la grille montre juste sans relire la structure ni rien sommer (WF-IHM-0040,
    WF-DEV-0050, WF-PLA-0020, WF-ARC-0020), et le compteur de la structure, qui a avancé.
  properties:
    nodes:
      type: array
      description: >-
        Les nœuds écrits, tels qu'ils sont désormais, dans l'ordre du plan ; vide après une
        suppression, qui ne laisse rien à rendre.
      items: { $ref: '#/Node' }
    ancestors:
      type: array
      description: >-
        Les ancêtres des nœuds écrits et des tâches redatées (`rescheduled`) — ceux du nœud
        supprimé, et, pour un déplacement, leurs anciens ancêtres —, recalculés : montants,
        dates, durée, avancement d'une récapitulative. Chacun une fois, entier, dans l'ordre
        du plan ; vide quand aucun de ces nœuds n'a de parent.
      items: { $ref: '#/Node' }
    rescheduled:
      type: array
      description: >-
        Les tâches non récapitulatives dont le début, la fin, la marge totale ou la
        criticité ont changé par l'écriture sans être écrites — les successeurs d'une
        liaison ou d'une durée saisie, et ce que le chemin critique déplace (WF-PLA-0020,
        WF-PLA-0100) —, chacune une fois, dans l'ordre du plan ; vide quand rien d'autre
        n'a bougé. Une projection de leur calendrier, non le nœud entier : une chaîne de
        mille tâches reste légère. Les récapitulatives qu'elles déplacent sont rendues entières dans
        `ancestors`. Ni les unes ni les autres ne voient leur compteur avancer : il ne suit que
        les écritures (`LockVersion`). Les montants qui dépendent des dates — le montant corrigé de
        l'inflation, l'année de consommation — n'y sont pas : ils sont dans `reinflated`.
      items: { $ref: '#/NodeSchedule' }
    reinflated:
      type: array
      description: >-
        Chaque nœud dont le montant corrigé de l'inflation, ou l'année de consommation d'une
        ligne, a changé par l'écriture sans qu'il soit écrit : les lignes de devis d'une tâche
        écrite ou redatée, dont les dates ont bougé — un rôle changé change le calendrier de la
        tâche, donc ses dates (WF-PLA-0010, WF-DEV-0040) —, et les tâches non récapitulatives
        dont ces lignes changent le montant corrigé, redatées (`rescheduled`) ou non, hors
        celles que `ancestors` rend entières. Les récapitulatives restent dans `ancestors`. Chacun une fois, dans l'ordre du
        plan ; vide quand aucun n'a bougé. Une projection de leurs montants, non le nœud entier,
        comme `rescheduled` : le montant à l'année de référence ne dépend pas des dates et ne
        change pas.
      items: { $ref: '#/NodeInflation' }
    totals:
      allOf: [{ $ref: '#/NodeTotals' }]
      description: >-
        Les totaux de la structure entière, sans filtre : ceux qu'une grille lue sans filtre
        affiche. Une grille filtrée les relit par `listNodes`.
    structure_lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        Le compteur de la structure après l'écriture (`CostStructure.lock_version`), que le
        collage suivant porte (WF-IHM-0110).

NodeSchedule:
  type: object
  required: [node_id, start, finish, total_float, is_critical, finish_overdue]
  description: >-
    Le calendrier d'une tâche non récapitulative qu'une écriture a redatée sans l'écrire
    (`NodesWritten.rescheduled`) : les valeurs que le planning recalcule à chaque
    modification d'une durée, d'une liaison ou de la structure (WF-PLA-0020), et que le
    chemin critique déplace (WF-PLA-0100), sous la forme des champs de même nom de la
    facette temps (`TaskFacet`). Les montants qui dépendent des dates n'y sont pas. Sans
    `lock_version` : un recalcul ne fait pas avancer le compteur de la tâche, qui reste
    celui que la grille a lu (`LockVersion`).
  properties:
    node_id: { $ref: ../common.yaml#/Uuid }
    start: { $ref: ../common.yaml#/WorkInstant }
    finish: { $ref: ../common.yaml#/WorkInstant }
    total_float:
      anyOf: [{ $ref: '#/Duration' }, { type: 'null' }]
      description: >-
        Marge totale (WF-PLA-0100), calculée : du temps de travail en jours ouvrés
        (`unit: d`), décimale, jamais négative — les tâches en mode manuel, traitées comme des
        dates imposées, évitent les marges négatives ; nulle pour une tâche en mode manuel,
        qui ne porte pas de marge.
    is_critical:
      type: boolean
      description: >-
        Appartenance au chemin critique (WF-PLA-0100) ; fausse pour une tâche en mode manuel.
    finish_overdue:
      type: boolean
      description: >-
        Fin dépassée : vrai pour une tâche démarrée dont la fin est antérieure à la date de
        calcul (WF-RAE-0040), comme `TaskFacet.finish_overdue`.

NodeInflation:
  type: object
  required: [node_id, inflated_amount, consumption_year]
  description: >-
    Les montants d'une ligne de devis ou d'une tâche non récapitulative qu'une écriture a
    déplacée dans le temps sans l'écrire (`NodesWritten.reinflated`) : ceux qui dépendent des
    dates, sous la forme des champs de même nom de sa facette (`EstimateLineFacet`,
    `TaskFacet`), que la grille de devis présente (WF-DEV-0040, WF-DEV-0050). Sans
    `lock_version`, comme `NodeSchedule` : un recalcul ne fait pas avancer le compteur du nœud
    (`LockVersion`).
  properties:
    node_id: { $ref: ../common.yaml#/Uuid }
    inflated_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Le montant corrigé de l'inflation, comme `EstimateLineFacet.inflated_amount` pour une
        ligne et `TaskFacet.inflated_amount` pour une tâche — la somme de ses lignes.
    consumption_year:
      anyOf: [{ $ref: ../common.yaml#/Year }, { type: 'null' }]
      description: >-
        L'année de consommation d'une ligne, comme `EstimateLineFacet.consumption_year` ; nulle
        pour une tâche, dont la facette n'en porte pas.

TaskProgress:
  type: string
  enum: [not_started, started, completed]
  description: État d'avancement d'une tâche (WF-PLA-0130, WF-RAE-0030).

SchedulingMode:
  type: string
  enum: [automatic, manual]
  description: >-
    Mode de planification de la tâche : dates calculées depuis les liaisons, ou
    saisies (WF-PLA-0020).

DurationUnit:
  type: string
  enum: [min, h, d, w, mo, emin, eh, ed, ew, emo]
  description: >-
    Unité d'une durée, conservée telle qu'elle a été saisie ou importée (WF-PLA-0160) :
    minutes, heures, jours, semaines et mois de travail, que les constantes de
    l'installation convertissent en heures (`DurationUnits`) ; minutes, heures, jours,
    semaines et mois écoulés, qui se convertissent sans calendrier — un jour écoulé vaut
    vingt-quatre heures, une semaine sept jours, un mois trente jours. Le front l'écrit
    par le suffixe de Microsoft Project dans la langue du lecteur (`j`, `sem`, `ej`…).

Duration:
  type: object
  required: [value, unit]
  description: >-
    Durée, en temps de travail ou en temps écoulé : celle d'une tâche, dans l'unité de sa
    saisie (WF-PLA-0160), nulle pour un jalon (WF-PLA-0050) ; ou une marge totale,
    calculée en jours ouvrés (WF-PLA-0100).
  properties:
    value:
      allOf: [{ $ref: ../common.yaml#/Decimal }]
      description: Jamais négative.
    unit: { $ref: '#/DurationUnit' }

LagUnit:
  type: string
  enum: [min, h, d, w, mo, emin, eh, ed, ew, emo, percent]
  description: >-
    Unité du décalage d'une liaison (WF-PLA-0030) : celles d'une durée, et le
    pourcentage de la durée du prédécesseur — un décalage de 50 % sur un prédécesseur
    de dix jours vaut cinq jours de travail.

Lag:
  type: object
  required: [value, unit]
  description: >-
    Décalage d'une liaison dans l'unité de sa saisie, positif ou négatif — négatif,
    c'est une avance —, conservé sans conversion (WF-PLA-0030, WF-PLA-0160).
  properties:
    value: { $ref: ../common.yaml#/Decimal }
    unit: { $ref: '#/LagUnit' }

TaskFacet:
  type: object
  required:
    - label
    - scheduling_mode
    - duration
    - start
    - finish
    - progress
    - finish_overdue
    - is_summary
    - is_milestone
    - base_amount
    - budgeted_amount
    - reestimated_amount
    - inflated_amount
  description: >-
    Facette temps d'un nœud. Les valeurs calculées — dates en mode automatique,
    dates et durée d'une récapitulative, marge, criticité, avancement physique, fin
    dépassée — ne sont pas saisissables (WF-IHM-0030). La durée est portée dans l'unité
    de sa saisie (WF-PLA-0160) ; le début et la fin sont une date et les heures de
    travail écoulées ce jour-là (WF-DAT-0100). Une récapitulative peut porter le
    rattachement à un poste ou à un lot du lotissement (`order_item_id`, `work_package_id`,
    WF-PLA-0130) ; une tâche créée par un import MS Project garde l'identifiant que le
    fichier lui donnait (`external_id`, WF-INTF-0040).
  properties:
    label: { type: string, minLength: 1, maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    scheduling_mode: { $ref: '#/SchedulingMode' }
    duration: { $ref: '#/Duration' }
    start:
      anyOf: [{ $ref: ../common.yaml#/WorkInstant }, { type: 'null' }]
    finish:
      anyOf: [{ $ref: ../common.yaml#/WorkInstant }, { type: 'null' }]
    progress: { $ref: '#/TaskProgress' }
    finish_overdue:
      type: boolean
      description: >-
        Calculé : vrai pour une tâche démarrée dont la fin est antérieure à la date de
        calcul, que la grille de reste à engager signale (WF-RAE-0040). Faux sinon.
    started_on:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
    completed_on:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: Date de terminaison, qui situe la valeur acquise dans le temps (WF-IND-0030).
    is_summary:
      type: boolean
      description: 'Récapitulative : son état est dérivé de ses subordonnées, non saisissable (WF-PLA-0040).'
    is_milestone:
      type: boolean
      description: Jalon, tâche de durée nulle (WF-PLA-0050).
    calendar_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        Calendrier applicable, résolu à la lecture : intersection des calendriers
        des rôles des lignes de main-d'œuvre, ou calendrier par défaut (WF-PLA-0010).
    total_float:
      anyOf: [{ $ref: '#/Duration' }, { type: 'null' }]
      description: >-
        Marge totale (WF-PLA-0100), calculée : du temps de travail en jours ouvrés
        (`unit: d`), décimale, jamais négative — les tâches en mode manuel, traitées comme des
        dates imposées, évitent les marges négatives ; nulle pour une tâche en mode manuel,
        qui ne porte pas de marge.
    is_critical:
      type: boolean
      description: Appartenance au chemin critique, calculée (WF-PLA-0100).
    physical_progress:
      anyOf: [{ $ref: indicators.yaml#/Computable }, { type: 'null' }]
      description: >-
        Avancement physique d'une récapitulative, calculé : le rapport des montants
        budgétés portés par les tâches terminées de son sous-arbre au total budgété de ce
        sous-arbre (WF-IND-0060), non calculable quand ce total est nul
        (`no_budgeted_amount`, WF-IND-0010). Nul pour une tâche qui n'est pas récapitulative.
    base_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Somme des montants à l'année de référence des lignes que la tâche porte et de ceux de
        ses subordonnées, calculée par le serveur, jamais saisissable : le montant que la grille
        de devis présente pour une tâche, récapitulative comprise (WF-DEV-0050). Un attribut de
        la tâche : un filtre de la grille ne le change pas, comme les trois sommes qui suivent.
    budgeted_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Même somme, pour les montants budgétés, à l'année de référence (WF-DEV-0020).
    reestimated_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: Même somme, pour les montants réestimés, à l'année de référence.
    inflated_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Même somme, pour les montants corrigés de l'inflation (WF-DEV-0040, WF-DEV-0050).
    tracking:
      type: array
      description: Inscriptions aux chronologies et au suivi temps/temps (WF-PLA-0060).
      items: { $ref: '#/TrackingEntry' }
    order_item_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        Le poste du lotissement que porte cette récapitulative (WF-PLA-0130, WF-PLA-0040) :
        posé par le squelette (WF-PRJ-0030), modifiable et retirable, exclusif de
        `work_package_id`. Un poste n'est porté que par une récapitulative à la fois ; c'est par
        lui que le devis présente ses totaux par poste (WF-DEV-0060) et que les grilles filtrent
        par poste. Nul sans rattachement, et toujours nul pour une tâche qui n'est pas
        récapitulative.
    work_package_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        Le lot du lotissement que porte cette récapitulative (WF-PLA-0130), aux mêmes règles
        que `order_item_id`, exclusif de lui : une récapitulative porte un poste ou un lot,
        jamais les deux ; un lot n'est porté que par une récapitulative à la fois. Les grilles
        filtrent par lot sur ce rattachement (WF-DEV-0050, WF-RAE-0040).
    work_breakdown_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Le libellé du poste ou du lot porté, résolu à la lecture, que la colonne
        `work_breakdown` présente sans que la grille lise le lotissement (WF-ARC-0020) ; nul
        sans rattachement.
    external_id:
      anyOf: [{ type: string, maxLength: 200 }, { type: 'null' }]
      description: >-
        L'identifiant que MS Project donnait à la tâche dans le fichier dont l'import l'a
        créée, conservé comme identifiant externe (WF-INTF-0040) : c'est par lui qu'un fichier
        remanié avant le premier export se rapproche de la tâche. Nul pour une tâche créée
        dans Waterfall, jamais saisi.

EstimateLineFacet:
  type: object
  required:
    - label
    - cost_category_id
    - cost_category_label
    - resource_role_label
    - subproject_label
    - quantity
    - base_amount
    - budgeted_amount
    - reestimated_amount
    - inflated_amount
    - is_computed
    - uses_inactive_object
    - remaining_entry
  description: >-
    Facette argent d'un nœud. Les quatre montants sont calculés et non saisissables :
    le montant à l'année de référence est celui de la ligne telle qu'elle est chiffrée
    (WF-DEV-0030), le budgété est fixé par la révision de référence et nul pour une ligne
    ajoutée après elle, le réestimé est mis à jour par les revues (WF-DEV-0020,
    WF-RAE-0040) — tous trois à l'année de référence —, et le montant corrigé de
    l'inflation, seul à porter l'inflation, est le montant projeté sur l'année de
    consommation de la ligne (WF-DEV-0040). La grille de devis présente le premier et le
    dernier, jamais le budgété ni le réestimé (WF-DEV-0050). La catégorie, le rôle et le
    sous-projet sont nommés par leur libellé, que le serveur résout à la lecture, l'objet
    actif ou désactivé, pour que la grille ne rapproche aucune liste (WF-ARC-0020,
    WF-REF-0150). Une ligne qui emploie un objet du
    référentiel désactivé le dit (`uses_inactive_object`), pour que les grilles de devis
    et de reste à engager la signalent (WF-REF-0010).
  properties:
    label: { type: string, minLength: 1, maxLength: 300 }
    cost_category_id: { $ref: ../common.yaml#/Uuid }
    cost_category_label:
      type: string
      description: Libellé de la catégorie de coût, résolu à la lecture, active ou désactivée.
    quantity: { $ref: ../common.yaml#/Decimal }
    resource_role_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Exigé pour une catégorie de main-d'œuvre, absent sinon (WF-DEV-0020).
    resource_role_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Libellé du rôle de ressource, résolu à la lecture, actif ou désactivé ; nul pour une
        ligne sans rôle.
    hours:
      anyOf: [{ $ref: ../common.yaml#/Hours }, { type: 'null' }]
    unit_disbursement:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: Débours unitaire d'une ligne hors main-d'œuvre (WF-DEV-0020).
    payment_delay_days:
      anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
      description: >-
        Délai de paiement, dont la courbe de coûts cumulés décale le montant de la ligne
        quand elle présente les décaissements (WF-IND-0100).
    subproject_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Sous-projet facultatif ; sans lui, la ligne relève de « hors sous-projet » (WF-IND-0020).
    subproject_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Libellé du sous-projet, résolu à la lecture ; nul pour une ligne hors sous-projet.
    base_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Montant à l'année de référence, calculé : le produit de la quantité, de la charge et du
        taux horaire de la catégorie pour l'année de référence du chiffrage pour une ligne de
        main-d'œuvre, de la quantité et du débours sinon (WF-DEV-0030), avant toute inflation ;
        celui que la grille de devis présente (WF-DEV-0050).
    budgeted_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Montant fixé par la révision de référence (§3.2.5, WF-DEV-0020), à l'année de
        référence, nul pour une ligne ajoutée après elle ou issue d'un risque survenu. Une
        ligne de provision porte la provision qu'elle avait dans la révision de référence :
        ce montant compte à la réserve pour risques, jamais au budget de référence, qui est
        la somme des montants budgétés hors lignes de provision (WF-RIS-0050, glossaire) et
        se lit dans les indicateurs, jamais en sommant ces montants.
    reestimated_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: Montant réestimé, à l'année de référence.
    inflated_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Montant corrigé de l'inflation, calculé : le montant à l'année de référence projeté sur son
        année de consommation au taux d'inflation du projet, chaque part d'une tâche à
        cheval sur plusieurs années projetée sur la sienne (WF-DEV-0040, WF-DEV-0050).
        Une ligne placée deux ans après l'année de référence, à 2 % d'inflation, le porte
        supérieur de 4,04 % à son montant.
    previous_reestimated_amount:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: >-
        Montant réestimé au reste à engager précédent, à l'année de référence, que la grille de
        reste à engager présente à côté du courant (WF-RAE-0040) ; nul avant la première revue.
    consumption_year:
      anyOf: [{ $ref: ../common.yaml#/Year }, { type: 'null' }]
      description: Année de consommation, déduite du planning (WF-DEV-0040).
    is_computed:
      type: boolean
      description: >-
        Vrai pour une ligne de provision, dont le montant est calculé depuis le
        risque et jamais saisi (WF-RIS-0010).
    uses_inactive_object:
      type: boolean
      description: >-
        Calculé : vrai quand la catégorie de coût, le rôle de ressource ou la nature de
        la ligne est désactivé dans le référentiel ; la ligne reste lisible, la grille
        la signale (WF-REF-0010). Le refus d'une saisie qui emploierait un objet
        désactivé est inchangé (`INACTIVE_REFERENCE_OBJECT`).
    remaining_entry:
      allOf: [{ $ref: '#/EntryAvailability' }]
      description: >-
        Si la ligne accepte une réestimation au reste à engager, et sinon ce qui lui
        manque : les lignes d'une tâche terminée ne se modifient pas (WF-RAE-0040). La
        grille le lit ligne par ligne, sans déduire la règle de l'avancement.
    bearing_task_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Tâche porteuse, résolue à la lecture.
    bearing_task_label:
      anyOf: [{ type: string }, { type: 'null' }]

LinkType:
  type: string
  enum: [finish_to_start, start_to_start, finish_to_finish, start_to_finish]
  description: Les quatre types de liaison (WF-PLA-0030).

PredecessorWrite:
  type: object
  required: [predecessor_node_id, link_type, lag]
  description: >-
    Liaison d'une tâche à l'un de ses prédécesseurs, avec son décalage dans son unité :
    négatif, c'est une avance (WF-PLA-0030).
  properties:
    predecessor_node_id: { $ref: ../common.yaml#/Uuid }
    link_type: { $ref: '#/LinkType' }
    lag: { $ref: '#/Lag' }

Predecessor:
  description: >-
    Liaison telle que la lecture la rend : le numéro de ligne du prédécesseur, calculé
    comme `row_number` dans la numérotation de toute la structure, qu'il soit ou non
    retenu par la recherche et les filtres (WF-PLA-0080).
  allOf:
    - $ref: '#/PredecessorWrite'
    - type: object
      required: [predecessor_row_number]
      properties:
        predecessor_row_number:
          type: integer
          minimum: 1
          readOnly: true

PredecessorsReplace:
  type: object
  required: [predecessors, lock_version]
  properties:
    predecessors:
      type: array
      items: { $ref: '#/PredecessorWrite' }
    lock_version: { $ref: ../common.yaml#/LockVersion }

TrackingEntry:
  type: object
  required: [kind]
  properties:
    kind:
      type: string
      enum: [timeline, milestone_tracking]
    timeline_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]

Timeline:
  type: object
  required: [timeline_id, label]
  description: Chronologie nommée, à laquelle des tâches sont inscrites (WF-PLA-0140, WF-PLA-0060).
  properties:
    timeline_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, maxLength: 200 }

NodeCreate:
  type: object
  required: [kind, parent_id]
  properties:
    kind: { $ref: '#/NodeKind' }
    parent_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    position:
      anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
    task: { $ref: '#/TaskFacetWrite' }
    estimate_line: { $ref: '#/EstimateLineWrite' }

TaskFacetWrite:
  type: object
  required: [label]
  description: >-
    Champs saisissables d'une tâche, à sa création (WF-PLA-0130). Les valeurs calculées sont
    refusées. La durée se saisit dans son unité (WF-PLA-0160) ; le début et la fin,
    saisissables en mode manuel, sont une date et des heures de travail écoulées
    (WF-DAT-0100). Le rattachement à un poste ou à un lot n'est accepté que d'une
    récapitulative — une tâche qui a des subordonnées, ou que la grille de devis crée comme
    telle (WF-DEV-0050) — et suit les règles de `TaskFacetUpdate`.
  properties:
    label: { type: string, minLength: 1, maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    scheduling_mode: { $ref: '#/SchedulingMode' }
    duration: { $ref: '#/Duration' }
    start:
      anyOf: [{ $ref: ../common.yaml#/WorkInstant }, { type: 'null' }]
    finish:
      anyOf: [{ $ref: ../common.yaml#/WorkInstant }, { type: 'null' }]
    order_item_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    work_package_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]

TaskFacetUpdate:
  type: object
  required: [lock_version]
  minProperties: 2
  description: >-
    Modification d'une tâche, cellule par cellule (WF-IHM-0040) : seul le compteur lu est
    exigé, tout autre champ est facultatif, et seul ce qui est envoyé change — un champ absent
    reste ce qu'il était. Les mêmes champs qu'à la création (`TaskFacetWrite`) ; une valeur
    que le serveur calcule pour ce nœud est refusée (`COMPUTED_VALUE`, WF-IHM-0030).

    Le rattachement au lotissement (WF-PLA-0130) : `order_item_id` ou `work_package_id`
    rattache la récapitulative à ce poste ou à ce lot, `null` retire le rattachement. Le
    refus est un 422 `VALIDATION_FAILED`, `fields` sur le champ envoyé : `SUMMARY_TASK_REQUIRED`
    quand la tâche n'est pas récapitulative ; `UNKNOWN_WORK_BREAKDOWN_ITEM` quand le
    lotissement du projet n'a pas ce poste ou ce lot ; `WORK_BREAKDOWN_ITEMS_EXCLUSIVE` quand
    les deux sont envoyés non nuls, ou que l'un est envoyé quand l'autre est porté ;
    `WORK_BREAKDOWN_ITEM_ALREADY_ATTACHED` quand une autre récapitulative porte déjà ce poste
    ou ce lot, `fields[].params.attached_node_id` la nommant — « le rattachement d'une récapitulative
    à un lot déjà porté par une autre est refusé » (Vérif de WF-PLA-0130).
  properties:
    label: { type: string, minLength: 1, maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    scheduling_mode: { $ref: '#/SchedulingMode' }
    duration: { $ref: '#/Duration' }
    start:
      anyOf: [{ $ref: ../common.yaml#/WorkInstant }, { type: 'null' }]
    finish:
      anyOf: [{ $ref: ../common.yaml#/WorkInstant }, { type: 'null' }]
    order_item_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Le poste du lotissement à porter, ou `null` pour retirer le rattachement.
    work_package_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Le lot du lotissement à porter, ou `null` pour retirer le rattachement.
    lock_version: { $ref: ../common.yaml#/LockVersion }

EstimateLineWrite:
  type: object
  required: [label, cost_category_id, quantity]
  description: >-
    Champs saisissables d'une ligne de devis, à sa création (WF-DEV-0020) : le rôle et la
    charge pour une catégorie de main-d'œuvre, le débours unitaire pour une autre.
  properties:
    label: { type: string, minLength: 1, maxLength: 300 }
    cost_category_id: { $ref: ../common.yaml#/Uuid }
    quantity: { $ref: ../common.yaml#/Decimal }
    resource_role_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    hours:
      anyOf: [{ $ref: ../common.yaml#/Hours }, { type: 'null' }]
    unit_disbursement:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
    payment_delay_days:
      anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
    subproject_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]

EstimateLineUpdate:
  type: object
  required: [lock_version]
  minProperties: 2
  description: >-
    Modification d'une ligne de devis, cellule par cellule (WF-IHM-0040) : seul le compteur
    lu est exigé, tout autre champ est facultatif, et seul ce qui est envoyé change — un
    champ absent reste ce qu'il était. Les mêmes champs qu'à la création
    (`EstimateLineWrite`) ; un champ que la ligne n'accepte pas — le débours ou le délai de
    paiement d'une ligne de main-d'œuvre, le rôle ou la charge d'une autre — est refusé par
    422 (WF-DEV-0020, §3.2.5), et le nœud dit lesquels il accepte (`editable_fields`).
  properties:
    label: { type: string, minLength: 1, maxLength: 300 }
    cost_category_id: { $ref: ../common.yaml#/Uuid }
    quantity: { $ref: ../common.yaml#/Decimal }
    resource_role_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    hours:
      anyOf: [{ $ref: ../common.yaml#/Hours }, { type: 'null' }]
    unit_disbursement:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
    payment_delay_days:
      anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
    subproject_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    lock_version: { $ref: ../common.yaml#/LockVersion }

NodeMove:
  type: object
  required: [node_ids, parent_id, lock_version]
  properties:
    node_ids:
      type: array
      minItems: 1
      items: { $ref: ../common.yaml#/Uuid }
    parent_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    position:
      anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
    lock_version: { $ref: ../common.yaml#/LockVersion }

ProgressUpdate:
  type: object
  required: [progress, lock_version]
  description: >-
    Démarre ou termine une tâche. La date est celle du geste par défaut, et la
    terminaison situe la valeur acquise (WF-RAE-0030, WF-IND-0030). Une tâche terminée
    se rouvre en la repassant à « démarrée » ; aucun geste ne la ramène à « non
    démarrée », que le Kanban n'offre pas (WF-RAE-0030). Le passage direct de non
    démarrée à terminée n'est ouvert qu'à un jalon, et l'opération est refusée sur une
    récapitulative, dont l'état est dérivé (WF-PLA-0040, WF-PLA-0050).
  properties:
    progress:
      allOf: [{ $ref: '#/TaskProgress' }]
      enum: [started, completed]
    occurred_on: { $ref: ../common.yaml#/PlanningDate }
    lock_version: { $ref: ../common.yaml#/LockVersion }

RemainingUpdate:
  type: object
  required: [reestimated_amount_basis, lock_version]
  description: >-
    Réestime une ligne dont la tâche n'est pas terminée ; un reste à engager nul pour
    toutes les lignes d'une tâche la termine (WF-RAE-0040, WF-RAE-0010).
  properties:
    reestimated_amount_basis:
      type: object
      description: Les grandeurs saisies dont le montant réestimé est recalculé.
      properties:
        quantity: { $ref: ../common.yaml#/Decimal }
        hours:
          anyOf: [{ $ref: ../common.yaml#/Hours }, { type: 'null' }]
        unit_disbursement:
          anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
    reason:
      anyOf: [{ type: string }, { type: 'null' }]
    lock_version: { $ref: ../common.yaml#/LockVersion }

UndoResult:
  type: object
  required: [undone, remaining_depth]
  description: >-
    Annule ou rétablit la dernière modification de la session. Une annulation est
    une modification comme une autre ; elle est refusée par 409 si une modification
    postérieure porte sur le même objet (WF-IHM-0110).
  properties:
    undone:
      type: object
      properties:
        kind: { type: string }
        node_ids:
          type: array
          items: { $ref: ../common.yaml#/Uuid }
    remaining_depth: { type: integer, minimum: 0 }

PastePreview:
  type: object
  required: [target_node_id, target_column, rows]
  description: >-
    Bloc collé depuis un tableur, sur la cellule visée : le nœud et sa colonne. L'aperçu dit
    ce qui sera écrit et ce qui sera refusé, avec le motif de chaque refus ; rien n'est écrit
    sans confirmation (WF-IHM-0050).

    La première colonne du bloc remplit `target_column` ; chacune des suivantes remplit la
    colonne suivante de la facette du nœud visé, dans l'ordre de `NodeColumn` — pour une
    ligne de devis collée sur son libellé : la catégorie, le rôle, la quantité, la charge,
    le débours unitaire, le sous-projet, le délai de paiement ; pour une tâche : la
    description, le mode, la durée, le début, la fin. Chaque ligne du bloc écrit la ligne de la
    grille à la même distance sous le nœud visé, dans l'ordre du plan. Aucune cellule n'est
    décalée : une cellule qui tombe sur une colonne que sa ligne n'accepte pas — un champ
    calculé pour ce nœud, un champ que sa nature refuse, une colonne qu'aucune écriture ne
    porte comme les montants — est refusée, la ligne et la colonne nommées
    (`PastePlan.rejected`), sauf si elle est vide, qui n'écrit rien. Un bloc plus large que
    les colonnes de la facette à partir de la colonne visée est refusé par 422
    (`PASTE_TOO_WIDE`, `params.max_columns`).
  properties:
    target_node_id: { $ref: ../common.yaml#/Uuid }
    target_column:
      allOf: [{ $ref: '#/NodeColumn' }]
      description: La colonne de la cellule visée, que la première colonne du bloc remplit.
    rows:
      type: array
      minItems: 1
      items:
        type: array
        items: { type: string }

PastePlan:
  type: object
  required: [paste_id, accepted, rejected]
  description: >-
    Ce qu'un collage écrira et ce qu'il refusera, chaque refus avec son motif et, quand il
    tient à une cellule, sa colonne (WF-IHM-0050).
  properties:
    paste_id: { $ref: ../common.yaml#/Uuid }
    accepted: { type: integer, minimum: 0 }
    rejected:
      type: array
      items:
        type: object
        required: [row, code]
        properties:
          row:
            type: integer
            minimum: 0
            description: La ligne du bloc refusée, comptée de zéro.
          column:
            allOf: [{ $ref: '#/NodeColumn' }]
            description: >-
              La colonne de la cellule refusée ; absente quand le refus porte sur la ligne
              entière.
          code: { $ref: ../common.yaml#/ErrorCode }
          params:
            type: object
            additionalProperties: true

PasteApply:
  type: object
  required: [paste_id, confirmed, lock_version]
  description: >-
    Confirme un plan de collage. Le compteur est celui de la structure dans laquelle le bloc
    s'écrit (`CostStructure.lock_version`), lu avec la page ou rendu par la dernière écriture
    (`NodesWritten.structure_lock_version`) ; périmé, le collage est refusé par 412 et rien
    n'est écrit (WF-IHM-0050, WF-IHM-0110).
  properties:
    paste_id: { $ref: ../common.yaml#/Uuid }
    confirmed:
      type: boolean
      const: true
    lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: Le compteur de la structure lue, que le collage écrit.

RevisionComparison:
  type: object
  required: [from_revision_id, to_revision_id, added, removed, changed, amount_deltas]
  description: >-
    Comparaison de deux révisions marquées, rapprochée par l'identifiant de lignée
    (WF-REV-0080, WF-DAT-0030).
  properties:
    from_revision_id: { $ref: ../common.yaml#/Uuid }
    to_revision_id: { $ref: ../common.yaml#/Uuid }
    added:
      type: array
      items: { $ref: '#/ComparedNode' }
    removed:
      type: array
      items: { $ref: '#/ComparedNode' }
    changed:
      type: array
      items: { $ref: '#/ComparedNode' }
    amount_deltas:
      type: array
      description: >-
        Les écarts de montants par nature de coût et par sous-projet (WF-REV-0080), chacun
        nommé par son libellé, résolu à la lecture comme `AmountByKey.label` : l'écran ne
        joint rien (WF-ARC-0020).
      items:
        type: object
        required: [dimension, key, label, delta]
        properties:
          dimension:
            type: string
            enum: [cost_type, subproject]
          key:
            type: string
            description: L'identifiant de la nature ou du sous-projet, ou `unassigned` (WF-IND-0020).
          label:
            anyOf: [{ type: string }, { type: 'null' }]
            description: Le libellé de la nature ou du sous-projet ; nul pour la seule clé `unassigned`, que le front nomme.
          delta: { $ref: ../common.yaml#/Money }

ComparedNode:
  type: object
  required: [lineage_id, label, kind]
  properties:
    lineage_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string }
    kind: { $ref: '#/NodeKind' }
    changes:
      type: array
      items:
        type: string
        enum: [dates, duration, progress, budgeted_amount, reestimated_amount, parent]
