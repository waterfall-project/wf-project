# Revisions, cost structures and common tree (FBS-4.1, FBS-4.3, FBS-4.4, FBS-4.5).
#
# A revision is a complete snapshot (WF-REV-0030); it owns outright all the lines that
# describe it (WF-DAT-0010). The tree is common to the planning and the estimate: the same
# tasks, seen from the side of time or from the side of money (§3.5.1). A task carries its
# estimate lines (WF-DEV-0020).

RevisionStatus:
  type: string
  enum: [draft, marked]
  description: In progress, or marked — and then immutable (WF-REV-0020, WF-REV-0090).

Revision:
  type: object
  required:
    - revision_id
    - project_id
    - status
    - is_reference
    - reference_year
    - inflation_rate
    - win_probability
    - version_name
    - description
    - marked_at
    - source_revision_id
    - source_version_name
    - available_commands
    - audit
    - lock_version
  properties:
    revision_id: { $ref: ../common.yaml#/Uuid }
    project_id: { $ref: ../common.yaml#/Uuid }
    version_name:
      anyOf: [{ type: string, maxLength: 100 }, { type: 'null' }]
      description: >-
        Version name entered at marking, unique among the project's marked revisions
        (WF-REV-0020). Null while the revision is in progress.
    description:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The revision's description, optional (WF-REV-0090). On the current revision, the one
        received at its creation (`RevisionCreate.description`), kept until marking, which takes
        it over; null if the creation received none (#2171). On a marked revision, the one from
        its marking, null if there is none (E-10, #1780).
    status: { $ref: '#/RevisionStatus' }
    marked_at:
      anyOf: [{ $ref: ../common.yaml#/Timestamp }, { type: 'null' }]
      description: >-
        The instant of marking (WF-REV-0090); null as long as the revision is not marked (E-10,
        #1780).
    is_reference:
      type: boolean
      description: Whether this is the reference revision (WF-REV-0040, WF-REV-0090).
    reference_year:
      allOf: [{ $ref: ../common.yaml#/Year }]
      readOnly: true
      description: >-
        Reference year of the revision, one of its attributes (WF-REV-0090): the year whose
        hourly rates price its lines. Set by the server when the revision is created, to the
        current year, kept by the revision and its snapshot (WF-REV-0060, WF-REV-0030), never
        entered. It is the year for which the calculation requires an hourly rate for each
        category used (WF-DEV-0010, `getMissingRates`), the year of the amounts "at the rates of
        the reference year, before inflation" of the estimate grid (`base_amount`,
        WF-DEV-0050), the year from which inflation projects the budgeted and re-estimated
        amounts, once per elapsed year (WF-DEV-0030), and the year the rate update targets
        (`RateUpdateProposal.target_year`). A revision created in 2027 carries 2027; the previous
        revision, created in 2026, keeps 2026.
    inflation_rate:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      readOnly: true
      description: >-
        The project's inflation rate that the revision keeps, one of its attributes (WF-REV-0030,
        WF-REV-0090): the one from which its budgeted and re-estimated amounts are projected
        (WF-DEV-0030). On a marked revision, the one from its marking, which the revision history
        presents (WF-REV-0070); on the current revision, the project's, which it follows until
        its marking (`Project.inflation_rate`). Never entered here.
    win_probability:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      readOnly: true
      description: >-
        The project's win probability that the revision keeps, likewise (WF-REV-0030,
        WF-REV-0090, WF-PRJ-0090): the one from its marking on a marked revision, the project's
        on the current revision (`Project.win_probability`). Never entered here.
    source_revision_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        The marked revision of which the revision is the copy (WF-REV-0010), which every screen
        names along with the current revision (WF-IHM-0020); null for a project's first
        revision, which copies nothing. Kept once the revision is marked: the history tells where
        each revision comes from.
    source_version_name:
      anyOf: [{ type: string, maxLength: 100 }, { type: 'null' }]
      description: >-
        The version name of the source revision (`source_revision_id`), resolved on read, so
        that the screen names it without rereading the history (WF-IHM-0020, WF-ARC-0020); null
        along with it.
    snapshot:
      anyOf: [{ $ref: '#/RevisionSnapshot' }, { type: 'null' }]
      description: >-
        The reference data values that the revision keeps (WF-REV-0030). Returned by
        `getRevision` for a marked revision, which froze them at its marking; omitted for the
        current revision, whose values follow the reference data as long as it is not marked,
        apart from the rates it keeps (WF-REV-0060), and in `listRevisions` as in the response
        of a write, which do not read it.
    available_commands:
      type: array
      description: >-
        Commands of the revision that the caller has permission to exercise, each
        available or not, with the conditions it lacks (WF-IHM-0090). A grid
        whose entry command is absent or unavailable presents itself as read-only.
        A revision of a terminal project lists only its exports, which do not modify it:
        no other command will become available again (WF-CYC-0080, WF-CYC-0100, WF-IHM-0090;
        US-0702/L3).
      items: { $ref: '#/RevisionCommandAvailability' }
    audit: { $ref: ../common.yaml#/Audit }
    lock_version: { $ref: ../common.yaml#/LockVersion }

RevisionCommand:
  type: string
  enum:
    - edit_planning
    - generate_skeleton
    - edit_estimate
    - edit_remaining
    - edit_risks
    - declare_risk
    - create_structure
    - merge_structure
    - apply_rate_update
    - mark
    - designate_reference
    - abandon
    - export_planning
    - export_estimate
    - export_remaining
    - export_task_tree_image
  description: >-
    Commands carried by the revision: entering the planning, the estimate, the remaining
    to commit, the risks — one command per function, each guarded by its permission
    (WF-ADM-0100) —, opening a differential (WF-REV-0100) and merging it (WF-REV-0050),
    applying the rate update to it (WF-REV-0060), marking it, designating it as the
    reference, abandoning it (WF-REV-0010, WF-REV-0020, WF-REV-0040) — the merge, the marking,
    the designation and the abandonment each guarded by its own permission, `structure_merge`,
    `revision_mark`, `reference_designate`, `revision_abandon`: a role that marks without
    merging sees `mark` and not `merge_structure` (WF-ADM-0100); exporting its MS Project
    planning, its estimate, its remaining to commit or the image of its task tree — one command
    per kind of export (`ExportKind`), in the order of the enumeration (WF-INTF-0050,
    WF-INTF-0110, WF-INTF-0130, WF-PLA-0120). An export belongs to the revision it reads, marked
    or current; an import, which writes into the current revision or creates it, is a
    command of the project (`ProjectCommand`). An export is a matter of consultation
    (WF-CYC-0110): it is guarded by the permission to view the function of its kind
    — the planning and the tree image by that of the planning (FBS-4.3), the estimate by that
    of the estimate (FBS-4.4), the remaining to commit by that of the remaining to commit
    (FBS-4.5) — and lacks no condition: on a marked revision, during a marking, on a
    terminal project, it remains available. An export is present or absent.

    `edit_risks` is the entry of risks — declaring a risk, changing its provision,
    reviewing it, deleting it (`createRisk`, `updateRiskProvision`, `reviewRisk`, `deleteRisk`),
    under `risks.write` —, an entry into the current revision like the other three, undoable by
    the same history (WF-RIS-0020, WF-IHM-0110). Modifying a risk's identity — its
    label, its description, its mitigation note — does not fall under it: project data, it
    does not write into the revision, and its command is the risk's (`RiskCommand.update`,
    `updateRisk`; H-02, #1782). Only the current revision carries it: a marked
    revision never lists it, not even as unavailable like the other three entries — it is
    immutable (WF-DAT-0020), and the screen must not show two risk entry commands
    when the project carries it. As long as the project has no
    current revision, the project carries it (`ProjectCommand.edit_risks`), the entry
    creating the current revision (WF-RIS-0020).
    Declaring an occurrence does not fall under it: it is a command of the project and of the
    risk (`ProjectCommand.declare_risk_occurrence`, `RiskCommand.declare_occurrence`).

    `merge_structure` belongs to the current revision, and also, as long as the project has no
    current revision, to the last marked revision: "When the project has no current revision,
    it first creates one" (WF-REV-0050): the merge is requested on the differential of that
    revision, and creates the current revision by copying it
    (WF-REV-0010; #790).
    Its conditions there are, in this order, `no_background_task_running` while an import is
    being applied, an occurrence processed or another merge run, which create the current
    revision, `unmerged_amendment_exists`, then `may_create_revision` for anyone without
    permission to create a revision (`revisions.write`), like any command that creates it. On
    a terminal project, it is not listed, and the merge's 409 names `project_not_terminal`
    first. On any other marked revision, and on this one as soon as a revision is current, it
    lacks only `revision_draft`.

    `declare_risk` tells in advance whether declaring a risk (`createRisk`) would succeed,
    always listed right after `edit_risks`, wherever that one is listed and under the same
    permission, `risks.write` (EP-14/L42s), its conditions in the order in which the 409 of
    `createRisk` judges them: the state conditions of `edit_risks` first — `project_not_terminal`
    on a terminal project, which only that 409 names, then `no_background_task_running` during
    a background task that writes into the current revision or freezes it —, like
    `ProjectCommand.update_work_breakdown`; then its own conditions — `at_least_one_task`, a main structure without tasks, then
    `active_provision_category`, no active category of type risk provision
    (WF-RIS-0010) —; then the other conditions of `edit_risks`. Changing the provision,
    reviewing and deleting, which do not depend on them, remain under `edit_risks`.

    `generate_skeleton` generates the planning skeleton from the work breakdown
    (`generatePlanningSkeleton`, WF-PRJ-0030), a planning entry guarded by the same
    permission, `planning.write`, and listed right after it. "Generation is offered only on
    the main structure (WF-PLA-0170), and only when it contains no task": the command is
    unavailable as soon as the revision's main structure contains a task,
    `main_structure_without_tasks` lacking, the own condition first, then those of any entry
    into the current revision — `no_background_task_running` during a marking, an import, the
    processing of a risk occurrence or a merge. On a marked revision, it lacks only
    `revision_draft`, like `create_structure`. It belongs to no differential and to no risk's
    own estimate: it is a command of the revision, which the operation applies to its main
    structure. As long as the project has no current revision, the project carries it
    (`ProjectCommand.generate_skeleton`), the revision opening first (EP-15/US-0490/L4).

    `apply_rate_update` tells in advance whether the rate update would apply
    (`applyRateUpdate`, WF-REV-0060): "the presentation remains offered from the current
    revision as long as it is not marked, and a refused update can be accepted there
    later". A write to the revision, like its marking, and not a grid entry: it is guarded by
    the permission of revision management, `revisions.write` — that of `createRevision`, which
    applies it at creation (`RevisionCreate.apply_rate_update`) —, and not by that of the
    estimate, which can no longer be entered on the main structure of an In progress project
    when the update can still be accepted there. On the current revision, its own condition
    first, `rate_update_available`, when the proposal presents no category
    (`getRateUpdateProposal`) — the revision's reference year is that of the revision of which
    it is the copy, or each presented category has already been accepted —, then
    `no_background_task_running` during a marking, the application of an import, the processing
    of an occurrence or a merge. On a marked revision, it lacks only `revision_draft`, the
    proposal not being judged there: a marked revision keeps the rates it computed
    (WF-REF-0130, WF-DAT-0020; #1351).

    `mark` and `abandon` belong only to a current revision: on a marked revision,
    `revision_draft` is lacking (WF-REV-0020, WF-DAT-0020); on the current revision,
    `no_background_task_running` during a marking, a merge, the processing of an occurrence
    or the application of an import. `markRevision` and `abandonRevision` refuse with the first
    one lacking, in this order. A revision of a terminal project is always marked: the exit
    marks or abandons the current revision (WF-CYC-0090), and `revision_draft` suffices there.
    `designate_reference` names `revision_marked` on the current revision, then
    `revision_has_tasks_and_lines`, `reference_correctable` and `no_background_task_running`
    during a background task running on the revision; `designateReferenceRevision` refuses
    with the first one lacking, in this order, `project_not_terminal` first on a terminal
    project (WF-CYC-0030, WF-REV-0040; E-12, US-0702/L2, #1674).

RevisionCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/RevisionCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Empty when the command is available.
      items: { $ref: projects.yaml#/CommandCondition }

RevisionSnapshot:
  type: object
  required: [employed_reference]
  description: >-
    What the revision keeps of the reference data: only the values it uses
    (WF-REV-0030). The project parameters it keeps — its reference year, its inflation
    rate, its win probability — are attributes of the revision, which the history reads
    without the snapshot (`Revision.reference_year`, `inflation_rate`, `win_probability`,
    WF-REV-0090).
  properties:
    employed_reference: { $ref: '#/EmployedReference' }

EmployedReference:
  type: object
  required: [resource_roles, calendars, cost_categories, hourly_rates]
  description: >-
    Images of the reference data objects used, frozen at marking (WF-REV-0030, WF-REF-0130):
    without the commands that an object read today carries, which an image does not have.
  properties:
    resource_roles:
      type: array
      items: { $ref: reference.yaml#/ResourceRoleImage }
    calendars:
      type: array
      items: { $ref: reference.yaml#/CalendarImage }
    cost_categories:
      type: array
      items: { $ref: reference.yaml#/CostCategoryImage }
    hourly_rates:
      type: array
      items: { $ref: reference.yaml#/HourlyRateImage }

RevisionCreate:
  type: object
  description: >-
    Creates the current revision by copying the last marked revision
    (WF-REV-0010, WF-DAT-0010). A project has only one at a time.
  properties:
    description:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The revision's description, optional (WF-REV-0090): kept on the current revision,
        which `getRevision` and `listRevisions` return with it (`Revision.description`), and
        taken over at its marking (`markRevision`). Absent or null, the current revision has
        none (#2171).
    apply_rate_update:
      type: boolean
      default: false
      description: >-
        Applies the rate update proposed by WF-REV-0060. False or absent, the revision is
        priced at the source revision's rates projected by the project's inflation rate up to
        its reference year (WF-REV-0060, WF-REV-0010, WF-DEV-0030), the update remaining
        offered (`getRateUpdateProposal`). True, each category that the proposal would present
        at the year's reference data rate (`reference_rate`) is priced at that rate, like
        `applyRateUpdate` on all of them; the others keep their projected rate. Never
        imposed (#1764).

RevisionMark:
  type: object
  required: [version_name, lock_version]
  description: >-
    Marks the revision. Marking freezes the revision and computes its indicators
    in the same transaction (WF-REV-0020, WF-DAT-0040); it is handed to the worker
    and returns a background task (WF-ARC-0090).
  properties:
    version_name: { type: string, minLength: 1, pattern: '\S', maxLength: 100 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Absent, the description kept at the creation of the revision is carried over; present, it
        replaces it; null, it clears it — the rule of `updateProject` for `client` (#2171).
    lock_version: { $ref: ../common.yaml#/LockVersion }

ReferenceDesignation:
  type: object
  required: [revision_id, lock_version]
  description: >-
    Designates the reference revision among the marked revisions. Correctable as long as the
    project has received no actual cost and no revision has been marked since the last
    designation; beyond that, the reference moves only at the contractualisation of an
    amendment (WF-REV-0040).
  properties:
    revision_id: { $ref: ../common.yaml#/Uuid }
    confirmed:
      type: boolean
      description: >-
        False or absent, the designation is refused with 400 `CONFIRMATION_REQUIRED`, and nothing
        is written, like the exit (`ProjectExit.confirmed`): the schema does not require it and
        does not fix its value, so that it is the guard that refuses, and not the validation of
        the body with 422 (US-0702/L3).
    lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        The counter of the project read (`Project.lock_version`), whose reference and state the
        designation writes: stale, it is refused with 412 and nothing is written (WF-IHM-0110;
        the author's decision of 2026-10-28, E-24, US-0702/L2).

RateUpdateProposal:
  type: object
  required: [categories]
  description: >-
    Rate difference proposed category by category at the creation of a revision, when its
    reference year differs from that of the previous revision. A category without a rate
    for the selected year keeps its previous rate, projected by the inflation rate
    (WF-REV-0060).
  properties:
    target_year:
      allOf: [{ $ref: ../common.yaml#/Year }]
      description: >-
        The reference year of the created revision (`Revision.reference_year`), for which
        the rates are proposed; the previous rates are those of the reference year of the
        revision of which it is the copy (WF-REV-0060).
    categories:
      type: array
      items:
        type: object
        required: [cost_category_id, label, previous_amount, proposed_amount, source]
        properties:
          cost_category_id: { $ref: ../common.yaml#/Uuid }
          label:
            type: string
            minLength: 1
            maxLength: 200
            description: >-
              The category's label, resolved on read, so that the screen joins nothing.
          previous_amount: { $ref: ../common.yaml#/Money }
          proposed_amount: { $ref: ../common.yaml#/Money }
          source:
            type: string
            enum: [reference_rate, inflated_previous]

RateUpdateApply:
  type: object
  required: [cost_category_ids, lock_version]
  description: >-
    Accepts the rate update for the selected categories (`applyRateUpdate`,
    WF-REV-0060), with the revision's counter as read, like any write of the family
    (WF-IHM-0110; E-03, #1755).
  properties:
    cost_category_ids:
      type: array
      minItems: 1
      uniqueItems: true
      description: >-
        The categories accepted among those the proposal presents
        (`getRateUpdateProposal`); a category it does not present is refused with 422
        `VALIDATION_FAILED`, `fields` on `/cost_category_ids/<n>`, and an empty list likewise, on
        `/cost_category_ids`; nothing is written.
      items: { $ref: ../common.yaml#/Uuid }
    lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        The revision's counter as read (`Revision.lock_version`); stale, 412 and nothing is
        written.

StructureKind:
  type: string
  enum: [main, amendment, risk]
  description: >-
    Kind of cost structure: main, amendment differential, or a risk's own
    estimate (WF-REV-0100, WF-REV-0050, WF-RIS-0030).

CostStructure:
  type: object
  required:
    - structure_id
    - revision_id
    - kind
    - label
    - planning_start_on
    - is_merged
    - available_commands
    - lock_version
  properties:
    structure_id: { $ref: ../common.yaml#/Uuid }
    revision_id: { $ref: ../common.yaml#/Uuid }
    kind: { $ref: '#/StructureKind' }
    label: { type: string, maxLength: 300 }
    planning_start_on:
      allOf: [{ $ref: ../common.yaml#/PlanningDate }]
      description: >-
        The structure's planning start date, entered (`updateCostStructure`): by default the day
        of its first creation; a structure taken over from a marked revision keeps its own
        (WF-PLA-0020, WF-REV-0100, WF-REV-0010), and a differential, a copy of the main
        structure at its creation, takes the main structure's. An automatic task without a
        predecessor starts on it, at the first working hour of its applicable calendar
        (WF-PLA-0020). The MS Project import reads it from the file's project start date, and
        the export writes it there (WF-INTF-0040, WF-INTF-0050).
    risk_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Set for a structure of kind `risk` (WF-RIS-0030).
    is_merged:
      type: boolean
      description: >-
        True when the differential has been merged into the main structure (WF-REV-0050), or
        when a risk's own estimate has been merged by its occurrence (WF-RIS-0060). A
        merged structure is consumed: it is only in the revision where it was
        merged, which its marking freezes, and the next revision does not take it over
        (`createRevision`). A current revision therefore never carries a merged structure
        it has taken over; true is read there only for the own estimate of a risk that occurred
        since its opening, the occurrence marking no revision (WF-RIS-0060; #1758).
    available_commands:
      type: array
      description: >-
        Entry commands of the structure that the caller has permission to exercise, each
        available or not, with the conditions it lacks (WF-IHM-0090): what the grid that reads
        it offers — cell entry, structure gestures, paste —, without deducing anything from the
        project's state (`StructureCommand`). A grid whose command is absent or unavailable
        presents itself as read-only.
      items: { $ref: '#/StructureCommandAvailability' }
    lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        Counter of the structure, which advances with each write into its tree — a cell, a
        paste, a move, a creation, a deletion — as with each modification of the
        structure itself (`updateCostStructure`). It is the one a paste carries
        (`PasteApply.lock_version`), and that every grid write returns
        (`NodesWritten.structure_lock_version`), so that the grid keeps it up to date
        (WF-IHM-0110). In a risk's own estimate (`risk_id`), each of these writes also advances
        the risk's counter (`Risk.lock_version`), which the confirmation of its occurrence carries
        (`RiskOccurrence`).

StructureCommand:
  type: string
  enum:
    - edit_planning
    - edit_estimate
    - edit_remaining
  description: >-
    Entry commands of a structure, one per grid that writes it: the planning, the estimate, the
    remaining to commit (WF-PLA-0080, WF-DEV-0050, WF-RAE-0040). Each is guarded by the permission
    of the revision's command of the same name (`RevisionCommand`, `planning.write`,
    `estimate.write`, `remaining.write`), present or absent like it (WF-ADM-0100). The server
    accepts the same writes from the three grids — a task or a line created on the main
    structure of an In progress project is the same write from the planning and from the
    remaining to commit —: it is the structure's command that tells which grid enters it,
    according to the project's phase, which the front does not deduce (WF-IHM-0090). The state
    of a task, for its part, refuses on the main structure the entries of a line of a completed
    task, from any grid (`task_not_completed`, `Node.editable_fields`; F-01, #1766).

    On the main structure, during pricing the estimate, during execution the remaining to
    commit: `edit_estimate` is unavailable as soon as the project has reached In progress, or a
    terminal state, `project_before_in_progress` lacking — the estimate grid remains readable,
    read-only (WF-DEV-0050) —; `edit_remaining` is unavailable outside the In progress state,
    before it as in a terminal state, `project_in_progress` lacking (WF-RAE-0040).
    `edit_planning` has no phase condition: the planning is worked on during pricing with the
    estimate, during execution with the remaining to commit. On a differential and on a risk's
    own estimate, `edit_planning` and `edit_estimate` have no phase condition — an amendment and
    a risk are priced whatever the project's state (WF-DEV-0050, WF-REV-0100, WF-RIS-0030) — and
    `edit_remaining` is never listed: only the main structure has a remaining to commit
    (WF-RAE-0040).

    The phase condition comes first, specific to the command; then the revision's state
    conditions, as the revision's command of the same name names them — `revision_draft` on
    a marked revision, `no_background_task_running` during a background task that writes
    into the current revision or freezes it —, in the same order. On a closed project, none is
    listed (US-0702/L3). The revision's commands keep what does not read a structure: the
    skeleton, the marking, the exports, the risks (C-358, #1067).

StructureCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/StructureCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Empty when the command is available.
      items: { $ref: projects.yaml#/CommandCondition }

StructureCreate:
  type: object
  required: [kind, label]
  description: >-
    Creates a differential, to prepare an amendment (WF-REV-0100). The main structure is never
    created here: it exists from the revision's creation; nor is a risk's own estimate, which
    is born with the risk (`createRisk`, WF-RIS-0030) and disappears with it.
  properties:
    kind:
      allOf: [{ $ref: '#/StructureKind' }]
      enum: [amendment]
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }

StructureUpdate:
  type: object
  required: [lock_version]
  minProperties: 2
  description: >-
    Modifies the structure itself: its planning start date and its label
    (WF-PLA-0020, WF-REV-0100). Only what is sent changes; the counter as read is required. A
    body reduced to the counter would change nothing: at least one of the two fields is required
    with it, otherwise 422 `VALIDATION_FAILED`, and the counter does not advance.
  properties:
    planning_start_on:
      allOf: [{ $ref: ../common.yaml#/PlanningDate }]
      description: >-
        The planning start date (`CostStructure.planning_start_on`), on a day that has at
        least one working hour in the default calendar (WF-PLA-0010, WF-PLA-0020).
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    lock_version: { $ref: ../common.yaml#/LockVersion }

StructureMerge:
  type: object
  required: [confirmed, version_name, main_structure_lock_version, amendment_lock_version]
  description: >-
    Merges the differential into the main structure: the merge gives the lines it designates
    the reference quantities it carries, from which their budgeted amount is derived; a
    designated line of a task not started, which nobody has re-estimated since the reference,
    also takes these quantities as current quantities; the current quantities and the
    re-estimated amount of all other lines are kept (WF-REV-0050, WF-DEV-0020). It applies to
    the current revision and marks it in the same operation, hence the version name required
    and the description allowed, as at any marking (WF-REV-0020), and the resulting revision
    becomes the reference (WF-REV-0050); on a project without a current revision, it first
    creates that revision by copying the last marked revision, in the same operation
    (WF-REV-0010; #790), and the version name is that of the revision created and marked.
    Handed to the worker. The confirmation follows the preliminary report
    (`getStructureMergeReport`), which tells in advance what would refuse it, and carries the
    two counters the report read: if the main structure or the differential has changed since,
    it is refused with 412 and nothing is merged — it is this report that the user confirmed
    (WF-REV-0050, WF-IHM-0110; EP-14/L42s).
  properties:
    confirmed:
      type: boolean
      const: true
    version_name: { type: string, minLength: 1, pattern: '\S', maxLength: 100 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The description attached to the marked revision, as at marking
        (`RevisionMark.description`, WF-REV-0020, WF-REV-0090).
    main_structure_lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        The counter of the main structure that the report read
        (`StructureMergeReport.main_structure_lock_version`).
    amendment_lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        The counter of the differential that the report read
        (`StructureMergeReport.amendment_lock_version`).

StructureMergeReport:
  type: object
  required:
    - main_structure_lock_version
    - amendment_lock_version
    - creates_current_revision
    - differences
    - completed_tasks
    - refusals
  description: >-
    Report of the merge of a differential, presented before it is applied (WF-REV-0050;
    EP-14/L42s): its differences with the main structure — tasks and lines added,
    modified, removed —, the started tasks it will complete, and the reasons that refuse it.
    It takes up the elements of an import's report, and reads likewise: a started or
    completed task that the differential removes is never removed, but kept and flagged
    (`kept`); the started one also appears among `completed_tasks`, its remaining to commit
    brought to zero (`completed_on` null as long as the merge is not applied). The three arrays
    are always returned, empty when there is nothing to say; the merge applies only if
    `refusals` is empty. It returns the counters of the two structures read, which the
    confirmation sends back (`StructureMerge`).
  properties:
    main_structure_lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        The counter of the main structure read (`CostStructure.lock_version`): an entry that
        writes it since makes the report stale, and the confirmation is refused with 412.
    amendment_lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: The counter of the differential read (`CostStructure.lock_version`), likewise.
    creates_current_revision:
      type: boolean
      description: >-
        True when the project has no current revision: the differential is that of the
        last marked revision, and the merge first creates the current revision by copying
        it, priced at the kept rates, projected, merges the copy of the differential into it and
        marks it, in the same background task — "When the project has no current revision, it
        first creates one" (WF-REV-0050, WF-REV-0010, WF-REV-0060; #790).
        Its differences and its refusal reasons are then judged on the main structure of the
        marked revision, which the copy takes over as is, and its counters are those of its
        structures, which the marking froze. False for a differential of the current revision.
    differences:
      type: array
      description: >-
        The differences of the differential with the main structure, tasks, estimate lines and
        links, like those of an import (`ImportDifference`); an addition has no lineage yet
        in the main structure. The provision line of a risk whose carrying task the differential
        removes moves to another task, and the report flags it with an `updated` difference of
        the line on `parent` (WF-RIS-0010; #789). An `updated` difference of a line names the
        figures that the differential gives it (`fields`): they become its reference figures,
        and also its current figures when its task is not started and nobody has re-estimated
        it (WF-REV-0050); the report does not distinguish the two cases, the re-estimated state
        of a line remaining with the server (US-0701/L1, M-08).
      items: { $ref: exchanges.yaml#/ImportDifference }
    completed_tasks:
      type: array
      description: >-
        The started tasks that the differential removes, which the merge completes by bringing
        their remaining to commit to zero (WF-REV-0050, WF-RAE-0040).
      items: { $ref: exchanges.yaml#/ImportCompletedTask }
    refusals:
      type: array
      description: >-
        The reasons that refuse the whole merge (WF-PLA-0010, WF-PLA-0030, WF-PLA-0150,
        WF-PLA-0170), each with the parameters it carries when the merge fails
        (`ReportRefusal`). Empty when the merge applies. A link loop (`LINK_CYCLE`)
        leaves the structure's dates uncomputed: the horizon is then not judged, and
        `PROJECT_HORIZON_EXCEEDED` never accompanies it (#788).
      items: { $ref: exchanges.yaml#/ReportRefusal }

NodeKind:
  type: string
  enum: [task, estimate_line]
  description: >-
    A node of the tree is a task or an estimate line. The line is carried by
    the task under which it is placed (WF-DEV-0020).

Node:
  type: object
  required: [node_id, lineage_id, kind, parent_id, position, row_number, level, origin_risk_id, computed_fields, editable_fields, lock_version]
  description: >-
    `row_number` and `level` are computed on read. `lineage_id` is stable
    from one revision to the next and underpins the comparison, the time/time diagram, the
    tracking registrations (WF-DAT-0030) and the matching of imports (WF-INTF-0040,
    WF-INTF-0100, WF-INTF-0120).
  properties: &node_properties
    node_id: { $ref: ../common.yaml#/Uuid }
    lineage_id: { $ref: ../common.yaml#/Uuid }
    kind: { $ref: '#/NodeKind' }
    parent_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    position:
      type: integer
      minimum: 1
      readOnly: true
      description: >-
        Rank of the node among the siblings under its parent — the lines of a task, then its
        subtasks, in outline order —, starting from 1. Computed, it is not written: a
        creation or a move designates its place by the node after which to place itself
        (`NodeCreate.after_node_id`, `NodeMove.after_node_id`; #1183). On the read of a
        differential and on a comparison, the removed nodes returned count in it, at the place
        they had (`NodeDifference`).
    row_number:
      type: integer
      minimum: 1
      description: >-
        Row number, computed on read in the numbering of the whole structure
        — its tasks and its lines, in outline order —, whatever the read returns, its filters,
        its search and its sort. On the read of a differential and on a comparison, the removed
        nodes returned count in it, each occupying its row
        (`NodeDifference`).
    level: { type: integer, minimum: 1 }
    origin_risk_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      readOnly: true
      description: >-
        The risk whose occurrence merged this node, task or line, into the main structure
        (WF-RIS-0060); null for any other. Read-only: the occurrence sets it on each task and
        each line it merges, and no write changes it. The copy of a revision, moves, imports
        that match the node by its lineage (`lineage_id`) and the merge of an amendment keep
        it; a creation leaves it null, even under a task that came from a risk. It finds the
        lines that came from an occurred risk, which the filters `is_from_risk` and
        `origin_risk_ids` retain, and whose re-estimated amount is compared with the cost at
        occurrence (`Risk.occurred_reestimated_amount`; #1761).
    task:
      anyOf: [{ $ref: '#/TaskFacet' }, { type: 'null' }]
    estimate_line:
      anyOf: [{ $ref: '#/EstimateLineFacet' }, { type: 'null' }]
    predecessors:
      type: array
      items: { $ref: '#/Predecessor' }
    computed_fields:
      type: array
      description: >-
        Enterable fields — through the write schema or, for progress, through its
        command — that the server computes for this very node: the dates of an automatic
        task, the mode — always automatic (WF-PLA-0040) —, the dates, the duration and
        the progress of a summary task, the category of a labour line, that of its
        role (WF-DEV-0020), the figures of a provision line and its subproject, the one that
        its risk designates (WF-RIS-0010). The front presents them
        as computed and does not offer to enter them (WF-IHM-0030); it deduces
        nothing from the mode or from the kind of the node.
      items: { $ref: '#/ComputedField' }
    editable_fields:
      type: array
      uniqueItems: true
      description: >-
        Fields of the facet that this very node accepts for writing, symmetrical to
        `computed_fields`: a labour line carries the role and the effort, never its
        category, which is that of its role (Vérif of WF-DEV-0020), a non-labour line
        its category and the unit disbursement, both the payment delay — null by
        default for labour, and "enterable on any line other than a provision
        line" (WF-DEV-0020, WF-IND-0100; #785) —, a provision line neither the ones nor the
        others, nor
        its subproject, which its risk designates and changes only as long as it is identified
        (`RiskCommand.update_provision`, WF-RIS-0010); a line whose task is started or
        completed, and whose subproject has received actual costs, does not name it either: it
        cannot leave that subproject (`SUBPROJECT_HAS_ACTUAL_COSTS`, WF-PRJ-0050); a
        line of the main structure whose task is completed names none, its label
        included: it is not modified as long as the task is not reopened from the Kanban
        (`task_not_completed`, WF-RAE-0040, WF-DEV-0050), its remaining to commit falling under
        `remaining_entry` — a line of a differential names them whatever the state of its
        task, the amendment re-budgeting it (WF-REV-0050; F-01, #1766) —;
        a manual task carries its dates, a milestone has no duration to
        enter, a summary task neither mode, nor duration, nor dates, nor progress (WF-PLA-0040,
        WF-PLA-0130). A field
        computed for this node never appears in it. The grid offers entry of a cell only if
        its field appears in it, without deducing anything from the kind of the category or
        from the mode (WF-IHM-0040); what the caller has the right to write falls under the
        revision's commands, not this list.
      items: { $ref: '#/EditableField' }
    lock_version: { $ref: ../common.yaml#/LockVersion }
    difference:
      anyOf: [{ $ref: '#/NodeDifference' }, { type: 'null' }]
      description: >-
        The node's difference, which the server returns and the front does not compute: on the
        read of a differential, with the main structure of its revision; in a comparison of two
        revisions (`RevisionComparison`), with the base revision (WF-REV-0080, WF-REV-0100,
        C-361). Always returned on these two reads, whether `fields` names it or not; null — or
        omitted — on the main structure and on a risk's own estimate, which are read relative
        to nothing.
    changes:
      type: array
      description: >-
        What changes of the node itself, in the order of `NodeChange`, returned with
        `difference`: empty for a node added, removed or unchanged, and for a task marked
        modified by its content alone — a line or a subordinate added, removed, modified or
        moved.
      items: { $ref: '#/NodeChange' }

NodeDifference:
  type: string
  enum: [added, removed, modified, unchanged]
  description: >-
    The difference of a node, matched by its lineage (WF-DAT-0030): `added`, absent from the
    base structure — the main one for a differential, the base revision for a comparison —;
    `removed`, absent from the structure read, returned at the place it had, between the nodes
    that surrounded it, read-only (`editable_fields` empty); `modified`, present on both sides,
    one of whose values changes (`changes`), or a task under which a node is added, removed or
    modified, or from which a node is moved, so that the mark of a summary task says that its
    content changes; `unchanged`,
    everything else (WF-REV-0080, C-361). A removed node occupies its row: `row_number` and
    `position` count the returned tree, removed nodes included, and a moved node is returned
    once, at its new place, `parent` among its `changes`. The tasks modified by their own
    values are counted by a non-empty `changes`; a task modified by its content alone has an
    empty `changes`.

NodeChange:
  type: string
  enum:
    - dates
    - duration
    - progress
    - budgeted_amount
    - reestimated_amount
    - payment_delay_days
    - subproject
    - cost_category
    - parent
  description: >-
    What changes of a node present on both sides (WF-REV-0080): for a task, its dates, its
    duration, its progress state and its parent — "A task moved under another
    summary task is presented as modified" —; for an estimate line, its budgeted and
    re-estimated amounts, which express its figures, its payment delay, which shifts its
    cash-out without changing any amount (WF-DEV-0020, WF-IND-0100; #1566), its
    subproject (`subproject`) and its cost category (`cost_category`), which change the key
    under which it counts its differences even with an unchanged amount — a category that
    changes can change its kind (`RevisionComparison.amount_deltas`, #1751) —, and its parent,
    the task that carries it. A line that changes subproject or category is therefore
    `modified`, and "Differences only" (`difference`) retains it. The amount of a task is that
    of its lines, which express it.

KanbanTask:
  description: >-
    A task of the Kanban (`listStartableTasks`, WF-RAE-0030): the node, and the gestures its
    card offers, which the front deduces neither from its state nor from its lines
    (WF-IHM-0090). A summary task that now awaits only its own lines says so through its facet
    (`TaskFacet.awaiting_own_lines`), which the card flags (WF-PLA-0040; #1774).
  allOf:
    - $ref: '#/Node'
    - type: object
      required: [available_commands]
      properties:
        available_commands:
          type: array
          readOnly: true
          description: >-
            The gestures of the card that the caller has permission to exercise — that of
            entering the remaining to commit, `remaining.write`, under which the Kanban falls
            (FBS-4.5.3); without it, the list is empty —, in the order of `KanbanCommand`, each
            available or not with the conditions it lacks.
          items: { $ref: '#/KanbanCommandAvailability' }

KanbanCommand:
  type: string
  enum: [start, complete, reopen, enter_remaining]
  description: >-
    The gestures of a Kanban card (WF-RAE-0030). A card lists only those that its state
    and its kind admit; those that a condition holds back are unavailable there, the condition
    named. A provision line does not count among the lines of a task: it neither holds it back
    from being completed from the Kanban, nor sends it to the entry of the remaining to commit
    (WF-PLA-0050, WF-RIS-0010).

    `start` moves a not-started task that is not a milestone to started: a milestone never
    starts, and a milestone's card does not list it (WF-PLA-0050). Predecessors
    are not a condition of it. `complete` completes a not-started or started task, on the
    entered date (`ProgressUpdate.occurred_on`, WF-PLA-0130): listed on any card that is
    not completed, it lacks `task_is_milestone` for a not-started task that is not
    a milestone — the direct move from not started to completed is open only to a milestone,
    which then takes as its start date that of its completion (WF-PLA-0130) —, and
    `task_without_lines` for a task that carries a non-provision line, which entering a
    zero remaining to commit on all its lines completes (WF-RAE-0040), in this order.
    `reopen` reopens a completed task: a milestone becomes not started again, its start and
    completion dates cleared, any other task becomes started again; listed on any
    completed
    card, and on it only. `enter_remaining` sends to the remaining-to-commit grid, on
    the task, and writes nothing: listed on the card of a non-completed task that carries a
    non-provision line, and on it only — it is the gesture that completes it, `complete` there
    lacking `task_without_lines`, or that re-estimates it even before it starts.

    After the gesture's own conditions come those of the entry of the remaining to commit of
    the main structure (`StructureCommand.edit_remaining`), in the same order:
    `project_in_progress` outside the In progress state, `no_background_task_running` during a
    background task that writes into the current revision or freezes it.

KanbanCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions, progress]
  properties:
    command: { $ref: '#/KanbanCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Empty when the gesture is available.
      items: { $ref: projects.yaml#/CommandCondition }
    progress:
      anyOf: [{ $ref: '#/TaskProgress' }, { type: 'null' }]
      description: >-
        The state that the gesture sends to `setTaskProgress` (`ProgressUpdate.progress`):
        `started` for `start`, `completed` for `complete`, `not_started` for the
        reopening of a milestone and `started` for that of any other task; null for
        `enter_remaining`, which writes nothing. The front sends this state, without deducing it
        from the kind of the task.

NotStartedTask:
  description: >-
    A not-started task of the Kanban (`listStartableTasks`, WF-RAE-0030): the node and its
    gestures (`KanbanTask`), and whether all its predecessors are completed.
  allOf:
    - $ref: '#/KanbanTask'
    - type: object
      required: [predecessors_completed]
      properties:
        predecessors_completed:
          type: boolean
          readOnly: true
          description: >-
            True when all the task's predecessors are completed, or when it has none. This is
            what makes a milestone flagged, to invite completing it — nothing completes by
            itself (WF-RAE-0030); it is not a condition of starting, which WF-RAE-0030 does not
            make dependent on predecessors.

ComputedField:
  type: string
  description: >-
    Enterable field that the server computes for a node (`computed_fields`):
    `task.scheduling_mode`,
    the mode of a summary task, always automatic (WF-PLA-0040);
    `estimate_line.cost_category_id`, the category of a labour line, that of its role
    (WF-DEV-0020).
  enum:
    - task.scheduling_mode
    - task.duration
    - task.start
    - task.finish
    - task.progress
    - estimate_line.cost_category_id
    - estimate_line.quantity
    - estimate_line.hours
    - estimate_line.unit_disbursement
    - estimate_line.subproject_id

EditableField:
  type: string
  description: >-
    Field of a facet that a write carries — `TaskFacetUpdate`, `EstimateLineUpdate`, the
    progress command for `task.progress`, or `setNodeTracking` for `task.tracking` —, which
    the node names among those it accepts (`editable_fields`, WF-IHM-0040). The attachment to
    a work package or an order item of the work breakdown (`task.work_package_id`,
    `task.order_item_id`) is accepted from any task of the main structure, summary, leaf or
    milestone, and from no other: "The attachment exists only in the main structure", "the
    differential structures and the risks' own estimates do not carry any"
    (WF-PLA-0170) — their tasks do not name it, and always carry it null. The registration
    to timelines and to time/time tracking (`task.tracking`, WF-PLA-0060) is named likewise
    by any task of the main structure, and by no other: it is through it that the
    planning grid offers the timelines submenu, without deducing it from the structure read
    (#1065); the caller writes it under the structure's planning entry command
    (`StructureCommand.edit_planning`), like the task's other fields. The predecessors
    (`task.predecessors`, written by `setPredecessors`, WF-PLA-0030) are named by any task,
    summary, leaf or milestone, of any structure — a link is refused only at its
    entry, because of what it links (`LINK_FORBIDDEN`, `LINK_CYCLE`) — and by no node removed
    from a differential, which is read-only: it is through it that the planning grid offers the
    predecessors cell, under `edit_planning` like the task's other fields (#1257).
  enum:
    - task.label
    - task.description
    - task.scheduling_mode
    - task.duration
    - task.start
    - task.finish
    - task.progress
    - task.predecessors
    - task.order_item_id
    - task.work_package_id
    - task.tracking
    - estimate_line.label
    - estimate_line.cost_category_id
    - estimate_line.resource_role_id
    - estimate_line.quantity
    - estimate_line.hours
    - estimate_line.unit_disbursement
    - estimate_line.payment_delay_days
    - estimate_line.subproject_id

NodeColumn:
  type: string
  description: >-
    Column of a grid of the structure, named as `sort_by` of `listNodes` and
    `PastePreview.target_column` name it: the
    columns of the planning grid (WF-PLA-0080), then those of the estimate grid and of
    the remaining-to-commit grid (WF-DEV-0050, WF-RAE-0040), each in the order in which its
    grid presents them: from `label` to `work_breakdown`, the task's columns — after the
    criticality, its start and completion dates, read columns, which WF-PLA-0080
    places before the attachment and the predecessors; the last, the work package or order
    item of the work breakdown to which the task is attached (WF-PLA-0170). The state of a task
    is not a column: the planning grid "flags it with a visual mark and not with a
    column" (WF-PLA-0080), and only the Kanban writes it (`setTaskProgress`);
    `label`, then from `cost_category` to `previous_reestimated_amount`, those of the estimate
    line — the amount at the rates of the reference year, before inflation (`base_amount`),
    then the budgeted and re-estimated amounts, inflation included: the estimate grid presents
    the first and the re-estimated one (WF-DEV-0050), the remaining-to-commit grid the
    budgeted and the re-estimated, and, at the previous remaining to commit, the figures then
    the re-estimated amount (WF-RAE-0040).
    It is in this order that a paste fills the columns that follow the targeted column
    (`PastePreview.target_column`, WF-IHM-0050). Only the estimate and remaining-to-commit
    grids sort, by the line's columns: the planning grid sorts none
    (`sort_by`, WF-IHM-0060).
  enum:
    - label
    - description
    - scheduling_mode
    - duration
    - start
    - finish
    - physical_progress
    - total_float
    - is_critical
    - started_on
    - completed_on
    - predecessors
    - work_breakdown
    - cost_category
    - resource_role
    - quantity
    - hours
    - unit_disbursement
    - subproject
    - payment_delay_days
    - consumption_year
    - base_amount
    - budgeted_amount
    - reestimated_amount
    - previous_quantity
    - previous_hours
    - previous_unit_disbursement
    - previous_reestimated_amount

ComputedValueField:
  type: string
  description: >-
    Field of a node whose value the server computes, for this very node or for all: those
    that `computed_fields` can name, and those that no write carries — the amounts,
    the float, the physical progress (WF-IHM-0030).
  enum:
    - task.scheduling_mode
    - task.duration
    - task.start
    - task.finish
    - task.progress
    - task.physical_progress
    - task.total_float
    - task.base_amount
    - task.budgeted_amount
    - task.reestimated_amount
    - estimate_line.cost_category_id
    - estimate_line.quantity
    - estimate_line.hours
    - estimate_line.unit_disbursement
    - estimate_line.subproject_id
    - estimate_line.base_amount
    - estimate_line.budgeted_amount
    - estimate_line.reestimated_amount
    - estimate_line.previous_reestimated_amount

ComputedDependency:
  type: string
  description: >-
    What a computed value depends on, which the refusal of an entry names (WF-IHM-0030):
    `subordinates`, the dates, the duration and the progress of a summary task, derived from its
    subordinates, and its mode, always automatic (WF-PLA-0040), its float, the smallest of
    theirs (WF-PLA-0100); `lines_and_subordinates`, the amount of a task, sum of
    its lines and its subordinates (WF-DEV-0050); `scheduling`, the dates of an automatic
    task, derived from its duration, its links and its calendar
    (WF-PLA-0020); `float_dates`, the float, the difference between the early and late dates
    (WF-PLA-0100); `manual_mode`, the float of a manual task, which carries none
    (WF-PLA-0100); `hourly_rate`, the amount of a labour line, from its quantity, its
    effort and the hourly rate of its category for the reference year; `unit_disbursement`,
    that of a non-labour line, from its quantity and its unit disbursement (WF-DEV-0030);
    `resource_role`, the category of a labour line, that of its role (WF-DEV-0020);
    `risk`, the figures, the subproject and the amount of a provision line (WF-RIS-0010);
    `reference_revision`, the budgeted amount, set by the reference revision (WF-DEV-0020);
    `remaining_reviews`, the re-estimated amount, tracked by the reviews of the remaining to
    commit (WF-RAE-0040); `inflation`, the projection of the budgeted and re-estimated amounts
    onto the line's consumption year, at the project's inflation rate — a provision line is not
    projected (WF-DEV-0030, WF-DEV-0040); `own_estimate`, the severity of a risk, total of its own
    estimate; `severity_and_probability`, the provision of an identified risk, that severity
    weighted by its probability (WF-RIS-0010); `reference_provision`, that of an occurred or
    dismissed risk, the provision it carried in the reference revision (WF-RIS-0040);
    `occurrence_estimate`, the cost at occurrence of an occurred risk, the total of its own
    estimate at the moment it was declared occurred (WF-RIS-0010) — which the risk itself names
    (`Risk.computed_fields`).
  enum:
    - subordinates
    - lines_and_subordinates
    - scheduling
    - float_dates
    - manual_mode
    - hourly_rate
    - unit_disbursement
    - resource_role
    - risk
    - reference_revision
    - remaining_reviews
    - inflation
    - own_estimate
    - severity_and_probability
    - reference_provision
    - occurrence_estimate

DependencyRow:
  type: object
  required: [node_id, row_number, label]
  description: >-
    A row on which a computed value depends, named as the grid names it: its number
    in the numbering of the whole structure, and its label.
  properties:
    node_id: { $ref: ../common.yaml#/Uuid }
    row_number: { type: integer, minimum: 1 }
    label: { type: string }

RowNumberResolution:
  type: object
  required: [node_id, row_number, label, kind]
  description: >-
    The node that carries a row number in the numbering of the whole structure, whatever the
    search, the filters and the sort of the grid that asks for it (`resolveRowNumber`,
    WF-PLA-0080): its identifier, which the write of a predecessor sends
    (`PredecessorWrite.predecessor_node_id`), its number, its label — that of the task or of
    the estimate line — and its kind, which tells the front whether the number designates a task.
  properties:
    node_id: { $ref: ../common.yaml#/Uuid }
    row_number: { type: integer, minimum: 1 }
    label: { type: string }
    kind: { $ref: '#/NodeKind' }

ComputedValueDependencies:
  type: object
  required: [node_id, field, depends_on, rows]
  description: >-
    What the computed value of a field of a node depends on (WF-IHM-0030): the rules that
    compute it, in the order in which to state them, and the rows from which it is derived — the
    direct subordinates of a summary task, the lines and the direct subordinates
    of a task —, all of them, whether the search or the filters of a read retain them or
    not. No row for a value that is derived from none.
  properties:
    node_id: { $ref: ../common.yaml#/Uuid }
    field: { $ref: '#/ComputedValueField' }
    depends_on:
      type: array
      minItems: 1
      uniqueItems: true
      description: Each rule once, in the order in which to state it.
      items: { $ref: '#/ComputedDependency' }
    rows:
      type: array
      uniqueItems: true
      description: Each row once, in outline order.
      items: { $ref: '#/DependencyRow' }

EntryAvailability:
  type: object
  required: [is_available, missing_conditions]
  description: Whether an entry is open on this object, and otherwise the conditions it lacks (WF-IHM-0090).
  properties:
    is_available: { type: boolean }
    missing_conditions:
      type: array
      items: { $ref: projects.yaml#/CommandCondition }

NodeListMeta:
  type: object
  required: [summary_depth, scheduled_at]
  description: >-
    What the read says about the structure read itself, and not about the nodes it returns: the
    filters, the search, `kinds` and `fields` change nothing in it.
  properties:
    scheduled_at:
      allOf: [{ $ref: ../common.yaml#/Timestamp }]
      description: >-
        The instant of the last calculation of the dates of the structure read: that of the last
        write that re-dated it — a duration, a link, a calendar, the tree, its planning start
        date, its creation included (WF-PLA-0020) —, or of its import, whatever the filters,
        the search, `kinds` and `fields`, like `summary_depth`. A marked revision is no longer
        re-dated (WF-DAT-0020): it keeps the instant of the last calculation that preceded its
        marking. It is the calculation date that the exported images of the Gantt and of a
        timeline name (WF-IHM-0130, WF-PLA-0140).
    summary_depth:
      type: integer
      minimum: 0
      description: >-
        The level (`level`) of the deepest summary task of the structure, the first
        level being that of the tasks without a parent, whatever the filters — `max_level`
        included —, the search and `kinds`; 0 for a structure without a summary task.
        The task tree thus offers exactly the levels that exist, from the first
        to this one, without guessing one more nor hiding one beyond the level it reads
        (WF-PLA-0110).

NodeTotals:
  type: object
  required:
    - task_count
    - estimate_line_count
    - hours
    - base_amount
    - budgeted_amount
    - reestimated_amount
  description: >-
    Totals of the request, computed by the server; the front sums none of them. The
    amounts and the hours are those of only the estimate lines retained by the
    filters — never the cumulative amounts of the tasks, which would count them twice —,
    and the counts ignore the ancestors returned only for the readability of the tree. The
    differences filter (`difference`) does not restrict them: they are those of the read
    without it, of the whole structure without any other filter (#1398).
    Each amount is the sum of the amount of the same name of the retained lines
    (`EstimateLineFacet`): at the rates of the reference year, before inflation, for
    `base_amount`, inflation included for the budgeted and re-estimated amounts (WF-DEV-0020,
    WF-DEV-0050). `budgeted_amount` sums the budgeted amounts of the retained lines, provision
    lines included: it is not the reference budget, reduced by the provisions according to
    WF-RIS-0050.
  properties:
    task_count: { type: integer, minimum: 0 }
    estimate_line_count: { type: integer, minimum: 0 }
    hours: { $ref: ../common.yaml#/Hours }
    base_amount: { $ref: ../common.yaml#/Money }
    budgeted_amount: { $ref: ../common.yaml#/Money }
    reestimated_amount: { $ref: ../common.yaml#/Money }

NodesWritten:
  type: object
  required: [nodes, ancestors, rescheduled, reinflated, totals, structure_lock_version]
  description: >-
    What a grid write returns, whatever it is — a cell, a paste, a move, a creation, a
    deletion, a link, a progress change, a re-estimate, a tracking registration —: the nodes
    written, the dates of the other tasks that the write re-dated, the amounts, inflation
    included, of the other lines and tasks it shifted in time, the summary tasks recomputed
    above all of them, and the totals of the structure,
    so that the grid shows correctly without rereading the structure or summing anything
    (WF-IHM-0040, WF-DEV-0050, WF-PLA-0020, WF-ARC-0020), and the counter of the structure,
    which has advanced.
  properties:
    nodes:
      type: array
      description: >-
        The nodes written, as they now are, in outline order; after a
        deletion, only the provision lines it moves under their new task,
        empty when it moves none, and after the write of the structure itself
        (`updateCostStructure`), which writes no node.
      items: { $ref: '#/Node' }
    ancestors:
      type: array
      description: >-
        The ancestors of the nodes written and of the re-dated tasks (`rescheduled`), outside
        the nodes written — those of the deleted node, and, for a move, their former
        ancestors —, recomputed: amounts,
        dates, duration, progress, float and criticality of a summary task, and its waiting for
        only its own lines (`TaskFacet.awaiting_own_lines`) — the re-estimate or the
        completion that finishes its last subordinate makes the signal appear without a reread,
        the one that brings its last own line back to zero makes it disappear, the summary task
        being completed (WF-PLA-0040; #1774). Each one once,
        whole, in outline order; empty when none of these nodes has a parent. A
        summary task that has lost its last subordinate is returned there as it becomes —
        an automatic leaf of the duration it computed, a milestone if that duration is
        zero and it is not started, a one-day leaf if it is (WF-PLA-0040) —,
        its `computed_fields` and `editable_fields` changed along with it (`deleteNode`,
        `moveNodes`).
      items: { $ref: '#/Node' }
    rescheduled:
      type: array
      description: >-
        The non-summary tasks whose start, finish, total float or criticality have
        changed through the write without being written — the successors of a link or of an
        entered duration, the automatic tasks without a predecessor and their successors that
        the planning start date shifts, and what the critical path shifts (WF-PLA-0020,
        WF-PLA-0100) —, each one once, in outline order; empty when nothing else moved. A
        projection of their schedule, not the whole node: a chain of a thousand tasks stays
        light. The summary tasks they shift are returned whole in `ancestors`. Neither the ones
        nor the others see their counter advance: it follows only writes (`LockVersion`).
        The amounts that depend on the dates — the amounts, inflation included, the consumption
        year — are not there: they are in `reinflated`. Unlike `reinflated`,
        a task that `ancestors` returns whole — the carrier of a written line that the write
        re-dates — also appears there: both carry the same dates, and the grid can read either
        one.
      items: { $ref: '#/NodeSchedule' }
    reinflated:
      type: array
      description: >-
        Each node of which an amount, inflation included, or the consumption year of a
        line, has changed through the write without it being written: the estimate lines of a
        written or re-dated task, whose dates have moved — a changed role changes the task's
        calendar, hence its dates (WF-PLA-0010, WF-DEV-0040) —, and the non-summary tasks
        whose amounts these lines change, re-dated (`rescheduled`) or not, except
        those that `ancestors` returns whole. The summary tasks remain in `ancestors`. Each one
        once, in outline order; empty when none has moved. A projection of their amounts, not
        the whole node, like `rescheduled`: the amount at the rates of the reference year does
        not depend on the dates and does not change.
      items: { $ref: '#/NodeInflation' }
    totals:
      allOf: [{ $ref: '#/NodeTotals' }]
      description: >-
        The totals of the whole structure, without filter: those that a grid read without
        filter displays. A filtered grid rereads them with `listNodes`.
    structure_lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: >-
        The counter of the structure after the write (`CostStructure.lock_version`), which the
        next paste carries (WF-IHM-0110).

NodeSchedule:
  type: object
  required: [node_id, start, finish, total_float, is_critical, link_conflicts, finish_overdue]
  description: >-
    The schedule of a non-summary task that a write re-dated without writing it
    (`NodesWritten.rescheduled`): the values that the planning recomputes at each
    modification of a duration, of a link or of the structure (WF-PLA-0020), and that the
    critical path shifts (WF-PLA-0100), in the form of the fields of the same name of the
    time facet (`TaskFacet`) — the conflicting links included, so that the flag
    follows the write that creates or lifts it. The amounts that depend on the dates are not
    there. Without `lock_version`: a recalculation does not advance the task's counter, which
    remains the one the grid read (`LockVersion`).
  properties:
    node_id: { $ref: ../common.yaml#/Uuid }
    start: { $ref: ../common.yaml#/WorkInstant }
    finish: { $ref: ../common.yaml#/WorkInstant }
    total_float:
      anyOf: [{ $ref: '#/Duration' }, { type: 'null' }]
      description: >-
        Total float (WF-PLA-0100), computed: working time in working days
        (`unit: d`), decimal and signed, without minimum. A manual task bounds the late
        finish of its predecessors as well as the early start of its successors: a
        predecessor that cannot finish in time for it carries a negative float, it is
        critical, and the conflicting link is named (`link_conflicts`, WF-PLA-0020). Null
        for a manual task, which carries no float.
    is_critical:
      type: boolean
      description: >-
        Membership of the critical path, a zero or negative total float (WF-PLA-0100);
        false for a manual task.
    link_conflicts:
      type: array
      description: The task's conflicting links, like `TaskFacet.link_conflicts`.
      items: { $ref: '#/LinkConflict' }
    finish_overdue:
      type: boolean
      description: >-
        Finish overdue: true for a started task whose finish is earlier than the
        calculation date (WF-RAE-0040), like `TaskFacet.finish_overdue`.

LinkConflict:
  type: object
  required: [predecessor_node_id, successor_node_id, link_type]
  description: >-
    A link that an automatic predecessor cannot satisfy with a manual task — finishing or
    starting before the date that the link imposes, according to its type
    (WF-PLA-0030) —: the planning grid and the Gantt chart flag both tasks, naming the link,
    without recomputing any date (WF-PLA-0020, WF-IHM-0070,
    WF-ARC-0020). Computed, never entered; it disappears as soon as the dates allow.
  properties:
    predecessor_node_id: { $ref: ../common.yaml#/Uuid }
    successor_node_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: The manual task that the link connects to its predecessor.
    link_type: { $ref: '#/LinkType' }

NodeInflation:
  type: object
  required: [node_id, budgeted_amount, reestimated_amount, consumption_year]
  description: >-
    The amounts of an estimate line or of a non-summary task that a write shifted in
    time without writing it (`NodesWritten.reinflated`): those that depend on the
    dates, inflation included, in the form of the fields of the same name of its facet
    (`EstimateLineFacet`, `TaskFacet`), which the estimate and remaining-to-commit grids
    present (WF-DEV-0020, WF-DEV-0040, WF-DEV-0050). Without `lock_version`, like
    `NodeSchedule`: a recalculation does not advance the node's counter (`LockVersion`).
  properties:
    node_id: { $ref: ../common.yaml#/Uuid }
    budgeted_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        The budgeted amount, like `EstimateLineFacet.budgeted_amount` for a line and
        `TaskFacet.budgeted_amount` for a task — the sum of its lines. Projected onto the year
        in which the reference revision consumed the line, it follows the dates only on a project
        without a reference revision, where it coincides with the re-estimated amount
        (WF-DEV-0050).
    reestimated_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        The re-estimated amount, like `EstimateLineFacet.reestimated_amount` for a line and
        `TaskFacet.reestimated_amount` for a task — the sum of its lines.
    consumption_year:
      anyOf: [{ $ref: ../common.yaml#/Year }, { type: 'null' }]
      description: >-
        The consumption year of a line, like `EstimateLineFacet.consumption_year`; null
        for a task, whose facet carries none.

TaskProgress:
  type: string
  enum: [not_started, started, completed]
  description: Progress state of a task (WF-PLA-0130, WF-RAE-0030).

SchedulingMode:
  type: string
  enum: [automatic, manual]
  description: >-
    Scheduling mode of the task: dates computed from the links, or
    entered (WF-PLA-0020).

DurationUnit:
  type: string
  enum: [min, h, d, w, mo, emin, eh, ed, ew, emo]
  description: >-
    Unit of a duration, kept as it was entered or imported (WF-PLA-0160):
    working minutes, hours, days, weeks and months, which the installation's
    constants convert into hours (`DurationUnits`); elapsed minutes, hours, days,
    weeks and months, which are converted without a calendar — an elapsed day is worth
    twenty-four hours, a week seven days, a month thirty days. The front writes it
    with the Microsoft Project suffix in the reader's language (`j`, `sem`, `ej`…).

Duration:
  type: object
  required: [value, unit]
  description: >-
    Duration, in working time or in elapsed time: that of a task, in the unit of its
    entry (WF-PLA-0160), zero for a milestone (WF-PLA-0050); or a total float,
    computed in working days (WF-PLA-0100).
  properties:
    value:
      allOf: [{ $ref: ../common.yaml#/Decimal }]
      description: >-
        Never negative for the duration of a task; signed for a total float, negative
        when a predecessor cannot finish in time for a manual task
        (WF-PLA-0100).
    unit: { $ref: '#/DurationUnit' }

LagUnit:
  type: string
  enum: [min, h, d, w, mo, emin, eh, ed, ew, emo, percent]
  description: >-
    Unit of the lag of a link (WF-PLA-0030): those of a duration, and the
    percentage of the predecessor's duration — a lag of 50 % on a predecessor
    of ten days is worth five working days.

Lag:
  type: object
  required: [value, unit]
  description: >-
    Lag of a link in the unit of its entry, positive or negative — negative,
    it is a lead —, kept without conversion (WF-PLA-0030, WF-PLA-0160).
  properties:
    value:
      allOf: [{ $ref: ../common.yaml#/Decimal }]
      description: >-
        The number of units; in `percent`, the number of percent, and not a fraction from 0 to
        1: `50` for half the predecessor's duration, as MS Project writes it
        (WF-PLA-0030, WF-PLA-0160).
    unit: { $ref: '#/LagUnit' }

TaskFacet:
  type: object
  required:
    - label
    - scheduling_mode
    - duration
    - start
    - finish
    - progress
    - finish_overdue
    - awaiting_own_lines
    - is_summary
    - is_milestone
    - calendar_hours
    - total_float
    - is_critical
    - link_conflicts
    - base_amount
    - budgeted_amount
    - reestimated_amount
  description: >-
    Time facet of a node. The computed values — dates of an automatic task,
    mode, dates and duration of a summary task, float, criticality, conflicting links,
    physical progress, finish overdue — are not enterable (WF-IHM-0030). The float, the
    criticality and the conflicting links are required of every task, summary task included:
    a grid and the Gantt thus distinguish a task without float from a missing value
    (WF-PLA-0080, WF-PLA-0090, WF-PLA-0100). The duration is carried in the unit
    of its entry (WF-PLA-0160); the start and the finish are a date and the working hours
    elapsed on that day (WF-DAT-0100). A task, summary or leaf, can
    carry the attachment to a work package or an order item of the work breakdown
    (`work_package_id`, `order_item_id`, WF-PLA-0130, WF-PLA-0170); a task created by an MS
    Project import keeps the identifier that the file gave it (`external_id`, WF-INTF-0040).
  properties: &task_facet_properties
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    scheduling_mode: { $ref: '#/SchedulingMode' }
    duration: { $ref: '#/Duration' }
    start:
      anyOf: [{ $ref: ../common.yaml#/WorkInstant }, { type: 'null' }]
    finish:
      anyOf: [{ $ref: ../common.yaml#/WorkInstant }, { type: 'null' }]
    progress: { $ref: '#/TaskProgress' }
    finish_overdue:
      type: boolean
      description: >-
        Computed: true for a started task whose finish is earlier than the calculation
        date, which the remaining-to-commit grid flags (WF-RAE-0040). False otherwise.
    awaiting_own_lines:
      type: boolean
      description: >-
        Computed, always returned: true for a started summary task all of whose
        subordinates are completed and one of whose own non-provision lines keeps a remaining
        to commit (WF-PLA-0040); the remaining-to-commit grid and the Kanban flag it, as well as
        its own non-provision lines, the only open lines of the phase, according to the common
        scale (WF-IHM-0070). False for any other task. The flag of the lines is carried by
        their task: the front flags the own non-provision lines of a task whose
        flag is true (F-05, #1774).
    started_on:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: >-
        Start date, set at the change of state (WF-PLA-0130), null for a task
        not started. A task completed without having been started — a milestone completed from
        the Kanban, a task that the entry of a zero remaining to commit completes — takes as its
        start date that of its completion; a reopened milestone loses both
        (`ProgressUpdate`). A summary task carries that of the first of its started
        subordinates. A read column of the planning grid (`NodeColumn.started_on`,
        WF-PLA-0080).
    completed_on:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: >-
        Completion date, which places the earned value in time (WF-IND-0030), null for
        a task that is not completed. A summary task carries the latest of the completion
        dates of its subordinates and of the setting to zero of its own lines outside
        provision (WF-PLA-0130). A read column of the planning grid
        (`NodeColumn.completed_on`, WF-PLA-0080).
    is_summary:
      type: boolean
      description: 'Summary task: its state is derived from its subordinates, not enterable (WF-PLA-0040).'
    is_milestone:
      type: boolean
      description: Milestone, a task of zero duration (WF-PLA-0050).
    calendar_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        Applicable calendar, resolved on read: intersection of the calendars
        of the roles of the labour lines, or default calendar (WF-PLA-0010). Null when
        it is the intersection of several calendars, which has no identifier:
        `calendar_hours` then carries its hours.
    calendar_hours:
      allOf: [{ $ref: reference.yaml#/WeeklyHours }]
      description: >-
        Computed, never entered: the hours of each day of the week of the calendar applicable
        to the task, the one on which its dates and its duration are counted (WF-PLA-0010) — each
        day, the smallest of the numbers of hours that the calendars of the roles of its labour
        lines grant it; the default calendar if it carries none. A
        summary task and a milestone follow the same rule, on only the lines they carry:
        a summary task does not inherit the calendars of its subordinates, each of which has
        its own, and its dates as well as its duration are counted on its own (WF-PLA-0040). A
        day at 0 hours is a non-working day of the task, which the Gantt distinguishes; the
        contract knows no public holidays (WF-REF-0110). On a marked revision, the hours of the
        calendars it freezes (`EmployedReference`).
    total_float:
      anyOf: [{ $ref: '#/Duration' }, { type: 'null' }]
      description: >-
        Total float (WF-PLA-0100), computed: working time in working days
        (`unit: d`), decimal and signed, without minimum. A manual task bounds the late
        finish of its predecessors as well as the early start of its successors: a
        predecessor that cannot finish in time for it carries a negative float, it is
        critical, and the conflicting link is named on both tasks
        (`link_conflicts`, WF-PLA-0020). Null for a manual task, which carries no
        float. A summary task carries the smallest float of those of its subordinates that
        carry one, null when none carries one (WF-PLA-0100): one that carries a
        critical subordinate displays that subordinate's float, zero or negative.
    is_critical:
      type: boolean
      description: >-
        Membership of the critical path, computed: a zero or negative total float
        (WF-PLA-0100). False for a manual task, which never appears on the critical
        path; true for a summary task as soon as one of its subordinates is critical.
    link_conflicts:
      type: array
      description: >-
        The conflicting links (WF-PLA-0020), always returned, empty without conflict: on a
        manual task, those that its automatic predecessors cannot
        satisfy; on such a predecessor, those it does not satisfy. Each one names its
        two tasks and its type, in outline order of their predecessor, then of their
        successor; the grid and the Gantt flag both tasks according to the common
        scale (WF-IHM-0070) without cross-checking the floats or recomputing any date
        (WF-ARC-0020). A summary task carries none. Computed, never entered, they disappear as
        soon as the dates allow; a write that creates or lifts some returns them
        (`NodesWritten.rescheduled`).
      items: { $ref: '#/LinkConflict' }
    physical_progress:
      anyOf: [{ $ref: indicators.yaml#/Computable }, { type: 'null' }]
      description: >-
        Physical progress of a summary task, computed: the ratio of the budgeted amounts
        earned in its subtree — its own lines included, earned when it is
        completed, provision lines excluded (WF-IND-0030) — to the total of the budgeted amounts
        of that subtree, provision lines excluded (WF-IND-0060), to four decimal places (README,
        "A share…"), not computable when that total is zero (`no_budgeted_amount`,
        WF-IND-0010). Null for a task that is not a summary task.
    base_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Sum of the amounts at the rates of the reference year, before inflation, of the lines
        that the task carries and of those of its subordinates, computed by the server, never
        enterable: a read value, which the estimate grid presents for a task, summary task
        included (WF-DEV-0050). An attribute of the task: a grid filter does not change it,
        like the two sums that follow.
    budgeted_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Same sum, for the budgeted amounts, inflation included, at the consumption year of
        each line (WF-DEV-0020).
    reestimated_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Same sum, for the re-estimated amounts, inflation included, at the consumption year
        of each line (WF-DEV-0020, WF-DEV-0050).
    tracking:
      type: array
      description: Registrations to timelines and to time/time tracking (WF-PLA-0060).
      items: { $ref: '#/TrackingEntry' }
    order_item_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        The order item of the work breakdown that this task carries (WF-PLA-0170), under the
        same rules as `work_package_id`, exclusive of it: a task carries a work package or an
        order item, never both; an order item is carried by only one task at a time. "When the
        work package of an order item is attached, the task of that order item lies in the
        subtree of the task of that work package" (WF-PLA-0170). The grids filter by order item
        on this attachment (WF-DEV-0050, WF-RAE-0040).
    work_package_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        The work package of the work breakdown that this task carries, summary or leaf
        (WF-PLA-0170): set by the skeleton (WF-PRJ-0030), modifiable and removable, exclusive of
        `order_item_id`. A work package is carried by only one task at a time; it is through it
        that the estimate presents the total per work package, that of its subtree
        (WF-DEV-0060), and that the grids filter by work package. A summary task that loses its
        last subordinate keeps its attachment. Null without attachment.
    work_breakdown_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The label of the work package or order item carried, resolved on read, which the
        `work_breakdown` column presents without the grid reading the work breakdown
        (WF-ARC-0020); null without attachment.
    external_id:
      anyOf: [{ type: string, maxLength: 200 }, { type: 'null' }]
      description: >-
        The identifier that MS Project gave the task in the file whose import created
        it, kept as an external identifier (WF-INTF-0040): it is through it that a file
        reworked before the first export is matched to the task. Null for a task created
        in Waterfall, never entered.

EstimateLineFacet:
  type: object
  required:
    - label
    - cost_category_id
    - cost_category_label
    - resource_role_label
    - subproject_label
    - quantity
    - base_amount
    - budgeted_amount
    - reestimated_amount
    - is_computed
    - uses_inactive_object
    - remaining_entry
  description: >-
    Money facet of a node. The three amounts are computed and not enterable: the
    amount at the rates of the reference year, before inflation, is that of the line as
    it is priced, a read value (WF-DEV-0030, WF-DEV-0050); the budgeted amount, set
    by the reference revision and zero for a line added after it, and the re-estimated amount,
    updated by the reviews, are expressed inflation included, at the line's consumption
    year: it is as such that they enter the reference budget, the remaining to commit, the
    planned value and the earned value (WF-DEV-0020, WF-RAE-0040). A provision line
    is not projected: its amounts are those that its risk computes, the risk's own estimate
    already carrying its own projection (WF-DEV-0030, WF-PRJ-0040). The estimate grid
    presents the first and the re-estimated amount, never the budgeted amount (WF-DEV-0050).
    The category, the role and the subproject are named by their label, which the server
    resolves on read, the object active or deactivated, so that the grid matches no list
    (WF-ARC-0020, WF-REF-0150). A line that uses a deactivated reference data object says
    so (`uses_inactive_object`), so that the estimate and remaining-to-commit grids flag it
    (WF-REF-0010).
  properties: &estimate_line_facet_properties
    label:
      type: string
      minLength: 1
      pattern: '\S'
      maxLength: 300
      description: >-
        Label, composed by the server at creation when it is not sent
        (`EstimateLineWrite.label`, WF-DEV-0020), modifiable afterwards.
    cost_category_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        Cost category; that of a labour line is that of its role, computed and
        not enterable (`computed_fields`, Vérif of WF-DEV-0020).
    cost_category_label:
      type: string
      description: Label of the cost category, resolved on read, active or deactivated.
    quantity: { $ref: ../common.yaml#/Decimal }
    resource_role_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Required for a labour category, absent otherwise (WF-DEV-0020).
    resource_role_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Label of the resource role, resolved on read, active or deactivated; null for a
        line without a role.
    hours:
      anyOf: [{ $ref: ../common.yaml#/Hours }, { type: 'null' }]
    unit_disbursement:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: Unit disbursement of a non-labour line (WF-DEV-0020).
    payment_delay_days:
      anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
      description: >-
        Payment delay, by which the cumulative cost curve shifts the line's amount
        when it presents the cash-out (WF-IND-0100). Null for a provision line, which
        carries none and stays at the date of the task that carries it (WF-DEV-0020,
        WF-IND-0100; EP-14/L42s).
    subproject_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Optional subproject; without it, the line falls under "Hors sous-projet" (WF-IND-0020).
    subproject_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Label of the subproject, resolved on read; null for a line outside any subproject.
    base_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Amount at the rates of the reference year, before inflation, computed: the product of
        the quantity, the effort and the hourly rate of the category for the pricing's reference
        year for a labour line, of the quantity and the disbursement otherwise
        (WF-DEV-0030); a read value, which the estimate grid presents next to the
        re-estimated amount (WF-DEV-0050).
    budgeted_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Amount set by the reference revision (§3.2.5, WF-DEV-0020), derived from its reference
        figures, inflation included, at the consumption year that the reference gave
        it (WF-DEV-0030, WF-RAE-0010); zero for a line added after it or that came from
        an occurred risk — except a line that an amendment's differential designates: the
        merge gives it the reference figures it carries, from which its budgeted amount is
        derived (WF-REV-0050). A provision line carries the provision it had in the reference
        revision: this amount counts toward the risk reserve (`RiskCoverageTotals.reserve`, which
        also keeps that of the risks that left the identified state before the reference), never
        toward the reference budget, which
        is the sum of the budgeted amounts excluding provision lines (WF-RIS-0050, glossary)
        and is read in the indicators, never by summing these amounts.
    reestimated_amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: >-
        Re-estimated amount, computed from the line's current figures (WF-DEV-0020) —
        those of its last re-estimate from the grid or by the import (WF-RAE-0040); for
        a line that nobody has re-estimated, those of the reference, or of the amendment whose
        merge changed them (WF-REV-0050), priced at the rates kept by the current
        revision (WF-REV-0060) and on its current consumption year (WF-RAE-0010) —: at
        unchanged hourly rates, the budgeted amount carried over to the current consumption
        year. It is this amount that the remaining to commit counts for a line of a task not
        completed, started or not, re-estimated or not. It is the amount at the rates of the
        reference year projected onto its current consumption
        year at the project's inflation rate, compounded once per year elapsed since
        the reference year, each part of a task straddling several years projected
        onto its own (WF-DEV-0030, WF-DEV-0040). A line whose task falls two years
        after the reference year, at 2 % inflation, carries it 4.04 % higher than its
        amount at the rates of the reference year (WF-DEV-0050). A provision line is not
        projected.
    previous_quantity:
      anyOf: [{ $ref: ../common.yaml#/Decimal }, { type: 'null' }]
      description: >-
        Quantity at the previous remaining to commit, which the remaining-to-commit grid
        presents next to the current one (WF-RAE-0040), read from the line and not from another
        revision (WF-ARC-0020); null before the first review.
    previous_hours:
      anyOf: [{ $ref: ../common.yaml#/Hours }, { type: 'null' }]
      description: >-
        Effort at the previous remaining to commit (WF-RAE-0040); null before the first review,
        and for a line without effort, like `hours`.
    previous_unit_disbursement:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: >-
        Unit disbursement at the previous remaining to commit (WF-RAE-0040); null before the
        first review, and for a labour line, like `unit_disbursement`.
    previous_reestimated_amount:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
      description: >-
        Re-estimated amount at the previous remaining to commit, inflation included, which the
        remaining-to-commit grid presents next to the current one (WF-RAE-0040), with the
        figures from which it was computed (`previous_quantity`, `previous_hours`,
        `previous_unit_disbursement`); null before the first review.
    consumption_year:
      anyOf: [{ $ref: ../common.yaml#/Year }, { type: 'null' }]
      description: >-
        Consumption year, deduced from the planning: that of the start of the task that carries
        the line. For a task spanning several years, the year of the first part of the line, its
        amounts being projected part by part (`reestimated_amount`, WF-DEV-0040); the filters
        `consumption_year_min` and `consumption_year_max` retain the line on that year.
    is_computed:
      type: boolean
      description: >-
        True for a provision line, whose amount is computed from the
        risk and never entered (WF-RIS-0010).
    uses_inactive_object:
      type: boolean
      description: >-
        Computed: true when the cost category, the resource role or the kind of
        the line is deactivated in the reference data; the line remains readable, the grid
        flags it (WF-REF-0010). The refusal of an entry that would use a deactivated
        object is unchanged (`INACTIVE_REFERENCE_OBJECT`).
    remaining_entry:
      allOf: [{ $ref: '#/EntryAvailability' }]
      description: >-
        Whether the line accepts a re-estimate at the remaining to commit, and otherwise what it
        lacks, in the order of `CommandCondition`: the lines of a completed task are not
        modified (`task_not_completed`, WF-RAE-0040); a provision line is never
        re-estimated, its amount being the one its risk computes and the remaining to commit
        counting it for that amount (`line_not_provision`, WF-RIS-0010, WF-RAE-0010). The grid
        reads it line by line, without deducing the rule from the progress or from the kind of
        the line.
    bearing_task_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: Carrying task, resolved on read.
    bearing_task_label:
      anyOf: [{ type: string }, { type: 'null' }]

LinkType:
  type: string
  enum: [finish_to_start, start_to_start, finish_to_finish, start_to_finish]
  description: The four link types (WF-PLA-0030).

PredecessorWrite:
  type: object
  required: [predecessor_node_id, link_type, lag]
  description: >-
    Link of a task to one of its predecessors, with its lag in its unit:
    negative, it is a lead (WF-PLA-0030).
  properties:
    predecessor_node_id: { $ref: ../common.yaml#/Uuid }
    link_type: { $ref: '#/LinkType' }
    lag: { $ref: '#/Lag' }

Predecessor:
  description: >-
    Link as the read returns it: the row number of the predecessor, computed
    like `row_number` in the numbering of the whole structure, whether or not it is
    retained by the search and the filters (WF-PLA-0080).
  allOf:
    - $ref: '#/PredecessorWrite'
    - type: object
      required: [predecessor_row_number]
      properties:
        predecessor_row_number:
          type: integer
          minimum: 1
          readOnly: true

PredecessorsReplace:
  type: object
  required: [predecessors, lock_version]
  properties:
    predecessors:
      type: array
      description: >-
        The task's predecessors, which replace its own. "Two tasks are connected by at most
        one link" (WF-PLA-0030): a `predecessor_node_id` appears in it only once,
        and each occurrence after the first is refused with 422 `VALIDATION_FAILED`, `fields`
        designating `/predecessors/<n>/predecessor_node_id`, `n` its rank starting from 0,
        reason `DUPLICATE_PREDECESSOR`, without parameter; nothing is written (F-03,
        US-0702/L2).
      items: { $ref: '#/PredecessorWrite' }
    lock_version: { $ref: ../common.yaml#/LockVersion }

TrackingEntry:
  type: object
  required: [kind]
  description: >-
    A registration of a task to a tracking (WF-PLA-0060): to a timeline of the project
    (`timeline`, WF-PLA-0140), or, for a milestone, to time/time tracking (`milestone_tracking`).
    The entries sent replace those of the task; an entry repeated identically counts as
    only one. Each refusal designates the entry by its rank in `entries`, starting from 0, and
    nothing is written (F-11, US-0702/L2).
  properties:
    kind:
      type: string
      enum: [timeline, milestone_tracking]
    timeline_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        The timeline, required for `timeline`: absent or null, 422 `VALIDATION_FAILED`,
        `fields` on `/entries/<n>/timeline_id` with `VALUE_REQUIRED`; a timeline that is not
        the project's, or that the server does not have, with `UNKNOWN_TIMELINE`. Null or absent
        for `milestone_tracking`, which targets no timeline: sent, with
        `FIELD_NOT_ACCEPTED`.

Timeline:
  type: object
  required: [timeline_id, label]
  description: Named timeline, to which tasks are registered (WF-PLA-0140, WF-PLA-0060).
  properties:
    timeline_id: { $ref: ../common.yaml#/Uuid }
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 200 }

TimelineCreate:
  type: object
  required: [label]
  description: >-
    A created timeline, without registration (`createTimeline`, WF-PLA-0140): its name, from 1
    to 200 characters, never blank, like the one it carries when read (`Timeline.label`;
    D-12, J-13).
  properties:
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 200 }

NodeCreate:
  type: object
  required: [kind, parent_id]
  description: >-
    The created node takes its place under `parent_id`, after the sibling that `after_node_id`
    names. The lines of a task always precede its subtasks (`Node.position`): null, a line is
    placed at the head of the lines, a task at the head of the subtasks; absent, a line is placed
    after the last line, a task after the last subtask. An `after_node_id` of a
    different kind from the created node falls back to the boundary between lines and subtasks:
    a line sent after a subtask is placed after the last line, a task sent after
    a line at the head of the subtasks (#1187). An `after_node_id` that is not a sibling under
    the targeted parent — a node of another parent, or one not in the structure — is refused
    with 422 `VALIDATION_FAILED`, `fields[].pointer` at `/after_node_id`, reason
    `NODE_NOT_SIBLING`, nothing being written: the grid designates the place by the node it
    reads, never by a rank that a filtered read does not let it count (#1183). A task created
    under a milestone, which carries no subtasks, is refused with 422 `VALIDATION_FAILED`,
    `fields[].pointer` at `/parent_id`, reason `MILESTONE_HAS_NO_SUBTASK`, `fields[].params`
    naming the milestone (`node_id`, `label`), nothing being written; an estimate line under a
    milestone is allowed (WF-PLA-0050; F-04, #1771).
  properties:
    kind: { $ref: '#/NodeKind' }
    parent_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    after_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    task: { $ref: '#/TaskFacetWrite' }
    estimate_line: { $ref: '#/EstimateLineWrite' }

TaskFacetWrite:
  type: object
  required: [label]
  description: >-
    Enterable fields of a task, at its creation (WF-PLA-0130). Computed values are
    refused. The duration is entered in its unit (WF-PLA-0160); the start and the finish,
    enterable in manual mode, are entered as on modification (`WorkInstantWrite`):
    without their hours, which the server completes on the task's calendar — the default
    calendar for a task created without a line (WF-PLA-0010) —, and which the read returns
    completed (`WorkInstant`, WF-DAT-0100; `node_created_manual`, #1769); hours sent outside
    the day are refused, `/task/start/hours` or `/task/finish/hours` with `VALUE_OUT_OF_RANGE`.
    A date on a day without any working hour in the task's calendar is refused,
    naming the next working day (`NON_WORKING_DAY`, WF-PLA-0020), as on modification
    (`TaskFacetUpdate`; #1345). The attachment to a work package or an order item is accepted
    from any task of the main structure and follows the rules of `TaskFacetUpdate`, the parent
    of the created task (`NodeCreate.parent_id`) telling whether the task of an order item
    stays under that of its work package.
  properties:
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    scheduling_mode: { $ref: '#/SchedulingMode' }
    duration: { $ref: '#/Duration' }
    start:
      anyOf: [{ $ref: ../common.yaml#/WorkInstantWrite }, { type: 'null' }]
    finish:
      anyOf: [{ $ref: ../common.yaml#/WorkInstantWrite }, { type: 'null' }]
    order_item_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    work_package_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]

TaskFacetUpdate:
  type: object
  required: [lock_version]
  minProperties: 2
  description: >-
    Modification of a task, cell by cell (WF-IHM-0040): only the counter as read is
    required, any other field is optional, and only what is sent changes — an absent field
    remains what it was. The same fields as at creation (`TaskFacetWrite`): the start and the
    finish are entered without their hours, which the server completes on the task's calendar
    (`WorkInstantWrite`, #1244, #1769), and a date on a day without any working
    hour in that calendar is refused, naming the next working day (`NON_WORKING_DAY`,
    WF-PLA-0020; #1271); a value
    that the server computes for this node is refused (`COMPUTED_VALUE`, WF-IHM-0030) — such as
    the mode of a summary task, always automatic and never enterable (`scheduling_mode`
    sent on it, even `automatic`, WF-PLA-0040) —, and a field
    that the node does not accept, neither entered nor computed for it — the duration of a
    milestone, which has none to enter (WF-PLA-0050) —, with `FIELD_NOT_ACCEPTED`
    (`editable_fields`; EP-14/L42s).

    The attachment to the work breakdown (WF-PLA-0170): `work_package_id` or `order_item_id`
    attaches the task, summary, leaf or milestone, to that work package or order item, `null`
    removes the attachment. The swap is done in one write: `{work_package_id: null, order_item_id:
    X}` on a task that carries a work package removes the work package and attaches the order
    item. The refusal is a
    422 `VALIDATION_FAILED`, `fields` on the field sent, one entry per reason that applies —
    `WORK_BREAKDOWN_ITEMS_EXCLUSIVE` and `WORK_BREAKDOWN_ITEM_ALREADY_ATTACHED` returned together
    when both apply:
    `WORK_BREAKDOWN_MAIN_STRUCTURE_ONLY` when the task is not in the main structure —
    of a differential or of a risk's own estimate, which carry none; `null` is
    accepted there, which changes nothing —; `UNKNOWN_WORK_BREAKDOWN_ITEM` when the project's
    work breakdown does not have that work package or order item;
    `WORK_BREAKDOWN_ITEMS_EXCLUSIVE`, without parameter, when both are sent non-null — each
    refused at its field —, or when one is sent non-null while the other is carried and is not
    set to `null` in the same body — "never to both", the attachment "of the same task to a
    work package and to an order item" is refused;
    `WORK_BREAKDOWN_ITEM_ALREADY_ATTACHED` when another task already carries that work package
    or order item — "a work package or an order item is carried there by only one task at a
    time", "the attachment of a task to an order item already carried by another is
    refused" —, `fields[].params.conflicting_object_id`
    naming the node of that task and `conflicting_object_label` its label, the planning
    grid, filtered, possibly not reading it; `ORDER_ITEM_OUTSIDE_WORK_PACKAGE` when the
    attachment would take the task of an order item out of the subtree of the task of its work
    package — an order item attached to a task outside the subtree of the task of its work
    package, or a work package attached to a task whose subtree does not contain the task of
    one of its order items —,
    `fields[].params.work_package_task` naming the task of the work package and
    `order_item_tasks` those of the order items concerned, each by its node and its label, like
    the failure of a merge (Vérif of WF-PLA-0170; WF-IHM-0080; EP-14/L42s).
  properties:
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    description:
      anyOf: [{ type: string }, { type: 'null' }]
    scheduling_mode: { $ref: '#/SchedulingMode' }
    duration: { $ref: '#/Duration' }
    start:
      anyOf: [{ $ref: ../common.yaml#/WorkInstantWrite }, { type: 'null' }]
    finish:
      anyOf: [{ $ref: ../common.yaml#/WorkInstantWrite }, { type: 'null' }]
    work_package_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: The work package of the work breakdown to carry, or `null` to remove the attachment.
    order_item_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: The order item of the work breakdown to carry, or `null` to remove the attachment.
    lock_version: { $ref: ../common.yaml#/LockVersion }

EstimateLineWrite:
  type: object
  required: [quantity]
  description: >-
    Enterable fields of an estimate line, at its creation (WF-DEV-0020): the role and the
    effort for a labour line, the category and the unit disbursement for another;
    a field that the line does not accept — the disbursement of a labour line, the role or the
    effort of another — is refused with 422, reason `FIELD_NOT_ACCEPTED` on its field
    (EP-14/L42s). A role sent makes the line a labour line, whose category
    is that of the role, computed (Vérif of WF-DEV-0020): the category is not required;
    sent, the role's is accepted, another refused with 422 `VALIDATION_FAILED`, `fields` on
    `/estimate_line/cost_category_id`, reason `COMPUTED_VALUE`, the grid naming what it
    depends on (`resource_role`, `getComputedValueDependencies`, WF-IHM-0030). Without a role,
    the category is required: absent, refused with `VALUE_REQUIRED` on the same field.
  properties:
    label:
      type: string
      minLength: 1
      pattern: '\S'
      maxLength: 300
      description: >-
        Optional: absent, the server composes the label from that of the task that carries the
        line and, if there is one, from that of its role, separated by an em dash between two
        spaces — "Mise en service — Technicien de mise en service" —, truncated to 300
        characters; sent, it is taken as is, non-empty (WF-DEV-0020). The label remains
        modifiable (`EstimateLineUpdate`).
    cost_category_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        Required without a role; for a labour line, that of the role, computed — sent, it
        must be its own.
    quantity: { $ref: ../common.yaml#/Decimal }
    resource_role_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    hours:
      anyOf: [{ $ref: ../common.yaml#/Hours }, { type: 'null' }]
    unit_disbursement:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
    payment_delay_days:
      anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
      description: >-
        Payment delay, in days. Absent, zero, for a labour line as for any other line this
        write creates; only a provision line carries none (null), and it is not created here
        (WF-DEV-0020, WF-RIS-0010).
    subproject_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]

EstimateLineUpdate:
  type: object
  required: [lock_version]
  minProperties: 2
  description: >-
    Modification of an estimate line, cell by cell (WF-IHM-0040): only the counter
    as read is required, any other field is optional, and only what is sent changes — an
    absent field remains what it was. The same fields as at creation
    (`EstimateLineWrite`); a field that the line does not accept — the disbursement of a
    labour line, the role or the effort of another, the payment delay of a provision
    line, which carries none (WF-DEV-0020, WF-IND-0100; EP-14/L42s) — is refused with 422
    `VALIDATION_FAILED`, `fields` on its field, reason `FIELD_NOT_ACCEPTED`, and the node says
    which ones it accepts (`editable_fields`). The payment delay is entered on a labour line
    as on a non-labour line, zero by default for the former
    (WF-DEV-0020; #785). The category of a labour line is that of its role,
    computed: a changed role gives it the category of the new role, and a category sent
    on it that is not that of its role — the role sent in the same body, or the one
    it carries — is refused with 422 `VALIDATION_FAILED`, `fields` on `/cost_category_id`,
    reason `COMPUTED_VALUE`, like any computed value (`resource_role`, WF-DEV-0020,
    WF-IHM-0030); its own changes nothing, as at creation (`EstimateLineWrite`).
  properties:
    label: { type: string, minLength: 1, pattern: '\S', maxLength: 300 }
    cost_category_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        The category of a non-labour line; a labour line takes its own from its role, and
        refuses another (`COMPUTED_VALUE`).
    quantity: { $ref: ../common.yaml#/Decimal }
    resource_role_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    hours:
      anyOf: [{ $ref: ../common.yaml#/Hours }, { type: 'null' }]
    unit_disbursement:
      anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
    payment_delay_days:
      anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
    subproject_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        The line's subproject, or `null` to move it outside any subproject. That of a provision
        line is the one its risk designates, computed: sent on it, it is refused with
        422 `COMPUTED_VALUE`, like its figures (WF-IHM-0030), and is changed through the risk
        (`updateRiskProvision`, `update_provision`, WF-RIS-0010); a paste refuses the cell
        likewise. A line whose task is started or completed does not leave a subproject that has
        received actual costs, a share of these costs being due to it: moving it to another
        subproject or outside any subproject is refused with 422 `VALIDATION_FAILED`, `fields` on
        `/subproject_id`, reason `SUBPROJECT_HAS_ACTUAL_COSTS`, `params.subproject` naming the
        subproject left (`subproject_id`, `label`), and the line does not name this field in
        `editable_fields`. A line of a task not started changes subproject (WF-PRJ-0050; C-359,
        #1066). A paste and an import likewise refuse the cell or the line that would move it
        (`PasteRejection`, `ImportRejection`; #1152).
    lock_version: { $ref: ../common.yaml#/LockVersion }

NodeMove:
  type: object
  required: [node_ids, parent_id, lock_version]
  description: >-
    Move of nodes under a parent. A move that would take the task of an order item out of the
    subtree of the task of its attached work package — the order item's task, or a task that
    contains it — is refused (WF-PLA-0170): 422 `VALIDATION_FAILED`, `fields[].pointer` on the
    moved node concerned (`/node_ids/0`), `fields[].code` at `ORDER_ITEM_OUTSIDE_WORK_PACKAGE`,
    `fields[].params.work_package_task` and `order_item_tasks` naming the task of the work
    package and those of the order items, each by its node and its label (`node_id`, `label`):
    the grid, filtered, may not read them (WF-PLA-0170, WF-IHM-0080; EP-14/L42s). A selection is
    judged on the structure that the move would leave, all its nodes moved: a refusal that names
    a node names the first one concerned in outline order of the structure read, and
    `LINK_CYCLE` the loop that the move of that one closes (#1169): the order of the refusal is
    that of the outline, the order of `node_ids` governs only the placement. The moved nodes
    take their place under `parent_id`, in the order of `node_ids`, after the sibling that
    `after_node_id` names, according to the rule of `NodeCreate`: the lines of a task always
    precede its subtasks; null, a line is placed at the head of the lines, a task at the head of
    the subtasks; absent, a line after the last line, a task after the last subtask, moved nodes
    excluded — a moved node does not count among the siblings it would follow —; an
    `after_node_id` of a different kind falls back to the boundary between lines and subtasks, a
    line after a subtask being placed after the last line, a task after a line at the head of
    the subtasks. A selection that mixes lines and tasks applies this rule to each node, in the
    order of `node_ids`: the first node of each kind takes the place that the rule gives it
    after `after_node_id`, and each of the following ones is placed after the previous one of
    its kind — the moved lines stay together among the lines, the tasks among the subtasks
    (#1187; `nodes_move_mixed`). An `after_node_id` that is not a sibling under the targeted
    parent — a node of another parent, one of the moved nodes, or a node not in the
    structure — is refused with 422 `VALIDATION_FAILED`, `fields[].pointer` at `/after_node_id`,
    reason `NODE_NOT_SIBLING`, nothing moving (#1183). A provision line among `node_ids` is
    refused with 422 `VALIDATION_FAILED`, `fields[].pointer` on it, reason
    `PROVISION_LINE_MOVED_BY_RISK`, `fields[].params.risk` naming its risk: its task is
    designated through the risk's form (WF-RIS-0010; #1227). A task moved under a milestone,
    which carries no subtasks, is refused with 422 `VALIDATION_FAILED`,
    `fields[].pointer` at `/parent_id`, reason `MILESTONE_HAS_NO_SUBTASK`, `fields[].params`
    naming the milestone (`node_id`, `label`), nothing moving; an estimate line moved under
    a milestone is allowed (WF-PLA-0050; F-04, #1771).
  properties:
    node_ids:
      type: array
      minItems: 1
      items: { $ref: ../common.yaml#/Uuid }
    parent_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    after_node_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
    lock_version: { $ref: ../common.yaml#/LockVersion }

ProgressUpdate:
  type: object
  required: [progress, lock_version]
  description: >-
    Starts, completes or reopens a task, the gesture of a Kanban card
    (`KanbanCommandAvailability.progress`). The date is that of the gesture by default, and the
    completion places the earned value (WF-RAE-0030, WF-IND-0030, WF-PLA-0130). A completed
    task is reopened: a milestone by bringing it back to "not started", its start and
    completion dates cleared — the only case where a task returns to that state —, any other
    task by setting it back to "started" (WF-RAE-0030). `not_started` sent for a task that is
    not a completed
    milestone is refused with 409, `missing_condition` at `completed_milestone`: a task
    started by mistake is corrected by undoing the entry (WF-IHM-0110). The direct move from
    not started to completed is open only to a milestone, which never goes through the started
    state: `completed` on a not-started milestone writes `completed_on` and `started_on` at
    `occurred_on`, a task completed without having been started taking as its start date
    that of its completion, without exception (WF-PLA-0130). The operation is refused on a
    summary task, whose state is derived (WF-PLA-0040, WF-PLA-0050).
  properties:
    progress: { $ref: '#/TaskProgress' }
    occurred_on: { $ref: ../common.yaml#/PlanningDate }
    lock_version: { $ref: ../common.yaml#/LockVersion }

RemainingUpdate:
  type: object
  required: [reestimated_amount_basis, lock_version]
  description: >-
    Re-estimates a line whose task is not completed; a zero remaining to commit for
    all the lines of a task completes it, on the date carried by `completed_on`
    (WF-RAE-0040, WF-RAE-0010, WF-PLA-0130). A not-started task that is not a milestone
    then goes through the started state, started and completed on that same date: only a
    milestone goes directly from not started to completed (WF-RAE-0030).
  properties:
    reestimated_amount_basis:
      type: object
      description: >-
        The entered figures from which the re-estimated amount is recomputed. Only what is sent
        changes, an absent figure remaining what it was; a figure the line does not accept —
        the unit disbursement of a labour line, the hours of another line — is refused with
        422, reason `FIELD_NOT_ACCEPTED` on its field, and nothing is written (WF-DEV-0020,
        WF-RAE-0040).
      properties:
        quantity: { $ref: ../common.yaml#/Decimal }
        hours:
          anyOf: [{ $ref: ../common.yaml#/Hours }, { type: 'null' }]
        unit_disbursement:
          anyOf: [{ $ref: ../common.yaml#/Money }, { type: 'null' }]
    reason:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Free text accepted and ignored: no requirement reads it, the server keeps nothing of it
        and returns it nowhere. A client need not send it.
    completed_on:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: >-
        Completion date of the task, asked for at validation when the entry completes it —
        the last of its still-open lines set to zero —, proposed by the screen as the current
        day and modifiable (WF-RAE-0040, WF-PLA-0130). Required in that case: without it, the
        entry is refused with a reason `COMPLETION_DATE_REQUIRED` on `/completed_on`,
        `fields[].params.task_node_id` naming the task, and nothing is written; the screen asks
        for the date and replays the entry. For a not-started task, milestone included, the same
        date is also that of its start (`started_on`, WF-PLA-0130); a task that is not
        a milestone goes through the started state (WF-RAE-0030). Ignored when the entry does
        not complete the task.
    lock_version: { $ref: ../common.yaml#/LockVersion }

UndoResult:
  type: object
  required: [undone, written, remaining_depth]
  description: >-
    Undoes or redoes the last modification in the caller's history on the revision
    (`undoLastChange`, which describes that history). An undo is a modification like any
    other: it returns what a write returns (`written`), and it is refused with 409 if a later
    modification bears on the same object, `UNDO_CONFLICT` naming it (WF-IHM-0110). Risk
    entries — creation, change of the provision, review, deletion — are in the same history as
    those of the grids (WF-RIS-0020): their undo names the risk returned to its previous state.
    Modifying a risk's identity, project data, does not enter it (`updateRisk`;
    H-02, #1782). Any
    undo and any redo that would bring back a subproject deleted since — to the provision
    of a risk created or deleted, or whose provision has changed, or to an estimate line by a
    grid write, the deletion of a line or of a task and its lines included — are refused with
    409 `STATE_FORBIDS_OPERATION`, `params.missing_condition` at `restored_subproject_exists`,
    and neither undo nor redo anything (decision of the author, #732). Likewise, any undo and
    any redo that would recreate a risk's provision line on a main structure
    without tasks, or with a category that is no longer active and of type risk provision, are
    refused with `at_least_one_task` or `active_provision_category` (`undoLastChange`,
    `redoLastUndo`; WF-RIS-0010, #795).
  properties:
    undone:
      type: object
      required: [kind, node_ids, risk_ids]
      properties:
        kind: { $ref: '#/UndoneKind' }
        node_ids:
          type: array
          description: >-
            The nodes that the undo, or the redo, returns to their previous state; empty
            for a risk entry.
          items: { $ref: ../common.yaml#/Uuid }
        risk_ids:
          type: array
          description: >-
            The risks that the undo, or the redo, returns to their previous state
            (WF-IHM-0110, WF-RIS-0020); empty for a grid entry.
          items: { $ref: ../common.yaml#/Uuid }
    written:
      anyOf: [{ $ref: '#/NodesWritten' }, { type: 'null' }]
      description: >-
        What the undo, or the redo, wrote into a structure, like any
        grid write: nodes returned to their state, ancestors recomputed, tasks re-dated,
        totals and counter of the structure, so that the grid shows correctly without rereading
        the structure and keeps the counter that its next entry will carry (WF-IHM-0040,
        WF-IHM-0110). Null for a risk entry, which writes into a structure only through the
        provision line of its risk: the grid then rereads its structure.
    remaining_depth:
      type: integer
      minimum: 0
      description: >-
        The modifications that remain to be undone in the caller's history on the revision,
        after this one — for the redo, those that remain to be redone.

UndoneKind:
  type: string
  enum:
    - cell
    - node_create
    - node_delete
    - node_move
    - paste
    - link
    - progress
    - remaining
    - tracking
    - structure_update
    - risk_create
    - risk_update
    - risk_review
    - risk_delete
  description: >-
    The kind of the modification undone or redone, which the front expresses through its
    catalogue (WF-ARC-0110): a cell (`updateTaskFacet`, `updateEstimateLine`), a creation or a
    deletion of a node, a move, a paste, a link (`setPredecessors`), a
    progress change, a re-estimate (`setLineRemaining`), a tracking registration, the planning
    start date or the label of a structure (`updateCostStructure`); or a risk
    entry — creation, modification, review, deletion (WF-RIS-0020).

PastePreview:
  type: object
  required: [target_node_id, target_column, rows]
  description: >-
    Block pasted from a spreadsheet, on the targeted cell: the node and its column. The preview
    tells what will be written and what will be refused, with the reason for each refusal;
    nothing is written without confirmation, and the confirmation writes the valid rows, never
    the refused rows (WF-IHM-0050).

    The first column of the block fills `target_column`; each of the following ones fills the
    next column of the targeted node's facet, in the order of `NodeColumn` — for an
    estimate line pasted on its label: the category, the role, the quantity, the effort,
    the unit disbursement, the subproject, the payment delay; for a task: the
    description, the mode, the duration, the start, the finish. Each row of the block writes the
    grid row at the same distance below the targeted node, in outline order. On a differential,
    the nodes it removes, which its read returns in their place as read-only (`NodeDifference`),
    do not count: the paste skips them, without refusal, and the block row that would have fallen
    on one of them writes the next node that is not removed, the following block rows the nodes
    after it — a two-row block pasted on the row that precedes a removed row writes that
    row, then the node that follows the removed row (the author's decision of 2026-10-22,
    #1278). `PastePlan.accepted` and `PasteRejection.row` count the rows of the block, never the
    skipped nodes. A block whose targeted cell is itself on a removed node, which accepts no
    field (`editable_fields` empty), is refused whole: `PastePlan.accepted` at `0`, and a single
    `PasteRejection`, `row` at `0`, `column` the targeted column, `code` at `PASTE_TARGET_REMOVED`,
    no other row being judged; the anchor is not carried over to the next node, which would write
    elsewhere than where the user clicked (decision of the author, reframing of EP-16, #1361).
    No cell is shifted: a cell that falls on a column that its row
    does not accept is refused, the row and the column named (`PastePlan.rejected`), unless
    it is empty, which writes nothing — a field computed for this node with `COMPUTED_VALUE`, a
    field that its kind refuses or a column that no write carries, like the amounts,
    with `FIELD_NOT_ACCEPTED` (EP-14/L42s); the subproject of a line that cannot leave it,
    with `SUBPROJECT_HAS_ACTUAL_COSTS` (`PasteRejection`); any column of a line of
    the main structure whose task is completed, which accepts none, with
    `STATE_FORBIDS_OPERATION`, `params.missing_condition` at `task_not_completed`, the line not
    being written (WF-RAE-0040; F-01, #1766). A block wider than the
    columns of the facet from the targeted column onwards is refused with 422 (`PASTE_TOO_WIDE`,
    `params.max_columns`).
  properties:
    target_node_id: { $ref: ../common.yaml#/Uuid }
    target_column:
      allOf: [{ $ref: '#/NodeColumn' }]
      description: The column of the targeted cell, which the first column of the block fills.
    rows:
      type: array
      minItems: 1
      items:
        type: array
        items: { type: string }

PastePlan:
  type: object
  required: [paste_id, accepted, rejected]
  description: >-
    What a paste will write and what it will refuse, each refusal with its reason and, when it
    concerns a cell, its column (WF-IHM-0050). A block row one of whose cells is
    refused is refused whole: confirmed, the paste writes the other rows and not this one
    (`applyPaste`, `PasteApplied`); abandoned, it writes nothing.
  properties:
    paste_id: { $ref: ../common.yaml#/Uuid }
    accepted:
      type: integer
      minimum: 0
      description: >-
        The number of block rows that the confirmation will write. On a differential, a removed
        node that the paste skips is not counted in it, and is not refused either: each
        block row writes the next node that is not removed (`PastePreview`, #1278).
    rejected:
      type: array
      description: >-
        The refusals, in the order of the block rows then of the columns; a row refused by
        several cells appears for each of them.
      items: { $ref: '#/PasteRejection' }

PasteRejection:
  type: object
  required: [row, code]
  description: >-
    The refusal of a row of a pasted block, which the preview announces and the confirmation
    repeats: the row, and, when it concerns a cell, its column, with its reason (WF-IHM-0050). The
    confirmation adds some: the reference data has no counter, and it judges again the rows
    accepted by the preview; a row that has become invalid in the meantime — a category or a role
    deactivated since the preview, `INACTIVE_REFERENCE_OBJECT` — is refused in turn, without
    being written, and repeated in `PasteApplied.rejected` like the preview's refusals
    (EP-14/L42q, #747).
    A cell that names a deactivated category or role is refused, at the preview as at
    the confirmation, only if it changes the category or the role of its line: one that names the
    category or the role that the line already carries, deactivated since, changes nothing and is
    not refused, like the parent of a node, the category of a role or that of a risk
    (`updateOrgNode`, `updateResourceRole`, `updateRiskProvision`; EP-14/L42j, #747). A
    cell of the `work_breakdown` column pasted on a task of a differential or of a risk's own
    estimate is refused with `WORK_BREAKDOWN_MAIN_STRUCTURE_ONLY`: the attachment
    exists only in the main structure (WF-PLA-0170; EP-14/L42k); pasted on a task
    of the main structure, it follows the rules of the attachment (`TaskFacetUpdate`), and
    `ORDER_ITEM_OUTSIDE_WORK_PACKAGE` carries in `params` the task of the work package and those
    of the order items (`work_package_task`, `order_item_tasks`), like the refusal of a cell
    (EP-14/L42s). A
    cell of the `subproject` column pasted on a line whose task is started or completed,
    and whose subproject has received actual costs — a line that does not name
    `estimate_line.subproject_id` in `editable_fields` —, is refused with
    `SUBPROJECT_HAS_ACTUAL_COSTS` if it names another subproject, `params.subproject`
    naming the subproject that the line cannot leave (`subproject_id`, `label`), like
    `updateEstimateLine`; a cell that names the line's subproject does not move it, and
    is not refused, nor is an empty cell, which writes nothing (`PastePreview`) (WF-PRJ-0050;
    C-359, #1152). A role cell that would leave the task of its line without any working
    hour in the week is refused with `TASK_WITHOUT_WORKING_HOURS`, `params` naming the
    roles and the task like the refusal of an entry (`resource_roles`, `tasks`), and the line is
    not written (WF-PLA-0010; #779). A paste whose targeted cell is on a node removed by
    the differential is refused whole with `PASTE_TARGET_REMOVED`, a single refusal, at row `0`,
    on the targeted column: it concerns the anchor, not a row of the block (`PastePlan`; #1361).
    A block row that would place a task under a milestone, which carries no subtasks, is
    refused with `MILESTONE_HAS_NO_SUBTASK`, `params` naming the milestone (`node_id`, `label`),
    and is not written; an estimate line under a milestone is allowed (WF-PLA-0050; F-04,
    #1771).
    A non-empty cell pasted on a line of the main structure whose task is
    completed — a line that names no field in `editable_fields` — is refused with
    `STATE_FORBIDS_OPERATION`, `params.missing_condition` at `task_not_completed`, the task
    being reopened first from the Kanban, and the line is not written; an empty cell writes
    nothing and is not refused. On a differential, such a line is pasted like any other,
    the amendment re-budgeting it (WF-RAE-0040, WF-REV-0050; F-01, #1766).
  properties:
    row:
      type: integer
      minimum: 0
      description: >-
        The refused block row, counted from zero. It is a row of the block, never a node: on
        a differential, the removed nodes that the paste skips do not shift it, and no
        refusal names them (`PastePreview`, #1278).
    column:
      allOf: [{ $ref: '#/NodeColumn' }]
      description: >-
        The column of the refused cell; absent when the refusal concerns the whole
        row.
    code: { $ref: ../common.yaml#/ErrorCode }
    params: { $ref: ../common.yaml#/ProblemParams }

PasteApplied:
  description: >-
    What the confirmation of a paste returns (WF-IHM-0050): a partial success when the preview
    refused rows. The valid rows are written in a single operation and returned like
    any grid write (`NodesWritten`); the refused rows are not, and each one
    is repeated with its reason (`rejected`). The plan retains the structure's counter read at
    the preview, and the confirmation is refused with 412 if the structure has changed since,
    whatever counter is sent (`PasteApply`): the structure is the one the preview judged. The
    reference data, for its part, may have changed — a category or a role deactivated in the
    meantime —: the plan's accepted rows are therefore judged again, and a row that has become
    invalid moves into `rejected` with its reason, without being written (`PasteRejection`).
    Without any valid row, nothing is written: `nodes`, `ancestors`, `rescheduled` and
    `reinflated` are empty, the structure's counter remains the one that was sent, and no undo
    entry is created (WF-IHM-0110).
  allOf:
    - $ref: '#/NodesWritten'
    - type: object
      required: [rejected]
      properties:
        rejected:
          type: array
          description: >-
            The preview's refusals and those that the confirmation adds by judging the accepted
            rows again, none written, in the order of the block rows; empty when all the
            rows of the block are written.
          items: { $ref: '#/PasteRejection' }

PasteApply:
  type: object
  required: [paste_id, confirmed, lock_version]
  description: >-
    Confirms a paste plan: its accepted rows are written, its refused rows are
    not (WF-IHM-0050). The counter is that of the structure into which the block
    is written (`CostStructure.lock_version`), read with the page or returned by the last write
    (`NodesWritten.structure_lock_version`); stale, the paste is refused with 412 and nothing
    is written (WF-IHM-0050, WF-IHM-0110). The plan also retains the structure's counter read
    at the preview (`previewPaste`): if the structure has changed since the preview, the
    confirmation is refused with 412 whatever counter is sent, the plan having been judged on
    another structure (`params.expected_lock_version`, the current counter).
  properties:
    paste_id: { $ref: ../common.yaml#/Uuid }
    confirmed:
      type: boolean
      const: true
    lock_version:
      allOf: [{ $ref: ../common.yaml#/LockVersion }]
      description: The counter of the structure read, which the paste writes.

RevisionComparison:
  type: object
  required: [from_revision_id, to_revision_id, items, totals, meta, amount_deltas]
  description: >-
    Comparison of two marked revisions, matched by the lineage identifier
    (WF-REV-0080, WF-DAT-0030): the tree of the main structure of the compared revision, with
    the marks of a differential, and the amount differences. It has the shape of the response of
    `listNodes` — `items`, `totals`, `meta` —, and is read like it, whole or through the window
    that its filters retain (#1193).
  properties:
    from_revision_id: { $ref: ../common.yaml#/Uuid }
    to_revision_id: { $ref: ../common.yaml#/Uuid }
    items:
      type: array
      description: >-
        The nodes of the compared revision (`to_revision_id`) that the read retains, depth-first
        in outline order, without pagination, as `listNodes` returns them:
        each node with its difference from the base revision (`difference`, `changes`) and the
        fields that `fields` names, the removed nodes at the place they had in the base
        revision, read-only. An identical pair returns each node unchanged (WF-REV-0080,
        C-361).
      items: { $ref: '#/ComparedNodeRead' }
    totals:
      allOf: [{ $ref: '#/NodeTotals' }]
      description: >-
        The totals of the compared revision, as `listNodes` returns them: those of the retained
        lines, without the removed nodes, which are no longer in its structure; `difference` does
        not restrict them (`NodeTotals`).
    meta:
      allOf: [{ $ref: '#/NodeListMeta' }]
      description: What the read says about the main structure of the compared revision.
    amount_deltas:
      type: array
      description: >-
        The differences of the budgeted amounts and of the re-estimated amounts, inflation
        included, by cost type and by subproject (WF-REV-0080), each named by
        its label, resolved on read like `AmountByKey.label`: the screen joins nothing
        (WF-ARC-0020). Returned in every response, like `totals`, and computed on the lines that
        the read retains, removed ones included, whatever `kinds`: without a filter, those of the
        whole structure; of a subtree, its own; under `difference`, those of only the lines it
        retains, while `totals` does not change with it (#1398). The difference is counted per
        retained line, according to its parent in the compared revision (`to_revision_id`): each
        retained line contributes its whole differences there, its amounts in the compared
        revision minus those of the base revision, wherever it was in the latter. A line counts
        under the key it carries in each revision: its amount in the compared revision under its
        cost type and its subproject at that time, minus its amount in the base revision under
        its own there. A line that changes cost type or subproject therefore counts its whole
        amount negatively under the old key and positively under the new one, even when its
        amount does not change; the offer without a subproject compared with the reference is
        the example of this (`comparison`). The difference of a key
        is thus the difference of its totals between the two revisions, and the sum of the
        differences by subproject equals that by cost type (#1751). A cost type or a subproject
        whose two differences are zero is omitted. A line moved out of a subtree therefore
        no longer counts anything there, and a line moved into it counts its whole difference
        there, and not only its amount in the compared revision; a removed line is counted at the
        place it had. The differences of disjoint subtrees thus add up to those of the whole
        structure, each line counted once.
      items:
        type: object
        required: [dimension, key, label, budgeted_delta, reestimated_delta]
        properties:
          dimension:
            type: string
            enum: [cost_type, subproject]
          key:
            type: string
            description: The identifier of the cost type or of the subproject, or `unassigned` (WF-IND-0020).
          label:
            anyOf: [{ type: string }, { type: 'null' }]
            description: The label of the cost type or of the subproject; null for the `unassigned` key only, which the front names.
          budgeted_delta:
            allOf: [{ $ref: ../common.yaml#/Money }]
            description: >-
              The difference of the budgeted amounts of the cost type or of the subproject,
              inflation included (WF-DEV-0020, WF-REV-0080): the compared revision
              (`to_revision_id`) minus the base revision (`from_revision_id`), positive when the
              compared one carries more — the direction in which a task is said to be added, and
              that of the current estimate minus the compared estimate
              (`EstimateIndicators.delta_to_reference`). The comparison of a revision
              obtained by merging a differential with the marked revision that precedes it, with no
              other modification between the two, restores exactly the budgeted amounts of that
              differential, whatever the reference year of each (WF-REV-0080, #1754).
          reestimated_delta:
            allOf: [{ $ref: ../common.yaml#/Money }]
            description: >-
              The difference of the re-estimated amounts of the cost type or of the subproject,
              inflation included, in the same direction (WF-REV-0080). Between two revisions of
              the same reference year, it comes, after a merge, only from the lines that the
              differential adds or removes, from those of the started tasks it completes and from
              those whose consumption year it changes: an existing line of which the differential
              modifies only the budgeted amount contributes nothing to it. Between two revisions
              of different reference years, it also comes from each line whose rate has been
              updated or projected up to the new reference year (WF-REV-0060), the budgeted amounts
              remaining those of the differential; the 2025 offer compared with the 2026 reference
              is the example of this (`comparison`, #1754).

ComparedNodeRead:
  type: object
  required: [node_id, row_number, level, lock_version, difference, changes]
  description: >-
    A node of the comparison (`RevisionComparison.items`), as `compareRevisions` returns it:
    the properties of `Node`, taken over from it, of which only those that a read always returns
    are required — `node_id`, `row_number`, `level` and `lock_version`, and the node's mark,
    `difference` and `changes` —, the others being returned only if `fields` names them, or all
    of them if it is omitted (#166, #1201, #1208). Its facets are partial likewise. `Node`, which
    `listNodes` returns, does not change.
  properties:
    <<: *node_properties
    task:
      anyOf: [{ $ref: '#/ComparedTaskFacet' }, { type: 'null' }]
    estimate_line:
      anyOf: [{ $ref: '#/ComparedEstimateLineFacet' }, { type: 'null' }]
    difference:
      allOf: [{ $ref: '#/NodeDifference' }]
      description: >-
        The node's difference from the base revision (`from_revision_id`), which the server
        returns and the front does not compute (WF-REV-0080, C-361): always returned, whether
        `fields` names it or not, never null.

ComparedTaskFacet:
  type: object
  description: >-
    The time facet of a node of the comparison (`ComparedNodeRead.task`): the properties of
    `TaskFacet`, taken over from it, none required — a read with `fields` returns only those
    it names (`task.label`), a read without `fields` returns them all (#166, #1208).
  properties: *task_facet_properties

ComparedEstimateLineFacet:
  type: object
  description: >-
    The estimate facet of a node of the comparison (`ComparedNodeRead.estimate_line`): the
    properties of `EstimateLineFacet`, taken over from it, none required — a read with `fields`
    returns only those it names (`estimate_line.label`), a read without `fields` returns them
    all (#166, #1208).
  properties: *estimate_line_facet_properties
