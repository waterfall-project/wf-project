# Actual costs imported from the ERP (FBS-4.7). Waterfall does not produce them (§2.2).

ActualCostLine:
  type: object
  required:
    - cost_line_id
    - document_number
    - document_item
    - document_date
    - amount
    - project_id
    - subproject_code
    - subproject_label
    - is_in_tracked_scope
    - excluded_reason
    - passthrough
    - audit
  description: >-
    Actual cost line. Four significant attributes; the other columns of the
    file are kept for information and enter no computation
    (WF-CRE-0010). The charging is deduced from the WBS element (WF-CRE-0020).
  properties:
    cost_line_id: { $ref: ../common.yaml#/Uuid }
    document_number:
      type: string
      description: >-
        Document number; with the item, it identifies the line within its project and underpins
        idempotence (WF-INTF-0140, WF-DAT-0110; D-4, EP-16/US-0630).
    document_item:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Number of the line's item within its document, as the extraction carries it
        (WF-CRE-0010); null when the extraction gives none — the mapping does not declare the
        item, or the cell is empty. The project, the document number and the item number
        identify the line (D-4): an invoice split over two WBS elements, as two items of the
        same document, gives two lines (WF-INTF-0140). A null item is a value like any other:
        two lines of the same document without an item are the same line.
    document_date: { $ref: ../common.yaml#/PlanningDate }
    amount:
      allOf: [{ $ref: ../common.yaml#/Money }]
      description: Signed amount; a negative amount decreases the actual cost (WF-CRE-0010).
    project_id: { $ref: ../common.yaml#/Uuid }
    subproject_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        The subproject charged; null when the line is charged to the project alone, hence
        "hors sous-projet" — without a subproject part in its WBS element, or with a code that no
        subproject of the project bears (WF-CRE-0020).
    subproject_code:
      anyOf: [{ type: string, maxLength: 50 }, { type: 'null' }]
      description: >-
        The subproject code read in the line's WBS element, kept as is, whether or not it
        matches a declared subproject (WF-CRE-0010): always filled in when the WBS element gives
        one, null only for a line without a subproject part. A line with an unknown code is
        charged to the project alone (`subproject_id` null) and presented with its code
        (WF-CRE-0020); it is through this code that the creation of the subproject immediately
        charges to it the lines that were waiting for it, and that a re-import that changes the
        WBS element recomputes its charging — an `updated` difference of the report on the
        `subproject` column (`ActualCostColumn`, WF-INTF-0140). It keeps its bound of 50
        characters: the bound of 31 and the pattern of a declared subproject
        (`DeclaredSubprojectCode`) apply only when a subproject is written (EP-16/US-0610).
    subproject_label:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Label of the charged subproject, resolved at read time; null for a line outside any
        subproject, unknown code included.
    is_in_tracked_scope:
      type: boolean
      description: False for an excluded line, which remains viewable and enters no indicator (WF-CRE-0030).
    excluded_reason:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The reason for the exclusion, as the user entered it; null for a tracked line, or one
        excluded without a reason (WF-CRE-0030). Always returned.
    passthrough:
      type: object
      additionalProperties: { type: string }
      description: >-
        Kept columns of the file, returned when viewing (WF-CRE-0010); always
        returned, empty for a line that carries none.
    audit: { $ref: ../common.yaml#/Audit }

ActualCostListMeta:
  description: >-
    The pagination of the actual cost view, and the union of the kept columns of the files
    of all the lines retained by the filters, and not of the page alone
    (WF-CRE-0010).
  allOf:
    - $ref: ../common.yaml#/PaginationMeta
    - type: object
      required: [passthrough_columns]
      properties:
        passthrough_columns:
          type: array
          uniqueItems: true
          items: { type: string }
          description: >-
            The kept columns, named as `passthrough` names them, each one once: in the order
            in which the imports declared them — the imports in the order in which they were
            applied, the columns of an import in the order of its file, a column at its first
            declaration. A line that does not carry one of them presents it empty; empty when
            no line is retained.

ActualCostTotals:
  type: object
  required: [tracked, excluded, overall]
  description: The three totals of the view (WF-CRE-0040).
  properties:
    tracked: { $ref: ../common.yaml#/Money }
    excluded: { $ref: ../common.yaml#/Money }
    overall: { $ref: ../common.yaml#/Money }

ScopeExclusion:
  type: object
  required: [is_in_tracked_scope]
  description: >-
    Excludes or reinstates a line. The exclusion is kept through later
    imports, even when the periods overlap (WF-CRE-0030).
  properties:
    is_in_tracked_scope: { type: boolean }
    reason:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The reason for an exclusion, as the user enters it; null or absent, an exclusion without a
        reason (WF-CRE-0030). A reinstated line carries none (`ActualCostLine.excluded_reason`).

CostImport:
  type: object
  required:
    - cost_import_id
    - imported_at
    - actor
    - period_from
    - period_to
    - created_count
    - updated_count
    - unchanged_count
    - rejected_count
  description: >-
    Entry of the log of actual cost imports: how recent the figures being read are, its
    date, its author, the extracted period and the number of lines created, updated,
    unchanged and rejected (WF-CRE-0050).
  properties:
    cost_import_id: { $ref: ../common.yaml#/Uuid }
    imported_at: { $ref: ../common.yaml#/Timestamp }
    actor: { $ref: ../common.yaml#/ActorRef }
    period_from:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: The start of the extracted period; null when the import declared none.
    period_to:
      anyOf: [{ $ref: ../common.yaml#/PlanningDate }, { type: 'null' }]
      description: The end of the extracted period, included; null when the import declared none.
    created_count:
      type: integer
      minimum: 0
      description: Lines whose document and item were not yet imported (WF-INTF-0140).
    updated_count:
      type: integer
      minimum: 0
      description: Lines already imported of which the file changes a value (WF-INTF-0140).
    unchanged_count:
      type: integer
      minimum: 0
      description: Lines already imported, which the file carries identically (WF-CRE-0050).
    rejected_count:
      type: integer
      minimum: 0
      description: >-
        Lines rejected in the report: a malformed WBS element or one of another project
        (WF-CRE-0020), two lines with the same document and the same item (WF-INTF-0140).
