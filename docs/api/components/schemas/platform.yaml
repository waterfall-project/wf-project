# System status, backups and restore (FBS-1.3, FBS-1.4).

SystemStatus:
  type: object
  required:
    - version
    - components
    - storage
    - operating_parameters
    - last_identity_sync
    - last_backup
    - last_backup_copy
    - last_restore_test
    - alerts
  description: >-
    Status screen, accessible without any project being open (WF-ADM-0130). The
    availabilities, spaces, rates and ages come from the metrics (`getMetrics`); the dates and
    results of the latest reading of the accounts, backup and restore test are read from the
    database (WF-OBS-0010); the operating parameters, from the deployment configuration
    (§4.5.1).
  properties:
    version: { type: string }
    components:
      type: array
      items: { $ref: '#/ComponentHealth' }
    storage: { $ref: '#/StorageUsage' }
    operating_parameters: { $ref: '#/OperatingParameters' }
    last_identity_sync:
      anyOf: [{ $ref: '#/OperationOutcome' }, { type: 'null' }]
      description: >-
        Date and result of the latest reading of the identity provider's accounts
        (WF-ADM-0070, WF-ADM-0130). Null as long as none has taken place.
    last_backup:
      anyOf: [{ $ref: '#/OperationOutcome' }, { type: 'null' }]
      description: >-
        Date and result of the latest backup (WF-ADM-0150, WF-ADM-0130). Null as long as none
        has taken place.
    last_backup_copy:
      anyOf: [{ $ref: '#/OperationOutcome' }, { type: 'null' }]
      description: >-
        Date and result of the latest external copy of a scheduled backup, which the schedule
        sets (`BackupSchedule.external_copy`): this is how the copy outside the platform is
        checked (WF-ADM-0170, WF-EXP-0050). Null when no copy is set or none has been made
        yet. The reason for a failed copy is in the current alert
        (`scheduled_backup_copy_failed`), and not in `problem`, since the error catalogue does
        not name the refusals of a location.
    last_restore_test:
      anyOf: [{ $ref: '#/OperationOutcome' }, { type: 'null' }]
      description: >-
        Date and result of the latest restore test (WF-EXP-0060, WF-ADM-0130). Null as long as
        none has taken place.
    alerts:
      type: array
      items: { $ref: '#/Alert' }

OperatingParameters:
  type: object
  required:
    - cache_validity_seconds
    - background_task_retention_days
    - avatar_max_bytes
    - task_queue_age_threshold_seconds
    - storage_usage_threshold
    - error_rate_threshold
    - error_rate_window_seconds
  description: >-
    The current values of the operating parameters (§4.5.1, WF-ADM-0130): set by the operator
    at deployment, in the values of the chart or of the Compose file (WF-ARC-0050), outside the
    reference data and the interface — no operation writes them. One field per parameter that
    the specification cites with its shipped value, stated in its description; a duration in
    seconds, a rate as a decimal from 0 to 1, like `Percent`. The front presents them in the
    reader's language (WF-ARC-0110).
  properties:
    cache_validity_seconds:
      type: integer
      minimum: 1
      description: >-
        The validity period of an entry of the indicator cache, which bounds each entry in
        addition to its invalidation on write (WF-DAT-0130); shipped at ten minutes, `600`.
        The Vérif field of WF-ADM-0130 names it.
    background_task_retention_days:
      type: integer
      minimum: 1
      description: >-
        The retention of the result of a background task, at the end of which the task is
        deleted (§4.4.1); shipped at thirty days, `30`. The file of an export, for its part,
        disappears after twenty-four hours (WF-DAT-0120), which is not a parameter.
    avatar_max_bytes:
      type: integer
      minimum: 1
      maximum: 8388608
      description: >-
        The largest size of an avatar, in bytes (§4.4.1); shipped at 512 KB, `524288`. The
        same value as `Installation.avatar_max_bytes`, which the front reads without a session;
        like it, it does not exceed 8 MiB (8,388,608 bytes).
    task_queue_age_threshold_seconds:
      type: integer
      minimum: 1
      description: >-
        The wait of the oldest queued task beyond which the alert `task_queue_stalled` is
        triggered (WF-OBS-0030); shipped at fifteen minutes, `900`.
    storage_usage_threshold:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      description: >-
        The occupancy rate of the storage space beyond which the alert `storage_nearly_full`
        is triggered (WF-OBS-0030); shipped at 85 %, `0.85`.
    error_rate_threshold:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      description: >-
        The error rate of the requests beyond which the alert `error_rate_abnormal` is
        triggered, measured over the window `error_rate_window_seconds` (WF-OBS-0030); shipped
        at 5 %, `0.05`.
    error_rate_window_seconds:
      type: integer
      minimum: 1
      description: >-
        The window over which the error rate is measured, part of the third threshold of
        WF-OBS-0030 ("5 % over five minutes"); shipped at five minutes, `300`.

ComponentHealth:
  type: object
  required: [component, is_available, version, checked_at]
  properties:
    component: { $ref: '#/PlatformComponent' }
    is_available: { type: boolean }
    checked_at: { $ref: ../common.yaml#/Timestamp }
    version:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Version of the component in use, announced by WF-CMP-0020.

PlatformComponent:
  type: string
  description: >-
    Platform component whose availability the status screen reports (WF-ADM-0130), and which
    an alert names when it is unavailable (WF-OBS-0030).
  enum: [api, worker, database, cache, object_storage, identity_provider, metrics]

StorageUsage:
  type: object
  required: [used_bytes, available_bytes]
  properties:
    used_bytes: { type: integer, minimum: 0 }
    available_bytes: { type: integer, minimum: 0 }

OperationOutcome:
  type: object
  required: [at, succeeded, problem]
  properties:
    at: { $ref: ../common.yaml#/Timestamp }
    succeeded: { type: boolean }
    problem:
      anyOf: [{ $ref: ../common.yaml#/Problem }, { type: 'null' }]

Alert:
  type: object
  required: [code, since, severity]
  description: >-
    Current alert, on a situation that has a consequence for the users (WF-OBS-0030). It
    disappears as soon as its cause ceases.
  properties:
    code:
      type: string
      enum:
        - component_unavailable
        - task_queue_stalled
        - scheduled_backup_failed
        - scheduled_backup_copy_failed
        - identity_sync_failed
        - storage_nearly_full
        - error_rate_abnormal
    since: { $ref: ../common.yaml#/Timestamp }
    severity: { $ref: reference.yaml#/AlertZone }
    params:
      type: object
      description: >-
        What the alert names, according to its code: `component_unavailable`, the unavailable
        component, `component`; `storage_nearly_full`, the space used and the free space,
        `used_bytes` and `available_bytes`, like `StorageUsage` at the moment the alert was
        triggered; `scheduled_backup_copy_failed`, the scheduled backup the copy did not
        reach, `backup_id`, the location, `location`, and the reason, `failure`
        (WF-ADM-0170); it disappears at the next successful copy. The other codes carry none:
        the failed backup and the failed synchronisation state their reason in `last_backup`
        and `last_identity_sync`.
      properties:
        component: { $ref: '#/PlatformComponent' }
        used_bytes: { type: integer, minimum: 0 }
        available_bytes: { type: integer, minimum: 0 }
        backup_id: { $ref: ../common.yaml#/Uuid }
        location: { $ref: '#/ExternalBackupLocationName' }
        failure: { $ref: '#/ExternalBackupFailure' }

BackupVerification:
  type: string
  enum: [pending, passed, failed]
  description: >-
    Result of the verification of a backup after it is produced (WF-ADM-0150): pending,
    succeeded, failed. The column is filtered (`verifications` of `listBackups`) and sorted in
    this order (WF-IHM-0130, WF-IHM-0060). Only a verified backup leaves the platform or
    replaces it (`BackupCommand`).

BackupOrigin:
  type: string
  enum: [manual, scheduled]
  description: >-
    What produced a backup: an authorised user (`startBackup`, WF-ADM-0150) or the schedule
    (WF-ADM-0170). The column is filtered (`origins` of `listBackups`) and sorted in this order
    (WF-IHM-0130, WF-IHM-0060).

BackupCommand:
  type: string
  enum: [retain, release, download, restore]
  description: >-
    Commands carried by a backup (WF-IHM-0090): mark it to keep or no longer keep it, through
    `retainBackup` — a backup carries only the one that changes its mark, `retain` if it is
    not marked, `release` if it is (WF-ADM-0170) —, copy it outside the platform, through
    `downloadBackup` (WF-ADM-0150), and restore the platform from it, through `startRestore`
    (WF-ADM-0160). None deletes it: only the rotation does. Marking falls under the
    permission to modify the backups (`backups.write`), downloading under those to view and
    to modify them (`backups.read`, `backups.write`: the archive carries both databases in
    full; author's decision of 2026-10-10, #705), restoring under the permission to restore
    the platform (`platform_restore`, WF-ADM-0100). Download and restore are unavailable as
    long as the verification has not succeeded — pending or failed —, `backup_verified`
    missing: the verification is what distinguishes a backup from a file one hopes is
    restorable (WF-ADM-0150). Restore is also unavailable while a backup is running,
    `no_backup_running` missing — the backup would read a database being replaced —, and
    while a restore is already running, `no_restore_running` missing; marking is unavailable
    during a restore, which replaces the database where it would be written. Download reads a
    file that neither of them touches: it remains available during both. A call sent despite
    the list is refused with the operation's 409, `STATE_FORBIDS_OPERATION`,
    `params.missing_condition` naming the condition.

BackupCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/BackupCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Empty when the command is available.
      items: { $ref: projects.yaml#/CommandCondition }

BackupCommands:
  type: array
  maxItems: 3
  description: >-
    Commands of the backup that the caller has the permission to exercise, each available or
    not, with the conditions it lacks (WF-IHM-0090), in the order of `BackupCommand`: at most
    three, the one that changes its mark, the download and the restore. A command absent from
    the list is not presented; the list is empty for whoever reads the backups without being
    able either to modify them or to restore the platform (`backups.read` alone,
    WF-ADM-0100). The front deduces nothing from it about the state of the backup or of the
    session: the server says what can be done.
  items: { $ref: '#/BackupCommandAvailability' }

Backup:
  type: object
  required:
    - backup_id
    - taken_at
    - size_bytes
    - verification
    - is_retained
    - scope
    - origin
    - available_commands
  description: >-
    Dated and verified copy of the platform's two databases, Waterfall's and the identity
    provider's, each in a consistent state (WF-ADM-0150): an archive of their two dumps and of
    a manifest — the date, the application version, the schema revision, the checksums. The
    audit log is part of it: it is backed up with Waterfall's database (WF-SEC-0030), and a
    restore records again those of its entries that follow the date of the backup
    (WF-ADM-0160). Imported files live only as long as their import and are not included
    (WF-DAT-0120). Each column of the list is filtered and sorted (`listBackups`, WF-IHM-0130,
    WF-IHM-0060), and the backup carries its commands (WF-IHM-0090).
  properties:
    backup_id: { $ref: ../common.yaml#/Uuid }
    taken_at:
      allOf: [{ $ref: ../common.yaml#/Timestamp }]
      description: >-
        The instant the backup was taken; it is the date that the confirmation of a restore
        states (WF-ADM-0160), and the order of the unsorted list, most recent first.
    size_bytes:
      type: integer
      minimum: 0
      description: The size of the file, in bytes, which is the length of its download.
    verification: { $ref: '#/BackupVerification' }
    is_retained:
      type: boolean
      description: Marked to keep, it escapes the rotation (WF-ADM-0170).
    scope:
      type: string
      enum: [database]
      description: >-
        What the backup covers: the platform's databases, Waterfall's and the identity
        provider's (WF-ADM-0150), the audit log of the former included.
    origin: { $ref: '#/BackupOrigin' }
    available_commands: { $ref: '#/BackupCommands' }

BackupRetain:
  type: object
  required: [is_retained]
  properties:
    is_retained: { type: boolean }

BackupSchedule:
  type: object
  required: [is_enabled, frequency, at_time, weekday, retained_count, lock_version]
  description: >-
    Scheduling and retention of the backups, at a frequency and a time chosen by an
    authorised user (WF-ADM-0170). Shipped enabled, daily, at `01:00` UTC, seven backups kept,
    without external copy (WF-ADM-0170, WF-EXP-0050): a new installation is backed up every
    day without any schedule having been entered, and `getBackupSchedule` never answers 404
    for lack of one. A restore keeps it, external copy included, like the list of backups it
    governs (WF-ADM-0160, #1742).
  properties:
    is_enabled: { type: boolean }
    frequency:
      type: string
      enum: [daily, weekly]
    at_time:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      description: >-
        Time of the backup, in universal time (UTC), like the platform's timestamps
        (`Timestamp`, WF-DAT-0100): `01:00` is taken at `01:00Z`, whatever the time zone of the
        workstation that reads it.
    weekday:
      anyOf: [{ type: integer, minimum: 1, maximum: 7 }, { type: 'null' }]
      description: >-
        Day of a weekly backup, numbered as in ISO 8601: 1 is Monday, 7 Sunday, the day being
        understood in universal time like the time; null for a daily backup. Outside these
        bounds, refused with 422 `VALIDATION_FAILED`, reason `VALUE_OUT_OF_RANGE` on
        `/weekday`, `params.minimum` set to `1` or `maximum` set to `7`, the only bound
        crossed. Null for a weekly schedule, refused with the reason `VALUE_REQUIRED` on
        `/weekday`; given to a daily one, with the reason `VALIDATION_FAILED` on `/weekday`.
    retained_count:
      type: integer
      minimum: 1
      maximum: 365
      description: >-
        The number of backups kept on the platform, manual or scheduled, except those marked
        to keep, from 1 to 365: beyond it, the oldest unmarked backup is deleted
        (WF-ADM-0170). Outside these bounds, refused with 422 `VALIDATION_FAILED`, reason
        `VALUE_OUT_OF_RANGE` on `/retained_count`, `params.minimum` set to `1` or `maximum`
        set to `365`, the only bound crossed.
    external_copy:
      allOf: [{ $ref: '#/BackupExternalCopy' }]
      description: >-
        The automatic copy of each scheduled backup to an external location (WF-ADM-0170);
        when absent, no copy is set — an installation that declares no location offers none.
        A schedule saved without it removes the copy that was set.
    lock_version: { $ref: ../common.yaml#/LockVersion }

BackupExternalCopy:
  type: object
  required: [is_enabled, location, path, retained_count]
  description: >-
    Automatic external copy of the scheduled backups (WF-ADM-0170): after each scheduled and
    verified backup, the server copies it to a location that the installation declares in its
    deployment configuration (`ExternalBackupLocation`), named here and never described: no
    credential or secret is entered on screen. The failure of a copy is an alert of the system
    status, like that of the backup (`scheduled_backup_copy_failed`, WF-OBS-0030). A manual
    backup is copied outside the platform by downloading it (WF-ADM-0150). Copied or
    downloaded, the archive carries the date of its backup in its manifest
    (`Backup.taken_at`), which the completion of a restore's upload reads back
    (`completeChunkedUpload`, WF-ADM-0160).
  properties:
    is_enabled:
      type: boolean
      description: >-
        False, the copy is suspended and its setting kept, like `BackupSchedule.is_enabled`.
    location:
      allOf: [{ $ref: '#/ExternalBackupLocationName' }]
      description: >-
        The name of a location declared by the installation (`listExternalBackupLocations`);
        a name it does not declare is refused with 422 `VALIDATION_FAILED`, reason
        `UNKNOWN_EXTERNAL_BACKUP_LOCATION` on `/external_copy/location`.
    path:
      allOf: [{ $ref: '#/ExternalBackupPath' }]
      description: >-
        The folder, or the prefix, where the copies are written in the location; a path that
        is not relative or that leaves the folder is refused with 422 `VALIDATION_FAILED`,
        reason `PATH_INVALID` on `/external_copy/path`.
    retained_count:
      type: integer
      minimum: 1
      maximum: 365
      description: >-
        The number of copies kept on the location, at least that of the backups kept on the
        platform (`BackupSchedule.retained_count`): the backups are kept outside the platform
        under a retention at least equal (WF-EXP-0050). A lower number is refused with 422
        `VALIDATION_FAILED`, reason `VALUE_OUT_OF_RANGE` on `/external_copy/retained_count`,
        `params.minimum` stating the platform's retention — `1` when that is itself outside
        its bounds; a number beyond 365, with the same reason, `params.maximum` set to `365`.
        Beyond the number kept, the oldest copy in this folder is deleted; the mark to keep
        applies only to the platform's backups.

ExternalBackupLocationName:
  type: string
  pattern: '^[a-z0-9][a-z0-9_-]{0,62}$'
  description: >-
    Name of an external location, as the deployment configuration declares it: a
    configuration key, and not an object the server creates, hence a name rather than a UUID.

ExternalBackupPath:
  type: string
  minLength: 1
  maxLength: 255
  pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*$'
  description: >-
    Relative path in an external location: segments separated by `/`, without a leading or
    trailing `/`, each starting with a letter, a digit or `_` — neither `.` nor `..`, which
    would leave the target folder, nor an empty segment. The pattern applies to the whole
    text, up to its end: a final line break (`a\n`) breaks it. A path that does not conform
    to it is refused per field, 422 `VALIDATION_FAILED`, reason `PATH_INVALID`.

ExternalBackupLocationKind:
  type: string
  enum: [s3, mounted_share]
  description: >-
    What an external location is: an S3 bucket, on another site, or a network share mounted
    on the server. Only the server reaches it, never the browser.

ExternalBackupLocation:
  type: object
  required: [name, kind, description]
  description: >-
    An external location to copy the backups to (WF-ADM-0170), declared by the installation
    in its deployment configuration — bucket, mount point, credentials — and read here
    without any of its secrets: no credential, no key, no address that would carry one. It is
    neither created nor modified through the API.
  properties:
    name: { $ref: '#/ExternalBackupLocationName' }
    kind: { $ref: '#/ExternalBackupLocationKind' }
    description:
      anyOf: [{ type: string, maxLength: 500 }, { type: 'null' }]
      description: >-
        What the configuration says about it for the administrator, as it is written; null
        when it says nothing.

ExternalBackupLocationTestRequest:
  type: object
  description: >-
    What the test checks: the location, at its root, or in the folder the copy would use.
  properties:
    path:
      allOf: [{ $ref: '#/ExternalBackupPath' }]
      description: The folder where the witness file is written; when absent, the location's root.

ExternalBackupFailure:
  type: string
  enum:
    - location_unreachable
    - access_denied
    - write_failed
    - delete_failed
    - storage_full
    - timed_out
  description: >-
    Why an external location refused a write: unreachable — bucket or share missing, network
    down —, access denied to its credentials, writing or erasing the file refused, space
    exhausted, or timeout exceeded (WF-ARC-0110). The reason of a test
    (`ExternalBackupLocationTest`) as well as that of a failed copy (`Alert.params`).

ExternalBackupLocationTest:
  type: object
  required: [location, path, tested_at, failure]
  description: >-
    The outcome of a test of an external location: the server wrote then erased a witness file
    there, with the credentials of the configuration (WF-ADM-0170). Succeeded when `failure`
    is null.
  properties:
    location: { $ref: '#/ExternalBackupLocationName' }
    path:
      anyOf: [{ $ref: '#/ExternalBackupPath' }, { type: 'null' }]
      description: The folder tested; null for the location's root.
    tested_at: { $ref: ../common.yaml#/Timestamp }
    failure:
      anyOf: [{ $ref: '#/ExternalBackupFailure' }, { type: 'null' }]
      description: The reason for the failure; null when the file was written then erased.

RestoreRequest:
  type: object
  required: [acknowledged_backup_taken_at]
  oneOf:
    - required: [backup_id]
    - required: [external_backup_upload_id]
  description: >-
    Restore: it replaces the whole of the platform's two databases, Waterfall and identity
    provider, leaves the audit log in place, closes the sessions, empties the caches, and is
    applied only after a confirmation that states the date of the backup and its irreversible
    nature (WF-ADM-0160, WF-DAT-0130). A backup from the list is restored as its `restore`
    command says in advance (`BackupCommand`): verified, no backup or restore in progress. It
    designates one backup and only one: both at once, or none, is refused with 422
    `VALIDATION_FAILED`: two, `fields` designating `/external_backup_upload_id` with the
    reason `VALIDATION_FAILED`; none, `/backup_id` by `VALUE_REQUIRED`.
  properties:
    backup_id: { $ref: ../common.yaml#/Uuid }
    external_backup_upload_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        Backup copied outside the platform, uploaded beforehand for a restore
        (`FileUploadPurpose`, `external_backup`, WF-ADM-0160).
    acknowledged_backup_taken_at:
      allOf: [{ $ref: ../common.yaml#/Timestamp }]
      description: >-
        Date of the restored backup, as the confirmation states it: it must match that of the
        designated backup (WF-ADM-0160) — `Backup.taken_at` for a backup from the list,
        `FileUpload.backup_taken_at` for an uploaded backup, the date its manifest states, read
        at the completion of the upload —, the same instant whatever the way its time zone is
        written. Another date is a confirmation that does not name the backup it designates,
        refused with 400 `CONFIRMATION_REQUIRED`, and nothing is queued.
    confirmed:
      type: boolean
      description: >-
        The confirmation itself: absent or false, the restore is not confirmed, refused with
        400 `CONFIRMATION_REQUIRED` like a date that is not that of the backup, and nothing is
        queued (WF-ADM-0160). The schema does not require it and does not fix its value, so
        that it is the guard that refuses, and not the validation of the body with 422
        (US-0702/L3).

IdentitySyncSchedule:
  type: object
  required: [is_enabled, frequency, at_time, weekday, lock_version]
  description: >-
    The periodicity of the reading of the identity provider's accounts, chosen by an
    authorised user, like that of the backups (`BackupSchedule`, WF-ADM-0070, WF-ADM-0170).
    Shipped enabled, daily, at `01:30` UTC, half an hour after the shipped backup: a person
    added to the directory has an account at the end of the period, without anyone having
    entered it, and `getIdentitySyncSchedule` never answers 404 for lack of one. The
    scheduled reading is done like the one requested (`startIdentitySync`), by the platform,
    and its failure is an alert of the status screen (`identity_sync_failed`, WF-OBS-0030).
  properties:
    is_enabled:
      type: boolean
      description: False, no reading is done on its own; reading on demand remains.
    frequency:
      type: string
      enum: [daily, weekly]
    at_time:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      description: >-
        Time of the reading, in universal time (UTC), like that of the backups
        (`BackupSchedule.at_time`).
    weekday:
      anyOf: [{ type: integer, minimum: 1, maximum: 7 }, { type: 'null' }]
      description: >-
        Day of a weekly reading, numbered as in ISO 8601, 1 Monday, 7 Sunday, in universal
        time; null for a daily reading. Refused like that of the backups: outside 1 to 7, with
        the reason `VALUE_OUT_OF_RANGE` on `/weekday`; null for a weekly one, by
        `VALUE_REQUIRED`; given to a daily one, by `VALIDATION_FAILED`.
    lock_version: { $ref: ../common.yaml#/LockVersion }

IdentitySyncReport:
  type: object
  required: [task_id, finished_at, created, updated, deactivated, restored, skipped, removed]
  description: >-
    Report of a reading of the identity provider's accounts (`startIdentitySync`, or the
    reading the platform schedules, `IdentitySyncSchedule`). The accounts created in Waterfall
    are not modified: it is in the provider that the reading restores their identity. An
    account that WF-ADM-0120 forbids deactivating is kept active and reported (WF-ADM-0070).
    A Waterfall account is designated in it only by its identifier, its name being read at
    viewing time: the report keeps no personal data of an account (WF-ADM-0060, #920).
  properties:
    task_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: The task of the reading (`BackgroundTaskRef.task_id`).
    finished_at:
      allOf: [{ $ref: ../common.yaml#/Timestamp }]
      description: End of the reading.
    created:
      type: integer
      minimum: 0
      description: Accounts created, without a role, for the people Waterfall did not know.
    updated:
      type: integer
      minimum: 0
      description: >-
        Accounts whose last name, first name or address changed, including those that a person
        from the directory has linked through their address (#707).
    deactivated:
      type: integer
      minimum: 0
      description: Accounts deactivated because the provider no longer knows them.
    restored:
      type: integer
      minimum: 0
      description: >-
        Accounts created in Waterfall for which the provider held another last name, another
        first name or another address, and for which the reading restores in the provider the
        identity Waterfall holds, since Waterfall is authoritative (WF-ADM-0050, #919). The
        restoring follows the validation of the reading: an account counted here is restored,
        or to be restored; a restoring that fails is logged, and the next reading counts it
        again. An anonymised account is never restored.
    skipped:
      type: array
      description: >-
        What the reading left as is, each with its reason, a code of the catalogue: a
        Waterfall account, or a person from the provider who has none.
      items: { $ref: '#/IdentitySyncSkipped' }
    removed:
      type: array
      description: >-
        The addresses of the local accounts that the reading removes from the identity
        provider: unknown to Waterfall and without a password, left by a creation that
        Waterfall did not carry through (#811). The removal follows the validation of the
        reading: an address named here is that of an account removed from the provider, or to
        be removed. A removal that fails is logged, and the next reading names the address
        again.
      items: { type: string }

IdentitySyncSkipped:
  type: object
  additionalProperties: false
  required: [kind, user_id, subject, last_name, first_name, email, code]
  description: >-
    What the reading of the accounts left as is. A Waterfall account (`account`) is kept in
    the report only by its identifier: its last name, its first name and its address are
    those it carries at viewing time, null for an account anonymised since, which the front
    presents under the neutral label of its catalogue (WF-ADM-0060, #920). A person from the
    identity provider who has no account (`person`) is named as the provider holds them
    (#918) — except one whose address a Waterfall account carries (`ALREADY_EXISTS`): this
    address being that of the account, the entry keeps only the person's identifier at the
    provider (`subject`) and that of the account (`user_id`), and the last name, the first
    name and the address are those of the account at viewing time, null if it has been
    anonymised since (#920). Thus `account` carries `user_id` and never `subject`; `person`
    always carries `subject`, and `user_id` for `ALREADY_EXISTS` only.
  properties:
    kind:
      type: string
      enum: [account, person]
    user_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        The Waterfall account; for a person, the account that carries their address
        (`ALREADY_EXISTS`), null if it no longer carried any when the person was set aside,
        and null for any other reason.
    subject:
      anyOf: [{ type: string }, { type: 'null' }]
      description: The person's identifier at the identity provider; null for an account.
    last_name:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The last name of the account at viewing time — for an `ALREADY_EXISTS` person, that of
        the account that carries their address —, null if it is anonymised or if there is no
        account; that of the person at the provider for any other reason, empty if the
        provider holds none.
    first_name:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The first name of the account at viewing time — for an `ALREADY_EXISTS` person, that
        of the account that carries their address —, null if it is anonymised or if there is
        no account; that of the person at the provider for any other reason, empty if the
        provider holds none.
    email:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        The address of the account at viewing time — for an `ALREADY_EXISTS` person, that of
        the account that carries it —, null if it is anonymised or if there is no account;
        that of the person at the provider for any other reason, null if the provider holds
        none (`EMAIL_MISSING`).
    code:
      allOf: [{ $ref: ../common.yaml#/ErrorCode }]
      description: >-
        For an account: `LAST_ADMINISTRATOR`, the last administrator, whom the provider no
        longer knows, kept active (WF-ADM-0120); `ALREADY_EXISTS`, its new address carried by
        another; `VALIDATION_FAILED`, a new last name or first name that is empty, or longer
        than what Waterfall keeps; `EMAIL_MISSING`, the provider no longer holds an address for
        it. For a person: `EMAIL_MISSING`, without an address, Waterfall cannot recognise
        them; `ALREADY_EXISTS`, relayed by an external provider with an address already
        carried by an account, which it does not link (#707), that account designated by
        `user_id`; `VALIDATION_FAILED`, an empty last name or first name, or one longer than
        what Waterfall keeps.
