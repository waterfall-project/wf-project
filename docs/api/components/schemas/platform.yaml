# État du système, sauvegardes et restauration (FBS-1.3, FBS-1.4).

SystemStatus:
  type: object
  required:
    - version
    - components
    - storage
    - operating_parameters
    - last_identity_sync
    - last_backup
    - last_backup_copy
    - last_restore_test
    - alerts
  description: >-
    Écran d'état, accessible sans qu'aucun projet ne soit ouvert (WF-ADM-0130). Les
    disponibilités, espaces, taux et âges viennent des métriques (`getMetrics`) ; les dates et
    résultats des dernières lecture des comptes, sauvegarde et test de restauration sont lus
    dans la base (WF-OBS-0010) ; les paramètres d'exploitation, dans la configuration du
    déploiement (§4.5.1).
  properties:
    version: { type: string }
    components:
      type: array
      items: { $ref: '#/ComponentHealth' }
    storage: { $ref: '#/StorageUsage' }
    operating_parameters: { $ref: '#/OperatingParameters' }
    last_identity_sync:
      anyOf: [{ $ref: '#/OperationOutcome' }, { type: 'null' }]
      description: >-
        Date et résultat de la dernière lecture des comptes du fournisseur d'identité
        (WF-ADM-0070, WF-ADM-0130). Nulle tant qu'aucune n'a eu lieu.
    last_backup:
      anyOf: [{ $ref: '#/OperationOutcome' }, { type: 'null' }]
      description: >-
        Date et résultat de la dernière sauvegarde (WF-ADM-0150, WF-ADM-0130). Nulle tant
        qu'aucune n'a eu lieu.
    last_backup_copy:
      anyOf: [{ $ref: '#/OperationOutcome' }, { type: 'null' }]
      description: >-
        Date et résultat de la dernière copie externe d'une sauvegarde planifiée, que la
        planification règle (`BackupSchedule.external_copy`) : la copie hors plateforme se
        vérifie ainsi (WF-ADM-0170, WF-EXP-0050). Nulle quand aucune copie n'est réglée ou
        n'a encore été faite. Le motif d'une copie échouée est dans l'alerte en cours
        (`scheduled_backup_copy_failed`), et non dans `problem`, le catalogue des erreurs ne
        nommant pas les refus d'un emplacement.
    last_restore_test:
      anyOf: [{ $ref: '#/OperationOutcome' }, { type: 'null' }]
      description: >-
        Date et résultat du dernier test de restauration (WF-EXP-0060, WF-ADM-0130). Nulle tant
        qu'aucun n'a eu lieu.
    alerts:
      type: array
      items: { $ref: '#/Alert' }

OperatingParameters:
  type: object
  required:
    - cache_validity_seconds
    - background_task_retention_days
    - avatar_max_bytes
    - task_queue_age_threshold_seconds
    - storage_usage_threshold
    - error_rate_threshold
    - error_rate_window_seconds
  description: >-
    Les valeurs en vigueur des paramètres d'exploitation (§4.5.1, WF-ADM-0130) : fixées par
    l'exploitant au déploiement, dans les valeurs du chart ou du fichier Compose (WF-ARC-0050),
    hors du référentiel et de l'interface — aucune opération ne les écrit. Un champ par paramètre
    que la spécification cite avec sa valeur livrée, dite dans sa description ; une durée en
    secondes, un taux en décimal de 0 à 1, comme `Percent`. Le front les présente dans la langue
    du lecteur (WF-ARC-0110).
  properties:
    cache_validity_seconds:
      type: integer
      minimum: 1
      description: >-
        La durée de validité d'une entrée du cache des indicateurs, qui borne chaque entrée en
        plus de son invalidation par écriture (WF-DAT-0130) ; livrée à dix minutes, `600`. La
        Vérif de WF-ADM-0130 la nomme.
    background_task_retention_days:
      type: integer
      minimum: 1
      description: >-
        La rétention du résultat d'une tâche de fond, au terme de laquelle la tâche se supprime
        (§4.4.1) ; livrée à trente jours, `30`. Le fichier d'un export disparaît pour sa part au
        terme de vingt-quatre heures (WF-DAT-0120), qui n'est pas un paramètre.
    avatar_max_bytes:
      type: integer
      minimum: 1
      description: >-
        La taille la plus grande d'un avatar, en octets (§4.4.1) ; livrée à 512 Ko, `524288`.
        La même valeur que `Installation.avatar_max_bytes`, que le front lit sans session.
    task_queue_age_threshold_seconds:
      type: integer
      minimum: 1
      description: >-
        L'attente de la plus ancienne tâche en file au-delà de laquelle l'alerte
        `task_queue_stalled` se déclenche (WF-OBS-0030) ; livrée à quinze minutes, `900`.
    storage_usage_threshold:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      description: >-
        Le taux d'occupation de l'espace de stockage au-delà duquel l'alerte
        `storage_nearly_full` se déclenche (WF-OBS-0030) ; livré à 85 %, `0.85`.
    error_rate_threshold:
      allOf: [{ $ref: ../common.yaml#/Percent }]
      description: >-
        Le taux d'erreur des requêtes au-delà duquel l'alerte `error_rate_abnormal` se déclenche,
        mesuré sur la fenêtre `error_rate_window_seconds` (WF-OBS-0030) ; livré à 5 %, `0.05`.
    error_rate_window_seconds:
      type: integer
      minimum: 1
      description: >-
        La fenêtre sur laquelle le taux d'erreur se mesure, part du troisième seuil de
        WF-OBS-0030 (« 5 % sur cinq minutes ») ; livrée à cinq minutes, `300`.

ComponentHealth:
  type: object
  required: [component, is_available, checked_at]
  properties:
    component: { $ref: '#/PlatformComponent' }
    is_available: { type: boolean }
    checked_at: { $ref: ../common.yaml#/Timestamp }
    version:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Version du composant employé, annoncée par WF-CMP-0020.

PlatformComponent:
  type: string
  description: >-
    Composant de la plateforme dont l'écran d'état dit la disponibilité (WF-ADM-0130), et
    qu'une alerte nomme quand il est indisponible (WF-OBS-0030).
  enum: [api, worker, database, cache, object_storage, identity_provider, metrics]

StorageUsage:
  type: object
  required: [used_bytes, available_bytes]
  properties:
    used_bytes: { type: integer, minimum: 0 }
    available_bytes: { type: integer, minimum: 0 }

OperationOutcome:
  type: object
  required: [at, succeeded]
  properties:
    at: { $ref: ../common.yaml#/Timestamp }
    succeeded: { type: boolean }
    problem:
      anyOf: [{ $ref: ../common.yaml#/Problem }, { type: 'null' }]

Alert:
  type: object
  required: [code, since, severity]
  description: >-
    Alerte en cours, sur une situation qui a une conséquence pour les utilisateurs
    (WF-OBS-0030). Elle disparaît dès que sa cause cesse.
  properties:
    code:
      type: string
      enum:
        - component_unavailable
        - task_queue_stalled
        - scheduled_backup_failed
        - scheduled_backup_copy_failed
        - identity_sync_failed
        - storage_nearly_full
        - error_rate_abnormal
    since: { $ref: ../common.yaml#/Timestamp }
    severity: { $ref: reference.yaml#/AlertZone }
    params:
      type: object
      description: >-
        Ce que l'alerte nomme, selon son code : `component_unavailable`, le composant
        indisponible, `component` ; `storage_nearly_full`, l'espace employé et l'espace
        libre, `used_bytes` et `available_bytes`, comme `StorageUsage` au moment où
        l'alerte s'est déclenchée ; `scheduled_backup_copy_failed`, la sauvegarde planifiée
        que la copie n'a pas atteinte, `backup_id`, l'emplacement, `location`, et le motif,
        `failure` (WF-ADM-0170) ; elle disparaît à la copie réussie suivante. Les autres codes n'en portent pas : la sauvegarde
        échouée et la synchronisation échouée disent leur motif dans `last_backup` et
        `last_identity_sync`.
      properties:
        component: { $ref: '#/PlatformComponent' }
        used_bytes: { type: integer, minimum: 0 }
        available_bytes: { type: integer, minimum: 0 }
        backup_id: { $ref: ../common.yaml#/Uuid }
        location: { $ref: '#/ExternalBackupLocationName' }
        failure: { $ref: '#/ExternalBackupFailure' }

BackupVerification:
  type: string
  enum: [pending, passed, failed]
  description: >-
    Résultat de la vérification d'une sauvegarde après sa production (WF-ADM-0150) : en attente,
    réussie, échouée. La colonne se filtre (`verifications` de `listBackups`) et se trie dans
    cet ordre (WF-IHM-0130, WF-IHM-0060). Seule une sauvegarde vérifiée sort de la plateforme ou
    la remplace (`BackupCommand`).

BackupOrigin:
  type: string
  enum: [manual, scheduled]
  description: >-
    Ce qui a produit une sauvegarde : un utilisateur habilité (`startBackup`, WF-ADM-0150) ou la
    planification (WF-ADM-0170). La colonne se filtre (`origins` de `listBackups`) et se trie
    dans cet ordre (WF-IHM-0130, WF-IHM-0060).

BackupCommand:
  type: string
  enum: [retain, release, download, restore]
  description: >-
    Commandes portées par une sauvegarde (WF-IHM-0090) : la marquer à conserver ou ne plus la
    conserver, par `retainBackup` — une sauvegarde ne porte que celle qui change son marquage,
    `retain` si elle n'est pas marquée, `release` si elle l'est (WF-ADM-0170) —, la copier hors
    de la plateforme, par `downloadBackup` (WF-ADM-0150), et restaurer la plateforme depuis
    elle, par `startRestore` (WF-ADM-0160). Aucune ne la supprime : seule la rotation le fait.
    Le marquage relève de la permission de modifier les sauvegardes (`backups.write`), le
    téléchargement de celles de les consulter et de les modifier (`backups.read`,
    `backups.write` : l'archive porte les deux bases entières ; décision de l'auteur du
    2026-10-10, #705), la restauration de celle de restaurer la plateforme
    (`platform_restore`, WF-ADM-0100). Le téléchargement et la
    restauration sont indisponibles tant que la vérification n'a pas réussi — en attente ou
    échouée —, `backup_verified` manquante : la vérification est ce qui distingue une
    sauvegarde d'un fichier qu'on espère restaurable (WF-ADM-0150). La restauration l'est aussi
    pendant qu'une sauvegarde s'exécute, `no_backup_running` manquante — la sauvegarde lirait une
    base en cours de remplacement —, et pendant qu'une restauration s'exécute déjà,
    `no_restore_running` manquante ; le marquage l'est pendant une restauration, qui remplace
    la base où il s'écrirait. Le téléchargement lit un fichier qu'aucune des deux ne touche : il
    reste disponible pendant l'une et l'autre. Un appel envoyé malgré la liste est refusé par le
    409 de l'opération, `STATE_FORBIDS_OPERATION`, `params.missing_condition` nommant la
    condition.

BackupCommandAvailability:
  type: object
  required: [command, is_available, missing_conditions]
  properties:
    command: { $ref: '#/BackupCommand' }
    is_available: { type: boolean }
    missing_conditions:
      type: array
      description: Vide lorsque la commande est disponible.
      items: { $ref: projects.yaml#/CommandCondition }

BackupCommands:
  type: array
  maxItems: 3
  description: >-
    Commandes de la sauvegarde que l'appelant a la permission d'exercer, chacune disponible ou
    non, avec les conditions qui lui manquent (WF-IHM-0090), dans l'ordre de `BackupCommand` :
    au plus trois, celle qui change son marquage, le téléchargement et la restauration. Une
    commande absente de la liste n'est pas présentée ; la liste est vide pour qui lit les
    sauvegardes sans pouvoir ni les modifier ni restaurer la plateforme (`backups.read` seule,
    WF-ADM-0100). Le front n'en déduit rien de l'état de la sauvegarde ni de la session : le
    serveur dit ce qui se peut.
  items: { $ref: '#/BackupCommandAvailability' }

Backup:
  type: object
  required:
    - backup_id
    - taken_at
    - size_bytes
    - verification
    - is_retained
    - scope
    - origin
    - available_commands
  description: >-
    Copie datée et vérifiée des deux bases de la plateforme, celle de Waterfall et celle du
    fournisseur d'identité, chacune dans un état cohérent (WF-ADM-0150) : une archive de leurs
    deux vidages et d'un manifeste — la date, la version de l'application, la révision du
    schéma, les empreintes. Le journal d'audit en fait partie : il est sauvegardé avec la base
    de Waterfall (WF-SEC-0030), et une restauration réinscrit celles de ses inscriptions qui
    suivent la date de la sauvegarde (WF-ADM-0160). Les fichiers importés ne vivent que le temps
    de leur import et n'y figurent pas (WF-DAT-0120). Chaque colonne de la liste se filtre et se
    trie (`listBackups`, WF-IHM-0130, WF-IHM-0060), et la sauvegarde porte ses commandes
    (WF-IHM-0090).
  properties:
    backup_id: { $ref: ../common.yaml#/Uuid }
    taken_at:
      allOf: [{ $ref: ../common.yaml#/Timestamp }]
      description: >-
        L'instant où la sauvegarde a été prise ; c'est la date que la confirmation d'une
        restauration énonce (WF-ADM-0160), et l'ordre de la liste sans tri, les plus récentes
        d'abord.
    size_bytes:
      type: integer
      minimum: 0
      description: La taille du fichier, en octets, qui est la longueur de son téléchargement.
    verification: { $ref: '#/BackupVerification' }
    is_retained:
      type: boolean
      description: Marquée à conserver, elle échappe à la rotation (WF-ADM-0170).
    scope:
      type: string
      enum: [database]
      description: >-
        Ce que la sauvegarde couvre : les bases de la plateforme, celle de Waterfall et celle du
        fournisseur d'identité (WF-ADM-0150), le journal d'audit de la première compris.
    origin: { $ref: '#/BackupOrigin' }
    available_commands: { $ref: '#/BackupCommands' }

BackupRetain:
  type: object
  required: [is_retained]
  properties:
    is_retained: { type: boolean }

BackupSchedule:
  type: object
  required: [is_enabled, frequency, at_time, weekday, retained_count, lock_version]
  description: >-
    Planification et rétention des sauvegardes, à une fréquence et une heure choisies par un
    utilisateur habilité (WF-ADM-0170). Livrée activée, quotidienne, à `01:00` UTC, sept
    sauvegardes conservées, sans copie externe (WF-ADM-0170, WF-EXP-0050) : une installation
    neuve est sauvegardée chaque jour sans qu'aucune planification ait été saisie, et
    `getBackupSchedule` ne répond jamais 404 faute d'en avoir une. Une restauration la conserve,
    copie externe comprise, comme la liste des sauvegardes qu'elle gouverne (WF-ADM-0160,
    #1742).
  properties:
    is_enabled: { type: boolean }
    frequency:
      type: string
      enum: [daily, weekly]
    at_time:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      description: >-
        Heure de la sauvegarde, en temps universel (UTC), comme les horodatages de la
        plateforme (`Timestamp`, WF-DAT-0100) : `01:00` est prise à `01:00Z`, quel que
        soit le fuseau du poste qui la lit.
    weekday:
      anyOf: [{ type: integer, minimum: 1, maximum: 7 }, { type: 'null' }]
      description: >-
        Jour d'une sauvegarde hebdomadaire, numéroté comme ISO 8601 : 1 est le lundi, 7 le
        dimanche, le jour s'entendant en temps universel comme l'heure ; nul pour une
        sauvegarde quotidienne. Hors de ces bornes, refusé par 422 `VALIDATION_FAILED`, motif
        `VALUE_OUT_OF_RANGE` sur `/weekday`, `params.minimum` à `1` ou `maximum` à `7`, la
        seule borne franchie. Nul pour une planification hebdomadaire, refusé par le motif
        `VALUE_REQUIRED` sur `/weekday` ; donné à une quotidienne, par le motif
        `VALIDATION_FAILED` sur `/weekday`.
    retained_count:
      type: integer
      minimum: 1
      maximum: 365
      description: >-
        Le nombre de sauvegardes conservées sur la plateforme, manuelles ou planifiées, celles
        qui sont marquées à conserver exceptées, de 1 à 365 : au-delà, la plus ancienne
        sauvegarde non marquée est supprimée (WF-ADM-0170). Hors de ces bornes, refusé par 422
        `VALIDATION_FAILED`, motif `VALUE_OUT_OF_RANGE` sur `/retained_count`,
        `params.minimum` à `1` ou `maximum` à `365`, la seule borne franchie.
    external_copy:
      allOf: [{ $ref: '#/BackupExternalCopy' }]
      description: >-
        La copie automatique de chaque sauvegarde planifiée vers un emplacement externe
        (WF-ADM-0170) ; absente, aucune copie n'est réglée — une installation qui ne déclare
        aucun emplacement n'en offre pas. Une planification enregistrée sans elle retire la
        copie réglée.
    lock_version: { $ref: ../common.yaml#/LockVersion }

BackupExternalCopy:
  type: object
  required: [is_enabled, location, path, retained_count]
  description: >-
    Copie externe automatique des sauvegardes planifiées (WF-ADM-0170) : après chaque
    sauvegarde planifiée et vérifiée, le serveur la copie vers un emplacement que
    l'installation déclare dans sa configuration de déploiement (`ExternalBackupLocation`),
    nommé ici et jamais décrit : aucun identifiant ni secret ne se saisit à l'écran. L'échec
    d'une copie est une alerte de l'état du système, comme celui de la sauvegarde
    (`scheduled_backup_copy_failed`, WF-OBS-0030). Une sauvegarde manuelle se copie hors de la
    plateforme par son téléchargement (WF-ADM-0150). Copiée ou téléchargée, l'archive porte
    la date de sa sauvegarde dans son manifeste (`Backup.taken_at`), que l'achèvement du dépôt
    d'une restauration relit (`completeChunkedUpload`, WF-ADM-0160).
  properties:
    is_enabled:
      type: boolean
      description: >-
        Faux, la copie est suspendue et son réglage gardé, comme `BackupSchedule.is_enabled`.
    location:
      allOf: [{ $ref: '#/ExternalBackupLocationName' }]
      description: >-
        Le nom d'un emplacement déclaré par l'installation (`listExternalBackupLocations`) ;
        un nom qu'elle ne déclare pas est refusé par 422 `VALIDATION_FAILED`, motif
        `UNKNOWN_EXTERNAL_BACKUP_LOCATION` sur `/external_copy/location`.
    path:
      allOf: [{ $ref: '#/ExternalBackupPath' }]
      description: >-
        Le dossier, ou le préfixe, où les copies sont écrites dans l'emplacement ; un chemin
        qui n'est pas relatif ou qui sort du dossier est refusé par 422 `VALIDATION_FAILED`,
        motif `PATH_INVALID` sur `/external_copy/path`.
    retained_count:
      type: integer
      minimum: 1
      maximum: 365
      description: >-
        Le nombre de copies gardées sur l'emplacement, au moins celui des sauvegardes gardées
        sur la plateforme (`BackupSchedule.retained_count`) : les sauvegardes sont conservées
        hors de la plateforme selon une rétention au moins égale (WF-EXP-0050). Un nombre
        moindre est refusé par 422 `VALIDATION_FAILED`, motif `VALUE_OUT_OF_RANGE` sur
        `/external_copy/retained_count`, `params.minimum` disant la rétention de la
        plateforme — `1` quand celle-ci est elle-même hors de ses bornes ; un nombre au-delà de
        365, par le même motif, `params.maximum` à `365`. Au-delà du nombre gardé, la plus
        ancienne copie de ce dossier est supprimée ; le marquage
        à conserver ne vaut que pour les sauvegardes de la plateforme.

ExternalBackupLocationName:
  type: string
  pattern: '^[a-z0-9][a-z0-9_-]{0,62}$'
  description: >-
    Nom d'un emplacement externe, tel que la configuration de déploiement le déclare : une clé
    de configuration, et non un objet que le serveur crée, d'où un nom plutôt qu'un UUID.

ExternalBackupPath:
  type: string
  minLength: 1
  maxLength: 255
  pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*$'
  description: >-
    Chemin relatif dans un emplacement externe : des segments séparés par `/`, sans `/` en tête
    ni en fin, chacun commençant par une lettre, un chiffre ou `_` — ni `.` ni `..`, qui
    sortiraient du dossier visé, ni segment vide. Le motif s'applique au texte entier, jusqu'à
    sa fin : un retour à la ligne final (`a\n`) le rompt. Un chemin qui ne s'y conforme pas
    est refusé par champ, 422 `VALIDATION_FAILED`, motif `PATH_INVALID`.

ExternalBackupLocationKind:
  type: string
  enum: [s3, mounted_share]
  description: >-
    Ce qu'est un emplacement externe : un compartiment S3, d'un autre site, ou un partage
    réseau monté sur le serveur. Le serveur l'atteint seul, jamais le navigateur.

ExternalBackupLocation:
  type: object
  required: [name, kind, description]
  description: >-
    Un emplacement externe où copier les sauvegardes (WF-ADM-0170), déclaré par
    l'installation dans sa configuration de déploiement — compartiment, point de montage,
    identifiants — et lu ici sans aucun de ses secrets : ni identifiant, ni clé, ni adresse
    qui en porterait. Il ne se crée ni ne se modifie par l'API.
  properties:
    name: { $ref: '#/ExternalBackupLocationName' }
    kind: { $ref: '#/ExternalBackupLocationKind' }
    description:
      anyOf: [{ type: string, maxLength: 500 }, { type: 'null' }]
      description: >-
        Ce que la configuration en dit pour l'administrateur, telle qu'elle est écrite ;
        nulle quand elle n'en dit rien.

ExternalBackupLocationTestRequest:
  type: object
  description: >-
    Ce que le test éprouve : l'emplacement, à la racine, ou dans le dossier que la copie
    emploierait.
  properties:
    path:
      allOf: [{ $ref: '#/ExternalBackupPath' }]
      description: Le dossier où écrire le fichier témoin ; absent, la racine de l'emplacement.

ExternalBackupFailure:
  type: string
  enum:
    - location_unreachable
    - access_denied
    - write_failed
    - delete_failed
    - storage_full
    - timed_out
  description: >-
    Pourquoi un emplacement externe a refusé une écriture : injoignable — compartiment ou
    partage absent, réseau coupé —, accès refusé à ses identifiants, écriture ou effacement
    du fichier refusés, espace épuisé, ou délai dépassé (WF-ARC-0110). Le motif d'un test
    (`ExternalBackupLocationTest`) comme celui d'une copie échouée (`Alert.params`).

ExternalBackupLocationTest:
  type: object
  required: [location, path, tested_at, failure]
  description: >-
    L'issue d'un test d'un emplacement externe : le serveur y a écrit puis effacé un fichier
    témoin, avec les identifiants de la configuration (WF-ADM-0170). Réussi quand `failure`
    est nul.
  properties:
    location: { $ref: '#/ExternalBackupLocationName' }
    path:
      anyOf: [{ $ref: '#/ExternalBackupPath' }, { type: 'null' }]
      description: Le dossier éprouvé ; nul pour la racine de l'emplacement.
    tested_at: { $ref: ../common.yaml#/Timestamp }
    failure:
      anyOf: [{ $ref: '#/ExternalBackupFailure' }, { type: 'null' }]
      description: Le motif de l'échec ; nul quand le fichier a été écrit puis effacé.

RestoreRequest:
  type: object
  required: [acknowledged_backup_taken_at]
  oneOf:
    - required: [backup_id]
    - required: [external_backup_upload_id]
  description: >-
    Restauration : elle remplace l'intégralité des deux bases de la plateforme, Waterfall et
    fournisseur d'identité, laisse le journal d'audit en place, ferme les sessions, vide les
    caches, et n'est appliquée qu'après une confirmation qui énonce la date de la sauvegarde et
    son caractère irréversible (WF-ADM-0160, WF-DAT-0130). Une sauvegarde de la liste se
    restaure comme sa commande `restore` le dit d'avance (`BackupCommand`) : vérifiée, aucune
    sauvegarde ni restauration en cours. Elle désigne une sauvegarde et une seule : les deux à
    la fois, ou aucune, est refusé par 422 `VALIDATION_FAILED` : deux, `fields` désignant
    `/external_backup_upload_id` par le motif `VALIDATION_FAILED` ; aucune, `/backup_id` par
    `VALUE_REQUIRED`.
  properties:
    backup_id: { $ref: ../common.yaml#/Uuid }
    external_backup_upload_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: >-
        Sauvegarde copiée hors de la plateforme, déposée au préalable pour une restauration
        (`FileUploadPurpose`, `external_backup`, WF-ADM-0160).
    acknowledged_backup_taken_at:
      allOf: [{ $ref: ../common.yaml#/Timestamp }]
      description: >-
        Date de la sauvegarde restaurée, telle que la confirmation l'énonce : elle doit
        correspondre à celle de la sauvegarde désignée (WF-ADM-0160) — `Backup.taken_at` pour
        une sauvegarde de la liste, `FileUpload.backup_taken_at` pour une sauvegarde déposée,
        la date que dit son manifeste, lue à l'achèvement du dépôt —, le même instant quelle que
        soit l'écriture de son fuseau. Une autre date est une confirmation qui ne nomme pas la
        sauvegarde qu'elle désigne, refusée par 400 `CONFIRMATION_REQUIRED`, et rien n'est mis en
        file.
    confirmed:
      type: boolean
      description: >-
        La confirmation elle-même : absente ou fausse, la restauration n'est pas confirmée, refusée
        par 400 `CONFIRMATION_REQUIRED` comme une date qui n'est pas celle de la sauvegarde, et
        rien n'est mis en file (WF-ADM-0160). Le schéma ne l'exige pas et ne fixe pas sa valeur,
        pour que ce soit la garde qui refuse, et non la validation du corps par 422 (US-0702/L3).

IdentitySyncSchedule:
  type: object
  required: [is_enabled, frequency, at_time, weekday, lock_version]
  description: >-
    La périodicité de la lecture des comptes du fournisseur d'identité, choisie par un
    utilisateur habilité, comme celle des sauvegardes (`BackupSchedule`, WF-ADM-0070,
    WF-ADM-0170). Livrée activée, quotidienne, à `01:30` UTC, une demi-heure après la
    sauvegarde livrée : une personne ajoutée à l'annuaire a un compte au terme de la
    périodicité, sans que personne l'ait saisie, et `getIdentitySyncSchedule` ne répond jamais
    404 faute d'en avoir une. La lecture planifiée se fait comme celle que l'on demande
    (`startIdentitySync`), par la plateforme, et son échec est une alerte de l'écran d'état
    (`identity_sync_failed`, WF-OBS-0030).
  properties:
    is_enabled:
      type: boolean
      description: Faux, aucune lecture n'est faite d'elle-même ; la lecture à la demande reste.
    frequency:
      type: string
      enum: [daily, weekly]
    at_time:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      description: >-
        Heure de la lecture, en temps universel (UTC), comme celle des sauvegardes
        (`BackupSchedule.at_time`).
    weekday:
      anyOf: [{ type: integer, minimum: 1, maximum: 7 }, { type: 'null' }]
      description: >-
        Jour d'une lecture hebdomadaire, numéroté comme ISO 8601, 1 le lundi, 7 le dimanche, en
        temps universel ; nul pour une lecture quotidienne. Refusé comme celui des sauvegardes :
        hors de 1 à 7, par le motif `VALUE_OUT_OF_RANGE` sur `/weekday` ; nul pour une
        hebdomadaire, par `VALUE_REQUIRED` ; donné à une quotidienne, par `VALIDATION_FAILED`.
    lock_version: { $ref: ../common.yaml#/LockVersion }

IdentitySyncReport:
  type: object
  required: [task_id, finished_at, created, updated, deactivated, restored, skipped, removed]
  description: >-
    Compte rendu d'une lecture des comptes du fournisseur d'identité (`startIdentitySync`, ou
    la lecture que la plateforme planifie, `IdentitySyncSchedule`). Les comptes créés dans
    Waterfall ne sont pas modifiés : c'est dans le fournisseur que la lecture rétablit leur
    identité. Un compte que WF-ADM-0120 interdit de désactiver est conservé actif et signalé
    (WF-ADM-0070). Un compte de Waterfall n'y est désigné que par son identifiant, son nom étant
    lu à la consultation :
    le compte rendu ne garde aucune donnée personnelle d'un compte (WF-ADM-0060, #920).
  properties:
    task_id:
      allOf: [{ $ref: ../common.yaml#/Uuid }]
      description: La tâche de la lecture (`BackgroundTaskRef.task_id`).
    finished_at:
      allOf: [{ $ref: ../common.yaml#/Timestamp }]
      description: Fin de la lecture.
    created:
      type: integer
      minimum: 0
      description: Comptes créés, sans rôle, pour les personnes que Waterfall ne connaissait pas.
    updated:
      type: integer
      minimum: 0
      description: >-
        Comptes dont le nom, le prénom ou l'adresse ont changé, dont ceux qu'une personne de
        l'annuaire a rattachés par leur adresse (#707).
    deactivated:
      type: integer
      minimum: 0
      description: Comptes désactivés parce que le fournisseur ne les connaît plus.
    restored:
      type: integer
      minimum: 0
      description: >-
        Comptes créés dans Waterfall dont le fournisseur tenait un autre nom, un autre prénom
        ou une autre adresse, et dont la lecture rétablit dans le fournisseur l'identité que
        Waterfall tient, puisqu'il en fait foi (WF-ADM-0050, #919). Le rétablissement suit la
        validation de la lecture : un compte compté ici est rétabli, ou à rétablir ; un
        rétablissement qui échoue est journalisé, et la lecture suivante le compte de nouveau.
        Un compte anonymisé n'est jamais rétabli.
    skipped:
      type: array
      description: >-
        Ce que la lecture a laissé tel quel, chacun avec son motif, un code du catalogue : un
        compte de Waterfall, ou une personne du fournisseur qui n'en a pas.
      items: { $ref: '#/IdentitySyncSkipped' }
    removed:
      type: array
      description: >-
        Les adresses des comptes locaux que la lecture retire du fournisseur d'identité :
        inconnus de Waterfall et sans mot de passe, laissés par une création que Waterfall n'a
        pas menée à son terme (#811). Le retrait suit la validation de la lecture : une adresse
        nommée ici est celle d'un compte retiré du fournisseur, ou à retirer. Un retrait qui
        échoue est journalisé, et la lecture suivante nomme de nouveau l'adresse.
      items: { type: string }

IdentitySyncSkipped:
  type: object
  additionalProperties: false
  required: [kind, user_id, subject, last_name, first_name, email, code]
  description: >-
    Ce que la lecture des comptes a laissé tel quel. Un compte de Waterfall (`account`) n'est
    gardé dans le compte rendu que par son identifiant : son nom, son prénom et son adresse sont
    ceux qu'il porte à la consultation, nuls pour un compte anonymisé depuis, que le front
    présente sous le libellé neutre de son catalogue (WF-ADM-0060, #920). Une personne du
    fournisseur d'identité qui n'a pas de compte (`person`) est nommée telle que le fournisseur
    la tient (#918) — sauf celle dont un compte de Waterfall porte l'adresse (`ALREADY_EXISTS`) :
    cette adresse étant celle du compte, l'entrée ne garde que l'identifiant de la personne chez
    le fournisseur (`subject`) et celui du compte (`user_id`), et le nom, le prénom et l'adresse
    sont ceux du compte à la consultation, nuls s'il est anonymisé depuis (#920). Ainsi
    `account` porte `user_id` et jamais `subject` ; `person` porte toujours `subject`, et
    `user_id` pour `ALREADY_EXISTS` seulement.
  properties:
    kind:
      type: string
      enum: [account, person]
    user_id:
      anyOf: [{ $ref: ../common.yaml#/Uuid }, { type: 'null' }]
      description: >-
        Le compte de Waterfall ; pour une personne, le compte qui porte son adresse
        (`ALREADY_EXISTS`), nul s'il n'en portait plus aucun quand elle a été écartée, et nul
        pour tout autre motif.
    subject:
      anyOf: [{ type: string }, { type: 'null' }]
      description: L'identifiant de la personne chez le fournisseur d'identité ; nul pour un compte.
    last_name:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Le nom du compte à la consultation — pour une personne `ALREADY_EXISTS`, celui du compte
        qui porte son adresse —, nul s'il est anonymisé ou s'il n'y a pas de compte ; celui de la
        personne chez le fournisseur pour tout autre motif, vide s'il n'en tient pas.
    first_name:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Le prénom du compte à la consultation — pour une personne `ALREADY_EXISTS`, celui du
        compte qui porte son adresse —, nul s'il est anonymisé ou s'il n'y a pas de compte ; celui
        de la personne chez le fournisseur pour tout autre motif, vide s'il n'en tient pas.
    email:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        L'adresse du compte à la consultation — pour une personne `ALREADY_EXISTS`, celle du
        compte qui la porte —, nulle s'il est anonymisé ou s'il n'y a pas de compte ; celle de la
        personne chez le fournisseur pour tout autre motif, nulle s'il n'en tient pas
        (`EMAIL_MISSING`).
    code:
      allOf: [{ $ref: ../common.yaml#/ErrorCode }]
      description: >-
        Pour un compte : `LAST_ADMINISTRATOR`, le dernier administrateur que le fournisseur ne
        connaît plus, gardé actif (WF-ADM-0120) ; `ALREADY_EXISTS`, sa nouvelle adresse portée
        par un autre ; `VALIDATION_FAILED`, un nouveau nom ou prénom vide, ou plus long que ce
        que Waterfall garde ; `EMAIL_MISSING`, le fournisseur n'en tient plus d'adresse. Pour
        une personne : `EMAIL_MISSING`, sans adresse, Waterfall ne sait pas la reconnaître ;
        `ALREADY_EXISTS`, relayée par un fournisseur externe à une adresse déjà portée par un
        compte, qu'elle ne rattache pas (#707), ce compte désigné par `user_id` ; `VALIDATION_FAILED`, un nom ou un prénom vide,
        ou plus long que ce que Waterfall garde.
