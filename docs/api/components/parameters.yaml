  schema: { $ref: common.yaml#/Money }

NodeReestimatedAmountMin:
  name: reestimated_amount_min
  in: query
  description: >-
    Borne inférieure, incluse, du montant réestimé, inflation comprise : restreint aux lignes qui en
    portent au moins autant (WF-DEV-0050, WF-RAE-0040).
  schema: { $ref: common.yaml#/Money }

NodeReestimatedAmountMax:
  name: reestimated_amount_max
  in: query
  description: >-
    Borne supérieure, incluse, du montant réestimé, inflation comprise : restreint aux lignes qui
    n'en portent pas plus (WF-DEV-0050, WF-RAE-0040). Inférieure à `reestimated_amount_min`, refusée
    par 422 `VALUE_OUT_OF_RANGE` sur `/query/reestimated_amount_max`.
  schema: { $ref: common.yaml#/Money }

NodePreviousQuantityMin:
  name: previous_quantity_min
  in: query
  description: >-
    Borne inférieure, incluse, de la quantité au reste à engager précédent : restreint aux lignes
    qui en portent au moins autant (WF-RAE-0040).
  schema: { $ref: common.yaml#/Decimal }

NodePreviousQuantityMax:
  name: previous_quantity_max
  in: query
  description: >-
    Borne supérieure, incluse, de la quantité au reste à engager précédent : restreint aux lignes
    qui n'en portent pas plus (WF-RAE-0040). Inférieure à `previous_quantity_min`, refusée par 422
    `VALUE_OUT_OF_RANGE` sur `/query/previous_quantity_max`.
  schema: { $ref: common.yaml#/Decimal }

NodePreviousHoursMin:
  name: previous_hours_min
  in: query
  description: >-
    Borne inférieure, incluse, de la charge au reste à engager précédent : restreint aux lignes qui
    en portent au moins autant (WF-RAE-0040).
  schema: { $ref: common.yaml#/Hours }

NodePreviousHoursMax:
  name: previous_hours_max
  in: query
  description: >-
    Borne supérieure, incluse, de la charge au reste à engager précédent : restreint aux lignes qui
    n'en portent pas plus (WF-RAE-0040). Inférieure à `previous_hours_min`, refusée par 422
    `VALUE_OUT_OF_RANGE` sur `/query/previous_hours_max`.
  schema: { $ref: common.yaml#/Hours }

NodePreviousUnitDisbursementMin:
  name: previous_unit_disbursement_min
  in: query
  description: >-
    Borne inférieure, incluse, du débours unitaire au reste à engager précédent : restreint aux
    lignes qui en portent au moins autant (WF-RAE-0040).
  schema: { $ref: common.yaml#/Money }

NodePreviousUnitDisbursementMax:
  name: previous_unit_disbursement_max
  in: query
  description: >-
    Borne supérieure, incluse, du débours unitaire au reste à engager précédent : restreint aux
    lignes qui n'en portent pas plus (WF-RAE-0040). Inférieure à `previous_unit_disbursement_min`,
    refusée par 422 `VALUE_OUT_OF_RANGE` sur `/query/previous_unit_disbursement_max`.
  schema: { $ref: common.yaml#/Money }

NodePreviousReestimatedAmountMin:
  name: previous_reestimated_amount_min
  in: query
  description: >-
    Borne inférieure, incluse, du montant réestimé au reste à engager précédent : restreint aux
    lignes qui en portent au moins autant (WF-RAE-0040).
  schema: { $ref: common.yaml#/Money }

NodePreviousReestimatedAmountMax:
  name: previous_reestimated_amount_max
  in: query
  description: >-
    Borne supérieure, incluse, du montant réestimé au reste à engager précédent : restreint aux
    lignes qui n'en portent pas plus (WF-RAE-0040). Inférieure à `previous_reestimated_amount_min`,
    refusée par 422 `VALUE_OUT_OF_RANGE` sur `/query/previous_reestimated_amount_max`.
  schema: { $ref: common.yaml#/Money }

NodeStartFrom:
  name: start_from
  in: query
  description: >-
    Début, inclus, de la période du début : restreint aux tâches qui en portent une dans la période
    (WF-PLA-0080).
  schema: { $ref: common.yaml#/PlanningDate }

NodeStartTo:
  name: start_to
  in: query
  description: >-
    Fin, inclus, de la période du début : restreint aux tâches qui en portent une dans la période ;
    antérieure à `start_from`, refusée par 422 `VALUE_OUT_OF_RANGE` sur `/query/start_to`
    (WF-PLA-0080).
  schema: { $ref: common.yaml#/PlanningDate }

NodeFinishFrom:
  name: finish_from
  in: query
  description: >-
    Début, inclus, de la période de la fin : restreint aux tâches qui en portent une dans la période
    (WF-PLA-0080, WF-RAE-0040).
  schema: { $ref: common.yaml#/PlanningDate }

NodeFinishTo:
  name: finish_to
  in: query
  description: >-
    Fin, inclus, de la période de la fin : restreint aux tâches qui en portent une dans la période ;
    antérieure à `finish_from`, refusée par 422 `VALUE_OUT_OF_RANGE` sur `/query/finish_to`
    (WF-PLA-0080, WF-RAE-0040).
  schema: { $ref: common.yaml#/PlanningDate }

NodeStartedOnFrom:
  name: started_on_from
  in: query
  description: >-
    Début, inclus, de la période de la date de démarrage : restreint aux tâches qui en portent une
    dans la période (WF-PLA-0080).
  schema: { $ref: common.yaml#/PlanningDate }

NodeStartedOnTo:
  name: started_on_to
  in: query
  description: >-
    Fin, inclus, de la période de la date de démarrage : restreint aux tâches qui en portent une
    dans la période ; antérieure à `started_on_from`, refusée par 422 `VALUE_OUT_OF_RANGE` sur
    `/query/started_on_to` (WF-PLA-0080).
  schema: { $ref: common.yaml#/PlanningDate }

NodeCompletedOnFrom:
  name: completed_on_from
  in: query
  description: >-
    Début, inclus, de la période de la date de terminaison : restreint aux tâches qui en portent une
    dans la période (WF-PLA-0080).
  schema: { $ref: common.yaml#/PlanningDate }

NodeCompletedOnTo:
  name: completed_on_to
  in: query
  description: >-
    Fin, inclus, de la période de la date de terminaison : restreint aux tâches qui en portent une
    dans la période ; antérieure à `completed_on_from`, refusée par 422 `VALUE_OUT_OF_RANGE` sur
    `/query/completed_on_to` (WF-PLA-0080).
  schema: { $ref: common.yaml#/PlanningDate }

NodeMilestoneFilter:
  name: is_milestone
  in: query
  description: >-
    Vrai, restreint aux jalons, faux aux tâches qui n'en sont pas ; absent, ne restreint rien
    (WF-PLA-0080).
  schema: { type: boolean }

NodeFinishOverdueFilter:
  name: finish_overdue
  in: query
  description: >-
    Vrai, restreint aux tâches démarrées dont la fin est dépassée (`finish_overdue`), faux aux
    autres ; absent, ne restreint rien (WF-RAE-0040).
  schema: { type: boolean }

NodeInactiveObjectFilter:
  name: uses_inactive_object
  in: query
  description: >-
    Vrai, restreint aux lignes qui emploient un objet désactivé du référentiel
    (`uses_inactive_object`), faux aux autres ; absent, ne restreint rien (WF-REF-0010).
  schema: { type: boolean }

NodeSortBy:
  name: sort_by
  in: query
  description: >-
    Colonne du tri des lignes de devis ; absente, l'ordre du plan. Le tri ne réordonne
    que les lignes sous chaque tâche, chacune parmi celles de sa tâche ; les tâches et
    leurs sous-arbres gardent l'ordre de l'arbre, et chaque nœud son `row_number`
    (WF-IHM-0060) : trié par montant décroissant, chaque tâche rend ses lignes du plus
    grand montant au plus petit, et les tâches restent à leur place. Un nombre se compare
    par sa valeur ; le libellé, en texte, et la catégorie, le rôle et le sous-projet, par
    leur libellé, caractère par caractère dans l'ordre des points de code Unicode ; une
    ligne sans valeur — sans heures, sans rôle, sans sous-projet… — vient après les autres
    dans l'ordre croissant, avant dans le décroissant. Des lignes d'une même valeur, ou
    toutes deux sans valeur, gardent l'ordre du plan ; une colonne de la seule tâche, de
    `description` à `work_breakdown`, que les lignes n'ont pas, les y laisse toutes. Ce
    que chaque opération trie ainsi, et les grilles qui le proposent, l'opération le dit.
    Une colonne de ligne qui manquerait ici est un constat sur le contrat.
  schema: { $ref: schemas/revisions.yaml#/NodeColumn }

UserId:
  name: user_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

AccessRoleId:
  name: access_role_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

OrgNodeId:
  name: org_node_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

ResourceRoleId:
  name: resource_role_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

CalendarId:
  name: calendar_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

CostTypeId:
  name: cost_type_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

CostCategoryId:
  name: cost_category_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

SubprojectId:
  name: subproject_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

RiskId:
  name: risk_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

RiskRevision:
  name: revision_id
  in: query
  description: >-
    Révision dont on lit les risques, chacune figeant la version de leur devis propre,
    de leur probabilité et de leur état (WF-RIS-0030) ; absente, la révision en cours, ou
    la dernière révision marquée quand aucune n'est en cours. La provision d'un risque
    survenu est celle qu'il avait dans la révision de référence (WF-RIS-0050).
  schema: { $ref: common.yaml#/Uuid }

TimelineId:
  name: timeline_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

ImportId:
  name: import_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

CostLineId:
  name: cost_line_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

BackupId:
  name: backup_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

ChunkedUploadId:
  name: chunked_upload_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

ChunkedUploadPartNumber:
  name: part_number
  in: path
  required: true
  description: Le numéro du morceau, à partir de 1 (`ChunkedUpload.part_count`).
  schema: { type: integer, minimum: 1 }

ExternalBackupLocationName:
  name: location_name
  in: path
  required: true
  description: Le nom d'un emplacement externe que l'installation déclare.
  schema: { $ref: schemas/platform.yaml#/ExternalBackupLocationName }

TaskId:
  name: task_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

RateYear:
  name: year
  in: path
  required: true
  schema: { $ref: common.yaml#/Year }

IndicatorsRevision:
  name: revision_id
  in: query
  description: >-
    La révision du calcul, pour les indicateurs du projet comme pour les courbes :
    absente, ou la révision en cours, le calcul au jour courant — sur la révision en cours,
    ou, quand le projet n'en a pas, sur sa dernière révision marquée avec le coût réel du jour
    (WF-IND-0010), `CalculationContext.is_stored` faux et `context.revision_id` nommant la
    révision du calcul ; une révision marquée, le calcul à la date de son marquage : les
    indicateurs et les courbes que son marquage a conservés (WF-DAT-0040), `is_stored` vrai,
    sur les lignes de coût réel connues à son marquage, telles qu'elles étaient alors — une
    ligne importée ensuite n'y entre pas, quelle que soit sa date de pièce, et une ligne mise à
    jour ou exclue ensuite y reste telle qu'elle était (WF-IND-0010). Une révision marquée
    avant l'état En cours n'a conservé que le total de son devis, sans aucun indicateur
    projet (WF-DAT-0040) : refusée par 409, `STATE_FORBIDS_OPERATION`. Avec `as_of`, qui
    choisit déjà la révision par sa date, refusée par 422, `VALIDATION_FAILED`.
  schema: { $ref: common.yaml#/Uuid }

AsOf:
  name: as_of
  in: query
  description: >-
    Date de calcul. Absente, les indicateurs du jour courant : ceux de la révision en
    cours, ou, quand le projet n'en a pas, ceux de sa dernière révision marquée calculés avec
    le coût réel du jour, `is_stored` faux (WF-IND-0010) ; présente, ceux de la dernière
    révision marquée antérieure ou égale, tels qu'ils ont été conservés à son marquage
    (WF-IND-0010, WF-DAT-0040, WF-PTF-0010).
  schema: { $ref: common.yaml#/PlanningDate }

Scope:
  name: scope
  in: query
  description: >-
    Maille de calcul : le projet entier, ou un sous-projet, l'ensemble « hors
    sous-projet » compris (WF-IND-0020). Un sous-projet que le projet n'a pas, ou un
    identifiant mal formé, est refusé par 422 `VALIDATION_FAILED`, `fields[]` désignant
    `/query/scope` par `UNKNOWN_SUBPROJECT`, comme le sous-projet des coûts réels : aucune
    lecture nulle ne tient lieu de refus.
  schema:
    anyOf:
      - type: string
        enum: [project, unassigned]
      - $ref: common.yaml#/Uuid

WorkloadBasis:
  name: basis
  in: query
  required: true
  description: >-
    Base du plan de charge, où la charge des lignes de main-d'œuvre est prise : la révision de
    référence, une révision marquée pour sa charge réestimée — nommée par `revision_id` —, ou la
    révision en cours (WF-DEV-0070). Les deux dernières sont la base du reste à engager.
  schema: { type: string, enum: [reference_budget, marked_remaining, current_remaining] }

PortfolioStates:
  name: states
  in: query
  description: >-
    États retenus dans le périmètre (WF-PTF-0010). Par défaut, les projets en cours. Une vue du
    portefeuille ne retient que les projets en cours, ceux en chiffrage qu'elle ajoute et les
    projets terminés de la période : un projet créé, perdu ou abandonné que `states` nomme y
    est sans effet, comme tout état que la vue dit ne pas compter (WF-PTF-0010). À une date passée
    (`as_of`), un projet est retenu selon l'état qu'il avait à cette date (WF-CYC-0130).
  schema:
    type: array
    items: { $ref: schemas/projects.yaml#/ProjectState }
  explode: false

PortfolioFrom:
  name: from
  in: query
  description: >-
    Début de la période, inclus, pour les projets terminés et les statistiques de période.
    Sans `to`, la fin est la date de calcul (`as_of`, ou le jour courant), celle de la période
    par défaut ; un début qui lui est postérieur est refusé par 422, `/query/from`,
    `params.maximum` la fin complétée (`PortfolioPeriodRefused`). Sans l'une ni l'autre, les
    statistiques, l'évolution trimestrielle, la structure des coûts et la courbe en S
    retiennent la période par défaut, les douze mois qui finissent à la date de calcul, et la
    liste des projets aucune période ; `scope.from` et `scope.to` disent la période retenue.
  schema: { $ref: common.yaml#/PlanningDate }

PortfolioTo:
  name: to
  in: query
  description: >-
    Fin de la période, incluse, une date de planning. Antérieure à `from`, elle est refusée par
    422 (`PortfolioPeriodRefused`). Sans `from`, le début est celui de la période par défaut :
    la date de calcul moins douze mois (le 28 février pour un 29 février), puis le lendemain —
    le 4 juin 2025 pour le 3 juin 2026, le 1er mars 2027 pour le 29 février 2028 ; une fin qui
    lui est antérieure est refusée de même, `params.minimum` le début complété.
  schema: { $ref: common.yaml#/PlanningDate }

PortfolioOrgNode:
  name: org_node_id
  in: query
  description: >-
    Restreint les seules lignes de main-d'œuvre dont le rôle relève du nœud — rattaché à
    lui ou à l'un de ses descendants ; un projet n'appartient à aucun service
    (WF-PTF-0010).
  schema: { $ref: common.yaml#/Uuid }

# Les colonnes d'audit d'une table plate (WF-DAT-0070), chacune triée et filtrée (WF-IHM-0060,
# WF-IHM-0130) : une période par colonne de date, nommée d'après elle comme les bornes d'une
# colonne de nombres (README, « Une période… »), et l'auteur comme celui du journal d'audit
# (`user_id`, `actor_kind` de `listAuditEvents`).

CreatedAtFrom:
  name: created_at_from
  in: query
  description: >-
    Début, inclus, de la période de création : restreint aux lignes créées à cet instant ou après
    lui (`audit.created_at`, WF-IHM-0130).
  schema: { $ref: common.yaml#/Timestamp }

CreatedAtTo:
  name: created_at_to
  in: query
  description: >-
    Fin, exclue, de la période de création : restreint aux lignes créées avant cet instant
    (WF-IHM-0130). Antérieure à `created_at_from`, elle est refusée par 422, `fields[]`
    désignant `/query/created_at_to` par `VALUE_OUT_OF_RANGE`, `params.minimum` le début donné ;
    égale, la période est vide.
  schema: { $ref: common.yaml#/Timestamp }

CreatedByUserId:
  name: created_by_user_id
  in: query
  description: >-
    Restreint aux lignes créées par ce compte (`audit.created_by.user_id`), désactivé ou anonymisé
    compris : ses actes lui restent attribués (WF-ADM-0060, WF-IHM-0130). Un identifiant qui ne
    désigne aucun compte ne retient rien.
  schema: { $ref: common.yaml#/Uuid }

CreatedByKind:
  name: created_by_kind
  in: query
  description: >-
    Restreint aux lignes créées par un compte (`user`) ou par la plateforme (`platform`), un
    traitement automatique (`audit.created_by.kind`, WF-DAT-0070) ; absent, les deux.
  schema: { $ref: schemas/audit.yaml#/AuditActorKind }

UpdatedAtFrom:
  name: updated_at_from
  in: query
  description: >-
    Début, inclus, de la période de dernière modification : restreint aux lignes modifiées en
    dernier à cet instant ou après lui (`audit.updated_at`, WF-IHM-0130).
  schema: { $ref: common.yaml#/Timestamp }

UpdatedAtTo:
  name: updated_at_to
  in: query
  description: >-
    Fin, exclue, de la période de dernière modification : restreint aux lignes modifiées en
    dernier avant cet instant (WF-IHM-0130). Antérieure à `updated_at_from`, elle est refusée par
    422, `fields[]` désignant `/query/updated_at_to` par `VALUE_OUT_OF_RANGE`, `params.minimum`
    le début donné ; égale, la période est vide.
  schema: { $ref: common.yaml#/Timestamp }

UpdatedByUserId:
  name: updated_by_user_id
  in: query
  description: >-
    Restreint aux lignes modifiées en dernier par ce compte (`audit.updated_by.user_id`), désactivé
    ou anonymisé compris (WF-ADM-0060, WF-IHM-0130). Un identifiant qui ne désigne aucun compte ne
    retient rien.
  schema: { $ref: common.yaml#/Uuid }

UpdatedByKind:
  name: updated_by_kind
  in: query
  description: >-
    Restreint aux lignes modifiées en dernier par un compte (`user`) ou par la plateforme
    (`platform`) (`audit.updated_by.kind`, WF-DAT-0070) ; absent, les deux.
  schema: { $ref: schemas/audit.yaml#/AuditActorKind }
