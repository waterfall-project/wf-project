# Paramètres partagés. Tous les identifiants de chemin sont des UUID (WF-DAT-0060).

Limit:
  name: limit
  in: query
  schema: { type: integer, minimum: 1, maximum: 500, default: 50 }

Offset:
  name: offset
  in: query
  schema: { type: integer, minimum: 0, default: 0 }

Search:
  name: search
  in: query
  description: >-
    Recherche sur le libellé ; une opération qui cherche aussi sur un autre champ, le code
    par exemple, le dit dans sa description. Le texte se compare comme toute recherche du
    contrat, sans égard à la casse ni aux accents (README, « Une recherche… »).
  schema: { type: string, minLength: 1, maxLength: 200 }

SortOrder:
  name: sort_order
  in: query
  description: Sens du tri demandé par `sort_by`.
  schema: { $ref: common.yaml#/SortOrder }

SubprojectFilter:
  name: subproject_id
  in: query
  description: '`unassigned` pour ce qui ne relève d''aucun sous-projet (WF-IND-0020, WF-CRE-0020).'
  schema:
    anyOf:
      - type: string
        enum: [unassigned]
      - $ref: common.yaml#/Uuid

IncludeInactive:
  name: include_inactive
  in: query
  description: >-
    Inclut les objets désactivés (WF-REF-0150), sous la permission de modification que
    l'opération exige : sans elle, la demande est refusée par 403 (`PERMISSION_MISSING`), comme
    pour `is_active` faux.
  schema: { type: boolean, default: false }

IsActive:
  name: is_active
  in: query
  description: >-
    Restreint à l'un des deux états, la colonne de l'état d'une table du référentiel filtrée
    (WF-IHM-0130) : vrai, les seuls objets actifs ; faux, les seuls désactivés, lus sous la
    permission qu'`include_inactive` exige (WF-REF-0150). Il prime sur `include_inactive`, qui
    ne fait qu'ajouter les désactivés aux actifs ; absent, `include_inactive` décide.
    `include_inactive` reste refusé sans sa permission, même quand `is_active` le rend sans
    effet : la permission se juge sur la requête, non sur ce qu'elle rendrait.
  schema: { type: boolean }

ProjectId:
  name: project_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

RevisionId:
  name: revision_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

StructureId:
  name: structure_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

NodeId:
  name: node_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

RowNumber:
  name: row_number
  in: path
  required: true
  description: >-
    Un numéro de ligne dans la numérotation de toute la structure, à partir de 1, comme
    `Node.row_number` (`resolveRowNumber`).
  schema: { type: integer, minimum: 1 }

NodeFields:
  name: fields
  in: query
  description: >-
    Les propriétés à rendre de chaque nœud (`Node`), en plus de celles toujours rendues ; une
    propriété inconnue est refusée comme tout paramètre de requête : 422 `VALIDATION_FAILED`,
    `fields` désignant `/query/fields` par `FIELD_NOT_ACCEPTED` (WF-ARC-0110 ; J-10, US-0702/L1).
    `listNodes` et `compareRevisions` le lisent de même.
  schema:
    type: array
    minItems: 1
    items:
      type: string
      pattern: '^((task|estimate_line)\.)?[a-z_]+$'
  explode: false

# Ce que lit une lecture des nœuds, `listNodes` et `compareRevisions` de même (#1193) : sa
# description dit ce que chacun retient, rend et totalise.

NodeKinds:
  name: kinds
  in: query
  description: >-
    Choisit ce que la lecture rend, tâches ou lignes, selon la grille affichée ; ce n'est pas un
    filtre : les totaux ne changent pas avec lui (`listNodes`, #487).
  schema:
    type: array
    items: { $ref: schemas/revisions.yaml#/NodeKind }
  explode: false

NodeSubtreeOf:
  name: subtree_of
  in: query
  description: >-
    Restreint au sous-arbre d'une tâche récapitulative, elle comprise
    (WF-PLA-0080, WF-DEV-0050).
  schema: { $ref: common.yaml#/Uuid }

NodeCostTypeFilter:
  name: cost_type_id
  in: query
  description: Restreint aux lignes d'une nature de coût (WF-DEV-0050).
  schema: { $ref: common.yaml#/Uuid }

NodeOrderItemFilter:
  name: order_item_id
  in: query
  description: >-
    Restreint au sous-arbre de la tâche rattachée à ce poste du lotissement, au niveau 2,
    elle comprise (WF-PLA-0170, WF-DEV-0050) ; un poste qu'aucune tâche ne porte ne
    retient rien.
  schema: { $ref: common.yaml#/Uuid }

NodeWorkPackageFilter:
  name: work_package_id
  in: query
  description: >-
    Restreint au sous-arbre de la tâche rattachée à ce lot du lotissement, au niveau 1, elle
    comprise — le filtre par lot des grilles de devis et de reste à engager (WF-DEV-0050,
    WF-RAE-0040, WF-PLA-0170) ; un lot qu'aucune tâche ne porte ne retient rien.
  schema: { $ref: common.yaml#/Uuid }

NodeCostCategoryFilter:
  name: cost_category_id
  in: query
  schema: { $ref: common.yaml#/Uuid }

NodeResourceRoleFilter:
  name: resource_role_id
  in: query
  schema: { $ref: common.yaml#/Uuid }

NodeProgressFilter:
  name: progress
  in: query
  description: >-
    Restreint aux tâches dans l'un de ces états : les tâches démarrées, pour la
    grille de planning (WF-PLA-0080) et la grille de reste à engager, qui ne montre
    par défaut que leurs lignes (WF-RAE-0040).
  schema:
    type: array
    items: { $ref: schemas/revisions.yaml#/TaskProgress }
  explode: false

NodeCriticalFilter:
  name: is_critical
  in: query
  schema: { type: boolean }

NodeSummariesOnly:
  name: summaries_only
  in: query
  description: >-
    Vrai, restreint aux tâches récapitulatives (`is_summary`) : ni feuille ni jalon, que
    l'arborescence de tâches ne représente pas (WF-PLA-0110). Faux ou absent, ne
    restreint rien.
  schema: { type: boolean }

NodeMaxLevel:
  name: max_level
  in: query
  description: >-
    Restreint aux tâches dont le niveau (`level`) ne dépasse pas celui-ci, le premier
    niveau étant celui des tâches sans parent : demandé à 2 avec `summaries_only`, les
    récapitulatives des deux premiers niveaux, sous le nœud du projet (WF-PLA-0110).
    Une ligne est retenue avec la tâche qui la porte, quel que soit son niveau.
  schema: { type: integer, minimum: 1 }

NodeTimelineFilter:
  name: timeline_id
  in: query
  description: >-
    Restreint aux tâches et aux jalons inscrits sur cette chronologie du projet
    (`tracking`, WF-PLA-0140, WF-PLA-0060), sans leurs ancêtres ; une chronologie sans
    inscription, ou qui n'est pas une chronologie du projet, ne retient rien.
  schema: { $ref: common.yaml#/Uuid }

# Les filtres de colonne de `listNodes` (US-0701/L3, F-06) : chaque colonne de nombres de ses trois
# grilles par ses deux bornes, chaque colonne de dates par sa période (README du contrat).

NodeDescriptionFilter:
  name: description
  in: query
  description: >-
    Restreint aux tâches dont la description contient ce texte, sans égard à la casse ni aux
    accents, comme `search` (README du contrat ; WF-PLA-0080).
  schema: { type: string, minLength: 1 }

NodeSchedulingModeFilter:
  name: scheduling_mode
  in: query
  description: Restreint aux tâches dans l'un de ces modes de planification (WF-PLA-0080).
  schema:
    type: array
    items: { $ref: schemas/revisions.yaml#/SchedulingMode }
  explode: false

NodeDurationMin:
  name: duration_min
  in: query
  description: >-
    Borne inférieure, incluse, de la durée, en jours de travail : restreint aux tâches qui en
    portent au moins autant (WF-PLA-0080).
  schema: { $ref: common.yaml#/Decimal }

NodeDurationMax:
  name: duration_max
  in: query
  description: >-
    Borne supérieure, incluse, de la durée, en jours de travail : restreint aux tâches qui n'en
    portent pas plus (WF-PLA-0080). Inférieure à `duration_min`, refusée par 422
    `VALUE_OUT_OF_RANGE` sur `/query/duration_max`.
  schema: { $ref: common.yaml#/Decimal }

NodePhysicalProgressMin:
  name: physical_progress_min
  in: query
  description: >-
    Borne inférieure, incluse, de l'avancement physique, de 0 à 1 : restreint aux récapitulatives
    qui en portent au moins autant (WF-PLA-0080).
  schema: { $ref: common.yaml#/Decimal }

NodePhysicalProgressMax:
  name: physical_progress_max
  in: query
  description: >-
    Borne supérieure, incluse, de l'avancement physique, de 0 à 1 : restreint aux récapitulatives
    qui n'en portent pas plus (WF-PLA-0080). Inférieure à `physical_progress_min`, refusée par 422
    `VALUE_OUT_OF_RANGE` sur `/query/physical_progress_max`.
  schema: { $ref: common.yaml#/Decimal }

NodeTotalFloatMin:
  name: total_float_min
  in: query
  description: >-
    Borne inférieure, incluse, de la marge totale, en jours de travail, signée : restreint aux
    tâches qui en portent au moins autant (WF-PLA-0080).
  schema: { $ref: common.yaml#/Decimal }

NodeTotalFloatMax:
  name: total_float_max
  in: query
  description: >-
    Borne supérieure, incluse, de la marge totale, en jours de travail, signée : restreint aux
    tâches qui n'en portent pas plus (WF-PLA-0080). Inférieure à `total_float_min`, refusée par 422
    `VALUE_OUT_OF_RANGE` sur `/query/total_float_max`.
  schema: { $ref: common.yaml#/Decimal }

NodeQuantityMin:
  name: quantity_min
  in: query
  description: >-
    Borne inférieure, incluse, de la quantité : restreint aux lignes qui en portent au moins autant
    (WF-DEV-0050).
  schema: { $ref: common.yaml#/Decimal }

NodeQuantityMax:
  name: quantity_max
  in: query
  description: >-
    Borne supérieure, incluse, de la quantité : restreint aux lignes qui n'en portent pas plus
    (WF-DEV-0050). Inférieure à `quantity_min`, refusée par 422 `VALUE_OUT_OF_RANGE` sur
    `/query/quantity_max`.
  schema: { $ref: common.yaml#/Decimal }

NodeHoursMin:
  name: hours_min
  in: query
  description: >-
    Borne inférieure, incluse, de la charge, en heures : restreint aux lignes qui en portent au
    moins autant (WF-DEV-0050).
  schema: { $ref: common.yaml#/Hours }

NodeHoursMax:
  name: hours_max
  in: query
  description: >-
    Borne supérieure, incluse, de la charge, en heures : restreint aux lignes qui n'en portent pas
    plus (WF-DEV-0050). Inférieure à `hours_min`, refusée par 422 `VALUE_OUT_OF_RANGE` sur
    `/query/hours_max`.
  schema: { $ref: common.yaml#/Hours }

NodeUnitDisbursementMin:
  name: unit_disbursement_min
  in: query
  description: >-
    Borne inférieure, incluse, du débours unitaire : restreint aux lignes qui en portent au moins
    autant (WF-DEV-0050).
  schema: { $ref: common.yaml#/Money }

NodeUnitDisbursementMax:
  name: unit_disbursement_max
  in: query
  description: >-
