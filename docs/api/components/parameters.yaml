# Shared parameters. All path identifiers are UUIDs (WF-DAT-0060).

Limit:
  name: limit
  in: query
  schema: { type: integer, minimum: 1, maximum: 500, default: 50 }

Offset:
  name: offset
  in: query
  schema: { type: integer, minimum: 0, default: 0 }

Search:
  name: search
  in: query
  description: >-
    Search on the label; an operation that also searches on another field, the code
    for example, says so in its description. The text is compared like any search of the
    contract, regardless of case and accents (README, "A search…").
  schema: { type: string, minLength: 1, maxLength: 200 }

SortOrder:
  name: sort_order
  in: query
  description: Direction of the sort requested by `sort_by`.
  schema: { $ref: common.yaml#/SortOrder }

SubprojectFilter:
  name: subproject_id
  in: query
  description: '`unassigned` for what falls under no subproject (WF-IND-0020, WF-CRE-0020).'
  schema:
    anyOf:
      - type: string
        enum: [unassigned]
      - $ref: common.yaml#/Uuid

IncludeInactive:
  name: include_inactive
  in: query
  description: >-
    Includes the deactivated objects of a reference data list (WF-REF-0150), under the
    modification permission that the operation requires: without it, the request is refused with 403
    (`PERMISSION_MISSING`), as for `is_active` false. Specific to reference data: a list that
    does not follow this rule carries its own parameter — the accounts, whose deactivated ones are
    read like the active ones (`listUsers`, WF-ADM-0060, #1736).
  schema: { type: boolean, default: false }

IsActive:
  name: is_active
  in: query
  description: >-
    Restricts to one of the two states, the state column of a reference data table being
    filtered (WF-IHM-0130): true, only the active objects; false, only the deactivated ones,
    read under the permission that `include_inactive` requires (WF-REF-0150). It takes
    precedence over `include_inactive`, which only adds the deactivated objects to the active
    ones; absent, `include_inactive` decides. `include_inactive` remains refused without its
    permission, even when `is_active` makes it ineffective: the permission is judged on the
    request, not on what it would return.
  schema: { type: boolean }

ProjectId:
  name: project_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

RevisionId:
  name: revision_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

StructureId:
  name: structure_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

NodeId:
  name: node_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

RowNumber:
  name: row_number
  in: path
  required: true
  description: >-
    A row number in the numbering of the whole structure, starting at 1, like
    `Node.row_number` (`resolveRowNumber`).
  schema: { type: integer, minimum: 1 }

NodeFields:
  name: fields
  in: query
  description: >-
    The properties to return for each node (`Node`), in addition to those always returned; an
    unknown property is refused like any query parameter: 422 `VALIDATION_FAILED`,
    `fields` designating `/query/fields` with `FIELD_NOT_ACCEPTED` (WF-ARC-0110; J-10, US-0702/L1).
    `listNodes` and `compareRevisions` read it likewise.
  schema:
    type: array
    minItems: 1
    items:
      type: string
      pattern: '^((task|estimate_line)\.)?[a-z_]+$'
  explode: false

# What a reading of the nodes reads, `listNodes` and `compareRevisions` likewise (#1193): its
# description says what each one retains, returns and totals.

NodeKinds:
  name: kinds
  in: query
  description: >-
    Chooses what the reading returns, tasks or lines, according to the grid displayed; it is not a
    filter: the totals do not change with it (`listNodes`, #487).
  schema:
    type: array
    items: { $ref: schemas/revisions.yaml#/NodeKind }
  explode: false

NodeSubtreeOf:
  name: subtree_of
  in: query
  description: >-
    Restricts to the subtree of a summary task, the task itself included
    (WF-PLA-0080, WF-DEV-0050).
  schema: { $ref: common.yaml#/Uuid }

NodeCostTypeFilter:
  name: cost_type_id
  in: query
  description: Restricts to the lines of a cost type (WF-DEV-0050).
  schema: { $ref: common.yaml#/Uuid }

NodeOrderItemFilter:
  name: order_item_id
  in: query
  description: >-
    Restricts to the subtree of the task attached to this order item of the work breakdown, at
    level 2, the task itself included (WF-PLA-0170, WF-DEV-0050); an order item that no task
    carries retains nothing.
  schema: { $ref: common.yaml#/Uuid }

NodeWorkPackageFilter:
  name: work_package_id
  in: query
  description: >-
    Restricts to the subtree of the task attached to this work package of the work breakdown, at
    level 1, the task itself included — the work package filter of the estimate and
    remaining-to-commit grids (WF-DEV-0050, WF-RAE-0040, WF-PLA-0170); a work package that no
    task carries retains nothing.
  schema: { $ref: common.yaml#/Uuid }

NodeCostCategoryFilter:
  name: cost_category_id
  in: query
  description: Restricts to the lines of this cost category (WF-DEV-0050).
  schema: { $ref: common.yaml#/Uuid }

NodeResourceRoleFilter:
  name: resource_role_id
  in: query
  description: Restricts to the lines of this resource role (WF-DEV-0050).
  schema: { $ref: common.yaml#/Uuid }

NodeProgressFilter:
  name: progress
  in: query
  description: >-
    Restricts to the tasks in one of these states: the started tasks, for the
    planning grid (WF-PLA-0080) and the remaining-to-commit grid, which shows
    by default only their lines (WF-RAE-0040).
  schema:
    type: array
    items: { $ref: schemas/revisions.yaml#/TaskProgress }
  explode: false

NodeCriticalFilter:
  name: is_critical
  in: query
  description: >-
    True, restricts to the tasks on the critical path; false, to the others; absent, no
    restriction (`is_critical`, WF-PLA-0080, WF-PLA-0100).
  schema: { type: boolean }

NodeSummariesOnly:
  name: summaries_only
  in: query
  description: >-
    True, restricts to summary tasks (`is_summary`): neither leaf nor milestone, which
    the task tree does not represent (WF-PLA-0110). False or absent, does not
    restrict anything.
  schema: { type: boolean }

NodeMaxLevel:
  name: max_level
  in: query
  description: >-
    Restricts to the tasks whose level (`level`) does not exceed this one, the first
    level being that of the tasks without a parent: requested at 2 with `summaries_only`, the
    summary tasks of the first two levels, under the project node (WF-PLA-0110).
    A line is retained with the task that carries it, whatever its level.
  schema: { type: integer, minimum: 1 }

NodeTimelineFilter:
  name: timeline_id
  in: query
  description: >-
    Restricts to the tasks and milestones entered on this timeline of the project
    (`tracking`, WF-PLA-0140, WF-PLA-0060), without their ancestors; a timeline without
    entries, or that is not a timeline of the project, retains nothing.
  schema: { $ref: common.yaml#/Uuid }

NodeDifferenceFilter:
  name: difference
  in: query
  description: >-
    Restricts to the nodes whose difference (`NodeDifference`) is one of these values, which can
    be combined; "Differences only" names all three (#1398). Each node, task or line, is judged
    on its own mark: a retained task does not bring along its unchanged lines. The ancestors of
    a retained node are returned, and are themselves modified by their content (`changes` empty
    when nothing else about them changes): the filtered tree remains a tree. A moved node is
    retained at its new place. `totals` does not change with it — those of the reading without
    it, of the whole structure without any other filter (`NodeTotals`) —, whereas
    `amount_deltas` of the comparison is calculated on the lines it retains. On the main
    structure and on the own estimate of a risk, where `difference` is null, it has no effect:
    the reading is the one without it. `listNodes` and `compareRevisions` read it likewise.
  schema:
    type: array
    minItems: 1
    items: { type: string, enum: [added, removed, modified] }
  explode: false

# The column filters of `listNodes` (US-0701/L3, F-06): each number column of its three
# grids by its two bounds, each date column by its period (README of the contract).

NodeDescriptionFilter:
  name: description
  in: query
  description: >-
    Restricts to the tasks whose description contains this text, regardless of case and
    accents, like `search` (README of the contract; WF-PLA-0080).
  schema: { type: string, minLength: 1 }

NodeSchedulingModeFilter:
  name: scheduling_mode
  in: query
  description: Restricts to the tasks in one of these scheduling modes (WF-PLA-0080).
  schema:
    type: array
    items: { $ref: schemas/revisions.yaml#/SchedulingMode }
  explode: false

NodeDurationMin:
  name: duration_min
  in: query
  description: >-
    Lower bound, inclusive, of the duration, in working days: restricts to the tasks that
    carry at least as much (WF-PLA-0080).
  schema: { $ref: common.yaml#/Decimal }

NodeDurationMax:
  name: duration_max
  in: query
  description: >-
    Upper bound, inclusive, of the duration, in working days: restricts to the tasks that
    carry no more (WF-PLA-0080). Lower than `duration_min`, refused with 422
    `VALUE_OUT_OF_RANGE` on `/query/duration_max`.
  schema: { $ref: common.yaml#/Decimal }

NodePhysicalProgressMin:
  name: physical_progress_min
  in: query
  description: >-
    Lower bound, inclusive, of the physical progress, from 0 to 1: restricts to the summary tasks
    that carry at least as much (WF-PLA-0080).
  schema: { $ref: common.yaml#/Decimal }

NodePhysicalProgressMax:
  name: physical_progress_max
  in: query
  description: >-
    Upper bound, inclusive, of the physical progress, from 0 to 1: restricts to the summary tasks
    that carry no more (WF-PLA-0080). Lower than `physical_progress_min`, refused with 422
    `VALUE_OUT_OF_RANGE` on `/query/physical_progress_max`.
  schema: { $ref: common.yaml#/Decimal }

NodeTotalFloatMin:
  name: total_float_min
  in: query
  description: >-
    Lower bound, inclusive, of the total float, in working days, signed: restricts to the
    tasks that carry at least as much (WF-PLA-0080).
  schema: { $ref: common.yaml#/Decimal }

NodeTotalFloatMax:
  name: total_float_max
  in: query
  description: >-
    Upper bound, inclusive, of the total float, in working days, signed: restricts to the
    tasks that carry no more (WF-PLA-0080). Lower than `total_float_min`, refused with 422
    `VALUE_OUT_OF_RANGE` on `/query/total_float_max`.
  schema: { $ref: common.yaml#/Decimal }

NodeQuantityMin:
  name: quantity_min
  in: query
  description: >-
    Lower bound, inclusive, of the quantity: restricts to the lines that carry at least as much
    (WF-DEV-0050).
  schema: { $ref: common.yaml#/Decimal }

NodeQuantityMax:
  name: quantity_max
  in: query
  description: >-
    Upper bound, inclusive, of the quantity: restricts to the lines that carry no more
    (WF-DEV-0050). Lower than `quantity_min`, refused with 422 `VALUE_OUT_OF_RANGE` on
    `/query/quantity_max`.
  schema: { $ref: common.yaml#/Decimal }

NodeHoursMin:
  name: hours_min
  in: query
  description: >-
    Lower bound, inclusive, of the effort, in hours: restricts to the lines that carry at
    least as much (WF-DEV-0050).
  schema: { $ref: common.yaml#/Hours }

NodeHoursMax:
  name: hours_max
  in: query
  description: >-
    Upper bound, inclusive, of the effort, in hours: restricts to the lines that carry no
    more (WF-DEV-0050). Lower than `hours_min`, refused with 422 `VALUE_OUT_OF_RANGE` on
    `/query/hours_max`.
  schema: { $ref: common.yaml#/Hours }

NodeUnitDisbursementMin:
  name: unit_disbursement_min
  in: query
  description: >-
    Lower bound, inclusive, of the unit disbursement: restricts to the lines that carry at least
    as much (WF-DEV-0050).
  schema: { $ref: common.yaml#/Money }

NodeUnitDisbursementMax:
  name: unit_disbursement_max
  in: query
  description: >-
    Upper bound, inclusive, of the unit disbursement: restricts to the lines that carry no more
    (WF-DEV-0050). Lower than `unit_disbursement_min`, refused with 422 `VALUE_OUT_OF_RANGE` on
    `/query/unit_disbursement_max`.
  schema: { $ref: common.yaml#/Money }

NodePaymentDelayMin:
  name: payment_delay_days_min
  in: query
  description: >-
    Lower bound, inclusive, of the payment delay, in days: restricts to the lines that carry
    at least as much (WF-DEV-0050).
  schema: { type: integer, minimum: 0 }

NodePaymentDelayMax:
  name: payment_delay_days_max
  in: query
  description: >-
    Upper bound, inclusive, of the payment delay, in days: restricts to the lines that
    carry no more (WF-DEV-0050). Lower than `payment_delay_days_min`, refused with 422
    `VALUE_OUT_OF_RANGE` on `/query/payment_delay_days_max`.
  schema: { type: integer, minimum: 0 }

NodeConsumptionYearMin:
  name: consumption_year_min
  in: query
  description: >-
    Lower bound, inclusive, of the consumption year: restricts to the lines that carry at
    least as much, a line whose task spans several years being retained on the year of its
    start (`EstimateLineFacet.consumption_year`, WF-DEV-0040).
  schema: { $ref: common.yaml#/Year }

NodeConsumptionYearMax:
  name: consumption_year_max
  in: query
  description: >-
    Upper bound, inclusive, of the consumption year: restricts to the lines that carry
    no more, a line whose task spans several years being retained on the year of its start
    (`EstimateLineFacet.consumption_year`, WF-DEV-0040). Lower than `consumption_year_min`,
    refused with 422 `VALUE_OUT_OF_RANGE` on `/query/consumption_year_max`.
  schema: { $ref: common.yaml#/Year }

NodeBaseAmountMin:
  name: base_amount_min
  in: query
  description: >-
    Lower bound, inclusive, of the amount at the rates of the reference year, before inflation:
    restricts to the lines that carry at least as much (WF-DEV-0050).
  schema: { $ref: common.yaml#/Money }

NodeBaseAmountMax:
  name: base_amount_max
  in: query
  description: >-
    Upper bound, inclusive, of the amount at the rates of the reference year, before inflation:
    restricts to the lines that carry no more (WF-DEV-0050). Lower than `base_amount_min`,
    refused with 422 `VALUE_OUT_OF_RANGE` on `/query/base_amount_max`.
  schema: { $ref: common.yaml#/Money }

NodeBudgetedAmountMin:
  name: budgeted_amount_min
  in: query
  description: >-
    Lower bound, inclusive, of the budgeted amount, inflation included: restricts to the lines that
    carry at least as much (WF-RAE-0040).
  schema: { $ref: common.yaml#/Money }

NodeBudgetedAmountMax:
  name: budgeted_amount_max
  in: query
  description: >-
    Upper bound, inclusive, of the budgeted amount, inflation included: restricts to the lines that
    carry no more (WF-RAE-0040). Lower than `budgeted_amount_min`, refused with 422
    `VALUE_OUT_OF_RANGE` on `/query/budgeted_amount_max`.
  schema: { $ref: common.yaml#/Money }

NodeReestimatedAmountMin:
  name: reestimated_amount_min
  in: query
  description: >-
    Lower bound, inclusive, of the re-estimated amount, inflation included: restricts to the
    lines that carry at least as much (WF-DEV-0050, WF-RAE-0040).
  schema: { $ref: common.yaml#/Money }

NodeReestimatedAmountMax:
  name: reestimated_amount_max
  in: query
  description: >-
    Upper bound, inclusive, of the re-estimated amount, inflation included: restricts to the
    lines that carry no more (WF-DEV-0050, WF-RAE-0040). Lower than `reestimated_amount_min`,
    refused with 422 `VALUE_OUT_OF_RANGE` on `/query/reestimated_amount_max`.
  schema: { $ref: common.yaml#/Money }

NodePreviousQuantityMin:
  name: previous_quantity_min
  in: query
  description: >-
    Lower bound, inclusive, of the quantity at the previous remaining to commit: restricts to
    the lines that carry at least as much (WF-RAE-0040).
  schema: { $ref: common.yaml#/Decimal }

NodePreviousQuantityMax:
  name: previous_quantity_max
  in: query
  description: >-
    Upper bound, inclusive, of the quantity at the previous remaining to commit: restricts to
    the lines that carry no more (WF-RAE-0040). Lower than `previous_quantity_min`, refused with
    422 `VALUE_OUT_OF_RANGE` on `/query/previous_quantity_max`.
  schema: { $ref: common.yaml#/Decimal }

NodePreviousHoursMin:
  name: previous_hours_min
  in: query
  description: >-
    Lower bound, inclusive, of the effort at the previous remaining to commit: restricts to the
    lines that carry at least as much (WF-RAE-0040).
  schema: { $ref: common.yaml#/Hours }

NodePreviousHoursMax:
  name: previous_hours_max
  in: query
  description: >-
    Upper bound, inclusive, of the effort at the previous remaining to commit: restricts to the
    lines that carry no more (WF-RAE-0040). Lower than `previous_hours_min`, refused with 422
    `VALUE_OUT_OF_RANGE` on `/query/previous_hours_max`.
  schema: { $ref: common.yaml#/Hours }

NodePreviousUnitDisbursementMin:
  name: previous_unit_disbursement_min
  in: query
  description: >-
    Lower bound, inclusive, of the unit disbursement at the previous remaining to commit:
    restricts to the lines that carry at least as much (WF-RAE-0040).
  schema: { $ref: common.yaml#/Money }

NodePreviousUnitDisbursementMax:
  name: previous_unit_disbursement_max
  in: query
  description: >-
    Upper bound, inclusive, of the unit disbursement at the previous remaining to commit:
    restricts to the lines that carry no more (WF-RAE-0040). Lower than
    `previous_unit_disbursement_min`, refused with 422 `VALUE_OUT_OF_RANGE` on
    `/query/previous_unit_disbursement_max`.
  schema: { $ref: common.yaml#/Money }

NodePreviousReestimatedAmountMin:
  name: previous_reestimated_amount_min
  in: query
  description: >-
    Lower bound, inclusive, of the re-estimated amount at the previous remaining to commit:
    restricts to the lines that carry at least as much (WF-RAE-0040).
  schema: { $ref: common.yaml#/Money }

NodePreviousReestimatedAmountMax:
  name: previous_reestimated_amount_max
  in: query
  description: >-
    Upper bound, inclusive, of the re-estimated amount at the previous remaining to commit:
    restricts to the lines that carry no more (WF-RAE-0040). Lower than
    `previous_reestimated_amount_min`, refused with 422 `VALUE_OUT_OF_RANGE` on
    `/query/previous_reestimated_amount_max`.
  schema: { $ref: common.yaml#/Money }

NodeStartFrom:
  name: start_from
  in: query
  description: >-
    Start, inclusive, of the period of the start: restricts to the tasks that carry one within
    the period (WF-PLA-0080).
  schema: { $ref: common.yaml#/PlanningDate }

NodeStartTo:
  name: start_to
  in: query
  description: >-
    End, inclusive, of the period of the start: restricts to the tasks that carry one within the
    period; earlier than `start_from`, refused with 422 `VALUE_OUT_OF_RANGE` on
    `/query/start_to` (WF-PLA-0080).
  schema: { $ref: common.yaml#/PlanningDate }

NodeFinishFrom:
  name: finish_from
  in: query
  description: >-
    Start, inclusive, of the period of the finish: restricts to the tasks that carry one within
    the period (WF-PLA-0080, WF-RAE-0040).
  schema: { $ref: common.yaml#/PlanningDate }

NodeFinishTo:
  name: finish_to
  in: query
  description: >-
    End, inclusive, of the period of the finish: restricts to the tasks that carry one within
    the period; earlier than `finish_from`, refused with 422 `VALUE_OUT_OF_RANGE` on
    `/query/finish_to` (WF-PLA-0080, WF-RAE-0040).
  schema: { $ref: common.yaml#/PlanningDate }

NodeStartedOnFrom:
  name: started_on_from
  in: query
  description: >-
    Start, inclusive, of the period of the start date: restricts to the tasks that carry one
    within the period (WF-PLA-0080).
  schema: { $ref: common.yaml#/PlanningDate }

NodeStartedOnTo:
  name: started_on_to
  in: query
  description: >-
    End, inclusive, of the period of the start date: restricts to the tasks that carry one
    within the period; earlier than `started_on_from`, refused with 422 `VALUE_OUT_OF_RANGE` on
    `/query/started_on_to` (WF-PLA-0080).
  schema: { $ref: common.yaml#/PlanningDate }

NodeCompletedOnFrom:
  name: completed_on_from
  in: query
  description: >-
    Start, inclusive, of the period of the completion date: restricts to the tasks that carry one
    within the period (WF-PLA-0080).
  schema: { $ref: common.yaml#/PlanningDate }

NodeCompletedOnTo:
  name: completed_on_to
  in: query
  description: >-
    End, inclusive, of the period of the completion date: restricts to the tasks that carry one
    within the period; earlier than `completed_on_from`, refused with 422 `VALUE_OUT_OF_RANGE` on
    `/query/completed_on_to` (WF-PLA-0080).
  schema: { $ref: common.yaml#/PlanningDate }

NodeMilestoneFilter:
  name: is_milestone
  in: query
  description: >-
    True, restricts to milestones, false to the tasks that are not milestones; absent, does not
    restrict anything (WF-PLA-0080).
  schema: { type: boolean }

NodeFinishOverdueFilter:
  name: finish_overdue
  in: query
  description: >-
    True, restricts to the started tasks whose finish is overdue (`finish_overdue`), false to the
    others; absent, does not restrict anything (WF-RAE-0040).
  schema: { type: boolean }

NodeInactiveObjectFilter:
  name: uses_inactive_object
  in: query
  description: >-
    True, restricts to the lines that use a deactivated reference data object
    (`uses_inactive_object`), false to the others; absent, does not restrict anything (WF-REF-0010).
  schema: { type: boolean }

# The nodes arising from an occurred risk (`Node.origin_risk_id`, #1761), filtered like the others.

NodeIsFromRiskFilter:
  name: is_from_risk
  in: query
  description: >-
    True, restricts to the nodes, tasks and lines, that the occurrence of a risk has merged
    (`origin_risk_id` not null, WF-RIS-0060); false, to the others; absent, does not restrict
    anything. Each node is judged on its own: a task arising from a risk retains its lines
    arising from that risk, not a line created under it since. The ancestors of a retained node
    are returned, as for any filter, and the totals are those of the retained lines
    (WF-IHM-0130). `listNodes` and `compareRevisions` read it likewise.
  schema: { type: boolean }

NodeOriginRiskFilter:
  name: origin_risk_ids
  in: query
  description: >-
    Restricts to the nodes that the occurrence of one of these risks has merged
    (`Node.origin_risk_id`, WF-RIS-0060), their ancestors returned as for any filter. An
    identifier that is not that of an occurred risk of the project is refused with 422
    `VALIDATION_FAILED`, `fields` designating `/query/origin_risk_ids/<n>` with `UNKNOWN_RISK`
    (#1761). `listNodes` and `compareRevisions` read it likewise.
  schema:
    type: array
    minItems: 1
    items: { $ref: common.yaml#/Uuid }
  explode: false

NodeSortBy:
  name: sort_by
  in: query
  description: >-
    Sort column of the estimate lines; absent, plan order. The sort only reorders the lines
    under each task, each among those of its task; the tasks and their subtrees keep the order
    of the tree, and each node its `row_number` (WF-IHM-0060): sorted by descending amount, each
    task returns its lines from the largest amount to the smallest, and the tasks stay in place.
    A number is compared by its value; the label, as text, and the category, the role and the
    subproject, by their label, character by character in Unicode code point order; a line
    without a value — without hours, without a role, without a subproject… — comes after the
    others in ascending order, before them in descending order. Lines with the same value, or
    both without a value, keep plan order; a column of the task alone, from `description` to
    `work_breakdown`, which lines do not have, leaves them all in it. What each operation sorts
    this way, and the grids that offer it, the operation says. A line column that would be
    missing here is a finding on the contract.
  schema: { $ref: schemas/revisions.yaml#/NodeColumn }

UserId:
  name: user_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

AccessRoleId:
  name: access_role_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

OrgNodeId:
  name: org_node_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

ResourceRoleId:
  name: resource_role_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

CalendarId:
  name: calendar_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

CostTypeId:
  name: cost_type_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

CostCategoryId:
  name: cost_category_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

SubprojectId:
  name: subproject_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

RiskId:
  name: risk_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

# The column filters of the risk register (H-01, #1785): each number column by its
# two bounds, the date of the last review by its period (README of the contract; WF-IHM-0130).

RiskProbabilityMin:
  name: probability_min
  in: query
  description: >-
    Restricts to the risks whose probability reaches this bound, inclusive (WF-RIS-0040,
    WF-IHM-0130).
  schema: { $ref: common.yaml#/Percent }

RiskProbabilityMax:
  name: probability_max
  in: query
  description: >-
    Restricts to the risks whose probability does not exceed this bound, inclusive; lower than
    `probability_min`, refused with 422 `VALUE_OUT_OF_RANGE` on `/query/probability_max`.
  schema: { $ref: common.yaml#/Percent }

RiskSeverityMin:
  name: severity_min
  in: query
  description: Restricts to the risks whose severity reaches this bound, inclusive (WF-RIS-0040).
  schema: { $ref: common.yaml#/Money }

RiskSeverityMax:
  name: severity_max
  in: query
  description: >-
    Restricts to the risks whose severity does not exceed this bound, inclusive; lower than
    `severity_min`, refused with 422 `VALUE_OUT_OF_RANGE` on `/query/severity_max`.
  schema: { $ref: common.yaml#/Money }

RiskProvisionAmountMin:
  name: provision_amount_min
  in: query
  description: >-
    Restricts to the risks whose provision (`Risk.provision_amount`) reaches this bound,
    inclusive (WF-RIS-0040).
  schema: { $ref: common.yaml#/Money }

RiskProvisionAmountMax:
  name: provision_amount_max
  in: query
  description: >-
    Restricts to the risks whose provision does not exceed this bound, inclusive; lower than
    `provision_amount_min`, refused with 422 `VALUE_OUT_OF_RANGE` on `/query/provision_amount_max`.
  schema: { $ref: common.yaml#/Money }

RiskOccurrenceCostMin:
  name: occurrence_cost_min
  in: query
  description: >-
    Restricts to the risks whose cost at occurrence reaches this bound, inclusive: occurred
    risks, since another risk has none (`Risk.occurrence_cost`, WF-RIS-0010; #1761).
  schema: { $ref: common.yaml#/Money }

RiskOccurrenceCostMax:
  name: occurrence_cost_max
  in: query
  description: >-
    Restricts to the occurred risks whose cost at occurrence does not exceed this bound,
    inclusive; lower than `occurrence_cost_min`, refused with 422 `VALUE_OUT_OF_RANGE` on
    `/query/occurrence_cost_max`.
  schema: { $ref: common.yaml#/Money }

RiskOccurredReestimatedMin:
  name: occurred_reestimated_amount_min
  in: query
  description: >-
    Restricts to the occurred risks whose re-estimated amount of the lines arising from them
    reaches this bound, inclusive (`Risk.occurred_reestimated_amount`; #1761).
  schema: { $ref: common.yaml#/Money }

RiskOccurredReestimatedMax:
  name: occurred_reestimated_amount_max
  in: query
  description: >-
    Restricts to the occurred risks whose re-estimated amount of the lines arising from them
    does not exceed this bound, inclusive; lower than `occurred_reestimated_amount_min`, refused
    with 422 `VALUE_OUT_OF_RANGE` on `/query/occurred_reestimated_amount_max`.
  schema: { $ref: common.yaml#/Money }

RiskLastReviewOnFrom:
  name: last_review_on_from
  in: query
  description: >-
    Restricts to the risks whose last review (`Risk.last_review_on`) falls on this day or
    after (WF-RIS-0040).
  schema: { $ref: common.yaml#/PlanningDate }

RiskLastReviewOnTo:
  name: last_review_on_to
  in: query
  description: >-
    Restricts to the risks whose last review falls on this day or before, the end included: the
    periodic review uses it to present the risks whose probability has not been
    reviewed since the last marking (WF-RIS-0020). Earlier than `last_review_on_from`,
    refused with 422 `VALUE_OUT_OF_RANGE` on `/query/last_review_on_to`.
  schema: { $ref: common.yaml#/PlanningDate }

RiskRevision:
  name: revision_id
  in: query
  description: >-
    Revision whose risks are read, each one freezing the version of their own estimate,
    of their probability and of their state (WF-RIS-0030); absent, the current revision, or
    the last marked revision when none is current. The provision of an occurred
    risk is the one it had in the reference revision (WF-RIS-0050).
  schema: { $ref: common.yaml#/Uuid }

TimelineId:
  name: timeline_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

ImportId:
  name: import_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

CostLineId:
  name: cost_line_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

BackupId:
  name: backup_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

ChunkedUploadId:
  name: chunked_upload_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

ChunkedUploadPartNumber:
  name: part_number
  in: path
  required: true
  description: The number of the part, starting at 1 (`ChunkedUpload.part_count`).
  schema: { type: integer, minimum: 1 }

ExternalBackupLocationName:
  name: location_name
  in: path
  required: true
  description: The name of an external location that the installation declares.
  schema: { $ref: schemas/platform.yaml#/ExternalBackupLocationName }

TaskId:
  name: task_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

RateYear:
  name: year
  in: path
  required: true
  schema: { $ref: common.yaml#/Year }

IndicatorsRevision:
  name: revision_id
  in: query
  description: >-
    The revision of the calculation, for the project indicators as for the curves: absent, or
    the current revision, the calculation as of the current day — on the current revision, or,
    when the project has none, on its last marked revision with the actual cost of the day
    (WF-IND-0010), `CalculationContext.is_stored` false and `context.revision_id` naming the
    revision of the calculation; a marked revision, the calculation at the date of its marking:
    the indicators and curves that its marking kept (WF-DAT-0040), `is_stored` true, on the
    actual cost lines known at its marking, as they were then — a line imported afterwards does
    not enter it, whatever its document date, and a line updated or excluded afterwards remains
    in it as it was (WF-IND-0010). A revision marked before the In progress state kept only the
    total of its estimate, without any project indicator (WF-DAT-0040): refused with 409,
    `STATE_FORBIDS_OPERATION`. With `as_of`, which already chooses the revision by its date,
    refused with 422, `VALIDATION_FAILED`.
  schema: { $ref: common.yaml#/Uuid }

AsOf:
  name: as_of
  in: query
  description: >-
    Calculation date. Absent, the indicators of the current day: those of the current
    revision, or, when the project has none, those of its last marked revision calculated with
    the actual cost of the day, `is_stored` false (WF-IND-0010); present, those of the last
    marked revision on or before it, as they were kept at its marking
    (WF-IND-0010, WF-DAT-0040, WF-PTF-0010).
  schema: { $ref: common.yaml#/PlanningDate }

Scope:
  name: scope
  in: query
  description: >-
    Calculation scope: the whole project, or a subproject, the "out of any
    subproject" set included (WF-IND-0020). A subproject that the project does not have, or a
    malformed identifier, is refused with 422 `VALIDATION_FAILED`, `fields[]` designating
    `/query/scope` with `UNKNOWN_SUBPROJECT`, like the subproject of the actual costs: no
    empty reading stands in for a refusal.
  schema:
    anyOf:
      - type: string
        enum: [project, unassigned]
      - $ref: common.yaml#/Uuid

WorkloadBasis:
  name: basis
  in: query
  required: true
  description: >-
    Basis of the workload, where the effort of the labour lines is taken: the reference
    revision, a marked revision for its re-estimated effort — named by `revision_id` —, or the
    current revision (WF-DEV-0070). The last two are the basis of the remaining to commit.
  schema: { type: string, enum: [reference_budget, marked_remaining, current_remaining] }

ProjectStates:
  name: states
  in: query
  description: >-
    States retained by the list of projects (`listProjects`): every state named is retained — a
    home page that lists all the projects that can be opened names the six. Absent, the projects
    in progress only. `meta.states` always says the states retained, named or by default.
    Specific to the list: the rule of the portfolio views, which do not count certain states
    (`PortfolioStates`, WF-PTF-0010), does not apply here (the author's decision of 2026-11-01,
    #1747).
  schema:
    type: array
    items: { $ref: schemas/projects.yaml#/ProjectState }
  explode: false

PortfolioStates:
  name: states
  in: query
  description: >-
    States retained in the scope (WF-PTF-0010). By default, the projects in progress. A
    portfolio view retains only the projects in progress, those in pricing that it adds and the
    projects completed in the period: a created, lost or abandoned project that `states` names
    has no effect there, like any state that the view says it does not count (WF-PTF-0010). At a
    past date (`as_of`), a project is retained according to the state it had at that date
    (WF-CYC-0130).
  schema:
    type: array
    items: { $ref: schemas/projects.yaml#/ProjectState }
  explode: false

PortfolioFrom:
  name: from
  in: query
  description: >-
    Start of the period, inclusive, for the completed projects and the period statistics.
    Without `to`, the end is the calculation date (`as_of`, or the current day), that of the default
    period; a start later than it is refused with 422, `/query/from`,
    `params.maximum` the end filled in (`PortfolioPeriodRefused`). Without either, the
    statistics, the quarterly evolution, the cost structure and the S-curve
    retain the default period, the twelve months that end at the calculation date, and the
    list of projects no period; `scope.from` and `scope.to` say the period retained.
  schema: { $ref: common.yaml#/PlanningDate }

PortfolioTo:
  name: to
  in: query
  description: >-
    End of the period, inclusive, a planning date. Earlier than `from`, it is refused with
    422 (`PortfolioPeriodRefused`). Without `from`, the start is that of the default period:
    the calculation date minus twelve months (28 February for a 29 February), then the next day —
    4 June 2025 for 3 June 2026, 1 March 2027 for 29 February 2028; an end that
    is earlier than it is refused likewise, `params.minimum` the start filled in.
  schema: { $ref: common.yaml#/PlanningDate }

PortfolioOrgNode:
  name: org_node_id
  in: query
  description: >-
    Restricts only the labour lines whose role falls under the node — attached to
    it or to one of its descendants; a project belongs to no department
    (WF-PTF-0010).
  schema: { $ref: common.yaml#/Uuid }

# The audit columns of a flat table (WF-DAT-0070), each sorted and filtered (WF-IHM-0060,
# WF-IHM-0130): a period per date column, named after it like the bounds of a
# number column (README, "A period…"), and the author like that of the audit log
# (`user_id`, `actor_kind` of `listAuditEvents`).

CreatedAtFrom:
  name: created_at_from
  in: query
  description: >-
    Start, inclusive, of the creation period: restricts to the rows created at this instant or after
    it (`audit.created_at`, WF-IHM-0130).
  schema: { $ref: common.yaml#/Timestamp }

CreatedAtTo:
  name: created_at_to
  in: query
  description: >-
    End, exclusive, of the creation period: restricts to the rows created before this instant
    (WF-IHM-0130). Earlier than `created_at_from`, it is refused with 422, `fields[]`
    designating `/query/created_at_to` with `VALUE_OUT_OF_RANGE`, `params.minimum` the start given;
    equal, the period is empty.
  schema: { $ref: common.yaml#/Timestamp }

CreatedByUserId:
  name: created_by_user_id
  in: query
  description: >-
    Restricts to the rows created by this account (`audit.created_by.user_id`), deactivated or
    anonymised included: its acts remain attributed to it (WF-ADM-0060, WF-IHM-0130). An
    identifier that designates no account retains nothing.
  schema: { $ref: common.yaml#/Uuid }

CreatedByKind:
  name: created_by_kind
  in: query
  description: >-
    Restricts to the rows created by an account (`user`) or by the platform (`platform`), an
    automatic process (`audit.created_by.kind`, WF-DAT-0070); absent, both.
  schema: { $ref: schemas/audit.yaml#/AuditActorKind }

UpdatedAtFrom:
  name: updated_at_from
  in: query
  description: >-
    Start, inclusive, of the last modification period: restricts to the rows last modified
    at this instant or after it (`audit.updated_at`, WF-IHM-0130).
  schema: { $ref: common.yaml#/Timestamp }

UpdatedAtTo:
  name: updated_at_to
  in: query
  description: >-
    End, exclusive, of the last modification period: restricts to the rows last modified
    before this instant (WF-IHM-0130). Earlier than `updated_at_from`, it is refused with
    422, `fields[]` designating `/query/updated_at_to` with `VALUE_OUT_OF_RANGE`, `params.minimum`
    the start given; equal, the period is empty.
  schema: { $ref: common.yaml#/Timestamp }

UpdatedByUserId:
  name: updated_by_user_id
  in: query
  description: >-
    Restricts to the rows last modified by this account (`audit.updated_by.user_id`), deactivated
    or anonymised included (WF-ADM-0060, WF-IHM-0130). An identifier that designates no account
    retains nothing.
  schema: { $ref: common.yaml#/Uuid }

UpdatedByKind:
  name: updated_by_kind
  in: query
  description: >-
    Restricts to the rows last modified by an account (`user`) or by the platform
    (`platform`) (`audit.updated_by.kind`, WF-DAT-0070); absent, both.
  schema: { $ref: schemas/audit.yaml#/AuditActorKind }
