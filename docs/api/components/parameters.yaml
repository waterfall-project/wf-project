# Paramètres partagés. Tous les identifiants de chemin sont des UUID (WF-DAT-0060).

Limit:
  name: limit
  in: query
  schema: { type: integer, minimum: 1, maximum: 500, default: 50 }

Offset:
  name: offset
  in: query
  schema: { type: integer, minimum: 0, default: 0 }

Search:
  name: search
  in: query
  description: >-
    Recherche sur le libellé ; une opération qui cherche aussi sur un autre champ, le code
    par exemple, le dit dans sa description. Le texte se compare comme toute recherche du
    contrat, sans égard à la casse ni aux accents (README, « Une recherche… »).
  schema: { type: string, minLength: 1, maxLength: 200 }

SortOrder:
  name: sort_order
  in: query
  description: Sens du tri demandé par `sort_by`.
  schema: { $ref: common.yaml#/SortOrder }

SubprojectFilter:
  name: subproject_id
  in: query
  description: '`unassigned` pour ce qui ne relève d''aucun sous-projet (WF-IND-0020, WF-CRE-0020).'
  schema:
    anyOf:
      - type: string
        enum: [unassigned]
      - $ref: common.yaml#/Uuid

IncludeInactive:
  name: include_inactive
  in: query
  description: Inclut les objets désactivés, qui restent lisibles (WF-REF-0150).
  schema: { type: boolean, default: false }

IsActive:
  name: is_active
  in: query
  description: >-
    Restreint à l'un des deux états, la colonne de l'état d'une table du référentiel filtrée
    (WF-IHM-0130) : vrai, les seuls objets actifs ; faux, les seuls désactivés, lus sous la
    permission qu'`include_inactive` exige (WF-REF-0150). Il prime sur `include_inactive`, qui
    ne fait qu'ajouter les désactivés aux actifs ; absent, `include_inactive` décide.
    `include_inactive` reste refusé sans sa permission, même quand `is_active` le rend sans
    effet : la permission se juge sur la requête, non sur ce qu'elle rendrait.
  schema: { type: boolean }

ProjectId:
  name: project_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

RevisionId:
  name: revision_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

StructureId:
  name: structure_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

NodeId:
  name: node_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

RowNumber:
  name: row_number
  in: path
  required: true
  description: >-
    Un numéro de ligne dans la numérotation de toute la structure, à partir de 1, comme
    `Node.row_number` (`resolveRowNumber`).
  schema: { type: integer, minimum: 1 }

NodeFields:
  name: fields
  in: query
  description: >-
    Les propriétés à rendre de chaque nœud (`Node`), en plus de celles toujours rendues ; une
    propriété inconnue est refusée (400). `listNodes` et `compareRevisions` le lisent de même.
  schema:
    type: array
    minItems: 1
    items:
      type: string
      pattern: '^((task|estimate_line)\.)?[a-z_]+$'
  explode: false

# Ce que lit une lecture des nœuds, `listNodes` et `compareRevisions` de même (#1193) : sa
# description dit ce que chacun retient, rend et totalise.

NodeKinds:
  name: kinds
  in: query
  description: Restreint aux tâches ou aux lignes, selon la grille affichée.
  schema:
    type: array
    items: { $ref: schemas/revisions.yaml#/NodeKind }
  explode: false

NodeSubtreeOf:
  name: subtree_of
  in: query
  description: >-
    Restreint au sous-arbre d'une tâche récapitulative, elle comprise
    (WF-PLA-0080, WF-DEV-0050).
  schema: { $ref: common.yaml#/Uuid }

NodeCostTypeFilter:
  name: cost_type_id
  in: query
  description: Restreint aux lignes d'une nature de coût (WF-DEV-0050).
  schema: { $ref: common.yaml#/Uuid }

NodeOrderItemFilter:
  name: order_item_id
  in: query
  description: >-
    Restreint au sous-arbre de la tâche rattachée à ce poste du lotissement, au niveau 2,
    elle comprise (WF-PLA-0170, WF-DEV-0050) ; un poste qu'aucune tâche ne porte ne
    retient rien.
  schema: { $ref: common.yaml#/Uuid }

NodeWorkPackageFilter:
  name: work_package_id
  in: query
  description: >-
    Restreint au sous-arbre de la tâche rattachée à ce lot du lotissement, au niveau 1, elle
    comprise — le filtre par lot des grilles de devis et de reste à engager (WF-DEV-0050,
    WF-RAE-0040, WF-PLA-0170) ; un lot qu'aucune tâche ne porte ne retient rien.
  schema: { $ref: common.yaml#/Uuid }

NodeCostCategoryFilter:
  name: cost_category_id
  in: query
  schema: { $ref: common.yaml#/Uuid }

NodeResourceRoleFilter:
  name: resource_role_id
  in: query
  schema: { $ref: common.yaml#/Uuid }

NodeProgressFilter:
  name: progress
  in: query
  description: >-
    Restreint aux tâches dans l'un de ces états : les tâches démarrées, pour la
    grille de planning (WF-PLA-0080) et la grille de reste à engager, qui ne montre
    par défaut que leurs lignes (WF-RAE-0040).
  schema:
    type: array
    items: { $ref: schemas/revisions.yaml#/TaskProgress }
  explode: false

NodeCriticalFilter:
  name: is_critical
  in: query
  schema: { type: boolean }

NodeSummariesOnly:
  name: summaries_only
  in: query
  description: >-
    Vrai, restreint aux tâches récapitulatives (`is_summary`) : ni feuille ni jalon, que
    l'arborescence de tâches ne représente pas (WF-PLA-0110). Faux ou absent, ne
    restreint rien.
  schema: { type: boolean }

NodeMaxLevel:
  name: max_level
  in: query
  description: >-
    Restreint aux tâches dont le niveau (`level`) ne dépasse pas celui-ci, le premier
    niveau étant celui des tâches sans parent : demandé à 2 avec `summaries_only`, les
    récapitulatives des deux premiers niveaux, sous le nœud du projet (WF-PLA-0110).
    Une ligne est retenue avec la tâche qui la porte, quel que soit son niveau.
  schema: { type: integer, minimum: 1 }

NodeTimelineFilter:
  name: timeline_id
  in: query
  description: >-
    Restreint aux tâches et aux jalons inscrits sur cette chronologie du projet
    (`tracking`, WF-PLA-0140, WF-PLA-0060), sans leurs ancêtres ; une chronologie sans
    inscription, ou qui n'est pas une chronologie du projet, ne retient rien.
  schema: { $ref: common.yaml#/Uuid }

NodeSortBy:
  name: sort_by
  in: query
  description: >-
    Colonne du tri des lignes de devis ; absente, l'ordre du plan. Le tri ne réordonne
    que les lignes sous chaque tâche, chacune parmi celles de sa tâche ; les tâches et
    leurs sous-arbres gardent l'ordre de l'arbre, et chaque nœud son `row_number`
    (WF-IHM-0060) : trié par montant décroissant, chaque tâche rend ses lignes du plus
    grand montant au plus petit, et les tâches restent à leur place. Un nombre se compare
    par sa valeur ; le libellé, en texte, et la catégorie, le rôle et le sous-projet, par
    leur libellé, caractère par caractère dans l'ordre des points de code Unicode ; une
    ligne sans valeur — sans heures, sans rôle, sans sous-projet… — vient après les autres
    dans l'ordre croissant, avant dans le décroissant. Des lignes d'une même valeur, ou
    toutes deux sans valeur, gardent l'ordre du plan ; une colonne de la seule tâche, de
    `description` à `work_breakdown`, que les lignes n'ont pas, les y laisse toutes. Ce
    que chaque opération trie ainsi, et les grilles qui le proposent, l'opération le dit.
    Une colonne de ligne qui manquerait ici est un constat sur le contrat.
  schema: { $ref: schemas/revisions.yaml#/NodeColumn }

UserId:
  name: user_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

AccessRoleId:
  name: access_role_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

OrgNodeId:
  name: org_node_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

ResourceRoleId:
  name: resource_role_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

CalendarId:
  name: calendar_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

CostTypeId:
  name: cost_type_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

CostCategoryId:
  name: cost_category_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

SubprojectId:
  name: subproject_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

RiskId:
  name: risk_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

RiskRevision:
  name: revision_id
  in: query
  description: >-
    Révision dont on lit les risques, chacune figeant la version de leur devis propre,
    de leur probabilité et de leur état (WF-RIS-0030) ; absente, la révision en cours, ou
    la dernière révision marquée quand aucune n'est en cours. La provision d'un risque
    survenu est celle qu'il avait dans la révision de référence (WF-RIS-0050).
  schema: { $ref: common.yaml#/Uuid }

TimelineId:
  name: timeline_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

ImportId:
  name: import_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

CostLineId:
  name: cost_line_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

BackupId:
  name: backup_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

ChunkedUploadId:
  name: chunked_upload_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

ChunkedUploadPartNumber:
  name: part_number
  in: path
  required: true
  description: Le numéro du morceau, à partir de 1 (`ChunkedUpload.part_count`).
  schema: { type: integer, minimum: 1 }

ExternalBackupLocationName:
  name: location_name
  in: path
  required: true
  description: Le nom d'un emplacement externe que l'installation déclare.
  schema: { $ref: schemas/platform.yaml#/ExternalBackupLocationName }

TaskId:
  name: task_id
  in: path
  required: true
  schema: { $ref: common.yaml#/Uuid }

RateYear:
  name: year
  in: path
  required: true
  schema: { $ref: common.yaml#/Year }

IndicatorsRevision:
  name: revision_id
  in: query
  description: >-
    La révision du calcul, pour les indicateurs du projet comme pour les courbes :
    absente, ou la révision en cours, le calcul au jour courant ; une révision marquée,
    le calcul à la date de son marquage. Les indicateurs sont alors ceux que son marquage
    a conservés (WF-DAT-0040), `CalculationContext.is_stored` vrai ; les courbes, que rien
    ne conserve, sont recalculées à cette date, `is_stored` faux, sur les lignes de coût réel
    connues aujourd'hui dont la date de pièce lui est antérieure ou égale (WF-IND-0010) : une
    pièce datée d'avant le marquage mais importée après compte dans la courbe et non dans les
    indicateurs conservés, et l'écran peut les montrer divergents — c'est ce que `is_stored`
    signale, WF-DAT-0040 ne conservant que les indicateurs. Une révision marquée
    avant l'état En cours n'a conservé que le total de son devis, sans aucun indicateur
    projet (WF-DAT-0040) : refusée par 409, `STATE_FORBIDS_OPERATION`. Avec `as_of`, qui
    choisit déjà la révision par sa date, refusée par 422, `VALIDATION_FAILED`.
  schema: { $ref: common.yaml#/Uuid }

AsOf:
  name: as_of
  in: query
  description: >-
    Date de calcul. Absente, les indicateurs sont ceux de la révision en cours au
    jour courant ; présente, ceux de la dernière révision marquée antérieure, tels
    qu'ils ont été conservés à son marquage (WF-IND-0010, WF-DAT-0040, WF-PTF-0010).
  schema: { $ref: common.yaml#/PlanningDate }

Scope:
  name: scope
  in: query
  description: >-
    Maille de calcul : le projet entier, ou un sous-projet, l'ensemble « hors
    sous-projet » compris (WF-IND-0020). Un sous-projet que le projet n'a pas, ou un
    identifiant mal formé, est refusé par 422 `VALIDATION_FAILED`, `fields[]` désignant
    `/query/scope` par `UNKNOWN_SUBPROJECT`, comme le sous-projet des coûts réels : aucune
    lecture nulle ne tient lieu de refus.
  schema:
    anyOf:
      - type: string
        enum: [project, unassigned]
      - $ref: common.yaml#/Uuid

WorkloadBasis:
  name: basis
  in: query
  required: true
  description: >-
    Base du plan de charge : les montants budgétés de la révision de référence, les
    montants réestimés d'une révision marquée — nommée par `revision_id` —, ou ceux de la
    révision en cours (WF-DEV-0070).
  schema: { type: string, enum: [reference_budget, marked_remaining, current_remaining] }

PortfolioStates:
  name: states
  in: query
  description: États retenus dans le périmètre (WF-PTF-0010). Par défaut, les projets en cours.
  schema:
    type: array
    items: { $ref: schemas/projects.yaml#/ProjectState }
  explode: false

PortfolioFrom:
  name: from
  in: query
  description: >-
    Début de la période, inclus, pour les projets terminés et les statistiques de période.
    Sans `to`, la fin est la date de calcul (`as_of`, ou le jour courant), celle de la période
    par défaut ; un début qui lui est postérieur est refusé par 422, `/query/from`,
    `params.maximum` la fin complétée (`PortfolioPeriodRefused`). Sans l'une ni l'autre, les
    statistiques retiennent les douze mois qui finissent à la date de calcul, et la liste des
    projets aucune période ; `scope.from` et `scope.to` disent la période retenue.
  schema: { $ref: common.yaml#/PlanningDate }

PortfolioTo:
  name: to
  in: query
  description: >-
    Fin de la période, incluse, une date de planning. Antérieure à `from`, elle est refusée par
    422 (`PortfolioPeriodRefused`). Sans `from`, le début est celui de la période par défaut :
    la date de calcul moins douze mois (le 28 février pour un 29 février), puis le lendemain —
    le 4 juin 2025 pour le 3 juin 2026, le 1er mars 2027 pour le 29 février 2028 ; une fin qui
    lui est antérieure est refusée de même, `params.minimum` le début complété.
  schema: { $ref: common.yaml#/PlanningDate }

PortfolioOrgNode:
  name: org_node_id
  in: query
  description: >-
    Restreint les seules lignes de main-d'œuvre dont le rôle relève du nœud — rattaché à
    lui ou à l'un de ses descendants ; un projet n'appartient à aucun service
    (WF-PTF-0010).
  schema: { $ref: common.yaml#/Uuid }

# Les colonnes d'audit d'une table plate (WF-DAT-0070), chacune triée et filtrée (WF-IHM-0060,
# WF-IHM-0130) : une période par colonne de date, nommée d'après elle comme les bornes d'une
# colonne de nombres (README, « Une période… »), et l'auteur comme celui du journal d'audit
# (`user_id`, `actor_kind` de `listAuditEvents`).

CreatedAtFrom:
  name: created_at_from
  in: query
  description: >-
    Début, inclus, de la période de création : restreint aux lignes créées à cet instant ou après
    lui (`audit.created_at`, WF-IHM-0130).
  schema: { $ref: common.yaml#/Timestamp }

CreatedAtTo:
  name: created_at_to
  in: query
  description: >-
    Fin, exclue, de la période de création : restreint aux lignes créées avant cet instant
    (WF-IHM-0130). Antérieure à `created_at_from`, elle est refusée par 422, `fields[]`
    désignant `/query/created_at_to` par `VALUE_OUT_OF_RANGE`, `params.minimum` le début donné ;
    égale, la période est vide.
  schema: { $ref: common.yaml#/Timestamp }

CreatedByUserId:
  name: created_by_user_id
  in: query
  description: >-
    Restreint aux lignes créées par ce compte (`audit.created_by.user_id`), désactivé ou anonymisé
    compris : ses actes lui restent attribués (WF-ADM-0060, WF-IHM-0130). Un identifiant qui ne
    désigne aucun compte ne retient rien.
  schema: { $ref: common.yaml#/Uuid }

CreatedByKind:
  name: created_by_kind
  in: query
  description: >-
    Restreint aux lignes créées par un compte (`user`) ou par la plateforme (`platform`), un
    traitement automatique (`audit.created_by.kind`, WF-DAT-0070) ; absent, les deux.
  schema: { $ref: schemas/audit.yaml#/AuditActorKind }

UpdatedAtFrom:
  name: updated_at_from
  in: query
  description: >-
    Début, inclus, de la période de dernière modification : restreint aux lignes modifiées en
    dernier à cet instant ou après lui (`audit.updated_at`, WF-IHM-0130).
  schema: { $ref: common.yaml#/Timestamp }

UpdatedAtTo:
  name: updated_at_to
  in: query
  description: >-
    Fin, exclue, de la période de dernière modification : restreint aux lignes modifiées en
    dernier avant cet instant (WF-IHM-0130). Antérieure à `updated_at_from`, elle est refusée par
    422, `fields[]` désignant `/query/updated_at_to` par `VALUE_OUT_OF_RANGE`, `params.minimum`
    le début donné ; égale, la période est vide.
  schema: { $ref: common.yaml#/Timestamp }

UpdatedByUserId:
  name: updated_by_user_id
  in: query
  description: >-
    Restreint aux lignes modifiées en dernier par ce compte (`audit.updated_by.user_id`), désactivé
    ou anonymisé compris (WF-ADM-0060, WF-IHM-0130). Un identifiant qui ne désigne aucun compte ne
    retient rien.
  schema: { $ref: common.yaml#/Uuid }

UpdatedByKind:
  name: updated_by_kind
  in: query
  description: >-
    Restreint aux lignes modifiées en dernier par un compte (`user`) ou par la plateforme
    (`platform`) (`audit.updated_by.kind`, WF-DAT-0070) ; absent, les deux.
  schema: { $ref: schemas/audit.yaml#/AuditActorKind }
