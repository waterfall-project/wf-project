NodePaymentDelayMax:
  name: payment_delay_days_max
  in: query
  description: >-
    Borne supérieure, incluse, du délai de paiement, en jours : restreint aux lignes qui n'en
    portent pas plus (WF-DEV-0050). Inférieure à `payment_delay_days_min`, refusée par 422
    `VALUE_OUT_OF_RANGE` sur `/query/payment_delay_days_max`.
  schema: { type: integer, minimum: 0 }

NodeConsumptionYearMin:
  name: consumption_year_min
  in: query
  description: >-
    Borne inférieure, incluse, de l'année de consommation : restreint aux lignes qui en portent au
    moins autant (WF-DEV-0040).
  schema: { $ref: common.yaml#/Year }

NodeConsumptionYearMax:
  name: consumption_year_max
  in: query
  description: >-
    Borne supérieure, incluse, de l'année de consommation : restreint aux lignes qui n'en portent
    pas plus (WF-DEV-0040). Inférieure à `consumption_year_min`, refusée par 422
    `VALUE_OUT_OF_RANGE` sur `/query/consumption_year_max`.
  schema: { $ref: common.yaml#/Year }

NodeBaseAmountMin:
  name: base_amount_min
  in: query
  description: >-
    Borne inférieure, incluse, du montant aux taux de l'année de référence, avant inflation :
    restreint aux lignes qui en portent au moins autant (WF-DEV-0050).
  schema: { $ref: common.yaml#/Money }

NodeBaseAmountMax:
  name: base_amount_max
  in: query
  description: >-
    Borne supérieure, incluse, du montant aux taux de l'année de référence, avant inflation :
    restreint aux lignes qui n'en portent pas plus (WF-DEV-0050). Inférieure à `base_amount_min`,
    refusée par 422 `VALUE_OUT_OF_RANGE` sur `/query/base_amount_max`.
  schema: { $ref: common.yaml#/Money }

NodeBudgetedAmountMin:
  name: budgeted_amount_min
  in: query
  description: >-
    Borne inférieure, incluse, du montant budgété, inflation comprise : restreint aux lignes qui en
    portent au moins autant (WF-RAE-0040).
  schema: { $ref: common.yaml#/Money }

NodeBudgetedAmountMax:
  name: budgeted_amount_max
  in: query
  description: >-
    Borne supérieure, incluse, du montant budgété, inflation comprise : restreint aux lignes qui
