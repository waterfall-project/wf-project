# Elementary types and common envelopes.
# Conventions: snake_case, UUID as identifier (WF-DAT-0060), exact decimals
# carried as strings (WF-DAT-0100), planning dates without time and
# timestamps in universal time (WF-DAT-0100, WF-INTF-0180).

Uuid:
  type: string
  format: uuid
  description: Identifier generated by the server, ordered in time (WF-DAT-0060).

Decimal:
  type: string
  pattern: '^-?\d+(\.\d+)?$'
  description: >-
    Exact decimal, never a float (WF-DAT-0100). The separator is the point,
    regardless of the interface language (WF-INTF-0180).

Money:
  allOf:
    - $ref: '#/Decimal'
  pattern: '^-?\d+(\.\d{1,2})?$'
  description: Amount in the installation's single currency (WF-REF-0140), with two decimals.

Hours:
  allOf:
    - $ref: '#/Decimal'
  description: Number of hours, exact decimal.

Percent:
  allOf:
    - $ref: '#/Decimal'
  description: >-
    Percentage, exact decimal, not rounded before calculations (WF-DAT-0100), carried as a ratio
    and never as a number of percent: `0.03` for 3 %, `1` for 100 %. A lag entered in percent of
    the duration of a predecessor is not a `Percent`: it counts percents, `50` for half
    (`Lag.value`, WF-PLA-0160).

PlanningDate:
  type: string
  format: date
  description: Date without time, in ISO 8601 (WF-DAT-0100).

Timestamp:
  type: string
  format: date-time
  description: Timestamp in universal time (WF-DAT-0100).

WorkInstant:
  type: object
  required: [date, hours]
  description: >-
    Start or finish of a task: a date without time and the number of working hours
    elapsed that day on the applicable calendar, without time zone (WF-DAT-0100). Two
    four-hour tasks linked finish-to-start, on an eight-hour calendar, start and
    finish on the same day: the first finishes at `4`, the second starts
    at `4` and finishes at `8`.
  properties:
    date: { $ref: '#/PlanningDate' }
    hours: { $ref: '#/Hours' }

WorkInstantWrite:
  type: object
  required: [date]
  description: >-
    Start or finish of a task as entered, at creation as at modification (`TaskFacetWrite`,
    `TaskFacetUpdate`, WF-PLA-0020; #1769): the date, and
    optionally the working hours elapsed that day (WF-DAT-0100). The client does not
    know the applicable calendar (WF-PLA-0010): without `hours`, the server fills
    them in from that calendar, the start at the beginning of its day (`0`), the finish at the
    end of the hours the calendar grants that day — `8` on a Friday of an eight-hour
    calendar. A date on a day with no working hour at all on the applicable calendar is
    refused, and the refusal names the next working day; nothing is written (WF-PLA-0020;
    #1271): 422 `VALIDATION_FAILED`, `fields` on `/start/date` or `/finish/date` with
    `NON_WORKING_DAY` — `/task/start/date` or `/task/finish/date` at creation —,
    `fields[].params.date` the date sent and `next_working_day` the next
    working day; hours sent with it are not judged. Sent with a working
    day, the hours are taken as they are, never clamped: outside `0` to the hours
    the calendar grants that day, they are refused with 422 `VALIDATION_FAILED`,
    `fields` on `/start/hours` or `/finish/hours` with `VALUE_OUT_OF_RANGE` —
    `/task/start/hours` or `/task/finish/hours` at creation —,
    `fields[].params.minimum` at `0` or `maximum` at the hours of the day, the only bound crossed,
    never zero. Reading always returns a `WorkInstant`, its hours filled in; a date
    imported from an MS Project file on a non-working day is kept there, the start and finish at
    `0`, and the report flags it (`ImportReport.signals`).
  properties:
    date: { $ref: '#/PlanningDate' }
    hours: { $ref: '#/Hours' }

Language:
  type: string
  enum: [fr, en]
  description: Language offered by the interface (WF-INTF-0160).

Year:
  type: integer
  minimum: 2000
  maximum: 2100

LockVersion:
  type: integer
  minimum: 0
  description: >-
    Write counter of the object. Every modification carries it and requires it, a
    creation has none; a stale value is refused with 412, which makes
    undo safe with several contributors (WF-IHM-0110, WF-PRJ-0060). It follows
    the user's writes: what the server recalculates without anyone writing
    it — the dates of the successors of a link or of a duration, what the critical
    path moves, the amounts and dates of a summary task, the amounts, inflation
    included, of the lines and tasks that a write moves from one year to another — does not
    advance the counter of any node.

Audit:
  type: object
  required: [created_at, created_by, updated_at, updated_by]
  description: Audit columns of WF-DAT-0070. `platform` denotes an automatic process.
  properties:
    created_at: { $ref: '#/Timestamp' }
    created_by: { $ref: '#/ActorRef' }
    updated_at: { $ref: '#/Timestamp' }
    updated_by: { $ref: '#/ActorRef' }

ActorRef:
  type: object
  required: [kind]
  description: >-
    The author of a write: an account, by its identifier and its display name, both
    required for `user` (WF-DAT-0070, WF-ADM-0060), or the platform, which has neither.
  if:
    properties: { kind: { const: user } }
  then:
    required: [kind, user_id, display_name]
    properties:
      kind: { const: user }
      user_id: { $ref: '#/Uuid' }
      display_name: { anyOf: [{ type: string }, { type: 'null' }] }
  properties:
    kind:
      type: string
      enum: [user, platform]
    user_id: { $ref: '#/Uuid' }
    display_name:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Display name of the account, kept after its deactivation (WF-ADM-0060); null for an
        anonymised account, which the front presents under the neutral label of its catalogue, the
        API returning no sentence (WF-ADM-0060, WF-ARC-0110). Absent for the platform.

Problem:
  type: object
  required: [code, status]
  description: >-
    Single envelope of refusals and errors. It carries no sentence
    meant to be read: `code` and `params` are enough for the front to render the
    text in the reader's language (WF-ARC-0110). `params` names the missing
    condition, as WF-ADM-0110 and WF-IHM-0090 require.
  properties:
    code: { $ref: '#/ErrorCode' }
    status:
      type: integer
      minimum: 400
      maximum: 599
    params:
      allOf: [{ $ref: '#/ProblemParams' }]
      description: >-
        Parameters of the code, as the case may be — those that several refusals share are typed
        by `ProblemParams`, the others remain open: `missing_permission` (a `PermissionCode`),
        `missing_condition` (a `CommandCondition`), `conflicting_object_id` and
        `conflicting_object_label` (the object, and its label, that a later modification has
        taken up and that an undo or a redo would undo, `UNDO_CONFLICT`, WF-IHM-0110),
        `missing_rates` (the labour categories without an hourly rate for the reference year,
        `HOURLY_RATE_MISSING`, WF-DEV-0010), `expected_lock_version` (the current version of the
        object, the only parameter of a 412 `STALE_LOCK_VERSION`, WF-IHM-0110),
        `subordinate_node_ids` (the direct subordinates of a summary task,
        `SUMMARY_TASK_DERIVED`, WF-IHM-0030, WF-PLA-0040), `field` (a field the server does not
        calculate for the node whose dependencies are requested, WF-IHM-0030),
        `missing_prerequisites` (WF-CYC-0120), `state` and `state_enum` (the state of the object
        that forbids the operation, `STATE_FORBIDS_OPERATION`, and the name of the contract
        enumeration of which it is a value, which always travel together — one is never returned
        without the other: only `ProjectState` falls under it today — the state of a project
        that has not reached the In progress state, whose indicators are requested
        (WF-IND-0010), or without a reference revision, whose workload is requested on a basis
        it does not have (WF-DEV-0070); a new enumeration is a modification of the contract),
        `max_columns` (paste too wide, WF-IHM-0050), `minimum` (the smallest allowed value of a
        value too small, `VALUE_OUT_OF_RANGE`; in `fields[].params` for a field, such as the
        retention of the external copy of backups, at least that of the platform, WF-EXP-0050,
        the retention of backups, at least `1`, the interval between two reviews, at least `1`
        week, the win probability and the inflation rate of a project, at least `0`, the hours
        of a day of a calendar and the capacity of a role, at least `0`, the payment delay of a
        line, at least `0`, the level of a tree snapshot, at least `1`, the day of a weekly
        backup, at least `1`, the hours of a work instant sent (`/start/hours`, `/finish/hours`
        of `updateTaskFacet`), at least `0`, or the width of a column of the grid preferences,
        at least `20`), `maximum` (the largest allowed value of a value too large,
        `VALUE_OUT_OF_RANGE`, in `fields[].params`: such as the start of a portfolio period
        later than the end the server filled in, the win probability and the inflation rate of a
        project, at most `1`, the retention of backups, at most `365`, the interval between two
        reviews, at most `104` weeks, the hours of a day of a calendar, at most `24`, the hours
        of a work instant sent (`/start/hours`, `/finish/hours` of `updateTaskFacet`), at most
        the hours the task's calendar grants that day, never `0` — a day without a working hour
        is refused by its date, `NON_WORKING_DAY` (#1244, #1271) —, or the day of a weekly
        backup, at most `7`), `component` (a `PlatformComponent`, WF-EXP-0040),
        `expected_format` (an `ExchangeKind`) and `expected_version` (a string) for an import
        file whose format or version is not recognised (`FILE_FORMAT_UNREADABLE`, WF-INTF-0070)
        — absent for an uploaded backup whose archive cannot be read (`uploadFile`,
        WF-ADM-0160), and `expected_version` absent for an actual cost extraction, which has no
        version (`expected_format` at `actual_costs`) —; `missing_columns` for an actual cost
        extraction that lacks a required column (`FILE_FORMAT_UNREADABLE`, `openImport`,
        WF-REF-0190): each required column that the file does not carry under any of its labels,
        in the order of the mapping, by its identifier (`column`, an `ActualCostSourceColumn`)
        and the labels the mapping declares for it (`labels`); `columns` when
        `missing_condition` names `actual_cost_mapping_complete` (`STATE_FORBIDS_OPERATION`,
        `openImport`, WF-REF-0190): the required columns of the mapping that have no label, each
        by its identifier (`ActualCostSourceColumn`), in the order of the mapping;
        `resource_roles` for any refusal that would leave a task without a working hour
        (`TASK_WITHOUT_WORKING_HOURS`, WF-PLA-0010) — a write to the reference data or to a
        revision, a pasted or imported line, a merge —: the roles whose calendars never overlap
        — that role alone when, on a task of which that role is the only one, it has no hour in
        the week (EP-14/L42s); none when it is the default calendar of a task without a labour
        line that has no hour left —, active or deactivated, each by its identifier, its code
        and its label (`resource_role_id`, `code`, `label`), so that the refusal reads without
        rereading the roles, from the planning as from the grid, and without
        `resource_settings.read` (#768, point 1; #1684); `resource_roles` when
        `missing_condition` names `cost_type_without_role` or `cost_category_without_role`
        (`STATE_FORBIDS_OPERATION`, WF-REF-0030, WF-REF-0040): all the roles involved, active or
        deactivated, each by its identifier, its code and its label (`resource_role_id`, `code`,
        `label`) — the cost settings screen does not read deactivated roles —, to be attached
        first to a labour category outside the refused category, or cost type (WF-IHM-0090);
        `cost_categories` when `missing_condition` names `cost_type_unused` or
        `cost_type_unrated` (`updateCostType`, WF-REF-0030): all the categories of the cost type
        in use for `cost_type_unused`, all those that carry an hourly rate for
        `cost_type_unrated`, active or deactivated, each by its identifier, its code and its
        label (`cost_category_id`, `code`, `label`), in the order of their code — to be attached
        first to another cost type of the same kind (WF-IHM-0090; EP-14/L42s); `tasks` for an
        entry in a revision — `createNode`, `updateEstimateLine`, `moveNodes`,
        `mergeCostStructure`, and the reason of a pasted or imported line — that would leave a
        task without a working hour (`TASK_WITHOUT_WORKING_HOURS`): the tasks involved, each by
        its project, its node and its label (`project_id`, `node_id`, `label`), the author of
        the entry consulting their project — in the reason of an imported line, by its lineage
        and its label (`lineage_id`, `label`), as the report names its objects (#768, point 2);
        `projects` for a modification of the reference data that would produce the same effect
        (`updateCalendar`, `setDefaultCalendar`, `updateResourceRole`), one element per project
        involved, by its label and its code (`project_label`, `project_code`, null for a project
        without a code), without identifier or task — "without further detail", since the author
        may not consult the project (WF-PLA-0010, WF-ADM-0110); `estimate_lines` for the
        deletion of a subproject that estimate lines of the current revision carry
        (`STATE_FORBIDS_OPERATION`, `missing_condition` at `subproject_without_estimate_lines`,
        WF-DAT-0080): those lines, each by its structure, the label of that structure, its node,
        its row number and its label (`structure_id`, `structure_label`, `node_id`,
        `row_number`, `label`); `work_package_task` and `order_item_tasks` for a merge that
        would take the task of an order item out of the subtree of the task of its work package
        (`ORDER_ITEM_OUTSIDE_WORK_PACKAGE`, `mergeCostStructure`, WF-PLA-0170) : the task of the
        work package and those of the order items that would leave it, nodes of the main
        structure, each by its node and its label (`node_id`, `label`), like the tasks of
        `TASK_WITHOUT_WORKING_HOURS` — "the failure names what failed" (WF-IHM-0080; EP-14/L42k)
        —, and likewise for the import file that would be rejected whole for this reason
        (`ImportReport.refusals`) and the preliminary report of a merge
        (`StructureMergeReport.refusals`; EP-14/L42s); `task` for a planning that would extend
        the project's duration beyond fifteen years (`PROJECT_HORIZON_EXCEEDED`, WF-PLA-0150):
        the task involved, by its node and its label (`node_id`, `label`), the node null for a
        task that the file or the differential creates; for a merge (`mergeCostStructure`,
        `StructureMergeReport.refusals`; #788), the task of the merged structure that finishes
        last, excluding summary tasks, which draw their dates from their subordinates
        (WF-PLA-0040), the first in plan order in case of a tie — and, for an entry that moves a
        date (`updateTaskFacet`, `setPredecessors`, `createNode`, `moveNodes`; EP-15/US-0460),
        the task the entry writes: the one whose duration, dates or predecessors are entered,
        the one the creation would add, named by the label sent and its node null, the moved
        task or the one that receives the moved line; `cycle` for predecessors that would close
        a loop of links (`LINK_CYCLE`, `setPredecessors`, WF-PLA-0030): the tasks of the loop,
        each by its node and its label (`node_id`, `label`), from the one whose predecessors are
        being entered to the predecessor sent that already follows it, each preceding the next —
        "the reason is named to the user", since the grid, filtered, may not read them; when
        several predecessors sent close a loop, the shortest is returned, then, at equal length,
        the first in the order of the links, and a task given as its own predecessor returns the
        loop of that single task; and for a move or an indent that would close a loop through
        the summary task that would receive the node (`moveNodes`, WF-PLA-0030, WF-PLA-0040;
        #1164, #1167) — a summary task covers its subordinates: what precedes it precedes them,
        what follows it follows them —, the tasks of the chain of links that leads from that
        summary task, or from one of its ancestors, to the task it would receive or to one of
        its subordinates, or from these to the former, each preceding the next: the shortest,
        then, at equal length, the one that starts from the nearest ancestor, then from the
        received task and its subordinates in plan order; for a selection, judged on the
        structure the move would leave, all its nodes moved, the loop closed by the first node
        involved in the plan order of the structure read — not in that of `node_ids`, which only
        governs their placement (`NodeMove`; #1169); and for a merge that would close a loop in
        the main structure (`mergeCostStructure`, `StructureMergeReport.refusals`, WF-PLA-0030,
        WF-REV-0050; #788), the tasks of the loop that the merged structure would carry, each by
        its node in the main structure and its label, the node null for a task that the
        differential adds, from the first in the plan order of that structure to the one that
        precedes it, each preceding the next — the shortest when there are several, then the one
        whose first task comes first in plan order. A chain of a single link is the link between
        a summary task and its subordinate: `LINK_FORBIDDEN`, without parameter for an entry or
        a move; for a merge that would give rise to such a link (`mergeCostStructure`,
        `StructureMergeReport.refusals`, WF-PLA-0030; #1582), `link` names the two tasks, the
        summary task first, each by its node in the main structure and its label, the node null
        for a task that the differential adds — `tasks` does not fit, as it requires a project
        and a node. A chain, for a move as for predecessors, follows the links and crosses the
        hierarchy, a summary task covering its subordinates: from a task reached at its start to
        one of its subordinates, which what precedes it precedes, and from a task to its summary
        task, which what follows it follows; it names each task it crosses, the summary task and
        the subordinate — a loop P → W, W summary task of a task Z that precedes M, M moved
        under P, names P, W, Z and M (#1169). Between two equally short chains, the one returned
        takes, at each task, its links before the hierarchy, and its subordinates before its
        summary task. The parameters of a per-field reason are in `fields[].params`: such as
        `conflicting_object_id` and `conflicting_object_label`, the node and the label of the
        task that already carries the work package or the order item another one would carry
        (`WORK_BREAKDOWN_ITEM_ALREADY_ATTACHED`, WF-PLA-0170; EP-14/L42k); `work_package_task`
        and `order_item_tasks`, the task of the work package and those of its order items that
        would leave its subtree, each by its node and its label (`node_id`, `label`), like the
        failure of a merge (`ORDER_ITEM_OUTSIDE_WORK_PACKAGE`, `updateTaskFacet`, `createNode`,
        `moveNodes`, WF-PLA-0170; EP-14/L42s) — the node null for the task that `createNode`
        creates, named by the label sent, and the same parameters in the reason of a pasted
        `work_breakdown` cell (`PasteRejection.params`); `task_node_id`, in `fields[].params`,
        the task that a re-estimation would complete without its completion date
        (`COMPLETION_DATE_REQUIRED`, WF-RAE-0040); `subproject`, in `fields[].params`, the
        subproject that a line of a started or completed task cannot leave, because it has
        received actual costs, by its identifier and its label (`subproject_id`, `label`;
        `SUBPROJECT_HAS_ACTUAL_COSTS`, WF-PRJ-0050), and the same parameter in the reason of a
        pasted subproject cell (`PasteRejection.params`) or of a rejected import line
        (`ImportRejection.params`, WF-INTF-0100, WF-INTF-0120); `location`, the external backup
        location that the installation does not declare (`UNKNOWN_EXTERNAL_BACKUP_LOCATION`,
        WF-ADM-0170); `conflicting_object_id`, in `fields[].params`, the object that already
        carries the unique value of a field (`ALREADY_EXISTS`, WF-REF-0030, WF-REF-0040), and
        `conflicting_object_label`, next to it, its label, when the form does not know the list
        that carries it: the code of a project (WF-PRJ-0010), that of a subproject
        (WF-PRJ-0050), that of an organisation node (WF-REF-0070) and that of a resource role
        (WF-REF-0090); `backup_version` and `installed_version`, in `params`, the version of the
        application that took the backup and that of the installation that refuses to restore it
        (`BACKUP_FROM_NEWER_VERSION`, reason for the failure of the `restore` task,
        WF-ADM-0160); `risk`, in `fields[].params`, the risk to which a provision line moved in
        the grid belongs, by its identifier and its label (`risk_id`, `label`;
        `PROVISION_LINE_MOVED_BY_RISK`, `moveNodes`, WF-RIS-0010, #1227): the line is moved
        through the risk's form; `date` and `next_working_day`, in `fields[].params`, the date
        of a manual task sent on a day with no working hour at all on the task's calendar, and
        the next working day, which the entry can take — "the refusal names the next working
        day" (`NON_WORKING_DAY`, `updateTaskFacet`, WF-PLA-0020; #1271) —, and the same
        parameters in the signal of such an imported date (`ImportSignal.params`);
        `missing_parts`, the numbers, as an array of integers, of the parts that a chunked
        upload has not received (`completeChunkedUpload`, `STATE_FORBIDS_OPERATION`,
        WF-ADM-0160); `max_length`, in `fields[].params`, which accompanies every
        `VALUE_TOO_LONG`: the bound of the refused field, the largest number of characters a
        text allows (`maxLength`) or of elements a list allows (`maxItems`) — `50` for the code
        of a project, `31` for that of a subproject (WF-PRJ-0010, WF-PRJ-0050; J-02, #1796) —,
        and `forbidden_characters` or `reserved_name`, those of `SUBPROJECT_CODE_INVALID` — and
        `forbidden_characters`, of `PROJECT_CODE_INVALID`, `["/"]` (`createProject`,
        `updateProject`, WF-PRJ-0010; D-07, US-0701/L9) —: the forbidden characters the code
        carries, as an array, each once in the order in which it carries them, or the reserved
        name it equals, "Synthèse" or "Hors sous-projet", as Waterfall writes it
        (`createSubproject`, `updateSubproject`, WF-PRJ-0050; EP-16/US-0610); `duplicate_of`, in
        `fields[].params`, the pointer of the label that a label of the mapping of the actual
        cost extraction duplicates (`DUPLICATE_COLUMN_LABEL`, `setActualCostMapping`,
        WF-REF-0190; EP-16/US-0620); `rows`, the row numbers, as an array of integers, of the
        other lines of the file that carry the same document and the same item as a rejected
        line of an actual cost extraction (`DUPLICATE_COST_LINE`, `ImportRejection.params`,
        WF-INTF-0140; EP-16/US-0630); `wbs_element`, the WBS element of a rejected line of an
        actual cost extraction, as the file carries it, and `project_code`, the project code it
        carries when it is that of another project (`WBS_ELEMENT_INVALID`,
        `WBS_ELEMENT_OUTSIDE_PROJECT`, `ImportRejection.params`, WF-CRE-0020); `value`, the
        value of the cell as the file carries it, of a line of an estimate or of a remaining to
        commit that cites an unknown task, role or subproject (`UNKNOWN_TASK`,
        `UNKNOWN_RESOURCE_ROLE`, `UNKNOWN_SUBPROJECT`, `ImportRejection.params`, WF-INTF-0100);
        `label`, the label of a task that several tasks carry, with `tasks` those that carry it
        (`AMBIGUOUS_TASK_LABEL`, `ImportRejection.params`, annex B); `start` and `finish`, the
        dates that an MS Project planning gives to a summary task in manual mode, imported in
        automatic mode (`SUMMARY_TASK_DERIVED`, `ImportSignal.params`, WF-INTF-0040).
    fields:
      type: array
      description: >-
        Per-field errors, for an entity refused at validation (422), or by a uniqueness
        constraint (409 `ALREADY_EXISTS`), each field whose value is already carried being
        designated. A key carried by the path, and not by the body — the category and the year
        of an hourly rate (`setHourlyRate`) —, has no field to designate: its `ALREADY_EXISTS`
        has no `fields`.
      items: { $ref: '#/FieldProblem' }
    correlation_id:
      type: string
      pattern: '^[A-Za-z0-9._-]{1,64}$'
      description: >-
        Correlation identifier of the request, repeated in the logs (WF-OBS-0020):
        generated by the platform, never empty, and made of these characters only — an identifier
        taken from an incoming header that does not respect them is replaced, not passed on. The
        front displays it as the reference of an unexpected error, and may put it as is
        in a path or a digest.

StateEnumeration:
  type: string
  enum: [ProjectState]
  description: >-
    The name of the contract enumeration of which `Problem.params.state` is a value, returned with
    it, so that the front names the state through its own catalogue (WF-ARC-0110). An
    additional enumeration that a refusal would name is a modification of the contract.

ErrorCode:
  type: string
  description: >-
    Catalogue of error codes: every refusal the API can raise, and every
    reason for rejecting a pasted or imported line, has its code there, which the front renders
    as a sentence through its own catalogue of texts (WF-ARC-0110). A new code is
    a modification of the contract; the front meets none that it cannot
    render. The parameters a code carries are named by `Problem.params`.
  enum:
    # 400 — malformed request or missing confirmation: `confirmed` absent or false for an
    # irreversible operation, the restore (`startRestore`) as well as the exit from the life cycle
    # (`exitProject`; D-03, US-0702/L2).
    - MALFORMED_REQUEST
    - CONFIRMATION_REQUIRED
    # 401 — no valid token (WF-SEC-0020); or account deactivated (WF-ADM-0060), or one that
    # Waterfall does not admit, which the front tells apart from a missing token so as not to
    # send back to a login that would loop. An expired token is `SESSION_EXPIRED`; a token from
    # a login earlier than the last closing of the account's sessions, `SESSION_REVOKED`, on
    # which alone the front asks for the credentials again (#855).
    - SESSION_REQUIRED
    - SESSION_EXPIRED
    - SESSION_REVOKED
    - ACCOUNT_DEACTIVATED
    - ACCOUNT_NOT_ADMITTED
    # 403 — the write is not permitted to the caller: a permission they lack,
    # `params.missing_permission` naming it, or their standing on the project,
    # `params.missing_condition` naming it — `is_contributor` for someone who is not a
    # contributor, `is_project_manager` for someone who is only a contributor, a structuring
    # action or the project's settings requiring the standing of project manager (WF-ADM-0110,
    # WF-PRJ-0060, WF-IHM-0090). A state is never a 403: a terminal project, a marked revision
    # are refused with 409 `STATE_FORBIDS_OPERATION` (README, "Conventions"; US-0702/L1).
    - PERMISSION_MISSING
    - NOT_CONTRIBUTOR
    - NOT_PROJECT_MANAGER
    # 404 — object nonexistent or invisible, without distinction (WF-ADM-0110).
    - NOT_FOUND
    # 409 — the current state forbids the operation: the refusal of any command that a state makes
    # unavailable, `params.missing_condition` naming the missing condition, as the object's command
    # states it in advance — on a marked revision `revision_draft` —, or of any write
    # to a terminal project, which no longer lists any command, `project_not_terminal` (WF-CYC-0100,
    # WF-DAT-0020, WF-IHM-0090; US-0702/L3); or `params` names the object or the state.
    - STATE_FORBIDS_OPERATION
    # A unique value already carried by another object; also the per-field reason of the 409
    # that says which field carries it, `fields[].params.conflicting_object_id` naming the
    # object that carries it (WF-REF-0030, WF-REF-0040) — without `fields` when the key is that
    # of the path, the rate of a category and a year (`setHourlyRate`).
    - ALREADY_EXISTS
    # An undo or a redo that would undo a later modification made to the same object — which
    # another contributor has since taken up —: `params.conflicting_object_id` and
    # `params.conflicting_object_label` name that object, a task, an estimate line or a risk
    # (`undoLastChange`, `redoLastUndo`, WF-IHM-0110; E-07, US-0702/L1).
    - UNDO_CONFLICT
    # Roles sent, or a modified role, that would take away from the last active account that
    # carries them the permission to modify accounts or access roles (WF-ADM-0120); the
    # deactivation of that account, which its command states in advance, is
    # `STATE_FORBIDS_OPERATION`.
    - LAST_ADMINISTRATOR
    # A list of contributors that would keep no project manager, or, written by a
    # non-contributor when none has an active account, no active project manager
    # (`setContributors`, WF-PRJ-0060; D-06, US-0701/L9); the deletion of a subproject to which
    # actual costs are charged, that a marked revision cites or that estimate lines of the
    # current revision carry, which its command states in advance, is `STATE_FORBIDS_OPERATION`.
    - LAST_PROJECT_MANAGER
    - ACCESS_ROLE_IN_USE
    # A project created while the minimal reference data is incomplete;
    # `params.missing_prerequisites` names each prerequisite (WF-CYC-0120).
    - REFERENCE_INCOMPLETE
    # 412 — stale `lock_version`; `params.expected_lock_version`, the current version of
    # the object the path names (WF-IHM-0110).
    - STALE_LOCK_VERSION
    # 413 — file beyond the allowed size (WF-CMP-0020).
    - FILE_TOO_LARGE
    # 422 — business rule; `params` or `fields` locates the refusal.
    - VALIDATION_FAILED
    # A value the server calculates for the node, sent in an entry (WF-IHM-0030): the date
    # of a task in automatic mode (`updateTaskFacet`), the mode of a summary task,
    # always automatic, even sent as `automatic` (`TaskFacetUpdate`, `updateTaskFacet`;
    # WF-PLA-0040), the category of a labour line when it is not that of its
    # role (`EstimateLineWrite`, `EstimateLineUpdate`; WF-DEV-0020); `fields` names it, and
    # `getComputedValueDependencies` says what it depends on.
    - COMPUTED_VALUE
    # A value that a summary task draws from its subordinates, sent in an entry: its state
    # (`setTaskProgress`), its dates (`/start`, `/finish`, `updateTaskFacet`); `params` — or
    # `fields[].params` for a date — `subordinate_node_ids` names its direct subordinates
    # (WF-PLA-0040, WF-IHM-0030; F-05, J-04, US-0702/L1). Also the signal of a summary task
    # in manual mode imported in automatic mode (`ImportSignal`, WF-INTF-0040).
    - SUMMARY_TASK_DERIVED
    # Predecessors that would close a loop of links, `params.cycle` naming its
    # tasks, or a link between a summary task and one of its subordinates, without
    # parameter (`setPredecessors`, WF-PLA-0030, WF-PLA-0040; EP-15/US-0460); likewise a
    # move or an indent that would make a task the summary task of a task
    # linked to it, or would close a loop through it (`moveNodes`; #1164). A
    # creation carries no link: `createNode` returns neither (#1167).
    # `LINK_CYCLE` is also the code of a merge that fails on a loop of links, and a
    # reason in its preliminary report (`mergeCostStructure`, `StructureMergeReport.refusals`,
    # WF-REV-0050; #788); `LINK_FORBIDDEN` likewise for a link it would give rise to
    # between a summary task and its subordinate, `params.link` naming the two tasks
    # (WF-PLA-0030; #1582).
    - LINK_CYCLE
    - LINK_FORBIDDEN
    # A labour line without a role: the role removed from a line that carries one
    # (`/resource_role_id`, `updateEstimateLine`), a line of a labour category created without a
    # role (`/estimate_line/resource_role_id`, `createNode`; WF-DEV-0020; J-06, US-0702/L1).
    - RESOURCE_ROLE_REQUIRED
    # A non-labour category where a labour one is needed: the rate of a category
    # (`setHourlyRate`, WF-REF-0050), and the per-field reason for the category of a resource role
    # (`/cost_category_id`, WF-REF-0090).
    - LABOUR_CATEGORY_REQUIRED
    # A calculation refused as long as a labour category used by the role of a line has no
    # hourly rate for the reference year of the revision: `params.missing_rates` names
    # the categories one by one (`MissingRate`) — a line entry that would require it
    # (`createNode`, `updateEstimateLine`), and the reason for the failure of a marking
    # (`BackgroundTaskRef.problem`, `markRevision`; WF-DEV-0010; J-06, US-0702/L1).
    - HOURLY_RATE_MISSING
    - PASTE_TOO_WIDE
    # The reason for a pasted block whose target cell is on a node that a differential removes,
    # which accepts no field: the block is refused whole, stated once on its first row and
    # the target column (`PasteRejection`, `PastePreview`, WF-IHM-0050; #1361).
    - PASTE_TARGET_REMOVED
    - FILE_FORMAT_UNREADABLE
    # A role or calendar entry that would leave a task without any working hour
    # in the week; also a reason for rejecting a pasted or imported line (WF-PLA-0010).
    - TASK_WITHOUT_WORKING_HOURS
    # Per-field reasons, per pasted or imported line (`fields`, `PastePlan`,
    # `ImportRejection`). `VALUE_TOO_LONG` always carries `params.max_length`, the bound of the
    # refused field, `maxLength` of a text or `maxItems` of a list (J-02, #1796).
    - VALUE_REQUIRED
    - VALUE_TOO_LONG
    - VALUE_OUT_OF_RANGE
    - NUMBER_INVALID
    - DATE_INVALID
    # A cost category that the reference data does not have; also, at the rate update, a
    # category that the proposal does not present (`/cost_category_ids/<n>`, `applyRateUpdate`,
    # `RateUpdateApply`, WF-REV-0060; E-03, #1755).
    - UNKNOWN_COST_CATEGORY
    # A cost type that the reference data does not have, given to a category (`/cost_type_id`,
    # WF-REF-0040).
    - UNKNOWN_COST_TYPE
    # A calendar that the reference data does not have, given as the attachment of a role
    # (`/calendar_id`, WF-REF-0090); an organisation node it does not have is
    # `UNKNOWN_ORG_NODE`, further down.
    - UNKNOWN_CALENDAR
    - UNKNOWN_RESOURCE_ROLE
    # A person from the identity provider, or an account it holds, without an email address: the
    # reading of the accounts leaves it as it is and says so (`IdentitySyncReport.skipped`,
    # #918).
    - EMAIL_MISSING
    # Per-field reasons for the writes of an account (`createUser`, `updateUser`,
    # `setUserAccessRoles`): an access role or an organisation node that the server does not
    # have — the latter also given as the parent of a node (`/parent_id`) or as the attachment of a
    # resource role (`/org_node_id`, WF-REF-0070, WF-REF-0090) —, and a value different from
    # the account's for an identity field of an account that does not come from Waterfall
    # (`origin` other than `local`), which the provider holds, or a node other than that of a
    # resource role at its modification (`/org_node_id`, `updateResourceRole`, WF-REF-0090); sending
    # the field unchanged is not refused (WF-ADM-0050, WF-ADM-0090, WF-ADM-0030).
    - UNKNOWN_ACCESS_ROLE
    - UNKNOWN_ORG_NODE
    - FIELD_READ_ONLY
    - UNKNOWN_SUBPROJECT
    - UNKNOWN_TASK
    - INACTIVE_REFERENCE_OBJECT
    # An organisation node moved under itself or under one of its descendants: the tree
    # would have a loop (`/parent_id`, `updateOrgNode`, WF-REF-0070).
    - ORG_NODE_CYCLE
    # The node after which a creation or a move is placed, which is not a sibling under the
    # target parent: a node of another parent, one of the moved nodes, or a node that the
    # structure does not have (`/after_node_id`, `createNode`, `moveNodes`; #1183).
    - NODE_NOT_SIBLING
    # A task created or moved under a milestone, which carries no subtasks (`/parent_id`,
    # `createNode`, `moveNodes`, WF-PLA-0050; F-04, #1771): `fields[].params` names the milestone,
    # `node_id` and `label`; nothing is written. Also the reason for an imported or pasted line that
    # would place a task under a milestone (`ImportRejection`, `PasteRejection`), the line not being
    # written. An estimate line under a milestone is permitted.
    - MILESTONE_HAS_NO_SUBTASK
    # A `milestone_tracking` entry sent for a task that is not a milestone: time/time
    # tracking is that of milestones (`/entries/<n>/kind`, `setNodeTracking`, WF-PLA-0060;
    # #1159).
    - MILESTONE_REQUIRED
    # A `timeline` entry whose timeline is not a timeline of the project, or that the
    # server does not have (`/entries/<n>/timeline_id`, `setNodeTracking`, WF-PLA-0060, WF-PLA-0140;
    # F-11, US-0702/L2).
    - UNKNOWN_TIMELINE
    # A risk named by the filter of nodes arising from a risk that is not an occurred risk of the
    # project (`/query/origin_risk_ids/<n>`, `listNodes`, `compareRevisions`, WF-RIS-0060; #1761).
    - UNKNOWN_RISK
    # A predecessor named twice in the predecessors sent for a task: two tasks
    # are connected by one link at most (`/predecessors/<n>/predecessor_node_id` of
    # each occurrence after the first, `setPredecessors`, WF-PLA-0030; F-03, US-0702/L2).
    - DUPLICATE_PREDECESSOR
    # An upload designated for a use other than its own: an import opened on a backup
    # uploaded for a restore, or a restore on an import upload (`uploadFile`,
    # `FileUploadPurpose`).
    - UPLOAD_PURPOSE_MISMATCH
    # A backup from a version more recent than the installation, which the `restore` task
    # refuses before maintenance (`startRestore`, WF-ADM-0160): the reason for the failure of
    # the task (`BackgroundTaskRef.problem`), `params.backup_version` and
    # `params.installed_version`.
    - BACKUP_FROM_NEWER_VERSION
    # A task that the restore found queued or running in the restored database: it fails without
    # resuming, so that a backup running at the time of the dump does not restart and does not
    # overwrite its archive (`startRestore`, #892); the reason for the failure of the task,
    # whose `problem` carries the 409 status of a state that forbids the operation, and not 422.
    - TASK_INTERRUPTED_BY_RESTORE
    # A category of the risk provision type given to an entered line: only the
    # declaration of a risk creates a provision line (WF-DEV-0020, WF-RIS-0010).
    - PROVISION_CATEGORY_RESERVED
    # A category of a cost type of a kind other than risk provision designated for the
    # provision of a risk (`/provision_cost_category_id`, `createRisk`, `updateRiskProvision`,
    # `reviewRisk`, WF-RIS-0010).
    - PROVISION_CATEGORY_REQUIRED
    # A provision line moved in the grid: it is moved through the form of its
    # risk, which designates its task (`/node_ids/<n>`, `moveNodes`, `fields[].params.risk`,
    # WF-RIS-0010; #1227).
    - PROVISION_LINE_MOVED_BY_RISK
    # A re-estimation that completes the task without the completion date that validation
    # requires (`setLineRemaining`, WF-RAE-0040, WF-PLA-0130).
    - COMPLETION_DATE_REQUIRED
    # An account that the installation does not have, or a deactivated account enrolled or whose
    # standing changed, in a list of contributors (`/contributors/<n>/user_id`,
    # `setContributors`, WF-PRJ-0060, WF-ADM-0060).
    - UNKNOWN_USER
    - USER_INACTIVE
    # An external copy of backups to a location that the installation does not declare
    # (`setBackupSchedule`, `BackupExternalCopy.location`, WF-ADM-0170); `params.location`
    # names it.
    - UNKNOWN_EXTERNAL_BACKUP_LOCATION
    # A path in an external location that is not relative, or that would leave it
    # (`ExternalBackupPath`, WF-ADM-0170).
    - PATH_INVALID
    # A bound of the risk matrix that is not strictly greater than the previous one
    # (`RiskMatrixSettings`, WF-REF-0160); the pointer designates the bound that breaks the order.
    - BOUNDS_NOT_ORDERED
    # An alert threshold that is not strictly lower than the watch threshold of its index
    # (`IndexThresholds`, WF-REF-0170); the pointer designates the alert threshold.
    - THRESHOLD_NOT_BELOW_WATCH
    # An index threshold that is not strictly between 0 and 1 (`IndexThreshold`,
    # WF-REF-0170); the pointer designates the threshold, without parameter.
    - THRESHOLD_NOT_BETWEEN_ZERO_AND_ONE
    # A duration unit conversion constant that is zero (`DurationUnitsWrite`,
    # `setDurationUnits`, WF-PLA-0160): it is strictly positive; the pointer designates the
    # constant, without parameter.
    - DURATION_UNIT_NOT_POSITIVE
    # Per-field reasons for attaching a task to a work package or an order item of the work
    # breakdown (`TaskFacetUpdate`, WF-PLA-0170); the first also for an identifier that the
    # entry of the work breakdown sends and that it does not have (`setWorkBreakdown`);
    # `ORDER_ITEM_OUTSIDE_WORK_PACKAGE` also for a move (`moveNodes`) that would take the task
    # of an order item out of the subtree of that of its work package, the reason that rejects
    # an import file whole (`ImportReport.refusals`, EP-14/L42s), and the code of a merge that
    # fails for this reason (`mergeCostStructure`) — an entry of the work breakdown that places
    # an order item under another work package removes the attachment, without refusal
    # (`setWorkBreakdown`, EP-14/L42k). `WORK_BREAKDOWN_MAIN_STRUCTURE_ONLY` refuses an
    # attachment set on a task of a differential or of the own estimate of a risk, which do not
    # carry any (EP-14/L42k). `DUPLICATE_WORK_BREAKDOWN_ITEM` refuses, in an entry of the work
    # breakdown, an identifier sent a second time, each occurrence after the first
    # (`setWorkBreakdown`, EP-14/L42k).
    - UNKNOWN_WORK_BREAKDOWN_ITEM
    - WORK_BREAKDOWN_ITEMS_EXCLUSIVE
    - WORK_BREAKDOWN_ITEM_ALREADY_ATTACHED
    - ORDER_ITEM_OUTSIDE_WORK_PACKAGE
    - WORK_BREAKDOWN_MAIN_STRUCTURE_ONLY
    - DUPLICATE_WORK_BREAKDOWN_ITEM
    # A planning that would extend the project's duration, from the start date of its first task
    # to the finish date of its last, beyond fifteen years; the reason that rejects an import
    # file whole, `params.task` naming the task involved (`ImportReport.refusals`, WF-PLA-0150;
    # EP-14/L42s), and the refusal, with 422, of an entry that moves a date (`updateTaskFacet`,
    # `setPredecessors`, `createNode`, `moveNodes`; EP-15/US-0460); also the code of a merge
    # that fails for this reason, and a reason in its preliminary report (`mergeCostStructure`,
    # `StructureMergeReport.refusals`, WF-REV-0050; #788).
    - PROJECT_HORIZON_EXCEEDED
    # A field that the node does not accept, neither entered nor calculated for it
    # (`editable_fields`): the payment delay of a provision line, which carries none
    # (WF-DEV-0020), a field of another kind of line (`EstimateLineWrite`,
    # `EstimateLineUpdate`), the duration of a milestone (`TaskFacetUpdate`), and the reason for
    # a cell pasted on such a column (`PastePreview`; EP-14/L42s), except the subproject of a
    # line that cannot leave it, refused with `SUBPROJECT_HAS_ACTUAL_COSTS`.
    - FIELD_NOT_ACCEPTED
    # A date of a manual task on a day with no working hour at all on the applicable calendar
    # of the task (WF-PLA-0020, WF-PLA-0010; #1271, #1289): refused at entry
    # (`/start/date` or `/finish/date`, `updateTaskFacet`; `/task/start/date` or
    # `/task/finish/date`, `createNode`, #1345), nothing is written; kept at the import
    # of an MS Project file, and flagged in the report (`ImportReport.signals`).
    # `params.date` names the date, `params.next_working_day` the next working day.
    - NON_WORKING_DAY
    # A line of an actual cost extraction rejected for its WBS element (`ImportRejection`,
    # WF-CRE-0020): an element that does not have the form of a project code optionally followed
    # by a slash and a subproject code, `params.wbs_element` the element read; an element of
    # another project, `params.wbs_element` and `params.project_code` the project code read.
    - WBS_ELEMENT_INVALID
    - WBS_ELEMENT_OUTSIDE_PROJECT
    # A line of an estimate or of a remaining to commit that designates its task by a label that
    # several tasks carry (`ImportRejection`, annex B, WF-INTF-0080): `params.label` the
    # label, `params.tasks` the tasks that carry it, by their lineage and their label.
    - AMBIGUOUS_TASK_LABEL
    # A line whose task is started or completed, moved out of a subproject that has received
    # actual costs (`/subproject_id`, `updateEstimateLine`, WF-PRJ-0050);
    # `fields[].params.subproject` names that subproject. Also the reason for a pasted
    # subproject cell on such a line (`PasteRejection`) and for a line of an estimate or
    # of a remaining to commit imported into another subproject (`ImportRejection`, WF-INTF-0100,
    # WF-INTF-0120; C-359, #1152), `params.subproject` naming the subproject.
    - SUBPROJECT_HAS_ACTUAL_COSTS
    # The code of a subproject that cannot name its sheet of the remaining-to-commit file
    # (`/code`, `createSubproject`, `updateSubproject`; WF-PRJ-0050, D-7, EP-16/US-0610): it
    # carries a forbidden character, `fields[].params.forbidden_characters` naming them, or
    # equals a reserved name, regardless of case, `fields[].params.reserved_name` naming it. A
    # code that is too long is `VALUE_TOO_LONG`, `fields[].params.max_length` at `31`, as every
    # `VALUE_TOO_LONG` carries the bound of its field.
    - SUBPROJECT_CODE_INVALID
    # A project code that carries a slash, the only separator of the WBS element that carries it
    # (`/code`, `createProject`, `updateProject`; `ProjectCode`, WF-PRJ-0010, WF-CRE-0020; D-07,
    # US-0701/L9): `fields[].params.forbidden_characters` names the forbidden character,
    # `["/"]`, as for `SUBPROJECT_CODE_INVALID`. A code that is both blank and carries a slash
    # receives this refusal, the slash first. An empty code is `VALUE_REQUIRED`, one made only
    # of whitespace `VALIDATION_FAILED`, like any label, one too long `VALUE_TOO_LONG`.
    - PROJECT_CODE_INVALID
    # A label of the mapping of the actual cost extraction that duplicates another,
    # compared regardless of case, accents and trailing spaces — of the same column read,
    # of two columns read, or of a column read and a kept column (`setActualCostMapping`,
    # WF-REF-0190; EP-16/US-0620): at the pointer of the duplicate label,
    # `fields[].params.duplicate_of` the pointer of the one it duplicates.
    - DUPLICATE_COLUMN_LABEL
    # A line of an actual cost extraction for which another line of the same file carries the
    # same document and the same item, null included (`ImportRejection`, WF-INTF-0140, D-4;
    # EP-16/US-0630): each is rejected, `params.rows` naming the row numbers of the others.
    - DUPLICATE_COST_LINE
    # 5xx — component unavailable, `params.component` (WF-EXP-0040, 503 `ServiceUnavailable`), or
    # unexpected error, traced by its `correlation_id` (WF-OBS-0020, 500 `InternalError`, which
    # every operation declares; J-07, US-0702/L1).
    - COMPONENT_UNAVAILABLE
    - INTERNAL_ERROR

FieldProblem:
  type: object
  required: [pointer, code]
  properties:
    pointer:
      type: string
      description: >-
        The faulty field. In the request body, its JSON pointer (RFC 6901),
        `/label` or `/lines/2/amount`; a query parameter, under `/query` followed by its
        name, `/query/revision_id`; a path parameter that is not an identifier,
        under `/path` followed by its name, `/path/year` (a malformed identifier is a 404,
        like a nonexistent object). No body field is named `query`, and the only
        `path` of a body is a text, with no field under it: a pointer thus designates
        only one field, whatever the operation.
    code: { $ref: '#/ErrorCode' }
    params:
      allOf: [{ $ref: '#/ProblemParams' }]
      description: >-
        The parameters of the reason for this field, those of `Problem.params` (convention
        #293), typed likewise (`ProblemParams`).

ProblemParams:
  type: object
  additionalProperties: true
  description: >-
    The parameters of a refusal (`Problem.params`), of a per-field reason
    (`FieldProblem.params`), and of the reason for a pasted or imported line, for a refusal in a
    report or for a signal (`PasteRejection.params`, `ImportRejection.params`,
    `ReportRefusal.params`, `ImportSignal.params`), which carry the parameters of their code in
    a refusal so that entry, paste and import are expressed in the same sentence (WF-ARC-0110).
    Those that several refusals share are declared here, optional and typed, each in the form
    its refusals give it; the others remain open, described by `Problem.params` (#768, point 3;
    EP-16). A schema per error code was ruled out: it would duplicate the catalogue
    (`ErrorCode`). `state` and `state_enum` always travel together.
  properties:
    state_enum: { $ref: '#/StateEnumeration' }
    subordinate_node_ids:
      type: array
      minItems: 1
      description: >-
        The direct subordinates of a summary task, from which it draws the value sent — its state,
        its dates —, in plan order (`SUMMARY_TASK_DERIVED`, WF-PLA-0040, WF-IHM-0030).
      items: { $ref: '#/Uuid' }
    missing_rates:
      type: array
      minItems: 1
      description: >-
        The labour categories without an hourly rate for the reference year of the revision,
        one by one, as `getMissingRates` lists them (`HOURLY_RATE_MISSING`, WF-DEV-0010).
      items: { $ref: schemas/indicators.yaml#/MissingRate }
    resource_roles:
      type: array
      description: >-
        The roles involved, active or deactivated, each by its identifier, its code and its
        label, whether or not the author reads roles (`STATE_FORBIDS_OPERATION`,
        `cost_type_without_role`, `cost_category_without_role`, WF-REF-0030, WF-REF-0040;
        EP-14/L42r); and those of any refusal that would leave a task without a working hour
        (`TASK_WITHOUT_WORKING_HOURS`, WF-PLA-0010) — a write to the reference data or to a
        revision, a pasted (`PasteRejection.params`) or imported line
        (`ImportRejection.params`), a merge —, empty when only tasks without a labour
        line lose their hours (#768; #1684).
      items: { $ref: '#/ProblemResourceRole' }
    projects:
      type: array
      description: >-
        The projects that a modification of the reference data would leave with a task without a
        working hour, each by its label and its code, without identifier or task
        (`TASK_WITHOUT_WORKING_HOURS`, `updateCalendar`, `setDefaultCalendar`,
        `updateResourceRole`, WF-PLA-0010, WF-ADM-0110).
      items: { $ref: '#/ProblemProject' }
    tasks:
      type: array
      description: >-
        The tasks that an entry in a revision, a merge, a pasted or imported line would
        leave without a working hour (`TASK_WITHOUT_WORKING_HOURS`, WF-PLA-0010): by their
        project, their node and their label for an entry, a paste or a merge; by their
        lineage and their label in the report of an import, which names its objects this way
        (`ImportDifference`) and may concern a project without a current revision, of which no node
        exists yet (WF-INTF-0090; #768, point 2). Likewise, by their lineage and their label,
        the tasks that carry the ambiguous label an imported line cites
        (`AMBIGUOUS_TASK_LABEL`, annex B).
      items:
        anyOf:
          - $ref: '#/ProblemTask'
          - $ref: '#/ProblemImportedTask'
    estimate_lines:
      type: array
      description: >-
        The estimate lines of the current revision that carry a subproject whose deletion
        is refused (`STATE_FORBIDS_OPERATION`, `subproject_without_estimate_lines`, WF-DAT-0080).
      items: { $ref: '#/ProblemEstimateLine' }
    risks:
      type: array
      minItems: 1
      description: >-
        The risks whose provision line would no longer have a task to be placed in, each by its
        identifier and its label, in the order of the list of risks: the deletion that would
        leave without a task a main structure that carries one (`STATE_FORBIDS_OPERATION`,
        `at_least_one_task`, `deleteNode`, WF-RIS-0010; H-05, US-0702/L2).
      items: { $ref: '#/ProblemRisk' }
    subproject:
      allOf: [{ $ref: '#/ProblemSubproject' }]
      description: >-
        The subproject that a line of a started or completed task cannot leave, because
        it has received actual costs (`SUBPROJECT_HAS_ACTUAL_COSTS`, in `fields[].params`, the
        reason for a pasted cell or an imported line, WF-PRJ-0050).
    columns:
      type: array
      description: >-
        The required columns of the mapping of the actual cost extraction that have no
        label, in the order of the mapping (`STATE_FORBIDS_OPERATION`,
        `actual_cost_mapping_complete`, `openImport`, WF-REF-0190).
      items: { $ref: schemas/reference.yaml#/ActualCostSourceColumn }
    missing_columns:
      type: array
      description: >-
        The required columns that an actual cost extraction does not carry under any of their
        labels, in the order of the mapping (`FILE_FORMAT_UNREADABLE`, `openImport`,
        WF-REF-0190).
      items: { $ref: '#/ProblemMissingColumn' }
  dependentRequired:
    state: [state_enum]
    state_enum: [state]

ProblemResourceRole:
  type: object
  required: [resource_role_id, code, label]
  description: A resource role named by a refusal, active or deactivated (`ProblemParams.resource_roles`).
  properties:
    resource_role_id: { $ref: '#/Uuid' }
    code: { type: string }
    label: { type: string }

ProblemProject:
  type: object
  required: [project_label, project_code]
  description: A project named by a refusal, without identifier (`ProblemParams.projects`).
  properties:
    project_label: { type: string }
    project_code:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Null for a project without a code.

ProblemTask:
  type: object
  required: [project_id, node_id, label]
  description: >-
    A task named by the refusal of an entry, a paste or a merge, the author consulting
    its project (`ProblemParams.tasks`).
  properties:
    project_id: { $ref: '#/Uuid' }
    node_id: { $ref: '#/Uuid' }
    label: { type: string }

ProblemImportedTask:
  type: object
  required: [lineage_id, label]
  description: >-
    A task named by the reason for an imported line (`ImportRejection.params.tasks`), by its
    lineage, as `ImportDifference` names the objects of an import (#768, point 2).
  properties:
    lineage_id: { $ref: '#/Uuid' }
    label: { type: string }

ProblemEstimateLine:
  type: object
  required: [structure_id, structure_label, node_id, row_number, label]
  description: >-
    An estimate line named by a refusal (`ProblemParams.estimate_lines`): its structure and the
    label of that structure, its node, its row number and its label.
  properties:
    structure_id: { $ref: '#/Uuid' }
    structure_label: { type: string }
    node_id: { $ref: '#/Uuid' }
    row_number: { type: integer, minimum: 1 }
    label: { type: string }

ProblemRisk:
  type: object
  required: [risk_id, label]
  description: A risk named by a refusal (`ProblemParams.risks`).
  properties:
    risk_id: { $ref: '#/Uuid' }
    label: { type: string }

ProblemSubproject:
  type: object
  required: [subproject_id, label]
  description: A subproject named by a refusal (`ProblemParams.subproject`).
  properties:
    subproject_id: { $ref: '#/Uuid' }
    label: { type: string }

ProblemMissingColumn:
  type: object
  required: [column, labels]
  description: >-
    A required column that an actual cost extraction does not carry, with the labels that the
    mapping declares for it (`ProblemParams.missing_columns`).
  properties:
    column: { $ref: schemas/reference.yaml#/ActualCostSourceColumn }
    labels:
      type: array
      items: { type: string }

SortOrder:
  type: string
  enum: [asc, desc]
  description: Direction of a sort requested from the server; ascending by default.

PaginationMeta:
  type: object
  required: [limit, offset, total]
  properties:
    limit: { type: integer, minimum: 1, maximum: 500 }
    offset: { type: integer, minimum: 0 }
    total: { type: integer, minimum: 0 }

BackgroundTaskStatus:
  type: string
  enum: [queued, running, succeeded, failed]
  description: >-
    Where a background task stands: queued, running, succeeded or failed (WF-ARC-0090,
    WF-IHM-0080). Named to filter the list of the caller's tasks.

BackgroundTaskRef:
  type: object
  required: [task_id, kind, status, progress, submitted_at, finished_at, problem, result_url]
  description: >-
    Reference of a background task. A request that triggers a long process
    returns control immediately by sending back this reference (WF-ARC-0090, WF-IHM-0080).
  properties:
    task_id: { $ref: '#/Uuid' }
    kind:
      type: string
      description: >-
        What the task does. `backup` takes the backup of the two databases and verifies it;
        `restore` follows the whole restore, from entering maintenance to leaving it: it only
        moves to `succeeded` once maintenance is lifted, and an interrupted restore resumes from
        the beginning; an archive from a version more recent than the installation is refused
        before maintenance, the task failing with `BACKUP_FROM_NEWER_VERSION` (WF-ARC-0090,
        WF-ADM-0160); `identity_sync` reads the accounts of the identity provider (WF-ADM-0070);
        `revision_mark` freezes the revision and calculates its indicators, and fails without
        freezing anything with `HOURLY_RATE_MISSING`, `params.missing_rates` naming the labour
        categories without a rate for the reference year (`markRevision`, WF-DEV-0010).
      enum:
        - import_analysis
        - import_apply
        - revision_mark
        - structure_merge
        - risk_occurrence
        - export
        - backup
        - restore
        - identity_sync
    status: { $ref: '#/BackgroundTaskStatus' }
    progress:
      type: integer
      minimum: 0
      maximum: 100
    submitted_at:
      allOf: [{ $ref: '#/Timestamp' }]
      description: When the task was queued; the list of tasks is sorted on it.
    finished_at:
      anyOf:
        - $ref: '#/Timestamp'
        - type: 'null'
      description: When the task succeeded or failed; null while it runs.
    problem:
      anyOf:
        - $ref: '#/Problem'
        - type: 'null'
      description: Reason for the failure, null as long as the task has not failed (WF-IHM-0080).
    result_url:
      anyOf:
        - type: string
          format: uri-reference
        - type: 'null'
      description: >-
        Where to read the result, when the task produces one: a path under `/api/v1`, like
        the examples; null otherwise. That of an account reading
        (`identity_sync`) designates the latest report, which is not necessarily that of the
        task: a reading completed since has replaced it. That of an export (`export`) is null once
        the file is deleted, after its first complete download or at the end of
        twenty-four hours (`getBackgroundTaskResult`, WF-DAT-0120).
