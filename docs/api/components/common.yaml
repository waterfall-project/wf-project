# Types élémentaires et enveloppes communes.
# Conventions : snake_case, UUID en identifiant (WF-DAT-0060), décimaux exacts
# transportés en chaîne (WF-DAT-0100), dates de planning sans heure et
# horodatages en temps universel (WF-DAT-0100, WF-INTF-0180).

Uuid:
  type: string
  format: uuid
  description: Identifiant engendré par le serveur, ordonné dans le temps (WF-DAT-0060).

Decimal:
  type: string
  pattern: '^-?\d+(\.\d+)?$'
  description: >-
    Décimal exact, jamais un flottant (WF-DAT-0100). Le séparateur est le point,
    indépendamment de la langue de l'interface (WF-INTF-0180).

Money:
  allOf:
    - $ref: '#/Decimal'
  pattern: '^-?\d+(\.\d{1,2})?$'
  description: Montant dans la devise unique de l'installation (WF-REF-0140), à deux décimales.

Hours:
  allOf:
    - $ref: '#/Decimal'
  description: Nombre d'heures, décimal exact.

Percent:
  allOf:
    - $ref: '#/Decimal'
  description: Pourcentage, décimal exact, non arrondi avant les calculs (WF-DAT-0100).

PlanningDate:
  type: string
  format: date
  description: Date sans heure, en ISO 8601 (WF-DAT-0100).

Timestamp:
  type: string
  format: date-time
  description: Horodatage en temps universel (WF-DAT-0100).

WorkInstant:
  type: object
  required: [date, hours]
  description: >-
    Début ou fin d'une tâche : une date sans heure et le nombre d'heures de travail
    écoulées ce jour-là sur le calendrier applicable, sans fuseau (WF-DAT-0100). Deux
    tâches de quatre heures liées fin à début, sur un calendrier de huit heures,
    commencent et finissent le même jour : la première finit à `4`, la seconde commence
    à `4` et finit à `8`.
  properties:
    date: { $ref: '#/PlanningDate' }
    hours: { $ref: '#/Hours' }

WorkInstantWrite:
  type: object
  required: [date]
  description: >-
    Début ou fin d'une tâche saisis (`TaskFacetUpdate`, WF-PLA-0020) : la date, et
    facultativement les heures de travail écoulées ce jour-là (WF-DAT-0100). Le client ne
    connaît pas le calendrier applicable (WF-PLA-0010) : sans `hours`, le serveur les
    complète sur ce calendrier, le début au début de son jour (`0`), la fin au bout des
    heures que le calendrier accorde ce jour-là — `8` un vendredi d'un calendrier de huit
    heures. Une date sur un jour sans aucune heure travaillée au calendrier applicable est
    refusée, et le refus nomme le jour travaillé suivant ; rien n'est écrit (WF-PLA-0020 ;
    #1271) : 422 `VALIDATION_FAILED`, `fields` sur `/start/date` ou `/finish/date` par
    `NON_WORKING_DAY`, `fields[].params.date` la date envoyée et `next_working_day` le jour
    travaillé suivant ; les heures envoyées avec elle ne sont pas jugées. Envoyées avec un jour
    travaillé, les heures sont prises telles quelles, jamais bornées : hors de `0` aux heures
    que le calendrier accorde ce jour-là, elles sont refusées par 422 `VALIDATION_FAILED`,
    `fields` sur `/start/hours` ou `/finish/hours` par `VALUE_OUT_OF_RANGE`,
    `fields[].params.minimum` à `0` ou `maximum` aux heures du jour, la seule borne franchie,
    jamais nulle. La lecture rend toujours un `WorkInstant`, ses heures complétées ; une date
    importée d'un fichier MS Project un jour chômé y est gardée, le début et la fin à `0`, et le
    compte rendu la signale (`ImportReport.signals`).
  properties:
    date: { $ref: '#/PlanningDate' }
    hours: { $ref: '#/Hours' }

Language:
  type: string
  enum: [fr, en]
  description: Langue offerte par l'interface (WF-INTF-0160).

Year:
  type: integer
  minimum: 2000
  maximum: 2100

LockVersion:
  type: integer
  minimum: 0
  description: >-
    Compteur d'écriture de l'objet. Toute modification le porte et l'exige, une
    création n'en a pas ; une valeur périmée est refusée par 412, ce qui rend
    l'annulation sûre à plusieurs contributeurs (WF-IHM-0110, WF-PRJ-0060). Il suit
    les écritures de l'utilisateur : ce que le serveur recalcule sans que personne ne
    l'écrive — les dates des successeurs d'une liaison ou d'une durée, ce que le chemin
    critique déplace, les montants et les dates d'une récapitulative, le montant corrigé des
    lignes et des tâches qu'une écriture déplace d'une année à l'autre — ne fait avancer le
    compteur d'aucun nœud.

Audit:
  type: object
  required: [created_at, created_by, updated_at, updated_by]
  description: Colonnes d'audit de WF-DAT-0070. `platform` désigne un traitement automatique.
  properties:
    created_at: { $ref: '#/Timestamp' }
    created_by: { $ref: '#/ActorRef' }
    updated_at: { $ref: '#/Timestamp' }
    updated_by: { $ref: '#/ActorRef' }

ActorRef:
  type: object
  required: [kind]
  properties:
    kind:
      type: string
      enum: [user, platform]
    user_id: { $ref: '#/Uuid' }
    display_name:
      anyOf: [{ type: string }, { type: 'null' }]
      description: >-
        Nom d'affichage du compte, conservé après sa désactivation (WF-ADM-0060) ; nul pour un
        compte anonymisé, que le front présente sous le libellé neutre de son catalogue, l'API ne
        rendant aucune phrase (WF-ADM-0060, WF-ARC-0110). Absent pour la plateforme.

Problem:
  type: object
  required: [code, status]
  description: >-
    Enveloppe unique des refus et des erreurs. Elle ne porte aucune phrase
    destinée à être lue : `code` et `params` suffisent au front pour rendre le
    texte dans la langue du lecteur (WF-ARC-0110). `params` nomme la condition
    manquante, ce que WF-ADM-0110 et WF-IHM-0090 exigent.
  properties:
    code: { $ref: '#/ErrorCode' }
    status:
      type: integer
      minimum: 400
      maximum: 599
    params:
      allOf: [{ $ref: '#/ProblemParams' }]
      description: >-
        Paramètres du code, selon le cas — ceux que plusieurs refus partagent sont typés par
        `ProblemParams`, les autres restent ouverts : `missing_permission` (un `PermissionCode`),
        `missing_condition` (une `CommandCondition`), `conflicting_object_id`,
        `expected_lock_version` (la version courante de l'objet, seul paramètre d'un 412
        `STALE_LOCK_VERSION`, WF-IHM-0110), `subordinate_node_ids` (les subordonnées directes d'une
        récapitulative, WF-IHM-0030, WF-PLA-0040), `field` (un champ que le serveur ne
        calcule pas pour le nœud dont on demande de quoi il dépend, WF-IHM-0030),
        `missing_prerequisites` (WF-CYC-0120), `state` et `state_enum` (l'état de l'objet qui
        interdit l'opération, `STATE_FORBIDS_OPERATION`, et le nom de l'énumération du contrat
        dont il est une valeur, qui voyagent toujours ensemble — l'un ne se rend jamais sans
        l'autre : seul `ProjectState` en relève
        aujourd'hui — l'état d'un projet qui n'a pas atteint l'état En cours, dont on demande
        les indicateurs (WF-IND-0010), ou sans révision de référence, dont on demande le plan
        de charge sur une base qu'il n'a pas (WF-DEV-0070) ; une énumération nouvelle est une
        modification du contrat),
        `max_columns` (collage trop large, WF-IHM-0050), `minimum` (la plus petite valeur
        admise d'une valeur trop petite, `VALUE_OUT_OF_RANGE` ; dans `fields[].params` pour un
        champ, ainsi la rétention de la copie externe des sauvegardes, au moins celle de la
        plateforme, WF-EXP-0050, la rétention des sauvegardes, au moins `1`, le délai entre deux
        revues, au moins `1` semaine, la probabilité de gain et le taux d'inflation d'un
        projet, au moins `0`, les heures d'un jour d'un calendrier et la capacité d'un rôle, au
        moins `0`, le délai de paiement d'une ligne, au moins `0`, le
        niveau d'une image d'arborescence, au moins `1`, le jour d'une sauvegarde
        hebdomadaire, au moins `1`, les heures d'un instant de travail envoyé (`/start/hours`,
        `/finish/hours` de `updateTaskFacet`), au moins `0`, ou la largeur d'une colonne des
        préférences de grille, au moins `20`), `maximum` (la plus grande valeur admise d'une valeur
        trop grande, `VALUE_OUT_OF_RANGE`, dans `fields[].params` : ainsi le début d'une période du
        portefeuille postérieur à la fin que le serveur a complétée, la probabilité de gain et le
        taux d'inflation d'un projet, au plus `1`, la rétention des sauvegardes, au plus `365`, le
        délai entre deux revues, au plus `104` semaines, les heures d'un jour d'un calendrier, au
        plus `24`, les heures d'un instant de travail envoyé (`/start/hours`, `/finish/hours` de
        `updateTaskFacet`), au plus les heures que le calendrier de la tâche accorde ce jour-là,
        jamais `0` — un jour sans heure travaillée est refusé par sa date, `NON_WORKING_DAY`
        (#1244, #1271) —, ou le jour d'une sauvegarde hebdomadaire, au plus
        `7`), `component` (un
        `PlatformComponent`, WF-EXP-0040),
        `expected_format` (un `ExchangeKind`) et `expected_version` (une chaîne) pour un
        fichier d'import au format ou à la version non reconnus (`FILE_FORMAT_UNREADABLE`,
        WF-INTF-0070) — absents pour une sauvegarde déposée dont l'archive ne se lit pas
        (`uploadFile`, WF-ADM-0160), et `expected_version` absent pour une extraction de coûts
        réels, qui n'a pas de version (`expected_format` à `actual_costs`) — ;
        `missing_columns` pour une extraction de coûts réels à laquelle manque une colonne exigée
        (`FILE_FORMAT_UNREADABLE`, `openImport`, WF-REF-0190) : chaque colonne exigée que le
        fichier ne porte sous aucun de ses intitulés, dans l'ordre de la correspondance, par son
        identifiant (`column`, un `ActualCostSourceColumn`) et les intitulés que la correspondance
        déclare pour elle (`labels`) ; `columns` quand `missing_condition` nomme
        `actual_cost_mapping_complete` (`STATE_FORBIDS_OPERATION`, `openImport`, WF-REF-0190) :
        les colonnes exigées de la correspondance qui n'ont aucun intitulé, chacune par son
        identifiant (`ActualCostSourceColumn`), dans l'ordre de la correspondance ; `resource_role_ids` pour une écriture qui laisserait une
        tâche sans heure travaillée (`TASK_WITHOUT_WORKING_HOURS`, WF-PLA-0010) : les rôles dont
        les calendriers ne se recoupent jamais — ce rôle seul quand, sur une tâche dont ce rôle
        est le seul, il n'a aucune heure dans la semaine (EP-14/L42s) ; aucun quand c'est le
        calendrier par défaut d'une tâche sans ligne de main-d'œuvre qui n'a plus d'heure —, par
        leurs seuls identifiants, que
        la session d'une modification du référentiel peut nommer, lisant tous les rôles
        (`listResourceRoles`, `include_inactive`), et une saisie d'une révision d'après ses lignes
        (`resource_role_label`) — non le motif d'une ligne importée, que le compte rendu lit sans
        relire les rôles, et qui les nomme par `resource_roles` (#768, point 1) ; `resource_roles` quand
        `missing_condition` nomme `cost_type_without_role` ou `cost_category_without_role`
        (`STATE_FORBIDS_OPERATION`, WF-REF-0030, WF-REF-0040) : tous les rôles en cause, actifs ou
        désactivés, chacun par son identifiant, son code et son libellé (`resource_role_id`,
        `code`, `label`) — l'écran des paramètres de coûts ne lit pas les rôles désactivés —, à
        rattacher d'abord à une catégorie de main-d'œuvre hors de la catégorie, ou de la nature,
        refusée (WF-IHM-0090) ; `cost_categories` quand `missing_condition` nomme
        `cost_type_unused` ou `cost_type_unrated` (`updateCostType`, WF-REF-0030) : toutes les
        catégories de la nature employées pour `cost_type_unused`, toutes celles qui portent un
        taux horaire pour `cost_type_unrated`, actives ou désactivées, chacune par son
        identifiant, son code et son libellé (`cost_category_id`, `code`,
        `label`), dans l'ordre de leur code — à rattacher d'abord à une autre nature du même type
        (WF-IHM-0090 ; EP-14/L42s) ; `tasks` pour une saisie d'une révision — `createNode`,
        `updateEstimateLine`, `moveNodes`, `mergeCostStructure`, et le motif d'une ligne collée ou
        importée — qui laisserait une tâche sans heure travaillée (`TASK_WITHOUT_WORKING_HOURS`) :
        les tâches en cause, chacune par son projet, son nœud et son libellé (`project_id`,
        `node_id`, `label`), l'auteur de la saisie consultant son projet — au motif d'une ligne
        importée, par sa lignée et son libellé (`lineage_id`, `label`), comme le compte rendu nomme
        ses objets (#768, point 2) ; `projects` pour une
        modification du référentiel qui produirait le même effet (`updateCalendar`,
        `setDefaultCalendar`, `updateResourceRole`), un élément par projet en cause, par son
        libellé et son code (`project_label`, `project_code`, nul pour un projet sans code), sans
        identifiant ni tâche — « sans autre détail », l'auteur pouvant ne pas consulter le projet
        (WF-PLA-0010, WF-ADM-0110) ; `estimate_lines` pour la suppression d'un sous-projet que
        portent des lignes de devis de la révision en cours
        (`STATE_FORBIDS_OPERATION`, `missing_condition` à `subproject_without_estimate_lines`,
        WF-DAT-0080) : ces lignes, chacune par sa structure, le libellé de celle-ci, son nœud, son
        numéro de ligne et son libellé (`structure_id`, `structure_label`, `node_id`, `row_number`,
        `label`) ; `work_package_task` et
        `order_item_tasks` pour une fusion qui sortirait la tâche d'un poste du sous-arbre de la
        tâche de son lot (`ORDER_ITEM_OUTSIDE_WORK_PACKAGE`, `mergeCostStructure`, WF-PLA-0170)
        : la tâche du lot et celles des postes qui en sortiraient, nœuds de la structure
        principale, chacune par son nœud et son libellé (`node_id`, `label`), comme les tâches de
        `TASK_WITHOUT_WORKING_HOURS` — « l'échec nomme ce qui a échoué » (WF-IHM-0080 ;
        EP-14/L42k) —, et de même pour le fichier d'import qui serait rejeté entier pour ce motif
        (`ImportReport.refusals`) et le compte rendu préalable d'une fusion
        (`StructureMergeReport.refusals` ; EP-14/L42s) ; `task` pour un planning qui porterait la
        durée du projet au-delà de quinze ans (`PROJECT_HORIZON_EXCEEDED`, WF-PLA-0150) : la tâche
        en cause, par son nœud et son libellé (`node_id`, `label`), le nœud nul pour une tâche que
        le fichier ou le différentiel crée ; pour une fusion (`mergeCostStructure`,
        `StructureMergeReport.refusals` ; #788), la tâche de la structure fusionnée qui finit la
        dernière, hors récapitulatives, qui tirent leurs dates de leurs subordonnées (WF-PLA-0040),
        la première dans l'ordre du plan à égalité — et, pour une saisie qui déplace une date
        (`updateTaskFacet`, `setPredecessors`, `createNode`, `moveNodes` ; EP-15/US-0460), la
        tâche que la saisie écrit : celle dont la durée, les dates ou les prédécesseurs se
        saisissent, celle que la création ajouterait, nommée par le libellé envoyé et son nœud nul,
        la tâche déplacée ou celle qui reçoit la ligne déplacée ; `cycle` pour des prédécesseurs
        qui fermeraient une boucle de liaisons (`LINK_CYCLE`, `setPredecessors`, WF-PLA-0030) : les
        tâches de la boucle, chacune par son nœud et son libellé (`node_id`, `label`), de celle
        dont les prédécesseurs se saisissent au prédécesseur envoyé qui la suit déjà, chacune
        précédant la suivante — « la raison en est nommée à l'utilisateur », la grille, filtrée,
        pouvant ne pas les lire ; quand plusieurs prédécesseurs envoyés ferment une boucle, la
        plus courte est rendue, puis, à longueur égale, la première dans l'ordre des liaisons, et
        une tâche donnée comme son propre prédécesseur rend la boucle de cette seule tâche ; et
        pour un déplacement ou une mise en retrait qui fermerait une boucle à travers la
        récapitulative qui recevrait le nœud (`moveNodes`, WF-PLA-0030, WF-PLA-0040 ; #1164,
        #1167) — une récapitulative couvre ses subordonnées : ce qui la précède les
        précède, ce qui la suit les suit —, les tâches de la chaîne de liaisons qui mène de cette
        récapitulative, ou de l'un de ses ancêtres, à la tâche qu'elle recevrait ou à l'une de
        ses subordonnées, ou de celles-ci à celle-là, chacune précédant la suivante : la plus
        courte, puis, à longueur égale, celle qui part de l'ancêtre le plus proche, puis de la
        tâche reçue et de ses subordonnées dans l'ordre du plan ; pour une sélection, jugée sur la
        structure que le déplacement laisserait, tous ses nœuds déplacés, la boucle que ferme le
        premier nœud en cause dans l'ordre du plan de la structure lue — non dans celui de
        `node_ids`, qui ne règle que leur placement (`NodeMove` ; #1169) ; et pour une fusion qui
        fermerait une boucle dans la structure principale (`mergeCostStructure`,
        `StructureMergeReport.refusals`, WF-PLA-0030, WF-REV-0050 ; #788), les tâches de la boucle
        que porterait la structure fusionnée, chacune par son nœud de la structure principale et
        son libellé, le nœud nul pour une tâche que le différentiel ajoute, de la première dans
        l'ordre du plan de cette structure à celle qui la précède, chacune précédant la suivante —
        la plus courte quand il y en a plusieurs, puis celle dont la première tâche vient d'abord
        dans l'ordre du plan. Une chaîne d'une seule
        liaison est la liaison d'une récapitulative et de sa subordonnée : `LINK_FORBIDDEN`, sans
        paramètre pour une saisie ou un déplacement ; pour une fusion qui ferait naître cette liaison
        (`mergeCostStructure`, `StructureMergeReport.refusals`, WF-PLA-0030 ; #1582), `link`
        nomme les deux tâches, la récapitulative d'abord, chacune par son nœud de la structure
        principale et son libellé, le nœud nul pour une tâche que le différentiel ajoute —
        `tasks` ne convient pas, qui exige un projet et un nœud. Une chaîne, d'un déplacement comme de prédécesseurs, suit les liaisons et
        traverse la hiérarchie, une récapitulative couvrant ses subordonnées : d'une tâche
        atteinte à son début à l'une de ses subordonnées, que ce qui la précède précède, et d'une
        tâche à sa récapitulative, que ce qui la suit suit ; elle nomme chaque tâche qu'elle
        traverse, la récapitulative et la subordonnée — une boucle P → W, W récapitulative d'une
        tâche Z qui précède M, M déplacée sous P, nomme P, W, Z et M (#1169). Entre deux chaînes
        aussi courtes, celle qui est rendue prend, à chaque tâche, ses liaisons avant la
        hiérarchie, et ses subordonnées avant sa récapitulative.
        Les paramètres d'un motif par champ sont dans
        `fields[].params` : ainsi `conflicting_object_id` et
        `conflicting_object_label`, le nœud et le libellé de la tâche qui porte déjà le lot ou
        le poste qu'une autre voudrait porter (`WORK_BREAKDOWN_ITEM_ALREADY_ATTACHED`,
        WF-PLA-0170 ; EP-14/L42k) ; `work_package_task` et `order_item_tasks`, la tâche du lot
        et celles de ses postes qui sortiraient de son sous-arbre, chacune par son nœud et son
        libellé (`node_id`, `label`), comme l'échec d'une fusion (`ORDER_ITEM_OUTSIDE_WORK_PACKAGE`,
        `updateTaskFacet`, `createNode`, `moveNodes`, WF-PLA-0170 ; EP-14/L42s) — le nœud nul
        pour la tâche que `createNode` crée, nommée par le libellé envoyé, et les mêmes paramètres
        au motif d'une cellule `work_breakdown` collée (`PasteRejection.params`) ; `task_node_id`,
        dans
        `fields[].params`, la tâche
        qu'une réestimation terminerait sans sa date de terminaison (`COMPLETION_DATE_REQUIRED`,
        WF-RAE-0040) ; `subproject`, dans `fields[].params`, le sous-projet qu'une ligne d'une
        tâche démarrée ou terminée ne peut pas quitter, parce qu'il a reçu des coûts réels, par
        son identifiant et son libellé (`subproject_id`, `label` ; `SUBPROJECT_HAS_ACTUAL_COSTS`,
        WF-PRJ-0050), et le même paramètre au motif d'une cellule de sous-projet collée
        (`PasteRejection.params`) ou d'une ligne d'import rejetée (`ImportRejection.params`,
        WF-INTF-0100, WF-INTF-0120) ; `location`, l'emplacement externe des sauvegardes que l'installation ne
        déclare pas (`UNKNOWN_EXTERNAL_BACKUP_LOCATION`, WF-ADM-0170) ; `conflicting_object_id`,
        dans `fields[].params`, l'objet qui porte déjà la valeur unique d'un champ
        (`ALREADY_EXISTS`, WF-REF-0030, WF-REF-0040), et `conflicting_object_label`, à côté de
        lui, son libellé, quand le formulaire ne connaît pas la liste qui le porte : le code d'un
        projet (WF-PRJ-0010), celui d'un sous-projet (WF-PRJ-0050), celui d'un nœud
        d'organisation (WF-REF-0070) et celui d'un rôle de ressource (WF-REF-0090) ;
        `backup_version` et `installed_version`, dans `params`, la version de l'application qui a
        pris la sauvegarde et celle de l'installation qui refuse de la restaurer
        (`BACKUP_FROM_NEWER_VERSION`, motif de l'échec de la tâche `restore`, WF-ADM-0160) ;
        `risk`, dans `fields[].params`, le risque dont une ligne de provision déplacée dans
        la grille relève, par son identifiant et son libellé (`risk_id`, `label` ;
        `PROVISION_LINE_MOVED_BY_RISK`, `moveNodes`, WF-RIS-0010, #1227) : la ligne se déplace
        par le formulaire du risque ;
        `date` et `next_working_day`, dans `fields[].params`, la date d'une tâche manuelle
        envoyée un jour sans aucune heure travaillée au calendrier de la tâche, et le jour
        travaillé suivant, que la saisie peut prendre — « le refus nomme le jour travaillé
        suivant » (`NON_WORKING_DAY`, `updateTaskFacet`, WF-PLA-0020 ; #1271) —, et les mêmes
        paramètres au signalement d'une telle date importée (`ImportSignal.params`) ;
        `missing_parts`, les numéros, en tableau d'entiers, des morceaux qu'un dépôt par morceaux
        n'a pas reçus (`completeChunkedUpload`, `STATE_FORBIDS_OPERATION`, WF-ADM-0160) ;
        `max_length`, dans `fields[].params`, le plus grand nombre de caractères qu'admet le code
        d'un sous-projet trop long (`VALUE_TOO_LONG`, `31`, WF-PRJ-0050), et
        `forbidden_characters` ou `reserved_name`, ceux de `SUBPROJECT_CODE_INVALID` : les
        caractères interdits que porte le code, en tableau, chacun une fois dans l'ordre où il les
        porte, ou le nom réservé qu'il vaut, « Synthèse » ou « Hors sous-projet », tel que
        Waterfall l'écrit (`createSubproject`, `updateSubproject`, WF-PRJ-0050 ; EP-16/US-0610) ;
        `duplicate_of`, dans `fields[].params`, le pointeur de l'intitulé qu'un intitulé de la
        correspondance de l'extraction des coûts réels double (`DUPLICATE_COLUMN_LABEL`,
        `setActualCostMapping`, WF-REF-0190 ; EP-16/US-0620) ;
        `rows`, les rangs, en tableau d'entiers, des autres lignes du fichier qui portent la même
        pièce et le même poste qu'une ligne d'une extraction de coûts réels rejetée
        (`DUPLICATE_COST_LINE`, `ImportRejection.params`, WF-INTF-0140 ; EP-16/US-0630).
    fields:
      type: array
      description: >-
        Erreurs par champ, pour une entité refusée à la validation (422), ou par une unicité
        (409 `ALREADY_EXISTS`), chaque champ dont la valeur est déjà portée désigné. Une clé
        portée par le chemin, et non par le corps — la catégorie et l'année d'un taux horaire
        (`setHourlyRate`) —, n'a pas de champ à désigner : son `ALREADY_EXISTS` n'a pas de
        `fields`.
      items: { $ref: '#/FieldProblem' }
    correlation_id:
      type: string
      pattern: '^[A-Za-z0-9._-]{1,64}$'
      description: >-
        Identifiant de corrélation de la requête, repris dans les journaux (WF-OBS-0020) :
        engendré par la plateforme, jamais vide, et de ces seuls caractères — un identifiant
        repris d'un en-tête d'entrée qui ne les respecte pas est remplacé, pas transmis. Le
        front l'affiche comme référence d'une erreur inattendue, et peut le mettre tel quel
        dans un chemin ou un digest.

StateEnumeration:
  type: string
  enum: [ProjectState]
  description: >-
    Le nom de l'énumération du contrat dont `Problem.params.state` est une valeur, rendu avec
    lui, pour que le front nomme l'état par son propre catalogue (WF-ARC-0110). Une
    énumération qu'un refus nommerait de plus est une modification du contrat.

ErrorCode:
  type: string
  description: >-
    Catalogue des codes d'erreur : chaque refus que l'API peut opposer, et chaque
    motif de rejet d'une ligne collée ou importée, y a son code, que le front rend
    en phrase par son propre catalogue de textes (WF-ARC-0110). Un code nouveau est
    une modification du contrat ; le front n'en rencontre aucun qu'il ne sache
    rendre. Les paramètres qu'un code porte sont nommés par `Problem.params`.
  enum:
    # 400 — requête mal formée ou confirmation absente.
    - MALFORMED_REQUEST
    - CONFIRMATION_REQUIRED
    # 401 — aucun jeton valide (WF-SEC-0020) ; ou compte désactivé (WF-ADM-0060), ou que
    # Waterfall n'admet pas, que le front distingue de l'absence de jeton pour ne pas renvoyer à
    # une connexion qui bouclerait. Un jeton expiré est `SESSION_EXPIRED` ; un jeton d'une
    # connexion antérieure à la dernière fermeture des sessions du compte, `SESSION_REVOKED`, sur
    # lequel seul le front redemande les identifiants (#855).
    - SESSION_REQUIRED
    - SESSION_EXPIRED
    - SESSION_REVOKED
    - ACCOUNT_DEACTIVATED
    - ACCOUNT_NOT_ADMITTED
    # 403 — permission présente, condition manquante : `params.missing_permission`
    # ou `params.missing_condition` la nomme (WF-ADM-0110, WF-IHM-0090). Une action
    # structurante ou le paramétrage du projet exigent la qualité de chef de projet
    # (WF-PRJ-0060).
    - PERMISSION_MISSING
    - NOT_CONTRIBUTOR
    - NOT_PROJECT_MANAGER
    - PROJECT_TERMINAL
    - REVISION_MARKED
    # 404 — objet inexistant ou invisible, sans distinction (WF-ADM-0110).
    - NOT_FOUND
    # 409 — l'état courant interdit l'opération ; `params` nomme l'objet ou l'état.
    - STATE_FORBIDS_OPERATION
    # Une valeur unique déjà portée par un autre objet ; aussi motif par champ du 409 qui dit
    # quel champ la porte, `fields[].params.conflicting_object_id` nommant l'objet qui la porte
    # (WF-REF-0030, WF-REF-0040) — sans `fields` quand la clé est celle du chemin, le taux d'une
    # catégorie et d'une année (`setHourlyRate`).
    - ALREADY_EXISTS
    - CURRENT_REVISION_EXISTS
    - REFERENCE_NOT_CORRECTABLE
    - UNDO_CONFLICT
    # Des rôles envoyés, ou un rôle modifié, qui retireraient au dernier compte actif qui les
    # porte la permission de modifier les comptes ou les rôles d'habilitation (WF-ADM-0120) ;
    # la désactivation de ce compte, que sa commande dit d'avance, est `STATE_FORBIDS_OPERATION`.
    - LAST_ADMINISTRATOR
    # Une liste de contributeurs qui ne garderait aucun chef de projet (`setContributors`,
    # WF-PRJ-0060) ; la suppression d'un sous-projet auquel des coûts réels sont imputés, qu'une
    # révision marquée cite ou que portent des lignes de devis de la révision en cours, que sa
    # commande dit d'avance, est `STATE_FORBIDS_OPERATION`.
    - LAST_PROJECT_MANAGER
    - ACCESS_ROLE_IN_USE
    - TASK_ALREADY_STARTED
    - TASK_COMPLETED
    # Un projet créé alors que le référentiel minimal est incomplet ;
    # `params.missing_prerequisites` nomme chaque prérequis (WF-CYC-0120).
    - REFERENCE_INCOMPLETE
    # 412 — `lock_version` périmé ; `params.expected_lock_version`, la version courante de
    # l'objet que le chemin nomme (WF-IHM-0110).
    - STALE_LOCK_VERSION
    # 413 — fichier au-delà de la taille admise (WF-CMP-0020).
    - FILE_TOO_LARGE
    # 422 — règle métier ; `params` ou `fields` localise le refus.
    - VALIDATION_FAILED
    - COMPUTED_VALUE
    - SUMMARY_TASK_DERIVED
    # Des prédécesseurs qui fermeraient une boucle de liaisons, `params.cycle` nommant ses
    # tâches, ou une liaison entre une récapitulative et l'une de ses subordonnées, sans
    # paramètre (`setPredecessors`, WF-PLA-0030, WF-PLA-0040 ; EP-15/US-0460) ; de même un
    # déplacement ou une mise en retrait qui ferait d'une tâche la récapitulative d'une tâche
    # qui lui est liée, ou fermerait une boucle à travers elle (`moveNodes` ; #1164). Une
    # création ne porte aucune liaison : `createNode` ne rend ni l'un ni l'autre (#1167).
    # `LINK_CYCLE` est aussi le code d'une fusion qui échoue sur une boucle de liaisons, et un
    # motif de son compte rendu préalable (`mergeCostStructure`, `StructureMergeReport.refusals`,
    # WF-REV-0050 ; #788) ; `LINK_FORBIDDEN` de même pour une liaison qu'elle ferait naître
    # entre une récapitulative et sa subordonnée, `params.link` nommant les deux tâches
    # (WF-PLA-0030 ; #1582).
    - LINK_CYCLE
    - LINK_FORBIDDEN
    - RESOURCE_ROLE_REQUIRED
    # Une catégorie hors main-d'œuvre là où il en faut une : le taux d'une catégorie
    # (`setHourlyRate`, WF-REF-0050), et le motif par champ de la catégorie d'un rôle de ressource
    # (`/cost_category_id`, WF-REF-0090).
    - LABOUR_CATEGORY_REQUIRED
    - HOURLY_RATE_MISSING
    - PROJECT_CODE_REQUIRED
    - PASTE_TOO_WIDE
    # Le motif d'un bloc collé dont la cellule visée est sur un nœud qu'un différentiel retire,
    # qui n'accepte aucun champ : le bloc est refusé entier, dit une fois sur sa première ligne et
    # la colonne visée (`PasteRejection`, `PastePreview`, WF-IHM-0050 ; #1361).
    - PASTE_TARGET_REMOVED
    - FILE_FORMAT_UNREADABLE
    # Une saisie de rôle ou de calendrier qui laisserait une tâche sans aucune heure travaillée
    # dans la semaine ; aussi motif de rejet d'une ligne collée ou importée (WF-PLA-0010).
    - TASK_WITHOUT_WORKING_HOURS
    # Motifs par champ, par ligne collée ou importée (`fields`, `PastePlan`,
    # `ImportRejection`).
    - VALUE_REQUIRED
    - VALUE_TOO_LONG
    - VALUE_OUT_OF_RANGE
    - NUMBER_INVALID
    - DATE_INVALID
    - UNKNOWN_COST_CATEGORY
    # Une nature de coût que le référentiel n'a pas, donnée à une catégorie (`/cost_type_id`,
    # WF-REF-0040).
    - UNKNOWN_COST_TYPE
    # Un calendrier que le référentiel n'a pas, donné pour rattachement d'un rôle
    # (`/calendar_id`, WF-REF-0090) ; un nœud d'organisation qu'il n'a pas est
    # `UNKNOWN_ORG_NODE`, plus bas.
    - UNKNOWN_CALENDAR
    - UNKNOWN_RESOURCE_ROLE
    # Une personne du fournisseur d'identité, ou un compte qu'il tient, sans adresse : la lecture
    # des comptes la laisse telle quelle et le dit (`IdentitySyncReport.skipped`, #918).
    - EMAIL_MISSING
    # Motifs par champ des écritures d'un compte (`createUser`, `updateUser`,
    # `setUserAccessRoles`) : un rôle d'habilitation ou un nœud d'organisation que le serveur n'a
    # pas — ce dernier aussi donné pour parent d'un nœud (`/parent_id`) ou pour rattachement d'un
    # rôle de ressource (`/org_node_id`, WF-REF-0070, WF-REF-0090) —, et une valeur différente de
    # celle du compte pour un champ d'identité d'un compte qui ne vient pas de Waterfall
    # (`origin` autre que `local`), que le fournisseur tient ; envoyer le champ inchangé n'est
    # pas refusé (WF-ADM-0050, WF-ADM-0090, WF-ADM-0030).
    - UNKNOWN_ACCESS_ROLE
    - UNKNOWN_ORG_NODE
    - FIELD_READ_ONLY
    - UNKNOWN_SUBPROJECT
    - UNKNOWN_TASK
    - INACTIVE_REFERENCE_OBJECT
    # Un nœud d'organisation déplacé sous lui-même ou sous l'un de ses descendants : l'arbre
    # aurait une boucle (`/parent_id`, `updateOrgNode`, WF-REF-0070).
    - ORG_NODE_CYCLE
    # Le nœud après lequel une création ou un déplacement se place, qui n'est pas un frère sous le
    # parent visé : un nœud d'un autre parent, l'un des nœuds déplacés, ou un nœud que la
    # structure n'a pas (`/after_node_id`, `createNode`, `moveNodes` ; #1183).
    - NODE_NOT_SIBLING
    # Une entrée `milestone_tracking` envoyée pour une tâche qui n'est pas un jalon : le suivi
    # temps/temps est celui des jalons (`/entries/<n>/kind`, `setNodeTracking`, WF-PLA-0060 ;
    # #1159).
    - MILESTONE_REQUIRED
    # Un dépôt désigné pour un autre usage que le sien : un import ouvert sur une sauvegarde
    # déposée pour une restauration, ou une restauration sur un dépôt d'import (`uploadFile`,
    # `FileUploadPurpose`).
    - UPLOAD_PURPOSE_MISMATCH
    # Une sauvegarde d'une version plus récente que l'installation, que la tâche `restore`
    # refuse avant la maintenance (`startRestore`, WF-ADM-0160) : le motif de l'échec de la tâche
    # (`BackgroundTaskRef.problem`), `params.backup_version` et `params.installed_version`.
    - BACKUP_FROM_NEWER_VERSION
    # Une tâche que la restauration a trouvée en file ou en cours dans la base restaurée : elle
    # échoue sans reprendre, pour qu'une sauvegarde en cours au moment du vidage ne se relance pas
    # et n'écrase pas son archive (`startRestore`, #892) ; le motif de l'échec de la tâche.
    - TASK_INTERRUPTED_BY_RESTORE
    # Une catégorie de type provision pour risques donnée à une ligne saisie : seule la
    # déclaration d'un risque crée une ligne de provision (WF-DEV-0020, WF-RIS-0010).
    - PROVISION_CATEGORY_RESERVED
    # Une catégorie d'une nature d'un autre type que provision pour risques désignée pour la
    # provision d'un risque (`/provision_cost_category_id`, `createRisk`, `updateRisk`,
    # `reviewRisk`, WF-RIS-0010).
    - PROVISION_CATEGORY_REQUIRED
    # Une ligne de provision déplacée dans la grille : elle se déplace par le formulaire de son
    # risque, qui désigne sa tâche (`/node_ids/<n>`, `moveNodes`, `fields[].params.risk`,
    # WF-RIS-0010 ; #1227).
    - PROVISION_LINE_MOVED_BY_RISK
    # Une réestimation qui termine la tâche sans la date de terminaison que la validation
    # demande (`setLineRemaining`, WF-RAE-0040, WF-PLA-0130).
    - COMPLETION_DATE_REQUIRED
    # Un compte que l'installation n'a pas, ou un compte désactivé inscrit ou changé de qualité,
    # dans une liste de contributeurs (`/contributors/<n>/user_id`, `setContributors`,
    # WF-PRJ-0060, WF-ADM-0060).
    - UNKNOWN_USER
    - USER_INACTIVE
    # Une copie externe des sauvegardes vers un emplacement que l'installation ne déclare pas
    # (`setBackupSchedule`, `BackupExternalCopy.location`, WF-ADM-0170) ; `params.location`
    # le nomme.
    - UNKNOWN_EXTERNAL_BACKUP_LOCATION
    # Un chemin dans un emplacement externe qui n'est pas relatif, ou qui en sortirait
    # (`ExternalBackupPath`, WF-ADM-0170).
    - PATH_INVALID
    # Une borne de la matrice de risques qui n'est pas strictement supérieure à la précédente
    # (`RiskMatrixSettings`, WF-REF-0160) ; le pointeur désigne la borne qui rompt l'ordre.
    - BOUNDS_NOT_ORDERED
    # Un seuil d'alerte qui n'est pas strictement inférieur au seuil de vigilance de son indice
    # (`IndexThresholds`, WF-REF-0170) ; le pointeur désigne le seuil d'alerte.
    - THRESHOLD_NOT_BELOW_WATCH
    # Un seuil d'indice qui n'est pas strictement compris entre 0 et 1 (`IndexThreshold`,
    # WF-REF-0170) ; le pointeur désigne le seuil, sans paramètre.
    - THRESHOLD_NOT_BETWEEN_ZERO_AND_ONE
    # Une constante de conversion des unités de durée nulle (`DurationUnitsWrite`,
    # `setDurationUnits`, WF-PLA-0160) : elle est strictement positive ; le pointeur désigne la
    # constante, sans paramètre.
    - DURATION_UNIT_NOT_POSITIVE
    # Motifs par champ du rattachement d'une tâche à un lot ou à un poste du lotissement
    # (`TaskFacetUpdate`, WF-PLA-0170) ; le premier aussi d'un identifiant que la saisie du
    # lotissement envoie et qu'il n'a pas (`setWorkBreakdown`) ; `ORDER_ITEM_OUTSIDE_WORK_PACKAGE`
    # aussi d'un déplacement (`moveNodes`) qui sortirait la tâche d'un poste du sous-arbre de
    # celle de son lot, le motif qui rejette entier un fichier d'import (`ImportReport.refusals`,
    # EP-14/L42s), et le code d'une fusion qui échoue pour ce motif (`mergeCostStructure`) — une
    # saisie du
    # lotissement qui range un poste sous un autre lot retire le rattachement, sans refus
    # (`setWorkBreakdown`, EP-14/L42k). `WORK_BREAKDOWN_MAIN_STRUCTURE_ONLY` refuse un
    # rattachement posé sur une tâche d'un différentiel ou du devis propre d'un risque, qui n'en
    # portent pas (EP-14/L42k). `DUPLICATE_WORK_BREAKDOWN_ITEM` refuse, dans une saisie du
    # lotissement, un identifiant envoyé une seconde fois, chaque occurrence après la première
    # (`setWorkBreakdown`, EP-14/L42k).
    - UNKNOWN_WORK_BREAKDOWN_ITEM
    - WORK_BREAKDOWN_ITEMS_EXCLUSIVE
    - WORK_BREAKDOWN_ITEM_ALREADY_ATTACHED
    - ORDER_ITEM_OUTSIDE_WORK_PACKAGE
    - WORK_BREAKDOWN_MAIN_STRUCTURE_ONLY
    - DUPLICATE_WORK_BREAKDOWN_ITEM
    # Un planning qui porterait la durée du projet, de la date de début de sa première tâche à la
    # date de fin de sa dernière, au-delà de quinze ans ; le motif qui rejette entier un fichier
    # d'import, `params.task` nommant la tâche en cause (`ImportReport.refusals`, WF-PLA-0150 ;
    # EP-14/L42s), et le refus, par 422, d'une saisie qui déplace une date (`updateTaskFacet`,
    # `setPredecessors`, `createNode`, `moveNodes` ; EP-15/US-0460) ; aussi le code d'une fusion
    # qui échoue pour ce motif, et un motif de son compte rendu préalable (`mergeCostStructure`,
    # `StructureMergeReport.refusals`, WF-REV-0050 ; #788).
    - PROJECT_HORIZON_EXCEEDED
    # Un champ que le nœud n'accepte pas, ni saisi ni calculé pour lui (`editable_fields`) : le
    # délai de paiement d'une ligne de provision, qui n'en porte pas (WF-DEV-0020), un champ
    # d'une autre nature de ligne (`EstimateLineWrite`, `EstimateLineUpdate`), la durée d'un
    # jalon (`TaskFacetUpdate`), et le motif d'une cellule collée sur une telle colonne
    # (`PastePreview` ; EP-14/L42s), sauf le sous-projet d'une ligne qui ne peut pas le quitter,
    # refusé par `SUBPROJECT_HAS_ACTUAL_COSTS`.
    - FIELD_NOT_ACCEPTED
    # Une date d'une tâche manuelle sur un jour sans aucune heure travaillée au calendrier
    # applicable de la tâche (WF-PLA-0020, WF-PLA-0010 ; #1271, #1289) : refusée à la saisie
    # (`/start/date` ou `/finish/date`, `updateTaskFacet` ; `/task/start/date` ou
    # `/task/finish/date`, `createNode`, #1345), rien n'est écrit ; gardée à l'import
    # d'un fichier MS Project, et signalée au compte rendu (`ImportReport.signals`).
    # `params.date` nomme la date, `params.next_working_day` le jour travaillé suivant.
    - NON_WORKING_DAY
    # Une ligne dont la tâche est démarrée ou terminée, passée hors d'un sous-projet qui a reçu
    # des coûts réels (`/subproject_id`, `updateEstimateLine`, WF-PRJ-0050) ;
    # `fields[].params.subproject` nomme ce sous-projet. Aussi le motif d'une cellule de
    # sous-projet collée sur une telle ligne (`PasteRejection`) et d'une ligne d'un devis ou
    # d'un reste à engager importée dans un autre sous-projet (`ImportRejection`, WF-INTF-0100,
    # WF-INTF-0120 ; C-359, #1152), `params.subproject` nommant le sous-projet.
    - SUBPROJECT_HAS_ACTUAL_COSTS
    # Le code d'un sous-projet qui ne peut pas nommer son onglet du fichier de reste à engager
    # (`/code`, `createSubproject`, `updateSubproject` ; WF-PRJ-0050, D-7, EP-16/US-0610) : il
    # porte un caractère interdit, `fields[].params.forbidden_characters` les nommant, ou vaut un
    # nom réservé, sans égard à la casse, `fields[].params.reserved_name` le nommant. Un code trop
    # long est `VALUE_TOO_LONG`, `fields[].params.max_length` à `31`.
    - SUBPROJECT_CODE_INVALID
    # Un intitulé de la correspondance de l'extraction des coûts réels qui en double un autre,
    # comparé sans égard à la casse, aux accents ni aux espaces en bout — d'une même colonne lue,
    # de deux colonnes lues, ou d'une colonne lue et d'une colonne conservée (`setActualCostMapping`,
    # WF-REF-0190 ; EP-16/US-0620) : au pointeur de l'intitulé en double,
    # `fields[].params.duplicate_of` le pointeur de celui qu'il double.
    - DUPLICATE_COLUMN_LABEL
    # Une ligne d'une extraction de coûts réels dont une autre ligne du même fichier porte la même
    # pièce et le même poste, nul compris (`ImportRejection`, WF-INTF-0140, D-4 ; EP-16/US-0630) :
    # chacune est rejetée, `params.rows` nommant les rangs des autres.
    - DUPLICATE_COST_LINE
    # 5xx — composant indisponible, `params.component` (WF-EXP-0040), ou erreur
    # inattendue, suivie par son `correlation_id` (WF-OBS-0020).
    - COMPONENT_UNAVAILABLE
    - INTERNAL_ERROR

FieldProblem:
  type: object
  required: [pointer, code]
  properties:
    pointer:
      type: string
      description: >-
        Le champ en défaut. Dans le corps de la requête, son pointeur JSON (RFC 6901),
        `/label` ou `/lines/2/amount` ; un paramètre de requête, sous `/query` suivi de son
        nom, `/query/revision_id` ; un paramètre de chemin qui n'est pas un identifiant,
        sous `/path` suivi de son nom, `/path/year` (un identifiant mal formé est un 404,
        comme un objet inexistant). Aucun champ du corps ne se nomme `query`, et le seul
        `path` d'un corps est un texte, sans champ sous lui : un pointeur ne désigne ainsi
        qu'un seul champ, quelle que soit l'opération.
    code: { $ref: '#/ErrorCode' }
    params:
      allOf: [{ $ref: '#/ProblemParams' }]
      description: >-
        Les paramètres du motif de ce champ, ceux de `Problem.params` (convention #293), typés de
        même (`ProblemParams`).

ProblemParams:
  type: object
  additionalProperties: true
  description: >-
    Les paramètres d'un refus (`Problem.params`), d'un motif par champ (`FieldProblem.params`), et
    du motif d'une ligne collée ou importée, d'un refus d'un compte rendu ou d'un signalement
    (`PasteRejection.params`, `ImportRejection.params`, `ReportRefusal.params`,
    `ImportSignal.params`), qui portent les paramètres de leur code dans un refus pour que la
    saisie, le collage et l'import se disent d'une même phrase (WF-ARC-0110). Ceux que plusieurs
    refus partagent sont déclarés ici, facultatifs et typés, chacun dans la forme que ses refus lui
    donnent ; les autres restent ouverts, décrits par `Problem.params` (#768, point 3 ; EP-16). Un
    schéma par code d'erreur a été écarté : il doublerait le catalogue (`ErrorCode`). `state` et
    `state_enum` voyagent toujours ensemble.
  properties:
    state_enum: { $ref: '#/StateEnumeration' }
    resource_roles:
      type: array
      description: >-
        Les rôles en cause, actifs ou désactivés, chacun par son identifiant, son code et son
        libellé, que l'auteur lise ou non les rôles (`STATE_FORBIDS_OPERATION`,
        `cost_type_without_role`, `cost_category_without_role`, WF-REF-0030, WF-REF-0040 ;
        EP-14/L42r) ; et ceux d'une ligne importée qui laisserait sa tâche sans heure travaillée
        (`TASK_WITHOUT_WORKING_HOURS`, `ImportRejection.params`, WF-PLA-0010 ; #768).
      items: { $ref: '#/ProblemResourceRole' }
    projects:
      type: array
      description: >-
        Les projets qu'une modification du référentiel laisserait avec une tâche sans heure
        travaillée, chacun par son libellé et son code, sans identifiant ni tâche
        (`TASK_WITHOUT_WORKING_HOURS`, `updateCalendar`, `setDefaultCalendar`,
        `updateResourceRole`, WF-PLA-0010, WF-ADM-0110).
      items: { $ref: '#/ProblemProject' }
    tasks:
      type: array
      description: >-
        Les tâches qu'une saisie d'une révision, une fusion, une ligne collée ou importée
        laisseraient sans heure travaillée (`TASK_WITHOUT_WORKING_HOURS`, WF-PLA-0010) : par leur
        projet, leur nœud et leur libellé pour une saisie, un collage ou une fusion ; par leur
        lignée et leur libellé au compte rendu d'un import, qui nomme ses objets ainsi
        (`ImportDifference`) et peut porter sur un projet sans révision en cours, dont aucun nœud
        n'existe encore (WF-INTF-0090 ; #768, point 2).
      items:
        anyOf:
          - $ref: '#/ProblemTask'
          - $ref: '#/ProblemImportedTask'
    estimate_lines:
      type: array
      description: >-
        Les lignes de devis de la révision en cours qui portent un sous-projet dont la suppression
        est refusée (`STATE_FORBIDS_OPERATION`, `subproject_without_estimate_lines`, WF-DAT-0080).
      items: { $ref: '#/ProblemEstimateLine' }
    subproject:
      allOf: [{ $ref: '#/ProblemSubproject' }]
      description: >-
        Le sous-projet qu'une ligne d'une tâche démarrée ou terminée ne peut pas quitter, parce
        qu'il a reçu des coûts réels (`SUBPROJECT_HAS_ACTUAL_COSTS`, dans `fields[].params`, le
        motif d'une cellule collée ou d'une ligne importée, WF-PRJ-0050).
    columns:
      type: array
      description: >-
        Les colonnes exigées de la correspondance de l'extraction des coûts réels qui n'ont aucun
        intitulé, dans l'ordre de la correspondance (`STATE_FORBIDS_OPERATION`,
        `actual_cost_mapping_complete`, `openImport`, WF-REF-0190).
      items: { $ref: schemas/reference.yaml#/ActualCostSourceColumn }
    missing_columns:
      type: array
      description: >-
        Les colonnes exigées qu'une extraction de coûts réels ne porte sous aucun de leurs
        intitulés, dans l'ordre de la correspondance (`FILE_FORMAT_UNREADABLE`, `openImport`,
        WF-REF-0190).
      items: { $ref: '#/ProblemMissingColumn' }
  dependentRequired:
    state: [state_enum]
    state_enum: [state]

ProblemResourceRole:
  type: object
  required: [resource_role_id, code, label]
  description: Un rôle de ressource nommé par un refus, actif ou désactivé (`ProblemParams.resource_roles`).
  properties:
    resource_role_id: { $ref: '#/Uuid' }
    code: { type: string }
    label: { type: string }

ProblemProject:
  type: object
  required: [project_label, project_code]
  description: Un projet nommé par un refus, sans identifiant (`ProblemParams.projects`).
  properties:
    project_label: { type: string }
    project_code:
      anyOf: [{ type: string }, { type: 'null' }]
      description: Nul pour un projet sans code.

ProblemTask:
  type: object
  required: [project_id, node_id, label]
  description: >-
    Une tâche nommée par le refus d'une saisie, d'un collage ou d'une fusion, l'auteur consultant
    son projet (`ProblemParams.tasks`).
  properties:
    project_id: { $ref: '#/Uuid' }
    node_id: { $ref: '#/Uuid' }
    label: { type: string }

ProblemImportedTask:
  type: object
  required: [lineage_id, label]
  description: >-
    Une tâche nommée par le motif d'une ligne importée (`ImportRejection.params.tasks`), par sa
    lignée, comme `ImportDifference` nomme les objets d'un import (#768, point 2).
  properties:
    lineage_id: { $ref: '#/Uuid' }
    label: { type: string }

ProblemEstimateLine:
  type: object
  required: [structure_id, structure_label, node_id, row_number, label]
  description: >-
    Une ligne de devis nommée par un refus (`ProblemParams.estimate_lines`) : sa structure et le
    libellé de celle-ci, son nœud, son numéro de ligne et son libellé.
  properties:
    structure_id: { $ref: '#/Uuid' }
    structure_label: { type: string }
    node_id: { $ref: '#/Uuid' }
    row_number: { type: integer, minimum: 1 }
    label: { type: string }

ProblemSubproject:
  type: object
  required: [subproject_id, label]
  description: Un sous-projet nommé par un refus (`ProblemParams.subproject`).
  properties:
    subproject_id: { $ref: '#/Uuid' }
    label: { type: string }

ProblemMissingColumn:
  type: object
  required: [column, labels]
  description: >-
    Une colonne exigée qu'une extraction de coûts réels ne porte pas, avec les intitulés que la
    correspondance déclare pour elle (`ProblemParams.missing_columns`).
  properties:
    column: { $ref: schemas/reference.yaml#/ActualCostSourceColumn }
    labels:
      type: array
      items: { type: string }

SortOrder:
  type: string
  enum: [asc, desc]
  description: Sens d'un tri demandé au serveur ; croissant par défaut.

PaginationMeta:
  type: object
  required: [limit, offset, total]
  properties:
    limit: { type: integer, minimum: 1, maximum: 500 }
    offset: { type: integer, minimum: 0 }
    total: { type: integer, minimum: 0 }

BackgroundTaskStatus:
  type: string
  enum: [queued, running, succeeded, failed]
  description: >-
    Où en est une tâche de fond : en file, en cours, aboutie ou échouée (WF-ARC-0090,
    WF-IHM-0080). Nommée pour filtrer la liste des tâches de l'appelant.

BackgroundTaskRef:
  type: object
  required: [task_id, kind, status]
  description: >-
    Référence d'une tâche de fond. Une requête qui déclenche un traitement long
    rend la main immédiatement en renvoyant cette référence (WF-ARC-0090, WF-IHM-0080).
  properties:
    task_id: { $ref: '#/Uuid' }
    kind:
      type: string
      description: >-
        Ce que la tâche fait. `backup` prend la sauvegarde des deux bases et la vérifie ;
        `restore` suit la restauration entière, de la mise en maintenance à sa levée : elle ne
        passe à `succeeded` qu'une fois la maintenance levée, et une restauration interrompue
        reprend depuis le début ; une archive d'une version plus récente que l'installation est
        refusée avant la maintenance, la tâche échouant par `BACKUP_FROM_NEWER_VERSION`
        (WF-ARC-0090, WF-ADM-0160) ; `identity_sync` lit les comptes du
        fournisseur d'identité (WF-ADM-0070).
      enum:
        - import_analysis
        - import_apply
        - revision_mark
        - structure_merge
        - risk_occurrence
        - export
        - backup
        - restore
        - identity_sync
    status: { $ref: '#/BackgroundTaskStatus' }
    progress:
      type: integer
      minimum: 0
      maximum: 100
    submitted_at: { $ref: '#/Timestamp' }
    finished_at:
      anyOf:
        - $ref: '#/Timestamp'
        - type: 'null'
    problem:
      anyOf:
        - $ref: '#/Problem'
        - type: 'null'
      description: Motif de l'échec, absent tant que la tâche n'a pas échoué.
    result_url:
      anyOf:
        - type: string
        - type: 'null'
      description: >-
        Où lire le résultat, lorsque la tâche en produit un. Celui d'une lecture des comptes
        (`identity_sync`) désigne le dernier compte rendu, qui n'est pas forcément celui de la
        tâche : une lecture achevée depuis l'a remplacé.
