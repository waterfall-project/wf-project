/me:
  get:
    operationId: getMe
    tags: [me]
    summary: Mon compte et mes préférences
    description: >-
      Le compte connecté, ses rôles, ses préférences d'affichage et ses permissions
      effectives (WF-ADM-0050, WF-ADM-0040, WF-ADM-0110). Les permissions sont évaluées à
      chaque requête, à partir des rôles que le compte porte en base : l'API ne tire du jeton
      que l'identité (WF-ARC-0030, WF-SEC-0020). Le front les lit pour savoir quoi présenter,
      sans qu'elles ne remplacent le refus que l'API oppose à un appel qu'il aurait envoyé
      malgré tout (WF-IHM-0090). Un compte inconnu de Waterfall — un compte de l'annuaire avant
      sa première lecture, ou une personne venue d'un fournisseur externe — est créé sans rôle à
      sa première requête, et n'a alors aucune permission (WF-ADM-0180). Un compte désactivé est
      refusé par 401 `ACCOUNT_DEACTIVATED` (WF-ADM-0060) ; un compte que Waterfall n'admet pas,
      par 401 `ACCOUNT_NOT_ADMITTED`.
    responses:
      '200':
        description: Compte courant.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/UserSelf }
            examples:
              witness: { $ref: ../../../fixtures/api/me.json }
              english: { $ref: ../../../fixtures/api/me_english.json }
              without_preferences: { $ref: ../../../fixtures/api/me_without_preferences.json }
              with_avatar: { $ref: ../../../fixtures/api/me_with_avatar.json }
              directory: { $ref: ../../../fixtures/api/me_directory.json }
              dark: { $ref: ../../../fixtures/api/me_dark.json }
              without_administration: { $ref: ../../../fixtures/api/me_without_administration.json }
              grid_settings: { $ref: ../../../fixtures/api/me_grid_settings.json }
              estimator: { $ref: ../../../fixtures/api/me_estimator.json }
              without_roles: { $ref: ../../../fixtures/api/me_without_roles.json }
              manager: { $ref: ../../../fixtures/api/me_manager.json }
              auditor: { $ref: ../../../fixtures/api/me_auditor.json }
      '401':
        description: >-
          Jeton absent, invalide ou expiré, comme la réponse commune `Unauthorized` le dit ; ou un
          compte désactivé (`ACCOUNT_DEACTIVATED`, WF-ADM-0060), ou que Waterfall n'admet pas
          (`ACCOUNT_NOT_ADMITTED`), que le front distingue pour ne pas renvoyer à une connexion
          qui bouclerait.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              session_required: { $ref: ../../../fixtures/api/session_required.json }
              session_expired: { $ref: ../../../fixtures/api/session_expired.json }
              session_revoked: { $ref: ../../../fixtures/api/session_revoked.json }
              deactivated: { $ref: ../../../fixtures/api/account_deactivated.json }
              not_admitted: { $ref: ../../../fixtures/api/account_not_admitted.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/me/sessions:
  delete:
    operationId: closeMySessions
    tags: [me]
    summary: Me déconnecter
    description: >-
      Ferme toutes les sessions du compte, sur tous ses postes, et non la seule du navigateur
      qui le demande : la déconnexion « sur tous ses postes » de WF-SEC-0020. L'API demande au
      fournisseur d'identité de fermer les sessions du compte, qui le notifie au front ; les
      jetons de ces sessions ne permettent plus d'agir (WF-SEC-0020, WF-ARC-0030). L'heure de
      la fermeture est notée avant l'appel au fournisseur : un jeton d'une connexion qui la
      précède est refusé par 401 `SESSION_REVOKED`, même si le fournisseur a manqué la
      fermeture, et la personne se reconnecte en redonnant ses identifiants (#855). La
      désactivation d'un compte et le retrait de tous ses rôles suivent le même chemin
      (`setUserActivation`, `setUserAccessRoles`).
    responses:
      '204':
        description: Sessions du compte fermées.
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/me/preferences:
  patch:
    operationId: updateMyPreferences
    tags: [me]
    summary: Modifier mes préférences d'affichage
    description: >-
      Préférences personnelles, cantonnées à la présentation ; nul ne modifie celles
      d'un autre (WF-ADM-0040). La langue en fait partie et s'applique sans
      reconnexion (WF-INTF-0160), comme le nombre de lignes par page de chaque table plate
      (`GridPreferences.page_size`, WF-IHM-0060), la disposition de chaque chronologie en
      frise (`timelines`, WF-PLA-0140) et l'état replié ou déplié de chaque graphique
      (`charts`, EP-15/US-0550). Le front écrit avec une grille les colonnes qu'elle offrait
      (`GridPreferences.known_columns`), pour qu'une colonne reçue depuis prenne ce que la
      grille lui donne par défaut (EP-16/US-0650). Le choix d'états de la liste des projets de
      l'accueil, différent du défaut de l'écran — Chiffrage et En cours —, se garde dans la
      grille de cette liste, `projects`, comme tout filtre d'une grille : `filters.states`, les
      états choisis tels que l'adresse les écrit (`GridPreferences.filters` ; #1401).
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/access.yaml#/DisplayPreferences }
    responses:
      '200':
        description: Préférences enregistrées.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/DisplayPreferences }
            examples:
              witness: { $ref: ../../../fixtures/api/preferences.json }
              dark: { $ref: ../../../fixtures/api/preferences_dark.json }
              page_size: { $ref: ../../../fixtures/api/preferences_page_size.json }
              project_states: { $ref: ../../../fixtures/api/preferences_project_states.json }
              timeline_lanes: { $ref: ../../../fixtures/api/preferences_timeline_lanes.json }
              risk_matrix_unfolded: { $ref: ../../../fixtures/api/preferences_risk_matrix_unfolded.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant le champ en défaut. Une largeur de colonne plus
          étroite que la plus petite admise, vingt points (`GridPreferences`) :
          `/grids/<grille>/column_widths/<colonne>` par `VALUE_OUT_OF_RANGE`,
          `fields[].params.minimum` à `20`, la seule borne franchie, comme toute borne d'une
          écriture (WF-IHM-0060). Un couloir de chronologie négatif (`TimelinePreferences`) :
          `/timelines/<chronologie>/lanes/<tâche>` par `VALUE_OUT_OF_RANGE`,
          `fields[].params.minimum` à `0`. Un nombre de lignes par page autre que 10, 25, 50 ou
          100 (`GridPreferences`, C-351) : `/grids/<grille>/page_size` par `VALUE_OUT_OF_RANGE`,
          sans paramètre. Une préférence plus grande que ses bornes — plus de cent grilles, de
          cent chronologies ou de cent graphiques, un nom de grille, de colonne, de filtre, de
          chronologie, de tâche ou de graphique de plus de 64 caractères, plus de 64 colonnes masquées ou connues, largeurs ou tâches placées,
          plus de 20 filtres, un filtre de plus de 500 caractères (`DisplayPreferences`, #874) — :
          `VALUE_TOO_LONG`, un nom trop long au pointeur de l'objet qui le porte. Les cent grilles,
          chronologies et graphiques bornent aussi ce que les préférences gardent, une fois la
          modification fusionnée à ce qu'elles étaient : une modification qui porterait `grids`,
          `timelines` ou `charts` au-delà de cent entrées est refusée sur `/grids`, `/timelines`
          ou `/charts` par `VALUE_TOO_LONG` (#1235) ; une modification qui ne les accroît pas ne l'est jamais pour
          leur taille. Rien n'est enregistré dans Waterfall. Une réserve : ce refus au-delà de
          cent entrées, qui se juge sur les préférences du compte verrouillé, vient après que la
          langue envoyée a été transmise au fournisseur d'identité (WF-INTF-0160), qui a pu la
          prendre ; choisir de nouveau la langue affichée répare le désaccord.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              column_width_out_of_range: { $ref: ../../../fixtures/api/preferences_column_width_out_of_range.json }
              lane_out_of_range: { $ref: ../../../fixtures/api/preferences_lane_out_of_range.json }
              page_size_out_of_range: { $ref: ../../../fixtures/api/preferences_page_size_out_of_range.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/me/avatar:
  put:
    operationId: putMyAvatar
    tags: [me]
    summary: Déposer ou remplacer mon avatar
    description: >-
      L'avatar est propre à l'utilisateur, qui le gère seul, et il est conservé en base
      avec le compte (WF-ADM-0080, §4.4.1). Sa taille est bornée par l'installation :
      `Installation.avatar_max_bytes` (`getInstallation`, lisible sans session) dit la borne,
      au-delà de laquelle l'image est refusée par 413, `FILE_TOO_LARGE` ; elle ne dépasse
      jamais 8 Mio. Un type annoncé (`Content-Type`) autre que `image/png` ou `image/jpeg`, ou
      un corps vide, est refusé par 400 `MALFORMED_REQUEST` ; un contenu qui n'est ni un PNG ni
      un JPEG, par 422 `VALIDATION_FAILED` au pointeur `""`, le corps entier. Seule la
      signature du contenu fait le type gardé : un JPEG annoncé PNG est enregistré en
      `image/jpeg`. Avant l'amorçage de l'installation (WF-EXP-0020), l'opération répond 503
      `COMPONENT_UNAVAILABLE`, `component` à `database`.
    requestBody:
      required: true
      content:
        image/png:
          schema: { type: string, format: binary }
        image/jpeg:
          schema: { type: string, format: binary }
    responses:
      '204':
        description: Avatar enregistré.
      '400':
        description: >-
          Un type annoncé autre que `image/png` ou `image/jpeg`, ou un corps vide :
          `MALFORMED_REQUEST` ; l'avatar du compte n'est pas touché.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              empty_body: { $ref: ../../../fixtures/api/avatar_malformed.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '413':
        description: >-
          Image au-delà de `Installation.avatar_max_bytes` : `FILE_TOO_LARGE`, refusée avant
          d'être lue (WF-ADM-0080, WF-CMP-0020).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              too_large: { $ref: ../../../fixtures/api/avatar_too_large.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  delete:
    operationId: deleteMyAvatar
    tags: [me]
    summary: Retirer mon avatar
    description: >-
      Le compte retrouve son avatar par défaut (WF-ADM-0080).
    responses:
      '204':
        description: Avatar retiré ; le compte s'affiche avec une image par défaut (WF-ADM-0080).
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
