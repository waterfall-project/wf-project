/me:
  get:
    operationId: getMe
    tags: [me]
    summary: My account and my preferences
    description: >-
      The signed-in account, its roles, its display preferences and its effective
      permissions (WF-ADM-0050, WF-ADM-0040, WF-ADM-0110). The permissions are evaluated on
      each request, from the roles the account holds in the database: the API takes only the
      identity from the token (WF-ARC-0030, WF-SEC-0020). The front reads them to know what to
      present, without their replacing the refusal the API opposes to a call it would have sent
      all the same (WF-IHM-0090). An account unknown to Waterfall — a directory account before
      its first read, or a person coming from an external provider — is created without a role
      on its first request, and then has no permission (WF-ADM-0180). A deactivated account is
      refused with 401 `ACCOUNT_DEACTIVATED` (WF-ADM-0060); an account that Waterfall does not
      admit, with 401 `ACCOUNT_NOT_ADMITTED`.
    responses:
      '200':
        description: Current account.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/UserSelf }
            examples:
              witness: { $ref: ../../../fixtures/api/me.json }
              english: { $ref: ../../../fixtures/api/me_english.json }
              without_preferences: { $ref: ../../../fixtures/api/me_without_preferences.json }
              with_avatar: { $ref: ../../../fixtures/api/me_with_avatar.json }
              directory: { $ref: ../../../fixtures/api/me_directory.json }
              dark: { $ref: ../../../fixtures/api/me_dark.json }
              without_administration: { $ref: ../../../fixtures/api/me_without_administration.json }
              grid_settings: { $ref: ../../../fixtures/api/me_grid_settings.json }
              estimator: { $ref: ../../../fixtures/api/me_estimator.json }
              without_roles: { $ref: ../../../fixtures/api/me_without_roles.json }
              manager: { $ref: ../../../fixtures/api/me_manager.json }
              auditor: { $ref: ../../../fixtures/api/me_auditor.json }
      '401':
        description: >-
          Token missing, invalid or expired, as the shared response `Unauthorized` says; or an
          account deactivated (`ACCOUNT_DEACTIVATED`, WF-ADM-0060), or that Waterfall does not
          admit (`ACCOUNT_NOT_ADMITTED`), which the front tells apart so as not to send back to a
          sign-in that would loop.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              session_required: { $ref: ../../../fixtures/api/session_required.json }
              session_expired: { $ref: ../../../fixtures/api/session_expired.json }
              session_revoked: { $ref: ../../../fixtures/api/session_revoked.json }
              deactivated: { $ref: ../../../fixtures/api/account_deactivated.json }
              not_admitted: { $ref: ../../../fixtures/api/account_not_admitted.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/me/sessions:
  delete:
    operationId: closeMySessions
    tags: [me]
    summary: Sign me out
    description: >-
      Closes all the sessions of the account, on all its workstations, and not only that of
      the browser asking for it: the sign-out "on all workstations" of WF-SEC-0020. The API asks
      the identity provider to close the sessions of the account, which notifies the front;
      the tokens of these sessions no longer allow any action (WF-SEC-0020, WF-ARC-0030). The
      time of the closing is recorded before the call to the provider: a token from a sign-in
      that precedes it is refused with 401 `SESSION_REVOKED`, even if the provider missed the
      closing, and the person signs in again by re-entering their credentials (#855). The
      deactivation of an account and the removal of all its roles follow the same path
      (`setUserActivation`, `setUserAccessRoles`).
    responses:
      '204':
        description: Sessions of the account closed.
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/me/preferences:
  patch:
    operationId: updateMyPreferences
    tags: [me]
    summary: Edit my display preferences
    description: >-
      Personal preferences, confined to presentation; no one edits those of someone else
      (WF-ADM-0040). The language is one of them and applies without signing in again
      (WF-INTF-0160), as do the number of rows per page of each flat table
      (`GridPreferences.page_size`, WF-IHM-0060), the layout of each timeline as a frieze
      (`timelines`, WF-PLA-0140) and the collapsed or expanded state of each chart
      (`charts`, EP-15/US-0550). The front writes with a grid the columns it offered
      (`GridPreferences.known_columns`), so that a column received since takes what the
      grid gives it by default (EP-16/US-0650). It also writes there whether the filter panel of the grid is open
      (`GridPreferences.filters_open`, WF-IHM-0060, #2916). The choice of states of the project list of
      the home page, different from the screen's default — Created, Pricing and In progress —,
      is kept in the grid of that list, `projects`, like any filter of a grid: `filters.states`,
      the chosen states as the address writes them (`GridPreferences.filters`; #1401, #1747).
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/access.yaml#/DisplayPreferences }
    responses:
      '200':
        description: Preferences saved.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/DisplayPreferences }
            examples:
              witness: { $ref: ../../../fixtures/api/preferences.json }
              dark: { $ref: ../../../fixtures/api/preferences_dark.json }
              page_size: { $ref: ../../../fixtures/api/preferences_page_size.json }
              project_states: { $ref: ../../../fixtures/api/preferences_project_states.json }
              timeline_lanes: { $ref: ../../../fixtures/api/preferences_timeline_lanes.json }
              risk_matrix_unfolded: { $ref: ../../../fixtures/api/preferences_risk_matrix_unfolded.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` designating the faulty field. A column width narrower
          than the smallest allowed, twenty points (`GridPreferences`):
          `/grids/<grid>/column_widths/<column>` by `VALUE_OUT_OF_RANGE`,
          `fields[].params.minimum` at `20`, the only bound crossed, like any bound of a
          write (WF-IHM-0060). A negative timeline lane (`TimelinePreferences`):
          `/timelines/<timeline>/lanes/<task>` by `VALUE_OUT_OF_RANGE`,
          `fields[].params.minimum` at `0`. A number of rows per page other than 10, 25, 50 or
          100 (`GridPreferences`, C-351): `/grids/<grid>/page_size` by `VALUE_OUT_OF_RANGE`,
          without a parameter. A preference larger than its bounds — more than a hundred grids,
          a hundred timelines or a hundred charts, a name of a grid, column, filter, timeline,
          task or chart of more than 64 characters, more than 64 hidden or known columns, widths
          or placed tasks, more than 20 filters, a filter of more than 500 characters
          (`DisplayPreferences`, #874) —: `VALUE_TOO_LONG`, a name that is too long at the
          pointer of the object that carries it. The hundred grids, timelines and charts also
          bound what the preferences keep, once the change is merged with what they were: a
          change that would bring `grids`, `timelines` or `charts` beyond a hundred entries is
          refused on `/grids`, `/timelines` or `/charts` by `VALUE_TOO_LONG` (#1235); a change
          that does not increase them never is for their size. Nothing is saved in Waterfall.
          One caveat: this refusal beyond a hundred entries, which is judged on the preferences
          of the locked account, comes after the language sent has been passed on to the
          identity provider (WF-INTF-0160), which may have taken it; choosing the displayed
          language again repairs the mismatch.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              column_width_out_of_range: { $ref: ../../../fixtures/api/preferences_column_width_out_of_range.json }
              lane_out_of_range: { $ref: ../../../fixtures/api/preferences_lane_out_of_range.json }
              page_size_out_of_range: { $ref: ../../../fixtures/api/preferences_page_size_out_of_range.json }
              too_many_grids: { $ref: ../../../fixtures/api/preferences_too_many_grids.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/me/avatar:
  put:
    operationId: putMyAvatar
    tags: [me]
    summary: Upload or replace my avatar
    description: >-
      The avatar belongs to the user, who alone manages it, and it is stored in the database
      with the account (WF-ADM-0080, §4.4.1). Its size is bounded by the installation:
      `Installation.avatar_max_bytes` (`getInstallation`, readable without a session) gives the
      bound, beyond which the image is refused with 413, `FILE_TOO_LARGE`; it never exceeds
      8 MiB. A declared type (`Content-Type`) other than `image/png` or `image/jpeg`, or an
      empty body, is refused with 400 `MALFORMED_REQUEST`; a content that is neither a PNG nor
      a JPEG, with 422 `VALIDATION_FAILED` at the pointer `""`, the whole body. Only the
      signature of the content determines the type kept: a JPEG declared as PNG is saved as
      `image/jpeg`. Before the bootstrap of the installation (WF-EXP-0020), the operation
      returns 503 `COMPONENT_UNAVAILABLE`, `component` at `database`.
    requestBody:
      required: true
      content:
        image/png:
          schema: { type: string, format: binary }
        image/jpeg:
          schema: { type: string, format: binary }
    responses:
      '204':
        description: Avatar saved.
      '400':
        description: >-
          A declared type other than `image/png` or `image/jpeg`, or an empty body:
          `MALFORMED_REQUEST`; the avatar of the account is not touched.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              empty_body: { $ref: ../../../fixtures/api/avatar_malformed.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '413':
        description: >-
          Image beyond `Installation.avatar_max_bytes`: `FILE_TOO_LARGE`, refused before
          being read (WF-ADM-0080, WF-CMP-0020).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              too_large: { $ref: ../../../fixtures/api/avatar_too_large.json }
      '422':
        description: >-
          A content that is neither a PNG nor a JPEG, whatever its declared type:
          `VALIDATION_FAILED`, `fields` designating the whole body (pointer `""`); the avatar of
          the account is not touched (WF-ADM-0080).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              not_image: { $ref: ../../../fixtures/api/avatar_not_image.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503':
        description: >-
          An unavailable component prevents the operation, `COMPONENT_UNAVAILABLE`,
          `params.component` naming it (WF-EXP-0040): the database before the bootstrap of the
          installation (WF-EXP-0020); or any other, as for every operation (`ServiceUnavailable`).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              not_bootstrapped: { $ref: ../../../fixtures/api/installation_not_bootstrapped.json }
  delete:
    operationId: deleteMyAvatar
    tags: [me]
    summary: Remove my avatar
    description: >-
      The account gets its default avatar back (WF-ADM-0080).
    responses:
      '204':
        description: Avatar removed; the account is displayed with a default image (WF-ADM-0080).
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
