/users:
  get:
    operationId: listUsers
    tags: [users]
    summary: Comptes utilisateurs
    description: >-
      Les comptes de l'installation, avec leur état et leur rattachement à l'organisation
      (WF-ADM-0050, WF-ADM-0060, WF-ADM-0030). Une table plate : chaque colonne se trie dans
      les deux sens, par le serveur (WF-IHM-0060). Chaque compte porte ses commandes,
      disponibles ou non (`available_commands`, WF-IHM-0090) : la désactivation du dernier
      compte qui porte les permissions d'administration est indisponible (WF-ADM-0120), ce que
      la liste, paginée, ne laisserait pas déduire.

      Les filtres se combinent (WF-IHM-0130) : la recherche (`search`) porte sur le nom, le
      prénom et l'adresse, et sur le prénom suivi du nom, tels que la table les montre ;
      l'origine (`origins`), le nœud (`org_node_id`) et les rôles (`access_role_ids`) se filtrent,
      l'état par `is_active` — les comptes désactivés s'ajoutant aux actifs par
      `include_inactive` — ; les colonnes d'audit (WF-DAT-0070) par une période chacune
      (`created_at_from`, `created_at_to`, `updated_at_from`, `updated_at_to`) et par leur auteur,
      un compte ou la plateforme (`created_by_user_id`, `created_by_kind`, `updated_by_user_id`,
      `updated_by_kind`) ; `meta.total` compte les
      comptes retenus. Un auteur désactivé reste nommé dans les colonnes d'audit (WF-ADM-0060) ;
      un auteur anonymisé n'y a plus de nom (`ActorRef.display_name` nul), que le front présente
      sous le libellé neutre de son catalogue. Un tri à égalité se départage par l'ordre de la liste sans tri — le nom
      puis le prénom —, puis par l'identifiant du compte, dans l'ordre croissant, pour que deux
      pages successives ne répètent ni n'omettent aucun compte (WF-IHM-0060, #741).
    parameters:
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - name: search
        in: query
        description: >-
          Recherche sur le nom, le prénom, l'adresse électronique, et sur le prénom suivi du nom,
          tels que la table les montre : un compte est retenu dès que l'un d'eux contient le
          texte, comparé comme toute recherche du contrat, sans égard à la casse ni aux accents
          (README, « Une recherche… » ; WF-IHM-0130) : « ines roux » trouve Inès Roux par le
          prénom suivi du nom, qu'aucune colonne ne porte entier.
        schema: { type: string, minLength: 1, maxLength: 200 }
      - name: include_inactive
        in: query
        description: >-
          Inclut les comptes désactivés, lisibles sous la même permission que les actifs
          (`users.read`) : un compte désactivé reste affiché partout où il a agi (WF-ADM-0060).
          Propre aux comptes : la règle du référentiel, qui réserve les désactivés à la
          permission de modification (`IncludeInactive`, WF-REF-0150), ne vaut pas ici
          (décision de l'auteur du 2026-11-01, #1736).
        schema: { type: boolean, default: false }
      - name: is_active
        in: query
        description: >-
          Restreint à l'un des deux états, la colonne de l'état filtrée (WF-IHM-0130,
          WF-ADM-0060) : vrai, les seuls comptes actifs ; faux, les seuls désactivés, qui restent
          lisibles. Il prime sur `include_inactive`, qui ne fait qu'ajouter les désactivés aux
          actifs ; absent, `include_inactive` décide.
        schema: { type: boolean }
      - name: origins
        in: query
        description: >-
          Restreint aux comptes de ces origines (WF-IHM-0130). Le service vérifie la liste après
          les schémas des autres paramètres : une valeur hors de `UserOrigin`, ou vide, est
          refusée par 422 `VALIDATION_FAILED`, `fields[]` désignant `/query/origins`, une fois
          ces schémas tenus ; tant qu'un autre paramètre est refusé par son schéma, elle n'est
          pas nommée.
        schema:
          type: array
          items: { $ref: ../components/schemas/access.yaml#/UserOrigin }
        explode: false
      - name: org_node_id
        in: query
        description: >-
          Restreint aux comptes qui relèvent de ce nœud d'organisation : rattachés à lui ou à
          l'un de ses descendants (WF-IHM-0130, WF-REF-0070).
        schema: { $ref: ../components/common.yaml#/Uuid }
      - name: access_role_ids
        in: query
        description: >-
          Restreint aux comptes qui portent l'un au moins de ces rôles d'habilitation, la colonne
          des rôles filtrée (WF-IHM-0130, WF-ADM-0050). Un compte sans rôle n'est retenu par
          aucune valeur ; un identifiant qui ne désigne aucun rôle ne retient aucun compte, comme
          `org_node_id` un nœud inconnu. Le service vérifie la liste comme `origins`, après les
          schémas des autres paramètres : un identifiant mal formé, ou vide, est refusé par 422
          `VALIDATION_FAILED`, `fields[]` désignant `/query/access_role_ids`, une fois ces
          schémas tenus.
        schema:
          type: array
          items: { $ref: ../components/common.yaml#/Uuid }
        explode: false
      - $ref: ../components/parameters.yaml#/CreatedAtFrom
      - $ref: ../components/parameters.yaml#/CreatedAtTo
      - $ref: ../components/parameters.yaml#/CreatedByUserId
      - $ref: ../components/parameters.yaml#/CreatedByKind
      - $ref: ../components/parameters.yaml#/UpdatedAtFrom
      - $ref: ../components/parameters.yaml#/UpdatedAtTo
      - $ref: ../components/parameters.yaml#/UpdatedByUserId
      - $ref: ../components/parameters.yaml#/UpdatedByKind
      - name: sort_by
        in: query
        description: >-
          Colonne du tri ; absente, le nom puis le prénom. Les colonnes de la table des comptes
          (WF-ADM-0050) : le nom, le prénom, l'adresse, l'origine, les rôles — par leurs
          libellés, dans l'ordre où le compte les porte —, le nœud d'organisation — par son
          libellé, un compte sans rattachement après les autres dans l'ordre croissant — et
          l'état, les comptes désactivés après les actifs dans l'ordre croissant ; puis les
          colonnes d'audit (WF-DAT-0070) : les dates de création et de dernière modification, et
          leurs auteurs, comme le journal d'audit trie le sien — par le nom affiché du compte, le
          prénom puis le nom, dans l'ordre croissant un compte anonymisé, qui n'en a plus, après
          les noms, et la plateforme, qui n'en a pas, après les comptes. Les textes se
          comparent dans l'ordre des points de code Unicode, et deux comptes à égalité se
          rangent par le nom puis le prénom, puis par leur identifiant, dans l'ordre croissant.
        schema:
          type: string
          enum:
            - last_name
            - first_name
            - email
            - origin
            - access_roles
            - org_node
            - is_active
            - created_at
            - created_by
            - updated_at
            - updated_by
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Comptes, les désactivés restant lisibles (WF-ADM-0060).
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/access.yaml#/User }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/users.json }
              page: { $ref: ../../../fixtures/api/users_page.json }
              by_access_role: { $ref: ../../../fixtures/api/users_by_access_role.json }
              search: { $ref: ../../../fixtures/api/users_search.json }
              inactive: { $ref: ../../../fixtures/api/users_inactive.json }
              anonymized: { $ref: ../../../fixtures/api/users_anonymized.json }
              created_by_platform: { $ref: ../../../fixtures/api/users_created_by_platform.json }
              by_created_at: { $ref: ../../../fixtures/api/users_by_created_at.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields[]` désignant chaque paramètre refusé par son schéma : une
          valeur hors de son schéma ; un instant mal formé, `/query/<colonne>_from` ou
          `/query/<colonne>_to` par `DATE_INVALID`. Une incohérence entre paramètres, une fois les
          schémas tenus : une période dont la fin précède le début, à sa fin
          (`/query/created_at_to`, `/query/updated_at_to`) par `VALUE_OUT_OF_RANGE`,
          `params.minimum` le début donné, la règle de toute période du contrat. Aucune liste vide
          ne tient lieu de refus.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              period_inverted: { $ref: ../../../fixtures/api/users_period_inverted.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createUser
    tags: [users]
    summary: Créer un compte local
    description: >-
      Il n'existe aucune inscription libre : un compte est créé ici, importé de
      l'annuaire, ou créé à sa première connexion par le fournisseur d'identité
      (WF-ADM-0050, WF-ADM-0070, WF-ADM-0180). Un compte local naît sans mot de passe et ne
      peut pas se connecter avant que son porteur n'en ait fixé un par le lien envoyé à son
      adresse — ou remis par un utilisateur habilité, qui l'obtient de
      `createPasswordSetupLink` (WF-ADM-0140). Il naît aussi sans rôle, comme un compte lu de
      l'annuaire (WF-ADM-0070) : ses rôles lui sont attribués ensuite par `setUserAccessRoles`,
      qui exige de plus la permission de modifier les rôles d'habilitation (WF-ADM-0090,
      WF-ADM-0100) ; la création et l'attribution s'inscrivent chacune au journal sous leur
      propre requête.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/access.yaml#/UserCreate }
    responses:
      '201':
        description: >-
          Compte créé, et si l'invitation est partie (`invitation_sent`) : faux, le porteur
          n'attend aucun courriel, et son lien de fixation se remet à la main
          (`createPasswordSetupLink`).
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/UserCreated }
            examples:
              witness: { $ref: ../../../fixtures/api/user_created.json }
              invited: { $ref: ../../../fixtures/api/user_created_invited.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '409':
        description: >-
          Adresse électronique déjà portée par un autre compte (WF-ADM-0050) : `ALREADY_EXISTS`,
          `fields` désignant `/email` par `ALREADY_EXISTS`, `fields[].params.conflicting_object_id`
          le compte qui la porte, absent quand seul le fournisseur d'identité la porte — un compte
          du royaume que Waterfall ne connaît pas (#814) ; rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              email_taken: { $ref: ../../../fixtures/api/user_email_taken.json }
      '422':
        description: >-
          Une écriture refusée par champ, `VALIDATION_FAILED`, `fields` désignant chaque champ
          en défaut (WF-ADM-0050) : un nœud d'organisation que l'installation n'a pas
          (`/org_node_id`, `UNKNOWN_ORG_NODE`), ou que le référentiel a désactivé
          (`INACTIVE_REFERENCE_OBJECT`) ; une adresse, un nom ou un prénom que le fournisseur
          d'identité refuse alors que la règle des adresses et des noms du contrat les admet — des
          points qui se suivent, une partie locale de plus de 64 caractères, un caractère qu'il
          interdit dans un nom (`/email`, `/last_name`, `/first_name`, `VALIDATION_FAILED`,
          #815). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              unknown_references: { $ref: ../../../fixtures/api/user_creation_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/users/{user_id}:
  get:
    operationId: getUser
    summary: Un compte utilisateur
    description: >-
      Attributs, état et rattachement d'un compte (WF-ADM-0050, WF-ADM-0030).
    tags: [users]
    parameters:
      - $ref: ../components/parameters.yaml#/UserId
    responses:
      '200':
        description: Compte.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/User }
            examples:
              deactivated: { $ref: ../../../fixtures/api/user_deactivated.json }
              anonymized: { $ref: ../../../fixtures/api/user_anonymized.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  patch:
    operationId: updateUser
    tags: [users]
    summary: Modifier un compte
    description: >-
      Le nom, le prénom et l'adresse d'un compte qui ne vient pas de Waterfall (`origin` autre
      que `local`) ne sont pas modifiables ici : le fournisseur d'identité les tient
      (WF-ADM-0050, WF-ADM-0070). Aucun écran ne propose de supprimer un compte (WF-ADM-0060).
    parameters:
      - $ref: ../components/parameters.yaml#/UserId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/access.yaml#/UserUpdate }
    responses:
      '200':
        description: Compte modifié.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/User }
            examples:
              renamed: { $ref: ../../../fixtures/api/user_renamed.json }
              renamed_after_deactivation: { $ref: ../../../fixtures/api/user_renamed_deactivated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Adresse électronique déjà portée par un autre compte (WF-ADM-0050) : `ALREADY_EXISTS`,
          `fields` désignant `/email` par `ALREADY_EXISTS`, `fields[].params.conflicting_object_id`
          le compte qui la porte. Un nom, un prénom ou une adresse envoyés pour un compte
          anonymisé, l'anonymisation étant irréversible (WF-ADM-0060) : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` à `is_not_anonymized`. Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              anonymized: { $ref: ../../../fixtures/api/user_anonymized_update_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Une écriture refusée par champ, `VALIDATION_FAILED`, `fields` désignant chaque champ
          en défaut (WF-ADM-0050) : une valeur du nom, du prénom ou de l'adresse, différente de
          celle du compte, quand il ne vient pas de Waterfall et que le fournisseur d'identité
          les tient (`/last_name`, `/first_name`, `/email`, `FIELD_READ_ONLY`) — envoyer le champ
          inchangé n'est pas refusé — ; un nœud
          d'organisation que l'installation n'a pas (`/org_node_id`, `UNKNOWN_ORG_NODE`), ou que le
          référentiel a désactivé (`INACTIVE_REFERENCE_OBJECT`). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              external_account: { $ref: ../../../fixtures/api/user_external_update_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/users/{user_id}/activation:
  put:
    operationId: setUserActivation
    tags: [users]
    summary: Désactiver ou réactiver un compte
    description: >-
      Un compte se désactive, jamais ne se supprime : ses actes doivent rester
      attribuables (WF-ADM-0060). La désactivation révoque toutes ses sessions
      (WF-SEC-0020) — un jeton d'une connexion qui la précède est refusé par 401
      `SESSION_REVOKED`, même après la réactivation (#835) — et est refusée s'il est le
      dernier à porter les permissions d'administration (WF-ADM-0120). La réactivation d'un compte anonymisé est refusée :
      l'anonymisation est irréversible (WF-ADM-0060).
    parameters:
      - $ref: ../components/parameters.yaml#/UserId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/access.yaml#/UserActivationWrite }
    responses:
      '200':
        description: Compte activé ou désactivé.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/User }
            examples:
              deactivated: { $ref: ../../../fixtures/api/user_deactivated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La désactivation du dernier compte actif qui porte les permissions de modifier les
          comptes et les rôles d'habilitation, refusée, rien n'étant écrit (WF-ADM-0120) :
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `last_administrator`, ce que la
          commande `deactivate` du compte dit d'avance (`available_commands`). La réactivation
          d'un compte anonymisé, refusée, rien n'étant écrit (WF-ADM-0060) :
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `is_not_anonymized`, ce que la
          commande `reactivate` du compte dit d'avance.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              last_administrator: { $ref: ../../../fixtures/api/user_deactivation_refused.json }
              anonymized: { $ref: ../../../fixtures/api/user_reactivation_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/users/{user_id}/anonymization:
  post:
    operationId: anonymizeUser
    tags: [users]
    summary: Anonymiser un compte désactivé
    description: >-
      À la demande de la personne, un compte désactivé est anonymisé, de façon irréversible
      (WF-ADM-0060) : son nom, son prénom et son adresse deviennent nuls (`anonymized_at` dit
      quand), son avatar est retiré, et le libellé qui le désigne dans le journal d'audit, comme
      auteur ou comme objet, est effacé de toutes les inscriptions, leur nombre, leurs dates et
      leurs actions inchangés (WF-SEC-0030) ; le front le présente partout sous le libellé neutre
      de son catalogue. Ses actes lui restent attribués, par son identifiant ; il garde ses rôles,
      son rattachement, et l'identifiant que le fournisseur d'identité lui donne, par lequel la
      lecture des comptes le reconnaît sans le modifier ni le recréer (WF-ADM-0070). Un compte
      local est en outre retiré du fournisseur d'identité, avant que l'anonymisation ne soit
      écrite : si le fournisseur ne répond pas, 503 (`identity_provider`), rien n'est écrit, et
      l'anonymisation se redemande. Un compte de l'annuaire ou d'un fournisseur externe n'est pas
      touché dans le fournisseur. Aucune confirmation n'est demandée ici : l'écran la demande.
      L'anonymisation s'inscrit au journal d'audit (`user_anonymize`, l'objet le compte, sans
      libellé ni paramètre). Sous la permission de modifier les comptes (`users.write`,
      WF-ADM-0100) ; un compte anonymisé ne se réactive plus, ni ne s'anonymise de nouveau.
    parameters:
      - $ref: ../components/parameters.yaml#/UserId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/access.yaml#/UserAnonymizationWrite }
    responses:
      '200':
        description: Compte anonymisé.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/User }
            examples:
              anonymized: { $ref: ../../../fixtures/api/user_anonymized.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Un compte actif, refusé : seul un compte désactivé s'anonymise (WF-ADM-0060), et la
          commande `anonymize` ne se liste que pour lui : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` à `is_deactivated_account`. Un compte déjà anonymisé, refusé,
          ce que sa commande `anonymize` dit d'avance : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` à `is_not_anonymized`. Rien n'est écrit, et le fournisseur
          d'identité n'est pas sollicité.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              active: { $ref: ../../../fixtures/api/user_anonymization_refused.json }
              anonymized: { $ref: ../../../fixtures/api/user_anonymization_repeated.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/users/{user_id}/access-roles:
  put:
    operationId: setUserAccessRoles
    tags: [users]
    summary: Attribuer les rôles d'habilitation d'un compte
    description: >-
      Un utilisateur porte un ou plusieurs rôles et dispose de l'union de leurs
      permissions ; la modification s'applique immédiatement, sans reconnexion
      (WF-ADM-0090). Le retrait de tous ses rôles révoque ses sessions (WF-SEC-0020) : un jeton
      d'une connexion qui le précède est refusé par 401 `SESSION_REVOKED`, même après qu'un rôle
      lui est rendu, et la personne se reconnecte (#855). Le
      retrait de la permission de modifier les comptes ou les rôles d'habilitation au dernier
      compte actif qui les porte est refusé (WF-ADM-0120), par `LAST_ADMINISTRATOR` ; lui en
      donner davantage reste possible, et la commande `set_access_roles` de ce compte reste
      disponible : le serveur juge les rôles envoyés. Attribuer ou retirer un rôle relève de la
      gestion des rôles (FBS-1.2, WF-ADM-0090) : l'opération exige, outre la permission de modifier
      les comptes (`users.write`), celle de modifier les rôles d'habilitation
      (`access_roles.write`) ; sans elle, 403 `PERMISSION_MISSING` — qui ne porte que
      `users.write` ne se donne pas le rôle administrateur.
    parameters:
      - $ref: ../components/parameters.yaml#/UserId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/access.yaml#/UserRolesWrite }
    responses:
      '200':
        description: Rôles attribués.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/User }
            examples:
              attributed: { $ref: ../../../fixtures/api/user_access_roles_set.json }
              cleared: { $ref: ../../../fixtures/api/user_access_roles_cleared.json }
              two_roles: { $ref: ../../../fixtures/api/user_access_roles_two.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Des rôles qui retireraient au dernier compte actif qui les porte la permission de
          modifier les comptes ou celle de modifier les rôles d'habilitation, refusés, rien
          n'étant écrit (WF-ADM-0120) : `LAST_ADMINISTRATOR`, comme `LAST_PROJECT_MANAGER` —
          le refus dépend des rôles envoyés, qu'aucune commande ne dit d'avance.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              last_administrator: { $ref: ../../../fixtures/api/user_access_roles_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Une écriture refusée par champ, `VALIDATION_FAILED`, `fields` désignant chaque champ
          en défaut (WF-ADM-0050) : un rôle
          d'habilitation que l'installation n'a pas, ou supprimé (`/access_role_ids/<rang>`,
          `UNKNOWN_ACCESS_ROLE`). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              unknown_access_role: { $ref: ../../../fixtures/api/user_access_roles_unknown.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/users/{user_id}/password-link:
  post:
    operationId: createPasswordSetupLink
    tags: [users]
    summary: Obtenir le lien de fixation du mot de passe d'un compte
    description: >-
      Engendre, pour un compte local, le lien par lequel son porteur fixe ou réinitialise son
      mot de passe, et le rend à l'appelant pour qu'il le remette par un autre canal (WF-ADM-0140) —
      le renvoi du courriel qui le porte est `resendInvitation` — : c'est ainsi que le premier
      administrateur fixe son mot de passe à l'installation (WF-EXP-0020) et que la réinitialisation
      se fait sur une installation sans messagerie (WF-CMP-0030). Le lien est celui que le courriel
      du fournisseur d'identité porterait — à usage unique, valable une heure, vers la page de ce
      fournisseur qui fixe le mot de passe, et non vers un écran de Waterfall —, créé par lui, et
      rendu une seule fois : un lien précédent du même compte cesse de valoir. Sous la permission de
      modifier les comptes (`users.write`, WF-ADM-0100) ; chaque demande est inscrite au journal
      d'audit, sans le jeton (WF-SEC-0030). Aucun écran ne présente, ne demande ni ne saisit de mot
      de passe : ce lien est le seul élément d'authentification que Waterfall montre (WF-ADM-0140).
    parameters:
      - $ref: ../components/parameters.yaml#/UserId
    responses:
      '201':
        description: Lien engendré, à remettre au porteur.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/PasswordSetupLink }
            examples:
              witness: { $ref: ../../../fixtures/api/password_setup_link.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` nommant la condition qui manque
          (`CommandCondition`), celle que le compte dit d'avance de sa commande
          (`create_password_link`), jugées dans cet ordre : `is_local_account` quand le compte
          n'est pas local — un compte de l'annuaire ou d'un fournisseur externe s'authentifie
          auprès du fournisseur d'identité et n'a pas de mot de passe à fixer ici —,
          `is_not_anonymized` quand il est anonymisé — retiré du fournisseur d'identité, de façon
          irréversible, ce que sa réactivation ne lèverait pas —, `is_active_account` quand il est
          désactivé (WF-ADM-0140, WF-ADM-0060). Le refus nomme la première qui manque.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              not_local: { $ref: ../../../fixtures/api/password_link_not_local.json }
              anonymized: { $ref: ../../../fixtures/api/password_link_anonymized.json }
              deactivated: { $ref: ../../../fixtures/api/password_link_deactivated.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/users/{user_id}/invitation:
  post:
    operationId: resendInvitation
    tags: [users]
    summary: Renvoyer le courriel de fixation du mot de passe d'un compte
    description: >-
      Fait renvoyer par le fournisseur d'identité, à l'adresse d'un compte local, le courriel qui
      porte le lien par lequel son porteur fixe ou réinitialise son mot de passe (WF-ADM-0140) :
      celui que `createUser` envoie à la création (`UserCreated.invitation_sent`), pour un
      porteur qui ne l'a pas reçu, l'a perdu ou l'a laissé expirer. Le lien est celui que
      `createPasswordSetupLink` rendrait — à usage unique, valable une heure, vers la page du
      fournisseur d'identité —, et un lien précédent du même compte cesse de valoir ; Waterfall
      ne le voit pas. Sous la permission de modifier les comptes (`users.write`, WF-ADM-0100) ;
      chaque renvoi est inscrit au journal d'audit comme la demande d'un lien,
      `password_link_create`, sans le jeton (WF-SEC-0030). Un courriel que le fournisseur
      n'envoie pas — installation sans messagerie (WF-CMP-0030), serveur de courriel en échec,
      fournisseur injoignable — rend 503 `COMPONENT_UNAVAILABLE`, `params.component` à
      `identity_provider`, et n'est jamais présenté comme parti (WF-EXP-0040) : l'écran propose
      alors le lien à remettre par un autre canal (`createPasswordSetupLink`).
    parameters:
      - $ref: ../components/parameters.yaml#/UserId
    responses:
      '204':
        description: Courriel envoyé par le fournisseur d'identité.
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` nommant la condition qui manque
          (`CommandCondition`), celle que le compte dit d'avance de sa commande
          (`resend_invitation`), jugées comme pour le lien, dans cet ordre : `is_local_account`
          quand le compte n'est pas local, `is_not_anonymized` quand il est anonymisé,
          `is_active_account` quand il est désactivé (WF-ADM-0140, WF-ADM-0060). Le refus nomme
          la première qui manque. Aucun courriel ne part.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              not_local: { $ref: ../../../fixtures/api/invitation_not_local.json }
              anonymized: { $ref: ../../../fixtures/api/invitation_anonymized.json }
              deactivated: { $ref: ../../../fixtures/api/invitation_deactivated.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/users/{user_id}/avatar:
  get:
    operationId: getUserAvatar
    tags: [users]
    summary: Avatar d'un compte
    description: >-
      Image du compte, servie telle qu'elle a été déposée (WF-ADM-0080).
    parameters:
      - $ref: ../components/parameters.yaml#/UserId
    responses:
      '200':
        description: Image de l'avatar.
        content:
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/identity-syncs:
  post:
    operationId: startIdentitySync
    tags: [users]
    summary: Lire les comptes du fournisseur d'identité
    description: >-
      Lit, par l'API d'administration du fournisseur d'identité, les comptes que son annuaire
      fédéré y rend : crée les comptes absents, met à jour les trois attributs d'identité des
      comptes lus, et désactive les comptes lus que le fournisseur ne connaît plus. Les comptes
      créés dans Waterfall ne sont pas modifiés, et aucun rôle n'est attribué (WF-ADM-0070) :
      c'est dans le fournisseur que la lecture rétablit le nom, le prénom et l'adresse que
      Waterfall tient d'un compte local, s'ils y diffèrent, puisqu'il en fait foi (WF-ADM-0050,
      #919).
      Waterfall ne lit jamais l'annuaire lui-même, et n'en paramètre aucun (WF-ADM-0180). Sur
      une installation sans annuaire, la lecture ne trouve aucun compte à lire. Confiée au
      worker (WF-ARC-0090), qui demande d'abord au fournisseur de synchroniser chaque annuaire
      qu'il fédère. Une personne de l'annuaire dont l'adresse est déjà portée par un compte est
      rattachée à ce compte ; un compte anonymisé n'est ni modifié ni recréé ; les comptes
      locaux du fournisseur que Waterfall ne connaît pas et qui n'ont jamais eu de mot de passe
      en sont retirés (#707, #811). La lecture planifiée suit la périodicité choisie
      (`getIdentitySyncSchedule`, WF-ADM-0070). Sous la permission de modifier les comptes
      (`users.write`).
      Réussie, la tâche donne pour résultat le compte rendu de `getLatestIdentitySync`.
    responses:
      '202':
        description: Synchronisation mise en file.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              queued: { $ref: ../../../fixtures/api/identity_sync_queued.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/identity-syncs/latest:
  get:
    operationId: getLatestIdentitySync
    tags: [users]
    summary: Compte rendu de la dernière lecture des comptes
    description: >-
      Comptes créés, mis à jour et désactivés lors de la dernière lecture des comptes du
      fournisseur d'identité qui a abouti, demandée ou planifiée, comptes locaux dont elle
      rétablit l'identité dans le fournisseur, ce qu'elle a laissé tel quel avec son motif, et
      les comptes locaux qu'elle retire du fournisseur — rétablis ou retirés, ou à l'être : le
      rétablissement et le retrait suivent la validation de la lecture ; un échec est journalisé
      et la lecture suivante le reprend (WF-ADM-0070, #811, #919). Un compte de Waterfall laissé
      tel quel est nommé tel qu'il se lit à la consultation, anonymisé compris (#920). Sous la
      permission de consulter les comptes (`users.read`) ; 404 tant qu'aucune lecture n'a abouti.
    responses:
      '200':
        description: Compte rendu de la dernière lecture (WF-ADM-0070, WF-ADM-0130).
        content:
          application/json:
            schema: { $ref: ../components/schemas/platform.yaml#/IdentitySyncReport }
            examples:
              witness: { $ref: ../../../fixtures/api/identity_sync_report.json }
              flagged: { $ref: ../../../fixtures/api/identity_sync_report_flagged.json }
              anonymized: { $ref: ../../../fixtures/api/identity_sync_report_anonymized.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/identity-sync-schedule:
  get:
    operationId: getIdentitySyncSchedule
    tags: [users]
    summary: Périodicité de la lecture des comptes
    description: >-
      La fréquence et l'heure auxquelles la plateforme lit d'elle-même les comptes du
      fournisseur d'identité, choisies par un utilisateur habilité, quotidiennes par défaut,
      comme celles des sauvegardes (WF-ADM-0070, WF-ADM-0170). Une installation neuve lit la
      périodicité livrée (`IdentitySyncSchedule`) : le 404 ne dit que la lecture refusée. Lisible
      sous la permission de consulter les comptes (`users.read`, WF-ADM-0100).
    responses:
      '200':
        description: Périodicité courante (WF-ADM-0070).
        content:
          application/json:
            schema: { $ref: ../components/schemas/platform.yaml#/IdentitySyncSchedule }
            examples:
              witness: { $ref: ../../../fixtures/api/identity_sync_schedule.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  put:
    operationId: setIdentitySyncSchedule
    tags: [users]
    summary: Régler la périodicité de la lecture des comptes
    description: >-
      La fréquence et l'heure de la lecture planifiée, toutes deux exigées, le jour pour une
      lecture hebdomadaire seulement, et son activation (WF-ADM-0070) : une personne ajoutée à
      l'annuaire a un compte au terme de la périodicité choisie, sans intervention. Le réglage
      vaut dès la lecture planifiée suivante ; une lecture en cours n'est pas interrompue. Sous
      la permission de modifier les comptes (`users.write`, WF-ADM-0100), celle qui lance la
      lecture à la demande (`startIdentitySync`).
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/platform.yaml#/IdentitySyncSchedule }
    responses:
      '200':
        description: Périodicité enregistrée, avec son compteur suivant.
        content:
          application/json:
            schema: { $ref: ../components/schemas/platform.yaml#/IdentitySyncSchedule }
            examples:
              set: { $ref: ../../../fixtures/api/identity_sync_schedule_set.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Une périodicité refusée, `VALIDATION_FAILED`, `fields` désignant chaque champ en
          défaut, comme celle des sauvegardes : une fréquence ou une heure absentes, par
          `VALUE_REQUIRED` ; un jour hors de 1 à 7 (`/weekday`), `VALUE_OUT_OF_RANGE`,
          `params.minimum` ou `maximum` la seule borne franchie ; un jour nul pour une lecture
          hebdomadaire, `/weekday` par `VALUE_REQUIRED`, ou donné à une quotidienne, `/weekday`
          par le motif `VALIDATION_FAILED` (WF-ADM-0070). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              weekday_out_of_range: { $ref: ../../../fixtures/api/identity_sync_schedule_weekday_out_of_range.json }
              weekday_missing: { $ref: ../../../fixtures/api/identity_sync_schedule_weekday_missing.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/permissions:
  get:
    operationId: listPermissions
    tags: [access]
    summary: Catalogue des permissions
    description: >-
      Deux permissions par fonction de second niveau, plus une permission propre par
      action irréversible ou structurante. Le catalogue est livré et non modifiable :
      aucun écran ne permet d'en créer une (WF-ADM-0100).
    responses:
      '200':
        description: Catalogue complet.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/access.yaml#/Permission }
            examples:
              witness: { $ref: ../../../fixtures/api/permissions.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/access-roles:
  get:
    operationId: listAccessRoles
    tags: [access]
    summary: Rôles d'habilitation
    description: >-
      Les rôles d'habilitation, les prédéfinis comme ceux créés ensuite (WF-ADM-0010,
      WF-ADM-0090). Une table plate : chaque colonne se trie dans les deux sens, par le
      serveur (WF-IHM-0060), et se filtre (WF-IHM-0130) — le libellé par la recherche
      (`search`), la nature par `is_predefined`, le nombre de porteurs par deux bornes
      incluses (`holder_count_min`, `holder_count_max`), les colonnes d'audit (WF-DAT-0070) par
      une période chacune (`created_at_from`, `created_at_to`, `updated_at_from`,
      `updated_at_to`) et par leur auteur, un compte ou la plateforme (`created_by_user_id`,
      `created_by_kind`, `updated_by_user_id`, `updated_by_kind`) ; les filtres se combinent. Un
      auteur désactivé reste nommé dans les colonnes d'audit (WF-ADM-0060) ; un auteur anonymisé
      n'y a plus de nom (`ActorRef.display_name` nul), que le front présente sous le libellé
      neutre de son catalogue. Le nombre
      de porteurs (`holder_count`) compte tous les comptes qui portent le rôle, désactivés
      compris. Les rôles supprimés (`deleteAccessRole`) n'y figurent plus. Un tri à égalité se
      départage par l'ordre de la liste sans tri — le libellé —, puis par l'identifiant du rôle,
      dans l'ordre croissant, pour que deux lectures successives rendent le même ordre
      (WF-IHM-0060, #741). Sans pagination : une installation compte quelques dizaines de rôles
      au plus — les trois prédéfinis et ceux qu'elle compose —, que l'écran pagine lui-même, la
      réponse étant la liste entière.
    parameters:
      - $ref: ../components/parameters.yaml#/Search
      - name: is_predefined
        in: query
        description: >-
          Restreint à l'une des deux natures, la colonne de la nature filtrée (WF-IHM-0130) :
          vrai, les seuls rôles prédéfinis livrés avec la plateforme (WF-ADM-0010) ; faux, les
          seuls rôles composés ensuite (WF-ADM-0090). Absent, ne restreint rien.
        schema: { type: boolean }
      - name: holder_count_min
        in: query
        description: >-
          Borne inférieure, incluse, du nombre de porteurs : restreint aux rôles portés par au
          moins autant de comptes (WF-IHM-0130). Le service vérifie les deux bornes après les
          schémas des autres paramètres : une borne qui n'est pas un entier est refusée avec
          eux, mais une borne négative, ou inférieure à l'autre, n'est refusée, et nommée,
          qu'une fois ces schémas tenus.
        schema: { type: integer, minimum: 0 }
      - name: holder_count_max
        in: query
        description: >-
          Borne supérieure, incluse, du nombre de porteurs : restreint aux rôles portés par au
          plus autant de comptes — à 0, les rôles que personne ne porte (WF-IHM-0130).
          Inférieure à `holder_count_min`, elle est refusée par 422.
        schema: { type: integer, minimum: 0 }
      - $ref: ../components/parameters.yaml#/CreatedAtFrom
      - $ref: ../components/parameters.yaml#/CreatedAtTo
      - $ref: ../components/parameters.yaml#/CreatedByUserId
      - $ref: ../components/parameters.yaml#/CreatedByKind
      - $ref: ../components/parameters.yaml#/UpdatedAtFrom
      - $ref: ../components/parameters.yaml#/UpdatedAtTo
      - $ref: ../components/parameters.yaml#/UpdatedByUserId
      - $ref: ../components/parameters.yaml#/UpdatedByKind
      - name: sort_by
        in: query
        description: >-
          Colonne du tri ; absente, le libellé. Les colonnes de la table des rôles : le libellé,
          la nature — les prédéfinis avant les composés dans l'ordre croissant — et le nombre de
          porteurs ; puis les colonnes d'audit (WF-DAT-0070) : les dates de création et de
          dernière modification, et leurs auteurs, comme ceux de `listUsers` — par le nom affiché
          du compte, comparé dans l'ordre des points de code Unicode, dans l'ordre croissant un
          compte anonymisé après les noms, et la plateforme après les comptes. Deux rôles à
          égalité se rangent par leur libellé, puis par leur identifiant, dans l'ordre croissant.
        schema:
          type: string
          enum:
            - label
            - is_predefined
            - holder_count
            - created_at
            - created_by
            - updated_at
            - updated_by
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Rôles, dont les trois prédéfinis (WF-ADM-0010).
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/access.yaml#/AccessRole }
            examples:
              witness: { $ref: ../../../fixtures/api/access_roles.json }
              composed: { $ref: ../../../fixtures/api/access_roles_composed.json }
              unheld: { $ref: ../../../fixtures/api/access_roles_unheld.json }
              by_updated_by: { $ref: ../../../fixtures/api/access_roles_by_updated_by.json }
              updated_by_deactivated:
                $ref: ../../../fixtures/api/access_roles_updated_by_deactivated.json
              updated_by_anonymized:
                $ref: ../../../fixtures/api/access_roles_updated_by_anonymized.json
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          Une borne mal formée, qui n'est pas un entier positif ou nul : `VALIDATION_FAILED`,
          `fields[]` la désignant, `/query/<borne>`, par `NUMBER_INVALID`. Une borne supérieure
          inférieure à la borne inférieure : `fields[]` désignant `/query/holder_count_max` par
          `VALUE_OUT_OF_RANGE`, `params.minimum` la borne inférieure donnée. Un instant mal formé,
          `/query/<colonne>_from` ou `/query/<colonne>_to` par `DATE_INVALID` ; une période dont
          la fin précède le début, à sa fin (`/query/created_at_to`, `/query/updated_at_to`) par
          `VALUE_OUT_OF_RANGE`, `params.minimum` le début donné, la règle de toute période du
          contrat. `fields[]` désigne chaque paramètre refusé par son schéma, et une incohérence
          entre paramètres une fois les schémas tenus.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              bounds_inverted: { $ref: ../../../fixtures/api/access_roles_bounds_inverted.json }
              period_inverted: { $ref: ../../../fixtures/api/access_roles_period_inverted.json }
              number_invalid: { $ref: ../../../fixtures/api/access_roles_number_invalid.json }
              date_invalid: { $ref: ../../../fixtures/api/access_roles_date_invalid.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createAccessRole
    tags: [access]
    summary: Composer un rôle d'habilitation
    description: >-
      Tout jeu de permissions peut être composé : aucune action n'est réservée à un
      acteur (WF-ADM-0020).
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/access.yaml#/AccessRoleWrite }
    responses:
      '201':
        description: Rôle créé.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/AccessRole }
            examples:
              witness: { $ref: ../../../fixtures/api/access_role_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/access-roles/{access_role_id}:
  get:
    operationId: getAccessRole
    summary: Un rôle d'habilitation
    description: >-
      Un rôle et les permissions qu'il porte, prises au catalogue (WF-ADM-0090,
      WF-ADM-0100).
    tags: [access]
    parameters:
      - $ref: ../components/parameters.yaml#/AccessRoleId
    responses:
      '200':
        description: Rôle.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/AccessRole }
            examples:
              witness: { $ref: ../../../fixtures/api/access_role.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  patch:
    operationId: updateAccessRole
    tags: [access]
    summary: Modifier un rôle
    description: La modification s'applique immédiatement à tous ses porteurs (WF-ADM-0090).
    parameters:
      - $ref: ../components/parameters.yaml#/AccessRoleId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/access.yaml#/AccessRoleUpdate }
    responses:
      '200':
        description: Rôle modifié.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/AccessRole }
            examples:
              witness: { $ref: ../../../fixtures/api/access_role_updated.json }
              marking_granted: { $ref: ../../../fixtures/api/access_role_marking_granted.json }
              renamed: { $ref: ../../../fixtures/api/access_role_renamed.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Une modification qui retirerait au dernier compte actif qui les porte la permission de
          modifier les comptes ou celle de modifier les rôles d'habilitation, refusée, rien
          n'étant écrit (WF-ADM-0120) : `LAST_ADMINISTRATOR`, le refus dépendant des permissions
          envoyées.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              last_administrator: { $ref: ../../../fixtures/api/access_role_update_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  delete:
    operationId: deleteAccessRole
    tags: [access]
    summary: Supprimer un rôle
    description: >-
      Suppression logique (WF-DAT-0080) : le rôle n'est plus proposé — ni `listAccessRoles`, ni
      `getAccessRole`, ni l'attribution à un compte ne le rendent — et sa trace est conservée,
      avec ce que le journal d'audit en dit. Un rôle supprimé est un 404, comme un rôle qui
      n'a jamais existé. Refusé tant qu'un compte le porte (WF-ADM-0090, WF-ADM-0120).
    parameters:
      - $ref: ../components/parameters.yaml#/AccessRoleId
      - name: lock_version
        in: query
        required: true
        description: >-
          Le compteur du rôle supprimé, tel que l'écran l'a lu (`AccessRole.lock_version`) :
          périmé, la suppression est refusée par 412 et rien n'est supprimé (WF-IHM-0110 ;
          décision de l'auteur du 2026-11-01, #1733).
        schema: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '204':
        description: Rôle supprimé.
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Rôle encore porté par un compte, désactivé compris, `ACCESS_ROLE_IN_USE`
          (WF-ADM-0090) ; rien n'est supprimé.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              in_use: { $ref: ../../../fixtures/api/access_role_delete_refused.json }
      '412':
        description: >-
          `STALE_LOCK_VERSION` : le rôle a été écrit depuis sa lecture, et rien n'est supprimé ;
          `params.expected_lock_version` est son compteur courant (WF-IHM-0110, #1733).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/access_role_delete_stale.json }
      '422': { $ref: ../components/responses.yaml#/LockVersionInvalid }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
