/users:
  get:
    operationId: listUsers
    tags: [users]
    summary: User accounts
    description: >-
      The installation's accounts, with their state and their attachment to the organisation
      (WF-ADM-0050, WF-ADM-0060, WF-ADM-0030). A flat table: each column sorts in both
      directions, on the server (WF-IHM-0060). Each account carries its commands,
      available or not (`available_commands`, WF-IHM-0090): deactivating the last
      account that holds the administration permissions is unavailable (WF-ADM-0120), which
      the list, being paginated, would not let one infer.

      The filters combine (WF-IHM-0130): the search (`search`) covers the last name, the
      first name and the address, and the first name followed by the last name, as the table
      shows them; the origin (`origins`), the node (`org_node_id`) and the roles (`access_role_ids`,
      and the accounts without one with `without_access_role`, in union with them) are filtered,
      the state with `is_active` — deactivated accounts being added to active ones
      with `include_inactive` —; the audit columns (WF-DAT-0070) with a period each
      (`created_at_from`, `created_at_to`, `updated_at_from`, `updated_at_to`) and by their author,
      an account or the platform (`created_by_user_id`, `created_by_kind`, `updated_by_user_id`,
      `updated_by_kind`); `meta.total` counts the
      accounts retained. A deactivated author stays named in the audit columns (WF-ADM-0060);
      an anonymised author no longer has a name there (`ActorRef.display_name` null), which the
      front presents under the neutral label of its catalogue. A tie in the sort is broken by
      the order of the unsorted list — the last name
      then the first name —, then by the account identifier, in ascending order, so that two
      successive pages neither repeat nor omit any account (WF-IHM-0060, #741).
    parameters:
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - name: search
        in: query
        description: >-
          Search on the last name, the first name, the email address, and on the first name
          followed by the last name, as the table shows them: an account is retained as soon as
          one of them contains the text, compared like any search of the contract, ignoring case
          and accents (README, "A search…"; WF-IHM-0130): "ines roux" finds Inès Roux by the
          first name followed by the last name, which no column carries whole.
        schema: { type: string, minLength: 1, maxLength: 200 }
      - name: include_inactive
        in: query
        description: >-
          Includes deactivated accounts, readable under the same permission as active ones
          (`users.read`): a deactivated account stays displayed wherever it has acted (WF-ADM-0060).
          Specific to accounts: the reference data rule, which reserves deactivated objects for
          the write permission (`IncludeInactive`, WF-REF-0150), does not apply here
          (author's decision of 2026-11-01, #1736).
        schema: { type: boolean, default: false }
      - name: is_active
        in: query
        description: >-
          Restricts to one of the two states, the state column being filtered (WF-IHM-0130,
          WF-ADM-0060): true, active accounts only; false, deactivated accounts only, which remain
          readable. It takes precedence over `include_inactive`, which only adds deactivated
          accounts to active ones; when absent, `include_inactive` decides.
        schema: { type: boolean }
      - name: origins
        in: query
        description: >-
          Restricts to the accounts of these origins (WF-IHM-0130). The service checks the list
          after the schemas of the other parameters: a value outside `UserOrigin`, or empty, is
          refused with 422 `VALIDATION_FAILED`, `fields[]` designating `/query/origins`, once
          those schemas are satisfied; as long as another parameter is refused by its schema, it
          is not named.
        schema:
          type: array
          items: { $ref: ../components/schemas/access.yaml#/UserOrigin }
        explode: false
      - name: org_node_id
        in: query
        description: >-
          Restricts to the accounts that belong to this organisation node: attached to it or to
          one of its descendants (WF-IHM-0130, WF-REF-0070).
        schema: { $ref: ../components/common.yaml#/Uuid }
      - name: access_role_ids
        in: query
        description: >-
          Restricts to the accounts that hold at least one of these access roles, the roles
          column being filtered (WF-IHM-0130, WF-ADM-0050). An account without a role is retained
          by none of these values, but by `without_access_role`, whose accounts are added to
          theirs when both are given; an identifier that designates no role retains no account, as
          `org_node_id` does an unknown node. The service checks the list like `origins`, after
          the schemas of the other parameters: a malformed identifier, or an empty one, is refused
          with 422 `VALIDATION_FAILED`, `fields[]` designating `/query/access_role_ids`, once those
          schemas are satisfied.
        schema:
          type: array
          items: { $ref: ../components/common.yaml#/Uuid }
        explode: false
      - name: without_access_role
        in: query
        description: >-
          True, retains the accounts that hold no access role — a deleted role no longer
          counts, as `User.access_role_ids` no longer names it —, such as an account the
          identity provider created at its first sign-in, which has no permission until a role is
          given to it (WF-ADM-0180, WF-IHM-0130). Given with `access_role_ids`, the two retain
          their union: the accounts without a role and those that hold one of the roles named.
          Absent or false, nothing changes: the roles filter by `access_role_ids` alone. It combines
          with the other filters, the sort and the pagination like them (#2976).
        schema: { type: boolean, default: false }
      - $ref: ../components/parameters.yaml#/CreatedAtFrom
      - $ref: ../components/parameters.yaml#/CreatedAtTo
      - $ref: ../components/parameters.yaml#/CreatedByUserId
      - $ref: ../components/parameters.yaml#/CreatedByKind
      - $ref: ../components/parameters.yaml#/UpdatedAtFrom
      - $ref: ../components/parameters.yaml#/UpdatedAtTo
      - $ref: ../components/parameters.yaml#/UpdatedByUserId
      - $ref: ../components/parameters.yaml#/UpdatedByKind
      - name: sort_by
        in: query
        description: >-
          Sort column; when absent, the last name then the first name. The columns of the
          accounts table (WF-ADM-0050): the last name, the first name, the address, the origin,
          the roles — by their labels, in the order in which the account holds them —, the
          organisation node — by its label, an account without an attachment after the others in
          ascending order — and the state, deactivated accounts after active ones in ascending
          order; then the audit columns (WF-DAT-0070): the creation and last modification dates,
          and their authors, as the audit log sorts its own — by the account's display name, the
          first name then the last name, in ascending order an anonymised account, which no
          longer has one, after the names, and the platform, which has none, after the accounts.
          Texts are compared in Unicode code point order, and two tied accounts are ordered by
          the last name then the first name, then by their identifier, in ascending order.
        schema:
          type: string
          enum:
            - last_name
            - first_name
            - email
            - origin
            - access_roles
            - org_node
            - is_active
            - created_at
            - created_by
            - updated_at
            - updated_by
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Accounts, deactivated ones remaining readable (WF-ADM-0060).
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/access.yaml#/User }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/users.json }
              page: { $ref: ../../../fixtures/api/users_page.json }
              by_access_role: { $ref: ../../../fixtures/api/users_by_access_role.json }
              without_access_role: { $ref: ../../../fixtures/api/users_without_access_role.json }
              search: { $ref: ../../../fixtures/api/users_search.json }
              inactive: { $ref: ../../../fixtures/api/users_inactive.json }
              anonymized: { $ref: ../../../fixtures/api/users_anonymized.json }
              created_by_platform: { $ref: ../../../fixtures/api/users_created_by_platform.json }
              by_created_at: { $ref: ../../../fixtures/api/users_by_created_at.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields[]` designating each parameter refused by its schema: a
          value outside its schema; a malformed instant, `/query/<column>_from` or
          `/query/<column>_to` with `DATE_INVALID`. An inconsistency between parameters, once the
          schemas are satisfied: a period whose end precedes its start, at its end
          (`/query/created_at_to`, `/query/updated_at_to`) with `VALUE_OUT_OF_RANGE`,
          `params.minimum` the start given, the rule of every period in the contract. No empty
          list stands in for a refusal.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              period_inverted: { $ref: ../../../fixtures/api/users_period_inverted.json }
              origins_invalid: { $ref: ../../../fixtures/api/users_origins_invalid.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createUser
    tags: [users]
    summary: Create a local account
    description: >-
      There is no open sign-up: an account is created here, imported from the
      directory, or created at its first sign-in by the identity provider
      (WF-ADM-0050, WF-ADM-0070, WF-ADM-0180). A local account is born without a password and
      cannot sign in until its holder has set one through the link sent to their
      address — or handed over by an authorised user, who obtains it from
      `createPasswordSetupLink` (WF-ADM-0140). It is also born without a role, like an account
      read from the directory (WF-ADM-0070): its roles are then assigned to it by
      `setUserAccessRoles`, which additionally requires the permission to modify access roles
      (WF-ADM-0090, WF-ADM-0100); the creation and the assignment are each recorded in the log
      under their own request.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/access.yaml#/UserCreate }
    responses:
      '201':
        description: >-
          Account created, and whether the invitation went out (`invitation_sent`): when false,
          the holder expects no email, and their setup link is handed over manually
          (`createPasswordSetupLink`).
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/UserCreated }
            examples:
              witness: { $ref: ../../../fixtures/api/user_created.json }
              invited: { $ref: ../../../fixtures/api/user_created_invited.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '409':
        description: >-
          Email address already held by another account (WF-ADM-0050): `ALREADY_EXISTS`,
          `fields` designating `/email` with `ALREADY_EXISTS`, `fields[].params.conflicting_object_id`
          the account that holds it, absent when only the identity provider holds it — an account
          of the realm that Waterfall does not know (#814); nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              email_taken: { $ref: ../../../fixtures/api/user_email_taken.json }
      '422':
        description: >-
          A write refused per field, `VALIDATION_FAILED`, `fields` designating each faulty
          field (WF-ADM-0050): an organisation node the installation does not have
          (`/org_node_id`, `UNKNOWN_ORG_NODE`), or that the reference data has deactivated
          (`INACTIVE_REFERENCE_OBJECT`); an address, a last name or a first name that the identity
          provider refuses although the contract's rule for addresses and names admits them —
          consecutive dots, a local part of more than 64 characters, a character it forbids in a
          name (`/email`, `/last_name`, `/first_name`, `VALIDATION_FAILED`,
          #815). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              unknown_references: { $ref: ../../../fixtures/api/user_creation_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/users/{user_id}:
  get:
    operationId: getUser
    summary: A user account
    description: >-
      Attributes, state and attachment of an account (WF-ADM-0050, WF-ADM-0030).
    tags: [users]
    parameters:
      - $ref: ../components/parameters.yaml#/UserId
    responses:
      '200':
        description: Account.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/User }
            examples:
              active: { $ref: ../../../fixtures/api/user.json }
              deactivated: { $ref: ../../../fixtures/api/user_deactivated.json }
              anonymized: { $ref: ../../../fixtures/api/user_anonymized.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  patch:
    operationId: updateUser
    tags: [users]
    summary: Modify an account
    description: >-
      The last name, first name and address of an account that does not come from Waterfall
      (`origin` other than `local`) cannot be modified here: the identity provider holds them
      (WF-ADM-0050, WF-ADM-0070). No screen offers to delete an account (WF-ADM-0060).
    parameters:
      - $ref: ../components/parameters.yaml#/UserId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/access.yaml#/UserUpdate }
    responses:
      '200':
        description: Account modified.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/User }
            examples:
              renamed: { $ref: ../../../fixtures/api/user_renamed.json }
              renamed_after_deactivation: { $ref: ../../../fixtures/api/user_renamed_deactivated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Email address already held by another account (WF-ADM-0050): `ALREADY_EXISTS`,
          `fields` designating `/email` with `ALREADY_EXISTS`, `fields[].params.conflicting_object_id`
          the account that holds it. A last name, first name or address sent for an
          anonymised account, anonymisation being irreversible (WF-ADM-0060):
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` at `is_not_anonymized`. Nothing is
          written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              anonymized: { $ref: ../../../fixtures/api/user_anonymized_update_refused.json }
              email_taken: { $ref: ../../../fixtures/api/user_email_taken.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          A write refused per field, `VALIDATION_FAILED`, `fields` designating each faulty
          field (WF-ADM-0050): a value of the last name, first name or address, different from
          the account's, when it does not come from Waterfall and the identity provider
          holds them (`/last_name`, `/first_name`, `/email`, `FIELD_READ_ONLY`) — sending the
          field unchanged is not refused —; an organisation
          node the installation does not have (`/org_node_id`, `UNKNOWN_ORG_NODE`), or that the
          reference data has deactivated (`INACTIVE_REFERENCE_OBJECT`). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              external_account: { $ref: ../../../fixtures/api/user_external_update_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/users/{user_id}/activation:
  put:
    operationId: setUserActivation
    tags: [users]
    summary: Deactivate or reactivate an account
    description: >-
      An account is deactivated, never deleted: its actions must remain
      attributable (WF-ADM-0060). Deactivation revokes all its sessions
      (WF-SEC-0020) — a token from a sign-in that precedes it is refused with 401
      `SESSION_REVOKED`, even after reactivation (#835) — and is refused if it is the
      last one to hold the administration permissions (WF-ADM-0120). Reactivating an
      anonymised account is refused: anonymisation is irreversible (WF-ADM-0060).
    parameters:
      - $ref: ../components/parameters.yaml#/UserId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/access.yaml#/UserActivationWrite }
    responses:
      '200':
        description: Account activated or deactivated.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/User }
            examples:
              deactivated: { $ref: ../../../fixtures/api/user_deactivated.json }
              reactivated: { $ref: ../../../fixtures/api/user_reactivated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Deactivating the last active account that holds the permissions to modify accounts
          and access roles, refused, nothing being written (WF-ADM-0120):
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` at `last_administrator`, which the
          account's `deactivate` command says in advance (`available_commands`). Reactivating
          an anonymised account, refused, nothing being written (WF-ADM-0060):
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` at `is_not_anonymized`, which the
          account's `reactivate` command says in advance.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              last_administrator: { $ref: ../../../fixtures/api/user_deactivation_refused.json }
              anonymized: { $ref: ../../../fixtures/api/user_reactivation_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/users/{user_id}/anonymization:
  post:
    operationId: anonymizeUser
    tags: [users]
    summary: Anonymise a deactivated account
    description: >-
      At the person's request, a deactivated account is anonymised, irreversibly
      (WF-ADM-0060): its last name, first name and address become null (`anonymized_at` says
      when), its avatar is removed, and the label that designates it in the audit log, as
      author or as object, is erased from all entries, their number, their dates and
      their actions unchanged (WF-SEC-0030); the front presents it everywhere under the neutral
      label of its catalogue. Its actions remain attributed to it, by its identifier; it keeps
      its roles, its attachment, and the identifier the identity provider gives it, by which the
      account read recognises it without modifying or recreating it (WF-ADM-0070). A local
      account is moreover removed from the identity provider, before the anonymisation is
      written: if the provider does not respond, 503 (`identity_provider`), nothing is written,
      and the anonymisation is requested again. An account from the directory or from an
      external provider is not touched in the provider. No confirmation is requested here: the
      screen requests it. The anonymisation is recorded in the audit log (`user_anonymize`, the
      object being the account, with no label or parameter). Under the permission to modify
      accounts (`users.write`, WF-ADM-0100); an anonymised account can no longer be reactivated,
      nor anonymised again.
    parameters:
      - $ref: ../components/parameters.yaml#/UserId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/access.yaml#/UserAnonymizationWrite }
    responses:
      '200':
        description: Account anonymised.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/User }
            examples:
              anonymized: { $ref: ../../../fixtures/api/user_anonymized.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          An active account, refused: only a deactivated account can be anonymised (WF-ADM-0060),
          and the `anonymize` command is listed only for it: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` at `is_deactivated_account`. An already anonymised account,
          refused, which its `anonymize` command says in advance: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` at `is_not_anonymized`. Nothing is written, and the identity
          provider is not called upon.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              active: { $ref: ../../../fixtures/api/user_anonymization_refused.json }
              anonymized: { $ref: ../../../fixtures/api/user_anonymization_repeated.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503':
        description: >-
          An unavailable component prevents the operation, `COMPONENT_UNAVAILABLE`,
          `params.component` naming it (WF-EXP-0040): the identity provider, which does not remove a local account, nothing being written; or any other, as for every operation (`ServiceUnavailable`).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              identity_provider: { $ref: ../../../fixtures/api/invitation_provider_unavailable.json }

/users/{user_id}/access-roles:
  put:
    operationId: setUserAccessRoles
    tags: [users]
    summary: Assign the access roles of an account
    description: >-
      A user holds one or more roles and has the union of their
      permissions; the change applies immediately, without signing in again
      (WF-ADM-0090). Removing all of their roles revokes their sessions (WF-SEC-0020): a token
      from a sign-in that precedes it is refused with 401 `SESSION_REVOKED`, even after a role
      is given back to them, and the person signs in again (#855). Removing
      the permission to modify accounts or access roles from the last
      active account that holds it is refused (WF-ADM-0120), with `LAST_ADMINISTRATOR`; giving
      it more remains possible, and that account's `set_access_roles` command stays
      available: the server judges the roles sent. Assigning or removing a role falls under
      role management (FBS-1.2, WF-ADM-0090): the operation requires, besides the permission to
      modify accounts (`users.write`), the permission to modify access roles
      (`access_roles.write`); without it, 403 `PERMISSION_MISSING` — whoever holds only
      `users.write` cannot give themselves the administrator role.
    parameters:
      - $ref: ../components/parameters.yaml#/UserId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/access.yaml#/UserRolesWrite }
    responses:
      '200':
        description: Roles assigned.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/User }
            examples:
              attributed: { $ref: ../../../fixtures/api/user_access_roles_set.json }
              cleared: { $ref: ../../../fixtures/api/user_access_roles_cleared.json }
              two_roles: { $ref: ../../../fixtures/api/user_access_roles_two.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Roles that would remove from the last active account that holds them the permission to
          modify accounts or the permission to modify access roles, refused, nothing
          being written (WF-ADM-0120): `LAST_ADMINISTRATOR`, like `LAST_PROJECT_MANAGER` —
          the refusal depends on the roles sent, which no command says in advance.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              last_administrator: { $ref: ../../../fixtures/api/user_access_roles_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          A write refused per field, `VALIDATION_FAILED`, `fields` designating each faulty
          field (WF-ADM-0050): an access
          role the installation does not have, or a deleted one (`/access_role_ids/<rank>`,
          `UNKNOWN_ACCESS_ROLE`). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              unknown_access_role: { $ref: ../../../fixtures/api/user_access_roles_unknown.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/users/{user_id}/password-link:
  post:
    operationId: createPasswordSetupLink
    tags: [users]
    summary: Get the password setup link of an account
    description: >-
      Generates, for a local account, the link by which its holder sets or resets their
      password, and returns it to the caller so that they hand it over by another channel
      (WF-ADM-0140) — resending the email that carries it is `resendInvitation` —: this is how
      the first administrator sets their password at installation (WF-EXP-0020) and how a reset
      is done on an installation without email (WF-CMP-0030). The link is the one the identity
      provider's email would carry — single-use, valid for one hour, leading to that provider's
      page that sets the password, and not to a Waterfall screen —, created by it, and
      returned only once: a previous link of the same account ceases to be valid. Under the
      permission to modify accounts (`users.write`, WF-ADM-0100); each request is recorded in
      the audit log, without the token (WF-SEC-0030). No screen presents, asks for or captures a
      password: this link is the only authentication element Waterfall shows (WF-ADM-0140).
    parameters:
      - $ref: ../components/parameters.yaml#/UserId
    responses:
      '201':
        description: Link generated, to be handed over to the holder.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/PasswordSetupLink }
            examples:
              witness: { $ref: ../../../fixtures/api/password_setup_link.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` naming the missing condition
          (`CommandCondition`), the one the account states in advance for its command
          (`create_password_link`), judged in this order: `is_local_account` when the account
          is not local — an account from the directory or from an external provider authenticates
          with the identity provider and has no password to set here —,
          `is_not_anonymized` when it is anonymised — removed from the identity provider,
          irreversibly, which its reactivation would not undo —, `is_active_account` when it is
          deactivated (WF-ADM-0140, WF-ADM-0060). The refusal names the first one missing.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              not_local: { $ref: ../../../fixtures/api/password_link_not_local.json }
              anonymized: { $ref: ../../../fixtures/api/password_link_anonymized.json }
              deactivated: { $ref: ../../../fixtures/api/password_link_deactivated.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/users/{user_id}/invitation:
  post:
    operationId: resendInvitation
    tags: [users]
    summary: Resend the password setup email of an account
    description: >-
      Has the identity provider send again, to the address of a local account, the email that
      carries the link by which its holder sets or resets their password (WF-ADM-0140): the
      one `createUser` sends on creation (`UserCreated.invitation_sent`), for a
      holder who did not receive it, lost it or let it expire. The link is the one
      `createPasswordSetupLink` would return — single-use, valid for one hour, leading to the
      identity provider's page —, and a previous link of the same account ceases to be valid;
      Waterfall does not see it. Under the permission to modify accounts (`users.write`,
      WF-ADM-0100); each resend is recorded in the audit log like the request for a link,
      `password_link_create`, without the token (WF-SEC-0030). An email that the provider
      does not send — installation without email (WF-CMP-0030), failing mail server,
      unreachable provider — returns 503 `COMPONENT_UNAVAILABLE`, `params.component` at
      `identity_provider`, and is never presented as sent (WF-EXP-0040): the screen then
      offers the link to be handed over by another channel (`createPasswordSetupLink`).
    parameters:
      - $ref: ../components/parameters.yaml#/UserId
    responses:
      '204':
        description: Email sent by the identity provider.
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` naming the missing condition
          (`CommandCondition`), the one the account states in advance for its command
          (`resend_invitation`), judged as for the link, in this order: `is_local_account`
          when the account is not local, `is_not_anonymized` when it is anonymised,
          `is_active_account` when it is deactivated (WF-ADM-0140, WF-ADM-0060). The refusal
          names the first one missing. No email goes out.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              not_local: { $ref: ../../../fixtures/api/invitation_not_local.json }
              anonymized: { $ref: ../../../fixtures/api/invitation_anonymized.json }
              deactivated: { $ref: ../../../fixtures/api/invitation_deactivated.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503':
        description: >-
          An unavailable component prevents the operation, `COMPONENT_UNAVAILABLE`,
          `params.component` naming it (WF-EXP-0040): the identity provider, which does not send the email, never presented as sent; or any other, as for every operation (`ServiceUnavailable`).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              identity_provider: { $ref: ../../../fixtures/api/invitation_provider_unavailable.json }

/users/{user_id}/avatar:
  get:
    operationId: getUserAvatar
    tags: [users]
    summary: Avatar of an account
    description: >-
      Image of the account, served as it was uploaded (WF-ADM-0080). Readable by any open
      session, the avatar being shown wherever the account is cited. 404 for an unknown account,
      or for an account without an avatar (`has_avatar` false), the front then showing the
      default image (WF-ADM-0080).
    parameters:
      - $ref: ../components/parameters.yaml#/UserId
    responses:
      '200':
        description: Avatar image.
        content:
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/identity-syncs:
  post:
    operationId: startIdentitySync
    tags: [users]
    summary: Read the identity provider's accounts
    description: >-
      Reads, through the identity provider's administration API, the accounts that its federated
      directory returns there: creates the missing accounts, updates the three identity attributes
      of the accounts read, and deactivates the accounts read that the provider no longer knows.
      Accounts created in Waterfall are not modified, and no role is assigned (WF-ADM-0070):
      it is in the provider that the read restores the last name, first name and address that
      Waterfall holds for a local account, if they differ there, since Waterfall is authoritative
      for them (WF-ADM-0050,
      #919).
      Waterfall never reads the directory itself, and configures none (WF-ADM-0180). On
      an installation without a directory, the read finds no account to read. Handed over to the
      worker (WF-ARC-0090), which first asks the provider to synchronise each directory
      it federates. A person from the directory whose address is already held by an account is
      attached to that account; an anonymised account is neither modified nor recreated; the
      provider's local accounts that Waterfall does not know and that have never had a password
      are removed from it (#707, #811). The scheduled read follows the chosen periodicity
      (`getIdentitySyncSchedule`, WF-ADM-0070). Under the permission to modify accounts
      (`users.write`).
      When successful, the task gives as its result the report of `getLatestIdentitySync`.
    responses:
      '202':
        description: Synchronisation queued.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              queued: { $ref: ../../../fixtures/api/identity_sync_queued.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/identity-syncs/latest:
  get:
    operationId: getLatestIdentitySync
    tags: [users]
    summary: Report of the latest account read
    description: >-
      Accounts created, updated and deactivated during the latest successful read of the
      identity provider's accounts, requested or scheduled, local accounts whose identity it
      restores in the provider, what it left as is with its reason, and
      the local accounts it removes from the provider — restored or removed, or to be: the
      restoration and the removal follow the validation of the read; a failure is logged
      and the next read picks it up (WF-ADM-0070, #811, #919). A Waterfall account left
      as is is named as it reads on consultation, anonymised included (#920). Under the
      permission to view accounts (`users.read`); 404 as long as no read has succeeded.
    responses:
      '200':
        description: Report of the latest read (WF-ADM-0070, WF-ADM-0130).
        content:
          application/json:
            schema: { $ref: ../components/schemas/platform.yaml#/IdentitySyncReport }
            examples:
              witness: { $ref: ../../../fixtures/api/identity_sync_report.json }
              flagged: { $ref: ../../../fixtures/api/identity_sync_report_flagged.json }
              anonymized: { $ref: ../../../fixtures/api/identity_sync_report_anonymized.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/identity-sync-schedule:
  get:
    operationId: getIdentitySyncSchedule
    tags: [users]
    summary: Periodicity of the account read
    description: >-
      The frequency and the time at which the platform reads the identity provider's accounts
      by itself, chosen by an authorised user, daily by default,
      like those of backups (WF-ADM-0070, WF-ADM-0170). A new installation reads the
      delivered periodicity (`IdentitySyncSchedule`): the 404 only means the read is refused.
      Readable under the permission to view accounts (`users.read`, WF-ADM-0100).
    responses:
      '200':
        description: Current periodicity (WF-ADM-0070).
        content:
          application/json:
            schema: { $ref: ../components/schemas/platform.yaml#/IdentitySyncSchedule }
            examples:
              witness: { $ref: ../../../fixtures/api/identity_sync_schedule.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  put:
    operationId: setIdentitySyncSchedule
    tags: [users]
    summary: Set the periodicity of the account read
    description: >-
      The frequency and the time of the scheduled read, both required, the day for a
      weekly read only, and its activation (WF-ADM-0070): a person added to the
      directory has an account at the end of the chosen periodicity, without intervention. The
      setting applies from the next scheduled read; a read in progress is not interrupted.
      Under the permission to modify accounts (`users.write`, WF-ADM-0100), the one that starts
      the read on demand (`startIdentitySync`).
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/platform.yaml#/IdentitySyncSchedule }
    responses:
      '200':
        description: Periodicity saved, with its next lock version.
        content:
          application/json:
            schema: { $ref: ../components/schemas/platform.yaml#/IdentitySyncSchedule }
            examples:
              set: { $ref: ../../../fixtures/api/identity_sync_schedule_set.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          A refused periodicity, `VALIDATION_FAILED`, `fields` designating each faulty
          field, like that of backups: a missing frequency or time, with
          `VALUE_REQUIRED`; a time outside `HH:MM` (`/at_time`) or a frequency outside `daily`
          and `weekly` (`/frequency`), `VALIDATION_FAILED`; a day outside 1 to 7 (`/weekday`), `VALUE_OUT_OF_RANGE`,
          `params.minimum` or `maximum` the only bound crossed; a null day for a weekly
          read, `/weekday` with `VALUE_REQUIRED`, or one given to a daily read, `/weekday`
          with the pattern's `VALIDATION_FAILED` (WF-ADM-0070). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              weekday_out_of_range: { $ref: ../../../fixtures/api/identity_sync_schedule_weekday_out_of_range.json }
              weekday_missing: { $ref: ../../../fixtures/api/identity_sync_schedule_weekday_missing.json }
              weekday_daily: { $ref: ../../../fixtures/api/identity_sync_schedule_weekday_daily.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/permissions:
  get:
    operationId: listPermissions
    tags: [access]
    summary: Permission catalogue
    description: >-
      Two permissions per second-level function, plus a dedicated permission per
      irreversible or structuring action. The catalogue is delivered and not modifiable:
      no screen allows creating one (WF-ADM-0100). Readable by any open session: the catalogue
      is delivered and names no object.
    responses:
      '200':
        description: Complete catalogue.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/access.yaml#/Permission }
            examples:
              witness: { $ref: ../../../fixtures/api/permissions.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/access-roles:
  get:
    operationId: listAccessRoles
    tags: [access]
    summary: Access roles
    description: >-
      The access roles, the predefined ones as well as those created afterwards (WF-ADM-0010,
      WF-ADM-0090). A flat table: each column sorts in both directions, on the
      server (WF-IHM-0060), and is filtered (WF-IHM-0130) — the label with the search
      (`search`), the kind with `is_predefined`, the number of holders with two inclusive
      bounds (`holder_count_min`, `holder_count_max`), the audit columns (WF-DAT-0070) with
      a period each (`created_at_from`, `created_at_to`, `updated_at_from`,
      `updated_at_to`) and by their author, an account or the platform (`created_by_user_id`,
      `created_by_kind`, `updated_by_user_id`, `updated_by_kind`); the filters combine. A
      deactivated author stays named in the audit columns (WF-ADM-0060); an anonymised author
      no longer has a name there (`ActorRef.display_name` null), which the front presents under
      the neutral label of its catalogue. The number
      of holders (`holder_count`) counts all the accounts that hold the role, deactivated ones
      included. Deleted roles (`deleteAccessRole`) no longer appear. A tie in the sort is
      broken by the order of the unsorted list — the label —, then by the role identifier,
      in ascending order, so that two successive reads return the same order
      (WF-IHM-0060, #741). Without pagination: an installation has a few dozen roles
      at most — the three predefined ones and those it composes —, which the screen paginates
      itself, the response being the whole list. Readable under the permission to view access
      roles (`access_roles.read`, WF-ADM-0100); 404 without it (WF-ADM-0110).
    parameters:
      - $ref: ../components/parameters.yaml#/Search
      - name: is_predefined
        in: query
        description: >-
          Restricts to one of the two kinds, the kind column being filtered (WF-IHM-0130):
          true, only the predefined roles delivered with the platform (WF-ADM-0010); false, only
          the roles composed afterwards (WF-ADM-0090). When absent, restricts nothing.
        schema: { type: boolean }
      - name: holder_count_min
        in: query
        description: >-
          Lower bound, inclusive, of the number of holders: restricts to the roles held by at
          least that many accounts (WF-IHM-0130). The service checks both bounds after the
          schemas of the other parameters: a bound that is not an integer is refused with
          them, but a negative bound, or one lower than the other, is only refused, and named,
          once those schemas are satisfied.
        schema: { type: integer, minimum: 0 }
      - name: holder_count_max
        in: query
        description: >-
          Upper bound, inclusive, of the number of holders: restricts to the roles held by at
          most that many accounts — at 0, the roles no one holds (WF-IHM-0130).
          Lower than `holder_count_min`, it is refused with 422.
        schema: { type: integer, minimum: 0 }
      - $ref: ../components/parameters.yaml#/CreatedAtFrom
      - $ref: ../components/parameters.yaml#/CreatedAtTo
      - $ref: ../components/parameters.yaml#/CreatedByUserId
      - $ref: ../components/parameters.yaml#/CreatedByKind
      - $ref: ../components/parameters.yaml#/UpdatedAtFrom
      - $ref: ../components/parameters.yaml#/UpdatedAtTo
      - $ref: ../components/parameters.yaml#/UpdatedByUserId
      - $ref: ../components/parameters.yaml#/UpdatedByKind
      - name: sort_by
        in: query
        description: >-
          Sort column; when absent, the label. The columns of the roles table: the label,
          the kind — predefined roles before composed ones in ascending order — and the number
          of holders; then the audit columns (WF-DAT-0070): the creation and last
          modification dates, and their authors, like those of `listUsers` — by the account's
          display name, compared in Unicode code point order, in ascending order an
          anonymised account after the names, and the platform after the accounts. Two tied
          roles are ordered by their label, then by their identifier, in ascending order.
        schema:
          type: string
          enum:
            - label
            - is_predefined
            - holder_count
            - created_at
            - created_by
            - updated_at
            - updated_by
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Roles, including the three predefined ones (WF-ADM-0010).
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/access.yaml#/AccessRole }
            examples:
              witness: { $ref: ../../../fixtures/api/access_roles.json }
              composed: { $ref: ../../../fixtures/api/access_roles_composed.json }
              unheld: { $ref: ../../../fixtures/api/access_roles_unheld.json }
              by_updated_by: { $ref: ../../../fixtures/api/access_roles_by_updated_by.json }
              updated_by_deactivated:
                $ref: ../../../fixtures/api/access_roles_updated_by_deactivated.json
              updated_by_anonymized:
                $ref: ../../../fixtures/api/access_roles_updated_by_anonymized.json
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          A malformed bound, which is not a positive or zero integer: `VALIDATION_FAILED`,
          `fields[]` designating it, `/query/<bound>`, with `NUMBER_INVALID`. An upper bound
          lower than the lower bound: `fields[]` designating `/query/holder_count_max` with
          `VALUE_OUT_OF_RANGE`, `params.minimum` the lower bound given. A malformed instant,
          `/query/<column>_from` or `/query/<column>_to` with `DATE_INVALID`; a period whose
          end precedes its start, at its end (`/query/created_at_to`, `/query/updated_at_to`) with
          `VALUE_OUT_OF_RANGE`, `params.minimum` the start given, the rule of every period in the
          contract. `fields[]` designates each parameter refused by its schema, and an inconsistency
          between parameters once the schemas are satisfied.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              bounds_inverted: { $ref: ../../../fixtures/api/access_roles_bounds_inverted.json }
              period_inverted: { $ref: ../../../fixtures/api/access_roles_period_inverted.json }
              number_invalid: { $ref: ../../../fixtures/api/access_roles_number_invalid.json }
              date_invalid: { $ref: ../../../fixtures/api/access_roles_date_invalid.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createAccessRole
    tags: [access]
    summary: Compose an access role
    description: >-
      Any set of permissions can be composed: no action is reserved for an
      actor (WF-ADM-0020). Under the permission to modify access roles (`access_roles.write`,
      WF-ADM-0100).
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/access.yaml#/AccessRoleWrite }
    responses:
      '201':
        description: Role created.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/AccessRole }
            examples:
              witness: { $ref: ../../../fixtures/api/access_role_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/access-roles/{access_role_id}:
  get:
    operationId: getAccessRole
    summary: An access role
    description: >-
      A role and the permissions it carries, taken from the catalogue (WF-ADM-0090,
      WF-ADM-0100). Readable under the permission to view access roles (`access_roles.read`,
      WF-ADM-0100); 404 without it, as for an unknown role (WF-ADM-0110).
    tags: [access]
    parameters:
      - $ref: ../components/parameters.yaml#/AccessRoleId
    responses:
      '200':
        description: Role.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/AccessRole }
            examples:
              witness: { $ref: ../../../fixtures/api/access_role.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  patch:
    operationId: updateAccessRole
    tags: [access]
    summary: Modify a role
    description: >-
      The change applies immediately to all its holders (WF-ADM-0090). Under the permission to
      modify access roles (`access_roles.write`, WF-ADM-0100), on a role the caller can consult
      (`access_roles.read`): 404 without it (WF-ADM-0110).
    parameters:
      - $ref: ../components/parameters.yaml#/AccessRoleId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/access.yaml#/AccessRoleUpdate }
    responses:
      '200':
        description: Role modified.
        content:
          application/json:
            schema: { $ref: ../components/schemas/access.yaml#/AccessRole }
            examples:
              witness: { $ref: ../../../fixtures/api/access_role_updated.json }
              marking_granted: { $ref: ../../../fixtures/api/access_role_marking_granted.json }
              renamed: { $ref: ../../../fixtures/api/access_role_renamed.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          A modification that would remove from the last active account that holds them the
          permission to modify accounts or the permission to modify access roles, refused,
          nothing being written (WF-ADM-0120): `LAST_ADMINISTRATOR`, the refusal depending on the
          permissions sent.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              last_administrator: { $ref: ../../../fixtures/api/access_role_update_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  delete:
    operationId: deleteAccessRole
    tags: [access]
    summary: Delete a role
    description: >-
      Logical deletion (WF-DAT-0080): the role is no longer offered — neither `listAccessRoles`,
      nor `getAccessRole`, nor assignment to an account returns it — and its trace is kept,
      with what the audit log says about it. A deleted role is a 404, like a role that
      never existed. Refused as long as an account holds it (WF-ADM-0090, WF-ADM-0120). Under
      the permission to modify access roles (`access_roles.write`, WF-ADM-0100), on a role the
      caller can consult (`access_roles.read`): 404 without it (WF-ADM-0110).
    parameters:
      - $ref: ../components/parameters.yaml#/AccessRoleId
      - name: lock_version
        in: query
        required: true
        description: >-
          The lock version of the deleted role, as the screen read it (`AccessRole.lock_version`):
          when stale, the deletion is refused with 412 and nothing is deleted (WF-IHM-0110;
          author's decision of 2026-11-01, #1733).
        schema: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '204':
        description: Role deleted.
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Role still held by an account, deactivated ones included, `ACCESS_ROLE_IN_USE`
          (WF-ADM-0090); nothing is deleted.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              in_use: { $ref: ../../../fixtures/api/access_role_delete_refused.json }
      '412':
        description: >-
          `STALE_LOCK_VERSION`: the role has been written since it was read, and nothing is
          deleted; `params.expected_lock_version` is its current lock version (WF-IHM-0110, #1733).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/access_role_delete_stale.json }
      '422': { $ref: ../components/responses.yaml#/LockVersionInvalid }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
