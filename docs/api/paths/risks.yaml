/projects/{project_id}/risks:
  get:
    operationId: listRisks
    tags: [risks]
    summary: Registre des risques
    description: >-
      Libellé, probabilité, gravité, provision, état et date du dernier réexamen, avec la
      case de matrice et les totaux de provisions (WF-RIS-0040), tels que la révision lue
      les porte (`revision_id`, WF-RIS-0030). Le tri et les filtres sont faits par le
      serveur, et les totaux sont ceux des risques retenus (WF-IHM-0130).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskRevision
      - name: states
        in: query
        schema:
          type: array
          items: { $ref: ../components/schemas/risks.yaml#/RiskState }
        explode: false
      - name: zones
        in: query
        description: Restreint aux risques dont la case de matrice est dans l'une de ces zones.
        schema:
          type: array
          items: { $ref: ../components/schemas/reference.yaml#/AlertZone }
        explode: false
      - $ref: ../components/parameters.yaml#/Search
      - name: sort_by
        in: query
        description: Colonne du tri ; absente, l'ordre de déclaration.
        schema:
          type: string
          enum: [label, probability, severity, provision_amount, state, last_review_on]
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Risques et totaux.
        content:
          application/json:
            schema:
              type: object
              required: [items, totals]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/risks.yaml#/Risk }
                totals: { $ref: ../components/schemas/risks.yaml#/ProvisionTotals }
            examples:
              witness: { $ref: ../../../fixtures/api/risks.json }
              empty: { $ref: ../../../fixtures/api/risks_empty.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
  post:
    operationId: createRisk
    tags: [risks]
    summary: Déclarer un risque
    description: >-
      La création ouvre la structure de coûts propre du risque et sa ligne de provision
      dans la structure principale (WF-RIS-0010, WF-RIS-0030). La provision d'un risque
      identifié ne fait pas partie du budget de référence (WF-RIS-0050). Une saisie de la
      révision en cours, que le projet crée au préalable s'il n'en a pas, et qu'annule
      `undoLastChange` (WF-RIS-0020, WF-IHM-0110) : elle relève de `edit_risks`
      (`RevisionCommand`). La ligne de provision porte la catégorie que le risque désigne parmi
      les catégories actives de type provision pour risques, retenue sans être demandée quand il
      n'en existe qu'une, et appartient au sous-projet qu'il désigne, facultativement
      (WF-RIS-0010 ; EP-14/L42p, #579, C-299) : le formulaire lit les catégories actives
      (`listCostCategories`, `cost_type_kind`) et les sous-projets du projet (`listSubprojects`)
      pour en proposer le choix.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/risks.yaml#/RiskWrite }
    responses:
      '201':
        description: Risque créé.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/Risk }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Aucune catégorie de coût active n'est de type provision pour risques — jusqu'à C-291
          (#728), aucune catégorie active sous une nature active de ce type : la provision n'a pas
          de catégorie où se ranger (WF-RIS-0010). `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` à `active_provision_category`, que la création d'un projet
          exige aussi (WF-CYC-0120). Les conditions se jugent dans cet ordre, et le refus nomme la
          première qui manque : `at_least_one_task` — une structure principale sans tâche
          (WF-RIS-0010), dont le 409 reste à décrire (#728) —, puis `active_provision_category`.
          Ce 409 précède le 422 : sans catégorie active, aucune désignation ne serait valable, et
          les champs ne sont pas jugés. Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              without_provision_category: { $ref: ../../../fixtures/api/risk_without_provision_category.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant chaque champ : `/label` vide, `VALUE_REQUIRED`, ou
          plus long que le schéma ne l'admet, `VALUE_TOO_LONG` ; `/provision_cost_category_id`
          omise quand plusieurs catégories actives sont de type provision pour risques,
          `VALUE_REQUIRED`, inconnue, `UNKNOWN_COST_CATEGORY`, désactivée,
          `INACTIVE_REFERENCE_OBJECT` — une catégorie désactivée, ou sous une nature désactivée —,
          ou d'une nature d'un autre type,
          `PROVISION_CATEGORY_REQUIRED` ; `/provision_subproject_id` que le projet n'a pas,
          `UNKNOWN_SUBPROJECT` (WF-RIS-0010). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              provision_refused: { $ref: ../../../fixtures/api/risk_provision_refused.json }

/projects/{project_id}/risks/{risk_id}:
  get:
    operationId: getRisk
    summary: Un risque
    description: >-
      Attributs du risque et état où il se trouve dans la révision lue (`revision_id`,
      WF-RIS-0010, WF-RIS-0020, WF-RIS-0030).
    tags: [risks]
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
      - $ref: ../components/parameters.yaml#/RiskRevision
    responses:
      '200':
        description: Risque.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/Risk }
            examples:
              witness: { $ref: ../../../fixtures/api/risk.json }
              occurred: { $ref: ../../../fixtures/api/risk_occurred_detail.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
  patch:
    operationId: updateRisk
    tags: [risks]
    summary: Modifier un risque
    description: >-
      La gravité et la provision ne sont pas saisissables : elles suivent la structure
      propre et la probabilité (WF-RIS-0010). Le devis propre reste modifiable tout au
      long du projet (WF-RIS-0030). Une saisie de la révision en cours, créée au besoin et
      annulable (WF-RIS-0020, WF-IHM-0110) — l'annulation rend aussi la catégorie et le sous-projet
      de la provision d'avant, et elle est refusée quand ce sous-projet a été supprimé depuis
      (409 `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `restored_subproject_exists` ; décision
      de l'auteur, #732) ; refusée sur un risque survenu, par 409
      `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `risk_not_occurred` — la
      commande `update` du risque le disait déjà indisponible. La catégorie et le sous-projet de
      la provision se changent tant que le risque est identifié (WF-RIS-0010), ce que la commande
      `update_provision` dit d'avance ; omis, ils restent ceux du risque.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/risks.yaml#/RiskUpdate }
    responses:
      '200':
        description: Risque modifié.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/Risk }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `risk_not_occurred` pour un
          risque survenu, que la commande `update` dit indisponible ; sinon à `risk_identified`
          pour une autre catégorie ou un autre sous-projet de provision envoyés pour un risque
          écarté, que la commande `update_provision` dit indisponible (WF-RIS-0010). Rien n'est
          écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              provision_frozen: { $ref: ../../../fixtures/api/risk_provision_frozen.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant chaque champ, comme à la déclaration
          (`createRisk`), à ceci près que `INACTIVE_REFERENCE_OBJECT` ne vaut sur
          `/provision_cost_category_id` que si la valeur change la catégorie du risque : sa
          catégorie inchangée, désactivée depuis, est acceptée. Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
  delete:
    operationId: deleteRisk
    tags: [risks]
    summary: Supprimer un risque
    description: >-
      Un risque qu'aucune révision marquée ne cite encore peut être supprimé, avec son devis
      propre et sa ligne de provision ; au-delà, il s'écarte (WF-RIS-0020) : la suppression
      d'un risque cité par une révision marquée est refusée par 409,
      `STATE_FORBIDS_OPERATION`, `params.missing_condition` nommant `risk_not_cited`, et c'est
      le réexamen (`reviewRisk`) qui l'écarte. Un risque survenu ne se supprime pas non plus :
      aucune transition n'en part (WF-RIS-0020), `params.missing_condition` à
      `risk_not_occurred`. `missing_condition` n'en nomme qu'une : quand les deux manquent,
      `risk_not_occurred` l'emporte — un survenu ne s'écarte pas, et le renvoyer vers le
      réexamen serait faux —, comme la commande `delete` les liste dans cet ordre. Relève de la saisie des risques
      (`edit_risks`, `risks.write`), dans la révision en cours, créée au besoin, et
      s'annule (WF-RIS-0020, WF-IHM-0110) — une annulation refusée par 409, `params.missing_condition`
      à `restored_subproject_exists`, quand elle rendrait à sa provision un sous-projet supprimé
      depuis (décision de l'auteur, #732) ; la commande `delete` du risque dit d'avance s'il se
      supprime.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
    responses:
      '204':
        description: Risque supprimé, son devis propre et sa ligne de provision avec lui.
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `risk_not_occurred` pour un
          risque survenu, dont aucune transition ne part, et sinon à `risk_not_cited` : le risque
          est cité par une révision marquée, il ne se supprime plus, il s'écarte (WF-RIS-0020).
          Quand les deux manquent, `risk_not_occurred` est nommée.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              cited: { $ref: ../../../fixtures/api/risk_delete_cited.json }

/projects/{project_id}/risks/{risk_id}/reviews:
  get:
    operationId: listRiskReviews
    tags: [risks]
    summary: Historique des réexamens
    description: >-
      Chaque réexamen est daté et conserve la probabilité, la gravité et l'état retenus
      (WF-RIS-0010). Pour une révision marquée (`revision_id`), les réexamens faits
      jusqu'à son marquage : ceux qui le suivent n'appartiennent pas à ce qu'elle fige
      (WF-RIS-0030).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
      - $ref: ../components/parameters.yaml#/RiskRevision
    responses:
      '200':
        description: Réexamens, du plus récent au plus ancien.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/risks.yaml#/RiskReview }
            examples:
              witness: { $ref: ../../../fixtures/api/risk_reviews.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
  post:
    operationId: reviewRisk
    tags: [risks]
    summary: Réexaminer un risque
    description: >-
      La confirmation sans modification produit un réexamen daté ; un risque identifié
      peut être écarté, et un risque écarté redevenir identifié (WF-RIS-0010,
      WF-RIS-0020). Écarter un risque retire sa ligne de provision du reste à engager ;
      la réserve pour risques de la révision de référence et le budget de référence
      restent inchangés (WF-RIS-0050). Un risque écarté qui redevient identifié recrée sa ligne
      de provision avec la catégorie qu'il désignait si elle est encore active, et sinon avec
      celle que le réexamen désigne, comme à la déclaration (WF-RIS-0010 ; EP-14/L42p) ; hors
      sous-projet si le sous-projet qu'il désignait a été supprimé (#732). Une saisie de la
      révision en cours, créée au besoin : son annulation rend au risque sa probabilité et son
      état précédents, et la catégorie qu'il désignait avant un retour à l'état identifié
      (WF-RIS-0020, WF-IHM-0110).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/risks.yaml#/RiskReviewWrite }
    responses:
      '201':
        description: Réexamen enregistré.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/Risk }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Le risque est survenu : aucune transition n'en part (WF-RIS-0020).
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `risk_not_occurred`. Ou un
          risque écarté qui redeviendrait identifié alors qu'aucune catégorie de coût active n'est
          de type provision pour risques (WF-RIS-0010) : `params.missing_condition` à
          `active_provision_category`. Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant `/provision_cost_category_id` quand un risque
          écarté redevient identifié et que la catégorie qu'il désignait n'est plus active, par les
          motifs de la déclaration (`createRisk`). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }

/projects/{project_id}/risks/{risk_id}/occurrence:
  post:
    operationId: declareRiskOccurrence
    tags: [risks]
    summary: Déclarer un risque survenu
    description: >-
      Fusionne les tâches et les lignes du devis propre dans la structure principale de la
      révision en cours, avec un montant budgété nul, et retire la ligne de provision ; ne
      marque aucune révision et ne déplace pas la référence (WF-RIS-0060, WF-RIS-0050) :
      l'exemple `nodes_risk_occurred` de `listNodes` montre la structure obtenue. Les tâches
      qu'elle ajoute ne portent aucun rattachement au lotissement, le devis propre d'un risque
      n'en portant pas (WF-PLA-0170). Lorsque le projet n'a pas de révision en cours, la
      survenance en crée une au préalable (WF-RIS-0060). Définitif, hors de l'historique
      d'annulation, confié au worker, inscrit au journal d'audit (WF-RIS-0020, WF-IHM-0110,
      WF-ARC-0090, WF-SEC-0030) ; pendant son traitement, les commandes d'écriture de la
      révision en cours sont indisponibles (`no_background_task_running`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/risks.yaml#/RiskOccurrence }
    responses:
      '202':
        description: Survenance mise en file.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409': { $ref: ../components/responses.yaml#/Conflict }

/projects/{project_id}/risks/coverage:
  get:
    operationId: getProjectRiskCoverage
    tags: [risks]
    summary: Couverture des risques
    description: >-
      La réserve pour risques de la révision de référence, face aux provisions des
      risques identifiés dans la révision courante et au coût réestimé des risques
      survenus, et leur écart signé (WF-RIS-0050, WF-RAE-0020). Dans la révision nommée,
      ou la révision courante.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskRevision
    responses:
      '200':
        description: Couverture des risques du projet.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/RiskCoverage }
            examples:
              witness: { $ref: ../../../fixtures/api/risk_coverage.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }

/projects/{project_id}/risks/matrix:
  get:
    operationId: getProjectRiskMatrix
    tags: [risks]
    summary: Matrice de risques du projet
    description: >-
      Quatre niveaux de probabilité et quatre de gravité, d'après le référentiel
      (WF-REF-0160, WF-RIS-0040), remplie par les risques de la révision lue
      (`revision_id`, WF-RIS-0030) ; chaque niveau dit ses bornes, celles de gravité en pourcentage du
      budget de référence. Chaque case porte sa zone, doublée d'un indice non coloré à
      l'affichage (WF-IHM-0070).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskRevision
    responses:
      '200':
        description: Matrice remplie et totaux.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/RiskMatrix }
            examples:
              witness: { $ref: ../../../fixtures/api/risk_matrix.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
