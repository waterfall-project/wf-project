/projects/{project_id}/risks:
  get:
    operationId: listRisks
    tags: [risks]
    summary: Registre des risques
    description: >-
      Libellé, probabilité, gravité, provision, état et date du dernier réexamen, avec la
      case de matrice et les totaux de provisions (WF-RIS-0040), tels que la révision lue
      les porte (`revision_id`, WF-RIS-0030). Le tri et les filtres sont faits par le
      serveur, et les totaux sont ceux des risques retenus (WF-IHM-0130) : de tous les risques
      que les filtres et la recherche retiennent, non de la seule page lue. Le registre est une
      table plate, paginée comme toute autre (`limit`, `offset`, `meta` ; WF-IHM-0060, #1367).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskRevision
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - name: states
        in: query
        description: Restreint aux risques dans l'un de ces états (WF-RIS-0040).
        schema:
          type: array
          items: { $ref: ../components/schemas/risks.yaml#/RiskState }
        explode: false
      - name: zones
        in: query
        description: Restreint aux risques dont la case de matrice est dans l'une de ces zones.
        schema:
          type: array
          items: { $ref: ../components/schemas/reference.yaml#/AlertZone }
        explode: false
      - $ref: ../components/parameters.yaml#/Search
      - name: sort_by
        in: query
        description: Colonne du tri ; absente, l'ordre de déclaration.
        schema:
          type: string
          enum: [label, probability, severity, provision_amount, state, last_review_on]
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Risques et totaux.
        content:
          application/json:
            schema:
              type: object
              required: [items, totals, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/risks.yaml#/Risk }
                totals: { $ref: ../components/schemas/risks.yaml#/ProvisionTotals }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/risks.json }
              empty: { $ref: ../../../fixtures/api/risks_empty.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createRisk
    tags: [risks]
    summary: Déclarer un risque
    description: >-
      La création ouvre la structure de coûts propre du risque et sa ligne de provision
      dans la structure principale (WF-RIS-0010, WF-RIS-0030). La provision d'un risque
      identifié ne fait pas partie du budget de référence (WF-RIS-0050). Une saisie de la
      révision en cours, que le projet crée au préalable s'il n'en a pas, et qu'annule
      `undoLastChange` (WF-RIS-0020, WF-IHM-0110) : elle relève de `edit_risks`
      (`RevisionCommand`), et la commande `declare_risk` dit d'avance si elle aboutirait — une
      structure principale avec une tâche, une catégorie active de type provision pour risques
      (EP-14/L42s). La ligne de provision porte la catégorie que le risque désigne parmi
      les catégories actives de type provision pour risques, retenue sans être demandée quand il
      n'en existe qu'une, et appartient au sous-projet qu'il désigne, facultativement
      (WF-RIS-0010 ; EP-14/L42p, #579, C-299) : le formulaire lit les catégories actives
      (`listCostCategories`, `cost_type_kind`) et les sous-projets du projet (`listSubprojects`)
      pour en proposer le choix. Elle est portée par la tâche de la structure principale qu'il
      désigne, facultativement, et à défaut par la première tâche de premier niveau
      (`provision_task_id`, WF-RIS-0010, #786) : le formulaire lit les tâches de la structure
      principale (`listNodes`). La réponse nomme la structure propre créée (`structure_id`), la
      ligne de provision (`provision_node_id`) et sa tâche (`provision_task`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/risks.yaml#/RiskWrite }
    responses:
      '201':
        description: Risque créé.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/Risk }
            examples:
              created: { $ref: ../../../fixtures/api/risk_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` nommant la condition qui manque.
          Le projet est terminal, `project_not_terminal` (WF-CYC-0100), ou un traitement de fond
          court sur la révision en cours, `no_background_task_running` : les conditions d'état de
          la saisie des risques. Ou la structure principale de la révision en cours, ou de celle
          que la déclaration créerait, ne comporte aucune tâche : « La déclaration d'un risque
          sur une structure principale sans tâche est refusée, en nommant la condition
          manquante » (WF-RIS-0010) — la ligne de provision n'aurait pas de tâche où se ranger ;
          `at_least_one_task` (EP-14/L42s). Ou aucune catégorie de coût active n'est de type
          provision pour risques : la provision n'a pas de catégorie où se ranger (WF-RIS-0010) ;
          `active_provision_category`, que la création d'un projet exige aussi (WF-CYC-0120). Les
          conditions se jugent dans l'ordre où la commande `declare_risk` les liste, et le refus
          nomme la première qui manque : `project_not_terminal`, puis
          `no_background_task_running`, puis `at_least_one_task`, puis
          `active_provision_category`. Ce 409 précède le 422 : sans tâche ni catégorie active,
          aucune désignation ne serait valable, et les champs ne sont pas jugés. Rien n'est
          écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              without_provision_category: { $ref: ../../../fixtures/api/risk_without_provision_category.json }
              without_task: { $ref: ../../../fixtures/api/risk_without_task.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant chaque champ : `/label` vide, `VALUE_REQUIRED`, ou
          plus long que le schéma ne l'admet, `VALUE_TOO_LONG` ; `/provision_cost_category_id`
          omise quand plusieurs catégories actives sont de type provision pour risques,
          `VALUE_REQUIRED`, inconnue, `UNKNOWN_COST_CATEGORY`, désactivée,
          `INACTIVE_REFERENCE_OBJECT` — une catégorie désactivée, ce qu'est toute catégorie
          d'une nature désactivée (WF-REF-0010, C-291) —, ou d'une nature d'un autre type,
          `PROVISION_CATEGORY_REQUIRED` ; `/provision_subproject_id` que le projet n'a pas,
          `UNKNOWN_SUBPROJECT` ; `/provision_task_id` qui n'est pas une tâche de la structure
          principale de la révision en cours, `UNKNOWN_TASK` (WF-RIS-0010, #786) ;
          `/probability` hors de 0 à 1, `VALUE_OUT_OF_RANGE`, la borne franchie dans `params`.
          Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              provision_refused: { $ref: ../../../fixtures/api/risk_provision_refused.json }
              provision_task_refused:
                $ref: ../../../fixtures/api/risk_provision_task_refused.json
              probability_out_of_range:
                $ref: ../../../fixtures/api/risk_probability_out_of_range.json
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/risks/{risk_id}:
  get:
    operationId: getRisk
    summary: Un risque
    description: >-
      Attributs du risque et état où il se trouve dans la révision lue (`revision_id`,
      WF-RIS-0010, WF-RIS-0020, WF-RIS-0030).
    tags: [risks]
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
      - $ref: ../components/parameters.yaml#/RiskRevision
    responses:
      '200':
        description: Risque.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/Risk }
            examples:
              witness: { $ref: ../../../fixtures/api/risk.json }
              occurred: { $ref: ../../../fixtures/api/risk_occurred_detail.json }
              dismissed_category_deactivated:
                $ref: ../../../fixtures/api/risk_dismissed_category_deactivated.json
              uncited: { $ref: ../../../fixtures/api/risk_uncited.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  patch:
    operationId: updateRisk
    tags: [risks]
    summary: Modifier un risque
    description: >-
      La gravité et la provision ne sont pas saisissables : elles suivent la structure
      propre et la probabilité (WF-RIS-0010). La probabilité ne se modifie pas ici : la changer
      est un réexamen daté, que seul `reviewRisk` écrit et que l'historique montre
      (`RiskUpdate`, WF-RIS-0010, WF-RIS-0040 ; H-04). Le devis propre reste modifiable tout au
      long du projet (WF-RIS-0030). Une saisie de la révision en cours, créée au besoin et
      annulable (WF-RIS-0020, WF-IHM-0110) — l'annulation rend aussi la catégorie et le sous-projet
      de la provision d'avant, et elle est refusée quand ce sous-projet a été supprimé depuis
      (409 `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `restored_subproject_exists` ; décision
      de l'auteur, #732) ; refusée sur un risque survenu, par 409
      `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `risk_not_occurred` — la
      commande `update` du risque le disait déjà indisponible. La catégorie, le sous-projet et la
      tâche de la provision se changent tant que le risque est identifié (WF-RIS-0010), ce que la
      commande `update_provision` dit d'avance ; omis, ils restent ceux du risque. Une autre tâche
      déplace la ligne de provision sur elle, le total du devis inchangé (WF-RIS-0010, #786).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/risks.yaml#/RiskUpdate }
    responses:
      '200':
        description: Risque modifié.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/Risk }
            examples:
              updated: { $ref: ../../../fixtures/api/risk_updated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` nommant les conditions d'état de la saisie des risques, `project_not_terminal` puis
          `no_background_task_running`, jugées avant celles du risque, comme à la déclaration
          (`createRisk`) ;
          puis à `risk_not_occurred` pour un risque survenu, que la commande `update` dit
          indisponible ; sinon à `risk_identified`
          pour une autre catégorie, un autre sous-projet ou une tâche de provision envoyés pour un
          risque écarté, que la commande `update_provision` dit indisponible (WF-RIS-0010). Ce 409
          précède le 422, comme à la déclaration (`createRisk`) : une autre catégorie envoyée pour
          un risque qui n'est pas identifié est refusée par `risk_identified`, qu'elle soit
          désactivée, inconnue ou d'une nature d'un autre type, aucune n'étant valable tant que
          la provision ne se change pas (#747). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              provision_frozen: { $ref: ../../../fixtures/api/risk_provision_frozen.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant chaque champ, comme à la déclaration
          (`createRisk`), à ceci près que `INACTIVE_REFERENCE_OBJECT` ne vaut sur
          `/provision_cost_category_id` que si la valeur change la catégorie du risque : sa
          catégorie inchangée, désactivée depuis, est acceptée. La probabilité n'est pas un champ
          de la modification (`RiskUpdate`). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  delete:
    operationId: deleteRisk
    tags: [risks]
    summary: Supprimer un risque
    description: >-
      Un risque qu'aucune révision marquée ne cite encore peut être supprimé, avec son devis
      propre et sa ligne de provision ; au-delà, il s'écarte (WF-RIS-0020) : la suppression
      d'un risque cité par une révision marquée est refusée par 409,
      `STATE_FORBIDS_OPERATION`, `params.missing_condition` nommant `risk_not_cited`, et c'est
      le réexamen (`reviewRisk`) qui l'écarte. Un risque survenu ne se supprime pas non plus :
      aucune transition n'en part (WF-RIS-0020), `params.missing_condition` à
      `risk_not_occurred`. `missing_condition` n'en nomme qu'une : quand les deux manquent,
      `risk_not_occurred` l'emporte — un survenu ne s'écarte pas, et le renvoyer vers le
      réexamen serait faux —, comme la commande `delete` les liste dans cet ordre. Relève de la saisie des risques
      (`edit_risks`, `risks.write`), dans la révision en cours, créée au besoin, et
      s'annule (WF-RIS-0020, WF-IHM-0110) — une annulation refusée par 409, `params.missing_condition`
      à `restored_subproject_exists`, quand elle rendrait à sa provision un sous-projet supprimé
      depuis (décision de l'auteur, #732) ; la commande `delete` du risque dit d'avance s'il se
      supprime.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
    responses:
      '204':
        description: Risque supprimé, son devis propre et sa ligne de provision avec lui.
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` nommant les conditions d'état de la saisie des risques, `project_not_terminal` puis
          `no_background_task_running`, jugées avant celles du risque, comme à la déclaration
          (`createRisk`) ;
          puis à `risk_not_occurred` pour un risque survenu, dont aucune transition ne part, et
          sinon à `risk_not_cited` : le risque est cité par une révision marquée, il ne se
          supprime plus, il s'écarte (WF-RIS-0020). Quand les deux manquent, `risk_not_occurred`
          est nommée.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              cited: { $ref: ../../../fixtures/api/risk_delete_cited.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/risks/{risk_id}/reviews:
  get:
    operationId: listRiskReviews
    tags: [risks]
    summary: Historique des réexamens
    description: >-
      Chaque réexamen est daté et conserve la probabilité, la gravité et l'état retenus
      (WF-RIS-0010). Pour une révision marquée (`revision_id`), les réexamens faits
      jusqu'à son marquage : ceux qui le suivent n'appartiennent pas à ce qu'elle fige
      (WF-RIS-0030).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
      - $ref: ../components/parameters.yaml#/RiskRevision
    responses:
      '200':
        description: Réexamens, du plus récent au plus ancien.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/risks.yaml#/RiskReview }
            examples:
              witness: { $ref: ../../../fixtures/api/risk_reviews.json }
              reviewed: { $ref: ../../../fixtures/api/risk_reviews_reviewed.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: reviewRisk
    tags: [risks]
    summary: Réexaminer un risque
    description: >-
      La confirmation sans modification produit un réexamen daté ; un risque identifié
      peut être écarté, et un risque écarté redevenir identifié (WF-RIS-0010,
      WF-RIS-0020). C'est la seule écriture de la probabilité d'un risque : la modification
      (`updateRisk`) ne la reçoit pas (H-04). Écarter un risque retire sa ligne de provision du reste à engager ;
      la réserve pour risques et le budget de référence restent inchangés (WF-RIS-0050) ; la
      provision du risque écarté qu'il présente est celle qu'il portait dans la révision de
      référence (`Risk.provision_amount`). Un risque écarté qui redevient identifié recrée sa ligne
      de provision avec la catégorie qu'il désignait si elle est encore active et de type
      provision pour risques (`Risk.provision_cost_category_is_active`, #747), et sinon avec
      celle que le réexamen désigne, comme à la déclaration (WF-RIS-0010 ; EP-14/L42p) ; hors
      sous-projet si le sous-projet qu'il désignait a été supprimé (#732). Sa ligne de provision
      est portée par la tâche qu'il désignait si elle est encore une tâche de la structure
      principale, et sinon par la première tâche de premier niveau (WF-RIS-0010 ; #1227) ;
      `provision_task` reste nul tant que le risque est écarté. Une saisie de la révision en
      cours, créée au besoin : son annulation rend au risque sa probabilité et son
      état précédents, et la catégorie qu'il désignait avant un retour à l'état identifié
      (WF-RIS-0020, WF-IHM-0110).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/risks.yaml#/RiskReviewWrite }
    responses:
      '201':
        description: Réexamen enregistré.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/Risk }
            examples:
              reviewed: { $ref: ../../../fixtures/api/risk_reviewed.json }
              dismissed: { $ref: ../../../fixtures/api/risk_dismissed.json }
              reidentified: { $ref: ../../../fixtures/api/risk_reidentified.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` nommant les conditions d'état de la saisie des risques, `project_not_terminal` puis
          `no_background_task_running`, jugées avant celles du risque, comme à la déclaration
          (`createRisk`).
          Puis le risque est survenu : aucune transition n'en part (WF-RIS-0020),
          `params.missing_condition` à `risk_not_occurred`. Ou un
          risque écarté qui redeviendrait identifié sur une structure principale qui ne comporte
          aucune tâche : « La déclaration d'un risque sur une structure principale sans tâche,
          comme le retour d'un risque écarté à l'état identifié sur une telle structure, est
          refusée, en nommant la condition manquante » (WF-RIS-0010 ; décision de l'auteur, #787)
          — sa ligne de provision n'aurait pas de tâche où se ranger ; `params.missing_condition`
          à `at_least_one_task`. Ou alors qu'aucune catégorie de coût active n'est de type
          provision pour risques (WF-RIS-0010) : `params.missing_condition` à
          `active_provision_category`. Les conditions se jugent dans cet ordre, comme à la
          déclaration, le refus nommant la première qui manque, et ce 409 précède le 422. Rien
          n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              occurred: { $ref: ../../../fixtures/api/risk_review_occurred.json }
              without_task: { $ref: ../../../fixtures/api/risk_review_without_task.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant `/provision_cost_category_id` quand un risque
          écarté redevient identifié et que la catégorie qu'il désignait n'est plus active, ou
          n'est plus de type provision pour risques, par les motifs de la déclaration
          (`createRisk`) ; `/probability` hors de 0 à 1,
          `VALUE_OUT_OF_RANGE`, la borne franchie dans `params`, comme à la déclaration
          (`RiskReviewWrite.probability`, WF-RIS-0010). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              probability_out_of_range:
                $ref: ../../../fixtures/api/risk_review_probability_out_of_range.json
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/risks/{risk_id}/occurrence:
  get:
    operationId: getRiskOccurrenceReport
    tags: [risks]
    summary: Compte rendu préalable de la survenance d'un risque
    description: >-
      Une lecture, qui n'écrit rien : ce que la survenance du risque ferait de la structure
      principale de la révision en cours (WF-RIS-0060), présenté avant sa confirmation comme le
      compte rendu d'une fusion (`RiskOccurrenceReport`, sur le modèle de
      `getStructureMergeReport`) — les tâches et les lignes du devis propre ajoutées sous la tâche
      qui porte la ligne de provision, ou après elle quand c'est un jalon, la ligne de provision
      retirée, la tâche porteuse modifiée —, et la provision retirée du reste à engager. L'écart
      est celui que le serveur calcule, comme pour un différentiel (C-361), et le front ne le
      compose pas (#1383). Abandonner à cette étape, c'est ne pas confirmer : rien n'est fusionné.
      Le compte rendu décrit la révision en cours à l'instant de la lecture — ou, tant que le
      projet n'en a pas, la dernière révision marquée, dont la survenance la créerait par copie
      (`creates_current_revision`, comme pour la fusion d'un différentiel, #790) —, et la
      survenance confirmée (`declareRiskOccurrence`) porte ce qu'il a lu : une saisie faite
      entre-temps dans la structure principale, sur le risque ou dans son devis propre — qui
      fait avancer `Risk.lock_version` —, ou une révision en cours née depuis la lecture, la
      fait refuser par 412 (WF-IHM-0110). Tant que `refusals` n'est pas vide, la survenance ne
      s'applique pas, et l'écran n'en offre pas la confirmation. Refusée par 409 pour un risque
      qui n'est pas identifié, comme sa survenance.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
    responses:
      '200':
        description: Ce que la survenance ferait, et ce qui la refuse.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/RiskOccurrenceReport }
            examples:
              witness: { $ref: ../../../fixtures/api/risk_occurrence_report.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Le risque n'est pas identifié — survenu ou écarté — : seul un risque identifié survient
          (WF-RIS-0020). `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `risk_identified`,
          la condition que la commande `declare_occurrence` du risque dit manquer.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              not_identified: { $ref: ../../../fixtures/api/risk_occurrence_not_identified.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: declareRiskOccurrence
    tags: [risks]
    summary: Déclarer un risque survenu
    description: >-
      Fusionne les tâches et les lignes du devis propre dans la structure principale de la
      révision en cours, et retire la ligne de provision ; ne marque aucune révision et ne
      déplace pas la référence (WF-RIS-0060, WF-RIS-0050). Les tâches de premier niveau du
      devis propre sont placées, dans leur ordre, en dernière position sous la tâche qui
      portait la ligne de provision ; quand c'est un jalon, immédiatement après lui, sous sa
      tâche parente ou au premier niveau, et il reste un jalon sans sous-tâche. Leurs
      subordonnées, leurs liaisons internes, leurs durées et leurs modes sont conservés ; une
      tâche sans prédécesseur dans le devis propre passe en mode manuel aux dates qu'elle y
      avait. Chaque ligne fusionnée garde ses grandeurs, porte un montant budgété nul et pour
      réestimé le montant que ses grandeurs et ses dates donnent (WF-DEV-0020) — celui du
      devis propre tant que ses dates n'ont pas changé (WF-RIS-0060) ; le compte rendu
      préalable décrit cette place (`RiskOccurrenceReport.differences`). Le risque garde son
      coût à la survenance, le total de son devis propre à cet instant (`Risk.occurrence_cost`,
      WF-RIS-0010), que la couverture compare à la réserve (WF-RIS-0050). Les tâches
      qu'elle ajoute ne portent aucun rattachement au lotissement, le devis propre d'un risque
      n'en portant pas (WF-PLA-0170). Lorsque le projet n'a pas de révision en cours, la
      survenance en crée une au préalable (WF-RIS-0060). Définitif : aucune commande ne
      l'annule, et seul l'abandon de la révision en cours la défait, avec tout ce que cette
      révision contient (`abandonRevision`, WF-RIS-0060) ; hors de l'historique d'annulation,
      confié au worker, inscrit au journal d'audit (WF-RIS-0020, WF-IHM-0110,
      WF-ARC-0090, WF-SEC-0030) ; pendant son traitement, les commandes d'écriture de la
      révision en cours sont indisponibles (`no_background_task_running`). La confirmation suit
      le compte rendu préalable (`getRiskOccurrenceReport`), et porte les deux compteurs qu'il a
      lus : refusée par 412 si l'un a avancé depuis, elle n'applique jamais un compte rendu que
      personne n'a vu, comme la fusion d'un différentiel (`mergeCostStructure`, US-0680). Le
      compteur du risque (`Risk.lock_version`) avance aussi à toute saisie dans son devis propre,
      que le compte rendu liste : une saisie du devis propre après la lecture fait donc refuser la
      confirmation. Elle renvoie aussi `creates_current_revision`, tel que le compte rendu l'a
      lu : une révision en cours née depuis la lecture, ou disparue, la fait refuser par 412.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/risks.yaml#/RiskOccurrence }
          examples:
            sent: { $ref: ../../../fixtures/api/risk_occurrence_sent.json }
    responses:
      '202':
        description: Survenance mise en file.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              queued: { $ref: ../../../fixtures/api/task_occurrence_queued.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          L'état interdit la survenance : `STATE_FORBIDS_OPERATION`, `params.missing_condition` la
          condition qui manque, comme la commande `declare_occurrence` du risque la dit — ainsi
          `risk_identified` pour un risque survenu ou écarté, seul un risque identifié survenant
          (WF-RIS-0020), comme au compte rendu.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              not_identified: { $ref: ../../../fixtures/api/risk_occurrence_not_identified.json }
      '412':
        description: >-
          La structure principale ou le risque ont changé depuis le compte rendu confirmé — le
          risque change aussi à toute saisie dans son devis propre —, ou une révision en cours
          est née depuis la lecture (`creates_current_revision` vrai), ou a disparu (faux) : le
          compte rendu est périmé, et rien n'est fusionné (WF-RIS-0060, WF-IHM-0110).
          `STALE_LOCK_VERSION`, `params.expected_lock_version` le compteur courant du risque,
          l'objet que le chemin nomme, même quand seule la structure principale a changé, et rien
          d'autre, comme tout 412 (#296), si bien qu'il ne dit pas lequel des deux a avancé ; le
          client ne rejoue pas avec ce compteur, il relit le compte rendu, qui rend l'un et l'autre.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              report_stale: { $ref: ../../../fixtures/api/risk_occurrence_report_stale.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/risks/coverage:
  get:
    operationId: getProjectRiskCoverage
    tags: [risks]
    summary: Couverture des risques
    description: >-
      La réserve pour risques (`RiskCoverageTotals.reserve`), face aux provisions des risques
      identifiés dans la révision courante et aux coûts à la survenance des risques survenus
      (`Risk.occurrence_cost`), et leur écart signé (WF-RIS-0050, WF-RAE-0020) : la terminaison
      ou la réestimation des tâches issues d'un risque survenu ne change ni le coût des
      survenus ni l'écart. Dans la révision nommée, ou la révision courante.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskRevision
    responses:
      '200':
        description: Couverture des risques du projet.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/RiskCoverage }
            examples:
              witness: { $ref: ../../../fixtures/api/risk_coverage.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/risks/matrix:
  get:
    operationId: getProjectRiskMatrix
    tags: [risks]
    summary: Matrice de risques du projet
    description: >-
      Quatre niveaux de probabilité et quatre de gravité, d'après le référentiel
      (WF-REF-0160, WF-RIS-0040), remplie par les risques de la révision lue
      (`revision_id`, WF-RIS-0030) ; chaque niveau dit ses bornes, celles de gravité en
      pourcentage de l'assiette du projet — son budget de référence ou, avant lui, le total
      hors provisions du devis de sa révision courante (WF-REF-0160). Chaque case porte sa zone, doublée d'un indice non coloré à
      l'affichage (WF-IHM-0070), et chaque risque compté est un point à ses valeurs exactes
      (`points`, #1053).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskRevision
    responses:
      '200':
        description: Matrice remplie et totaux.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/RiskMatrix }
            examples:
              witness: { $ref: ../../../fixtures/api/risk_matrix.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
