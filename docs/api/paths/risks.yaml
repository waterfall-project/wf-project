/projects/{project_id}/risks:
  get:
    operationId: listRisks
    tags: [risks]
    summary: Risk register
    description: >-
      Label, probability, severity, provision, state and date of the last review, with the
      matrix cell and the provision totals (WF-RIS-0040), as the revision read holds them
      (`revision_id`, WF-RIS-0030). Sorting and filtering are done by the server, and the
      totals are those of the risks retained (WF-IHM-0130): of all the risks that the filters
      and the search retain, not of the page read alone. The register is a flat table,
      paginated like any other (`limit`, `offset`, `meta`; WF-IHM-0060, #1367). Each of its
      columns can be filtered, following the convention of the contract's README: the state and
      the zone by a list, the label by the search, each number column — probability, severity,
      provision, cost at occurrence and reestimated of occurred — by its two inclusive bounds,
      `<column>_min` and `<column>_max`, and the date of the last review by its period,
      `last_review_on_from` and `last_review_on_to`, end included; `last_review_on_to` presents
      to the periodic review the risks not reviewed since a date (WF-RIS-0020,
      `risks_filtered`; H-01, #1785). A risk with neither a cost at occurrence nor a
      reestimated amount — an identified or dismissed risk — is retained by no bound of these
      two columns.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskRevision
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - name: states
        in: query
        description: Restricts to the risks in one of these states (WF-RIS-0040).
        schema:
          type: array
          items: { $ref: ../components/schemas/risks.yaml#/RiskState }
        explode: false
      - name: zones
        in: query
        description: Restricts to the risks whose matrix cell is in one of these zones.
        schema:
          type: array
          items: { $ref: ../components/schemas/reference.yaml#/AlertZone }
        explode: false
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/RiskProbabilityMin
      - $ref: ../components/parameters.yaml#/RiskProbabilityMax
      - $ref: ../components/parameters.yaml#/RiskSeverityMin
      - $ref: ../components/parameters.yaml#/RiskSeverityMax
      - $ref: ../components/parameters.yaml#/RiskProvisionAmountMin
      - $ref: ../components/parameters.yaml#/RiskProvisionAmountMax
      - $ref: ../components/parameters.yaml#/RiskOccurrenceCostMin
      - $ref: ../components/parameters.yaml#/RiskOccurrenceCostMax
      - $ref: ../components/parameters.yaml#/RiskOccurredReestimatedMin
      - $ref: ../components/parameters.yaml#/RiskOccurredReestimatedMax
      - $ref: ../components/parameters.yaml#/RiskLastReviewOnFrom
      - $ref: ../components/parameters.yaml#/RiskLastReviewOnTo
      - name: sort_by
        in: query
        description: >-
          Sort column; when absent, the order of declaration. A risk with neither a cost at
          occurrence nor a reestimated amount comes after the others in the ascending order of
          these columns, before them in the descending order, like a null value of any grid
          (#1761).
        schema:
          type: string
          enum:
            - label
            - probability
            - severity
            - provision_amount
            - occurrence_cost
            - occurred_reestimated_amount
            - state
            - last_review_on
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Risks and totals.
        content:
          application/json:
            schema:
              type: object
              required: [items, totals, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/risks.yaml#/Risk }
                totals: { $ref: ../components/schemas/risks.yaml#/ProvisionTotals }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/risks.json }
              page: { $ref: ../../../fixtures/api/risks_page.json }
              empty: { $ref: ../../../fixtures/api/risks_empty.json }
              filtered: { $ref: ../../../fixtures/api/risks_filtered.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          A column filter refused, following the convention of the README, `fields` on the
          parameter: a malformed bound with `NUMBER_INVALID`, a date with `DATE_INVALID`, an
          upper bound lower than the lower one with `VALUE_OUT_OF_RANGE` on
          `/query/<column>_max`, `params.minimum` the lower bound given, an end of period
          earlier than its start with `VALUE_OUT_OF_RANGE` on `/query/last_review_on_to`,
          `params.minimum` the start given (WF-IHM-0130; H-01, #1785).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              period_inverted: { $ref: ../../../fixtures/api/risks_period_inverted.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createRisk
    tags: [risks]
    summary: Declare a risk
    description: >-
      The creation opens the risk's own cost structure and its provision line in the main
      structure (WF-RIS-0010, WF-RIS-0030). The provision of an identified risk is not part of
      the reference budget (WF-RIS-0050). An entry in the current revision, which the project
      creates beforehand if it has none, and which `undoLastChange` undoes (WF-RIS-0020,
      WF-IHM-0110): it falls under `edit_risks` (`RevisionCommand`), and the `declare_risk`
      command says in advance whether it would succeed — a main structure with a task, an
      active category of the provision-for-risks type (EP-14/L42s). The provision line takes
      the category that the risk designates among the active categories of the
      provision-for-risks type, retained without being asked for when only one exists, and
      belongs to the subproject that the risk designates, optionally (WF-RIS-0010;
      EP-14/L42p, #579, C-299): the form reads the active categories (`listCostCategories`,
      `cost_type_kind`) and the project's subprojects (`listSubprojects`) to offer the choice.
      It is carried by the task of the main structure that the risk designates, optionally, and
      failing that by the first top-level task (`provision_task_id`, WF-RIS-0010, #786): the
      form reads the tasks of the main structure (`listNodes`). The response names the own
      structure created (`structure_id`), the provision line (`provision_node_id`) and its
      task (`provision_task`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/risks.yaml#/RiskWrite }
    responses:
      '201':
        description: Risk created.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/Risk }
            examples:
              created: { $ref: ../../../fixtures/api/risk_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` naming the missing condition.
          The project is terminal, `project_not_terminal` (WF-CYC-0100) — it then lists no
          command, and this 409 is the only place where the condition is named —, or a
          background task is running on the current revision, `no_background_task_running`: the
          state conditions of risk entry. Or the main structure of the current revision, or of
          the one the declaration would create, has no task: "The declaration of a risk on a main
          structure without a task is refused, naming the missing condition" (WF-RIS-0010) — the
          provision line would have no task to sit under; `at_least_one_task` (EP-14/L42s). Or
          no active cost category is of the provision-for-risks type: the provision has no
          category to sit in (WF-RIS-0010); `active_provision_category`, which the creation of a
          project also requires (WF-CYC-0120). The conditions are judged in the order in which
          the `declare_risk` command lists them on a non-terminal state, and the refusal names
          the first one missing: `no_background_task_running`, then `at_least_one_task`, then
          `active_provision_category`, then `may_create_revision` when the project has no current
          revision and the caller lacks `revisions.write`: the declaration would create it
          (WF-RIS-0020, `ProjectCommand.declare_risk`); on a terminal project, where the command
          is not listed, it names `project_not_terminal`. This 409 comes before the 422: without a task or an
          active category, no designation would be valid, and the fields are not judged.
          Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              without_provision_category: { $ref: ../../../fixtures/api/risk_without_provision_category.json }
              without_task: { $ref: ../../../fixtures/api/risk_without_task.json }
              may_create_revision: { $ref: ../../../fixtures/api/risk_may_create_revision_refused.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` designating each field: `/label` empty, `VALUE_REQUIRED`,
          or longer than the schema allows, `VALUE_TOO_LONG`; `/provision_cost_category_id`
          omitted when several active categories are of the provision-for-risks type,
          `VALUE_REQUIRED`, unknown, `UNKNOWN_COST_CATEGORY`, deactivated,
          `INACTIVE_REFERENCE_OBJECT` — a deactivated category, which every category of a
          deactivated cost type is (WF-REF-0010, C-291) —, or of a cost type of another type,
          `PROVISION_CATEGORY_REQUIRED`; `/provision_subproject_id` that the project does not
          have, `UNKNOWN_SUBPROJECT`; `/provision_task_id` that is not a task of the main
          structure of the current revision, `UNKNOWN_TASK` (WF-RIS-0010, #786);
          `/probability` outside 0 to 1, `VALUE_OUT_OF_RANGE`, the bound crossed in `params`.
          Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              provision_refused: { $ref: ../../../fixtures/api/risk_provision_refused.json }
              provision_task_refused:
                $ref: ../../../fixtures/api/risk_provision_task_refused.json
              probability_out_of_range:
                $ref: ../../../fixtures/api/risk_probability_out_of_range.json
              category_required: { $ref: ../../../fixtures/api/risk_category_required.json }
              category_inactive: { $ref: ../../../fixtures/api/risk_category_inactive.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/risks/{risk_id}:
  get:
    operationId: getRisk
    summary: One risk
    description: >-
      Attributes of the risk and the state it is in within the revision read (`revision_id`,
      WF-RIS-0010, WF-RIS-0020, WF-RIS-0030).
    tags: [risks]
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
      - $ref: ../components/parameters.yaml#/RiskRevision
    responses:
      '200':
        description: Risk.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/Risk }
            examples:
              witness: { $ref: ../../../fixtures/api/risk.json }
              occurred: { $ref: ../../../fixtures/api/risk_occurred_detail.json }
              dismissed_category_deactivated:
                $ref: ../../../fixtures/api/risk_dismissed_category_deactivated.json
              uncited: { $ref: ../../../fixtures/api/risk_uncited.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  patch:
    operationId: updateRisk
    tags: [risks]
    summary: Edit the identity of a risk
    description: >-
      The label, the description and the mitigation note of a risk, project data
      (WF-RIS-0020, §4.4.1): the change creates no revision and is written even without a
      current revision, does not enter the undo history (`undoLastChange`, WF-IHM-0110), and
      abandoning a revision does not revert it (`abandonRevision`). It falls under the risk's
      `update` command, under `risks.write`, and not under risk entry in the revision
      (`edit_risks`): `may_create_revision` is never missing for it. The probability is not
      changed here: changing it is a dated review, which only `reviewRisk` writes and which the
      history shows (`RiskUpdate`, WF-RIS-0010, WF-RIS-0040; H-04). The severity and the
      provision cannot be entered: they follow the own structure and the probability
      (WF-RIS-0010). The category, the subproject and the task of the provision, held by each
      revision, are changed through `updateRiskProvision` (author's decision of 2026-11-01, H-02,
      #1782). Refused on an occurred risk, with 409 `STATE_FORBIDS_OPERATION`,
      `params.missing_condition` set to `risk_not_occurred` — the risk's `update` command already
      said it was unavailable. It carries the risk's lock version as read (`Risk.lock_version`),
      which it advances.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/risks.yaml#/RiskUpdate }
    responses:
      '200':
        description: Risk edited.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/Risk }
            examples:
              updated: { $ref: ../../../fixtures/api/risk_updated.json }
              without_current_revision: { $ref: ../../../fixtures/api/risk_updated_without_current_revision.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` naming the missing condition:
          `project_not_terminal` on a terminal project, which does not list the command
          (WF-CYC-0100); then `risk_not_occurred` for an occurred risk, for which the `update`
          command says it is unavailable. No condition of the current revision: the change does
          not write to it. Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              occurred: { $ref: ../../../fixtures/api/risk_update_occurred_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` designating each field: `/label` empty, `VALUE_REQUIRED`,
          or longer than the schema allows, `VALUE_TOO_LONG`, as at the declaration
          (`createRisk`). The probability is not a field of the change (`RiskUpdate`), nor is the
          provision (`updateRiskProvision`). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              label_blank: { $ref: ../../../fixtures/api/risk_update_label_blank.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  delete:
    operationId: deleteRisk
    tags: [risks]
    summary: Delete a risk
    description: >-
      A risk that no marked revision cites yet can be deleted, with its own estimate and its
      provision line; beyond that, it is dismissed (WF-RIS-0020): deleting a risk cited by a
      marked revision is refused with 409, `STATE_FORBIDS_OPERATION`,
      `params.missing_condition` naming `risk_not_cited`, and it is the review (`reviewRisk`)
      that dismisses it. An occurred risk cannot be deleted either: no transition leaves it
      (WF-RIS-0020), `params.missing_condition` set to `risk_not_occurred`.
      `missing_condition` names only one: when both are missing, `risk_not_occurred` prevails
      — an occurred risk is not dismissed, and pointing to the review would be wrong —, as the
      `delete` command lists them in that order. Falls under risk entry
      (`edit_risks`, `risks.write`), in the current revision, created if needed, and can be
      undone (WF-RIS-0020, WF-IHM-0110) — an undo refused with 409, `params.missing_condition`
      set to `restored_subproject_exists`, when it would give back to its provision a subproject
      deleted since (author's decision, #732); the risk's `delete` command says in advance
      whether it can be deleted.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
      - name: lock_version
        in: query
        required: true
        description: >-
          The lock version of the deleted risk, as the screen read it (`Risk.lock_version`):
          when stale, the deletion is refused with 412 and nothing is deleted (WF-IHM-0110;
          author's decision of 2026-10-28, US-0702/L2).
        schema: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '204':
        description: Risk deleted, its own estimate and its provision line with it.
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` naming the state conditions of
          risk entry: `project_not_terminal` on a terminal project, which does not list the
          command, then `no_background_task_running`, judged before those of the risk, as at
          the declaration (`createRisk`);
          then set to `risk_not_occurred` for an occurred risk, which no transition leaves, and
          otherwise to `risk_not_cited`: the risk is cited by a marked revision, it can no longer
          be deleted, it is dismissed (WF-RIS-0020). When both are missing, `risk_not_occurred`
          is named. Then `may_create_revision` when the project has no current revision and the
          caller lacks `revisions.write`: the deletion would create it (WF-RIS-0020,
          `ProjectCommand.edit_risks`).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              cited: { $ref: ../../../fixtures/api/risk_delete_cited.json }
              occurred: { $ref: ../../../fixtures/api/risk_delete_occurred.json }
      '412':
        description: >-
          `STALE_LOCK_VERSION`: the risk has been written since it was read, and nothing is
          deleted; `params.expected_lock_version` is its current lock version (WF-IHM-0110,
          US-0702/L2).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/risk_delete_stale.json }
      '422': { $ref: ../components/responses.yaml#/LockVersionInvalid }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/risks/{risk_id}/provision:
  put:
    operationId: updateRiskProvision
    tags: [risks]
    summary: Change the provision of a risk
    description: >-
      The category, the subproject and the task of a risk's provision line, held by each
      revision with its assessment (WF-RIS-0020, WF-RIS-0010): an entry in the current
      revision, which the project creates beforehand if it has none, which `undoLastChange`
      undoes and which abandoning the revision reverts (WF-IHM-0110; author's decision of
      2026-11-01, H-02, #1782). It falls under risk entry (`edit_risks`, `risks.write`), and the
      risk's `update_provision` command says in advance that it is offered only while the risk
      is identified (WF-RIS-0010). Each omitted field stays that of the risk. Another task
      moves the provision line onto it, the estimate total unchanged (WF-RIS-0010, #786). The
      undo gives back the previous category, subproject and task, and it is refused when that
      subproject has been deleted since (409 `STATE_FORBIDS_OPERATION`,
      `params.missing_condition` set to `restored_subproject_exists`; author's decision, #732).
      It carries the risk's lock version as read (`Risk.lock_version`), the same as that of the
      change of its identity, which it advances.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/risks.yaml#/RiskProvisionUpdate }
    responses:
      '200':
        description: Provision of the risk changed.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/Risk }
            examples:
              moved: { $ref: ../../../fixtures/api/risk_provision_moved.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` naming the first missing
          condition: the state conditions of risk entry, `project_not_terminal` on a terminal
          project, which does not list the command, then `no_background_task_running`, judged
          before those of the risk, as at the declaration (`createRisk`); then
          `risk_identified` for an occurred or dismissed risk, for which the `update_provision`
          command says it is unavailable (WF-RIS-0010); then `may_create_revision`, without a
          current revision, for whoever lacks `revisions.write`: the entry would create it
          (WF-RIS-0020). This 409 comes before the 422: a category sent for a risk that is not
          identified is refused with `risk_identified`, whether it is deactivated, unknown or of
          a cost type of another type, none being valid as long as the provision cannot be
          changed (#747). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              provision_frozen: { $ref: ../../../fixtures/api/risk_provision_frozen.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` designating each field, on the grounds of the
          declaration (`createRisk`), except that `INACTIVE_REFERENCE_OBJECT` applies to
          `/provision_cost_category_id` only if the value changes the risk's category: its
          unchanged category, deactivated since, is accepted. Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/risks/{risk_id}/reviews:
  get:
    operationId: listRiskReviews
    tags: [risks]
    summary: History of the reviews
    description: >-
      Each review is dated and keeps the probability, the severity and the state retained
      (WF-RIS-0010). For a marked revision (`revision_id`), the reviews made up to its
      marking: those that follow it do not belong to what it freezes
      (WF-RIS-0030). Without pagination: a risk is reviewed at the rhythm of its project, monthly
      over the fifteen years a project lasts at most (WF-PLA-0150), some 180 reviews (§4.6.2).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
      - $ref: ../components/parameters.yaml#/RiskRevision
    responses:
      '200':
        description: Reviews, from the most recent to the oldest.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/risks.yaml#/RiskReview }
            examples:
              witness: { $ref: ../../../fixtures/api/risk_reviews.json }
              reviewed: { $ref: ../../../fixtures/api/risk_reviews_reviewed.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: reviewRisk
    tags: [risks]
    summary: Review a risk
    description: >-
      Confirmation without change produces a dated review; an identified risk can be
      dismissed, and a dismissed risk can become identified again (WF-RIS-0010,
      WF-RIS-0020). It is the only write of a risk's probability: the change
      (`updateRisk`) does not accept it (H-04). Dismissing a risk removes its provision line
      from the remaining to commit; the risk reserve and the reference budget remain unchanged
      (WF-RIS-0050); the provision of the dismissed risk that it presents is the one it held in
      the reference revision (`Risk.provision_amount`). A dismissed risk that becomes
      identified again recreates its provision line with the category it designated if that
      category is still active and of the provision-for-risks type
      (`Risk.provision_cost_category_is_active`, #747), and otherwise with the one the review
      designates, as at the declaration (WF-RIS-0010; EP-14/L42p); outside any subproject if
      the subproject it designated has been deleted (#732). Its provision line is carried by
      the task it designated if that is still a task of the main structure, and otherwise by
      the first top-level task (WF-RIS-0010; #1227); `provision_task` remains null while the
      risk is dismissed. An entry in the current revision, created if needed: undoing it
      gives the risk back its previous probability and state, and the category it designated
      before a return to the identified state (WF-RIS-0020, WF-IHM-0110).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/risks.yaml#/RiskReviewWrite }
          examples:
            reidentified_category_chosen:
              $ref: ../../../fixtures/api/risk_reidentified_category_chosen.json
    responses:
      '201':
        description: Review recorded.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/Risk }
            examples:
              reviewed: { $ref: ../../../fixtures/api/risk_reviewed.json }
              dismissed: { $ref: ../../../fixtures/api/risk_dismissed.json }
              reidentified: { $ref: ../../../fixtures/api/risk_reidentified.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` naming the state conditions of
          risk entry: `project_not_terminal` on a terminal project, which does not list the
          command, then `no_background_task_running`, judged before those of the risk, as at
          the declaration (`createRisk`).
          Then the risk has occurred: no transition leaves it (WF-RIS-0020),
          `params.missing_condition` set to `risk_not_occurred`. Or a
          dismissed risk that would become identified again on a main structure that has no
          task: "The declaration of a risk on a main structure without a task, like the return
          of a dismissed risk to the identified state on such a structure, is refused, naming
          the missing condition" (WF-RIS-0010; author's decision, #787)
          — its provision line would have no task to sit under; `params.missing_condition`
          set to `at_least_one_task`. Or while no active cost category is of the
          provision-for-risks type (WF-RIS-0010): `params.missing_condition` set to
          `active_provision_category`. Then `may_create_revision` when the project has no
          current revision and the caller lacks `revisions.write`: the review would create it
          (WF-RIS-0020, `ProjectCommand.edit_risks`). The conditions are judged in this order, as
          at the declaration, the refusal naming the first one missing, and this 409 comes before
          the 422. Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              occurred: { $ref: ../../../fixtures/api/risk_review_occurred.json }
              without_task: { $ref: ../../../fixtures/api/risk_review_without_task.json }
              without_provision_category:
                $ref: ../../../fixtures/api/risk_review_without_provision_category.json
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` designating `/provision_cost_category_id` when a
          dismissed risk becomes identified again and the category it designated is no longer
          active, or no longer of the provision-for-risks type, on the grounds of the declaration
          (`createRisk`); `/probability` outside 0 to 1,
          `VALUE_OUT_OF_RANGE`, the bound crossed in `params`, as at the declaration
          (`RiskReviewWrite.probability`, WF-RIS-0010). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              probability_out_of_range:
                $ref: ../../../fixtures/api/risk_review_probability_out_of_range.json
              category_required: { $ref: ../../../fixtures/api/risk_review_category_required.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/risks/{risk_id}/occurrence:
  get:
    operationId: getRiskOccurrenceReport
    tags: [risks]
    summary: Preliminary report of the occurrence of a risk
    description: >-
      A read, which writes nothing: what the occurrence of the risk would do to the main
      structure of the current revision (WF-RIS-0060), presented before its confirmation like
      the report of a merge (`RiskOccurrenceReport`, on the model of
      `getStructureMergeReport`) — the tasks and the lines of the own estimate added under the
      task that carries the provision line, or after it when it is a milestone, the provision
      line removed, the carrying task changed —, and the provision removed from the remaining
      to commit. The difference is the one the server computes, as for a differential
      (C-361), and the front does not compose it (#1383). Abandoning at this step means not
      confirming: nothing is merged. The report describes the current revision at the moment
      of the read — or, as long as the project has none, the last marked revision, from which
      the occurrence would create it by copy (`creates_current_revision`, as for the merge of a
      differential, #790) —, and the confirmed occurrence (`declareRiskOccurrence`) carries
      what it read: an entry made in the meantime in the main structure, on the risk or in its
      own estimate — which advances `Risk.lock_version` —, or a current revision born since
      the read, has it refused with 412 (WF-IHM-0110). As long as `refusals` is not empty, the
      occurrence does not apply, and the screen does not offer its confirmation. Refused with
      409 when the state forbids the occurrence, on the conditions of its 409 and in the same
      order (`declareRiskOccurrence`): a report of an occurrence that could not apply is not
      read.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
    responses:
      '200':
        description: What the occurrence would do, and what refuses it.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/RiskOccurrenceReport }
            examples:
              witness: { $ref: ../../../fixtures/api/risk_occurrence_report.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The state forbids the occurrence: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` the first missing condition, as in the 409 of the
          occurrence (`declareRiskOccurrence`) and in the same order — those of the project,
          `project_not_terminal`, `reference_revision_designated`, `no_background_task_running`
          (WF-CYC-0100, WF-RIS-0060), then those of the risk, `risk_identified` for an occurred
          or dismissed risk, only an identified risk occurring (WF-RIS-0020), then
          `may_create_revision`, without a current revision, for whoever lacks
          `revisions.write` (WF-RIS-0060). Each is the condition that the project's
          `declare_risk_occurrence` command or the risk's `declare_occurrence` command says is
          missing.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              not_identified: { $ref: ../../../fixtures/api/risk_occurrence_not_identified.json }
              without_reference: { $ref: ../../../fixtures/api/risk_occurrence_without_reference.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: declareRiskOccurrence
    tags: [risks]
    summary: Declare a risk occurred
    description: >-
      Merges the tasks and the lines of the own estimate into the main structure of the
      current revision, and removes the provision line; marks no revision and does not move
      the reference (WF-RIS-0060, WF-RIS-0050). The top-level tasks of the own estimate are
      placed, in their order, in last position under the task that carried the provision
      line; when that is a milestone, immediately after it, under its parent task or at the
      top level, and it remains a milestone without subtasks. Their subordinates, their
      internal links, their durations and their modes are kept; a task without a predecessor
      in the own estimate switches to manual mode at the dates it had there. Each merged line
      keeps its quantities, takes a zero budgeted amount and as reestimated amount the amount
      that its quantities and its dates give (WF-DEV-0020) — that of the own estimate as long
      as its dates have not changed (WF-RIS-0060); the preliminary report describes this
      placement (`RiskOccurrenceReport.differences`). The risk keeps its cost at occurrence,
      the total of its own estimate at that moment (`Risk.occurrence_cost`, WF-RIS-0010),
      which the coverage compares with the reserve (WF-RIS-0050). Each merged task and line
      carries the risk (`Node.origin_risk_id`), which the copy, the moves, the imports matched
      by lineage and the merge of an amendment keep, and whose current reestimated amount the
      register sums (`Risk.occurred_reestimated_amount`, #1761). The tasks it adds carry no
      attachment to the work breakdown, a risk's own estimate carrying none (WF-PLA-0170).
      When the project has no current revision, the occurrence creates one beforehand
      (WF-RIS-0060). Final: no command undoes it, and only abandoning the current revision
      reverts it, with everything that revision contains (`abandonRevision`, WF-RIS-0060);
      outside the undo history, handed to the worker, recorded in the audit log (WF-RIS-0020,
      WF-IHM-0110, WF-ARC-0090, WF-SEC-0030); while it is processed, the write commands of
      the current revision are unavailable (`no_background_task_running`). The confirmation
      follows the preliminary report (`getRiskOccurrenceReport`), and carries the two lock
      versions it read: refused with 412 if either has advanced since, it never applies a
      report that nobody has seen, like the merge of a differential (`mergeCostStructure`,
      US-0680). The risk's lock version (`Risk.lock_version`) also advances on any entry in
      its own estimate, which the report lists: an entry in the own estimate after the read
      therefore has the confirmation refused. It also sends back `creates_current_revision`,
      as the report read it: a current revision born since the read, or gone, has it refused
      with 412.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/risks.yaml#/RiskOccurrence }
          examples:
            sent: { $ref: ../../../fixtures/api/risk_occurrence_sent.json }
    responses:
      '202':
        description: Occurrence queued.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              queued: { $ref: ../../../fixtures/api/task_occurrence_queued.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The state forbids the occurrence: `STATE_FORBIDS_OPERATION`, `params.missing_condition`
          the first missing condition, those of the project first, in the order in which its
          `declare_risk_occurrence` command names them — `project_not_terminal` on a terminal
          project, which no longer lists it (WF-CYC-0100), `reference_revision_designated` as
          long as it has no reference revision (WF-RIS-0060), `no_background_task_running` during
          a background task that writes to the current revision or creates it —, then those of
          the risk, in the order in which its `declare_occurrence` command names them —
          `risk_identified` for an occurred or dismissed risk, only an identified risk occurring
          (WF-RIS-0020), as at the report, then `may_create_revision`, without a current
          revision, for whoever lacks `revisions.write` (WF-RIS-0060). Nothing is written (H-08,
          US-0702/L2).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              not_identified: { $ref: ../../../fixtures/api/risk_occurrence_not_identified.json }
              without_reference: { $ref: ../../../fixtures/api/risk_occurrence_without_reference.json }
      '412':
        description: >-
          The main structure or the risk has changed since the confirmed report — the risk also
          changes on any entry in its own estimate —, or a current revision has been born since
          the read (`creates_current_revision` true), or has gone (false): the report is stale,
          and nothing is merged (WF-RIS-0060, WF-IHM-0110).
          `STALE_LOCK_VERSION`, `params.expected_lock_version` the current lock version of the
          risk, the object the path names, even when only the main structure has changed, and
          nothing else, like any 412 (#296), so that it does not say which of the two has
          advanced; the client does not replay with this lock version, it reads the report
          again, which returns both.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              report_stale: { $ref: ../../../fixtures/api/risk_occurrence_report_stale.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/risks/coverage:
  get:
    operationId: getProjectRiskCoverage
    tags: [risks]
    summary: Risk coverage
    description: >-
      The risk reserve (`RiskCoverageTotals.reserve`), against the provisions of the
      identified risks in the current revision and the costs at occurrence of the occurred
      risks (`Risk.occurrence_cost`), and their signed variance (WF-RIS-0050, WF-RAE-0020): the
      completion or the re-estimation of the tasks that came from an occurred risk changes
      neither the cost of the occurred risks nor the variance; the current reestimated amount
      of their lines is presented alongside the cost of the occurred risks, outside the
      variance (`RiskCoverageTotals.occurred_reestimated`, #1761). In the named revision, or
      the current revision.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskRevision
    responses:
      '200':
        description: Risk coverage of the project.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/RiskCoverage }
            examples:
              witness: { $ref: ../../../fixtures/api/risk_coverage.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/risks/matrix:
  get:
    operationId: getProjectRiskMatrix
    tags: [risks]
    summary: Risk matrix of the project
    description: >-
      Four levels of probability and four of severity, from the reference data
      (WF-REF-0160, WF-RIS-0040), filled with the risks of the revision read
      (`revision_id`, WF-RIS-0030); each level states its bounds, those of severity as a
      percentage of the base of the project — its reference budget or, before it, the total
      excluding provisions of the estimate of its current revision (WF-REF-0160). Each cell
      carries its zone, doubled by a non-colour cue on display (WF-IHM-0070), and the
      number of its identified risks only, like the bubbles (`cells`, #1395); each risk read is
      a point at its exact values, with its state (`points`, #1053), and the provision totals
      cover the three states (WF-RIS-0040). On a zero base — a project without a reference
      budget whose estimate carries only provisions so far — no share is computable
      (`no_reference_budget`), and every point is at the lowest severity level (#1240).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RiskRevision
    responses:
      '200':
        description: Filled matrix and totals.
        content:
          application/json:
            schema: { $ref: ../components/schemas/risks.yaml#/RiskMatrix }
            examples:
              witness: { $ref: ../../../fixtures/api/risk_matrix.json }
              no_basis: { $ref: ../../../fixtures/api/risk_matrix_no_basis.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
