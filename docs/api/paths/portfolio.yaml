# Portfolio (FBS-2). No data entry: these views consolidate (WF-PTF-0030).
# They are accessible to any user who holds the permission for them, whether or not
# a contributor to the projects they aggregate (WF-PRJ-0060).

/portfolio/projects:
  get:
    operationId: getPortfolioProjects
    tags: [portfolio]
    summary: List of the portfolio projects
    description: >-
      Label, code, state, reference budget or current estimate and probability, project
      manager's projection and, for a project in progress, its variance to the reference
      budget, indices with their zone, and date of the last marked revision (WF-PTF-0040).
      The list is filtered by state, by period, by zone and by a search on the label; the
      sort is done by the server, and `meta.total` counts the projects retained
      (WF-IHM-0130).
    parameters:
      - $ref: ../components/parameters.yaml#/PortfolioStates
      - $ref: ../components/parameters.yaml#/PortfolioFrom
      - $ref: ../components/parameters.yaml#/PortfolioTo
      - $ref: ../components/parameters.yaml#/AsOf
      - $ref: ../components/parameters.yaml#/PortfolioOrgNode
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - $ref: ../components/parameters.yaml#/Search
      - name: zones
        in: query
        description: >-
          Restricts to the projects whose cost index or schedule index is in one of these
          zones — `alert` to see the projects in alert (WF-PTF-0040, WF-IHM-0130); the order
          remains that of `sort_by`.
        schema:
          type: array
          items: { $ref: ../components/schemas/reference.yaml#/AlertZone }
        explode: false
      - name: sort_by
        in: query
        description: Sort column; when absent, the label.
        schema:
          type: string
          enum:
            - label
            - code
            - state
            - reference_budget
            - current_estimate
            - win_probability
            - project_manager_projection
            - delta_to_reference
            - cost_index
            - schedule_index
            - last_marked_at
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Projects of the scope.
        content:
          application/json:
            schema:
              type: object
              required: [scope, items, meta]
              properties:
                scope: { $ref: ../components/schemas/portfolio.yaml#/PortfolioScope }
                items:
                  type: array
                  items: { $ref: ../components/schemas/portfolio.yaml#/PortfolioProjectRow }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              volume: { $ref: ../../../fixtures/api/volume/portfolio_projects.json }
              page: { $ref: ../../../fixtures/api/volume/portfolio_projects_page.json }
              empty: { $ref: ../../../fixtures/api/portfolio_projects_empty.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/PortfolioPeriodRefused }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/portfolio/value:
  get:
    operationId: getPortfolioValue
    tags: [portfolio]
    summary: Order book, pipeline and delivered
    description: >-
      Order book of the projects in progress, pipeline of the projects in pricing presented
      gross and weighted by the win probabilities, delivered value of the projects completed
      in the period, and conversion rate (WF-PTF-0050, WF-PTF-0020).
    parameters:
      - $ref: ../components/parameters.yaml#/PortfolioStates
      - $ref: ../components/parameters.yaml#/PortfolioFrom
      - $ref: ../components/parameters.yaml#/PortfolioTo
      - $ref: ../components/parameters.yaml#/AsOf
      - $ref: ../components/parameters.yaml#/PortfolioOrgNode
    responses:
      '200':
        description: Values of the portfolio.
        content:
          application/json:
            schema: { $ref: ../components/schemas/portfolio.yaml#/PortfolioValue }
            examples:
              volume: { $ref: ../../../fixtures/api/volume/portfolio_value.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/PortfolioPeriodRefused }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/portfolio/workload:
  get:
    operationId: getPortfolioWorkload
    tags: [portfolio]
    summary: Aggregated workload
    description: >-
      Sum of the loads by role and by month: remaining to commit for the projects in
      progress, weighted estimate for the projects in pricing included. Under-load is
      flagged as much as overload (WF-PTF-0060). Only these two states contribute to it:
      another state that `states` names — completed, created, lost or abandoned — has no
      effect, and the view takes no period (WF-PTF-0060, WF-PTF-0010).
    parameters:
      - $ref: ../components/parameters.yaml#/PortfolioStates
      - $ref: ../components/parameters.yaml#/AsOf
      - $ref: ../components/parameters.yaml#/PortfolioOrgNode
      - name: horizon_months
        in: query
        description: >-
          Number of months of the plan, the month of the calculation date first
          (WF-PTF-0060); when absent, six.
        schema: { type: integer, minimum: 1, maximum: 240, default: 6 }
      - name: under_load_threshold
        in: query
        description: >-
          Under-load threshold, chosen by the user (WF-PTF-0060): a ratio of the load to the
          capacity, from `0` to `1` — `0.5` for half the capacity (`Percent`) —, below which a
          month of a role is in under-load; when absent, `0.5`, which the answer returns
          (`PortfolioWorkload.under_load_threshold`).
        schema: { $ref: ../components/common.yaml#/Percent }
    responses:
      '200':
        description: >-
          Loads and capacities by role and by month, the capacity of the scope and the total
          of each month.
        content:
          application/json:
            schema: { $ref: ../components/schemas/portfolio.yaml#/PortfolioWorkload }
            examples:
              witness: { $ref: ../../../fixtures/api/portfolio_workload.json }
              org_node: { $ref: ../../../fixtures/api/portfolio_workload_org_node.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          `VALIDATION_FAILED`: an unknown organisation node, `fields` designating
          `/query/org_node_id`; an under-load threshold or a horizon outside its bounds,
          `/query/under_load_threshold` or `/query/horizon_months` by `VALUE_OUT_OF_RANGE`
          (WF-PTF-0060).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              horizon_refused: { $ref: ../../../fixtures/api/portfolio_workload_horizon_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/portfolio/performance:
  get:
    operationId: getPortfolioPerformance
    tags: [portfolio]
    summary: Indices, projections, distribution by zone and quarterly evolution
    description: >-
      On the projects in progress of the scope only (WF-PTF-0070): a project in pricing or
      completed that `states` adds does not contribute to it, and `scope.states` names the
      states requested. A portfolio index is a ratio of sums, never an average of indices
      (WF-PTF-0020). The quarterly evolution runs over the quarters that the period touches
      (`from`, `to`), each calculated at a past date according to WF-PTF-0010
      (WF-PTF-0070).
    parameters:
      - $ref: ../components/parameters.yaml#/PortfolioStates
      - $ref: ../components/parameters.yaml#/PortfolioFrom
      - $ref: ../components/parameters.yaml#/PortfolioTo
      - $ref: ../components/parameters.yaml#/AsOf
      - $ref: ../components/parameters.yaml#/PortfolioOrgNode
    responses:
      '200':
        description: Performance of the portfolio.
        content:
          application/json:
            schema: { $ref: ../components/schemas/portfolio.yaml#/PortfolioPerformance }
            examples:
              volume: { $ref: ../../../fixtures/api/volume/portfolio_performance.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/PortfolioPeriodRefused }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/portfolio/cost-structure:
  get:
    operationId: getPortfolioCostStructure
    tags: [portfolio]
    summary: Portfolio cost structure
    description: >-
      Breakdown by cost type of the reference budget and of the remaining to commit, and
      labour by organisation node. No breakdown of the actual cost by cost type, which the
      ERP does not provide (WF-PTF-0080). The completed projects that `states` adds are
      those of the period (`from`, `to`, failing that the default period, which
      `scope.from` and `scope.to` return; WF-PTF-0010). A project in pricing included
      contributes through its current estimate weighted by its win probability: excluding
      provision lines for the reference budget, which it stands in for, provisions
      included for the remaining to commit (WF-PTF-0080).
    parameters:
      - $ref: ../components/parameters.yaml#/PortfolioStates
      - $ref: ../components/parameters.yaml#/PortfolioFrom
      - $ref: ../components/parameters.yaml#/PortfolioTo
      - $ref: ../components/parameters.yaml#/AsOf
      - $ref: ../components/parameters.yaml#/PortfolioOrgNode
    responses:
      '200':
        description: Breakdowns.
        content:
          application/json:
            schema: { $ref: ../components/schemas/portfolio.yaml#/PortfolioCostStructure }
            examples:
              volume: { $ref: ../../../fixtures/api/volume/portfolio_cost_structure.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/PortfolioPeriodRefused }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/portfolio/risks:
  get:
    operationId: getPortfolioRisks
    tags: [portfolio]
    summary: Portfolio risks
    description: >-
      Total of the identified provisions, heaviest risks across all projects, filled
      matrix, aggregated risk coverage — sum of the risk reserves against the remaining
      provisions and the costs at occurrence of the occurred risks (WF-RIS-0050) —, and
      provisions occurred against provisions dismissed over the period (WF-PTF-0090). A
      project in pricing included brings its identified risks and their provisions without
      weighting (WF-PTF-0020); the reserve and the coverage cover only the projects in
      progress and completed of the scope, a project in pricing having no reference
      (WF-PTF-0090).
    parameters:
      - $ref: ../components/parameters.yaml#/PortfolioStates
      - $ref: ../components/parameters.yaml#/PortfolioFrom
      - $ref: ../components/parameters.yaml#/PortfolioTo
      - $ref: ../components/parameters.yaml#/AsOf
    responses:
      '200':
        description: Aggregated risks.
        content:
          application/json:
            schema: { $ref: ../components/schemas/portfolio.yaml#/PortfolioRisks }
            examples:
              volume: { $ref: ../../../fixtures/api/volume/portfolio_risks.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/PortfolioPeriodRefused }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/portfolio/cost-curve:
  get:
    operationId: getPortfolioCostCurve
    tags: [portfolio]
    summary: Portfolio S-curve
    description: >-
      Sum, month by month, of the cumulative cost curves of the projects of the scope
      (WF-IND-0100): reference budget, actual cost up to the calculation date, then project
      manager's projection. A project in pricing included contributes through the curves of
      its current estimate, weighted by its win probability: excluding provision lines for
      the reference budget, provisions included for the project manager's projection
      (WF-PTF-0100). The completed projects that `states` adds are those of the period
      (`from`, `to`, failing that the default period, which `scope.from` and `scope.to`
      return; WF-PTF-0010); the period does not bound the months of the curve, which
      `horizon_months` sets. On request (`payment_delays`), it is the cash-out that each
      project returns with its payment delays that is summed, and the response details it by
      month (`cash_out_by_month`). Nothing is recalculated in it, so that the portfolio and
      the projects tell the same story (WF-PTF-0100).
    parameters:
      - $ref: ../components/parameters.yaml#/PortfolioStates
      - $ref: ../components/parameters.yaml#/PortfolioFrom
      - $ref: ../components/parameters.yaml#/PortfolioTo
      - $ref: ../components/parameters.yaml#/AsOf
      - name: horizon_months
        in: query
        description: >-
          Number of months of the curve from that of the calculation date, this month first;
          when absent, six. The twelve months preceding that of the calculation date always
          precede them: without a horizon, the curve runs over eighteen months (WF-PTF-0100).
        schema: { type: integer, minimum: 1, maximum: 240, default: 6 }
      - name: payment_delays
        in: query
        description: >-
          When true, the series are those of the projects' cash-out, shifted by the payment
          delays and bearing the provisions of the identified risks (WF-IND-0100,
          WF-PTF-0100).
        schema: { type: boolean, default: false }
    responses:
      '200':
        description: >-
          Cumulative series by month, cash-out by month included when `payment_delays` is
          true.
        content:
          application/json:
            schema: { $ref: ../components/schemas/portfolio.yaml#/PortfolioCostCurve }
            examples:
              witness: { $ref: ../../../fixtures/api/portfolio_cost_curve.json }
              payment_delays:
                $ref: ../../../fixtures/api/portfolio_cost_curve_payment_delays.json
              credit: { $ref: ../../../fixtures/api/portfolio_cost_curve_credit.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/PortfolioPeriodRefused }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/portfolio/pilot-health:
  get:
    operationId: getPortfolioPilotHealth
    tags: [portfolio]
    summary: Project control health
    description: >-
      Overdue reviews, risks not reviewed, costs not imported, overdue contractual
      milestones: the four signals whose absence makes the other views misleading
      (WF-PTF-0110, WF-REF-0180). On the projects in progress of the scope only: another
      state that `states` names — in pricing, completed, created, lost or abandoned — has no
      effect, and the view takes no period (WF-PTF-0110, WF-PTF-0010).
    parameters:
      - $ref: ../components/parameters.yaml#/PortfolioStates
      - $ref: ../components/parameters.yaml#/AsOf
    responses:
      '200':
        description: Signals by project.
        content:
          application/json:
            schema: { $ref: ../components/schemas/portfolio.yaml#/PilotHealth }
            examples:
              witness: { $ref: ../../../fixtures/api/pilot_health.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
