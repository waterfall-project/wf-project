# File exchanges. Waterfall exchanges only through flows FLX-01 to FLX-07
# (WF-INTF-0150), and every import runs in two steps (WF-ARC-0100).

/file-uploads:
  post:
    operationId: uploadFile
    tags: [exchanges]
    summary: Upload a file
    description: >-
      The file is written to object storage and lives there only for the duration of the import:
      it is deleted as soon as the import is applied, refused, abandoned or expired
      (WF-DAT-0120, WF-ARC-0100), and, unused, twenty-four hours after the upload
      (`FileUpload.expires_at`). The upload states its use (`purpose`): an import file does not exceed 10 MiB
      (10,485,760 bytes), the size of an MS Project file, the heaviest of the imports
      (§4.6.2); beyond that, 413, `FILE_TOO_LARGE`. An import opens only on an import upload,
      a restore only on a backup upload: the other is refused with 422,
      `VALIDATION_FAILED`, the field that designates the upload at fault, `UPLOAD_PURPOSE_MISMATCH`
      (`openImport`, `startRestore`). A backup is not uploaded here, but in
      chunks (`openChunkedUpload`, `uploadChunk`, `completeChunkedUpload`): `purpose` set to
      `external_backup` is refused with 422, `VALIDATION_FAILED`, `fields` designating `/purpose`
      with `UPLOAD_PURPOSE_MISMATCH`.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, purpose]
            properties:
              file: { type: string, format: binary }
              purpose: { $ref: ../components/schemas/exchanges.yaml#/FileUploadPurpose }
    responses:
      '201':
        description: File uploaded.
        content:
          application/json:
            schema: { $ref: ../components/schemas/exchanges.yaml#/FileUpload }
            examples:
              estimate: { $ref: ../../../fixtures/api/file_upload.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '413': { $ref: ../components/responses.yaml#/PayloadTooLarge }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/chunked-uploads:
  post:
    operationId: openChunkedUpload
    tags: [exchanges]
    summary: Open the chunked upload of a backup
    description: >-
      Opens the upload of a backup copied outside the platform, which `startRestore` will designate
      (WF-ADM-0160): an upload opens, receives its chunks (`uploadChunk`) and is completed
      (`completeChunkedUpload`). The server states in how many chunks, of what size, the
      file is split. The announced size is bounded by
      `Installation.external_backup_max_bytes`, and by the 10,000 chunks that object storage
      accepts: the server chooses `part_size_bytes` within its bounds to stay under 10,000
      chunks, and a size that does not fit even at 10 MiB per chunk (10,000 × 10 MiB) is
      refused like one that exceeds the setting. In both cases, 413, `FILE_TOO_LARGE`, before
      any chunk is sent. The file is written to object storage and lives there only
      for the duration of its restore (WF-DAT-0120). Under the permission to restore the platform
      (`platform_restore`, WF-ADM-0160), like `startRestore`: without it, 403. An interrupted
      transfer — by a page reload — starts over with an opening, the previous upload
      expiring; no operation reads an upload.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/exchanges.yaml#/ChunkedUploadOpen }
    responses:
      '201':
        description: Upload opened, with no chunk received.
        content:
          application/json:
            schema: { $ref: ../components/schemas/exchanges.yaml#/ChunkedUpload }
            examples:
              opened: { $ref: ../../../fixtures/api/chunked_upload.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '413': { $ref: ../components/responses.yaml#/PayloadTooLarge }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` designating each field at fault: an empty name,
          `/filename` with `VALUE_REQUIRED`, or longer than the schema allows, with
          `VALUE_TOO_LONG`; a size outside its bounds, `/size_bytes` with
          `VALUE_OUT_OF_RANGE`, `fields[].params.minimum` or `maximum` the only bound crossed,
          like any bound of a write. Nothing is opened.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              size_out_of_range: { $ref: ../../../fixtures/api/chunked_upload_size_out_of_range.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/chunked-uploads/{chunked_upload_id}/parts/{part_number}:
  put:
    operationId: uploadChunk
    tags: [exchanges]
    summary: Upload a chunk
    description: >-
      Receives the chunk with this number of the backup to restore (WF-ADM-0160), as raw
      bytes, of the exact size the upload expects: `ChunkedUpload.part_size_bytes` for every
      chunk except the last, the rest of the file (`size_bytes` minus the chunks that
      precede it) for the last. Otherwise, 422, `VALIDATION_FAILED`, `fields` designating `/body`
      with `VALUE_OUT_OF_RANGE`, `params.minimum` and `params.maximum` stating the expected size;
      nothing is received. Uploading again a chunk already received replaces it, which makes an
      interrupted transfer resumable with the last response; chunks may arrive in any
      order. A number the upload does not count, or a completed, expired or
      unknown upload, is a 404. Under the permission to restore the platform (`platform_restore`),
      like `startRestore`: without it, 403. The chunk is written to object storage before the
      response, which states the chunks received.
    parameters:
      - $ref: ../components/parameters.yaml#/ChunkedUploadId
      - $ref: ../components/parameters.yaml#/ChunkedUploadPartNumber
    requestBody:
      required: true
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    responses:
      '200':
        description: Chunk received.
        content:
          application/json:
            schema: { $ref: ../components/schemas/exchanges.yaml#/ChunkedUpload }
            examples:
              received: { $ref: ../../../fixtures/api/chunked_upload_part.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          A chunk that does not have the expected size: `VALIDATION_FAILED`, `fields` designating
          `/body` with `VALUE_OUT_OF_RANGE`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              part_size_mismatch: { $ref: ../../../fixtures/api/chunked_upload_part_size_mismatch.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/chunked-uploads/{chunked_upload_id}/completion:
  post:
    operationId: completeChunkedUpload
    tags: [exchanges]
    summary: Complete the chunked upload
    description: >-
      Assembles the chunks of the backup to restore (WF-ADM-0160) into a single file in
      object storage and returns the upload, a `FileUpload` whose `purpose` is `external_backup`:
      its `upload_id` is the one `startRestore` designates (`external_backup_upload_id`), and its
      `backup_taken_at` the date stated by the backup's manifest, which the confirmation of the
      restore names (`acknowledged_backup_taken_at`). Refused
      with 422, `FILE_FORMAT_UNREADABLE`, when the assembled file is not an archive whose
      manifest, its first member, states the date of the backup: an upload whose date cannot be
      read is never restorable, and remains incomplete. The upload does not check the archive
      beyond its manifest: the restore checks it, before disconnecting anyone
      (`startRestore`). Refused
      with 409, `STATE_FORBIDS_OPERATION`, as long as a chunk is missing; `params.missing_parts`
      states the missing numbers, in ascending order, and nothing is assembled. An upload already
      completed, expired or unknown is a 404. Under the permission to restore the platform
      (`platform_restore`), like `startRestore`: without it, 403.
    parameters:
      - $ref: ../components/parameters.yaml#/ChunkedUploadId
    responses:
      '201':
        description: File assembled and uploaded.
        content:
          application/json:
            schema: { $ref: ../components/schemas/exchanges.yaml#/FileUpload }
            examples:
              completed: { $ref: ../../../fixtures/api/chunked_upload_completed.json }
              external_backup: { $ref: ../../../fixtures/api/file_upload_external_backup.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          A chunk is missing: `STATE_FORBIDS_OPERATION`, `params.missing_parts` the numbers of the
          chunks the upload has not received, as an array of integers.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              missing_part: { $ref: ../../../fixtures/api/chunked_upload_incomplete.json }
      '422':
        description: >-
          The assembled file is not a backup archive whose manifest, its first
          member, states the date, with its time zone: `FILE_FORMAT_UNREADABLE`, without parameters.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              unreadable: { $ref: ../../../fixtures/api/chunked_upload_unreadable.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/imports:
  get:
    operationId: listImports
    tags: [exchanges]
    summary: Imports of the project
    description: >-
      The imports of the project, ongoing and past, with the state where each one stopped
      (WF-INTF-0080, WF-ARC-0100), from the most recent to the oldest by their opening
      (`created_at`), like the other logs.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
    responses:
      '200':
        description: Imports, analysed, applied or abandoned, from the most recent to the oldest.
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/exchanges.yaml#/Import }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              imports: { $ref: ../../../fixtures/api/imports.json }
              page: { $ref: ../../../fixtures/api/imports_page.json }
              empty: { $ref: ../../../fixtures/api/imports_empty.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: openImport
    tags: [exchanges]
    summary: Open an import and start its analysis
    description: >-
      The opening reads the header of the file — its format, its version, the labels of its
      columns — before queuing the analysis, and refuses with 422 what it does not recognise
      (WF-INTF-0070): the reading is limited to the header, and the content is read only by the
      analysis. The analysis, entrusted to the worker, compares the content with the existing
      data and produces the report, without changing anything (WF-ARC-0100, WF-INTF-0080); it no
      longer refuses a format, the opening having recognised it. Schedule, estimate and
      remaining to commit imports apply to the current revision, created if needed
      (WF-INTF-0090), on the structure the request names, the main one by default, which the
      import returns (`Import.structure_id`). Depending on the flow: MS Project schedule
      (WF-INTF-0040), whose project start date becomes the planning start date of the structure
      (`CostStructure.planning_start_on`, WF-PLA-0020), the report presenting its change;
      estimate (WF-INTF-0100), remaining to commit (WF-INTF-0120), actual costs (WF-INTF-0140),
      whose extracted period is logged (WF-CRE-0050). An actual cost extraction is read
      according to the mapping of the installation (`getActualCostMapping`, WF-REF-0190): the
      import is refused as long as one of the four required columns has no label in it, which
      the project's `import_actual_costs` command states in advance; a file missing a required
      column is refused, naming it; a column neither read nor declared kept is ignored, and the
      report names it (`ImportIgnoredKind`, `columns`). The analysed report is what applies,
      even if the mapping changes in the meantime (`applyImport`). An MS Project schedule
      updates an existing task without touching its attachment to the work breakdown; on the
      main structure, the only one to carry attachments, a file that would place the task of an
      order item outside the subtree of the task of its work package is rejected whole in the
      report, which names both tasks, like a schedule that would extend the duration of the
      project beyond fifteen years (`ImportReport.refusals`, `ORDER_ITEM_OUTSIDE_WORK_PACKAGE`,
      `PROJECT_HORIZON_EXCEEDED`, WF-PLA-0150; EP-14/L42s), and the deletion of an attached task
      is applied, the report naming the work package or order item that loses its task
      (`ImportDifference.work_breakdown_label`, WF-INTF-0040, WF-PLA-0170). On an In progress
      project, the estimate import is refused on the main structure, naming the condition — its
      estimate is no longer entered, the remaining to commit being imported according to
      WF-INTF-0120 —, and remains open on a differential structure and on the own estimate of a
      risk (WF-INTF-0100; C-358, #1153): the main structure states it in advance
      (`StructureCommand.edit_estimate`). A line of a started or completed task does not leave a
      subproject that has received actual costs (WF-PRJ-0050): placed in the sheet of another
      subproject of a remaining to commit (WF-INTF-0120), or carrying another subproject in the
      column of an estimate (WF-INTF-0100), it is rejected in the report, which names that
      subproject (`ImportRejection`, `SUBPROJECT_HAS_ACTUAL_COSTS`; C-359, #1152, #1153). The
      analysis is entrusted to the worker (WF-ARC-0090). An unknown upload, expired or already
      used by an import, hence deleted (WF-DAT-0120), and an unknown structure or one of another
      revision are refused with 404 (I-03, #1789). A new line under a completed task of the main
      structure is rejected in the report, the task named, like its entry (`ImportRejection`,
      `task_not_completed`; I-05, #1793).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/exchanges.yaml#/ImportRequest }
    responses:
      '202':
        description: Analysis queued.
        content:
          application/json:
            schema: { $ref: ../components/schemas/exchanges.yaml#/ImportDetail }
            examples:
              analysing: { $ref: ../../../fixtures/api/import_analysing.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` naming the first missing
          condition, and nothing is analysed. A terminal project, `project_not_terminal`
          (WF-CYC-0100) — it then lists no command, and this 409 is the only place where the
          condition is named (I-03, #1789). For a schedule, an estimate or a remaining to commit,
          in the order in which `ProjectCommand.import_*` names them: for a remaining to commit,
          `project_in_progress` first, when the project is not In progress (WF-RAE-0040;
          US-1630, #2796); then `no_background_task_running`
          while a background task writes to the current revision or freezes it, then
          `may_create_revision` for whoever lacks `revisions.write` when the import would create the
          current revision — a 409 and not a 403, as for the merge (`mergeCostStructure`)
          (WF-INTF-0090; I-04, #1792). Or an estimate imported on the main structure of a
          project that has reached In progress, `project_before_in_progress`, the condition that the
          main structure names when its estimate is entered (`StructureCommand.edit_estimate`,
          WF-INTF-0100; C-358). A differential structure and the own estimate of a risk
          accept it whatever the state of the project. Or an actual cost import as long as the
          mapping of the installation is incomplete, `actual_cost_mapping_complete`, the
          condition that the project's `import_actual_costs` command names in advance, and
          `params.columns` the required columns without a label (`ActualCostSourceColumn`, in
          the order of the mapping; WF-REF-0190). It is judged after the state of the project, in
          the order in which the command names its conditions.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              estimate_main_in_progress: { $ref: ../../../fixtures/api/import_estimate_main_in_progress.json }
              actual_cost_mapping_incomplete: { $ref: ../../../fixtures/api/import_actual_cost_mapping_incomplete.json }
              terminal: { $ref: ../../../fixtures/api/import_open_terminal.json }
              background_running: { $ref: ../../../fixtures/api/import_open_background_running.json }
              may_create_revision: { $ref: ../../../fixtures/api/import_open_may_create_revision.json }
      '422':
        description: >-
          Format or version not recognised when reading the header, before any analysis; the
          expected format is named (WF-INTF-0070): `FILE_FORMAT_UNREADABLE`,
          `params.expected_format` the format of the import's kind (an `ExchangeKind`) and
          `params.expected_version` its version. An actual cost
          extraction has no version: it is recognised by the labels the mapping
          declares (WF-INTF-0070, WF-REF-0190); when a required column is missing from it, it
          is refused with `FILE_FORMAT_UNREADABLE`, `params.expected_format` set to `actual_costs`,
          without `expected_version`, and `params.missing_columns` each required column that the
          file carries under none of its labels, with the declared labels, in the order
          of the mapping. Or an upload
          that was not made for an import — a backup uploaded for a restore
          (`FileUploadPurpose`) —: `VALIDATION_FAILED`, `fields` designating `/upload_id` with
          `UPLOAD_PURPOSE_MISMATCH`. Or an extracted period whose end precedes its start:
          `VALIDATION_FAILED`, `/period_to` with `VALUE_OUT_OF_RANGE`, `params.minimum` the start.
          Nothing is queued.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              format_unreadable: { $ref: ../../../fixtures/api/import_format_unreadable.json }
              actual_costs_column_missing: { $ref: ../../../fixtures/api/import_actual_costs_column_missing.json }
              purpose_mismatch: { $ref: ../../../fixtures/api/import_upload_purpose_mismatch.json }
              period_inverted: { $ref: ../../../fixtures/api/import_period_inverted.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/imports/{import_id}:
  get:
    operationId: getImport
    tags: [exchanges]
    summary: Report of an import
    description: >-
      The structure, the revision and the period the opening received, then the report: lines
      read, unchanged, rejected with their reason, differences with the existing data, objects
      kept and signalled, ignored elements, completed tasks and differences in dates or
      durations found (WF-INTF-0080, WF-INTF-0040, WF-INTF-0120); for an estimate or a remaining
      to commit, the lines rejected because they would leave a subproject that has received
      actual costs, the subproject named (WF-INTF-0100, WF-INTF-0120), those that cite an
      unknown task, role or subproject, the value read named, or a task by a label that several
      carry (`AMBIGUOUS_TASK_LABEL`, annex B), the provision lines ignored or kept
      (`provision_lines`, `kept`, WF-INTF-0100), and the tasks that a remaining to commit
      completes on the review date the file carries (WF-INTF-0120); for an MS Project schedule,
      the planning start date of the structure that it changes (`cost_structure`), the dates of
      manual tasks kept on a day without working hours, and the manual summary tasks imported in
      automatic mode, signalled (`ImportReport.signals`, WF-PLA-0020, WF-INTF-0040; #1271); for
      an actual cost extraction, the columns of the file neither read nor declared kept, ignored
      and named by their label (`ImportIgnoredKind`, `columns`, WF-REF-0190), each cost line
      designated by its document and its item, the lines of the file with the same document and
      the same item rejected (`DUPLICATE_COST_LINE`, WF-INTF-0140; EP-16/US-0630), and those
      whose WBS element is malformed or of another project (`WBS_ELEMENT_INVALID`,
      `WBS_ELEMENT_OUTSIDE_PROJECT`, WF-CRE-0020). The report is stored as codes and rendered in
      the language of the reader (WF-ARC-0110). The import always returns its report, its task
      and its commands, apply and abandon, available or not with their conditions
      (`ImportDetail`, WF-IHM-0090; I-01, I-06, #1789, #1780); for a remaining to commit, a new
      line under a completed task is rejected, the task named
      (`import_remaining_completed_task`; I-05, #1793), and an import whose application was
      refused reads `refused` (`import_apply_refused_permission`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/ImportId
    responses:
      '200':
        description: Import and its report.
        content:
          application/json:
            schema: { $ref: ../components/schemas/exchanges.yaml#/ImportDetail }
            examples:
              analysed: { $ref: ../../../fixtures/api/import_analysed.json }
              analysing: { $ref: ../../../fixtures/api/import_analysing.json }
              planning_mismatch: { $ref: ../../../fixtures/api/import_planning_mismatch.json }
              remaining_analysed: { $ref: ../../../fixtures/api/import_remaining_analysed.json }
              actual_costs_analysed: { $ref: ../../../fixtures/api/import_actual_costs_analysed.json }
              actual_costs_column_ignored: { $ref: ../../../fixtures/api/import_actual_costs_column_ignored.json }
              actual_costs_duplicate_line: { $ref: ../../../fixtures/api/import_actual_costs_duplicate_line.json }
              actual_costs_first: { $ref: ../../../fixtures/api/import_actual_costs_first.json }
              planning_rejected: { $ref: ../../../fixtures/api/import_planning_rejected.json }
              remaining_subproject_held: { $ref: ../../../fixtures/api/import_remaining_subproject_held.json }
              remaining_completed_tasks: { $ref: ../../../fixtures/api/import_remaining_completed_tasks.json }
              planning_non_working_day: { $ref: ../../../fixtures/api/import_planning_non_working_day.json }
              planning_provision_moved: { $ref: ../../../fixtures/api/import_planning_provision_moved.json }
              estimate_task_without_hours: { $ref: ../../../fixtures/api/import_estimate_task_without_hours.json }
              actual_costs_wbs_invalid: { $ref: ../../../fixtures/api/import_actual_costs_wbs_invalid.json }
              actual_costs_dotted_code: { $ref: ../../../fixtures/api/import_actual_costs_dotted_code.json }
              remaining_ambiguous_label: { $ref: ../../../fixtures/api/import_remaining_ambiguous_label.json }
              remaining_completed_task: { $ref: ../../../fixtures/api/import_remaining_completed_task.json }
              apply_refused_permission: { $ref: ../../../fixtures/api/import_apply_refused_permission.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  delete:
    operationId: abandonImport
    tags: [exchanges]
    summary: Abandon an import
    description: >-
      The project remains unchanged and the file is deleted (WF-INTF-0080, WF-DAT-0120).
      Abandoning is idempotent: abandoning an import that ended without writing — abandoned,
      expired, failed or refused — returns 204 without effect, its file being already deleted
      (WF-ARC-0100). An import applied or being applied cannot be abandoned: what it has written
      is not undone by abandoning it (WF-INTF-0080), which its `abandon` command states in
      advance (I-02, #1789).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/ImportId
    responses:
      '204':
        description: >-
          Import abandoned, or already abandoned, expired, failed or refused (without effect).
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` set to `import_not_applied`: the
          import is applied or being applied (`applying`, `applied`), and what it has written is
          not undone by abandoning it (WF-INTF-0080; I-02, #1789). Nothing is changed.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              applied: { $ref: ../../../fixtures/api/import_abandon_applied.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/imports/{import_id}/apply:
  post:
    operationId: applyImport
    tags: [exchanges]
    summary: Apply an import
    description: >-
      Writes in a single transaction; an interrupted import leaves the project unchanged
      (WF-INTF-0080). The rights, the contributor status and the state of the project are
      checked again at execution time (WF-ARC-0100): an estimate analysed on the main structure
      is no longer applied once the project is In progress (WF-INTF-0100). An actual cost import
      inserts or updates on the document number and the item number, without touching the
      exclusions (WF-INTF-0140, WF-DAT-0110, WF-CRE-0030; D-4). It applies as it was analysed,
      even if the mapping of the extraction has changed since the analysis: the confirmed report
      is what applies (WF-INTF-0080), and a change to the mapping holds for subsequent imports,
      without changing any line already imported (WF-REF-0190).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/ImportId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/exchanges.yaml#/ImportApply }
    responses:
      '202':
        description: Application queued.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              queued: { $ref: ../../../fixtures/api/task_import_queued.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` naming the first missing
          condition, in this order (I-01, #1789). First `import_awaiting_decision`, the import
          being no longer `analysed` — applied or being applied, abandoned, expired, failed or
          refused: there is nothing left to apply (WF-ARC-0100), and the import does not change
          (`import_apply_expired`). Then `import_file_accepted`, a report that rejects the whole
          file (`ImportReport.refusals`, WF-INTF-0040, WF-PLA-0150; EP-14/L42s). Then the state
          conditions checked again when the task is submitted, those the opening judged
          (`openImport`): `project_not_terminal`, `no_background_task_running` (I-04, #1792),
          `may_create_revision` — the import would create the current revision, and the caller
          may not —, `project_before_in_progress`. A condition that passes refuses the
          application and leaves the import `analysed`, its report applicable and its file in
          place, the application asked again once the condition holds, without a new deposit:
          `no_background_task_running`, a background task of the project that ends, and
          `may_create_revision`, a permission that can be granted (`background_running`,
          `may_create_revision`; WF-ARC-0100, #2475). Refused for good — the report,
          `project_not_terminal`, a condition of the kind, the structure analysed that the
          current revision no longer holds (404 `NOT_FOUND`), or a permission or a contributor
          status withdrawn since the analysis (403) —, the import becomes `refused` and its file
          is deleted (WF-ARC-0100): it no longer applies, and abandoning returns 204 without
          effect (`import_apply_refused_permission`). Refusals are judged again at execution: a file
          that the analysis accepted and that an entry made since would cause to be rejected is
          not applied, the background task failing on the reason for the refusal, with the
          parameters the report would give it. An estimate analysed on the main structure before
          the project moved to In progress is no longer applied after it:
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` set to
          `project_before_in_progress`, as at the opening (`openImport`, WF-INTF-0100; C-358).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              file_rejected: { $ref: ../../../fixtures/api/import_apply_rejected.json }
              main_in_progress: { $ref: ../../../fixtures/api/import_apply_main_in_progress.json }
              expired: { $ref: ../../../fixtures/api/import_apply_expired.json }
              background_running:
                $ref: ../../../fixtures/api/import_apply_background_running.json
              may_create_revision:
                $ref: ../../../fixtures/api/import_apply_may_create_revision.json
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/exports:
  post:
    operationId: requestExport
    tags: [exchanges]
    summary: Request an export
    description: >-
      MS Project schedule with its calendars (WF-INTF-0050), estimate (WF-INTF-0110), remaining
      to commit (WF-INTF-0130) — a schedule exported then re-imported without modification gives
      back the same tasks (WF-INTF-0060) —, or image of the task tree (WF-PLA-0120). The file is
      generated by the worker and stored in object storage, where it awaits its download
      (`getBackgroundTaskResult`): it is deleted after its first complete download, or after
      twenty-four hours if it has not been downloaded, an interrupted download leaving it in
      place (WF-DAT-0120, WF-ARC-0040); its headers do not depend on the language
      (WF-INTF-0180). An MS Project schedule writes the planning start date of the structure
      into the project start date (WF-INTF-0050, WF-PLA-0020); a remaining to commit, the review
      date in "Synthèse", the one the request names or the day of the request
      (`ExportRequest.review_date`, WF-INTF-0130), which its import will use to complete a task
      (WF-INTF-0120). The named revision (`revision_id`, required) is the one whose `export_*`
      command judges the export; an unknown revision or one of another project is refused with
      404, a body without a revision with 422. An export lacks no condition — on a marked
      revision, during a marking, on a terminal project, it remains available
      (`RevisionCommand`, WF-CYC-0110) —: it has no 409 (I-17, US-0702/L2). The image of the
      task tree is never reduced, and not drawn beyond one hundred million pixels (width times
      height, measured from its layout before drawing it): the task then fails, nothing
      written, `BackgroundTaskRef.problem` set to `TASK_TREE_IMAGE_TOO_LARGE` (422), and the
      user chooses a shallower `depth` (WF-PLA-0120).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/exchanges.yaml#/ExportRequest }
    responses:
      '202':
        description: Export queued; the result is downloaded through the task.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              queued: { $ref: ../../../fixtures/api/task_export_queued.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403':
        description: >-
          The `export_*` command of the kind asked is absent from the revision named: the caller
          lacks the permission to consult the function of that kind, which guards it — an export
          is a matter of consultation (`RevisionCommand`, WF-ADM-0100, WF-CYC-0110). Refused with
          `PERMISSION_MISSING`, `params.missing_permission` naming that permission —
          `planning.read` for the planning and the image of the task tree, `estimate.read` for
          the estimate, `remaining.read` for the remaining to commit —, nothing being queued
          (`permission_missing`; #2483).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              permission_missing: { $ref: ../../../fixtures/api/export_permission_missing.json }
      '404':
        description: >-
          Project not visible, or revision unknown or of another project (WF-ADM-0110):
          `NOT_FOUND`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_of_another_project: { $ref: ../../../fixtures/api/export_revision_not_found.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` designating the field at fault: a body without a revision,
          `/revision_id`; a tree level below the first, `/depth`,
          `VALUE_OUT_OF_RANGE`, `params.minimum` set to `1` (WF-PLA-0120).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              depth_out_of_range: { $ref: ../../../fixtures/api/export_depth_out_of_range.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
