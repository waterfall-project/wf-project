# Échanges par fichier. Waterfall n'échange que par les flux FLX-01 à FLX-07
# (WF-INTF-0150), et tout import se déroule en deux temps (WF-ARC-0100).

/file-uploads:
  post:
    operationId: uploadFile
    tags: [exchanges]
    summary: Déposer un fichier
    description: >-
      Le fichier est écrit sur le stockage objet et n'y vit que le temps de l'import :
      il est supprimé dès que celui-ci est appliqué, abandonné ou expiré (WF-DAT-0120).
      Le dépôt dit son usage (`purpose`) : le fichier d'un import ne dépasse pas 10 Mio
      (10 485 760 octets), la taille d'un fichier MS Project, le plus lourd des imports
      (§4.6.2) ; au-delà, 413, `FILE_TOO_LARGE`. Un import ne s'ouvre que sur un dépôt d'import,
      une restauration que sur un dépôt de sauvegarde : l'autre est refusé par 422,
      `VALIDATION_FAILED`, le champ qui désigne le dépôt en défaut, `UPLOAD_PURPOSE_MISMATCH`
      (`openImport`, `startRestore`). Le dépôt d'une sauvegarde ne passe pas par ici, mais par
      morceaux (`openChunkedUpload`, `uploadChunk`, `completeChunkedUpload`) : `purpose` à
      `external_backup` est refusé par 422, `VALIDATION_FAILED`, `fields` désignant `/purpose`
      par `UPLOAD_PURPOSE_MISMATCH`.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, purpose]
            properties:
              file: { type: string, format: binary }
              purpose: { $ref: ../components/schemas/exchanges.yaml#/FileUploadPurpose }
    responses:
      '201':
        description: Fichier déposé.
        content:
          application/json:
            schema: { $ref: ../components/schemas/exchanges.yaml#/FileUpload }
            examples:
              estimate: { $ref: ../../../fixtures/api/file_upload.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '413': { $ref: ../components/responses.yaml#/PayloadTooLarge }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/chunked-uploads:
  post:
    operationId: openChunkedUpload
    tags: [exchanges]
    summary: Ouvrir le dépôt par morceaux d'une sauvegarde
    description: >-
      Ouvre le dépôt d'une sauvegarde copiée hors de la plateforme, que `startRestore` désignera
      (WF-ADM-0160) : un dépôt s'ouvre, reçoit ses morceaux (`uploadChunk`) et se termine
      (`completeChunkedUpload`). Le serveur y dit en combien de morceaux, de quelle taille, le
      fichier se découpe. La taille annoncée est bornée par
      `Installation.external_backup_max_bytes`, et par les 10 000 morceaux que le stockage objet
      admet : le serveur choisit `part_size_bytes` dans ses bornes pour tenir sous 10 000
      morceaux, et une taille qui n'y tient pas même à 10 Mio le morceau (10 000 × 10 Mio) est
      refusée comme celle qui dépasse le réglage. Dans les deux cas, 413, `FILE_TOO_LARGE`, avant
      qu'aucun morceau ne soit envoyé. Le fichier est écrit sur le stockage objet et n'y vit
      que le temps de sa restauration (WF-DAT-0120). Sous la permission de restaurer la plateforme
      (`platform_restore`, WF-ADM-0160), comme `startRestore` : sans elle, 403. Un envoi
      interrompu — par un rechargement de page — recommence par une ouverture, le dépôt
      précédent expirant ; aucune opération ne lit un dépôt.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/exchanges.yaml#/ChunkedUploadOpen }
    responses:
      '201':
        description: Dépôt ouvert, sans aucun morceau reçu.
        content:
          application/json:
            schema: { $ref: ../components/schemas/exchanges.yaml#/ChunkedUpload }
            examples:
              opened: { $ref: ../../../fixtures/api/chunked_upload.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '413': { $ref: ../components/responses.yaml#/PayloadTooLarge }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant chaque champ en défaut : un nom vide,
          `/filename` par `VALUE_REQUIRED`, ou plus long que le schéma ne l'admet, par
          `VALUE_TOO_LONG` ; une taille hors de ses bornes, `/size_bytes` par
          `VALUE_OUT_OF_RANGE`, `fields[].params.minimum` ou `maximum` la seule borne franchie,
          comme toute borne d'une écriture. Rien n'est ouvert.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              size_out_of_range: { $ref: ../../../fixtures/api/chunked_upload_size_out_of_range.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/chunked-uploads/{chunked_upload_id}/parts/{part_number}:
  put:
    operationId: uploadChunk
    tags: [exchanges]
    summary: Déposer un morceau
    description: >-
      Reçoit le morceau de ce numéro de la sauvegarde à restaurer (WF-ADM-0160), en octets
      bruts, de la taille exacte que le dépôt attend : `ChunkedUpload.part_size_bytes` pour tout
      morceau sauf le dernier, le reste du fichier (`size_bytes` moins les morceaux qui le
      précèdent) pour le dernier. Autrement, 422, `VALIDATION_FAILED`, `fields` désignant `/body`
      par `VALUE_OUT_OF_RANGE`, `params.minimum` et `params.maximum` disant la taille attendue ;
      rien n'est reçu. Redéposer un morceau déjà reçu le remplace, ce qui rend un envoi
      interrompu reprenable avec la dernière réponse ; les morceaux peuvent arriver dans un
      ordre quelconque. Un numéro que le dépôt ne compte pas, ou un dépôt terminé, expiré ou
      inconnu, est un 404. Sous la permission de restaurer la plateforme (`platform_restore`),
      comme `startRestore` : sans elle, 403. Le morceau est écrit sur le stockage objet avant la
      réponse, qui dit les morceaux reçus.
    parameters:
      - $ref: ../components/parameters.yaml#/ChunkedUploadId
      - $ref: ../components/parameters.yaml#/ChunkedUploadPartNumber
    requestBody:
      required: true
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    responses:
      '200':
        description: Morceau reçu.
        content:
          application/json:
            schema: { $ref: ../components/schemas/exchanges.yaml#/ChunkedUpload }
            examples:
              received: { $ref: ../../../fixtures/api/chunked_upload_part.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          Un morceau qui n'a pas la taille attendue : `VALIDATION_FAILED`, `fields` désignant
          `/body` par `VALUE_OUT_OF_RANGE`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              part_size_mismatch: { $ref: ../../../fixtures/api/chunked_upload_part_size_mismatch.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/chunked-uploads/{chunked_upload_id}/completion:
  post:
    operationId: completeChunkedUpload
    tags: [exchanges]
    summary: Terminer le dépôt par morceaux
    description: >-
      Assemble les morceaux de la sauvegarde à restaurer (WF-ADM-0160) en un seul fichier sur
      le stockage objet et rend le dépôt, un `FileUpload` dont `purpose` est `external_backup` :
      son `upload_id` est celui que `startRestore` désigne (`external_backup_upload_id`), et son
      `backup_taken_at` la date que dit le manifeste de la sauvegarde, que la confirmation de la
      restauration nomme (`acknowledged_backup_taken_at`). Refusé
      par 422, `FILE_FORMAT_UNREADABLE`, quand le fichier assemblé n'est pas une archive dont le
      manifeste, son premier membre, dit la date de la sauvegarde : un dépôt dont la date ne se
      lit pas n'est jamais restaurable, et reste inachevé. Le dépôt ne vérifie pas l'archive
      au-delà de son manifeste : la restauration la vérifie, avant de déconnecter quiconque
      (`startRestore`). Refusé
      par 409, `STATE_FORBIDS_OPERATION`, tant qu'un morceau manque ; `params.missing_parts`
      dit les numéros qui manquent, en ordre croissant, et rien n'est assemblé. Un dépôt déjà
      terminé, expiré ou inconnu est un 404. Sous la permission de restaurer la plateforme
      (`platform_restore`), comme `startRestore` : sans elle, 403.
    parameters:
      - $ref: ../components/parameters.yaml#/ChunkedUploadId
    responses:
      '201':
        description: Fichier assemblé et déposé.
        content:
          application/json:
            schema: { $ref: ../components/schemas/exchanges.yaml#/FileUpload }
            examples:
              completed: { $ref: ../../../fixtures/api/chunked_upload_completed.json }
              external_backup: { $ref: ../../../fixtures/api/file_upload_external_backup.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Un morceau manque : `STATE_FORBIDS_OPERATION`, `params.missing_parts` les numéros des
          morceaux que le dépôt n'a pas reçus, en tableau d'entiers.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              missing_part: { $ref: ../../../fixtures/api/chunked_upload_incomplete.json }
      '422':
        description: >-
          Le fichier assemblé n'est pas une archive de sauvegarde dont le manifeste, son premier
          membre, dit la date, avec son fuseau : `FILE_FORMAT_UNREADABLE`, sans paramètre.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              unreadable: { $ref: ../../../fixtures/api/chunked_upload_unreadable.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/imports:
  get:
    operationId: listImports
    tags: [exchanges]
    summary: Imports du projet
    description: >-
      Les imports du projet, en cours et passés, avec l'état où chacun s'est arrêté
      (WF-INTF-0080, WF-ARC-0100), du plus récent au plus ancien par leur ouverture
      (`created_at`), comme les autres journaux.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
    responses:
      '200':
        description: Imports, analysés, appliqués ou abandonnés, du plus récent au plus ancien.
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/exchanges.yaml#/Import }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              imports: { $ref: ../../../fixtures/api/imports.json }
              page: { $ref: ../../../fixtures/api/imports_page.json }
              empty: { $ref: ../../../fixtures/api/imports_empty.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: openImport
    tags: [exchanges]
    summary: Ouvrir un import et lancer son analyse
    description: >-
      L'ouverture lit l'en-tête du fichier — son format, sa version, les intitulés de ses
      colonnes — avant de mettre l'analyse en file, et refuse par 422 ce qu'elle ne reconnaît pas
      (WF-INTF-0070) : la lecture se borne à l'en-tête, et le contenu n'est lu que par
      l'analyse. L'analyse, confiée au
      worker, compare le contenu aux données existantes et produit le compte rendu, sans rien
      modifier (WF-ARC-0100, WF-INTF-0080) ; elle ne refuse plus de format, l'ouverture l'ayant
      reconnu. Les imports de planning, de devis et de reste à engager s'appliquent à la
      révision en cours, créée au besoin (WF-INTF-0090), sur la structure que la requête nomme,
      la principale par défaut, que l'import rend (`Import.structure_id`). Selon le flux :
      planning MS Project (WF-INTF-0040), dont la date de début du projet devient la date de
      début de planning de la structure (`CostStructure.planning_start_on`, WF-PLA-0020), le
      compte rendu présentant son changement ; devis (WF-INTF-0100), reste à engager
      (WF-INTF-0120), coûts réels (WF-INTF-0140), dont la période extraite est journalisée
      (WF-CRE-0050). Une extraction de coûts réels se lit selon la correspondance de
      l'installation (`getActualCostMapping`, WF-REF-0190) : l'import est refusé tant que l'une
      des quatre colonnes exigées n'y a aucun intitulé, ce que la commande `import_actual_costs`
      du projet dit d'avance ; un fichier auquel manque une colonne exigée est refusé en la
      nommant ; une colonne ni lue ni déclarée conservée est ignorée, et le compte rendu la nomme
      (`ImportIgnoredKind`, `columns`). Le compte rendu analysé est ce qui s'applique, même si la
      correspondance change entre-temps (`applyImport`). Un planning MS Project met à jour une tâche existante sans toucher à son
      rattachement au lotissement ; sur la structure principale, seule à porter des
      rattachements, un fichier qui placerait la tâche d'un poste hors du sous-arbre de la tâche de
      son lot est rejeté entier au compte rendu, qui nomme les deux tâches, comme un planning
      qui porterait la durée du projet au-delà de quinze ans (`ImportReport.refusals`,
      `ORDER_ITEM_OUTSIDE_WORK_PACKAGE`, `PROJECT_HORIZON_EXCEEDED`, WF-PLA-0150 ; EP-14/L42s),
      et la suppression d'une tâche rattachée est appliquée, le compte rendu
      nommant le lot ou le poste qui perd sa tâche (`ImportDifference.work_breakdown_label`,
      WF-INTF-0040, WF-PLA-0170). Sur un projet En cours, l'import du devis est refusé sur la
      structure principale, en nommant la condition — son devis ne se saisit plus, le reste à
      engager s'important selon WF-INTF-0120 —, et reste ouvert sur une structure différentielle
      et sur le devis propre d'un risque (WF-INTF-0100 ; C-358, #1153) : la structure principale
      le dit d'avance (`StructureCommand.edit_estimate`). Une ligne d'une tâche démarrée ou
      terminée ne quitte pas un sous-projet qui a reçu des coûts réels (WF-PRJ-0050) : placée dans
      l'onglet d'un autre sous-projet d'un reste à engager (WF-INTF-0120), ou portant un autre
      sous-projet dans la colonne d'un devis (WF-INTF-0100), elle est rejetée au compte rendu, qui
      nomme ce sous-projet (`ImportRejection`, `SUBPROJECT_HAS_ACTUAL_COSTS` ; C-359, #1152,
      #1153). L'analyse est confiée au worker (WF-ARC-0090). Un dépôt inconnu ou expiré, une
      structure inconnue ou d'une autre révision sont refusés par 404.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/exchanges.yaml#/ImportRequest }
    responses:
      '202':
        description: Analyse mise en file.
        content:
          application/json:
            schema: { $ref: ../components/schemas/exchanges.yaml#/Import }
            examples:
              analysing: { $ref: ../../../fixtures/api/import_analysing.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Projet terminal, ou fichier déjà consommé (WF-CYC-0100). Ou un devis importé sur la
          structure principale d'un projet qui a atteint En cours : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` à `project_before_in_progress`, la condition que la
          structure principale nomme à la saisie de son devis (`StructureCommand.edit_estimate`),
          et rien n'est analysé (WF-INTF-0100 ; C-358). Une structure différentielle et le devis
          propre d'un risque l'acceptent quel que soit l'état du projet. Ou un import de coûts
          réels tant que la correspondance de l'installation est incomplète :
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `actual_cost_mapping_complete`,
          la condition que la commande `import_actual_costs` du projet nomme d'avance, et
          `params.columns` les colonnes exigées sans intitulé (`ActualCostSourceColumn`, dans
          l'ordre de la correspondance) ; rien n'est analysé (WF-REF-0190). Elle se juge après
          l'état du projet, dans l'ordre où la commande nomme ses conditions.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              estimate_main_in_progress: { $ref: ../../../fixtures/api/import_estimate_main_in_progress.json }
              actual_cost_mapping_incomplete: { $ref: ../../../fixtures/api/import_actual_cost_mapping_incomplete.json }
      '422':
        description: >-
          Format ou version non reconnus à la lecture de l'en-tête, avant toute analyse ; le
          format attendu est nommé (WF-INTF-0070) : `FILE_FORMAT_UNREADABLE`,
          `params.expected_format` le format de la nature de l'import (un `ExchangeKind`) et
          `params.expected_version` sa version. Une extraction de
          coûts réels n'a pas de version : elle se reconnaît aux intitulés que déclare la
          correspondance (WF-INTF-0070, WF-REF-0190) ; à laquelle manque une colonne exigée, elle
          est refusée par `FILE_FORMAT_UNREADABLE`, `params.expected_format` à `actual_costs`,
          sans `expected_version`, et `params.missing_columns` chaque colonne exigée que le
          fichier ne porte sous aucun de ses intitulés, avec les intitulés déclarés, dans l'ordre
          de la correspondance. Ou un dépôt
          qui n'a pas été fait pour un import — une sauvegarde déposée pour une restauration
          (`FileUploadPurpose`) — : `VALIDATION_FAILED`, `fields` désignant `/upload_id` par
          `UPLOAD_PURPOSE_MISMATCH`. Ou une période extraite dont la fin précède le début :
          `VALIDATION_FAILED`, `/period_to` par `VALUE_OUT_OF_RANGE`, `params.minimum` le début.
          Rien n'est mis en file.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              format_unreadable: { $ref: ../../../fixtures/api/import_format_unreadable.json }
              actual_costs_column_missing: { $ref: ../../../fixtures/api/import_actual_costs_column_missing.json }
              purpose_mismatch: { $ref: ../../../fixtures/api/import_upload_purpose_mismatch.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/imports/{import_id}:
  get:
    operationId: getImport
    tags: [exchanges]
    summary: Compte rendu d'un import
    description: >-
      La structure, la révision et la période que l'ouverture a reçues, puis le compte rendu :
      lignes lues, inchangées, rejetées avec leur motif, écarts avec les données existantes,
      objets conservés et signalés, éléments ignorés, tâches terminées et écarts de dates
      ou de durées constatés (WF-INTF-0080, WF-INTF-0040, WF-INTF-0120) ; d'un devis ou d'un
      reste à engager, les lignes rejetées parce qu'elles quitteraient un sous-projet qui a reçu
      des coûts réels, le sous-projet nommé (WF-INTF-0100, WF-INTF-0120), celles qui citent une
      tâche, un rôle ou un sous-projet inconnus, la valeur lue nommée, ou une tâche par un libellé
      que plusieurs portent (`AMBIGUOUS_TASK_LABEL`, ANNEXE B), les lignes de provision ignorées
      ou conservées (`provision_lines`, `kept`, WF-INTF-0100), et les tâches qu'un reste à
      engager termine à la date de la revue que porte le fichier (WF-INTF-0120) ; d'un planning
      MS Project, la date de début de planning de la structure qu'il change (`cost_structure`),
      les dates de tâches manuelles gardées sur un jour sans heure travaillée, et les
      récapitulatives manuelles importées en mode automatique, signalées
      (`ImportReport.signals`, WF-PLA-0020, WF-INTF-0040 ; #1271) ; d'une extraction de coûts
      réels, les colonnes du fichier ni lues ni déclarées conservées, ignorées et nommées par leur
      intitulé (`ImportIgnoredKind`, `columns`, WF-REF-0190), chaque ligne de coût désignée par sa
      pièce et son poste, les lignes du fichier de même pièce et de même poste rejetées
      (`DUPLICATE_COST_LINE`, WF-INTF-0140 ; EP-16/US-0630), et celles dont l'élément d'OTP est
      mal formé ou d'un autre projet (`WBS_ELEMENT_INVALID`, `WBS_ELEMENT_OUTSIDE_PROJECT`,
      WF-CRE-0020). Le compte rendu est conservé sous forme de codes et rendu dans la langue du
      lecteur (WF-ARC-0110).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/ImportId
    responses:
      '200':
        description: Import et son compte rendu.
        content:
          application/json:
            schema: { $ref: ../components/schemas/exchanges.yaml#/Import }
            examples:
              analysed: { $ref: ../../../fixtures/api/import_analysed.json }
              analysing: { $ref: ../../../fixtures/api/import_analysing.json }
              planning_mismatch: { $ref: ../../../fixtures/api/import_planning_mismatch.json }
              remaining_analysed: { $ref: ../../../fixtures/api/import_remaining_analysed.json }
              actual_costs_analysed: { $ref: ../../../fixtures/api/import_actual_costs_analysed.json }
              actual_costs_column_ignored: { $ref: ../../../fixtures/api/import_actual_costs_column_ignored.json }
              actual_costs_duplicate_line: { $ref: ../../../fixtures/api/import_actual_costs_duplicate_line.json }
              actual_costs_first: { $ref: ../../../fixtures/api/import_actual_costs_first.json }
              planning_rejected: { $ref: ../../../fixtures/api/import_planning_rejected.json }
              remaining_subproject_held: { $ref: ../../../fixtures/api/import_remaining_subproject_held.json }
              planning_non_working_day: { $ref: ../../../fixtures/api/import_planning_non_working_day.json }
              planning_provision_moved: { $ref: ../../../fixtures/api/import_planning_provision_moved.json }
              estimate_task_without_hours: { $ref: ../../../fixtures/api/import_estimate_task_without_hours.json }
              actual_costs_wbs_invalid: { $ref: ../../../fixtures/api/import_actual_costs_wbs_invalid.json }
              remaining_ambiguous_label: { $ref: ../../../fixtures/api/import_remaining_ambiguous_label.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  delete:
    operationId: abandonImport
    tags: [exchanges]
    summary: Abandonner un import
    description: >-
      Le projet reste inchangé et le fichier est supprimé (WF-INTF-0080, WF-DAT-0120). L'abandon
      est idempotent : celui d'un import déjà abandonné ou expiré rend 204 sans effet, son
      fichier étant déjà supprimé (WF-ARC-0100). Le contrat ne dit rien de l'abandon d'un import
      appliqué ou en cours d'application : la spécification n'en dit rien, et la forme de ce
      refus est celle des refus d'US-0702.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/ImportId
    responses:
      '204':
        description: Import abandonné, ou déjà abandonné ou expiré (sans effet).
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/imports/{import_id}/apply:
  post:
    operationId: applyImport
    tags: [exchanges]
    summary: Appliquer un import
    description: >-
      Écrit en une seule transaction ; un import interrompu laisse le projet inchangé
      (WF-INTF-0080). Les droits, la qualité de contributeur et l'état du projet sont
      revérifiés au moment de l'exécution (WF-ARC-0100) : un devis analysé sur la structure
      principale n'est plus appliqué une fois le projet En cours (WF-INTF-0100). Un import de coûts
      réels insère ou met à jour sur le numéro de pièce et le numéro de poste, sans toucher aux
      exclusions (WF-INTF-0140, WF-DAT-0110, WF-CRE-0030 ; D-4). Il s'applique tel qu'il a été
      analysé, même si la correspondance de l'extraction a changé depuis l'analyse : le compte rendu
      confirmé est ce qui s'applique (WF-INTF-0080), et une modification de la correspondance vaut
      pour les imports suivants, sans changer aucune ligne déjà importée (WF-REF-0190).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/ImportId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/exchanges.yaml#/ImportApply }
    responses:
      '202':
        description: Application mise en file.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              queued: { $ref: ../../../fixtures/api/task_import_queued.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Compte rendu expiré, déjà appliqué, ou condition de droits ou d'état qui a
          cessé d'être vraie depuis l'analyse (WF-ARC-0100). Ou un compte rendu qui rejette le
          fichier entier (`ImportReport.refusals`, WF-INTF-0040, WF-PLA-0150) :
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `import_file_accepted`, et
          rien n'est appliqué (EP-14/L42s). Un compte rendu expiré ou déjà appliqué l'emporte — il
          n'y a plus rien à appliquer —, puis `import_file_accepted`, puis les conditions de
          droits et d'état revérifiées. Refusé, le fichier est supprimé, comme celui de tout import
          refusé à l'application (WF-ARC-0100), et seul l'abandon reste offert. Les refus se
          rejugent à l'exécution : un fichier que l'analyse acceptait et qu'une saisie faite depuis
          ferait rejeter n'est pas appliqué, la tâche de fond échouant sur le motif du refus, avec
          les paramètres que le compte rendu lui donnerait. Un devis analysé sur la structure
          principale avant le passage du projet à En cours n'est plus appliqué après lui :
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `project_before_in_progress`,
          comme à l'ouverture (`openImport`, WF-INTF-0100 ; C-358).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              file_rejected: { $ref: ../../../fixtures/api/import_apply_rejected.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/exports:
  post:
    operationId: requestExport
    tags: [exchanges]
    summary: Demander un export
    description: >-
      Planning MS Project avec ses calendriers (WF-INTF-0050), devis (WF-INTF-0110),
      reste à engager (WF-INTF-0130) — un planning exporté puis réimporté sans
      modification restitue les mêmes tâches (WF-INTF-0060) —, ou image de l'arborescence de tâches
      (WF-PLA-0120). Le fichier est engendré par le worker et déposé sur le stockage objet, où il
      attend son téléchargement (`getBackgroundTaskResult`) : il est supprimé à l'issue de son
      premier téléchargement complet, ou au terme de vingt-quatre heures s'il n'a pas été
      téléchargé, un téléchargement interrompu le laissant en place (WF-DAT-0120,
      WF-ARC-0040) ; ses en-têtes ne dépendent pas de la langue (WF-INTF-0180). Un planning MS
      Project écrit la date de début de planning de la structure dans la date de début du projet
      (WF-INTF-0050, WF-PLA-0020) ; un reste à engager, la date de la revue en « Synthèse »,
      celle que la requête nomme ou le jour de la demande (`ExportRequest.review_date`,
      WF-INTF-0130), que son import retiendra pour terminer une tâche (WF-INTF-0120). La
      révision nommée (`revision_id`, exigé) est celle dont la commande `export_*` juge
      l'export ; une révision inconnue ou d'un autre projet est refusée par 404, un corps sans
      révision par 422. Un export ne manque d'aucune condition — sur une révision marquée,
      pendant un marquage, sur un projet terminal, il reste disponible (`RevisionCommand`,
      WF-CYC-0110) — : il n'a pas de 409 (I-17, US-0702/L2).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/exchanges.yaml#/ExportRequest }
    responses:
      '202':
        description: Export mis en file ; le résultat se télécharge par la tâche.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              queued: { $ref: ../../../fixtures/api/task_export_queued.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404':
        description: >-
          Projet invisible, ou révision inconnue ou d'un autre projet (WF-ADM-0110) :
          `NOT_FOUND`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_of_another_project: { $ref: ../../../fixtures/api/export_revision_not_found.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant le champ en défaut : un corps sans révision,
          `/revision_id` ; un niveau d'arborescence sous le premier, `/depth`,
          `VALUE_OUT_OF_RANGE`, `params.minimum` à `1` (WF-PLA-0120).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              depth_out_of_range: { $ref: ../../../fixtures/api/export_depth_out_of_range.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
