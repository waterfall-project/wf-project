/projects/{project_id}/revisions:
  get:
    operationId: listRevisions
    tags: [revisions]
    summary: Historique des révisions
    description: >-
      Nom de version, description, état, date de marquage, année de référence, taux
      d'inflation et probabilité de gain conservés, caractère de référence — les attributs d'une
      révision (WF-REV-0090) —, et la révision marquée dont chacune est la copie, qu'un écran
      nomme avec la révision en cours (WF-IHM-0020) ; chacune est consultable dans son
      intégralité (WF-REV-0070), l'instantané du référentiel par `getRevision` (`snapshot`, omis
      ici).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - name: status
        in: query
        description: Les états retenus, en cours ou marquée ; absents, toutes (WF-IHM-0130).
        schema:
          type: array
          items: { $ref: ../components/schemas/revisions.yaml#/RevisionStatus }
        explode: false
      - name: search
        in: query
        description: >-
          Recherche sur le nom de version et la description, comparés comme toute recherche du
          contrat (README, « Une recherche… »).
        schema: { type: string, minLength: 1, maxLength: 200 }
    responses:
      '200':
        description: Révisions, de la plus récente à la plus ancienne.
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/revisions.yaml#/Revision }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/revisions.json }
              empty: { $ref: ../../../fixtures/api/revisions_empty.json }
              marked: { $ref: ../../../fixtures/api/revisions_marked.json }
              designation_open: { $ref: ../../../fixtures/api/revisions_designation_open.json }
              project_created: { $ref: ../../../fixtures/api/revisions_project_created.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createRevision
    tags: [revisions]
    summary: Ouvrir la révision en cours
    description: >-
      Un projet comporte au plus une révision en cours ; sa création copie les structures de la
      dernière révision marquée et les valeurs du référentiel qu'elles emploient (WF-REV-0010,
      WF-DAT-0010), rattachements des tâches au lotissement compris, sauf à un lot ou à un poste
      marqué supprimé, que la copie ne reprend pas (WF-PLA-0170). Elle ne reprend pas les
      structures fusionnées (`CostStructure.is_merged`) : un différentiel fusionné, consommé par
      sa fusion, dont le contenu est dans la structure principale (WF-REV-0050), et le devis
      propre d'un risque survenu, consommé par sa survenance (WF-RIS-0060), dont le coût reste
      dans `Risk.occurrence_cost` ; ce qu'ils contenaient se relit dans la révision où ils ont été
      fusionnés (WF-DAT-0020). Le devis propre d'un risque écarté, qui peut redevenir identifié,
      est repris (WF-REV-0100 ; #1758, #1757). La révision retient pour année de référence
      l'année courante (`reference_year`) ; quand elle diffère de celle de la révision copiée,
      elle est chiffrée aux taux de la révision copiée, projetés par le taux d'inflation du projet
      jusqu'à son année de référence, sauf `apply_rate_update`, et la mise à jour des taux est
      proposée, jamais imposée (WF-REV-0060, WF-REV-0010 ; #1764).
      C'est la première des deux écritures du squelette de planning sur un projet sans révision
      en cours, que le projet dit d'avance (`ProjectCommand.generate_skeleton`) : la révision
      rendue liste `generate_skeleton`, et `generatePlanningSkeleton` s'y applique
      (EP-15/US-0490/L4).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/RevisionCreate }
    responses:
      '201':
        description: Révision en cours créée.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/Revision }
            examples:
              created: { $ref: ../../../fixtures/api/revision_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          L'état du projet interdit l'ouverture, comme sa commande `create_revision` le dit, ou
          son absence d'un projet terminal : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` à `project_not_terminal` sur un projet terminal
          (WF-CYC-0100) ; à `no_current_revision` quand une révision en cours existe déjà
          (WF-REV-0010 ; J-01, #1795) — une ouverture demandée depuis un écran lu avant qu'une
          autre ne l'ouvre, la première des deux écritures du squelette de planning sur un projet
          qui n'en avait pas, reçoit ce refus, et l'écran relit le projet (EP-15/US-0490/L4) — ;
          puis à `no_background_task_running` pendant
          l'application d'un import, le traitement d'une survenance ou la fusion d'un différentiel
          de la dernière révision marquée, qui créent eux-mêmes la révision en cours (WF-REV-0010,
          WF-INTF-0090 ; E-13, US-0702/L2). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              current_revision_exists: { $ref: ../../../fixtures/api/current_revision_exists.json }
              background_task_running: { $ref: ../../../fixtures/api/revision_create_background_running.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}:
  get:
    operationId: getRevision
    tags: [revisions]
    summary: Une révision et son instantané
    description: >-
      Attributs de la révision et contenu de son instantané (WF-REV-0090, WF-REV-0030) : les
      valeurs du référentiel qu'une révision marquée a figées (`snapshot`), omis pour la révision
      en cours.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    responses:
      '200':
        description: Révision, avec les valeurs de référentiel et les paramètres conservés (WF-REV-0030).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/Revision }
            examples:
              witness: { $ref: ../../../fixtures/api/revision.json }
              marked: { $ref: ../../../fixtures/api/revision_marked.json }
              offer: { $ref: ../../../fixtures/api/revision_offer.json }
              reader: { $ref: ../../../fixtures/api/revision_reader.json }
              estimator: { $ref: ../../../fixtures/api/revision_estimator.json }
              marking: { $ref: ../../../fixtures/api/revision_marking.json }
              importing: { $ref: ../../../fixtures/api/revision_importing.json }
              without_tasks: { $ref: ../../../fixtures/api/revision_without_tasks.json }
              merge_without_current_revision: { $ref: ../../../fixtures/api/revision_marked_merge_offered.json }
              rate_update_offered: { $ref: ../../../fixtures/api/revision_rate_update_offered.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  delete:
    operationId: abandonRevision
    tags: [revisions]
    summary: Abandonner la révision en cours
    description: >-
      Le projet revient à son état à la dernière révision marquée, et les lignes de la
      révision abandonnée sont supprimées (WF-REV-0010, WF-DAT-0010). Les risques reviennent
      à l'évaluation de la dernière révision marquée — probabilité, état, structure propre,
      ligne de provision et coût à la survenance — : un risque créé dans la révision abandonnée
      disparaît, un réexamen qu'elle portait est défait, et un risque qui y a été déclaré
      survenu redevient identifié avec sa ligne de provision, sans coût à la survenance — seul
      l'abandon défait la survenance (WF-RIS-0020, WF-RIS-0060). Le libellé, la description et
      les actions de mitigation d'un risque qui reste sont des données du projet, que l'abandon
      ne change pas (WF-RIS-0020). Refusé sur une révision marquée (WF-DAT-0020), et pendant un
      traitement de fond qui court sur elle, comme sa commande `abandon` le dit. L'abandon est
      irréversible, hors de l'annulation : il ne s'inscrit pas à l'historique que `undoLastChange`
      défait, la révision et ses lignes n'étant plus (WF-IHM-0110, C-363) ; l'écran le dit dans sa
      confirmation. Il porte le compteur lu de la révision : une révision écrite depuis sa lecture
      n'est pas abandonnée.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - name: lock_version
        in: query
        required: true
        description: >-
          Le compteur de la révision abandonnée, tel que l'écran l'a lu (`Revision.lock_version`) :
          périmé, l'abandon est refusé par 412 et rien n'est supprimé (WF-IHM-0110 ; décision de
          l'auteur du 2026-10-28, E-13, US-0702/L2).
        schema: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '204':
        description: Révision abandonnée.
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La commande `abandon` de la révision est indisponible : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` la première condition qui lui manque, dans l'ordre où elle
          les nomme — `revision_draft` sur une révision marquée, qui ne se modifie plus
          (WF-DAT-0020), puis `no_background_task_running` pendant un marquage, une fusion, le
          traitement d'une survenance ou l'application d'un import, qui écrivent dans la révision
          ou la figent (E-13, US-0702/L2). Rien n'est supprimé.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_marked: { $ref: ../../../fixtures/api/revision_abandon_marked.json }
      '412':
        description: >-
          `STALE_LOCK_VERSION` : la révision a été écrite depuis sa lecture, et rien n'est abandonné
          ; `params.expected_lock_version` est son compteur courant (WF-IHM-0110, US-0702/L2).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/revision_abandon_stale.json }
      '422': { $ref: ../components/responses.yaml#/LockVersionInvalid }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/mark:
  post:
    operationId: markRevision
    tags: [revisions]
    summary: Marquer la révision
    description: >-
      Fige la révision et calcule ses indicateurs dans la même transaction
      (WF-REV-0020, WF-DAT-0040) ; une révision marquée avant l'état En cours ne
      conserve que les indicateurs de devis. Le nom de version est unique parmi les
      révisions marquées du projet. Confié au worker (WF-ARC-0090), et inscrit au
      journal d'audit (WF-SEC-0030). La révision suivante n'est créée qu'à la demande. Le calcul
      est refusé tant qu'une catégorie de main-d'œuvre employée par le rôle d'une ligne n'a pas de
      taux horaire pour l'année de référence de la révision : la tâche échoue sans rien figer, son
      motif `HOURLY_RATE_MISSING`, `params.missing_rates` nommant les catégories une par une
      (`BackgroundTaskRef.problem`, `task_failed` ; WF-DEV-0010, WF-IHM-0080).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/RevisionMark }
    responses:
      '202':
        description: Marquage mis en file.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              queued: { $ref: ../../../fixtures/api/task_mark_queued.json }
              relaunched: { $ref: ../../../fixtures/api/task_mark_relaunched.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Nom de version déjà employé par une révision marquée du projet : `ALREADY_EXISTS`,
          `fields` désignant `/version_name` par `ALREADY_EXISTS`,
          `fields[].params.conflicting_object_id` la révision qui le porte. Ou la commande `mark`
          de la révision est indisponible : `STATE_FORBIDS_OPERATION`, `params.missing_condition`
          la première condition qui lui manque, dans l'ordre où elle les nomme — `revision_draft`
          sur une révision déjà marquée (WF-REV-0020, WF-DAT-0020), puis
          `no_background_task_running` pendant un marquage qui court, une fusion, le traitement
          d'une survenance ou l'application d'un import (E-12, US-0702/L2). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              version_name_taken: { $ref: ../../../fixtures/api/mark_version_name_taken.json }
              revision_marked: { $ref: ../../../fixtures/api/mark_revision_marked.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/reference-revision:
  put:
    operationId: designateReferenceRevision
    tags: [revisions]
    summary: Désigner la révision de référence
    description: >-
      Désignation manuelle possible tant que le projet n'a reçu aucun coût réel et
      qu'aucune révision n'a été marquée depuis la dernière désignation ; au-delà, la
      référence ne se déplace plus qu'à la contractualisation d'un avenant (WF-REV-0040).
      Inscrite au journal d'audit (WF-SEC-0030). La
      désignation fait passer le projet à En cours si les conditions de WF-CYC-0030
      sont réunies. Une écriture du projet, elle porte son compteur lu
      (`ReferenceDesignation.lock_version`, WF-IHM-0110) : deux désignations concurrentes ne
      passent pas l'une sur l'autre, même quand aucune révision n'a été marquée entre elles.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/ReferenceDesignation }
    responses:
      '200':
        description: >-
          Référence désignée : le projet, sa référence nouvelle et son état — En cours s'il porte
          son code projet (WF-CYC-0030).
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Project }
            examples:
              designated: { $ref: ../../../fixtures/api/reference_designated.json }
      '400':
        description: >-
          Un corps illisible, `MALFORMED_REQUEST` ; ou une désignation sans sa confirmation,
          `confirmed` absent ou faux : `CONFIRMATION_REQUIRED`, sans paramètre, comme la sortie
          (`exitProject`, `project_exit_unconfirmed`) et la restauration (US-0702/L3). Rien n'est
          écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Une condition que la commande `designate_reference` de la révision dit manquante, la
          première dans l'ordre où elle les liste, rien n'étant écrit : une révision en cours,
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `revision_marked` ; une
          révision dont la structure principale ne porte aucune tâche ou aucune ligne de devis,
          de même à `revision_has_tasks_and_lines` — « La désignation comme référence d'une
          révision qui ne porte aucune tâche ou aucune ligne de devis est refusée, en nommant la
          condition manquante » (WF-CYC-0030), le projet restant sans référence
          (`reference_without_tasks`) ; une désignation qui ne se corrige plus, le projet ayant
          reçu un coût réel ou une révision ayant été marquée depuis la dernière désignation,
          de même à `reference_correctable` (WF-REV-0040 ; J-01, #1795 ;
          `reference_not_correctable`) ;
          ou un traitement de fond qui court sur la révision, `no_background_task_running`
          (EP-15/US-0490).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              without_tasks: { $ref: ../../../fixtures/api/reference_without_tasks.json }
              not_correctable: { $ref: ../../../fixtures/api/reference_not_correctable.json }
      '412':
        description: >-
          `STALE_LOCK_VERSION` : le projet a été écrit depuis sa lecture, et la référence ne change
          pas ; `params.expected_lock_version` est son compteur courant (WF-IHM-0110, US-0702/L2).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/reference_designate_stale.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/rate-update:
  get:
    operationId: getRateUpdateProposal
    tags: [revisions]
    summary: Écart de taux proposé, catégorie par catégorie
    description: >-
      Présenté à la création d'une révision dont l'année de référence diffère de celle de la
      révision précédente, que le référentiel ait changé ou non (WF-REV-0060). Une
      catégorie sans taux pour l'année retenue conserve son taux précédent, projeté par
      le taux d'inflation (WF-REV-0060).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    responses:
      '200':
        description: Proposition de mise à jour.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/RateUpdateProposal }
            examples:
              none: { $ref: ../../../fixtures/api/rate_update_none.json }
              reference_created: { $ref: ../../../fixtures/api/rate_update.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: applyRateUpdate
    tags: [revisions]
    summary: Appliquer la mise à jour des taux
    description: >-
      Reporte les taux de l'année sur les lignes de la révision en cours, pour les catégories
      retenues (WF-REV-0060). Une mise à jour refusée à la création de la révision s'accepte
      ensuite depuis la révision en cours, tant qu'elle n'est pas marquée, et la rechiffre au
      taux de son année de référence pour chaque catégorie acceptée (C-362) ; une révision
      marquée garde les taux et les montants qu'elle a calculés (WF-REF-0130, WF-DAT-0020).
      Refusée en 403 à qui n'a pas la permission `revisions.write`, celle de la gestion des
      révisions (voir `RevisionCommand`, commande `apply_rate_update`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/RateUpdateApply }
    responses:
      '200':
        description: >-
          Taux mis à jour sur les catégories retenues ; la révision, une version de plus.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/Revision }
            examples:
              applied: { $ref: ../../../fixtures/api/rate_update_applied.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La commande `apply_rate_update` de la révision ne le dit pas disponible :
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` la première condition qui manque,
          dans l'ordre où la commande les liste, rien n'étant écrit — `revision_draft` pour une
          révision marquée, qui ne se met plus à jour (WF-REV-0060, WF-DAT-0020) ;
          `rate_update_available` quand la proposition ne présente aucune catégorie
          (`getRateUpdateProposal`) ; `no_background_task_running` pendant un traitement de fond
          qui court sur la révision (EP-15/US-0490 ; #1351).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_marked: { $ref: ../../../fixtures/api/rate_update_revision_marked.json }
              not_available: { $ref: ../../../fixtures/api/rate_update_not_available.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Une catégorie que la proposition ne présente pas (`getRateUpdateProposal`) :
          `VALIDATION_FAILED`, `fields` sur `/cost_category_ids/<n>`, son rang dans la liste
          envoyée, par `UNKNOWN_COST_CATEGORY` (`category_not_proposed`) ; ou une liste vide, sur
          `/cost_category_ids`. Rien
          n'est écrit (`RateUpdateApply`, WF-REV-0060 ; #1755).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              category_not_proposed:
                $ref: ../../../fixtures/api/rate_update_category_not_proposed.json
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/comparison:
  get:
    operationId: compareRevisions
    tags: [revisions]
    summary: Comparer deux révisions marquées
    description: >-
      L'arbre de la révision comparée, avec les marques d'un différentiel, et les écarts de
      montants par nature et par sous-projet, rapprochés par l'identifiant de lignée
      (WF-REV-0080, WF-DAT-0030, C-361). La comparaison se lit comme `listNodes` (#1193) : les
      mêmes paramètres, partagés — `kinds`, la recherche, les filtres de chaque colonne, bornes,
      périodes, marques et listes, le tri des lignes et `fields` (WF-IHM-0130) —, la même réponse —
      `items`, `totals` et `meta` —, et la même mécanique : la
      structure principale de la révision comparée (`to_revision_id`) est rendue entière, dans
      l'ordre du plan, sans pagination, comme `listNodes` rend une structure, et une lecture
      filtrée — un sous-arbre (`subtree_of`), les seules tâches (`kinds`), une recherche — en
      est une fenêtre, retenue comme `listNodes` la retient ; `fields` choisit ce qu'elle rend
      de chaque nœud. Chaque nœud porte son écart à la révision de base
      (`from_revision_id`) — `difference` et `changes`, toujours rendus —, et ceux que la
      révision de base portait et que la comparée n'a plus sont rendus à la place qu'ils
      avaient, en lecture seule (`NodeDifference`) : une tâche ajoutée, retirée ou modifiée —
      par ses dates, sa durée, son état ou son parent —, une ligne par ses montants ou son
      parent, et une récapitulative dont le contenu change, marquée modifiée. Les filtres, la
      recherche et le tri s'y appliquent comme à la lecture d'un différentiel : un nœud retiré
      s'y juge sur ses valeurs de la révision de base, comme tout autre nœud sur les siennes, et
      sans tri il reste à la place qu'il avait (#1205). `difference` retient les seuls écarts
      nommés, leurs ancêtres compris, comme sur un différentiel (`NodeDifferenceFilter`,
      `differences`, #1398). Un filtre de colonne porte sur la grandeur
      que la comparaison affiche de la colonne, celle de la révision comparée (`to_revision_id`) —
      la durée, la marge, une date, un montant du nœud tel que cette révision le porte, jamais
      l'écart à la révision de base, que `difference` dit —, et sur celle de la base pour un nœud
      retiré ; il se juge, se combine et se refuse comme celui de `listNodes`, qui en dit la
      règle : une borne mal formée, une date mal formée, une borne haute inférieure à la basse ou
      une fin antérieure au début sont refusées par 422.
      `subtree_of` nomme une tâche de l'arbre rendu, une tâche retirée comprise : la fenêtre est
      alors le sous-arbre qu'elle avait dans la révision de base, ses nœuds retirés à leur place,
      des totaux nuls — la révision comparée n'en a plus aucune ligne — et les écarts de ses lignes
      retirées. `totals` est celui de `listNodes` sur la révision comparée : les lignes retenues,
      sans les nœuds retirés, qui n'en sont plus, `difference` ne le restreignant pas
      (`NodeTotals`) ; `meta` dit la structure de la
      révision comparée (`NodeListMeta`). `amount_deltas` vient dans chaque réponse, comme `totals`,
      et se calcule sur les lignes retenues, retirées comprises, quel que soit `kinds`, celles que
      `difference` retient seules sous ce filtre : une
      lecture sans filtre rend les écarts de toute la structure, celle d'un sous-arbre les siens
      (`comparison`) ; une ligne déplacée compte dans la fenêtre de son parent dans la révision
      comparée, pour son écart entier (`amount_deltas`). La grille de la comparaison est celle des
      structures, avec les mêmes marques que la lecture d'un différentiel. Une paire identique — la
      même révision deux fois — rend chaque nœud inchangé et aucun écart de montant, jamais un
      refus.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: from_revision_id
        in: query
        required: true
        schema: { $ref: ../components/common.yaml#/Uuid }
      - name: to_revision_id
        in: query
        required: true
        schema: { $ref: ../components/common.yaml#/Uuid }
      - $ref: ../components/parameters.yaml#/NodeKinds
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/NodeSubtreeOf
      - $ref: ../components/parameters.yaml#/SubprojectFilter
      - $ref: ../components/parameters.yaml#/NodeCostTypeFilter
      - $ref: ../components/parameters.yaml#/NodeOrderItemFilter
      - $ref: ../components/parameters.yaml#/NodeWorkPackageFilter
      - $ref: ../components/parameters.yaml#/NodeCostCategoryFilter
      - $ref: ../components/parameters.yaml#/NodeResourceRoleFilter
      - $ref: ../components/parameters.yaml#/NodeProgressFilter
      - $ref: ../components/parameters.yaml#/NodeCriticalFilter
      - $ref: ../components/parameters.yaml#/NodeSummariesOnly
      - $ref: ../components/parameters.yaml#/NodeMaxLevel
      - $ref: ../components/parameters.yaml#/NodeTimelineFilter
      - $ref: ../components/parameters.yaml#/NodeDifferenceFilter
      - $ref: ../components/parameters.yaml#/NodeDescriptionFilter
      - $ref: ../components/parameters.yaml#/NodeSchedulingModeFilter
      - $ref: ../components/parameters.yaml#/NodeDurationMin
      - $ref: ../components/parameters.yaml#/NodeDurationMax
      - $ref: ../components/parameters.yaml#/NodeStartFrom
      - $ref: ../components/parameters.yaml#/NodeStartTo
      - $ref: ../components/parameters.yaml#/NodeFinishFrom
      - $ref: ../components/parameters.yaml#/NodeFinishTo
      - $ref: ../components/parameters.yaml#/NodePhysicalProgressMin
      - $ref: ../components/parameters.yaml#/NodePhysicalProgressMax
      - $ref: ../components/parameters.yaml#/NodeTotalFloatMin
      - $ref: ../components/parameters.yaml#/NodeTotalFloatMax
      - $ref: ../components/parameters.yaml#/NodeStartedOnFrom
      - $ref: ../components/parameters.yaml#/NodeStartedOnTo
      - $ref: ../components/parameters.yaml#/NodeCompletedOnFrom
      - $ref: ../components/parameters.yaml#/NodeCompletedOnTo
      - $ref: ../components/parameters.yaml#/NodeMilestoneFilter
      - $ref: ../components/parameters.yaml#/NodeFinishOverdueFilter
      - $ref: ../components/parameters.yaml#/NodeQuantityMin
      - $ref: ../components/parameters.yaml#/NodeQuantityMax
      - $ref: ../components/parameters.yaml#/NodeHoursMin
