          Un filtre de colonne refusé, selon la convention du README, `fields` sur le paramètre :
          une borne mal formée par `NUMBER_INVALID`, une date par `DATE_INVALID`, une borne
          haute inférieure à la basse par `VALUE_OUT_OF_RANGE` sur `/query/<colonne>_max`,
