/projects/{project_id}/revisions/{revision_id}/structures:
  get:
    operationId: listCostStructures
    tags: [revisions]
    summary: Structures de coûts de la révision
    description: >-
      Une structure principale, et le cas échéant des différentiels et une structure
      propre par risque (WF-REV-0100). Chacune dit ses commandes de saisie
      (`available_commands`) : la grille de planning, de devis ou de reste à engager qui la lit
      offre ou non la saisie selon la phase du projet, que le front ne déduit pas (WF-DEV-0050,
      WF-RAE-0040, WF-IHM-0090).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    responses:
      '200':
        description: Structures.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/revisions.yaml#/CostStructure }
            examples:
              witness: { $ref: ../../../fixtures/api/structures.json }
              amendments: { $ref: ../../../fixtures/api/structures_amendments.json }
              without_tasks: { $ref: ../../../fixtures/api/structures_without_tasks.json }
              estimator: { $ref: ../../../fixtures/api/structures_estimator.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createCostStructure
    tags: [revisions]
    summary: Ouvrir un différentiel
    description: >-
      Plusieurs différentiels peuvent coexister, et chacun est fusionné ou abandonné
      indépendamment (WF-REV-0100). Le différentiel naît copie de la structure principale de sa
      révision, sa date de début de planning comprise (`CostStructure.planning_start_on`) : à
      sa création, chacun de ses nœuds est celui de la principale, `unchanged`
      (`NodeDifference`, C-361), et la fusion n'y lit que ce qui a changé depuis (WF-REV-0050).
      Le devis propre d'un
      risque naît avec lui (`createRisk`, WF-RIS-0030) et disparaît avec lui ; la structure
      principale existe dès la révision : ni l'un ni l'autre ne se crée ici.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/StructureCreate }
    responses:
      '201':
        description: Structure créée.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/CostStructure }
            examples:
              amendment: { $ref: ../../../fixtures/api/amendment_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La commande `create_structure` de la révision est indisponible :
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` la première condition qui lui
          manque — `revision_draft` sur une révision marquée, qui ne se modifie plus
          (WF-DAT-0020), puis `no_background_task_running` pendant un marquage, une fusion, le
          traitement d'une survenance ou l'application d'un import (WF-REV-0100 ; E-14,
          US-0702/L2). Le libellé n'est pas unique : plusieurs différentiels coexistent, chacun
          désigné par son identifiant. Rien n'est créé.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_marked: { $ref: ../../../fixtures/api/structure_create_revision_marked.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}:
  patch:
    operationId: updateCostStructure
    tags: [revisions]
    summary: Modifier la date de début de planning et le libellé d'une structure
    description: >-
      Écrit la date de début de planning de la structure et son libellé (WF-PLA-0020,
      WF-REV-0100), sous sa commande de planification (`StructureCommand.edit_planning`) : gardée
      par `planning.write`, refusée comme elle sur une révision marquée ou pendant un traitement
      de fond. Seul ce qui est envoyé change, le compteur lu exigé (`StructureUpdate`). Une tâche
      en mode automatique sans prédécesseur commence à la date de début de planning, à la
      première heure travaillée de son calendrier applicable : la changer redate ces tâches et
      leurs successeurs automatiques — « avancer cette date d'une semaine l'avance d'autant, ainsi
      que ses successeurs automatiques » (WF-PLA-0020) —, les tâches en mode manuel ne bougeant
      pas. La réponse est celle d'une écriture de grille, sans nœud écrit (`NodesWritten`). La
      date se juge sur le calendrier par défaut, la structure n'ayant pas de calendrier propre :
      un jour sans aucune heure travaillée est refusé, et le refus nomme le jour travaillé
      suivant ; rien n'est écrit (WF-PLA-0010, WF-PLA-0020). Une écriture de l'historique
      annulable de l'appelant (`undoLastChange`, `UndoneKind.structure_update`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/StructureUpdate }
    responses:
      '200':
        description: >-
          Structure modifiée : les tâches qu'elle redate, leurs montants, inflation comprise,
          quand elles changent d'année, les récapitulatives recalculées, les totaux et le compteur
          de la structure (`NodesWritten`, WF-PLA-0020, WF-DEV-0040).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              advanced: { $ref: ../../../fixtures/api/volume/structure_planning_start_advanced.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Une date de début de planning sur un jour sans aucune heure travaillée au calendrier par
          défaut : `fields` sur `/planning_start_on` par `NON_WORKING_DAY`, `fields[].params.date`
          la date envoyée et `next_working_day` le jour travaillé suivant ; rien n'est écrit
          (WF-PLA-0020, WF-PLA-0010). Ou, sans `fields`, une date qui porterait la durée du projet
          au-delà de quinze ans : `PROJECT_HORIZON_EXCEEDED`, `params.task` nommant la tâche par
          son nœud et son libellé (WF-PLA-0150). Ou un libellé vide (`VALIDATION_FAILED`).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              non_working_day: { $ref: ../../../fixtures/api/structure_start_non_working_day.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/merge:
  get:
    operationId: getStructureMergeReport
    tags: [revisions]
    summary: Compte rendu préalable de la fusion d'un différentiel
    description: >-
      « Avant application, la fusion présente un compte rendu : tâches et lignes ajoutées,
      modifiées et retirées, tâches démarrées qui seront terminées, et motifs de refus
      (WF-PLA-0030, WF-PLA-0150, WF-PLA-0170) ; elle n'est appliquée qu'après confirmation »
      (WF-REV-0050). Une lecture, qui n'écrit rien : abandonner à cette étape, c'est ne pas
      confirmer, et la révision reste inchangée. Le compte rendu se lit comme celui d'un import
      (`StructureMergeReport`) ; tant que `refusals` n'est pas vide, la fusion ne s'applique pas,
      et l'écran n'en offre pas la confirmation. Il décrit la révision en cours à l'instant de la
      lecture, et la fusion confirmée (`mergeCostStructure`) juge de nouveau : une saisie faite
      entre-temps dans la structure principale ou dans le différentiel fait refuser la
      confirmation par 412, les compteurs que le compte rendu a lus ayant avancé ; ce qui change
      hors des deux arbres — un calendrier du référentiel, le lotissement — et la rendrait refusée
      fait échouer la tâche de fond sur le motif du refus. Seul un
      différentiel non fusionné de la révision en cours a un compte rendu — ou, tant que le
      projet n'a pas de révision en cours, un différentiel non fusionné de la dernière révision
      marquée, dont la fusion crée d'abord la révision en cours par copie (WF-REV-0050,
      WF-REV-0010 ; `StructureMergeReport.creates_current_revision`, #790) ; ses écarts sont
      alors ceux du différentiel avec la structure principale de cette révision marquée, que la
      copie reprend telle quelle. Une autre structure est refusée par 409, comme sa fusion
      (EP-14/L42s).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    responses:
      '200':
        description: Ce que la fusion ferait, et ce qui la refuse.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/StructureMergeReport }
            examples:
              applicable: { $ref: ../../../fixtures/api/structure_merge_report.json }
              started_task: { $ref: ../../../fixtures/api/structure_merge_report_started_task.json }
              refused: { $ref: ../../../fixtures/api/structure_merge_report_refused.json }
              provision_moved: { $ref: ../../../fixtures/api/structure_merge_report_provision_moved.json }
              link_cycle: { $ref: ../../../fixtures/api/structure_merge_report_link_cycle.json }
              link_forbidden: { $ref: ../../../fixtures/api/structure_merge_report_link_forbidden.json }
              horizon_exceeded: { $ref: ../../../fixtures/api/structure_merge_report_horizon_exceeded.json }
              without_current_revision: { $ref: ../../../fixtures/api/structure_merge_report_without_current_revision.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Cette structure n'a pas de compte rendu de fusion : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` la première condition qui manque, comme au 409 de sa fusion
          (`mergeCostStructure`).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_marked: { $ref: ../../../fixtures/api/merge_revision_marked_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: mergeCostStructure
    tags: [revisions]
    summary: Fusionner un différentiel dans la structure principale
    description: >-
      La fusion donne aux lignes que le différentiel désigne les grandeurs de référence qu'il porte,
      d'où leur montant budgété est tiré ; une ligne désignée d'une tâche non démarrée, que personne
      n'a réestimée depuis la référence, prend aussi ces grandeurs pour grandeurs courantes ; les
      grandeurs courantes et le montant réestimé de toutes les autres lignes sont conservés
      (WF-REV-0050, WF-DEV-0020). La révision marquée reçoit le nom de version et la description de
      la confirmation, comme à tout marquage (WF-REV-0020). Une tâche déjà démarrée n'est jamais
      retirée : son reste à engager est porté à zéro. La révision marquée qui en résulte devient la
      référence (WF-REV-0050). Une tâche que la fusion ajoute ne porte aucun rattachement au
      lotissement, le différentiel n'en portant pas, et une tâche existante que le différentiel
      modifie conserve le sien (WF-PLA-0170). Confiée au worker et inscrite au journal d'audit
      (WF-ARC-0090, WF-SEC-0030). Une fusion qui donnerait à une tâche de la structure principale
      une ligne de main-d'œuvre dont le rôle la laisserait sans aucune heure travaillée dans la
      semaine échoue sans rien fusionner : la tâche de fond finit en échec, `problem.code` à
      `TASK_WITHOUT_WORKING_HOURS`, ses `params` nommant les rôles et les tâches en cause
      (WF-PLA-0010). « Une fusion qui déplacerait la tâche d'un poste hors du sous-arbre de la tâche
      de son lot est refusée en nommant la tâche » (WF-PLA-0170) : elle échoue de même sans rien
      fusionner, `problem.code` à `ORDER_ITEM_OUTSIDE_WORK_PACKAGE`, `params.work_package_task`
      nommant la tâche du lot et `order_item_tasks` celles des postes qui en sortiraient, chacune
      par son nœud et son libellé (`Problem.params`), comme `TASK_WITHOUT_WORKING_HOURS`
      (WF-IHM-0080 ; `task_merge_outside_work_package`). Une fusion qui fermerait une boucle de
      liaisons dans la structure principale échoue de même, `problem.code` à `LINK_CYCLE`,
      `params.cycle` nommant les tâches de la boucle (WF-PLA-0030 ; `task_merge_link_cycle`) ; une
      fusion qui lierait une récapitulative à sa subordonnée, `problem.code` à `LINK_FORBIDDEN`,
      `params.link` nommant les deux tâches, la récapitulative d'abord (WF-PLA-0030 ;
      `task_merge_link_forbidden`, #1582) ; une fusion qui porterait la durée du projet au-delà de
      quinze ans, `problem.code` à `PROJECT_HORIZON_EXCEEDED`, `params.task` nommant la tâche en
      cause (WF-PLA-0150 ; `task_merge_horizon_exceeded`) — chacune par son nœud de la structure
      principale et son libellé, le nœud nul pour une tâche que le différentiel ajoute
      (`Problem.params` ; #788). Le compte rendu préalable (`getStructureMergeReport`, WF-REV-0050)
      dit ces motifs avant la confirmation, qui porte les compteurs des deux structures qu'il a
      lus : refusée par 412 si l'une a changé depuis, elle n'applique jamais un compte rendu que
      personne n'a vu (EP-14/L42s). « Lorsque le projet ne comporte pas de révision en cours, elle
      en crée une au préalable » (WF-REV-0050) : la fusion se demande alors sur le différentiel de
      la dernière révision marquée, qui porte alors la commande `merge_structure`, et la même tâche
      de fond crée la révision en cours par copie de celle-ci (WF-REV-0010), chiffrée aux taux
      conservés, projetés (WF-REV-0060), y fusionne la copie du différentiel et la marque ; la
      révision marquée n'est pas modifiée. La tâche est une seule opération : en échec, elle ne
      laisse ni révision en cours ni fusion, et le projet reste sans révision en cours (#790). Pour
      chiffrer la révision aux taux de la nouvelle année, on la crée d'abord (`createRevision`), et
      la fusion se demande sur elle. Sur une révision marquée plus ancienne, ou sur la dernière une
      fois qu'une révision est en cours, la fusion est refusée par 409, comme le compte rendu.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/StructureMerge }
    responses:
      '202':
        description: Fusion mise en file.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              queued: { $ref: ../../../fixtures/api/task_merge_queued.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          L'état interdit la fusion de cette structure : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` la première condition qui manque, dans l'ordre où la commande
          `merge_structure` de la révision les nomme — `unmerged_amendment_exists` pour une
          structure qui n'est pas un différentiel non fusionné, `revision_draft` pour un
          différentiel d'une révision marquée qui
          n'est pas la dernière, ou d'un projet qui a une révision en cours : ainsi quand, depuis
          la lecture du compte rendu, une saisie ou un import a ouvert la révision en cours, ou
          qu'une autre fusion a marqué une révision plus récente (WF-REV-0050 ; #790). Sur la
          dernière révision marquée d'un projet sans révision en cours, la fusion créerait la
          révision en cours : à qui n'a pas `revisions.write`, la commande nomme alors
          `may_create_revision`, après `unmerged_amendment_exists`, et la fusion est refusée de
          même, `params.missing_condition` à `may_create_revision` — un 409 et non un 403, comme
          pour les imports et `declare_risk`, la permission n'étant refusée que là où elle
          créerait la révision (WF-REV-0050, WF-REV-0010). Ou un nom de version déjà employé par
          une révision marquée du projet, comme pour `markRevision` : `ALREADY_EXISTS`, `fields`
          désignant `/version_name` par `ALREADY_EXISTS`, `fields[].params.conflicting_object_id`
          la révision qui le porte (WF-REV-0020) ; jugé au dépôt, rien n'est mis en file, et
          aucune révision en cours n'est créée pour échouer au marquage (E-05, US-0702/L2). Le
          contrôle de l'état et le dépôt de la tâche se font sous le verrou du projet, qui tient
          sa révision en cours.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_marked: { $ref: ../../../fixtures/api/merge_revision_marked_refused.json }
              may_create_revision: { $ref: ../../../fixtures/api/merge_may_create_revision_refused.json }
              version_name_taken: { $ref: ../../../fixtures/api/merge_version_name_taken.json }
      '412':
        description: >-
          La structure principale ou le différentiel ont changé depuis le compte rendu confirmé —
          une tâche démarrée, une ligne réestimée, le différentiel modifié — : le compte rendu est
          périmé, et rien n'est fusionné (WF-REV-0050, WF-IHM-0110 ; EP-14/L42s). Le contrôle des
          deux compteurs et le dépôt de la tâche de fusion se font en une seule transaction, sous le
          verrou des deux structures : aucune écriture ne se glisse entre eux. `STALE_LOCK_VERSION`,
          `params.expected_lock_version` le compteur courant du différentiel, l'objet que le chemin
          nomme, même quand seule la structure principale a changé, et rien d'autre, comme tout 412
          (#296) ; le client relit le compte rendu, qui rend l'un et l'autre.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              report_stale: { $ref: ../../../fixtures/api/merge_report_stale.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes:
  get:
    operationId: listNodes
    tags: [revisions]
    summary: Arbre commun de la structure
    description: >-
      Les mêmes tâches, vues du côté du temps ou du côté de l'argent : une tâche porte
      ses lignes de devis (§3.5.1, WF-DEV-0020). `row_number` et `level` sont calculés
      à la lecture ; les valeurs calculées ne sont pas saisissables (WF-IHM-0030). C'est
      la source des quatre vues de l'arbre : grille de planning (WF-PLA-0080), diagramme
      de Gantt en lecture seule (WF-PLA-0090), arborescence de tâches (WF-PLA-0110) et
      grille de devis (WF-DEV-0050) — et des chronologies, qui n'en lisent que les tâches
      inscrites (WF-PLA-0140).

      La structure est rendue entière, sans pagination : une révision porte au plus dix
      mille objets (§4.6.2), et un arbre ne se lit pas par pages. Le tri, les filtres et
      les totaux sont l'affaire du serveur, et le front n'ordonne ni ne somme rien. Une
      grille arborescente ne se trie pas : les tâches gardent l'ordre de l'arbre, et le tri
      n'y est qu'un tri des lignes de devis sous chaque tâche, chaque ligne restant sous la
      sienne (WF-IHM-0060, `sort_by`) : trié par montant décroissant, le devis rend sous
      chaque tâche ses lignes du plus grand montant au plus petit, et ses tâches à leur place
      (`estimate_sorted`) ; une ligne sans heures vient après les autres dans l'ordre
      croissant des heures, avant dans le décroissant (`estimate_hours`). Les grilles de devis
      et de reste à engager trient ainsi, dans les deux sens, par chacune des colonnes qu'elles
      présentent pour les lignes ; la grille de planning, qui ne rend pas les lignes, ne
      propose aucun tri, ni le diagramme de Gantt, l'arborescence de tâches ou une
      chronologie. Un filtre sur une
      tâche — avancement, criticité, sous-arbre, récapitulative, niveau, chronologie —
      retient les tâches qui le satisfont avec les lignes qu'elles portent ; un filtre sur
      une ligne — nature, catégorie, rôle, sous-projet — retient les lignes qui le
      satisfont ; la recherche porte sur les libellés des deux, et une tâche retenue par
      elle garde ses lignes. Les filtres se combinent, et les ancêtres des nœuds retenus
      sont rendus pour que l'arbre reste lisible — sauf avec `timeline_id` : une chronologie
      n'est pas un arbre, et ne présente que les tâches qui y sont inscrites (WF-PLA-0140).
      Les totaux sont ceux des lignes retenues, sauf sous `difference`, qui ne les restreint
      pas. Chaque colonne des trois grilles se filtre
      (WF-IHM-0060, WF-IHM-0130), selon la convention du README du contrat : une colonne de
      nombres par ses deux bornes incluses, `<colonne>_min` et `<colonne>_max`, une colonne de
      dates par sa période, `<colonne>_from` et `<colonne>_to`, fin incluse, une marque par un
      booléen, le mode par une liste, la description par le texte qu'elle contient. Ceux de la
      tâche — description, mode, durée et marge en jours, début, fin, avancement physique, dates
      de démarrage et de terminaison, jalon, fin dépassée — retiennent des tâches, avec leurs
      lignes ; ceux de la ligne — grandeurs, délai de paiement, année de consommation, montants
      courants et précédents, objet désactivé — retiennent des lignes, la borne d'un montant
      portant sur celui de la ligne, jamais sur celui d'une tâche (`nodes_estimate_filtered`).
      Une borne mal formée est refusée par 422 `NUMBER_INVALID`, une date par `DATE_INVALID`,
      une borne haute inférieure à la basse ou une fin antérieure au début par
      `VALUE_OUT_OF_RANGE`, `fields` sur le paramètre (README). Les prédécesseurs, une liste de
      liaisons, ne se filtrent pas ; le libellé se cherche (`search`). Le filtre par lot ou par
      poste (`work_package_id`, `order_item_id`) retient le sous-arbre de la tâche rattachée au
      lot ou au poste : le lotissement sert de grille de lecture par ce seul rattachement, que
      seule la structure principale porte (WF-PLA-0170). `kinds` n'est pas un filtre : il choisit ce
      que la grille rend — le planning ne rend pas les lignes —, et les totaux ne changent
      pas avec lui.

      L'arborescence de tâches lit `kinds=task`, `summaries_only` et `max_level` : les seules
      récapitulatives, jusqu'au niveau demandé, sous le nœud du projet que le front dessine
      (WF-PLA-0110), et offre les niveaux que `meta.summary_depth` dit exister, celui de la
      plus profonde récapitulative de la structure, quels que soient les filtres ; une
      chronologie lit `kinds=task` et `timeline_id` (WF-PLA-0140). Le front ne trie ni ne
      sélectionne rien de ce qu'il reçoit.

      `row_number` numérote toute la structure, ses tâches et ses lignes dans l'ordre du
      plan : un nœud garde son numéro quels que soient `kinds`, les filtres, la recherche
      et le tri, et un prédécesseur est nommé par le sien même quand la lecture ne le
      rend pas (`predecessor_row_number`, WF-PLA-0080).

      `fields` choisit ce que la lecture rend de chaque nœud : une grille n'en demande que
      ce qu'elle affiche, sans quoi six mille nœuds entiers pèsent plusieurs mégaoctets
      (§4.6.2). Chaque nom est une propriété de `Node` — une facette nommée ainsi est
      rendue entière — ou une propriété d'une facette, `task.<propriété>` ou
      `estimate_line.<propriété>`, qui rend la facette avec ses seules propriétés nommées ;
      `node_id`, `row_number`, `level` et `lock_version` sont toujours rendus. Une facette
      dont rien n'est nommé est omise. Sans `fields`, chaque nœud est rendu entier. Les
      propriétés que `Node` et ses facettes exigent le sont d'une lecture sans `fields` :
      une lecture qui en nomme ne rend que ce qu'elle nomme.

      La lecture d'un différentiel est un diff avec la structure principale de sa révision, que
      le serveur calcule et que le front ne recalcule pas (WF-REV-0100, C-361) : chaque nœud
      porte son écart, `difference` — ajouté, retiré, modifié ou inchangé — et ce qui change de
      lui, `changes`, rapprochés par la lignée, et les nœuds que le différentiel retire sont
      rendus à la place qu'ils avaient, entre les nœuds qui les entouraient, en lecture seule
      (`NodeDifference`) ; un nœud déplacé est rendu une fois, à sa place nouvelle, modifié par
      son parent. `difference` et `changes` y sont toujours rendus, comme les quatre ; les
      totaux ne comptent pas les nœuds retirés, qui ne sont plus de la structure (`nodes_amendment`).
      Un filtre, la recherche et un tri jugent un nœud retiré sur ses valeurs de base — celles
      de la structure principale, qu'il porte encore —, comme tout autre nœud sur les siennes :
      un filtre sur une tâche le retient si ses valeurs de base le satisfont, un tri range une
      ligne retirée parmi les lignes de sa tâche par sa valeur de base dans la colonne triée, et
      sans tri il reste à la place qu'il avait (#1205). `difference` n'en retient que les
      écarts nommés, ajoutés, retirés ou modifiés — « Écarts seulement » les nomme tous trois —,
      leurs ancêtres compris, eux-mêmes modifiés par leur contenu : l'arbre filtré reste un
      arbre, et les totaux restent ceux de la lecture sans lui (`NodeDifferenceFilter`,
      `amendment_differences`, #1398).
      Sur la structure principale et sur le devis propre d'un risque, `difference` est nul ou
      omis, et le filtre `difference` y est sans effet : la lecture est celle sans lui.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeKinds
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/NodeSubtreeOf
      - $ref: ../components/parameters.yaml#/SubprojectFilter
