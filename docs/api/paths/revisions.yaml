  post:
    operationId: createNode
    tags: [revisions]
    summary: Create a task or an estimate line
    description: >-
      Refused on a marked revision (WF-DAT-0020) — every revision of a terminal project is one
      (WF-CYC-0100) — with 409, like any write of the revision. The same write from the
      three grids: the phase of the project refuses nothing here, it is the
      command of the structure that says which grid enters it
      (`CostStructure.available_commands`, C-358). On the main structure, a line is not
      created under a completed task, which is first reopened from the Kanban
      (`task_not_completed`, WF-DEV-0050, WF-RAE-0040); in a differential, it is created
      there as elsewhere, the amendment rebudgeting the task (WF-REV-0050; F-01, #1766).
      A task created without a mode or a duration — from the estimate or remaining to commit
      grid, which do not present them — is a leaf in automatic mode, with a duration of one
      day, without a predecessor (WF-DEV-0050, WF-RAE-0040). A task created under a leaf in
      manual mode makes it a summary task, always in automatic mode (WF-PLA-0040); under a
      milestone, which carries no subtasks, it is refused with 422
      `MILESTONE_HAS_NO_SUBTASK`, an estimate line remaining allowed (WF-PLA-0050; #1771). A
      line created without a label receives the one the server composes from that of its task
      and that of its role, and a labour line, the category of its role (`EstimateLineWrite`,
      `line_created_labelled`, WF-DEV-0020). A line added after the reference carries a
      zero budgeted amount (WF-RAE-0050). A labour line whose role would leave its
      task without any worked hour in the week
      — its calendar never overlaps that of another role of the task, or, on a task
      of which this role is the only one, it has no hour in the week (EP-14/L42s) — is refused
      with 422 `TASK_WITHOUT_WORKING_HOURS`, `params` naming the roles and the task
      (WF-PLA-0010); a task created attached to a work package or an item follows the rules of
      the attachment (`TaskFacetWrite`, WF-PLA-0170). A line whose category belongs to a cost
      type of the provision kind is created only by the declaration of a risk: its creation by
      hand is refused with 422 `VALIDATION_FAILED`, `fields` on
      `/estimate_line/cost_category_id`, reason `PROVISION_CATEGORY_RESERVED` (WF-DEV-0020,
      WF-RIS-0010). A created task whose duration or dates would take the duration of the
      project beyond fifteen years is refused with 422 `PROJECT_HORIZON_EXCEEDED`,
      `params.task` naming it by the label sent, its node null (WF-PLA-0150). A task created
      in manual mode whose start or finish falls on a day without any worked hour in its
      calendar — without a labour line, the default calendar (WF-PLA-0010) — is refused as on
      modification (`updateTaskFacet`): 422 `VALIDATION_FAILED`, `fields` on
      `/task/start/date` or `/task/finish/date` with `NON_WORKING_DAY`, the next working day
      named; nothing is created (WF-PLA-0020; #1345).
      Its start and finish are entered by their date alone, as on modification: the server
      completes their hours on the calendar of the task, and the response returns them
      completed (`WorkInstantWrite`, `created_manual`; #1769).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/NodeCreate }
    responses:
      '201':
        description: >-
          Node created, with its ancestors recomputed and the totals of the structure
          (`NodesWritten`).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              created: { $ref: ../../../fixtures/api/node_created.json }
              created_child: { $ref: ../../../fixtures/api/node_created_child.json }
              line_created: { $ref: ../../../fixtures/api/estimate_line_created.json }
              line_created_after_subtask:
                $ref: ../../../fixtures/api/estimate_line_created_after_subtask.json
              line_created_labelled:
                $ref: ../../../fixtures/api/estimate_line_created_labelled.json
              created_manual: { $ref: ../../../fixtures/api/node_created_manual.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The state forbids the creation, nothing being created: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` naming the first missing condition, in this order —
          `project_not_terminal` on a terminal project (WF-CYC-0100); then the state conditions
          of the revision, `revision_draft` on a marked revision, as the revision states in
          advance for its entries (`Revision.available_commands`, `marked_refused`,
          WF-DAT-0020), and `no_background_task_running` while a background task runs on the
          revision, as the command of the structure says; then, on the main structure only, a
          line created under a completed task, which is first reopened from the Kanban,
          `task_not_completed` (`completed_refused`; WF-DEV-0050, WF-RAE-0040, WF-RAE-0030;
          #1184, #1766). In a differential, a line is created under a completed task as under
          any other, the amendment rebudgeting it (WF-REV-0050, #1765). The phase of the
          project refuses nothing (C-358).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              completed_refused:
                $ref: ../../../fixtures/api/estimate_line_completed_refused.json
              marked_refused: { $ref: ../../../fixtures/api/node_create_marked_refused.json }
      '422':
        description: >-
          Entity refused by a business rule, `fields` locating each refusal: a line of the
          risk provision kind created by hand (`PROVISION_CATEGORY_RESERVED`, WF-DEV-0020), an
          attachment to the work breakdown refused (`TaskFacetWrite`, WF-PLA-0170), a negative
          payment delay (`/estimate_line/payment_delay_days`, `VALUE_OUT_OF_RANGE`,
          `params.minimum` set to `0`), a node to be placed after that is not a sibling under
          the target parent (`/after_node_id`, `NODE_NOT_SIBLING`, `NodeCreate`; #1183), a task
          created under a milestone, which carries no subtasks (`/parent_id`,
          `MILESTONE_HAS_NO_SUBTASK`, `fields[].params` naming the milestone, `node_id` and
          `label`; WF-PLA-0050, #1771), a field that the
          line does not accept (`FIELD_NOT_ACCEPTED`, `EstimateLineWrite`; EP-14/L42s), a
          category that is not
          that of the role of a labour line (`/estimate_line/cost_category_id`,
          `COMPUTED_VALUE`, `line_category_mismatch`, WF-DEV-0020), a category missing from a
          line without a role (`VALUE_REQUIRED`), a labour category without a role
          (`/estimate_line/resource_role_id`, `RESOURCE_ROLE_REQUIRED`, WF-DEV-0020); or, without
          `fields`, a line whose category has no hourly rate for the reference year
          (`HOURLY_RATE_MISSING`, `params.missing_rates`, WF-DEV-0010); or a line that would
          leave its task without a worked hour (`TASK_WITHOUT_WORKING_HOURS`, WF-PLA-0010); or,
          without `fields`, a task that would take the duration of the project beyond fifteen
          years (`PROJECT_HORIZON_EXCEEDED`, `params.task`, WF-PLA-0150). Or a date of a task in
          manual mode sent on a day without any worked hour in the calendar of the task:
          `fields` on `/task/start/date` or `/task/finish/date` with `NON_WORKING_DAY`,
          `fields[].params.date` the date sent and `next_working_day` the next working day,
          like `updateTaskFacet` (WF-PLA-0020, WF-PLA-0010; #1345); or, with a working day,
          hours sent outside the day, `/task/start/hours` or `/task/finish/hours` with
          `VALUE_OUT_OF_RANGE`, `fields[].params.minimum` set to `0` or `maximum` to the hours
          of the day, as on modification (`WorkInstantWrite`; #1769).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              provision_refused: { $ref: ../../../fixtures/api/estimate_line_provision_refused.json }
              out_of_range: { $ref: ../../../fixtures/api/node_create_out_of_range.json }
              horizon_exceeded: { $ref: ../../../fixtures/api/node_create_horizon_exceeded.json }
              after_not_sibling: { $ref: ../../../fixtures/api/node_create_after_not_sibling.json }
              non_working_day: { $ref: ../../../fixtures/api/node_create_non_working_day.json }
              line_category_mismatch:
                $ref: ../../../fixtures/api/estimate_line_category_mismatch.json
              without_hours: { $ref: ../../../fixtures/api/node_create_without_hours.json }
              field_not_accepted: { $ref: ../../../fixtures/api/node_create_field_not_accepted.json }
              under_milestone: { $ref: ../../../fixtures/api/node_create_under_milestone.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/rows/{row_number}:
  get:
    operationId: resolveRowNumber
    tags: [revisions]
    summary: The node that carries a row number
    description: >-
      The node that a row number designates in the numbering of the whole structure — that
      of `Node.row_number`, its tasks and its lines in plan order —, whatever the search, the
      filters and the sorting of the grid that requests it: a read that writes nothing.
      The predecessors column of the planning grid names a predecessor by its number
      (WF-PLA-0080); a number that the lines read do not carry — a task that the search or a
      filter excludes — is resolved here into a node, whose identifier is sent with the write
      (`PredecessorWrite.predecessor_node_id`, `setPredecessors`), which remains the sole
      judge of the link. The read returns the kind of the node, so that the front end refuses
      as unknown the number of an estimate line, which is not a task.

      No node of the structure carries this number — it is beyond its last line —: 404
      `NOT_FOUND`, without a parameter, like a nonexistent object. On the read of a
      differential, the numbering is the one that `listNodes` returns, where the nodes that the
      differential removes each count for their line: the number of a removed node, which is
      no longer part of the structure, also answers 404. The rights and the other refusals are
      those of `listNodes`: a project, a revision or a structure that is nonexistent or
      invisible for lack of the right to view the project likewise answers 404, without
      distinguishing anything (WF-ADM-0110). A number that is not an integer of at least 1 is
      refused with 422 `VALIDATION_FAILED`, at the pointer `/path/row_number`.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/RowNumber
    responses:
      '200':
        description: The node that carries the number.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/RowNumberResolution }
            examples:
              task: { $ref: ../../../fixtures/api/row_number_task.json }
              estimate_line: { $ref: ../../../fixtures/api/row_number_estimate_line.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404':
        description: >-
          No node of the structure carries this number, or the structure is nonexistent or
          invisible: `NOT_FOUND`, without a parameter (WF-ADM-0110).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              unknown: { $ref: ../../../fixtures/api/row_number_unknown.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}:
  delete:
    operationId: deleteNode
    tags: [revisions]
    summary: Delete a node
    description: >-
      The deletion of a task takes its lines and its links with it (WF-PLA-0070, WF-DAT-0090);
      that of a summary task also takes its subordinates, their lines and their links, and the
      estimate decreases by as much (Vérif of WF-PLA-0070). "A started or completed task
      cannot be deleted" (WF-PLA-0070), nor can a summary task one of whose subordinates is:
      the refusal names the condition, `task_not_started`, and the screen refers to bringing its
      remaining to commit to zero (Vérif of WF-PLA-0070). The provision lines that the
      deleted task and its subordinates carry are not taken with it: they move to the parent
      task of the deleted task or, for a first-level task, to the first remaining first-level
      task, the total of the estimate unchanged (WF-PLA-0070, WF-RIS-0010); `nodes` returns
      them written under their new task, `ancestors` that task and its ancestors, and each risk
      concerned sees its provision task (`Risk.provision_node_id`) and its counter change. The
      response does not return the risk: its new counter (`Risk.lock_version`) is read again
      through `getRisk` before following up with an `updateRiskProvision` or an `updateRisk`,
      which carry it (WF-IHM-0110; `provision_moved`, #1665). The deletion that would leave
      without a task a main structure that carries a provision line is refused, naming the
      risks (WF-RIS-0010). A summary task that loses its last subordinate becomes a leaf task
      in automatic mode: it takes as its duration the one it computed, keeps its state, its
      own lines and its attachment to the work breakdown (WF-PLA-0170), and its dates are
      recomputed; if this duration is zero, it becomes a milestone, in the not started or
      completed state it had; if started, it takes a duration of one day (WF-PLA-0040,
      WF-PLA-0160). It is returned as it becomes in `ancestors`, its `computed_fields` and
      `editable_fields` changed along with it. A grid write like the others: it returns its
      recomputed ancestors, the totals and the counter of the structure, which has moved
      forward (`NodesWritten`), so that the grid shows correctly and the next paste carries
      the right counter (WF-IHM-0110). The links taken with it can re-date the successors of
      the task and shift the critical path: these tasks are returned in `rescheduled`
      (WF-PLA-0020, WF-PLA-0100), and their amounts, inflation included, in `reinflated`
      (WF-DEV-0040). A task that the deletion leaves without a predecessor is repositioned
      according to its mode (WF-PLA-0020) without changing state: a past start date neither
      starts nor completes it (WF-RAE-0030; `provision_moved`, #1768). Like any modification,
      it carries the counter of the deleted node as read (`lock_version`, WF-IHM-0110): a
      node written since it was read is not deleted (#1210). On the main structure, a line of
      a completed task is not deleted, the task being first reopened from the Kanban
      (`task_not_completed`, WF-RAE-0040); in a differential, it is deleted like any other,
      the amendment rebudgeting it (WF-REV-0050; F-01, #1766). The phase of the project
      refuses nothing (C-358).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
      - name: lock_version
        in: query
        required: true
        description: >-
          The counter of the deleted node, as the grid read it (`Node.lock_version`): when
          stale, the deletion is refused with 412 and nothing is deleted (WF-IHM-0110, #1210).
          Only the counter of the designated node is judged, not those of the subordinates it
          takes with it.
        schema: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '200':
        description: >-
          Node deleted; `nodes` returns only the provision lines it moves, written under their
          new task (`provision_moved`), empty when it carried none (`deleted`); the ancestors
          and the totals are recomputed without it.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              deleted: { $ref: ../../../fixtures/api/node_deleted.json }
              provision_moved: { $ref: ../../../fixtures/api/node_deleted_provision_moved.json }
              summary_deleted: { $ref: ../../../fixtures/api/node_summary_deleted.json }
              summary_emptied: { $ref: ../../../fixtures/api/node_summary_emptied.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The deletion is refused, nothing being deleted: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` the first missing condition — `project_not_terminal`
          on a terminal project (WF-CYC-0100); then those of the planning entry
          command of the structure (`StructureCommand.edit_planning`:
          `revision_draft`, `no_background_task_running`); then, for a task,
          `task_not_started` for a
          started or completed task, or a summary task one of whose subordinates is
          (WF-PLA-0070), and `at_least_one_task` for the deletion that would leave without a task
          a main structure that carries a provision line, the line no longer having a
          task to be placed under, `params.risks` naming each of the risks whose provision it
          would carry (WF-RIS-0010; F-04, H-05, US-0702/L2); for a line of the main
          structure, `task_not_completed` when its task is completed, which is first reopened
          from the Kanban (`line_completed_refused`; WF-RAE-0040, WF-DEV-0050; F-01, #1766).
          In a differential, the line of a completed task can be deleted (WF-REV-0050).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              started: { $ref: ../../../fixtures/api/node_delete_started_refused.json }
              last_provision_task: { $ref: ../../../fixtures/api/node_delete_last_provision_task_refused.json }
              line_completed_refused:
                $ref: ../../../fixtures/api/node_delete_line_completed_refused.json
      '412':
        description: >-
          `STALE_LOCK_VERSION`: the node has been written since it was read, and nothing is
          deleted; `params.expected_lock_version` is its current counter (WF-IHM-0110, #1210).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/node_delete_stale.json }
      '422': { $ref: ../components/responses.yaml#/LockVersionInvalid }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/dependencies:
  get:
    operationId: getComputedValueDependencies
    tags: [revisions]
    summary: What a computed value depends on
    description: >-
      Read on demand, when the user tries to enter a value that the server
      computes — such as the category of a labour line, derived from its role
      (`labour_category`) —: the rules that compute it, and the lines it is derived from,
      named by their number and their label, whether or not the search or the filters of the
      grid retain them. An attempt to enter a computed value is refused, naming
      what it depends on (WF-IHM-0030); the subordinates of a summary task
      are its direct subordinates (WF-PLA-0040). A field that the server does not compute
      for this node — it is entered — is refused (422, `VALIDATION_FAILED`, `params.field`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
      - name: field
        in: query
        required: true
        description: The computed field whose entry was attempted.
        schema: { $ref: ../components/schemas/revisions.yaml#/ComputedValueField }
    responses:
      '200':
        description: What the value depends on.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/ComputedValueDependencies }
            examples:
              volume: { $ref: ../../../fixtures/api/volume/summary_dependencies.json }
              summary: { $ref: ../../../fixtures/api/dependencies_summary.json }
              summary_moved: { $ref: ../../../fixtures/api/dependencies_summary_moved.json }
              labour: { $ref: ../../../fixtures/api/dependencies_labour.json }
              labour_category: { $ref: ../../../fixtures/api/dependencies_labour_category.json }
              task_amount: { $ref: ../../../fixtures/api/dependencies_task_amount.json }
              provision: { $ref: ../../../fixtures/api/dependencies_provision.json }
              manual_float: { $ref: ../../../fixtures/api/dependencies_manual_float.json }
              provision_subproject: { $ref: ../../../fixtures/api/dependencies_provision_subproject.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          The server does not compute this field for this node: it is entered.
          `VALIDATION_FAILED`, and `params.field` names the field requested. A value of `field`
          outside `ComputedValueField`, or absent, is refused likewise, with
          `VALIDATION_FAILED`, `fields` on `/query/field`, as an invalid row number is on
          `/path/row_number` (`resolveRowNumber`): these two reads have no body, and no
          400.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              entered: { $ref: ../../../fixtures/api/dependencies_entered.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/task:
  patch:
    operationId: updateTaskFacet
    tags: [revisions]
    summary: Modify the time facet of a task
    description: >-
      The dates can be entered in manual mode only (WF-PLA-0020); those of a
      summary task are computed (WF-PLA-0040). A milestone has a zero duration
      (WF-PLA-0050). The duration is entered in one of the units of work or of elapsed
      time, and is kept with it (WF-PLA-0160). The duration of the project cannot exceed
      fifteen years (WF-PLA-0150): a duration, dates or a mode that would take it there are
      refused with 422 `PROJECT_HORIZON_EXCEEDED`, `params.task` naming the task. The
      attachment to a work package or an item of the work breakdown is set,
      changed and removed here, on a summary task, a leaf or a milestone, under the rules
      of `TaskFacetUpdate` (WF-PLA-0170). Only the counter as read is required: only what is
      sent changes (WF-IHM-0040), and the node says what it accepts (`editable_fields`). The
      start and the finish are entered by their date alone: the server completes their hours
      on the applicable calendar of the task (WF-PLA-0010), the start at the beginning of its
      day, the finish at the end of the hours the calendar grants that day
      (`WorkInstantWrite`, #1244). A date on a day without any worked hour in that calendar is
      refused, and the refusal names the next working day; nothing is written (WF-PLA-0020;
      #1271).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/TaskFacetUpdate }
          examples:
            dates_entered: { $ref: ../../../fixtures/api/task_dates_sent.json }
    responses:
      '200':
        description: >-
          Task modified, with the dates and the criticality recomputed, its ancestors
          recomputed, the tasks that an entered duration re-dates — its successors, and what the
          critical path shifts —, the amounts, inflation included, of the lines and tasks it
          moves from one year to another and the totals of the structure (`NodesWritten`,
          WF-PLA-0020, WF-DEV-0040).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              renamed: { $ref: ../../../fixtures/api/task_renamed.json }
              lengthened: { $ref: ../../../fixtures/api/volume/task_lengthened.json }
              attached: { $ref: ../../../fixtures/api/task_attached.json }
              mode_changed: { $ref: ../../../fixtures/api/task_mode_changed.json }
              dates_entered: { $ref: ../../../fixtures/api/task_dates_entered.json }
              duration_entered: { $ref: ../../../fixtures/api/task_duration_entered.json }
              description_entered: { $ref: ../../../fixtures/api/task_description_entered.json }
              dates_conflicting: { $ref: ../../../fixtures/api/task_dates_conflicting.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The planning entry command of the structure is unavailable
          (`StructureCommand.edit_planning`), nothing being written: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` naming the first missing condition, in this order —
          `project_not_terminal` on a terminal project (WF-CYC-0100); then the state conditions
          of the revision, `revision_draft` on a marked revision (`marked_refused`,
          WF-DAT-0020), and `no_background_task_running` while a background task writes to the
          revision or freezes it, as the command of the structure says (WF-IHM-0090).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              marked_refused: { $ref: ../../../fixtures/api/task_update_marked_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Entity refused by a business rule, `fields` locating each refusal: a computed
          value — a date of a task in automatic mode, without a parameter, the grid reading what
          it depends on (`getComputedValueDependencies`); a date of a summary task, which derives
          it from its subordinates, with `SUMMARY_TASK_DERIVED`,
          `fields[].params.subordinate_node_ids` naming them (`summary_date_refused`,
          Vérif of WF-IHM-0030) —, or the mode of a summary task, always automatic
          (`/scheduling_mode`, WF-PLA-0040) (`COMPUTED_VALUE`, WF-PLA-0020,
          WF-IHM-0030), or an attachment to the work breakdown refused —
          task outside the main structure, unknown work package or item, work package and item
          together, work package or item already carried by another task, named by its node and
          its label, task of an item moved out of the subtree of the task of its work package,
          the tasks of the work package and of the items named by their node and their label
          (WF-PLA-0170, `TaskFacetUpdate`). Or, without
          `fields`, an entry that would take the duration of the project beyond fifteen years:
          `PROJECT_HORIZON_EXCEEDED`, `params.task` naming the task by its node and its label
          (WF-PLA-0150). Or a date sent on a day without any worked hour in the calendar
          of the task: `fields` on `/start/date` or `/finish/date` with `NON_WORKING_DAY`,
          `fields[].params.date` the date sent and `next_working_day` the next working day
          — "the refusal names the next working day; nothing is written" (WF-PLA-0020,
          WF-PLA-0010; #1271). Or hours sent with a working day outside `0` to the
          hours that the calendar of the task grants that day: `fields` on `/start/hours`
          or `/finish/hours` with `VALUE_OUT_OF_RANGE`, `fields[].params.minimum` set to `0` or
          `maximum` to the hours of the day, the only bound crossed, never null — a non-working
          day is refused by its date, its hours not being judged (`WorkInstantWrite`,
          WF-PLA-0010, WF-DAT-0100, #1244).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              date_computed: { $ref: ../../../fixtures/api/task_date_computed_refused.json }
              summary_date_refused: { $ref: ../../../fixtures/api/task_summary_date_refused.json }
              milestone_duration_refused:
                $ref: ../../../fixtures/api/task_milestone_duration_refused.json
              horizon_exceeded: { $ref: ../../../fixtures/api/task_horizon_exceeded.json }
              non_working_day: { $ref: ../../../fixtures/api/task_date_non_working_day.json }
              hours_beyond_day: { $ref: ../../../fixtures/api/task_hours_beyond_day.json }
              hours_below_zero: { $ref: ../../../fixtures/api/task_hours_below_zero.json }
              attach_refused: { $ref: ../../../fixtures/api/task_attach_refused.json }
              attach_outside: { $ref: ../../../fixtures/api/task_attach_outside_work_package.json }
              attach_exclusive: { $ref: ../../../fixtures/api/task_attach_exclusive.json }
              attach_main_structure_only: { $ref: ../../../fixtures/api/task_attach_main_structure_only.json }
              attach_exclusive_attached: { $ref: ../../../fixtures/api/task_attach_exclusive_attached.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/estimate-line:
  patch:
    operationId: updateEstimateLine
    tags: [estimate]
    summary: Modify the money facet of an estimate line
    description: >-
      The amounts are computed and cannot be entered: the one at the rates of the reference
      year, before inflation, by the line, the budgeted one by the reference, the re-estimated
      one by the reviews, these last two inflation included, at the consumption year of the
      line (WF-DEV-0020, WF-DEV-0030, WF-DEV-0040). A provision line is computed from its
      risk, and is not projected (WF-RIS-0010, WF-DEV-0030). Only the counter as read is
      required: only what is sent changes (WF-IHM-0040), and the node says what it accepts
      (`editable_fields`). A changed role changes the calendar of the task, hence its dates
      (WF-PLA-0010): its re-dated successors are returned in `rescheduled`, and in
      `reinflated` each line or non-summary task whose amount changes year — the other lines
      it carries, those of the successors that change year, and their tasks. A line
      whose task is started or completed does not leave a subproject that has received actual
      costs, and does not name its subproject in `editable_fields`; that of a task not
      started can change it (WF-PRJ-0050). On the main structure, a line of a completed task
      is not modified, its label no more than the rest, and names no field in
      `editable_fields`: the task is first reopened from the Kanban (`task_not_completed`,
      WF-RAE-0040, WF-DEV-0050). In a differential, it is modified like any other, so that
      the amendment rebudgets it (`rebudgeted_amendment`, WF-REV-0050; F-01, #1765, #1766).
      The phase of the project refuses nothing: the estimate of the main structure, read-only
      from In progress onwards, is so through the command of the structure, which the grid
      follows (`edit_estimate`, C-358).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/EstimateLineUpdate }
    responses:
      '200':
        description: >-
          Line modified, with its amount recomputed, the amounts of its ancestors and the
          totals of the structure (`NodesWritten`).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              entered: { $ref: ../../../fixtures/api/estimate_line_entered.json }
              updated: { $ref: ../../../fixtures/api/estimate_line_updated.json }
              redated: { $ref: ../../../fixtures/api/estimate_line_redated.json }
              subproject_changed: { $ref: ../../../fixtures/api/estimate_line_subproject_changed.json }
              amendment: { $ref: ../../../fixtures/api/estimate_line_updated_amendment.json }
              payment_delay_amendment: { $ref: ../../../fixtures/api/estimate_line_payment_delay_amendment.json }
              rebudgeted_amendment: { $ref: ../../../fixtures/api/estimate_line_rebudgeted_amendment.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The line does not accept the modification, nothing being written:
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` naming the first missing
          condition, in this order — `project_not_terminal` on a terminal project (WF-CYC-0100);
          then the state conditions of the revision, `revision_draft` on a marked revision
          (WF-DAT-0020) and `no_background_task_running` while a background task runs on the
          revision; then, on the main structure only, `task_not_completed` for a line of a
          completed task, which is first reopened from the Kanban, the line naming no field in
          `editable_fields` (`completed_refused`; WF-RAE-0040, WF-DEV-0050; F-01, #1766). In a
          differential, the line of a completed task can be modified (WF-REV-0050). The phase of
          the project refuses nothing (C-358).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              completed_refused:
                $ref: ../../../fixtures/api/estimate_line_completed_update_refused.json
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          A computation that the line would require without an hourly rate: a labour category
          used by its role without a rate for the reference year of the revision,
          `HOURLY_RATE_MISSING`, without `fields`, `params.missing_rates` naming the categories
          one by one (`rate_missing`, WF-DEV-0010); or the role removed from a labour line,
          `VALIDATION_FAILED`, `fields` on `/resource_role_id`, reason `RESOURCE_ROLE_REQUIRED`
          (`role_required`, WF-DEV-0020); or a changed role that would leave the task
          without a worked hour in the week — its calendar never overlaps that of another
          role of the task, or, on a task of which this role is the only one, it has no hour in
          the week (EP-14/L42s) —: `TASK_WITHOUT_WORKING_HOURS`, `params.resource_roles` and
          `params.tasks` naming the roles and the task, unchanged (WF-PLA-0010); or a
          category of the risk provision kind given to an entered line: `VALIDATION_FAILED`,
          `fields` on `/cost_category_id`, reason `PROVISION_CATEGORY_RESERVED` (WF-DEV-0020);
          or a category sent on a labour line that is not that of its role,
          computed: `fields` on `/cost_category_id`, reason `COMPUTED_VALUE`, the grid reading
          what it depends on (`resource_role`, WF-DEV-0020, WF-IHM-0030);
          or a negative payment delay: `fields` on `/payment_delay_days`,
          `VALUE_OUT_OF_RANGE`, `params.minimum` set to `0` (WF-IND-0100); or a field that the
          line does not accept — the payment delay of a provision line, which carries none —,
          reason `FIELD_NOT_ACCEPTED` on its field (`EstimateLineUpdate`; EP-14/L42s); or a
          line of a started or completed task moved out of a subproject that has received actual
          costs: `fields` on `/subproject_id`, reason `SUBPROJECT_HAS_ACTUAL_COSTS`,
          `params.subproject` naming that subproject (WF-PRJ-0050).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              payment_delay_out_of_range: { $ref: ../../../fixtures/api/estimate_line_payment_delay_out_of_range.json }
              subproject_has_actual_costs: { $ref: ../../../fixtures/api/estimate_line_subproject_has_actual_costs.json }
              rate_missing: { $ref: ../../../fixtures/api/estimate_line_rate_missing.json }
              role_required: { $ref: ../../../fixtures/api/estimate_line_role_required.json }
              without_hours: { $ref: ../../../fixtures/api/estimate_line_without_hours.json }
              field_not_accepted: { $ref: ../../../fixtures/api/estimate_line_field_not_accepted.json }
              provision_reserved: { $ref: ../../../fixtures/api/estimate_line_provision_reserved.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/predecessors:
  put:
    operationId: setPredecessors
    tags: [planning]
    summary: Replace the predecessors of a task
    description: >-
      The four link types, with a positive or negative lag in the unit of its
      entry — work time, elapsed time or percentage of the duration of the predecessor
      (WF-PLA-0030, WF-PLA-0160). Predecessors that would close a loop of links are
      refused, as is a link between a summary task and one of its subordinates
      (WF-PLA-0030, WF-PLA-0040), and links that would take the duration of the project beyond
      fifteen years (WF-PLA-0150): 422, nothing is written.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/PredecessorsReplace }
    responses:
      '200':
        description: >-
          Links saved, dates recomputed; the ancestors, the tasks that the link
          re-dates — the successors, and what the critical path shifts — and the totals as well
          (`NodesWritten`, WF-PLA-0020, WF-PLA-0100).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              set: { $ref: ../../../fixtures/api/predecessor_set.json }
              entered: { $ref: ../../../fixtures/api/predecessors_entered.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The planning entry command of the structure is unavailable
          (`StructureCommand.edit_planning`), nothing being written: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` naming the first missing condition, in this order —
          `project_not_terminal` on a terminal project (WF-CYC-0100); then the state conditions
          of the revision, `revision_draft` on a marked revision (`marked_refused`,
          WF-DAT-0020), and `no_background_task_running` while a background task writes to the
          revision or freezes it, as the command of the structure says (WF-IHM-0090).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              marked_refused: { $ref: ../../../fixtures/api/predecessors_marked_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Links refused, nothing is written: a loop of links, `LINK_CYCLE`,
          `params.cycle` naming its tasks by their node and their label, in the order of the
          links, from the task entered to the predecessor sent that already follows it
          (WF-PLA-0030); a link between a summary task and one of its subordinates,
          `LINK_FORBIDDEN`, without a parameter (WF-PLA-0040); or links that would take the
          duration of the project beyond fifteen years, `PROJECT_HORIZON_EXCEEDED`,
          `params.task` naming the task entered (WF-PLA-0150); or a predecessor sent twice, a
          second link between the same tasks, `VALIDATION_FAILED`, `fields` designating each
          occurrence after the first, `/predecessors/<n>/predecessor_node_id`, with
          `DUPLICATE_PREDECESSOR` (WF-PLA-0030; F-03, US-0702/L2); or a value outside the rules,
          `fields` locating it, as the common response `UnprocessableEntity` says. The code
          names the reason, which the predecessors column states at its cell.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              cycle_refused: { $ref: ../../../fixtures/api/predecessors_cycle_refused.json }
              forbidden: { $ref: ../../../fixtures/api/predecessors_forbidden.json }
              horizon_exceeded: { $ref: ../../../fixtures/api/predecessors_horizon_exceeded.json }
              duplicate: { $ref: ../../../fixtures/api/predecessors_duplicate.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/progress:
  put:
    operationId: setTaskProgress
    tags: [remaining]
    summary: Start, complete or reopen a task
    description: >-
      The action of a Kanban card, the state sent being the one the card names
      (`KanbanCommandAvailability.progress`). The date of the action is authoritative and
      situates the earned value (WF-RAE-0030, WF-IND-0030, WF-PLA-0130): a task completed
      without having been started, milestone included, takes as its start date that of its
      completion — a milestone without going through the started state —, and a reopened
      milestone loses both (`ProgressUpdate`, `milestone_completed`, `milestone_reopened`).
      Refused on a summary task, whose state is derived from its subordinates (WF-PLA-0040):
      422 `SUMMARY_TASK_DERIVED`, which names them (WF-IHM-0030).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/ProgressUpdate }
    responses:
      '200':
        description: >-
          State saved; the task, one version higher, and the progress of the summary tasks
          above recomputed (`NodesWritten`). The lines of the task are not returned: they
          are not written, but what they accept follows the state of their task — a line
          of a started or completed task whose subproject has received actual costs no longer
          names `estimate_line.subproject_id` (WF-PRJ-0050), a line of a completed task no longer
          accepts re-estimation (`remaining_entry`, WF-RAE-0040) —, and a grid that holds them
          reads the lines of the task again (`listNodes`, `subtree_of`) before offering an entry
          on them (#1154).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              task_started: { $ref: ../../../fixtures/api/task_started.json }
              milestone_completed: { $ref: ../../../fixtures/api/milestone_completed.json }
              task_reopened: { $ref: ../../../fixtures/api/task_reopened.json }
              milestone_reopened: { $ref: ../../../fixtures/api/milestone_reopened.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The state or the kind of the task forbids the action, nothing being written:
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` naming the first missing
          condition, as the Kanban card states it (`KanbanCommand`) — `task_is_milestone`,
          a task not started that is not a milestone sent to `completed`;
          `task_without_lines`, a task that carries a non-provision line sent to
          `completed`, which the entry of its remaining to commit completes (WF-RAE-0040);
          `task_not_milestone`, a milestone sent to `started`, which does not go through the
          started state (WF-PLA-0050); `completed_milestone`, `not_started` sent for a task that
          is not a completed milestone (`reopen_not_started_refused`, WF-RAE-0030) —, then the
          conditions
          of the remaining to commit entry (`StructureCommand.edit_remaining`):
          `project_in_progress`, `no_background_task_running`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              reopen_not_started_refused:
                $ref: ../../../fixtures/api/task_reopen_not_started_refused.json
              milestone_started_refused:
                $ref: ../../../fixtures/api/task_progress_milestone_started_refused.json
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          A summary task, whose state cannot be entered: `SUMMARY_TASK_DERIVED`,
          `params.subordinate_node_ids` naming its direct subordinates, in plan order, from
          which it derives its state (WF-PLA-0040, WF-IHM-0030); nothing is written. Or a value
          outside the rules, `fields` locating it, as the common response `UnprocessableEntity`
          says.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              summary_refused: { $ref: ../../../fixtures/api/task_progress_summary_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/remaining:
  put:
    operationId: setLineRemaining
    tags: [remaining]
    summary: Re-estimate a line
    description: >-
      Refused on a line of a completed task and on a provision line; a task not
      started can also be re-estimated, and a zero remaining to commit for all the lines of a
      task completes it, at the date requested at validation (`completed_on`, WF-RAE-0040,
      WF-PLA-0130); a task not started that is not a milestone goes through the started state,
      started and completed at that same date (WF-RAE-0030), and a milestone, which does not
      go through it, also carries `started_on` equal to `completed_on` (WF-PLA-0130). The line
      itself says whether it accepts re-estimation (`remaining_entry`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/RemainingUpdate }
    responses:
      '200':
        description: >-
          Re-estimate saved; the re-estimated amounts of the ancestors and the totals
          recomputed (`NodesWritten`).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              reestimated: { $ref: ../../../fixtures/api/remaining_reestimated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The line does not accept re-estimation, nothing being written:
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` naming the first of the
          conditions that its `remaining_entry` says are missing — `task_not_completed`, a line
          of a completed task (`completed_refused`, WF-RAE-0040); `line_not_provision`, a
          provision line, whose amount is the one its risk computes
          (`remaining_provision_refused`, WF-RIS-0010, WF-RAE-0010) —, or a background task
          running on the revision, `no_background_task_running`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              provision_refused: { $ref: ../../../fixtures/api/remaining_provision_refused.json }
              completed_refused: { $ref: ../../../fixtures/api/remaining_completed_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, nothing being written: an entry that completes the task without
          a completion date — reason `COMPLETION_DATE_REQUIRED` on `/completed_on`,
          `fields[].params.task_node_id` naming the task (WF-RAE-0040, WF-PLA-0130); a figure
          the line does not accept — the unit disbursement of a labour line, the hours of
          another line —, reason `FIELD_NOT_ACCEPTED` on its field
          (`RemainingUpdate.reestimated_amount_basis`, WF-DEV-0020); or a value outside the
          rules, `VALUE_OUT_OF_RANGE`, `fields` locating it. A computation that the line would
          require without an hourly rate — its labour category without a rate for the reference
          year of the revision — is refused with `HOURLY_RATE_MISSING`, without `fields`,
          `params.missing_rates` naming the categories one by one (WF-DEV-0010).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              completion_date_required: { $ref: ../../../fixtures/api/remaining_completion_date_required.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/tracking:
  put:
    operationId: setNodeTracking
    tags: [planning]
    summary: Register a task for tracking or remove it
    description: >-
      A task is registered in a timeline, a milestone in time/time tracking; the contractual
      milestones are nothing other than registered milestones (WF-PLA-0060). A task of the
      main structure states it in advance, `task.tracking` in its `editable_fields` (#1065).
      Time/time tracking is that of milestones: a task that is not a milestone, sent with
      a `milestone_tracking` entry, is refused with 422 `VALIDATION_FAILED`, `fields` on the
      kind of that entry (`/entries/<n>/kind`, `n` its rank in `entries`, starting from 0),
      reason `MILESTONE_REQUIRED`, and nothing is written (#1159).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [entries, lock_version]
            properties:
              entries:
                type: array
                items: { $ref: ../components/schemas/revisions.yaml#/TrackingEntry }
              lock_version: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '200':
        description: Registrations saved (`NodesWritten`).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              tracked: { $ref: ../../../fixtures/api/node_tracked.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The planning entry command of the structure is unavailable
          (`StructureCommand.edit_planning`, to which `task.tracking` belongs):
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` the first condition it
          lacks — `revision_draft` on a marked revision (WF-DAT-0020), then
          `no_background_task_running` while a background task writes to the revision
          or freezes it (F-11, US-0702/L2). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_marked: { $ref: ../../../fixtures/api/node_tracking_marked_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Refused, nothing being written: the time/time tracking of a task that is not a
          milestone, `VALIDATION_FAILED`, `fields` on `/entries/<n>/kind`, reason
          `MILESTONE_REQUIRED` (WF-PLA-0060, #1159); a `timeline` entry without a timeline,
          `/entries/<n>/timeline_id` with `VALUE_REQUIRED`, or whose timeline is not of the
          project, with `UNKNOWN_TIMELINE` (WF-PLA-0140; F-11, US-0702/L2); or a value outside
          the rules, `fields` locating it, as the common response `UnprocessableEntity` says
          (`TrackingEntry`).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              milestone_refused: { $ref: ../../../fixtures/api/node_tracking_milestone_refused.json }
              timeline_required: { $ref: ../../../fixtures/api/node_tracking_timeline_required.json }
              timeline_unknown: { $ref: ../../../fixtures/api/node_tracking_timeline_unknown.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/move:
  post:
    operationId: moveNodes
    tags: [revisions]
    summary: Move nodes in the tree
    description: >-
      Moving a line, or the task above it, changes its carrying task, which
      is resolved on read (§3.5.1). The resulting hierarchy remains that of a tree of
      tasks and summary tasks (WF-PLA-0040). A move changes the structure of
      the tree, and can re-date tasks that are neither moved nor ancestors: they are
      returned in `rescheduled` (WF-PLA-0020), and their amounts, inflation included, in
      `reinflated` (WF-DEV-0040). A summary task that loses its last subordinate becomes a
      leaf in automatic mode, of the duration it computed, in its state, with its own lines
      and its attachment to the work breakdown; a milestone if that duration is zero and it is
      not started, a one-day leaf if it is (WF-PLA-0040, `deleteNode`) — returned
      as such in `ancestors`, among the former ancestors; a leaf in manual mode that receives
      a subordinate becomes a summary task, always in automatic mode — never a milestone,
      which carries no subtasks: a task moved under it is refused with 422
      `MILESTONE_HAS_NO_SUBTASK` (WF-PLA-0050, `NodeMove`; #1771). A move that
      would take the task of an item out of the
      subtree of the task of its work package is refused (WF-PLA-0170, `NodeMove`), as is a
      move that would take the duration of the project beyond fifteen years (WF-PLA-0150). The
      summary task that receives a node covers it, with its ancestors: what precedes it
      precedes the node, what follows it follows the node (WF-PLA-0040). A move or an indent
      that would thus link a summary task to one of its subordinates — indenting a
      task under the one above it, which is its predecessor — is refused with 422
      `LINK_FORBIDDEN`; a move that would close a loop of links through it, with
      422 `LINK_CYCLE`, `params.cycle` naming the tasks of the loop (WF-PLA-0030) — the chain
      can cross the hierarchy, a summary task covering its subordinates (#1169) —;
      nothing is written. A selection is judged on the structure that the move would leave,
      all its nodes moved, and the refusal names the first node concerned in the plan order of
      the structure read; the order of `node_ids` governs only the placement (`NodeMove`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/NodeMove }
          examples:
            mixed: { $ref: ../../../fixtures/api/nodes_move_mixed.json }
    responses:
      '200':
        description: >-
          Nodes moved; their former and new ancestors recomputed, and the totals
          (`NodesWritten`). An indent is a move under the task above, at its
          level (`nodes_indented`).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              moved: { $ref: ../../../fixtures/api/nodes_moved.json }
              indented: { $ref: ../../../fixtures/api/nodes_indented.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The state forbids the move, nothing moving: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` naming the first missing condition, in this order —
          `project_not_terminal` on a terminal project (WF-CYC-0100); then the state conditions
          of the revision, `revision_draft` on a marked revision (WF-DAT-0020) and
          `no_background_task_running` while a background task runs on the revision,
          as the command of the structure says; then, on the main structure only, a
          line moved to a completed task, or from it, which is first reopened from the
          Kanban — "The creation of a line under a completed task, or the move of a
          line to it, is refused" (Vérif of WF-DEV-0050, WF-RAE-0030, WF-RAE-0040) —,
          `task_not_completed` (`completed_refused`; #1214, #1766). In a differential, a
          line is moved to a completed task or from it as elsewhere, the amendment
          rebudgeting it (WF-REV-0050, #1765). The phase of the project refuses nothing (C-358).
          A selection names the condition of the first node concerned in plan order, like its
          other refusals.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              completed_refused: { $ref: ../../../fixtures/api/nodes_move_completed_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          The move would take the task of an item out of the subtree of the task of its work
          package (WF-PLA-0170): `VALIDATION_FAILED`, `fields` on the moved node concerned,
          reason `ORDER_ITEM_OUTSIDE_WORK_PACKAGE`, `fields[].params.work_package_task` and
          `order_item_tasks` naming the task of the work package and those of the items by their
          node and their label, like the failure of a merge (`NodeMove`, WF-IHM-0080). Or a
          moved labour line changes carrying task, and its role would leave the task that
          receives it without any worked hour in the week: `TASK_WITHOUT_WORKING_HOURS`,
          `params.resource_roles` and `params.tasks` naming the roles and the task, each one by
          its label (WF-PLA-0010; #1684). Or a node to be placed after that is not a sibling
          under the target parent: `fields` on `/after_node_id`, `NODE_NOT_SIBLING`, without a
          parameter (`NodeMove`; #1183). Or a task moved under a milestone, which carries no
          subtasks: `fields` on `/parent_id`, `MILESTONE_HAS_NO_SUBTASK`, `fields[].params`
          naming the milestone (`node_id`, `label`; WF-PLA-0050, #1771). Or, without `fields`, a
          move that, by changing the calendar of a task, would take the duration of the project
          beyond fifteen years: `PROJECT_HORIZON_EXCEEDED`, `params.task` naming the moved task
          or the one that receives the moved line (WF-PLA-0150). Or a provision line among the
          moved nodes: its task is the one its risk designates, and it is moved through the risk
          form (`updateRiskProvision`, `provision_task_id`) — `fields` on the line,
          `/node_ids/<n>`, reason `PROVISION_LINE_MOVED_BY_RISK`, `fields[].params.risk` naming
          the risk by its identifier and its label (`risk_id`, `label`), which the grid does not
          read (WF-RIS-0010; #1227); a task that carries a provision line, for its part, moves
          with its line. Or, without `fields`, a move or an indent that would link the summary
          task that receives the node, or one of its ancestors, to the node or to one of its
          subordinates: `LINK_FORBIDDEN`, without a parameter (WF-PLA-0030, WF-PLA-0040); or
          that would close a loop of links through it: `LINK_CYCLE`, `params.cycle` naming the
          tasks of the loop by their node and their label, in the order of the links
          (WF-PLA-0030) — the grid, filtered, may not read them.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              after_not_sibling: { $ref: ../../../fixtures/api/nodes_move_after_not_sibling.json }
              outside_work_package: { $ref: ../../../fixtures/api/nodes_move_outside_work_package.json }
              indent_forbidden: { $ref: ../../../fixtures/api/nodes_indent_forbidden.json }
              cycle_refused: { $ref: ../../../fixtures/api/nodes_move_cycle_refused.json }
              provision_refused: { $ref: ../../../fixtures/api/nodes_move_provision_refused.json }
              without_hours: { $ref: ../../../fixtures/api/nodes_move_without_hours.json }
              under_milestone: { $ref: ../../../fixtures/api/nodes_move_under_milestone.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/paste-preview:
  post:
    operationId: previewPaste
    tags: [revisions]
    summary: Preview of a paste from a spreadsheet
    description: >-
      States what will be written and what will be refused, with the reason for each refusal;
      nothing is written at this stage (WF-IHM-0050). Once confirmed, the paste will write the
      accepted lines and not the refused lines (`applyPaste`). The block fills, starting from
      the target column, the columns of the facet of the target node in the order of
      `NodeColumn` — the order of the grids (WF-PLA-0080, WF-DEV-0050) —, without shifting any
      cell: a non-empty cell that falls on a column that its line does not accept is refused,
      named by its line and its column (`PastePreview`), and the subproject of a line of a
      started or completed task does not leave a subproject that has received actual costs
      (`SUBPROJECT_HAS_ACTUAL_COSTS`, `PasteRejection`, WF-PRJ-0050); on the main
      structure, a line of a completed task, which accepts no field, refuses every non-empty
      cell with `STATE_FORBIDS_OPERATION`, `params.missing_condition` set to
      `task_not_completed`, and is not written (`PasteRejection`, WF-RAE-0040; F-01, #1766).
      On a differential, a block that covers nodes that the differential removes, returned in
      their place read-only (`NodeDifference`), skips these nodes and fills the following
      ones, without refusal: each line of the block writes the next node that is not removed
      (`PastePreview`, #1278). But a block whose target cell is itself on a removed node,
      which accepts no field (`editable_fields` empty), is refused whole: a single
      `PasteRejection`, on the first line of the block and the target column, with
      `PASTE_TARGET_REMOVED`, no line accepted or judged; the anchor is not carried over to
      the next node, which would write somewhere other than where the user clicked (#1361).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/PastePreview }
    responses:
      '200':
        description: >-
          Paste plan. The `unknown_category` example shows a refused category cell,
          `without_hours` a role cell that would leave the task of its line without any worked
          hour (`TASK_WITHOUT_WORKING_HOURS`, WF-PLA-0010; #779).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/PastePlan }
            examples:
              planned: { $ref: ../../../fixtures/api/paste_plan.json }
              unknown_category: { $ref: ../../../fixtures/api/paste_plan_unknown_category.json }
              without_hours: { $ref: ../../../fixtures/api/paste_plan_without_hours.json }
              subproject_held: { $ref: ../../../fixtures/api/paste_plan_subproject_held.json }
              amendment: { $ref: ../../../fixtures/api/paste_plan_amendment.json }
              amendment_skipping: { $ref: ../../../fixtures/api/paste_plan_amendment_skipping.json }
              amendment_target_removed:
                $ref: ../../../fixtures/api/paste_plan_amendment_target_removed.json
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '413': { $ref: ../components/responses.yaml#/PayloadTooLarge }
      '422':
        description: >-
          Block wider than the columns of the facet starting from the target column
          (`NodeColumn`): `PASTE_TOO_WIDE`, `params.max_columns` saying how many remain;
          nothing is written (WF-IHM-0050).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              too_wide: { $ref: ../../../fixtures/api/paste_too_wide.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/paste:
  post:
    operationId: applyPaste
    tags: [revisions]
    summary: Apply a paste
    description: >-
      The valid lines of the plan are written in a single operation, and the refused lines are
      not; an abandoned paste leaves the grid unchanged (WF-IHM-0050; EP-14/L42q). Carries
      the counter of the structure, refused with 412 if it is stale; the plan also retains the
      counter of the structure read at the preview, and the confirmation is refused with 412
      if the structure has changed since, whatever the counter sent (`PasteApply`,
      `params.expected_lock_version` the current counter). It returns the next counter with
      the nodes written, their ancestors and the totals, and the refusals of the preview, line
      by line, which the confirmation did not write, with those it adds by judging the
      accepted lines again against the reference data (`PasteApplied`, `PasteRejection`,
      WF-IHM-0110): a partial success can be read from `rejected` not being empty. On a
      differential, the nodes it removes, which the block
      covers, are skipped without refusal and are never written: the lines of the block write
      the following nodes, as the preview judged them (`PastePreview`, #1278); a plan whose
      target cell is on a removed node, refused whole (`PASTE_TARGET_REMOVED`), writes
      nothing, once confirmed: the counter of the structure does not move forward, and the
      refusal is stated again (#1361).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/PasteApply }
    responses:
      '200':
        description: >-
          Paste applied, wholly or in part; the counter of the structure has moved forward as
          soon as a line is written.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/PasteApplied }
            examples:
              applied: { $ref: ../../../fixtures/api/paste_applied.json }
              partial: { $ref: ../../../fixtures/api/paste_applied_partial.json }
              amendment: { $ref: ../../../fixtures/api/paste_applied_amendment.json }
              amendment_skipping: { $ref: ../../../fixtures/api/paste_applied_amendment_skipping.json }
              rejudged: { $ref: ../../../fixtures/api/paste_applied_rejudged.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The structure no longer accepts entry in its grid, nothing being written:
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` naming the first missing
          condition, in this order — `project_not_terminal` on a terminal project
          (WF-CYC-0100); then the conditions that its command says are missing
          (`StructureCommand`), `revision_draft` on a marked revision (`marked_refused`,
          WF-DAT-0020), `no_background_task_running` while a background task runs on the
          revision (WF-IHM-0050, WF-IHM-0090). The refusal of a line of the block is not a 409:
          it is returned in `rejected`, with its reason (`PasteRejection`).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              marked_refused: { $ref: ../../../fixtures/api/paste_apply_marked_refused.json }
      '412':
        description: >-
          The counter sent is stale, or the structure has changed since the preview, whatever
          the counter sent (`PasteApply`): `STALE_LOCK_VERSION`, `params.expected_lock_version`
          the current counter of the structure; nothing is written (WF-IHM-0050, WF-IHM-0110).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/paste_stale.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/undo:
  post:
    operationId: undoLastChange
    tags: [revisions]
    summary: Undo the last change
    description: >-
      The undoable history is kept by the server: one stack per revision and per user,
      which lives as long as their session — the `bearer` token that carries their requests —,
      and survives neither the end of that session, nor the marking of the revision, nor its
      abandonment, the revision no longer being current (decision of the author of
      2026-10-28, E-06). It receives each of their changes to the current revision — the
      entries of the grids, the planning start date and the label of a structure, and those of
      the risks, creation, change of the provision (`updateRiskProvision`), review, deletion of
      a risk (WF-RIS-0020); the change of a risk's identity (`updateRisk`), project data, does
      not enter it — and keeps
      at least the last fifty of them; two users each have their own. Undo reverts the last
      one, one by one and in reverse order. An
      undo is a change like any other: it returns what a write returns
      (`UndoResult.written`), is recorded in the audit columns and is refused if a later
      change applies to the same object (WF-IHM-0110). No command undoes
      what has its own inverse command or is final — an applied import, a marking,
      the abandonment of a current revision, a merge, the designation of the reference, an exit
      from the life cycle, the declaration of an occurred risk —, nor the exclusion and the
      reinstatement of a cost line, which are reverted by the inverse action (WF-IHM-0110,
      WF-CRE-0030, C-363).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    responses:
      '200':
        description: Change undone.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/UndoResult }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403':
        description: >-
          As the common `Forbidden` response states; besides, an undo is a change like any
          other (WF-IHM-0110): it is refused with 403 `PERMISSION_MISSING`,
          `params.missing_permission` naming it, to whoever no longer holds the permission of
          the entry it undoes — `planning.write`, `estimate.write` or `remaining.write` for an
          entry of the corresponding grid, `planning.write` for the planning start date or the
          label of a structure, `risks.write` for a risk entry (WF-ADM-0100). Nothing is
          undone. Or the token of the caller carries no session of sign-in (`sid`), by which
          the server keeps the history: `SESSION_ID_MISSING`, without a parameter — the token is
          valid and the caller known, so it is not a 401, which would send the front back to a
          sign-in that gives the same token; a write made with such a token is made all the same
          and enters no history, so nothing is there to undo (WF-IHM-0110; #2472).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              session_id_missing: { $ref: ../../../fixtures/api/undo_session_id_missing.json }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          A background task that writes into the revision or freezes it — a marking, a merge,
          the processing of an occurrence, the application of an import —:
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` set to
          `no_background_task_running`, judged before any other refusal, as for any entry into
          the revision (`CommandCondition`); nothing is undone. Or a later change applies to the
          same object — `UNDO_CONFLICT`,
          `params.conflicting_object_id` and `params.conflicting_object_label` naming the object
          changed since, a task, an estimate line or a risk, nothing being undone: "It is
          refused, naming the conflicting object" (`later_change`, WF-IHM-0110; #1531, E-07) —,
          or the caller's history on the revision is empty, `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` set to `undo_history_not_empty` (`history_empty`). Or the
          undo would restore a subproject deleted
          since — to the provision of a risk whose creation, change of provision or deletion it
          undoes,
          or to an estimate line of which it undoes a write of the grid, including the deletion
          of a line or of a task and its lines —:
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` set to
          `restored_subproject_exists`, and nothing is undone (decision of the author, #732). Or
          the undo would recreate the provision line of a risk — it undoes the deletion of an
          identified risk, the review that dismissed it or the change of the category of its
          provision — on a main structure that no longer has any task, `at_least_one_task`, or
          with a category that is no longer active and of the risk provision kind, deactivated
          or attached to a cost type of another kind since, `active_provision_category`: an undo
          is subject to the rules of entry (WF-IHM-0110), which refuse the return of a risk to
          the identified state on such a structure or without such a category (WF-RIS-0010);
          sending nothing, it cannot designate another category as the review can. These
          conditions are judged in the order of the enumeration (`CommandCondition`) —
          `at_least_one_task`, `restored_subproject_exists`, `active_provision_category` —, the
          refusal naming the first one missing, and nothing is undone (#795).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              risk_without_task: { $ref: ../../../fixtures/api/undo_risk_without_task.json }
              later_change: { $ref: ../../../fixtures/api/undo_later_change.json }
              history_empty: { $ref: ../../../fixtures/api/undo_history_empty.json }
              restored_subproject_deleted:
                $ref: ../../../fixtures/api/undo_restored_subproject_deleted.json
              background_task_running: { $ref: ../../../fixtures/api/undo_background_running.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/redo:
  post:
    operationId: redoLastUndo
    tags: [revisions]
    summary: Redo the last undo
    description: >-
      Restores the entry that the caller's last undo on the revision had reverted,
      in the same history as `undoLastChange` (WF-IHM-0110). The response has the shape of
      that of the undo (`UndoResult`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    responses:
      '200':
        description: Change redone (WF-IHM-0110).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/UndoResult }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403':
        description: >-
          As the common `Forbidden` response states; besides, a redo is a change like any
          other (WF-IHM-0110): it is refused with 403 `PERMISSION_MISSING`,
          `params.missing_permission` naming it, to whoever no longer holds the permission of
          the entry it redoes — `planning.write`, `estimate.write` or `remaining.write` for an
          entry of the corresponding grid, `planning.write` for the planning start date or the
          label of a structure, `risks.write` for a risk entry (WF-ADM-0100). Nothing is
          redone. Or the token of the caller carries no session of sign-in (`sid`):
          `SESSION_ID_MISSING`, as for the undo (`undoLastChange`; #2472).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              session_id_missing: { $ref: ../../../fixtures/api/redo_session_id_missing.json }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          A background task that writes into the revision or freezes it — a marking, a merge,
          the processing of an occurrence, the application of an import —:
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` set to
          `no_background_task_running`, judged before any other refusal, like the undo
          (`undoLastChange`); nothing is redone. Or a later change applies to the same object —
          `UNDO_CONFLICT`,
          `params.conflicting_object_id` and `params.conflicting_object_label` naming the object
          changed since, nothing being redone (`later_change`, WF-IHM-0110; #1531, E-07) —, or
          there is no undo to redo, `STATE_FORBIDS_OPERATION`, `params.missing_condition` set to
          `redo_history_not_empty` (`history_empty`). Or the redo would restore a subproject
          deleted since — to the provision of a risk whose creation, change of provision or
          deletion it redoes, or to an estimate line of which it redoes a write of the grid, including the
          deletion of a line or of a task and its lines —: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` set to `restored_subproject_exists`, and nothing is redone
          (decision of the author, #732). Or the redo would recreate the provision line of a
          risk — it redoes its creation, the review that made it identified or the change of
          the category of its provision — on a main structure that no longer has any
          task, `at_least_one_task`, or with a category that is no longer active and of the
          risk provision kind, deactivated or attached to a cost type of another kind since,
          `active_provision_category`, like the undo (`undoLastChange`, WF-RIS-0010,
          WF-IHM-0110). These conditions are judged in the order of the enumeration
          (`CommandCondition`) — `at_least_one_task`, `restored_subproject_exists`,
          `active_provision_category` —, the refusal naming the first one missing, and nothing
          is redone (#795).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              risk_category_deactivated:
                $ref: ../../../fixtures/api/redo_risk_category_deactivated.json
              later_change: { $ref: ../../../fixtures/api/redo_later_change.json }
              history_empty: { $ref: ../../../fixtures/api/redo_history_empty.json }
              background_task_running: { $ref: ../../../fixtures/api/redo_background_running.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/skeleton:
  post:
    operationId: generatePlanningSkeleton
    tags: [planning]
    summary: Generate the planning skeleton from the work breakdown
    description: >-
      One summary task per work package and per item, each one attached to the work package
      or item it represents (`TaskFacet.work_package_id`, `order_item_id`, WF-PLA-0170), that
      of an item subordinate to that of its work package, one leaf per deliverable, one end
      milestone per item and per work package, with their links. Generated on the
      main structure of the revision, the only one to carry attachments — never on a
      differential nor on the own estimate of a risk, which the operation does not
      designate —, and offered only when it has no task, without creating any link with the
      work breakdown other than this attachment: modifying the work breakdown afterwards
      neither moves nor deletes any task, only the attachment follows it (WF-PRJ-0030,
      WF-PLA-0170). The revision states in advance whether the generation is offered
      (`RevisionCommand.generate_skeleton`); on a project without a current revision, it is
      the project that states it (`ProjectCommand.generate_skeleton`), and the generation
      does not open the revision: the screen opens it first (`createRevision`), then
      generates the skeleton on the revision returned (EP-15/US-0490/L4); refused on a marked
      revision, every revision of a terminal project being one, with 409, like any entry
      (WF-DAT-0020, WF-CYC-0100). A grid write like the others:
      it returns the tasks created, the totals and the counter of the structure
      (`NodesWritten`), so that the empty grid fills up and the next entry carries the right
      counter (WF-IHM-0110).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    responses:
      '201':
        description: >-
          Skeleton generated: its tasks in `nodes`, in plan order — the summary task of a
          work package, then that of each of its items followed by its deliverables and its end
          milestone, then the end milestone of the work package —, without an ancestor to
          recompute or a task re-dated.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              default_breakdown: { $ref: ../../../fixtures/api/skeleton_generated.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The generation is not offered: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` naming the first missing condition, in the order in which
          the command lists them (`generate_skeleton`) — `main_structure_without_tasks` as soon
          as the main structure has a task (Vérif of WF-PRJ-0030), then
          `no_background_task_running` during a marking, an import, the processing of a risk
          occurrence or a merge (WF-IHM-0080). On a marked revision, the command
          lacks only `revision_draft` (`marked_refused`, WF-DAT-0020).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              structure_not_empty: { $ref: ../../../fixtures/api/skeleton_structure_not_empty.json }
              marked_refused: { $ref: ../../../fixtures/api/skeleton_marked_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
