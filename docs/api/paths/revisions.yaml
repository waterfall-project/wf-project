          la basse par `VALUE_OUT_OF_RANGE` sur `/query/<colonne>_max`, `params.minimum` la borne
          inférieure donnée, une fin de période antérieure à son début par `VALUE_OUT_OF_RANGE`
          sur `/query/<colonne>_to`, `params.minimum` le début donné (WF-IHM-0130) ; `fields`
          sur le paramètre. Une propriété inconnue de `fields`, comme `listNodes` la refuse
          (`NodeFields`, `fields_unknown`).
        content:
