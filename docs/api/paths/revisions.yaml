/projects/{project_id}/revisions:
  get:
    operationId: listRevisions
    tags: [revisions]
    summary: Historique des révisions
    description: >-
      Nom de version, description, état, date de marquage, année de référence et caractère
      de référence — les attributs d'une révision (WF-REV-0090) ; chacune est consultable dans
      son intégralité (WF-REV-0070).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - name: status
        in: query
        description: Les états retenus, en cours ou marquée ; absents, toutes (WF-IHM-0130).
        schema:
          type: array
          items: { $ref: ../components/schemas/revisions.yaml#/RevisionStatus }
        explode: false
      - name: search
        in: query
        description: >-
          Recherche sur le nom de version et la description, comparés comme toute recherche du
          contrat (README, « Une recherche… »).
        schema: { type: string, minLength: 1, maxLength: 200 }
    responses:
      '200':
        description: Révisions, de la plus récente à la plus ancienne.
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/revisions.yaml#/Revision }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/revisions.json }
              empty: { $ref: ../../../fixtures/api/revisions_empty.json }
              marked: { $ref: ../../../fixtures/api/revisions_marked.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createRevision
    tags: [revisions]
    summary: Ouvrir la révision en cours
    description: >-
      Un projet comporte au plus une révision en cours ; sa création copie les structures de la
      dernière révision marquée et les valeurs du référentiel qu'elles emploient (WF-REV-0010,
      WF-DAT-0010), rattachements des tâches au lotissement compris, sauf à un lot ou à un poste
      marqué supprimé, que la copie ne reprend pas (WF-PLA-0170). La révision retient pour année
      de référence l'année courante (`reference_year`) ; quand elle diffère de celle de la
      révision copiée, la mise à jour des taux est proposée, jamais imposée (WF-REV-0060).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/RevisionCreate }
    responses:
      '201':
        description: Révision en cours créée.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/Revision }
            examples:
              created: { $ref: ../../../fixtures/api/revision_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: Une révision en cours existe déjà (WF-REV-0010).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}:
  get:
    operationId: getRevision
    tags: [revisions]
    summary: Une révision et son instantané
    description: >-
      Attributs de la révision et contenu de son instantané (WF-REV-0090, WF-REV-0030).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    responses:
      '200':
        description: Révision, avec les valeurs de référentiel et les paramètres conservés (WF-REV-0030).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/Revision }
            examples:
              witness: { $ref: ../../../fixtures/api/revision.json }
              marked: { $ref: ../../../fixtures/api/revision_marked.json }
              offer: { $ref: ../../../fixtures/api/revision_offer.json }
              reader: { $ref: ../../../fixtures/api/revision_reader.json }
              estimator: { $ref: ../../../fixtures/api/revision_estimator.json }
              marking: { $ref: ../../../fixtures/api/revision_marking.json }
              importing: { $ref: ../../../fixtures/api/revision_importing.json }
              without_tasks: { $ref: ../../../fixtures/api/revision_without_tasks.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  delete:
    operationId: abandonRevision
    tags: [revisions]
    summary: Abandonner la révision en cours
    description: >-
      Le projet revient à son état à la dernière révision marquée, et les lignes de la
      révision abandonnée sont supprimées (WF-REV-0010, WF-DAT-0010). Refusé sur une
      révision marquée (WF-DAT-0020). L'abandon est irréversible, hors de l'annulation : il ne
      s'inscrit pas à l'historique que `undoLastChange` défait, la révision et ses lignes
      n'étant plus (WF-IHM-0110, C-363) ; l'écran le dit dans sa confirmation.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    responses:
      '204':
        description: Révision abandonnée.
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/mark:
  post:
    operationId: markRevision
    tags: [revisions]
    summary: Marquer la révision
    description: >-
      Fige la révision et calcule ses indicateurs dans la même transaction
      (WF-REV-0020, WF-DAT-0040) ; une révision marquée avant l'état En cours ne
      conserve que les indicateurs de devis. Le nom de version est unique parmi les
      révisions marquées du projet. Confié au worker (WF-ARC-0090), et inscrit au
      journal d'audit (WF-SEC-0030). La révision suivante n'est créée qu'à la demande.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/RevisionMark }
    responses:
      '202':
        description: Marquage mis en file.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              queued: { $ref: ../../../fixtures/api/task_mark_queued.json }
              relaunched: { $ref: ../../../fixtures/api/task_mark_relaunched.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Nom de version déjà employé par une révision marquée du projet : `ALREADY_EXISTS`,
          `fields` désignant `/version_name` par `ALREADY_EXISTS`,
          `fields[].params.conflicting_object_id` la révision qui le porte. Ou révision déjà
          marquée (WF-REV-0020). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/reference-revision:
  put:
    operationId: designateReferenceRevision
    tags: [revisions]
    summary: Désigner la révision de référence
    description: >-
      Désignation manuelle possible tant que le projet n'a ni coût réel ni révision
      marquée postérieure ; au-delà, la référence ne se déplace plus qu'à la
      contractualisation d'un avenant (WF-REV-0040). Inscrite au journal d'audit
      (WF-SEC-0030). La
      désignation fait passer le projet à En cours si les conditions de WF-CYC-0030
      sont réunies.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/ReferenceDesignation }
    responses:
      '200':
        description: >-
          Référence désignée : le projet, sa référence nouvelle et son état — En cours s'il porte
          son code projet (WF-CYC-0030).
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Project }
            examples:
              designated: { $ref: ../../../fixtures/api/reference_designated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Une condition que la commande `designate_reference` de la révision dit manquante, la
          première dans l'ordre où elle les liste, rien n'étant écrit : une révision en cours,
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `revision_marked` ; une
          révision dont la structure principale ne porte aucune tâche ou aucune ligne de devis,
          de même à `revision_has_tasks_and_lines` — « La désignation comme référence d'une
          révision qui ne porte aucune tâche ou aucune ligne de devis est refusée, en nommant la
          condition manquante » (WF-CYC-0030), le projet restant sans référence
          (`reference_without_tasks`) ; une désignation qui ne se corrige plus, le projet ayant
          reçu un coût réel ou une révision ayant été marquée depuis la dernière désignation,
          `REFERENCE_NOT_CORRECTABLE`, sans paramètre, le code disant la condition que la
          commande nomme `reference_correctable` (WF-REV-0040 ; `reference_not_correctable`) ;
          ou un traitement de fond qui court sur la révision, `no_background_task_running`
          (EP-15/US-0490).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              without_tasks: { $ref: ../../../fixtures/api/reference_without_tasks.json }
              not_correctable: { $ref: ../../../fixtures/api/reference_not_correctable.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/rate-update:
  get:
    operationId: getRateUpdateProposal
    tags: [revisions]
    summary: Écart de taux proposé, catégorie par catégorie
    description: >-
      Présenté à la création d'une révision lorsque le référentiel a changé. Une
      catégorie sans taux pour l'année retenue conserve son taux précédent, projeté par
      le taux d'inflation (WF-REV-0060).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    responses:
      '200':
        description: Proposition de mise à jour.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/RateUpdateProposal }
            examples:
              none: { $ref: ../../../fixtures/api/rate_update_none.json }
              reference_created: { $ref: ../../../fixtures/api/rate_update.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: applyRateUpdate
    tags: [revisions]
    summary: Appliquer la mise à jour des taux
    description: >-
      Reporte les taux de l'année sur les lignes de la révision en cours, pour les catégories
      retenues (WF-REV-0060). Une mise à jour refusée à la création de la révision s'accepte
      ensuite depuis la révision en cours, tant qu'elle n'est pas marquée, et la rechiffre au
      taux de son année de référence pour chaque catégorie acceptée (C-362) ; une révision
      marquée garde les taux et les montants qu'elle a calculés (WF-REF-0130, WF-DAT-0020).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [cost_category_ids]
            properties:
              cost_category_ids:
                type: array
                items: { $ref: ../components/common.yaml#/Uuid }
              lock_version: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '200':
        description: >-
          Taux mis à jour sur les catégories retenues ; la révision, une version de plus.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/Revision }
            examples:
              applied: { $ref: ../../../fixtures/api/rate_update_applied.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Une révision marquée, qui ne se met plus à jour : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` à `revision_draft`, rien n'étant écrit (WF-REV-0060,
          WF-DAT-0020) ; ou un traitement de fond qui court sur la révision,
          `no_background_task_running` (EP-15/US-0490). Aucune commande de la révision ne dit la
          mise à jour d'avance (`RevisionCommand`) : la proposition la présente
          (`getRateUpdateProposal`), et ce 409 seul nomme l'une ou l'autre condition.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_marked: { $ref: ../../../fixtures/api/rate_update_revision_marked.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/comparison:
  get:
    operationId: compareRevisions
    tags: [revisions]
    summary: Comparer deux révisions marquées
    description: >-
      L'arbre de la révision comparée, avec les marques d'un différentiel, et les écarts de
      montants par nature et par sous-projet, rapprochés par l'identifiant de lignée
      (WF-REV-0080, WF-DAT-0030, C-361). La comparaison se lit comme `listNodes` (#1193) : les
      mêmes paramètres, partagés — `kinds`, la recherche, les filtres, le tri des lignes et
      `fields` —, la même réponse — `items`, `totals` et `meta` —, et la même mécanique : la
      structure principale de la révision comparée (`to_revision_id`) est rendue entière, dans
      l'ordre du plan, sans pagination, comme `listNodes` rend une structure, et une lecture
      filtrée — un sous-arbre (`subtree_of`), les seules tâches (`kinds`), une recherche — en
      est une fenêtre, retenue comme `listNodes` la retient ; `fields` choisit ce qu'elle rend
      de chaque nœud. Chaque nœud porte son écart à la révision de base
      (`from_revision_id`) — `difference` et `changes`, toujours rendus —, et ceux que la
      révision de base portait et que la comparée n'a plus sont rendus à la place qu'ils
      avaient, en lecture seule (`NodeDifference`) : une tâche ajoutée, retirée ou modifiée —
      par ses dates, sa durée, son état ou son parent —, une ligne par ses montants ou son
      parent, et une récapitulative dont le contenu change, marquée modifiée. Les filtres, la
      recherche et le tri s'y appliquent comme à la lecture d'un différentiel : un nœud retiré
      s'y juge sur ses valeurs de la révision de base, comme tout autre nœud sur les siennes, et
      sans tri il reste à la place qu'il avait (#1205).
      `subtree_of` nomme une tâche de l'arbre rendu, une tâche retirée comprise : la fenêtre est
      alors le sous-arbre qu'elle avait dans la révision de base, ses nœuds retirés à leur place,
      des totaux nuls — la révision comparée n'en a plus aucune ligne — et les écarts de ses lignes
      retirées. `totals` est celui de `listNodes` sur la révision comparée : les lignes retenues,
      sans les nœuds retirés, qui n'en sont plus (`NodeTotals`) ; `meta` dit la structure de la
      révision comparée (`NodeListMeta`). `amount_deltas` vient dans chaque réponse, comme `totals`,
      et se calcule de même sur les lignes retenues, retirées comprises, quel que soit `kinds` : une
      lecture sans filtre rend les écarts de toute la structure, celle d'un sous-arbre les siens
      (`comparison`) ; une ligne déplacée compte dans la fenêtre de son parent dans la révision
      comparée, pour son écart entier (`amount_deltas`). La grille de la comparaison est celle des
      structures, avec les mêmes marques que la lecture d'un différentiel. Une paire identique — la
      même révision deux fois — rend chaque nœud inchangé et aucun écart de montant, jamais un
      refus.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: from_revision_id
        in: query
        required: true
        schema: { $ref: ../components/common.yaml#/Uuid }
      - name: to_revision_id
        in: query
        required: true
        schema: { $ref: ../components/common.yaml#/Uuid }
      - $ref: ../components/parameters.yaml#/NodeKinds
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/NodeSubtreeOf
      - $ref: ../components/parameters.yaml#/SubprojectFilter
      - $ref: ../components/parameters.yaml#/NodeCostTypeFilter
      - $ref: ../components/parameters.yaml#/NodeOrderItemFilter
      - $ref: ../components/parameters.yaml#/NodeWorkPackageFilter
      - $ref: ../components/parameters.yaml#/NodeCostCategoryFilter
      - $ref: ../components/parameters.yaml#/NodeResourceRoleFilter
      - $ref: ../components/parameters.yaml#/NodeProgressFilter
      - $ref: ../components/parameters.yaml#/NodeCriticalFilter
      - $ref: ../components/parameters.yaml#/NodeSummariesOnly
      - $ref: ../components/parameters.yaml#/NodeMaxLevel
      - $ref: ../components/parameters.yaml#/NodeTimelineFilter
      - $ref: ../components/parameters.yaml#/NodeSortBy
      - $ref: ../components/parameters.yaml#/SortOrder
      - $ref: ../components/parameters.yaml#/NodeFields
    responses:
      '200':
        description: Comparaison.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/RevisionComparison }
            examples:
              witness: { $ref: ../../../fixtures/api/comparison.json }
              volume: { $ref: ../../../fixtures/api/volume/comparison_volume.json }
              identical: { $ref: ../../../fixtures/api/comparison_identical.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures:
  get:
    operationId: listCostStructures
    tags: [revisions]
    summary: Structures de coûts de la révision
    description: >-
      Une structure principale, et le cas échéant des différentiels et une structure
      propre par risque (WF-REV-0100). Chacune dit ses commandes de saisie
      (`available_commands`) : la grille de planning, de devis ou de reste à engager qui la lit
      offre ou non la saisie selon la phase du projet, que le front ne déduit pas (WF-DEV-0050,
      WF-RAE-0040, WF-IHM-0090).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    responses:
      '200':
        description: Structures.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/revisions.yaml#/CostStructure }
            examples:
              witness: { $ref: ../../../fixtures/api/structures.json }
              amendments: { $ref: ../../../fixtures/api/structures_amendments.json }
              without_tasks: { $ref: ../../../fixtures/api/structures_without_tasks.json }
              estimator: { $ref: ../../../fixtures/api/structures_estimator.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createCostStructure
    tags: [revisions]
    summary: Créer un différentiel ou un devis de risque
    description: >-
      Plusieurs différentiels peuvent coexister, et chacun est fusionné ou abandonné
      indépendamment (WF-REV-0100).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/StructureCreate }
    responses:
      '201':
        description: Structure créée.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/CostStructure }
            examples:
              amendment: { $ref: ../../../fixtures/api/amendment_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/merge:
  get:
    operationId: getStructureMergeReport
    tags: [revisions]
    summary: Compte rendu préalable de la fusion d'un différentiel
    description: >-
      « Avant application, la fusion présente un compte rendu : tâches et lignes ajoutées,
      modifiées et retirées, tâches démarrées qui seront terminées, et motifs de refus
      (WF-PLA-0030, WF-PLA-0150, WF-PLA-0170) ; elle n'est appliquée qu'après confirmation »
      (WF-REV-0050). Une lecture, qui n'écrit rien : abandonner à cette étape, c'est ne pas
      confirmer, et la révision reste inchangée. Le compte rendu se lit comme celui d'un import
      (`StructureMergeReport`) ; tant que `refusals` n'est pas vide, la fusion ne s'applique pas,
      et l'écran n'en offre pas la confirmation. Il décrit la révision en cours à l'instant de la
      lecture, et la fusion confirmée (`mergeCostStructure`) juge de nouveau : une saisie faite
      entre-temps dans la structure principale ou dans le différentiel fait refuser la
      confirmation par 412, les compteurs que le compte rendu a lus ayant avancé ; ce qui change
      hors des deux arbres — un calendrier du référentiel, le lotissement — et la rendrait refusée
      fait échouer la tâche de fond sur le motif du refus. Seul un
      différentiel non fusionné de la révision en cours a un compte rendu ; une autre structure
      est refusée par 409, comme sa fusion (EP-14/L42s).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    responses:
      '200':
        description: Ce que la fusion ferait, et ce qui la refuse.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/StructureMergeReport }
            examples:
              applicable: { $ref: ../../../fixtures/api/structure_merge_report.json }
              started_task: { $ref: ../../../fixtures/api/structure_merge_report_started_task.json }
              refused: { $ref: ../../../fixtures/api/structure_merge_report_refused.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: mergeCostStructure
    tags: [revisions]
    summary: Fusionner un différentiel dans la structure principale
    description: >-
      La fusion ne touche que les montants budgétés des lignes que le différentiel
      désigne ; les montants réestimés sont conservés. Une tâche déjà démarrée n'est
      jamais retirée : son reste à engager est porté à zéro. La révision marquée qui en
      résulte devient la référence (WF-REV-0050). Une tâche que la fusion ajoute ne porte aucun
      rattachement au lotissement, le différentiel n'en portant pas, et une tâche existante que
      le différentiel modifie conserve le sien (WF-PLA-0170). Confiée au worker et inscrite au
      journal d'audit (WF-ARC-0090, WF-SEC-0030). Une fusion qui donnerait à une tâche de la
      structure principale une ligne de main-d'œuvre dont le rôle la laisserait sans aucune
      heure travaillée dans la semaine échoue sans rien fusionner : la tâche de fond finit en
      échec, `problem.code` à `TASK_WITHOUT_WORKING_HOURS`, ses `params` nommant les rôles et
      les tâches en cause (WF-PLA-0010). « Une fusion qui déplacerait la tâche d'un poste hors du
      sous-arbre de la tâche de son lot est refusée en nommant la tâche » (WF-PLA-0170) : elle
      échoue de même sans rien fusionner, `problem.code` à `ORDER_ITEM_OUTSIDE_WORK_PACKAGE`,
      `params.work_package_task` nommant la tâche du lot et `order_item_tasks` celles des postes
      qui en sortiraient, chacune par son nœud et son libellé (`Problem.params`), comme
      `TASK_WITHOUT_WORKING_HOURS` (WF-IHM-0080 ; `task_merge_outside_work_package`). Le compte
      rendu préalable (`getStructureMergeReport`, WF-REV-0050) dit ces motifs avant la
      confirmation, qui porte les compteurs des deux structures qu'il a lus : refusée par 412 si
      l'une a changé depuis, elle n'applique jamais un compte rendu que personne n'a vu
      (EP-14/L42s).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/StructureMerge }
    responses:
      '202':
        description: Fusion mise en file.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              queued: { $ref: ../../../fixtures/api/task_merge_queued.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '412':
        description: >-
          La structure principale ou le différentiel ont changé depuis le compte rendu confirmé —
          une tâche démarrée, une ligne réestimée, le différentiel modifié — : le compte rendu est
          périmé, et rien n'est fusionné (WF-REV-0050, WF-IHM-0110 ; EP-14/L42s). Le contrôle des
          deux compteurs et le dépôt de la tâche de fusion se font en une seule transaction, sous le
          verrou des deux structures : aucune écriture ne se glisse entre eux. `STALE_LOCK_VERSION`,
          `params.expected_lock_version` le compteur courant du différentiel, l'objet que le chemin
          nomme, même quand seule la structure principale a changé, et rien d'autre, comme tout 412
          (#296) ; le client relit le compte rendu, qui rend l'un et l'autre.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              report_stale: { $ref: ../../../fixtures/api/merge_report_stale.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes:
  get:
    operationId: listNodes
    tags: [revisions]
    summary: Arbre commun de la structure
    description: >-
      Les mêmes tâches, vues du côté du temps ou du côté de l'argent : une tâche porte
      ses lignes de devis (§3.5.1, WF-DEV-0020). `row_number` et `level` sont calculés
      à la lecture ; les valeurs calculées ne sont pas saisissables (WF-IHM-0030). C'est
      la source des quatre vues de l'arbre : grille de planning (WF-PLA-0080), diagramme
      de Gantt en lecture seule (WF-PLA-0090), arborescence de tâches (WF-PLA-0110) et
      grille de devis (WF-DEV-0050) — et des chronologies, qui n'en lisent que les tâches
      inscrites (WF-PLA-0140).

      La structure est rendue entière, sans pagination : une révision porte au plus dix
      mille objets (§4.6.2), et un arbre ne se lit pas par pages. Le tri, les filtres et
      les totaux sont l'affaire du serveur, et le front n'ordonne ni ne somme rien. Une
      grille arborescente ne se trie pas : les tâches gardent l'ordre de l'arbre, et le tri
      n'y est qu'un tri des lignes de devis sous chaque tâche, chaque ligne restant sous la
      sienne (WF-IHM-0060, `sort_by`) : trié par montant décroissant, le devis rend sous
      chaque tâche ses lignes du plus grand montant au plus petit, et ses tâches à leur place
      (`estimate_sorted`) ; une ligne sans heures vient après les autres dans l'ordre
      croissant des heures, avant dans le décroissant (`estimate_hours`). Les grilles de devis
      et de reste à engager trient ainsi, dans les deux sens, par chacune des colonnes qu'elles
      présentent pour les lignes ; la grille de planning, qui ne rend pas les lignes, ne
      propose aucun tri, ni le diagramme de Gantt, l'arborescence de tâches ou une
      chronologie. Un filtre sur une
      tâche — avancement, criticité, sous-arbre, récapitulative, niveau, chronologie —
      retient les tâches qui le satisfont avec les lignes qu'elles portent ; un filtre sur
      une ligne — nature, catégorie, rôle, sous-projet — retient les lignes qui le
      satisfont ; la recherche porte sur les libellés des deux, et une tâche retenue par
      elle garde ses lignes. Les filtres se combinent, et les ancêtres des nœuds retenus
      sont rendus pour que l'arbre reste lisible — sauf avec `timeline_id` : une chronologie
      n'est pas un arbre, et ne présente que les tâches qui y sont inscrites (WF-PLA-0140).
      Les totaux sont ceux des lignes retenues. Le filtre par lot ou par poste
      (`work_package_id`, `order_item_id`) retient le sous-arbre de la tâche rattachée au lot
      ou au poste : le lotissement sert de grille de lecture par ce seul rattachement, que seule
      la structure principale porte (WF-PLA-0170). `kinds` n'est pas un filtre : il choisit ce
      que la grille rend — le planning ne rend pas les lignes —, et les totaux ne changent
      pas avec lui.

      L'arborescence de tâches lit `kinds=task`, `summaries_only` et `max_level` : les seules
      récapitulatives, jusqu'au niveau demandé, sous le nœud du projet que le front dessine
      (WF-PLA-0110), et offre les niveaux que `meta.summary_depth` dit exister, celui de la
      plus profonde récapitulative de la structure, quels que soient les filtres ; une
      chronologie lit `kinds=task` et `timeline_id` (WF-PLA-0140). Le front ne trie ni ne
      sélectionne rien de ce qu'il reçoit.

      `row_number` numérote toute la structure, ses tâches et ses lignes dans l'ordre du
      plan : un nœud garde son numéro quels que soient `kinds`, les filtres, la recherche
      et le tri, et un prédécesseur est nommé par le sien même quand la lecture ne le
      rend pas (`predecessor_row_number`, WF-PLA-0080).

      `fields` choisit ce que la lecture rend de chaque nœud : une grille n'en demande que
      ce qu'elle affiche, sans quoi six mille nœuds entiers pèsent plusieurs mégaoctets
      (§4.6.2). Chaque nom est une propriété de `Node` — une facette nommée ainsi est
      rendue entière — ou une propriété d'une facette, `task.<propriété>` ou
      `estimate_line.<propriété>`, qui rend la facette avec ses seules propriétés nommées ;
      `node_id`, `row_number`, `level` et `lock_version` sont toujours rendus. Une facette
      dont rien n'est nommé est omise. Sans `fields`, chaque nœud est rendu entier. Les
      propriétés que `Node` et ses facettes exigent le sont d'une lecture sans `fields` :
      une lecture qui en nomme ne rend que ce qu'elle nomme.

      La lecture d'un différentiel est un diff avec la structure principale de sa révision, que
      le serveur calcule et que le front ne recalcule pas (WF-REV-0100, C-361) : chaque nœud
      porte son écart, `difference` — ajouté, retiré, modifié ou inchangé — et ce qui change de
      lui, `changes`, rapprochés par la lignée, et les nœuds que le différentiel retire sont
      rendus à la place qu'ils avaient, entre les nœuds qui les entouraient, en lecture seule
      (`NodeDifference`) ; un nœud déplacé est rendu une fois, à sa place nouvelle, modifié par
      son parent. `difference` et `changes` y sont toujours rendus, comme les quatre ; les
      totaux ne comptent pas les nœuds retirés, qui ne sont plus de la structure (`nodes_amendment`).
      Un filtre, la recherche et un tri jugent un nœud retiré sur ses valeurs de base — celles
      de la structure principale, qu'il porte encore —, comme tout autre nœud sur les siennes :
      un filtre sur une tâche le retient si ses valeurs de base le satisfont, un tri range une
      ligne retirée parmi les lignes de sa tâche par sa valeur de base dans la colonne triée, et
      sans tri il reste à la place qu'il avait (#1205).
      Sur la structure principale et sur le devis propre d'un risque, `difference` est nul ou
      omis.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeKinds
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/NodeSubtreeOf
      - $ref: ../components/parameters.yaml#/SubprojectFilter
      - $ref: ../components/parameters.yaml#/NodeCostTypeFilter
      - $ref: ../components/parameters.yaml#/NodeOrderItemFilter
      - $ref: ../components/parameters.yaml#/NodeWorkPackageFilter
      - $ref: ../components/parameters.yaml#/NodeCostCategoryFilter
      - $ref: ../components/parameters.yaml#/NodeResourceRoleFilter
      - $ref: ../components/parameters.yaml#/NodeProgressFilter
      - $ref: ../components/parameters.yaml#/NodeCriticalFilter
      - $ref: ../components/parameters.yaml#/NodeSummariesOnly
      - $ref: ../components/parameters.yaml#/NodeMaxLevel
      - $ref: ../components/parameters.yaml#/NodeTimelineFilter
      - $ref: ../components/parameters.yaml#/NodeSortBy
      - $ref: ../components/parameters.yaml#/SortOrder
      - $ref: ../components/parameters.yaml#/NodeFields
    responses:
      '200':
        description: >-
          Nœuds, en parcours profondeur d'abord, leurs totaux, et ce que la lecture dit de la
          structure elle-même.
        content:
          application/json:
            schema:
              type: object
              required: [items, totals, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/revisions.yaml#/Node }
                totals: { $ref: ../components/schemas/revisions.yaml#/NodeTotals }
                meta: { $ref: ../components/schemas/revisions.yaml#/NodeListMeta }
            examples:
              volume: { $ref: ../../../fixtures/api/volume/nodes_thousand.json }
              witness: { $ref: ../../../fixtures/api/nodes.json }
              milestone: { $ref: ../../../fixtures/api/nodes_milestone.json }
              estimate: { $ref: ../../../fixtures/api/nodes_estimate.json }
              estimate_sorted: { $ref: ../../../fixtures/api/nodes_estimate_sorted.json }
              estimate_hours: { $ref: ../../../fixtures/api/nodes_estimate_hours.json }
              installation: { $ref: ../../../fixtures/api/nodes_installation.json }
              core: { $ref: ../../../fixtures/api/nodes_core.json }
              planning: { $ref: ../../../fixtures/api/nodes_planning.json }
              risk_occurred: { $ref: ../../../fixtures/api/nodes_risk_occurred.json }
              nested: { $ref: ../../../fixtures/api/nodes_nested.json }
              summaries: { $ref: ../../../fixtures/api/nodes_summaries.json }
              summaries_leaves: { $ref: ../../../fixtures/api/nodes_summaries_leaves.json }
              timeline: { $ref: ../../../fixtures/api/nodes_timeline.json }
              empty: { $ref: ../../../fixtures/api/nodes_empty.json }
              amendment: { $ref: ../../../fixtures/api/nodes_amendment.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createNode
    tags: [revisions]
    summary: Créer une tâche ou une ligne de devis
    description: >-
      Refusé sur une révision marquée (WF-DAT-0020) et sur un projet terminal (WF-CYC-0100). La
      même écriture depuis les trois grilles : la phase du projet ne refuse rien ici, c'est la
      commande de la structure qui dit quelle grille la saisit (`CostStructure.available_commands`).
      Une tâche créée sans mode ni durée — depuis la grille de devis ou de reste à engager, qui ne
      les présentent pas — est une feuille en mode automatique, d'une durée d'un jour, sans
      prédécesseur (WF-DEV-0050, WF-RAE-0040). Une ligne ajoutée après la référence porte un
      montant budgété nul (WF-RAE-0050). Une ligne de main-d'œuvre dont le rôle laisserait sa
      tâche sans aucune heure travaillée dans la semaine
      — son calendrier ne recoupe jamais celui d'un autre rôle de la tâche, ou, sur une tâche
      dont ce rôle est le seul, il n'a aucune heure dans la semaine (EP-14/L42s) — est refusée
      par 422 `TASK_WITHOUT_WORKING_HOURS`, `params` nommant les rôles et la tâche (WF-PLA-0010) ;
      une tâche créée rattachée à un lot ou à un poste suit les règles du rattachement
      (`TaskFacetWrite`, WF-PLA-0170). Une ligne dont la catégorie relève d'une nature de type
      provision n'est créée que par la déclaration d'un risque : sa création à la main est
      refusée par 422 `VALIDATION_FAILED`, `fields` sur `/estimate_line/cost_category_id`, motif
      `PROVISION_CATEGORY_RESERVED` (WF-DEV-0020, WF-RIS-0010). Une tâche créée dont la durée ou
      les dates porteraient la durée du projet au-delà de quinze ans est refusée par 422
      `PROJECT_HORIZON_EXCEEDED`, `params.task` la nommant par le libellé envoyé, son nœud nul
      (WF-PLA-0150).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/NodeCreate }
    responses:
      '201':
        description: >-
          Nœud créé, avec ses ancêtres recalculés et les totaux de la structure
          (`NodesWritten`).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              created: { $ref: ../../../fixtures/api/node_created.json }
              created_child: { $ref: ../../../fixtures/api/node_created_child.json }
              line_created: { $ref: ../../../fixtures/api/estimate_line_created.json }
              line_created_after_subtask:
                $ref: ../../../fixtures/api/estimate_line_created_after_subtask.json
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          L'état d'un nœud interdit la création, rien n'étant créé : une ligne sous une tâche
          terminée, qui se rouvre d'abord depuis le Kanban (WF-DEV-0050, WF-RAE-0030),
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `task_not_completed`
          (`completed_refused` ; #1184) ; ou un traitement de fond qui court sur la révision,
          `no_background_task_running`, comme la commande de la structure le dit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              completed_refused:
                $ref: ../../../fixtures/api/estimate_line_completed_refused.json
      '422':
        description: >-
          Entité refusée par une règle métier, `fields` localisant chaque refus : une ligne de
          type provision pour risques créée à la main (`PROVISION_CATEGORY_RESERVED`, WF-DEV-0020), un
          rattachement au lotissement refusé (`TaskFacetWrite`, WF-PLA-0170), un délai de
          paiement négatif (`/estimate_line/payment_delay_days`, `VALUE_OUT_OF_RANGE`,
          `params.minimum` à `0`), un nœud après lequel se placer qui n'est pas un frère sous le
          parent visé (`/after_node_id`, `NODE_NOT_SIBLING`, `NodeCreate` ; #1183), un champ que la
          ligne n'accepte pas
          (`FIELD_NOT_ACCEPTED`, `EstimateLineWrite` ; EP-14/L42s) ; ou une ligne qui laisserait sa
          tâche sans heure travaillée (`TASK_WITHOUT_WORKING_HOURS`, WF-PLA-0010) ; ou, sans
          `fields`, une tâche qui porterait la durée du projet au-delà de quinze ans
          (`PROJECT_HORIZON_EXCEEDED`, `params.task`, WF-PLA-0150).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              provision_refused: { $ref: ../../../fixtures/api/estimate_line_provision_refused.json }
              out_of_range: { $ref: ../../../fixtures/api/node_create_out_of_range.json }
              horizon_exceeded: { $ref: ../../../fixtures/api/node_create_horizon_exceeded.json }
              after_not_sibling: { $ref: ../../../fixtures/api/node_create_after_not_sibling.json }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}:
  delete:
    operationId: deleteNode
    tags: [revisions]
    summary: Supprimer un nœud
    description: >-
      La suppression d'une tâche emporte ses lignes et ses liaisons (WF-PLA-0070, WF-DAT-0090) ;
      celle d'une récapitulative emporte aussi ses subordonnées, leurs lignes et leurs liaisons,
      et le devis diminue d'autant (Vérif de WF-PLA-0070). Refusée sur une tâche portant un coût
      réel ou déjà démarrée, selon WF-PLA-0070. Une récapitulative qui perd sa dernière
      subordonnée garde son rattachement au lotissement (WF-PLA-0170). Une écriture de grille
      comme les autres : elle rend ses ancêtres recalculés, les totaux et le compteur de la
      structure, qui a avancé (`NodesWritten`), pour que la grille montre juste et que le collage
      suivant porte le bon compteur (WF-IHM-0110). Les liaisons emportées peuvent redater les
      successeurs de la tâche et déplacer le chemin critique : ces tâches sont rendues dans
      `rescheduled` (WF-PLA-0020, WF-PLA-0100), et leurs montants corrigés dans `reinflated`
      (WF-DEV-0040). Comme toute modification, elle porte le compteur lu du nœud supprimé
      (`lock_version`, WF-IHM-0110) : un nœud écrit depuis sa lecture n'est pas supprimé (#1210).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
      - name: lock_version
        in: query
        required: true
        description: >-
          Le compteur du nœud supprimé, tel que la grille l'a lu (`Node.lock_version`) : périmé,
          la suppression est refusée par 412 et rien n'est supprimé (WF-IHM-0110, #1210). Seul
          le compteur du nœud désigné se juge, pas ceux des subordonnées qu'il emporte.
        schema: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '200':
        description: >-
          Nœud supprimé ; `nodes` est vide, les ancêtres et les totaux sont recalculés sans lui.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              deleted: { $ref: ../../../fixtures/api/node_deleted.json }
              summary_deleted: { $ref: ../../../fixtures/api/node_summary_deleted.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '412':
        description: >-
          `STALE_LOCK_VERSION` : le nœud a été écrit depuis sa lecture, et rien n'est supprimé ;
          `params.expected_lock_version` est son compteur courant (WF-IHM-0110, #1210).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/node_delete_stale.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` sur `/query/lock_version` : le compteur manque ou n'est
          pas un entier positif ou nul.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/dependencies:
  get:
    operationId: getComputedValueDependencies
    tags: [revisions]
    summary: Ce dont dépend une valeur calculée
    description: >-
      Lue à la demande, quand l'utilisateur tente de saisir une valeur que le serveur
      calcule : les règles qui la calculent, et les lignes dont elle est tirée, nommées par
      leur numéro et leur libellé, que la recherche ou les filtres de la grille les
      retiennent ou non. Une tentative de saisie sur une valeur calculée est refusée en
      nommant ce dont elle dépend (WF-IHM-0030) ; les subordonnées d'une récapitulative
      sont ses subordonnées directes (WF-PLA-0040). Un champ que le serveur ne calcule pas
      pour ce nœud — il se saisit — est refusé (422, `VALIDATION_FAILED`, `params.field`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
      - name: field
        in: query
        required: true
        description: Le champ calculé dont la saisie a été tentée.
        schema: { $ref: ../components/schemas/revisions.yaml#/ComputedValueField }
    responses:
      '200':
        description: Ce dont dépend la valeur.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/ComputedValueDependencies }
            examples:
              volume: { $ref: ../../../fixtures/api/volume/summary_dependencies.json }
              summary: { $ref: ../../../fixtures/api/dependencies_summary.json }
              summary_moved: { $ref: ../../../fixtures/api/dependencies_summary_moved.json }
              labour: { $ref: ../../../fixtures/api/dependencies_labour.json }
              task_amount: { $ref: ../../../fixtures/api/dependencies_task_amount.json }
              provision: { $ref: ../../../fixtures/api/dependencies_provision.json }
              manual_float: { $ref: ../../../fixtures/api/dependencies_manual_float.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          Le serveur ne calcule pas ce champ pour ce nœud : il se saisit.
          `VALIDATION_FAILED`, et `params.field` nomme le champ demandé.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              entered: { $ref: ../../../fixtures/api/dependencies_entered.json }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/task:
  patch:
    operationId: updateTaskFacet
    tags: [revisions]
    summary: Modifier la facette temps d'une tâche
    description: >-
      Les dates sont saisissables en mode manuel seulement (WF-PLA-0020) ; celles d'une
      récapitulative sont calculées (WF-PLA-0040). Un jalon a une durée nulle
      (WF-PLA-0050). La durée se saisit dans l'une des unités de travail ou de temps
      écoulé, et se conserve avec elle (WF-PLA-0160). La durée du projet ne peut dépasser
      quinze ans (WF-PLA-0150) : une durée, des dates ou un mode qui l'y porteraient sont refusés
      par 422 `PROJECT_HORIZON_EXCEEDED`, `params.task` nommant la tâche. Le rattachement à un lot ou à un poste du lotissement se pose,
      se change et se retire ici, sur une tâche récapitulative, feuille ou jalon, aux règles
      de `TaskFacetUpdate` (WF-PLA-0170). Seul le compteur lu est exigé : seul ce qui est
      envoyé change (WF-IHM-0040), et le nœud dit ce qu'il accepte (`editable_fields`). Le
      début et la fin se saisissent par leur seule date : le serveur en complète les heures sur
      le calendrier applicable de la tâche (WF-PLA-0010), le début au début de son jour, la fin
      au bout des heures que le calendrier accorde ce jour-là ; un jour sans heure travaillée est
      gardé, le début et la fin à `0` (`WorkInstantWrite`, #1244).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/TaskFacetUpdate }
          examples:
            dates_entered: { $ref: ../../../fixtures/api/task_dates_sent.json }
    responses:
      '200':
        description: >-
          Tâche modifiée, avec les dates et la criticité recalculées, ses ancêtres recalculés,
          les tâches qu'une durée saisie redate — ses successeurs, et ce que le chemin critique
          déplace —, le montant corrigé des lignes et des tâches qu'elle déplace d'une année à
          l'autre et les totaux de la structure (`NodesWritten`, WF-PLA-0020, WF-DEV-0040).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              renamed: { $ref: ../../../fixtures/api/task_renamed.json }
              lengthened: { $ref: ../../../fixtures/api/volume/task_lengthened.json }
              attached: { $ref: ../../../fixtures/api/task_attached.json }
              mode_changed: { $ref: ../../../fixtures/api/task_mode_changed.json }
              dates_entered: { $ref: ../../../fixtures/api/task_dates_entered.json }
              duration_entered: { $ref: ../../../fixtures/api/task_duration_entered.json }
              description_entered: { $ref: ../../../fixtures/api/task_description_entered.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Entité refusée par une règle métier, `fields` localisant chaque refus : une valeur
          calculée — une date d'une tâche en mode automatique, sans paramètre, la grille lisant ce
          dont elle dépend (`getComputedValueDependencies`) — (`COMPUTED_VALUE`, WF-PLA-0020,
          WF-IHM-0030), ou un rattachement au lotissement refusé —
          tâche hors de la structure principale, lot ou poste inconnu, lot et poste ensemble,
          lot ou poste déjà porté par une autre tâche, nommée par son nœud et son libellé, tâche
          d'un poste sortie du sous-arbre de la tâche de son lot, les tâches du lot et des postes
          nommées par leur nœud et leur libellé (WF-PLA-0170, `TaskFacetUpdate`). Ou, sans
          `fields`, une saisie qui porterait la durée du projet au-delà de quinze ans :
          `PROJECT_HORIZON_EXCEEDED`, `params.task` nommant la tâche par son nœud et son libellé
          (WF-PLA-0150). Ou des heures envoyées avec une date hors de `0` aux heures que le
          calendrier de la tâche accorde ce jour-là : `fields` sur `/start/hours` ou
          `/finish/hours` par `VALUE_OUT_OF_RANGE`, `fields[].params.minimum` à `0` ou `maximum`
          aux heures du jour, la seule borne franchie, `0` un jour sans heure travaillée
          (`WorkInstantWrite`, WF-PLA-0010, WF-DAT-0100, #1244).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              date_computed: { $ref: ../../../fixtures/api/task_date_computed_refused.json }
              horizon_exceeded: { $ref: ../../../fixtures/api/task_horizon_exceeded.json }
              hours_beyond_day: { $ref: ../../../fixtures/api/task_hours_beyond_day.json }
              attach_refused: { $ref: ../../../fixtures/api/task_attach_refused.json }
              attach_outside: { $ref: ../../../fixtures/api/task_attach_outside_work_package.json }
              attach_exclusive: { $ref: ../../../fixtures/api/task_attach_exclusive.json }
              attach_main_structure_only: { $ref: ../../../fixtures/api/task_attach_main_structure_only.json }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/estimate-line:
  patch:
    operationId: updateEstimateLine
    tags: [estimate]
    summary: Modifier la facette argent d'une ligne de devis
    description: >-
      Les montants sont calculés et non saisissables : celui à l'année de référence par la
      ligne, le budgété par la référence, le réestimé par les revues, le corrigé de
      l'inflation par l'année de consommation (WF-DEV-0020, WF-DEV-0030, WF-DEV-0040). Une
      ligne de provision est calculée depuis son risque (WF-RIS-0010). Seul le compteur lu est
      exigé : seul ce qui est envoyé change (WF-IHM-0040), et le nœud dit ce qu'il accepte
      (`editable_fields`). Un rôle changé change le calendrier de la tâche, donc ses dates
      (WF-PLA-0010) : ses successeurs redatés sont rendus dans `rescheduled`, et dans `reinflated`
      chaque ligne ou tâche non récapitulative dont le montant corrigé change — les autres lignes
      qu'elle porte, celles des successeurs qui changent d'année, et leurs tâches. Une ligne
      dont la tâche est démarrée ou terminée ne quitte pas un sous-projet qui a reçu des coûts
      réels, et ne nomme pas son sous-projet dans `editable_fields` ; celle d'une tâche non
      démarrée en change (WF-PRJ-0050).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/EstimateLineUpdate }
    responses:
      '200':
        description: >-
          Ligne modifiée, avec son montant recalculé, les montants de ses ancêtres et les
          totaux de la structure (`NodesWritten`).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              entered: { $ref: ../../../fixtures/api/estimate_line_entered.json }
              updated: { $ref: ../../../fixtures/api/estimate_line_updated.json }
              redated: { $ref: ../../../fixtures/api/estimate_line_redated.json }
              subproject_changed: { $ref: ../../../fixtures/api/estimate_line_subproject_changed.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Taux horaire manquant pour l'année de référence, ou rôle absent sur une ligne
          de main-d'œuvre (WF-DEV-0010, WF-DEV-0020) ; ou un rôle changé qui laisserait la tâche
          sans heure travaillée dans la semaine — son calendrier ne recoupe jamais celui d'un autre
          rôle de la tâche, ou, sur une tâche dont ce rôle est le seul, il n'a aucune heure dans la
          semaine (EP-14/L42s) — : `TASK_WITHOUT_WORKING_HOURS`, `params.resource_role_ids` et
          `params.tasks` nommant les rôles et la tâche, inchangée (WF-PLA-0010) ; ou une
          catégorie de type provision pour risques donnée à une ligne saisie : `VALIDATION_FAILED`,
          `fields` sur `/cost_category_id`, motif `PROVISION_CATEGORY_RESERVED` (WF-DEV-0020) ;
          ou un délai de paiement négatif : `fields` sur `/payment_delay_days`,
          `VALUE_OUT_OF_RANGE`, `params.minimum` à `0` (WF-IND-0100) ; ou un champ que la ligne
          n'accepte pas — le délai de paiement d'une ligne de provision, qui n'en porte pas —,
          motif `FIELD_NOT_ACCEPTED` sur son champ (`EstimateLineUpdate` ; EP-14/L42s) ; ou une
          ligne d'une tâche démarrée ou terminée passée hors d'un sous-projet qui a reçu des coûts
          réels : `fields` sur `/subproject_id`, motif `SUBPROJECT_HAS_ACTUAL_COSTS`,
          `params.subproject` nommant ce sous-projet (WF-PRJ-0050).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              payment_delay_out_of_range: { $ref: ../../../fixtures/api/estimate_line_payment_delay_out_of_range.json }
              subproject_has_actual_costs: { $ref: ../../../fixtures/api/estimate_line_subproject_has_actual_costs.json }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/predecessors:
  put:
    operationId: setPredecessors
    tags: [planning]
    summary: Remplacer les prédécesseurs d'une tâche
    description: >-
      Les quatre types de liaison, avec un décalage positif ou négatif dans l'unité de sa
      saisie — temps de travail, temps écoulé ou pourcentage de la durée du prédécesseur
      (WF-PLA-0030, WF-PLA-0160). Des prédécesseurs qui fermeraient une boucle de liaisons sont
      refusés, comme une liaison entre une récapitulative et l'une de ses subordonnées
      (WF-PLA-0030, WF-PLA-0040), et des liaisons qui porteraient la durée du projet au-delà de
      quinze ans (WF-PLA-0150) : 422, rien n'est écrit.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/PredecessorsReplace }
    responses:
      '200':
        description: >-
          Liaisons enregistrées, dates recalculées ; les ancêtres, les tâches que la liaison
          redate — les successeurs, et ce que le chemin critique déplace — et les totaux avec
          (`NodesWritten`, WF-PLA-0020, WF-PLA-0100).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              set: { $ref: ../../../fixtures/api/predecessor_set.json }
              entered: { $ref: ../../../fixtures/api/predecessors_entered.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Liaisons refusées, rien n'est écrit : une boucle de liaisons, `LINK_CYCLE`,
          `params.cycle` nommant ses tâches par leur nœud et leur libellé, dans l'ordre des
          liaisons, de la tâche saisie au prédécesseur envoyé qui la suit déjà (WF-PLA-0030) ; une
          liaison entre une récapitulative et l'une de ses subordonnées, `LINK_FORBIDDEN`, sans
          paramètre (WF-PLA-0040) ; ou des liaisons qui porteraient la durée du projet au-delà de
          quinze ans, `PROJECT_HORIZON_EXCEEDED`, `params.task` nommant la tâche saisie
          (WF-PLA-0150) ; ou une valeur hors règle, `fields` la localisant, comme la réponse
          commune `UnprocessableEntity` le dit. Le code nomme la raison, que la colonne des
          prédécesseurs dit à sa cellule.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              cycle_refused: { $ref: ../../../fixtures/api/predecessors_cycle_refused.json }
              forbidden: { $ref: ../../../fixtures/api/predecessors_forbidden.json }
              horizon_exceeded: { $ref: ../../../fixtures/api/predecessors_horizon_exceeded.json }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/progress:
  put:
    operationId: setTaskProgress
    tags: [remaining]
    summary: Démarrer ou terminer une tâche
    description: >-
      La date du geste fait foi et situe la valeur acquise (WF-RAE-0030, WF-IND-0030).
      Refusé sur une récapitulative, dont l'état est dérivé (WF-PLA-0040).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/ProgressUpdate }
    responses:
      '200':
        description: >-
          État enregistré ; l'avancement des récapitulatives au-dessus recalculé
          (`NodesWritten`).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/remaining:
  put:
    operationId: setLineRemaining
    tags: [remaining]
    summary: Réestimer une ligne
    description: >-
      Refusé sur une ligne d'une tâche terminée ; une tâche non démarrée se réestime
      aussi, et un reste à engager nul pour toutes les lignes d'une tâche la termine, à la
      date demandée à la validation (`completed_on`, WF-RAE-0040, WF-PLA-0130) ; une tâche non
      démarrée qui n'est pas un jalon passe par l'état démarré, démarrée et terminée à cette
      même date (WF-RAE-0030). La ligne dit elle-même si elle accepte la réestimation
      (`remaining_entry`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/RemainingUpdate }
    responses:
      '200':
        description: >-
          Réestimation enregistrée ; les montants réestimés des ancêtres et les totaux
          recalculés (`NodesWritten`).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              reestimated: { $ref: ../../../fixtures/api/remaining_reestimated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED` : une saisie qui termine la tâche sans date de terminaison —
          motif `COMPLETION_DATE_REQUIRED` sur `/completed_on`, `fields[].params.task_node_id`
          nommant la tâche (WF-RAE-0040, WF-PLA-0130) ; rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              completion_date_required: { $ref: ../../../fixtures/api/remaining_completion_date_required.json }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/tracking:
  put:
    operationId: setNodeTracking
    tags: [planning]
    summary: Inscrire ou retirer une tâche des suivis
    description: >-
      Une tâche s'inscrit à une chronologie, un jalon au suivi temps/temps ; les jalons
      contractuels ne sont rien d'autre que des jalons inscrits (WF-PLA-0060). Une tâche de la
      structure principale le dit d'avance, `task.tracking` dans ses `editable_fields` (#1065).
      Le suivi temps/temps est celui des jalons : une tâche qui n'est pas un jalon, envoyée avec
      une entrée `milestone_tracking`, est refusée par 422 `VALIDATION_FAILED`, `fields` sur le
      genre de cette entrée (`/entries/<n>/kind`, `n` son rang dans `entries`, à partir de 0),
      motif `MILESTONE_REQUIRED`, et rien n'est écrit (#1159).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [entries, lock_version]
            properties:
              entries:
                type: array
                items: { $ref: ../components/schemas/revisions.yaml#/TrackingEntry }
              lock_version: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '200':
        description: Inscriptions enregistrées (`NodesWritten`).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              tracked: { $ref: ../../../fixtures/api/node_tracked.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Refusé, rien n'étant écrit : le suivi temps/temps d'une tâche qui n'est pas un jalon,
          `VALIDATION_FAILED`, `fields` sur `/entries/<n>/kind`, motif `MILESTONE_REQUIRED`
          (WF-PLA-0060, #1159) ; ou une valeur hors règle, `fields` la localisant, comme la réponse
          commune `UnprocessableEntity` le dit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              milestone_refused: { $ref: ../../../fixtures/api/node_tracking_milestone_refused.json }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/move:
  post:
    operationId: moveNodes
    tags: [revisions]
    summary: Déplacer des nœuds dans l'arbre
    description: >-
      Déplacer une ligne, ou la tâche au-dessus d'elle, change sa tâche porteuse, qui
      est résolue à la lecture (§3.5.1). La hiérarchie obtenue reste celle d'un arbre de
      tâches et de récapitulatives (WF-PLA-0040). Un déplacement change la structure de
      l'arbre, et peut redater des tâches qui ne sont ni déplacées ni ancêtres : elles sont
      rendues dans `rescheduled` (WF-PLA-0020), et leurs montants corrigés dans `reinflated`
      (WF-DEV-0040). Une récapitulative qui perd sa dernière subordonnée garde son
      rattachement au lotissement ; un déplacement qui sortirait la tâche d'un poste du
      sous-arbre de la tâche de son lot est refusé (WF-PLA-0170, `NodeMove`), comme un
      déplacement qui porterait la durée du projet au-delà de quinze ans (WF-PLA-0150). La
      récapitulative qui reçoit un nœud le couvre, avec ses ancêtres : ce qui la précède le
      précède, ce qui la suit le suit (WF-PLA-0040). Un déplacement ou une mise en retrait qui
      relierait ainsi une récapitulative à l'une de ses subordonnées — mettre en retrait une
      tâche sous celle au-dessus d'elle, qui est son prédécesseur — est refusé par 422
      `LINK_FORBIDDEN` ; un déplacement qui fermerait une boucle de liaisons à travers elle, par
      422 `LINK_CYCLE`, `params.cycle` nommant les tâches de la boucle (WF-PLA-0030) — la chaîne
      peut traverser la hiérarchie, une récapitulative couvrant ses subordonnées (#1169) — ;
      rien n'est écrit. Une sélection se juge sur la structure que le déplacement laisserait,
      tous ses nœuds déplacés, et le refus nomme le premier nœud en cause dans l'ordre du plan de
      la structure lue ; l'ordre de `node_ids` ne règle que le placement (`NodeMove`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/NodeMove }
          examples:
            mixed: { $ref: ../../../fixtures/api/nodes_move_mixed.json }
    responses:
      '200':
        description: >-
          Nœuds déplacés ; leurs anciens et nouveaux ancêtres recalculés, et les totaux
          (`NodesWritten`). Une mise en retrait est un déplacement sous la tâche au-dessus, à son
          niveau (`nodes_indented`).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              moved: { $ref: ../../../fixtures/api/nodes_moved.json }
              indented: { $ref: ../../../fixtures/api/nodes_indented.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          L'état d'une tâche interdit le déplacement, rien ne bougeant : une ligne déplacée vers
          une tâche terminée, ou depuis elle, qui se rouvre d'abord depuis le Kanban — « La
          création d'une ligne sous une tâche terminée, ou le déplacement d'une ligne vers elle,
          est refusé » (Vérif de WF-DEV-0050, WF-RAE-0030) —, `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` à `task_not_completed` (`completed_refused` ; #1214) ; ou un
          traitement de fond qui court sur la révision, `no_background_task_running`, comme la
          commande de la structure le dit. Une sélection nomme la condition du premier nœud en
          cause dans l'ordre du plan, comme ses autres refus.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              completed_refused: { $ref: ../../../fixtures/api/nodes_move_completed_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Le déplacement sortirait la tâche d'un poste du sous-arbre de la tâche de son lot
          (WF-PLA-0170) : `VALIDATION_FAILED`, `fields` sur le nœud déplacé en cause, motif
          `ORDER_ITEM_OUTSIDE_WORK_PACKAGE`, `fields[].params.work_package_task` et
          `order_item_tasks` nommant la tâche du lot et celles des postes par leur nœud et leur
          libellé, comme l'échec d'une fusion (`NodeMove`, WF-IHM-0080). Ou une ligne de
          main-d'œuvre déplacée
          change de tâche porteuse, et son rôle laisserait la tâche qui la reçoit sans aucune
          heure travaillée dans la semaine : `TASK_WITHOUT_WORKING_HOURS`,
          `params.resource_role_ids` et `params.tasks` nommant les rôles et la tâche
          (WF-PLA-0010). Ou un nœud après lequel se placer qui n'est pas un frère sous le parent
          visé : `fields` sur `/after_node_id`, `NODE_NOT_SIBLING`, sans paramètre (`NodeMove` ;
          #1183). Ou, sans `fields`, un déplacement qui, en
          changeant le calendrier d'une tâche, porterait la durée du projet au-delà de quinze ans :
          `PROJECT_HORIZON_EXCEEDED`, `params.task` nommant la tâche déplacée ou celle qui reçoit
          la ligne déplacée (WF-PLA-0150). Ou une ligne de provision parmi les nœuds déplacés :
          sa tâche est celle que son risque désigne, et elle se déplace par le formulaire du
          risque (`updateRisk`, `provision_task_id`) — `fields` sur la ligne, `/node_ids/<n>`,
          motif `PROVISION_LINE_MOVED_BY_RISK`, `fields[].params.risk` nommant le risque par
          son identifiant et son libellé (`risk_id`, `label`), que la grille ne lit pas
          (WF-RIS-0010 ; #1227) ; une tâche qui porte une ligne de provision se déplace, elle,
          avec sa ligne. Ou, sans `fields`, un déplacement ou une mise en
          retrait qui relierait la récapitulative qui reçoit le nœud, ou l'un de ses ancêtres, au
          nœud ou à l'une de ses subordonnées : `LINK_FORBIDDEN`, sans paramètre (WF-PLA-0030,
          WF-PLA-0040) ; ou qui fermerait une boucle de liaisons à travers elle : `LINK_CYCLE`,
          `params.cycle` nommant les tâches de la boucle par leur nœud et leur libellé, dans
          l'ordre des liaisons (WF-PLA-0030) — la grille, filtrée, peut ne pas les lire.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              after_not_sibling: { $ref: ../../../fixtures/api/nodes_move_after_not_sibling.json }
              outside_work_package: { $ref: ../../../fixtures/api/nodes_move_outside_work_package.json }
              indent_forbidden: { $ref: ../../../fixtures/api/nodes_indent_forbidden.json }
              cycle_refused: { $ref: ../../../fixtures/api/nodes_move_cycle_refused.json }
              provision_refused: { $ref: ../../../fixtures/api/nodes_move_provision_refused.json }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/paste-preview:
  post:
    operationId: previewPaste
    tags: [revisions]
    summary: Aperçu d'un collage depuis un tableur
    description: >-
      Dit ce qui sera écrit et ce qui sera refusé, avec le motif de chaque refus ; rien
      n'est écrit à cette étape (WF-IHM-0050). Confirmé, le collage écrira les lignes acceptées
      et non les lignes refusées (`applyPaste`). Le bloc remplit, à partir de la colonne
      visée, les colonnes de la facette du nœud visé dans l'ordre de `NodeColumn` — l'ordre
      des grilles (WF-PLA-0080, WF-DEV-0050) —, sans décaler aucune cellule : une cellule
      non vide qui tombe sur une colonne que sa ligne n'accepte pas est refusée, nommée par
      sa ligne et sa colonne (`PastePreview`), et le sous-projet d'une ligne d'une tâche démarrée
      ou terminée ne quitte pas un sous-projet qui a reçu des coûts réels
      (`SUBPROJECT_HAS_ACTUAL_COSTS`, `PasteRejection`, WF-PRJ-0050).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/PastePreview }
    responses:
      '200':
        description: Plan de collage.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/PastePlan }
            examples:
              planned: { $ref: ../../../fixtures/api/paste_plan.json }
              unknown_category: { $ref: ../../../fixtures/api/paste_plan_unknown_category.json }
              subproject_held: { $ref: ../../../fixtures/api/paste_plan_subproject_held.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '413': { $ref: ../components/responses.yaml#/PayloadTooLarge }
      '422':
        description: >-
          Bloc plus large que les colonnes de la facette à partir de la colonne visée
          (`NodeColumn`) : `params.max_columns` dit combien il en reste ; rien n'est écrit
          (WF-IHM-0050).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              too_wide: { $ref: ../../../fixtures/api/paste_too_wide.json }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/paste:
  post:
    operationId: applyPaste
    tags: [revisions]
    summary: Appliquer un collage
    description: >-
      Les lignes valides du plan sont écrites en une seule opération, et les lignes refusées ne le
      sont pas ; un collage abandonné laisse la grille inchangée (WF-IHM-0050 ; EP-14/L42q). Porte
      le compteur de la structure, refusé par 412 s'il est périmé, et rend le compteur suivant avec
      les nœuds écrits, leurs ancêtres et les totaux, et les refus de l'aperçu, ligne par ligne,
      que la confirmation n'a pas écrits (`PasteApplied`, WF-IHM-0110) : un succès partiel se lit
      à ce que `rejected` n'est pas vide.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/PasteApply }
    responses:
      '200':
        description: >-
          Collage appliqué, entier ou en partie ; le compteur de la structure a avancé dès qu'une
          ligne est écrite.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/PasteApplied }
            examples:
              applied: { $ref: ../../../fixtures/api/paste_applied.json }
              partial: { $ref: ../../../fixtures/api/paste_applied_partial.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/undo:
  post:
    operationId: undoLastChange
    tags: [revisions]
    summary: Annuler la dernière modification
    description: >-
      Annule les modifications de la session, une par une et dans l'ordre inverse, sur
      au moins cinquante niveaux : les saisies des grilles comme celles des risques —
      création, modification, réexamen, suppression d'un risque —, saisies de la révision en
      cours (WF-RIS-0020). Une annulation est une modification comme une autre :
      elle s'inscrit dans les colonnes d'audit et est refusée si une modification
      postérieure porte sur le même objet (WF-IHM-0110). Aucune commande n'annule un
      import appliqué, un marquage, une fusion, la désignation de la référence, une sortie
      du cycle de vie, la déclaration d'un risque survenu ni l'exclusion d'une ligne de
      coût.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    responses:
      '200':
        description: Modification annulée.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/UndoResult }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Une modification postérieure porte sur le même objet, ou l'historique de la
          session est vide (WF-IHM-0110). Ou l'annulation rendrait un sous-projet supprimé
          depuis — à la provision d'un risque dont elle défait la création, la modification ou la
          suppression, ou à une ligne de devis dont elle défait une écriture de la grille, la
          suppression d'une ligne ou d'une tâche et de ses lignes comprise — :
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `restored_subproject_exists`, et
          rien n'est défait (décision de l'auteur, #732).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/redo:
  post:
    operationId: redoLastUndo
    tags: [revisions]
    summary: Rétablir la dernière annulation
    description: >-
      Rétablit la saisie que la dernière annulation avait défaite (WF-IHM-0110).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    responses:
      '200':
        description: Modification rétablie (WF-IHM-0110).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/UndoResult }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Une modification postérieure porte sur le même objet, ou rien n'est à rétablir
          (WF-IHM-0110). Ou le rétablissement rendrait un sous-projet supprimé depuis — à la
          provision d'un risque dont il rétablit la création, la modification ou la suppression, ou
          à une ligne de devis dont il rétablit une écriture de la grille, la suppression d'une
          ligne ou d'une tâche et de ses lignes comprise — : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` à `restored_subproject_exists`, et rien n'est rétabli
          (décision de l'auteur, #732).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/skeleton:
  post:
    operationId: generatePlanningSkeleton
    tags: [planning]
    summary: Engendrer le squelette de planning depuis le lotissement
    description: >-
      Une récapitulative par lot et par poste, chacune rattachée au lot ou au poste qu'elle
      représente (`TaskFacet.work_package_id`, `order_item_id`, WF-PLA-0170), celle d'un poste
      subordonnée à celle de son lot, une feuille par livrable, un jalon de fin par poste et par
      lot, avec leurs liaisons. Engendré sur la
      structure principale de la révision, seule à porter des rattachements — jamais sur un
      différentiel ni sur le devis propre d'un risque, que l'opération ne désigne pas —, et
      proposé seulement quand elle ne comporte aucune tâche, sans créer d'autre lien avec le
      lotissement que ce rattachement : modifier ensuite le lotissement ne déplace ni ne
      supprime aucune tâche, seul le rattachement le suit (WF-PRJ-0030, WF-PLA-0170). La
      révision dit d'avance si la génération est proposée (`RevisionCommand.generate_skeleton`) ;
      refusée sur une révision marquée ou un projet terminal, par 403, comme toute saisie
      (WF-DAT-0020, WF-CYC-0100). Une écriture de grille comme les autres : elle rend les tâches
      créées, les totaux et le compteur de la structure (`NodesWritten`), pour que la grille
      vide se remplisse et que la saisie suivante porte le bon compteur (WF-IHM-0110).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    responses:
      '201':
        description: >-
          Squelette engendré : ses tâches dans `nodes`, dans l'ordre du plan — la récapitulative
          d'un lot, puis celle de chacun de ses postes suivie de ses livrables et de son jalon de
          fin, puis le jalon de fin du lot —, sans ancêtre à recalculer ni tâche redatée.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              default_breakdown: { $ref: ../../../fixtures/api/skeleton_generated.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La génération n'est pas proposée : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` nommant la première condition qui manque, dans l'ordre où la
          commande les liste (`generate_skeleton`) — `main_structure_without_tasks` dès que la
          structure principale comporte une tâche (Vérif de WF-PRJ-0030), puis
          `no_background_task_running` pendant un marquage, un import, le traitement d'une
          survenance de risque ou une fusion (WF-IHM-0080).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              structure_not_empty: { $ref: ../../../fixtures/api/skeleton_structure_not_empty.json }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
