      - $ref: ../components/parameters.yaml#/NodeUnitDisbursementMin
      - $ref: ../components/parameters.yaml#/NodeUnitDisbursementMax
      - $ref: ../components/parameters.yaml#/NodePaymentDelayMin
      - $ref: ../components/parameters.yaml#/NodePaymentDelayMax
      - $ref: ../components/parameters.yaml#/NodeConsumptionYearMin
      - $ref: ../components/parameters.yaml#/NodeConsumptionYearMax
      - $ref: ../components/parameters.yaml#/NodeBaseAmountMin
      - $ref: ../components/parameters.yaml#/NodeBaseAmountMax
      - $ref: ../components/parameters.yaml#/NodeBudgetedAmountMin
      - $ref: ../components/parameters.yaml#/NodeBudgetedAmountMax
      - $ref: ../components/parameters.yaml#/NodeReestimatedAmountMin
      - $ref: ../components/parameters.yaml#/NodeReestimatedAmountMax
