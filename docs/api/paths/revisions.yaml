  post:
    operationId: createNode
    tags: [revisions]
    summary: Créer une tâche ou une ligne de devis
    description: >-
      Refusé sur une révision marquée (WF-DAT-0020) — toute révision d'un projet terminal l'est
      (WF-CYC-0100) — par 409, comme toute écriture de la révision. La même écriture depuis les
      trois grilles : la phase du projet ne refuse rien ici, c'est la
      commande de la structure qui dit quelle grille la saisit (`CostStructure.available_commands`,
      C-358). Sur la structure principale, une ligne ne se crée pas sous une tâche terminée, qui se
      rouvre d'abord depuis le Kanban (`task_not_completed`, WF-DEV-0050, WF-RAE-0040) ; dans un
      différentiel, elle s'y crée comme ailleurs, l'avenant rebudgétant la tâche (WF-REV-0050 ;
      F-01, #1766).
      Une tâche créée sans mode ni durée — depuis la grille de devis ou de reste à engager, qui ne
      les présentent pas — est une feuille en mode automatique, d'une durée d'un jour, sans
      prédécesseur (WF-DEV-0050, WF-RAE-0040). Une tâche créée sous une feuille en mode manuel
      fait de celle-ci une récapitulative, toujours en mode automatique (WF-PLA-0040) ; sous un
      jalon, qui ne porte pas de sous-tâches, elle est refusée par 422
      `MILESTONE_HAS_NO_SUBTASK`, une ligne de devis restant permise (WF-PLA-0050 ; #1771). Une ligne
      créée sans libellé reçoit celui que le serveur compose de celui de sa tâche et de celui de
      son rôle, et une ligne de main-d'œuvre, la catégorie de son rôle (`EstimateLineWrite`,
      `line_created_labelled`, WF-DEV-0020). Une ligne ajoutée après la référence porte un
      montant budgété nul (WF-RAE-0050). Une ligne de main-d'œuvre dont le rôle laisserait sa
      tâche sans aucune heure travaillée dans la semaine
      — son calendrier ne recoupe jamais celui d'un autre rôle de la tâche, ou, sur une tâche
      dont ce rôle est le seul, il n'a aucune heure dans la semaine (EP-14/L42s) — est refusée
      par 422 `TASK_WITHOUT_WORKING_HOURS`, `params` nommant les rôles et la tâche (WF-PLA-0010) ;
      une tâche créée rattachée à un lot ou à un poste suit les règles du rattachement
      (`TaskFacetWrite`, WF-PLA-0170). Une ligne dont la catégorie relève d'une nature de type
      provision n'est créée que par la déclaration d'un risque : sa création à la main est
      refusée par 422 `VALIDATION_FAILED`, `fields` sur `/estimate_line/cost_category_id`, motif
      `PROVISION_CATEGORY_RESERVED` (WF-DEV-0020, WF-RIS-0010). Une tâche créée dont la durée ou
      les dates porteraient la durée du projet au-delà de quinze ans est refusée par 422
      `PROJECT_HORIZON_EXCEEDED`, `params.task` la nommant par le libellé envoyé, son nœud nul
      (WF-PLA-0150). Une tâche créée en mode manuel dont le début ou la fin tombe un jour sans
      aucune heure travaillée à son calendrier — sans ligne de main-d'œuvre, le calendrier par
      défaut (WF-PLA-0010) — est refusée comme à la modification (`updateTaskFacet`) : 422
      `VALIDATION_FAILED`, `fields` sur `/task/start/date` ou `/task/finish/date` par
      `NON_WORKING_DAY`, le jour travaillé suivant nommé ; rien n'est créé (WF-PLA-0020 ; #1345).
      Ses début et fin se saisissent par leur seule date, comme à la modification : le serveur en
      complète les heures sur le calendrier de la tâche, et la réponse les rend complétées
      (`WorkInstantWrite`, `created_manual` ; #1769).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/NodeCreate }
    responses:
      '201':
        description: >-
          Nœud créé, avec ses ancêtres recalculés et les totaux de la structure
          (`NodesWritten`).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              created: { $ref: ../../../fixtures/api/node_created.json }
              created_child: { $ref: ../../../fixtures/api/node_created_child.json }
              line_created: { $ref: ../../../fixtures/api/estimate_line_created.json }
              line_created_after_subtask:
                $ref: ../../../fixtures/api/estimate_line_created_after_subtask.json
              line_created_labelled:
                $ref: ../../../fixtures/api/estimate_line_created_labelled.json
              created_manual: { $ref: ../../../fixtures/api/node_created_manual.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          L'état interdit la création, rien n'étant créé : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` nommant la première condition qui manque, dans cet ordre —
          `project_not_terminal` sur un projet terminal (WF-CYC-0100) ; puis les conditions d'état
          de la révision, `revision_draft` sur une révision marquée, comme la révision le dit
          d'avance de ses saisies (`Revision.available_commands`, `marked_refused`, WF-DAT-0020),
          et `no_background_task_running` pendant un traitement de fond qui court sur la révision,
          comme la commande de la structure le dit ; puis, sur la structure principale seule, une
          ligne créée sous une tâche terminée, qui se rouvre d'abord depuis le Kanban,
          `task_not_completed` (`completed_refused` ; WF-DEV-0050, WF-RAE-0040, WF-RAE-0030 ;
          #1184, #1766). Dans un différentiel, une ligne se crée sous une tâche terminée comme sous
          une autre, l'avenant la rebudgétant (WF-REV-0050, #1765). La phase du projet ne refuse
          rien (C-358).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              completed_refused:
                $ref: ../../../fixtures/api/estimate_line_completed_refused.json
              marked_refused: { $ref: ../../../fixtures/api/node_create_marked_refused.json }
      '422':
        description: >-
          Entité refusée par une règle métier, `fields` localisant chaque refus : une ligne de
          type provision pour risques créée à la main (`PROVISION_CATEGORY_RESERVED`, WF-DEV-0020), un
          rattachement au lotissement refusé (`TaskFacetWrite`, WF-PLA-0170), un délai de
          paiement négatif (`/estimate_line/payment_delay_days`, `VALUE_OUT_OF_RANGE`,
          `params.minimum` à `0`), un nœud après lequel se placer qui n'est pas un frère sous le
          parent visé (`/after_node_id`, `NODE_NOT_SIBLING`, `NodeCreate` ; #1183), une tâche
          créée sous un jalon, qui ne porte pas de sous-tâches (`/parent_id`,
          `MILESTONE_HAS_NO_SUBTASK`, `fields[].params` nommant le jalon, `node_id` et `label` ;
          WF-PLA-0050, #1771), un champ que la
          ligne n'accepte pas (`FIELD_NOT_ACCEPTED`, `EstimateLineWrite` ; EP-14/L42s), une
          catégorie qui n'est pas
          celle du rôle d'une ligne de main-d'œuvre (`/estimate_line/cost_category_id`,
          `COMPUTED_VALUE`, `line_category_mismatch`, WF-DEV-0020), une catégorie absente d'une
          ligne sans rôle (`VALUE_REQUIRED`), une catégorie de main-d'œuvre sans rôle
          (`/estimate_line/resource_role_id`, `RESOURCE_ROLE_REQUIRED`, WF-DEV-0020) ; ou, sans
          `fields`, une ligne dont la catégorie n'a pas de taux horaire pour l'année de référence
          (`HOURLY_RATE_MISSING`, `params.missing_rates`, WF-DEV-0010) ; ou une ligne qui laisserait sa
          tâche sans heure travaillée (`TASK_WITHOUT_WORKING_HOURS`, WF-PLA-0010) ; ou, sans
          `fields`, une tâche qui porterait la durée du projet au-delà de quinze ans
          (`PROJECT_HORIZON_EXCEEDED`, `params.task`, WF-PLA-0150). Ou une date d'une tâche en
          mode manuel envoyée un jour sans aucune heure travaillée au calendrier de la tâche :
          `fields` sur `/task/start/date` ou `/task/finish/date` par `NON_WORKING_DAY`,
          `fields[].params.date` la date envoyée et `next_working_day` le jour travaillé suivant,
          comme `updateTaskFacet` (WF-PLA-0020, WF-PLA-0010 ; #1345) ; ou, avec un jour travaillé,
          des heures envoyées hors du jour, `/task/start/hours` ou `/task/finish/hours` par
          `VALUE_OUT_OF_RANGE`, `fields[].params.minimum` à `0` ou `maximum` aux heures du jour,
          comme à la modification (`WorkInstantWrite` ; #1769).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              provision_refused: { $ref: ../../../fixtures/api/estimate_line_provision_refused.json }
              out_of_range: { $ref: ../../../fixtures/api/node_create_out_of_range.json }
              horizon_exceeded: { $ref: ../../../fixtures/api/node_create_horizon_exceeded.json }
              after_not_sibling: { $ref: ../../../fixtures/api/node_create_after_not_sibling.json }
              non_working_day: { $ref: ../../../fixtures/api/node_create_non_working_day.json }
              line_category_mismatch:
                $ref: ../../../fixtures/api/estimate_line_category_mismatch.json
              without_hours: { $ref: ../../../fixtures/api/node_create_without_hours.json }
              field_not_accepted: { $ref: ../../../fixtures/api/node_create_field_not_accepted.json }
              under_milestone: { $ref: ../../../fixtures/api/node_create_under_milestone.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/rows/{row_number}:
  get:
    operationId: resolveRowNumber
    tags: [revisions]
    summary: Le nœud qui porte un numéro de ligne
    description: >-
      Le nœud que désigne un numéro de ligne dans la numérotation de toute la structure — celle
      de `Node.row_number`, ses tâches et ses lignes dans l'ordre du plan —, quels que soient la
      recherche, les filtres et le tri de la grille qui le demande : une lecture qui n'écrit rien.
      La colonne des prédécesseurs de la grille de planning nomme un prédécesseur par son numéro
      (WF-PLA-0080) ; un numéro que les lignes lues ne portent pas — une tâche que la recherche ou
      un filtre écarte — se résout ici en nœud, dont l'identifiant s'envoie à l'écriture
      (`PredecessorWrite.predecessor_node_id`, `setPredecessors`), qui reste seule juge de la
      liaison. La lecture rend la nature du nœud, si bien que le front refuse comme inconnu le
      numéro d'une ligne de devis, qui n'est pas une tâche.

      Aucun nœud de la structure ne porte ce numéro — il dépasse sa dernière ligne — : 404
      `NOT_FOUND`, sans paramètre, comme un objet inexistant. Sur la lecture d'un différentiel,
      la numérotation est celle que `listNodes` rend, où les nœuds que le différentiel retire
      comptent chacun pour sa ligne : le numéro d'un nœud retiré, qui n'est plus de la structure,
      répond aussi 404. Les droits et les autres refus sont ceux de `listNodes` : un projet, une
      révision ou une structure inexistants ou invisibles faute de la consultation du projet
      répondent 404 de même, sans rien distinguer (WF-ADM-0110). Un numéro qui n'est pas un
      entier d'au moins 1 est refusé par 422 `VALIDATION_FAILED`, au pointeur
      `/path/row_number`.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/RowNumber
    responses:
      '200':
        description: Le nœud qui porte le numéro.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/RowNumberResolution }
            examples:
              task: { $ref: ../../../fixtures/api/row_number_task.json }
              estimate_line: { $ref: ../../../fixtures/api/row_number_estimate_line.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404':
        description: >-
          Aucun nœud de la structure ne porte ce numéro, ou la structure est inexistante ou
          invisible : `NOT_FOUND`, sans paramètre (WF-ADM-0110).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              unknown: { $ref: ../../../fixtures/api/row_number_unknown.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}:
  delete:
    operationId: deleteNode
    tags: [revisions]
    summary: Supprimer un nœud
    description: >-
      La suppression d'une tâche emporte ses lignes et ses liaisons (WF-PLA-0070, WF-DAT-0090) ;
      celle d'une récapitulative emporte aussi ses subordonnées, leurs lignes et leurs liaisons,
      et le devis diminue d'autant (Vérif de WF-PLA-0070). « Une tâche démarrée ou terminée ne
      peut pas être supprimée » (WF-PLA-0070), ni une récapitulative dont une subordonnée l'est :
      le refus nomme la condition, `task_not_started`, et l'écran renvoie à la mise à zéro de
      son reste à engager (Vérif de WF-PLA-0070). Les lignes de provision que portent la tâche
      supprimée et ses subordonnées ne sont pas emportées : elles passent sur la tâche parente
      de la tâche supprimée ou, pour une tâche de premier niveau, sur la première tâche de premier
      niveau restante, le total du devis inchangé (WF-PLA-0070, WF-RIS-0010) ; `nodes` les rend
      écrites sous leur tâche nouvelle, `ancestors` cette tâche et ses ancêtres, et chaque risque
      concerné voit sa tâche de provision (`Risk.provision_node_id`) et son compteur changer. La
      suppression qui laisserait sans tâche une structure principale qui porte une ligne de
      provision est refusée en nommant les risques (WF-RIS-0010). Une récapitulative qui perd sa
      dernière subordonnée devient une tâche feuille en mode automatique : elle prend pour
      durée celle qu'elle calculait, conserve son état, ses lignes propres et son rattachement
      au lotissement (WF-PLA-0170), et ses dates sont recalculées ; si cette durée est nulle,
      elle devient un jalon, à l'état non démarré ou terminé qu'elle avait ; démarrée, elle
      prend une durée d'un jour (WF-PLA-0040, WF-PLA-0160). Elle est rendue telle qu'elle devient dans `ancestors`,
      ses `computed_fields` et `editable_fields` changés avec elle. Une écriture de grille
      comme les autres : elle rend ses ancêtres recalculés, les totaux et le compteur de la
      structure, qui a avancé (`NodesWritten`), pour que la grille montre juste et que le collage
      suivant porte le bon compteur (WF-IHM-0110). Les liaisons emportées peuvent redater les
      successeurs de la tâche et déplacer le chemin critique : ces tâches sont rendues dans
      `rescheduled` (WF-PLA-0020, WF-PLA-0100), et leurs montants, inflation comprise, dans
      `reinflated` (WF-DEV-0040). Une tâche que la suppression laisse sans prédécesseur se replace
      selon son mode (WF-PLA-0020) sans changer d'état : une date de début passée ne la démarre ni
      ne la termine (WF-RAE-0030 ; `provision_moved`, #1768). Comme toute modification, elle porte le compteur lu du nœud supprimé
      (`lock_version`, WF-IHM-0110) : un nœud écrit depuis sa lecture n'est pas supprimé (#1210).
      Sur la structure principale, une ligne d'une tâche terminée ne se supprime pas, la tâche se
      rouvrant d'abord depuis le Kanban (`task_not_completed`, WF-RAE-0040) ; dans un
      différentiel, elle se supprime comme une autre, l'avenant la rebudgétant (WF-REV-0050 ;
      F-01, #1766). La phase du projet ne refuse rien (C-358).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
      - name: lock_version
        in: query
        required: true
        description: >-
          Le compteur du nœud supprimé, tel que la grille l'a lu (`Node.lock_version`) : périmé,
          la suppression est refusée par 412 et rien n'est supprimé (WF-IHM-0110, #1210). Seul
          le compteur du nœud désigné se juge, pas ceux des subordonnées qu'il emporte.
        schema: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '200':
        description: >-
          Nœud supprimé ; `nodes` ne rend que les lignes de provision qu'il déplace, écrites sous
          leur tâche nouvelle (`provision_moved`), vide quand il n'en portait pas (`deleted`) ;
          les ancêtres et les totaux sont recalculés sans lui.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              deleted: { $ref: ../../../fixtures/api/node_deleted.json }
              provision_moved: { $ref: ../../../fixtures/api/node_deleted_provision_moved.json }
              summary_deleted: { $ref: ../../../fixtures/api/node_summary_deleted.json }
              summary_emptied: { $ref: ../../../fixtures/api/node_summary_emptied.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La suppression est refusée, rien n'étant supprimé : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` la première condition qui manque — `project_not_terminal`
          sur un projet terminal (WF-CYC-0100) ; puis celles de la commande de
          saisie du planning de la structure (`StructureCommand.edit_planning` :
          `revision_draft`, `no_background_task_running`) ; puis, pour une tâche,
          `task_not_started` pour une
          tâche démarrée ou terminée, ou une récapitulative dont une subordonnée l'est
          (WF-PLA-0070), et `at_least_one_task` pour la suppression qui laisserait sans tâche
          une structure principale qui porte une ligne de provision, la ligne n'ayant plus de
          tâche où se ranger, `params.risks` nommant chacun des risques dont elle porterait la
          provision (WF-RIS-0010 ; F-04, H-05, US-0702/L2) ; pour une ligne de la structure
          principale, `task_not_completed` quand sa tâche est terminée, qui se rouvre d'abord
          depuis le Kanban (`line_completed_refused` ; WF-RAE-0040, WF-DEV-0050 ; F-01, #1766).
          Dans un différentiel, la ligne d'une tâche terminée se supprime (WF-REV-0050).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              started: { $ref: ../../../fixtures/api/node_delete_started_refused.json }
              last_provision_task: { $ref: ../../../fixtures/api/node_delete_last_provision_task_refused.json }
              line_completed_refused:
                $ref: ../../../fixtures/api/node_delete_line_completed_refused.json
      '412':
        description: >-
          `STALE_LOCK_VERSION` : le nœud a été écrit depuis sa lecture, et rien n'est supprimé ;
          `params.expected_lock_version` est son compteur courant (WF-IHM-0110, #1210).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/node_delete_stale.json }
      '422': { $ref: ../components/responses.yaml#/LockVersionInvalid }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/dependencies:
  get:
    operationId: getComputedValueDependencies
    tags: [revisions]
    summary: Ce dont dépend une valeur calculée
    description: >-
      Lue à la demande, quand l'utilisateur tente de saisir une valeur que le serveur
      calcule — ainsi la catégorie d'une ligne de main-d'œuvre, tirée de son rôle
      (`labour_category`) — : les règles qui la calculent, et les lignes dont elle est tirée,
      nommées par leur numéro et leur libellé, que la recherche ou les filtres de la grille les
      retiennent ou non. Une tentative de saisie sur une valeur calculée est refusée en
      nommant ce dont elle dépend (WF-IHM-0030) ; les subordonnées d'une récapitulative
      sont ses subordonnées directes (WF-PLA-0040). Un champ que le serveur ne calcule pas
      pour ce nœud — il se saisit — est refusé (422, `VALIDATION_FAILED`, `params.field`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
      - name: field
        in: query
        required: true
        description: Le champ calculé dont la saisie a été tentée.
        schema: { $ref: ../components/schemas/revisions.yaml#/ComputedValueField }
    responses:
      '200':
        description: Ce dont dépend la valeur.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/ComputedValueDependencies }
            examples:
              volume: { $ref: ../../../fixtures/api/volume/summary_dependencies.json }
              summary: { $ref: ../../../fixtures/api/dependencies_summary.json }
              summary_moved: { $ref: ../../../fixtures/api/dependencies_summary_moved.json }
              labour: { $ref: ../../../fixtures/api/dependencies_labour.json }
              labour_category: { $ref: ../../../fixtures/api/dependencies_labour_category.json }
              task_amount: { $ref: ../../../fixtures/api/dependencies_task_amount.json }
              provision: { $ref: ../../../fixtures/api/dependencies_provision.json }
              manual_float: { $ref: ../../../fixtures/api/dependencies_manual_float.json }
              provision_subproject: { $ref: ../../../fixtures/api/dependencies_provision_subproject.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          Le serveur ne calcule pas ce champ pour ce nœud : il se saisit.
          `VALIDATION_FAILED`, et `params.field` nomme le champ demandé. Une valeur de `field` hors
          de `ComputedValueField`, ou absente, est refusée de même, par `VALIDATION_FAILED`,
          `fields` sur `/query/field`, comme un numéro de ligne invalide l'est sur
          `/path/row_number` (`resolveRowNumber`) : ces deux lectures n'ont pas de corps, et pas
          de 400.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              entered: { $ref: ../../../fixtures/api/dependencies_entered.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/task:
  patch:
    operationId: updateTaskFacet
    tags: [revisions]
    summary: Modifier la facette temps d'une tâche
    description: >-
      Les dates sont saisissables en mode manuel seulement (WF-PLA-0020) ; celles d'une
      récapitulative sont calculées (WF-PLA-0040). Un jalon a une durée nulle
      (WF-PLA-0050). La durée se saisit dans l'une des unités de travail ou de temps
      écoulé, et se conserve avec elle (WF-PLA-0160). La durée du projet ne peut dépasser
      quinze ans (WF-PLA-0150) : une durée, des dates ou un mode qui l'y porteraient sont refusés
      par 422 `PROJECT_HORIZON_EXCEEDED`, `params.task` nommant la tâche. Le rattachement à un lot ou à un poste du lotissement se pose,
      se change et se retire ici, sur une tâche récapitulative, feuille ou jalon, aux règles
      de `TaskFacetUpdate` (WF-PLA-0170). Seul le compteur lu est exigé : seul ce qui est
      envoyé change (WF-IHM-0040), et le nœud dit ce qu'il accepte (`editable_fields`). Le
      début et la fin se saisissent par leur seule date : le serveur en complète les heures sur
      le calendrier applicable de la tâche (WF-PLA-0010), le début au début de son jour, la fin
      au bout des heures que le calendrier accorde ce jour-là (`WorkInstantWrite`, #1244). Une
      date sur un jour sans aucune heure travaillée à ce calendrier est refusée, et le refus nomme
      le jour travaillé suivant ; rien n'est écrit (WF-PLA-0020 ; #1271).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/TaskFacetUpdate }
          examples:
            dates_entered: { $ref: ../../../fixtures/api/task_dates_sent.json }
    responses:
      '200':
        description: >-
          Tâche modifiée, avec les dates et la criticité recalculées, ses ancêtres recalculés,
          les tâches qu'une durée saisie redate — ses successeurs, et ce que le chemin critique
          déplace —, les montants, inflation comprise, des lignes et des tâches qu'elle déplace
          d'une année à l'autre et les totaux de la structure (`NodesWritten`, WF-PLA-0020,
          WF-DEV-0040).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              renamed: { $ref: ../../../fixtures/api/task_renamed.json }
              lengthened: { $ref: ../../../fixtures/api/volume/task_lengthened.json }
              attached: { $ref: ../../../fixtures/api/task_attached.json }
              mode_changed: { $ref: ../../../fixtures/api/task_mode_changed.json }
              dates_entered: { $ref: ../../../fixtures/api/task_dates_entered.json }
              duration_entered: { $ref: ../../../fixtures/api/task_duration_entered.json }
              description_entered: { $ref: ../../../fixtures/api/task_description_entered.json }
              dates_conflicting: { $ref: ../../../fixtures/api/task_dates_conflicting.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Entité refusée par une règle métier, `fields` localisant chaque refus : une valeur
          calculée — une date d'une tâche en mode automatique, sans paramètre, la grille lisant ce
          dont elle dépend (`getComputedValueDependencies`) ; une date d'une récapitulative, qui la
          tire de ses subordonnées, par `SUMMARY_TASK_DERIVED`, `fields[].params.subordinate_node_ids`
          les nommant (`summary_date_refused`, Vérif de WF-IHM-0030) —, ou le mode d'une récapitulative,
          toujours automatique (`/scheduling_mode`, WF-PLA-0040) (`COMPUTED_VALUE`, WF-PLA-0020,
          WF-IHM-0030), ou un rattachement au lotissement refusé —
          tâche hors de la structure principale, lot ou poste inconnu, lot et poste ensemble,
          lot ou poste déjà porté par une autre tâche, nommée par son nœud et son libellé, tâche
          d'un poste sortie du sous-arbre de la tâche de son lot, les tâches du lot et des postes
          nommées par leur nœud et leur libellé (WF-PLA-0170, `TaskFacetUpdate`). Ou, sans
          `fields`, une saisie qui porterait la durée du projet au-delà de quinze ans :
          `PROJECT_HORIZON_EXCEEDED`, `params.task` nommant la tâche par son nœud et son libellé
          (WF-PLA-0150). Ou une date envoyée un jour sans aucune heure travaillée au calendrier
          de la tâche : `fields` sur `/start/date` ou `/finish/date` par `NON_WORKING_DAY`,
          `fields[].params.date` la date envoyée et `next_working_day` le jour travaillé suivant
          — « le refus nomme le jour travaillé suivant ; rien n'est écrit » (WF-PLA-0020,
          WF-PLA-0010 ; #1271). Ou des heures envoyées avec un jour travaillé hors de `0` aux
          heures que le calendrier de la tâche accorde ce jour-là : `fields` sur `/start/hours`
          ou `/finish/hours` par `VALUE_OUT_OF_RANGE`, `fields[].params.minimum` à `0` ou
          `maximum` aux heures du jour, la seule borne franchie, jamais nulle — un jour chômé est
          refusé par sa date, ses heures n'étant pas jugées (`WorkInstantWrite`, WF-PLA-0010,
          WF-DAT-0100, #1244).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              date_computed: { $ref: ../../../fixtures/api/task_date_computed_refused.json }
              summary_date_refused: { $ref: ../../../fixtures/api/task_summary_date_refused.json }
              milestone_duration_refused:
                $ref: ../../../fixtures/api/task_milestone_duration_refused.json
              horizon_exceeded: { $ref: ../../../fixtures/api/task_horizon_exceeded.json }
              non_working_day: { $ref: ../../../fixtures/api/task_date_non_working_day.json }
              hours_beyond_day: { $ref: ../../../fixtures/api/task_hours_beyond_day.json }
              hours_below_zero: { $ref: ../../../fixtures/api/task_hours_below_zero.json }
              attach_refused: { $ref: ../../../fixtures/api/task_attach_refused.json }
              attach_outside: { $ref: ../../../fixtures/api/task_attach_outside_work_package.json }
              attach_exclusive: { $ref: ../../../fixtures/api/task_attach_exclusive.json }
              attach_main_structure_only: { $ref: ../../../fixtures/api/task_attach_main_structure_only.json }
              attach_exclusive_attached: { $ref: ../../../fixtures/api/task_attach_exclusive_attached.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/estimate-line:
  patch:
    operationId: updateEstimateLine
    tags: [estimate]
    summary: Modifier la facette argent d'une ligne de devis
    description: >-
      Les montants sont calculés et non saisissables : celui aux taux de l'année de référence,
      avant inflation, par la ligne, le budgété par la référence, le réestimé par les revues,
      ces deux-là inflation comprise, à l'année de consommation de la ligne (WF-DEV-0020,
      WF-DEV-0030, WF-DEV-0040). Une ligne de provision est calculée depuis son risque, et n'est
      pas projetée (WF-RIS-0010, WF-DEV-0030). Seul le compteur lu est
      exigé : seul ce qui est envoyé change (WF-IHM-0040), et le nœud dit ce qu'il accepte
      (`editable_fields`). Un rôle changé change le calendrier de la tâche, donc ses dates
      (WF-PLA-0010) : ses successeurs redatés sont rendus dans `rescheduled`, et dans `reinflated`
      chaque ligne ou tâche non récapitulative dont un montant change d'année — les autres lignes
      qu'elle porte, celles des successeurs qui changent d'année, et leurs tâches. Une ligne
      dont la tâche est démarrée ou terminée ne quitte pas un sous-projet qui a reçu des coûts
      réels, et ne nomme pas son sous-projet dans `editable_fields` ; celle d'une tâche non
      démarrée en change (WF-PRJ-0050). Sur la structure principale, une ligne d'une tâche
      terminée ne se modifie pas, son libellé pas plus que le reste, et ne nomme aucun champ dans
      `editable_fields` : la tâche se rouvre d'abord depuis le Kanban (`task_not_completed`,
      WF-RAE-0040, WF-DEV-0050). Dans un différentiel, elle se modifie comme une autre, pour que
      l'avenant la rebudgète (`rebudgeted_amendment`, WF-REV-0050 ; F-01, #1765, #1766). La phase
      du projet ne refuse rien : le devis de la structure principale, en lecture seule dès En
      cours, l'est par la commande de la structure, que la grille suit (`edit_estimate`, C-358).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/EstimateLineUpdate }
    responses:
      '200':
        description: >-
          Ligne modifiée, avec son montant recalculé, les montants de ses ancêtres et les
          totaux de la structure (`NodesWritten`).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              entered: { $ref: ../../../fixtures/api/estimate_line_entered.json }
              updated: { $ref: ../../../fixtures/api/estimate_line_updated.json }
              redated: { $ref: ../../../fixtures/api/estimate_line_redated.json }
              subproject_changed: { $ref: ../../../fixtures/api/estimate_line_subproject_changed.json }
              amendment: { $ref: ../../../fixtures/api/estimate_line_updated_amendment.json }
              payment_delay_amendment: { $ref: ../../../fixtures/api/estimate_line_payment_delay_amendment.json }
              rebudgeted_amendment: { $ref: ../../../fixtures/api/estimate_line_rebudgeted_amendment.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La ligne n'accepte pas la modification, rien n'étant écrit : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` nommant la première condition qui manque, dans cet ordre —
          `project_not_terminal` sur un projet terminal (WF-CYC-0100) ; puis les conditions d'état
          de la révision, `revision_draft` sur une révision marquée (WF-DAT-0020) et
          `no_background_task_running` pendant un traitement de fond qui court sur la révision ;
          puis, sur la structure principale seule, `task_not_completed` pour une ligne d'une tâche
          terminée, qui se rouvre d'abord depuis le Kanban, la ligne ne nommant aucun champ dans
          `editable_fields` (`completed_refused` ; WF-RAE-0040, WF-DEV-0050 ; F-01, #1766). Dans un
          différentiel, la ligne d'une tâche terminée se modifie (WF-REV-0050). La phase du projet
          ne refuse rien (C-358).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              completed_refused:
                $ref: ../../../fixtures/api/estimate_line_completed_update_refused.json
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Un calcul que la ligne demanderait sans taux horaire : une catégorie de main-d'œuvre
          employée par son rôle sans taux pour l'année de référence de la révision,
          `HOURLY_RATE_MISSING`, sans `fields`, `params.missing_rates` nommant les catégories une par
          une (`rate_missing`, WF-DEV-0010) ; ou le rôle retiré d'une ligne de main-d'œuvre,
          `VALIDATION_FAILED`, `fields` sur `/resource_role_id`, motif `RESOURCE_ROLE_REQUIRED`
          (`role_required`, WF-DEV-0020) ; ou un rôle changé qui laisserait la tâche
          sans heure travaillée dans la semaine — son calendrier ne recoupe jamais celui d'un autre
          rôle de la tâche, ou, sur une tâche dont ce rôle est le seul, il n'a aucune heure dans la
          semaine (EP-14/L42s) — : `TASK_WITHOUT_WORKING_HOURS`, `params.resource_role_ids` et
          `params.tasks` nommant les rôles et la tâche, inchangée (WF-PLA-0010) ; ou une
          catégorie de type provision pour risques donnée à une ligne saisie : `VALIDATION_FAILED`,
          `fields` sur `/cost_category_id`, motif `PROVISION_CATEGORY_RESERVED` (WF-DEV-0020) ;
          ou une catégorie envoyée sur une ligne de main-d'œuvre qui n'est pas celle de son rôle,
          calculée : `fields` sur `/cost_category_id`, motif `COMPUTED_VALUE`, la grille lisant ce
          dont elle dépend (`resource_role`, WF-DEV-0020, WF-IHM-0030) ;
          ou un délai de paiement négatif : `fields` sur `/payment_delay_days`,
          `VALUE_OUT_OF_RANGE`, `params.minimum` à `0` (WF-IND-0100) ; ou un champ que la ligne
          n'accepte pas — le délai de paiement d'une ligne de provision, qui n'en porte pas —,
          motif `FIELD_NOT_ACCEPTED` sur son champ (`EstimateLineUpdate` ; EP-14/L42s) ; ou une
          ligne d'une tâche démarrée ou terminée passée hors d'un sous-projet qui a reçu des coûts
          réels : `fields` sur `/subproject_id`, motif `SUBPROJECT_HAS_ACTUAL_COSTS`,
          `params.subproject` nommant ce sous-projet (WF-PRJ-0050).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              payment_delay_out_of_range: { $ref: ../../../fixtures/api/estimate_line_payment_delay_out_of_range.json }
              subproject_has_actual_costs: { $ref: ../../../fixtures/api/estimate_line_subproject_has_actual_costs.json }
              rate_missing: { $ref: ../../../fixtures/api/estimate_line_rate_missing.json }
              role_required: { $ref: ../../../fixtures/api/estimate_line_role_required.json }
              without_hours: { $ref: ../../../fixtures/api/estimate_line_without_hours.json }
              field_not_accepted: { $ref: ../../../fixtures/api/estimate_line_field_not_accepted.json }
              provision_reserved: { $ref: ../../../fixtures/api/estimate_line_provision_reserved.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/predecessors:
  put:
    operationId: setPredecessors
    tags: [planning]
    summary: Remplacer les prédécesseurs d'une tâche
    description: >-
      Les quatre types de liaison, avec un décalage positif ou négatif dans l'unité de sa
      saisie — temps de travail, temps écoulé ou pourcentage de la durée du prédécesseur
      (WF-PLA-0030, WF-PLA-0160). Des prédécesseurs qui fermeraient une boucle de liaisons sont
      refusés, comme une liaison entre une récapitulative et l'une de ses subordonnées
      (WF-PLA-0030, WF-PLA-0040), et des liaisons qui porteraient la durée du projet au-delà de
      quinze ans (WF-PLA-0150) : 422, rien n'est écrit.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/PredecessorsReplace }
    responses:
      '200':
        description: >-
          Liaisons enregistrées, dates recalculées ; les ancêtres, les tâches que la liaison
          redate — les successeurs, et ce que le chemin critique déplace — et les totaux avec
          (`NodesWritten`, WF-PLA-0020, WF-PLA-0100).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              set: { $ref: ../../../fixtures/api/predecessor_set.json }
              entered: { $ref: ../../../fixtures/api/predecessors_entered.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Liaisons refusées, rien n'est écrit : une boucle de liaisons, `LINK_CYCLE`,
          `params.cycle` nommant ses tâches par leur nœud et leur libellé, dans l'ordre des
          liaisons, de la tâche saisie au prédécesseur envoyé qui la suit déjà (WF-PLA-0030) ; une
          liaison entre une récapitulative et l'une de ses subordonnées, `LINK_FORBIDDEN`, sans
          paramètre (WF-PLA-0040) ; ou des liaisons qui porteraient la durée du projet au-delà de
          quinze ans, `PROJECT_HORIZON_EXCEEDED`, `params.task` nommant la tâche saisie
          (WF-PLA-0150) ; ou un prédécesseur envoyé deux fois, une seconde liaison entre les
          mêmes tâches, `VALIDATION_FAILED`, `fields` désignant chaque occurrence après la
          première, `/predecessors/<n>/predecessor_node_id`, par `DUPLICATE_PREDECESSOR`
          (WF-PLA-0030 ; F-03, US-0702/L2) ; ou une valeur hors règle, `fields` la localisant,
          comme la réponse commune `UnprocessableEntity` le dit. Le code nomme la raison, que la
          colonne des prédécesseurs dit à sa cellule.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              cycle_refused: { $ref: ../../../fixtures/api/predecessors_cycle_refused.json }
              forbidden: { $ref: ../../../fixtures/api/predecessors_forbidden.json }
              horizon_exceeded: { $ref: ../../../fixtures/api/predecessors_horizon_exceeded.json }
              duplicate: { $ref: ../../../fixtures/api/predecessors_duplicate.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/progress:
  put:
    operationId: setTaskProgress
    tags: [remaining]
    summary: Démarrer, terminer ou rouvrir une tâche
    description: >-
      Le geste d'une carte du Kanban, l'état envoyé étant celui que la carte nomme
      (`KanbanCommandAvailability.progress`). La date du geste fait foi et situe la valeur
      acquise (WF-RAE-0030, WF-IND-0030, WF-PLA-0130) : une tâche terminée sans avoir été
      démarrée, jalon compris, prend pour date de démarrage celle de sa terminaison — un jalon
      sans passer par l'état démarré —, et un jalon rouvert perd l'une et l'autre
      (`ProgressUpdate`, `milestone_completed`, `milestone_reopened`). Refusé sur une
      récapitulative, dont l'état est dérivé de ses subordonnées (WF-PLA-0040) : 422
      `SUMMARY_TASK_DERIVED`, qui les nomme (WF-IHM-0030).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/ProgressUpdate }
    responses:
      '200':
        description: >-
          État enregistré ; la tâche, une version de plus, et l'avancement des récapitulatives
          au-dessus recalculé (`NodesWritten`). Les lignes de la tâche ne sont pas rendues : elles
          ne sont pas écrites, mais ce qu'elles acceptent suit l'état de leur tâche — une ligne
          d'une tâche démarrée ou terminée dont le sous-projet a reçu des coûts réels ne nomme plus
          `estimate_line.subproject_id` (WF-PRJ-0050), une ligne d'une tâche terminée n'accepte
          plus la réestimation (`remaining_entry`, WF-RAE-0040) —, et une grille qui les tient
          relit les lignes de la tâche (`listNodes`, `subtree_of`) avant d'en offrir une saisie
          (#1154).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              task_started: { $ref: ../../../fixtures/api/task_started.json }
              milestone_completed: { $ref: ../../../fixtures/api/milestone_completed.json }
              task_reopened: { $ref: ../../../fixtures/api/task_reopened.json }
              milestone_reopened: { $ref: ../../../fixtures/api/milestone_reopened.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          L'état ou la nature de la tâche interdit le geste, rien n'étant écrit :
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` nommant la première condition
          qui manque, comme la carte du Kanban la dit (`KanbanCommand`) — `task_is_milestone`,
          une tâche non démarrée qui n'est pas un jalon envoyée à `completed` ;
          `task_without_lines`, une tâche qui porte une ligne hors provision envoyée à
          `completed`, que la saisie de son reste à engager termine (WF-RAE-0040) ;
          `task_not_milestone`, un jalon envoyé à `started`, qui ne passe pas par l'état
          démarré (WF-PLA-0050) ; `completed_milestone`, `not_started` envoyé pour une tâche qui
          n'est pas un jalon terminé (`reopen_not_started_refused`, WF-RAE-0030) —, puis les
          conditions
          de la saisie du reste à engager (`StructureCommand.edit_remaining`) :
          `project_in_progress`, `no_background_task_running`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              reopen_not_started_refused:
                $ref: ../../../fixtures/api/task_reopen_not_started_refused.json
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Une récapitulative, dont l'état n'est pas saisissable : `SUMMARY_TASK_DERIVED`,
          `params.subordinate_node_ids` nommant ses subordonnées directes, dans l'ordre du plan, dont
          elle tire son état (WF-PLA-0040, WF-IHM-0030) ; rien n'est écrit. Ou une valeur hors
          règle, `fields` la localisant, comme la réponse commune `UnprocessableEntity` le dit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              summary_refused: { $ref: ../../../fixtures/api/task_progress_summary_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/remaining:
  put:
    operationId: setLineRemaining
    tags: [remaining]
    summary: Réestimer une ligne
    description: >-
      Refusé sur une ligne d'une tâche terminée et sur une ligne de provision ; une tâche non
      démarrée se réestime aussi, et un reste à engager nul pour toutes les lignes d'une tâche
      la termine, à la date demandée à la validation (`completed_on`, WF-RAE-0040, WF-PLA-0130) ;
      une tâche non démarrée qui n'est pas un jalon passe par l'état démarré, démarrée et
      terminée à cette même date (WF-RAE-0030), et un jalon, qui n'y passe pas, porte aussi
      `started_on` égal à `completed_on` (WF-PLA-0130). La ligne dit elle-même si elle accepte la
      réestimation (`remaining_entry`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/RemainingUpdate }
    responses:
      '200':
        description: >-
          Réestimation enregistrée ; les montants réestimés des ancêtres et les totaux
          recalculés (`NodesWritten`).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              reestimated: { $ref: ../../../fixtures/api/remaining_reestimated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La ligne n'accepte pas la réestimation, rien n'étant écrit :
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` nommant la première des
          conditions que sa `remaining_entry` dit manquer — `task_not_completed`, une ligne d'une
          tâche terminée (`completed_refused`, WF-RAE-0040) ; `line_not_provision`, une ligne de provision, dont le
          montant est celui que son risque calcule (`remaining_provision_refused`, WF-RIS-0010,
          WF-RAE-0010) —, ou un traitement de fond qui court sur la révision,
          `no_background_task_running`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              provision_refused: { $ref: ../../../fixtures/api/remaining_provision_refused.json }
              completed_refused: { $ref: ../../../fixtures/api/remaining_completed_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED` : une saisie qui termine la tâche sans date de terminaison —
          motif `COMPLETION_DATE_REQUIRED` sur `/completed_on`, `fields[].params.task_node_id`
          nommant la tâche (WF-RAE-0040, WF-PLA-0130) ; rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              completion_date_required: { $ref: ../../../fixtures/api/remaining_completion_date_required.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/{node_id}/tracking:
  put:
    operationId: setNodeTracking
    tags: [planning]
    summary: Inscrire ou retirer une tâche des suivis
    description: >-
      Une tâche s'inscrit à une chronologie, un jalon au suivi temps/temps ; les jalons
      contractuels ne sont rien d'autre que des jalons inscrits (WF-PLA-0060). Une tâche de la
      structure principale le dit d'avance, `task.tracking` dans ses `editable_fields` (#1065).
      Le suivi temps/temps est celui des jalons : une tâche qui n'est pas un jalon, envoyée avec
      une entrée `milestone_tracking`, est refusée par 422 `VALIDATION_FAILED`, `fields` sur le
      genre de cette entrée (`/entries/<n>/kind`, `n` son rang dans `entries`, à partir de 0),
      motif `MILESTONE_REQUIRED`, et rien n'est écrit (#1159).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [entries, lock_version]
            properties:
              entries:
                type: array
                items: { $ref: ../components/schemas/revisions.yaml#/TrackingEntry }
              lock_version: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '200':
        description: Inscriptions enregistrées (`NodesWritten`).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              tracked: { $ref: ../../../fixtures/api/node_tracked.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La commande de saisie du planning de la structure est indisponible
          (`StructureCommand.edit_planning`, dont relève `task.tracking`) :
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` la première condition qui lui
          manque — `revision_draft` sur une révision marquée (WF-DAT-0020), puis
          `no_background_task_running` pendant un traitement de fond qui écrit dans la révision
          ou la fige (F-11, US-0702/L2). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_marked: { $ref: ../../../fixtures/api/node_tracking_marked_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Refusé, rien n'étant écrit : le suivi temps/temps d'une tâche qui n'est pas un jalon,
          `VALIDATION_FAILED`, `fields` sur `/entries/<n>/kind`, motif `MILESTONE_REQUIRED`
          (WF-PLA-0060, #1159) ; une entrée `timeline` sans chronologie, `/entries/<n>/timeline_id`
          par `VALUE_REQUIRED`, ou dont la chronologie n'est pas du projet, par `UNKNOWN_TIMELINE`
          (WF-PLA-0140 ; F-11, US-0702/L2) ; ou une valeur hors règle, `fields` la localisant,
          comme la réponse commune `UnprocessableEntity` le dit (`TrackingEntry`).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              milestone_refused: { $ref: ../../../fixtures/api/node_tracking_milestone_refused.json }
              timeline_required: { $ref: ../../../fixtures/api/node_tracking_timeline_required.json }
              timeline_unknown: { $ref: ../../../fixtures/api/node_tracking_timeline_unknown.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/move:
  post:
    operationId: moveNodes
    tags: [revisions]
    summary: Déplacer des nœuds dans l'arbre
    description: >-
      Déplacer une ligne, ou la tâche au-dessus d'elle, change sa tâche porteuse, qui
      est résolue à la lecture (§3.5.1). La hiérarchie obtenue reste celle d'un arbre de
      tâches et de récapitulatives (WF-PLA-0040). Un déplacement change la structure de
      l'arbre, et peut redater des tâches qui ne sont ni déplacées ni ancêtres : elles sont
      rendues dans `rescheduled` (WF-PLA-0020), et leurs montants, inflation comprise, dans
      `reinflated` (WF-DEV-0040). Une récapitulative qui perd sa dernière subordonnée devient une
      feuille en mode automatique, de la durée qu'elle calculait, à son état, avec ses lignes
      propres et son rattachement au lotissement ; un jalon si cette durée est nulle et qu'elle
      n'est pas démarrée, une feuille d'un jour si elle l'est (WF-PLA-0040, `deleteNode`) — rendue
      ainsi dans `ancestors`, parmi les anciens ancêtres ; une feuille en mode manuel qui reçoit
      une subordonnée devient une récapitulative, toujours en mode automatique — jamais un jalon,
      qui ne porte pas de sous-tâches : une tâche déplacée sous lui est refusée par 422
      `MILESTONE_HAS_NO_SUBTASK` (WF-PLA-0050, `NodeMove` ; #1771). Un déplacement qui
      sortirait la tâche d'un poste du
      sous-arbre de la tâche de son lot est refusé (WF-PLA-0170, `NodeMove`), comme un
      déplacement qui porterait la durée du projet au-delà de quinze ans (WF-PLA-0150). La
      récapitulative qui reçoit un nœud le couvre, avec ses ancêtres : ce qui la précède le
      précède, ce qui la suit le suit (WF-PLA-0040). Un déplacement ou une mise en retrait qui
      relierait ainsi une récapitulative à l'une de ses subordonnées — mettre en retrait une
      tâche sous celle au-dessus d'elle, qui est son prédécesseur — est refusé par 422
      `LINK_FORBIDDEN` ; un déplacement qui fermerait une boucle de liaisons à travers elle, par
      422 `LINK_CYCLE`, `params.cycle` nommant les tâches de la boucle (WF-PLA-0030) — la chaîne
      peut traverser la hiérarchie, une récapitulative couvrant ses subordonnées (#1169) — ;
      rien n'est écrit. Une sélection se juge sur la structure que le déplacement laisserait,
      tous ses nœuds déplacés, et le refus nomme le premier nœud en cause dans l'ordre du plan de
      la structure lue ; l'ordre de `node_ids` ne règle que le placement (`NodeMove`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/NodeMove }
          examples:
            mixed: { $ref: ../../../fixtures/api/nodes_move_mixed.json }
    responses:
      '200':
        description: >-
          Nœuds déplacés ; leurs anciens et nouveaux ancêtres recalculés, et les totaux
          (`NodesWritten`). Une mise en retrait est un déplacement sous la tâche au-dessus, à son
          niveau (`nodes_indented`).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              moved: { $ref: ../../../fixtures/api/nodes_moved.json }
              indented: { $ref: ../../../fixtures/api/nodes_indented.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          L'état interdit le déplacement, rien ne bougeant : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` nommant la première condition qui manque, dans cet ordre —
          `project_not_terminal` sur un projet terminal (WF-CYC-0100) ; puis les conditions d'état
          de la révision, `revision_draft` sur une révision marquée (WF-DAT-0020) et
          `no_background_task_running` pendant un traitement de fond qui court sur la révision,
          comme la commande de la structure le dit ; puis, sur la structure principale seule, une
          ligne déplacée vers une tâche terminée, ou depuis elle, qui se rouvre d'abord depuis le
          Kanban — « La création d'une ligne sous une tâche terminée, ou le déplacement d'une
          ligne vers elle, est refusé » (Vérif de WF-DEV-0050, WF-RAE-0030, WF-RAE-0040) —,
          `task_not_completed` (`completed_refused` ; #1214, #1766). Dans un différentiel, une
          ligne se déplace vers une tâche terminée ou depuis elle comme ailleurs, l'avenant la
          rebudgétant (WF-REV-0050, #1765). La phase du projet ne refuse rien (C-358). Une
          sélection nomme la condition du premier nœud en cause dans l'ordre du plan, comme ses
          autres refus.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              completed_refused: { $ref: ../../../fixtures/api/nodes_move_completed_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Le déplacement sortirait la tâche d'un poste du sous-arbre de la tâche de son lot
          (WF-PLA-0170) : `VALIDATION_FAILED`, `fields` sur le nœud déplacé en cause, motif
          `ORDER_ITEM_OUTSIDE_WORK_PACKAGE`, `fields[].params.work_package_task` et
          `order_item_tasks` nommant la tâche du lot et celles des postes par leur nœud et leur
          libellé, comme l'échec d'une fusion (`NodeMove`, WF-IHM-0080). Ou une ligne de
          main-d'œuvre déplacée change de tâche porteuse, et son rôle laisserait la tâche qui la reçoit sans aucune
          heure travaillée dans la semaine : `TASK_WITHOUT_WORKING_HOURS`,
          `params.resource_role_ids` et `params.tasks` nommant les rôles et la tâche
          (WF-PLA-0010). Ou un nœud après lequel se placer qui n'est pas un frère sous le parent
          visé : `fields` sur `/after_node_id`, `NODE_NOT_SIBLING`, sans paramètre (`NodeMove` ;
          #1183). Ou une tâche déplacée sous un jalon, qui ne porte pas de sous-tâches : `fields`
          sur `/parent_id`, `MILESTONE_HAS_NO_SUBTASK`, `fields[].params` nommant le jalon
          (`node_id`, `label` ; WF-PLA-0050, #1771). Ou, sans `fields`, un déplacement qui, en
          changeant le calendrier d'une tâche, porterait la durée du projet au-delà de quinze ans :
          `PROJECT_HORIZON_EXCEEDED`, `params.task` nommant la tâche déplacée ou celle qui reçoit
          la ligne déplacée (WF-PLA-0150). Ou une ligne de provision parmi les nœuds déplacés :
          sa tâche est celle que son risque désigne, et elle se déplace par le formulaire du
          risque (`updateRisk`, `provision_task_id`) — `fields` sur la ligne, `/node_ids/<n>`,
          motif `PROVISION_LINE_MOVED_BY_RISK`, `fields[].params.risk` nommant le risque par
          son identifiant et son libellé (`risk_id`, `label`), que la grille ne lit pas
          (WF-RIS-0010 ; #1227) ; une tâche qui porte une ligne de provision se déplace, elle,
          avec sa ligne. Ou, sans `fields`, un déplacement ou une mise en
          retrait qui relierait la récapitulative qui reçoit le nœud, ou l'un de ses ancêtres, au
          nœud ou à l'une de ses subordonnées : `LINK_FORBIDDEN`, sans paramètre (WF-PLA-0030,
          WF-PLA-0040) ; ou qui fermerait une boucle de liaisons à travers elle : `LINK_CYCLE`,
          `params.cycle` nommant les tâches de la boucle par leur nœud et leur libellé, dans
          l'ordre des liaisons (WF-PLA-0030) — la grille, filtrée, peut ne pas les lire.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              after_not_sibling: { $ref: ../../../fixtures/api/nodes_move_after_not_sibling.json }
              outside_work_package: { $ref: ../../../fixtures/api/nodes_move_outside_work_package.json }
              indent_forbidden: { $ref: ../../../fixtures/api/nodes_indent_forbidden.json }
              cycle_refused: { $ref: ../../../fixtures/api/nodes_move_cycle_refused.json }
              provision_refused: { $ref: ../../../fixtures/api/nodes_move_provision_refused.json }
              without_hours: { $ref: ../../../fixtures/api/nodes_move_without_hours.json }
              under_milestone: { $ref: ../../../fixtures/api/nodes_move_under_milestone.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/paste-preview:
  post:
    operationId: previewPaste
    tags: [revisions]
    summary: Aperçu d'un collage depuis un tableur
    description: >-
      Dit ce qui sera écrit et ce qui sera refusé, avec le motif de chaque refus ; rien
      n'est écrit à cette étape (WF-IHM-0050). Confirmé, le collage écrira les lignes acceptées
      et non les lignes refusées (`applyPaste`). Le bloc remplit, à partir de la colonne
      visée, les colonnes de la facette du nœud visé dans l'ordre de `NodeColumn` — l'ordre
      des grilles (WF-PLA-0080, WF-DEV-0050) —, sans décaler aucune cellule : une cellule
      non vide qui tombe sur une colonne que sa ligne n'accepte pas est refusée, nommée par
      sa ligne et sa colonne (`PastePreview`), et le sous-projet d'une ligne d'une tâche démarrée
      ou terminée ne quitte pas un sous-projet qui a reçu des coûts réels
      (`SUBPROJECT_HAS_ACTUAL_COSTS`, `PasteRejection`, WF-PRJ-0050) ; sur la structure
      principale, une ligne d'une tâche terminée, qui n'accepte aucun champ, refuse toute cellule
      non vide par `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `task_not_completed`, et
      n'est pas écrite (`PasteRejection`, WF-RAE-0040 ; F-01, #1766). Sur un différentiel, un
      bloc qui couvre des nœuds que le différentiel retire, rendus à leur place en lecture
      seule (`NodeDifference`), saute ces nœuds et remplit les suivants, sans refus : chaque
      ligne du bloc écrit le nœud suivant qui n'est pas retiré (`PastePreview`, #1278). Mais
      un bloc dont la cellule visée est elle-même sur un nœud retiré, qui n'accepte aucun champ
      (`editable_fields` vide), est refusé entier : une seule `PasteRejection`, sur la première
      ligne du bloc et la colonne visée, par `PASTE_TARGET_REMOVED`, aucune ligne acceptée ni
      jugée ; l'ancre n'est pas reportée au nœud suivant, qui écrirait ailleurs que là où
      l'utilisateur a cliqué (#1361).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/PastePreview }
    responses:
      '200':
        description: >-
          Plan de collage. L'exemple `unknown_category` montre une cellule de catégorie refusée,
          `without_hours` une cellule de rôle qui laisserait la tâche de sa ligne sans aucune heure
          travaillée (`TASK_WITHOUT_WORKING_HOURS`, WF-PLA-0010 ; #779).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/PastePlan }
            examples:
              planned: { $ref: ../../../fixtures/api/paste_plan.json }
              unknown_category: { $ref: ../../../fixtures/api/paste_plan_unknown_category.json }
              without_hours: { $ref: ../../../fixtures/api/paste_plan_without_hours.json }
              subproject_held: { $ref: ../../../fixtures/api/paste_plan_subproject_held.json }
              amendment: { $ref: ../../../fixtures/api/paste_plan_amendment.json }
              amendment_skipping: { $ref: ../../../fixtures/api/paste_plan_amendment_skipping.json }
              amendment_target_removed:
                $ref: ../../../fixtures/api/paste_plan_amendment_target_removed.json
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '413': { $ref: ../components/responses.yaml#/PayloadTooLarge }
      '422':
        description: >-
          Bloc plus large que les colonnes de la facette à partir de la colonne visée
          (`NodeColumn`) : `params.max_columns` dit combien il en reste ; rien n'est écrit
          (WF-IHM-0050).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              too_wide: { $ref: ../../../fixtures/api/paste_too_wide.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes/paste:
  post:
    operationId: applyPaste
    tags: [revisions]
    summary: Appliquer un collage
    description: >-
      Les lignes valides du plan sont écrites en une seule opération, et les lignes refusées ne le
      sont pas ; un collage abandonné laisse la grille inchangée (WF-IHM-0050 ; EP-14/L42q). Porte
      le compteur de la structure, refusé par 412 s'il est périmé ; le plan retient aussi le
      compteur de la structure lu à l'aperçu, et la confirmation est refusée par 412 si la
      structure a changé depuis, quel que soit le compteur envoyé (`PasteApply`,
      `params.expected_lock_version` le compteur courant). Elle rend le compteur suivant avec
      les nœuds écrits, leurs ancêtres et les totaux, et les refus de l'aperçu, ligne par ligne,
      que la confirmation n'a pas écrits, avec ceux qu'elle ajoute en jugeant de nouveau les
      lignes acceptées contre le référentiel (`PasteApplied`, `PasteRejection`, WF-IHM-0110) :
      un succès partiel se lit à ce que `rejected` n'est pas vide. Sur un différentiel, les nœuds qu'il retire, que le bloc
      couvre, sont sautés sans refus et ne sont jamais écrits : les lignes du bloc écrivent les
      nœuds suivants, comme l'aperçu les a jugés (`PastePreview`, #1278) ; un plan dont la
      cellule visée est sur un nœud retiré, refusé entier (`PASTE_TARGET_REMOVED`), n'écrit rien,
      confirmé : le compteur de la structure n'avance pas, et le refus est redit (#1361).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/PasteApply }
    responses:
      '200':
        description: >-
          Collage appliqué, entier ou en partie ; le compteur de la structure a avancé dès qu'une
          ligne est écrite.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/PasteApplied }
            examples:
              applied: { $ref: ../../../fixtures/api/paste_applied.json }
              partial: { $ref: ../../../fixtures/api/paste_applied_partial.json }
              amendment: { $ref: ../../../fixtures/api/paste_applied_amendment.json }
              amendment_skipping: { $ref: ../../../fixtures/api/paste_applied_amendment_skipping.json }
              rejudged: { $ref: ../../../fixtures/api/paste_applied_rejudged.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La structure n'accepte plus la saisie de sa grille, rien n'étant écrit :
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` la première condition que sa
          commande dit manquer (`StructureCommand`) — `revision_draft` sur une révision marquée,
          `no_background_task_running` pendant un traitement de fond qui court sur la révision
          (WF-IHM-0050, WF-IHM-0090). Le refus d'une ligne du bloc n'est pas un 409 : elle est
          rendue dans `rejected`, avec son motif (`PasteRejection`).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
      '412':
        description: >-
          Le compteur envoyé est périmé, ou la structure a changé depuis l'aperçu, quel que soit le
          compteur envoyé (`PasteApply`) : `STALE_LOCK_VERSION`, `params.expected_lock_version` le
          compteur courant de la structure ; rien n'est écrit (WF-IHM-0050, WF-IHM-0110).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/paste_stale.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/undo:
  post:
    operationId: undoLastChange
    tags: [revisions]
    summary: Annuler la dernière modification
    description: >-
      L'historique annulable est tenu par le serveur : une pile par révision et par utilisateur,
      qui vit le temps de sa session — le jeton `bearer` qui porte ses requêtes —, et ne survit
      ni à la fin de cette session, ni au marquage de la révision, ni à son abandon, la révision
      n'étant plus en cours (décision de l'auteur du 2026-10-28, E-06). Elle reçoit chacune de
      ses modifications de la révision en cours — les saisies des grilles, la date de début de
      planning et le libellé d'une structure, et celles des risques, création, modification,
      réexamen, suppression d'un risque (WF-RIS-0020) — et en garde au moins les cinquante
      dernières ; deux utilisateurs ont chacun la leur. L'annulation défait la dernière, une par
      une et dans l'ordre inverse. Une
      annulation est une modification comme une autre : elle rend ce qu'une écriture rend
      (`UndoResult.written`), s'inscrit dans les colonnes d'audit et est refusée si une
      modification postérieure porte sur le même objet (WF-IHM-0110). Aucune commande n'annule
      ce qui a sa propre commande inverse ou est définitif — un import appliqué, un marquage,
      l'abandon d'une révision en cours, une fusion, la désignation de la référence, une sortie
      du cycle de vie, la déclaration d'un risque survenu —, ni l'exclusion et la réintégration
      d'une ligne de coût, qui se défont par le geste inverse (WF-IHM-0110, WF-CRE-0030,
      C-363).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    responses:
      '200':
        description: Modification annulée.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/UndoResult }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Une modification postérieure porte sur le même objet — `UNDO_CONFLICT`,
          `params.conflicting_object_id` et `params.conflicting_object_label` nommant l'objet repris
          depuis, une tâche, une ligne de devis ou un risque, rien n'étant défait : « Elle est
          refusée, en nommant l'objet en conflit » (`later_change`, WF-IHM-0110 ; #1531, E-07) —,
          ou l'historique de l'appelant sur la révision est vide, `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` à `undo_history_not_empty` (`history_empty`). Ou l'annulation rendrait un sous-projet supprimé
          depuis — à la provision d'un risque dont elle défait la création, la modification ou la
          suppression, ou à une ligne de devis dont elle défait une écriture de la grille, la
          suppression d'une ligne ou d'une tâche et de ses lignes comprise — :
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `restored_subproject_exists`, et
          rien n'est défait (décision de l'auteur, #732). Ou l'annulation recréerait la ligne de
          provision d'un risque — elle défait la suppression d'un risque identifié, le réexamen
          qui l'a écarté ou le changement de la catégorie de sa provision — sur une structure
          principale qui ne comporte plus aucune tâche, `at_least_one_task`, ou avec une catégorie
          qui n'est plus active et de type provision pour risques, désactivée ou rattachée à une
          nature d'un autre type depuis, `active_provision_category` : une annulation subit les
          règles de la saisie (WF-IHM-0110), qui refuse le retour d'un risque à l'état identifié
          sur une telle structure ou sans telle catégorie (WF-RIS-0010) ; n'envoyant rien, elle ne
          peut pas désigner une autre catégorie comme le réexamen. Ces conditions se jugent dans
          l'ordre de l'énumération (`CommandCondition`) — `at_least_one_task`,
          `restored_subproject_exists`, `active_provision_category` —, le refus nommant la
          première qui manque, et rien n'est défait (#795).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              risk_without_task: { $ref: ../../../fixtures/api/undo_risk_without_task.json }
              later_change: { $ref: ../../../fixtures/api/undo_later_change.json }
              history_empty: { $ref: ../../../fixtures/api/undo_history_empty.json }
              restored_subproject_deleted:
                $ref: ../../../fixtures/api/undo_restored_subproject_deleted.json
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/redo:
  post:
    operationId: redoLastUndo
    tags: [revisions]
    summary: Rétablir la dernière annulation
    description: >-
      Rétablit la saisie que la dernière annulation de l'appelant sur la révision avait défaite,
      dans le même historique que `undoLastChange` (WF-IHM-0110). La réponse a la forme de celle
      de l'annulation (`UndoResult`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    responses:
      '200':
        description: Modification rétablie (WF-IHM-0110).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/UndoResult }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Une modification postérieure porte sur le même objet — `UNDO_CONFLICT`,
          `params.conflicting_object_id` et `params.conflicting_object_label` nommant l'objet repris
          depuis, rien n'étant rétabli (`later_change`, WF-IHM-0110 ; #1531, E-07) —, ou aucune
          annulation n'est à rétablir, `STATE_FORBIDS_OPERATION`, `params.missing_condition` à
          `redo_history_not_empty` (`history_empty`). Ou le rétablissement rendrait un sous-projet supprimé depuis — à la
          provision d'un risque dont il rétablit la création, la modification ou la suppression, ou
          à une ligne de devis dont il rétablit une écriture de la grille, la suppression d'une
          ligne ou d'une tâche et de ses lignes comprise — : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` à `restored_subproject_exists`, et rien n'est rétabli
          (décision de l'auteur, #732). Ou le rétablissement recréerait la ligne de provision d'un
          risque — il rétablit sa création, le réexamen qui l'a rendu identifié ou le changement de
          la catégorie de sa provision — sur une structure principale qui ne comporte plus aucune
          tâche, `at_least_one_task`, ou avec une catégorie qui n'est plus active et de type
          provision pour risques, désactivée ou rattachée à une nature d'un autre type depuis,
          `active_provision_category`, comme l'annulation (`undoLastChange`, WF-RIS-0010,
          WF-IHM-0110). Ces conditions se jugent dans l'ordre de l'énumération
          (`CommandCondition`) — `at_least_one_task`, `restored_subproject_exists`,
          `active_provision_category` —, le refus nommant la première qui manque, et rien n'est
          rétabli (#795).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              risk_category_deactivated:
                $ref: ../../../fixtures/api/redo_risk_category_deactivated.json
              later_change: { $ref: ../../../fixtures/api/redo_later_change.json }
              history_empty: { $ref: ../../../fixtures/api/redo_history_empty.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/skeleton:
  post:
    operationId: generatePlanningSkeleton
    tags: [planning]
    summary: Engendrer le squelette de planning depuis le lotissement
    description: >-
      Une récapitulative par lot et par poste, chacune rattachée au lot ou au poste qu'elle
      représente (`TaskFacet.work_package_id`, `order_item_id`, WF-PLA-0170), celle d'un poste
      subordonnée à celle de son lot, une feuille par livrable, un jalon de fin par poste et par
      lot, avec leurs liaisons. Engendré sur la
      structure principale de la révision, seule à porter des rattachements — jamais sur un
      différentiel ni sur le devis propre d'un risque, que l'opération ne désigne pas —, et
      proposé seulement quand elle ne comporte aucune tâche, sans créer d'autre lien avec le
      lotissement que ce rattachement : modifier ensuite le lotissement ne déplace ni ne
      supprime aucune tâche, seul le rattachement le suit (WF-PRJ-0030, WF-PLA-0170). La
      révision dit d'avance si la génération est proposée (`RevisionCommand.generate_skeleton`) ;
      sur un projet sans révision en cours, c'est le projet qui le dit
      (`ProjectCommand.generate_skeleton`), et la génération n'ouvre pas la révision : l'écran
      l'ouvre d'abord (`createRevision`), puis engendre le squelette sur la révision rendue
      (EP-15/US-0490/L4) ; refusée sur une révision marquée, toute révision d'un projet terminal
      l'étant, par 409, comme toute saisie (WF-DAT-0020, WF-CYC-0100). Une écriture de grille comme les autres :
      elle rend les tâches créées, les totaux et le compteur de la structure (`NodesWritten`),
      pour que la grille vide se remplisse et que la saisie suivante porte le bon compteur
      (WF-IHM-0110).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    responses:
      '201':
        description: >-
          Squelette engendré : ses tâches dans `nodes`, dans l'ordre du plan — la récapitulative
          d'un lot, puis celle de chacun de ses postes suivie de ses livrables et de son jalon de
          fin, puis le jalon de fin du lot —, sans ancêtre à recalculer ni tâche redatée.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              default_breakdown: { $ref: ../../../fixtures/api/skeleton_generated.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La génération n'est pas proposée : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` nommant la première condition qui manque, dans l'ordre où la
          commande les liste (`generate_skeleton`) — `main_structure_without_tasks` dès que la
          structure principale comporte une tâche (Vérif de WF-PRJ-0030), puis
          `no_background_task_running` pendant un marquage, un import, le traitement d'une
          survenance de risque ou une fusion (WF-IHM-0080). Sur une révision marquée, la commande
          ne manque que de `revision_draft` (`marked_refused`, WF-DAT-0020).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              structure_not_empty: { $ref: ../../../fixtures/api/skeleton_structure_not_empty.json }
              marked_refused: { $ref: ../../../fixtures/api/skeleton_marked_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
