/projects/{project_id}/revisions:
  get:
    operationId: listRevisions
    tags: [revisions]
    summary: Revision history
    description: >-
      Version name, description, state, marking date, reference year, inflation rate and
      probability of winning kept, reference status — the attributes of a revision
      (WF-REV-0090) —, and the marked revision each one is a copy of, which a screen names
      alongside the current revision (WF-IHM-0020); each one can be viewed in full
      (WF-REV-0070), the snapshot of the reference data through `getRevision` (`snapshot`,
      omitted here).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - name: status
        in: query
        description: The states retained, current or marked; when absent, all (WF-IHM-0130).
        schema:
          type: array
          items: { $ref: ../components/schemas/revisions.yaml#/RevisionStatus }
        explode: false
      - name: search
        in: query
        description: >-
          Search on the version name and the description, compared like any search of the
          contract (README, "A search…").
        schema: { type: string, minLength: 1, maxLength: 200 }
    responses:
      '200':
        description: >-
          Revisions by creation date, the most recent first: the current revision, the most
          recently created, comes first (WF-REV-0090).
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/revisions.yaml#/Revision }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/revisions.json }
              empty: { $ref: ../../../fixtures/api/revisions_empty.json }
              marked: { $ref: ../../../fixtures/api/revisions_marked.json }
              designation_open: { $ref: ../../../fixtures/api/revisions_designation_open.json }
              project_created: { $ref: ../../../fixtures/api/revisions_project_created.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createRevision
    tags: [revisions]
    summary: Open the current revision
    description: >-
      A project has at most one current revision; its creation copies the structures of the
      last marked revision and the reference data values they use (WF-REV-0010,
      WF-DAT-0010), including the attachments of tasks to the work breakdown, except to a work
      package or an item marked deleted, which the copy does not carry over (WF-PLA-0170). It
      does not carry over the merged structures (`CostStructure.is_merged`): a merged
      differential, consumed by its merge, whose content is in the main structure
      (WF-REV-0050), and the own estimate of an occurred risk, consumed by its occurrence
      (WF-RIS-0060), whose cost remains in `Risk.occurrence_cost`; what they contained can be
      read again in the revision where they were merged (WF-DAT-0020). The own estimate of a
      dismissed risk, which can become identified again, is carried over (WF-REV-0100; #1758,
      #1757). The revision takes the current year as its reference year (`reference_year`);
      when it differs from that of the copied revision, it is priced at the rates of the
      copied revision, projected by the inflation rate of the project up to its reference
      year, unless `apply_rate_update`, and the rate update is offered, never imposed
      (WF-REV-0060, WF-REV-0010; #1764). The description received is kept on the current
      revision, returned with it, and carried over at its marking
      (`RevisionCreate.description`, WF-REV-0090; #2171). The first revision of a Created
      project moves it to Pricing (WF-CYC-0020): the 201 returns the revision, and the screen
      reads the project again (`project_revision_opened`).
      It is the first of the two writes of the planning skeleton on a project without a current
      revision, which the project states in advance (`ProjectCommand.generate_skeleton`): the
      revision returned lists `generate_skeleton`, and `generatePlanningSkeleton` applies to it
      (EP-15/US-0490/L4).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/RevisionCreate }
    responses:
      '201':
        description: Current revision created.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/Revision }
            examples:
              created: { $ref: ../../../fixtures/api/revision_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The state of the project forbids the opening, as its `create_revision` command says,
          or its absence for a terminal project: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` set to `project_not_terminal` on a terminal project
          (WF-CYC-0100); to `no_current_revision` when a current revision already exists
          (WF-REV-0010; J-01, #1795) — an opening requested from a screen read before another
          one opened it, the first of the two writes of the planning skeleton on a project that
          had none, receives this refusal, and the screen reads the project again
          (EP-15/US-0490/L4) —; then to `no_background_task_running` while
          an import is being applied, an occurrence processed or a differential of the last
          marked revision merged, which themselves create the current revision (WF-REV-0010,
          WF-INTF-0090; E-13, US-0702/L2). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              current_revision_exists: { $ref: ../../../fixtures/api/current_revision_exists.json }
              background_task_running: { $ref: ../../../fixtures/api/revision_create_background_running.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}:
  get:
    operationId: getRevision
    tags: [revisions]
    summary: A revision and its snapshot
    description: >-
      Attributes of the revision and content of its snapshot (WF-REV-0090, WF-REV-0030): the
      reference data values that a marked revision has frozen (`snapshot`), omitted for the
      current revision.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    responses:
      '200':
        description: Revision, with the reference data values and the parameters kept (WF-REV-0030).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/Revision }
            examples:
              witness: { $ref: ../../../fixtures/api/revision.json }
              marked: { $ref: ../../../fixtures/api/revision_marked.json }
              offer: { $ref: ../../../fixtures/api/revision_offer.json }
              reader: { $ref: ../../../fixtures/api/revision_reader.json }
              estimator: { $ref: ../../../fixtures/api/revision_estimator.json }
              marking: { $ref: ../../../fixtures/api/revision_marking.json }
              importing: { $ref: ../../../fixtures/api/revision_importing.json }
              without_tasks: { $ref: ../../../fixtures/api/revision_without_tasks.json }
              merge_without_current_revision: { $ref: ../../../fixtures/api/revision_marked_merge_offered.json }
              rate_update_offered: { $ref: ../../../fixtures/api/revision_rate_update_offered.json }
              completed_project: { $ref: ../../../fixtures/api/revision_completed_project.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  delete:
    operationId: abandonRevision
    tags: [revisions]
    summary: Abandon the current revision
    description: >-
      The project returns to its state at the last marked revision, and the lines of the
      abandoned revision are deleted (WF-REV-0010, WF-DAT-0010). Without a marked revision,
      the abandonment leaves the project without a revision, in the Pricing state, and
      `ProjectCommand.create_revision` becomes available again (WF-REV-0010, WF-CYC-0020).
      The risks return to the assessment of the last marked revision — probability, state,
      own structure, provision line and cost at occurrence —: a risk created in the abandoned revision disappears, a
      review it carried is undone, and a risk declared occurred in it becomes identified again
      with its provision line, without a cost at occurrence — only the abandonment undoes the
      occurrence (WF-RIS-0020, WF-RIS-0060) —, and the category, the subproject and the task
      of its provision that it had changed are restored (`updateRiskProvision`). The label,
      the description and the mitigation actions of a risk that remains are project data,
      which the abandonment does not change (`updateRisk`, WF-RIS-0020; H-02, #1782); its
      counter (`Risk.lock_version`) moves forward, its assessment as read changing, and never
      goes back. Refused on a marked revision (WF-DAT-0020), and while a background task runs
      on it, as its `abandon` command says. The abandonment is irreversible, outside of undo:
      it is not recorded in the history that `undoLastChange` undoes, the revision and its
      lines being gone (WF-IHM-0110, C-363); the screen says so in its confirmation. It
      carries the counter of the revision as read: a revision whose counter has moved since it
      was read — by a write of the revision itself, such as a rate update — is not abandoned;
      an entry into its structures does not move it (`Revision.lock_version`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - name: lock_version
        in: query
        required: true
        description: >-
          The counter of the abandoned revision, as the screen read it (`Revision.lock_version`):
          when stale, the abandonment is refused with 412 and nothing is deleted (WF-IHM-0110;
          the author's decision of 2026-10-28, E-13, US-0702/L2).
        schema: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '204':
        description: Revision abandoned.
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The `abandon` command of the revision is unavailable: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` the first condition it lacks, in the order in which it
          names them — `revision_draft` on a marked revision, which can no longer be modified
          (WF-DAT-0020), then `no_background_task_running` during a marking, a merge, the
          processing of an occurrence or the application of an import, which write to the
          revision or freeze it (E-13, US-0702/L2). Nothing is deleted.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_marked: { $ref: ../../../fixtures/api/revision_abandon_marked.json }
      '412':
        description: >-
          `STALE_LOCK_VERSION`: the revision has been written since it was read, and nothing is
          abandoned; `params.expected_lock_version` is its current counter (WF-IHM-0110,
          US-0702/L2).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/revision_abandon_stale.json }
      '422': { $ref: ../components/responses.yaml#/LockVersionInvalid }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/mark:
  post:
    operationId: markRevision
    tags: [revisions]
    summary: Mark the revision
    description: >-
      Freezes the revision and computes its indicators in the same transaction
      (WF-REV-0020, WF-DAT-0040); a revision marked before the In progress state keeps
      only the estimate indicators. The version name is unique among the marked
      revisions of the project. Handed to the worker (WF-ARC-0090), and recorded in the
      audit log (WF-SEC-0030). The next revision is created only on request. The computation
      is refused as long as a labour category used by the role of a line has no hourly rate
      for the reference year of the revision: the task fails without freezing anything, its
      reason `HOURLY_RATE_MISSING`, `params.missing_rates` naming the categories one by one
      (`BackgroundTaskRef.problem`, `task_failed`; WF-DEV-0010, WF-IHM-0080).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/RevisionMark }
    responses:
      '202':
        description: Marking queued.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              queued: { $ref: ../../../fixtures/api/task_mark_queued.json }
              relaunched: { $ref: ../../../fixtures/api/task_mark_relaunched.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Version name already used by a marked revision of the project: `ALREADY_EXISTS`,
          `fields` designating `/version_name` with `ALREADY_EXISTS`,
          `fields[].params.conflicting_object_id` the revision that carries it. Or the `mark`
          command of the revision is unavailable: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` the first condition it lacks, in the order in which it
          names them — `revision_draft` on an already marked revision (WF-REV-0020,
          WF-DAT-0020), then `no_background_task_running` during a running marking, a merge,
          the processing of an occurrence or the application of an import (E-12, US-0702/L2),
          then `no_restore_running` while a restore is queued or running, which replaces the
          database where the marking would be written (WF-ADM-0160). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              version_name_taken: { $ref: ../../../fixtures/api/mark_version_name_taken.json }
              revision_marked: { $ref: ../../../fixtures/api/mark_revision_marked.json }
              restore_running: { $ref: ../../../fixtures/api/mark_restore_running.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/reference-revision:
  put:
    operationId: designateReferenceRevision
    tags: [revisions]
    summary: Designate the reference revision
    description: >-
      Manual designation is possible as long as the project has received no actual cost and
      no revision has been marked since the last designation; beyond that, the reference
      moves only when an amendment is contracted (WF-REV-0040).
      Recorded in the audit log (WF-SEC-0030). The
      designation moves the project to In progress if the conditions of WF-CYC-0030
      are met. A write of the project, it carries the project's counter as read
      (`ReferenceDesignation.lock_version`, WF-IHM-0110): two concurrent designations do not
      override each other, even when no revision has been marked between them.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/ReferenceDesignation }
    responses:
      '200':
        description: >-
          Reference designated: the project, its new reference and its state — In progress if
          it carries its project code (WF-CYC-0030).
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Project }
            examples:
              designated: { $ref: ../../../fixtures/api/reference_designated.json }
      '400':
        description: >-
          An unreadable body, `MALFORMED_REQUEST`; or a designation without its confirmation,
          `confirmed` absent or false: `CONFIRMATION_REQUIRED`, without a parameter, like the
          exit (`exitProject`, `project_exit_unconfirmed`) and the restore (US-0702/L3). Nothing
          is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              unconfirmed: { $ref: ../../../fixtures/api/reference_designate_unconfirmed.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`, nothing being written. On a terminal project, where the
          command is not listed, `params.missing_condition` set to `project_not_terminal`, before
          any other (WF-CYC-0100; `project_terminal`, #1674). Otherwise, a condition that the
          `designate_reference` command of the revision says is missing, the first in the order
          in which it lists them: a current revision, `revision_marked`; a revision whose main
          structure carries no task or no estimate line, likewise set to
          `revision_has_tasks_and_lines` — "The designation as reference of a revision that
          carries no task or no estimate line is refused, naming the missing condition"
          (WF-CYC-0030), the project remaining without a reference
          (`reference_without_tasks`); a designation that can no longer be corrected, the
          project having received an actual cost or a revision having been marked since the last
          designation, likewise set to `reference_correctable` (WF-REV-0040; J-01, #1795;
          `reference_not_correctable`); or, during the marking of the revision, the only
          background task after which it would be designable, `no_background_task_running`
          (EP-15/US-0490).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              without_tasks: { $ref: ../../../fixtures/api/reference_without_tasks.json }
              not_correctable: { $ref: ../../../fixtures/api/reference_not_correctable.json }
              project_terminal: { $ref: ../../../fixtures/api/reference_designation_terminal.json }
      '412':
        description: >-
          `STALE_LOCK_VERSION`: the project has been written since it was read, and the
          reference does not change; `params.expected_lock_version` is its current counter
          (WF-IHM-0110, US-0702/L2).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/reference_designate_stale.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/rate-update:
  get:
    operationId: getRateUpdateProposal
    tags: [revisions]
    summary: Proposed rate difference, category by category
    description: >-
      Presented at the creation of a revision whose reference year differs from that of the
      previous revision, whether the reference data has changed or not (WF-REV-0060). A
      category without a rate for the year retained keeps its previous rate, projected by
      the inflation rate (WF-REV-0060).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    responses:
      '200':
        description: Update proposal.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/RateUpdateProposal }
            examples:
              none: { $ref: ../../../fixtures/api/rate_update_none.json }
              reference_created: { $ref: ../../../fixtures/api/rate_update.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: applyRateUpdate
    tags: [revisions]
    summary: Apply the rate update
    description: >-
      Carries the rates of the year over to the lines of the current revision, for the
      categories retained (WF-REV-0060). An update declined at the creation of the revision
      can be accepted later from the current revision, as long as it is not marked, and
      reprices it at the rate of its reference year for each accepted category (C-362); a
      marked revision keeps the rates and the amounts it has computed (WF-REF-0130,
      WF-DAT-0020). Refused with 403 for whoever lacks the `revisions.write` permission, that
      of revision management (see `RevisionCommand`, command `apply_rate_update`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/RateUpdateApply }
    responses:
      '200':
        description: >-
          Rates updated on the categories retained; the revision, one version higher.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/Revision }
            examples:
              applied: { $ref: ../../../fixtures/api/rate_update_applied.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The `apply_rate_update` command of the revision does not say it is available:
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` the first missing condition, in
          the order in which the command lists them, nothing being written — `revision_draft`
          for a marked revision, which can no longer be updated (WF-REV-0060, WF-DAT-0020);
          `rate_update_available` when the proposal presents no category
          (`getRateUpdateProposal`); `no_background_task_running` while a background task runs
          on the revision (EP-15/US-0490; #1351).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_marked: { $ref: ../../../fixtures/api/rate_update_revision_marked.json }
              not_available: { $ref: ../../../fixtures/api/rate_update_not_available.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          A category that the proposal does not present (`getRateUpdateProposal`):
          `VALIDATION_FAILED`, `fields` on `/cost_category_ids/<n>`, its rank in the list
          sent, with `UNKNOWN_COST_CATEGORY` (`category_not_proposed`); or an empty list, on
          `/cost_category_ids`. Nothing
          is written (`RateUpdateApply`, WF-REV-0060; #1755).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              category_not_proposed:
                $ref: ../../../fixtures/api/rate_update_category_not_proposed.json
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/comparison:
  get:
    operationId: compareRevisions
    tags: [revisions]
    summary: Compare two marked revisions
    description: >-
      The tree of the compared revision, with the marks of a differential, and the amount
      differences by cost type and by subproject, matched by the lineage identifier
      (WF-REV-0080, WF-DAT-0030, C-361). The comparison is read like `listNodes` (#1193): the
      same parameters, shared — `kinds`, the search, the filters of each column, bounds,
      periods, marks and lists, the sorting of the lines and `fields` (WF-IHM-0130) —, the same
      response — `items`, `totals` and `meta` —, and the same mechanics: the
      main structure of the compared revision (`to_revision_id`) is returned whole, in
      plan order, without pagination, as `listNodes` returns a structure, and a filtered
      read — a subtree (`subtree_of`), the tasks only (`kinds`), a search — is a window onto
      it, retained as `listNodes` retains it; `fields` chooses what it returns of each node.
      Each node carries its difference from the base revision
      (`from_revision_id`) — `difference` and `changes`, always returned —, and those that the
      base revision carried and that the compared one no longer has are returned in the place
      they had, read-only (`NodeDifference`): a task added, removed or modified — in its dates,
      its duration, its state or its parent —, a line in its amounts or its parent, and a
      summary task whose content changes, marked modified. The filters, the search and the
      sorting apply to it as to the reading of a differential: a removed node is judged on its
      values in the base revision, like any other node on its own, and without sorting it
      stays in the place it had (#1205). `difference` retains only the differences named,
      including their ancestors, as on a differential (`NodeDifferenceFilter`,
      `differences`, #1398). A column filter applies to the quantity
      that the comparison displays for the column, that of the compared revision
      (`to_revision_id`) — the duration, the float, a date, an amount of the node as that
      revision carries it, never the difference from the base revision, which `difference`
      states —, and to that of the base for a removed node; it is judged, combined and refused
      like that of `listNodes`, which states its rule: a malformed bound, a malformed date, an
      upper bound lower than the lower one or an end before the start are refused with 422.
      `subtree_of` names a task of the returned tree, a removed task included: the window is
      then the subtree it had in the base revision, its removed nodes in their place, zero
      totals — the compared revision no longer has any line of it — and the differences of its
      removed lines. `totals` is that of `listNodes` on the compared revision: the lines
      retained, without the removed nodes, which no longer belong to it, `difference` not
      restricting it (`NodeTotals`); `meta` describes the structure of the
      compared revision (`NodeListMeta`). `amount_deltas` comes in every response, like
      `totals`, and is computed on the lines retained, removed ones included, whatever `kinds`
      is, those that `difference` alone retains under that filter: a read
      without a filter returns the differences of the whole structure, that of a subtree its own
      (`comparison`); a moved line counts in the window of its parent in the compared
      revision, for its whole difference (`amount_deltas`). The grid of the comparison is that
      of the structures, with the same marks as the reading of a differential. An identical
      pair — the same revision twice — returns every node unchanged and no amount difference,
      never a refusal. Between two revisions of different reference years, a line of which only
      the rate changed is modified by its re-estimated amount alone, its budgeted amount
      unchanged (`NodeChange`, `amount_deltas`; WF-REV-0060, #1754). Both revisions are marked
      revisions of the project ("Two marked revisions", WF-REV-0080): the current revision,
      which still changes under its reader, is refused with 409, and a revision of another
      project with 404.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: from_revision_id
        in: query
        required: true
        description: >-
          The base revision, a marked revision of the project, against which the differences
          are counted (WF-REV-0080).
        schema: { $ref: ../components/common.yaml#/Uuid }
      - name: to_revision_id
        in: query
        required: true
        description: >-
          The compared revision, a marked revision of the project, whose tree is returned
          (WF-REV-0080).
        schema: { $ref: ../components/common.yaml#/Uuid }
      - $ref: ../components/parameters.yaml#/NodeKinds
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/NodeSubtreeOf
      - $ref: ../components/parameters.yaml#/SubprojectFilter
      - $ref: ../components/parameters.yaml#/NodeCostTypeFilter
      - $ref: ../components/parameters.yaml#/NodeOrderItemFilter
      - $ref: ../components/parameters.yaml#/NodeWorkPackageFilter
      - $ref: ../components/parameters.yaml#/NodeCostCategoryFilter
      - $ref: ../components/parameters.yaml#/NodeResourceRoleFilter
      - $ref: ../components/parameters.yaml#/NodeProgressFilter
      - $ref: ../components/parameters.yaml#/NodeCriticalFilter
      - $ref: ../components/parameters.yaml#/NodeSummariesOnly
      - $ref: ../components/parameters.yaml#/NodeMaxLevel
      - $ref: ../components/parameters.yaml#/NodeTimelineFilter
      - $ref: ../components/parameters.yaml#/NodeDifferenceFilter
      - $ref: ../components/parameters.yaml#/NodeDescriptionFilter
      - $ref: ../components/parameters.yaml#/NodeSchedulingModeFilter
      - $ref: ../components/parameters.yaml#/NodeDurationMin
      - $ref: ../components/parameters.yaml#/NodeDurationMax
      - $ref: ../components/parameters.yaml#/NodeStartFrom
      - $ref: ../components/parameters.yaml#/NodeStartTo
      - $ref: ../components/parameters.yaml#/NodeFinishFrom
      - $ref: ../components/parameters.yaml#/NodeFinishTo
      - $ref: ../components/parameters.yaml#/NodePhysicalProgressMin
      - $ref: ../components/parameters.yaml#/NodePhysicalProgressMax
      - $ref: ../components/parameters.yaml#/NodeTotalFloatMin
      - $ref: ../components/parameters.yaml#/NodeTotalFloatMax
      - $ref: ../components/parameters.yaml#/NodeStartedOnFrom
      - $ref: ../components/parameters.yaml#/NodeStartedOnTo
      - $ref: ../components/parameters.yaml#/NodeCompletedOnFrom
      - $ref: ../components/parameters.yaml#/NodeCompletedOnTo
      - $ref: ../components/parameters.yaml#/NodeMilestoneFilter
      - $ref: ../components/parameters.yaml#/NodeFinishOverdueFilter
      - $ref: ../components/parameters.yaml#/NodeQuantityMin
      - $ref: ../components/parameters.yaml#/NodeQuantityMax
      - $ref: ../components/parameters.yaml#/NodeHoursMin
      - $ref: ../components/parameters.yaml#/NodeHoursMax
      - $ref: ../components/parameters.yaml#/NodeUnitDisbursementMin
      - $ref: ../components/parameters.yaml#/NodeUnitDisbursementMax
      - $ref: ../components/parameters.yaml#/NodePaymentDelayMin
      - $ref: ../components/parameters.yaml#/NodePaymentDelayMax
      - $ref: ../components/parameters.yaml#/NodeConsumptionYearMin
      - $ref: ../components/parameters.yaml#/NodeConsumptionYearMax
      - $ref: ../components/parameters.yaml#/NodeBaseAmountMin
      - $ref: ../components/parameters.yaml#/NodeBaseAmountMax
      - $ref: ../components/parameters.yaml#/NodeBudgetedAmountMin
      - $ref: ../components/parameters.yaml#/NodeBudgetedAmountMax
      - $ref: ../components/parameters.yaml#/NodeReestimatedAmountMin
      - $ref: ../components/parameters.yaml#/NodeReestimatedAmountMax
      - $ref: ../components/parameters.yaml#/NodePreviousQuantityMin
      - $ref: ../components/parameters.yaml#/NodePreviousQuantityMax
      - $ref: ../components/parameters.yaml#/NodePreviousHoursMin
      - $ref: ../components/parameters.yaml#/NodePreviousHoursMax
      - $ref: ../components/parameters.yaml#/NodePreviousUnitDisbursementMin
      - $ref: ../components/parameters.yaml#/NodePreviousUnitDisbursementMax
      - $ref: ../components/parameters.yaml#/NodePreviousReestimatedAmountMin
      - $ref: ../components/parameters.yaml#/NodePreviousReestimatedAmountMax
      - $ref: ../components/parameters.yaml#/NodeInactiveObjectFilter
      - $ref: ../components/parameters.yaml#/NodeIsFromRiskFilter
      - $ref: ../components/parameters.yaml#/NodeOriginRiskFilter
      - $ref: ../components/parameters.yaml#/NodeSortBy
      - $ref: ../components/parameters.yaml#/SortOrder
      - $ref: ../components/parameters.yaml#/NodeFields
    responses:
      '200':
        description: Comparison.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/RevisionComparison }
            examples:
              witness: { $ref: ../../../fixtures/api/comparison.json }
              volume: { $ref: ../../../fixtures/api/volume/comparison_volume.json }
              identical: { $ref: ../../../fixtures/api/comparison_identical.json }
              differences: { $ref: ../../../fixtures/api/comparison_differences.json }
              moved: { $ref: ../../../fixtures/api/comparison_moved.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404':
        description: >-
          The project, or either revision, is nonexistent or invisible, as the common
          `NotFound` response states; a revision that is not one of the project's is refused
          likewise (WF-ADM-0110).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
      '409':
        description: >-
          Either revision is the current revision, not marked: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` set to `revision_marked`. Only marked revisions are
          compared (WF-REV-0080, WF-DAT-0020); nothing is read.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_draft: { $ref: ../../../fixtures/api/comparison_revision_draft.json }
      '422':
        description: >-
          A column filter refused, as `listNodes` refuses it (README): a malformed bound with
          `NUMBER_INVALID`, a date with `DATE_INVALID`, an upper bound lower than the lower one
          with `VALUE_OUT_OF_RANGE` on `/query/<column>_max`, `params.minimum` the lower bound
          given, a period end before its start with `VALUE_OUT_OF_RANGE` on
          `/query/<column>_to`, `params.minimum` the start given (WF-IHM-0130); `fields` on
          the parameter. An unknown property of `fields`, and a risk of `origin_risk_ids` that
          is not an occurred risk of the project, as `listNodes` refuses them (`NodeFields`,
          `fields_unknown`, `NodeOriginRiskFilter`).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              period_inverted: { $ref: ../../../fixtures/api/nodes_period_inverted.json }
              bounds_inverted: { $ref: ../../../fixtures/api/nodes_bounds_inverted.json }
              fields_unknown: { $ref: ../../../fixtures/api/nodes_fields_unknown.json }
              origin_risk_unknown: { $ref: ../../../fixtures/api/nodes_origin_risk_unknown.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures:
  get:
    operationId: listCostStructures
    tags: [revisions]
    summary: Cost structures of the revision
    description: >-
      A main structure, and where applicable differentials and one own structure per risk
      (WF-REV-0100). Each one states its entry commands
      (`available_commands`): the planning, estimate or remaining to commit grid that reads it
      offers entry or not depending on the phase of the project, which the front end does not
      infer (WF-DEV-0050, WF-RAE-0040, WF-IHM-0090).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    responses:
      '200':
        description: Structures.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/revisions.yaml#/CostStructure }
            examples:
              witness: { $ref: ../../../fixtures/api/structures.json }
              amendments: { $ref: ../../../fixtures/api/structures_amendments.json }
              without_tasks: { $ref: ../../../fixtures/api/structures_without_tasks.json }
              estimator: { $ref: ../../../fixtures/api/structures_estimator.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createCostStructure
    tags: [revisions]
    summary: Open a differential
    description: >-
      Several differentials can coexist, and each one is merged or abandoned
      independently (WF-REV-0100). The differential is born as a copy of the main structure of
      its revision, its planning start date included (`CostStructure.planning_start_on`): at
      its creation, each of its nodes is that of the main structure, `unchanged`
      (`NodeDifference`, C-361), and the merge reads in it only what has changed since
      (WF-REV-0050). The own estimate of a
      risk is born with it (`createRisk`, WF-RIS-0030) and disappears with it; the main
      structure exists from the revision onwards: neither one nor the other is created here.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/StructureCreate }
    responses:
      '201':
        description: Structure created.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/CostStructure }
            examples:
              amendment: { $ref: ../../../fixtures/api/amendment_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The `create_structure` command of the revision is unavailable:
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` the first condition it lacks —
          `revision_draft` on a marked revision, which can no longer be modified
          (WF-DAT-0020), then `no_background_task_running` during a marking, a merge, the
          processing of an occurrence or the application of an import (WF-REV-0100; E-14,
          US-0702/L2). The label is not unique: several differentials coexist, each one
          designated by its identifier. Nothing is created.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_marked: { $ref: ../../../fixtures/api/structure_create_revision_marked.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}:
  patch:
    operationId: updateCostStructure
    tags: [revisions]
    summary: Modify the planning start date and the label of a structure
    description: >-
      Writes the planning start date of the structure and its label (WF-PLA-0020,
      WF-REV-0100), under its planning command (`StructureCommand.edit_planning`): guarded
      by `planning.write`, refused like it on a marked revision or while a background task
      runs. Only what is sent changes, the counter as read being required (`StructureUpdate`).
      A task in automatic mode without a predecessor starts at the planning start date, at the
      first worked hour of its applicable calendar: changing it re-dates these tasks and
      their automatic successors — "bringing this date forward by one week brings it forward
      by as much, as well as its automatic successors" (WF-PLA-0020) —, tasks in manual mode
      not moving. The response is that of a grid write, without a node written
      (`NodesWritten`). The date is judged on the default calendar, the structure having no
      calendar of its own: a day without any worked hour is refused, and the refusal names the
      next working day; nothing is written (WF-PLA-0010, WF-PLA-0020). A write of the caller's
      undoable history (`undoLastChange`, `UndoneKind.structure_update`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/StructureUpdate }
    responses:
      '200':
        description: >-
          Structure modified: the tasks it re-dates, their amounts, inflation included, when
          they change year, the summary tasks recomputed, the totals and the counter of the
          structure (`NodesWritten`, WF-PLA-0020, WF-DEV-0040).
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/NodesWritten }
            examples:
              advanced: { $ref: ../../../fixtures/api/volume/structure_planning_start_advanced.json }
              label_updated: { $ref: ../../../fixtures/api/structure_label_updated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The `edit_planning` command of the structure is unavailable:
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` the first condition it lacks, in
          the order in which it names them — `revision_draft` on a marked revision
          (WF-DAT-0020), then `no_background_task_running` during a background task that writes
          into the current revision or freezes it (`StructureCommand`); `project_not_terminal`
          on a terminal project (WF-CYC-0100). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_marked: { $ref: ../../../fixtures/api/structure_update_revision_marked.json }
      '412':
        description: >-
          `STALE_LOCK_VERSION`: the structure has been written since it was read — a grid entry,
          or a change of its planning start date or label —, and nothing is written;
          `params.expected_lock_version` is its current counter (`StructureUpdate.lock_version`,
          WF-IHM-0110).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/structure_update_stale.json }
      '422':
        description: >-
          A planning start date on a day without any worked hour in the default calendar:
          `fields` on `/planning_start_on` with `NON_WORKING_DAY`, `fields[].params.date` the
          date sent and `next_working_day` the next working day; nothing is written
          (WF-PLA-0020, WF-PLA-0010). Or, without `fields`, a date that would take the duration
          of the project beyond fifteen years: `PROJECT_HORIZON_EXCEEDED`, `params.task` naming
          the task by its node and its label (WF-PLA-0150). Or an empty label
          (`VALIDATION_FAILED`).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              non_working_day: { $ref: ../../../fixtures/api/structure_start_non_working_day.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/merge:
  get:
    operationId: getStructureMergeReport
    tags: [revisions]
    summary: Preliminary report of the merge of a differential
    description: >-
      "Before application, the merge presents a report: tasks and lines added, modified and
      removed, started tasks that will be completed, and reasons for refusal (WF-PLA-0030,
      WF-PLA-0150, WF-PLA-0170); it is applied only after confirmation" (WF-REV-0050). A
      read, which writes nothing: abandoning at this stage means not confirming, and the
      revision remains unchanged. The report is read like that of an import
      (`StructureMergeReport`); as long as `refusals` is not empty, the merge does not apply,
      and the screen does not offer its confirmation. It describes the current revision at the
      moment of the read, and the confirmed merge (`mergeCostStructure`) judges again: an
      entry made in the meantime in the main structure or in the differential causes the
      confirmation to be refused with 412, the counters the report read having moved forward;
      what changes outside the two trees — a calendar of the reference data, the work
      breakdown — and would cause it to be refused makes the background task fail with the
      reason for the refusal. Only an
      unmerged differential of the current revision has a report — or, as long as the project
      has no current revision, an unmerged differential of the last marked revision, whose
      merge first creates the current revision by copy (WF-REV-0050, WF-REV-0010;
      `StructureMergeReport.creates_current_revision`, #790); its differences are then those
      of the differential with the main structure of that marked revision, which the copy
      carries over as is. Another structure is refused with 409, like its merge
      (EP-14/L42s).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    responses:
      '200':
        description: What the merge would do, and what refuses it.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/StructureMergeReport }
            examples:
              applicable: { $ref: ../../../fixtures/api/structure_merge_report.json }
              started_task: { $ref: ../../../fixtures/api/structure_merge_report_started_task.json }
              refused: { $ref: ../../../fixtures/api/structure_merge_report_refused.json }
              provision_moved: { $ref: ../../../fixtures/api/structure_merge_report_provision_moved.json }
              link_cycle: { $ref: ../../../fixtures/api/structure_merge_report_link_cycle.json }
              link_forbidden: { $ref: ../../../fixtures/api/structure_merge_report_link_forbidden.json }
              horizon_exceeded: { $ref: ../../../fixtures/api/structure_merge_report_horizon_exceeded.json }
              without_current_revision: { $ref: ../../../fixtures/api/structure_merge_report_without_current_revision.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          This structure has no merge report: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` the first missing condition, as in the 409 of its merge
          (`mergeCostStructure`).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_marked: { $ref: ../../../fixtures/api/merge_revision_marked_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: mergeCostStructure
    tags: [revisions]
    summary: Merge a differential into the main structure
    description: >-
      The merge gives the lines that the differential designates the reference quantities it
      carries, from which their budgeted amount is derived; a designated line of a task not
      started, which nobody has re-estimated since the reference, also takes these quantities as
      its current quantities; the current quantities and the re-estimated amount of all other
      lines are kept (WF-REV-0050, WF-DEV-0020). The marked revision receives the version name
      and the description of the confirmation, as at any marking (WF-REV-0020). A task already
      started is never removed: its remaining to commit is brought to zero. The resulting
      marked revision becomes the reference (WF-REV-0050). A task that the merge adds carries
      no attachment to the work breakdown, the differential carrying none, and an existing
      task that the differential modifies keeps its own (WF-PLA-0170). Handed to the worker
      and recorded in the audit log (WF-ARC-0090, WF-SEC-0030). A merge that would give a task
      of the main structure a labour line whose role would leave it without any worked hour
      in the week fails without merging anything: the background task ends in failure,
      `problem.code` set to `TASK_WITHOUT_WORKING_HOURS`, its `params` naming the roles and
      tasks concerned (WF-PLA-0010). "A merge that would move the task of an item out of the
      subtree of the task of its work package is refused, naming the task" (WF-PLA-0170): it
      likewise fails without merging anything, `problem.code` set to
      `ORDER_ITEM_OUTSIDE_WORK_PACKAGE`, `params.work_package_task` naming the task of the
      work package and `order_item_tasks` those of the items that would leave it, each one by
      its node and its label (`Problem.params`), like `TASK_WITHOUT_WORKING_HOURS`
      (WF-IHM-0080; `task_merge_outside_work_package`). A merge that would close a loop of
      links in the main structure likewise fails, `problem.code` set to `LINK_CYCLE`,
      `params.cycle` naming the tasks of the loop (WF-PLA-0030; `task_merge_link_cycle`); a
      merge that would link a summary task to its subordinate, `problem.code` set to
      `LINK_FORBIDDEN`, `params.link` naming the two tasks, the summary task first
      (WF-PLA-0030; `task_merge_link_forbidden`, #1582); a merge that would take the duration
      of the project beyond fifteen years, `problem.code` set to `PROJECT_HORIZON_EXCEEDED`,
      `params.task` naming the task concerned (WF-PLA-0150; `task_merge_horizon_exceeded`) —
      each one by its node in the main structure and its label, the node null for a task that
      the differential adds (`Problem.params`; #788). The preliminary report
      (`getStructureMergeReport`, WF-REV-0050) states these reasons before the confirmation,
      which carries the counters of the two structures it read: refused with 412 if either
      has changed since, it never applies a report that nobody has seen (EP-14/L42s). "When
      the project has no current revision, it first creates one" (WF-REV-0050): the merge is
      then requested on the differential of the last marked revision, which then carries the
      `merge_structure` command, and the same background task creates the current revision by
      copying it (WF-REV-0010), priced at the kept rates, projected (WF-REV-0060), merges the
      copy of the differential into it and marks it; the marked revision is not modified. The
      task is a single operation: on failure, it leaves neither a current revision nor a
      merge, and the project remains without a current revision (#790). To price the revision
      at the rates of the new year, it is created first (`createRevision`), and the merge is
      requested on it. On an older marked revision, or on the last one once a revision is
      current, the merge is refused with 409, like the report.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/StructureMerge }
    responses:
      '202':
        description: Merge queued.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              queued: { $ref: ../../../fixtures/api/task_merge_queued.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The state forbids the merge of this structure: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` the first missing condition, in the order in which the
          `merge_structure` command of the revision names them — `unmerged_amendment_exists` for
          a structure that is not an unmerged differential, `revision_draft` for a
          differential of a marked revision that
          is not the last one, or of a project that has a current revision: thus when, since
          the report was read, an entry or an import has opened the current revision, or
          another merge has marked a more recent revision (WF-REV-0050; #790). On the
          last marked revision of a project without a current revision, the merge would create
          the current revision: for whoever lacks `revisions.write`, the command then names
          `may_create_revision`, after `unmerged_amendment_exists`, and the merge is refused
          likewise, `params.missing_condition` set to `may_create_revision` — a 409 and not a
          403, as for imports and `declare_risk`, the permission being refused only where it
          would create the revision (WF-REV-0050, WF-REV-0010). Or a version name already used
          by a marked revision of the project, as for `markRevision`: `ALREADY_EXISTS`, `fields`
          designating `/version_name` with `ALREADY_EXISTS`,
          `fields[].params.conflicting_object_id` the revision that carries it (WF-REV-0020);
          judged at submission, nothing is queued, and no current revision is created only to
          fail at the marking (E-05, US-0702/L2). The check of the state and the submission of
          the task are done under the lock of the project, which holds its current revision.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_marked: { $ref: ../../../fixtures/api/merge_revision_marked_refused.json }
              may_create_revision: { $ref: ../../../fixtures/api/merge_may_create_revision_refused.json }
              version_name_taken: { $ref: ../../../fixtures/api/merge_version_name_taken.json }
      '412':
        description: >-
          The main structure or the differential has changed since the confirmed report — a
          task started, a line re-estimated, the differential modified —: the report is stale,
          and nothing is merged (WF-REV-0050, WF-IHM-0110; EP-14/L42s). The check of the two
          counters and the submission of the merge task are done in a single transaction, under
          the lock of the two structures: no write slips in between them. `STALE_LOCK_VERSION`,
          `params.expected_lock_version` the current counter of the differential, the object
          that the path names, even when only the main structure has changed, and nothing else,
          like any 412 (#296); the client reads the report again, which returns both.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              report_stale: { $ref: ../../../fixtures/api/merge_report_stale.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/revisions/{revision_id}/structures/{structure_id}/nodes:
  get:
    operationId: listNodes
    tags: [revisions]
    summary: Common tree of the structure
    description: >-
      The same tasks, seen from the side of time or from the side of money: a task carries
      its estimate lines (§3.5.1, WF-DEV-0020). `row_number` and `level` are computed
      on read; computed values cannot be entered (WF-IHM-0030). It is
      the source of the four views of the tree: planning grid (WF-PLA-0080), read-only Gantt
      chart (WF-PLA-0090), task tree (WF-PLA-0110) and
      estimate grid (WF-DEV-0050) — and of the timelines, which read only the registered
      tasks of it (WF-PLA-0140).

      The structure is returned whole, without pagination: a revision carries at most ten
      thousand objects (§4.6.2), and a tree is not read by pages. Sorting, filters and
      totals are the server's business, and the front end neither orders nor sums anything. A
      tree grid is not sorted: the tasks keep the order of the tree, and sorting
      there is only a sorting of the estimate lines under each task, each line staying under
      its own (WF-IHM-0060, `sort_by`): sorted by decreasing amount, the estimate returns under
      each task its lines from the largest amount to the smallest, and its tasks in their place
      (`estimate_sorted`); a line without hours comes after the others in ascending order of
      hours, before them in descending order (`estimate_hours`). The estimate and remaining to
      commit grids sort this way, in both directions, by each of the columns they
      present for the lines; the planning grid, which does not return the lines, offers
      no sorting, nor does the Gantt chart, the task tree or a
      timeline. A filter on a
      task — progress, criticality, subtree, summary task, level, timeline —
      retains the tasks that satisfy it with the lines they carry; a filter on
      a line — cost type, category, role, subproject — retains the lines that
      satisfy it; the search applies to the labels of both, and a task retained by
      it keeps its lines. The filters combine, and the ancestors of the retained nodes
      are returned so that the tree remains readable — except with `timeline_id`: a timeline
      is not a tree, and presents only the tasks registered in it (WF-PLA-0140).
      The totals are those of the lines retained, except under `difference`, which does not
      restrict them. Each column of the three grids can be filtered
      (WF-IHM-0060, WF-IHM-0130), according to the convention of the README of the contract: a
      column of numbers by its two bounds inclusive, `<column>_min` and `<column>_max`, a column
      of dates by its period, `<column>_from` and `<column>_to`, end inclusive, a mark by a
      boolean, the mode by a list, the description by the text it contains. Those of the
      task — description, mode, duration and float in days, start, finish, physical progress,
      start and completion dates, milestone, finish overdue — retain tasks, with their
      lines; those of the line — quantities, payment delay, consumption year, current and
      previous amounts, deactivated object — retain lines, the bound of an amount
      applying to that of the line, never to that of a task (`nodes_estimate_filtered`).
      Those of the origin, `is_from_risk` and `origin_risk_ids`, retain the nodes, tasks and
      lines, that the occurrence of a risk has merged, each one judged on its own
      (`Node.origin_risk_id`, `nodes_from_risk`; WF-RIS-0060, #1761).
      A malformed bound is refused with 422 `NUMBER_INVALID`, a date with `DATE_INVALID`,
      an upper bound lower than the lower one or an end before the start with
      `VALUE_OUT_OF_RANGE`, `fields` on the parameter (README). The predecessors, a list of
      links, are not filtered; the label is searched (`search`). The filter by work package or
      by item (`work_package_id`, `order_item_id`) retains the subtree of the task attached to
      the work package or the item: the work breakdown serves as a reading grid through this
      attachment alone, which only the main structure carries (WF-PLA-0170). `kinds` is not a
      filter: it chooses what the grid returns — the planning does not return the lines —, and
      the totals do not change with it.

      The task tree reads `kinds=task`, `summaries_only` and `max_level`: the summary tasks
      only, down to the level requested, under the project node that the front end draws
      (WF-PLA-0110), and offers the levels that `meta.summary_depth` says exist, that of the
      deepest summary task of the structure, whatever the filters; a
      timeline reads `kinds=task` and `timeline_id` (WF-PLA-0140). The front end neither sorts
      nor selects anything of what it receives.

      `row_number` numbers the whole structure, its tasks and its lines in plan
      order: a node keeps its number whatever `kinds`, the filters, the search
      and the sorting, and a predecessor is named by its own even when the read does not
      return it (`predecessor_row_number`, WF-PLA-0080).

      `fields` chooses what the read returns of each node: a grid requests only
      what it displays, otherwise six thousand whole nodes weigh several megabytes
      (§4.6.2). Each name is a property of `Node` — a facet named this way is
      returned whole — or a property of a facet, `task.<property>` or
      `estimate_line.<property>`, which returns the facet with only its named properties;
      `node_id`, `row_number`, `level` and `lock_version` are always returned. A facet
      of which nothing is named is omitted. Without `fields`, each node is returned whole. The
      properties that `Node` and its facets require are required of a read without `fields`:
      a read that names some returns only what it names.

      The read of a differential is a diff with the main structure of its revision, which
      the server computes and which the front end does not recompute (WF-REV-0100, C-361):
      each node carries its difference, `difference` — added, removed, modified or unchanged —
      and what changes about it, `changes`, matched by lineage, and the nodes that the
      differential removes are returned in the place they had, between the nodes that
      surrounded them, read-only (`NodeDifference`); a moved node is returned once, in its new
      place, modified in its parent. `difference` and `changes` are always returned there,
      like the four; the totals do not count the removed nodes, which are no longer part of
      the structure (`nodes_amendment`).
      A filter, the search and a sorting judge a removed node on its base values — those
      of the main structure, which it still carries —, like any other node on its own:
      a filter on a task retains it if its base values satisfy it, a sorting places a
      removed line among the lines of its task by its base value in the sorted column, and
      without sorting it stays in the place it had (#1205). `difference` retains only the
      differences named, added, removed or modified — "Differences only" names all three —,
      including their ancestors, themselves modified by their content: the filtered tree
      remains a tree, and the totals remain those of the read without it
      (`NodeDifferenceFilter`, `amendment_differences`, #1398).
      On the main structure and on the own estimate of a risk, `difference` is null or
      omitted, and the `difference` filter has no effect there: the read is the one without it.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/RevisionId
      - $ref: ../components/parameters.yaml#/StructureId
      - $ref: ../components/parameters.yaml#/NodeKinds
