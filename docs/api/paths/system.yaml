/health:
  get:
    operationId: getLiveness
    tags: [system]
    security: []
    summary: Liveness probe, and the maintenance of a restore
    description: >-
      Answers as soon as the process has started, without touching any data component. It also
      reports the maintenance of a restore (`startRestore`, WF-ADM-0160): `status` is
      `maintenance` as long as the platform is in maintenance, every other operation then
      answering 503 `COMPONENT_UNAVAILABLE`, and `ok` once the maintenance is lifted, the restore
      completed. The front polls it to know when the restore has completed: the maintenance
      state does not depend on the database that the restore recreates, and the restore's task
      cannot be read during the maintenance (#604). A platform in maintenance is alive: the
      probe answers 200.
    responses:
      '200':
        description: The process answers; in maintenance or not.
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ok, maintenance]
                  description: >-
                    `ok`: the platform serves its operations; `maintenance`: a restore holds it
                    in maintenance, and only this probe answers.
            examples:
              ok: { $ref: ../../../fixtures/api/liveness.json }
              maintenance: { $ref: ../../../fixtures/api/liveness_maintenance.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/installation:
  get:
    operationId: getInstallation
    tags: [system]
    security: []
    summary: What the front must know about the installation before any session
    description: >-
      The installation's default language, which the front falls back on when the account
      follows the browser and the browser requests none of the offered languages
      (WF-INTF-0160) — including before any sign-in. Before the installation's bootstrap
      (WF-EXP-0020), which creates its row, the operation answers 503 `COMPONENT_UNAVAILABLE`,
      `component` set to `database`.
    responses:
      '200':
        description: Public settings of the installation.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/Installation }
            examples:
              witness: { $ref: ../../../fixtures/api/installation.json }
              english: { $ref: ../../../fixtures/api/installation_english.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/health/ready:
  get:
    operationId: getReadiness
    tags: [system]
    security: []
    summary: Readiness probe
    description: >-
      True when the components the instance needs are answering. An unavailable component
      is never presented as available (WF-EXP-0040).
    responses:
      '200':
        description: The instance can serve requests.
        content:
          application/json:
            schema:
              type: object
              required: [status, components]
              properties:
                status: { type: string, enum: [ready] }
                components:
                  type: array
                  items: { $ref: ../components/schemas/platform.yaml#/ComponentHealth }
            examples:
              witness: { $ref: ../../../fixtures/api/readiness.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/metrics:
  get:
    operationId: getMetrics
    tags: [system]
    security: []
    summary: Metrics in Prometheus format
    description: >-
      Metrics of requests, background tasks and data components, collected by Prometheus and
      taken up by the status screen (WF-OBS-0010, WF-ADM-0130); the availability of each data
      component and of the identity provider is probed at each collection. Served over HTTP,
      on the cluster's internal network only (TFX-09, WF-SEC-0010): the public entry point
      does not route it and answers 404. `security` is empty because Prometheus carries no
      token; the endpoint exposes no project data, no identity and no secret.
    responses:
      '200':
        description: Prometheus exposition.
        content:
          text/plain:
            schema: { type: string }
      '404':
        description: >-
          Requested through the public entry point, which the metrics endpoint does not use
          (WF-SEC-0010): `NOT_FOUND`, without parameters.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
      '500': { $ref: ../components/responses.yaml#/InternalError }

/system/status:
  get:
    operationId: getSystemStatus
    tags: [system]
    summary: System status screen
    description: >-
      Availability of each component and its version, storage space, installed version,
      current values of the operating parameters — including the cache validity period
      (§4.5.1) —, latest reading of the accounts, backup and restore test, and current alerts,
      including the failure of a scheduled backup or of its external copy (WF-OBS-0030,
      WF-ADM-0170). Accessible without any project being open (WF-ADM-0130). Readable under
      the permission to view the system status (`system_status.read`, WF-ADM-0100).
    responses:
      '200':
        description: Current status.
        content:
          application/json:
            schema: { $ref: ../components/schemas/platform.yaml#/SystemStatus }
            examples:
              witness: { $ref: ../../../fixtures/api/system_status.json }
              backup_failed: { $ref: ../../../fixtures/api/system_status_backup_failed.json }
              storage_full: { $ref: ../../../fixtures/api/system_status_storage_full.json }
              copy_failed: { $ref: ../../../fixtures/api/system_status_copy_failed.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/tasks:
  get:
    operationId: listBackgroundTasks
    tags: [tasks]
    summary: The caller's background tasks
    description: >-
      The tasks the caller has started, most recent first: those that are running, and those
      that have succeeded or failed since the given date (WF-ARC-0090, WF-IHM-0080). The
      tracking of a tab, of another tab or of another workstation thus finds them again,
      beyond only the references it has kept. The list does not say which command started a
      task: a failed task it helps find is relaunched from the screen of its object. A task
      that another user started does not appear in it; the commands it makes obsolete say so
      (`no_background_task_running`).
    parameters:
      - name: status
        in: query
        description: The statuses retained; when absent, all of them.
        schema:
          type: array
          items: { $ref: ../components/common.yaml#/BackgroundTaskStatus }
        explode: false
      - name: finished_since
        in: query
        description: >-
          Retains, among finished tasks, only those that have succeeded or failed since this
          date; those that are running are always retained. When absent, every finished task
          still kept is retained, within the retention of the background tasks
          (`OperatingParameters.background_task_retention_days`, thirty days as shipped).
        schema: { $ref: ../components/common.yaml#/Timestamp }
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
    responses:
      '200':
        description: The caller's tasks, most recent first.
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/common.yaml#/BackgroundTaskRef }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              none: { $ref: ../../../fixtures/api/tasks_none.json }
              running: { $ref: ../../../fixtures/api/tasks_running.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '422':
        description: >-
          A refused filter, `VALIDATION_FAILED`, `fields` designating each faulty parameter: a
          status outside `BackgroundTaskStatus`, `/query/status` with the reason
          `VALIDATION_FAILED`; a malformed date, `/query/finished_since` with `DATE_INVALID`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              status_invalid: { $ref: ../../../fixtures/api/tasks_status_invalid.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/tasks/{task_id}:
  get:
    operationId: getBackgroundTask
    tags: [tasks]
    summary: Progress of a background task
    description: >-
      An action handed to the worker returns immediately; its progress and its result are
      read here, including after a change of screen (WF-ARC-0090, WF-IHM-0080).
    parameters:
      - $ref: ../components/parameters.yaml#/TaskId
    responses:
      '200':
        description: State of the task.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              succeeded: { $ref: ../../../fixtures/api/task_succeeded.json }
              running: { $ref: ../../../fixtures/api/task_running.json }
              failed: { $ref: ../../../fixtures/api/task_failed.json }
              restore_backup_newer_version: { $ref: ../../../fixtures/api/task_restore_backup_newer_version.json }
              interrupted_by_restore: { $ref: ../../../fixtures/api/task_interrupted_by_restore.json }
              import_succeeded: { $ref: ../../../fixtures/api/task_import_succeeded.json }
              import_analysis_failed: { $ref: ../../../fixtures/api/task_import_analysis_failed.json }
              relaunched: { $ref: ../../../fixtures/api/task_mark_relaunched.json }
              export_succeeded: { $ref: ../../../fixtures/api/task_export_succeeded.json }
              restore_verification_failed: { $ref: ../../../fixtures/api/task_restore_verification_failed.json }
              merge_outside_work_package: { $ref: ../../../fixtures/api/task_merge_outside_work_package.json }
              merge_link_cycle: { $ref: ../../../fixtures/api/task_merge_link_cycle.json }
              merge_link_forbidden: { $ref: ../../../fixtures/api/task_merge_link_forbidden.json }
              merge_horizon_exceeded: { $ref: ../../../fixtures/api/task_merge_horizon_exceeded.json }
              merge_running: { $ref: ../../../fixtures/api/task_merge_running.json }
              merge_succeeded: { $ref: ../../../fixtures/api/task_merge_succeeded.json }
              exit_mark_running: { $ref: ../../../fixtures/api/task_exit_mark_running.json }
              exit_mark_succeeded: { $ref: ../../../fixtures/api/task_exit_mark_succeeded.json }
              exit_mark_failed: { $ref: ../../../fixtures/api/task_exit_mark_failed.json }
              exit_mark_relaunched: { $ref: ../../../fixtures/api/task_exit_mark_relaunched.json }
              exit_mark_relaunched_succeeded: { $ref: ../../../fixtures/api/task_exit_mark_relaunched_succeeded.json }
              identity_sync_succeeded: { $ref: ../../../fixtures/api/identity_sync_succeeded.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/tasks/{task_id}/result:
  get:
    operationId: getBackgroundTaskResult
    tags: [tasks]
    summary: Result of a background task
    description: >-
      Downloads the file a task has produced — MS Project export, Excel or tree image. The
      worker has placed it on the object storage, where it awaits its download: it is deleted
      at the end of its first complete download, or after twenty-four hours if it has not been
      downloaded; an interrupted download leaves it in place, and is resumed (WF-DAT-0120,
      WF-ARC-0040). A deleted result — already downloaded to the end, or expired — is a 404,
      and the task then returns a null `result_url`; likewise a task that produces no file,
      such as a marking. A task that has not succeeded has no result yet: 409 (WF-ARC-0090).
    parameters:
      - $ref: ../components/parameters.yaml#/TaskId
    responses:
      '200':
        description: >-
          The file, as a named attachment, of the kind of the export (`ExportKind`): an
          estimate or a remaining to commit as an Excel workbook
          (`application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`, `.xlsx`), an
          MS Project schedule in XML (`application/xml`, `.xml`), the image of the tree in
          PNG (`image/png`, `.png`) (WF-INTF-0110, WF-INTF-0130, WF-INTF-0050, WF-PLA-0120).
        headers:
          Content-Disposition:
            required: true
            description: >-
              `attachment`, and the file name the server gives it (`filename`), with the
              extension of its kind. A name that is not in ASCII is also written in
              `filename*`, in percent-encoded UTF-8 (RFC 6266, RFC 8187), `filename` then
              carrying its ASCII equivalent.
            schema: { type: string }
            examples:
              estimate: { $ref: ../../../fixtures/api/task_result_disposition.json }
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary }
          application/xml:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The task has not succeeded — queued, running or failed (`BackgroundTaskRef.status`):
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` set to `task_succeeded`
          (WF-ARC-0090; A-05, US-0702/L2).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              not_succeeded: { $ref: ../../../fixtures/api/task_result_not_succeeded.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
