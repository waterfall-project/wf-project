/health:
  get:
    operationId: getLiveness
    tags: [system]
    security: []
    summary: Sonde de vivacité
    description: Répond dès que le processus est démarré, sans toucher aucun composant de données.
    responses:
      '200':
        description: Le processus répond.
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ok] }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/installation:
  get:
    operationId: getInstallation
    tags: [system]
    security: []
    summary: Ce que le front doit savoir de l'installation avant toute session
    description: >-
      La langue par défaut de l'installation, sur laquelle le front se replie quand le
      compte suit le navigateur et que celui-ci ne demande aucune langue offerte
      (WF-INTF-0160) — y compris sur les pages sans session : connexion, mot de passe
      oublié.
    responses:
      '200':
        description: Paramètres publics de l'installation.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/Installation }
            examples:
              witness: { $ref: ../../../fixtures/api/installation.json }
              english: { $ref: ../../../fixtures/api/installation_english.json }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/health/ready:
  get:
    operationId: getReadiness
    tags: [system]
    security: []
    summary: Sonde de préparation
    description: >-
      Vraie lorsque les composants dont l'instance a besoin répondent. Un composant
      indisponible n'est jamais présenté comme disponible (WF-EXP-0040).
    responses:
      '200':
        description: L'instance peut servir des requêtes.
        content:
          application/json:
            schema:
              type: object
              required: [status, components]
              properties:
                status: { type: string, enum: [ready] }
                components:
                  type: array
                  items: { $ref: ../components/schemas/platform.yaml#/ComponentHealth }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/metrics:
  get:
    operationId: getMetrics
    tags: [system]
    security: []
    summary: Métriques au format Prometheus
    description: >-
      Métriques de requêtes, de tâches de fond et de composants de données, collectées
      par Prometheus et reprises par l'écran d'état (WF-OBS-0010, WF-ADM-0130).
    responses:
      '200':
        description: Exposition Prometheus.
        content:
          text/plain:
            schema: { type: string }
      '404': { $ref: ../components/responses.yaml#/NotFound }

/system/status:
  get:
    operationId: getSystemStatus
    tags: [system]
    summary: Écran d'état du système
    description: >-
      Disponibilité de chaque composant, espace de stockage, version installée,
      dernières synchronisation, sauvegarde et test de restauration, et alertes en
      cours, dont l'échec d'une sauvegarde planifiée ou de sa copie externe (WF-OBS-0030,
      WF-ADM-0170). Accessible sans qu'aucun projet ne soit ouvert (WF-ADM-0130).
    responses:
      '200':
        description: État courant.
        content:
          application/json:
            schema: { $ref: ../components/schemas/platform.yaml#/SystemStatus }
            examples:
              witness: { $ref: ../../../fixtures/api/system_status.json }
              backup_failed: { $ref: ../../../fixtures/api/system_status_backup_failed.json }
              storage_full: { $ref: ../../../fixtures/api/system_status_storage_full.json }
              copy_failed: { $ref: ../../../fixtures/api/system_status_copy_failed.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }

/tasks:
  get:
    operationId: listBackgroundTasks
    tags: [tasks]
    summary: Tâches de fond de l'appelant
    description: >-
      Les tâches que l'appelant a lancées, les plus récentes d'abord : celles qui courent,
      et celles qui ont abouti ou échoué depuis la date donnée (WF-ARC-0090, WF-IHM-0080).
      Le suivi d'un onglet, d'un autre onglet ou d'un autre poste les retrouve ainsi,
      au-delà des seules références qu'il a gardées. La liste ne dit pas quelle commande a
      lancé une tâche : une tâche échouée qu'elle fait trouver se relance depuis l'écran de
      son objet. Une tâche qu'un autre utilisateur a lancée n'y figure pas ; les commandes
      qu'elle rend caduques le disent (`no_background_task_running`).
    parameters:
      - name: status
        in: query
        description: Les statuts retenus ; absents, tous.
        schema:
          type: array
          items: { $ref: ../components/common.yaml#/BackgroundTaskStatus }
        explode: false
      - name: finished_since
        in: query
        description: >-
          Ne retient, des tâches finies, que celles qui ont abouti ou échoué depuis cette
          date ; celles qui courent sont toujours retenues.
        schema: { $ref: ../components/common.yaml#/Timestamp }
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
    responses:
      '200':
        description: Tâches de l'appelant, les plus récentes d'abord.
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/common.yaml#/BackgroundTaskRef }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              none: { $ref: ../../../fixtures/api/tasks_none.json }
              running: { $ref: ../../../fixtures/api/tasks_running.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }

/tasks/{task_id}:
  get:
    operationId: getBackgroundTask
    tags: [tasks]
    summary: Avancement d'une tâche de fond
    description: >-
      Une action confiée au worker rend la main immédiatement ; son avancement et son
      résultat se lisent ici, y compris après un changement d'écran (WF-ARC-0090,
      WF-IHM-0080).
    parameters:
      - $ref: ../components/parameters.yaml#/TaskId
    responses:
      '200':
        description: État de la tâche.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              succeeded: { $ref: ../../../fixtures/api/task_succeeded.json }
              running: { $ref: ../../../fixtures/api/task_running.json }
              failed: { $ref: ../../../fixtures/api/task_failed.json }
              import_succeeded: { $ref: ../../../fixtures/api/task_import_succeeded.json }
              relaunched: { $ref: ../../../fixtures/api/task_mark_relaunched.json }
              export_succeeded: { $ref: ../../../fixtures/api/task_export_succeeded.json }
              restore_verification_failed: { $ref: ../../../fixtures/api/task_restore_verification_failed.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }

/tasks/{task_id}/result:
  get:
    operationId: getBackgroundTaskResult
    tags: [tasks]
    summary: Résultat d'une tâche de fond
    description: >-
      Télécharge le fichier qu'une tâche a produit — export MS Project, Excel ou image
      d'arborescence. Le fichier est engendré à la demande et n'est pas stocké
      (WF-DAT-0120).
    parameters:
      - $ref: ../components/parameters.yaml#/TaskId
    responses:
      '200':
        description: >-
          Le fichier, en pièce jointe nommée, de la nature de l'export (`ExportRequest.kind`) :
          un devis ou un reste à engager en classeur Excel
          (`application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`, `.xlsx`), un
          planning MS Project en XML (`application/xml`, `.xml`), l'image de l'arborescence en
          PNG (`image/png`, `.png`) (WF-INTF-0110, WF-INTF-0130, WF-INTF-0050, WF-PLA-0120).
        headers:
          Content-Disposition:
            required: true
            description: >-
              `attachment`, et le nom du fichier que le serveur lui donne (`filename`), avec
              l'extension de sa nature. Un nom qui n'est pas en ASCII s'écrit aussi en
              `filename*`, en UTF-8 encodé en pourcentage (RFC 6266, RFC 8187), `filename`
              portant alors son équivalent ASCII.
            schema: { type: string }
            examples:
              estimate: { $ref: ../../../fixtures/api/task_result_disposition.json }
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary }
          application/xml:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409': { $ref: ../components/responses.yaml#/Conflict }
