      '200':
        description: Activation modifiée.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/CostType }
            examples:
              deactivated: { $ref: ../../../fixtures/api/cost_type_deactivated.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La désactivation de la dernière nature provision active à porter une catégorie active
          (#578) : `STATE_FORBIDS_OPERATION`, `params.missing_condition` à
          `cost_type_not_last_provision`, la condition que sa commande `deactivate` dit manquante ;
          rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              last_provision: { $ref: ../../../fixtures/api/cost_type_last_provision_refused.json }
      '412':
        description: >-
          La version envoyée n'est plus celle de la nature : elle a été modifiée depuis sa
          lecture, et rien n'est écrit (WF-IHM-0110). `STALE_LOCK_VERSION`,
          `params.expected_lock_version` la version courante.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }

/reference/cost-categories:
  get:
    operationId: listCostCategories
    tags: [reference]
    summary: Catégories de coût
    description: >-
      Les catégories de coût et leur nature, désactivées comprises (WF-REF-0040,
      WF-REF-0150). Les catégories actives se lisent sans la permission du référentiel :
      quiconque consulte un projet nomme et choisit la catégorie d'une ligne de devis
      (WF-DEV-0020). Les catégories désactivées (`include_inactive`) et toute écriture
      restent sous la permission des paramètres de coûts (WF-ADM-0100) : sans elle,
      `include_inactive` et `is_active` faux sont refusés par 403. Une table plate, triée,
      filtrée et paginée par le serveur (WF-IHM-0060, WF-IHM-0130) : la recherche (`search`)
      porte sur le code et sur le libellé de la catégorie, comme celle de la grille des taux, et
      sur son code comptable, la colonne qui n'a pas d'autre filtre ; la nature et l'état se
      filtrent, et `meta.total` compte les catégories retenues. Chaque catégorie porte ses
      commandes (`available_commands`, WF-IHM-0090) : celle qui change son état, et son
      rattachement à une nature d'un autre type, indisponible quand elle est employée ou porte des
      taux (WF-REF-0030, WF-REF-0050).
    parameters:
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - $ref: ../components/parameters.yaml#/IncludeInactive
      - $ref: ../components/parameters.yaml#/Search
      - name: cost_type_id
        in: query
        description: Restreint aux catégories d'une nature de coût (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Uuid }
      - $ref: ../components/parameters.yaml#/IsActive
      - name: sort_by
        in: query
        description: >-
          Colonne du tri ; absente, le code. Les colonnes de la table des catégories : le code,
          le libellé, la nature — par son libellé —, le code comptable, que chaque catégorie porte
          (WF-REF-0040), et l'état, les catégories désactivées après les actives (WF-IHM-0060).
          À égalité, l'ordre de la liste sans tri, puis l'identifiant.
        schema:
          type: string
          enum: [code, label, cost_type, accounting_code, is_active]
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Catégories rattachées à leur nature (WF-REF-0040).
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/reference.yaml#/CostCategory }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              volume: { $ref: ../../../fixtures/api/volume/cost_categories.json }
              page: { $ref: ../../../fixtures/api/volume/cost_categories_page.json }
              reader: { $ref: ../../../fixtures/api/volume/cost_categories_reader.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
  post:
    operationId: createCostCategory
    summary: Créer une catégorie de coût
    description: >-
      La catégorie se rattache à une nature de coût, active, et porte un code comptable unique
      (WF-REF-0040). Son code et son code comptable sont uniques parmi les catégories, actives ou
      désactivées : une valeur déjà portée est refusée par 409, `ALREADY_EXISTS`, qui dit
      lequel des deux champs la porte. Créée sous une nature provision, elle change la
      disponibilité des commandes d'autres objets — la désactivation et le rattachement des autres
      catégories provision, la désactivation et le changement de type des natures provision, la
      dernière ne l'étant plus —, que la réponse ne porte pas : le client relit les listes.
    tags: [reference]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/CostCategoryWrite }
    responses:
      '201':
        description: Catégorie créée.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/CostCategory }
            examples:
              created: { $ref: ../../../fixtures/api/cost_category_created.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '409':
        description: >-
          Un code ou un code comptable déjà portés par une autre catégorie, active ou désactivée
          (WF-REF-0040) : `ALREADY_EXISTS`, `fields` désignant chaque champ dont la valeur est
          prise, `/code` ou `/accounting_code`, par `ALREADY_EXISTS`,
          `fields[].params.conflicting_object_id` la catégorie qui la porte ; rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              codes_taken: { $ref: ../../../fixtures/api/cost_category_codes_taken.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` localisant chaque refus : un code, un libellé ou un code
          comptable vides, `/code`, `/label` ou `/accounting_code` par `VALUE_REQUIRED`, ou plus
          longs que le schéma ne l'admet, par `VALUE_TOO_LONG` ; une nature absente ou nulle — une
          catégorie sans nature (WF-REF-0040) —, `/cost_type_id` par `VALUE_REQUIRED` ; une nature
          que le référentiel n'a pas, `/cost_type_id` par `UNKNOWN_COST_TYPE` ; une nature désactivée, qui n'est plus
          proposée à la saisie, `/cost_type_id` par `INACTIVE_REFERENCE_OBJECT` (WF-REF-0010).
          Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              refused: { $ref: ../../../fixtures/api/cost_category_creation_refused.json }
              without_type: { $ref: ../../../fixtures/api/cost_category_without_type_refused.json }

/reference/cost-categories/{cost_category_id}:
  patch:
    operationId: updateCostCategory
    summary: Modifier une catégorie de coût
    description: >-
      Sans effet rétroactif sur les révisions marquées (WF-REF-0040, WF-REF-0130). Le code et le
      code comptable restent uniques parmi les catégories, actives ou désactivées : une valeur
      déjà portée par une autre est refusée par 409, `ALREADY_EXISTS`. Une catégorie ne passe pas
      sous une nature désactivée ; elle garde la sienne, même désactivée. Une catégorie employée ne
      se rattache qu'à une nature du même type, et une catégorie qui porte des taux ne quitte pas
      la main-d'œuvre (décision de l'auteur du 2026-10-09, #577 ; WF-REF-0030, WF-REF-0050) : sa
      commande `change_cost_type` le dit d'avance (`available_commands`). Vers une nature du même
      type, le rattachement est toujours permis. Un changement de nature change la disponibilité
      des commandes d'autres objets — le changement de type de l'ancienne et de la nouvelle nature,
      et, vers ou depuis une nature provision, la désactivation et le rattachement des autres
      catégories provision, la désactivation et le changement de type des natures provision —, que
      la réponse ne porte pas : le client relit les listes.
    tags: [reference]
    parameters:
      - $ref: ../components/parameters.yaml#/CostCategoryId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/CostCategoryUpdate }
    responses:
      '200':
        description: Catégorie modifiée.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/CostCategory }
            examples:
              updated: { $ref: ../../../fixtures/api/cost_category_updated.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Un code ou un code comptable déjà portés par une autre catégorie, active ou désactivée
          (WF-REF-0040), comme à la création : `ALREADY_EXISTS`, `fields` désignant chaque champ
          dont la valeur est prise, `/code` ou `/accounting_code`,
          `fields[].params.conflicting_object_id` la catégorie qui la porte. Une nature d'un autre type pour une catégorie employée, qui porte des taux (#577),
          ou seule catégorie active des natures provision actives (#578) :
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` la première des conditions que la
          commande `change_cost_type` dit manquantes, dans l'ordre `cost_category_unused`,
          `cost_category_unrated`, `cost_category_not_last_provision`. Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              accounting_code_taken: { $ref: ../../../fixtures/api/cost_category_accounting_code_taken.json }
              employed_kind_changed: { $ref: ../../../fixtures/api/cost_category_kind_refused.json }
              rated_kind_changed: { $ref: ../../../fixtures/api/cost_category_rated_kind_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` localisant chaque refus, comme à la création : `/code`,
          `/label` ou `/accounting_code` vides, par `VALUE_REQUIRED`, ou trop longs, par
          `VALUE_TOO_LONG` ; `/cost_type_id` absente ou nulle, par `VALUE_REQUIRED` — une catégorie
          ne reste pas sans nature (WF-REF-0040) —, inconnue, par `UNKNOWN_COST_TYPE`, ou par
          `INACTIVE_REFERENCE_OBJECT` quand la modification change la catégorie de nature pour une
          nature désactivée (WF-REF-0010). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              refused: { $ref: ../../../fixtures/api/cost_category_update_refused.json }

/reference/cost-categories/{cost_category_id}/activation:
  put:
    operationId: setCostCategoryActivation
    summary: Désactiver ou réactiver une catégorie de coût
    description: >-
      Aucune suppression n'est offerte, et la désactivation laisse les projets intacts
      (WF-REF-0010, WF-REF-0020). La réactivation est toujours disponible — une catégorie se
      réactive même sous une nature désactivée, aucune exigence ne l'en empêchant. La
