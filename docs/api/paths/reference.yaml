      (WF-REF-0030 ; décision de l'auteur du 2026-10-09, #578), ce que sa commande `deactivate`
      dit d'avance (`available_commands`). Relève de la permission de modification des
      paramètres de coûts (WF-ADM-0100). L'écriture d'une catégorie d'une nature provision change
      la disponibilité des commandes d'autres objets — la désactivation et le rattachement des
      autres catégories provision, la désactivation et le changement de type des natures
      provision —, que la réponse ne porte pas : le client relit les listes.
    tags: [reference]
    parameters:
