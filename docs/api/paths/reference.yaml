# Common reference data (FBS-3). An object is never deleted: it is deactivated
# (WF-REF-0010) and remains readable wherever it is used (WF-REF-0150).
# A modification affects no marked revision (WF-REF-0130).

/reference/readiness:
  get:
    operationId: getReferenceReadiness
    tags: [reference]
    summary: Minimum reference data required to create a project
    description: >-
      Names each missing prerequisite (WF-CYC-0120), including the active cost category of the
      risk provision type, without which no risk can be declared (WF-RIS-0010;
      EP-14/L42p, #579). A new installation carries the default calendar and the risk provision
      category from the bootstrap (WF-EXP-0020): it lacks the labour category and the resource
      role (Vérif of WF-CYC-0120, `incomplete`).
    responses:
      '200':
        description: State of the minimum reference data.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/ReferenceReadiness }
            examples:
              witness: { $ref: ../../../fixtures/api/reference_readiness.json }
              incomplete: { $ref: ../../../fixtures/api/reference_readiness_incomplete.json }
              without_provision: { $ref: ../../../fixtures/api/reference_readiness_without_provision.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/settings:
  get:
    operationId: getReferenceSettings
    tags: [reference]
    summary: Currency, company name, language, risk matrix, thresholds and review interval
    description: >-
      The settings every project inherits from the installation (WF-REF-0140, WF-REF-0160,
      WF-REF-0170, WF-REF-0180), and the name of the user company, which exported files carry
      (WF-EXP-0020). Read by any open session, without a permission: the currency accompanies
      every displayed amount (WF-REF-0140) and the default language serves every screen; the
      bounds, the thresholds and the interval qualify what any reader of a project sees
      (WF-REF-0160 to WF-REF-0180). Only writing falls under the permissions of their functions,
      field by field (`updateReferenceSettings`).
    responses:
      '200':
        description: >-
          Settings (WF-REF-0140, WF-REF-0160, WF-REF-0170, WF-REF-0180, WF-INTF-0160,
          WF-EXP-0020).
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/ReferenceSettings }
            examples:
              witness: { $ref: ../../../fixtures/api/reference_settings.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  patch:
    operationId: updateReferenceSettings
    tags: [reference]
    summary: Set the common settings
    description: >-
      The currency is chosen at installation and cannot be modified (WF-REF-0140). Each field
      falls under the permission of its function (WF-ADM-0100): the company name
      (`company_name`), entered at installation and modifiable afterwards (WF-EXP-0020), under
      `cost_settings.write`, the function of the cost settings, whose screen shows it next to
      the currency; the risk matrix
      (`risk_matrix`) under `risk_settings.write` (WF-REF-0160); the index thresholds and the
      interval between two reviews (`index_thresholds`, `max_weeks_between_reviews`)
      under `indicator_settings.write` (WF-REF-0170, WF-REF-0180). A request carries only what
      it writes, with the lock version as read, common to all the settings: an absent field
      stays as it is. A field for which the session does not hold the permission is refused
      with 403, even if the request carries another one it could write; nothing is written. The
      company name is mandatory: an empty name, or one longer than 200 characters, is refused
      per field (422). The six
      bounds of the matrix are ordered, strictly increasing on each axis
      (WF-REF-0160), and the alert threshold of each index stays strictly below its
      watch threshold (WF-REF-0170): a bound or a threshold that is not so is refused
      per field (422). The installation's default language (`default_language`,
      WF-INTF-0160) falls under none of these functions and is not written here: no screen
      of the reference data writes it, and it will be written wherever EP-03 decides.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/ReferenceSettingsWrite }
    responses:
      '200':
        description: Settings saved, in full, with their next lock version.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/ReferenceSettings }
            examples:
              thresholds_updated: { $ref: ../../../fixtures/api/reference_settings_thresholds_updated.json }
              matrix_updated: { $ref: ../../../fixtures/api/reference_settings_matrix_updated.json }
              company_updated: { $ref: ../../../fixtures/api/reference_settings_company_updated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403':
        description: >-
          A field for whose function the session does not hold the permission:
          `PERMISSION_MISSING`, `params.missing_permission` naming it — `cost_settings.write`
          for the company name, `risk_settings.write` for the matrix,
          `indicator_settings.write` for the thresholds and the interval (WF-ADM-0100,
          WF-ADM-0110); nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              permission_missing: { $ref: ../../../fixtures/api/reference_settings_permission_missing.json }
      '412':
        description: >-
          Stale `lock_version`: the settings have been modified since they were read, by one
          screen or the other, and nothing is written. `STALE_LOCK_VERSION`,
          `params.expected_lock_version` the current version (WF-IHM-0110).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/reference_settings_stale.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` designating each faulty field: an empty company name,
          `/company_name` with `VALUE_REQUIRED`, or one longer than 200 characters, with
          `VALUE_TOO_LONG` (WF-EXP-0020); a bound of the matrix that is not strictly
          greater than the previous one, `/risk_matrix/probability_bounds/<rank>` or
          `/risk_matrix/severity_bounds/<rank>` with `BOUNDS_NOT_ORDERED`, the rank being that of
          the bound that breaks the order (WF-REF-0160); an
          alert threshold that is not strictly below the watch threshold of its index,
          `/index_thresholds/cost_alert` or `/index_thresholds/schedule_alert` with
          `THRESHOLD_NOT_BELOW_WATCH` (WF-REF-0170); a threshold that is not a decimal (pattern
          of `Decimal`), `/index_thresholds/<threshold>` with `NUMBER_INVALID`; a decimal outside
          ]0, 1[, which the pattern of `IndexThreshold` refuses, `/index_thresholds/<threshold>`
          with `THRESHOLD_NOT_BETWEEN_ZERO_AND_ONE`, without a parameter (WF-REF-0170); an
          interval between two reviews outside `1` to `104` weeks, `/max_weeks_between_reviews`
          with `VALUE_OUT_OF_RANGE`, `fields[].params.minimum` or `maximum` the only bound
          crossed (WF-REF-0180). The form of a threshold is judged before its range, and the
          order of the thresholds only between thresholds within ]0, 1[. Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              bounds_not_ordered: { $ref: ../../../fixtures/api/reference_settings_bounds_refused.json }
              thresholds_not_below_watch: { $ref: ../../../fixtures/api/reference_settings_thresholds_refused.json }
              company_refused: { $ref: ../../../fixtures/api/reference_settings_company_refused.json }
              out_of_range: { $ref: ../../../fixtures/api/reference_settings_out_of_range.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/org-nodes:
  get:
    operationId: listOrgNodes
    tags: [reference]
    summary: Organisation tree
    description: >-
      It classifies the resource roles and carries no access right (WF-REF-0070). The
      nodes come in the order of the tree, depth first: each node followed by its
      descendants, the children of a same parent — the roots among themselves too — sorted
      by label, compared character by character in the order of the Unicode code
      points, regardless of the reader's language; each one states its depth (`level`). A
      tree is neither sorted nor read by pages: a page would cut a node off from its
      descendants. The search (`search`) covers the label and the code of the node
      (WF-REF-0070); each column is filtered (WF-IHM-0060, WF-IHM-0130) — the code
      (`code`), the depth (`level`, or its bounds `level_min` and `level_max`) and the state
      (`is_active`) —, and the filters combine
      with it. They return the nodes retained and their ancestors, in the same order, so that
      the tree reads without gaps; an ancestor returned for that reason alone may not satisfy them.
      Each node carries the command that changes its state, available or not (`available_commands`,
      WF-IHM-0090): reactivating a node whose parent is deactivated is unavailable
      (WF-REF-0080). The active nodes are readable by any open session: they serve as
      vocabulary to the projects — the workload node, the attachment of a role — (FBS-4;
      author's decision of 2026-11-01, #1745). The deactivated nodes (`include_inactive`,
      `is_active` false) and any write fall under the permission to modify the resource
      settings (`resource_settings.write`, WF-ADM-0100): without it, both are
      refused with 403 `PERMISSION_MISSING`, `params.missing_permission` naming it (WF-REF-0150;
      C-01, US-0702/L2).
    parameters:
      - $ref: ../components/parameters.yaml#/IncludeInactive
      - $ref: ../components/parameters.yaml#/Search
      - name: code
        in: query
        description: >-
          Restricts to the nodes whose code contains the given text, compared like the search
          (WF-IHM-0130).
        schema: { type: string, minLength: 1, maxLength: 20 }
      - name: level
        in: query
        description: >-
          Restricts to the nodes of this depth, 1 for a root: equality, which the column's
          filter chooses among the depths of the tree (WF-IHM-0130). With
          `level_min` or `level_max`, both apply.
        schema: { type: integer, minimum: 1 }
      - name: level_min
        in: query
        description: >-
          Lower bound, inclusive, of the depth: restricts to the nodes at least as
          deep (WF-IHM-0130).
        schema: { type: integer, minimum: 1 }
      - name: level_max
        in: query
        description: >-
          Upper bound, inclusive, of the depth: restricts to the nodes that are no
          deeper (WF-IHM-0130). Lower than `level_min`, it is refused with 422.
        schema: { type: integer, minimum: 1 }
      - $ref: ../components/parameters.yaml#/IsActive
    responses:
      '200':
        description: Nodes, without a depth limit, in the order of the tree.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/reference.yaml#/OrgNode }
            examples:
              witness: { $ref: ../../../fixtures/api/org_nodes.json }
              with_inactive: { $ref: ../../../fixtures/api/org_nodes_with_inactive.json }
              reader: { $ref: ../../../fixtures/api/org_nodes_reader.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403':
        description: >-
          The deactivated nodes requested without the permission to modify the resource
          settings: `PERMISSION_MISSING`, `params.missing_permission` at
          `resource_settings.write` (WF-REF-0150, WF-ADM-0100).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              inactive_forbidden: { $ref: ../../../fixtures/api/org_nodes_inactive_forbidden.json }
      '422':
        description: >-
          A malformed depth bound, `/query/<bound>` with `NUMBER_INVALID`, or
          `level_max` lower than `level_min`, `/query/level_max` with `VALUE_OUT_OF_RANGE`,
          `params.minimum` the given lower bound: `VALIDATION_FAILED`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              bounds_inverted: { $ref: ../../../fixtures/api/org_nodes_bounds_inverted.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createOrgNode
    summary: Create an organisation node
    description: >-
      The node takes its place under its parent in the organisation tree (WF-REF-0070). Its
      code is unique: a code already held by another node, active or deactivated, is
      refused with 409, `ALREADY_EXISTS`, `fields` designating `/code`. Created active, it takes
      its place only under an active parent or at the root: no active object remains in a
      closed department (WF-REF-0070, WF-REF-0080).
    tags: [reference]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/OrgNodeWrite }
    responses:
      '201':
        description: Node created.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/OrgNode }
            examples:
              created: { $ref: ../../../fixtures/api/org_node_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '409':
        description: >-
          A code already held by another node, active or deactivated (WF-REF-0070): `ALREADY_EXISTS`,
          `fields` designating `/code` with `ALREADY_EXISTS`, `fields[].params.conflicting_object_id`
          the node that holds it and `conflicting_object_label` its label — the tree read without the
          deactivated ones, or filtered, may not show it; nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              code_taken: { $ref: ../../../fixtures/api/org_node_code_taken.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` locating each refusal: an empty code or label,
          `/code` or `/label` with `VALUE_REQUIRED`, or longer than the schema allows, with
          `VALUE_TOO_LONG`; a parent that the reference data does not have, `/parent_id` with
          `UNKNOWN_ORG_NODE`, or a deactivated one, with `INACTIVE_REFERENCE_OBJECT` (WF-REF-0070,
          WF-REF-0080). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              parent_inactive: { $ref: ../../../fixtures/api/org_node_creation_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/org-nodes/{org_node_id}:
  patch:
    operationId: updateOrgNode
    summary: Modify an organisation node
    description: >-
      The modification applies from now on and alters no marked revision
      (WF-REF-0070, WF-REF-0130). A code already held by another node is refused with 409,
      `ALREADY_EXISTS`, `fields` designating `/code`. A node moves within the tree
      (`parent_id`, §3.4.4.2.1), under another active node or to the root, its descendants and its
      roles with it (WF-REF-0070): neither under a deactivated node, whether it is itself active or not
      — no active object remains in a closed department (WF-REF-0080) —, nor under itself or
      one of its descendants, the tree remaining a tree. The parent is required on modification,
      null for a root. Only the move is constrained, judged on the parent sent: a deactivated
      node that keeps its deactivated parent can be modified. The response carries the node
      alone: a move changes the depth (`level`) of its descendants, and a new label the
      `parent_label` of its children and the `org_node_label` of the roles attached to it, which
      the response does not carry: the client re-reads the tree and the roles (WF-REF-0070).
    tags: [reference]
    parameters:
      - $ref: ../components/parameters.yaml#/OrgNodeId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/OrgNodeUpdate }
    responses:
      '200':
        description: Node modified; the marked revisions are unchanged (WF-REF-0130).
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/OrgNode }
            examples:
              moved: { $ref: ../../../fixtures/api/org_node_updated.json }
              renamed_under_inactive: { $ref: ../../../fixtures/api/org_node_renamed_under_inactive.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          A code already held by another node, active or deactivated (WF-REF-0070): `ALREADY_EXISTS`,
          `fields` designating `/code` with `ALREADY_EXISTS`, `fields[].params.conflicting_object_id`
          the node that holds it and `conflicting_object_label` its label, as on creation;
          nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              code_taken: { $ref: ../../../fixtures/api/org_node_code_taken.json }
      '412':
        description: >-
          The version sent is no longer that of the node: it has been modified since it was read, and
          nothing is written (WF-IHM-0110). `STALE_LOCK_VERSION`, `params.expected_lock_version`
          the current version.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/org_node_update_stale.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` locating each refusal, as on creation: `/code` or
          `/label` empty, with `VALUE_REQUIRED`, or too long, with `VALUE_TOO_LONG`;
          `/parent_id` absent, with `VALUE_REQUIRED` — `null` designates the root —, unknown, with
          `UNKNOWN_ORG_NODE`, the node itself or one of its
          descendants, with `ORG_NODE_CYCLE`, and, when the modification changes the parent, a
          deactivated node, with `INACTIVE_REFERENCE_OBJECT` (WF-REF-0070, WF-REF-0080) — a single
          reason, in this order. Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              parent_inactive: { $ref: ../../../fixtures/api/org_node_move_refused.json }
              cycle: { $ref: ../../../fixtures/api/org_node_move_cycle_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/org-nodes/{org_node_id}/activation:
  put:
    operationId: setOrgNodeActivation
    tags: [reference]
    summary: Deactivate or reactivate a node
    description: >-
      Deactivating a node deactivates its descendants and the roles attached to
      it or to one of them (WF-REF-0080). Reactivation makes only the node active: its
      descendants and their roles remain deactivated, and are reactivated one by one, each under a
      parent that has become active again; it is refused as long as the node's parent is deactivated
      (WF-REF-0080), which the node's `reactivate` command states in advance
      (`available_commands`). No deletion is offered (WF-REF-0010). Falls under the
      permission to modify the resource settings (WF-ADM-0100). The write
      changes the availability of the commands of other objects — the reactivation of the node's
      children and of its roles —, which the response does not carry: the client re-reads the lists.
    parameters:
      - $ref: ../components/parameters.yaml#/OrgNodeId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [is_active, lock_version]
            properties:
              is_active: { type: boolean }
              lock_version: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '200':
        description: >-
          Activation changed: the nodes and the roles whose state has changed, the cascade
          applied on a deactivation; the node alone on a reactivation.
        content:
          application/json:
            schema:
              type: object
              required: [org_nodes, resource_roles]
              properties:
                org_nodes:
                  type: array
                  items: { $ref: ../components/schemas/reference.yaml#/OrgNode }
                resource_roles:
                  type: array
                  items: { $ref: ../components/schemas/reference.yaml#/ResourceRole }
            examples:
              reactivated: { $ref: ../../../fixtures/api/org_node_reactivated.json }
              deactivated: { $ref: ../../../fixtures/api/org_node_deactivated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The reactivation of a node whose parent is deactivated, refused, nothing being written
          (WF-REF-0080): `STATE_FORBIDS_OPERATION`, `params.missing_condition` at
          `org_node_parent_active`, `params.conflicting_object_id` the deactivated parent, to be
          reactivated first.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              parent_inactive: { $ref: ../../../fixtures/api/org_node_reactivation_refused.json }
      '412':
        description: >-
          The version sent is no longer that of the node: it has been modified since it was read, and
          nothing is written (WF-IHM-0110). `STALE_LOCK_VERSION`, `params.expected_lock_version`
          the current version.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/org_node_activation_stale.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/resource-roles:
  get:
    operationId: listResourceRoles
    tags: [reference]
    summary: Resource roles
    description: >-
      The resource roles, their attachments and their capacity, deactivated ones included
      (WF-REF-0090, WF-REF-0100, WF-REF-0150). The active roles are readable by any open
      session, without the reference data permission: whoever consults a project names and chooses
      the role of an estimate line (WF-DEV-0020; #1745). The deactivated roles
      (`include_inactive`, `is_active` false) and any write fall under the permission to
      modify the resource settings (`resource_settings.write`, WF-ADM-0100): without
      it, both are refused with 403. A flat table, sorted, filtered and paginated
      by the server (WF-IHM-0060, WF-IHM-0130): the search (`search`) covers the label
      and the code of the role (WF-REF-0090), like that of the nodes; the code, the node, the
      category, the calendar and the state are filtered, the monthly hours and the headcount of the
      capacity are bounded (`<column>_min`, `<column>_max`, inclusive), and `meta.total` counts
      the roles retained. Each role carries the command that changes its state, available or not
      (`available_commands`, WF-IHM-0090): reactivating a role whose node is deactivated
      is unavailable (WF-REF-0080).
    parameters:
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - $ref: ../components/parameters.yaml#/IncludeInactive
      - $ref: ../components/parameters.yaml#/Search
      - name: code
        in: query
        description: >-
          Restricts to the roles whose code contains the given text, compared like the search,
          like the code of a node (WF-IHM-0130).
        schema: { type: string, minLength: 1, maxLength: 20 }
      - name: org_node_id
        in: query
        description: >-
          Restricts to the roles that come under the node: attached to it or to one of its
          descendants (WF-REF-0070).
        schema: { $ref: ../components/common.yaml#/Uuid }
      - name: cost_category_id
        in: query
        description: Restricts to the roles attached to this cost category (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Uuid }
      - name: calendar_id
        in: query
        description: Restricts to the roles attached to this calendar (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Uuid }
      - $ref: ../components/parameters.yaml#/IsActive
      - name: monthly_hours_min
        in: query
        description: >-
          Lower bound, inclusive, of the monthly hours of the capacity: restricts to the lines that have at least as many
          (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Hours }
      - name: monthly_hours_max
        in: query
        description: >-
          Upper bound, inclusive, of the monthly hours of the capacity: restricts to the lines that have no more
          (WF-IHM-0130). Lower than `monthly_hours_min`, it is refused with 422.
        schema: { $ref: ../components/common.yaml#/Hours }
      - name: headcount_min
        in: query
        description: >-
          Lower bound, inclusive, of the headcount of the capacity: restricts to the lines that have at least as much
          (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Decimal }
      - name: headcount_max
        in: query
        description: >-
          Upper bound, inclusive, of the headcount of the capacity: restricts to the lines that have no more
          (WF-IHM-0130). Lower than `headcount_min`, it is refused with 422.
        schema: { $ref: ../components/common.yaml#/Decimal }
      - name: sort_by
        in: query
        description: >-
          Sort column; when absent, the label. The columns of the roles table: the label,
          the code, the organisation node, the category and the calendar — by their labels —,
          the monthly hours and the headcount of the capacity, and the state, the deactivated roles
          after the active ones in ascending order (WF-IHM-0060).
          On a tie, the order of the unsorted list, then the identifier.
        schema:
          type: string
          enum:
            - label
            - code
            - org_node
            - cost_category
            - calendar
            - monthly_hours
            - headcount
            - is_active
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Roles and their capacity (WF-REF-0090, WF-REF-0100).
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/reference.yaml#/ResourceRole }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/resource_roles.json }
              reader: { $ref: ../../../fixtures/api/resource_roles_reader.json }
              bounded: { $ref: ../../../fixtures/api/resource_roles_bounded.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403':
        description: >-
          The deactivated roles requested (`include_inactive`, `is_active` false) without
          the permission to modify the resource settings: `PERMISSION_MISSING`,
          `params.missing_permission` at `resource_settings.write` (WF-REF-0150, WF-ADM-0100).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              inactive_forbidden: { $ref: ../../../fixtures/api/resource_roles_inactive_forbidden.json }
      '422':
        description: >-
          A malformed bound, which is not a number of its type: `VALIDATION_FAILED`,
          `fields[]` designating it, `/query/<bound>`, with `NUMBER_INVALID`. An upper bound
          lower than its lower bound (`monthly_hours`, `headcount`): `fields[]` designating the upper bound,
          `/query/<column>_max`, with `VALUE_OUT_OF_RANGE`, `params.minimum` the given lower
          bound.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              bounds_inverted: { $ref: ../../../fixtures/api/resource_roles_bounds_inverted.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createResourceRole
    summary: Create a resource role
    description: >-
      Code, label, attachments within the organisation and capacity of the role (WF-REF-0090,
      WF-REF-0100). Its code is unique: a code already held by another role, active or
      deactivated, is refused with 409, `ALREADY_EXISTS`, `fields` designating `/code`. The node is
      set at creation: a role does not move from one node to another, it is recreated under the
      new one (§3.4.4.2.1). Created active, it is not born under a deactivated node (WF-REF-0080). Once
      the role is attached, its category no longer leaves labour and that category's cost type no
      longer changes type (WF-REF-0030, WF-REF-0040): the creation changes the commands of the
      category and of its cost type, which the response does not carry, and the client re-reads their lists.
    tags: [reference]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/ResourceRoleWrite }
    responses:
      '201':
        description: Role created.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/ResourceRole }
            examples:
              created: { $ref: ../../../fixtures/api/resource_role_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '409':
        description: >-
          A code already held by another role, active or deactivated (WF-REF-0090): `ALREADY_EXISTS`,
          `fields` designating `/code` with `ALREADY_EXISTS`, `fields[].params.conflicting_object_id`
          the role that holds it and `conflicting_object_label` its label — the list read without the
          deactivated ones, filtered or paginated, may not show it; nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              code_taken: { $ref: ../../../fixtures/api/resource_role_code_taken.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` locating each refusal: an empty code or label,
          `/code` or `/label` with `VALUE_REQUIRED`, or longer than the schema allows, with
          `VALUE_TOO_LONG`; an absent or null attachment, `/org_node_id`, `/cost_category_id` or
          `/calendar_id` with `VALUE_REQUIRED` — all three are mandatory (WF-REF-0090) —; an
          attachment that the
          reference data does not have, with `UNKNOWN_ORG_NODE`, `UNKNOWN_COST_CATEGORY` or
          `UNKNOWN_CALENDAR`; a category outside labour, `/cost_category_id` with
          `LABOUR_CATEGORY_REQUIRED`; a deactivated attachment, with `INACTIVE_REFERENCE_OBJECT`
          (WF-REF-0080, WF-REF-0090); a negative capacity, `/capacity/monthly_hours` or
          `/capacity/headcount` with `VALUE_OUT_OF_RANGE`, `fields[].params.minimum` at `0`. A
          field carries only one reason: a category that is both deactivated and outside labour is
          reported as outside labour, which its reactivation would not lift. Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              node_inactive: { $ref: ../../../fixtures/api/resource_role_creation_refused.json }
              attachments: { $ref: ../../../fixtures/api/resource_role_attachments_refused.json }
              calendar_unknown: { $ref: ../../../fixtures/api/resource_role_calendar_unknown.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/resource-roles/{resource_role_id}:
  patch:
    operationId: updateResourceRole
    summary: Modify a resource role
    description: >-
      Without retroactive effect on the marked revisions (WF-REF-0090, WF-REF-0130). A code already
      held by another role is refused with 409, `ALREADY_EXISTS`, `fields` designating `/code`. The
      role's node cannot be modified: a role does not move from one node to another, a
      reorganisation recreates it under the new one (§3.4.4.2.1, WF-REF-0080). Its category and its
      calendar can be changed to active objects, the category being a labour one (WF-REF-0090).
      A change of category changes the commands of the old and of the new category and
      of their cost types (WF-REF-0030, WF-REF-0040), which the response does not carry: the client re-reads
      their lists.
    tags: [reference]
    parameters:
      - $ref: ../components/parameters.yaml#/ResourceRoleId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/ResourceRoleUpdate }
    responses:
      '200':
        description: Role modified.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/ResourceRole }
            examples:
              updated: { $ref: ../../../fixtures/api/resource_role_updated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          A code already held by another role, active or deactivated (WF-REF-0090): `ALREADY_EXISTS`,
          `fields` designating `/code` with `ALREADY_EXISTS`, `fields[].params.conflicting_object_id`
          the role that holds it and `conflicting_object_label` its label, as on creation;
          nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              code_taken: { $ref: ../../../fixtures/api/resource_role_code_taken.json }
      '412':
        description: >-
          The version sent is no longer that of the role: it has been modified since it was read, and
          nothing is written (WF-IHM-0110). `STALE_LOCK_VERSION`, `params.expected_lock_version`
          the current version.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/resource_role_update_stale.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` locating each refusal, as on creation: `/code` or
          `/label` empty or too long; a node sent other than the role's, `/org_node_id` with
          `FIELD_READ_ONLY` — sent back unchanged, it is not refused (WF-REF-0090); `/cost_category_id`
          or `/calendar_id` absent or null, with `VALUE_REQUIRED`, unknown, with
          `UNKNOWN_COST_CATEGORY` or `UNKNOWN_CALENDAR`; a category outside labour, with
          `LABOUR_CATEGORY_REQUIRED` — the category a role keeps never is, no
          category to which a role is attached leaving labour (WF-REF-0040,
          `cost_category_without_role`) —; a negative capacity, with `VALUE_OUT_OF_RANGE`,
          `fields[].params.minimum` at `0`; and, when the modification changes the category or the
          calendar of the role, a deactivated object, with `INACTIVE_REFERENCE_OBJECT` (WF-REF-0090) — a
          role that keeps its own, deactivated since, can be modified. Or else the calendar given to the
          role would leave a task of an ongoing revision without any working hour in the
          week: it never overlaps that of another role of its labour lines, or,
          on a task of which this role is the only one, it has no hour in the week (EP-14/L42s):
          `TASK_WITHOUT_WORKING_HOURS`, `params.resource_roles` naming the roles concerned, by their
          identifier, their code and their label (#1684), and `params.projects` each project
          concerned, by its label and its code (`project_label`, `project_code`), without identifier or
          task: the caller may not be allowed to consult it (WF-PLA-0010, WF-ADM-0110). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              refused: { $ref: ../../../fixtures/api/resource_role_update_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/resource-roles/{resource_role_id}/activation:
  put:
    operationId: setResourceRoleActivation
    tags: [reference]
    summary: Deactivate or reactivate a resource role
    description: >-
      No deletion is offered, and deactivation leaves the projects intact
      (WF-REF-0010, WF-REF-0020). A role is reactivated only if its node is active
      (WF-REF-0080), which its `reactivate` command states in advance (`available_commands`); its
      category and its calendar, for their part, may remain deactivated, no requirement
      making the reactivation conditional on their state. Falls under the permission to modify the
      resource settings (WF-ADM-0100).
    parameters:
      - $ref: ../components/parameters.yaml#/ResourceRoleId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [is_active, lock_version]
            properties:
              is_active: { type: boolean }
              lock_version: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '200':
        description: Activation changed (WF-REF-0010, WF-REF-0020).
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/ResourceRole }
            examples:
              reactivated: { $ref: ../../../fixtures/api/resource_role_reactivated.json }
              deactivated: { $ref: ../../../fixtures/api/resource_role_deactivated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The reactivation of a role whose node is deactivated, refused, nothing being written
          (WF-REF-0080): `STATE_FORBIDS_OPERATION`, `params.missing_condition` at
          `org_node_active`, `params.conflicting_object_id` the deactivated node, to be reactivated
          first.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              node_inactive: { $ref: ../../../fixtures/api/resource_role_reactivation_refused.json }
      '412':
        description: >-
          The version sent is no longer that of the role: it has been modified since it was read, and
          nothing is written (WF-IHM-0110). `STALE_LOCK_VERSION`, `params.expected_lock_version`
          the current version.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/resource_role_activation_stale.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/duration-units:
  get:
    operationId: getDurationUnits
    tags: [reference]
    summary: Conversion constants of the duration units
    description: >-
      Hours per day, hours per week and days per month, by which working days,
      weeks and months are converted into hours on all the projects of the
      installation, and which the MS Project export carries (WF-PLA-0160). Readable by
      whoever consults a project: the planning grid needs them to state what a duration
      is worth.
    responses:
      '200':
        description: The three constants, 8, 40 and 20 by default (WF-PLA-0160).
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/DurationUnits }
            examples:
              defaults: { $ref: ../../../fixtures/api/duration_units.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  put:
    operationId: setDurationUnits
    tags: [reference]
    summary: Set the conversion constants of the duration units
    description: >-
      The three constants of the installation, common to all the projects, under the
      permission of the resource settings, like the calendars (WF-PLA-0160,
      WF-ADM-0100). A duration is kept with the unit it was entered in: after a change of
      a constant, the plannings of the ongoing revisions are recalculated, and a marked
      revision keeps the hours it calculated (WF-PLA-0160, WF-REF-0130, C-360).
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/DurationUnitsWrite }
    responses:
      '200':
        description: Constants saved, at their next version.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/DurationUnits }
            examples:
              updated: { $ref: ../../../fixtures/api/duration_units_updated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '412':
        description: >-
          The constants have been modified since they were read: `STALE_LOCK_VERSION`,
          `params.expected_lock_version` their current version; nothing is written, the
          form offers to re-read (WF-IHM-0110).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/duration_units_stale.json }
      '422':
        description: >-
          A zero constant: `VALIDATION_FAILED`, `fields` designating it, `/hours_per_day`,
          `/hours_per_week` or `/days_per_month`, with `DURATION_UNIT_NOT_POSITIVE`, without a
          parameter — the bound, strictly positive, excludes zero: it has no smallest
          allowed value that `VALUE_OUT_OF_RANGE` could name. A constant that is not an
          unsigned decimal, with `VALIDATION_FAILED` at the same pointer (WF-PLA-0160). Nothing
          is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              zero: { $ref: ../../../fixtures/api/duration_units_zero.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/calendars:
  get:
    operationId: listCalendars
    tags: [reference]
    summary: Calendars
    description: >-
      The calendars and the one that serves by default (WF-REF-0110, WF-REF-0120). A flat table,
      sorted, filtered and paginated by the server (WF-IHM-0060, WF-IHM-0130): the search
      (`search`) covers the label of the calendar, the state is filtered, and `meta.total` counts
      the calendars retained. The hours of each day are sorted but not filtered:
      the exception that WF-IHM-0130 makes to the common rule (C-352, #1047). The default
      calendar is not filtered, only one being so, which sorting by `is_default` puts first.
      Each calendar carries its commands, available or
      not (`available_commands`, WF-IHM-0090): the one that changes its state, the deactivation of the
      default calendar being unavailable, and, except for the default calendar, its
      designation, unavailable for a deactivated calendar (WF-REF-0120). The active calendars
      are readable by any open session: they serve as vocabulary to the projects — the
      calendar of a role, that of a task — (FBS-4; author's decision of 2026-11-01,
      #1745). The deactivated calendars (`include_inactive`, `is_active` false) and any write
      fall under the permission to modify the resource settings
      (`resource_settings.write`, WF-ADM-0100): without it, both are refused with 403
      `PERMISSION_MISSING`, `params.missing_permission` naming it (WF-REF-0150; C-01,
      US-0702/L2).
    parameters:
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - $ref: ../components/parameters.yaml#/IncludeInactive
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/IsActive
      - name: sort_by
        in: query
        description: >-
          Sort column; when absent, the label. The columns of the calendars table: the
          label, the hours of each day, from Monday (`monday`) to Sunday (`sunday`), the
          hours of the week — their sum —, the default calendar first in ascending
          order, and the state, the deactivated ones after the active ones (WF-IHM-0060).
          On a tie, the order of the unsorted list, then the identifier.
        schema:
          type: string
          enum:
            - label
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
            - weekly_hours
            - is_default
            - is_active
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Calendars, including the default one (WF-REF-0110, WF-REF-0120).
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/reference.yaml#/Calendar }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/calendars.json }
              with_inactive: { $ref: ../../../fixtures/api/calendars_with_inactive.json }
              reader: { $ref: ../../../fixtures/api/calendars_reader.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403':
        description: >-
          The deactivated calendars requested without the permission to modify the resource
          settings: `PERMISSION_MISSING`, `params.missing_permission` at
          `resource_settings.write` (WF-REF-0150, WF-ADM-0100).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              inactive_forbidden: { $ref: ../../../fixtures/api/calendars_inactive_forbidden.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createCalendar
    summary: Create a calendar
    description: >-
      A label, unique among the calendars, active or deactivated, and the hours of each
      day of the week, from 0 to 24 (WF-REF-0110): a label already held is refused with 409,
      `ALREADY_EXISTS`.
    tags: [reference]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/CalendarWrite }
    responses:
      '201':
        description: Calendar created.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/Calendar }
            examples:
              created: { $ref: ../../../fixtures/api/calendar_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '409':
        description: >-
          A label already held by another calendar, active or deactivated (WF-REF-0110):
          `ALREADY_EXISTS`, `fields` designating `/label` with `ALREADY_EXISTS`,
          `fields[].params.conflicting_object_id` the calendar that holds it; nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              label_taken: { $ref: ../../../fixtures/api/calendar_label_taken.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` locating each refusal: an empty label, `/label` with
          `VALUE_REQUIRED`, or longer than the schema allows, with `VALUE_TOO_LONG`; the
          hours of a day outside 0 to 24, `/weekly_hours/<day>` with `VALUE_OUT_OF_RANGE`,
          `fields[].params.minimum` at `0` or `maximum` at `24`, the only bound crossed
          (WF-REF-0110). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              hours_out_of_range: { $ref: ../../../fixtures/api/calendar_hours_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/calendars/{calendar_id}:
  patch:
    operationId: updateCalendar
    summary: Modify a calendar
    description: >-
      Without retroactive effect on the marked revisions (WF-REF-0110, WF-REF-0130). The label
      stays unique among the calendars: a label already held by another one is refused with
      409, `ALREADY_EXISTS`.
    tags: [reference]
    parameters:
      - $ref: ../components/parameters.yaml#/CalendarId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/CalendarUpdate }
    responses:
      '200':
        description: Calendar modified.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/Calendar }
            examples:
              updated: { $ref: ../../../fixtures/api/calendar_updated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          A label already held by another calendar, active or deactivated (WF-REF-0110), as on
          creation: `ALREADY_EXISTS`, `fields` designating `/label` with `ALREADY_EXISTS`,
          `fields[].params.conflicting_object_id` the calendar that holds it; nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              label_taken: { $ref: ../../../fixtures/api/calendar_label_taken.json }
      '412':
        description: >-
          The version sent is no longer that of the calendar: it has been modified since it was read,
          and nothing is written (WF-IHM-0110). `STALE_LOCK_VERSION`,
          `params.expected_lock_version` the current version.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/calendar_update_stale.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` locating each refusal, as on creation: `/label` empty
          or too long, the hours of a day outside 0 to 24 with `VALUE_OUT_OF_RANGE`, the only bound
          crossed (WF-REF-0110). Or else the hours given to the calendar would leave a task
          of an ongoing revision without any working hour in the week: the calendars of the
          roles of its labour lines no longer overlapping on any day, or, on a task
          of which a role is the only one, the calendar of that role no longer having any hour in the
          week — `params.resource_roles` then naming that single role, like `updateResourceRole`
          (EP-14/L42s, #795) —; or, for the default calendar, a task without a
          labour line that would no longer have any hour at all: `TASK_WITHOUT_WORKING_HOURS`,
          `params.resource_roles` naming the roles concerned, by their identifier, their code and
          their label (#1684) — empty when only tasks without a labour line lose
          their hours — and `params.projects` each project concerned, by its label and its code
          (`project_label`, `project_code`), without identifier or task: the caller may not be
          allowed to consult it (WF-PLA-0010, WF-ADM-0110). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              hours_out_of_range: { $ref: ../../../fixtures/api/calendar_hours_refused.json }
              task_without_hours: { $ref: ../../../fixtures/api/calendar_update_without_hours.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/calendars/{calendar_id}/default:
  put:
    operationId: setDefaultCalendar
    tags: [reference]
    summary: Designate the default calendar
    description: >-
      One and only one active calendar is the default; the designation removes that status from
      the previous one (WF-REF-0120), whose version advances. A deactivated calendar cannot be
      designated, which its `set_default` command states in advance (`available_commands`);
      designating the one that already is, which its command does not list, returns 200 without
      changing anything — the version checked first, 412 if it is stale, like any versioned
      write. Tasks without a labour line come under the default calendar (WF-PLA-0010): a
      calendar without any hour in the week cannot be the default as long as such a task exists
      in an ongoing revision. Falls under the permission to modify the resource
      settings (WF-ADM-0100). The write changes the availability of the commands of both
      calendars — deactivation and designation —, which the response carries for only one of them:
      the client re-reads the list.
    parameters:
      - $ref: ../components/parameters.yaml#/CalendarId
    requestBody:
      required: true
      description: >-
        The lock version as read of the designated calendar, alone: that of the previous one, which
        the designation also changes, is not sent, just as a cascading deactivation does not send
        those of the objects it deactivates.
      content:
        application/json:
          schema:
            type: object
            required: [lock_version]
            properties:
              lock_version: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '200':
        description: Calendar designated as the default.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/Calendar }
            examples:
              designated: { $ref: ../../../fixtures/api/calendar_default.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The designation of a deactivated calendar, refused, nothing being written (WF-REF-0120):
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` at `calendar_active`, the condition
          that its `set_default` command states as missing; the calendar is reactivated first.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              inactive: { $ref: ../../../fixtures/api/calendar_default_refused.json }
      '412':
        description: >-
          The version sent is no longer that of the calendar: it has been modified since it was
          read, and nothing is written (WF-IHM-0110). `STALE_LOCK_VERSION`,
          `params.expected_lock_version` the current version.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/calendar_default_stale.json }
      '422':
        description: >-
          The designated calendar has no hour in the week, and tasks without a
          labour line of an ongoing revision, which would come under it, would no longer have any
          working hour: `TASK_WITHOUT_WORKING_HOURS`, `params.resource_roles` empty,
          `params.projects` naming each project concerned by its label and its code
          (`project_label`, `project_code`), without identifier or task (WF-PLA-0010,
          WF-ADM-0110). Or a refused body, a lock version absent or of another type:
          `VALIDATION_FAILED`, `fields` designating `/lock_version`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              without_hours: { $ref: ../../../fixtures/api/calendar_default_without_hours.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/calendars/{calendar_id}/activation:
  put:
    operationId: setCalendarActivation
    tags: [reference]
    summary: Deactivate or reactivate a calendar
    description: >-
      Deactivating the default calendar is refused as long as another one has not
      been designated (WF-REF-0120), which its `deactivate` command states in advance
      (`available_commands`). No deletion is offered (WF-REF-0010). Falls under the
      permission to modify the resource settings (WF-ADM-0100).
    parameters:
      - $ref: ../components/parameters.yaml#/CalendarId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [is_active, lock_version]
            properties:
              is_active: { type: boolean }
              lock_version: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '200':
        description: Activation changed.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/Calendar }
            examples:
              deactivated: { $ref: ../../../fixtures/api/calendar_deactivated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The deactivation of the default calendar, refused, nothing being written (WF-REF-0120):
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` at `calendar_not_default`; another
          calendar is first designated as the default (`setDefaultCalendar`).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              default: { $ref: ../../../fixtures/api/calendar_deactivation_refused.json }
      '412':
        description: >-
          The version sent is no longer that of the calendar: it has been modified since it was
          read, and nothing is written (WF-IHM-0110). `STALE_LOCK_VERSION`,
          `params.expected_lock_version` the current version.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/calendar_activation_stale.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/cost-types:
  get:
    operationId: listCostTypes
    tags: [reference]
    summary: Cost types
    description: >-
      The cost types, deactivated ones included (WF-REF-0030, WF-REF-0150). A flat table,
      sorted, filtered and paginated by the server (WF-IHM-0060, WF-IHM-0130): the search
      (`search`) covers the code and the label of the cost type; the type and the state are
      filtered, and `meta.total` counts the cost types retained. Each cost type carries its commands
      (`available_commands`, WF-IHM-0090): the one that changes its state, and the modification of its
      type, unavailable as soon as one of its categories is used, carries an hourly rate or is
      attached to a resource role (WF-REF-0030). The active cost types are readable by any open
      session: they serve as vocabulary to the projects — the cost type of the category of an
      estimate line — (FBS-4; author's decision of 2026-11-01, #1745). The deactivated cost
      types (`include_inactive`, `is_active` false) and any write fall under the
      permission to modify the cost settings (`cost_settings.write`, WF-ADM-0100): without
      it, both are refused with 403 `PERMISSION_MISSING`,
      `params.missing_permission` naming it (WF-REF-0150; C-01, US-0702/L2).
    parameters:
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - $ref: ../components/parameters.yaml#/IncludeInactive
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/IsActive
      - name: kinds
        in: query
        description: Restricts to the cost types of these types (WF-IHM-0130).
        schema:
          type: array
          items: { $ref: ../components/schemas/reference.yaml#/CostTypeKind }
        explode: false
      - name: sort_by
        in: query
        description: >-
          Sort column; when absent, the code. The columns of the cost types table: the code, the
          label, the type and the state, the deactivated cost types after the active ones in ascending
          order (WF-IHM-0060).
          On a tie, the order of the unsorted list, then the identifier.
        schema:
          type: string
          enum: [code, label, kind, is_active]
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Cost types and their type (WF-REF-0030).
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/reference.yaml#/CostType }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/cost_types.json }
              reader: { $ref: ../../../fixtures/api/cost_types_reader.json }
              with_inactive: { $ref: ../../../fixtures/api/cost_types_with_inactive.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403':
        description: >-
          The deactivated cost types requested without the permission to modify the cost
          settings: `PERMISSION_MISSING`, `params.missing_permission` at `cost_settings.write`
          (WF-REF-0150, WF-ADM-0100).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              inactive_forbidden: { $ref: ../../../fixtures/api/cost_types_inactive_forbidden.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createCostType
    summary: Create a cost type
    description: >-
      Cost type of the installation, of one of the three types (WF-REF-0030). Its code is
      unique: a code already held by another cost type, active or deactivated, is refused with 409,
      `ALREADY_EXISTS`. Once created, it carries its commands (`available_commands`): the modification
      of its type is available as long as none of its categories is used, carries an hourly
      rate or is attached to a resource role.
    tags: [reference]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/CostTypeWrite }
    responses:
      '201':
        description: Cost type created.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/CostType }
            examples:
              created: { $ref: ../../../fixtures/api/cost_type_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '409':
        description: >-
          A code already held by another cost type, active or deactivated (WF-REF-0030):
          `ALREADY_EXISTS`, `fields` designating `/code` with `ALREADY_EXISTS`,
          `fields[].params.conflicting_object_id` the cost type that holds it; nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              code_taken: { $ref: ../../../fixtures/api/cost_type_code_taken.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` locating each refusal: an empty code or label,
          `/code` or `/label` with `VALUE_REQUIRED`, or longer than the schema allows — twenty
          characters for the code, two hundred for the label —, with `VALUE_TOO_LONG`; nothing is
          written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              refused: { $ref: ../../../fixtures/api/cost_type_creation_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/cost-types/{cost_type_id}:
  patch:
    operationId: updateCostType
    tags: [reference]
    summary: Modify a cost type
    description: >-
      The code, the label and the type of a cost type can be modified, without retroactive effect on the
      marked revisions (WF-REF-0130). The type can no longer be modified as soon as an attached
      category is used — carried by a line of a revision, marked or not —, carries an
      hourly rate or is attached to a resource role (WF-REF-0030), which the cost type's
      `change_kind` command states in advance (`available_commands`); the code and the label can
      always be modified. A code already held by another cost type is refused with 409,
      `ALREADY_EXISTS`.
    parameters:
      - $ref: ../components/parameters.yaml#/CostTypeId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/CostTypeUpdate }
    responses:
      '200':
        description: Cost type modified.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/CostType }
            examples:
              updated: { $ref: ../../../fixtures/api/cost_type_updated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Another type for a cost type one of whose categories is used, carries an hourly rate or
          is attached to a resource role (WF-REF-0030): `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` the first of the conditions that the `change_kind` command states
          as missing, `cost_type_unused`, then `cost_type_unrated`, then
          `cost_type_without_role`. The first two are lifted by attaching the categories
          concerned to another cost type of the same type, which is never unavailable
          (`CostCategoryCommand`), and the refusal names them (WF-IHM-0090; EP-14/L42s):
          `params.cost_categories`, the categories of the cost type that are used for
          `cost_type_unused`, those that carry an hourly rate for `cost_type_unrated`, active
          or deactivated, each by its identifier, its code and its label, in the order of
          their code. The last one names roles: `params.resource_roles` the roles
          attached to the categories of the cost type, active or deactivated, each by its identifier,
          its code and its label, which must first be attached to a labour category
          outside the cost type. A code already held by
          another cost type, active or deactivated:
          `ALREADY_EXISTS`, `fields` designating `/code` with `ALREADY_EXISTS`,
          `fields[].params.conflicting_object_id` the cost type that holds it. Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              kind_frozen: { $ref: ../../../fixtures/api/cost_type_kind_refused.json }
              code_taken: { $ref: ../../../fixtures/api/cost_type_code_taken.json }
      '412':
        description: >-
          The version sent is no longer that of the cost type: it has been modified since it
          was read, and nothing is written (WF-IHM-0110). `STALE_LOCK_VERSION`,
          `params.expected_lock_version` the current version.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/cost_type_update_stale.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` locating each refusal, as on creation: `/code` or
          `/label` empty, with `VALUE_REQUIRED`, or too long, with `VALUE_TOO_LONG`; nothing is
          written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              refused: { $ref: ../../../fixtures/api/cost_type_update_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/cost-types/{cost_type_id}/activation:
  put:
    operationId: setCostTypeActivation
    summary: Deactivate or reactivate a cost type
    description: >-
      No deletion is offered, and deactivation leaves the projects intact
      (WF-REF-0010, WF-REF-0020). Deactivation and reactivation are always available,
      that of the last cost type of the risk provision type included. "Deactivating a cost
      type deactivates its categories" (WF-REF-0010): each of its active categories is
      deactivated with it, its lock version advances and its audit names the author of the deactivation;
      reactivation makes only the cost type active, its categories being reactivated one by one
      (`setCostCategoryActivation`). Deactivating the last cost type of the risk provision type
      therefore deactivates its last category: the creation of a project and the declaration of a risk
      then name what they lack (`active_provision_category`; WF-REF-0030, WF-CYC-0120,
      WF-RIS-0010; EP-14/L42s, C-291). The write changes the state and the commands of the categories
      of the cost type, which the response does not carry: the client re-reads their list. Falls under the
      permission to modify the cost settings (WF-ADM-0100).
    tags: [reference]
    parameters:
      - $ref: ../components/parameters.yaml#/CostTypeId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [is_active, lock_version]
            properties:
              is_active: { type: boolean }
              lock_version: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '200':
        description: Activation changed.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/CostType }
            examples:
              deactivated: { $ref: ../../../fixtures/api/cost_type_deactivated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '412':
        description: >-
          The version sent is no longer that of the cost type: it has been modified since it was
          read, and nothing is written (WF-IHM-0110). `STALE_LOCK_VERSION`,
          `params.expected_lock_version` the current version.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/cost_type_activation_stale.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/cost-categories:
  get:
    operationId: listCostCategories
    tags: [reference]
    summary: Cost categories
    description: >-
      The cost categories and their cost type, deactivated ones included (WF-REF-0040,
      WF-REF-0150). The active categories are readable by any open session, without the
      reference data permission: whoever consults a project names and chooses the category
      of an estimate line (WF-DEV-0020; #1745). The deactivated categories
      (`include_inactive`) and any write fall under the permission to modify the
      cost settings (`cost_settings.write`, WF-ADM-0100): without it,
      `include_inactive` and `is_active` false are refused with 403. A flat table, sorted,
      filtered and paginated by the server (WF-IHM-0060, WF-IHM-0130): the search (`search`)
      covers the code and the label of the category, like that of the rate grid, and
      its accounting code, the column that has no other filter; the cost type and the state are
      filtered, and `meta.total` counts the categories retained. Each category states the type of its
      cost type (`cost_type_kind`), by which a form offers a role only labour
      categories (WF-REF-0090). Each category carries its
      commands (`available_commands`, WF-IHM-0090): the one that changes its state, and its
      attachment to a cost type of another type, unavailable when it is used, carries
      rates or a resource role is attached to it (WF-REF-0030, WF-REF-0040, WF-REF-0050).
    parameters:
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - $ref: ../components/parameters.yaml#/IncludeInactive
      - $ref: ../components/parameters.yaml#/Search
      - name: cost_type_id
        in: query
        description: Restricts to the categories of a cost type (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Uuid }
      - $ref: ../components/parameters.yaml#/IsActive
      - name: sort_by
        in: query
        description: >-
          Sort column; when absent, the code. The columns of the categories table: the code,
          the label, the cost type — by its label —, the accounting code, which each category carries
          (WF-REF-0040), and the state, the deactivated categories after the active ones (WF-IHM-0060).
          On a tie, the order of the unsorted list, then the identifier.
        schema:
          type: string
          enum: [code, label, cost_type, accounting_code, is_active]
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Categories attached to their cost type (WF-REF-0040).
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/reference.yaml#/CostCategory }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              volume: { $ref: ../../../fixtures/api/volume/cost_categories.json }
              page: { $ref: ../../../fixtures/api/volume/cost_categories_page.json }
              reader: { $ref: ../../../fixtures/api/volume/cost_categories_reader.json }
              type_deactivated: { $ref: ../../../fixtures/api/volume/cost_categories_type_deactivated.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403':
        description: >-
          The deactivated categories requested (`include_inactive`, `is_active` false) without
          the permission to modify the cost settings: `PERMISSION_MISSING`,
          `params.missing_permission` at `cost_settings.write` (WF-REF-0150, WF-ADM-0100).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              inactive_forbidden: { $ref: ../../../fixtures/api/cost_categories_inactive_forbidden.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createCostCategory
    summary: Create a cost category
    description: >-
      The category is attached to a cost type, an active one, and carries a unique accounting code
      (WF-REF-0040). Its code and its accounting code are unique among the categories, active or
      deactivated: a value already held is refused with 409, `ALREADY_EXISTS`, which states
      which of the two fields holds it.
    tags: [reference]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/CostCategoryWrite }
    responses:
      '201':
        description: Category created.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/CostCategory }
            examples:
              created: { $ref: ../../../fixtures/api/cost_category_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '409':
        description: >-
          A code or an accounting code already held by another category, active or deactivated
          (WF-REF-0040): `ALREADY_EXISTS`, `fields` designating each field whose value is
          taken, `/code` or `/accounting_code`, with `ALREADY_EXISTS`,
          `fields[].params.conflicting_object_id` the category that holds it; nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              codes_taken: { $ref: ../../../fixtures/api/cost_category_codes_taken.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` locating each refusal: an empty code, label or
          accounting code, `/code`, `/label` or `/accounting_code` with `VALUE_REQUIRED`, or longer
          than the schema allows, with `VALUE_TOO_LONG`, or made only of blanks, with
          the reason `VALIDATION_FAILED` at the same pointer; an absent or null cost type — a
          category without a cost type (WF-REF-0040) —, `/cost_type_id` with `VALUE_REQUIRED`; a cost type
          that the reference data does not have, `/cost_type_id` with `UNKNOWN_COST_TYPE`; a deactivated cost type, which is no longer
          offered for entry, `/cost_type_id` with `INACTIVE_REFERENCE_OBJECT` (WF-REF-0010).
          Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              refused: { $ref: ../../../fixtures/api/cost_category_creation_refused.json }
              without_type: { $ref: ../../../fixtures/api/cost_category_without_type_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/cost-categories/{cost_category_id}:
  patch:
    operationId: updateCostCategory
    summary: Modify a cost category
    description: >-
      Without retroactive effect on the marked revisions (WF-REF-0040, WF-REF-0130). The code and the
      accounting code remain unique among the categories, active or deactivated: a value
      already held by another one is refused with 409, `ALREADY_EXISTS`. A category does not move
      under a deactivated cost type; it keeps its own, even deactivated. A used category is
      attached only to a cost type of the same type, and a category that carries rates, or to which
      a resource role is attached, does not leave labour (WF-REF-0030, WF-REF-0040,
      WF-REF-0050; author's decision of 2026-10-09, #577): its `change_cost_type` command
      states it in advance (`available_commands`). Towards a cost type of the same type, the attachment is
      always allowed. A change of cost type changes the availability of the commands of other
      objects — the change of type of the old and of the new cost type —, which the response does not
      carry: the client re-reads the lists.
    tags: [reference]
    parameters:
      - $ref: ../components/parameters.yaml#/CostCategoryId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/CostCategoryUpdate }
    responses:
      '200':
        description: Category modified.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/CostCategory }
            examples:
              updated: { $ref: ../../../fixtures/api/cost_category_updated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          A code or an accounting code already held by another category, active or deactivated
          (WF-REF-0040), as on creation: `ALREADY_EXISTS`, `fields` designating each field
          whose value is taken, `/code` or `/accounting_code`,
          `fields[].params.conflicting_object_id` the category that holds it. A cost type of another
          type for a category that is used, carries rates, or to which a role is attached
          (WF-REF-0040, #577): `STATE_FORBIDS_OPERATION`, `params.missing_condition` the first
          of the conditions that the `change_cost_type` command states as missing, `cost_category_unused`,
          then `cost_category_unrated`, then `cost_category_without_role`; when naming the latter,
          `params.resource_roles` the roles attached to the category, active or deactivated, each
          by its identifier, its code and its label, which must first be attached to another
          labour category (WF-IHM-0090). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              accounting_code_taken: { $ref: ../../../fixtures/api/cost_category_accounting_code_taken.json }
              employed_kind_changed: { $ref: ../../../fixtures/api/cost_category_kind_refused.json }
              rated_kind_changed: { $ref: ../../../fixtures/api/cost_category_rated_kind_refused.json }
              role_kind_changed: { $ref: ../../../fixtures/api/cost_category_role_kind_refused.json }
      '412':
        description: >-
          The version sent is no longer that of the category: it has been modified since it
          was read, and nothing is written (WF-IHM-0110). `STALE_LOCK_VERSION`,
          `params.expected_lock_version` the current version.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/cost_category_update_stale.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` locating each refusal, as on creation: `/code`,
          `/label` or `/accounting_code` empty, with `VALUE_REQUIRED`, too long, with
          `VALUE_TOO_LONG`, or made only of blanks, with the reason `VALIDATION_FAILED`;
          `/cost_type_id` absent or null, with `VALUE_REQUIRED` — a category
          does not remain without a cost type (WF-REF-0040) —, unknown, with `UNKNOWN_COST_TYPE`, or with
          `INACTIVE_REFERENCE_OBJECT` when the modification moves the category to a
          deactivated cost type (WF-REF-0010). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              refused: { $ref: ../../../fixtures/api/cost_category_update_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/cost-categories/{cost_category_id}/activation:
  put:
    operationId: setCostCategoryActivation
    summary: Deactivate or reactivate a cost category
    description: >-
      No deletion is offered, and deactivation leaves the projects intact
      (WF-REF-0010, WF-REF-0020). "A category can be reactivated only if its cost type is
      active" (WF-REF-0010): under a deactivated cost type, reactivation is unavailable,
      `cost_type_active` missing, which the category's `reactivate` command states in advance
      (`available_commands`); the cost type is reactivated first (EP-14/L42s, C-291). Deactivation
      is always available, that of the last active category of the risk provision type
      included: the creation of a project and the declaration of a risk then name what they
      lack (WF-REF-0030, WF-CYC-0120, WF-RIS-0010; EP-14/L42p, which withdraws the rule of
      #578). Falls under the permission to modify the cost settings (WF-ADM-0100).
    tags: [reference]
    parameters:
      - $ref: ../components/parameters.yaml#/CostCategoryId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [is_active, lock_version]
            properties:
              is_active: { type: boolean }
              lock_version: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '200':
        description: Activation changed.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/CostCategory }
            examples:
              deactivated: { $ref: ../../../fixtures/api/cost_category_deactivated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The reactivation of a category whose cost type is deactivated, refused, nothing being
          written (WF-REF-0010; EP-14/L42s, C-291): `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` at `cost_type_active`, `params.conflicting_object_id` the
          deactivated cost type, to be reactivated first, just as the refusal of a node's reactivation names
          its parent (`org_node_parent_active`, WF-IHM-0090).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              type_inactive: { $ref: ../../../fixtures/api/cost_category_reactivation_refused.json }
      '412':
        description: >-
          The version sent is no longer that of the category: it has been modified since it was
          read, and nothing is written (WF-IHM-0110). `STALE_LOCK_VERSION`,
          `params.expected_lock_version` the current version.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/cost_category_activation_stale.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/hourly-rates:
  get:
    operationId: getHourlyRateGrid
    tags: [reference]
    summary: Hourly rate grid
    description: >-
      One row per labour category, one column per year that carries a rate, in
      a single read (WF-REF-0050): the reference data grid opens without reading the categories
      one by one. A year without a rate for a category is an empty cell; no column
      is created by itself, a year is added by the first rate entered in it
      (WF-REF-0060). The grid is read under the permission to read the cost settings
      (`cost_settings.read`, FBS-3.1, WF-ADM-0100), like the extraction mapping
      (`getActualCostMapping`): without it, 404, as for a grid that did not exist
      (WF-ADM-0110). Only the reference data screen reads it — the server calculates the amounts of the
      lines —, and the rates, close to the payroll, are not shown to every session
      (author's decision of 2026-11-01, #1745). The deactivated categories are returned
      only with `include_inactive` or `is_active` false (WF-REF-0150), under the permission to
      modify the cost settings: without it, both are refused with 403 (WF-ADM-0100). A flat table,
      sorted and paginated by the server like the other lists of the reference data (WF-IHM-0060):
      `search` retains the categories whose code or label contains the text searched for
      (WF-IHM-0130), the state is filtered (`is_active`), the rate of a year is bounded (`rate_year`,
      `rate_min`, `rate_max`),
      `sort_by` orders them, and `meta.total` counts the categories retained; the years remain
      those of the whole grid read — those of the active categories, and of the deactivated ones
      too when `include_inactive` is true or `is_active` false (`HourlyRateGrid.years`) —,
      whatever the page, the search, the rate bounds and the sort.
    parameters:
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - $ref: ../components/parameters.yaml#/IncludeInactive
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/IsActive
      - name: rate_year
        in: query
        description: >-
          The year whose rate `rate_min` and `rate_max` bound, the column that `rate.<year>`
          sorts; required with either of them, refused with 422 otherwise (`VALUE_REQUIRED`). Alone,
          without a bound, it has no effect: it neither filters nor sorts. A category without a rate that
          year is retained by no bound.
        schema: { $ref: ../components/common.yaml#/Year }
      - name: rate_min
        in: query
        description: >-
          Lower bound, inclusive, of the rate of the year `rate_year`: restricts to the lines that have at least as much
          (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Money }
      - name: rate_max
        in: query
        description: >-
          Upper bound, inclusive, of the rate of the year `rate_year`: restricts to the lines that have no more
          (WF-IHM-0130). Lower than `rate_min`, it is refused with 422.
        schema: { $ref: ../components/common.yaml#/Money }
      - name: sort_by
        in: query
        description: >-
          Sort column; when absent, the code. The columns of the grid: the code, the label,
          the state — the deactivated categories after the active ones in ascending order —, and
          the rate of a year, `rate.<year>`, `rate.2026` for example: a category without a rate
          that year comes after the others in ascending order, before them in
          descending order, and categories with the same rate, or without a rate, stay in the order of the
          code — a year that the grid does not carry therefore leaves the order of the code (WF-IHM-0060).
          Texts are compared in the order of the Unicode code points. On a tie, the order of
          the unsorted grid, then the identifier.
        schema:
          anyOf:
            - type: string
              enum: [code, label, is_active]
            - type: string
              pattern: '^rate\.(20[0-9]{2}|2100)$'
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: The grid, categories in rows and years in columns.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/HourlyRateGrid }
            examples:
              volume: { $ref: ../../../fixtures/api/volume/hourly_rate_grid.json }
              by_rate: { $ref: ../../../fixtures/api/volume/hourly_rate_grid_by_rate.json }
              bounded: { $ref: ../../../fixtures/api/volume/hourly_rate_grid_bounded.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403':
        description: >-
          The deactivated categories requested (`include_inactive`, `is_active` false) without
          the permission to modify the cost settings: `PERMISSION_MISSING`,
          `params.missing_permission` at `cost_settings.write` (WF-REF-0150, WF-ADM-0100).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              inactive_forbidden: { $ref: ../../../fixtures/api/hourly_rate_grid_inactive_forbidden.json }
      '404':
        description: >-
          A session that does not hold the permission to read the cost settings
          (`cost_settings.read`): `NOT_FOUND`, as for a grid that did not exist
          (WF-ADM-0110, #1745).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              not_readable: { $ref: ../../../fixtures/api/hourly_rate_grid_not_readable.json }
      '422':
        description: >-
          A malformed bound, which is not a number of its type: `VALIDATION_FAILED`,
          `fields[]` designating it, `/query/<bound>`, with `NUMBER_INVALID`. An upper bound
          lower than its lower bound (`rate`): `fields[]` designating the upper bound,
          `/query/<column>_max`, with `VALUE_OUT_OF_RANGE`, `params.minimum` the given lower
          bound; a bound without its year, `/query/rate_year` with `VALUE_REQUIRED`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              bounds_inverted: { $ref: ../../../fixtures/api/hourly_rate_grid_bounds_inverted.json }
              rate_year_missing: { $ref: ../../../fixtures/api/hourly_rate_grid_rate_year_missing.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/cost-categories/{cost_category_id}/hourly-rates:
  get:
    operationId: listHourlyRates
    tags: [reference]
    summary: Annual hourly rates of a category
    description: >-
      The rates of a category, at most one per year (WF-REF-0050): the sparse list that
      `getHourlyRateGrid` presents as a grid. Pricing uses only the rate of the project's
      reference year (WF-DEV-0010, `getMissingRates`); a year is added by its first
      rate (`setHourlyRate`, WF-REF-0060). The rates are read, like the grid, under the permission
      to read the cost settings (`cost_settings.read`, FBS-3.1, WF-ADM-0100): without it,
      404, as for a category that did not exist (WF-ADM-0110). The rates, close to the
      payroll, are not shown to every session, the category itself remaining readable by
      any session (`listCostCategories`) (author's addition of 2026-11-01, #1745).
    parameters:
      - $ref: ../components/parameters.yaml#/CostCategoryId
    responses:
      '200':
        description: Rates by year.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/reference.yaml#/HourlyRate }
            examples:
              volume: { $ref: ../../../fixtures/api/volume/hourly_rates.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404':
        description: >-
          A category that does not exist, or a session that does not hold the permission to read
          the cost settings (`cost_settings.read`): `NOT_FOUND`, without distinguishing anything,
          as for the grid (`getHourlyRateGrid`, WF-ADM-0110, #1745).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              not_readable: { $ref: ../../../fixtures/api/hourly_rates_not_readable.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/cost-categories/{cost_category_id}/hourly-rates/{year}:
  put:
    operationId: setHourlyRate
    tags: [reference]
    summary: Set the hourly rate of a year
    description: >-
      Reserved for labour categories: the categories of the other cost types carry no
      rate (WF-REF-0050). At most one rate per year: the first entry is made without a
      lock version, a correction with the version as read. Correcting a rate affects no
      marked revision (WF-REF-0050, WF-REF-0130). The rate is positive. The first rate of a
      category makes unavailable its attachment to a cost type of another type
      (`cost_category_unrated`, #577) and the modification of the type of its cost type
      (`cost_type_unrated`, WF-REF-0030), which the response does not carry: the client re-reads the lists
      of the categories and of the cost types.
    parameters:
      - $ref: ../components/parameters.yaml#/CostCategoryId
      - $ref: ../components/parameters.yaml#/RateYear
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/HourlyRateWrite }
    responses:
      '200':
        description: Rate saved.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/HourlyRate }
            examples:
              entered: { $ref: ../../../fixtures/api/hourly_rate_entered.json }
              corrected: { $ref: ../../../fixtures/api/hourly_rate_corrected.json }
              added_year: { $ref: ../../../fixtures/api/hourly_rate_added_year.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          A first entry, without `lock_version`, for a year that already carries a rate: a
          second rate for the same category and the same year (WF-REF-0050). `ALREADY_EXISTS`,
          nothing being written; the rate of the year is re-read, and corrected with its version.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              already_entered: { $ref: ../../../fixtures/api/hourly_rate_already_entered.json }
      '412':
        description: >-
          The version sent is no longer that of the year's rate: it has been corrected since
          it was read, and nothing is written (WF-IHM-0110). `STALE_LOCK_VERSION`,
          `params.expected_lock_version` the current version; the rate, without an identifier
          of its own, is the one that the category and the year of the path name.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/hourly_rate_stale.json }
      '422':
        description: >-
          A zero or negative amount, or one beyond what the rate column holds:
          `VALIDATION_FAILED`, `fields` designating `/amount` with `VALUE_OUT_OF_RANGE`,
          `fields[].params.minimum` at `0.01`, the smallest rate allowed, or `fields[].params.maximum`
          at `9999999999.99`, the largest. A
          category whose cost type does not come under labour, which carries no rate
          (WF-REF-0050): `LABOUR_CATEGORY_REQUIRED`, without `fields` — the category is the one in the
          path. A year of the path outside 2000 to 2100: `/path/year` with `VALUE_OUT_OF_RANGE`,
          `fields[].params.minimum` or `maximum` the bound crossed (`Year`); a year that is not a
          number: `/path/year` with `NUMBER_INVALID`. Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              amount_out_of_range: { $ref: ../../../fixtures/api/hourly_rate_amount_refused.json }
              not_labour: { $ref: ../../../fixtures/api/hourly_rate_non_labour_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/reference/actual-cost-mapping:
  get:
    operationId: getActualCostMapping
    tags: [reference]
    summary: Mapping of the actual cost extraction
    description: >-
      The mapping between the ERP extraction and the "Actual costs" format (WF-REF-0190):
      for each of the five columns read, the labels that designate it in the extraction, and
      the columns of the extraction kept for information (WF-CRE-0010). A single
      object of the installation, read by whoever holds the permission to read the cost settings
      (`cost_settings.read`, FBS-3.1, WF-ADM-0100). Empty at installation: as long as one of the
      four required columns has no label, the mapping is incomplete
      (`is_complete`, `missing_columns`), and the import of actual costs is refused, naming it
      (`ProjectCommand.import_actual_costs`, `openImport`).
    responses:
      '200':
        description: The mapping, its columns read in their fixed order.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/ActualCostMapping }
            examples:
              witness: { $ref: ../../../fixtures/api/actual_cost_mapping.json }
              empty: { $ref: ../../../fixtures/api/actual_cost_mapping_empty.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  put:
    operationId: setActualCostMapping
    tags: [reference]
    summary: Set the mapping of the actual cost extraction
    description: >-
      Replaces the whole mapping — the labels of the five columns read and the kept
      columns — with the lock version as read, under the permission of the cost settings
      (`cost_settings.write`, FBS-3.1, WF-ADM-0100). An incomplete mapping
      is saved: it is set in several steps, and it is the import that refuses it. The
      labels are compared regardless of case, accents and leading or trailing spaces
      (WF-REF-0190): a label that, compared in this way, duplicates another — of the same column
      read, of two columns read, or of a column read and a kept column — is refused
      per field, and nothing is written. The modification applies to the following imports and
      changes no line already imported (WF-REF-0190); an actual cost import already analysed
      is applied as it was analysed (`applyImport`, WF-INTF-0080).
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/ActualCostMappingWrite }
    responses:
      '200':
        description: Mapping saved, in full, at its next version.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/ActualCostMapping }
            examples:
              updated: { $ref: ../../../fixtures/api/actual_cost_mapping_updated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403':
        description: >-
          A session that does not hold the permission to modify the cost settings:
          `PERMISSION_MISSING`, `params.missing_permission` at `cost_settings.write` (WF-ADM-0100,
          WF-ADM-0110); nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              permission_missing: { $ref: ../../../fixtures/api/actual_cost_mapping_permission_missing.json }
      '412':
        description: >-
          The mapping has been modified since it was read: `STALE_LOCK_VERSION`,
          `params.expected_lock_version` its current version; nothing is written, the screen offers
          to re-read (WF-IHM-0110).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/actual_cost_mapping_stale.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` designating each faulty field. A label that duplicates
          another, compared regardless of case, accents and leading or trailing spaces
          (WF-REF-0190): `DUPLICATE_COLUMN_LABEL` at the pointer of the duplicate label —
          `/columns/<rank>/labels/<rank>` or `/kept_columns/<rank>` —, `fields[].params.duplicate_of`
          the pointer of the label it duplicates: of two labels that duplicate each other, the one that
          comes second in the body — the columns read in their order, each with its labels
          in theirs, then the kept columns —, and of several, each one after the first,
          which all of them name. An empty label, with `VALUE_REQUIRED`; one longer
          than 200 characters, with `VALUE_TOO_LONG`; one made only of blanks, like any
          label, with `VALIDATION_FAILED`, at the pointer of the label. More than 20 labels for
          a column read, or more than 50 kept columns, with `VALUE_TOO_LONG` at the pointer of
          the list. Columns read that are not the five, each one once, in the order
          of `ActualCostSourceColumn`, with `VALIDATION_FAILED` at the pointer `/columns`. Nothing is
          written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
