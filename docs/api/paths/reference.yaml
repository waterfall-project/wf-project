          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              last_provision: { $ref: ../../../fixtures/api/cost_category_last_provision_refused.json }
      '412':
        description: >-
          La version envoyée n'est plus celle de la catégorie : elle a été modifiée depuis sa
          lecture, et rien n'est écrit (WF-IHM-0110). `STALE_LOCK_VERSION`,
          `params.expected_lock_version` la version courante.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }

/reference/hourly-rates:
  get:
    operationId: getHourlyRateGrid
    tags: [reference]
    summary: Grille des taux horaires
    description: >-
      Une ligne par catégorie de main-d'œuvre, une colonne par année qui porte un taux, en
      une lecture (WF-REF-0050) : la grille du référentiel s'ouvre sans lire les catégories
      une à une. Une année sans taux pour une catégorie est une cellule vide ; aucune colonne
      n'est créée d'elle-même, une année s'ajoute par le premier taux qu'on y saisit
      (WF-REF-0060). Les catégories désactivées ne sont rendues qu'avec `include_inactive`
      (WF-REF-0150), sous la permission des paramètres de coûts : sans elle, `include_inactive`
      est refusé par 403 (WF-ADM-0100). Une table plate, triée et paginée par le serveur
      comme les autres listes du référentiel (WF-IHM-0060) : `search` retient les catégories
      dont le code ou le libellé contient le texte cherché (WF-IHM-0130), l'état se filtre
      (`is_active`), le taux d'une année se borne (`rate_year`, `rate_min`, `rate_max`),
      `sort_by` les ordonne, et `meta.total` compte les catégories retenues ; les années restent
      celles de toute la grille, quels que soient la page, la recherche, les filtres et le tri.
    parameters:
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - $ref: ../components/parameters.yaml#/IncludeInactive
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/IsActive
      - name: rate_year
        in: query
        description: >-
          L'année dont `rate_min` et `rate_max` bornent le taux, la colonne que `rate.<année>`
          trie ; exigée avec l'une d'elles, refusée par 422 sinon (`VALUE_REQUIRED`). Seule, sans
          borne, elle est sans effet : elle ne filtre ni ne trie. Une catégorie sans taux cette
          année-là n'est retenue par aucune borne.
        schema: { $ref: ../components/common.yaml#/Year }
      - name: rate_min
        in: query
        description: >-
          Borne inférieure, incluse, du taux de l'année `rate_year` : restreint aux lignes qui en ont au moins autant
          (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Money }
      - name: rate_max
        in: query
        description: >-
          Borne supérieure, incluse, du taux de l'année `rate_year` : restreint aux lignes qui n'en ont pas plus
          (WF-IHM-0130). Inférieure à `rate_min`, elle est refusée par 422.
        schema: { $ref: ../components/common.yaml#/Money }
      - name: sort_by
        in: query
        description: >-
          Colonne du tri ; absente, le code. Les colonnes de la grille : le code, le libellé,
          l'état — les catégories désactivées après les actives dans l'ordre croissant —, et
          le taux d'une année, `rate.<année>`, `rate.2026` par exemple : une catégorie sans taux
          cette année-là vient après les autres dans l'ordre croissant, avant dans le
          décroissant, et des catégories au même taux, ou sans taux, restent dans l'ordre du
          code — une année que la grille ne porte pas laisse donc l'ordre du code (WF-IHM-0060).
          Les textes se comparent dans l'ordre des points de code Unicode. À égalité, l'ordre de
          la grille sans tri, puis l'identifiant.
        schema:
          anyOf:
            - type: string
              enum: [code, label, is_active]
            - type: string
              pattern: '^rate\.(20[0-9]{2}|2100)$'
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: La grille, catégories en lignes et années en colonnes.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/HourlyRateGrid }
            examples:
              volume: { $ref: ../../../fixtures/api/volume/hourly_rate_grid.json }
              by_rate: { $ref: ../../../fixtures/api/volume/hourly_rate_grid_by_rate.json }
              bounded: { $ref: ../../../fixtures/api/volume/hourly_rate_grid_bounded.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          Une borne mal formée, qui n'est pas un nombre de son type : `VALIDATION_FAILED`,
          `fields[]` la désignant, `/query/<borne>`, par `NUMBER_INVALID`. Une borne supérieure
          inférieure à sa borne inférieure (`rate`) : `fields[]` désignant la borne supérieure,
          `/query/<colonne>_max`, par `VALUE_OUT_OF_RANGE`, `params.minimum` la borne
          inférieure donnée ; une borne sans son année, `/query/rate_year` par `VALUE_REQUIRED`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              bounds_inverted: { $ref: ../../../fixtures/api/hourly_rate_grid_bounds_inverted.json }
              rate_year_missing: { $ref: ../../../fixtures/api/hourly_rate_grid_rate_year_missing.json }

/reference/cost-categories/{cost_category_id}/hourly-rates:
  get:
    operationId: listHourlyRates
    tags: [reference]
    summary: Taux horaires annuels d'une catégorie
    description: Au plus un taux par année (WF-REF-0050). Le taux de l'année en cours est exigé au chiffrage (WF-REF-0060).
    parameters:
      - $ref: ../components/parameters.yaml#/CostCategoryId
    responses:
      '200':
        description: Taux par année.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/reference.yaml#/HourlyRate }
            examples:
              volume: { $ref: ../../../fixtures/api/volume/hourly_rates.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }

/reference/cost-categories/{cost_category_id}/hourly-rates/{year}:
  put:
    operationId: setHourlyRate
    tags: [reference]
    summary: Fixer le taux horaire d'une année
    description: >-
      Réservé aux catégories de main-d'œuvre : les catégories des autres natures ne portent pas
      de taux (WF-REF-0050). Au plus un taux par année : la première saisie se fait sans
      compteur, une correction avec la version lue. La correction d'un taux n'affecte aucune
      révision marquée (WF-REF-0050, WF-REF-0130). Le taux est positif. Le premier taux d'une
      catégorie rend indisponible son rattachement à une nature d'un autre type
      (`cost_category_unrated`, #577), que la réponse ne porte pas : le client relit la liste des
      catégories.
    parameters:
      - $ref: ../components/parameters.yaml#/CostCategoryId
      - $ref: ../components/parameters.yaml#/RateYear
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/HourlyRateWrite }
    responses:
      '200':
        description: Taux enregistré.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/HourlyRate }
            examples:
              entered: { $ref: ../../../fixtures/api/hourly_rate_entered.json }
              corrected: { $ref: ../../../fixtures/api/hourly_rate_corrected.json }
              added_year: { $ref: ../../../fixtures/api/hourly_rate_added_year.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Une première saisie, sans `lock_version`, pour une année qui porte déjà un taux : un
          second taux pour la même catégorie et la même année (WF-REF-0050). `ALREADY_EXISTS`,
          rien n'étant écrit ; le taux de l'année se relit, et se corrige avec sa version.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              already_entered: { $ref: ../../../fixtures/api/hourly_rate_already_entered.json }
      '412':
        description: >-
          La version envoyée n'est plus celle du taux de l'année : il a été corrigé depuis
          sa lecture, et rien n'est écrit (WF-IHM-0110). `STALE_LOCK_VERSION`,
          `params.expected_lock_version` la version courante ; le taux, sans identifiant
          propre, est celui que nomment la catégorie et l'année du chemin.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/hourly_rate_stale.json }
      '422':
        description: >-
          Un montant nul ou négatif : `VALIDATION_FAILED`, `fields` désignant `/amount` par
          `VALUE_OUT_OF_RANGE`, `fields[].params.minimum` à `0.01`, le plus petit taux admis. Une
          catégorie dont la nature ne relève pas de la main-d'œuvre, qui ne porte pas de taux
          (WF-REF-0050) : `LABOUR_CATEGORY_REQUIRED`, sans `fields` — la catégorie est celle du
          chemin. Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              amount_out_of_range: { $ref: ../../../fixtures/api/hourly_rate_amount_refused.json }
              not_labour: { $ref: ../../../fixtures/api/hourly_rate_non_labour_refused.json }
