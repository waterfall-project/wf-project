# Référentiel commun (FBS-3). Un objet ne se supprime jamais : il se désactive
# (WF-REF-0010) et reste lisible partout où il est employé (WF-REF-0150).
# Une modification n'affecte aucune révision marquée (WF-REF-0130).

/reference/readiness:
  get:
    operationId: getReferenceReadiness
    tags: [reference]
    summary: Référentiel minimal exigé pour créer un projet
    description: Nomme chaque prérequis manquant (WF-CYC-0120).
    responses:
      '200':
        description: État du référentiel minimal.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/ReferenceReadiness }
            examples:
              witness: { $ref: ../../../fixtures/api/reference_readiness.json }
              incomplete: { $ref: ../../../fixtures/api/reference_readiness_incomplete.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }

/reference/settings:
  get:
    operationId: getReferenceSettings
    tags: [reference]
    summary: Devise, langue par défaut, matrice de risques, seuils et délai de revue
    description: >-
      Les réglages que tout projet hérite de l'installation (WF-REF-0140, WF-REF-0160,
      WF-REF-0170, WF-REF-0180).
    responses:
      '200':
        description: Paramètres (WF-REF-0140, WF-REF-0160, WF-REF-0170, WF-REF-0180, WF-INTF-0160).
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/ReferenceSettings }
            examples:
              witness: { $ref: ../../../fixtures/api/reference_settings.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
  patch:
    operationId: updateReferenceSettings
    tags: [reference]
    summary: Régler les paramètres communs
    description: >-
      La devise est choisie à l'installation et n'est pas modifiable (WF-REF-0140). Chaque
      champ relève de la permission de sa fonction (WF-ADM-0100) : la matrice de risques
      (`risk_matrix`) de `risk_settings.write` (WF-REF-0160), les seuils des indices et le
      délai entre deux revues (`index_thresholds`, `max_weeks_between_reviews`)
      d'`indicator_settings.write` (WF-REF-0170, WF-REF-0180). Une requête ne porte que ce
      qu'elle écrit, avec le compteur lu, commun à tous les paramètres : un champ absent reste
      tel qu'il est. Un champ dont la session ne porte pas la permission est refusé par 403,
      même si la requête en porte un autre qu'elle pourrait écrire ; rien n'est écrit. Les six
      bornes de la matrice sont ordonnées, strictement croissantes sur chaque axe
      (WF-REF-0160), et le seuil d'alerte de chaque indice reste strictement inférieur à son
      seuil de vigilance (WF-REF-0170) : une borne ou un seuil qui ne le sont pas sont refusés
      par champ (422). La langue par défaut de l'installation (`default_language`,
      WF-INTF-0160) ne relève d'aucune des deux fonctions et ne s'écrit pas ici : aucun écran
      du référentiel ne l'écrit, et elle s'écrira là où EP-03 le décidera.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/ReferenceSettingsWrite }
    responses:
      '200':
        description: Paramètres enregistrés, entiers, avec leur compteur suivant.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/ReferenceSettings }
            examples:
              thresholds_updated: { $ref: ../../../fixtures/api/reference_settings_thresholds_updated.json }
              matrix_updated: { $ref: ../../../fixtures/api/reference_settings_matrix_updated.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403':
        description: >-
          Un champ dont la session ne porte pas la permission de la fonction :
          `PERMISSION_MISSING`, `params.missing_permission` la nommant — `risk_settings.write`
          pour la matrice, `indicator_settings.write` pour les seuils et le délai (WF-ADM-0100,
          WF-ADM-0110) ; rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              permission_missing: { $ref: ../../../fixtures/api/reference_settings_permission_missing.json }
      '412':
        description: >-
          `lock_version` périmé : les paramètres ont été modifiés depuis leur lecture, par l'un
          ou l'autre écran, et rien n'est écrit. `STALE_LOCK_VERSION`,
          `params.expected_lock_version` la version courante (WF-IHM-0110).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/reference_settings_stale.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant chaque champ en défaut : une borne de la
          matrice qui n'est pas strictement supérieure à la précédente,
          `/risk_matrix/probability_bounds/<rang>` ou `/risk_matrix/severity_bounds/<rang>` par
          `BOUNDS_NOT_ORDERED`, le rang celui de la borne qui rompt l'ordre (WF-REF-0160) ; un
          seuil d'alerte qui n'est pas strictement inférieur au seuil de vigilance de son indice,
          `/index_thresholds/cost_alert` ou `/index_thresholds/schedule_alert` par
          `THRESHOLD_NOT_BELOW_WATCH` (WF-REF-0170). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              bounds_not_ordered: { $ref: ../../../fixtures/api/reference_settings_bounds_refused.json }
              thresholds_not_below_watch: { $ref: ../../../fixtures/api/reference_settings_thresholds_refused.json }

/reference/org-nodes:
  get:
    operationId: listOrgNodes
    tags: [reference]
    summary: Arbre d'organisation
    description: >-
      Il classe les rôles de ressources et ne porte aucune habilitation (WF-REF-0070). Les
      nœuds viennent dans l'ordre de l'arbre, en profondeur : chaque nœud suivi de ses
      descendants, les enfants d'un même parent — les racines entre elles aussi — triés
      par libellé, comparé caractère par caractère dans l'ordre des points de code
      Unicode, sans égard à la langue du lecteur ; chacun dit sa profondeur (`level`). Un
      arbre ne se trie pas et ne se lit pas par pages : une page couperait un nœud de ses
      descendants. La recherche (`search`) porte sur le libellé et sur le code du nœud
      (WF-REF-0070) ; chaque colonne se filtre (WF-IHM-0060, WF-IHM-0130) — le code
      (`code`), la profondeur (`level`, ou ses bornes `level_min` et `level_max`) et l'état
      (`is_active`) —, et les filtres se cumulent
      avec elle. Ils rendent les nœuds retenus et leurs ancêtres, dans le même ordre, pour que
      l'arbre se lise sans trou ; un ancêtre rendu pour cela seul peut ne pas les satisfaire.
      Chaque nœud porte la commande qui change son état, disponible ou non (`available_commands`,
      WF-IHM-0090) : la réactivation d'un nœud dont le parent est désactivé est indisponible
      (WF-REF-0080).
    parameters:
      - $ref: ../components/parameters.yaml#/IncludeInactive
      - $ref: ../components/parameters.yaml#/Search
      - name: code
        in: query
        description: >-
          Restreint aux nœuds dont le code contient le texte donné, comparé comme la recherche
          (WF-IHM-0130).
        schema: { type: string, minLength: 1, maxLength: 20 }
      - name: level
        in: query
        description: >-
          Restreint aux nœuds de cette profondeur, 1 pour une racine : l'égalité, que le filtre
          de la colonne choisit parmi les profondeurs de l'arbre (WF-IHM-0130). Avec
          `level_min` ou `level_max`, les deux s'appliquent.
        schema: { type: integer, minimum: 1 }
      - name: level_min
        in: query
        description: >-
          Borne inférieure, incluse, de la profondeur : restreint aux nœuds au moins aussi
          profonds (WF-IHM-0130).
        schema: { type: integer, minimum: 1 }
      - name: level_max
        in: query
        description: >-
          Borne supérieure, incluse, de la profondeur : restreint aux nœuds qui ne sont pas plus
          profonds (WF-IHM-0130). Inférieure à `level_min`, elle est refusée par 422.
        schema: { type: integer, minimum: 1 }
      - $ref: ../components/parameters.yaml#/IsActive
    responses:
      '200':
        description: Nœuds, sans limite de profondeur, dans l'ordre de l'arbre.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/reference.yaml#/OrgNode }
            examples:
              witness: { $ref: ../../../fixtures/api/org_nodes.json }
              with_inactive: { $ref: ../../../fixtures/api/org_nodes_with_inactive.json }
              reader: { $ref: ../../../fixtures/api/org_nodes_reader.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          Une borne de la profondeur mal formée, `/query/<borne>` par `NUMBER_INVALID`, ou
          `level_max` inférieure à `level_min`, `/query/level_max` par `VALUE_OUT_OF_RANGE`,
          `params.minimum` la borne inférieure donnée : `VALIDATION_FAILED`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
  post:
    operationId: createOrgNode
    summary: Créer un nœud d'organisation
    description: >-
      Le nœud prend place sous son parent dans l'arbre d'organisation (WF-REF-0070). Son
      code est unique : un code déjà porté par un autre nœud, actif ou désactivé, est
      refusé par 409, `ALREADY_EXISTS`, `fields` désignant `/code`,
      `fields[].params.conflicting_object_id` le nœud qui le porte. Créé actif, il ne prend pas place sous un parent
      désactivé : aucun objet actif ne subsiste dans un service fermé (WF-REF-0080).
    tags: [reference]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/OrgNodeWrite }
    responses:
      '201':
        description: Nœud créé.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/OrgNode }
            examples:
              created: { $ref: ../../../fixtures/api/org_node_created.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '409':
        description: >-
          Un code déjà porté par un autre nœud, actif ou désactivé (WF-REF-0070) : `ALREADY_EXISTS`,
          `fields` désignant `/code` par `ALREADY_EXISTS`, `fields[].params.conflicting_object_id`
          le nœud qui le porte ; rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` localisant chaque refus ; ainsi un parent désactivé,
          `/parent_id` par `INACTIVE_REFERENCE_OBJECT`, rien n'étant écrit (WF-REF-0080).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              parent_inactive: { $ref: ../../../fixtures/api/org_node_creation_refused.json }

/reference/org-nodes/{org_node_id}:
  patch:
    operationId: updateOrgNode
    summary: Modifier un nœud d'organisation
    description: >-
      La modification vaut pour la suite et ne retouche aucune révision marquée
      (WF-REF-0070, WF-REF-0130). Un code déjà porté par un autre nœud est refusé par 409,
      `ALREADY_EXISTS`, `fields` désignant `/code`, `fields[].params.conflicting_object_id` le
      nœud qui le porte. Un nœud se déplace dans l'arbre (`parent_id`, §3.4.4.2.1), mais un nœud
      actif ne se déplace pas sous un nœud désactivé : aucun objet actif ne subsiste dans un
      service fermé (WF-REF-0080). Un nœud désactivé se déplace où l'on veut, il n'y est pas
      actif.
    tags: [reference]
    parameters:
      - $ref: ../components/parameters.yaml#/OrgNodeId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/OrgNodeUpdate }
    responses:
      '200':
        description: Nœud modifié ; les révisions marquées sont inchangées (WF-REF-0130).
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/OrgNode }
            examples:
              moved: { $ref: ../../../fixtures/api/org_node_updated.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Un code déjà porté par un autre nœud, actif ou désactivé (WF-REF-0070) : `ALREADY_EXISTS`,
          `fields` désignant `/code` par `ALREADY_EXISTS`, `fields[].params.conflicting_object_id`
          le nœud qui le porte ; rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` localisant chaque refus ; ainsi un nœud actif déplacé
          sous un nœud désactivé, `/parent_id` par `INACTIVE_REFERENCE_OBJECT`, rien n'étant
          écrit (WF-REF-0080).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              parent_inactive: { $ref: ../../../fixtures/api/org_node_move_refused.json }

/reference/org-nodes/{org_node_id}/activation:
  put:
    operationId: setOrgNodeActivation
    tags: [reference]
    summary: Désactiver ou réactiver un nœud
    description: >-
      La désactivation d'un nœud désactive ses descendants et les rôles qui sont rattachés à
      lui ou à l'un d'eux (WF-REF-0080). La réactivation ne rend actif que le nœud : ses
      descendants et leurs rôles restent désactivés, et se réactivent un à un, chacun sous un
      parent redevenu actif ; elle est refusée tant que le parent du nœud est désactivé
      (WF-REF-0080), ce que la commande `reactivate` du nœud dit d'avance
      (`available_commands`). Aucune suppression n'est offerte (WF-REF-0010). Relève de la
      permission de modification des paramètres de ressources (WF-ADM-0100). L'écriture
      change la disponibilité des commandes d'autres objets — la réactivation des enfants du
      nœud et de ses rôles —, que la réponse ne porte pas : le client relit les listes.
    parameters:
      - $ref: ../components/parameters.yaml#/OrgNodeId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [is_active, lock_version]
            properties:
              is_active: { type: boolean }
              lock_version: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '200':
        description: >-
          Activation modifiée : les nœuds et les rôles dont l'état a changé, la cascade
          appliquée à une désactivation ; le nœud seul à une réactivation.
        content:
          application/json:
            schema:
              type: object
              required: [org_nodes, resource_roles]
              properties:
                org_nodes:
                  type: array
                  items: { $ref: ../components/schemas/reference.yaml#/OrgNode }
                resource_roles:
                  type: array
                  items: { $ref: ../components/schemas/reference.yaml#/ResourceRole }
            examples:
              reactivated: { $ref: ../../../fixtures/api/org_node_reactivated.json }
              deactivated: { $ref: ../../../fixtures/api/org_node_deactivated.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La réactivation d'un nœud dont le parent est désactivé, refusée, rien n'étant écrit
          (WF-REF-0080) : `STATE_FORBIDS_OPERATION`, `params.missing_condition` à
          `org_node_parent_active`, `params.conflicting_object_id` le parent désactivé, à
          réactiver d'abord.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              parent_inactive: { $ref: ../../../fixtures/api/org_node_reactivation_refused.json }
      '412':
        description: >-
          La version envoyée n'est plus celle du nœud : il a été modifié depuis sa lecture, et
          rien n'est écrit (WF-IHM-0110). `STALE_LOCK_VERSION`, `params.expected_lock_version`
          la version courante.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/org_node_activation_stale.json }

/reference/resource-roles:
  get:
    operationId: listResourceRoles
    tags: [reference]
    summary: Rôles de ressources
    description: >-
      Les rôles de ressources, leurs rattachements et leur capacité, désactivés compris
      (WF-REF-0090, WF-REF-0100, WF-REF-0150). Les rôles actifs se lisent sans la permission
      du référentiel : quiconque consulte un projet nomme et choisit le rôle d'une ligne de
      devis (WF-DEV-0020). Les rôles désactivés (`include_inactive`, `is_active` faux) et toute
      écriture restent sous la permission des paramètres de ressources (WF-ADM-0100) : sans
      elle, l'un et l'autre sont refusés par 403. Une table plate, triée, filtrée et paginée
      par le serveur (WF-IHM-0060, WF-IHM-0130) : la recherche (`search`) porte sur le libellé
      du rôle ; le nœud, la catégorie, le calendrier et l'état se filtrent, les heures
      mensuelles et l'effectif de la capacité se bornent (`<colonne>_min`, `<colonne>_max`,
      inclusives), et `meta.total` compte les rôles retenus. Chaque rôle porte la commande qui
      change son état, disponible ou non (`available_commands`, WF-IHM-0090) : la réactivation d'un
      rôle dont le nœud est désactivé est indisponible (WF-REF-0080).
    parameters:
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - $ref: ../components/parameters.yaml#/IncludeInactive
      - $ref: ../components/parameters.yaml#/Search
      - name: org_node_id
        in: query
        description: >-
          Restreint aux rôles qui relèvent du nœud : rattachés à lui ou à l'un de ses
          descendants (WF-REF-0070).
        schema: { $ref: ../components/common.yaml#/Uuid }
      - name: cost_category_id
        in: query
        description: Restreint aux rôles rattachés à cette catégorie de coût (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Uuid }
      - name: calendar_id
        in: query
        description: Restreint aux rôles rattachés à ce calendrier (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Uuid }
      - $ref: ../components/parameters.yaml#/IsActive
      - name: monthly_hours_min
        in: query
        description: >-
          Borne inférieure, incluse, des heures mensuelles de la capacité : restreint aux lignes qui en ont au moins autant
          (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Hours }
      - name: monthly_hours_max
        in: query
        description: >-
          Borne supérieure, incluse, des heures mensuelles de la capacité : restreint aux lignes qui n'en ont pas plus
          (WF-IHM-0130). Inférieure à `monthly_hours_min`, elle est refusée par 422.
        schema: { $ref: ../components/common.yaml#/Hours }
      - name: headcount_min
        in: query
        description: >-
          Borne inférieure, incluse, de l'effectif de la capacité : restreint aux lignes qui en ont au moins autant
          (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Decimal }
      - name: headcount_max
        in: query
        description: >-
          Borne supérieure, incluse, de l'effectif de la capacité : restreint aux lignes qui n'en ont pas plus
          (WF-IHM-0130). Inférieure à `headcount_min`, elle est refusée par 422.
        schema: { $ref: ../components/common.yaml#/Decimal }
      - name: sort_by
        in: query
        description: >-
          Colonne du tri ; absente, le libellé. Les colonnes de la table des rôles : le libellé,
          le nœud d'organisation, la catégorie et le calendrier — par leurs libellés —, les
          heures mensuelles et l'effectif de la capacité, et l'état, les rôles désactivés après
          les actifs dans l'ordre croissant (WF-IHM-0060).
          À égalité, l'ordre de la liste sans tri, puis l'identifiant.
        schema:
          type: string
          enum:
            - label
            - org_node
            - cost_category
            - calendar
            - monthly_hours
            - headcount
            - is_active
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Rôles et leur capacité (WF-REF-0090, WF-REF-0100).
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/reference.yaml#/ResourceRole }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/resource_roles.json }
              reader: { $ref: ../../../fixtures/api/resource_roles_reader.json }
              bounded: { $ref: ../../../fixtures/api/resource_roles_bounded.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          Une borne mal formée, qui n'est pas un nombre de son type : `VALIDATION_FAILED`,
          `fields[]` la désignant, `/query/<borne>`, par `NUMBER_INVALID`. Une borne supérieure
          inférieure à sa borne inférieure (`monthly_hours`, `headcount`) : `fields[]` désignant la borne supérieure,
          `/query/<colonne>_max`, par `VALUE_OUT_OF_RANGE`, `params.minimum` la borne
          inférieure donnée.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              bounds_inverted: { $ref: ../../../fixtures/api/resource_roles_bounds_inverted.json }
  post:
    operationId: createResourceRole
    summary: Créer un rôle de ressource
    description: >-
      Rattachements dans l'organisation et capacité du rôle (WF-REF-0090, WF-REF-0100). Le
      nœud est fixé à la création : un rôle ne se déplace pas d'un nœud à l'autre, il est
      recréé sous le nouveau (§3.4.4.2.1). Créé actif, il ne naît pas sous un nœud désactivé
      (WF-REF-0080).
    tags: [reference]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/ResourceRoleWrite }
    responses:
      '201':
        description: Rôle créé.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/ResourceRole }
            examples:
              created: { $ref: ../../../fixtures/api/resource_role_created.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` localisant chaque refus ; ainsi un nœud désactivé,
          `/org_node_id` par `INACTIVE_REFERENCE_OBJECT`, rien n'étant écrit (WF-REF-0080).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              node_inactive: { $ref: ../../../fixtures/api/resource_role_creation_refused.json }

/reference/resource-roles/{resource_role_id}:
  patch:
    operationId: updateResourceRole
    summary: Modifier un rôle de ressource
    description: >-
      Sans effet rétroactif sur les révisions marquées (WF-REF-0090, WF-REF-0130). Le nœud du
      rôle ne se modifie pas : un rôle ne se déplace pas d'un nœud à l'autre, une réorganisation
      le recrée sous le nouveau (§3.4.4.2.1, WF-REF-0080).
    tags: [reference]
    parameters:
      - $ref: ../components/parameters.yaml#/ResourceRoleId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/ResourceRoleUpdate }
    responses:
      '200':
        description: Rôle modifié.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/ResourceRole }
            examples:
              updated: { $ref: ../../../fixtures/api/resource_role_updated.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Le calendrier donné au rôle laisserait une tâche d'une révision en cours sans aucune
          heure travaillée dans la semaine, ne recoupant jamais celui d'un autre rôle de ses
          lignes de main-d'œuvre : `TASK_WITHOUT_WORKING_HOURS`, `params.resource_role_ids` et
          `params.tasks` nommant les rôles et les tâches en cause (WF-PLA-0010).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }

/reference/resource-roles/{resource_role_id}/activation:
  put:
    operationId: setResourceRoleActivation
    tags: [reference]
    summary: Désactiver ou réactiver un rôle de ressource
    description: >-
      Aucune suppression n'est offerte, et la désactivation laisse les projets intacts
      (WF-REF-0010, WF-REF-0020). Un rôle ne se réactive que si son nœud est actif
      (WF-REF-0080), ce que sa commande `reactivate` dit d'avance (`available_commands`) ; sa
      catégorie et son calendrier, eux, peuvent rester désactivés, aucune exigence ne
      conditionnant la réactivation à leur état. Relève de la permission de modification des
      paramètres de ressources (WF-ADM-0100).
    parameters:
      - $ref: ../components/parameters.yaml#/ResourceRoleId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [is_active, lock_version]
            properties:
              is_active: { type: boolean }
              lock_version: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '200':
        description: Activation modifiée (WF-REF-0010, WF-REF-0020).
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/ResourceRole }
            examples:
              reactivated: { $ref: ../../../fixtures/api/resource_role_reactivated.json }
              deactivated: { $ref: ../../../fixtures/api/resource_role_deactivated.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La réactivation d'un rôle dont le nœud est désactivé, refusée, rien n'étant écrit
          (WF-REF-0080) : `STATE_FORBIDS_OPERATION`, `params.missing_condition` à
          `org_node_active`, `params.conflicting_object_id` le nœud désactivé, à réactiver
          d'abord.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              node_inactive: { $ref: ../../../fixtures/api/resource_role_reactivation_refused.json }
      '412':
        description: >-
          La version envoyée n'est plus celle du rôle : il a été modifié depuis sa lecture, et
          rien n'est écrit (WF-IHM-0110). `STALE_LOCK_VERSION`, `params.expected_lock_version`
          la version courante.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/resource_role_activation_stale.json }

/reference/duration-units:
  get:
    operationId: getDurationUnits
    tags: [reference]
    summary: Constantes de conversion des unités de durée
    description: >-
      Heures par jour, heures par semaine et jours par mois, par lesquelles les jours, les
      semaines et les mois de travail se convertissent en heures sur tous les projets de
      l'installation, et que l'export MS Project transporte (WF-PLA-0160). Lisibles par
      quiconque consulte un projet : la grille de planning en a besoin pour dire ce que
      vaut une durée.
    responses:
      '200':
        description: Les trois constantes, 8, 40 et 20 par défaut (WF-PLA-0160).
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/DurationUnits }
            examples:
              defaults: { $ref: ../../../fixtures/api/duration_units.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
  put:
    operationId: setDurationUnits
    tags: [reference]
    summary: Régler les constantes de conversion des unités de durée
    description: >-
      Les trois constantes de l'installation, communes à tous les projets, sous la
      permission des paramètres de ressources, comme les calendriers (WF-PLA-0160,
      WF-ADM-0100). Une révision marquée garde les heures qu'elle a calculées
      (WF-REF-0130).
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/DurationUnitsWrite }
    responses:
      '200':
        description: Constantes enregistrées.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/DurationUnits }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }

/reference/calendars:
  get:
    operationId: listCalendars
    tags: [reference]
    summary: Calendriers
    description: >-
      Les calendriers et celui qui sert par défaut (WF-REF-0110, WF-REF-0120). Une table plate,
      triée, filtrée et paginée par le serveur (WF-IHM-0060, WF-IHM-0130) : la recherche
      (`search`) porte sur le libellé du calendrier, l'état se filtre, les heures de chaque jour
      se bornent (`<jour>_min`, `<jour>_max`, inclusives), et `meta.total` compte les
      calendriers retenus. Le calendrier par défaut ne se filtre pas, un seul l'étant, que le
      tri par `is_default` met en tête. Chaque calendrier porte la commande qui
      change son état, disponible ou non (`available_commands`, WF-IHM-0090) : la désactivation
      du calendrier par défaut est indisponible (WF-REF-0120).
    parameters:
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - $ref: ../components/parameters.yaml#/IncludeInactive
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/IsActive
      - name: monday_min
        in: query
        description: >-
          Borne inférieure, incluse, des heures du lundi : restreint aux lignes qui en ont au moins autant
          (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Hours }
      - name: monday_max
        in: query
        description: >-
          Borne supérieure, incluse, des heures du lundi : restreint aux lignes qui n'en ont pas plus
          (WF-IHM-0130). Inférieure à `monday_min`, elle est refusée par 422.
        schema: { $ref: ../components/common.yaml#/Hours }
      - name: tuesday_min
        in: query
        description: >-
          Borne inférieure, incluse, des heures du mardi : restreint aux lignes qui en ont au moins autant
          (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Hours }
      - name: tuesday_max
        in: query
        description: >-
          Borne supérieure, incluse, des heures du mardi : restreint aux lignes qui n'en ont pas plus
          (WF-IHM-0130). Inférieure à `tuesday_min`, elle est refusée par 422.
        schema: { $ref: ../components/common.yaml#/Hours }
      - name: wednesday_min
        in: query
        description: >-
          Borne inférieure, incluse, des heures du mercredi : restreint aux lignes qui en ont au moins autant
          (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Hours }
      - name: wednesday_max
        in: query
        description: >-
          Borne supérieure, incluse, des heures du mercredi : restreint aux lignes qui n'en ont pas plus
          (WF-IHM-0130). Inférieure à `wednesday_min`, elle est refusée par 422.
        schema: { $ref: ../components/common.yaml#/Hours }
      - name: thursday_min
        in: query
        description: >-
          Borne inférieure, incluse, des heures du jeudi : restreint aux lignes qui en ont au moins autant
          (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Hours }
      - name: thursday_max
        in: query
        description: >-
          Borne supérieure, incluse, des heures du jeudi : restreint aux lignes qui n'en ont pas plus
          (WF-IHM-0130). Inférieure à `thursday_min`, elle est refusée par 422.
        schema: { $ref: ../components/common.yaml#/Hours }
      - name: friday_min
        in: query
        description: >-
          Borne inférieure, incluse, des heures du vendredi : restreint aux lignes qui en ont au moins autant
          (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Hours }
      - name: friday_max
        in: query
        description: >-
          Borne supérieure, incluse, des heures du vendredi : restreint aux lignes qui n'en ont pas plus
          (WF-IHM-0130). Inférieure à `friday_min`, elle est refusée par 422.
        schema: { $ref: ../components/common.yaml#/Hours }
      - name: saturday_min
        in: query
        description: >-
          Borne inférieure, incluse, des heures du samedi : restreint aux lignes qui en ont au moins autant
          (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Hours }
      - name: saturday_max
        in: query
        description: >-
          Borne supérieure, incluse, des heures du samedi : restreint aux lignes qui n'en ont pas plus
          (WF-IHM-0130). Inférieure à `saturday_min`, elle est refusée par 422.
        schema: { $ref: ../components/common.yaml#/Hours }
      - name: sunday_min
        in: query
        description: >-
          Borne inférieure, incluse, des heures du dimanche : restreint aux lignes qui en ont au moins autant
          (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Hours }
      - name: sunday_max
        in: query
        description: >-
          Borne supérieure, incluse, des heures du dimanche : restreint aux lignes qui n'en ont pas plus
          (WF-IHM-0130). Inférieure à `sunday_min`, elle est refusée par 422.
        schema: { $ref: ../components/common.yaml#/Hours }
      - name: sort_by
        in: query
        description: >-
          Colonne du tri ; absente, le libellé. Les colonnes de la table des calendriers : le
          libellé, les heures de chaque jour, du lundi (`monday`) au dimanche (`sunday`), les
          heures de la semaine — leur somme —, le calendrier par défaut en premier dans l'ordre
          croissant, et l'état, les désactivés après les actifs (WF-IHM-0060).
          À égalité, l'ordre de la liste sans tri, puis l'identifiant.
        schema:
          type: string
          enum:
            - label
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
            - weekly_hours
            - is_default
            - is_active
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Calendriers, dont celui par défaut (WF-REF-0110, WF-REF-0120).
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/reference.yaml#/Calendar }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/calendars.json }
              with_inactive: { $ref: ../../../fixtures/api/calendars_with_inactive.json }
              reader: { $ref: ../../../fixtures/api/calendars_reader.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          Une borne mal formée, qui n'est pas un nombre de son type : `VALIDATION_FAILED`,
          `fields[]` la désignant, `/query/<borne>`, par `NUMBER_INVALID`. Une borne supérieure
          inférieure à sa borne inférieure (`monday` à `sunday`) : `fields[]` désignant la borne supérieure,
          `/query/<colonne>_max`, par `VALUE_OUT_OF_RANGE`, `params.minimum` la borne
          inférieure donnée.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              bounds_inverted: { $ref: ../../../fixtures/api/calendars_bounds_inverted.json }
  post:
    operationId: createCalendar
    summary: Créer un calendrier
    description: >-
      Jours ouvrés, heures par jour et jours chômés (WF-REF-0110).
    tags: [reference]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/CalendarWrite }
    responses:
      '201':
        description: Calendrier créé.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/Calendar }
            examples:
              created: { $ref: ../../../fixtures/api/calendar_created.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }

/reference/calendars/{calendar_id}:
  patch:
    operationId: updateCalendar
    summary: Modifier un calendrier
    description: >-
      Sans effet rétroactif sur les révisions marquées (WF-REF-0110, WF-REF-0130).
    tags: [reference]
    parameters:
      - $ref: ../components/parameters.yaml#/CalendarId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/CalendarUpdate }
    responses:
      '200':
        description: Calendrier modifié.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/Calendar }
            examples:
              updated: { $ref: ../../../fixtures/api/calendar_updated.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Les heures données au calendrier laisseraient une tâche d'une révision en cours sans
          aucune heure travaillée dans la semaine : les calendriers des rôles de ses lignes de
          main-d'œuvre ne se recoupant plus aucun jour, ou, pour le calendrier par défaut, une
          tâche sans ligne de main-d'œuvre qui n'aurait plus d'heure du tout :
          `TASK_WITHOUT_WORKING_HOURS`, `params.resource_role_ids` et `params.tasks` nommant les
          rôles et les tâches en cause — `resource_role_ids` vide pour les tâches sans ligne de
          main-d'œuvre (WF-PLA-0010).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }

/reference/calendars/{calendar_id}/default:
  put:
    operationId: setDefaultCalendar
    tags: [reference]
    summary: Désigner le calendrier par défaut
    description: >-
      Un et un seul calendrier actif est par défaut ; la désignation la retire au
      précédent (WF-REF-0120). Les tâches sans ligne de main-d'œuvre relèvent du calendrier
      par défaut (WF-PLA-0010) : un calendrier sans aucune heure dans la semaine ne peut pas
      l'être tant qu'une telle tâche existe dans une révision en cours. L'écriture change la
      disponibilité de la désactivation des deux calendriers, que la réponse ne porte que pour
      l'un (`calendar_not_default`) : le client relit la liste.
    parameters:
      - $ref: ../components/parameters.yaml#/CalendarId
    responses:
      '200':
        description: Calendrier désigné par défaut.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/Calendar }
            examples:
              designated: { $ref: ../../../fixtures/api/calendar_default.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '422':
        description: >-
          Le calendrier désigné n'a aucune heure dans la semaine, et des tâches sans ligne de
          main-d'œuvre d'une révision en cours, qui en relèveraient, n'auraient plus d'heure
          travaillée : `TASK_WITHOUT_WORKING_HOURS`, `params.resource_role_ids` vide,
          `params.tasks` nommant les tâches (WF-PLA-0010).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }

/reference/calendars/{calendar_id}/activation:
  put:
    operationId: setCalendarActivation
    tags: [reference]
    summary: Désactiver ou réactiver un calendrier
    description: >-
      La désactivation du calendrier par défaut est refusée tant qu'un autre n'a pas
      été désigné (WF-REF-0120), ce que sa commande `deactivate` dit d'avance
      (`available_commands`). Aucune suppression n'est offerte (WF-REF-0010). Relève de la
      permission de modification des paramètres de ressources (WF-ADM-0100).
    parameters:
      - $ref: ../components/parameters.yaml#/CalendarId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [is_active, lock_version]
            properties:
              is_active: { type: boolean }
              lock_version: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '200':
        description: Activation modifiée.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/Calendar }
            examples:
              deactivated: { $ref: ../../../fixtures/api/calendar_deactivated.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La désactivation du calendrier par défaut, refusée, rien n'étant écrit (WF-REF-0120) :
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `calendar_not_default` ; un
          autre calendrier se désigne d'abord par défaut (`setDefaultCalendar`).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              default: { $ref: ../../../fixtures/api/calendar_deactivation_refused.json }
      '412':
        description: >-
          La version envoyée n'est plus celle du calendrier : il a été modifié depuis sa
          lecture, et rien n'est écrit (WF-IHM-0110). `STALE_LOCK_VERSION`,
          `params.expected_lock_version` la version courante.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/calendar_activation_stale.json }

/reference/cost-types:
  get:
    operationId: listCostTypes
    tags: [reference]
    summary: Natures de coût
    description: >-
      Les natures de coût, désactivées comprises (WF-REF-0030, WF-REF-0150). Une table plate,
      triée, filtrée et paginée par le serveur (WF-IHM-0060, WF-IHM-0130) : la recherche
      (`search`) porte sur le code et sur le libellé de la nature ; le type et l'état se
      filtrent, et `meta.total` compte les natures retenues. Chaque nature porte ses commandes
      (`available_commands`, WF-IHM-0090) : celle qui change son état, et la modification de son
      type, indisponible dès qu'une de ses catégories est employée (WF-REF-0030).
    parameters:
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - $ref: ../components/parameters.yaml#/IncludeInactive
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/IsActive
      - name: kinds
        in: query
        description: Restreint aux natures de ces types (WF-IHM-0130).
        schema:
          type: array
          items: { $ref: ../components/schemas/reference.yaml#/CostTypeKind }
        explode: false
      - name: sort_by
        in: query
        description: >-
          Colonne du tri ; absente, le code. Les colonnes de la table des natures : le code, le
          libellé, le type et l'état, les natures désactivées après les actives dans l'ordre
          croissant (WF-IHM-0060).
          À égalité, l'ordre de la liste sans tri, puis l'identifiant.
        schema:
          type: string
          enum: [code, label, kind, is_active]
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Natures et leur type (WF-REF-0030).
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/reference.yaml#/CostType }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/cost_types.json }
              reader: { $ref: ../../../fixtures/api/cost_types_reader.json }
              with_inactive: { $ref: ../../../fixtures/api/cost_types_with_inactive.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
  post:
    operationId: createCostType
    summary: Créer une nature de coût
    description: >-
      Nature de coût de l'installation, de l'un des trois types (WF-REF-0030). Son code est
      unique : un code déjà porté par une autre nature, active ou désactivée, est refusé par 409,
      `ALREADY_EXISTS`. Créée, elle porte ses commandes (`available_commands`) : la modification
      de son type est disponible tant qu'aucune de ses catégories n'est employée.
    tags: [reference]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/CostTypeWrite }
    responses:
      '201':
        description: Nature créée.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/CostType }
            examples:
              created: { $ref: ../../../fixtures/api/cost_type_created.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '409':
        description: >-
          Un code déjà porté par une autre nature, active ou désactivée (WF-REF-0030) :
          `ALREADY_EXISTS`, `fields` désignant `/code` par `ALREADY_EXISTS`,
          `fields[].params.conflicting_object_id` la nature qui le porte ; rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              code_taken: { $ref: ../../../fixtures/api/cost_type_code_taken.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` localisant chaque refus : un code ou un libellé vides,
          `/code` ou `/label` par `VALUE_REQUIRED`, ou plus longs que le schéma ne l'admet — vingt
          caractères pour le code, deux cents pour le libellé —, par `VALUE_TOO_LONG` ; rien n'est
          écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              refused: { $ref: ../../../fixtures/api/cost_type_creation_refused.json }

/reference/cost-types/{cost_type_id}:
  patch:
    operationId: updateCostType
    tags: [reference]
    summary: Modifier une nature de coût
    description: >-
      Le code, le libellé et le type d'une nature se modifient, sans effet rétroactif sur les
      révisions marquées (WF-REF-0130). Le type ne peut plus être modifié dès qu'une catégorie
      rattachée est employée — portée par une ligne d'une révision, marquée ou non
      (WF-REF-0030) —, ce que la commande `change_kind` de la nature dit d'avance
      (`available_commands`) ; le code et le libellé se modifient toujours. Un code déjà porté
      par une autre nature est refusé par 409, `ALREADY_EXISTS`. Un type changé vers ou depuis la
      provision change la disponibilité des commandes d'autres objets — la désactivation et le
      changement de type des autres natures provision, la désactivation et le rattachement des
      catégories provision —, que la réponse ne porte pas : le client relit les listes.
    parameters:
      - $ref: ../components/parameters.yaml#/CostTypeId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/reference.yaml#/CostTypeUpdate }
    responses:
      '200':
        description: Nature modifiée.
        content:
          application/json:
            schema: { $ref: ../components/schemas/reference.yaml#/CostType }
            examples:
              updated: { $ref: ../../../fixtures/api/cost_type_updated.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Un autre type pour une nature dont une catégorie est employée (WF-REF-0030), ou pour la
          dernière nature provision active à porter une catégorie active (#578) :
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` la première des conditions que la
          commande `change_kind` dit manquantes, `cost_type_unused` avant
          `cost_type_not_last_provision`. Un code déjà porté par une autre nature,
          active ou désactivée : `ALREADY_EXISTS`, `fields` désignant `/code` par `ALREADY_EXISTS`,
          `fields[].params.conflicting_object_id` la nature qui le porte. Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              kind_frozen: { $ref: ../../../fixtures/api/cost_type_kind_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` localisant chaque refus, comme à la création : `/code` ou
          `/label` vides, par `VALUE_REQUIRED`, ou trop longs, par `VALUE_TOO_LONG` ; rien n'est
          écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              refused: { $ref: ../../../fixtures/api/cost_type_update_refused.json }

/reference/cost-types/{cost_type_id}/activation:
  put:
    operationId: setCostTypeActivation
    summary: Désactiver ou réactiver une nature de coût
    description: >-
      Aucune suppression n'est offerte, et la désactivation laisse les projets intacts
      (WF-REF-0010, WF-REF-0020). La réactivation est toujours disponible. La désactivation l'est
      aussi, sauf pour la dernière nature provision active à porter une catégorie active : il en
      reste toujours une, dont les lignes de provision des risques prennent la catégorie
      (WF-REF-0030 ; décision de l'auteur du 2026-10-09, #578), ce que la commande `deactivate` de
      la nature dit d'avance (`available_commands`). Relève de la permission de modification des
      paramètres de coûts (WF-ADM-0100). L'écriture d'une nature provision change la
      disponibilité des commandes d'autres objets — la désactivation et le changement de type des
      autres natures provision, la désactivation et le rattachement de leurs catégories —, que la
      réponse ne porte pas : le client relit les listes.
    tags: [reference]
    parameters:
      - $ref: ../components/parameters.yaml#/CostTypeId
    requestBody:
      required: true
      content:
