/projects/{project_id}/indicators/index-history:
  get:
    operationId: getIndexHistory
    tags: [indicators]
    summary: Evolution of the indices
    description: >-
      For the project and for each subproject, the "hors sous-projet" set included
      (WF-IND-0020), the evolution of the cost index and of the schedule index: one point per
      marked revision, at its marking date, as its marking kept it (WF-DAT-0040), and the
      last point on the current day (WF-IND-0010) — on the current revision, or, on a project
      that has none, on its last marked revision with the day's actual cost —, with the
      watch and alert thresholds of the reference data (WF-IND-0130, WF-REF-0170). A
      revision marked before the In progress state kept no project indicator (WF-DAT-0040):
      it gives no point. An index that a revision marked In progress could not compute —
      without actual cost, without planned value — is a non-computable point, never omitted
      (WF-IND-0010; #1777). On a project before the In progress state, only the estimate
      indicators exist (WF-IND-0010): refused with 409, like the three other reads of project
      indicators (#1778). Without `scope`, each scope; with it, only the scope requested, the
      project, a subproject or the "hors sous-projet" set, which `context.scope` names
      (WF-IND-0020).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/Scope
    responses:
      '200':
        description: Curves of the indices by scope, and the thresholds.
        content:
          application/json:
            schema: { $ref: ../components/schemas/indicators.yaml#/IndexHistory }
            examples:
              witness: { $ref: ../../../fixtures/api/index_history.json }
              subproject: { $ref: ../../../fixtures/api/index_history_subproject.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`: project before the In progress state, `params.state` being
          the state of the project and `params.state_enum` `ProjectState`; only the estimate
          indicators exist (WF-IND-0010; #1778).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              not_in_progress: { $ref: ../../../fixtures/api/project_indicators_not_in_progress.json }
      '422':
        description: >-
          `VALIDATION_FAILED`: a subproject the project does not have, or a malformed
          identifier, in `scope`, `fields` designating `/query/scope` by `UNKNOWN_SUBPROJECT`
          (WF-IND-0020).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              scope_unknown: { $ref: ../../../fixtures/api/indicators_scope_unknown.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
