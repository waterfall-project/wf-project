      according to the document dates, up to the calculation date, at a monthly step
      (WF-IND-0110). For a named marked revision (`revision_id`), the curves that its marking
      kept with its indicators, on the actual cost lines known at its marking as they were
      then, `context.is_stored` true (WF-IND-0010, WF-DAT-0040).
