# Estimate, remaining-to-commit and project indicators, and derived views.
# An indicator is computed at a date and for a scope (WF-IND-0010, WF-IND-0020);
# those of a marked revision are kept and invariable (WF-DAT-0040).

/projects/{project_id}/estimate-indicators:
  get:
    operationId: getEstimateIndicators
    tags: [estimate]
    summary: Estimate indicators
    description: >-
      Total, breakdowns by cost type, by subproject and by work package of the work breakdown
      — the total of the subtree of the task attached to the work package (WF-PLA-0170) —,
      provisions, deviation from the reference revision and from the previous marked revision
      (WF-DEV-0060). Available from pricing onwards (WF-IND-0010). An hourly rate missing for
      the reference year does not make a budget wrong: the amounts concerned are not
      computed, and state which categories and which years are missing
      (`hourly_rate_missing`, WF-DEV-0010).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: revision_id
        in: query
        schema: { $ref: ../components/common.yaml#/Uuid }
      - $ref: ../components/parameters.yaml#/Scope
    responses:
      '200':
        description: Estimate indicators.
        content:
          application/json:
            schema: { $ref: ../components/schemas/indicators.yaml#/EstimateIndicators }
            examples:
              volume: { $ref: ../../../fixtures/api/volume/estimate_indicators_volume.json }
              witness: { $ref: ../../../fixtures/api/estimate_indicators.json }
              breakdown: { $ref: ../../../fixtures/api/estimate_indicators_breakdown.json }
              missing_rates: { $ref: ../../../fixtures/api/estimate_indicators_missing_rates.json }
              work_package_without_task: { $ref: ../../../fixtures/api/estimate_indicators_work_package_without_task.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          `VALIDATION_FAILED`: a subproject the project does not have, or a malformed
          identifier, in `scope`, `fields` designating `/query/scope` by `UNKNOWN_SUBPROJECT`
          (WF-IND-0020).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              scope_unknown: { $ref: ../../../fixtures/api/indicators_scope_unknown.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/estimate-indicators/missing-rates:
  get:
    operationId: getMissingRates
    tags: [estimate]
    summary: Hourly rates missing for the computation
    description: >-
      Rates are required only for the categories an estimate actually uses, and for the
      reference year of its revision (`Revision.reference_year`, WF-REV-0060; WF-DEV-0010,
      WF-CYC-0120): each category without a rate for that year is named.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: revision_id
        in: query
        schema: { $ref: ../components/common.yaml#/Uuid }
    responses:
      '200':
        description: Categories and years without a rate.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/indicators.yaml#/MissingRate }
            examples:
              witness: { $ref: ../../../fixtures/api/missing_rates_none.json }
              missing: { $ref: ../../../fixtures/api/missing_rates.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/workload:
  get:
    operationId: getProjectWorkload
    tags: [estimate]
    summary: Project workload
    description: >-
      By role and by month, the effort of the labour lines taken, as chosen, from the
      reference revision, from a marked revision for its re-estimated effort, named by
      `revision_id`, or from the current revision, with each role's capacity alongside
      (WF-DEV-0070). On a project without a reference revision, the reference basis is
      absent: `reference_budget` is refused (409, `STATE_FORBIDS_OPERATION`), like
      `current_remaining` on a project without a current revision; a marked revision remains
      a basis, in pricing as in execution, and `marked_remaining` is refused only without
      `revision_id` or on a revision that is not marked (422, `VALIDATION_FAILED`) — on a
      project without any marked revision, only the current revision is therefore a basis.
      On a marked revision, the calculation date is its marking date (`context.computed_at`).
      The plan names the organisation node it retains (`org_node_id`, `org_node_label`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/WorkloadBasis
      - name: revision_id
        in: query
        description: The marked revision whose re-estimated amounts form the basis; required with `marked_remaining`, ignored otherwise.
        schema: { $ref: ../components/common.yaml#/Uuid }
      - name: org_node_id
        in: query
        description: >-
          Restricts to the roles that come under the node: attached to it or to one of its
          descendants (WF-DEV-0070, WF-REF-0070).
        schema: { $ref: ../components/common.yaml#/Uuid }
    responses:
      '200':
        description: Workload.
        content:
          application/json:
            schema: { $ref: ../components/schemas/indicators.yaml#/WorkloadPlan }
            examples:
              witness: { $ref: ../../../fixtures/api/workload.json }
              reference_budget: { $ref: ../../../fixtures/api/workload_reference_budget.json }
              marked_remaining: { $ref: ../../../fixtures/api/workload_marked_remaining.json }
              org_node: { $ref: ../../../fixtures/api/workload_org_node.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `reference_budget` on a project without a reference revision, or `current_remaining`
          on a project without a current revision: the basis is absent (WF-DEV-0070).
          `STATE_FORBIDS_OPERATION`, `params.state` the state of the project,
          `params.state_enum` set to `ProjectState`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              no_reference: { $ref: ../../../fixtures/api/workload_no_reference.json }
      '422':
        description: >-
          `VALIDATION_FAILED`: `marked_remaining` without a marked revision — `revision_id`
          absent, unknown or not marked —, or an unknown organisation node; `fields`
          designates the refused parameter, `/query/revision_id` or `/query/org_node_id`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_refused: { $ref: ../../../fixtures/api/workload_revision_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/remaining-indicators:
  get:
    operationId: getRemainingIndicators
    tags: [remaining]
    summary: Remaining-to-commit indicators
    description: >-
      Total, breakdowns, deviations from the reference and from the previous review, and
      overrun by subproject, the "hors sous-projet" set included (WF-RAE-0020,
      WF-IND-0020).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: revision_id
        in: query
        schema: { $ref: ../components/common.yaml#/Uuid }
    responses:
      '200':
        description: Remaining-to-commit indicators.
        content:
          application/json:
            schema: { $ref: ../components/schemas/indicators.yaml#/RemainingIndicators }
            examples:
              witness: { $ref: ../../../fixtures/api/remaining_indicators.json }
              over_budget: { $ref: ../../../fixtures/api/remaining_indicators_over_budget.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/remaining-indicators/startable-tasks:
  get:
    operationId: listStartableTasks
    tags: [remaining]
    summary: Kanban tasks, by state
    description: >-
      The tasks of the main structure of the current revision, divided according to their
      state — not started, started, completed —, each column in the order of the plan
      (WF-RAE-0030). A summary task appears in it only when started, all its subordinates
      completed, when one of its own lines other than a provision keeps a remaining to commit:
      it now waits only for its own lines (`TaskFacet.awaiting_own_lines`), and the column of
      started tasks returns it, with the gestures of its card; any other summary task is
      excluded, its state deriving from its subordinates (WF-PLA-0040; #1851). All the tasks
      not started, each stating whether its predecessors are all completed
      (`predecessors_completed`): the Kanban uses it to flag the milestones to complete, and
      deduces nothing from the links; the started tasks, whose remaining to commit is to be
      re-estimated; the completed tasks, with their completion date (`task.completed_on`),
      which the Kanban reopens — a milestone by bringing it back to the not-started state,
      any other task to the started state (`setTaskProgress`). Each task is a `KanbanTask`:
      it lists the gestures of its card, available or not with the conditions they lack, and
      the state each one sends (`available_commands`, WF-IHM-0090); the Kanban offers only
      those, and deduces nothing from the nature of the task or from its lines.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: Tasks by state.
        content:
          application/json:
            schema:
              type: object
              required: [not_started, started, completed]
              properties:
                not_started:
                  type: array
                  items: { $ref: ../components/schemas/revisions.yaml#/NotStartedTask }
                started:
                  type: array
                  items: { $ref: ../components/schemas/revisions.yaml#/KanbanTask }
                completed:
                  type: array
                  items: { $ref: ../components/schemas/revisions.yaml#/KanbanTask }
            examples:
              witness: { $ref: ../../../fixtures/api/startable_tasks.json }
              milestone: { $ref: ../../../fixtures/api/startable_tasks_milestone.json }
              awaiting_own_lines: { $ref: ../../../fixtures/api/startable_tasks_awaiting_own_lines.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/indicators:
  get:
    operationId: getProjectIndicators
    tags: [indicators]
    summary: Earned value indicators
    description: >-
      Reference budget, planned value, earned value, actual cost, remaining to commit,
      progresses, indices with their zone, variances and three projections. Computed from
      the In progress state only (WF-IND-0010 to WF-IND-0080). On the current day, those of
      the current revision, or, on a project that has none, those of its last marked revision
      computed with the day's actual cost, not kept (WF-IND-0010); at a past date, the kept
      values of the last earlier marked revision; for a named marked revision, those of its
      marking (WF-DAT-0040).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/IndicatorsRevision
      - $ref: ../components/parameters.yaml#/AsOf
      - $ref: ../components/parameters.yaml#/Scope
    responses:
      '200':
        description: Indicators.
        content:
          application/json:
            schema: { $ref: ../components/schemas/indicators.yaml#/ProjectIndicators }
            examples:
              witness: { $ref: ../../../fixtures/api/project_indicators.json }
              marked: { $ref: ../../../fixtures/api/project_indicators_marked.json }
              without_current_revision: { $ref: ../../../fixtures/api/project_indicators_without_current_revision.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`: project before the In progress state, `params.state` being
          the state of the project and `params.state_enum` `ProjectState`; or a revision named
          by `revision_id` marked before it, without `params.state`, the project being in
          progress. In both cases, only the estimate indicators exist (WF-IND-0010,
          WF-DAT-0040).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              not_in_progress: { $ref: ../../../fixtures/api/project_indicators_not_in_progress.json }
              offer: { $ref: ../../../fixtures/api/project_indicators_offer.json }
      '422':
        description: >-
          `VALIDATION_FAILED`: `revision_id` and `as_of` together, each of them choosing the
          revision of the computation, `fields` designating `/query/revision_id`; or a
          subproject the project does not have, or a malformed identifier, in `scope`,
          `fields` designating `/query/scope` by `UNKNOWN_SUBPROJECT` (WF-IND-0020).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              scope_unknown: { $ref: ../../../fixtures/api/indicators_scope_unknown.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/indicators/milestone-tracking:
  get:
    operationId: getMilestoneTracking
    tags: [indicators]
    summary: Time/time diagram
    description: >-
      For each tracked milestone, the date that each revision marked in the In progress state
      forecast, by its marking date — a revision marked before gives none —; a milestone's
      curve ends with a point at its completion date, on the horizontal axis as on the
      vertical, and the last point of an uncompleted milestone is that of the current day,
      from the current revision or, failing that, the last marked revision (WF-IND-0090,
      WF-IND-0010). Computed for the project alone, without `scope`: it tracks milestones,
      which a subproject does not have (WF-IND-0020). On a project before the In progress
      state, only the estimate indicators exist (WF-IND-0010): refused with 409, like the
      three other reads of project indicators (author's decision of 2026-11-01, #1778).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: Series by milestone.
        content:
          application/json:
            schema: { $ref: ../components/schemas/indicators.yaml#/MilestoneTracking }
            examples:
              witness: { $ref: ../../../fixtures/api/milestone_tracking.json }
              none: { $ref: ../../../fixtures/api/milestone_tracking_none.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`: project before the In progress state, `params.state` being
          the state of the project and `params.state_enum` `ProjectState`; only the estimate
          indicators exist (WF-IND-0010; #1778).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              not_in_progress: { $ref: ../../../fixtures/api/project_indicators_not_in_progress.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/indicators/cost-curve:
  get:
    operationId: getCostCurve
    tags: [indicators]
    summary: Cumulative cost curve
    description: >-
      Cumulative reference budget, cumulative actual cost up to the calculation date, then
      the project manager's projection, which starts from that point: the remaining to
      commit of each line spread, in proportion to the hours worked, over the part of its
      task's duration after the calculation date, and carried in full to the calculation date
      when the task's finish has passed (WF-RAE-0040). The changes of the budget appear as
      dated steps. On request (`payment_delays`), each amount of the budget and of the
      projection is shifted by the payment delay of its line, the provisions of the
      identified risks, which carry none, staying at the date of the task that carries them,
      and the actual cost is not shifted: the curve then presents the disbursements, past and
      to come, and also returns them by month (`cash_out_by_month`); the sum of the
      disbursements to come equals the remaining to commit (WF-IND-0100). At a monthly step,
      each point carrying the cumulative total at the end of the month (`CurveSeries`,
      WF-IND-0100). For a named marked revision (`revision_id`), the curve that its marking
      kept with its indicators, on the actual cost lines known at its marking as they were
      then, `context.is_stored` true (WF-IND-0010, WF-DAT-0040). Restricted to a subproject,
      or to the "hors sous-projet" set (`scope`, WF-IND-0020), each series counts only the
      lines of the scope — budget, actual cost, remaining to commit, provisions — and a step,
      what the amendment changes in the scope's budget, none if it changes nothing there;
      `context.scope` names the scope. A scope without a line in any reference or in the
      current revision, and without actual cost, has nothing to draw: its series without a
      point, no step, and `cash_out_by_month` empty with the payment delays.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/IndicatorsRevision
      - $ref: ../components/parameters.yaml#/AsOf
      - $ref: ../components/parameters.yaml#/Scope
      - name: payment_delays
        in: query
        description: >-
          True, the series are shifted by the payment delays and carry the provisions of the
          identified risks: they are the disbursements (WF-IND-0100).
        schema: { type: boolean, default: false }
    responses:
      '200':
        description: Cumulative series, disbursements by month included when `payment_delays` is true.
        content:
          application/json:
            schema: { $ref: ../components/schemas/indicators.yaml#/CurveSeries }
            examples:
              witness: { $ref: ../../../fixtures/api/cost_curve.json }
              payment_delays: { $ref: ../../../fixtures/api/cost_curve_payment_delays.json }
              amendment: { $ref: ../../../fixtures/api/cost_curve_amendment.json }
              subproject: { $ref: ../../../fixtures/api/cost_curve_subproject.json }
              subproject_empty: { $ref: ../../../fixtures/api/cost_curve_subproject_empty.json }
              subproject_unbudgeted: { $ref: ../../../fixtures/api/cost_curve_subproject_unbudgeted.json }
              subproject_empty_payment_delays: { $ref: ../../../fixtures/api/cost_curve_subproject_empty_payment_delays.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION`: project before the In progress state, or a revision named
          by `revision_id` marked before it — only the estimate indicators exist
          (WF-IND-0010, WF-DAT-0040).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              offer: { $ref: ../../../fixtures/api/project_indicators_offer.json }
      '422':
        description: >-
          `VALIDATION_FAILED`: `revision_id` and `as_of` together, each of them choosing the
          revision of the computation, `fields` designating `/query/revision_id`; or a
          subproject the project does not have, or a malformed identifier, in `scope`,
          `fields` designating `/query/scope` by `UNKNOWN_SUBPROJECT` (WF-IND-0020).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              scope_unknown: { $ref: ../../../fixtures/api/indicators_scope_unknown.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/indicators/earned-value-curves:
