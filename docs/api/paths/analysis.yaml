# Indicateurs de devis, de reste à engager et de projet, et vues dérivées.
# Un indicateur se calcule à une date et pour une maille (WF-IND-0010, WF-IND-0020) ;
# ceux d'une révision marquée sont conservés et invariables (WF-DAT-0040).

/projects/{project_id}/estimate-indicators:
  get:
    operationId: getEstimateIndicators
    tags: [estimate]
    summary: Indicateurs de devis
    description: >-
      Total, ventilations par nature de coût, par sous-projet et par poste du lotissement,
      provisions, écart avec la révision de référence et avec la révision marquée précédente
      (WF-DEV-0060). Disponibles dès le chiffrage (WF-IND-0010). Un taux horaire manquant
      pour l'année de référence ne rend pas un budget faux : les montants concernés ne se
      calculent pas, et disent quelles catégories et quelles années manquent
      (`hourly_rate_missing`, WF-DEV-0010).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: revision_id
        in: query
        schema: { $ref: ../components/common.yaml#/Uuid }
      - $ref: ../components/parameters.yaml#/Scope
    responses:
      '200':
        description: Indicateurs de devis.
        content:
          application/json:
            schema: { $ref: ../components/schemas/indicators.yaml#/EstimateIndicators }
            examples:
              volume: { $ref: ../../../fixtures/api/volume/estimate_indicators.json }
              witness: { $ref: ../../../fixtures/api/estimate_indicators.json }
              breakdown: { $ref: ../../../fixtures/api/estimate_indicators_breakdown.json }
              missing_rates: { $ref: ../../../fixtures/api/estimate_indicators_missing_rates.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }

/projects/{project_id}/estimate-indicators/missing-rates:
  get:
    operationId: getMissingRates
    tags: [estimate]
    summary: Taux horaires manquants pour le calcul
    description: >-
      Les taux ne sont exigés que pour les catégories qu'un devis emploie réellement, et
      pour l'année de référence de sa révision (`Revision.reference_year`, WF-REV-0060 ;
      WF-DEV-0010, WF-CYC-0120) : chaque catégorie sans taux pour cette année est nommée.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: revision_id
        in: query
        schema: { $ref: ../components/common.yaml#/Uuid }
    responses:
      '200':
        description: Catégories et années sans taux.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/indicators.yaml#/MissingRate }
            examples:
              witness: { $ref: ../../../fixtures/api/missing_rates_none.json }
              missing: { $ref: ../../../fixtures/api/missing_rates.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }

/projects/{project_id}/workload:
  get:
    operationId: getProjectWorkload
    tags: [estimate]
    summary: Plan de charge du projet
    description: >-
      Par rôle et par mois, au choix sur les montants budgétés de la révision de
      référence, sur les montants réestimés d'une révision marquée, nommée par
      `revision_id`, ou sur ceux de la révision en cours, avec la capacité de chaque rôle
      en regard (WF-DEV-0070). Sur un projet sans révision de référence, seule la
      révision en cours est une base : les deux autres sont refusées (409,
      `STATE_FORBIDS_OPERATION`), et `marked_remaining` l'est aussi sans `revision_id`
      ou sur une révision qui n'est pas marquée (422, `VALIDATION_FAILED`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/WorkloadBasis
      - name: revision_id
        in: query
        description: La révision marquée dont les montants réestimés font la base ; exigée avec `marked_remaining`, ignorée sinon.
        schema: { $ref: ../components/common.yaml#/Uuid }
      - name: org_node_id
        in: query
        description: >-
          Restreint aux rôles qui relèvent du nœud : rattachés à lui ou à l'un de ses
          descendants (WF-DEV-0070, WF-REF-0070).
        schema: { $ref: ../components/common.yaml#/Uuid }
    responses:
      '200':
        description: Plan de charge.
        content:
          application/json:
            schema: { $ref: ../components/schemas/indicators.yaml#/WorkloadPlan }
            examples:
              witness: { $ref: ../../../fixtures/api/workload.json }
              reference_budget: { $ref: ../../../fixtures/api/workload_reference_budget.json }
              marked_remaining: { $ref: ../../../fixtures/api/workload_marked_remaining.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Projet sans révision de référence : seule la révision en cours est une base
          (WF-DEV-0070). `STATE_FORBIDS_OPERATION`, `params.state` l'état du projet.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              no_reference: { $ref: ../../../fixtures/api/workload_no_reference.json }
      '422':
        description: >-
          `VALIDATION_FAILED` : `marked_remaining` sans révision marquée — `revision_id`
          absent, inconnu ou non marqué —, ou un nœud d'organisation inconnu ; `fields`
          désigne le paramètre refusé, `/query/revision_id` ou `/query/org_node_id`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_refused: { $ref: ../../../fixtures/api/workload_revision_refused.json }

/projects/{project_id}/remaining-indicators:
  get:
    operationId: getRemainingIndicators
    tags: [remaining]
    summary: Indicateurs de reste à engager
    description: >-
      Total, ventilations, écarts avec la référence et avec la revue précédente, et
      dépassement par sous-projet, l'ensemble « hors sous-projet » compris
      (WF-RAE-0020, WF-IND-0020).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: revision_id
        in: query
        schema: { $ref: ../components/common.yaml#/Uuid }
    responses:
      '200':
        description: Indicateurs de reste à engager.
        content:
          application/json:
            schema: { $ref: ../components/schemas/indicators.yaml#/RemainingIndicators }
            examples:
              witness: { $ref: ../../../fixtures/api/remaining_indicators.json }
              over_budget: { $ref: ../../../fixtures/api/remaining_indicators_over_budget.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }

/projects/{project_id}/remaining-indicators/startable-tasks:
  get:
    operationId: listStartableTasks
    tags: [remaining]
    summary: Tâches à démarrer, pour le Kanban
    description: >-
      Les tâches non démarrées dont les prédécesseurs sont terminés, et les tâches
      démarrées dont le reste à engager est à réestimer (WF-RAE-0030).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: Tâches par état.
        content:
          application/json:
            schema:
              type: object
              required: [not_started, started]
              properties:
                not_started:
                  type: array
                  items: { $ref: ../components/schemas/revisions.yaml#/Node }
                started:
                  type: array
                  items: { $ref: ../components/schemas/revisions.yaml#/Node }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }

/projects/{project_id}/indicators:
  get:
    operationId: getProjectIndicators
    tags: [indicators]
    summary: Indicateurs de valeur acquise
    description: >-
      Budget de référence, valeur planifiée, valeur acquise, coût réel, reste à engager,
      avancements, indices avec leur zone, écarts et trois projections. Calculés à partir
      de l'état En cours seulement (WF-IND-0010 à WF-IND-0080). À une date passée, les
      valeurs conservées de la dernière révision marquée antérieure ; pour une révision
      marquée nommée, celles de son marquage (WF-DAT-0040).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/IndicatorsRevision
      - $ref: ../components/parameters.yaml#/AsOf
      - $ref: ../components/parameters.yaml#/Scope
    responses:
      '200':
        description: Indicateurs.
        content:
          application/json:
            schema: { $ref: ../components/schemas/indicators.yaml#/ProjectIndicators }
            examples:
              witness: { $ref: ../../../fixtures/api/project_indicators.json }
              marked: { $ref: ../../../fixtures/api/project_indicators_marked.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION` : projet antérieur à l'état En cours, `params.state` étant
          l'état du projet ; ou révision nommée par `revision_id` marquée avant lui, sans
          `params.state`, le projet étant en cours. Dans les deux cas, seuls les indicateurs de
          devis existent (WF-IND-0010, WF-DAT-0040).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              not_in_progress: { $ref: ../../../fixtures/api/project_indicators_not_in_progress.json }
              offer: { $ref: ../../../fixtures/api/project_indicators_offer.json }
      '422':
        description: >-
          `VALIDATION_FAILED` : `revision_id` et `as_of` ensemble, l'un et l'autre
          choisissant la révision du calcul ; `fields` désigne `/query/revision_id`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }

/projects/{project_id}/indicators/milestone-tracking:
  get:
    operationId: getMilestoneTracking
    tags: [indicators]
    summary: Diagramme temps/temps
    description: >-
      Pour chaque jalon inscrit au suivi, la date que chaque révision marquée prévoyait,
      en fonction de sa date de marquage ; la courbe s'arrête à la terminaison
      (WF-IND-0090).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: Séries par jalon.
        content:
          application/json:
            schema: { $ref: ../components/schemas/indicators.yaml#/MilestoneTracking }
            examples:
              witness: { $ref: ../../../fixtures/api/milestone_tracking.json }
              none: { $ref: ../../../fixtures/api/milestone_tracking_none.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }

/projects/{project_id}/indicators/cost-curve:
  get:
    operationId: getCostCurve
    tags: [indicators]
    summary: Courbe de coûts cumulés
    description: >-
      Budget de référence cumulé, coût réel cumulé jusqu'à la date de calcul, puis la
      projection du chef de projet, le reste à engager étalé sur les dates de la
      révision courante. Les changements du budget apparaissent comme des marches
      datées. Sur demande (`payment_delays`), chaque montant est décalé du délai de
      paiement de sa ligne et les provisions des risques identifiés s'ajoutent à la date
      de la tâche qui les porte : la courbe présente alors les décaissements, passés et
      à venir, et les rend aussi par mois (`cash_out_by_month`) ; la somme des
      décaissements à venir égale le reste à engager (WF-IND-0100). Pour une révision
      marquée nommée, la courbe recalculée à la date de son marquage (`revision_id`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/IndicatorsRevision
      - $ref: ../components/parameters.yaml#/AsOf
      - name: payment_delays
        in: query
        description: >-
          Vrai, les séries sont décalées des délais de paiement et portent les provisions
          des risques identifiés : ce sont les décaissements (WF-IND-0100).
        schema: { type: boolean, default: false }
    responses:
      '200':
        description: Séries cumulées, décaissements par mois compris quand `payment_delays` est vrai.
        content:
          application/json:
            schema: { $ref: ../components/schemas/indicators.yaml#/CurveSeries }
            examples:
              witness: { $ref: ../../../fixtures/api/cost_curve.json }
              payment_delays: { $ref: ../../../fixtures/api/cost_curve_payment_delays.json }
              amendment: { $ref: ../../../fixtures/api/cost_curve_amendment.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION` : projet antérieur à l'état En cours, ou révision nommée
          par `revision_id` marquée avant lui — seuls les indicateurs de devis existent
          (WF-IND-0010, WF-DAT-0040).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              offer: { $ref: ../../../fixtures/api/project_indicators_offer.json }
      '422':
        description: >-
          `VALIDATION_FAILED` : `revision_id` et `as_of` ensemble, l'un et l'autre
          choisissant la révision du calcul ; `fields` désigne `/query/revision_id`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }

/projects/{project_id}/indicators/earned-value-curves:
  get:
    operationId: getEarnedValueCurves
    tags: [indicators]
    summary: Courbes de valeur acquise
    description: >-
      Valeur planifiée, valeur acquise selon les dates de terminaison, et coût réel selon
      les dates de pièce (WF-IND-0110). Pour une révision marquée nommée, les courbes
      recalculées à la date de son marquage (`revision_id`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/IndicatorsRevision
      - $ref: ../components/parameters.yaml#/AsOf
      - $ref: ../components/parameters.yaml#/Scope
    responses:
      '200':
        description: Séries cumulées.
        content:
          application/json:
            schema: { $ref: ../components/schemas/indicators.yaml#/CurveSeries }
            examples:
              witness: { $ref: ../../../fixtures/api/earned_value_curves.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          `STATE_FORBIDS_OPERATION` : projet antérieur à l'état En cours, ou révision nommée
          par `revision_id` marquée avant lui — seuls les indicateurs de devis existent
          (WF-IND-0010, WF-DAT-0040).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              offer: { $ref: ../../../fixtures/api/project_indicators_offer.json }
      '422':
        description: >-
          `VALIDATION_FAILED` : `revision_id` et `as_of` ensemble, l'un et l'autre
          choisissant la révision du calcul ; `fields` désigne `/query/revision_id`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }

/projects/{project_id}/indicators/index-history:
  get:
    operationId: getIndexHistory
    tags: [indicators]
    summary: Évolution des indices
    description: >-
      Pour le projet et pour chaque sous-projet, l'ensemble « hors sous-projet » compris
      (WF-IND-0020), l'évolution de l'indice de coût et de l'indice de délai : un point par
      révision marquée, à sa date de marquage, tel que son marquage l'a conservé
      (WF-DAT-0040), et le dernier point au jour courant pour la révision en cours, avec
      les seuils de vigilance et d'alerte du référentiel (WF-IND-0130, WF-REF-0170). Un
      indice qu'une révision n'a pas su calculer — marquée avant l'état En cours — est un
      point non calculable, jamais omis.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: Courbes des indices par maille, et les seuils.
        content:
          application/json:
            schema: { $ref: ../components/schemas/indicators.yaml#/IndexHistory }
            examples:
              witness: { $ref: ../../../fixtures/api/index_history.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
