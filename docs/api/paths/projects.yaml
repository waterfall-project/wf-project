/projects:
  get:
    operationId: listProjects
    tags: [projects]
    summary: Projets
    description: >-
      Les projets que l'appelant peut ouvrir, et eux seuls : ceux dont il est
      contributeur et, s'il porte la permission « consulter tous les projets », tous les
      autres (WF-PRJ-0060, WF-ADM-0110) — le portefeuille, lui, compte tous les projets du
      périmètre (WF-PTF-0030). Le filtre `is_contributor` restreint la liste aux projets
      dont l'appelant est contributeur : c'est l'accueil, un filtre que l'utilisateur
      voit et lève (WF-IHM-0120) ; levé, la liste ne montre que ce qu'il peut ouvrir, et
      rien d'autre. Le tri et les filtres sont faits par le serveur, et `meta.total`
      compte les projets retenus (WF-IHM-0130). La recherche (`search`) porte sur le libellé
      et sur le code du projet ; la période (`from`, `to`), sur l'instant de sa dernière
      modification (`audit.updated_at`), la colonne de date de la liste, comme celle du journal
      d'audit : deux instants, le début inclus, la fin exclue, que l'écran tire des jours de son
      lecteur.
      Sans `states`, les projets en cours seuls, le défaut du périmètre du portefeuille
      (WF-PTF-0010) que le paramètre partage : un accueil qui liste tous les projets
      ouvrables nomme les six états. `meta.states` dit toujours les états retenus, nommés ou
      par défaut, pour que l'écran montre le filtre que le serveur a appliqué.
    parameters:
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/PortfolioStates
      - name: is_contributor
        in: query
        description: Vrai, les seuls projets dont l'appelant est contributeur.
        schema: { type: boolean, default: false }
      - name: from
        in: query
        description: >-
          Début de la période, inclus : restreint aux projets dont la dernière modification
          (`audit.updated_at`) est à cet instant ou après lui (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Timestamp }
      - name: to
        in: query
        description: >-
          Fin de la période, exclue : restreint aux projets modifiés avant cet instant
          (WF-IHM-0130). Antérieure à `from`, elle est refusée par 422 ; égale, la période est
          vide.
        schema: { $ref: ../components/common.yaml#/Timestamp }
      - name: sort_by
        in: query
        description: >-
          Colonne du tri ; absente, les projets modifiés le plus récemment d'abord. Le libellé
          et le code se comparent dans l'ordre des points de code Unicode, un projet sans code
          après les autres dans l'ordre croissant ; l'état, dans l'ordre de `ProjectState`, celui
          du cycle de vie (WF-CYC-0010). À égalité, l'ordre de la liste sans tri, puis
          l'identifiant.
        schema:
          type: string
          enum: [label, code, state, updated_at]
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Projets, et les états retenus.
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/projects.yaml#/Project }
                meta: { $ref: ../components/schemas/projects.yaml#/ProjectListMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/projects.json }
              empty: { $ref: ../../../fixtures/api/projects_empty.json }
              default_states: { $ref: ../../../fixtures/api/projects_default_states.json }
              search_code: { $ref: ../../../fixtures/api/projects_search_code.json }
              period: { $ref: ../../../fixtures/api/projects_period.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          `VALIDATION_FAILED` : une période dont la fin précède le début, `fields[]` désignant
          `/query/to` par `VALUE_OUT_OF_RANGE`, `params.minimum` le début donné, la règle de
          toute période du contrat ; un instant mal formé, `/query/from` ou `/query/to` par
          `DATE_INVALID`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              period_inverted: { $ref: ../../../fixtures/api/projects_period_inverted.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createProject
    tags: [projects]
    summary: Créer un projet
    description: >-
      Refusée tant que le référentiel minimal est incomplet, et le refus nomme chaque
      prérequis manquant (WF-CYC-0120) — parmi eux, depuis EP-14/L42p, une catégorie de coût active
      de type provision pour risques (#579). Le créateur est inscrit chef de projet
      (WF-PRJ-0060). Le projet naît à l'état Créé (WF-CYC-0010).
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/ProjectCreate }
    responses:
      '201':
        description: Projet créé.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Project }
            examples:
              created: { $ref: ../../../fixtures/api/project_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '409':
        description: >-
          Référentiel minimal incomplet (WF-CYC-0120) : `REFERENCE_INCOMPLETE`,
          `params.missing_prerequisites` nommant chaque prérequis manquant, une valeur de
          `ReferenceReadiness.missing` chacun, dans son ordre. Ou un code projet déjà employé (WF-PRJ-0010) :
          `ALREADY_EXISTS`, `fields` désignant `/code` par `ALREADY_EXISTS`,
          `fields[].params.conflicting_object_id` le projet qui le porte et
          `fields[].params.conflicting_object_label` son libellé, que le formulaire dit au champ.
          Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              reference_incomplete: { $ref: ../../../fixtures/api/project_reference_incomplete.json }
              code_taken: { $ref: ../../../fixtures/api/project_code_taken.json }
              without_provision: { $ref: ../../../fixtures/api/project_reference_without_provision.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant chaque champ : `/label` vide, `VALUE_REQUIRED`
          (WF-PRJ-0080), ou plus long que le schéma ne l'admet, `VALUE_TOO_LONG` ; `/client` vide,
          `VALUE_REQUIRED`, ou plus long que le schéma ne l'admet, `VALUE_TOO_LONG` (WF-PRJ-0080) ;
          `/code` vide, `VALUE_REQUIRED`, fait seulement de blancs, `VALIDATION_FAILED`, portant une
          barre oblique, `PROJECT_CODE_INVALID`, ou plus long que le schéma ne l'admet,
          `VALUE_TOO_LONG` (`ProjectCode`, WF-PRJ-0010, WF-CRE-0020).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              refused: { $ref: ../../../fixtures/api/project_creation_refused.json }
              code_invalid: { $ref: ../../../fixtures/api/project_code_invalid.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}:
  get:
    operationId: getProject
    summary: Un projet
    description: >-
      Attributs du projet, son code et son état de cycle de vie (WF-PRJ-0080, WF-PRJ-0010,
      WF-CYC-0010).
    tags: [projects]
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: Projet, y compris dans un état terminal où il reste consultable (WF-CYC-0110).
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Project }
            examples:
              witness: { $ref: ../../../fixtures/api/project.json }
              pricing: { $ref: ../../../fixtures/api/project_pricing.json }
              without_current_revision: { $ref: ../../../fixtures/api/project_without_current_revision.json }
              pricing_estimator: { $ref: ../../../fixtures/api/project_pricing_estimator.json }
              reader: { $ref: ../../../fixtures/api/project_reader.json }
              created: { $ref: ../../../fixtures/api/project_created.json }
              completed: { $ref: ../../../fixtures/api/project_completed.json }
              revision_opened: { $ref: ../../../fixtures/api/project_revision_opened.json }
              actual_cost_mapping_incomplete: { $ref: ../../../fixtures/api/project_actual_cost_mapping_incomplete.json }
              participant: { $ref: ../../../fixtures/api/project_participant.json }
              rescue: { $ref: ../../../fixtures/api/project_rescue.json }
              background_task_running: { $ref: ../../../fixtures/api/project_background_task_running.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  patch:
    operationId: updateProject
    tags: [projects]
    summary: Modifier les paramètres d'un projet
    description: >-
      Réservé aux chefs de projet (WF-PRJ-0060, WF-ADM-0110) et refusé sur un projet
      terminal (WF-CYC-0100), comme la commande `update` du projet le dit d'avance. Le nom du
      client s'y saisit et s'y efface à tout moment, aucune transition ne l'exigeant
      (WF-PRJ-0080). La probabilité de gain n'est plus modifiable à partir de En cours (WF-PRJ-0090) : la commande
      `update_win_probability` le dit d'avance, et la valeur envoyée malgré elle est refusée par 409
      `STATE_FORBIDS_OPERATION`, `params.missing_condition` à `project_before_in_progress` ; le
      taux d'inflation l'est à tout moment et n'affecte aucune révision marquée (WF-PRJ-0040).
      L'un et l'autre sont des rapports de `0` à `1`, hors desquels la valeur est refusée par champ
      (422, `VALUE_OUT_OF_RANGE`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/ProjectUpdate }
    responses:
      '200':
        description: Projet modifié.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Project }
            examples:
              updated: { $ref: ../../../fixtures/api/project_updated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403':
        description: >-
          Une qualité manquante, la commande `update` la disant d'avance : `NOT_PROJECT_MANAGER`,
          `params.missing_condition` à `is_project_manager`, à qui n'est que contributeur du projet
          — le paramétrage est réservé aux chefs de projet (WF-PRJ-0060, WF-ADM-0110) — ;
          `NOT_CONTRIBUTOR`, `is_contributor`, à qui ne l'est pas ; ou une permission manquante,
          comme la réponse commune `Forbidden` le dit. Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              not_manager: { $ref: ../../../fixtures/api/project_update_not_manager.json }
              not_contributor: { $ref: ../../../fixtures/api/project_update_not_contributor.json }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Un code déjà employé par un autre projet (WF-PRJ-0010) : `ALREADY_EXISTS`, `fields`
          désignant `/code` par `ALREADY_EXISTS`, `fields[].params.conflicting_object_id` le projet
          qui le porte et `fields[].params.conflicting_object_label` son libellé, que le formulaire
          dit au champ ; ou une commande indisponible, `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` la nommant : `project_before_in_progress` pour
          `/win_probability` envoyée à un projet qui a atteint En cours, figée comme sa commande
          `update_win_probability` le disait d'avance (WF-PRJ-0090, WF-IHM-0090) ;
          `project_not_terminal` sur un projet terminal (WF-CYC-0100). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              code_taken: { $ref: ../../../fixtures/api/project_code_taken.json }
              win_probability_frozen: { $ref: ../../../fixtures/api/project_win_probability_frozen.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant chaque champ : `/win_probability` ou
          `/inflation_rate` hors de `0` à `1`, `VALUE_OUT_OF_RANGE`, `fields[].params.minimum` ou
          `fields[].params.maximum` la borne franchie (WF-PRJ-0040, WF-PRJ-0090) ; `/label` ou
          `/client` vides, `VALUE_REQUIRED`, ou plus longs que le schéma ne l'admet,
          `VALUE_TOO_LONG` (WF-PRJ-0080) ; `/code` refusé comme à la création (`ProjectCode`,
          WF-PRJ-0010, WF-CRE-0020). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              rates_out_of_range: { $ref: ../../../fixtures/api/project_rates_out_of_range.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/state-transitions:
  get:
    operationId: listProjectStateTransitions
    tags: [projects]
    summary: Historique daté des états
    description: >-
      Chaque transition est datée du jour où elle s'est produite, porte son auteur et,
      pour une sortie manuelle, le motif donné à sa confirmation ; rien n'y est
      modifiable (WF-CYC-0130, WF-CYC-0090). C'est d'elle que dépendent les statistiques
      de portefeuille par période (WF-PTF-0050).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: Transitions, de la création à l'état courant.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/projects.yaml#/StateTransition }
            examples:
              witness: { $ref: ../../../fixtures/api/state_transitions.json }
              exited: { $ref: ../../../fixtures/api/state_transitions_exited.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/next-state:
  get:
    operationId: getProjectNextState
    tags: [projects]
    summary: Prochain état, déclencheur et conditions restantes
    description: >-
      Consultable à tout moment avant En cours, sans avoir tenté d'action
      (WF-CYC-0050) : le prochain état, le fait qui y mène (`LifecycleTrigger`) et, une par une,
      les conditions qui restent — vers En cours, `project_code_set` et
      `reference_revision_designated`, dans l'ordre de l'énumération (`CommandCondition`), le code
      projet étant exigé pour le passage (WF-CYC-0030, WF-PRJ-0010). Les transitions vers Chiffrage et En cours ne sont jamais des
      commandes (WF-CYC-0020). D'un projet en cours ou dans un état terminal, l'opération répond
      200 : le prochain état et le déclencheur nuls, aucune condition — aucun fait ne le mène plus
      loin, et les sorties du cycle de vie sont des commandes du projet (WF-CYC-0060).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: >-
          Prochain état et ce qui manque pour l'atteindre ; nul, sans condition, pour un projet en
          cours ou clos.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/NextState }
            examples:
              witness: { $ref: ../../../fixtures/api/next_state.json }
              pricing: { $ref: ../../../fixtures/api/next_state_pricing.json }
              created: { $ref: ../../../fixtures/api/next_state_created.json }
              completed: { $ref: ../../../fixtures/api/next_state_completed.json }
              pricing_without_code: { $ref: ../../../fixtures/api/next_state_pricing_without_code.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/exit:
  post:
    operationId: exitProject
    tags: [projects]
    summary: Sortie manuelle du cycle de vie
    description: >-
      Les trois seules transitions commandées : Terminé depuis En cours, Perdu depuis
      Chiffrage, Abandonné depuis tout état non terminal (WF-CYC-0060). Irréversible
      (WF-CYC-0080), appliquée après une confirmation qui énonce ce qu'elle rend non
      modifiable et propose un motif, que la transition conserve (WF-CYC-0090,
      WF-CYC-0130), réservée aux chefs de projet (WF-PRJ-0060), et inscrite au journal
      d'audit (WF-SEC-0030). Lorsque le projet porte une révision en cours, la sortie reçoit son
      sort, la marquer avec un nom de version ou l'abandonner, et n'est appliquée qu'avec lui, dans
      la même opération (WF-CYC-0090, `ProjectExit.current_revision`) : abandonner, ou sortir un
      projet sans révision en cours, s'applique dans la requête, qui rend 200 et le projet ;
      marquer se confie au worker, qui calcule les indicateurs de la révision (WF-REV-0020,
      WF-ARC-0090), et la requête rend 202 et la tâche de fond, `revision_mark`. La sortie
      s'applique quand la tâche réussit, sous la même corrélation que le marquage : le projet
      passe à l'état visé, sans révision en cours, la révision marquée sous le nom donné ; une
      tâche qui échoue n'applique rien, et le projet garde son état et sa révision en cours.
      Pendant ce marquage, les trois sorties nomment `no_background_task_running`
      (`ProjectCommand`). Une sortie qui abandonne inscrit l'abandon de la révision et la sortie,
      sous une corrélation (`audit_events_exited`) ; une sortie qui marque, le marquage et la
      sortie. Après la sortie, le projet n'a plus de révision en cours, et ses indicateurs se
      lisent dans sa dernière révision marquée (WF-CYC-0090, WF-IND-0010). Une écriture du projet
      comme les autres, elle porte son compteur lu (`ProjectExit.lock_version`, WF-IHM-0110) :
      deux chefs de projet qui sortent le même projet ne sortent pas l'un sur l'autre.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/ProjectExit }
          examples:
            abandoning: { $ref: ../../../fixtures/api/project_exit_abandoning.json }
            marking: { $ref: ../../../fixtures/api/project_exit_marking.json }
    responses:
      '200':
        description: >-
          Sortie appliquée, la révision en cours abandonnée s'il en portait une ; le projet passe
          en lecture seule (WF-CYC-0100), sans révision en cours (WF-CYC-0090).
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Project }
            examples:
              completed: { $ref: ../../../fixtures/api/project_completed.json }
      '202':
        description: >-
          Sortie qui marque la révision en cours : le marquage mis en file, la transition appliquée
          quand il réussit (WF-CYC-0090, WF-ARC-0090).
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              marking: { $ref: ../../../fixtures/api/task_exit_mark_queued.json }
      '400':
        description: >-
          Un corps illisible, `MALFORMED_REQUEST` ; ou une sortie sans sa confirmation,
          `confirmed` absent ou faux : `CONFIRMATION_REQUIRED`, sans paramètre, comme toute
          opération irréversible que sa confirmation garde (WF-CYC-0090, WF-CYC-0080 ;
          `startRestore`). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              unconfirmed: { $ref: ../../../fixtures/api/project_exit_unconfirmed.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La sortie demandée est indisponible : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` la première condition qui lui manque, dans l'ordre où la
          commande de la sortie (`complete`, `lose`, `abandon`) les nomme — `project_not_terminal`
          pour toute sortie d'un projet terminal, d'où aucune transition ne part (WF-CYC-0080),
          et où la commande n'est jamais listée : seul ce 409 la nomme ; puis
          `project_in_progress` pour `completed` avant En cours, `project_in_pricing`
          pour `lost` hors de Chiffrage, Créé comme En cours
          (WF-CYC-0060) ; puis `no_background_task_running` pendant un traitement de fond qui
          écrit dans la révision en cours ou la fige. Ou un nom de version déjà employé par une
          révision marquée du projet, comme pour `markRevision` : `ALREADY_EXISTS`, `fields`
          désignant `/current_revision/version_name` par `ALREADY_EXISTS`,
          `fields[].params.conflicting_object_id` la révision qui le porte (WF-REV-0020). Rien
          n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              terminal: { $ref: ../../../fixtures/api/project_exit_terminal.json }
              lost_in_progress: { $ref: ../../../fixtures/api/project_exit_lost_in_progress.json }
              version_name_taken: { $ref: ../../../fixtures/api/project_exit_version_name_taken.json }
      '412':
        description: >-
          `STALE_LOCK_VERSION` : le projet a été écrit depuis sa lecture, et il ne sort pas ;
          `params.expected_lock_version` est son compteur courant (WF-IHM-0110, US-0702/L2).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/project_exit_stale.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant chaque champ : un projet qui porte une révision
          en cours, sans son sort, `/current_revision` par `VALUE_REQUIRED` — la sortie n'est
          appliquée qu'avec ce choix (WF-CYC-0090) — ; un marquage sans nom de version,
          `/current_revision/version_name` par `VALUE_REQUIRED` (WF-REV-0020). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_required: { $ref: ../../../fixtures/api/project_exit_revision_required.json }
              version_name_required: { $ref: ../../../fixtures/api/project_exit_version_name_required.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/work-breakdown:
  get:
    operationId: getWorkBreakdown
    tags: [projects]
    summary: Lotissement
    description: >-
      Des lots, qui contiennent des postes, qui contiennent des livrables (WF-PRJ-0020) ; en
      l'absence de saisie, un lot comprenant un poste sans livrable, qui portent le libellé du
      projet. Chaque lot et chaque poste disent la tâche de la révision en cours qui les porte
      (`attached_task`, WF-PLA-0170). Une
      grille arborescente, dans l'ordre saisi, qui ne se trie pas (WF-IHM-0060) et se filtre
      sur ses deux colonnes (WF-IHM-0130) : le libellé par la recherche (`search`), la nature
      — lot, poste, livrable — par `kinds`. Les filtres se combinent ; un élément est retenu
      s'il les satisfait tous, et les lots et les postes qui contiennent un élément retenu
      sont rendus pour que l'arbre reste lisible (WF-IHM-0060), sans les autres éléments
      qu'ils contiennent ; chaque élément rendu dit s'il est retenu ou rendu pour le contexte
      (`is_match`), et la grille ne compte que les retenus : « le filtre s'applique aux totaux
      qu'elle présente » (WF-IHM-0130, #574). Une lecture filtrée rend un compteur nul :
      `setWorkBreakdown` écrit le lotissement entier, et un renvoi tel quel, qui supprimerait ce
      qu'elle omet, est refusé par 422 (`WorkBreakdownReading`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: search
        in: query
        description: >-
          Recherche sur le libellé des lots, des postes et des livrables — le seul texte que
          chacun porte (WF-PRJ-0020) —, comparé comme toute recherche du contrat (README,
          « Une recherche… » ; WF-IHM-0130). Un élément dont
          le libellé contient le texte est retenu, non ce qu'il contient.
        schema: { type: string, minLength: 1, maxLength: 200 }
      - name: kinds
        in: query
        description: >-
          Restreint aux éléments de ces natures, la colonne de la nature filtrée (WF-IHM-0130) :
          `kinds=deliverable`, les livrables, sous leurs postes et leurs lots.
        schema:
          type: array
          items: { $ref: ../components/schemas/projects.yaml#/WorkBreakdownKind }
        explode: false
    responses:
      '200':
        description: Lotissement du projet, ou ce que les filtres en retiennent.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/WorkBreakdownReading }
            examples:
              witness: { $ref: ../../../fixtures/api/work_breakdown.json }
              default: { $ref: ../../../fixtures/api/work_breakdown_default.json }
              search: { $ref: ../../../fixtures/api/work_breakdown_search.json }
              order_items: { $ref: ../../../fixtures/api/work_breakdown_order_items.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  put:
    operationId: setWorkBreakdown
    tags: [projects]
    summary: Saisir le lotissement
    description: >-
      Saisit le lotissement entier, qui reproduit le bon de commande : ses lots, leurs postes, leurs
      livrables (WF-PRJ-0020), au moins un lot. Un lot ou un poste que la saisie omet est supprimé : les tâches de la révision en cours qui le
      portaient restent et perdent leur rattachement ; les révisions marquées le conservent, et
      le lot ou le poste est alors marqué supprimé (WF-PLA-0170, WF-DAT-0080) ; « la
      suppression d'un lot emporte ses postes » (WF-DAT-0080), un livrable omis se supprime
      physiquement. Un poste que la saisie range sous un autre lot n'est jamais refusé : « Le
      déplacement d'un poste sous un autre lot retire de même le rattachement de sa tâche
      lorsqu'elle n'est pas dans le sous-arbre de la tâche de ce lot » (WF-PLA-0170) — le poste
      et son nouveau lot tous deux portés, la tâche du poste hors du sous-arbre de celle du lot
      dans la révision en cours, la saisie aboutit et cette tâche ne porte plus le poste. Les
      révisions marquées le conservent, leurs tâches ne se déplaçant plus ; la réponse ne nomme
      pas la tâche qui perd son poste, mais le poste rendu ne la dit plus (`attached_task`), et
      la grille de planning relue la montre sans rattachement. Ce que la saisie avance (WF-IHM-0110) : le
      compteur du lotissement, toujours ; et, quand elle retire le rattachement de tâches de la
      révision en cours, le compteur de chacune de ces tâches (`Node.lock_version`) et celui de
      la structure principale (`CostStructure.lock_version`), comme une écriture de grille — une
      cellule ou un collage lus avant elle sont refusés par 412 ; un lotissement saisi sans
      retirer aucun rattachement n'avance que le sien. Elle est indisponible pendant un
      traitement de fond qui écrit dans la révision en cours ou la fige — marquage, fusion,
      survenance, application d'un import —, ce que la commande `update_work_breakdown` du
      projet dit d'avance (`no_background_task_running`, WF-IHM-0080, WF-IHM-0090 ;
      EP-14/L42s).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/WorkBreakdown }
          examples:
            entered: { $ref: ../../../fixtures/api/work_breakdown_entered.json }
    responses:
      '200':
        description: >-
          Lotissement enregistré, rendu lu entier dans l'ordre saisi, chaque élément retenu, les
          éléments nouveaux avec l'identifiant que le serveur leur a donné, et son compteur
          suivant, jamais nul ; il ne crée aucun lien durable avec le planning (WF-PRJ-0030).
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/WorkBreakdownReading }
            examples:
              saved: { $ref: ../../../fixtures/api/work_breakdown_saved.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Une condition que la commande `update_work_breakdown` dit manquante :
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` la première qui manque, dans
          l'ordre où la commande les liste — `project_not_terminal` sur un projet terminal, dont
          le paramétrage ne se modifie plus et qui ne la liste plus (WF-CYC-0100), comme
          `updateProject` le refuse, puis
          `no_background_task_running` tant qu'un traitement de fond écrit dans la révision en
          cours ou la fige — marquage, fusion, survenance, application d'un import —, la saisie,
          qui en retirerait des rattachements, attendant qu'il finisse (WF-IHM-0080, WF-IHM-0090 ;
          EP-14/L42s). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              background_task: { $ref: ../../../fixtures/api/work_breakdown_background_task.json }
      '412':
        description: >-
          Le compteur envoyé n'est plus celui du lotissement : une autre saisie l'a avancé depuis
          la lecture. `STALE_LOCK_VERSION`, `params.expected_lock_version` le compteur courant ;
          rien n'est écrit (WF-IHM-0110).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/work_breakdown_stale.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant chaque champ refusé : un compteur nul, celui
          d'une lecture filtrée (`WorkBreakdownReading`), `/lock_version` par `VALUE_REQUIRED` ;
          aucun lot, `/work_packages` par `VALUE_REQUIRED` (WF-PRJ-0020) ; un libellé vide ou trop long, `VALUE_REQUIRED` ou `VALUE_TOO_LONG` sur
          `/work_packages/<i>/label`, `/work_packages/<i>/order_items/<j>/label` ou
          `/work_packages/<i>/order_items/<j>/deliverables/<k>/label` (WF-PRJ-0020) ; un
          identifiant que le lotissement lu n'a pas sous la nature de son élément,
          `UNKNOWN_WORK_BREAKDOWN_ITEM` sur cet identifiant — `/work_packages/<i>/work_package_id`,
          `/work_packages/<i>/order_items/<j>/order_item_id` ou
          `/work_packages/<i>/order_items/<j>/deliverables/<k>/deliverable_id` ; un identifiant
          que la saisie porte déjà, chaque occurrence après la première,
          `DUPLICATE_WORK_BREAKDOWN_ITEM` sur le même champ. Un poste rangé sous un autre lot
          n'est pas un refus : il retire le rattachement de sa tâche (WF-PLA-0170).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              label_required: { $ref: ../../../fixtures/api/work_breakdown_label_required.json }
              unknown_item: { $ref: ../../../fixtures/api/work_breakdown_unknown_item.json }
              duplicate_item: { $ref: ../../../fixtures/api/work_breakdown_duplicate_item.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/subprojects:
  get:
    operationId: listSubprojects
    tags: [projects]
    summary: Sous-projets
    description: >-
      Les sous-projets, codes de l'ERP sous lesquels les lignes de devis se ventilent et les coûts
      réels s'imputent — jamais une tâche (WF-PRJ-0050, §3.2.3) —, chacun avec ses commandes (`Subproject.available_commands`, WF-IHM-0090). Une
      table plate, triée et filtrée par le serveur sur chacune de ses colonnes (WF-IHM-0060,
      WF-IHM-0130) : la recherche porte sur le code et le libellé, la colonne des coûts réels
      se filtre par `has_actual_costs`. Sans pagination : le §4.6.2 compte dix sous-projets
      par projet.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: search
        in: query
        description: >-
          Recherche sur le code et le libellé, comparés comme toute recherche du contrat
          (README, « Une recherche… » ; WF-IHM-0130).
        schema: { type: string, minLength: 1, maxLength: 200 }
      - name: has_actual_costs
        in: query
        description: >-
          Vrai, les seuls sous-projets auxquels des coûts réels sont imputés, qui ne se
          suppriment plus ; faux, les autres (WF-PRJ-0050, WF-IHM-0130).
        schema: { type: boolean }
      - name: sort_by
        in: query
        description: >-
          Colonne du tri ; absente, le code. Le code et le libellé se comparent dans l'ordre des
          points de code Unicode ; la colonne des coûts réels range les sous-projets qui en
          portent avant les autres dans l'ordre croissant, comme l'état des comptes range les
          actifs. À égalité, l'ordre de la liste sans tri, puis l'identifiant (WF-IHM-0060).
        schema:
          type: string
          enum: [code, label, has_actual_costs]
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Sous-projets, identifiés par leur code ERP (WF-PRJ-0050).
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/projects.yaml#/Subproject }
            examples:
              witness: { $ref: ../../../fixtures/api/subprojects.json }
              by_label: { $ref: ../../../fixtures/api/subprojects_by_label.json }
              with_actual_costs: { $ref: ../../../fixtures/api/subprojects_with_actual_costs.json }
              completed: { $ref: ../../../fixtures/api/subprojects_completed.json }
              estimated: { $ref: ../../../fixtures/api/subprojects_estimated.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createSubproject
    summary: Créer un sous-projet
    description: >-
      Un sous-projet du projet courant (WF-PRJ-0050), par la commande `update` du projet, réservée
      à ses chefs de projet (WF-PRJ-0060). Les lignes de coût réel qui portaient déjà son code lui
      sont imputées aussitôt (WF-CRE-0020) : la réponse le dit (`has_actual_costs`).
    tags: [projects]
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/SubprojectWrite }
    responses:
      '201':
        description: Sous-projet créé.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Subproject }
            examples:
              created: { $ref: ../../../fixtures/api/subproject_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Code déjà employé dans ce projet (WF-PRJ-0050) : `ALREADY_EXISTS`, `fields` désignant
          `/code` par `ALREADY_EXISTS`, `fields[].params.conflicting_object_id` le sous-projet qui le
          porte et `fields[].params.conflicting_object_label` son libellé, que le formulaire dit au
          champ ; ou un projet terminal (WF-CYC-0100), `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` à `project_not_terminal`. Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              code_taken: { $ref: ../../../fixtures/api/subproject_code_taken.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant chaque champ : `/code` ou `/label` vides,
          `VALUE_REQUIRED`, ou plus longs que le schéma ne l'admet, `VALUE_TOO_LONG` —
          `fields[].params.max_length` à `31` pour `/code` — ; `/code` portant un caractère
          interdit ou valant un nom réservé, sans égard à la casse, `SUBPROJECT_CODE_INVALID`,
          `fields[].params.forbidden_characters` ou `fields[].params.reserved_name` le nommant :
          le code nomme l'onglet du sous-projet dans le fichier de reste à engager
          (`DeclaredSubprojectCode`, WF-PRJ-0050). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              code_invalid: { $ref: ../../../fixtures/api/subproject_code_invalid.json }
              code_reserved: { $ref: ../../../fixtures/api/subproject_code_reserved.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/subprojects/{subproject_id}:
  patch:
    operationId: updateSubproject
    summary: Modifier un sous-projet
    description: >-
      Un sous-projet du projet courant (WF-PRJ-0050), comme sa commande `update` le dit
      (`Subproject.available_commands`) : son code et son libellé, à tout moment, coûts réels
      imputés ou non.
    tags: [projects]
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/SubprojectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/SubprojectUpdate }
    responses:
      '200':
        description: Sous-projet modifié.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Subproject }
            examples:
              updated: { $ref: ../../../fixtures/api/subproject_updated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Code déjà employé par un autre sous-projet du projet (WF-PRJ-0050) : `ALREADY_EXISTS`,
          `fields` désignant `/code` par `ALREADY_EXISTS`, `fields[].params.conflicting_object_id`
          le sous-projet qui le porte et `fields[].params.conflicting_object_label` son libellé, que
          le formulaire dit au champ ; ou un projet terminal (WF-CYC-0100), `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` à `project_not_terminal`. Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              code_taken: { $ref: ../../../fixtures/api/subproject_code_taken.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant chaque champ : `/code` ou `/label` vides,
          `VALUE_REQUIRED`, ou plus longs que le schéma ne l'admet, `VALUE_TOO_LONG` —
          `fields[].params.max_length` à `31` pour `/code` — ; `/code` portant un caractère
          interdit ou valant un nom réservé, sans égard à la casse, `SUBPROJECT_CODE_INVALID`,
          `fields[].params.forbidden_characters` ou `fields[].params.reserved_name` le nommant :
          le code nomme l'onglet du sous-projet dans le fichier de reste à engager
          (`DeclaredSubprojectCode`, WF-PRJ-0050). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              code_invalid: { $ref: ../../../fixtures/api/subproject_code_invalid.json }
              code_reserved: { $ref: ../../../fixtures/api/subproject_code_reserved.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  delete:
    operationId: deleteSubproject
    tags: [projects]
    summary: Supprimer un sous-projet
    description: >-
      Refusée dès qu'une révision marquée le cite (§4.4.1, WF-DAT-0080), qu'un coût réel lui est
      imputé (WF-PRJ-0050), ou tant que des lignes de devis de la révision en cours le portent
      (WF-DAT-0080, WF-PRJ-0050 ; EP-14/L42q, C-273), ce que sa commande `delete` dit d'avance
      (`Subproject.available_commands`, WF-IHM-0090) ; réservée aux chefs de projet
      (WF-PRJ-0060). Un sous-projet qu'une révision marquée cite ne se supprime pas : les
      sous-projets déterminent la courbe de la valeur acquise, et sa suppression y aurait des
      effets que rien ne maîtrise. Un sous-projet que portent des lignes de devis de la révision en
      cours ne se supprime qu'une fois ces lignes passées hors sous-projet ou à un autre : ses codes
      viennent de l'ERP et définissent la granularité des coûts réels ; une ligne de provision se
      passe par son risque (`updateRisk`, `provision_subproject_id`). Un sous-projet qu'aucune
      révision marquée ne cite, qu'aucun coût réel ne charge et qu'aucune ligne de la révision en
      cours ne porte est retiré de la base. Sa suppression passe à nul la désignation de tout
      risque qui n'est pas identifié et le désignait pour sa provision
      (`Risk.provision_subproject_id`) : redevenu identifié, ce risque porte sa provision hors
      sous-projet (WF-RIS-0010 ; EP-14/L42p ; tranché par l'auteur le 2026-10-10, décision de
      l'auteur, #732). Chaque risque touché voit son `lock_version` avancer et son audit nommer
      l'auteur de la suppression (`updated_by`, `updated_at`, WF-DAT-0070, WF-IHM-0110).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/SubprojectId
      - name: lock_version
        in: query
        required: true
        description: >-
          Le compteur du sous-projet supprimé, tel que l'écran l'a lu (`Subproject.lock_version`) :
          périmé, la suppression est refusée par 412 et rien n'est supprimé (WF-IHM-0110 ;
          décision de l'auteur du 2026-10-28, US-0702/L2).
        schema: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '204':
        description: Sous-projet supprimé, retiré de la base (WF-DAT-0080).
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La commande `delete` est indisponible : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` nommant la condition qui lui manque — `subproject_not_cited`
          pour un sous-projet qu'une révision marquée cite (§4.4.1, WF-DAT-0080),
          `subproject_without_actual_costs` pour un sous-projet auquel des coûts réels sont imputés
          (WF-PRJ-0050), `subproject_without_estimate_lines` pour un sous-projet que portent des
          lignes de devis de la révision en cours (WF-DAT-0080, WF-PRJ-0050),
          `project_not_terminal` sur un projet clos (WF-CYC-0100). Une seule est nommée, la
          première qui manque dans l'ordre où la commande `delete` les liste :
          `subproject_not_cited`, puis `subproject_without_actual_costs` — la citation ne se lève
          jamais, une révision marquée étant immuable (WF-DAT-0020) —, puis
          `subproject_without_estimate_lines`, que lève le passage de ces lignes hors sous-projet
          ou à un autre, puis `project_not_terminal`. Nommant
          `subproject_without_estimate_lines`, le refus nomme aussi ces lignes (Vérif de
          WF-DAT-0080) : `params.estimate_lines`, toutes, chacune par sa structure, le libellé de
          celle-ci, son nœud, son numéro de ligne dans sa structure entière et son libellé
          (`structure_id`, `structure_label`, `node_id`, `row_number`, `label`) — deux lignes de
          deux structures peuvent porter le même numéro, et le libellé de la structure les
          distingue sans que l'écran lise `listCostStructures` (#764) —, la structure principale
          d'abord, puis les autres dans l'ordre de `listCostStructures`, chacune dans l'ordre du
          plan. La liste n'a pas de borne : un
          sous-projet en porte au plus les lignes d'une révision, quelques milliers au §4.6.2, et
          l'utilisateur doit pouvoir toutes les déplacer. Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              cited: { $ref: ../../../fixtures/api/subproject_delete_cited.json }
              refused: { $ref: ../../../fixtures/api/subproject_delete_refused.json }
              estimated: { $ref: ../../../fixtures/api/subproject_delete_estimated.json }
      '412':
        description: >-
          `STALE_LOCK_VERSION` : le sous-projet a été écrit depuis sa lecture, et rien n'est
          supprimé ; `params.expected_lock_version` est son compteur courant (WF-IHM-0110,
          US-0702/L2).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/subproject_delete_stale.json }
      '422': { $ref: ../components/responses.yaml#/LockVersionInvalid }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/contributors:
  get:
    operationId: listContributors
    tags: [projects]
    summary: Contributeurs du projet
    description: >-
      Chacun avec sa qualité, chef de projet ou contributeur ; la liste d'un projet
      nouvellement créé comporte son créateur, chef de projet (WF-PRJ-0060). La liste porte
      son propre compteur d'écriture, que `setContributors` exige (WF-IHM-0110).
      Une table plate, triée et filtrée par le serveur sur chacune de ses colonnes
      (WF-IHM-0060, WF-IHM-0130) : la recherche porte sur le nom du compte, la qualité se
      filtre par `kinds`, l'état du compte par `is_active` — un compte désactivé depuis
      l'inscription reste listé et signalé (WF-ADM-0060). Sans pagination : le §4.6.2
      compte cinquante contributeurs par projet. Le compteur est celui de toute la liste,
      quel que soit le tri ; une lecture filtrée le rend nul, pour qu'elle ne soit pas
      renvoyée à `setContributors`, qui écrit la liste entière et retirerait ce qu'elle omet
      (`ContributorList.lock_version`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: search
        in: query
        description: >-
          Recherche sur le nom affiché du compte (`display_name`), la seule colonne de texte de
          la liste, comparé comme toute recherche du contrat (README, « Une recherche… » ;
          WF-IHM-0130).
        schema: { type: string, minLength: 1, maxLength: 200 }
      - name: kinds
        in: query
        description: Restreint aux contributeurs de ces qualités (WF-IHM-0130).
        schema:
          type: array
          items: { $ref: ../components/schemas/projects.yaml#/ContributorKind }
        explode: false
      - name: is_active
        in: query
        description: >-
          Vrai, les seuls contributeurs dont le compte est actif ; faux, ceux dont le compte a
          été désactivé depuis leur inscription, que la liste garde (WF-ADM-0060, WF-IHM-0130).
        schema: { type: boolean }
      - name: sort_by
        in: query
        description: >-
          Colonne du tri ; absente, les chefs de projet d'abord, puis le nom de famille et le
          prénom du compte, comme les comptes (`listUsers`). Le nom affiché se compare dans
          l'ordre des points de code Unicode ; un compte anonymisé, qui n'a plus ni nom ni nom
          affiché (`Contributor.display_name` nul), vient après les noms dans l'ordre croissant —
          sans tri, après les autres comptes de sa qualité (WF-ADM-0060, #870) ; la qualité,
          dans l'ordre de `ContributorKind`, les chefs de projet d'abord dans l'ordre croissant ;
          l'état du compte, les actifs avant les désactivés dans l'ordre croissant. À égalité,
          l'ordre de la liste sans tri, puis l'identifiant du compte (WF-IHM-0060).
        schema:
          type: string
          enum: [display_name, kind, is_active]
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Contributeurs, et le compteur de la liste.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/ContributorList }
            examples:
              witness: { $ref: ../../../fixtures/api/contributors.json }
              by_name: { $ref: ../../../fixtures/api/contributors_by_name.json }
              search: { $ref: ../../../fixtures/api/contributors_search.json }
              inactive: { $ref: ../../../fixtures/api/contributors_inactive.json }
              anonymized: { $ref: ../../../fixtures/api/contributors_anonymized.json }
              without_active_manager: { $ref: ../../../fixtures/api/contributors_without_active_manager.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  put:
    operationId: setContributors
    tags: [projects]
    summary: Inscrire ou retirer des contributeurs
    description: >-
      La liste, chacun avec sa qualité, vaut habilitation à consulter et à saisir sur le
      projet ; réservée aux chefs de projet (WF-PRJ-0060, WF-ADM-0110). Toutefois, quand aucun chef
      de projet du projet n'a de compte actif (WF-ADM-0060), l'appelant qui porte la permission du
      paramétrage du projet (`project_settings.write`, FBS-4.2) et « consulter tous les projets »
      (`all_projects_read`) l'écrit sans être contributeur, pour y inscrire un chef de projet : la
      seule saisie ouverte à un non-contributeur (WF-PRJ-0060), que la commande
      `manage_contributors` lui dit d'avance (`project_rescue`). Il lit la liste et son compteur
      par `listContributors`, que « consulter tous les projets » lui ouvre
      (`contributors_without_active_manager`) ; la liste qu'il envoie porte un chef de projet au
      compte actif, nouveau ou passé de participant, sinon elle est refusée par 409
      `LAST_PROJECT_MANAGER` ; toute autre saisie lui reste refusée, par 403 `NOT_CONTRIBUTOR`. Dès
      qu'un chef de projet actif est inscrit, la liste redevient celle de ses seuls chefs de
      projet. Une liste qui ne
      garderait aucun chef de projet est refusée (409, `LAST_PROJECT_MANAGER`) ; un compte que
      l'installation n'a pas, ou un compte désactivé inscrit ou changé de qualité, l'est par 422,
      `fields` désignant le compte à sa ligne (`/contributors/<n>/user_id`) par `UNKNOWN_USER` ou
      `USER_INACTIVE` — un contributeur désactivé depuis son inscription reste dans la liste, tel
      qu'il a été lu (WF-ADM-0060). Porte le compteur de la liste
      lue, refusé par 412 s'il est périmé (WF-IHM-0110), et rend la liste avec le suivant ;
      un compteur nul, celui d'une lecture filtrée, est refusé par 422, `fields` désignant
      `/lock_version` par `VALUE_REQUIRED`.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/ContributorsWrite }
    responses:
      '200':
        description: >-
          Liste enregistrée. Une écriture rend toujours la liste entière avec son compteur
          suivant, jamais nul : `ContributorList` n'admet un compteur nul que pour une lecture
          filtrée (WF-IHM-0110).
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/ContributorList }
            examples:
              set: { $ref: ../../../fixtures/api/contributors_set.json }
              set_by_rescuer: { $ref: ../../../fixtures/api/contributors_set_by_rescuer.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La liste ne garderait aucun chef de projet (`LAST_PROJECT_MANAGER`, sans paramètre,
          WF-PRJ-0060), ou, écrite par un non-contributeur, aucun chef de projet au compte actif ; ou un projet terminal (WF-CYC-0100), `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` à `project_not_terminal`. Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              without_manager: { $ref: ../../../fixtures/api/contributors_without_manager_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant chaque refus : un compte que l'installation n'a
          pas, `/contributors/<n>/user_id` par `UNKNOWN_USER` ; un compte désactivé inscrit ou
          changé de qualité, `/contributors/<n>/user_id` par `USER_INACTIVE` (WF-ADM-0060) ; un
          compteur nul, celui d'une lecture filtrée, `/lock_version` par `VALUE_REQUIRED`
          (WF-IHM-0110). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              accounts_refused: { $ref: ../../../fixtures/api/contributors_accounts_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/contributors/suggestions:
  get:
    operationId: listContributorSuggestions
    tags: [projects]
    summary: Contributeurs proposés
    description: >-
      Les comptes actifs rattachés aux nœuds d'organisation des rôles de ressources employés par
      les lignes de devis du projet — celles de sa révision en cours, ou de sa dernière révision
      marquée quand il n'en a pas —, que la liste des contributeurs ne compte pas encore
      (WF-PRJ-0070, WF-ADM-0060) ; chacun nomme son nœud et les rôles qui le font proposer. Jamais
      inscrits sans confirmation : la liste s'écrit par `setContributors`.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: Propositions.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/projects.yaml#/ContributorSuggestion }
            examples:
              witness: { $ref: ../../../fixtures/api/contributor_suggestions.json }
              none: { $ref: ../../../fixtures/api/contributor_suggestions_empty.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/timelines:
  get:
    operationId: listTimelines
    tags: [planning]
    summary: Chronologies du projet
    description: Chronologies nommées, auxquelles des tâches sont inscrites (WF-PLA-0140).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: Chronologies.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/revisions.yaml#/Timeline }
            examples:
              witness: { $ref: ../../../fixtures/api/timelines.json }
              none: { $ref: ../../../fixtures/api/timelines_empty.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createTimeline
    summary: Créer une chronologie
    description: >-
      Une chronologie nommée, sans inscription, à laquelle les tâches et les jalons s'inscrivent
      ensuite depuis le planning (WF-PLA-0140, WF-PLA-0060). « Un projet peut porter plusieurs
      chronologies. Chacune porte un nom » : le nom n'est pas unique, et deux chronologies d'un
      projet peuvent le partager. Le projet dit d'avance si l'appelant peut en créer
      (`ProjectCommand.manage_timelines`) ; sur un projet terminal, elle est refusée par 409, comme
      toute écriture du projet (WF-CYC-0100).
    tags: [planning]
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/TimelineCreate }
    responses:
      '201':
        description: Chronologie créée.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/Timeline }
            examples:
              created: { $ref: ../../../fixtures/api/timeline_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Un projet terminal : `STATE_FORBIDS_OPERATION`, `params.missing_condition` à
          `project_not_terminal`, le projet ne listant plus `manage_timelines` (WF-CYC-0100) ; rien
          n'est créé.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              terminal: { $ref: ../../../fixtures/api/timeline_create_terminal.json }
      '422':
        description: >-
          Un nom vide, trop long ou fait seulement de blancs : `VALIDATION_FAILED`, `fields`
          désignant `/label` par `VALUE_REQUIRED`, `VALUE_TOO_LONG` ou, comme tout libellé,
          `VALIDATION_FAILED` (WF-PLA-0140).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              label_required: { $ref: ../../../fixtures/api/timeline_label_required.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/timelines/{timeline_id}:
  delete:
    operationId: deleteTimeline
    summary: Supprimer une chronologie
    description: >-
      Retire la chronologie ; les tâches conservent leurs dates courantes (WF-PLA-0140). « Un
      livrable ou une chronologie se supprime physiquement » (WF-DAT-0080) : aucune révision
      marquée ne la retient, ni ne la fait marquer supprimée, ses inscriptions partant avec elle.
      Le projet dit d'avance si l'appelant peut en supprimer (`ProjectCommand.manage_timelines`) ;
      sur un projet terminal, elle est refusée par 409, comme toute écriture du projet
      (WF-CYC-0100).
    tags: [planning]
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/TimelineId
    responses:
      '204':
        description: Chronologie supprimée ; les inscriptions le sont avec elle.
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Un projet terminal : `STATE_FORBIDS_OPERATION`, `params.missing_condition` à
          `project_not_terminal`, le projet ne listant plus `manage_timelines` (WF-CYC-0100) ; rien
          n'est supprimé. Aucune révision marquée ne retient une chronologie (WF-DAT-0080).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              terminal: { $ref: ../../../fixtures/api/timeline_delete_terminal.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
