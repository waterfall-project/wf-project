/projects:
  get:
    operationId: listProjects
    tags: [projects]
    summary: Projects
    description: >-
      The projects the caller can open, and only those: the ones they are a contributor of
      and, if they hold the "view every project" permission, all the others (WF-PRJ-0060,
      WF-ADM-0110) — the portfolio, for its part, counts every project of the scope
      (WF-PTF-0030). The `is_contributor` filter restricts the list to the projects the caller
      is a contributor of: this is the home page, a filter the user sees and lifts
      (WF-IHM-0120); lifted, the list shows only what they can open, and nothing else. Sorting
      and filters are done by the server, and `meta.total` counts the projects retained
      (WF-IHM-0130). The search (`search`) covers the label and the code of the project; the
      period (`from`, `to`), the instant of its last modification (`audit.updated_at`), the
      date column of the list, as in the audit log: two instants, the start included, the end
      excluded, which the screen derives from its reader's days.
      Every state that `states` names is retained, through a parameter specific to the list
      (`ProjectStates`, #1747); without `states`, only the in-progress projects: a home page that
      lists every project that can be opened names the six states, and the home page retains by
      default Created, Pricing and In progress, which it always sends. `meta.states` always
      states the states retained, named or by default, so that the screen shows the filter the
      server applied.
    parameters:
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/ProjectStates
      - name: is_contributor
        in: query
        description: True, only the projects the caller is a contributor of.
        schema: { type: boolean, default: false }
      - name: from
        in: query
        description: >-
          Start of the period, included: restricts to the projects whose last modification
          (`audit.updated_at`) is at or after this instant (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Timestamp }
      - name: to
        in: query
        description: >-
          End of the period, excluded: restricts to the projects modified before this instant
          (WF-IHM-0130). Earlier than `from`, it is refused with 422; equal, the period is
          empty.
        schema: { $ref: ../components/common.yaml#/Timestamp }
      - name: sort_by
        in: query
        description: >-
          Sort column; absent, the most recently modified projects first. The label and the
          code compare in Unicode code point order, a project without a code after the others
          in ascending order; the state, in the order of `ProjectState`, that of the lifecycle
          (WF-CYC-0010). On a tie, the order of the unsorted list, then the
          identifier.
        schema:
          type: string
          enum: [label, code, state, updated_at]
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Projects, and the states retained.
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/projects.yaml#/Project }
                meta: { $ref: ../components/schemas/projects.yaml#/ProjectListMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/projects.json }
              empty: { $ref: ../../../fixtures/api/projects_empty.json }
              default_states: { $ref: ../../../fixtures/api/projects_default_states.json }
              search_code: { $ref: ../../../fixtures/api/projects_search_code.json }
              period: { $ref: ../../../fixtures/api/projects_period.json }
              with_created: { $ref: ../../../fixtures/api/projects_with_created.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          `VALIDATION_FAILED`: a period whose end precedes its start, `fields[]` designating
          `/query/to` with `VALUE_OUT_OF_RANGE`, `params.minimum` the start given, the rule of
          every period of the contract; a malformed instant, `/query/from` or `/query/to` with
          `DATE_INVALID`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              period_inverted: { $ref: ../../../fixtures/api/projects_period_inverted.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createProject
    tags: [projects]
    summary: Create a project
    description: >-
      Refused as long as the minimal reference data is incomplete, and the refusal names each
      missing prerequisite (WF-CYC-0120) — among them, since EP-14/L42p, an active cost category
      of the risk provision type (#579). The creator is registered as project manager
      (WF-PRJ-0060). The project is born in the Created state (WF-CYC-0010).
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/ProjectCreate }
    responses:
      '201':
        description: Project created.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Project }
            examples:
              created: { $ref: ../../../fixtures/api/project_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '409':
        description: >-
          Minimal reference data incomplete (WF-CYC-0120): `REFERENCE_INCOMPLETE`,
          `params.missing_prerequisites` naming each missing prerequisite, one value of
          `ReferenceReadiness.missing` each, in its order. Or a project code already in use
          (WF-PRJ-0010): `ALREADY_EXISTS`, `fields` designating `/code` with `ALREADY_EXISTS`,
          `fields[].params.conflicting_object_id` the project that holds it and
          `fields[].params.conflicting_object_label` its label, which the form shows at the
          field. Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              reference_incomplete: { $ref: ../../../fixtures/api/project_reference_incomplete.json }
              code_taken: { $ref: ../../../fixtures/api/project_code_taken.json }
              without_provision: { $ref: ../../../fixtures/api/project_reference_without_provision.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` designating each field: `/label` empty, `VALUE_REQUIRED`
          (WF-PRJ-0080), or longer than the schema allows, `VALUE_TOO_LONG`; `/client` empty,
          `VALUE_REQUIRED`, or longer than the schema allows, `VALUE_TOO_LONG` (WF-PRJ-0080);
          `/code` empty, `VALUE_REQUIRED`, made only of whitespace, `VALIDATION_FAILED`,
          containing a slash, `PROJECT_CODE_INVALID`, or longer than the schema allows,
          `VALUE_TOO_LONG` (`ProjectCode`, WF-PRJ-0010, WF-CRE-0020).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              refused: { $ref: ../../../fixtures/api/project_creation_refused.json }
              code_invalid: { $ref: ../../../fixtures/api/project_code_invalid.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}:
  get:
    operationId: getProject
    summary: A project
    description: >-
      Attributes of the project, its code and its lifecycle state (WF-PRJ-0080, WF-PRJ-0010,
      WF-CYC-0010).
    tags: [projects]
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: Project, including in a terminal state where it remains viewable (WF-CYC-0110).
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Project }
            examples:
              witness: { $ref: ../../../fixtures/api/project.json }
              pricing: { $ref: ../../../fixtures/api/project_pricing.json }
              without_current_revision: { $ref: ../../../fixtures/api/project_without_current_revision.json }
              pricing_estimator: { $ref: ../../../fixtures/api/project_pricing_estimator.json }
              reader: { $ref: ../../../fixtures/api/project_reader.json }
              created: { $ref: ../../../fixtures/api/project_created.json }
              completed: { $ref: ../../../fixtures/api/project_completed.json }
              revision_opened: { $ref: ../../../fixtures/api/project_revision_opened.json }
              actual_cost_mapping_incomplete: { $ref: ../../../fixtures/api/project_actual_cost_mapping_incomplete.json }
              participant: { $ref: ../../../fixtures/api/project_participant.json }
              rescue: { $ref: ../../../fixtures/api/project_rescue.json }
              background_task_running: { $ref: ../../../fixtures/api/project_background_task_running.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  patch:
    operationId: updateProject
    tags: [projects]
    summary: Edit the settings of a project
    description: >-
      Reserved to project managers (WF-PRJ-0060, WF-ADM-0110) and refused on a terminal project
      (WF-CYC-0100), as the project's `update` command states in advance. The client name is
      entered and cleared there at any time, no transition requiring it (WF-PRJ-0080). The win
      probability can no longer be modified from In progress onwards (WF-PRJ-0090): the
      `update_win_probability` command states it in advance, and a value sent regardless is
      refused with 409 `STATE_FORBIDS_OPERATION`, `params.missing_condition` at
      `project_before_in_progress`; the inflation rate can be modified at any time and affects
      no marked revision (WF-PRJ-0040). Both are ratios from `0` to `1`, outside of which the
      value is refused per field (422, `VALUE_OUT_OF_RANGE`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/ProjectUpdate }
    responses:
      '200':
        description: Project modified.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Project }
            examples:
              updated: { $ref: ../../../fixtures/api/project_updated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403':
        description: >-
          A missing capacity, the `update` command stating it in advance: `NOT_PROJECT_MANAGER`,
          `params.missing_condition` at `is_project_manager`, to whoever is only a contributor
          of the project — the settings are reserved to project managers (WF-PRJ-0060,
          WF-ADM-0110) —; `NOT_CONTRIBUTOR`, `is_contributor`, to whoever is not one; or a
          missing permission, as the common `Forbidden` response states. Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              not_manager: { $ref: ../../../fixtures/api/project_update_not_manager.json }
              not_contributor: { $ref: ../../../fixtures/api/project_update_not_contributor.json }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          A code already used by another project (WF-PRJ-0010): `ALREADY_EXISTS`, `fields`
          designating `/code` with `ALREADY_EXISTS`, `fields[].params.conflicting_object_id` the
          project that holds it and `fields[].params.conflicting_object_label` its label, which
          the form shows at the field; or an unavailable command, `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` naming it: `project_before_in_progress` for
          `/win_probability` sent to a project that has reached In progress, frozen as its
          `update_win_probability` command stated in advance (WF-PRJ-0090, WF-IHM-0090);
          `project_not_terminal` on a terminal project (WF-CYC-0100). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              code_taken: { $ref: ../../../fixtures/api/project_code_taken.json }
              win_probability_frozen: { $ref: ../../../fixtures/api/project_win_probability_frozen.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` designating each field: `/win_probability` or
          `/inflation_rate` outside `0` to `1`, `VALUE_OUT_OF_RANGE`, `fields[].params.minimum` or
          `fields[].params.maximum` the bound crossed (WF-PRJ-0040, WF-PRJ-0090); `/label` or
          `/client` empty, `VALUE_REQUIRED`, or longer than the schema allows,
          `VALUE_TOO_LONG` (WF-PRJ-0080); `/code` refused as at creation (`ProjectCode`,
          WF-PRJ-0010, WF-CRE-0020). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              rates_out_of_range: { $ref: ../../../fixtures/api/project_rates_out_of_range.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/state-transitions:
  get:
    operationId: listProjectStateTransitions
    tags: [projects]
    summary: Dated history of the states
    description: >-
      Each transition is dated on the day it occurred, carries its author and, for a manual
      exit, the reason given at its confirmation; nothing in it can be modified (WF-CYC-0130,
      WF-CYC-0090). The portfolio statistics by period depend on it
      (WF-PTF-0050).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: Transitions, from creation to the current state.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/projects.yaml#/StateTransition }
            examples:
              witness: { $ref: ../../../fixtures/api/state_transitions.json }
              exited: { $ref: ../../../fixtures/api/state_transitions_exited.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/next-state:
  get:
    operationId: getProjectNextState
    tags: [projects]
    summary: Next state, trigger and remaining conditions
    description: >-
      Viewable at any time before In progress, without having attempted any action
      (WF-CYC-0050): the next state, the event that leads to it (`LifecycleTrigger`) and, one by
      one, the conditions that remain — towards In progress, `project_code_set` and
      `reference_revision_designated`, in the order of the enumeration (`CommandCondition`), the
      project code being required for the passage (WF-CYC-0030, WF-PRJ-0010). The transitions to
      Pricing and In progress are never commands (WF-CYC-0020). For a project in progress or in
      a terminal state, the operation responds 200: the next state and the trigger null, no
      condition — no event takes it any further, and the exits from the lifecycle are commands
      of the project (WF-CYC-0060).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: >-
          Next state and what is missing to reach it; null, without conditions, for a project in
          progress or closed.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/NextState }
            examples:
              witness: { $ref: ../../../fixtures/api/next_state.json }
              pricing: { $ref: ../../../fixtures/api/next_state_pricing.json }
              created: { $ref: ../../../fixtures/api/next_state_created.json }
              completed: { $ref: ../../../fixtures/api/next_state_completed.json }
              pricing_without_code: { $ref: ../../../fixtures/api/next_state_pricing_without_code.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/exit:
  post:
    operationId: exitProject
    tags: [projects]
    summary: Manual exit from the lifecycle
    description: >-
      The only three commanded transitions: Completed from In progress, Lost from Pricing,
      Abandoned from any non-terminal state (WF-CYC-0060). Irreversible (WF-CYC-0080), applied
      after a confirmation that states what it makes non-modifiable and offers a reason, which
      the transition keeps (WF-CYC-0090, WF-CYC-0130), reserved to project managers
      (WF-PRJ-0060), and recorded in the audit log (WF-SEC-0030). When the project holds a
      current revision, the exit receives its fate, marking it with a version name or abandoning
      it, and is applied only together with it, in the same operation (WF-CYC-0090,
      `ProjectExit.current_revision`): abandoning, or exiting a project without a current
      revision, is applied within the request, which returns 200 and the project; marking is
      handed to the worker, which computes the indicators of the revision (WF-REV-0020,
      WF-ARC-0090), and the request returns 202 and the background task, `revision_mark`. The
      exit is applied when the task succeeds, under the same correlation as the marking: the
      project moves to the target state, without a current revision, the revision marked under
      the given name; a task that fails applies nothing, and the project keeps its state and its
      current revision. During this marking, the three exits name `no_background_task_running`
      (`ProjectCommand`). An exit that abandons records the abandonment of the revision and the
      exit, under one correlation (`audit_events_exited`); an exit that marks, the marking and
      the exit. After the exit, the project no longer has a current revision, and its indicators
      are read in its last marked revision (WF-CYC-0090, WF-IND-0010). A write of the project
      like any other, it carries its lock version as read (`ProjectExit.lock_version`,
      WF-IHM-0110): two project managers who exit the same project do not exit it over one
      another.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/ProjectExit }
          examples:
            abandoning: { $ref: ../../../fixtures/api/project_exit_abandoning.json }
            marking: { $ref: ../../../fixtures/api/project_exit_marking.json }
    responses:
      '200':
        description: >-
          Exit applied, the current revision abandoned if it held one; the project becomes
          read-only (WF-CYC-0100), without a current revision (WF-CYC-0090).
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Project }
            examples:
              completed: { $ref: ../../../fixtures/api/project_completed.json }
      '202':
        description: >-
          Exit that marks the current revision: the marking queued, the transition applied
          when it succeeds (WF-CYC-0090, WF-ARC-0090).
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              marking: { $ref: ../../../fixtures/api/task_exit_mark_queued.json }
              relaunched: { $ref: ../../../fixtures/api/task_exit_mark_relaunched.json }
      '400':
        description: >-
          An unreadable body, `MALFORMED_REQUEST`; or an exit without its confirmation,
          `confirmed` absent or false: `CONFIRMATION_REQUIRED`, without parameters, like every
          irreversible operation that its confirmation guards (WF-CYC-0090, WF-CYC-0080;
          `startRestore`). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              unconfirmed: { $ref: ../../../fixtures/api/project_exit_unconfirmed.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403':
        description: >-
          As the common `Forbidden` response states: a missing permission,
          `PERMISSION_MISSING`, or a capacity on the project, `NOT_PROJECT_MANAGER` or
          `NOT_CONTRIBUTOR`. An exit whose fate is `abandon` additionally requires
          `revision_abandon`, and `mark`, `revision_mark`, whether a revision is in progress or not
          (WF-CYC-0090, WF-ADM-0100). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The requested exit is unavailable: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` the first condition it lacks, in the order in which the
          command of the exit (`complete`, `lose`, `abandon`) names them — `project_not_terminal`
          for any exit of a terminal project, from which no transition leaves (WF-CYC-0080), and
          where the command is never listed: only this 409 names it; then `project_in_progress`
          for `completed` before In progress, `project_in_pricing` for `lost` outside Pricing,
          Created as well as In progress (WF-CYC-0060); then `no_background_task_running` during a
          background task that writes to the current revision or freezes it. Or a version name
          already used by a marked revision of the project, as for `markRevision`:
          `ALREADY_EXISTS`, `fields` designating `/current_revision/version_name` with
          `ALREADY_EXISTS`, `fields[].params.conflicting_object_id` the revision that holds it
          (WF-REV-0020). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              terminal: { $ref: ../../../fixtures/api/project_exit_terminal.json }
              lost_in_progress: { $ref: ../../../fixtures/api/project_exit_lost_in_progress.json }
              version_name_taken: { $ref: ../../../fixtures/api/project_exit_version_name_taken.json }
      '412':
        description: >-
          `STALE_LOCK_VERSION`: the project has been written since it was read, and it does not
          exit; `params.expected_lock_version` is its current lock version (WF-IHM-0110,
          US-0702/L2).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/project_exit_stale.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` designating each field: a project that holds a current
          revision, without its fate, `/current_revision` with `VALUE_REQUIRED` — the exit is
          applied only with this choice (WF-CYC-0090) —; a marking without a version name,
          `/current_revision/version_name` with `VALUE_REQUIRED` (WF-REV-0020). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              revision_required: { $ref: ../../../fixtures/api/project_exit_revision_required.json }
              version_name_required: { $ref: ../../../fixtures/api/project_exit_version_name_required.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/work-breakdown:
  get:
    operationId: getWorkBreakdown
    tags: [projects]
    summary: Work breakdown
    description: >-
      Work packages, which contain order items, which contain deliverables (WF-PRJ-0020); in the
      absence of any entry, one work package comprising one order item without a deliverable,
      both bearing the label of the project. Each work package and each order item states the
      task of the current revision that holds it (`attached_task`, WF-PLA-0170). A tree grid, in
      the order entered, which is not sorted (WF-IHM-0060) and is filtered on its two columns
      (WF-IHM-0130): the label through the search (`search`), the kind — work package, order
      item, deliverable — through `kinds`. The filters combine; an element is retained if it
      satisfies them all, and the work packages and order items that contain a retained element
      are returned so that the tree remains readable (WF-IHM-0060), without the other elements
      they contain; each element returned states whether it is retained or returned for context
      (`is_match`), and the grid counts only the retained ones: "the filter applies to the
      totals it presents" (WF-IHM-0130, #574). A filtered reading returns a null lock version:
      `setWorkBreakdown` writes the entire work breakdown, and sending it back as is, which
      would delete what it omits, is refused with 422 (`WorkBreakdownReading`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: search
        in: query
        description: >-
          Search on the label of the work packages, order items and deliverables — the only text
          each one carries (WF-PRJ-0020) —, compared like every search of the contract (README,
          "A search…"; WF-IHM-0130). An element whose
          label contains the text is retained, not what it contains.
        schema: { type: string, minLength: 1, maxLength: 200 }
      - name: kinds
        in: query
        description: >-
          Restricts to the elements of these kinds, the kind column filtered (WF-IHM-0130):
          `kinds=deliverable`, the deliverables, under their order items and their work packages.
        schema:
          type: array
          items: { $ref: ../components/schemas/projects.yaml#/WorkBreakdownKind }
        explode: false
    responses:
      '200':
        description: Work breakdown of the project, or what the filters retain from it.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/WorkBreakdownReading }
            examples:
              witness: { $ref: ../../../fixtures/api/work_breakdown.json }
              default: { $ref: ../../../fixtures/api/work_breakdown_default.json }
              search: { $ref: ../../../fixtures/api/work_breakdown_search.json }
              order_items: { $ref: ../../../fixtures/api/work_breakdown_order_items.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  put:
    operationId: setWorkBreakdown
    tags: [projects]
    summary: Enter the work breakdown
    description: >-
      Enters the entire work breakdown, which reproduces the purchase order: its work packages,
      their order items, their deliverables (WF-PRJ-0020), at least one work package. A work
      package or an order item that the entry omits is deleted: the tasks of the current
      revision that held it remain and lose their attachment; the marked revisions keep it, and
      the work package or order item is then marked deleted (WF-PLA-0170, WF-DAT-0080); "the
      deletion of a work package takes its order items with it" (WF-DAT-0080), an omitted
      deliverable is physically deleted. An order item that the entry places under another work
      package is never refused: "Moving an order item under another work package likewise
      removes the attachment of its task when it is not in the subtree of the task of that work
      package" (WF-PLA-0170) — the order item and its new work package both held, the task of
      the order item outside the subtree of that of the work package in the current revision,
      the entry succeeds and this task no longer holds the order item. The marked revisions keep
      it, their tasks no longer moving; the response does not name the task that loses its order
      item, but the order item returned no longer states it (`attached_task`), and the planning
      grid, read again, shows it without attachment. What the entry advances (WF-IHM-0110): the
      lock version of the work breakdown, always; and, when it removes the attachment of tasks
      of the current revision, the lock version of each of these tasks (`Node.lock_version`) and
      that of the main structure (`CostStructure.lock_version`), like a grid write — a cell or a
      paste read before it is refused with 412; a work breakdown entered without removing any
      attachment advances only its own. It is unavailable during a background task that writes
      to the current revision or freezes it — marking, merge, occurrence, application of an
      import —, which the project's `update_work_breakdown` command states in advance
      (`no_background_task_running`, WF-IHM-0080, WF-IHM-0090; EP-14/L42s).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/WorkBreakdown }
          examples:
            entered: { $ref: ../../../fixtures/api/work_breakdown_entered.json }
    responses:
      '200':
        description: >-
          Work breakdown saved, returned as read in full in the order entered, each element
          retained, the new elements with the identifier the server gave them, and its next lock
          version, never null; it creates no lasting link with the planning (WF-PRJ-0030).
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/WorkBreakdownReading }
            examples:
              saved: { $ref: ../../../fixtures/api/work_breakdown_saved.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          A condition that the `update_work_breakdown` command states is missing:
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` the first one missing, in the
          order in which the command lists them — `project_not_terminal` on a terminal project,
          whose settings can no longer be modified and which no longer lists it (WF-CYC-0100),
          as `updateProject` refuses it, then `no_background_task_running` as long as a
          background task writes to the current revision or freezes it — marking, merge,
          occurrence, application of an import —, the entry, which would remove attachments from
          it, waiting for it to finish (WF-IHM-0080, WF-IHM-0090; EP-14/L42s). Nothing is
          written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              background_task: { $ref: ../../../fixtures/api/work_breakdown_background_task.json }
      '412':
        description: >-
          The lock version sent is no longer that of the work breakdown: another entry has
          advanced it since the reading. `STALE_LOCK_VERSION`, `params.expected_lock_version`
          the current lock version; nothing is written (WF-IHM-0110).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/work_breakdown_stale.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` designating each refused field: a null lock version,
          that of a filtered reading (`WorkBreakdownReading`), `/lock_version` with
          `VALUE_REQUIRED`; no work package, `/work_packages` with `VALUE_REQUIRED`
          (WF-PRJ-0020); an empty or too long label, `VALUE_REQUIRED` or `VALUE_TOO_LONG` on
          `/work_packages/<i>/label`, `/work_packages/<i>/order_items/<j>/label` or
          `/work_packages/<i>/order_items/<j>/deliverables/<k>/label` (WF-PRJ-0020); an
          identifier that the work breakdown as read does not have under the kind of its
          element, `UNKNOWN_WORK_BREAKDOWN_ITEM` on this identifier —
          `/work_packages/<i>/work_package_id`,
          `/work_packages/<i>/order_items/<j>/order_item_id` or
          `/work_packages/<i>/order_items/<j>/deliverables/<k>/deliverable_id`; an identifier
          that the entry already carries, each occurrence after the first,
          `DUPLICATE_WORK_BREAKDOWN_ITEM` on the same field. An order item placed under another
          work package is not a refusal: it removes the attachment of its task (WF-PLA-0170).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              label_required: { $ref: ../../../fixtures/api/work_breakdown_label_required.json }
              unknown_item: { $ref: ../../../fixtures/api/work_breakdown_unknown_item.json }
              duplicate_item: { $ref: ../../../fixtures/api/work_breakdown_duplicate_item.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/subprojects:
  get:
    operationId: listSubprojects
    tags: [projects]
    summary: Subprojects
    description: >-
      The subprojects, ERP codes under which the estimate lines are broken down and the actual
      costs are charged — never a task (WF-PRJ-0050, §3.2.3) —, each with its commands
      (`Subproject.available_commands`, WF-IHM-0090). A flat table, sorted and filtered by the
      server on each of its columns (WF-IHM-0060, WF-IHM-0130): the search covers the code and
      the label, the actual costs column is filtered through `has_actual_costs`. Without
      pagination: §4.6.2 counts ten subprojects per project.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: search
        in: query
        description: >-
          Search on the code and the label, compared like every search of the contract
          (README, "A search…"; WF-IHM-0130).
        schema: { type: string, minLength: 1, maxLength: 200 }
      - name: has_actual_costs
        in: query
        description: >-
          True, only the subprojects to which actual costs are charged, which can no longer be
          deleted; false, the others (WF-PRJ-0050, WF-IHM-0130).
        schema: { type: boolean }
      - name: sort_by
        in: query
        description: >-
          Sort column; absent, the code. The code and the label compare in Unicode code point
          order; the actual costs column places the subprojects that carry some
          before the others in ascending order, as the account state places the
          active ones. On a tie, the order of the unsorted list, then the identifier (WF-IHM-0060).
        schema:
          type: string
          enum: [code, label, has_actual_costs]
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Subprojects, identified by their ERP code (WF-PRJ-0050).
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/projects.yaml#/Subproject }
            examples:
              witness: { $ref: ../../../fixtures/api/subprojects.json }
              by_label: { $ref: ../../../fixtures/api/subprojects_by_label.json }
              with_actual_costs: { $ref: ../../../fixtures/api/subprojects_with_actual_costs.json }
              completed: { $ref: ../../../fixtures/api/subprojects_completed.json }
              estimated: { $ref: ../../../fixtures/api/subprojects_estimated.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createSubproject
    summary: Create a subproject
    description: >-
      A subproject of the current project (WF-PRJ-0050), through the project's `update` command,
      reserved to its project managers (WF-PRJ-0060). The actual cost lines that already carried
      its code are charged to it at once (WF-CRE-0020): the response states it
      (`has_actual_costs`).
    tags: [projects]
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/SubprojectWrite }
    responses:
      '201':
        description: Subproject created.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Subproject }
            examples:
              created: { $ref: ../../../fixtures/api/subproject_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Code already used in this project (WF-PRJ-0050): `ALREADY_EXISTS`, `fields`
          designating `/code` with `ALREADY_EXISTS`, `fields[].params.conflicting_object_id` the
          subproject that holds it and `fields[].params.conflicting_object_label` its label,
          which the form shows at the field; or a terminal project (WF-CYC-0100),
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` at `project_not_terminal`.
          Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              code_taken: { $ref: ../../../fixtures/api/subproject_code_taken.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` designating each field: `/code` or `/label` empty,
          `VALUE_REQUIRED`, or longer than the schema allows, `VALUE_TOO_LONG` —
          `fields[].params.max_length` at `31` for `/code`, at `300` for `/label`, the bound
          of the field —; `/code` containing a forbidden
          character or equal to a reserved name, regardless of case, `SUBPROJECT_CODE_INVALID`,
          `fields[].params.forbidden_characters` or `fields[].params.reserved_name` naming it:
          the code names the subproject's tab in the remaining to commit file
          (`DeclaredSubprojectCode`, WF-PRJ-0050). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              code_invalid: { $ref: ../../../fixtures/api/subproject_code_invalid.json }
              code_reserved: { $ref: ../../../fixtures/api/subproject_code_reserved.json }
              code_too_long: { $ref: ../../../fixtures/api/subproject_code_too_long.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/subprojects/{subproject_id}:
  patch:
    operationId: updateSubproject
    summary: Edit a subproject
    description: >-
      A subproject of the current project (WF-PRJ-0050), as its `update` command states
      (`Subproject.available_commands`): its code and its label, at any time, whether actual costs
      are charged or not.
    tags: [projects]
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/SubprojectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/SubprojectUpdate }
    responses:
      '200':
        description: Subproject modified.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Subproject }
            examples:
              updated: { $ref: ../../../fixtures/api/subproject_updated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Code already used by another subproject of the project (WF-PRJ-0050):
          `ALREADY_EXISTS`, `fields` designating `/code` with `ALREADY_EXISTS`,
          `fields[].params.conflicting_object_id` the subproject that holds it and
          `fields[].params.conflicting_object_label` its label, which the form shows at the
          field; or a terminal project (WF-CYC-0100), `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` at `project_not_terminal`. Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              code_taken: { $ref: ../../../fixtures/api/subproject_code_taken.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` designating each field: `/code` or `/label` empty,
          `VALUE_REQUIRED`, or longer than the schema allows, `VALUE_TOO_LONG` —
          `fields[].params.max_length` at `31` for `/code`, at `300` for `/label`, the bound
          of the field —; `/code` containing a forbidden
          character or equal to a reserved name, regardless of case, `SUBPROJECT_CODE_INVALID`,
          `fields[].params.forbidden_characters` or `fields[].params.reserved_name` naming it:
          the code names the subproject's tab in the remaining to commit file
          (`DeclaredSubprojectCode`, WF-PRJ-0050). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              code_invalid: { $ref: ../../../fixtures/api/subproject_code_invalid.json }
              code_reserved: { $ref: ../../../fixtures/api/subproject_code_reserved.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  delete:
    operationId: deleteSubproject
    tags: [projects]
    summary: Delete a subproject
    description: >-
      Refused as soon as a marked revision cites it (§4.4.1, WF-DAT-0080), an actual cost is
      charged to it (WF-PRJ-0050), or as long as estimate lines of the current revision carry it
      (WF-DAT-0080, WF-PRJ-0050; EP-14/L42q, C-273), which its `delete` command states in
      advance (`Subproject.available_commands`, WF-IHM-0090); reserved to project managers
      (WF-PRJ-0060). A subproject that a marked revision cites cannot be deleted: the
      subprojects determine the earned value curve, and its deletion would have effects there
      that nothing controls. A subproject carried by estimate lines of the current revision can
      be deleted only once these lines have been moved outside any subproject or to another one:
      its codes come from the ERP and define the granularity of the actual costs; a provision
      line is moved through its risk (`updateRiskProvision`, `provision_subproject_id`). A
      subproject that no marked revision cites, that no actual cost charges and that no line of
      the current revision carries is removed from the database. Its deletion sets to null the
      designation of every risk that is not identified and designated it for its provision
      (`Risk.provision_subproject_id`): once identified again, this risk carries its provision
      outside any subproject (WF-RIS-0010; EP-14/L42p; settled by the author on 2026-10-10,
      decision of the author, #732). Each risk affected sees its `lock_version` advance and its
      audit name the author of the deletion (`updated_by`, `updated_at`, WF-DAT-0070,
      WF-IHM-0110).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/SubprojectId
      - name: lock_version
        in: query
        required: true
        description: >-
          The lock version of the deleted subproject, as the screen read it
          (`Subproject.lock_version`): stale, the deletion is refused with 412 and nothing is
          deleted (WF-IHM-0110; the author's decision of 2026-10-28, US-0702/L2).
        schema: { $ref: ../components/common.yaml#/LockVersion }
    responses:
      '204':
        description: Subproject deleted, removed from the database (WF-DAT-0080).
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The `delete` command is unavailable: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` naming the condition it lacks — `subproject_not_cited`
          for a subproject that a marked revision cites (§4.4.1, WF-DAT-0080),
          `subproject_without_actual_costs` for a subproject to which actual costs are charged
          (WF-PRJ-0050), `subproject_without_estimate_lines` for a subproject carried by
          estimate lines of the current revision (WF-DAT-0080, WF-PRJ-0050),
          `project_not_terminal` on a closed project (WF-CYC-0100). Only one is named, the
          first one missing in the order in which the `delete` command lists them:
          `subproject_not_cited`, then `subproject_without_actual_costs` — the citation is never
          lifted, a marked revision being immutable (WF-DAT-0020) —, then
          `subproject_without_estimate_lines`, which moving these lines outside any subproject
          or to another one lifts, then `project_not_terminal`. Naming
          `subproject_without_estimate_lines`, the refusal also names these lines (Vérif of
          WF-DAT-0080): `params.estimate_lines`, all of them, each by its structure, the label of
          that structure, its node, its line number in its entire structure and its label
          (`structure_id`, `structure_label`, `node_id`, `row_number`, `label`) — two lines of
          two structures can carry the same number, and the label of the structure tells them
          apart without the screen reading `listCostStructures` (#764) —, the main structure
          first, then the others in the order of `listCostStructures`, each in the order of the
          plan. The list has no bound: a
          subproject carries at most the lines of one revision, a few thousand at §4.6.2, and
          the user must be able to move them all. Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              cited: { $ref: ../../../fixtures/api/subproject_delete_cited.json }
              refused: { $ref: ../../../fixtures/api/subproject_delete_refused.json }
              estimated: { $ref: ../../../fixtures/api/subproject_delete_estimated.json }
      '412':
        description: >-
          `STALE_LOCK_VERSION`: the subproject has been written since it was read, and nothing is
          deleted; `params.expected_lock_version` is its current lock version (WF-IHM-0110,
          US-0702/L2).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              stale: { $ref: ../../../fixtures/api/subproject_delete_stale.json }
      '422': { $ref: ../components/responses.yaml#/LockVersionInvalid }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/contributors:
  get:
    operationId: listContributors
    tags: [projects]
    summary: Contributors of the project
    description: >-
      Each with their capacity, project manager or contributor; the list of a newly created
      project includes its creator, as project manager (WF-PRJ-0060). The list carries its own
      write lock version, which `setContributors` requires (WF-IHM-0110). A flat table, sorted
      and filtered by the server on each of its columns (WF-IHM-0060, WF-IHM-0130): the search
      covers the name of the account, the capacity is filtered through `kinds`, the state of the
      account through `is_active` — an account deactivated since the registration remains listed
      and flagged (WF-ADM-0060). Without pagination: §4.6.2 counts fifty contributors per
      project. The lock version is that of the whole list, whatever the sort; a filtered reading
      returns it null, so that it is not sent back to `setContributors`, which writes the entire
      list and would remove what it omits (`ContributorList.lock_version`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: search
        in: query
        description: >-
          Search on the displayed name of the account (`display_name`), the only text column of
          the list, compared like every search of the contract (README, "A search…";
          WF-IHM-0130).
        schema: { type: string, minLength: 1, maxLength: 200 }
      - name: kinds
        in: query
        description: Restricts to the contributors of these capacities (WF-IHM-0130).
        schema:
          type: array
          items: { $ref: ../components/schemas/projects.yaml#/ContributorKind }
        explode: false
      - name: is_active
        in: query
        description: >-
          True, only the contributors whose account is active; false, those whose account has
          been deactivated since their registration, which the list keeps (WF-ADM-0060,
          WF-IHM-0130).
        schema: { type: boolean }
      - name: sort_by
        in: query
        description: >-
          Sort column; absent, the project managers first, then the last name and the first name
          of the account, like the accounts (`listUsers`). The displayed name compares in
          Unicode code point order; an anonymised account, which no longer has a name or a
          displayed name (`Contributor.display_name` null), comes after the names in ascending
          order — unsorted, after the other accounts of its capacity (WF-ADM-0060, #870); the
          capacity, in the order of `ContributorKind`, the project managers first in ascending
          order; the state of the account, the active ones before the deactivated ones in
          ascending order. On a tie, the order of the unsorted list, then the identifier of the
          account (WF-IHM-0060).
        schema:
          type: string
          enum: [display_name, kind, is_active]
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Contributors, and the lock version of the list.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/ContributorList }
            examples:
              witness: { $ref: ../../../fixtures/api/contributors.json }
              by_name: { $ref: ../../../fixtures/api/contributors_by_name.json }
              search: { $ref: ../../../fixtures/api/contributors_search.json }
              inactive: { $ref: ../../../fixtures/api/contributors_inactive.json }
              anonymized: { $ref: ../../../fixtures/api/contributors_anonymized.json }
              without_active_manager: { $ref: ../../../fixtures/api/contributors_without_active_manager.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  put:
    operationId: setContributors
    tags: [projects]
    summary: Register or remove contributors
    description: >-
      The list, each with their capacity, grants authorisation to view and to enter data on the
      project; reserved to project managers (WF-PRJ-0060, WF-ADM-0110). However, when no project
      manager of the project has an active account (WF-ADM-0060), the caller who holds the
      permission for the project settings (`project_settings.write`, FBS-4.2) and "view every
      project" (`all_projects_read`) writes it without being a contributor, to register a
      project manager in it: the only entry open to a non-contributor (WF-PRJ-0060), which the
      `manage_contributors` command tells them in advance (`project_rescue`). They read the list
      and its lock version through `listContributors`, which "view every project" opens to them
      (`contributors_without_active_manager`); the list they send carries a project manager with
      an active account, new or promoted from participant, otherwise it is refused with 409
      `LAST_PROJECT_MANAGER`; any other entry remains refused to them, with 403
      `NOT_CONTRIBUTOR`. As soon as an active project manager is registered, the list again
      belongs to its project managers alone. A list that would keep no project manager is
      refused (409, `LAST_PROJECT_MANAGER`); an account that the installation does not have, or
      a deactivated account registered or changed in capacity, is refused with 422, `fields`
      designating the account at its line (`/contributors/<n>/user_id`) with `UNKNOWN_USER` or
      `USER_INACTIVE` — a contributor deactivated since their registration remains in the list,
      as it was read (WF-ADM-0060); an account registered twice is refused at its repeated line,
      with `VALIDATION_FAILED`, its first line judged like the others (#2163). The list carries
      five hundred lines at most, refused beyond that with 422, `fields` designating
      `/contributors` with `VALUE_TOO_LONG`, `fields[].params.max_length` at `500` (#2162).
      Carries the lock version of the list as read, refused with 412 if it is stale
      (WF-IHM-0110), and returns the list with the next one; a null lock version, that of a
      filtered reading, is refused with 422, `fields` designating `/lock_version` with
      `VALUE_REQUIRED`.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/ContributorsWrite }
    responses:
      '200':
        description: >-
          List saved. A write always returns the entire list with its next lock version,
          never null: `ContributorList` allows a null lock version only for a filtered
          reading (WF-IHM-0110).
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/ContributorList }
            examples:
              set: { $ref: ../../../fixtures/api/contributors_set.json }
              set_by_rescuer: { $ref: ../../../fixtures/api/contributors_set_by_rescuer.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The list would keep no project manager (`LAST_PROJECT_MANAGER`, without parameters,
          WF-PRJ-0060), or, written by a non-contributor, no project manager with an active
          account; or a terminal project (WF-CYC-0100), `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` at `project_not_terminal`. Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              without_manager: { $ref: ../../../fixtures/api/contributors_without_manager_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` designating each refusal: an account that the
          installation does not have, `/contributors/<n>/user_id` with `UNKNOWN_USER`; a
          deactivated account registered or changed in capacity, `/contributors/<n>/user_id`
          with `USER_INACTIVE` (WF-ADM-0060); an account registered twice, its repeated line,
          `/contributors/<n>/user_id` with `VALIDATION_FAILED` (#2163); a list of more than five
          hundred lines, `/contributors` with `VALUE_TOO_LONG`, `fields[].params.max_length` at
          `500` (#2162); a null lock version, that of a filtered reading, `/lock_version` with
          `VALUE_REQUIRED` (WF-IHM-0110). Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              accounts_refused: { $ref: ../../../fixtures/api/contributors_accounts_refused.json }
              account_doubled: { $ref: ../../../fixtures/api/contributors_account_doubled.json }
              too_many: { $ref: ../../../fixtures/api/contributors_too_many.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/contributors/suggestions:
  get:
    operationId: listContributorSuggestions
    tags: [projects]
    summary: Suggested contributors
    description: >-
      The active accounts attached to the organisation nodes of the resource roles used by the
      estimate lines of the project — those of its current revision, or of its last marked
      revision when it has none —, which the list of contributors does not yet include
      (WF-PRJ-0070, WF-ADM-0060); each names its node and the roles that cause it to be
      suggested. Never registered without confirmation: the list is written through
      `setContributors`.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: Suggestions.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/projects.yaml#/ContributorSuggestion }
            examples:
              witness: { $ref: ../../../fixtures/api/contributor_suggestions.json }
              none: { $ref: ../../../fixtures/api/contributor_suggestions_empty.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/timelines:
  get:
    operationId: listTimelines
    tags: [planning]
    summary: Timelines of the project
    description: Named timelines, to which tasks are registered (WF-PLA-0140).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: Timelines.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/revisions.yaml#/Timeline }
            examples:
              witness: { $ref: ../../../fixtures/api/timelines.json }
              none: { $ref: ../../../fixtures/api/timelines_empty.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: createTimeline
    summary: Create a timeline
    description: >-
      A named timeline, without registrations, to which the tasks and milestones are then registered
      from the planning (WF-PLA-0140, WF-PLA-0060). "A project can carry several
      timelines. Each one carries a name": the name is not unique, and two timelines of a
      project can share it. The project states in advance whether the caller can create one
      (`ProjectCommand.manage_timelines`); on a terminal project, it is refused with 409, like
      every write of the project (WF-CYC-0100).
    tags: [planning]
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/revisions.yaml#/TimelineCreate }
    responses:
      '201':
        description: Timeline created.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/Timeline }
            examples:
              created: { $ref: ../../../fixtures/api/timeline_created.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          A terminal project: `STATE_FORBIDS_OPERATION`, `params.missing_condition` at
          `project_not_terminal`, the project no longer listing `manage_timelines`
          (WF-CYC-0100); nothing is created.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              terminal: { $ref: ../../../fixtures/api/timeline_create_terminal.json }
      '422':
        description: >-
          A name that is empty, too long or made only of whitespace: `VALIDATION_FAILED`, `fields`
          designating `/label` with `VALUE_REQUIRED`, `VALUE_TOO_LONG` or, like every label,
          `VALIDATION_FAILED` (WF-PLA-0140).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              label_required: { $ref: ../../../fixtures/api/timeline_label_required.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/timelines/{timeline_id}:
  delete:
    operationId: deleteTimeline
    summary: Delete a timeline
    description: >-
      Removes the timeline; the tasks keep their current dates (WF-PLA-0140). "A deliverable or
      a timeline is physically deleted" (WF-DAT-0080): no marked revision retains it, nor has it
      marked deleted, its registrations going with it. The project states in advance whether the
      caller can delete one (`ProjectCommand.manage_timelines`); on a terminal project, it is
      refused with 409, like every write of the project (WF-CYC-0100). It carries no lock
      version, by an exception written in the README: a timeline has none, no operation modifies
      it — it is created and deleted — and its registrations are entries of the tasks, which
      have their own; there is nothing to compare, and a timeline already deleted is a 404
      (the author's decision of 2026-11-01, #1733).
    tags: [planning]
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/TimelineId
    responses:
      '204':
        description: Timeline deleted; the registrations are deleted with it.
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          A terminal project: `STATE_FORBIDS_OPERATION`, `params.missing_condition` at
          `project_not_terminal`, the project no longer listing `manage_timelines`
          (WF-CYC-0100); nothing is deleted. No marked revision retains a timeline
          (WF-DAT-0080).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              terminal: { $ref: ../../../fixtures/api/timeline_delete_terminal.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
