/projects:
  get:
    operationId: listProjects
    tags: [projects]
    summary: Projets
    description: >-
      Les projets que l'appelant peut ouvrir, et eux seuls : ceux dont il est
      contributeur et, s'il porte la permission « consulter tous les projets », tous les
      autres (WF-PRJ-0060, WF-ADM-0110) — le portefeuille, lui, compte tous les projets du
      périmètre (WF-PTF-0030). Le filtre `is_contributor` restreint la liste aux projets
      dont l'appelant est contributeur : c'est l'accueil, un filtre que l'utilisateur
      voit et lève (WF-IHM-0120) ; levé, la liste ne montre que ce qu'il peut ouvrir, et
      rien d'autre. Le tri et les filtres sont faits par le serveur, et `meta.total`
      compte les projets retenus (WF-IHM-0130). La recherche (`search`) porte sur le libellé
      et sur le code du projet ; la période (`from`, `to`), sur l'instant de sa dernière
      modification (`audit.updated_at`), la colonne de date de la liste, comme celle du journal
      d'audit : deux instants, le début inclus, la fin exclue, que l'écran tire des jours de son
      lecteur.
      Sans `states`, les projets en cours seuls, le défaut du périmètre du portefeuille
      (WF-PTF-0010) que le paramètre partage : un accueil qui liste tous les projets
      ouvrables nomme les six états. `meta.states` dit toujours les états retenus, nommés ou
      par défaut, pour que l'écran montre le filtre que le serveur a appliqué.
    parameters:
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/PortfolioStates
      - name: is_contributor
        in: query
        description: Vrai, les seuls projets dont l'appelant est contributeur.
        schema: { type: boolean, default: false }
      - name: from
        in: query
        description: >-
          Début de la période, inclus : restreint aux projets dont la dernière modification
          (`audit.updated_at`) est à cet instant ou après lui (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Timestamp }
      - name: to
        in: query
        description: >-
          Fin de la période, exclue : restreint aux projets modifiés avant cet instant
          (WF-IHM-0130). Antérieure à `from`, elle est refusée par 422 ; égale, la période est
          vide.
        schema: { $ref: ../components/common.yaml#/Timestamp }
      - name: sort_by
        in: query
        description: >-
          Colonne du tri ; absente, les projets modifiés le plus récemment d'abord. Le libellé
          et le code se comparent dans l'ordre des points de code Unicode, un projet sans code
          après les autres dans l'ordre croissant ; l'état, dans l'ordre de `ProjectState`, celui
          du cycle de vie (WF-CYC-0010). À égalité, l'ordre de la liste sans tri, puis
          l'identifiant.
        schema:
          type: string
          enum: [label, code, state, updated_at]
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Projets, et les états retenus.
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/projects.yaml#/Project }
                meta: { $ref: ../components/schemas/projects.yaml#/ProjectListMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/projects.json }
              empty: { $ref: ../../../fixtures/api/projects_empty.json }
              default_states: { $ref: ../../../fixtures/api/projects_default_states.json }
              search_code: { $ref: ../../../fixtures/api/projects_search_code.json }
              period: { $ref: ../../../fixtures/api/projects_period.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          `VALIDATION_FAILED` : une période dont la fin précède le début, `fields[]` désignant
          `/query/to` par `VALUE_OUT_OF_RANGE`, `params.minimum` le début donné, la règle de
          toute période du contrat ; un instant mal formé, `/query/from` ou `/query/to` par
          `DATE_INVALID`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              period_inverted: { $ref: ../../../fixtures/api/projects_period_inverted.json }
  post:
    operationId: createProject
    tags: [projects]
    summary: Créer un projet
    description: >-
      Refusée tant que le référentiel minimal est incomplet, et le refus nomme chaque
      prérequis manquant (WF-CYC-0120). Le créateur est inscrit chef de projet
      (WF-PRJ-0060). Le projet naît à l'état Créé (WF-CYC-0010).
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/ProjectCreate }
    responses:
      '201':
        description: Projet créé.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Project }
            examples:
              created: { $ref: ../../../fixtures/api/project_created.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '409':
        description: >-
          Référentiel minimal incomplet (WF-CYC-0120) : `REFERENCE_INCOMPLETE`,
          `params.missing_prerequisites` nommant chaque prérequis manquant, une valeur de
          `ReferenceReadiness.missing` chacun. Ou un code projet déjà employé (WF-PRJ-0010) :
          `ALREADY_EXISTS`, `fields` désignant `/code` par `ALREADY_EXISTS`,
          `fields[].params.conflicting_object_id` le projet qui le porte et
          `fields[].params.conflicting_object_label` son libellé, que le formulaire dit au champ.
          Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              reference_incomplete: { $ref: ../../../fixtures/api/project_reference_incomplete.json }
              code_taken: { $ref: ../../../fixtures/api/project_code_taken.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant chaque champ : `/label` vide, `VALUE_REQUIRED`
          (WF-PRJ-0080), ou plus long que le schéma ne l'admet, `VALUE_TOO_LONG` ; `/code` plus
          long que le schéma ne l'admet, `VALUE_TOO_LONG`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              refused: { $ref: ../../../fixtures/api/project_creation_refused.json }

/projects/{project_id}:
  get:
    operationId: getProject
    summary: Un projet
    description: >-
      Attributs du projet, son code et son état de cycle de vie (WF-PRJ-0080, WF-PRJ-0010,
      WF-CYC-0010).
    tags: [projects]
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: Projet, y compris dans un état terminal où il reste consultable (WF-CYC-0110).
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Project }
            examples:
              witness: { $ref: ../../../fixtures/api/project.json }
              pricing: { $ref: ../../../fixtures/api/project_pricing.json }
              without_current_revision: { $ref: ../../../fixtures/api/project_without_current_revision.json }
              pricing_estimator: { $ref: ../../../fixtures/api/project_pricing_estimator.json }
              reader: { $ref: ../../../fixtures/api/project_reader.json }
              created: { $ref: ../../../fixtures/api/project_created.json }
              completed: { $ref: ../../../fixtures/api/project_completed.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
  patch:
    operationId: updateProject
    tags: [projects]
    summary: Modifier les paramètres d'un projet
    description: >-
      Réservé aux chefs de projet (WF-PRJ-0060, WF-ADM-0110) et refusé sur un projet
      terminal (WF-CYC-0100), comme la commande `update` du projet le dit d'avance. La
      probabilité de gain n'est plus modifiable à partir de En cours (WF-PRJ-0090) : la commande
      `update_win_probability` le dit d'avance, et la valeur envoyée malgré elle est refusée par
      champ (422) ; le taux d'inflation l'est à tout moment et n'affecte aucune révision marquée
      (WF-PRJ-0040). L'un et l'autre sont des rapports de `0` à `1`, hors desquels la valeur est
      refusée par champ (422).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/ProjectUpdate }
    responses:
      '200':
        description: Projet modifié.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Project }
            examples:
              updated: { $ref: ../../../fixtures/api/project_updated.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Un code déjà employé par un autre projet (WF-PRJ-0010) : `ALREADY_EXISTS`, `fields`
          désignant `/code` par `ALREADY_EXISTS`, `fields[].params.conflicting_object_id` le projet
          qui le porte et `fields[].params.conflicting_object_label` son libellé, que le formulaire
          dit au champ ; ou une commande indisponible, `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` la nommant : `project_before_in_progress` pour
          `/win_probability` envoyée à un projet qui a atteint En cours, figée comme sa commande
          `update_win_probability` le disait d'avance (WF-PRJ-0090, WF-IHM-0090) ;
          `project_not_terminal` sur un projet terminal (WF-CYC-0100). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              code_taken: { $ref: ../../../fixtures/api/project_code_taken.json }
              win_probability_frozen: { $ref: ../../../fixtures/api/project_win_probability_frozen.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant chaque champ : `/win_probability` ou
          `/inflation_rate` hors de `0` à `1`, `VALUE_OUT_OF_RANGE`, `fields[].params.minimum` ou
          `fields[].params.maximum` la borne franchie (WF-PRJ-0040, WF-PRJ-0090) ; `/label` vide,
          `VALUE_REQUIRED`, ou, comme `/code`, plus long que le schéma ne l'admet, `VALUE_TOO_LONG`.
          Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              rates_out_of_range: { $ref: ../../../fixtures/api/project_rates_out_of_range.json }

/projects/{project_id}/state-transitions:
  get:
    operationId: listProjectStateTransitions
    tags: [projects]
    summary: Historique daté des états
    description: >-
      Chaque transition est datée du jour où elle s'est produite, porte son auteur et,
      pour une sortie manuelle, le motif donné à sa confirmation ; rien n'y est
      modifiable (WF-CYC-0130, WF-CYC-0090). C'est d'elle que dépendent les statistiques
      de portefeuille par période (WF-PTF-0050).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: Transitions, de la création à l'état courant.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/projects.yaml#/StateTransition }
            examples:
              witness: { $ref: ../../../fixtures/api/state_transitions.json }
              exited: { $ref: ../../../fixtures/api/state_transitions_exited.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }

/projects/{project_id}/next-state:
  get:
    operationId: getProjectNextState
    tags: [projects]
    summary: Prochain état, déclencheur et conditions restantes
    description: >-
      Consultable à tout moment avant En cours, sans avoir tenté d'action
      (WF-CYC-0050) : le prochain état, le fait qui y mène (`LifecycleTrigger`) et, une par une,
      les conditions qui restent. Les transitions vers Chiffrage et En cours ne sont jamais des
      commandes (WF-CYC-0020). D'un projet en cours ou dans un état terminal, l'opération répond
      200 : le prochain état et le déclencheur nuls, aucune condition — aucun fait ne le mène plus
      loin, et les sorties du cycle de vie sont des commandes du projet (WF-CYC-0060).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: >-
          Prochain état et ce qui manque pour l'atteindre ; nul, sans condition, pour un projet en
          cours ou clos.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/NextState }
            examples:
              witness: { $ref: ../../../fixtures/api/next_state.json }
              pricing: { $ref: ../../../fixtures/api/next_state_pricing.json }
              created: { $ref: ../../../fixtures/api/next_state_created.json }
              completed: { $ref: ../../../fixtures/api/next_state_completed.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }

/projects/{project_id}/exit:
  post:
    operationId: exitProject
    tags: [projects]
    summary: Sortie manuelle du cycle de vie
    description: >-
      Les trois seules transitions commandées : Terminé depuis En cours, Perdu depuis
      Chiffrage, Abandonné depuis tout état non terminal (WF-CYC-0060). Irréversible
      (WF-CYC-0080), appliquée après une confirmation qui énonce ce qu'elle rend non
      modifiable et propose un motif, que la transition conserve (WF-CYC-0090,
      WF-CYC-0130), réservée aux chefs de projet (WF-PRJ-0060), et inscrite au journal
      d'audit (WF-SEC-0030).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/ProjectExit }
    responses:
      '200':
        description: Sortie appliquée ; le projet passe en lecture seule (WF-CYC-0100).
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Project }
            examples:
              completed: { $ref: ../../../fixtures/api/project_completed.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: Sortie non permise depuis l'état courant (WF-CYC-0060, WF-CYC-0080).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }

/projects/{project_id}/work-breakdown:
  get:
    operationId: getWorkBreakdown
    tags: [projects]
    summary: Lotissement
    description: >-
      En l'absence de saisie, un poste comprenant un lot sans livrable (WF-PRJ-0020). Une
      grille arborescente, dans l'ordre saisi, qui ne se trie pas (WF-IHM-0060) et se filtre
      sur ses deux colonnes (WF-IHM-0130) : le libellé par la recherche (`search`), la nature
      — poste, lot, livrable — par `kinds`. Les filtres se combinent ; un élément est retenu
      s'il les satisfait tous, et les postes et les lots qui contiennent un élément retenu
      sont rendus pour que l'arbre reste lisible (WF-IHM-0060), sans les autres éléments
      qu'ils contiennent. Une lecture filtrée rend un compteur nul : `setWorkBreakdown` écrit
      le lotissement entier, et un renvoi tel quel, qui supprimerait ce qu'elle omet, est
      refusé par 422 (`WorkBreakdownReading`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: search
        in: query
        description: >-
          Recherche sur le libellé des postes, des lots et des livrables — le seul texte que
          chacun porte (WF-PRJ-0020) —, comparé comme toute recherche du contrat (README,
          « Une recherche… » ; WF-IHM-0130). Un élément dont
          le libellé contient le texte est retenu, non ce qu'il contient.
        schema: { type: string, minLength: 1, maxLength: 200 }
      - name: kinds
        in: query
        description: >-
          Restreint aux éléments de ces natures, la colonne de la nature filtrée (WF-IHM-0130) :
          `kinds=deliverable`, les livrables, sous leurs lots et leurs postes.
        schema:
          type: array
          items: { $ref: ../components/schemas/projects.yaml#/WorkBreakdownKind }
        explode: false
    responses:
      '200':
        description: Lotissement du projet, ou ce que les filtres en retiennent.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/WorkBreakdownReading }
            examples:
              witness: { $ref: ../../../fixtures/api/work_breakdown.json }
              default: { $ref: ../../../fixtures/api/work_breakdown_default.json }
              search: { $ref: ../../../fixtures/api/work_breakdown_search.json }
              work_packages: { $ref: ../../../fixtures/api/work_breakdown_work_packages.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
  put:
    operationId: setWorkBreakdown
    tags: [projects]
    summary: Saisir le lotissement
    description: >-
      Croise le découpage fonctionnel et le découpage produit du projet (WF-PRJ-0020). Un poste
      ou un lot que la saisie omet est supprimé : les tâches de la révision en cours qui le
      portaient restent et perdent leur rattachement ; les révisions marquées le conservent, et
      le poste ou le lot est alors marqué supprimé (WF-PLA-0170, WF-DAT-0080). Un lot que la
      saisie range sous un autre poste suit la règle du rattachement (WF-PLA-0170) : si le lot
      et son nouveau poste sont tous deux rattachés et que, dans la révision en cours, la tâche
      du lot n'est pas dans le sous-arbre de la tâche du poste, la saisie est refusée. Les
      révisions marquées n'entrent pas dans ce jugement : leurs tâches ne se déplacent plus.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/WorkBreakdown }
    responses:
      '200':
        description: Lotissement enregistré ; il ne crée aucun lien durable avec le planning (WF-PRJ-0030).
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/WorkBreakdown }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Un compteur nul, celui d'une lecture filtrée (`WorkBreakdownReading`) :
          `VALIDATION_FAILED`, `fields` désignant `/lock_version` par `VALUE_REQUIRED`.
          Un lot rangé sous un autre poste sortirait sa tâche du sous-arbre de la tâche de son
          nouveau poste dans la révision en cours, les deux étant rattachés (WF-PLA-0170) : `VALIDATION_FAILED`, `fields`
          sur le lot (`/order_items/1/work_packages/0`), motif `WORK_PACKAGE_OUTSIDE_ORDER_ITEM`,
          `fields[].params.work_package_id` nommant le lot, `order_item_node_id` et
          `work_package_node_ids` les tâches du poste et du lot.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }

/projects/{project_id}/subprojects:
  get:
    operationId: listSubprojects
    tags: [projects]
    summary: Sous-projets
    description: >-
      Les sous-projets, qui regroupent des tâches sans dupliquer l'arbre (WF-PRJ-0050), chacun
      avec ses commandes (`Subproject.available_commands`, WF-IHM-0090). Une
      table plate, triée et filtrée par le serveur sur chacune de ses colonnes (WF-IHM-0060,
      WF-IHM-0130) : la recherche porte sur le code et le libellé, la colonne des coûts réels
      se filtre par `has_actual_costs`. Sans pagination : le §4.6.2 compte dix sous-projets
      par projet.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: search
        in: query
        description: >-
          Recherche sur le code et le libellé, comparés comme toute recherche du contrat
          (README, « Une recherche… » ; WF-IHM-0130).
        schema: { type: string, minLength: 1, maxLength: 200 }
      - name: has_actual_costs
        in: query
        description: >-
          Vrai, les seuls sous-projets auxquels des coûts réels sont imputés, qui ne se
          suppriment plus ; faux, les autres (WF-PRJ-0050, WF-IHM-0130).
        schema: { type: boolean }
      - name: sort_by
        in: query
        description: >-
          Colonne du tri ; absente, le code. Le code et le libellé se comparent dans l'ordre des
          points de code Unicode ; la colonne des coûts réels range les sous-projets qui en
          portent avant les autres dans l'ordre croissant, comme l'état des comptes range les
          actifs. À égalité, l'ordre de la liste sans tri, puis l'identifiant (WF-IHM-0060).
        schema:
          type: string
          enum: [code, label, has_actual_costs]
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Sous-projets, identifiés par leur code ERP (WF-PRJ-0050).
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/projects.yaml#/Subproject }
            examples:
              witness: { $ref: ../../../fixtures/api/subprojects.json }
              by_label: { $ref: ../../../fixtures/api/subprojects_by_label.json }
              with_actual_costs: { $ref: ../../../fixtures/api/subprojects_with_actual_costs.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
  post:
    operationId: createSubproject
    summary: Créer un sous-projet
    description: >-
      Un sous-projet du projet courant (WF-PRJ-0050), par la commande `update` du projet, réservée
      à ses chefs de projet (WF-PRJ-0060). Les lignes de coût réel qui portaient déjà son code lui
      sont imputées aussitôt (WF-CRE-0020) : la réponse le dit (`has_actual_costs`).
    tags: [projects]
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/SubprojectWrite }
    responses:
      '201':
        description: Sous-projet créé.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Subproject }
            examples:
              created: { $ref: ../../../fixtures/api/subproject_created.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '409':
        description: >-
          Code déjà employé dans ce projet (WF-PRJ-0050) : `ALREADY_EXISTS`, `fields` désignant
          `/code` par `ALREADY_EXISTS`, `fields[].params.conflicting_object_id` le sous-projet qui le
          porte et `fields[].params.conflicting_object_label` son libellé, que le formulaire dit au
          champ ; ou un projet terminal (WF-CYC-0100), `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` à `project_not_terminal`. Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              code_taken: { $ref: ../../../fixtures/api/subproject_code_taken.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant chaque champ : `/code` ou `/label` vides,
          `VALUE_REQUIRED`, ou plus longs que le schéma ne l'admet, `VALUE_TOO_LONG`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }

/projects/{project_id}/subprojects/{subproject_id}:
  patch:
    operationId: updateSubproject
    summary: Modifier un sous-projet
    description: >-
      Un sous-projet du projet courant (WF-PRJ-0050), comme sa commande `update` le dit
      (`Subproject.available_commands`) : son code et son libellé, à tout moment, coûts réels
      imputés ou non.
    tags: [projects]
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/SubprojectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/SubprojectUpdate }
    responses:
      '200':
        description: Sous-projet modifié.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/Subproject }
            examples:
              updated: { $ref: ../../../fixtures/api/subproject_updated.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Code déjà employé par un autre sous-projet du projet (WF-PRJ-0050) : `ALREADY_EXISTS`,
          `fields` désignant `/code` par `ALREADY_EXISTS`, `fields[].params.conflicting_object_id`
          le sous-projet qui le porte et `fields[].params.conflicting_object_label` son libellé, que
          le formulaire dit au champ ; ou un projet terminal (WF-CYC-0100), `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` à `project_not_terminal`. Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              code_taken: { $ref: ../../../fixtures/api/subproject_code_taken.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant chaque champ : `/code` ou `/label` vides,
          `VALUE_REQUIRED`, ou plus longs que le schéma ne l'admet, `VALUE_TOO_LONG`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
  delete:
    operationId: deleteSubproject
    tags: [projects]
    summary: Supprimer un sous-projet
    description: >-
      Refusée dès qu'une révision marquée le cite (§4.4.1, décision de l'auteur du 2026-10-10,
      #634) ou qu'un coût réel lui est imputé (WF-PRJ-0050), ce que sa commande `delete` dit
      d'avance (`Subproject.available_commands`, WF-IHM-0090) ; réservée aux chefs de projet
      (WF-PRJ-0060). Un sous-projet qu'une révision marquée cite ne se supprime pas : les
      sous-projets déterminent la courbe de la valeur acquise, et sa suppression y aurait des
      effets que rien ne maîtrise ; la décision contredit le Vérif de WF-DAT-0080, dont la
      correction est en attente. Un sous-projet qu'aucune révision marquée ne cite et qu'aucun
      coût réel ne charge est retiré de la base.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/SubprojectId
    responses:
      '204':
        description: Sous-projet supprimé, retiré de la base (WF-DAT-0080).
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La commande `delete` est indisponible : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` nommant la condition qui lui manque — `subproject_not_cited`
          pour un sous-projet qu'une révision marquée cite (§4.4.1, décision de l'auteur du
          2026-10-10, #634), `subproject_without_actual_costs` pour un sous-projet auquel des coûts
          réels sont imputés (WF-PRJ-0050), `project_not_terminal` sur un projet clos
          (WF-CYC-0100). Une seule est nommée, la première qui manque dans l'ordre où la commande
          `delete` les liste : `subproject_not_cited`, puis `subproject_without_actual_costs` — la
          citation ne se lève jamais, une révision marquée étant immuable (WF-DAT-0020) —, puis
          `project_not_terminal`. Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              cited: { $ref: ../../../fixtures/api/subproject_delete_cited.json }
              refused: { $ref: ../../../fixtures/api/subproject_delete_refused.json }

/projects/{project_id}/contributors:
  get:
    operationId: listContributors
    tags: [projects]
    summary: Contributeurs du projet
    description: >-
      Chacun avec sa qualité, chef de projet ou contributeur ; la liste d'un projet
      nouvellement créé comporte son créateur, chef de projet (WF-PRJ-0060). La liste porte
      son propre compteur d'écriture, que `setContributors` exige (WF-IHM-0110).
      Une table plate, triée et filtrée par le serveur sur chacune de ses colonnes
      (WF-IHM-0060, WF-IHM-0130) : la recherche porte sur le nom du compte, la qualité se
      filtre par `kinds`, l'état du compte par `is_active` — un compte désactivé depuis
      l'inscription reste listé et signalé (WF-ADM-0060). Sans pagination : le §4.6.2
      compte cinquante contributeurs par projet. Le compteur est celui de toute la liste,
      quel que soit le tri ; une lecture filtrée le rend nul, pour qu'elle ne soit pas
      renvoyée à `setContributors`, qui écrit la liste entière et retirerait ce qu'elle omet
      (`ContributorList.lock_version`).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: search
        in: query
        description: >-
          Recherche sur le nom affiché du compte (`display_name`), la seule colonne de texte de
          la liste, comparé comme toute recherche du contrat (README, « Une recherche… » ;
          WF-IHM-0130).
        schema: { type: string, minLength: 1, maxLength: 200 }
      - name: kinds
        in: query
        description: Restreint aux contributeurs de ces qualités (WF-IHM-0130).
        schema:
          type: array
          items: { $ref: ../components/schemas/projects.yaml#/ContributorKind }
        explode: false
      - name: is_active
        in: query
        description: >-
          Vrai, les seuls contributeurs dont le compte est actif ; faux, ceux dont le compte a
          été désactivé depuis leur inscription, que la liste garde (WF-ADM-0060, WF-IHM-0130).
        schema: { type: boolean }
      - name: sort_by
        in: query
        description: >-
          Colonne du tri ; absente, les chefs de projet d'abord, puis le nom de famille et le
          prénom du compte, comme les comptes (`listUsers`). Le nom affiché se compare dans
          l'ordre des points de code Unicode ; la qualité, dans l'ordre de `ContributorKind`,
          les chefs de projet d'abord dans l'ordre croissant ; l'état du compte, les actifs
          avant les désactivés dans l'ordre croissant. À égalité, l'ordre de la liste sans tri,
          puis l'identifiant du compte (WF-IHM-0060).
        schema:
          type: string
          enum: [display_name, kind, is_active]
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Contributeurs, et le compteur de la liste.
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/ContributorList }
            examples:
              witness: { $ref: ../../../fixtures/api/contributors.json }
              by_name: { $ref: ../../../fixtures/api/contributors_by_name.json }
              search: { $ref: ../../../fixtures/api/contributors_search.json }
              inactive: { $ref: ../../../fixtures/api/contributors_inactive.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
  put:
    operationId: setContributors
    tags: [projects]
    summary: Inscrire ou retirer des contributeurs
    description: >-
      La liste, chacun avec sa qualité, vaut habilitation à consulter et à saisir sur le
      projet ; réservée aux chefs de projet (WF-PRJ-0060, WF-ADM-0110). Une liste qui ne
      garderait aucun chef de projet est refusée (409, `LAST_PROJECT_MANAGER`) ; un compte que
      l'installation n'a pas, ou un compte désactivé inscrit ou changé de qualité, l'est par 422,
      `fields` désignant le compte à sa ligne (`/contributors/<n>/user_id`) par `UNKNOWN_USER` ou
      `USER_INACTIVE` — un contributeur désactivé depuis son inscription reste dans la liste, tel
      qu'il a été lu (WF-ADM-0060). Porte le compteur de la liste
      lue, refusé par 412 s'il est périmé (WF-IHM-0110), et rend la liste avec le suivant ;
      un compteur nul, celui d'une lecture filtrée, est refusé par 422, `fields` désignant
      `/lock_version` par `VALUE_REQUIRED`.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/projects.yaml#/ContributorsWrite }
    responses:
      '200':
        description: >-
          Liste enregistrée. Une écriture rend toujours la liste entière avec son compteur
          suivant, jamais nul : `ContributorList` n'admet un compteur nul que pour une lecture
          filtrée (WF-IHM-0110).
        content:
          application/json:
            schema: { $ref: ../components/schemas/projects.yaml#/ContributorList }
            examples:
              set: { $ref: ../../../fixtures/api/contributors_set.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          La liste ne garderait aucun chef de projet (`LAST_PROJECT_MANAGER`, sans paramètre,
          WF-PRJ-0060) ; ou un projet terminal (WF-CYC-0100), `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` à `project_not_terminal`. Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              without_manager: { $ref: ../../../fixtures/api/contributors_without_manager_refused.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant chaque refus : un compte que l'installation n'a
          pas, `/contributors/<n>/user_id` par `UNKNOWN_USER` ; un compte désactivé inscrit ou
          changé de qualité, `/contributors/<n>/user_id` par `USER_INACTIVE` (WF-ADM-0060) ; un
          compteur nul, celui d'une lecture filtrée, `/lock_version` par `VALUE_REQUIRED`
          (WF-IHM-0110). Rien n'est écrit.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              accounts_refused: { $ref: ../../../fixtures/api/contributors_accounts_refused.json }

/projects/{project_id}/contributors/suggestions:
  get:
    operationId: listContributorSuggestions
    tags: [projects]
    summary: Contributeurs proposés
    description: >-
      Les comptes actifs rattachés aux nœuds d'organisation des rôles de ressources employés par
      les lignes de devis du projet — celles de sa révision en cours, ou de sa dernière révision
      marquée quand il n'en a pas —, que la liste des contributeurs ne compte pas encore
      (WF-PRJ-0070, WF-ADM-0060) ; chacun nomme son nœud et les rôles qui le font proposer. Jamais
      inscrits sans confirmation : la liste s'écrit par `setContributors`.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: Propositions.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/projects.yaml#/ContributorSuggestion }
            examples:
              witness: { $ref: ../../../fixtures/api/contributor_suggestions.json }
              none: { $ref: ../../../fixtures/api/contributor_suggestions_empty.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }

/projects/{project_id}/timelines:
  get:
    operationId: listTimelines
    tags: [planning]
    summary: Chronologies du projet
    description: Chronologies nommées, auxquelles des tâches sont inscrites (WF-PLA-0140).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: Chronologies.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/revisions.yaml#/Timeline }
            examples:
              witness: { $ref: ../../../fixtures/api/timelines.json }
              none: { $ref: ../../../fixtures/api/timelines_empty.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
  post:
    operationId: createTimeline
    summary: Créer une chronologie
    description: >-
      Une chronologie nommée, qui date un jeu de tâches sans toucher aux autres
      (WF-PLA-0140).
    tags: [planning]
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [label]
            properties:
              label: { type: string, minLength: 1, maxLength: 200 }
    responses:
      '201':
        description: Chronologie créée.
        content:
          application/json:
            schema: { $ref: ../components/schemas/revisions.yaml#/Timeline }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }

/projects/{project_id}/timelines/{timeline_id}:
  delete:
    operationId: deleteTimeline
    summary: Supprimer une chronologie
    description: >-
      Retire la chronologie ; les tâches conservent leurs dates courantes (WF-PLA-0140).
    tags: [planning]
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/TimelineId
    responses:
      '204':
        description: Chronologie supprimée ; les inscriptions le sont avec elle.
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
