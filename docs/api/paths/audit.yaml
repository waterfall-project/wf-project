/audit-events:
  get:
    operationId: listAuditEvents
    tags: [audit]
    summary: Audit log
    description: >-
      The consultation of the audit log (WF-ADM-0190): its entries, each with its date, its
      author, its action, the object concerned and the project if there is one (WF-SEC-0030):
      the irreversible or structuring actions, of all projects and of the platform. The log
      is kept as long as the projects: that of a project completed years ago reads like that
      of a project in progress, through the same filter. It is read only here: no operation
      writes, modifies or deletes an entry, which only the action itself produces, and a
      restore does not lose it: its entries absent from the restored log are read back before
      the databases are replaced and rewritten after, and the entry of the restore is written
      once the restore is done (WF-ADM-0160, #539). The
      filters combine (WF-IHM-0130), the search (`search`) bearing on the label of the object
      that the entry keeps, and the five filters of WF-ADM-0190 are the period (`from`,
      `to`), the author (`user_id`, `actor_kind`), the action (`actions`), the project
      (`project_id`) and the object (`object_kind`, `object_id`); a flat table, sortable on
      each of its columns — the date, the author, the action, the kind of the object, its
      label, the project and the correlation (WF-IHM-0060): without a sort, by date, the most
      recent first, two entries of the same instant in the order they were written, reversed
      in descending order; two entries that another column ties, in this unsorted order, then
      by their identifier. The server paginates. The authors and projects that the log names
      are read through `listAuditFacets`. Readable under the sole permission to view the log
      (`audit_log.read`, WF-ADM-0100, WF-ADM-0190), without a contributor condition and
      without any project being open — the path names none —, which opens the whole log: a
      project is named in it by its code and its label, whether or not the caller is a
      contributor to it; the entry leads only to a project the caller can open (WF-ADM-0110),
      which the server states for them (`AuditProject.can_open`), and only to an object they
      can view; a project that no longer exists — created after the backup that a restore put
      back in place — is named likewise, without leading to it (WF-ADM-0190).
    parameters:
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - name: from
        in: query
        description: Retains the entries made at this instant or after it.
        schema: { $ref: ../components/common.yaml#/Timestamp }
      - name: to
        in: query
        description: Retains the entries made before this instant, excluded.
        schema: { $ref: ../components/common.yaml#/Timestamp }
      - name: user_id
        in: query
        description: >-
          Retains the entries whose author is this account, deactivated included
          (WF-ADM-0060).
        schema: { $ref: ../components/common.yaml#/Uuid }
      - name: actor_kind
        in: query
        description: >-
          Retains the entries of an account (`user`) or of the platform (`platform`); when
          absent, both.
        schema: { $ref: ../components/schemas/audit.yaml#/AuditActorKind }
      - name: actions
        in: query
        description: Retains the entries of these actions; when absent, all.
        schema:
          type: array
          minItems: 1
          items: { $ref: ../components/schemas/audit.yaml#/AuditAction }
        explode: false
      - name: project_id
        in: query
        description: >-
          Retains the entries of this project; a project that no entry names retains nothing,
          whether it still exists or not.
        schema: { $ref: ../components/common.yaml#/Uuid }
      - name: object_kind
        in: query
        description: Retains the entries whose object is of this kind.
        schema: { $ref: ../components/schemas/audit.yaml#/AuditObjectKind }
      - name: object_id
        in: query
        description: >-
          Retains the entries of this object — the history of a revision, of a cost line, of
          an account.
        schema: { $ref: ../components/common.yaml#/Uuid }
      - $ref: ../components/parameters.yaml#/Search
      - name: correlation_id
        in: query
        description: >-
          Retains the entries of this request, or of the background task it triggered: all
          those of a single action, such as the merge of a differential, with the marking and
          the designation it produces (WF-OBS-0020, WF-IHM-0130). A correlation that the log
          does not carry retains nothing.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
      - name: sort_by
        in: query
        description: >-
          Sort column; when absent, the date. The columns of the log that can be sorted
          (WF-IHM-0060): the date; the author, by their display name, in ascending order an
          anonymised account, which no longer has one, after the names, and the platform, which
          has none, after the accounts; the action and the kind of the object, in the order of
          their enumeration (`AuditAction`, the one in which WF-SEC-0030 names them, and
          `AuditObjectKind`) — the API does not return their label, which the front chooses in
          the reader's language (WF-ARC-0110), and does not sort by it —; the label of the
          object that the entry keeps, an object without a label — a backup, an anonymised
          account — after the others in ascending order; the project, by its code, an entry
          without a project or whose project had no code after the others in ascending order;
          the correlation. Texts are compared character by character in the order of the
          Unicode code points.
        schema:
          type: string
          enum: [occurred_at, actor, action, object_kind, object_label, project, correlation_id]
      - name: sort_order
        in: query
        description: >-
          Sort direction; when absent, descending for the date — the most recent entries
          first —, ascending for any other column.
        schema: { $ref: ../components/common.yaml#/SortOrder }
    responses:
      '200':
        description: Entries retained, one page, and their count.
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/audit.yaml#/AuditEvent }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/audit_events.json }
              page: { $ref: ../../../fixtures/api/audit_events_page.json }
              project: { $ref: ../../../fixtures/api/audit_events_project.json }
              exited: { $ref: ../../../fixtures/api/audit_events_exited.json }
              import_applied: { $ref: ../../../fixtures/api/audit_events_import_applied.json }
              revision_abandoned: { $ref: ../../../fixtures/api/audit_events_revision_abandoned.json }
              empty: { $ref: ../../../fixtures/api/audit_events_empty.json }
              by_actor: { $ref: ../../../fixtures/api/audit_events_by_actor.json }
              by_object_label: { $ref: ../../../fixtures/api/audit_events_by_object_label.json }
              correlation: { $ref: ../../../fixtures/api/audit_events_correlation.json }
              search: { $ref: ../../../fixtures/api/audit_events_search.json }
              anonymized_object: { $ref: ../../../fixtures/api/audit_events_anonymized_object.json }
              anonymized_actor: { $ref: ../../../fixtures/api/audit_events_anonymized_actor.json }
              administration: { $ref: ../../../fixtures/api/audit_events_administration.json }
              restored: { $ref: ../../../fixtures/api/audit_events_restored.json }
              auditor: { $ref: ../../../fixtures/api/audit_events_auditor.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          `VALIDATION_FAILED`: a period whose end precedes its start, designated in `fields`
          (`/query/to`, `VALUE_OUT_OF_RANGE`, `params.minimum` the given start, the rule of every
          period of the contract); a malformed instant, `/query/from` or `/query/to` by
          `DATE_INVALID`. No empty list stands in for a refusal.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              period_inverted: { $ref: ../../../fixtures/api/audit_events_period_inverted.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/audit-events/facets:
  get:
    operationId: listAuditFacets
    tags: [audit]
    summary: Authors and projects of the audit log
    description: >-
      The accounts and projects that the whole audit log names, each once, to choose the
      author and the project in the filters of the log (WF-SEC-0030, WF-ADM-0190,
      WF-IHM-0130): the accounts that authored at least one entry, deactivated included
      (WF-ADM-0060), and the projects of at least one entry, whether or not the caller can
      view them. The whole log, whatever the filters of `listAuditEvents`, which the operation
      does not take: a list of choices does not empty itself as the other filters change.
      Readable under the sole permission to view the log (`audit_log.read`), without a
      contributor condition or an open project: a read-only function has only the permission
      to view (WF-ADM-0100, WF-ADM-0190), and an auditor who reads neither the accounts nor
      all the projects thus filters the log by author and by project. Without pagination:
      there are at most as many authors as accounts and as many projects as the installation
      keeps, that is at most 500 accounts and 600 projects kept over twenty years at the
      volumes of §4.6.2 — a response of the order of a hundred kilobytes, when a page of 50
      entries weighs about twenty.
    responses:
      '200':
        description: Authors and projects of the log.
        content:
          application/json:
            schema: { $ref: ../components/schemas/audit.yaml#/AuditFacets }
            examples:
              witness: { $ref: ../../../fixtures/api/audit_facets.json }
              anonymized: { $ref: ../../../fixtures/api/audit_facets_anonymized.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
