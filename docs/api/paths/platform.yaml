/backups:
  get:
    operationId: listBackups
    tags: [platform]
    summary: Backups
    description: >-
      Date, size and verification result of each backup (WF-ADM-0150), its origin and its
      mark to keep (WF-ADM-0170), and the commands the caller can exercise on it, available or
      not (`available_commands`, WF-IHM-0090). A flat table, each of whose columns can be
      filtered (WF-IHM-0130) — the date by a period (`from`, `to`), the origin (`origins`),
      the verification (`verifications`), the mark (`is_retained`), the size by its bounds
      (`size_bytes_min`, `size_bytes_max`) —, the filters combining, and sorted (`sort_by`,
      WF-IHM-0060); without a sort, by date, most recent first. The server paginates;
      `meta.total` counts the backups retained. Readable under the permission to view the
      backups (`backups.read`, WF-ADM-0100).
    parameters:
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - name: from
        in: query
        description: Retains the backups taken at this instant or after it (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Timestamp }
      - name: to
        in: query
        description: >-
          Retains the backups taken before this instant, excluded. Earlier than `from`, it is
          refused with 422.
        schema: { $ref: ../components/common.yaml#/Timestamp }
      - name: origins
        in: query
        description: >-
          Retains the backups of these origins, manual or scheduled; when absent, both
          (WF-IHM-0130).
        schema:
          type: array
          minItems: 1
          items: { $ref: ../components/schemas/platform.yaml#/BackupOrigin }
        explode: false
      - name: verifications
        in: query
        description: >-
          Retains the backups whose verification has this outcome, pending, succeeded or
          failed; when absent, all of them (WF-ADM-0150, WF-IHM-0130).
        schema:
          type: array
          minItems: 1
          items: { $ref: ../components/schemas/platform.yaml#/BackupVerification }
        explode: false
      - name: is_retained
        in: query
        description: >-
          Retains the backups marked to keep (true), or those the rotation will delete in their
          turn (false); when absent, all of them (WF-ADM-0170, WF-IHM-0130).
        schema: { type: boolean }
      - name: size_bytes_min
        in: query
        description: >-
          Lower bound, inclusive, of the size in bytes: retains the backups at least as heavy
          (WF-IHM-0130).
        schema: { type: integer, minimum: 0 }
      - name: size_bytes_max
        in: query
        description: >-
          Upper bound, inclusive, of the size in bytes: retains the backups that are no heavier
          (WF-IHM-0130). Lower than `size_bytes_min`, it is refused with 422.
        schema: { type: integer, minimum: 0 }
      - name: sort_by
        in: query
        description: >-
          Sort column; when absent, the date. The sortable columns (WF-IHM-0060): the date;
          the size; the verification and the origin, in the order of their enumeration
          (`BackupVerification`, `BackupOrigin`) — the API does not return their label, which
          the front chooses in the reader's language (WF-ARC-0110), and does not sort by it —;
          the mark, the backups marked to keep first in ascending order, as the account status
          ranks the active ones. A tie is broken by the order of the unsorted list — the date,
          most recent first —, then by the identifier.
        schema:
          type: string
          enum: [taken_at, size_bytes, verification, origin, is_retained]
      - name: sort_order
        in: query
        description: >-
          Sort direction; when absent, descending for the date — the most recent backups
          first —, ascending for any other column.
        schema: { $ref: ../components/common.yaml#/SortOrder }
    responses:
      '200':
        description: List of the backups.
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/platform.yaml#/Backup }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/backups.json }
              empty: { $ref: ../../../fixtures/api/backups_empty.json }
              beyond: { $ref: ../../../fixtures/api/backups_beyond.json }
              reader: { $ref: ../../../fixtures/api/backups_reader.json }
              during_backup: { $ref: ../../../fixtures/api/backups_during_backup.json }
              manual: { $ref: ../../../fixtures/api/backups_manual.json }
              retained: { $ref: ../../../fixtures/api/backups_retained.json }
              period: { $ref: ../../../fixtures/api/backups_period.json }
              by_size: { $ref: ../../../fixtures/api/backups_by_size.json }
              unverified: { $ref: ../../../fixtures/api/backups_unverified.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          A period refused under the rule of every period of the contract (WF-IHM-0130): an end
          that precedes the start, `VALIDATION_FAILED`, `fields[]` designating `/query/to` by
          `VALUE_OUT_OF_RANGE`, `params.minimum` the given start; a malformed start or end,
          `/query/from` or `/query/to` by `DATE_INVALID`. A malformed bound of the size,
          `/query/<bound>` by `NUMBER_INVALID`; `size_bytes_max` lower than `size_bytes_min`,
          `/query/size_bytes_max` by `VALUE_OUT_OF_RANGE`, `params.minimum` the given lower
          bound.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              period_inverted: { $ref: ../../../fixtures/api/backups_period_inverted.json }
              bounds_inverted: { $ref: ../../../fixtures/api/backups_bounds_inverted.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  post:
    operationId: startBackup
    tags: [platform]
    summary: Start a backup
    description: >-
      Full backup of the platform's two databases, Waterfall's and the identity provider's —
      federated accounts and settings included —, each in a consistent state, the audit log
      included, backed up with Waterfall's database (WF-SEC-0030); the archive is verified
      after it is produced, and the backup appears in the list with the result of its
      verification (WF-ADM-0150). Handed to the worker (WF-ARC-0090), which records it in the
      audit log. Only one at a time: a backup or a restore already running gets it refused
      with 409. A backup runs from its queuing to the production of the file; the verification
      that follows prevents nothing, and a backup awaiting verification (`backup_pending`)
      lets another one be started. Under the permission to modify the backups
      (`backups.write`, WF-ADM-0100).
    responses:
      '202':
        description: Backup queued.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              queued: { $ref: ../../../fixtures/api/task_backup_queued.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '409':
        description: >-
          A backup or a restore is already running: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` naming `no_backup_running` or `no_restore_running`; nothing
          is queued. Two backups at once would read the same database for nothing, and a backup
          taken during a restore would be of no consistent state (WF-ADM-0150, WF-ADM-0160).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              backup_running: { $ref: ../../../fixtures/api/backup_start_refused.json }
              restore_running: { $ref: ../../../fixtures/api/backup_start_during_restore_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/backups/{backup_id}:
  get:
    operationId: getBackup
    summary: A backup
    description: >-
      State, date and size of a backup (WF-ADM-0150), and the commands the caller can
      exercise on it (`available_commands`, WF-IHM-0090). Readable under the permission to
      view the backups (`backups.read`, WF-ADM-0100).
    tags: [platform]
    parameters:
      - $ref: ../components/parameters.yaml#/BackupId
    responses:
      '200':
        description: Backup.
        content:
          application/json:
            schema: { $ref: ../components/schemas/platform.yaml#/Backup }
            examples:
              witness: { $ref: ../../../fixtures/api/backup.json }
              pending: { $ref: ../../../fixtures/api/backup_pending.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  patch:
    operationId: retainBackup
    tags: [platform]
    summary: Mark a backup to keep
    description: >-
      A marked backup escapes the rotation (WF-ADM-0170). The backup carries whichever of the
      two commands changes its mark, `retain` or `release` (`BackupCommand`, WF-IHM-0090),
      unavailable while a restore is running. Under the permission to modify the backups
      (`backups.write`, WF-ADM-0100).
    parameters:
      - $ref: ../components/parameters.yaml#/BackupId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/platform.yaml#/BackupRetain }
    responses:
      '200':
        description: Mark recorded.
        content:
          application/json:
            schema: { $ref: ../components/schemas/platform.yaml#/Backup }
            examples:
              retained: { $ref: ../../../fixtures/api/backup_retained.json }
              released: { $ref: ../../../fixtures/api/backup_released.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          A restore is running, which replaces the database where the mark would be written:
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` naming `no_restore_running`;
          nothing is written (WF-ADM-0160).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              restore_running: { $ref: ../../../fixtures/api/backup_retain_refused.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/backups/{backup_id}/content:
  get:
    operationId: downloadBackup
    tags: [platform]
    summary: Copy a backup outside the platform
    description: >-
      The copy outside the platform is what protects against a loss of the platform
      (WF-ADM-0150): the archive as the object storage keeps it, returned as a stream. It
      carries both databases in full, the identity provider's accounts and settings included:
      under the permission to view the backups and the permission to modify them
      (`backups.read`, `backups.write`, WF-ADM-0100). Only a verified backup can be
      downloaded, as its `download` command says in advance (`BackupCommand`, WF-IHM-0090);
      the file comes named and sized, as an attachment.
    parameters:
      - $ref: ../components/parameters.yaml#/BackupId
    responses:
      '200':
        description: >-
          Content of the backup, as a named attachment, of the length it states. The archive
          carries the instant of its backup (`Backup.taken_at`), which the upload of a restore
          reads back (`uploadFile`, WF-ADM-0160).
        headers:
          Content-Disposition:
            required: true
            description: >-
              `attachment`, and the name the server gives the file (`filename`):
              `waterfall-backup-`, the instant of the backup in universal time without
              separators (`20260603T010000Z` for `2026-06-03T01:00:00Z`), and the extension of
              its archive, which operations set. A name in ASCII, which a workstation saves as
              is, and which `filename*` (RFC 8187) need not repeat (RFC 6266).
            schema: { type: string }
            examples:
              night:
                summary: >-
                  The name of the scheduled backup of the night of 3 June 2026, taken at one
                  o'clock universal time (WF-ADM-0150).
                value: 'attachment; filename="waterfall-backup-20260603T010000Z.tar"'
          Content-Length:
            required: true
            description: >-
              The length of the file, in bytes: `Backup.size_bytes`, the body transmitted as it
              is stored, without any encoding that would change its length, so that the
              workstation can show the progress of the download (WF-ADM-0150). No example: the
              fake back would replay the length from the list on a body of a few bytes, and the
              front's route that relays the download copies the header.
            schema: { type: integer, minimum: 0 }
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          A backup whose verification has not succeeded, pending or failed:
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` naming `backup_verified`; nothing
          is transmitted (WF-ADM-0150).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              unverified: { $ref: ../../../fixtures/api/backup_download_refused.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/backup-schedule:
  get:
    operationId: getBackupSchedule
    tags: [platform]
    summary: Scheduling and retention of the backups
    description: >-
      Frequency, time and number of backups kept, and the automatic copy of each scheduled
      backup to an external location declared by the installation (WF-ADM-0170). A new
      installation reads the shipped schedule, daily (`BackupSchedule`, WF-EXP-0050): the 404
      only means the read is refused. Readable under the permission to view the backups
      (`backups.read`, WF-ADM-0100). A restore does not change it: it keeps it, like the list
      of backups (`startRestore`, #1742).
    responses:
      '200':
        description: Current schedule (WF-ADM-0170).
        content:
          application/json:
            schema: { $ref: ../components/schemas/platform.yaml#/BackupSchedule }
            examples:
              witness: { $ref: ../../../fixtures/api/backup_schedule.json }
              weekly: { $ref: ../../../fixtures/api/backup_schedule_weekly.json }
              disabled: { $ref: ../../../fixtures/api/backup_schedule_disabled.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
  put:
    operationId: setBackupSchedule
    tags: [platform]
    summary: Set the scheduling and the retention
    description: >-
      Frequency, time and retention, all three required, the day for a weekly schedule only
      (WF-ADM-0170). Beyond the number kept, the oldest unmarked backups, manual or scheduled,
      are deleted; those marked to keep are neither counted nor deleted. The external copy, if
      set, names a location the installation declares and a relative folder in that location,
      and keeps at least as many copies as the platform keeps backups (WF-EXP-0050). A
      failure, of the backup or of its copy, is reported on the status screen (WF-ADM-0170,
      WF-OBS-0030). Under the permission to modify the backups (`backups.write`, WF-ADM-0100).
      Refused while a restore is running, like any other write to the backups
      (`startRestore`): the restore keeps the schedule, the retention and the external copy,
      which it reads back before the databases are replaced and rewrites after, and a setting
      made in the meantime would be lost (WF-ADM-0160, WF-EXP-0040; author's decision of
      2026-11-01, #1742).
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/platform.yaml#/BackupSchedule }
    responses:
      '200':
        description: Schedule recorded.
        content:
          application/json:
            schema: { $ref: ../components/schemas/platform.yaml#/BackupSchedule }
            examples:
              set: { $ref: ../../../fixtures/api/backup_schedule_set.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '409':
        description: >-
          A restore is running, which reads the schedule back before replacing the databases
          and rewrites it after: `STATE_FORBIDS_OPERATION`, `params.missing_condition` naming
          `no_restore_running`; nothing is written (WF-ADM-0160, WF-EXP-0040).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              restore_running: { $ref: ../../../fixtures/api/backup_schedule_refused_during_restore.json }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          A refused schedule, `VALIDATION_FAILED`, `fields` designating each faulty field: a
          retention outside 1 to 365, on the platform (`/retained_count`) or on the location
          (`/external_copy/retained_count`), or a day outside 1 to 7 (`/weekday`),
          `VALUE_OUT_OF_RANGE`, `params.minimum` or `maximum` the only bound crossed
          (WF-ADM-0170); a null day for a weekly schedule, `/weekday` by `VALUE_REQUIRED`, or
          one given to a daily schedule, `/weekday` with the reason `VALIDATION_FAILED`; and,
          for the external copy, a location the installation does not declare
          (`/external_copy/location`, `UNKNOWN_EXTERNAL_BACKUP_LOCATION`), a path that is not
          relative or that leaves the folder (`/external_copy/path`, `PATH_INVALID`), a
          retention lower than the platform's (`/external_copy/retained_count`,
          `VALUE_OUT_OF_RANGE`, `params.minimum`, WF-EXP-0050).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              unknown_location: { $ref: ../../../fixtures/api/backup_schedule_unknown_location.json }
              path_invalid: { $ref: ../../../fixtures/api/backup_schedule_path_invalid.json }
              retention_too_short: { $ref: ../../../fixtures/api/backup_schedule_retention_too_short.json }
              retention_out_of_range: { $ref: ../../../fixtures/api/backup_schedule_retention_out_of_range.json }
              weekday_out_of_range: { $ref: ../../../fixtures/api/backup_schedule_weekday_out_of_range.json }
              weekday_missing: { $ref: ../../../fixtures/api/backup_schedule_weekday_missing.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/external-backup-locations:
  get:
    operationId: listExternalBackupLocations
    tags: [platform]
    summary: External backup locations
    description: >-
      The locations to which a scheduled backup can be copied automatically (WF-ADM-0170), as
      the installation declares them in its deployment configuration, in the order of their
      names: their name, their kind and their description, never their credentials nor any
      secret. Only the server reaches them. No operation creates or modifies them: declaring
      them is a matter for operations. Readable under the permission to view the backups
      (`backups.read`, WF-ADM-0100).
    responses:
      '200':
        description: Declared locations; an empty list when the installation declares none.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/platform.yaml#/ExternalBackupLocation }
            examples:
              witness: { $ref: ../../../fixtures/api/external_backup_locations.json }
              none: { $ref: ../../../fixtures/api/external_backup_locations_none.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/external-backup-locations/{location_name}/test:
  post:
    operationId: testExternalBackupLocation
    tags: [platform]
    summary: Test an external backup location
    description: >-
      The server writes then erases a witness file in the location, at its root or in the
      given folder, with the credentials of the configuration, and returns the outcome:
      succeeded, or the reason for the failure, as a code (WF-ADM-0170, WF-ARC-0110). Nothing
      is kept: the test has no state, and a failure is not an alert, which only a scheduled
      copy triggers (WF-OBS-0030). The test waits for a location that does not answer for
      thirty seconds at most, and reports exceeding them as a failure (`timed_out`). Under the
      permission to modify the backups (`backups.write`, WF-ADM-0100).
    parameters:
      - $ref: ../components/parameters.yaml#/ExternalBackupLocationName
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: ../components/schemas/platform.yaml#/ExternalBackupLocationTestRequest }
    responses:
      '200':
        description: Outcome of the test, succeeded or not.
        content:
          application/json:
            schema: { $ref: ../components/schemas/platform.yaml#/ExternalBackupLocationTest }
            examples:
              succeeded: { $ref: ../../../fixtures/api/external_backup_location_tested.json }
              access_denied: { $ref: ../../../fixtures/api/external_backup_location_test_failed.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404':
        description: >-
          A location the installation does not declare, or reading the backups refused,
          without distinction (WF-ADM-0110).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
      '422':
        description: >-
          A folder that is not relative or that leaves the location: `VALIDATION_FAILED`,
          `fields` designating `/path` by `PATH_INVALID`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              path_invalid: { $ref: ../../../fixtures/api/external_backup_location_test_path_invalid.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/restores:
  post:
    operationId: startRestore
    tags: [platform]
    summary: Restore the platform
    description: >-
      Replaces the whole of the platform's two databases, Waterfall and identity provider, with
      their backed-up content, and is applied only after confirmation (WF-ADM-0160,
      WF-DAT-0130). Never applies to a single project. The audit log stays in place, and the
      restore is recorded in it (WF-ADM-0160, WF-SEC-0030). Under the permission to restore
      the platform (`platform_restore`). A backup from the list is restored as its `restore`
      command says in advance (`BackupCommand`, WF-IHM-0090): verified, and no backup or
      restore in progress — otherwise 409. An archive from a version more recent than the
      installation is refused by the task, not by this request, which does not read the
      archive: the task fails (`BackgroundTaskRef.problem`, `BACKUP_FROM_NEWER_VERSION`,
      `params.backup_version` and `params.installed_version`) before the switch to
      maintenance, hence without any session being closed or anything written. An uploaded
      backup is verified only here, by the restore itself, before the switch to maintenance —
      the verification a backup from the list has passed after it was produced (WF-ADM-0150),
      which also confirms the instant the upload read (`backup_taken_at`): an archive that
      does not pass it makes the task fail (`failed`), its `problem` set to
      `STATE_FORBIDS_OPERATION`, `params.missing_condition` set to `backup_verified`, like an
      unverified backup from the list; no session is closed, no database replaced. The upload
      that an accepted restore designates is kept until the end of its task, even beyond its
      day (WF-DAT-0120). The task (`BackgroundTaskRef.kind` set to `restore`) then puts the
      platform in maintenance: all sessions are closed and the API answers 503
      `COMPONENT_UNAVAILABLE` until the end of the restore — databases recreated, migrations
      later than the backup applied, caches emptied —; the maintenance is lifted only once the
      task has moved to `succeeded` and the restore has been recorded, and an interrupted
      restore resumes from the start (WF-ARC-0090). During the maintenance, the task cannot be
      read: `getLiveness` reports the maintenance and its lifting (#604). The confirmation
      names the date of the backup: `acknowledged_backup_taken_at` is that of the designated
      backup — the one the list gives (`Backup.taken_at`), or, for an uploaded backup, the one
      the upload read in its manifest (`FileUpload.backup_taken_at`) —, and another date is a
      confirmation that does not name it, refused with 400 `CONFIRMATION_REQUIRED`; an unknown
      backup or upload, 404; a restore already queued or in progress, or a backup from the
      list whose `restore` command says it is unavailable, 409 `STATE_FORBIDS_OPERATION`.
      While a restore is running, from its queuing to the switch to maintenance, every other
      write to the backups is likewise refused with 409 — starting one (`startBackup`),
      marking one (`retainBackup`), setting their schedule (`setBackupSchedule`), restoring
      another —; downloading a verified backup (`downloadBackup`) remains possible. The
      restored tasks still queued or in progress fail with `TASK_INTERRUPTED_BY_RESTORE`,
      without resuming (#892), except those the restore keeps — its own, those of the backups
      —, which resume the kept state (#987); the list of backups and the audit log keep what
      they held before the restore (#893, #894), and likewise the schedule, the retention and
      the external copy that govern the list, read back before the databases are replaced and
      rewritten after: `getBackupSchedule` reads, after the restore, the schedule from before
      (WF-ADM-0160; author's decision of 2026-11-01, #1742). The identity provider's realm
      keeps the configuration of the installation that restores — its clients and its
      addresses —; its accounts and their passwords are those of the backup (#955).
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/platform.yaml#/RestoreRequest }
    responses:
      '202':
        description: Restore queued.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              queued: { $ref: ../../../fixtures/api/task_restore_queued.json }
      '400':
        description: >-
          Malformed request (`MALFORMED_REQUEST`), or an unconfirmed restore
          (`CONFIRMATION_REQUIRED`, WF-ADM-0160): `confirmed` absent or false, or a confirmation
          that does not name the date of the designated backup, from the list
          (`Backup.taken_at`) or uploaded (`FileUpload.backup_taken_at`) — the confirmation is
          a single thing. Nothing is queued.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              confirmation_mismatch: { $ref: ../../../fixtures/api/restore_confirmation_mismatch.json }
              external_date_mismatch: { $ref: ../../../fixtures/api/restore_external_date_mismatch.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404':
        description: >-
          A backup the list does not have (`backup_id`), or that the caller cannot read for
          lack of the permission to view the backups, or an unknown or expired upload
          (`external_backup_upload_id`) — an upload lives only one day (WF-DAT-0120) —:
          `NOT_FOUND`, without parameters or `fields`, as for opening an import (`openImport`);
          the refusal does not distinguish the unknown object from the vanished object nor from
          the object the caller does not see (WF-ADM-0110). Nothing is queued.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              upload_expired: { $ref: ../../../fixtures/api/restore_not_found.json }
      '409':
        description: >-
          A state that forbids the restore: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` naming the condition that the backup's `restore` command
          reported as missing (`BackupCommand`) — `backup_verified`, the designated backup not
          being verified, pending or failed (WF-ADM-0150); `no_backup_running`, a backup
          running; `no_restore_running`, a restore already queued or in progress (WF-ADM-0160).
          Nothing is queued.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              backup_running: { $ref: ../../../fixtures/api/restore_during_backup_refused.json }
              unverified: { $ref: ../../../fixtures/api/restore_unverified_refused.json }
              restore_running: { $ref: ../../../fixtures/api/restore_during_restore_refused.json }
      '422':
        description: >-
          An upload that was not made for a restore — the file of an import
          (`FileUploadPurpose`) —: `VALIDATION_FAILED`, `fields` designating
          `/external_backup_upload_id` by `UPLOAD_PURPOSE_MISMATCH`, alone: the date is compared
          only with a backup upload, the upload of an import having none (`backup_taken_at`
          null). A request that designates two backups, from the list and uploaded,
          `/external_backup_upload_id` with the reason `VALIDATION_FAILED`; one that designates
          none, `/backup_id` by `VALUE_REQUIRED` (`RestoreRequest`). Nothing is queued.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              purpose_mismatch: { $ref: ../../../fixtures/api/restore_upload_purpose_mismatch.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
