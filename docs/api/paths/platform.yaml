/backups:
  get:
    operationId: listBackups
    tags: [platform]
    summary: Sauvegardes
    description: >-
      Date, taille et résultat de vérification de chaque sauvegarde (WF-ADM-0150), son origine
      et son marquage à conserver (WF-ADM-0170), et les commandes que l'appelant peut exercer sur
      elle, disponibles ou non (`available_commands`, WF-IHM-0090). Une table plate, dont chaque
      colonne se filtre (WF-IHM-0130) — la date par une période (`from`, `to`), l'origine
      (`origins`), la vérification (`verifications`), le marquage (`is_retained`), la taille par
      ses bornes (`size_bytes_min`, `size_bytes_max`) —, les filtres se combinant, et se trie
      (`sort_by`, WF-IHM-0060) ; sans tri, par date, les plus récentes d'abord. Le serveur
      pagine ; `meta.total` compte les sauvegardes retenues. Lisible sous la permission de
      consulter les sauvegardes (`backups.read`, WF-ADM-0100).
    parameters:
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - name: from
        in: query
        description: Retient les sauvegardes prises à cet instant ou après lui (WF-IHM-0130).
        schema: { $ref: ../components/common.yaml#/Timestamp }
      - name: to
        in: query
        description: >-
          Retient les sauvegardes prises avant cet instant, exclu. Antérieur à `from`, il est
          refusé par 422.
        schema: { $ref: ../components/common.yaml#/Timestamp }
      - name: origins
        in: query
        description: >-
          Retient les sauvegardes de ces origines, manuelles ou planifiées ; absent, les deux
          (WF-IHM-0130).
        schema:
          type: array
          minItems: 1
          items: { $ref: ../components/schemas/platform.yaml#/BackupOrigin }
        explode: false
      - name: verifications
        in: query
        description: >-
          Retient les sauvegardes dont la vérification a cette issue, en attente, réussie ou
          échouée ; absent, toutes (WF-ADM-0150, WF-IHM-0130).
        schema:
          type: array
          minItems: 1
          items: { $ref: ../components/schemas/platform.yaml#/BackupVerification }
        explode: false
      - name: is_retained
        in: query
        description: >-
          Retient les sauvegardes marquées à conserver (vrai), ou celles que la rotation
          supprimera à leur tour (faux) ; absent, toutes (WF-ADM-0170, WF-IHM-0130).
        schema: { type: boolean }
      - name: size_bytes_min
        in: query
        description: >-
          Borne inférieure, incluse, de la taille en octets : retient les sauvegardes au moins
          aussi lourdes (WF-IHM-0130).
        schema: { type: integer, minimum: 0 }
      - name: size_bytes_max
        in: query
        description: >-
          Borne supérieure, incluse, de la taille en octets : retient les sauvegardes qui ne
          sont pas plus lourdes (WF-IHM-0130). Inférieure à `size_bytes_min`, elle est refusée
          par 422.
        schema: { type: integer, minimum: 0 }
      - name: sort_by
        in: query
        description: >-
          Colonne du tri ; absente, la date. Les colonnes qui se trient (WF-IHM-0060) : la
          date ; la taille ; la vérification et l'origine, dans l'ordre de leur énumération
          (`BackupVerification`, `BackupOrigin`) — l'API ne rend pas leur libellé, que le front
          choisit dans la langue du lecteur (WF-ARC-0110), et ne trie pas par lui — ; le
          marquage, les sauvegardes marquées à conserver d'abord dans l'ordre croissant, comme
          l'état des comptes range les actifs. Une égalité se départage par l'ordre de la liste
          sans tri — la date, les plus récentes d'abord —, puis par l'identifiant.
        schema:
          type: string
          enum: [taken_at, size_bytes, verification, origin, is_retained]
      - name: sort_order
        in: query
        description: >-
          Sens du tri ; absent, décroissant pour la date — les sauvegardes les plus récentes
          d'abord —, croissant pour toute autre colonne.
        schema: { $ref: ../components/common.yaml#/SortOrder }
    responses:
      '200':
        description: Liste des sauvegardes.
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/platform.yaml#/Backup }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/backups.json }
              empty: { $ref: ../../../fixtures/api/backups_empty.json }
              beyond: { $ref: ../../../fixtures/api/backups_beyond.json }
              reader: { $ref: ../../../fixtures/api/backups_reader.json }
              during_backup: { $ref: ../../../fixtures/api/backups_during_backup.json }
              manual: { $ref: ../../../fixtures/api/backups_manual.json }
              retained: { $ref: ../../../fixtures/api/backups_retained.json }
              period: { $ref: ../../../fixtures/api/backups_period.json }
              by_size: { $ref: ../../../fixtures/api/backups_by_size.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          Une période refusée selon la règle de toute période du contrat (WF-IHM-0130) : une fin
          qui précède le début, `VALIDATION_FAILED`, `fields[]` désignant `/query/to` par
          `VALUE_OUT_OF_RANGE`, `params.minimum` le début donné ; un début ou une fin mal
          formés, `/query/from` ou `/query/to` par `DATE_INVALID`. Une borne de la taille mal
          formée, `/query/<borne>` par `NUMBER_INVALID` ; `size_bytes_max` inférieure à
          `size_bytes_min`, `/query/size_bytes_max` par `VALUE_OUT_OF_RANGE`, `params.minimum`
          la borne inférieure donnée.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              period_inverted: { $ref: ../../../fixtures/api/backups_period_inverted.json }
              bounds_inverted: { $ref: ../../../fixtures/api/backups_bounds_inverted.json }
  post:
    operationId: startBackup
    tags: [platform]
    summary: Déclencher une sauvegarde
    description: >-
      Sauvegarde complète de la base dans un état cohérent, vérifiée après sa
      production (WF-ADM-0150). Confiée au worker (WF-ARC-0090). Une seule à la fois : une
      sauvegarde ou une restauration qui s'exécute déjà la fait refuser par 409. Une sauvegarde
      s'exécute de sa mise en file à la production du fichier ; la vérification qui suit
      n'empêche rien, et une sauvegarde en attente de vérification (`backup_pending`) en laisse
      déclencher une autre. Sous la permission de modifier les sauvegardes (`backups.write`,
      WF-ADM-0100).
    responses:
      '202':
        description: Sauvegarde mise en file.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              queued: { $ref: ../../../fixtures/api/task_backup_queued.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '409':
        description: >-
          Une sauvegarde ou une restauration s'exécute déjà : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` nommant `no_backup_running` ou `no_restore_running` ; rien
          n'est mis en file. Deux sauvegardes à la fois liraient la même base pour rien, et une
          sauvegarde prise pendant une restauration ne serait d'aucun état cohérent
          (WF-ADM-0150, WF-ADM-0160).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              backup_running: { $ref: ../../../fixtures/api/backup_start_refused.json }
              restore_running: { $ref: ../../../fixtures/api/backup_start_during_restore_refused.json }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/backups/{backup_id}:
  get:
    operationId: getBackup
    summary: Une sauvegarde
    description: >-
      État, date et taille d'une sauvegarde (WF-ADM-0150), et les commandes que l'appelant peut
      exercer sur elle (`available_commands`, WF-IHM-0090).
    tags: [platform]
    parameters:
      - $ref: ../components/parameters.yaml#/BackupId
    responses:
      '200':
        description: Sauvegarde.
        content:
          application/json:
            schema: { $ref: ../components/schemas/platform.yaml#/Backup }
            examples:
              witness: { $ref: ../../../fixtures/api/backup.json }
              pending: { $ref: ../../../fixtures/api/backup_pending.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
  patch:
    operationId: retainBackup
    tags: [platform]
    summary: Marquer une sauvegarde à conserver
    description: >-
      Une sauvegarde marquée échappe à la rotation (WF-ADM-0170). La sauvegarde porte celle des
      deux commandes qui change son marquage, `retain` ou `release` (`BackupCommand`,
      WF-IHM-0090), indisponible pendant qu'une restauration s'exécute. Sous la permission de
      modifier les sauvegardes (`backups.write`, WF-ADM-0100).
    parameters:
      - $ref: ../components/parameters.yaml#/BackupId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/platform.yaml#/BackupRetain }
    responses:
      '200':
        description: Marquage enregistré.
        content:
          application/json:
            schema: { $ref: ../components/schemas/platform.yaml#/Backup }
            examples:
              retained: { $ref: ../../../fixtures/api/backup_retained.json }
              released: { $ref: ../../../fixtures/api/backup_released.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Une restauration s'exécute, qui remplace la base où le marquage s'écrirait :
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` nommant `no_restore_running` ;
          rien n'est écrit (WF-ADM-0160).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              restore_running: { $ref: ../../../fixtures/api/backup_retain_refused.json }

/backups/{backup_id}/content:
  get:
    operationId: downloadBackup
    tags: [platform]
    summary: Copier une sauvegarde hors de la plateforme
    description: >-
      La copie hors plateforme est ce qui protège d'une perte de la plateforme (WF-ADM-0150).
      Sous la permission de restaurer la plateforme (`platform_restore`, WF-ADM-0100) : une
      sauvegarde porte toute la base, comptes et projets compris. Seule une sauvegarde vérifiée
      se télécharge, comme sa commande `download` le dit d'avance (`BackupCommand`,
      WF-IHM-0090) ; le fichier vient nommé et mesuré, en pièce jointe.
    parameters:
      - $ref: ../components/parameters.yaml#/BackupId
    responses:
      '200':
        description: >-
          Contenu de la sauvegarde, en pièce jointe nommée, de la longueur qu'elle dit.
          L'archive porte l'instant de sa sauvegarde (`Backup.taken_at`), que le dépôt d'une
          restauration relit (`uploadFile`, WF-ADM-0160).
        headers:
          Content-Disposition:
            required: true
            description: >-
              `attachment`, et le nom que le serveur donne au fichier (`filename`) :
              `waterfall-backup-`, l'instant de la sauvegarde en temps universel sans
              séparateur (`20260603T010000Z` pour `2026-06-03T01:00:00Z`), et l'extension de
              son archive, que l'exploitation fixe. Un nom en ASCII, qu'un poste enregistre tel
              quel, et que `filename*` (RFC 8187) n'a pas à redire (RFC 6266).
            schema: { type: string }
            examples:
              night:
                summary: >-
                  Le nom de la sauvegarde planifiée de la nuit du 3 juin 2026, prise à une heure
                  en temps universel (WF-ADM-0150).
                value: 'attachment; filename="waterfall-backup-20260603T010000Z.tar"'
          Content-Length:
            required: true
            description: >-
              La longueur du fichier, en octets : `Backup.size_bytes`, le corps transmis tel
              qu'il est conservé, sans codage qui en changerait la longueur, pour que le poste
              dise l'avancement du téléchargement (WF-ADM-0150). Sans exemple : le faux back
              rejouerait la longueur de la liste sur un corps de quelques octets, et la route du
              front qui relaie le téléchargement recopie l'en-tête.
            schema: { type: integer, minimum: 0 }
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          Une sauvegarde dont la vérification n'a pas réussi, en attente ou échouée :
          `STATE_FORBIDS_OPERATION`, `params.missing_condition` nommant `backup_verified` ; rien
          n'est transmis (WF-ADM-0150).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              unverified: { $ref: ../../../fixtures/api/backup_download_refused.json }

/backup-schedule:
  get:
    operationId: getBackupSchedule
    tags: [platform]
    summary: Planification et rétention des sauvegardes
    description: >-
      Fréquence, heure et nombre de sauvegardes conservées, et la copie automatique de
      chaque sauvegarde planifiée vers un emplacement externe déclaré par l'installation
      (WF-ADM-0170).
    responses:
      '200':
        description: Planification courante (WF-ADM-0170).
        content:
          application/json:
            schema: { $ref: ../components/schemas/platform.yaml#/BackupSchedule }
            examples:
              witness: { $ref: ../../../fixtures/api/backup_schedule.json }
              weekly: { $ref: ../../../fixtures/api/backup_schedule_weekly.json }
              disabled: { $ref: ../../../fixtures/api/backup_schedule_disabled.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
  put:
    operationId: setBackupSchedule
    tags: [platform]
    summary: Régler la planification et la rétention
    description: >-
      Au-delà du nombre conservé, les plus anciennes sont supprimées, sauf celles
      marquées à conserver. La copie externe, si elle est réglée, nomme un emplacement que
      l'installation déclare et un dossier relatif dans cet emplacement, et garde au moins
      autant de copies que la plateforme garde de sauvegardes (WF-EXP-0050). Un échec, de la
      sauvegarde ou de sa copie, est signalé sur l'écran d'état (WF-ADM-0170, WF-OBS-0030).
      Sous la permission de modifier les sauvegardes (`backups.write`, WF-ADM-0100).
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/platform.yaml#/BackupSchedule }
    responses:
      '200':
        description: Planification enregistrée.
        content:
          application/json:
            schema: { $ref: ../components/schemas/platform.yaml#/BackupSchedule }
            examples:
              set: { $ref: ../../../fixtures/api/backup_schedule_set.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
      '422':
        description: >-
          Une planification refusée, `VALIDATION_FAILED`, `fields` désignant chaque champ en
          défaut : une rétention hors de 1 à 365, sur la plateforme (`/retained_count`) ou sur
          l'emplacement (`/external_copy/retained_count`), `VALUE_OUT_OF_RANGE`,
          `params.minimum` ou `maximum` la seule borne franchie (WF-ADM-0170) ; et, pour la
          copie externe, un emplacement que l'installation ne déclare pas
          (`/external_copy/location`, `UNKNOWN_EXTERNAL_BACKUP_LOCATION`), un chemin qui n'est
          pas relatif ou qui sort du dossier (`/external_copy/path`, `PATH_INVALID`), une
          rétention moindre que celle de la plateforme (`/external_copy/retained_count`,
          `VALUE_OUT_OF_RANGE`, `params.minimum`, WF-EXP-0050).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              unknown_location: { $ref: ../../../fixtures/api/backup_schedule_unknown_location.json }
              path_invalid: { $ref: ../../../fixtures/api/backup_schedule_path_invalid.json }
              retention_too_short: { $ref: ../../../fixtures/api/backup_schedule_retention_too_short.json }
              retention_out_of_range: { $ref: ../../../fixtures/api/backup_schedule_retention_out_of_range.json }

/external-backup-locations:
  get:
    operationId: listExternalBackupLocations
    tags: [platform]
    summary: Emplacements externes des sauvegardes
    description: >-
      Les emplacements où une sauvegarde planifiée peut être copiée automatiquement
      (WF-ADM-0170), tels que l'installation les déclare dans sa configuration de
      déploiement, dans l'ordre de leurs noms : leur nom, leur nature et leur description,
      jamais leurs identifiants ni aucun secret. Le serveur les atteint seul. Aucune opération
      ne les crée ni ne les modifie : leur déclaration est une affaire d'exploitation.
      Lisible sous la permission de consulter les sauvegardes (`backups.read`, WF-ADM-0100).
    responses:
      '200':
        description: Emplacements déclarés ; une liste vide quand l'installation n'en déclare aucun.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/platform.yaml#/ExternalBackupLocation }
            examples:
              witness: { $ref: ../../../fixtures/api/external_backup_locations.json }
              none: { $ref: ../../../fixtures/api/external_backup_locations_none.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }

/external-backup-locations/{location_name}/test:
  post:
    operationId: testExternalBackupLocation
    tags: [platform]
    summary: Éprouver un emplacement externe des sauvegardes
    description: >-
      Le serveur écrit puis efface un fichier témoin dans l'emplacement, à sa racine ou dans
      le dossier donné, avec les identifiants de la configuration, et rend l'issue : réussie,
      ou le motif de l'échec, en code (WF-ADM-0170, WF-ARC-0110). Rien n'est conservé : le
      test n'a pas d'état, et un échec n'est pas une alerte, que seule une copie planifiée
      déclenche (WF-OBS-0030). Le test attend un emplacement qui ne répond pas trente secondes
      au plus, et dit leur dépassement comme un échec (`timed_out`). Sous la permission de modifier les
      sauvegardes (`backups.write`, WF-ADM-0100).
    parameters:
      - $ref: ../components/parameters.yaml#/ExternalBackupLocationName
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: ../components/schemas/platform.yaml#/ExternalBackupLocationTestRequest }
    responses:
      '200':
        description: Issue du test, réussi ou non.
        content:
          application/json:
            schema: { $ref: ../components/schemas/platform.yaml#/ExternalBackupLocationTest }
            examples:
              succeeded: { $ref: ../../../fixtures/api/external_backup_location_tested.json }
              access_denied: { $ref: ../../../fixtures/api/external_backup_location_test_failed.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404':
        description: >-
          Emplacement que l'installation ne déclare pas, ou lecture des sauvegardes refusée,
          sans distinction (WF-ADM-0110).
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
      '422':
        description: >-
          Un dossier qui n'est pas relatif ou qui sort de l'emplacement : `VALIDATION_FAILED`,
          `fields` désignant `/path` par `PATH_INVALID`.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              path_invalid: { $ref: ../../../fixtures/api/external_backup_location_test_path_invalid.json }

/restores:
  post:
    operationId: startRestore
    tags: [platform]
    summary: Restaurer la plateforme
    description: >-
      Remplace l'intégralité de la base par son contenu sauvegardé, déconnecte les
      utilisateurs, vide le cache, et n'est appliquée qu'après confirmation
      (WF-ADM-0160, WF-DAT-0130). Ne porte jamais sur un projet isolé. Confiée au worker
      (WF-ARC-0090). Une sauvegarde de la liste se restaure comme sa commande `restore` le dit
      d'avance (`BackupCommand`, WF-IHM-0090) : vérifiée, et aucune sauvegarde ni restauration
      en cours — sinon 409. La date confirmée est celle de la sauvegarde désignée, sinon 422 :
      celle que la liste donne (`Backup.taken_at`), ou, pour une sauvegarde déposée, celle que
      le dépôt a lue dans son archive (`FileUpload.backup_taken_at`).
      Pendant qu'une restauration s'exécute, de sa mise en file à la déconnexion des
      utilisateurs, toute autre écriture des sauvegardes est refusée de même par 409 — en
      déclencher une (`startBackup`), en marquer une (`retainBackup`), en restaurer une autre
      — ; le téléchargement d'une sauvegarde vérifiée (`downloadBackup`) reste possible. Sous
      la permission de restaurer la plateforme (`platform_restore`, WF-ADM-0100).
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/platform.yaml#/RestoreRequest }
    responses:
      '202':
        description: Restauration mise en file.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/BackgroundTaskRef }
            examples:
              queued: { $ref: ../../../fixtures/api/task_restore_queued.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '409':
        description: >-
          Un état qui interdit la restauration : `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` nommant la condition que la commande `restore` de la
          sauvegarde disait manquante (`BackupCommand`) — `backup_verified`, la sauvegarde
          désignée n'étant pas vérifiée, en attente ou échouée (WF-ADM-0150) ;
          `no_backup_running`, une sauvegarde s'exécutant ; `no_restore_running`, une
          restauration s'exécutant déjà (WF-ADM-0160). Rien n'est mis en file.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              backup_running: { $ref: ../../../fixtures/api/restore_during_backup_refused.json }
              unverified: { $ref: ../../../fixtures/api/restore_unverified_refused.json }
              restore_running: { $ref: ../../../fixtures/api/restore_during_restore_refused.json }
      '422':
        description: >-
          `VALIDATION_FAILED`, `fields` désignant le champ en défaut : une date confirmée qui
          n'est pas celle de la sauvegarde désignée — de la liste (`Backup.taken_at`) ou déposée
          (`FileUpload.backup_taken_at`) —, `/acknowledged_backup_taken_at` par
          `BACKUP_DATE_MISMATCH`, sans paramètre (WF-ADM-0160) ; un dépôt qui n'a pas été fait
          pour une restauration — le fichier d'un import (`FileUploadPurpose`) —,
          `/external_backup_upload_id` par `UPLOAD_PURPOSE_MISMATCH`, seul : la date ne se
          compare qu'à un dépôt de sauvegarde, le dépôt d'un import n'en ayant pas
