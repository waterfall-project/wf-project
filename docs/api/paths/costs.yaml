/projects/{project_id}/actual-costs:
  get:
    operationId: listActualCosts
    tags: [actual-costs]
    summary: Actual costs of the project
    description: >-
      List filterable by subproject, by period and by exclusion, with the total of the
      tracked scope, the excluded total and the grand total (WF-CRE-0040). The kept columns of
      the file are returned (WF-CRE-0010), line by line (`passthrough`), and their union named
      once for the whole read (`meta.passthrough_columns`): the grid presents them all, on
      every page. Sorting and filtering are done by the server, and the totals, like this
      union, are those of all the lines retained, not of the page returned alone.
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
      - $ref: ../components/parameters.yaml#/SubprojectFilter
      - name: from
        in: query
        description: >-
          The start of the period, on the document date (`document_date`), included (WF-CRE-0040).
        schema: { $ref: ../components/common.yaml#/PlanningDate }
      - name: to
        in: query
        description: >-
          The end of the period, on the document date, included; an end that precedes the start
          is refused with 422, `/query/to` with `VALUE_OUT_OF_RANGE`.
        schema: { $ref: ../components/common.yaml#/PlanningDate }
      - name: in_tracked_scope
        in: query
        description: >-
          When true, the tracked lines only; when false, the excluded lines only; when absent,
          all of them (WF-CRE-0030, WF-CRE-0040).
        schema: { type: boolean }
      - name: sort_by
        in: query
        description: >-
          Sort column; when absent, the most recent documents first. Every column of the grid
          can be sorted (WF-IHM-0060). `in_tracked_scope` puts the excluded lines before the
          tracked lines in ascending order. `document_item` sorts by item number,
          `excluded_reason` by reason, and `passthrough.<column>` by the value of a kept column
          of the file, named as `passthrough` names it: each compared as text, character by
          character in Unicode code point order, without reading a number or a date it might
          write; a line without a value — without an item, tracked and so without a reason, or
          without that column — comes after the others in ascending order, before them in
          descending order.
        schema:
          anyOf:
            - type: string
              enum:
                - document_date
                - document_number
                - document_item
                - amount
                - subproject
                - in_tracked_scope
                - excluded_reason
            - type: string
              pattern: '^passthrough\..+$'
      - $ref: ../components/parameters.yaml#/SortOrder
    responses:
      '200':
        description: Cost lines and the three totals.
        content:
          application/json:
            schema:
              type: object
              required: [items, totals, last_import_at, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/costs.yaml#/ActualCostLine }
                totals: { $ref: ../components/schemas/costs.yaml#/ActualCostTotals }
                last_import_at:
                  anyOf:
                    - $ref: ../components/common.yaml#/Timestamp
                    - type: 'null'
                meta: { $ref: ../components/schemas/costs.yaml#/ActualCostListMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/actual_costs.json }
              page: { $ref: ../../../fixtures/api/actual_costs_page.json }
              subproject: { $ref: ../../../fixtures/api/actual_costs_subproject.json }
              after_exclusion: { $ref: ../../../fixtures/api/actual_costs_after_exclusion.json }
              empty: { $ref: ../../../fixtures/api/actual_costs_empty.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422':
        description: >-
          `VALIDATION_FAILED`: a filter that the server cannot apply, designated in
          `fields` — a period whose end precedes its start (`/query/to`,
          `VALUE_OUT_OF_RANGE`, `params.minimum` the start given, the rule of every period of the
          contract), a malformed date (`/query/from` or `/query/to`,
          `DATE_INVALID`), a subproject that the project does not have or a malformed identifier
          (`/query/subproject_id`, `UNKNOWN_SUBPROJECT`). No empty list stands in for a
          refusal.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              period_inverted: { $ref: ../../../fixtures/api/actual_costs_period_inverted.json }
              subproject_unknown: { $ref: ../../../fixtures/api/actual_costs_subproject_unknown.json }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/actual-costs/{cost_line_id}/tracked-scope:
  put:
    operationId: setActualCostTrackedScope
    tags: [actual-costs]
    summary: Exclude a line from the tracked scope, or reinstate it
    description: >-
      An excluded line remains viewable and enters no indicator; the exclusion is kept
      through later imports, even when the periods overlap (WF-CRE-0030). The exclusion is an
      irreversible action in the sense of the audit log (WF-SEC-0030) and requires its own
      permission (WF-ADM-0100). A write without a lock version, by exception to the
      `lock_version` rule (README, "Conventions"): the idempotent `PUT` sets the target state,
      excluded or tracked, without depending on any other value of the line, so that two
      concurrent requests can only give the same state or the last one requested, and
      replaying it changes nothing; it has neither `lock_version` nor 412 ("A state is a
      resource", DECISIONS.md; author's decision of 2026-10-28, US-0702/L2).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/CostLineId
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/costs.yaml#/ScopeExclusion }
    responses:
      '200':
        description: Line excluded or reinstated; the totals follow immediately.
        content:
          application/json:
            schema: { $ref: ../components/schemas/costs.yaml#/ActualCostLine }
            examples:
              excluded: { $ref: ../../../fixtures/api/actual_cost_excluded.json }
              reinstated: { $ref: ../../../fixtures/api/actual_cost_reinstated.json }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '403': { $ref: ../components/responses.yaml#/Forbidden }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '409':
        description: >-
          The project's `exclude_cost_lines` command is unavailable: `STATE_FORBIDS_OPERATION`,
          `params.missing_condition` the first condition it lacks, in the order in which it names
          them — `project_not_terminal` on a terminal project, whose actual costs are read-only
          and which no longer lists it (WF-CYC-0100), `project_in_progress` before In progress
          (WF-CRE-0030); I-06, US-0702/L2. Nothing is written.
        content:
          application/problem+json:
            schema: { $ref: ../components/common.yaml#/Problem }
            examples:
              project_terminal: { $ref: ../../../fixtures/api/actual_cost_scope_terminal.json }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/projects/{project_id}/cost-imports:
  get:
    operationId: listCostImports
    tags: [actual-costs]
    summary: Log of the actual cost imports
    description: >-
      Date, author, extracted period and number of lines created, updated, unchanged and
      rejected: how recent the figures being read are (WF-CRE-0050).
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Offset
    responses:
      '200':
        description: Log entries, from the most recent to the oldest.
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/costs.yaml#/CostImport }
                meta: { $ref: ../components/common.yaml#/PaginationMeta }
            examples:
              witness: { $ref: ../../../fixtures/api/cost_imports.json }
              beyond: { $ref: ../../../fixtures/api/cost_imports_beyond.json }
              empty: { $ref: ../../../fixtures/api/cost_imports_empty.json }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }
      '500': { $ref: ../components/responses.yaml#/InternalError }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }
