[project]
name = "waterfall"
version = "0.3.0"
description = "Waterfall: the business core, the API service and the worker, in one package."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.44.5",
    "email-validator>=2.4.0",
    "fastapi>=0.163.2",
    "httpx2>=2.16.2",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.34",
    "redis>=8.1",
    "sqlalchemy>=2.1.9",
    "structlog>=26.1.0",
    "tzdata>=2026.6",
    "uuid-utils>=1.2.0",
    "uvicorn>=0.54.0",
    "xlsxwriter>=3.3.1",
]

# One package, two processes: the API and the worker start from the same distribution, and
# so carry the same version by construction (WF-ARC-0010). ``waterfall-api`` starts in the loader of
# the witness, which takes ``load-witness`` and passes anything else to the bootstrap, which takes
# ``install`` and passes anything else to the API.
[project.scripts]
waterfall-api = "waterfall.witness.main:main"
waterfall-worker = "waterfall.worker.main:main"
waterfall-migrate = "waterfall.migrations.runner:main"
waterfall-restore = "waterfall.restore.main:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs-lite[s3]>=1.44.5",
    "datamodel-code-generator>=0.97.0",
    "grimp>=3.20",
    "import-linter>=2.16",
    "openapi-core>=0.23.1",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.8",
    "pyyaml>=6.0",
    "ruff>=0.17.5",
    "types-lxml>=2026.2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The measure of the core (``measure/``, US-2210) is no part of the package: its tests import it from here.
# The plugin that fails a test which skips without the mark `unexecuted` (wftools.unexecuted, US-2440),
# which the conftest loads, comes from the tools: one implementation, shared with their tests.
pythonpath = [".", "../tools/src"]
# The tests of Keycloak need its platform: `make test-keycloak` selects them, `-m keycloak`
# overriding the selection below.
addopts = ["--strict-markers", "--strict-config", "-m", "not keycloak"]
markers = [
    "requirement(identifier): the requirement this test covers, cited by its full identifier (WF-QUA-0010)",
    "story(identifier): the story whose own criterion this test carries, cited as US-nnnn (US-2440)",
    "keycloak: runs against the Keycloak of the service platform (make test-keycloak)",
]
xfail_strict = true
filterwarnings = ["error"]
# A test that hangs fails after eight minutes, named, its traceback where it stood, rather than
# freezing its part of the chain until the job is cancelled (#4653). The longest test that does not
# hang loads the witness itself: 216 seconds at most on a runner (run 44957647502), and a runner is up
# to twice as slow as another. By SIGALRM, in the main thread where pytest-xdist runs the tests: the
# test fails and its process goes on with the next. The one delay covers the whole item, its
# teardown included: a teardown that follows a freeze may freeze in turn, and the delay of the job
# (20 minutes, back.yml) remains the net.
timeout = 480
timeout_method = "signal"

[tool.coverage.run]
branch = true
# The loader of the witness template runs in a process of its own (tests/witness_template.py), as
# do the entry points the tests start: measured too, their data combined with the tests' own.
patch = ["subprocess"]
source_dirs = ["src/waterfall"]
omit = [
    # The models engendered from the contract are written by a tool, not by us (US-0060).
    "src/waterfall/api/contract/models.py",
    # The administration API of Keycloak, which only Keycloak answers: the tests of the service
    # platform try it, and `make test-keycloak` measures it to the same thresholds
    # (coverage-keycloak.toml); this measure runs no Keycloak.
    "src/waterfall/platform/keycloak_admin.py",
    # The reading of the accounts, which asks Keycloak at each step: measured with it.
    "src/waterfall/worker/identity_sync.py",
    # The bootstrap, which creates the administrator in Keycloak: tried and measured likewise.
    "src/waterfall/bootstrap.py",
]

[tool.coverage.report]
# The guard that runs a module as a script is run by the entry points, in their own
# process, which the measure does not see; what they call is tested in-process.
exclude_also = ["if __name__ == .__main__.:"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", "tests", "measure"]
# The tests share what ``tests/conftest.py`` holds; the measure (``measure/``, beside the package, US-2210)
# is imported by its tests and by itself from the root of the back; the tools (``../tools/src``, as
# pytest's ``pythonpath``) are read by the tests that compare an example of the contract to the
# service (US-3270/L6).
extraPaths = ["src", "tests", ".", "../tools/src"]
# The models engendered from the contract are written by a tool, not by us.
exclude = ["src/waterfall/api/contract/models.py"]
# `# type: ignore` is not honoured: a type error is fixed, never silenced (US-0050).
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

# The boundaries of the core (WF-ARC-0010), checked by `lint-imports`.
[tool.importlinter]
root_package = "waterfall"

[[tool.importlinter.contracts]]
name = "The core imports neither the schema, the API, the worker nor the migrations, which do not import each other; the platform imports none of them; the bootstrap and the service of the restoration, which apply the migrations, are imported by none but the loader of the witness, which nothing imports"
type = "layers"
layers = ["waterfall.witness", "waterfall.bootstrap | waterfall.restore", "waterfall.api | waterfall.worker | waterfall.migrations", "waterfall.schema", "waterfall.core", "waterfall.platform"]

[[tool.importlinter.contracts]]
name = "The modules of the core are ordered: the one above imports the one below, never the reverse (the cycle of #2124); the portfolio reads every module of the domain and the settings, none of which reads it, and registers in the revisions; the indicators read every module of the domain and the indicator settings, and register in the revisions; the risks read the revisions, the planning, the estimate and the risk settings, none of which reads them, and register in them, in the projects and in the history; the estimate reads the actual costs and registers in the planning, the exchanges, the revisions, the projects, the cost settings and the resource settings; the actual costs register in the exchanges and neither import nor are imported by the planning; the planning registers in the exchanges, the history, the revisions, the projects and the resource settings; projects and revisions sit between them and cost_settings; resource_settings imports no other module of the core"
type = "layers"
containers = ["waterfall.core"]
layers = ["portfolio", "indicators", "risks", "access_roles | backups | indicator_settings | risk_settings", "estimate", "costs | planning", "exchanges | history", "revisions", "projects", "cost_settings", "users", "resource_settings"]

[[tool.importlinter.contracts]]
name = "A module of the core reaches another only through its public interface"
type = "independence"
modules = ["waterfall.core.*"]
ignore_imports = ["waterfall.core.** -> waterfall.core.*.interface"]
unmatched_ignore_imports_alerting = "none"

# The generator of the models of the contract (`make generate-server-models`), which reads this
# section besides its command line: every model it engenders refuses a text that holds a NUL,
# which PostgreSQL would refuse later as a failure (waterfall.api.contract.base).
[tool.datamodel-codegen]
base-class = "waterfall.api.contract.base.ContractModel"
