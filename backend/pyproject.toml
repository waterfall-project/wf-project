[project]
name = "waterfall"
version = "0.1.0"
description = "Waterfall: the business core, the API service and the worker, in one package."
requires-python = ">=3.13"
dependencies = []

# One package, two processes: the API and the worker start from the same distribution, and
# so carry the same version by construction (WF-ARC-0010).
[project.scripts]
waterfall-api = "waterfall.api.main:main"
waterfall-worker = "waterfall.worker.main:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = ["requirement(identifier): the requirement this test covers, cited by its full identifier (WF-QUA-0010)"]
xfail_strict = true
filterwarnings = ["error"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]
# `# type: ignore` is not honoured: a type error is fixed, never silenced (US-0050).
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

# The boundaries of the core (WF-ARC-0010), checked by `lint-imports`.
[tool.importlinter]
root_package = "waterfall"

[[tool.importlinter.contracts]]
name = "The core imports neither the API nor the worker, which do not import each other"
type = "layers"
layers = ["waterfall.api | waterfall.worker", "waterfall.core"]

[[tool.importlinter.contracts]]
name = "A module of the core reaches another only through its public interface"
type = "independence"
modules = ["waterfall.core.*"]
ignore_imports = ["waterfall.core.** -> waterfall.core.*.interface"]
unmatched_ignore_imports_alerting = "none"
