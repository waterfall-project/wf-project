[project]
name = "waterfall"
version = "0.1.0"
description = "Waterfall: the business core, the API service and the worker, in one package."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy>=2.1",
    "structlog>=26.1.0",
    "uuid-utils>=0.14",
    "uvicorn>=0.54.0",
]

# One package, two processes: the API and the worker start from the same distribution, and
# so carry the same version by construction (WF-ARC-0010).
[project.scripts]
waterfall-api = "waterfall.api.main:main"
waterfall-worker = "waterfall.worker.main:main"
waterfall-migrate = "waterfall.migrations.runner:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.83.0",
    "import-linter>=2.15",
    "openapi-core>=0.23.1",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "pyyaml>=6.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests of Keycloak need its platform: `make test-keycloak` selects them, `-m keycloak`
# overriding the selection below.
addopts = ["--strict-markers", "--strict-config", "-m", "not keycloak"]
markers = [
    "requirement(identifier): the requirement this test covers, cited by its full identifier (WF-QUA-0010)",
    "keycloak: runs against the Keycloak of the service platform (make test-keycloak)",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source_dirs = ["src/waterfall"]
omit = [
    # The models engendered from the contract are written by a tool, not by us (US-0060).
    "src/waterfall/api/contract/models.py",
    # The administration API of Keycloak, which only Keycloak answers: the tests of the service
    # platform try it, and `make test-keycloak` measures it to the same thresholds
    # (coverage-keycloak.toml); this measure runs no Keycloak.
    "src/waterfall/platform/keycloak_admin.py",
]

[tool.coverage.report]
# The guard that runs a module as a script is run by the entry points, in their own
# process, which the measure does not see; what they call is tested in-process.
exclude_also = ["if __name__ == .__main__.:"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]
# The tests share what ``tests/conftest.py`` holds.
extraPaths = ["src", "tests"]
# The models engendered from the contract are written by a tool, not by us.
exclude = ["src/waterfall/api/contract/models.py"]
# `# type: ignore` is not honoured: a type error is fixed, never silenced (US-0050).
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

# The boundaries of the core (WF-ARC-0010), checked by `lint-imports`.
[tool.importlinter]
root_package = "waterfall"

[[tool.importlinter.contracts]]
name = "The core imports neither the API, the worker nor the migrations, which do not import each other; the platform imports none of them"
type = "layers"
layers = ["waterfall.api | waterfall.worker | waterfall.migrations", "waterfall.core", "waterfall.platform"]

[[tool.importlinter.contracts]]
name = "A module of the core reaches another only through its public interface"
type = "independence"
modules = ["waterfall.core.*"]
ignore_imports = ["waterfall.core.** -> waterfall.core.*.interface"]
unmatched_ignore_imports_alerting = "none"
