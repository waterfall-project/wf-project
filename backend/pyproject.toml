[project]
name = "waterfall"
version = "0.1.0"
description = "Waterfall: the business core, the API service and the worker, in one package."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.43.124",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "lxml>=6.1.3",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.33",
    "redis>=8.1",
    "sqlalchemy>=2.1.8",
    "structlog>=26.1.0",
    "uuid-utils>=1.2.0",
    "uvicorn>=0.54.0",
]

# One package, two processes: the API and the worker start from the same distribution, and
# so carry the same version by construction (WF-ARC-0010). ``waterfall-api`` starts in the loader of
# the witness, which takes ``load-witness`` and passes anything else to the bootstrap, which takes
# ``install`` and passes anything else to the API.
[project.scripts]
waterfall-api = "waterfall.witness.main:main"
waterfall-worker = "waterfall.worker.main:main"
waterfall-migrate = "waterfall.migrations.runner:main"
waterfall-restore = "waterfall.restore.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs-lite[s3]>=1.43.124",
    "datamodel-code-generator>=0.89.0",
    "grimp>=3.18",
    "import-linter>=2.15",
    "openapi-core>=0.23.1",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "pytest-xdist>=3.8",
    "pyyaml>=6.0",
    "ruff>=0.17.3",
    "types-lxml>=2026.2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests of Keycloak need its platform: `make test-keycloak` selects them, `-m keycloak`
# overriding the selection below.
addopts = ["--strict-markers", "--strict-config", "-m", "not keycloak"]
markers = [
    "requirement(identifier): the requirement this test covers, cited by its full identifier (WF-QUA-0010)",
    "keycloak: runs against the Keycloak of the service platform (make test-keycloak)",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source_dirs = ["src/waterfall"]
omit = [
    # The models engendered from the contract are written by a tool, not by us (US-0060).
    "src/waterfall/api/contract/models.py",
    # The administration API of Keycloak, which only Keycloak answers: the tests of the service
    # platform try it, and `make test-keycloak` measures it to the same thresholds
    # (coverage-keycloak.toml); this measure runs no Keycloak.
    "src/waterfall/platform/keycloak_admin.py",
    # The reading of the accounts, which asks Keycloak at each step: measured with it.
    "src/waterfall/worker/identity_sync.py",
    # The bootstrap, which creates the administrator in Keycloak: tried and measured likewise.
    "src/waterfall/bootstrap.py",
]

[tool.coverage.report]
# The guard that runs a module as a script is run by the entry points, in their own
# process, which the measure does not see; what they call is tested in-process.
exclude_also = ["if __name__ == .__main__.:"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", "tests"]
# The tests share what ``tests/conftest.py`` holds.
extraPaths = ["src", "tests"]
# The models engendered from the contract are written by a tool, not by us.
exclude = ["src/waterfall/api/contract/models.py"]
# `# type: ignore` is not honoured: a type error is fixed, never silenced (US-0050).
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

# The boundaries of the core (WF-ARC-0010), checked by `lint-imports`.
[tool.importlinter]
root_package = "waterfall"

[[tool.importlinter.contracts]]
name = "The core imports neither the schema, the API, the worker nor the migrations, which do not import each other; the platform imports none of them; the bootstrap and the service of the restoration, which apply the migrations, are imported by none but the loader of the witness, which nothing imports"
type = "layers"
layers = ["waterfall.witness", "waterfall.bootstrap | waterfall.restore", "waterfall.api | waterfall.worker | waterfall.migrations", "waterfall.schema", "waterfall.core", "waterfall.platform"]

[[tool.importlinter.contracts]]
name = "The modules of the core are ordered: the one above imports the one below, never the reverse (the cycle of #2124); the planning registers in the exchanges, the history, the revisions, the projects and the resource settings; projects and revisions sit between them and cost_settings; resource_settings imports no other module of the core; estimate sits above them all"
type = "layers"
containers = ["waterfall.core"]
layers = ["estimate", "access_roles | backups | indicator_settings | risk_settings", "planning", "exchanges | history", "revisions", "projects", "cost_settings", "users", "resource_settings"]

[[tool.importlinter.contracts]]
name = "A module of the core reaches another only through its public interface"
type = "independence"
modules = ["waterfall.core.*"]
ignore_imports = ["waterfall.core.** -> waterfall.core.*.interface"]
unmatched_ignore_imports_alerting = "none"

# The generator of the models of the contract (`make generate-server-models`), which reads this
# section besides its command line: every model it engenders refuses a text that holds a NUL,
# which PostgreSQL would refuse later as a failure (waterfall.api.contract.base).
[tool.datamodel-codegen]
base-class = "waterfall.api.contract.base.ContractModel"
