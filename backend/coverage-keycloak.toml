# The measure of `make test-keycloak`: the administration API of Keycloak, and the reading of the
# accounts that asks it at each step, which the measure of the back leaves out by their paths
# (`[tool.coverage.run]` of pyproject.toml), since only the Keycloak of the service platform
# answers them. Its thresholds are those of the back
# (`wftools.codecoverage`).
[tool.coverage.run]
branch = true
source_pkgs = ["waterfall.platform.keycloak_admin", "waterfall.worker.identity_sync"]
