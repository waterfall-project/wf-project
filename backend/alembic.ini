# Alembic for a developer at a terminal: `uv run alembic revision --rev-id 0002 -m "…"`.
# The database is the one WATERFALL_DATABASE_URL designates, as for the service itself.
[alembic]
script_location = %(here)s/src/waterfall/migrations
file_template = %%(rev)s_%%(slug)s
