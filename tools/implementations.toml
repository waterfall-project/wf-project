# --- Le portefeuille applique les formules d'EP-10 à des sommes ---------------------------------
#
# Une entrée `[[application]]` par fichier du portefeuille qui applique une formule : chacun des
# noms de `applies` y est importé du module qui le porte et appelé, jamais récrit (WF-PTF-0020).

[[application]]
file = "core/portfolio/aggregation/ratios.py"
applies = ["cost_index", "schedule_index", "cost_variance", "schedule_variance", "projections",
    "share_of", "distribution"]

[[application]]
file = "core/portfolio/aggregation/zones.py"
applies = ["zone_of"]

# --- Les homonymes ------------------------------------------------------------------------------
#
# Une entrée `[[homonym]]` par module du noyau qui donne un nom de la table à un autre calcul, le
# sien : un fichier tenu peut importer ce nom de ce module. Le contrôle échoue quand le module ne
# le définit plus.

[[homonym]]
name = "zone_of"
module = "waterfall.core.risk_settings"
reason = """la zone de la case d'une probabilité et d'une gravité dans la matrice des risques \
(EP-08), non la zone d'un indice"""

# --- Les doublons connus ------------------------------------------------------------------------
#
# Une entrée `[[duplicate]]` par définition d'un nom de la table, dans un fichier que le contrôle
# tient, que le dépôt porte aujourd'hui : le contrôle la dit à chaque passage, sans échouer — ses
# réexportations comprises —, et échoue quand elle disparaît, pour que l'entrée parte avec elle.
# `reason` dit ce qui est copié ; une entrée ne s'ajoute que pour un doublon trouvé, jamais pour
# faire passer un calcul nouveau.

[[duplicate]]
name = "month_of"
file = "core/portfolio/aggregation/periods.py"
reason = """le mois civil d'un jour des courbes d'EP-10, récrit par le portefeuille avec \
last_day_of (end_of des courbes) et le rang d'un mois, que l'interface des indicateurs n'offre pas"""
