# L'unique implémentation de chaque calcul que WF-ARC-0010 cite — la machine d'état, le planning,
# le chiffrage, les indicateurs —, que `make implementations` (wftools.implementations, US-2780/L3)
# tient contre le back livré, `backend/src/waterfall`.
#
# Une entrée `[[implementation]]` par fichier du noyau qui porte un calcul : `calculation` le nomme
# (l'une des quatre familles), `file` est le fichier, relatif à `backend/src/waterfall`, et `names`
# les noms par lesquels on l'appelle — ses fonctions qui calculent, et les constantes qui en fixent
# le résultat (un horizon, un pas d'arrondi, un ensemble d'états). Le module du noyau qui le porte
# est le premier répertoire sous `core/` : `core/indicators/formulas/ratios.py` est à
# `waterfall.core.indicators`. Un nom n'a qu'un propriétaire.
#
# Le contrôle tient les fichiers qui emploient ces calculs sans en porter aucun : l'API, le worker,
# les autres points d'entrée et la plateforme — tout fichier hors de `core/` et de `migrations/` —,
# et le portefeuille, `core/portfolio`, qui somme ce que les autres modules calculent. Il y refuse :
#   - la définition d'un nom de la table : une fonction (`def`, à toute profondeur, méthode
#     comprise) ou une affectation au niveau du module ;
#   - l'import d'un nom de la table d'ailleurs que du module du noyau qui le porte (son interface
#     ou l'un de ses fichiers ; `from … import nom`, alias compris).
# Il refuse aussi un nom de la table que son fichier ne définit plus, et une déclaration (homonyme,
# doublon) qui ne tient plus : la table ne vieillit pas en silence. Les autres modules du noyau sont
# hors du contrôle : plusieurs donnent un nom de la table à une chose à eux (`STATES` des risques,
# `state_of` du planning), et les migrations gardent les valeurs de leur temps.
#
# Ce que la table ne liste pas, et pourquoi : un nom trop commun pour désigner un calcul — `NOUGHT`,
# `CENT`, `MONEY`, `Point`, `plan_of`, `chain` —, que d'autres modules emploient pour autre chose
# (le motif d'un montant dans une requête de l'API, le plan de charge rendu…) ; les classes, que les
# modèles engendrés du contrat (`api/contract/models.py`) reprennent sous le même nom sans rien
# calculer ; les codes de refus et de condition, qui ne sont pas des calculs (`SHARED` de
# `backend/tests/test_boundaries.py` en tient les partagés). Un calcul récrit sous un autre nom
# échappe à ce contrôle : la revue le cherche.
#
# Les générateurs du faux back (`tools/src/wftools/mock*`), qui ne sont pas livrés, restent un
# calcul indépendant, par la règle du jeu de données de référence : ils sont hors du contrôle.

