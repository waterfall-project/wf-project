# What the chain needs to know about the paths of the repository, declared once.
#
# - `families`: which family of checks a changed path wakes up. A pull request only pays for
#   the families it touches (US-0310); `always` families run whatever changed.
# - `shared`: paths every family depends on; touching one runs them all.
# - `generated`: paths a tool writes, with the command that writes them. They are left out
#   of the size of a lot and of the size limit of a source file (US-0050, US-0310).
# - `tests`: paths that hold tests, by family, told apart from production code in the size
#   of a lot; the coverage of requirements says which family cites each one (WF-QUA-0010).
#
# Patterns follow pathlib's full_match: `*` stays within a directory, `**` crosses them.

shared = [
    "Makefile",
    # The chain itself: the job that selects the families, and the gate that judges them.
    ".github/workflows/ci.yml",
    # The tools project as a whole, this file, and the code that interprets it and judges the
    # chain. The code of a check wakes its family alone: each family names, among its paths, its
    # workflow, the local actions it takes and the modules of wftools its checks run, which
    # tools/tests/test_families.py holds against the Makefile, the workflows and the harness of
    # Playwright, so that no pull request can weaken a check without waking the family that relies
    # on it. The repo family, which runs on any change, tests every tool.
    "tools/paths.toml",
    "tools/pyproject.toml",
    "tools/uv.lock",
    "tools/src/wftools/__init__.py",
    "tools/src/wftools/paths.py",
    "tools/src/wftools/changes.py",
    "tools/src/wftools/gate.py",
]

[families.repo]
always = true
target = "check-repo"

[families.spec]
paths = ["docs/spec/**", ".github/workflows/spec.yml"]
target = "check-spec"

[families.contract]
# The long examples of the contract live under fixtures/api/: the contract cites them, its lint
# checks them against their schemas, and the volumes among them are checked up to date.
# The models of the service are generated from the contract and checked with it: what they are
# generated by, the generator and its locked version, wakes the family too.
paths = [
    "docs/api/**",
    "fixtures/api/**",
    "backend/src/waterfall/api/contract/**",
    "backend/pyproject.toml",
    "backend/uv.lock",
    ".github/workflows/contract.yml",
    # The volumes and the readings of the witness (make mock-data), and the projection the
    # inventory reads.
    "tools/src/wftools/mock*.py",
    "tools/src/wftools/projection.py",
]
target = "check-contract"

[families.back]
# The tests of the back hold every answer of the service to the contract (ContractClient): a
# change of the contract alone — a status, a header — is confronted with the service (#671). They
# read what they test against besides: the tree of the functions in the projection of the
# specification (WF-ADM-0100), the examples of the contract and the fixtures of the numeric
# examples under fixtures/, and the file of the service platform, whose PostgreSQL they hold to the
# chain's and whose Redis to its rules (test_platform_images.py) — a change of these alone wakes
# them too (#794).
paths = [
    "backend/**",
    "docs/api/**",
    "docs/spec/waterfall-spec.md",
    "fixtures/**",
    "deploy/compose/compose.service.yaml",
    ".github/workflows/back.yml",
    # The thresholds of the coverage.
    "tools/src/wftools/codecoverage.py",
]
target = "check-back"

[families.roadmap]
# The stories quote the Vérif fields: the projection changing can break them too. The
# agents cite Makefile targets, which the same check holds.
paths = [
    "docs/roadmap/**",
    "docs/spec/waterfall-spec.md",
    "tools/src/wftools/roadmap.py",
    "tools/src/wftools/projection.py",
    ".github/workflows/roadmap.yml",
    ".claude/agents/**",
    "docs/dev/agents.md",
]
target = "check-roadmap"

[families.keycloak]
# The image of Keycloak, built and tried on the service platform at each change of what it is made
# of or started with (US-0350): the extension, the themes, the realm, the files of the platform,
# the tests that try it, with what they run on — their fixtures and helpers, the settings of Pytest
# and of their measure, the locked dependencies of the back —, and the whole code of the back: they
# serve the API, whose authentication, accounts and migrations only they try against Keycloak, and
# hold its answers to the contract, which wakes them too (#671). A platform started at each change
# of the back is the price of it.
paths = [
    "deploy/keycloak/**",
    "deploy/compose/compose.service.yaml",
    "deploy/compose/Caddyfile.service",
    "deploy/compose/keycloak-database.sql",
    "deploy/compose/service-database-role.sql",
    "deploy/compose/backup-database-role.sql",
    "backend/tests/test_keycloak_*.py",
    "backend/tests/conftest.py",
    "backend/tests/support.py",
    # The accounts and roles written around the service, which they take (#886).
    "backend/tests/access_rows.py",
    # The scratch database and the head of the migrations, that of the bootstrap (US-0420).
    "backend/tests/test_migrations.py",
    "backend/src/waterfall/**",
    "backend/pyproject.toml",
    "backend/coverage-keycloak.toml",
    "backend/uv.lock",
    "docs/api/**",
    ".github/workflows/keycloak.yml",
    ".github/actions/**",
    "tools/src/wftools/codecoverage.py",
]
target = "check-keycloak"

[families.service]
# The paths against the real service (US-0340), in the full tier only: the front, the back, the
# contract Prism holds the answers to, and the platform they all run on.
paths = [
    "frontend/**",
    "backend/**",
    "docs/api/**",
    "deploy/compose/compose.service.yaml",
    "deploy/compose/Caddyfile.service",
    "deploy/compose/keycloak-database.sql",
    "deploy/compose/service-database-role.sql",
    "deploy/compose/backup-database-role.sql",
    "deploy/keycloak/**",
    ".github/workflows/service.yml",
    ".github/actions/**",
    # The variant of the contract Prism serves as a proxy (make mock-spec).
    "tools/src/wftools/mock*.py",
]
target = "check-service"

[families.production]
# The production platform (US-0430), in the full tier only: the three images built here, then
# compose.prod.yaml started on them, bootstrapped and held — at each change of what it is made of:
# its files, the front end, the files it mounts from the platform it shares them with, and the
# trial itself (wftools.production). A change of what the images are made of alone is held after
# the merge, on the images published (images.yml).
paths = [
    "deploy/compose/compose.prod.yaml",
    "deploy/compose/compose.prod.local.yaml",
    "deploy/compose/Caddyfile.prod",
    "deploy/compose/production.env.example",
    "deploy/compose/garage.toml",
    "deploy/compose/storage-buckets.sh",
    "deploy/compose/keycloak-database.sql",
    "deploy/compose/service-database-role.sql",
    "deploy/compose/backup-database-role.sql",
    "deploy/compose/waterfall-database.sql",
    "tools/src/wftools/production.py",
    "tools/src/wftools/restoration_trial.py",
    "tools/src/wftools/images.py",
    ".github/workflows/production.yml",
    # The same images published, and the same trial on them, after a merge.
    ".github/workflows/images.yml",
    ".github/actions/**",
]
target = "check-production"

[families.front]
# The client of the front is generated from the contract: a contract change checks it. The
# examples of the contract are what the fake back serves to the end-to-end paths, and what
# the unit tests of the front read.
paths = [
    "frontend/**",
    "docs/api/**",
    "fixtures/api/**",
    ".github/workflows/front.yml",
    ".github/workflows/e2e.yml",
    # The catalogues, the routes of the examples, the coverage, what the build prerendered, and
    # the fake back the paths are played against (make mock, which Playwright starts).
    "tools/src/wftools/catalogs.py",
    "tools/src/wftools/exampleroutes.py",
    "tools/src/wftools/codecoverage.py",
    "tools/src/wftools/frontimage.py",
    "tools/src/wftools/images.py",
    "tools/src/wftools/mock*.py",
]
target = "check-front"

[families.front-image]
# The production image of the front (US-0430), which the chain publishes after a merge alone
# (images.yml): a pull request that changes what makes it builds it and starts it first — its
# Dockerfile and what it leaves out of its context, the configuration of Next, the dependencies.
# A change of the code of the front alone is built by the front family, not into the image, which
# holds what that build prerendered (make prerendered-front): the code of the pages decides it, and
# the build of the image is paid where the image itself changes. What the server checks as it
# starts — its hook, the settings it stops without (#825), and the refusal of the fake back
# (src/api/server.ts) — is held on the image started.
paths = [
    "frontend/Dockerfile",
    "frontend/.dockerignore",
    "frontend/next.config.ts",
    "frontend/src/instrumentation.ts",
    "frontend/src/startup.ts",
    "frontend/src/session/settings.ts",
    "frontend/src/api/server.ts",
    "frontend/package.json",
    "frontend/pnpm-lock.yaml",
    "frontend/pnpm-workspace.yaml",
    ".github/workflows/front-image.yml",
    ".github/actions/**",
    "tools/src/wftools/frontimage.py",
    "tools/src/wftools/images.py",
]
target = "check-front-image"

[[generated]]
paths = ["docs/spec/waterfall-spec.md"]
by = "make build-doc"

[[generated]]
paths = ["docs/api/INVENTORY.md"]
by = "make inventory"

[[generated]]
paths = ["LICENSES/**"]
by = "reuse download"

[[generated]]
paths = ["**/uv.lock"]
by = "uv lock"

[[generated]]
paths = ["frontend/pnpm-lock.yaml"]
by = "pnpm install"

[[generated]]
paths = ["frontend/src/api/generated/**"]
by = "make generate-client"

[[generated]]
paths = ["backend/src/waterfall/api/contract/models.py"]
by = "make generate-server-models"

[[generated]]
paths = ["fixtures/examples.json"]
by = "make fixtures"

