[tests]
# One family per key, in the order the coverage report lists them. A path belongs to the
# first family that matches it: the end-to-end paths live under frontend/, so they come
# before the front's, and those played against the real service under frontend/e2e/, so they come
# first: they traverse the back, and prove what it closes (US-0340). The kit of the front's tests
# (frontend/src/test/) — their fake client, their fixtures, their harness —, which the coverage of
# the code leaves out, is theirs. The fixtures are the data every family reads; a script among
# them is a tool. Nothing under docs/*/tools/ is a test.
end-to-end-service = ["frontend/e2e/service/**"]
end-to-end = ["frontend/e2e/**"]
front = ["frontend/**/*.test.ts", "frontend/**/*.test.tsx", "frontend/src/test/**"]
back = ["backend/tests/**"]
# The unit tests of the extension of Keycloak, which its build runs (docs/dev/java.md).
keycloak = ["deploy/keycloak/extension/src/test/**"]
tools = ["tools/tests/**", "fixtures/**"]
