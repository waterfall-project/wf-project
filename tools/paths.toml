# What the chain needs to know about the paths of the repository, declared once.
#
# - `families`: which family of checks a changed path wakes up. A pull request only pays for
#   the families it touches (US-0310); `always` families run whatever changed.
# - `shared`: paths every family depends on; touching one runs them all.
# - `generated`: paths a tool writes, with the command that writes them. They are left out
#   of the size of a lot and of the size limit of a source file (US-0050, US-0310).
# - `tests`: paths that hold tests, told apart from production code in the size of a lot.
#
# Patterns follow pathlib's full_match: `*` stays within a directory, `**` crosses them.

shared = [
    "Makefile",
    ".github/workflows/**",
    "tools/paths.toml",
]

[families.repo]
always = true
target = "check-repo"

[families.spec]
paths = ["docs/spec/**"]
target = "check-spec"

[families.contract]
paths = ["docs/api/**"]
target = "check-contract"

[families.back]
paths = ["backend/**"]
target = "check-back"

[families.roadmap]
# The stories quote the Vérif fields: the projection changing can break them too.
paths = ["docs/roadmap/**", "docs/spec/waterfall-spec.md", "tools/src/wftools/roadmap.py"]
target = "check-roadmap"

[families.front]
# The client of the front is generated from the contract: a contract change checks it.
paths = ["frontend/**", "docs/api/**"]
target = "check-front"

[[generated]]
paths = ["docs/spec/waterfall-spec.md"]
by = "make build-doc"

[[generated]]
paths = ["docs/api/INVENTORY.md"]
by = "make inventory"

[[generated]]
paths = ["LICENSES/**"]
by = "reuse download"

[[generated]]
paths = ["**/uv.lock"]
by = "uv lock"

[[generated]]
paths = ["frontend/pnpm-lock.yaml"]
by = "pnpm install"

[[generated]]
paths = ["frontend/src/api/generated/**"]
by = "make generate-client"

[[generated]]
paths = ["fixtures/examples.json"]
by = "make fixtures"

[tests]
paths = ["tools/tests/**", "backend/tests/**", "fixtures/**", "frontend/**/*.test.ts", "frontend/**/*.test.tsx", "frontend/e2e/**"]

# Paths excepted from the rules of sources (no suppression comment, 1,000 lines at most),
# each with its reason. An exception is temporary, and names what lifts it.
[[exceptions]]
paths = ["docs/spec/tools/**", "docs/api/tools/**"]
reason = "written before the rules; brought up to them by EP-01/L2 (#29), which removes this entry"
