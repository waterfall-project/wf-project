# What the chain needs to know about the paths of the repository, declared once.
#
# - `families`: which family of checks a changed path wakes up. A pull request only pays for
#   the families it touches (US-0310); `always` families run whatever changed.
# - `shared`: paths every family depends on; touching one runs them all.
# - `generated`: paths a tool writes, with the command that writes them. They are left out
#   of the size of a lot and of the size limit of a source file (US-0050, US-0310).
# - `tests`: paths that hold tests, told apart from production code in the size of a lot.
#
# Patterns follow pathlib's full_match: `*` stays within a directory, `**` crosses them.

shared = [
    "Makefile",
    ".github/workflows/**",
    # The whole tools project: this file, the code that interprets it, and the code that
    # implements the checks. A change there must run every family, or a pull request could
    # weaken a check without waking the family that relies on it.
    "tools/**",
]

[families.repo]
always = true
target = "check-repo"

[families.spec]
paths = ["docs/spec/**"]
target = "check-spec"

[families.contract]
# The long examples of the contract live under fixtures/api/: the contract cites them, its lint
# checks them against their schemas, and the volumes among them are checked up to date.
paths = ["docs/api/**", "fixtures/api/**"]
target = "check-contract"

[families.back]
paths = ["backend/**"]
target = "check-back"

[families.roadmap]
# The stories quote the Vérif fields: the projection changing can break them too. The
# agents cite Makefile targets, which the same check holds.
paths = [
    "docs/roadmap/**",
    "docs/spec/waterfall-spec.md",
    "tools/src/wftools/roadmap.py",
    ".claude/agents/**",
    "docs/dev/agents.md",
]
target = "check-roadmap"

[families.front]
# The client of the front is generated from the contract: a contract change checks it. The
# examples of the contract are what the fake back serves to the end-to-end paths, and what
# the unit tests of the front read.
paths = ["frontend/**", "docs/api/**", "fixtures/api/**"]
target = "check-front"

[[generated]]
paths = ["docs/spec/waterfall-spec.md"]
by = "make build-doc"

[[generated]]
paths = ["docs/api/INVENTORY.md"]
by = "make inventory"

[[generated]]
paths = ["LICENSES/**"]
by = "reuse download"

[[generated]]
paths = ["**/uv.lock"]
by = "uv lock"

[[generated]]
paths = ["frontend/pnpm-lock.yaml"]
by = "pnpm install"

[[generated]]
paths = ["frontend/src/api/generated/**"]
by = "make generate-client"

[[generated]]
paths = ["fixtures/examples.json"]
by = "make fixtures"

[[generated]]
# The volumes, and the named examples read from the core of the witness (wftools.mockcore).
paths = [
    "fixtures/api/volume/**",
    "fixtures/api/nodes.json",
    "fixtures/api/nodes_planning.json",
    "fixtures/api/nodes_estimate.json",
    "fixtures/api/nodes_milestone.json",
    "fixtures/api/nodes_risk_occurred.json",
    "fixtures/api/dependencies_summary.json",
    "fixtures/api/dependencies_summary_moved.json",
    "fixtures/api/dependencies_labour.json",
    "fixtures/api/dependencies_task_amount.json",
    "fixtures/api/dependencies_provision.json",
    "fixtures/api/dependencies_manual_float.json",
]
by = "make mock-data"

[tests]
paths = ["tools/tests/**", "backend/tests/**", "fixtures/**", "frontend/**/*.test.ts", "frontend/**/*.test.tsx", "frontend/e2e/**"]
