# l'autre. Intermittent : jamais tenu pour réglé.
[[known]]
version = "v0.3.0"
part = "tests"
issue = "#5141"
message = 'Exception ignored while calling deallocator <function BaseConnection\.__del__|<psycopg\.Connection object at 0x[0-9a-f]+> was deleted while still open'
intermittent = true
cause = "hypothèse : une connexion qu'une restauration échouée de v0.3.0 laisse ouverte, ramassée dans un test suivant"

