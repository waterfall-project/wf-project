# Les échecs connus de la famille `migrations` (US-2850, #4961), contre lesquels `make
# migrations-tests` et `make migrations-backup` jugent ce que leurs tests ont donné
# (wftools.migrationknown).
#
# La famille éprouve WF-DAT-0140 contre la dernière version publiée, N : les tests du back de N sur
# le schéma que les migrations de la branche font, et une sauvegarde de N restaurée puis migrée par
# la branche. Un échec y dit une incompatibilité ; elle devient un constat, réglé avant la
# publication de la version suivante, jamais dans le lot qui la trouve. Décision de l'auteur du
# 2026-11-27 (#4961) : une incompatibilité déjà trouvée ne bloque pas la file. Elle s'écrit ici, et
# la famille n'échoue que sur un échec qu'aucune entrée ne reconnaît — un échec nouveau.
#
# Une entrée `[[known]]` par cause. Elle donne :
#   version   la version N dont les tests échouent (`v0.3.0`) : les entrées d'une autre version ne
#             sont pas jugées, et l'outil le dit quand N passe à la suivante ;
#   part      `tests` (make migrations-tests) ou `backup` (make migrations-backup) ;
#   issue     le constat qui suit l'échec (`#5090`), ou
#   category  `frozen schema` à sa place : un test de N qui fige le schéma de N — le nom d'une
#             contrainte, un catalogue, un plan d'index —, que la branche a fait évoluer sans
#             incompatibilité pour le code ;
#   tests     les tests reconnus, nœuds de pytest (`tests/test_x.py::test_y`, un cas
#             `…::test_y[cas]`, tous les cas `…::test_y`, ou tout un fichier `tests/test_x.py`) ;
#   message   un motif (expression régulière de Python, cherchée et non ancrée) du texte de
#             l'échec : la trace, et ce que le test a écrit et journalisé ;
#   cause     ouverte par « établie : » ou « hypothèse : ».
# Une entrée reconnaît un échec quand ses tests le nomment et que son message s'y trouve ; sans
# tests, elle reconnaît tout échec dont le message porte son motif : une même erreur de mise en
# place, commune à beaucoup de tests, s'écrit ainsi plutôt qu'en mille identifiants. Un échec est
# à la première entrée qui le reconnaît.
#
# Une entrée qui n'échoue plus fait échouer la famille, comme un `xfail(strict=True)` : un test
# nommé qui passe, ou une entrée sans tests qui n'a rien reconnu. La liste se vide ainsi à mesure
# que les constats se règlent — le lot qui règle un constat retire ses entrées —, et aucune entrée
# ne reste masquer la régression du test qu'elle nomme. Un test qu'un morceau de la chaîne
# (`SHARD=i/N`) ne joue pas n'est pas jugé.
#
# Les issues de chaque test restent dans `.waterfall/migrations-tests.jsonl` et
# `.waterfall/migrations-backup.jsonl` (la chaîne les garde en artefact d'un job en échec) : une
# entrée s'écrit à partir d'elles.

# --- tests : les tests du back de v0.3.0 sur le schéma de la branche ---------------------------

# #5090 : 0029 ajoute installation.time_zone sans défaut ; v0.3.0 insère son installation sans elle.
# Une même erreur de mise en place, dans 1556 tests le 2026-11-27 : reconnue par son message.
# US-2850/L5 (#5118) rétablit le défaut et retire cette entrée.
[[known]]
version = "v0.3.0"
part = "tests"
issue = "#5090"
message = 'NotNullViolation\) null value in column "time_zone" of relation "installation" violates not-null constraint'
cause = "établie : 0029 retire le défaut de installation.time_zone, que le code de v0.3.0 n'écrit pas"

# #5091 : 0034 supprime resource_role.monthly_hours, que v0.3.0 lit et écrit. Écart accepté pour
# 0.3.0 → 0.4.0 (mise à jour avec arrêt, notes de v0.4.0) : l'entrée reste tant que N est v0.3.0.
# Reconnue par son message, dans l'insertion comme dans la lecture, et par l'échec du chargement du
# témoin de v0.3.0, qui écrit ses rôles avec cette colonne (`witness.failed`, journalisé une fois
# par la session) : chaque test qui le prend échoue à sa mise en place sur `load_witness`. 65 tests
# le 2026-11-27 ; 1521 une fois #5090 réglé.
[[known]]
version = "v0.3.0"
part = "tests"
issue = "#5091"
message = 'column (?:"monthly_hours" of relation "resource_role"|resource_role\.monthly_hours) does not exist|where 1 = load_witness\('
cause = "établie : 0034 supprime resource_role.monthly_hours, que le code et le témoin de v0.3.0 écrivent et lisent"

# Les tests de la commande du témoin, que le même échec arrête avant ce qu'ils affirment : sans le
# message de sa cause, que leur fixture `logs` garde. Masqués par #5090 le 2026-11-27.
[[known]]
version = "v0.3.0"
part = "tests"
issue = "#5091"
tests = [
  "tests/test_resource_settings_calendars.py::test_the_witness_loads_the_calendars_and_designates_its_default_one",
  "tests/test_witness.py::test_the_command_loads_the_witness_its_settings_given",
  "tests/test_witness.py::test_the_command_stops_saying_so_on_a_witness_the_rules_refuse_and_writes_nothing",
  "tests/test_witness.py::test_the_loading_dates_and_signs_every_object_as_the_platform_not_as_the_witness",
]
cause = "établie : la commande du témoin de v0.3.0 échoue sur resource_role.monthly_hours avant ce que ces tests affirment"

