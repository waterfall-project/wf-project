# --- backup : une sauvegarde de v0.3.0 restaurée puis migrée par la branche --------------------

# #5092 : 0047 supprime les 5 lignes de coûts réels du témoin de v0.3.0 importées sous un
# sous-projet absent, que la règle de la spécification 1.0.7 refuse (décision du 2026-11-21) ; elles
# reviennent par la réimportation de l'extraction, ce que disent les notes de v0.4.0. Exclusion connue
# de l'essai : reconnue à ses comptes exacts — la seule table perdue, 28 lignes puis 23 —, pour
# qu'une autre perte reste un échec nouveau.
[[known]]
version = "v0.3.0"
part = "backup"
issue = "#5092"
tests = ["tests/test_earlier_backup.py::test_a_backup_of_the_last_published_version_migrated_by_the_branch_loses_no_row"]
message = "assert \\{'cost_line': \\(28, 23\\)\\} == \\{\\}"
cause = "établie : 0047 supprime les lignes de coûts réels importées sous un sous-projet absent (décision du 2026-11-21)"
