# Famille D — la restauration (US-1890/L4) : trois causes, lues au journal des 16 passages où
# `backups.spec.ts` a échoué, du 2026-11-09 au 2026-11-10, toutes corrigées dans `epic/EP-07` avant
# le 2026-11-10 à 10 h 24 UTC. Depuis, sur les passages de la file créés jusqu'au 2026-11-12 à
# 23 h 18 UTC, `service / paths` a réussi 66 fois toutes branches confondues — le parcours joué et
# passé, à `:218` — et aucun de ses échecs ne nomme `backups.spec.ts` (le projet `restoration` y
# est sauté, 17 ou 18 parcours « skipped »). Seules les files dont le commit porte 38d0cfb2
# éprouvent le correctif de la cause 1 (une installation qui a joué les parcours d'EP-07, archive
# de plus de 5 Mio) : 44 des 66 (`git merge-base --is-ancestor 38d0cfb2 <headSha>` ; EP-07 8,
# EP-09 13, EP-24 13, main 6, cadrage 3, EP-23 1) ; les 22 autres (EP-23, EP-06, EP-09 et main
# avant EP-07) ne l'éprouvent pas. Ces comptes se refont par
#   gh run list --workflow chain --event merge_group --limit 400 \
#     --created '2026-11-10T10:24:00Z..2026-11-12T23:18:00Z' --json databaseId,headBranch,headSha
# puis, pour chaque passage, `gh run view <id> --json jobs` (conclusion de `service / paths`).
# Le seuil de cinquante passages de la conception n'est atteint nulle part : ni sur `epic/EP-24`
# (13 passages jusqu'à 23 h 18 UTC, 15 avec 43327741296 et 43331074606, sans échec de
# `backups.spec.ts`), ni sur les files qui portent les correctifs (44 jusqu'au 2026-11-12 à
# 23 h 18 UTC ; 46 avec ces deux passages réussis d'`epic/EP-24` du 12 au soir). Les causes 1 et 3
# tiennent donc par leur cause établie au journal et leur commit de correction, non par l'absence
# de récidive ; la cause 2 reste ouverte sous #3005. Une ligne de parcours bouge avec son fichier :
# `:155` et `:240` sont celles des versions de ces passages, et un échec du parcours d'aujourd'hui
# reste « à classer ».

[[known]]
class = "known flakiness"
family = "D. restauration : une part du dépôt réécrite par Prism"
issue = "#2943"
runs = [
  42694339848,
  42768480280,
  42771364161,
  42776667587,
  42779115359,
  42781594967,
  42786653809,
  42786655299,
]
job = '^service / paths(?: \(\d+/\d+\))?$'
test = 'e2e/service/backups\.spec\.ts:155\b'
message = '''name: 'Restaurer cette sauvegarde' \}\)'''
frequency = "8 passages, du 2026-11-09 à 20 h 35 au 2026-11-10 à 8 h 57 UTC, sur trois pull requests d'EP-07 (#2692, #2755, #2760) : « Restaurer cette sauvegarde » absent après 60 s (`backups.spec.ts:226`)"
cause = "établie : Prism, mandataire du contrat du banc, réécrit en U+FFFD chaque octet au-delà de 0x7f d'un corps qu'il lit comme du texte ; l'archive d'une installation qui a joué les parcours d'EP-07 dépasse 5 Mio et se dépose en parts, et une coupure qui tombe dans une séquence réécrite change la taille de la part, que l'API refuse (422, `PUT /chunked-uploads/…/parts/1`, lu au journal de 42786655299) ; un aléa du contenu, mesuré dans #2695. Corrigée par les jambes de `deploy/compose/contract-proxy.mjs`, qui passent les octets d'un corps non JSON sans Prism (38d0cfb2, fusionnée dans `epic/EP-07` le 2026-11-10 à 10 h 23 UTC par #2761, 3b9f8ca9)"

[[known]]
class = "regression"
family = "D. restauration : plus de verrous qu'une transaction n'en a"
issue = "#3005"
runs = [42598617718, 42599195472, 42622915790]
job = '^service / paths(?: \(\d+/\d+\))?$'
test = 'e2e/service/backups\.spec\.ts:155\b'
message = 'Timeout: 420000ms'
frequency = "3 passages le 2026-11-09, de 10 h à 13 h UTC, sur #2638 et #2672 : la restauration ni terminée ni refusée en 420 s (`backups.spec.ts:262`)"
cause = "hypothèse : `pg_restore --single-transaction` après `DROP SCHEMA public CASCADE` verrouille chaque table, partition par projet et index ; les parcours d'EP-07 créent assez de projets pour passer les 64 verrous par transaction du défaut, la restauration échoue (« out of shared memory ») et la plateforme reste en maintenance. Seule source : le message de 783db2ed, qui a mesuré la cause et l'a corrigée par `max_locks_per_transaction` à 1024 (fusionnée dans `epic/EP-07` le 2026-11-09 à 13 h 27 UTC par #2638, 97eeff48) ; 42622915790, de #2672, la précède dans la file. Le journal du service `restore` n'était pas versé dans celui du job : ceux des trois passages (42598617718, 42599195472, 42622915790) ne portent ni `shared memory` ni `max_locks`. Il l'est depuis fd948df1 (US-1570/L4, 2026-11-10), et `service.yml` verse aussi, au premier échec, les lignes du journal de PostgreSQL qui nomment `shared memory`, `max_locks_per_transaction`, `deadlock` ou `could not obtain lock` (US-1890/L1). « (none) » y écarte la mémoire des verrous (`out of shared memory`, `max_locks_per_transaction`) et les blocages mutuels ; il n'écarte pas une simple attente de verrou, que PostgreSQL ne journalise pas (`log_lock_waits` est à `off`) : `could not obtain lock` n'existe que sous `lock_timeout` ou `NOWAIT`. Le suivi reste sous #3005 (ouverte jusqu'à cinquante passages sans récidive)"

