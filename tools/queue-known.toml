# Les échecs connus de la file de fusion (`chain`, `merge_group`), contre lesquels
# `make queue-report` classe ce qu'il lit (wftools.queue, US-1880).
#
# Une entrée `[[known]]` par instabilité connue. Elle reconnaît un échec quand tous les motifs
# qu'elle donne s'y retrouvent (expressions régulières de Python, cherchées et non ancrées) :
#   job      le nom du job (« service / paths (1/4) », « e2e / paths (2/5) ») ; `service / paths`
#            se joue en quatre morceaux depuis US-1910/L3 : son motif reconnaît chacun, et le nom
#            d'avant, sans morceau, des passages antérieurs ;
#   step     l'étape en échec du job, ou la cible du Makefile que `make: ***` nomme ;
#   test     le test ou le parcours, « fichier:ligne titre » (`e2e/revisions.spec.ts:238 …`,
#            `tests/test_x.py test_y` quand pytest ne passe pas par le fichier du test) ;
#   lines    [première, dernière] : la ligne du test dans cet intervalle, à côté de `test` ;
#   message  l'endroit et le message de l'échec, et le passage du journal qui le porte ;
#   runs     les passages, par leur identifiant : obligatoire pour une régression.
# La première entrée qui reconnaît un échec le classe ; aucune, et il est « à classer »
# (`to classify`) : l'outil ne décide jamais seul. `class` vaut `known flakiness`
# (instabilité connue), `infrastructure` ou `regression` ; une régression ne s'écrit qu'après la
# relecture du passage, qu'elle nomme par `runs`. `family`, `issue` (l'issue qui la suit),
# `frequency` et `cause` sont dus ; la cause s'ouvre par « établie : » ou « hypothèse : ».
#
# L'inventaire est celui de la conception d'EP-24 (« La chaîne : ce qui est mesuré »), relevé
# sur les passages du 2026-11-05 au 2026-11-12. Une ligne de parcours bouge avec son fichier :
# l'intervalle `lines` est celui des passages relevés, et le lot qui corrige une famille
# retire ou met à jour ses entrées.
#
# Une entrée qui nomme un test donne aussi, quand l'inventaire le connaît, le `message` qui
# l'accompagne, pour qu'une autre défaillance du même test reste « à classer » : les entrées de la
# famille A attendent `own-project.ts` (n'importe quelle ligne), celles de la famille D le
# localisateur ou le délai de l'attente, relu dans les journaux de ses 16 passages (extraits :
# tests/queue/playwright-backups-*.log).
# Les entrées de la famille B se reconnaissent par le titre du parcours, que sa ligne ne suit plus
# depuis US-1890/L2 ; celles de la famille C et du back reconnaissent encore un test par sa seule
# ligne, faute d'un message relevé.

# La référence contre laquelle un lot de la chaîne se juge, avant et après. Les comptes sont ceux de
# la conception : toutes branches, du 2026-11-05 au 2026-11-12. La durée est celle que l'outil
# mesure (`make queue-report`, toutes branches, passages créés les 2026-11-10 et 2026-11-11) : le
# mur des passages réussis dont le palier est complet (`Run.complete` : un job réussi de `service`
# et un d'`e2e`), du début du passage à la fin de son dernier job ; 40 passages, médiane 17,8 min,
# 90e centile 21,8. La conception en donne 16 min : sa médiane (15,7 le 10, 15,9 le 11) compte tous
# les passages réussis, dont ceux qui sautent `service` et l'e2e, ce qui l'abaisse. Laquelle de ces
# deux mesures juge les critères d'US-1910 est la décision de #2989.
[reference]
since = 2026-11-05
until = 2026-11-12
runs = 370
failed = 88
failed_in = { "service / paths" = 68 }
wall_runs = 40
wall_median = 17.8
wall_p90 = 21.8
wall_days = [2026-11-10, 2026-11-11]

