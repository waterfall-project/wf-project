# Les échecs connus de la file de fusion (`chain`, `merge_group`), contre lesquels
# `make queue-report` classe ce qu'il lit (wftools.queue, US-1880).
#
# Une entrée `[[known]]` par instabilité connue. Elle reconnaît un échec quand tous les motifs
# qu'elle donne s'y retrouvent (expressions régulières de Python, cherchées et non ancrées) :
#   job      le nom du job (« service / paths », « e2e / paths (2/5) ») ;
#   step     l'étape en échec du job, ou la cible du Makefile que `make: ***` nomme ;
#   test     le test ou le parcours, « fichier:ligne titre » (`e2e/revisions.spec.ts:238 …`,
#            `tests/test_x.py test_y` quand pytest ne passe pas par le fichier du test) ;
#   lines    [première, dernière] : la ligne du test dans cet intervalle, à côté de `test` ;
#   message  l'endroit et le message de l'échec, et le passage du journal qui le porte ;
#   runs     les passages, par leur identifiant : obligatoire pour une régression.
# La première entrée qui reconnaît un échec le classe ; aucune, et il est « à classer »
# (`to classify`) : l'outil ne décide jamais seul. `class` vaut `known flakiness`
# (instabilité connue), `infrastructure` ou `regression` ; une régression ne s'écrit qu'après la
# relecture du passage, qu'elle nomme par `runs`. `family`, `issue` (l'issue qui la suit),
# `frequency` et `cause` sont dus ; la cause s'ouvre par « établie : » ou « hypothèse : ».
#
# L'inventaire est celui de la conception d'EP-24 (« La chaîne : ce qui est mesuré »), relevé
# sur les passages du 2026-11-05 au 2026-11-12. Une ligne de parcours bouge avec son fichier :
# l'intervalle `lines` est celui des passages relevés, et le lot qui corrige une famille
# retire ou met à jour ses entrées.

# La référence contre laquelle un lot de la chaîne se juge, avant et après : toutes branches,
# du 2026-11-05 au 2026-11-12 ; la médiane de mur est celle des passages réussis des 10 et 11.
[reference]
since = 2026-11-05
until = 2026-11-12
runs = 370
failed = 88
failed_in = { "service / paths" = 68 }
wall_median = 16
wall_days = [2026-11-10, 2026-11-11]

