frequency = "5 passages le 2026-11-10, de 8 h 25 à 8 h 46 UTC, chacun portant #2761 : la grille « Sauvegardes » absente après 10 s, avant la sauvegarde (`backups.spec.ts:272`)"
cause = "établie : 217b891a (#2761) attend la grille avant de relever les sauvegardes déjà listées ; une installation neuve n'en a aucune et l'écran ne montre alors que leur décompte, sans grille. Le parcours échoue à chaque passage qui la porte ; corrigé dans la pull request avant sa fusion (5a9ed26b, qui attend « Sauvegarder maintenant » et ne lit la grille que si elle est là)"

