[project]
name = "wftools"
version = "0.1.0"
description = "Repository tools of Waterfall: they read the specification projection and check the repository against it."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "hadolint-py>=2.15.1.3",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8",
    "pyyaml>=6.0",
    "reuse>=6.3.0",
    "ruff>=0.17.3",
    "shellcheck-py>=0.11.0.1",
    "tzdata>=2026.6",
]
# The binary of actionlint, which `actionlint-py` downloads from GitHub Releases when it is built
# from its sources (PyPI holds no wheel of it): out of the default group, so that no install of the
# tools needs GitHub Releases but the one that lints the workflows (make lint-workflows, US-1900).
workflows = [
    "actionlint-py>=1.7.12.25",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = [
    "src",
    "tests",
    "../docs/api/tools",
    "../docs/spec/tools",
]
# The tools of the specification and of the contract run as scripts, from their directory.
extraPaths = ["../docs/spec/tools", "../docs/api/tools"]
# `# type: ignore` is not honoured: a type error is fixed, never silenced (US-0050).
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../docs/api/tools", "../docs/spec/tools"]
# The tests of the entrypoint of the directory start containers: `make test-openldap` selects them,
# `-m openldap` overriding the selection below.
addopts = ["--strict-markers", "--strict-config", "-m", "not openldap"]
markers = [
    "requirement(identifier): the requirement this test covers, cited by its full identifier (WF-QUA-0010)",
    "openldap: tries the entrypoint of the directory in Docker (make test-openldap)",
]
xfail_strict = true
filterwarnings = ["error"]
