# The specification: the projection builds from the Word document without a warning, and the
# versioned projection is the one it produces. Mermaid figures are validated on a
# workstation only (mmdc needs a browser); the build reports them as not validated here.
name: spec

on:
  workflow_call:

permissions:
  contents: read

env:
  # The version the projection is generated with: another version of pandoc writes another
  # Markdown, and the check would fail on a document nobody changed.
  PANDOC_VERSION: 3.13
  PANDOC_SHA256: 7e3736f255090296ca5d1a14291a76b9b3c43cd385011b1621a4d0c16091a70f

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A release download answers a passing 502 or 504 now and then (#2530): curl tries again.
      - name: Install pandoc
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          echo "${PANDOC_SHA256}  pandoc.deb" | sha256sum --check --strict
          sudo dpkg -i pandoc.deb
          rm pandoc.deb
      - run: make check-spec
