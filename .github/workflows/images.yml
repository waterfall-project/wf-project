# The images of Waterfall (US-0430): front, waterfall — the API, the worker, its schedule and the
# migrations — and keycloak, built at each push to main or to an epic branch, that is at each merge,
# which the merge queue has already held to the chain, and published on ghcr.io/waterfall-project,
# tagged by commit, by branch, and on main by version, once: the tag of a version is immutable
# (make images). Nothing is published from a pull request: none triggers this workflow. No secret
# enters a build (WF-SEC-0010); the token that publishes is given to the login alone. The production
# platform is then started on the images just published, bootstrapped and held (make
# production-trial, US-0430).
name: images

on:
  push:
    branches: [main, "epic/**"]

permissions:
  contents: read

# A merge waits for the publication of the one before it on its branch, never cancels it. GitHub
# keeps one run waiting by group, though: a third merge cancels the one that waits. The last merge
# wins — the tag of the branch ends on it —, and a commit between two may have no image.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Writing packages is what publishing is: this job alone asks for it.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          IMAGE_BRANCH: ${{ github.ref_name }}
          IMAGE_COMMIT: ${{ github.sha }}
        run: make images PUSH=yes

  # The production platform on the images the job above published, pulled from the registry by the
  # hash of this commit, under a local name: bootstrapped, its API's liveness and the sign-in of its
  # first administrator held (US-0430, WF-ARC-0050).
  trial:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Reading packages is what pulling them is, when the registry keeps them private.
    permissions:
      contents: read
      packages: read
    env:
      # The platform lives for the job and is reachable from the runner alone: values of the chain,
      # visible, named as such (production.yml).
      WATERFALL_POSTGRES_ADMIN_PASSWORD: chain-only-postgres-admin
      WATERFALL_POSTGRES_PASSWORD: chainonlypostgres
      WATERFALL_SERVICE_DATABASE_PASSWORD: chainonlyservice
      WATERFALL_BACKUP_DATABASE_PASSWORD: chainonlybackup
      WATERFALL_REDIS_PASSWORD: chainonlyredis
      WATERFALL_KEYCLOAK_DATABASE_PASSWORD: chain-only-keycloak-database
      WATERFALL_KEYCLOAK_ADMIN_PASSWORD: chain-only-keycloak-admin
      WATERFALL_FRONT_CLIENT_SECRET: chain-only-front-client
      WATERFALL_SERVICE_CLIENT_SECRET: chain-only-service-client
      WATERFALL_INSTALLATION_CLIENT_SECRET: chain-only-installation-client
      WATERFALL_SERVER_ACTIONS_KEY: Y2hhaW4tb25seS1zZXJ2ZXItYWN0aW9ucy1rZXktMzI=
      WATERFALL_STORAGE_SECRET: chain-only-storage-secret
      WATERFALL_STORAGE_RPC_SECRET: c0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ff
      # The trial backs the platform up, then restores it, by its API (US-0440, #948).
      WATERFALL_TRIAL_RESTORATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          WATERFALL_IMAGE_TAG: ${{ github.sha }}
        run: make production-trial

  # The cache of the builds of the three images (type=gha), which the chain reads at each pull
  # request and in the merge queue: written here, after a merge, on the branch every pull request
  # of it reads the caches of. Built into the cache alone, neither loaded nor published: beside the
  # publication, which it neither waits for nor changes (make build-cache).
  cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-cache
      - run: make build-cache
