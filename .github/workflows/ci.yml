# The chain: one job decides which families a change touches, one reusable workflow per
# family runs its checks, and the gate judges them all. The gate is the only check branch
# protection requires: a family skipped because nothing touched it is not a failure, where a
# required workflow that never ran would stay "expected" and block the merge.
#
# Two tiers: the fast one on every push to a pull request, the full one in the merge queue,
# on the result of the merge, before it is accepted (US-0310). Every step calls the Makefile.
# The front family runs in two workflows side by side: front.yml for all but the end-to-end
# paths, e2e.yml for the paths, in the full tier only and spread over several runners (#492).
# The paths against the real service, which traverse the front, the back and the platform, run
# in the full tier only too (service.yml, US-0340), as does the production platform started on the
# images built here (production.yml, US-0430). Both kinds of paths play the front built for
# production once in the run, by the job front-build (US-0590).
name: chain

on:
  pull_request:
    branches: [main, "epic/**"]
  merge_group:
  # Run by hand on a branch, every family and the full tier by default: what the merge
  # queue runs, for a branch whose merge queue is not set yet.
  workflow_dispatch:
    inputs:
      tier:
        description: Tier of the chain
        type: choice
        options: [full, fast]
        default: full

permissions:
  contents: read

concurrency:
  group: chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # The tier, decided once: full in the merge queue, the one chosen when run by hand.
      tier: ${{ github.event_name == 'merge_group' && 'full' || inputs.tier || 'fast' }}
      spec: ${{ steps.families.outputs.spec }}
      contract: ${{ steps.families.outputs.contract }}
      back: ${{ steps.families.outputs.back }}
      front: ${{ steps.families.outputs.front }}
      front-image: ${{ steps.families.outputs.front-image }}
      roadmap: ${{ steps.families.outputs.roadmap }}
      keycloak: ${{ steps.families.outputs.keycloak }}
      service: ${{ steps.families.outputs.service }}
      production: ${{ steps.families.outputs.production }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - id: families
        env:
          # Empty when run by hand: every family is then run.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.sha }}
        run: make changes >> "$GITHUB_OUTPUT"

  repo:
    uses: ./.github/workflows/repo.yml

  spec:
    needs: changes
    if: needs.changes.outputs.spec == 'true'
    uses: ./.github/workflows/spec.yml

  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    uses: ./.github/workflows/contract.yml

  back:
    needs: changes
    if: needs.changes.outputs.back == 'true'
    uses: ./.github/workflows/back.yml
    with:
      tier: ${{ needs.changes.outputs.tier }}

  front:
    needs: changes
    if: needs.changes.outputs.front == 'true'
    uses: ./.github/workflows/front.yml
    with:
      tier: ${{ needs.changes.outputs.tier }}

  # The front built for production once for the whole run (US-0590): each part of the end-to-end
  # paths, the measure and the paths against the service download this build and play it, and
  # build nothing again (E2E_BUILT). Here, whenever either of them runs: e2e.yml and service.yml
  # are two called workflows, whose jobs no `needs` joins. On the runner, as front.yml builds: the
  # parts of e2e.yml start it in Playwright's image, on its Node 24 and its Ubuntu noble, amd64, at
  # another path of the workspace, which the build does not depend on; service.yml on the runner.
  front-build:
    needs: changes
    if: >-
      needs.changes.outputs.tier == 'full'
      && (needs.changes.outputs.front == 'true' || needs.changes.outputs.service == 'true')
    runs-on: ubuntu-24.04
    # The installation and the build of the front, about four minutes on a hosted runner.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm, at the version `packageManager` names, must exist before setup-node caches it.
      - run: corepack enable pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: make build-front
      # The build without Next's cache, which only a later build reads, for one day: each job that
      # plays it downloads it where the build wrote it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: front-build
          path: |
            frontend/.next/
            !frontend/.next/cache/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The other half of the front family: skipped in the fast tier as when the front is not
  # touched, which the gate does not count as a failure.
  e2e:
    needs: [changes, front-build]
    if: needs.changes.outputs.front == 'true' && needs.changes.outputs.tier == 'full'
    uses: ./.github/workflows/e2e.yml

  # The production image of the front, built and started when a pull request changes what makes
  # it (US-0430): images.yml publishes it after the merge alone.
  front-image:
    needs: changes
    if: needs.changes.outputs.front-image == 'true'
    uses: ./.github/workflows/front-image.yml

  roadmap:
    needs: changes
    if: needs.changes.outputs.roadmap == 'true'
    uses: ./.github/workflows/roadmap.yml

  keycloak:
    needs: changes
    if: needs.changes.outputs.keycloak == 'true'
    uses: ./.github/workflows/keycloak.yml

  # Skipped in the fast tier as when nothing it traverses is touched.
  service:
    needs: [changes, front-build]
    if: needs.changes.outputs.service == 'true' && needs.changes.outputs.tier == 'full'
    uses: ./.github/workflows/service.yml

  # The production platform on the three images built here (US-0430): in the full tier only, as
  # when nothing it is made of is touched; images.yml holds it again on the images it publishes.
  production:
    needs: changes
    if: needs.changes.outputs.production == 'true' && needs.changes.outputs.tier == 'full'
    uses: ./.github/workflows/production.yml

  gate:
    # Every job of the chain, each part of the end-to-end paths included: the result of e2e is
    # a failure as soon as one of its parts failed or was cancelled. A build of the front that
    # failed skips e2e and service, which front-build here says.
    needs:
      - changes
      - repo
      - spec
      - contract
      - back
      - front
      - front-build
      - e2e
      - front-image
      - roadmap
      - keycloak
      - service
      - production
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: make gate
