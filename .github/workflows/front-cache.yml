# The caches of the front written after each merge, on the branch every pull request into it and
# its merge queue read the caches of: the store of pnpm (setup-node), which a pull request would
# otherwise download again at its first run, and the merge queue at each of its runs; and the
# cache of ESLint (front.yml). Nothing is checked here: the chain did, before the merge.
name: front-cache

on:
  push:
    branches: [main, "epic/**"]
    paths: ["frontend/**"]

permissions:
  contents: read

# The last merge wins: the caches of the one before it are superseded.
concurrency:
  group: front-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm, at the version `packageManager` names, must exist before setup-node caches it.
      - run: corepack enable pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.eslintcache
          key: eslint-${{ github.sha }}
          restore-keys: eslint-
      - run: make lint-front
