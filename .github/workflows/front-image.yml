# The production image of the front (US-0430), which images.yml publishes after a merge alone:
# built from frontend/Dockerfile and started at a pull request that changes what makes it, in both
# tiers. It answers /, refuses the fake back of the mock-up, and prerenders no page that would read
# the environment at the build (make check-front-image).
name: front-image

on:
  workflow_call:

# Reading packages is what pulling the mirror of the images of Docker Hub is (ci.yml, mirror).
permissions:
  contents: read
  packages: read

# The Dockerfiles and the Compose files pull Docker Hub's images from the mirror (ci.yml, mirror).
env:
  WATERFALL_MIRROR: ghcr.io/waterfall-project/mirror/

jobs:
  check:
    runs-on: ubuntu-26.04
    # The build of the front, about a minute and a half on a workstation in October 2026, and two
    # starts of a few seconds.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The cache of the builds of images, written after a merge (images.yml).
      - uses: ./.github/actions/build-cache
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          save-cache: false
          cache-local-path: /tmp/setup-uv-cache
          cache-dependency-glob: tools/uv.lock
      - run: make check-front-image
