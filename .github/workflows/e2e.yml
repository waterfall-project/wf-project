# The end-to-end paths of the front (US-0080), in the full tier only: the other half of the
# front family, side by side with front.yml (#492). Every part plays the front built for production
# once in the run of the chain, by its job front-build, which the paths against the service play too
# (ci.yml, US-0590): the paths spread over three runners, each playing one part of them (make e2e
# SHARD=i/3), and the measure of the second of §4.6.2 (US-0110) on a fourth, alone (make
# e2e-measure), which then holds the routes the build prerendered (make prerendered-front, US-0430).
# Called by ci.yml alone, which uploads the build before: no part builds it. A part that fails
# fails this workflow, and the gate with it.
#
# Each part runs in Playwright's image, which carries Chromium and its system packages: no
# apt, no mirror whose speed is not ours (#472). The image is the one of the Playwright version
# frontend/pnpm-lock.yaml resolves, pinned by digest: raising @playwright/test raises it too,
# or the paths stop at once on a browser they cannot find.
name: e2e

on:
  workflow_call:

permissions:
  contents: read

env:
  # The image has no make: the package of its Ubuntu, noble, pinned and checked like pandoc
  # in spec.yml, then installed alone — it needs nothing but the C library.
  MAKE_DEB: https://archive.ubuntu.com/ubuntu/pool/main/m/make-dfsg/make_4.3-4.1build2_amd64.deb
  MAKE_DEB_SHA256: 1fe6a815b56c7b6e9ce4086a363f09444bbd0a0d30e230c453d0b78e44b57a99

jobs:
  paths:
    # Shown as e2e / paths (i/3) and e2e / measure.
    name: ${{ matrix.part == 'measure' && 'measure' || format('paths ({0})', matrix.part) }}
    runs-on: ubuntu-24.04
    container:
      # The multi-architecture index of the tag v1.63.0-noble, as the registry served it on
      # 2026-10-07 (docs/dev/README.md, « The chain », says how to read it); the tag follows the
      # lock file, which tools/tests/test_playwrightimage.py holds.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      # Chromium shares memory through /dev/shm, which Docker bounds to 64 MB; Playwright's
      # documentation runs its image with the host's.
      options: --ipc=host
    # Three parts, not four: Playwright spreads whole files, at equal numbers of tests, and the
    # longest files weigh; by October 2026 the longest of three parts played about 140 s of
    # tests on two workers, of four 130 s, where each part pays about two minutes of image,
    # installation and servers. Every part runs to its end: one failing does not cancel the
    # others, whose results say whether the code fails or one path.
    strategy:
      fail-fast: false
      matrix:
        part: ["1/3", "2/3", "3/3", measure]
    # A part of the paths should take about 5 minutes, the measure as much: two tests of at most
    # 3 minutes each. 15 leaves room for a slow runner, not for a path stuck.
    timeout-minutes: 15
    env:
      # The front ci.yml built: the harness starts it, and builds nothing (playwright.config.ts).
      E2E_BUILT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install make
        run: |
          curl -sSfL -o make.deb "${MAKE_DEB}"
          echo "${MAKE_DEB_SHA256}  make.deb" | sha256sum --check --strict
          dpkg -i make.deb
          rm make.deb
      # Node is the image's; pnpm, at the version `packageManager` names, must exist before
      # setup-node caches its store.
      - run: corepack enable pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # The fake back serves a variant of the contract that the repository tools derive, in
      # Python (make mock-spec).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: front-build
          path: frontend/.next/
      # The browser is the image's: make e2e, never check-front-e2e, which would install one.
      - if: matrix.part != 'measure'
        run: make e2e
        env:
          SHARD: ${{ matrix.part }}
      - if: matrix.part == 'measure'
        run: make e2e-measure
      # The front built for every part prerenders as its image would: what it prerendered is held
      # here, on every change of the front, without building the image (US-0430).
      - if: matrix.part == 'measure'
        run: make prerendered-front
