# The end-to-end paths of the front (US-0080), in the full tier only: the other half of the
# front family, side by side with front.yml (#492). Every part plays the front built for production
# once in the run of the chain, by its job front-build, which the paths against the service play too
# (ci.yml, US-0590): the paths spread over five runners, each playing one part of them (make e2e
# SHARD=i/5), and the measure of the second of §4.6.2 (US-0110) on a sixth, alone (make
# e2e-measure), which then holds the routes the build prerendered (make prerendered-front, US-0430).
# Called by ci.yml alone, which uploads the build before: no part builds it. A part that fails
# fails this workflow, and the gate with it.
#
# Each part runs in the work image of the paths (deploy/e2e, US-1900), which ci.yml finds or
# publishes before them: Playwright's image, which carries Chromium and its system packages, with
# make, the Python of the tools and pnpm. No apt, no mirror whose speed or whose answer is not ours
# (#472, #2913). Its base is the image of the Playwright version frontend/pnpm-lock.yaml resolves,
# pinned by digest: raising @playwright/test raises it too, or the paths stop at once on a browser
# they cannot find.
name: e2e

on:
  workflow_call:
    inputs:
      image:
        description: The work image of the paths, by digest (make e2e-image)
        type: string
        required: true

permissions:
  contents: read

jobs:
  paths:
    # Shown as e2e / paths (i/5) and e2e / measure.
    name: ${{ matrix.part == 'measure' && 'measure' || format('paths ({0})', matrix.part) }}
    runs-on: ubuntu-26.04
    # The image is read from the registry, where it may be private; one that cannot be pulled fails
    # the initialisation of the job, naming the registry, before any step.
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Chromium shares memory through /dev/shm, which Docker bounds to 64 MB; Playwright's
      # documentation runs its image with the host's.
      options: --ipc=host
    # Five parts, spread by the seconds each path took on a real run (make e2e SHARD=i/5,
    # tools/e2e-durations.json, US-1910): Playwright's --shard spreads whole files at equal numbers
    # of tests, and the longest weigh. By November 2026, accessibility.spec.ts grown, the paths play
    # about 1400 s in all, and each part pays about 75 s of image, installation and servers (#2015).
    # Every part runs to its end: one failing does not cancel the others, whose results say whether
    # the code fails or one path.
    strategy:
      fail-fast: false
      matrix:
        part: ["1/5", "2/5", "3/5", "4/5", "5/5", measure]
    # A part of the paths should take about 4 minutes, the measure as much: two tests of at most
    # 3 minutes each. 15 leaves room for a slow runner, not for a path stuck.
    timeout-minutes: 15
    env:
      # The front ci.yml built: the harness starts it, and builds nothing (playwright.config.ts).
      E2E_BUILT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node and pnpm, at the version `packageManager` names, are the image's. The store of that
      # pnpm is read, never written: front-cache.yml writes it.
      - uses: ./.github/actions/pnpm-store
      # The fake back serves a variant of the contract that the repository tools derive, in
      # Python (make mock-spec), the Python of tools/.python-version the image carries as python3,
      # which the guard and slots.py run by too (Makefile, SLOTS). No cache of uv: its key names the
      # system and the Python setup-uv finds, here the image's (ubuntu-24.04, 3.14.10), on the runner
      # where front-cache.yml writes it the runner's (ubuntu-26.04, 3.14.4), and no writer's key was
      # ever found here (#3062: 43497273980, against 43503925551); the tools install in 4 seconds.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: front-build
          path: frontend/.next/
      # The browser is the image's: make e2e, never check-front-e2e, which would install one.
      - if: matrix.part != 'measure'
        run: make e2e
        env:
          SHARD: ${{ matrix.part }}
      - if: matrix.part == 'measure'
        run: make e2e-measure
      # The front built for every part prerenders as its image would: what it prerendered is held
      # here, on every change of the front, without building the image (US-0430).
      - if: matrix.part == 'measure'
        run: make prerendered-front
