# The back: lint and format, strict types, the boundaries of the core, then the tests, spread over
# four runners and, in the full tier, measured and their measures gathered (make check-back-static,
# check-back-tests, coverage-back-merge). The tests of the data run against a real PostgreSQL, those
# of the queue of tasks against a real Redis, services of the job, and those of the backups against
# a real object storage, Garage, which a service of the job cannot start with the arguments it
# needs (the guide, "Tests").
name: back

on:
  workflow_call:
    inputs:
      tier:
        description: fast on every push, full when merging (coverage)
        type: string
        default: fast

# Reading packages is what pulling the mirror of the images of Docker Hub is (ci.yml, mirror).
permissions:
  contents: read
  packages: read

# The Dockerfiles and the Compose files pull Docker Hub's images from the mirror (ci.yml, mirror).
env:
  WATERFALL_MIRROR: ghcr.io/waterfall-project/mirror/

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: false
          cache-dependency-glob: backend/uv.lock
      - run: make check-back-static

  tests:
    name: tests (${{ matrix.part }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        part: ["1/4", "2/4", "3/4", "4/4"]
    # Each half took 10 to 16 minutes before the witness was loaded once by each process (#2157),
    # then 10 to 18 on 2026-11-12 and 13, a minute or two from this delay: four parts of a quarter
    # of the tests each (US-1910) should play in less than that, the fixed cost of a runner
    # (services, `uv sync`, collection) apart. The delay stays, a margin to the slowest runner
    # rather than a wait, until the queue has measured the quarters.
    timeout-minutes: 20
    services:
      postgres:
        # The version the platform targets (deploy/compose/compose.service.yaml), by its digest.
        image: ghcr.io/waterfall-project/mirror/postgres:18-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          # A server that lives for the job and is reachable from the runner alone.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Its data in memory, as on a workstation (compose.test.yaml): on the disk of the runner,
        # each commit waits for its write, and the tests that load the witness wait the most.
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready --host 127.0.0.1 --username postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        # The image of the service platform, by its digest, which lives for the job.
        image: ghcr.io/waterfall-project/mirror/redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The client of the server's major (the Dockerfile of the back, #982): pg_dump refuses to run
      # against a server newer than itself, and the tests of the back back up and restore on a 18.
      # The image of the runner, ubuntu-26.04, carries the client 18 (postgresql-client-18, of the
      # PGDG repository: `apt-get install` said "already the newest version" on 2026-11-13). The job
      # installs nothing, so that no mirror of Ubuntu (azure.archive.ubuntu.com) can fail it
      # (US-1900); should the image drop the client, the job stops here and says so.
      # /usr/bin/pg_dump and pg_restore, which the backups call, are the wrapper of Debian, which
      # keeps the major of the cluster the image holds: they are pointed at the 18, which the last
      # lines check.
      - run: |
          for tool in pg_dump pg_restore; do
            test -x "/usr/lib/postgresql/18/bin/$tool" || {
              echo "::error::the runner image no longer carries /usr/lib/postgresql/18/bin/$tool (postgresql-client-18)"
              exit 1
            }
            sudo ln --symbolic --force "/usr/lib/postgresql/18/bin/$tool" "/usr/bin/$tool"
            "/usr/bin/$tool" --version | grep --fixed-strings "(PostgreSQL) 18."
          done
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image and the settings of the service platform (deploy/compose/compose.service.yaml),
      # its key a value of the job; ready long before the tests, which run last.
      - run: >-
          docker run --detach --name storage --publish 127.0.0.1:3900:3900
          --volume "$PWD/deploy/compose/garage.toml:/etc/garage.toml:ro"
          --env GARAGE_RPC_SECRET=c0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ff
          --env GARAGE_DEFAULT_ACCESS_KEY=GK000000000000000000000001
          --env GARAGE_DEFAULT_SECRET_KEY=chain-only-storage-secret
          ghcr.io/waterfall-project/mirror/dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
          /garage server --single-node --default-access-key
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: false
          cache-dependency-glob: backend/uv.lock
      - run: make check-back-tests
        env:
          TIER: ${{ inputs.tier }}
          SHARD: ${{ matrix.part }}
          # A role that may create databases: each run creates its own and drops it.
          WATERFALL_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
          WATERFALL_TEST_REDIS_URL: redis://127.0.0.1:6379/0
          # The key that may create a bucket for the run.
          WATERFALL_TEST_STORAGE_URL: http://GK000000000000000000000001:chain-only-storage-secret@127.0.0.1:3900
      - if: inputs.tier == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: back-coverage-${{ strategy.job-index }}
          path: backend/.coverage-parts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    needs: tests
    if: inputs.tier == 'full'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The measure is combined by the coverage of the back, the thresholds held by the repository
      # tools.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: false
          cache-dependency-glob: |
            backend/uv.lock
            tools/uv.lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: back-coverage-*
          path: backend/.coverage-parts/
          merge-multiple: true
      - run: make coverage-back-merge
