# The back: lint and format, strict types, the boundaries of the core, the tests. The tests of the
# data run against a real PostgreSQL, those of the queue of tasks against a real Redis, services of
# the job (the guide, "Tests").
name: back

on:
  workflow_call:
    inputs:
      tier:
        description: fast on every push, full when merging (coverage)
        type: string
        default: fast

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # The version the platform targets (deploy/compose/compose.service.yaml), by its digest.
        image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          # A server that lives for the job and is reachable from the runner alone.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        # The image of the service platform, by its digest, which lives for the job.
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make check-back
        env:
          TIER: ${{ inputs.tier }}
          # A role that may create databases: each run creates its own and drops it.
          WATERFALL_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
          WATERFALL_TEST_REDIS_URL: redis://127.0.0.1:6379/0
