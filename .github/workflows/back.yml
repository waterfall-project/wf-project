# The back: lint and format, strict types, the boundaries of the core, the tests. The tests of the
# data run against a real PostgreSQL, those of the queue of tasks against a real Redis, services of
# the job, and those of the backups against a real object storage, Garage, which a service of the
# job cannot start with the arguments it needs (the guide, "Tests").
name: back

on:
  workflow_call:
    inputs:
      tier:
        description: fast on every push, full when merging (coverage)
        type: string
        default: fast

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # The version the platform targets (deploy/compose/compose.service.yaml), by its digest.
        image: postgres:18-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          # A server that lives for the job and is reachable from the runner alone.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --username postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        # The image of the service platform, by its digest, which lives for the job.
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The client of the server's major (the Dockerfile of the back, #982): the runner brings the
      # 16 of the PGDG, which pg_dump refuses to run against a server 18, and no longer has the
      # repository to install the 18 from. It is added as the Dockerfile adds it, its key pinned by
      # its digest (fingerprint B97B 0AFC AA1A 47F0 44F2 44A0 7FCC 7D46 ACCC 4CF8); a source of the
      # same repository the image may still hold is dropped first, which apt would refuse beside
      # this one. /usr/bin/pg_dump and pg_restore, which the backups call, are the wrapper of
      # Debian: it runs the highest major installed, which the last lines check.
      - run: |
          curl --fail --silent --show-error --location --output pgdg.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76  pgdg.asc" | sha256sum --check --strict
          sudo install --mode 0644 pgdg.asc /usr/share/keyrings/pgdg.asc
          sudo grep --files-with-matches --recursive apt.postgresql.org /etc/apt/sources.list /etc/apt/sources.list.d | xargs --no-run-if-empty sudo rm
          echo "deb [signed-by=/usr/share/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-18
          ls /usr/lib/postgresql; /usr/bin/pg_dump --version; /usr/bin/pg_restore --version; cat /usr/share/postgresql-common/pg_wrapper | head -0
          /usr/bin/pg_dump --version | grep --fixed-strings "(PostgreSQL) 18."
          /usr/bin/pg_restore --version | grep --fixed-strings "(PostgreSQL) 18."
      # The image and the settings of the service platform (deploy/compose/compose.service.yaml),
      # its key a value of the job; ready long before the tests, which run last.
      - run: >-
          docker run --detach --name storage --publish 127.0.0.1:3900:3900
          --volume "$PWD/deploy/compose/garage.toml:/etc/garage.toml:ro"
          --env GARAGE_RPC_SECRET=c0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ff
          --env GARAGE_DEFAULT_ACCESS_KEY=GK000000000000000000000001
          --env GARAGE_DEFAULT_SECRET_KEY=chain-only-storage-secret
          dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
          /garage server --single-node --default-access-key
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make check-back
        env:
          TIER: ${{ inputs.tier }}
          # A role that may create databases: each run creates its own and drops it.
          WATERFALL_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
          WATERFALL_TEST_REDIS_URL: redis://127.0.0.1:6379/0
          # The key that may create a bucket for the run.
          WATERFALL_TEST_STORAGE_URL: http://GK000000000000000000000001:chain-only-storage-secret@127.0.0.1:3900
