# The image of Keycloak (US-0350): built from deploy/keycloak — the extension compiled and tested
# in it —, started on the service platform with its realm applied, and tried by the tests of
# backend/tests/test_keycloak_*.py, the API that validates its tokens included. Publishing it is
# US-0430's.
name: keycloak

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The platform lives for the job and is reachable from the runner alone: development values,
      # visible, named as such, as the secrets of a workstation would be.
      WATERFALL_POSTGRES_PASSWORD: chainonlypostgres
      WATERFALL_SERVICE_DATABASE_PASSWORD: chainonlyservice
      WATERFALL_REDIS_PASSWORD: chain-only-redis
      WATERFALL_KEYCLOAK_DATABASE_PASSWORD: chain-only-keycloak-database
      WATERFALL_KEYCLOAK_ADMIN_PASSWORD: chain-only-keycloak-admin
      WATERFALL_FRONT_CLIENT_SECRET: chain-only-front-client
      WATERFALL_SERVICE_CLIENT_SECRET: chain-only-service-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make check-keycloak
      # What the platform said, when it failed to start or to apply the realm.
      - if: failure()
        run: make service-logs SERVICES="keycloak keycloak-database openldap"
