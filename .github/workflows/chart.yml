# The chart of Waterfall (US-2800): linted and rendered in both tiers, its tests holding it against
# the Compose of production; in the full tier, the three images built as images.yml publishes them,
# never pushed, then the chart installed on a cluster of kind made for the job, bootstrapped, its
# API's liveness and the sign-in of its first administrator held (make check-chart); then, on a
# cluster of its own, the version N upgraded to them under load, rolled back, and upgraded again
# (US-2850, make chart-upgrade, in the job of kind only). Helm, kind and kubectl are downloaded at the
# versions and digests wftools.kubetools pins.
#
# The chart installs on two distributions of Kubernetes, without modification (WF-CMP-0020-A,
# US-2810): kind, where the whole of the trial is held, and k3s, a Kubernetes of another make, by the
# same values. Each is a job of its own, in parallel: each builds the three images, or takes them
# from the cache.
name: chart

on:
  workflow_call:
    inputs:
      tier:
        type: string
        required: true

# Reading packages is what pulling the mirror of the images of Docker Hub is (ci.yml, mirror).
permissions:
  contents: read
  packages: read

# The Dockerfiles and the chart pull Docker Hub's images from the mirror (ci.yml, mirror): the node
# of kind with the credentials of Docker the job logs in with.
env:
  WATERFALL_MIRROR: ghcr.io/waterfall-project/mirror/

jobs:
  check:
    name: check (${{ matrix.distribution }})
    strategy:
      fail-fast: false
      matrix:
        distribution: [kind, k3s]
    runs-on: ubuntu-26.04
    # The three images and the first start of Keycloak on the cluster are the longest of it.
    timeout-minutes: 40
    steps:
      # The whole history and its tags: the trial of an upgrade takes the version N from them — the
      # last published version that carries the chart, or the base and its first parents — and the
      # chart of N from its commit (US-2850).
      #
      # The fast tier only lints and renders, once: the job of k3s has nothing to install then, and
      # its steps are left out (the context `matrix` is not allowed in the `if` of a job).
      - if: inputs.tier == 'full' || matrix.distribution == 'kind'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The cache of the builds of images, written after a merge (images.yml).
      - if: inputs.tier == 'full'
        uses: ./.github/actions/build-cache
      - if: inputs.tier == 'full'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: inputs.tier == 'full' || matrix.distribution == 'kind'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          save-cache: false
          cache-local-path: /tmp/setup-uv-cache
          cache-dependency-glob: tools/uv.lock
      - if: inputs.tier == 'full' || matrix.distribution == 'kind'
        run: make check-chart
        env:
          TIER: ${{ inputs.tier }}
          # The upgrade under load (US-2850) is run in the job of kind only, after its trial.
          CHART_TRIALS: ${{ matrix.distribution == 'k3s' && 'chart-trial-k3s' || 'chart-trial chart-upgrade' }}
          # The lint and the rendering tests run once, in the job of kind.
          CHART_CHECKS: ${{ matrix.distribution == 'k3s' && ' ' || 'lint-chart test-chart' }}
          # The commit the pull request targets, or the queue merges onto, which the upgrade starts
          # from (make chart-upgrade); empty when run by hand, the upgrade then not executed, which
          # a notice of the job's summary says.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
