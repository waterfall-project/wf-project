# The measure reports of the versions, confronted with the objectives and with one another.
name: measures

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          save-cache: false
          cache-local-path: /tmp/setup-uv-cache
          cache-dependency-glob: tools/uv.lock
      - run: make check-measures
