# The end-to-end paths against the real service (US-0340), in the full tier only: the service
# platform started — the API, Keycloak behind its front end in HTTPS, its realm applied —, Prism
# as a proxy between the front and the API, which fails a path on an answer outside the contract,
# and the Playwright project `service` (make e2e-service), against the front built for production
# once in the run of the chain, by its job front-build, which every part of e2e.yml plays too
# (ci.yml, US-0590): called by ci.yml alone, which uploads the build before, this workflow builds
# nothing. The platform, the front and `playwright test` run on the runner itself, by the Makefile;
# the browser runs in the work image of the paths (deploy/e2e, US-1900), which carries it and its
# system packages, as Playwright's server, on the network of the runner, which `playwright test`
# connects to (make e2e-service E2E_IMAGE=…, wftools.e2eimage): a job container would not see the
# ports Docker publishes on the runner. No package of Ubuntu is installed (#2913).
#
# Four parts, each on a runner and a platform of its own (make check-service SHARD=i/4, US-1910): the
# first three share the projects `service` and `shared`, spread by the seconds their units took
# (tools/e2e-service-durations.json); the fourth plays `shared-serial`, `realm` and `restoration`,
# which play one at a time after the others, alone on its platform. Whole on one runner, the job was
# the critical path of the full tier: 22 minutes in 43500472946, 5.5 of them before the first path
# (images, platform, installation, witness) and 16.5 of paths, 1839 s of tests of `service` and
# `shared` on 3 workers, then 2.7 minutes of the projects in series. Each part pays the 5.5 minutes
# of its platform again. Measured, once, on a run of the branch at the full tier, not yet on the
# queue (43511917976, `gh workflow run chain -f tier=full`): 13.5 minutes of wall time for the
# whole run; the parts took 8.8, 11.5, 12.0 and 8.2 minutes, 40.5 runner minutes in all against 22,
# and `back / tests (4/4)`, 11.4 minutes, is now as long as they are. Whether `service / paths`
# leaves the critical path, and whether the median of the queue falls to 12 minutes, is read on 100
# runs of the queue, by its report, after the merge. The 18.5 runner minutes more are the price of
# the cut, which the author weighs (the decision of EP-24, « `service / paths` coupé en quatre
# plateformes »).
name: service

on:
  workflow_call:
    inputs:
      image:
        description: The work image of the paths, by digest (make e2e-image)
        type: string
        required: true

permissions:
  contents: read

# The Dockerfiles and the Compose files pull Docker Hub's images from the mirror (ci.yml, mirror).
env:
  WATERFALL_MIRROR: ghcr.io/waterfall-project/mirror/

jobs:
  paths:
    # Shown as service / paths (i/4), which tools/queue-known.toml recognizes as service / paths.
    name: paths (${{ matrix.part }})
    runs-on: ubuntu-26.04
    # Every part runs to its end: one failing does not cancel the others, whose results say whether
    # the code fails or one path.
    strategy:
      fail-fast: false
      matrix:
        part: ["1/4", "2/4", "3/4", "4/4"]
    # The images of the platform, Keycloak's built with its extension, then the paths: about as
    # long as keycloak.yml with the browser and the front on top. Measured by `playwright test`, which
    # varies from one runner to another: 11.2 to 18.6 minutes, 14.6 in the median, in eight runs of
    # epic/EP-24 with the browser installed on the runner (43302248961 to 43341561992); 15.4 to 18.7,
    # 17.3 in the median, in four runs of the branch of US-1900/L1 with the paths played whole in the
    # work image (43317192704, 43326188786, 43330319564, 43333584161), where neither Node 26 nor
    # Docker's filter of system calls lifted changed anything; 13.5 to 18.2, 14.2 in the median, with
    # the browser alone in the image (43338277921, 43341377423, 43346839952) — back to the median of
    # epic/EP-24, within the spread of its runners. The job as a whole takes 4 to 6 minutes more.
    # In four parts, a part took 8.2 to 12.0 minutes (43511917976); 25 leaves room for a slow
    # runner, whose paths took 1.3 times the median above, and for a restoration that expires
    # (600 s in backups.spec.ts, no retry) in the fourth part: cancelled by GitHub before Playwright
    # ends, the job would skip its steps `if: failure()`, the logs of the platform among them. Not
    # for a path stuck.
    timeout-minutes: 25
    # The work image of the paths is read from the registry, where it may be private.
    permissions:
      contents: read
      packages: read
    env:
      # The platform lives for the job and is reachable from the runner alone: development values,
      # visible, named as such, as the secrets of a workstation would be (keycloak.yml).
      WATERFALL_POSTGRES_PASSWORD: chainonlypostgres
      WATERFALL_SERVICE_DATABASE_PASSWORD: chainonlyservice
      WATERFALL_BACKUP_DATABASE_PASSWORD: chainonlybackup
      WATERFALL_REDIS_PASSWORD: chain-only-redis
      WATERFALL_KEYCLOAK_DATABASE_PASSWORD: chain-only-keycloak-database
      WATERFALL_KEYCLOAK_ADMIN_PASSWORD: chain-only-keycloak-admin
      WATERFALL_FRONT_CLIENT_SECRET: chain-only-front-client
      WATERFALL_SERVICE_CLIENT_SECRET: chain-only-service-client
      WATERFALL_INSTALLATION_CLIENT_SECRET: chain-only-installation-client
      WATERFALL_STORAGE_SECRET: chain-only-storage-secret
      # Garage wants the secret of its RPC in 64 hexadecimal digits.
      WATERFALL_STORAGE_RPC_SECRET: c0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The cache of the builds of images, written after a merge (images.yml).
      - uses: ./.github/actions/build-cache
      # pnpm, at the version `packageManager` names, must exist before its store is read.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # The store of pnpm is read, never written: front-cache.yml writes it.
      - uses: ./.github/actions/pnpm-store
      # Prism serves the variant of the contract the repository tools derive, in Python.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          save-cache: false
          cache-local-path: /tmp/setup-uv-cache
          cache-dependency-glob: tools/uv.lock
      # The work image of the paths, pulled first, four times at most, twenty seconds apart, as
      # e2e-image-publish asks the registry (#2530): a registry that still does not answer fails the
      # job here, naming it, before the platform is built and started.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the work image of the paths
        env:
          E2E_IMAGE: ${{ inputs.image }}
        run: |
          for attempt in 1 2 3 4; do
            docker pull --quiet "$E2E_IMAGE" 2> "$RUNNER_TEMP/pull.err" && exit 0
            cat "$RUNNER_TEMP/pull.err" >&2
            # The registry answered: an image it denies or does not hold is not there in a minute.
            if grep -qiE 'denied|not found|manifest unknown' "$RUNNER_TEMP/pull.err"; then
              echo "ghcr.io does not give $E2E_IMAGE: no other attempt" >&2
              exit 1
            fi
            echo "ghcr.io did not give $E2E_IMAGE at attempt $attempt" >&2
            [ "$attempt" = 4 ] || sleep 20
          done
          exit 1
      # Keycloak's image built from the cache first: the build of the platform by Compose, on the same
      # builder, finds it there, where it would otherwise compile its extension again.
      - run: make build-keycloak
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: front-build
          path: frontend/.next/
      # The processors of the runner, in the log of the job, beside what shares them (US-2290, #3172):
      # three workers of Playwright, three quarters of them (E2E_SERVICE_WORKERS), and the processes
      # of the API of the service platform (WATERFALL_API_PROCESSES, US-2230; four is the default of
      # compose.service.yaml, and the log prints what the platform is given, not that four), as many
      # as the processors, with the front, Prism and Keycloak. The workers follow the processors of
      # a runner, the API does not: the log shows an accord that broke. Neither this step nor the
      # `env:` of `make check-service` sets E2E_WORKERS or E2E_SERVICE_PROCESSORS (its TIER, SHARD,
      # E2E_BUILT and E2E_IMAGE do not enter the count): both read the same workers; a variable set
      # in one of them would have to go to the `env:` of the job. Not saturated by them: in the
      # queue of 2026-11-15 and 16, the parts at four processes (epic/EP-26, 16 runs) took 10.4,
      # 9.4, 9.1 and 7.2 minutes in the median, against 11.7, 10.4, 9.5 and 8.1 at one (the other
      # branches, 78 runs); a slower part, the sign of a runner saturated, would show here what it
      # was given. The count is read in its own assignment under `set -e`: a `make` that fails (a
      # secret removed from the `env:` of the job) fails the step, it does not print an empty count.
      - name: Processors of the runner
        run: |
          set -e
          workers=$(make --no-print-directory -s e2e-service-workers)
          api=$(make --no-print-directory -s service-api-processes)
          echo "nproc $(nproc), workers of the paths $workers, processes of the API $api"
      # The front ci.yml built: the harness starts it, and builds nothing (playwright.config.ts).
      - run: make check-service
        env:
          TIER: full
          E2E_BUILT: "1"
          E2E_IMAGE: ${{ inputs.image }}
          SHARD: ${{ matrix.part }}
      # What Playwright kept of a path that failed (named by its index: a part has a slash) —
      # traces, screenshots, error-context.md — which is lost with the runner otherwise (#3447).
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-service-${{ strategy.job-index }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      # What the platform said, when a path failed or the platform did not start.
      - if: failure()
        run: >-
          make service-logs
          SERVICES="api worker restore keycloak keycloak-front-end contract-proxy"
      # What the server said of its locks (#3005): the restoration is one transaction of pg_restore
      # that locks every table, partition and index; the service `restore`, journaled above, says
      # the errors of pg_restore, not a wait. Only the lines that name a lock or the memory of the
      # locks are printed, not the whole journal, whose statements quote the rows it holds.
      # "(none)" rules out the memory of the locks (`out of shared memory`,
      # `max_locks_per_transaction`) and the deadlocks; not a plain wait for a lock, which
      # PostgreSQL does not log here (`log_lock_waits` is off): `could not obtain lock` only
      # exists under `lock_timeout` or NOWAIT. The journal is written to a file first, so that a
      # journal not read fails the step instead of reading as "(none)".
      - if: failure()
        run: |
          make service-logs SERVICES=postgres > "$RUNNER_TEMP/postgres.log"
          echo "PostgreSQL, lines that name its locks:"
          grep -E 'shared memory|max_locks_per_transaction|deadlock|could not obtain lock' \
            "$RUNNER_TEMP/postgres.log" || echo "(none)"
