# The end-to-end paths against the real service (US-0340), in the full tier only: the service
# platform started — the API, Keycloak behind its front end in HTTPS, its realm applied —, Prism
# as a proxy between the front and the API, which fails a path on an answer outside the contract,
# and the Playwright project `service` (make e2e-service), against the front built for production
# once in the run of the chain, by its job front-build, which every part of e2e.yml plays too
# (ci.yml, US-0590): called by ci.yml alone, which uploads the build before, this workflow builds
# nothing. The platform, the front and `playwright test` run on the runner itself, by the Makefile;
# the browser runs in the work image of the paths (deploy/e2e, US-1900), which carries it and its
# system packages, as Playwright's server, on the network of the runner, which `playwright test`
# connects to (make e2e-service E2E_IMAGE=…, wftools.e2eimage): a job container would not see the
# ports Docker publishes on the runner. No package of Ubuntu is installed (#2913).
name: service

on:
  workflow_call:
    inputs:
      image:
        description: The work image of the paths, by digest (make e2e-image)
        type: string
        required: true

permissions:
  contents: read

# The Dockerfiles and the Compose files pull Docker Hub's images from the mirror (ci.yml, mirror).
env:
  WATERFALL_MIRROR: ghcr.io/waterfall-project/mirror/

jobs:
  paths:
    runs-on: ubuntu-26.04
    # The images of the platform, Keycloak's built with its extension, then the paths: about as
    # long as keycloak.yml with the browser and the front on top. Measured by `playwright test`, which
    # varies from one runner to another: 11.2 to 18.6 minutes, 14.6 in the median, in eight runs of
    # epic/EP-24 with the browser installed on the runner (43302248961 to 43341561992); 15.4 to 18.7,
    # 17.3 in the median, in four runs of the branch of US-1900/L1 with the paths played whole in the
    # work image (43317192704, 43326188786, 43330319564, 43333584161), where neither Node 26 nor
    # Docker's filter of system calls lifted changed anything; 13.5 to 18.2, 14.2 in the median, with
    # the browser alone in the image (43338277921, 43341377423, 43346839952) — back to the median of
    # epic/EP-24, within the spread of its runners. The job as a whole takes 4 to 6 minutes more.
    timeout-minutes: 30
    # The work image of the paths is read from the registry, where it may be private.
    permissions:
      contents: read
      packages: read
    env:
      # The platform lives for the job and is reachable from the runner alone: development values,
      # visible, named as such, as the secrets of a workstation would be (keycloak.yml).
      WATERFALL_POSTGRES_PASSWORD: chainonlypostgres
      WATERFALL_SERVICE_DATABASE_PASSWORD: chainonlyservice
      WATERFALL_BACKUP_DATABASE_PASSWORD: chainonlybackup
      WATERFALL_REDIS_PASSWORD: chain-only-redis
      WATERFALL_KEYCLOAK_DATABASE_PASSWORD: chain-only-keycloak-database
      WATERFALL_KEYCLOAK_ADMIN_PASSWORD: chain-only-keycloak-admin
      WATERFALL_FRONT_CLIENT_SECRET: chain-only-front-client
      WATERFALL_SERVICE_CLIENT_SECRET: chain-only-service-client
      WATERFALL_INSTALLATION_CLIENT_SECRET: chain-only-installation-client
      WATERFALL_STORAGE_SECRET: chain-only-storage-secret
      # Garage wants the secret of its RPC in 64 hexadecimal digits.
      WATERFALL_STORAGE_RPC_SECRET: c0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The cache of the builds of images, written after a merge (images.yml).
      - uses: ./.github/actions/build-cache
      # pnpm, at the version `packageManager` names, must exist before setup-node caches it.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # Prism serves the variant of the contract the repository tools derive, in Python.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      # The work image of the paths, pulled first, four times at most, twenty seconds apart, as
      # e2e-image asks the registry (#2530): a registry that still does not answer fails the job here,
      # naming it, before the platform is built and started.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the work image of the paths
        env:
          E2E_IMAGE: ${{ inputs.image }}
        run: |
          for attempt in 1 2 3 4; do
            docker pull --quiet "$E2E_IMAGE" && exit 0
            echo "ghcr.io did not give $E2E_IMAGE at attempt $attempt" >&2
            [ "$attempt" = 4 ] || sleep 20
          done
          exit 1
      # Keycloak's image built from the cache first: the build of the platform by Compose, on the same
      # builder, finds it there, where it would otherwise compile its extension again.
      - run: make build-keycloak
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: front-build
          path: frontend/.next/
      # The front ci.yml built: the harness starts it, and builds nothing (playwright.config.ts).
      - run: make check-service
        env:
          TIER: full
          E2E_BUILT: "1"
          E2E_IMAGE: ${{ inputs.image }}
      # What the platform said, when a path failed or the platform did not start.
      - if: failure()
        run: make service-logs SERVICES="api worker restore keycloak keycloak-front-end contract-proxy"
      # What the server said of its locks (#3005): the restoration is one transaction of pg_restore that
      # locks every table, partition and index, and the service `restore`, journaled above, says the
      # errors of pg_restore, not a wait. Only the lines that name a lock or the memory of the locks are printed, not the whole
      # journal of the server, whose statements and details quote the rows it holds.
      - if: failure()
        run: |
          echo "PostgreSQL, lines that name its locks:"
          make service-logs SERVICES=postgres | grep -E 'shared memory|max_locks_per_transaction|deadlock|could not obtain lock' || echo "(none)"
