# The front but its end-to-end paths: the client is the contract's, lint, strict types, the
# catalogues, then its production build with no API to reach and the unit tests in the fast
# tier, the coverage in the full one (make check-front-code). The paths run beside it, in
# e2e.yml, in the full tier only (#492).
name: front

on:
  workflow_call:
    inputs:
      tier:
        description: fast on every push, full when merging (coverage)
        type: string
        default: fast

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # The paths, the longer half, went to e2e.yml with the browser (#492). What is left, in the
    # full tier, took about 6 minutes on a 4-core workstation busy with other work by October
    # 2026, the coverage being most of it: less on a hosted runner, and 12 leaves it room.
    timeout-minutes: 12
    # The sessions of the front are tested against a real Redis (docs/dev/README.md, "Un test
    # contre Redis"), the image of the service platform, which lives for the job.
    services:
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm, at the version `packageManager` names, must exist before setup-node caches it.
      - run: corepack enable pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # The check of the catalogues and the coverage thresholds are held by the repository
      # tools, in Python.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: make check-front-code
        env:
          TIER: ${{ inputs.tier }}
          WATERFALL_TEST_REDIS_URL: redis://127.0.0.1:6379/0
