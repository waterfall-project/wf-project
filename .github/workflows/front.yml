# The front: strict types, unit tests.
name: front

on:
  workflow_call:
    inputs:
      tier:
        description: fast on every push, full when merging (coverage)
        type: string
        default: fast

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm, at the version `packageManager` names, must exist before setup-node caches it.
      - run: corepack enable pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # The coverage thresholds are held by the repository tools, in Python.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: make check-front
        env:
          TIER: ${{ inputs.tier }}
