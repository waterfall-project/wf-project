# The front but its end-to-end paths (make check-front-code), over several runners. One holds that
# the client is the contract's, lint, strict types, the catalogues, then in the fast tier its
# production build with no API to reach and the routes it prerendered (make check-front-static).
# The unit tests, which keep the cores of a runner busy, are spread over three others: the guards
# that run ESLint, a minute each, on one, the other tests in two halves on two (make
# check-front-tests SHARD=lint, SHARD=i/2); in the full tier each half is measured, and
# the coverage of the halves gathered is held to its thresholds once both are done (make
# coverage-front-merge); the guards, which cover nothing of src/, are not measured (#2015). The
# paths run beside it, in e2e.yml, in the full tier only (#492).
name: front

on:
  workflow_call:
    inputs:
      tier:
        description: fast on every push, full when merging (coverage)
        type: string
        default: fast

# Reading packages is what pulling the mirror of the images of Docker Hub is (ci.yml, mirror).
permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-26.04
    # ESLint about a minute without its cache, the client, the types and the catalogues, and in
    # the fast tier the production build: 12 leaves room to a slow runner.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm, at the version `packageManager` names, must exist before its store is read.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # The store of pnpm is read, never written: front-cache.yml writes it.
      - uses: ./.github/actions/pnpm-store
      # The check of the catalogues is held by the repository tools, in Python.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: false
          cache-local-path: /tmp/setup-uv-cache
          cache-dependency-glob: tools/uv.lock
      # The cache of ESLint, by the content of each file (`pnpm lint`): the last one written, on
      # this branch or on the one it merges into, read and never written here (front-cache.yml).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.eslintcache
          key: eslint-${{ github.sha }}
          restore-keys: eslint-
      - run: make check-front-static
        env:
          TIER: ${{ inputs.tier }}

  tests:
    # Shown as front / tests (lint) and front / tests (i/2).
    name: tests (${{ matrix.part }})
    runs-on: ubuntu-26.04
    # Vitest spreads whole files over the parts, by the hash of their path: the three guards, which
    # are the longest by far and fell in the same part, have one of their own (the project lint of
    # frontend/vitest.config.ts). Every part runs to its end: one failing does not cancel the
    # others, whose results say whether the code fails or one test.
    strategy:
      fail-fast: false
      matrix:
        part: [lint, "1/2", "2/2"]
    # A part should take about two minutes on a hosted runner, its coverage measured: 10 leaves
    # room to a slow runner, not to a test stuck.
    timeout-minutes: 10
    # The sessions of the front are tested against a real Redis (docs/dev/README.md, "A test
    # against Redis"), the image of the service platform, which lives for the job.
    services:
      redis:
        image: ghcr.io/waterfall-project/mirror/redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # The store of pnpm is read, never written: front-cache.yml writes it.
      - uses: ./.github/actions/pnpm-store
      - run: make check-front-tests
        env:
          TIER: ${{ inputs.tier }}
          SHARD: ${{ matrix.part }}
          WATERFALL_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      # The report of a half, coverage included, which the job below gathers; the guards write none.
      - if: inputs.tier == 'full' && matrix.part != 'lint'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: front-coverage-${{ strategy.job-index }}
          path: frontend/.vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The coverage of the two halves gathered, held to its thresholds (US-0060), in the full tier alone.
  coverage:
    needs: tests
    if: inputs.tier == 'full'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # The store of pnpm is read, never written: front-cache.yml writes it.
      - uses: ./.github/actions/pnpm-store
      # The thresholds are held by the repository tools, in Python.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: false
          cache-local-path: /tmp/setup-uv-cache
          cache-dependency-glob: tools/uv.lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: front-coverage-*
          path: frontend/.vitest/blob/
          merge-multiple: true
      - run: make coverage-front-merge
