# The tools of the repository: lint, strict types, tests. Five minutes on a runner, run when what
# they are made of or read changes (tools/paths.toml), not at every change as the repo family.
name: tools

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: make check-repo-tools
