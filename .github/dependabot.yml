# Actions are pinned by commit; without updates, a pinned action keeps its flaws.
# Each ecosystem: minor and patch updates in one pull request a month, each major on its own.
version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the local actions that pin actions too (PLC-09).
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    commit-message:
      prefix: "Chaîne :"
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: uv
    directories:
      - /backend
      - /tools
    schedule:
      interval: monthly
    commit-message:
      prefix: "Chaîne :"
    groups:
      uv-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    commit-message:
      prefix: "Chaîne :"
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: maven
    directory: /deploy/keycloak/extension
    schedule:
      interval: monthly
    commit-message:
      prefix: "Chaîne :"
    ignore:
      - dependency-name: "org.keycloak:*"
      - dependency-name: "jakarta.ws.rs:jakarta.ws.rs-api"
    groups:
      maven-minor-patch:
        update-types:
          - minor
          - patch
  # The images of Docker Hub, behind the prefix of the mirror in the files, which Dependabot does
  # not read: it follows their manifest, deploy/images (make mirror-sync copies it into the files,
  # US-2490); and the image of the paths, deploy/e2e, of other registries and with no prefix.
  - package-ecosystem: docker
    directories:
      - /deploy/images
      - /deploy/e2e
    schedule:
      interval: monthly
    commit-message:
      prefix: "Chaîne :"
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
