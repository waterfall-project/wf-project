# The realm of Waterfall, applied at each deployment by keycloak-config-cli
# (/opt/keycloak/bin/apply-realm, #215): idempotent, and limited to what this file declares. The
# directory federated and the external providers, which an administrator connects in the
# console (WF-ADM-0180), are kinds of resources this file does not declare: they are neither
# overwritten nor removed.
#
# The secrets of the clients and the addresses of the front are variables of the environment of
# keycloak-config-cli, which it substitutes by their name (comments included: none is written
# here); the image holds none of them (WF-SEC-0010). A missing one stops the application. The front
# has two addresses: the one the browser opens it at, and the one Keycloak reaches it at on the
# back channel to tell it of a closed session — the same on an installation where Keycloak reaches
# the front by its public address, another one where it does not (#681).
realm: waterfall
enabled: true
displayName: Waterfall

# Accounts: no self-registration; the address is the identifier (WF-ADM-0050).
registrationAllowed: false
registrationEmailAsUsername: true
loginWithEmailAllowed: true
duplicateEmailsAllowed: false
editUsernameAllowed: false
# The password of a local account is set and reset by a link sent to its address (WF-ADM-0140).
resetPasswordAllowed: true
rememberMe: false

# The pages of Keycloak and its mails speak French and English, French first (WF-ADM-0140).
internationalizationEnabled: true
supportedLocales: [fr, en]
defaultLocale: fr
loginTheme: waterfall
emailTheme: waterfall
# The administration API answers a refused password in the words of this theme, console or not.
adminTheme: waterfall

# WF-ADM-0140: twelve characters at least, neither the address nor the last name — the address is
# the username, hence notUsername as well as notEmail; `not-last-name` is the rule of the
# extension. No periodic expiry: no `forceExpiredPasswordChange`.
passwordPolicy: length(12) and notEmail and notUsername and not-last-name

# WF-ADM-0140: ten consecutive failures lock the account for fifteen minutes, never for good.
bruteForceProtected: true
permanentLockout: false
maxTemporaryLockouts: 0
failureFactor: 10
# MULTIPLE, Keycloak's default, written down: a lock of waitIncrementSeconds per failureFactor
# failures counted, capped at fifteen minutes.
bruteForceStrategy: MULTIPLE
waitIncrementSeconds: 900
maxFailureWaitSeconds: 900
# The end of a lock does not reset the count of failures, and a failure made while locked does not
# add to it: the first failure after a lock would make eleven and lock the account again — one try
# a quarter would keep it locked, against the motive of WF-ADM-0140. A count resets when a failure
# comes more than maxDeltaTimeSeconds after the one before it (twelve hours by default): the ten
# failures are those that follow one another within fifteen minutes. A lock ends 899 to 900
# seconds after the tenth failure, Keycloak rounding to the second: at 899, the first failure
# after a lock always starts a new count.
maxDeltaTimeSeconds: 899
# The count of failures only, without the quick-succession lock, which would lock the account
# before its tenth failure.
quickLoginCheckMilliSeconds: 0
minimumQuickLoginWaitSeconds: 0

# WF-SEC-0020: an access token lives five minutes; the session ends after two hours without
# activity and after twelve hours in any case; a refresh token is used once, its reuse refused.
accessTokenLifespan: 300
ssoSessionIdleTimeout: 7200
ssoSessionMaxLifespan: 43200
revokeRefreshToken: true
refreshTokenMaxReuse: 0

# WF-ADM-0140: a link that sets or resets a password is valid for one hour, made by an
# administrator — the password setup link of the extension — or asked for on the login page.
actionTokenGeneratedByAdminLifespan: 3600
actionTokenGeneratedByUserLifespan: 3600

roles:
  realm:
    - name: waterfall-password-link
      description: >-
        Asks the extension of Waterfall for the password setup link of a local account
        (password-setup-link). Held by the service account of Waterfall alone.

clients:
  # The front: the authorization code flow with PKCE, on the server of Next (#215); Keycloak
  # tells it of a closed session on the back channel (WF-SEC-0020).
  - clientId: waterfall-front
    name: Waterfall
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:WATERFALL_FRONT_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    frontchannelLogout: false
    # The API reads the roles in its base, never in the token (WF-ARC-0030).
    fullScopeAllowed: false
    rootUrl: $(env:WATERFALL_FRONT_ADDRESS)
    baseUrl: $(env:WATERFALL_FRONT_ADDRESS)/
    redirectUris:
      - $(env:WATERFALL_FRONT_ADDRESS)/auth/callback
    webOrigins: []
    # No offline token, which would outlive the twelve hours and the sign-out of WF-SEC-0020: the
    # scope offline_access is not offered, and fullScopeAllowed keeps its role out of the tokens.
    # A client that declares its scopes gets none of the realm's: the default ones are those of
    # the realm, written down.
    defaultClientScopes: [web-origins, acr, profile, roles, basic, email]
    optionalClientScopes: []
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: $(env:WATERFALL_FRONT_ADDRESS)/*
      backchannel.logout.url: $(env:WATERFALL_FRONT_BACKCHANNEL)/auth/backchannel-logout
      backchannel.logout.session.required: "true"
      backchannel.logout.revoke.offline.tokens: "false"
    protocolMappers:
      # The API accepts a token only for its own audience.
      - name: waterfall-api-audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config:
          included.client.audience: waterfall-api
          access.token.claim: "true"
          id.token.claim: "false"
          introspection.token.claim: "true"

  # The audience of the tokens the API accepts: it has no flow of its own.
  - clientId: waterfall-api
    name: Waterfall API
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    fullScopeAllowed: false

  # The service account of the API and of the worker: the administration API of the realm for its
  # accounts, and the password setup link of the extension.
  - clientId: waterfall-service
    name: Waterfall service
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:WATERFALL_SERVICE_CLIENT_SECRET)
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true

users:
  - username: service-account-waterfall-service
    enabled: true
    serviceAccountClientId: waterfall-service
    realmRoles:
      - waterfall-password-link
    clientRoles:
      realm-management:
        - manage-users
        - view-users
        - query-users
