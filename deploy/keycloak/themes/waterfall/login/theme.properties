# The login pages of Waterfall: those of Keycloak, in French and in English (WF-ADM-0140), with
# the messages of the extension: its rule of the password policy, and a replaced link refused.
parent=keycloak.v2
import=common/keycloak
locales=fr,en
# Dressed with the charter of the front (EP-02, "Charte graphique"): its tokens, its font and its
# logo, over the styles of keycloak.v2, which css/styles.css still names, from the parent.
styles=css/styles.css css/waterfall.css
