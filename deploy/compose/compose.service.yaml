# The service platform: PostgreSQL, Redis, the migrations, the API, the worker and the schedule of
# its tasks (US-0370), the service of the restoration (US-0440), for the developers and for the tests that run against the real service
# (EP-03); Keycloak, with its realm applied by keycloak-config-cli, behind its front end in HTTPS,
# Caddy (#680), and what lets the Definition of done be seen on a workstation — a directory of
# test, OpenLDAP, and Mailpit, which receives the mails (US-0350). Started by `make service-up`;
# `make e2e-service` adds Prism, as a proxy that holds every answer of the API to the contract
# (US-0340).
#
# The secrets come from the environment of the caller, and the platform refuses to start without
# them: nothing here has a default password. The password of PostgreSQL is written in a URL, so
# it holds letters and digits only. The environment of a container stays readable by
# `docker inspect`, as for any service: what these files avoid is a secret in a command line.
name: waterfall-service

# The API and the worker connect as the role of the service, which holds only what the tables grant
# it and is named after the database, waterfall_service (migration 0002); the migrations, as
# waterfall, the owner of the tables.
x-back-environment: &back-environment
  WATERFALL_DATABASE_URL: postgresql://waterfall_service:${WATERFALL_SERVICE_DATABASE_PASSWORD:?export WATERFALL_SERVICE_DATABASE_PASSWORD}@postgres:5432/waterfall
  WATERFALL_REDIS_URL: redis://:${WATERFALL_REDIS_PASSWORD:?export WATERFALL_REDIS_PASSWORD}@redis:6379/0
  WATERFALL_HOST: 0.0.0.0

x-back: &back
  build:
    context: ../../backend
  environment: *back-environment

# Where the browser and the server of Next reach Keycloak, through its front end: the issuer of
# every token, whoever asks for it; the port the front end is published on, which alone moves —
# the front end serves localhost and 127.0.0.1 only (#735).
x-keycloak-address: &keycloak-address https://localhost:${WATERFALL_KEYCLOAK_PORT:-8443}/auth

# How the API and the worker reach Keycloak: the issuer of the tokens is the address the browser
# reaches it at; they reach it on the back channel, for its keys and its administration API, as its
# service account, inside the network of the platform: its encryption is EP-13's (WF-SEC-0010).
x-keycloak-client-environment: &keycloak-client-environment
  WATERFALL_KEYCLOAK_ADDRESS: *keycloak-address
  WATERFALL_KEYCLOAK_BACKCHANNEL: http://keycloak:8080/auth
  WATERFALL_SERVICE_CLIENT_SECRET: ${WATERFALL_SERVICE_CLIENT_SECRET:?export WATERFALL_SERVICE_CLIENT_SECRET}

# The key of the platform on its object storage: its identifier, which is no secret, and its secret.
x-storage-key: &storage-key ${WATERFALL_STORAGE_ACCESS_KEY:-GK000000000000000000000001}
x-storage-secret: &storage-secret ${WATERFALL_STORAGE_SECRET:?export WATERFALL_STORAGE_SECRET}

# How the API and the worker reach the object storage (PBS-3.3), by S3, inside the network of the
# platform, and the bucket of the backups.
x-storage-environment: &storage-environment
  WATERFALL_STORAGE_ADDRESS: http://storage:3900
  WATERFALL_STORAGE_ACCESS_KEY: *storage-key
  WATERFALL_STORAGE_SECRET: *storage-secret
  WATERFALL_BACKUPS_BUCKET: backups

# The database of Keycloak, as its owner: Keycloak, the application of its realm, which makes a
# temporary administrator in it after a restoration, and the service of the restoration (#953, #955).
x-keycloak-database: &keycloak-database
  KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
  KC_DB_USERNAME: keycloak
  KC_DB_PASSWORD: ${WATERFALL_KEYCLOAK_DATABASE_PASSWORD:?export WATERFALL_KEYCLOAK_DATABASE_PASSWORD}

# One image, three commands: Keycloak, the application of the realm, and the service that applies it
# again after a restoration (deploy/keycloak/Dockerfile).
x-keycloak: &keycloak
  build:
    context: ../keycloak
  image: waterfall-keycloak

services:
  postgres:
    # The version the platform targets, pinned by the digest of its index.
    image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    environment:
      POSTGRES_USER: waterfall
      POSTGRES_DB: waterfall
      POSTGRES_PASSWORD: ${WATERFALL_POSTGRES_PASSWORD:?export WATERFALL_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # On the workstation only: the tests of the back reach the server there
    # (WATERFALL_TEST_DATABASE_URL).
    ports:
      - "127.0.0.1:${WATERFALL_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username waterfall --dbname waterfall"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # Nothing durable is kept in Redis: the queue and the sessions are lost with it, not the data.
    # The shell of the container reads the password from the environment (`$$` keeps Compose from
    # expanding it): the command line `docker inspect` shows names the variable, not its value.
    # The entrypoint of the image no longer changes user when the command is `sh`, so the service fixes it.
    user: redis
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDISCLI_AUTH\" --save ''"]
    environment:
      # `redis-cli` reads its password here, so the health check does not carry it in its text.
      REDISCLI_AUTH: ${WATERFALL_REDIS_PASSWORD:?export WATERFALL_REDIS_PASSWORD}
    # On the workstation only: a front started there keeps its sessions here (#681).
    ports:
      - "127.0.0.1:${WATERFALL_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies the migrations, then stops: the API starts on the schema it expects (WF-DAT-0140).
  migrate:
    <<: *back
    environment:
      <<: *back-environment
      WATERFALL_DATABASE_URL: postgresql://waterfall:${WATERFALL_POSTGRES_PASSWORD:?export WATERFALL_POSTGRES_PASSWORD}@postgres:5432/waterfall
    command: ["waterfall-migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # Lets the role of the service, which the migrations create, sign in with its password, at
  # each start of the platform, then stops: the API and the worker connect as it.
  service-database-role:
    image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    user: postgres
    command: ["psql", "--no-psqlrc", "--set=ON_ERROR_STOP=1", "--file=/service-database-role.sql"]
    environment:
      PGHOST: postgres
      PGUSER: waterfall
      PGDATABASE: waterfall
      PGPASSWORD: ${WATERFALL_POSTGRES_PASSWORD:?export WATERFALL_POSTGRES_PASSWORD}
      SERVICE_DATABASE_PASSWORD: ${WATERFALL_SERVICE_DATABASE_PASSWORD:?export WATERFALL_SERVICE_DATABASE_PASSWORD}
    volumes:
      - ./service-database-role.sql:/service-database-role.sql:ro
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The role of the backup, created when missing, and its password, at each start of the platform,
  # then stops (#895): the worker dumps the databases as it.
  backup-database-role:
    image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    user: postgres
    command: ["psql", "--no-psqlrc", "--set=ON_ERROR_STOP=1", "--file=/backup-database-role.sql"]
    environment:
      PGHOST: postgres
      PGUSER: waterfall
      PGDATABASE: waterfall
      PGPASSWORD: ${WATERFALL_POSTGRES_PASSWORD:?export WATERFALL_POSTGRES_PASSWORD}
      BACKUP_DATABASE_PASSWORD: ${WATERFALL_BACKUP_DATABASE_PASSWORD:?export WATERFALL_BACKUP_DATABASE_PASSWORD}
    volumes:
      - ./backup-database-role.sql:/backup-database-role.sql:ro
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *back
    environment:
      <<: [*back-environment, *keycloak-client-environment, *storage-environment]
    depends_on:
      service-database-role:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-buckets:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${WATERFALL_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs the background tasks of the queue (WF-ARC-0090), with the settings of the API, and starts
  # again if it stops: a task it was running is taken up again. A backup dumps the two databases,
  # waterfall and keycloak, as the role of the backup, which can neither write nor turn a trigger
  # off (#895), into the bucket of the backups.
  worker:
    <<: *back
    environment:
      <<: [*back-environment, *keycloak-client-environment, *storage-environment]
      WATERFALL_BACKUP_DATABASE_URL: postgresql://waterfall_backup:${WATERFALL_BACKUP_DATABASE_PASSWORD:?export WATERFALL_BACKUP_DATABASE_PASSWORD}@postgres:5432/waterfall
      WATERFALL_KEYCLOAK_DATABASE_URL: postgresql://waterfall_backup:${WATERFALL_BACKUP_DATABASE_PASSWORD:?export WATERFALL_BACKUP_DATABASE_PASSWORD}@postgres:5432/keycloak
    command: ["waterfall-worker"]
    restart: unless-stopped
    depends_on:
      service-database-role:
        condition: service_completed_successfully
      backup-database-role:
        condition: service_completed_successfully
      keycloak-database:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-buckets:
        condition: service_completed_successfully

  # Deposits the reading of the accounts at the end of each interval of the installation, in
  # seconds, a day by default (PBS-5.3); a CronJob does it in EP-13. An interval that sleep refuses
  # stops the service, with 2. Its process 1 is an init, which passes the stop on to the shell.
  scheduler:
    <<: *back
    environment:
      <<: *back-environment
      WATERFALL_IDENTITY_SYNC_INTERVAL: ${WATERFALL_IDENTITY_SYNC_INTERVAL:-86400}
    init: true
    command:
      - sh
      - -c
      - while sleep "$$WATERFALL_IDENTITY_SYNC_INTERVAL"; do waterfall-worker enqueue identity_sync; done; exit 2
    depends_on:
      service-database-role:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Runs the restorations the API deposits in their stream (WF-ADM-0160, #953), as the owners of
  # both databases, the client of the bootstrap and the service account; it asks keycloak-realm to
  # apply the realm again through the folder they alone share (#955). Started once keycloak-realm
  # is healthy, as in production.
  restore:
    <<: *back
    environment:
      <<: [*back-environment, *keycloak-client-environment, *storage-environment]
      WATERFALL_DATABASE_URL: postgresql://waterfall:${WATERFALL_POSTGRES_PASSWORD:?export WATERFALL_POSTGRES_PASSWORD}@postgres:5432/waterfall
      WATERFALL_KEYCLOAK_DATABASE_URL: postgresql://keycloak:${WATERFALL_KEYCLOAK_DATABASE_PASSWORD:?export WATERFALL_KEYCLOAK_DATABASE_PASSWORD}@postgres:5432/keycloak
      WATERFALL_INSTALLATION_CLIENT_SECRET: ${WATERFALL_INSTALLATION_CLIENT_SECRET:?export WATERFALL_INSTALLATION_CLIENT_SECRET}
      WATERFALL_REALM_REQUESTS: /realm-requests
    command: ["waterfall-restore"]
    volumes:
      - realm-requests:/realm-requests
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak-database:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-buckets:
        condition: service_completed_successfully
      keycloak-realm:
        condition: service_healthy

  # The bootstrap of the installation (US-0420): the migrations, then what nobody may enter without,
  # and the link of its first administrator, written on its standard output — then stops. Run by
  # `make service-install` and `make e2e-service`, once the realm is applied, never by service-up.
  # As the owner of the tables (#701), with the secret of the client of the bootstrap, which
  # restore and keycloak-realm hold too, and whose links are valid until they are used (#652). The
  # address of the administrator and the language of the installation are development values
  # unless the environment says others.
  install:
    <<: *back
    profiles: [install]
    environment:
      <<: [*back-environment, *keycloak-client-environment]
      WATERFALL_DATABASE_URL: postgresql://waterfall:${WATERFALL_POSTGRES_PASSWORD:?export WATERFALL_POSTGRES_PASSWORD}@postgres:5432/waterfall
      WATERFALL_INSTALLATION_CLIENT_SECRET: ${WATERFALL_INSTALLATION_CLIENT_SECRET:?export WATERFALL_INSTALLATION_CLIENT_SECRET}
      WATERFALL_ADMIN_EMAIL: ${WATERFALL_ADMIN_EMAIL:-administrateur@waterfall.test}
      WATERFALL_DEFAULT_LANGUAGE: ${WATERFALL_DEFAULT_LANGUAGE:-fr}
    command: ["waterfall-api", "install"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # The object storage (PBS-3.3): Garage on one node, its layout made at its start and the key of
  # the platform taken from the environment (garage.toml). It keeps its data in a volume, as the
  # databases do; its memory is bounded, for the machine of a demonstration (WF-CMP-0020).
  storage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ["/garage", "server", "--single-node", "--default-access-key"]
    environment:
      GARAGE_RPC_SECRET: ${WATERFALL_STORAGE_RPC_SECRET:?export WATERFALL_STORAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: *storage-key
      GARAGE_DEFAULT_SECRET_KEY: *storage-secret
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - storage-data:/var/lib/garage
    mem_limit: 256m
    healthcheck:
      # The image holds Garage alone: its own command asks the node how it stands.
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the buckets of the platform when missing, by the CreateBucket of S3 signed with its key,
  # then stops: the backups, and the imports to come (EP-06).
  storage-buckets:
    image: curlimages/curl:8.23.0@sha256:a134550be58ab783810e613ae96fd253c38f7bdd16d9bf9be350700c7a29ac06
    entrypoint: ["/bin/sh", "/storage-buckets.sh"]
    environment:
      STORAGE_ADDRESS: http://storage:3900
      STORAGE_ACCESS_KEY: *storage-key
      STORAGE_SECRET: *storage-secret
      STORAGE_BUCKETS: backups imports
    volumes:
      - ./storage-buckets.sh:/storage-buckets.sh:ro
    restart: "no"
    depends_on:
      storage:
        condition: service_healthy

  # The database of Keycloak, on the same server, created with its role when missing (#215).
  keycloak-database:
    image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    user: postgres
    command: ["psql", "--no-psqlrc", "--set=ON_ERROR_STOP=1", "--file=/keycloak-database.sql"]
    environment:
      PGHOST: postgres
      PGUSER: waterfall
      PGDATABASE: waterfall
      PGPASSWORD: ${WATERFALL_POSTGRES_PASSWORD:?export WATERFALL_POSTGRES_PASSWORD}
      KEYCLOAK_DATABASE_PASSWORD: ${WATERFALL_KEYCLOAK_DATABASE_PASSWORD:?export WATERFALL_KEYCLOAK_DATABASE_PASSWORD}
    volumes:
      - ./keycloak-database.sql:/keycloak-database.sql:ro
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # The image runs as the user of Keycloak's own, 1000.
  keycloak:
    <<: *keycloak
    environment:
      <<: *keycloak-database
      # The administrator of the master realm, with which keycloak-config-cli applies the realm.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${WATERFALL_KEYCLOAK_ADMIN_PASSWORD:?export WATERFALL_KEYCLOAK_ADMIN_PASSWORD}
      # Where the browser reaches Keycloak: the issuer of every token, whoever asks for it. The
      # services of the platform reach it at keycloak:8080, on the back channel; the front end
      # says on which address and in which scheme it was asked.
      KC_HOSTNAME: *keycloak-address
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    # Keycloak tells a front started on the workstation of a closed session on the back channel
    # (#681): the address of the host, which the front listens on (WATERFALL_FRONT_BACKCHANNEL).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak-database:
        condition: service_completed_successfully
      # The realm of this platform sends its mails there (deploy/keycloak/development/): the
      # invitation of a local account, which its tests read (#651).
      mailpit:
        condition: service_started
    healthcheck:
      # The image has neither curl nor wget: bash asks the management interface itself. Read on
      # the status line: readiness answers 503 while the schema migrates and the realm master is
      # made, with a body whose database check already says "UP" (#1079).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 60

  # Keycloak in HTTPS, by Caddy's own authority (Caddyfile.service): the only door to Keycloak from
  # the workstation, as the front end of the demonstration is.
  keycloak-front-end:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.service", "--adapter", "caddyfile"]
    volumes:
      - ./Caddyfile.service:/etc/caddy/Caddyfile.service:ro
      # The authority and its root: kept, so that what trusts the root keeps trusting it.
      - keycloak-front-end-data:/data
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WATERFALL_KEYCLOAK_PORT:-8443}:443"
    healthcheck:
      # Ready once both of its addresses answer for Keycloak, under a certificate of its root.
      test: ["CMD-SHELL", "for host in localhost 127.0.0.1; do curl -fsS -o /dev/null --cacert /data/caddy/pki/authorities/local/root.crt https://$$host/auth/realms/master || exit 1; done"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Applies the realm of Waterfall, then what the development platform adds to it: `make service-up`
  # starts it again, anew, once Keycloak answers. Each under a remote state of its own:
  # keycloak-config-cli deletes the clients its state names that the files it applies do not
  # declare, and the development files declare a client of test the realm does not (#644). Then
  # stays, and applies both again when the service of the restoration asks (#955, realm-service).
  keycloak-realm:
    <<: *keycloak
    entrypoint: ["/opt/keycloak/bin/realm-service", "/bin/sh", "-c"]
    command:
      - >-
        /opt/keycloak/bin/apply-realm
        && WATERFALL_REALM_FILES=file:/opt/keycloak/realm/development/*.yaml
        exec /opt/keycloak/bin/apply-realm --import.cache.key=development
    environment:
      <<: *keycloak-database
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: ${WATERFALL_KEYCLOAK_ADMIN_PASSWORD:?export WATERFALL_KEYCLOAK_ADMIN_PASSWORD}
      WATERFALL_KEYCLOAK_ADDRESS: *keycloak-address
      WATERFALL_FRONT_ADDRESS: ${WATERFALL_FRONT_ADDRESS:-http://localhost:3000}
      # Where Keycloak reaches that front, on the back channel (#681): from its container, the
      # front started on the workstation is on the host.
      WATERFALL_FRONT_BACKCHANNEL: ${WATERFALL_FRONT_BACKCHANNEL:-http://host.docker.internal:3000}
      WATERFALL_FRONT_CLIENT_SECRET: ${WATERFALL_FRONT_CLIENT_SECRET:?export WATERFALL_FRONT_CLIENT_SECRET}
      WATERFALL_SERVICE_CLIENT_SECRET: ${WATERFALL_SERVICE_CLIENT_SECRET:?export WATERFALL_SERVICE_CLIENT_SECRET}
      WATERFALL_INSTALLATION_CLIENT_SECRET: ${WATERFALL_INSTALLATION_CLIENT_SECRET:?export WATERFALL_INSTALLATION_CLIENT_SECRET}
      WATERFALL_REALM_REQUESTS: /realm-requests
    volumes:
      - ../keycloak/development:/opt/keycloak/realm/development:ro
      - realm-requests:/realm-requests
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
      openldap:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "test -f /tmp/realm-applied"]
      interval: 2s
      timeout: 3s
      retries: 150

  # The directory of test that Keycloak federates (WF-ADM-0180), seeded with one person at its
  # first start. Its password is a development value, as are those of deploy/keycloak/development.
  # The image starts as root to prepare its files, then runs slapd as its own user, openldap. Its
  # data outlive it, as the bases do: seeded again, it would give its person another entryUUID,
  # and Keycloak, which keeps the first, another account.
  openldap:
    image: osixia/openldap:1.5.0@sha256:18742e9c449c9c1afe129d3f2f3ee15fb34cc43e5f940a20f3399728f41d7c28
    # Copies its assets before writing to them: the seed is mounted read-only.
    command: ["--copy-service"]
    environment:
      LDAP_DOMAIN: waterfall.test
      LDAP_ORGANISATION: Waterfall (development)
      LDAP_ADMIN_PASSWORD: development-only-directory-admin
      LDAP_TLS: "false"
    volumes:
      - ../keycloak/development/directory.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-directory.ldif:ro
      - openldap-data:/var/lib/ldap
      - openldap-config:/etc/ldap/slapd.d

  # Receives every mail Keycloak sends; read at http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    user: "1000:1000"
    ports:
      - "127.0.0.1:${WATERFALL_MAILPIT_PORT:-8025}:8025"

  # Prism as a proxy between the front and the API (US-0340): an answer the contract does not
  # describe, or a request to an operation it does not declare, is an error the path fails on
  # (`--errors`), and is not passed on. It reads the variant of the fake back (make mock-spec),
  # which asks for no token: the service authenticates, and its refusal passes as it answers it,
  # held to the contract, where Prism would answer one of its own. At the version the Makefile
  # pins, in the node image of the development platform; started by `make e2e-service` alone.
  contract-proxy:
    profiles: [e2e]
    image: node:24-alpine@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
    command:
      - npx
      - --yes
      - "@stoplight/prism-cli@${PRISM_VERSION:?run make e2e-service}"
      - proxy
      - /contract/waterfall.proxy.json
      - http://api:8000
      - --errors
      - --host
      - 0.0.0.0
      - --port
      - "4010"
    volumes:
      - ../../docs/api/waterfall.proxy.json:/contract/waterfall.proxy.json:ro
      # npx keeps Prism in the npm cache, in a named volume: downloaded once, not at every start.
      - contract-proxy-npm:/home/node
    user: "1000:1000"
    environment:
      npm_config_cache: /home/node/.npm
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WATERFALL_PROXY_PORT:-4210}:4010"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4010/api/v1/health"]
      interval: 2s
      timeout: 3s
      retries: 90

volumes:
  postgres-data:
  storage-data:
  # Where the service of the restoration asks keycloak-realm to apply the realm again: in memory,
  # theirs alone, written by the user of both images.
  realm-requests:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=1000,gid=1000,mode=0700,size=1m
  openldap-data:
  openldap-config:
  keycloak-front-end-data:
  contract-proxy-npm:
