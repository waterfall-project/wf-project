# The production platform on a network without a way out (US-3010, WF-CMP-0030), as the chain tries
# it (make production-trial, wftools.production): given after compose.prod.yaml — and
# compose.prod.local.yaml under a local name; under a public one, the trial gives the door its
# certificate (WATERFALL_DOOR_DIRECTORY), and Caddy asks for none. Not for an installation, whose
# firewall does what this file does (docs/exploitation/reseau-isole.md).
#
# Every network of the platform is internal: Docker gives none a route out, and a connection to an
# address outside fails at once. Every service resolves through the sink, egress-sink: Docker's
# resolver answers the names of the platform itself and forwards every other name there, which the
# sink answers does not exist, at once, and writes down with the address of the container that
# asked (tools/src/wftools/egress.py). The trial reads it at its end, and fails on any name asked
# that is not the platform's, Keycloak and the supervision included. Each service waits for the
# sink, so that nothing asks before it listens: Grafana's check of its updates goes at its start.
#
# Caddy stays on the internal network and publishes nothing: door, the only container on a network
# with a way out, publishes the ports of HTTP and HTTPS and relays them to Caddy, byte for byte. It
# stands for the firewall that lets the users in, and runs no component of Waterfall.
#
# The addresses are fixed, the services naming the sink by its address: two networks of 254
# addresses under WATERFALL_ISOLATED_NETWORK, 10.213 unless set — 10.213.0.0/24 for the platform,
# 10.213.2.0/24 for the storage —, which no other network of the machine may hold. The services that
# run once and leave, which Docker no longer lists when the trial reads the names asked, keep an
# address of their own, from .0.101 (wftools.production.ENDED): their request is named all the same.

x-sink: &sink
  depends_on:
    egress-sink:
      condition: service_healthy
  # No search domain: else Docker gives each container the host's, and a name not found — a service
  # restarting — is asked again followed by it, a name the sink would count as one outside.
  dns_search: ["."]
x-resolved: &resolved
  <<: *sink
  dns: ["${WATERFALL_ISOLATED_NETWORK:-10.213}.0.53"]

services:
  # The sink of the names (wftools.egress), on every network of the platform that a service joins
  # alone: the storage is on its own.
  egress-sink:
    image: ${WATERFALL_MIRROR:-}python:3.14-slim-trixie@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
    command: ["python", "/opt/egress.py", "sink"]
    user: "65534:65534"
    read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../../tools/src/wftools/egress.py:/opt/egress.py:ro
    networks:
      default:
        ipv4_address: ${WATERFALL_ISOLATED_NETWORK:-10.213}.0.53
      storage:
        ipv4_address: ${WATERFALL_ISOLATED_NETWORK:-10.213}.2.53
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "/opt/egress.py", "probe", "53"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The door of the trial: the published ports, relayed to Caddy inside.
  door:
    image: ${WATERFALL_MIRROR:-}python:3.14-slim-trixie@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
    command: ["python", "/opt/egress.py", "door", "8080:caddy:80", "8443:caddy:443"]
    user: "65534:65534"
    read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../../tools/src/wftools/egress.py:/opt/egress.py:ro
    networks:
      default: {}
      door: {}
    ports:
      - "${WATERFALL_HTTP_PORT:-80}:8080"
      - "${WATERFALL_HTTPS_PORT:-443}:8443"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "/opt/egress.py", "probe", "8443"]
      interval: 2s
      timeout: 3s
      retries: 30

  caddy:
    <<: *resolved
    ports: !reset []
  storage:
    <<: *sink
    dns: ["${WATERFALL_ISOLATED_NETWORK:-10.213}.2.53"]
  authority:
    <<: *resolved
    networks:
      default:
        ipv4_address: ${WATERFALL_ISOLATED_NETWORK:-10.213}.0.101
  door-authority:
    <<: *resolved
    networks:
      default:
        ipv4_address: ${WATERFALL_ISOLATED_NETWORK:-10.213}.0.102
  front-proxy: *resolved
  front: *resolved
  postgres-volume:
    <<: *resolved
    networks:
      default:
        ipv4_address: ${WATERFALL_ISOLATED_NETWORK:-10.213}.0.103
  postgres: *resolved
  waterfall-database:
    <<: *resolved
    networks:
      default:
        ipv4_address: ${WATERFALL_ISOLATED_NETWORK:-10.213}.0.104
  service-database-role:
    <<: *resolved
    networks:
      default:
        ipv4_address: ${WATERFALL_ISOLATED_NETWORK:-10.213}.0.107
  backup-database-role:
    <<: *resolved
    networks:
      default:
        ipv4_address: ${WATERFALL_ISOLATED_NETWORK:-10.213}.0.108
  redis: *resolved
  migrate:
    <<: *resolved
    networks:
      default:
        ipv4_address: ${WATERFALL_ISOLATED_NETWORK:-10.213}.0.106
  components:
    <<: *resolved
    networks:
      default:
        ipv4_address: ${WATERFALL_ISOLATED_NETWORK:-10.213}.0.105
  install:
    <<: *resolved
    networks:
      default:
        ipv4_address: ${WATERFALL_ISOLATED_NETWORK:-10.213}.0.110
  api: *resolved
  worker: *resolved
  scheduler: *resolved
  restore: *resolved
  storage-proxy: *resolved
  storage-buckets:
    <<: *resolved
    networks:
      default:
        ipv4_address: ${WATERFALL_ISOLATED_NETWORK:-10.213}.0.111
  keycloak-database:
    <<: *resolved
    networks:
      default:
        ipv4_address: ${WATERFALL_ISOLATED_NETWORK:-10.213}.0.109
  keycloak: *resolved
  keycloak-realm: *resolved
  prometheus: *resolved
  alertmanager: *resolved
  grafana: *resolved

networks:
  default:
    internal: true
    ipam:
      config:
        - subnet: ${WATERFALL_ISOLATED_NETWORK:-10.213}.0.0/24
  storage:
    ipam:
      config:
        - subnet: ${WATERFALL_ISOLATED_NETWORK:-10.213}.2.0/24
  # The way in of the users: the door alone joins it.
  door: {}
