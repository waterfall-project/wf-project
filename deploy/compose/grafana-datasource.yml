# The only source of the dashboard of the operator (US-2880, WF-OBS-0030): the Prometheus of the
# platform, read inside its network, in HTTPS, its certificate checked against the root of the
# platform, which Grafana reads at /trust/root.crt (US-2840, TFX-14). The dashboard names it by its
# uid. The chart writes the same source, at the address of its own Prometheus (templates/grafana.yaml).
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: https://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      tlsAuthWithCACert: true
    secureJsonData:
      tlsCACert: $__file{/trust/root.crt}
