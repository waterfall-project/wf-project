# The service platform on an image of Keycloak already loaded (make load-keycloak, #4790): added to
# compose.service.yaml by the Makefile when WATERFALL_KEYCLOAK_LOADED is set, so that `up --build`
# starts the image as it is and does not build it again, which downloads Maven's plugins anew.
services:
  keycloak:
    build: !reset null
  keycloak-realm:
    build: !reset null
