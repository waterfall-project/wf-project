# Who may connect to the PostgreSQL of the production platform, and how (US-2840, WF-SEC-0010):
# through the network, in TLS alone, with a password; a connection in the clear is refused, whoever
# asks. The socket of the container, which no other container reaches, is the initialisation's and
# the administrator's of the machine (`docker compose exec postgres psql`), as the image has it.
# Read in place of the file of the volume (hba_file), so that a volume made before is held too.
#
# TYPE    DATABASE  USER  ADDRESS  METHOD
local     all       all            trust
hostssl   all       all   all      scram-sha-256
hostnossl all       all   all      reject
