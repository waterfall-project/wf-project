# The production platform on one machine (US-0430, WF-ARC-0050): the images the chain publishes on
# ghcr.io/waterfall-project — front, waterfall, keycloak —, each designated by its digest,
# WATERFALL_DIGEST_FRONT, _WATERFALL and _KEYCLOAK, never by a tag a writer of the registry may move
# (#3726), and nothing built here. Caddy is its only door, in HTTPS (Caddyfile.prod); the front,
# the API, the worker and the schedule of its tasks, the service of the restoration; PostgreSQL
# with two databases, Waterfall's and Keycloak's; Redis; Garage, the object storage, and the buckets
# it makes; Keycloak and the application of its realm; Prometheus, which collects the metrics and
# evaluates the alerts, Alertmanager, which notifies them, and Grafana, the dashboard of the
# operator; the data in named volumes. How to install, bootstrap, update, back up and
# stop it: README.md.
#
# The third-party images are Docker Hub's: only the chain poses WATERFALL_MIRROR (its mirror on
# ghcr.io, US-1900), empty here.
#
# The settings and the secrets come from the file .env beside this one, which the operator fills
# from production.env.example: a service that lacks one stops, naming it (WF-SEC-0010). A password
# written in a URL — PostgreSQL's, Redis's — holds letters and digits only. The environment of a
# container stays readable by `docker inspect` on the machine, as for any service: what these files
# avoid is a secret in a command line or in an image.
#
# Every exchange inside the platform is encrypted (US-2840, WF-SEC-0010): PostgreSQL, Redis, the API,
# Keycloak, Prometheus, Alertmanager and Grafana serve in TLS alone, the object storage and the front
# behind a proxy in TLS each, and their clients — the door Caddy included — check the certificate
# and its name against the root of the authority of the platform — the operator's, put in
# ./authority (ca.crt and ca.key), or one the service authority makes at the first start and keeps.
# That service issues again the certificate of each server at each start, in a volume of its own,
# and the root in the volume trust, which every client reads at /trust/root.crt. The metrics alone
# stay in HTTP, on ports no door routes (TFX-09).
name: waterfall

# Where the browser reaches the platform: the domain, and the port of HTTPS when it is not 443.
x-address: &address https://${WATERFALL_DOMAIN:?set WATERFALL_DOMAIN in .env}${WATERFALL_HTTPS_PORT:+:${WATERFALL_HTTPS_PORT}}
x-keycloak-address: &keycloak-address https://${WATERFALL_DOMAIN:?set WATERFALL_DOMAIN in .env}${WATERFALL_HTTPS_PORT:+:${WATERFALL_HTTPS_PORT}}/auth

# The number of the processes of the API (US-2230), one unless .env says otherwise: the API serves
# on them, and PostgreSQL counts fifteen connections for each.
x-api-processes: &api-processes ${WATERFALL_API_PROCESSES:-1}

x-waterfall-image: &waterfall-image ghcr.io/waterfall-project/waterfall@${WATERFALL_DIGEST_WATERFALL:?set WATERFALL_DIGEST_WATERFALL in .env}
x-keycloak-image: &keycloak-image ghcr.io/waterfall-project/keycloak@${WATERFALL_DIGEST_KEYCLOAK:?set WATERFALL_DIGEST_KEYCLOAK in .env}
x-postgres-image: &postgres-image ${WATERFALL_MIRROR:-}postgres:18-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81

# The API, the worker and the schedule connect as the role of the service, which holds only what the
# tables grant it, waterfall_service (#701); the migrations and the bootstrap, as waterfall, the
# owner of the tables, no superuser. The administrator of the server, postgres, is the services' of
# initialisation alone, which create the roles and the databases (x-administrator).
#
# Each address of PostgreSQL asks libpq, or the driver of Keycloak, to check the certificate and its
# name against the root of the platform (sslmode=verify-full), and Redis is reached in rediss://,
# its certificate checked against the same root (ssl_ca_certs). WATERFALL_TLS_AUTHORITY gives it to
# the clients of Keycloak and of the storage, and makes a process of the back refuse to start on an
# address in the clear, naming it (TFX-03, TFX-04, TFX-10).
x-trust: &trust trust:/trust:ro
x-back-environment: &back-environment
  WATERFALL_DATABASE_URL: postgresql://waterfall_service:${WATERFALL_SERVICE_DATABASE_PASSWORD:?set WATERFALL_SERVICE_DATABASE_PASSWORD in .env}@postgres:5432/waterfall?sslmode=verify-full&sslrootcert=/trust/root.crt
  WATERFALL_REDIS_URL: rediss://:${WATERFALL_REDIS_PASSWORD:?set WATERFALL_REDIS_PASSWORD in .env}@redis:6379/0?ssl_ca_certs=/trust/root.crt
  WATERFALL_TLS_AUTHORITY: /trust/root.crt
x-administrator: &administrator
  PGHOST: postgres
  PGUSER: postgres
  PGPASSWORD: ${WATERFALL_POSTGRES_ADMIN_PASSWORD:?set WATERFALL_POSTGRES_ADMIN_PASSWORD in .env}
  PGSSLMODE: verify-full
  PGSSLROOTCERT: /trust/root.crt
x-owner-database-url: &owner-database-url postgresql://waterfall:${WATERFALL_POSTGRES_PASSWORD:?set WATERFALL_POSTGRES_PASSWORD in .env}@postgres:5432/waterfall?sslmode=verify-full&sslrootcert=/trust/root.crt
# The database of Keycloak, as its owner: Keycloak, the application of its realm, and the service of
# the restoration, which replaces it (#953). In TLS, its certificate checked (TFX-12).
x-keycloak-database: &keycloak-database
  KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak?sslmode=verify-full&sslrootcert=/trust/root.crt
  KC_DB_USERNAME: keycloak
  KC_DB_PASSWORD: ${WATERFALL_KEYCLOAK_DATABASE_PASSWORD:?set WATERFALL_KEYCLOAK_DATABASE_PASSWORD in .env}

# The issuer of every token is the address the browser reaches Keycloak at; the API and the worker
# reach it inside the network of the platform, for its keys and its administration API, as its
# service account, in HTTPS (TFX-08).
x-keycloak-client-environment: &keycloak-client-environment
  WATERFALL_KEYCLOAK_ADDRESS: *keycloak-address
  WATERFALL_KEYCLOAK_BACKCHANNEL: https://keycloak:8443/auth
  WATERFALL_SERVICE_CLIENT_SECRET: ${WATERFALL_SERVICE_CLIENT_SECRET:?set WATERFALL_SERVICE_CLIENT_SECRET in .env}
  WATERFALL_TLS_AUTHORITY: /trust/root.crt

x-storage-key: &storage-key ${WATERFALL_STORAGE_ACCESS_KEY:-GK000000000000000000000001}
x-storage-secret: &storage-secret ${WATERFALL_STORAGE_SECRET:?set WATERFALL_STORAGE_SECRET in .env}
# The storage behind its proxy in TLS (storage-proxy, TFX-05).
x-storage-environment: &storage-environment
  WATERFALL_STORAGE_ADDRESS: https://storage:3900
  WATERFALL_STORAGE_ACCESS_KEY: *storage-key
  WATERFALL_STORAGE_SECRET: *storage-secret
  WATERFALL_BACKUPS_BUCKET: backups

# The three thresholds of the alerts (WF-OBS-0030), operating parameters, shipped at fifteen minutes,
# 85 % and 5 % over five minutes: the rules of Prometheus are written with them (prometheus.sh), and
# the API presents them on the status screen, with the same values (#4636).
x-alert-thresholds: &alert-thresholds
  WATERFALL_TASK_QUEUE_AGE_THRESHOLD_SECONDS: ${WATERFALL_TASK_QUEUE_AGE_THRESHOLD_SECONDS:-900}
  WATERFALL_STORAGE_USAGE_THRESHOLD: ${WATERFALL_STORAGE_USAGE_THRESHOLD:-0.85}
  WATERFALL_ERROR_RATE_THRESHOLD: ${WATERFALL_ERROR_RATE_THRESHOLD:-0.05}
  WATERFALL_ERROR_RATE_WINDOW_SECONDS: ${WATERFALL_ERROR_RATE_WINDOW_SECONDS:-300}

x-healthy: &healthy
  condition: service_healthy
x-done: &done
  condition: service_completed_successfully

services:
  # The authority of the platform (US-2840, waterfall.platform.authority): at each start, before any
  # other service, it issues the key and the certificate of each server in TLS — named as the
  # network names it, owned by the user it runs as, the key readable by it alone — and writes the
  # root every client trusts, then stops. The root is the operator's when ./authority holds ca.crt
  # and ca.key; else the one it made at its first start, kept in the volume authority, which no
  # other service mounts. A provided authority it cannot read stops it, and the platform with it,
  # saying why. As root, to give each key to its user.
  authority:
    image: *waterfall-image
    user: "0:0"
    command:
      - waterfall-authority
      - --provided=/authority/provided
      - --kept=/authority/kept
      - --trust=/trust
      - --certificates=/certificates
      # <name in the network>:<user>:<group> of each server: those of its image.
      - postgres:999:999
      - redis:999:1000
      - api:1000:1000
      - keycloak:1000:0
      - storage:0:0
      - prometheus:65534:65534
      - alertmanager:65534:65534
      - grafana:472:0
      - front-proxy:0:0
    volumes:
      - ${WATERFALL_AUTHORITY_DIRECTORY:-./authority}:/authority/provided:ro
      - authority:/authority/kept
      - trust:/trust
      - certificates-postgres:/certificates/postgres
      - certificates-redis:/certificates/redis
      - certificates-api:/certificates/api
      - certificates-keycloak:/certificates/keycloak
      - certificates-storage:/certificates/storage
      - certificates-prometheus:/certificates/prometheus
      - certificates-alertmanager:/certificates/alertmanager
      - certificates-grafana:/certificates/grafana
      - certificates-front-proxy:/certificates/front-proxy
    restart: "no"

  # The only door: 80, which Let's Encrypt asks and which sends to HTTPS, and 443. It answers for
  # the domain under its own name too, inside the network: the front reaches Keycloak there, in
  # HTTPS, at the address the browser knows. It reaches the front, Keycloak and Grafana in TLS,
  # trusting the root of the platform (Caddyfile.prod).
  caddy:
    image: ${WATERFALL_MIRROR:-}caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.prod", "--adapter", "caddyfile"]
    environment:
      WATERFALL_DOMAIN: ${WATERFALL_DOMAIN:?set WATERFALL_DOMAIN in .env}
      # Where HTTP sends to: the published address, its port of HTTPS included.
      WATERFALL_ADDRESS: *address
      WATERFALL_ACME_EMAIL: ${WATERFALL_ACME_EMAIL:?set WATERFALL_ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile.prod:ro
      # The certificates and the account of Let's Encrypt: kept, or every start would ask again.
      - caddy-data:/data
      - caddy-config:/config
      - *trust
    depends_on:
      authority: *done
    ports:
      - "${WATERFALL_HTTP_PORT:-80}:80"
      - "${WATERFALL_HTTPS_PORT:-443}:443"
    networks:
      default:
        aliases:
          - ${WATERFALL_DOMAIN:?set WATERFALL_DOMAIN in .env}
    restart: unless-stopped

  # The front in TLS (#4508, Caddyfile.front): its proxy serves it at https://front-proxy:3443, with
  # the certificate the authority issues for that name, and reaches the server of Next on the network
  # front, which they alone share, as storage-proxy reaches Garage: each restarts alone, and the proxy
  # finds the front again by its name there.
  front-proxy:
    image: ${WATERFALL_MIRROR:-}caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.front", "--adapter", "caddyfile"]
    environment:
      WATERFALL_FRONT_UPSTREAM: front-next:3000
    volumes:
      - ./Caddyfile.front:/etc/caddy/Caddyfile.front:ro
      - certificates-front-proxy:/tls:ro
    networks:
      default: {}
      front: {}
    restart: unless-stopped
    depends_on:
      authority: *done
      front: *healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3443"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The server of Next listens on the network front alone, at its name there, front-next, which no
  # other network knows: no port of it is reached in the clear from the network of the platform,
  # which it joins to reach the API, Redis and Keycloak. The port of the metrics of the front is its
  # own, in HTTP, on every interface, published nowhere (TFX-09).
  front:
    image: ghcr.io/waterfall-project/front@${WATERFALL_DIGEST_FRONT:?set WATERFALL_DIGEST_FRONT in .env}
    networks:
      default: {}
      front:
        aliases: [front-next]
    environment:
      HOSTNAME: front-next
      # The API and Redis in TLS (TFX-02, TFX-04), their certificates checked against the root of
      # the platform, which NODE_EXTRA_CA_CERTS adds to the authorities the server of Next knows.
      WATERFALL_API_ADDRESS: https://api:8443
      NODE_EXTRA_CA_CERTS: /trust/root.crt
      WATERFALL_FRONT_ADDRESS: *address
      WATERFALL_KEYCLOAK_ADDRESS: *keycloak-address
      # The server of Next reaches Keycloak through Caddy, on its name in the network, in HTTPS: its
      # client of the realm admits no address in HTTP.
      WATERFALL_KEYCLOAK_BACKCHANNEL: https://${WATERFALL_DOMAIN:?set WATERFALL_DOMAIN in .env}/auth
      WATERFALL_FRONT_CLIENT_SECRET: ${WATERFALL_FRONT_CLIENT_SECRET:?set WATERFALL_FRONT_CLIENT_SECRET in .env}
      # The port of the metrics of the front (WF-OBS-0010), the worker's variable: published nowhere,
      # and the door sends to its proxy alone, whose front answers 404 to /metrics (TFX-09).
      WATERFALL_METRICS_PORT: ${WATERFALL_METRICS_PORT:-9100}
      WATERFALL_REDIS_URL: rediss://:${WATERFALL_REDIS_PASSWORD:?set WATERFALL_REDIS_PASSWORD in .env}@redis:6379/0
      # The key of the server actions, the same for every start and every instance (#825).
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${WATERFALL_SERVER_ACTIONS_KEY:?set WATERFALL_SERVER_ACTIONS_KEY in .env}
    volumes:
      - *trust
    depends_on:
      api: *healthy
      redis: *healthy
      keycloak-realm: *healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://front-next:3000/', {headers: {'user-agent': 'waterfall-healthcheck'}}).then(r => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Refuses, then stops, a volume of PostgreSQL that holds the data of another major version: the
  # platform does not take them over (US-1130), and the refusal names the versions and the remedy,
  # the note of README.md. Read-only, as root, who reads the data whatever their owner.
  postgres-volume:
    image: *postgres-image
    entrypoint: ["/bin/sh", "/postgres-volume.sh"]
    command:
      - "Remove the platform with its volumes (down --volumes), then install and bootstrap it again: deploy/compose/README.md, « Mettre à jour »."
    volumes:
      - postgres-data:/var/lib/postgresql:ro
      - ./postgres-volume.sh:/postgres-volume.sh:ro
    restart: "no"

  # The administrator of the server, postgres, made at the first start alone, as is its password:
  # to change it afterwards, ALTER ROLE postgres PASSWORD '...' in the container, then in .env.
  # The data live in <major>/docker of the volume, the layout of the images since 18. The health
  # check asks by TCP: the server of the first initialisation, which stops before the real one
  # starts, listens on the socket alone (US-1130).
  postgres:
    image: *postgres-image
    # One partition of each partitioned table per project: the restoration drops the schema, and
    # pg_restore makes it again, in one transaction that locks every one of them. The default of 64
    # locks per transaction refuses it ("out of shared memory") from a few hundred projects.
    # max_connections carries the connections of every process of the platform: fifteen for each
    # process of the API, two hundred for the others, Keycloak's hundred included (README.md, « Les
    # processus de l'API »). Computed from their number by the shell, which then hands over to the
    # entry point of the image. In TLS, with the certificate of the authority (TFX-03, TFX-10,
    # TFX-12); pg_hba.conf refuses a connection in the clear through the network, whoever asks. A
    # certificate missing stops the server, which names the file.
    entrypoint:
      - /bin/sh
      - -c
      - case "$$WATERFALL_API_PROCESSES" in ''|*[!0-9]*|0*) echo "WATERFALL_API_PROCESSES must be a whole number above zero, without leading zero" >&2; exit 1;; esac; exec docker-entrypoint.sh postgres -c max_locks_per_transaction=1024 -c max_connections=$$((15 * WATERFALL_API_PROCESSES + 200)) -c ssl=on -c ssl_cert_file=/tls/tls.crt -c ssl_key_file=/tls/tls.key -c hba_file=/etc/waterfall/pg_hba.conf
    environment:
      WATERFALL_API_PROCESSES: *api-processes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${WATERFALL_POSTGRES_ADMIN_PASSWORD:?set WATERFALL_POSTGRES_ADMIN_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - certificates-postgres:/tls:ro
      - ./pg_hba.conf:/etc/waterfall/pg_hba.conf:ro
    restart: unless-stopped
    depends_on:
      postgres-volume: *done
      authority: *done
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username postgres --dbname postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Nothing durable is kept in Redis: the queue and the sessions are lost with it, not the data. In
  # TLS alone (TFX-04, TFX-10): no port in the clear (--port 0); no certificate asked of its
  # clients, who sign in with the password.
  redis:
    image: ${WATERFALL_MIRROR:-}redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    user: redis
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDISCLI_AUTH\" --save '' --port 0 --tls-port 6379 --tls-cert-file /tls/tls.crt --tls-key-file /tls/tls.key --tls-ca-cert-file /tls/ca.crt --tls-auth-clients no"]
    environment:
      REDISCLI_AUTH: ${WATERFALL_REDIS_PASSWORD:?set WATERFALL_REDIS_PASSWORD in .env}
    volumes:
      - certificates-redis:/tls:ro
    restart: unless-stopped
    depends_on:
      authority: *done
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /tls/ca.crt -h localhost ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The database of Waterfall and its owner, no superuser, created when missing, with the role of
  # the service, which the owner may not create (waterfall-database.sql).
  waterfall-database:
    image: *postgres-image
    user: postgres
    command: ["psql", "--no-psqlrc", "--set=ON_ERROR_STOP=1", "--file=/waterfall-database.sql"]
    environment:
      <<: *administrator
      PGDATABASE: postgres
      OWNER_DATABASE_PASSWORD: ${WATERFALL_POSTGRES_PASSWORD:?set WATERFALL_POSTGRES_PASSWORD in .env}
    volumes:
      - ./waterfall-database.sql:/waterfall-database.sql:ro
      - *trust
    restart: "no"
    depends_on:
      postgres: *healthy

  # Applies the migrations as the owner of the tables, then stops: at each start, so that a new image
  # migrates the schema before the API starts on it (#701, WF-DAT-0140).
  migrate:
    image: *waterfall-image
    environment:
      <<: *back-environment
      WATERFALL_DATABASE_URL: *owner-database-url
    command: ["waterfall-migrate"]
    volumes:
      - *trust
    restart: "no"
    depends_on:
      waterfall-database: *done

  # Lets the role of the service, which the migrations create, sign in with its password.
  service-database-role:
    image: *postgres-image
    user: postgres
    command: ["psql", "--no-psqlrc", "--set=ON_ERROR_STOP=1", "--file=/service-database-role.sql"]
    environment:
      <<: *administrator
      PGDATABASE: waterfall
      SERVICE_DATABASE_PASSWORD: ${WATERFALL_SERVICE_DATABASE_PASSWORD:?set WATERFALL_SERVICE_DATABASE_PASSWORD in .env}
    volumes:
      - ./service-database-role.sql:/service-database-role.sql:ro
      - *trust
    restart: "no"
    depends_on:
      migrate: *done

  # The role of the backup, a member of pg_read_all_data, by which the worker dumps both databases
  # and which can neither write nor turn a trigger off (#895).
  backup-database-role:
    image: *postgres-image
    user: postgres
    command: ["psql", "--no-psqlrc", "--set=ON_ERROR_STOP=1", "--file=/backup-database-role.sql"]
    environment:
      <<: *administrator
      PGDATABASE: waterfall
      BACKUP_DATABASE_PASSWORD: ${WATERFALL_BACKUP_DATABASE_PASSWORD:?set WATERFALL_BACKUP_DATABASE_PASSWORD in .env}
    volumes:
      - ./backup-database-role.sql:/backup-database-role.sql:ro
      - *trust
    restart: "no"
    depends_on:
      waterfall-database: *done
      keycloak-database: *done

  # The database of Keycloak on the same server, with its role, created when missing.
  keycloak-database:
    image: *postgres-image
    user: postgres
    command: ["psql", "--no-psqlrc", "--set=ON_ERROR_STOP=1", "--file=/keycloak-database.sql"]
    environment:
      <<: *administrator
      PGDATABASE: postgres
      KEYCLOAK_DATABASE_PASSWORD: ${WATERFALL_KEYCLOAK_DATABASE_PASSWORD:?set WATERFALL_KEYCLOAK_DATABASE_PASSWORD in .env}
    volumes:
      - ./keycloak-database.sql:/keycloak-database.sql:ro
      - *trust
    restart: "no"
    depends_on:
      postgres: *healthy

  # The API in TLS alone, with the certificate of the authority (TFX-02): the front reaches it at
  # https://api:8443. Its metrics stay in HTTP, at /api/v1/metrics of port 8000, published nowhere,
  # where Prometheus collects them as the chart's does (prometheus.yml), and nothing else is served
  # there: any other path is not found (TFX-09).
  api:
    image: *waterfall-image
    environment:
      <<: [*back-environment, *keycloak-client-environment, *storage-environment, *alert-thresholds]
      WATERFALL_INDICATORS_CACHE_TTL: ${WATERFALL_INDICATORS_CACHE_TTL:-600}
      WATERFALL_API_PROCESSES: *api-processes
      # The capacities of the spaces, of which the metrics say what is left, and without which the
      # alert of a full storage could never appear (#4229).
      WATERFALL_DATABASE_CAPACITY_BYTES: ${WATERFALL_DATABASE_CAPACITY_BYTES:?set WATERFALL_DATABASE_CAPACITY_BYTES in .env}
      WATERFALL_STORAGE_CAPACITY_BYTES: ${WATERFALL_STORAGE_CAPACITY_BYTES:?set WATERFALL_STORAGE_CAPACITY_BYTES in .env}
      WATERFALL_PORT: 8443
      WATERFALL_TLS_CERTIFICATE: /tls/tls.crt
      WATERFALL_TLS_KEY: /tls/tls.key
      WATERFALL_METRICS_PORT: 8000
      # The query API of Prometheus, in HTTPS, its certificate checked against the root (TFX-14).
      WATERFALL_PROMETHEUS_ADDRESS: https://prometheus:9090
      # What the status screen presents (WF-ADM-0130, #4636): the retention the purge of the worker
      # applies, and the thresholds the rules of Prometheus are written with (x-alert-thresholds).
      WATERFALL_BACKGROUND_TASK_RETENTION_DAYS: ${WATERFALL_BACKGROUND_TASK_RETENTION_DAYS:-30}
    volumes:
      - certificates-api:/tls:ro
      - *trust
    depends_on:
      service-database-role: *done
      redis: *healthy
      storage-buckets: *done
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; urllib.request.urlopen('https://localhost:8443/api/v1/health', timeout=2, context=ssl.create_default_context(cafile='/trust/root.crt'))"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs the background tasks of the queue (WF-ARC-0090), and starts again if it stops. A backup
  # dumps both databases as the role of the backup (#895) into the bucket of the backups.
  worker:
    image: *waterfall-image
    environment:
      <<: [*back-environment, *keycloak-client-environment, *storage-environment]
      WATERFALL_BACKUP_DATABASE_URL: postgresql://waterfall_backup:${WATERFALL_BACKUP_DATABASE_PASSWORD:?set WATERFALL_BACKUP_DATABASE_PASSWORD in .env}@postgres:5432/waterfall?sslmode=verify-full&sslrootcert=/trust/root.crt
      WATERFALL_KEYCLOAK_DATABASE_URL: postgresql://waterfall_backup:${WATERFALL_BACKUP_DATABASE_PASSWORD:?set WATERFALL_BACKUP_DATABASE_PASSWORD in .env}@postgres:5432/keycloak?sslmode=verify-full&sslrootcert=/trust/root.crt
      # Its metrics, on every interface of the container, on a port published nowhere, where
      # Prometheus collects them (TFX-09, #4229).
      WATERFALL_HOST: 0.0.0.0
      WATERFALL_METRICS_PORT: ${WATERFALL_METRICS_PORT:-9100}
      # What its purge keeps: the undo history of a session, the result of a task ended (US-2830).
      WATERFALL_UNDO_RETENTION_HOURS: ${WATERFALL_UNDO_RETENTION_HOURS:-12}
      WATERFALL_BACKGROUND_TASK_RETENTION_DAYS: ${WATERFALL_BACKGROUND_TASK_RETENTION_DAYS:-30}
      # How long a task of a kind it does not run waits for a newer worker, then fails (#809).
      WATERFALL_UNKNOWN_KIND_WAIT_SECONDS: ${WATERFALL_UNKNOWN_KIND_WAIT_SECONDS:-3600}
    command: ["waterfall-worker"]
    volumes:
      - *trust
    restart: unless-stopped
    depends_on:
      service-database-role: *done
      backup-database-role: *done
      keycloak-database: *done
      redis: *healthy
      storage-buckets: *done

  # The one command the planners call, every five minutes (PBS-5.3; a CronJob does it under
  # Kubernetes): `waterfall-worker schedule` deposits what is due — the reading of the accounts and
  # the backup at the time their schedules say, which an administrator sets on the screen and the
  # database keeps (US-3040, US-2910), the purge of what expired at the end of each purge interval,
  # ten minutes by default (EP-06, "La purge") — unless a task of the kind is queued or running,
  # and runs nothing: the worker does, the storage included. It reaches PostgreSQL and
  # Redis alone (TFX-10). A schedule that says a setting is wrong, 2, stops the service with 2.
  scheduler:
    image: *waterfall-image
    environment:
      <<: *back-environment
      WATERFALL_SCHEDULE_INTERVAL: ${WATERFALL_SCHEDULE_INTERVAL:-300}
      WATERFALL_PURGE_INTERVAL: ${WATERFALL_PURGE_INTERVAL:-600}
    init: true
    command:
      - sh
      - -c
      - |
        [ "$$WATERFALL_SCHEDULE_INTERVAL" -gt 0 ] 2>/dev/null || exit 2
        while sleep "$$WATERFALL_SCHEDULE_INTERVAL"; do
          waterfall-worker schedule || [ "$$?" -ne 2 ] || exit 2
        done
        exit 2
    volumes:
      - *trust
    restart: unless-stopped
    depends_on:
      service-database-role: *done
      redis: *healthy

  # Runs the restorations the API deposits in their stream, and nothing else (WF-ADM-0160, #953),
  # and starts again if it stops: a restoration is asked for at the screen, where nobody runs a
  # command. The only service that holds the owners of both databases; with them, the client of
  # the bootstrap, which clears the caches of Keycloak (#954), and the service account, which
  # closes the sessions. It asks keycloak-realm, through the folder they alone share, to apply the
  # realm again (#955). It opens no port.
  restore:
    image: *waterfall-image
    environment:
      <<: [*back-environment, *keycloak-client-environment, *storage-environment]
      WATERFALL_DATABASE_URL: *owner-database-url
      WATERFALL_KEYCLOAK_DATABASE_URL: postgresql://keycloak:${WATERFALL_KEYCLOAK_DATABASE_PASSWORD:?set WATERFALL_KEYCLOAK_DATABASE_PASSWORD in .env}@postgres:5432/keycloak?sslmode=verify-full&sslrootcert=/trust/root.crt
      WATERFALL_INSTALLATION_CLIENT_SECRET: ${WATERFALL_INSTALLATION_CLIENT_SECRET:?set WATERFALL_INSTALLATION_CLIENT_SECRET in .env}
      WATERFALL_REALM_REQUESTS: /realm-requests
    command: ["waterfall-restore"]
    volumes:
      - realm-requests:/realm-requests
      - *trust
    restart: unless-stopped
    depends_on:
      migrate: *done
      keycloak-database: *done
      redis: *healthy
      storage-buckets: *done
      keycloak-realm: *healthy

  # The bootstrap (US-0420): `docker compose -f compose.prod.yaml run --rm install` once the platform
  # is up. The migrations, then what nobody may enter without, and the link of the first
  # administrator, alone on its standard output. As the owner of the tables (#701), with the secret
  # of the client of the bootstrap (#652), which restore and keycloak-realm hold too. Never started
  # by `up`; run alone, it waits for the schema migrated and for the realm applied, whose client it
  # uses.
  install:
    image: *waterfall-image
    profiles: [install]
    environment:
      <<: *keycloak-client-environment
      WATERFALL_DATABASE_URL: *owner-database-url
      WATERFALL_INSTALLATION_CLIENT_SECRET: ${WATERFALL_INSTALLATION_CLIENT_SECRET:?set WATERFALL_INSTALLATION_CLIENT_SECRET in .env}
      WATERFALL_ADMIN_EMAIL: ${WATERFALL_ADMIN_EMAIL:?set WATERFALL_ADMIN_EMAIL in .env}
      WATERFALL_DEFAULT_LANGUAGE: ${WATERFALL_DEFAULT_LANGUAGE:-fr}
      WATERFALL_CURRENCY: ${WATERFALL_CURRENCY:?set WATERFALL_CURRENCY in .env}
      WATERFALL_COMPANY_NAME: "${WATERFALL_COMPANY_NAME:?set WATERFALL_COMPANY_NAME in .env}"
      WATERFALL_TIME_ZONE: ${WATERFALL_TIME_ZONE:-}
      # The largest avatar, in bytes, which the bootstrap writes for the installation (#4636).
      WATERFALL_AVATAR_MAX_BYTES: ${WATERFALL_AVATAR_MAX_BYTES:-524288}
    command: ["waterfall-api", "install"]
    volumes:
      - *trust
    restart: "no"
    depends_on:
      postgres: *healthy
      migrate: *done
      keycloak: *healthy
      keycloak-realm: *healthy

  # The object storage (PBS-3.3): Garage on one node, its layout made at its start and the key of the
  # platform taken from the environment (garage.toml), its memory bounded (WF-CMP-0020). It does not
  # encrypt by itself: it is on the network storage alone, which no service but its proxy in TLS
  # joins, and is reached there as garage (TFX-05).
  storage:
    image: ${WATERFALL_MIRROR:-}dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    command: ["/garage", "server", "--single-node", "--default-access-key"]
    environment:
      GARAGE_RPC_SECRET: ${WATERFALL_STORAGE_RPC_SECRET:?set WATERFALL_STORAGE_RPC_SECRET in .env}
      GARAGE_DEFAULT_ACCESS_KEY: *storage-key
      GARAGE_DEFAULT_SECRET_KEY: *storage-secret
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - storage-data:/var/lib/garage
    networks:
      storage:
        aliases: [garage]
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The object storage in TLS (TFX-05, Caddyfile.storage): the services reach it at
  # https://storage:3900, with the certificate the authority issues for that name, and the proxy
  # reaches Garage on the network they alone share.
  storage-proxy:
    image: ${WATERFALL_MIRROR:-}caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.storage", "--adapter", "caddyfile"]
    volumes:
      - ./Caddyfile.storage:/etc/caddy/Caddyfile.storage:ro
      - certificates-storage:/tls:ro
    networks:
      default:
        aliases: [storage]
      storage: {}
    restart: unless-stopped
    depends_on:
      authority: *done
      storage: *healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3900"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the buckets of the platform when missing, then stops: the backups, and the imports.
  storage-buckets:
    image: ${WATERFALL_MIRROR:-}curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    entrypoint: ["/bin/sh", "/storage-buckets.sh"]
    environment:
      STORAGE_ADDRESS: https://storage:3900
      STORAGE_AUTHORITY: /trust/root.crt
      STORAGE_ACCESS_KEY: *storage-key
      STORAGE_SECRET: *storage-secret
      STORAGE_BUCKETS: backups imports
    volumes:
      - ./storage-buckets.sh:/storage-buckets.sh:ro
      - *trust
    restart: "no"
    depends_on:
      storage-proxy: *healthy

  # Keycloak behind Caddy, under /auth: the issuer of every token is the address of the browser; the
  # services reach it at keycloak:8443, on the back channel. No mail server: the links that set a
  # password are handed over by createPasswordSetupLink (WF-CMP-0030). In TLS alone, with the
  # certificate of the authority (TFX-08): no listener in HTTP. It reaches the front on its back
  # channel in HTTPS, trusting the root of the platform (TFX-17, KC_TRUSTSTORE_PATHS). Its interface
  # of management, which answers its health check, stays in HTTP on the loopback of its container,
  # which no other service reaches. One instance, its caches its own (KC_CACHE=local): it opens no
  # port of a cluster, neither 7800 nor 57800, where JGroups would detect its peers in the clear.
  keycloak:
    image: *keycloak-image
    environment:
      <<: *keycloak-database
      # The administrator of the master realm, read at the first start alone.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${WATERFALL_KEYCLOAK_ADMIN_PASSWORD:?set WATERFALL_KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: *keycloak-address
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /tls/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /tls/tls.key
      KC_TRUSTSTORE_PATHS: /trust/root.crt
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_HTTP_MANAGEMENT_HOST: 127.0.0.1
      KC_CACHE: local
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - certificates-keycloak:/tls:ro
      - *trust
    restart: unless-stopped
    depends_on:
      keycloak-database: *done
    healthcheck:
      # Read on the status line: readiness answers 503 while the schema migrates, with a body
      # whose database check already says "UP" (#1079).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 60

  # Applies the realm of the image at each start: a setting changed by hand in the console comes back
  # to what the realm says. Keycloak tells the front of a closed session on its back channel, inside
  # the network of the platform (#731), in HTTPS, through the proxy of the front (TFX-17). Then
  # stays, and applies it again when the service of the restoration asks, over the database it has
  # restored (#955): as a temporary administrator it makes on the database of Keycloak
  # (realm-service), the administrator of master being then the backup's, whose password it gives
  # back.
  keycloak-realm:
    image: *keycloak-image
    entrypoint: ["/opt/keycloak/bin/realm-service", "/opt/keycloak/bin/apply-realm"]
    environment:
      <<: *keycloak-database
      KEYCLOAK_URL: https://keycloak:8443/auth
      # The root keycloak-config-cli and kcadm check Keycloak's certificate against (realm-service).
      WATERFALL_TLS_AUTHORITY: /trust/root.crt
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: ${WATERFALL_KEYCLOAK_ADMIN_PASSWORD:?set WATERFALL_KEYCLOAK_ADMIN_PASSWORD in .env}
      WATERFALL_FRONT_ADDRESS: *address
      WATERFALL_FRONT_BACKCHANNEL: https://front-proxy:3443
      WATERFALL_FRONT_CLIENT_SECRET: ${WATERFALL_FRONT_CLIENT_SECRET:?set WATERFALL_FRONT_CLIENT_SECRET in .env}
      WATERFALL_SERVICE_CLIENT_SECRET: ${WATERFALL_SERVICE_CLIENT_SECRET:?set WATERFALL_SERVICE_CLIENT_SECRET in .env}
      WATERFALL_INSTALLATION_CLIENT_SECRET: ${WATERFALL_INSTALLATION_CLIENT_SECRET:?set WATERFALL_INSTALLATION_CLIENT_SECRET in .env}
      WATERFALL_REALM_REQUESTS: /realm-requests
    volumes:
      - realm-requests:/realm-requests
      - *trust
    restart: unless-stopped
    depends_on:
      keycloak: *healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "test -f /tmp/realm-applied"]
      interval: 5s
      timeout: 3s
      retries: 120

  # Prometheus (US-2880, WF-OBS-0010, WF-OBS-0030): it collects the front, the API and the worker,
  # inside the network of the platform, and evaluates the rules of the alerts, written at each start
  # with the thresholds of .env (prometheus.sh, prometheus-alerts.yml); its series in a volume. It
  # publishes no port: the status screen and the dashboard read it inside the network, in TLS alone,
  # with the certificate of the authority (TFX-14, prometheus-web.yml); it collects the metrics in
  # HTTP, which is theirs (TFX-09). Its health check reaches it in TLS (prometheus-client.yml).
  prometheus:
    image: ${WATERFALL_MIRROR:-}prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    entrypoint: ["/bin/sh", "/etc/waterfall/prometheus.sh"]
    command:
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.config.file=/etc/waterfall/prometheus-web.yml
    environment:
      <<: *alert-thresholds
      WATERFALL_METRICS_PORT: ${WATERFALL_METRICS_PORT:-9100}
    volumes:
      - ./prometheus.sh:/etc/waterfall/prometheus.sh:ro
      - ./prometheus.yml:/etc/waterfall/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/waterfall/prometheus-alerts.yml:ro
      - ./prometheus-web.yml:/etc/waterfall/prometheus-web.yml:ro
      - ./prometheus-client.yml:/etc/waterfall/prometheus-client.yml:ro
      - prometheus-data:/prometheus
      - certificates-prometheus:/tls:ro
    depends_on:
      authority: *done
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "promtool", "check", "ready", "--url=https://localhost:9090", "--http.config.file=/etc/waterfall/prometheus-client.yml"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Alertmanager (US-2880, WF-OBS-0030): it notifies each alert of Prometheus by e-mail, through the
  # mail server .env names — none, nothing is notified —, its configuration written at each start
  # (alertmanager.sh). It publishes no port: Prometheus reaches it inside the network of the platform,
  # in TLS alone, with the certificate of the authority (#4508, alertmanager-web.yml); its health
  # check reaches it in TLS too (alertmanager-client.yml).
  alertmanager:
    image: ${WATERFALL_MIRROR:-}prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    entrypoint: ["/bin/sh", "/etc/waterfall/alertmanager.sh"]
    # Alone: no cluster of replicas to join.
    command:
      - --storage.path=/alertmanager
      - --cluster.listen-address=
      - --web.config.file=/etc/waterfall/alertmanager-web.yml
    environment:
      WATERFALL_ALERT_SMTP_HOST: ${WATERFALL_ALERT_SMTP_HOST:-}
      WATERFALL_ALERT_SMTP_FROM: ${WATERFALL_ALERT_SMTP_FROM:-}
      WATERFALL_ALERT_RECIPIENT: ${WATERFALL_ALERT_RECIPIENT:-}
      WATERFALL_ALERT_SMTP_REQUIRE_TLS: ${WATERFALL_ALERT_SMTP_REQUIRE_TLS:-true}
      WATERFALL_ALERT_SMTP_USER: ${WATERFALL_ALERT_SMTP_USER:-}
      WATERFALL_ALERT_SMTP_PASSWORD: ${WATERFALL_ALERT_SMTP_PASSWORD:-}
    volumes:
      - ./alertmanager.sh:/etc/waterfall/alertmanager.sh:ro
      - ./alertmanager-web.yml:/etc/waterfall/alertmanager-web.yml:ro
      - ./alertmanager-client.yml:/etc/waterfall/alertmanager-client.yml:ro
      - alertmanager-data:/alertmanager
      - certificates-alertmanager:/tls:ro
    depends_on:
      authority: *done
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "amtool", "config", "show", "--alertmanager.url=https://localhost:9093", "--http.config.file=/etc/waterfall/alertmanager-client.yml"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Grafana (US-2880, WF-OBS-0030): the dashboard of the operator, delivered, on the one source that
  # is the Prometheus of the platform. It has its own account, outside Keycloak (TFX-15), whose password
  # .env must hold — it does not start without. It reads neither PostgreSQL nor Redis, and keeps nothing
  # in a volume: its account is written at each start, so that the password of .env is the one that
  # opens it. Served under /grafana by the door, in TLS alone, with the certificate of the authority
  # (#4508). It reads Prometheus in HTTPS, its certificate checked against the root of the platform
  # (grafana-datasource.yml).
  grafana:
    image: ${WATERFALL_MIRROR:-}grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    environment:
      GF_SECURITY_ADMIN_USER: ${WATERFALL_GRAFANA_ADMIN_USER:-operator}
      GF_SECURITY_ADMIN_PASSWORD: ${WATERFALL_GRAFANA_ADMIN_PASSWORD:?set WATERFALL_GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: https://${WATERFALL_DOMAIN:?set WATERFALL_DOMAIN in .env}${WATERFALL_HTTPS_PORT:+:${WATERFALL_HTTPS_PORT}}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /tls/tls.crt
      GF_SERVER_CERT_KEY: /tls/tls.key
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # The door serves the platform in HTTPS alone: the cookie of the session never goes in the clear.
      GF_SECURITY_COOKIE_SECURE: "true"
      # Nothing leaves the platform: no check of updates, no report, no news, no plugin to install.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/waterfall.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/waterfall.yml:ro
      - ./grafana-dashboard.json:/var/lib/waterfall-dashboards/waterfall.json:ro
      - *trust
      - certificates-grafana:/tls:ro
    depends_on:
      authority: *done
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "--cacert", "/trust/root.crt", "https://localhost:3000/grafana/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

networks:
  # Where Garage listens in the clear: its proxy in TLS alone joins it, and nothing leaves it.
  storage:
    internal: true
  # Where the server of Next listens in the clear: it and its proxy in TLS alone join it.
  front:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  storage-data:
  prometheus-data:
  alertmanager-data:
  # The root the platform made and its key, when the operator provides none: the service authority
  # alone mounts it. Kept, so that the clients trust the same root from one start to the next.
  authority:
  # The root every client trusts, at /trust/root.crt.
  trust:
  # The key and the certificate of each server in TLS, each mounted by its server alone.
  certificates-postgres:
  certificates-redis:
  certificates-api:
  certificates-keycloak:
  certificates-storage:
  certificates-prometheus:
  certificates-alertmanager:
  certificates-grafana:
  certificates-front-proxy:
  # Where the service of the restoration asks keycloak-realm to apply the realm again, and reads the
  # answer: in memory, theirs alone, written by the user of both images.
  realm-requests:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=1000,gid=1000,mode=0700,size=1m
