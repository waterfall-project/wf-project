# Alertmanager serves in TLS alone (US-2840, WF-SEC-0010, #4508): Prometheus sends it the alerts in
# HTTPS, its certificate checked against the root of the platform. The certificate and the key the
# authority of the platform issues for its name, alertmanager (compose.prod.yaml, authority; the
# chart issues them in the pod).
tls_server_config:
  cert_file: /tls/tls.crt
  key_file: /tls/tls.key
