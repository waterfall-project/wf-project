# The passwords and the secrets of the platform, made from secrets.values unless the operator names
# a Secret of their own, which holds the same keys (WF-SEC-0010). A key without a value stops the
# rendering, naming it, as compose.prod.yaml stops on a variable its .env lacks.
{{- if not .Values.secrets.existingSecret }}
{{- $given := .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "waterfall.secret" . }}
  labels:
    {{- include "waterfall.labels" (list . "secrets") | nindent 4 }}
type: Opaque
stringData:
  {{- range $key := splitList " " (include "waterfall.secretKeys" .) }}
  {{ $key }}: {{ required (printf "secrets.values.%s, or secrets.existingSecret" $key) (index $given $key) | quote }}
  {{- end }}
{{- end }}
