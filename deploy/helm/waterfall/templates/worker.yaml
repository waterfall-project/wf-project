# The worker (compose.prod.yaml, worker), a deployment of its own, of worker.replicas replicas: it
# runs the background tasks of the queue (WF-ARC-0090). A backup dumps both databases as the role of
# the backup (#895) into the bucket of the backups. Every component in TLS, checked against the
# roots of the pod (US-2840).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waterfall.name" (list . "worker") }}
  labels:
    {{- include "waterfall.labels" (list . "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "waterfall.selector" (list . "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "waterfall.selector" (list . "worker") | nindent 8 }}
    spec:
      {{- include "waterfall.podDefaults" . | nindent 6 }}
      initContainers:
        {{- include "waterfall.transportInit" (list .) | nindent 8 }}
        {{- include "waterfall.waitForDatabase" (list . "waterfall_service" "waterfall" "WATERFALL_SERVICE_DATABASE_PASSWORD") | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "waterfall.image" (list . "waterfall") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: [waterfall-worker]
          env:
            {{- include "waterfall.backEnvironment" (list . "service") | nindent 12 }}
            {{- include "waterfall.keycloakClientEnvironment" . | nindent 12 }}
            {{- include "waterfall.storageEnvironment" . | nindent 12 }}
            {{- include "waterfall.secretEnv" (list . "WATERFALL_BACKUP_DATABASE_PASSWORD") | nindent 12 }}
            - name: WATERFALL_UNDO_RETENTION_HOURS
              value: {{ .Values.worker.undoRetentionHours | quote }}
            - name: WATERFALL_BACKGROUND_TASK_RETENTION_DAYS
              value: {{ .Values.worker.backgroundTaskRetentionDays | quote }}
            - name: WATERFALL_UNKNOWN_KIND_WAIT_SECONDS
              value: {{ .Values.worker.unknownKindWaitSeconds | quote }}
            - name: WATERFALL_BACKUP_DATABASE_URL
              value: {{ include "waterfall.databaseUrl" (list . "waterfall_backup" "$(WATERFALL_BACKUP_DATABASE_PASSWORD)" "waterfall") | quote }}
            - name: WATERFALL_KEYCLOAK_DATABASE_URL
              value: {{ include "waterfall.databaseUrl" (list . "waterfall_backup" "$(WATERFALL_BACKUP_DATABASE_PASSWORD)" "keycloak") | quote }}
            # The metrics, on every interface of the pod, on a port no Service but the headless one
            # of Prometheus routes (prometheus.yaml, TFX-09).
            - name: WATERFALL_HOST
              value: 0.0.0.0
            - name: WATERFALL_METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          volumeMounts:
            {{- include "waterfall.trustMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        {{- include "waterfall.transportVolumes" (list .) | nindent 8 }}
