# The tasks planned (PBS-5.3): one CronJob, which runs the one command the planners call, as the
# loop of the service scheduler of the Compose does — `waterfall-worker schedule`. It deposits
# what is due, the reading of the accounts and the purge of what expired, unless a task of the kind
# is queued or running, and stops (TFX-10): it reaches PostgreSQL and Redis alone, the worker runs
# the tasks and holds the storage. Never two of it at once.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "waterfall.name" (list . "scheduler") }}
  labels:
    {{- include "waterfall.labels" (list . "scheduler") | nindent 4 }}
spec:
  schedule: {{ .Values.scheduler.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "waterfall.selector" (list . "scheduler") | nindent 12 }}
        spec:
          {{- include "waterfall.podDefaults" . | nindent 10 }}
          restartPolicy: Never
          containers:
            - name: schedule
              image: {{ include "waterfall.image" (list . "waterfall") }}
              imagePullPolicy: {{ .Values.images.pullPolicy }}
              command: [waterfall-worker, schedule]
              env:
                {{- include "waterfall.backEnvironment" (list . "service") | nindent 16 }}
                - name: WATERFALL_PURGE_INTERVAL
                  value: {{ .Values.scheduler.purgeInterval | quote }}
              resources:
                {{- toYaml .Values.scheduler.resources | nindent 16 }}
