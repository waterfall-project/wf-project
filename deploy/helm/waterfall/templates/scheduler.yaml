# The tasks planned (PBS-5.3): a CronJob per command of the worker the service scheduler of the
# Compose runs in its loops — the purge of what expired, the reading of the accounts put in the
# queue —, which inscribes or does its work and stops (TFX-10), never two of one at once. US-2830
# replaces them by the single command that reads the schedules of the database.
{{- range $job, $planned := .Values.scheduler.jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "waterfall.name" (list $ (printf "scheduler-%s" $job)) }}
  labels:
    {{- include "waterfall.labels" (list $ "scheduler") | nindent 4 }}
spec:
  schedule: {{ $planned.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "waterfall.selector" (list $ "scheduler") | nindent 12 }}
        spec:
          {{- include "waterfall.podDefaults" $ | nindent 10 }}
          restartPolicy: Never
          containers:
            - name: {{ $job }}
              image: {{ include "waterfall.image" (list $ "waterfall") }}
              imagePullPolicy: {{ $.Values.images.pullPolicy }}
              command:
                {{- toYaml $planned.command | nindent 16 }}
              env:
                {{- include "waterfall.backEnvironment" (list $ "service") | nindent 16 }}
                {{- include "waterfall.storageEnvironment" $ | nindent 16 }}
                - name: WATERFALL_UNDO_RETENTION_HOURS
                  value: {{ $.Values.scheduler.undoRetentionHours | quote }}
              resources:
                {{- toYaml $.Values.scheduler.resources | nindent 16 }}
{{- end }}
