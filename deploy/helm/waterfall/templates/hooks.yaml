# The hooks (EP-13, « L'empaquetage »), what compose.prod.yaml runs once and stops, in its order:
#
# - the steps of the database and the migrations, before each upgrade, and at the installation as
#   soon as PostgreSQL is there: after it, for the PostgreSQL of the chart, which the cluster has not
#   before — a hook post-install —, and before it, for the PostgreSQL of the operator, which is there
#   already — a hook pre-install, so that the platform starts on a database migrated. The services
#   wait for them: they sign in as the role of the service, which may once they have run (#701).
#   Before the installation neither the Secret nor the ConfigMap of the chart exist: the Secret is
#   the operator's then (`secrets.existingSecret`, required), and the files the steps read are a
#   ConfigMap of the hook itself, made before it and removed after. One instance migrates, before
#   the others of the new image start, and a wait for a lock is read in its log
#   (docs/exploitation/mise-a-jour.md);
# - the buckets of the object storage, once it is there, after the installation and before each
#   upgrade;
# - the application of the realm, after the installation and after each upgrade, as the service
#   keycloak-realm applies it at each start of the Compose;
# - the components Keycloak and the Redis of the chart, read once the realm is applied (the Job
#   `components`, after the installation and each upgrade);
# - the bootstrap, after the installation alone, once the realm is applied: the link of the first
#   administrator is in the log of its Job, which stays until the next installation.
#
# Helm waits for each hook, by its weight, and fails the installation with the first that fails.
# Each reaches its components in TLS, their certificates checked against the roots of its pod
# (US-2840): the authority the chart makes is the first hook of the installation (transport.yaml).
{{- if and (not .Values.postgresql.enabled) (not .Values.secrets.existingSecret) }}
{{- fail "secrets.existingSecret: the Secret of the operator is required when PostgreSQL is provided (postgresql.enabled is false): the migrations run before the installation, which has not made the Secret of the chart yet" }}
{{- end }}
{{- $files := include "waterfall.name" (list . "files") }}
{{- $hookFiles := include "waterfall.name" (list . "hook-files") }}
{{- $events := include "waterfall.migrationEvents" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $hookFiles }}
  labels:
    {{- include "waterfall.labels" (list . "hook-files") | nindent 4 }}
  annotations:
    helm.sh/hook: {{ $events }}
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  {{- range $name := list "waterfall-database.sql" "keycloak-database.sql" "backup-database-role.sql" "service-database-role.sql" }}
  {{ $name }}: |-
    {{- $.Files.Get (printf "files/%s" $name) | trimSuffix "\n" | nindent 4 }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "waterfall.name" (list . "migrate") }}
  labels:
    {{- include "waterfall.labels" (list . "migrate") | nindent 4 }}
  annotations:
    {{- include "waterfall.hook" (list $events -10) | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "waterfall.selector" (list . "migrate") | nindent 8 }}
    spec:
      {{- include "waterfall.podDefaults" . | nindent 6 }}
      # A step that fails — PostgreSQL or the storage not ready yet — is run again where it stopped.
      restartPolicy: OnFailure
      initContainers:
        {{- include "waterfall.transportInit" (list .) | nindent 8 }}
        # The database of Waterfall and its owner, no superuser, and the role of the service,
        # without the right to sign in yet; the database of Keycloak and its role; the role of the
        # backup — each created when missing.
        - name: waterfall-database
          image: {{ include "waterfall.thirdParty" (list . .Values.postgresql.image) }}
          imagePullPolicy: IfNotPresent
          {{- include "waterfall.containerSecurity" (dict "runAsUser" 999 "runAsGroup" 999) | nindent 10 }}
          command:
            - sh
            - -c
            - |-
              until pg_isready --quiet; do sleep 2; done
              exec psql --no-psqlrc --set=ON_ERROR_STOP=1 --file=/files/waterfall-database.sql
          env:
            {{- include "waterfall.administrator" . | nindent 12 }}
            - name: PGDATABASE
              value: postgres
            {{- include "waterfall.secretEnv" (list . "WATERFALL_POSTGRES_PASSWORD" "OWNER_DATABASE_PASSWORD") | nindent 12 }}
          volumeMounts:
            - name: files
              mountPath: /files
            {{- include "waterfall.trustMount" . | nindent 12 }}
        - name: keycloak-database
          image: {{ include "waterfall.thirdParty" (list . .Values.postgresql.image) }}
          imagePullPolicy: IfNotPresent
          {{- include "waterfall.containerSecurity" (dict "runAsUser" 999 "runAsGroup" 999) | nindent 10 }}
          command: [psql, --no-psqlrc, --set=ON_ERROR_STOP=1, --file=/files/keycloak-database.sql]
          env:
            {{- include "waterfall.administrator" . | nindent 12 }}
            - name: PGDATABASE
              value: postgres
            {{- include "waterfall.secretEnv" (list . "WATERFALL_KEYCLOAK_DATABASE_PASSWORD" "KEYCLOAK_DATABASE_PASSWORD") | nindent 12 }}
          volumeMounts:
            - name: files
              mountPath: /files
            {{- include "waterfall.trustMount" . | nindent 12 }}
        - name: backup-database-role
          image: {{ include "waterfall.thirdParty" (list . .Values.postgresql.image) }}
          imagePullPolicy: IfNotPresent
          {{- include "waterfall.containerSecurity" (dict "runAsUser" 999 "runAsGroup" 999) | nindent 10 }}
          command: [psql, --no-psqlrc, --set=ON_ERROR_STOP=1, --file=/files/backup-database-role.sql]
          env:
            {{- include "waterfall.administrator" . | nindent 12 }}
            - name: PGDATABASE
              value: waterfall
            {{- include "waterfall.secretEnv" (list . "WATERFALL_BACKUP_DATABASE_PASSWORD" "BACKUP_DATABASE_PASSWORD") | nindent 12 }}
          volumeMounts:
            - name: files
              mountPath: /files
            {{- include "waterfall.trustMount" . | nindent 12 }}
        # The components the Job can reach, before the migrations (WF-CMP-0020-A, US-2810):
        # PostgreSQL, made above, and the Redis of the operator when it provides one, are of the
        # version Waterfall requires, or the Job fails and its log says which is not (service
        # components of compose.prod.yaml). Keycloak and the Redis of the chart are read after the
        # realm, by the Job `components` below: Keycloak reads its answers with the service account
        # of the realm, which that Job applies, and neither exists yet at an installation.
        - name: components
          image: {{ include "waterfall.image" (list . "waterfall") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "waterfall.containerSecurity" (dict) | nindent 10 }}
          command:
            - waterfall-check-components
            - --component
            - postgresql
            {{- if not .Values.redis.enabled }}
            - --component
            - redis
            {{- end }}
          env:
            {{- include "waterfall.backEnvironment" (list . "owner") | nindent 12 }}
            {{- include "waterfall.keycloakClientEnvironment" . | nindent 12 }}
          volumeMounts:
            {{- include "waterfall.trustMount" . | nindent 12 }}
        # The migrations, as the owner of the tables (#701, WF-DAT-0140).
        - name: migrate
          image: {{ include "waterfall.image" (list . "waterfall") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "waterfall.containerSecurity" (dict) | nindent 10 }}
          command: [waterfall-migrate]
          env:
            {{- include "waterfall.backEnvironment" (list . "owner") | nindent 12 }}
          volumeMounts:
            {{- include "waterfall.trustMount" . | nindent 12 }}
      containers:
        # The role of the service, which the migrations create, may now sign in with its password.
        - name: service-database-role
          image: {{ include "waterfall.thirdParty" (list . .Values.postgresql.image) }}
          imagePullPolicy: IfNotPresent
          {{- include "waterfall.containerSecurity" (dict "runAsUser" 999 "runAsGroup" 999) | nindent 10 }}
          command: [psql, --no-psqlrc, --set=ON_ERROR_STOP=1, --file=/files/service-database-role.sql]
          env:
            {{- include "waterfall.administrator" . | nindent 12 }}
            - name: PGDATABASE
              value: waterfall
            {{- include "waterfall.secretEnv" (list . "WATERFALL_SERVICE_DATABASE_PASSWORD" "SERVICE_DATABASE_PASSWORD") | nindent 12 }}
          volumeMounts:
            - name: files
              mountPath: /files
            {{- include "waterfall.trustMount" . | nindent 12 }}
      volumes:
        - name: files
          configMap:
            name: {{ $hookFiles }}
        {{- include "waterfall.transportVolumes" (list .) | nindent 8 }}
---
# The buckets of the platform, the backups and the imports, created when missing: on the storage of
# the chart, once it is there, or on the operator's, at its address. A Job of its own, not a step of
# the migrations: these run before the installation on a PostgreSQL of the operator's, when the
# storage of the chart does not exist yet.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "waterfall.name" (list . "buckets") }}
  labels:
    {{- include "waterfall.labels" (list . "buckets") | nindent 4 }}
  annotations:
    {{- include "waterfall.hook" (list "post-install,pre-upgrade" -10) | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "waterfall.selector" (list . "buckets") | nindent 8 }}
    spec:
      {{- include "waterfall.podDefaults" . | nindent 6 }}
      # The storage not ready yet is run again.
      restartPolicy: OnFailure
      initContainers:
        {{- include "waterfall.transportInit" (list .) | nindent 8 }}
      containers:
        - name: storage-buckets
          image: {{ include "waterfall.thirdParty" (list . .Values.storage.bucketsImage) }}
          imagePullPolicy: IfNotPresent
          {{- include "waterfall.containerSecurity" (dict "runAsUser" 100 "runAsGroup" 101) | nindent 10 }}
          command: [/bin/sh, /files/storage-buckets.sh]
          env:
            - name: STORAGE_ADDRESS
              value: {{ include "waterfall.storageAddress" . | quote }}
            - name: STORAGE_ACCESS_KEY
              value: {{ .Values.storage.accessKey | quote }}
            {{- include "waterfall.secretEnv" (list . "WATERFALL_STORAGE_SECRET" "STORAGE_SECRET") | nindent 12 }}
            - name: STORAGE_BUCKETS
              value: backups imports
            # In HTTPS, its certificate checked against the roots of the pod (TFX-05).
            - name: STORAGE_AUTHORITY
              value: {{ include "waterfall.roots" . }}
          volumeMounts:
            - name: files
              mountPath: /files
            {{- include "waterfall.trustMount" . | nindent 12 }}
      volumes:
        - name: files
          configMap:
            name: {{ $files }}
        {{- include "waterfall.transportVolumes" (list .) | nindent 8 }}
---
# The realm of the image applied to Keycloak, once it is ready: a setting changed by hand in the
# console comes back to what the realm says. As the administrator of master, whose password the
# application beside the service of the restoration gives back after each restoration (#955).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "waterfall.name" (list . "realm") }}
  labels:
    {{- include "waterfall.labels" (list . "realm") | nindent 4 }}
  annotations:
    {{- include "waterfall.hook" (list "post-install,post-upgrade" 0) | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "waterfall.selector" (list . "realm") | nindent 8 }}
    spec:
      {{- include "waterfall.podDefaults" . | nindent 6 }}
      restartPolicy: OnFailure
      initContainers:
        {{- include "waterfall.transportInit" (list .) | nindent 8 }}
        {{- include "waterfall.waitForKeycloak" (list . "9000" "/auth/health/ready") | nindent 8 }}
      containers:
        - name: realm
          image: {{ include "waterfall.image" (list . "keycloak") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "waterfall.containerSecurity" (dict) | nindent 10 }}
          command: [/opt/keycloak/bin/apply-realm]
          env:
            {{- include "waterfall.realmEnvironment" . | nindent 12 }}
          volumeMounts:
            {{- include "waterfall.trustMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.keycloak.realm.resources | nindent 12 }}
      volumes:
        {{- include "waterfall.transportVolumes" (list .) | nindent 8 }}
---
# The components the realm makes readable, after it (WF-CMP-0020-A, US-2810): Keycloak, whose
# version the service account of the realm reads, and the Redis of the chart. At the installation
# neither is there before the realm is applied, and at an upgrade Keycloak cannot be read until it
# is, when an installation whose realm failed is resumed. Its log says which does not fit, and the
# release fails, at the installation as at each upgrade: the same command, after the same Job
# `realm`, as the service `components` of the Compose, which waits for `keycloak-realm`.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "waterfall.name" (list . "components") }}
  labels:
    {{- include "waterfall.labels" (list . "components") | nindent 4 }}
  annotations:
    {{- include "waterfall.hook" (list "post-install,post-upgrade" 5) | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "waterfall.selector" (list . "components") | nindent 8 }}
    spec:
      {{- include "waterfall.podDefaults" . | nindent 6 }}
      restartPolicy: OnFailure
      initContainers:
        {{- include "waterfall.transportInit" (list .) | nindent 8 }}
      containers:
        - name: components
          image: {{ include "waterfall.image" (list . "waterfall") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "waterfall.containerSecurity" (dict) | nindent 10 }}
          command:
            - waterfall-check-components
            - --component
            - keycloak
            {{- if .Values.redis.enabled }}
            - --component
            - redis
            {{- end }}
          env:
            {{- include "waterfall.backEnvironment" (list . "owner") | nindent 12 }}
            {{- include "waterfall.keycloakClientEnvironment" . | nindent 12 }}
          volumeMounts:
            {{- include "waterfall.trustMount" . | nindent 12 }}
      volumes:
        {{- include "waterfall.transportVolumes" (list .) | nindent 8 }}
---
# The bootstrap (US-0420): the migrations, then what nobody may enter without, and the link of the
# first administrator, alone on its standard output. As the owner of the tables (#701), with the
# secret of the client of the bootstrap (#652). Once: a second run would write a second link.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "waterfall.name" (list . "install") }}
  labels:
    {{- include "waterfall.labels" (list . "install") | nindent 4 }}
  annotations:
    {{- include "waterfall.hook" (list "post-install" 10) | nindent 4 }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "waterfall.selector" (list . "install") | nindent 8 }}
    spec:
      {{- include "waterfall.podDefaults" . | nindent 6 }}
      restartPolicy: Never
      initContainers:
        {{- include "waterfall.transportInit" (list .) | nindent 8 }}
      containers:
        - name: install
          image: {{ include "waterfall.image" (list . "waterfall") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "waterfall.containerSecurity" (dict) | nindent 10 }}
          command: [waterfall-api, install]
          env:
            {{- include "waterfall.keycloakClientEnvironment" . | nindent 12 }}
            {{- include "waterfall.secretEnv" (list . "WATERFALL_POSTGRES_PASSWORD") | nindent 12 }}
            - name: WATERFALL_DATABASE_URL
              value: {{ include "waterfall.databaseUrl" (list . "waterfall" "$(WATERFALL_POSTGRES_PASSWORD)" "waterfall") | quote }}
            - name: WATERFALL_TLS_AUTHORITY
              value: {{ include "waterfall.roots" . }}
            {{- include "waterfall.secretEnv" (list . "WATERFALL_INSTALLATION_CLIENT_SECRET") | nindent 12 }}
            - name: WATERFALL_ADMIN_EMAIL
              value: {{ required "bootstrap.adminEmail: the address of the first administrator" .Values.bootstrap.adminEmail | quote }}
            - name: WATERFALL_DEFAULT_LANGUAGE
              value: {{ .Values.bootstrap.defaultLanguage | quote }}
            - name: WATERFALL_CURRENCY
              value: {{ required "bootstrap.currency: the currency of the company" .Values.bootstrap.currency | quote }}
            - name: WATERFALL_COMPANY_NAME
              value: {{ required "bootstrap.companyName: the name of the company" .Values.bootstrap.companyName | quote }}
            - name: WATERFALL_TIME_ZONE
              value: {{ .Values.bootstrap.timeZone | quote }}
            # The largest avatar, which the bootstrap writes for the installation (#4636).
            - name: WATERFALL_AVATAR_MAX_BYTES
              value: {{ include "waterfall.wholeNumber" (list "bootstrap.avatarMaxBytes" .Values.bootstrap.avatarMaxBytes) | quote }}
          volumeMounts:
            {{- include "waterfall.trustMount" . | nindent 12 }}
      volumes:
        {{- include "waterfall.transportVolumes" (list .) | nindent 8 }}
