# The test of a restoration (US-2930, WF-EXP-0060), as compose.restore-test.yaml makes it under
# Compose. Once a month (restoreTest.interval), once a scheduled backup verified is there to test,
# the schedule — the CronJob of scheduler.yaml, which runs one fixed command and reads no file of a
# user — makes the Job below, named after its task, in the namespace of the installation
# (waterfall.worker.restore_test), as the service account <release>-scheduler, which may create
# Jobs and nothing else. The worker, which reads the files the users give, holds no right of the
# cluster. A Role does not bound what a Job holds: the token that may create one is the
# scheduler's alone.
#
# The Job is one pod: the PostgreSQL, the Keycloak and the API of the test, sidecars that listen on
# its loopback alone, and the test, `waterfall-restore test`, which restores the latest scheduled
# backup verified into that PostgreSQL, then writes /restore-test/restored, on which Keycloak and
# the API start; it counts, compares, and gives its outcome to the production, which inscribes it.
# The pod declares no port, no Service selects it, it mounts no token of the cluster, and the
# NetworkPolicy below lets nothing in, and lets out only to the DNS of the cluster
# (restoreTest.egress.dns), the PostgreSQL and the storage of the production, each rule naming its
# peers: the pods of the chart's own component, or, for a component the operator provides, the
# peers restoreTest.egress gives for it, without which the chart does not render. Its password is
# drawn at each test, in memory; its databases are on a volume of the pod: once the test has ended,
# the sidecars stop, and Kubernetes deletes the Job, its pod and its volumes at once
# (ttlSecondsAfterFinished: 0) — the only place out of the production where a copy not anonymised
# exists (WF-EXP-0010) does not outlive the test. restoreTest.deadline bounds it.
#
# Every exchange is encrypted (US-2840), as under Compose: the test reaches the PostgreSQL and the
# storage of the production in TLS, against the roots of the pod; the platform of the test serves in
# TLS too, on its loopback, under an authority of its own, made in the pod at each test and gone with
# it (restore-test-authority), whose root the test and the sidecars trust. Each mounts the root
# alone (trust), or the certificate of its own server (certificates/<name>): the key of that
# authority (kept) stays in the container that makes it.
{{- if .Values.restoreTest.enabled }}
{{- $egress := .Values.restoreTest.egress }}
{{- $postgres := list (dict "podSelector" (dict "matchLabels" (include "waterfall.selector" (list . "postgres") | fromYaml))) }}
{{- if not .Values.postgresql.enabled }}
{{- if not $egress.postgresql }}
{{- fail "restoreTest.egress.postgresql: where the pod of the test reaches the PostgreSQL the operator provides (postgresql.enabled is false), as NetworkPolicy peers — an ipBlock of its address —, or restoreTest.enabled: false" }}
{{- end }}
{{- $postgres = $egress.postgresql }}
{{- end }}
{{- $storagePeers := list (dict "podSelector" (dict "matchLabels" (include "waterfall.selector" (list . "storage") | fromYaml))) }}
{{- $storagePort := 3900 }}
{{- if not .Values.storage.enabled }}
{{- if not $egress.storage }}
{{- fail "restoreTest.egress.storage: where the pod of the test reaches the object storage the operator provides (storage.enabled is false), as NetworkPolicy peers — an ipBlock of its address —, or restoreTest.enabled: false" }}
{{- end }}
{{- $storagePeers = $egress.storage }}
{{- $storage := urlParse (include "waterfall.storageAddress" .) }}
{{- $storagePort = 80 }}
{{- if contains ":" $storage.host }}
{{- $storagePort = splitList ":" $storage.host | last | int }}
{{- else if eq $storage.scheme "https" }}
{{- $storagePort = 443 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "waterfall.name" (list . "scheduler") }}
  labels:
    {{- include "waterfall.labels" (list . "scheduler") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "waterfall.name" (list . "restore-test") }}
  labels:
    {{- include "waterfall.labels" (list . "restore-test") | nindent 4 }}
rules:
  # Create alone: the Job is named after its task, a second creation is refused (409).
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "waterfall.name" (list . "restore-test") }}
  labels:
    {{- include "waterfall.labels" (list . "restore-test") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "waterfall.name" (list . "restore-test") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "waterfall.name" (list . "scheduler") }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "waterfall.name" (list . "restore-test") }}
  labels:
    {{- include "waterfall.labels" (list . "restore-test") | nindent 4 }}
data:
  job.json: {{ include "waterfall.restoreTestJob" . | fromYaml | toJson | quote }}
  restore-test-database.sql: |-
    {{- .Files.Get "files/restore-test-database.sql" | trimSuffix "\n" | nindent 4 }}
  pg_hba.conf: |-
    {{- .Files.Get "files/pg_hba.conf" | trimSuffix "\n" | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "waterfall.name" (list . "restore-test") }}
  labels:
    {{- include "waterfall.labels" (list . "restore-test") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "waterfall.selector" (list . "restore-test") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  # No rule: nothing enters.
  ingress: []
  # Each rule names where it leads: a rule without its `to` would lead anywhere on its ports.
  egress:
    # The names, from the DNS of the cluster.
    - to:
        {{- required "restoreTest.egress.dns: the DNS of the cluster, as NetworkPolicy peers" $egress.dns | toYaml | nindent 8 }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # The PostgreSQL of the production: the backup to restore, the outcome to inscribe.
    - to:
        {{- toYaml $postgres | nindent 8 }}
      ports:
        - { protocol: TCP, port: {{ include "waterfall.postgresPort" . | int }} }
    # The storage of the production: the archive of the backup.
    - to:
        {{- toYaml $storagePeers | nindent 8 }}
      ports:
        - { protocol: TCP, port: {{ $storagePort }} }
{{- end }}

{{- define "waterfall.restoreTestJob" -}}
{{- $test := .Values.restoreTest -}}
{{- /* The root of the authority of the test, which its platform and the test trust. */ -}}
{{- $root := "/restore-test-authority/trust/root.crt" -}}
{{- $verified := printf "sslmode=verify-full&sslrootcert=%s" $root -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "waterfall.name" (list . "restore-test") }}
  labels:
    {{- include "waterfall.selector" (list . "restore-test") | nindent 4 }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ $test.deadline | int }}
  ttlSecondsAfterFinished: 0
  template:
    metadata:
      labels:
        {{- include "waterfall.selector" (list . "restore-test") | nindent 8 }}
    spec:
      {{- include "waterfall.podDefaults" . | nindent 6 }}
      automountServiceAccountToken: false
      restartPolicy: Never
      initContainers:
        # The roots of the production, which the test trusts to reach its PostgreSQL and its storage.
        {{- include "waterfall.transportInit" (list .) | nindent 8 }}
        # The password of the test, drawn at each test, in memory, which dies with the pod.
        - name: password
          image: {{ include "waterfall.image" (list . "waterfall") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "waterfall.containerSecurity" (dict) | nindent 10 }}
          command:
            - sh
            - -c
            - umask 077 && od -An -N24 -tx1 /dev/urandom | tr -d ' \n' > /restore-test/password
          volumeMounts:
            - { name: shared, mountPath: /restore-test }
        # The authority of the test, made at each test, as compose.restore-test.yaml makes it: the
        # certificates of its PostgreSQL, its Keycloak and its API, for the loopback. The three
        # servers run as the user of the image waterfall, 1000, which makes them and reads the
        # password, and owns each key: nothing in the pod runs as root (#4664).
        - name: restore-test-authority
          image: {{ include "waterfall.image" (list . "waterfall") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "waterfall.containerSecurity" (dict) | nindent 10 }}
          command:
            - waterfall-authority
            - --provided=/restore-test-authority/none
            - --kept=/restore-test-authority/kept
            - --trust=/restore-test-authority/trust
            - --certificates=/restore-test-authority/certificates
            - restore-test-postgres:1000:1000
            - restore-test-keycloak:1000:1000
            - restore-test-api:1000:1000
          volumeMounts:
            - { name: test-authority, mountPath: /restore-test-authority }
        # PostgreSQL, empty: the owners of the two databases and the role of the service, made at
        # its initialisation (restore-test-database.sql), on the loopback alone, in TLS alone. As
        # the user of the password and of its key, which the entry point of the image names.
        - name: postgres
          image: {{ include "waterfall.thirdParty" (list . .Values.postgresql.image) }}
          imagePullPolicy: IfNotPresent
          {{- include "waterfall.containerSecurity" (dict "runAsUser" 1000 "runAsGroup" 1000) | nindent 10 }}
          restartPolicy: Always
          command:
            - sh
            - -c
            - |-
              RESTORE_TEST_PASSWORD="$(cat /restore-test/password)"
              export RESTORE_TEST_PASSWORD POSTGRES_PASSWORD="$RESTORE_TEST_PASSWORD"
              exec docker-entrypoint.sh postgres -c listen_addresses=127.0.0.1 -c max_locks_per_transaction=1024 -c ssl=on -c ssl_cert_file=/tls/tls.crt -c ssl_key_file=/tls/tls.key -c hba_file=/etc/waterfall/pg_hba.conf
          env:
            - { name: POSTGRES_USER, value: postgres }
          startupProbe:
            exec:
              command: [pg_isready, --host, 127.0.0.1, --username, postgres, --dbname, postgres]
            periodSeconds: 2
            failureThreshold: 150
          volumeMounts:
            - { name: shared, mountPath: /restore-test, readOnly: true }
            - { name: databases, mountPath: /var/lib/postgresql }
            - name: files
              mountPath: /docker-entrypoint-initdb.d/restore-test-database.sql
              subPath: restore-test-database.sql
              readOnly: true
            - name: files
              mountPath: /etc/waterfall/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true
            - name: test-authority
              mountPath: /tls
              subPath: certificates/restore-test-postgres
              readOnly: true
        # Keycloak, on its database restored, once the test has restored it: the realm of the
        # backup, issued at the address of the production, which nobody reaches here. In TLS alone.
        - name: keycloak
          image: {{ include "waterfall.image" (list . "keycloak") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "waterfall.containerSecurity" (dict) | nindent 10 }}
          restartPolicy: Always
          command:
            - bash
            - -c
            - |-
              until [ -f /restore-test/restored ]; do sleep 5; done
              KC_DB_PASSWORD="$(cat /restore-test/password)"
              export KC_DB_PASSWORD
              exec /opt/keycloak/bin/kc.sh start --optimized
          env:
            - name: KC_DB_URL
              value: {{ printf "jdbc:postgresql://127.0.0.1:5432/keycloak?%s" $verified | quote }}
            - { name: KC_DB_USERNAME, value: keycloak }
            - name: KC_HOSTNAME
              value: {{ printf "%s/auth" (include "waterfall.address" .) | quote }}
            - { name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true" }
            - { name: KC_HTTP_ENABLED, value: "false" }
            - { name: KC_HTTP_HOST, value: 127.0.0.1 }
            - { name: KC_HTTPS_CERTIFICATE_FILE, value: /tls/tls.crt }
            - { name: KC_HTTPS_CERTIFICATE_KEY_FILE, value: /tls/tls.key }
            - { name: KC_HTTP_MANAGEMENT_SCHEME, value: http }
            - { name: KC_HTTP_MANAGEMENT_HOST, value: 127.0.0.1 }
            - { name: KC_CACHE, value: local }
          volumeMounts:
            - { name: shared, mountPath: /restore-test, readOnly: true }
            - { name: test-authority, mountPath: /restore-test-authority/trust, subPath: trust, readOnly: true }
            - name: test-authority
              mountPath: /tls
              subPath: certificates/restore-test-keycloak
              readOnly: true
        # The API, on the database restored, as its owner, on the loopback (WATERFALL_HOST is not
        # given), in TLS. Neither Redis nor the storage: its readiness, which the test asks alone,
        # needs its database, and says whether Keycloak answers.
        - name: api
          image: {{ include "waterfall.image" (list . "waterfall") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "waterfall.containerSecurity" (dict) | nindent 10 }}
          restartPolicy: Always
          command:
            - sh
            - -c
            - |-
              until [ -f /restore-test/restored ]; do sleep 5; done
              password="$(cat /restore-test/password)"
              export WATERFALL_DATABASE_URL="postgresql://waterfall:${password}@127.0.0.1:5432/waterfall?{{ $verified }}"
              export WATERFALL_REDIS_URL="rediss://:${password}@127.0.0.1:6379/0?ssl_ca_certs={{ $root }}"
              export WATERFALL_SERVICE_CLIENT_SECRET="$password" WATERFALL_STORAGE_SECRET="$password"
              exec waterfall-api
          env:
            - name: WATERFALL_KEYCLOAK_ADDRESS
              value: {{ printf "%s/auth" (include "waterfall.address" .) | quote }}
            - { name: WATERFALL_KEYCLOAK_BACKCHANNEL, value: "https://127.0.0.1:8443/auth" }
            - { name: WATERFALL_STORAGE_ADDRESS, value: "https://127.0.0.1:3900" }
            - { name: WATERFALL_STORAGE_ACCESS_KEY, value: restore-test }
            - { name: WATERFALL_TLS_AUTHORITY, value: {{ $root }} }
            - { name: WATERFALL_PORT, value: "8000" }
            - { name: WATERFALL_TLS_CERTIFICATE, value: /tls/tls.crt }
            - { name: WATERFALL_TLS_KEY, value: /tls/tls.key }
          volumeMounts:
            - { name: shared, mountPath: /restore-test, readOnly: true }
            - { name: test-authority, mountPath: /restore-test-authority/trust, subPath: trust, readOnly: true }
            - name: test-authority
              mountPath: /tls
              subPath: certificates/restore-test-api
              readOnly: true
      containers:
        # The test: 0 if it succeeded, 1 if it failed; the pod ends with it, its sidecars stopped.
        - name: restore-test
          image: {{ include "waterfall.image" (list . "waterfall") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "waterfall.containerSecurity" (dict) | nindent 10 }}
          command:
            - sh
            - -c
            - |-
              password="$(cat /restore-test/password)"
              export WATERFALL_RESTORE_TEST_DATABASE_URL="postgresql://waterfall:${password}@127.0.0.1:5432/waterfall?{{ $verified }}"
              export WATERFALL_RESTORE_TEST_KEYCLOAK_DATABASE_URL="postgresql://keycloak:${password}@127.0.0.1:5432/keycloak?{{ $verified }}"
              exec waterfall-restore test
          env:
            {{- include "waterfall.secretEnv" (list . "WATERFALL_SERVICE_DATABASE_PASSWORD") | nindent 12 }}
            - name: WATERFALL_DATABASE_URL
              value: {{ include "waterfall.databaseUrl" (list . "waterfall_service" "$(WATERFALL_SERVICE_DATABASE_PASSWORD)" "waterfall") | quote }}
            - name: WATERFALL_TLS_AUTHORITY
              value: {{ include "waterfall.roots" . }}
            {{- include "waterfall.storageEnvironment" . | nindent 12 }}
            - { name: WATERFALL_RESTORE_TEST_API_ADDRESS, value: "https://127.0.0.1:8000" }
            - { name: WATERFALL_RESTORE_TEST_AUTHORITY, value: {{ $root }} }
            - { name: WATERFALL_RESTORE_TEST_RESTORED_FILE, value: /restore-test/restored }
            - name: WATERFALL_RESTORE_TEST_PATIENCE
              value: {{ $test.patience | int | toString | quote }}
          volumeMounts:
            - { name: shared, mountPath: /restore-test }
            - { name: test-authority, mountPath: /restore-test-authority/trust, subPath: trust, readOnly: true }
            {{- include "waterfall.trustMount" . | nindent 12 }}
          resources:
            {{- toYaml $test.resources | nindent 12 }}
      volumes:
        - name: shared
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: databases
          emptyDir: {}
        # The authority of the test, its key and the certificates it issues, in memory.
        - name: test-authority
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: files
          configMap:
            name: {{ include "waterfall.name" (list . "restore-test") }}
            items:
              - { key: restore-test-database.sql, path: restore-test-database.sql }
              - { key: pg_hba.conf, path: pg_hba.conf }
        {{- include "waterfall.transportVolumes" (list .) | nindent 8 }}
{{- end -}}
