# Redis (compose.prod.yaml, redis): nothing durable is kept in it, the queue and the sessions are
# lost with it, not the data; no volume, nothing saved. In TLS alone (TFX-04, TFX-10): no port in the
# clear (--port 0), the certificate its container of initialisation issues; no certificate asked of
# its clients, who sign in with the password (US-2840).
{{- if .Values.redis.enabled }}
{{- $name := include "waterfall.name" (list . "redis") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "waterfall.labels" (list . "redis") | nindent 4 }}
spec:
  selector:
    {{- include "waterfall.selector" (list . "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "waterfall.labels" (list . "redis") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "waterfall.selector" (list . "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "waterfall.selector" (list . "redis") | nindent 8 }}
    spec:
      # The user redis of the image.
      {{- include "waterfall.podDefaults" (list . (dict "runAsUser" 999)) | nindent 6 }}
      initContainers:
        {{- include "waterfall.transportInit" (list . "redis" 999 1000) | nindent 8 }}
      containers:
        - name: redis
          image: {{ include "waterfall.thirdParty" (list . .Values.redis.image) }}
          imagePullPolicy: IfNotPresent
          {{- include "waterfall.containerSecurity" (dict) | nindent 10 }}
          command:
            - sh
            - -c
            - exec redis-server --requirepass "$REDISCLI_AUTH" --save '' --port 0 --tls-port 6379 --tls-cert-file /tls/tls.crt --tls-key-file /tls/tls.key --tls-ca-cert-file /tls/ca.crt --tls-auth-clients no
          env:
            {{- include "waterfall.secretEnv" (list . "WATERFALL_REDIS_PASSWORD" "REDISCLI_AUTH") | nindent 12 }}
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [sh, -c, redis-cli --tls --cacert /tls/ca.crt -h localhost ping | grep -q PONG]
            periodSeconds: 2
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [sh, -c, redis-cli --tls --cacert /tls/ca.crt -h localhost ping | grep -q PONG]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            {{- include "waterfall.tlsMount" (list . "redis") | nindent 12 }}
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
      volumes:
        {{- include "waterfall.transportVolumes" (list . "serves") | nindent 8 }}
{{- end }}
