# Keycloak behind the ingress, under /auth (compose.prod.yaml, keycloak): the issuer of every token
# is the address of the browser; the services reach it at its service, on the back channel, and its
# management port, 9000, answers its health. No mail server: the links that set a password are
# handed over by createPasswordSetupLink (WF-CMP-0030). Its realm is applied by a hook (hooks.yaml).
# In TLS alone, with the certificate its container of initialisation issues (TFX-08, US-2840): no
# listener in HTTP, its management in HTTPS too; it reaches its database in TLS (TFX-12), and the
# front on its back channel in HTTPS (TFX-17), trusting the roots of the pod. One instance, its caches
# its own (KC_CACHE=local): it opens no port of a cluster, where JGroups would speak in the clear.
{{- $name := include "waterfall.name" (list . "keycloak") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "waterfall.labels" (list . "keycloak") | nindent 4 }}
spec:
  selector:
    {{- include "waterfall.selector" (list . "keycloak") | nindent 4 }}
  ports:
    - name: https
      port: 8443
      targetPort: https
    - name: management
      port: 9000
      targetPort: management
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "waterfall.labels" (list . "keycloak") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "waterfall.selector" (list . "keycloak") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "waterfall.selector" (list . "keycloak") | nindent 8 }}
    spec:
      {{- include "waterfall.podDefaults" . | nindent 6 }}
      initContainers:
        {{- include "waterfall.transportInit" (list . "keycloak" 1000 0) | nindent 8 }}
        {{- include "waterfall.waitForDatabase" (list . "keycloak" "keycloak" "WATERFALL_KEYCLOAK_DATABASE_PASSWORD") | nindent 8 }}
      containers:
        - name: keycloak
          image: {{ include "waterfall.image" (list . "keycloak") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "waterfall.containerSecurity" (dict) | nindent 10 }}
          env:
            {{- include "waterfall.keycloakDatabase" . | nindent 12 }}
            # The administrator of the realm master, read at the first start alone.
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            {{- include "waterfall.secretEnv" (list . "WATERFALL_KEYCLOAK_ADMIN_PASSWORD" "KC_BOOTSTRAP_ADMIN_PASSWORD") | nindent 12 }}
            - name: KC_HOSTNAME
              value: {{ printf "%s/auth" (include "waterfall.address" .) | quote }}
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "false"
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: /tls/tls.crt
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: /tls/tls.key
            - name: KC_TRUSTSTORE_PATHS
              value: {{ include "waterfall.roots" . }}
            - name: KC_CACHE
              value: local
            - name: KC_PROXY_HEADERS
              value: xforwarded
          ports:
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 9000
          # Readiness answers 503 while the schema migrates (#1079): the status is what counts.
          readinessProbe:
            httpGet:
              path: /auth/health/ready
              port: management
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /auth/health/started
              port: management
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /auth/health/live
              port: management
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            {{- include "waterfall.trustMount" . | nindent 12 }}
            {{- include "waterfall.tlsMount" (list . "keycloak") | nindent 12 }}
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
      volumes:
        {{- include "waterfall.transportVolumes" (list . "serves") | nindent 8 }}
