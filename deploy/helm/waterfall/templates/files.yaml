# The files the Compose of production mounts, the same ones (files/ links to deploy/compose): the
# steps of the database, the making of the buckets, the control of the volume of PostgreSQL, and the
# configuration of Garage. None holds a secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "waterfall.name" (list . "files") }}
  labels:
    {{- include "waterfall.labels" (list . "files") | nindent 4 }}
data:
  {{- range $name := list "waterfall-database.sql" "keycloak-database.sql" "backup-database-role.sql" "service-database-role.sql" "storage-buckets.sh" "postgres-volume.sh" "garage.toml" }}
  {{ $name }}: |-
    {{- $.Files.Get (printf "files/%s" $name) | trimSuffix "\n" | nindent 4 }}
  {{- end }}
