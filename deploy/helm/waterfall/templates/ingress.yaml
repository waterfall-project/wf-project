# The only door (Caddyfile.prod, here as ingresses): Keycloak under /auth, Grafana, the dashboard of
# the operator, under /grafana (US-2880), the front everywhere else and at its own routes under
# /auth — the return from the realm and the end of its session. The console of Keycloak and its
# realm master, whose administrator holds every realm, are sent to the front, which has no page
# there: Keycloak never serves them through the ingress. The back channel of the front, which
# Keycloak reaches inside the cluster, falls under /auth and is not served here either. The longest
# path wins, whatever the order and the Ingress that holds it (networking.k8s.io/v1).
#
# Each of the three is reached in HTTPS alone, no port in the clear behind the ingress (US-2840,
# WF-SEC-0010; the author's decision of 2026-11-22, #4087): an Ingress of its own for each, the
# annotations of ingress.annotations and of its own, ingress.backends.<name>.annotations, which tell
# the controller to reach it in HTTPS and check its certificate, as the controller asks. Their
# Services name their port https. No resource proper to a controller (WF-CMP-0020).
{{- $domain := required "platform.domain: where the browser reaches the platform" .Values.platform.domain }}
{{- $routes := list
  (list "front" (list (list "/auth/callback" "Exact") (list "/auth/sign-out" "Exact") (list "/auth/admin" "Prefix") (list "/auth/realms/master" "Prefix") (list "/" "Prefix")))
  (list "keycloak" (list (list "/auth" "Prefix")))
  (list "grafana" (list (list "/grafana" "Prefix"))) }}
{{- range $index, $route := $routes }}
{{- $backend := index $route 0 }}
{{- $annotations := merge (dict) (index $.Values.ingress.backends $backend).annotations $.Values.ingress.annotations }}
{{- if $index }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "waterfall.name" (list $ (printf "ingress-%s" $backend)) }}
  labels:
    {{- include "waterfall.labels" (list $ "ingress") | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $.Values.ingress.tlsSecret }}
  tls:
    - hosts: [{{ $domain | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $domain | quote }}
      http:
        paths:
          {{- range $path := index $route 1 }}
          - path: {{ index $path 0 }}
            pathType: {{ index $path 1 }}
            backend:
              service:
                name: {{ include "waterfall.name" (list $ $backend) }}
                port:
                  name: https
          {{- end }}
{{- end }}
