# Waterfall on a Kubernetes cluster (US-2800, WF-ARC-0050): what deploy/compose/compose.prod.yaml
# deploys on one machine, from the same images, every template written here — no dependency on a
# chart of a third party nor on an operator (EP-13, « Décisions »). Every setting is in values.yaml,
# with what it does.
apiVersion: v2
name: waterfall
description: Waterfall, the management of projects by their estimate, on Kubernetes
type: application
version: 0.1.0
# The oldest version of Kubernetes the Kubernetes project still maintains (the author's decision of
# 2026-11-26, #4085; #5069 for the specification, WF-CMP-0020-A). It knows the native sidecar
# containers of the test of a restoration and the action `sleep` of the drain (waterfall.drain).
# Helm refuses to install the chart on an older cluster, and says so.
kubeVersion: ">=1.35.0-0"
appVersion: "0.1.0"
