# Which dependencies may run a script at installation. None needs one: unrs-resolver, used
# by ESLint to resolve imports, ships prebuilt binaries; @parcel/watcher and @swc/core come
# with next-intl for its message extractor, which the front does not use — the catalogues
# are written by hand — and ship prebuilt binaries too.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  unrs-resolver: false

# The versions below which a dependency is flawed, whichever dependency asks for it: raised here
# because a transitive range (css-tree, optional) keeps the lock file on the flawed one otherwise.
overrides:
  source-map-js: ">=1.2.2"
