# Which dependencies may run a script at installation. None needs one: unrs-resolver, used
# by ESLint to resolve imports, ships prebuilt binaries; @parcel/watcher and @swc/core come
# with next-intl for its message extractor, which the front does not use — the catalogues
# are written by hand — and ship prebuilt binaries too.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  unrs-resolver: false

# The versions below which a dependency is flawed, whichever dependency asks for it.
minimumReleaseAgeExclude:
  - "@pnpm/exe.android-arm64@12.18.0"
  - "@pnpm/exe.android-x64@12.18.0"
  - "@pnpm/exe.darwin-arm64@12.18.0"
  - "@pnpm/exe.darwin-x64@12.18.0"
  - "@pnpm/exe.freebsd-x64@12.18.0"
  - "@pnpm/exe.linux-arm64-musl@12.18.0"
  - "@pnpm/exe.linux-arm64@12.18.0"
  - "@pnpm/exe.linux-ppc64@12.18.0"
  - "@pnpm/exe.linux-riscv64@12.18.0"
  - "@pnpm/exe.linux-s390x@12.18.0"
  - "@pnpm/exe.linux-x64-musl@12.18.0"
  - "@pnpm/exe.linux-x64@12.18.0"
  - "@pnpm/exe.win32-arm64@12.18.0"
  - "@pnpm/exe.win32-x64@12.18.0"
  - pnpm@12.18.0

overrides:
  # css-tree (optional) keeps the lock file on the flawed version otherwise.
  source-map-js: ">=1.2.2"
  # GHSA-587h-7wmj-h5pm, GHSA-698v-4r3x-3vcv and GHSA-r825-w8mm-5pxw, fixed in 8.3.3; pulled by
  # vitest. Caret: stays in the major version vitest supports.
  vite: "^8.3.3"
  # GHSA-xjj6-f33q-929c, GHSA-9fm3-97px-rjf6, GHSA-qrxm-fqhp-jwvm, GHSA-2m5v-pch6-74hx and
  # GHSA-4w7w-5xrc-9h26, fixed in 8.12.2; pulled by jsdom, under vitest. Caret: stays in the
  # major version jsdom asks for.
  undici: "^8.12.2"
