# Which dependencies may run a script at installation. None needs one: unrs-resolver, used
# by ESLint to resolve imports, ships prebuilt binaries; @parcel/watcher and @swc/core come
# with next-intl for its message extractor, which the front does not use — the catalogues
# are written by hand — and ship prebuilt binaries too.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  unrs-resolver: false

# The versions below which a dependency is flawed, whichever dependency asks for it.
overrides:
  # css-tree (optional) keeps the lock file on the flawed version otherwise.
  source-map-js: ">=1.2.2"
  # GHSA-587h-7wmj-h5pm, GHSA-698v-4r3x-3vcv and GHSA-r825-w8mm-5pxw, fixed in 8.3.3; pulled by
  # vitest. Caret: stays in the major version vitest supports.
  vite: "^8.3.3"
